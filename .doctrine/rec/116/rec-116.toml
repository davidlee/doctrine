id    = 116
slug  = "accept-req-478"
title = "accept REQ-478"
# no status — a REC is the immutable record of ONE reconciliation act (SPEC-002
# D-Q3): it has no lifecycle, so no status is stored. The act is the commit.

[rec]
move = "accept"              # accept | revise | redesign
owning_slice = "SL-256"

# status_deltas — the requirement-status facts THIS act already applied. May be
# EMPTY for a `redesign`, which records the reconcile→design escalation, not an
# instance-truth write (SPEC-002 F7/D7). The reconcile writer (Slice B) appends
# them as `[[status_delta]]` tables; a fresh `rec new` writes none:
#   [[status_delta]]
#   requirement = "REQ-NNN"
#   from = "pending"
#   to   = "active"
#
# evidence_refs — the coverage entries this act rests on, cited by the stable
# 4-tuple key (slice, requirement, contributing_change, mode), never a file#line:
#   [[evidence_ref]]
#   slice = "SL-NNN"
#   requirement = "REQ-NNN"
#   contributing_change = "SL-NNN"
#   mode = "VT"

# SL-256 moved REQ-478 pending → active via REV-055 (applied as REC-115). This
# act re-affirms it at its now-authored status so the closure discharge predicate
# (slice.rs rec_discharges) is satisfied: (b) `to` equals the authored status.
[[status_delta]]
requirement = "REQ-478"
from = "active"
to = "active"

# Evidence ⊇ ALL coverage keys feeding REQ-478's composite (clause c). There is
# exactly one — SL-256 introduced the requirement and is its only contributing
# change; `grep -rl REQ-478 .doctrine/slice/*/coverage.toml` resolves to a single
# real path after dereferencing the slug symlinks.
[[evidence_ref]]
slice = "SL-256"
requirement = "REQ-478"
contributing_change = "SL-256"
mode = "VT"
