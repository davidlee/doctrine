[facet]                         # every field typed; seeded empty (captured later)
context = "query() in src/retrieve.rs is shared by memory search, MCP memory_search, memory retrieve and the surface hook (retrieve_rows, free_query=None)."
choice = "The DEC-348 floor is applied once in query(), so search, MCP search and retrieve all exclude no-evidence rows under a free-text query. The surface hook is unaffected because it never carries free text. SL-275 scope widens to include the floor on memory retrieve; retrieve's default/cap stay unchanged."
alternatives = ["Floor in run_search only, retrieve case to backlog"]
rationale = "One pipeline, no parallel implementation; also fixes retrieve --query <nonsense> injecting severity-top bodies into agent context."
consequences = ["memory retrieve behaviour changes under a zero-evidence free-text query (zero blocks)", "Scope card non-goal on retrieve narrows to its default/cap only"]
