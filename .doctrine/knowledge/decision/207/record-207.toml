updated = "2026-08-12"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = """
DEC-203 retires the disk marker as a mechanical consequence: is_linked_worktree is git_dir != common_git_dir (shared.rs:54-58) and a clone's git dir IS its common dir, so describe_mode's marker leg (marker_leg = is_linked && marker_present, marker.rs:89) can never fire for a dispatch worker. The residual is the truth table. With the marker leg inert, a clone worker's only signal is the env leg — (false, true) => Cause::Env, refused: true (marker.rs:90-98) — which refuses correctly but explains itself with DUAL_CAUSE (marker.rs:168-171): 'DOCTRINE_WORKER set outside a worker worktree: a worker was dropped on the coordination root -> re-dispatch isolated; or the env leaked into this process -> unset it'. In clone-world that is the normal state of every legitimate worker, so every worker would receive a message telling its operator to re-dispatch or unset the env.

AMENDED 2026-08-13 — TOPOLOGY-INDEPENDENT. As first recorded this decision was derived from DEC-203's clone topology, where the marker leg is inert by construction. The census in the amended rationale establishes the same conclusion INDEPENDENTLY of topology, so DEC-207 stands unchanged if the proposed re-scope supersedes DEC-203 and dispatch workers stay on linked worktrees. This dissolves the contest recorded in SL-254 notes.md under Open, which held that the collapse was safe only under a clone."""
choice = "Collapse identity to the env leg alone. Delete the marker file, its writer (fork --worker's write_marker call), its readers, and the is_linked conjunct that only existed to make a marker in the primary tree inert. describe_mode becomes a function of one input, and its message loses the dual cause because there is no longer a second cause: DOCTRINE_WORKER set means this process IS a worker, and if that is wrong the remedy is to unset it. That is today's DUAL_CAUSE text with its first horn removed."
alternatives = ["Keep a marker file inside the clone and re-cut the gate to marker_present alone. Rejected: it reintroduces the mechanism ADR-011 D3 graded as primary purely because claude had no env seam, on the very change that gives claude the env seam. It also re-opens the question is_linked was answering — a marker in the coordination root would now count.", "Keep the two-leg table and reword DUAL_CAUSE. Rejected: the marker leg has no writer left once fork --worker's flag goes, so the second leg would be permanently false. Rewording a message emitted by an unreachable branch is worse than deleting the branch.", "Keep the marker for solo /worktree. Rejected: solo forks never wrote it — write_marker is on the --worker path only."]
rationale = """
ADR-011 D1 justified disk-marker identity as 'identity rides disk — the one medium every harness has — not a process env seam, which not every harness has', and D3 graded the arrangement as disk-marker primary with DOCTRINE_WORKER env an optimisation for codex/pi. Once every arm is a subprocess every arm has the env seam, so the optimisation becomes the mechanism and the primary becomes dead weight.

AMENDED 2026-08-13, after a full reader/writer census of the marker surface run to test the contest recorded in SL-254 notes.md. Three findings, none of which were in the original rationale.

(1) The contest does not hold. It ran: ADR-006 D2b identifies the coordination tree by marker ABSENCE, so deleting the marker makes every tree read as coord under linked worktrees. No reader anywhere in the codebase concludes 'this is the coordination tree' from absence — absence is only the non-firing of a positive worker test. D2a's phrase 'permission rests on marker-absence' states the contrapositive of the refuse predicate, not a coord test. mem_019fa94118a37c33ab54b06dfe4b1131 (high trust, measured at RV-319 F-2, the finding that killed SL-236) settles it: worker_guard resolves its root by walking up from CWD and asks 'is the process running me confined?', never 'is the tree being written to protected?'. The structure is preserved exactly under the collapse — today refused = worker_signal(marker | env) and after refused = worker_signal(env), with the orchestrator passing in both because no signal fires. The orchestrator was never identified, merely not-refused, so removing one of two positive legs cannot convert a not-refused into a coord claim.

(2) Positive coordination identity already shipped, marker-free. classify_worktree_role (shared.rs:77) makes coord require linked AND an all-numeric dispatch/<NNN> branch, with live callers at dispatch whereami (dispatch.rs:862 and 1308) and review's root guard (review.rs:2362, ISS-275). ADR-006 D2b still names IMP-065 as 'the real positive-marker close (coordination-tree identity by a present orchestrator signal, not by absence)', but IMP-065 was closed OBSOLETE on 2026-07-02 via REV-018 on two findings: a positive marker is a cooperative flag and not a boundary, since a capable worker forges it or cd's around it; and the genuine close is enforcement, shipped as confinement (SL-182 Linux/bwrap ro shared .git, SL-183 macOS Seatbelt, SL-185 subprocess parity). The first finding applies verbatim to the NEGATIVE marker, and ADR-006's own SL-181 note already concedes the general form — 'The cooperative marker was never the fence; the OS floor now is.'

(3) The deciding asymmetry is process-versus-tree, not harness coverage. DOCTRINE_WORKER=1 is set by the same bwrap argv that establishes the write floor (pi-spawn-confined.sh:127 --setenv DOCTRINE_WORKER 1 beside the --ro-bind / / floor at 113-131; also pi-respawn-nofork.sh:44 and pi-spawn.sh:53) — one actor, one moment, atomic with confinement itself. The marker is written by a different command at a different time into persistent state (fork.rs:192). Worker-ness is a property of a PROCESS; the marker models it as a property of a TREE, and that mismatch is the sole origin of the entire stale-marker error surface — Cause::Marker, is_stale_marker, status --assert's stale exit, the whole marker --clear --operator verb and its accident-fence, and open issue ISS-028. Env has no stale class by construction because it dies with the process.

Deleting rather than rewording is what keeps the slice a simplification: a two-leg table whose second leg is unreachable is the same workaround-shaped residue the slice exists to remove. The lost capability is real but small — the env-leak case can no longer be distinguished from a legitimate worker by mechanism — and the honest message covers it, because unsetting the variable is the correct remedy in both readings."""
consequences = ["marker.rs shrinks to the env predicate and its status rendering. The marker_on_main test ('marker without a linked worktree is inert => allowed' — mod.rs:289-294) loses its subject and retires with it.", "write_marker's callers — fork.rs:191 · import.rs · land.rs · gc.rs · subagent.rs — all lose the call. Several of those modules are dying anyway; fork.rs and gc.rs survive for solo /worktree and must lose only the marker legs. Census correction 2026-08-13: gc.rs and import.rs import the marker symbols but use NONE of them — masked by a module-wide expect(unused) at gc.rs:1 left from SL-116 PHASE-02 — so the live call sites are fork.rs:192 and land.rs:173 only.", "ADR-011 D1's justification for disk-primary identity becomes false under the collapse and joins the D3 correction in the REV rather than being left as a stale rationale beneath a corrected decision.", "land.rs:173's bears_marker is the ONLY marker read that asks about ANOTHER tree rather than about self; it gates LandRefusal::DispatchFork at land.rs:127. Env cannot answer it because env describes this process. Substitute the branch-shape role classifier (shared.rs:77) returning 'fork' — strictly stronger because it fires whether or not the fork was stamped — catching the unstamped-worker case ADR-011 D6/M2 confesses.", "inventory.rs:199-200 loses the marker column and inventory.rs:73 loses the Cause override. Role then falls through to branch shape and CANNOT degrade to Coordination — that still requires an all-numeric dispatch/<NNN> suffix at inventory.rs:80 — which is the direct refutation of the contest. Fold inventory.rs::classify_worktree into shared.rs::classify_worktree_role while there: they are a parallel implementation carrying two dispatch/ prefix tests and two numeric-suffix tests (STD-001).", "The stale-marker class dissolves rather than porting: Cause's four variants collapse to the bool already on StatusLine; is_stale_marker goes; worktree status --assert loses its stale exit; and run_marker_clear (marker.rs:203-257) retires entire with its --operator accident-fence and cwd checks. ISS-028 — worker-marker confinement refuses CLI writes in a stamped fork and breaks tests that shell the doctrine CLI — closes by dissolution.", "mcp_server/tools.rs:1389 and commands/observation.rs:509 drop the marker disjunct from repository_context. An inconsistency dissolves with it: neither site carries the is_linked conjunct — so today a marker on the primary tree is honoured there while resolve_mode calls it inert."]
decided_by = "agent"
decided_on = "2026-08-13"

