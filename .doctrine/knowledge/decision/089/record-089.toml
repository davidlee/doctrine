title = "Neutralisation is scoped to the dirt observation, not the runner"
record_kind = "decision"
status = "accepted"
created = "2026-07-27"
updated = "2026-07-27"
tags = ["memory", "verify", "git", "attestation", "byte-equality", "normative-flags"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "RV-314 round 4 refuted DEC-087 on three independent limbs, all reproduced by the responder on git 2.54.0. F-21: `--attr-source` replaces only the TREE attribute source, so `.git/info/attributes` and `core.attributesFile` still convert — and `core.attributesFile` is MACHINE-LOCAL CONFIG, precisely the category NORMATIVE_FLAGS exists to close, so DEC-087 left open the category the mechanism it extends was built for. F-23: NORMATIVE_FLAGS is applied by `src/git.rs::run_git_env` and `::git_stdin` to EVERY invocation, including `::check_attr_merge_z`, which backs SL-212's fail-CLOSED `::custom_merge_driver_paths` guard; with the flag a committed `f merge=ours` reads back `unspecified`, which is in that guard's `BUILT_IN` allow-list, silently converting fail-closed to fail-OPEN in a subsystem SL-232 does not touch. F-24: `::NORMATIVE_FLAGS` is a compile-time `const &[&str]` and a per-repository derived oid cannot be a member of one; deriving it needs a git invocation that EX-1 says must pass through the chokepoint that needs the value. DEC-087 was the fifth instance of this slice's standing lesson: 'committed attributes are neutralised' is true and is not the load-bearing property; 'attributes are neutralised' is."
choice       = "Keep the mechanism, move it one layer down and finish it. (1) PLACEMENT — the neutralising flags do NOT join NORMATIVE_FLAGS. They are extra argv contributed by `observe_dirt`'s argv builder alone, the single dirt observation § 5.1 already establishes. `capture_with` consumes `observe_dirt` and `capture()` delegates to `capture_with`, so capture and verify still observe the SAME tree — the split-brain objection DEC-087 recorded against scoping was aimed at a COMMAND-CLASS scope and does not reach a scope whose unit IS the one measurement. `check_attr_merge_z` does not route through `observe_dirt`, so SL-212's guard is preserved unchanged. EX-1 survives verbatim: `run_git_env` remains the sole chokepoint applying NORMATIVE_FLAGS, and these flags arrive as ordinary `args` from one caller — no second runner, and F-24's compile-time-const objection dissolves because a runtime oid is now an argument rather than a const member. (2) COVERAGE — the neutralisation set is `--attr-source=<empty tree>` (tree), `-c core.attributesFile=/dev/null` (machine-local config), `GIT_ATTR_NOSYSTEM=1` via run_git_env's existing env seam (system), and the freshness half `-c core.fsmonitor=false` (RV-314 F-22). (3) RESIDUAL — `$GIT_COMMON_DIR/info/attributes` is reachable by NO flag, config or environment variable. It is therefore DETECTED AND REFUSED rather than neutralised: one read of one file at a path git itself reports, refusing legibly when any line declares a conversion attribute (`filter`, `text`, `eol`, `working-tree-encoding`, `ident`, or legacy `crlf`). Patterns are deliberately NOT matched against the claim surface — that is D18's rejected enumeration; the rule is coarse and over-refuses in I9-prime's recoverable direction. (4) The `CHECKOUT_NORMALIZER` tag moves to `forget.checkout.v2` (RV-314 F-28). (5) SELF-CORRECTION, found by attacking this decision before disposal: the unit is not `observe_dirt` but EVERY READ WHOSE CONTRACT IS BYTES, and `capture()` makes a third such read OUTSIDE the three legs — `untracked_fingerprint` hashes each untracked path with `git hash-object`, which applies the clean filter and eol conversion. Measured: under a `clean` filter two untracked files with completely different content hash to the SAME oid 3c79cdb822b066786a19331faffc066a4543efb3, so `checkout_state_id` cannot distinguish two distinct dirty states — and `checkout_state_id` is the persisted `verified_sha` for 24 of this corpus's 59 attestations. The fix is `hash-object --no-filters`, measured sufficient for the eol route as well as the filter route, and NARROWER than the flags: it needs no derived oid and therefore carries no CON-002 floor."
alternatives = ["Keep the flag in NORMATIVE_FLAGS and add an exemption for check_attr_merge_z -- rejected: it makes the chokepoint conditional, which is the property EX-1 exists to deny, and it still leaves F-24's compile-time-const problem and F-21's coverage hole untouched", "Scope the flag to a COMMAND CLASS (the memory verbs) -- this is what DEC-087's notes rejected as split-brain, and correctly: capture() at record time would then read a different tree from verify. The decision here is NOT this; scoping to the observation primitive is the thing that makes capture and verify agree by construction rather than by convention", "Swap the index leg from `diff-index --quiet --cached HEAD` to the worktree-inclusive form -- reconsidered on the record per the round-4 handover rather than left as a silent rejection. It still does not reach `.git/info/attributes` (git is converting content on whichever leg reads the worktree), it does not touch the freshness class at all, and it changes the leg whose byte-identity I1/T59 pin. Rejected again, and now for a measured reason rather than for generality", "Neutralise nothing and narrow I6 to 'git-visible equality' -- lawful and honest, rejected because the guarantee is keepable and I6 is the reason the slice exists", "Refuse whenever ANY info/attributes file exists, without reading it -- simpler, but over-refuses on the common harmless case (`*.png binary`, `-diff`) for no gain; reading the file is one open() and a line scan"]
rationale    = "The correct altitude for a neutralisation is the observation it protects, not every process the tool spawns. Putting it on the runner made it simultaneously TOO WIDE (it reached a safety guard in another slice and inverted it) and TOO NARROW (it closed one of four attribute sources). Both defects have the same cause and one fix. The residual is handled by refusal rather than by silence because the alternative is an attestation that cannot deliver I6 — the same principle as § 5.4's 'a worthless stamp is worse than an extra git commit'. Stating the neutralisation set as a PARTITION by where the mechanism lives (committed content / machine-local config / git-dir state / index state) rather than as a list of routes is what makes it answerable for a mechanism nobody has found yet, which is the failure mode DEC-082 was refuted for."
consequences = ["SL-212's `custom_merge_driver_paths` guard is preserved by construction and the behaviour-preservation gate covers it -- its existing suites must stay green unchanged, which is now a stated obligation rather than an assumption nobody was making", "Measured coverage on git 2.54.0: the tree route goes tracked 0 -> 155 under `--attr-source` alone; the `core.attributesFile` route goes 0 -> 155 under `-c core.attributesFile=/dev/null` alone and is NOT touched by `--attr-source`; the info/attributes route stays 0 under every combination of flag, config and GIT_ATTR_NOSYSTEM tested",  "`core.fsmonitor=false` lifts F-22's blinding completely, INCLUDING on an index already primed by an fsmonitor-enabled `git status` and after re-priming: tracked 0 -> 138 with the config off. The FSMONITOR_VALID bits do not survive the config being disabled at read time, which is the fact the repair depends on", "The empty-tree oid derivation is read-only -- measured: `git hash-object -t tree /dev/null` writes no object (loose object count unchanged), so I2 is preserved", "A mis-derived but well-formed oid FAILS OPEN silently (`--attr-source=<nonexistent well-formed oid>` exits 0), so the derivation must run inside the target repository. Outside any repository the command returns the sha1 oid unconditionally regardless of the target repo's hash algorithm", "CHECKOUT_NORMALIZER moves to forget.checkout.v2, so a persisted checkout_state_id carrying v1 is legible as pre-neutralisation rather than ambiguous between two computations. IMP-325 already owns discriminating verified_sha's value kinds; a stale-normalizer value is a third distinguishable state and is routed there", "Live population in this repository is 0 on every limb: no `.gitattributes`, no `$GIT_COMMON_DIR/info/attributes`, `core.attributesFile` unset, `core.fsmonitor` unset, and all 8,521 index entries read `H` under `ls-files -v`. Every new refusal is therefore unexercised here and needs constructed fixtures, not corpus evidence", "UNVERIFIED LEG, declared rather than smoothed: `GIT_ATTR_NOSYSTEM=1` is the only member of the neutralisation set NOT measured. `git var GIT_ATTR_SYSTEM` reports `/etc/gitattributes` and that file does not exist in this jail, so the fixture cannot be constructed without writing to a shared `/etc` — declined as an out-of-scope side effect on an environment other agents share. The claim rests on git's documented behaviour alone. It is the lowest-stakes member (the system file is absent here and rare in the wild) and it is called out so a later round attacks it rather than inheriting it as measured"]
decided_by   = "responder"
decided_on   = "2026-07-27"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["SELF-ATTACK: `untracked_fingerprint`'s `hash-object` is filter-sensitive. Under a `clean` filter, a.dat ('UNTRACKED-CONTENT-ONE') and b.dat ('COMPLETELY-DIFFERENT-CONTENT-TWO') both hash to 3c79cdb822b066786a19331faffc066a4543efb3; with `--no-filters` they separate to 81920715... and d004ceee.... Under `text eol=crlf` plain `hash-object` returns the LF-normalised oid 0eabd516... while the raw CRLF bytes are 126799cc... — `--no-filters` returns the raw oid, so it covers BOTH conversion routes", "SELF-ATTACK: the flag beats an ambient `GIT_ATTR_SOURCE`. With `GIT_ATTR_SOURCE=<HEAD tree>` exported, the neutralised tracked leg reads 134 either way, while without our flag the ambient var alone drives it to 0. So the env var is not a residual route", "SELF-ATTACK: the XDG/global default attributes file (`$XDG_CONFIG_HOME/git/attributes`, used when `core.attributesFile` is UNSET) is a live machine-local route that `--attr-source` does not touch — `check-attr filter` reports `canon` under `--attr-source` alone and `unspecified` once `-c core.attributesFile=/dev/null` is added. This is the more likely real-world instance than `/etc/gitattributes`", "SELF-ATTACK, corpus re-derived rather than inherited from the reviewer: 349 key symlinks under `.doctrine/memory/items/`, 0 non-bare targets, 0 dangling, alongside 391 real uid directories — so 42 memories are reachable ONLY by the uid route, which is why DEC-091's totality across routes is not academic", "Attribute-source matrix, git 2.54.0, three fixtures each committing a `clean` filter under a different attribute source, probed under five flag combinations. tree: 0 -> 155 under --attr-source. config: 0 -> 155 under -c core.attributesFile=/dev/null, unmoved by --attr-source. info: 0 under all five, including --attr-source + attributesFile=/dev/null + GIT_ATTR_NOSYSTEM=1", "`/dev/null`, a nonexistent path, and an empty value all neutralise core.attributesFile identically on the discriminating fixture (tracked 0 -> 144); `/dev/null` chosen as git's own idiom", "F-23 reproduced: committed `f merge=ours` reads `f merge ours` without the flag and `f merge unspecified` with it -- the value `custom_merge_driver_paths` allows", "F-22 reproduced and repaired: fsmonitor hook returning a stable token, index primed, 11-byte tracked file replaced with 47 bytes -- tracked=0/untracked=1/cached_rc=0 and `git status` silent on the path; `-c core.fsmonitor=false` gives tracked=138 and ` M f`. `ls-files -v` shows `H f` throughout, so no DEC-082 flag is involved", "`$GIT_COMMON_DIR/info/attributes` is the COMMON dir, not the per-worktree one -- a linked worktree inherits the main repository's file (measured: linked git-dir `.git/worktrees/<name>`, common-dir `.git`, and check-attr still reports the filter). E9's worktree case therefore does not escape the residual", "`git hash-object -t tree /dev/null` writes no loose object (count 3 before and after)"]
contradicts = ["THIS DECISION'S OWN first-draft claim that observe_dirt's argv covers every attribute-sensitive read capture() makes -- falsified by the untracked_fingerprint probe above, and corrected in the choice field rather than quietly amended", "DEC-087's 'closes attribute conversion as a class' -- false as written; it closed one of four sources", "DEC-087's note that scoping was rejected for split-brain -- true of a command-class scope, not of an observation-primitive scope", "DEC-082's enumeration of index-flag suppression as the complete freshness bound -- see DEC-090"]
notes       = ["SELF-ATTACK RECORD, kept because the process point outlives the finding. This decision's first draft claimed 'routing the flags through observe_dirt covers every attribute-sensitive read capture() makes'. That was tagged ASSUMED, probed, and FALSIFIED before disposal — `untracked_fingerprint`'s `hash-object` is the counterexample. The method failure is worth as much as the result: the first sweep grepped `capture()` for `run_git|git_stdin|Command::new` and returned EMPTY, which reads like a clean bill of health. The function actually calls the wrappers `git_bytes`/`git_opt`/`git_text` (65 occurrences in the file), so the grep could not have produced a positive. A negative result is only evidence if the query can return a positive — the same family as the ugrep binary-skip lesson already recorded on this slice", "`worktree_blob_oid` (`src/git.rs`) is a THIRD instance of the same class — plain `hash-object` behind a doc comment promising 'the blob oid the WORKING TREE file would hash to' — and `src/dispatch.rs:6122` compares it against `blob_oid_at`'s unfiltered tree oid. Pre-existing, another subsystem, NOT changed by this decision (the flags stay off `NORMATIVE_FLAGS`). Routed as ISS-261 rather than fixed here. Note DEC-087 would have incidentally FIXED it while breaking `custom_merge_driver_paths` — the same global reach doing both", "`.git/info/exclude` and `core.excludesFile` are the exact structural parallel for the UNTRACKED leg. They are deliberately NOT in scope: DEC-070 already rules ignored files outside the evidence domain, so an operator-set exclude is a declared boundary rather than a hole. Stated so the parallel is not raised as a fresh finding", "The `--cached` index leg is unchanged. DEC-087's reasoning for keeping it survives the placement move intact", "`src/git.rs::EMPTY_TREE_OID` is an existing hardcoded sha1 constant used by the reservation subsystem, which means reservations already carry the sha256 defect F-24 names. Out of this slice's scope; routed to the backlog rather than fixed here"]

