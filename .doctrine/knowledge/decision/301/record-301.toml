id = 301
slug = "an-addition-is-not-a-change-to-what-was-seen-a-move-is"
title = "An addition is not a change to what was seen; a move is"
record_kind = "decision"
status = "accepted"
created = "2026-09-25"
updated = "2026-09-25"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-062 says ordinary inquiry-map maintenance - adding, moving, pinning, deferring, or pruning nodes - does not require human approval. Against the mechanism: pinning is traversal state, and deferring and pruning are lifecycle, which material() excludes, so those three were always exempt; adding invalidated both attested rows and is exempted by DEC-300; moving changes parent, which IS material, so a move still voids both rows and re-faces the human gates at inquiring->drafting, drafting->reviewing and reviewing->locked. Re-wording a question sits in the same bucket as moving."
choice = "Keep a move and a re-word re-attesting, and read DEC-062's 'moving' narrowly: an ADDITION is not a change to what was seen, but a move or a re-word is. No Revision reaches a DEC - revises targets SPEC, PRD, REQ, ADR, POL and STD - so the narrowed reading is recorded here and related to DEC-062 rather than superseding it. AMENDED 2026-09-25 (SL-264, RV-386 F-1, at the user's assent): the rule is scoped to the nodes the accepting act covered. A node added after the act was never shown to the user, so moving or re-wording it later does not re-face them; a move, a re-word or a flipped blocking judgement on a covered node still does."
alternatives = ["Exempt a parent change too, letting DEC-300's derived re-declaration condition be the only notice - rejected: the parent edges are the tree, the tree is how a reader navigates the map, and exempting moves would let the reviewed decomposition be restructured with nothing re-shown, which is the 'absorbed silently' failure PRD-019 REQ-425 names.", "Leave DEC-062 untouched and state the reading in the design document only - rejected: the next reader of DEC-062 would re-derive the same conflict and re-litigate it."]
rationale = "DEC-120 binds an attestation to the content it was given about and reports when that binding breaks. An addition was never part of that content, so exempting it is a READING of DEC-120 rather than an exception to it; a move is a change to content that was given about, so it breaks the binding. DEC-067's principle - changed inputs make only dependent evidence stale - cuts the same way."
consequences = ["DEC-062's 'moving' reads as requiring re-attestation; its other four operations are compliant.", "Re-parenting a covered node and re-wording a covered question remain deliberate re-attestation events; the same on a node added after the act do not (amended 2026-09-25).", "REQ-425 is honoured: material restructuring of what the user saw is surfaced rather than absorbed silently."]
decided_by = "user"
decided_on = "2026-09-25"

