[facet]                         # every field typed; seeded empty (captured later)
context = "SL-286 inq-6. The user-level write depends on a resolvable home and a writable, parseable config; in the bwrap jail `~/.codex` may be absent or read-only."
choice = "The user-level write goes through `codex mcp add`, which resolves its own config file (symlinks written through, EVD-033). The user-level read is a direct read-only parse of `$CODEX_HOME/config.toml` when `CODEX_HOME` is set, absolute and existing, else `$HOME/.codex/config.toml`; an absent file reads as no entry. Degrade — write nothing, print the exact `codex mcp add` command, disclose the cause; the leg still completes (`Done`) and install records its version — when: `codex` is not on PATH; `CODEX_HOME` is empty, relative or does not exist; no home resolves; the user config is unreadable or unparseable; or the exec cannot be resolved. A `codex mcp add` failure is `Refused` (install incomplete), with codex stderr disclosed. The codex CLI on PATH is a declared host dependency of the codex arm (POL-002 facet 3). Dry-run never calls `add` and never retires the project entry."
alternatives = ["Fail the install", "Silently skip"]
rationale = "STD-003 (no silent skip) and the existing PrintedFallback posture."
consequences = ["Jail installs normally degrade to a printed snippet"]
decided_by = "user"
decided_on = "2026-10-23"

