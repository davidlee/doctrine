id = 290
slug = "envelope-carries-the-forward-edge-derived"
title = "Envelope carries the forward edge, derived"
record_kind = "decision"
status = "accepted"
created = "2026-09-24"
updated = "2026-09-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "TurnEnvelope.next_obligation had no writer and always rendered none; agents learned what the next advance required by being refused (IMP-390)."
choice = "Delete RunHeader::next_obligation and TurnEnvelope::next_obligation. Add TurnEnvelope::forward: Option<Forward>, None only at Locked. Forward = {from, to, diverged (design.md edited outside the run — the pre-gate refusal), runbook: cursor step with its text (EX-14) plus ids of other outstanding and stale steps, unmet: [UnmetRow {condition, capped causes, remedy from Contract::remedy()}], unchecked, ready}. Rows render in the order a submission meets them — divergence, runbook, conditions — so the first row is the next act. With nothing blocking, ready is a complete ApplyRequest (run uid, current revision, Doctrine-minted submission_id advance-<to>-r<revision>, stage {to}) applicable exactly as printed. Every part derives from code or the runbook asset. (Amended 2026-09-24: EX-14 cursor-only text; RV-382 F-2/F-3/F-4 — divergence row, remedy carried on rows, complete ready payload.)"
alternatives = ["A: keep next_obligation as derived prose — no wire change, but prose for JSON and a second field still needed for unmet conditions", "C: a single priority-picked next move plus a separate unmet list — two fields and a priority rule, and it either proposes a refused advance or grows a fourth variant that is B"]
rationale = "One field answers both the next move and what the edge still needs; never proposes an advance the gate or the pre-gate divergence check refuses; no hand-kept literal — the ready payload is the serialised ApplyRequest, its submission id minted as the first advance-<to>-r<revision>[-k] with no retained receipt (RV-382 F-5)."
consequences = ["JSON key next_obligation removed — a wire change under the compatibility rule settled at inq-2", "runbook standing moves onto TurnEnvelope, so show --format prompt and JSON gain it (not only resume)", "PRD-019 REQ-414 wording ('persisted run state') needs a revision to 'derived from run state'"]
decided_by = "user"
decided_on = "2026-09-24"

