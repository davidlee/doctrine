[facet]                         # every field typed; seeded empty (captured later)
context = "Under DEC-348 a free-text query with no lexical evidence yields zero rows; the result must not be mistaken for an empty corpus or a silent failure."
choice = """Table mode prints a stdout notice beside the truncation notice, e.g. 'no lexical match for "<q>"; drop the query to browse by scope'. --json and MCP carry no new field: empty rows with total 0 under a free-text query is the signal. The MCP memory_search tool description states the free-text vs selector-only contract."""
alternatives = ["A distinct no_evidence status field in CLI JSON and MCP", "Signal on stderr"]
rationale = "An empty row set is already unambiguous once the floor exists; a new wire field costs golden churn and tells an agent nothing more."
consequences = ["No wire or golden change for --json/MCP", "MCP tool description text changes"]
