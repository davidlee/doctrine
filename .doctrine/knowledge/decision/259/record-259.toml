updated = "2026-09-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "RV-368 F-1: POL-002 facet (3) names a terminal protocol as a host capability; a feature-scoped capability must fail descriptively when absent. With isatty alone -X exited 0 and drew nothing on terminals without kitty graphics, tmux included. The kitty protocol documents a support query: an a=q query followed by a primary device attributes (DA1) request; a DA1 reply with no query reply means unsupported."
choice = "Before rendering, -X queries the terminal: raw mode on the controlling tty, write the kitty a=q query then DA1, read until the DA1 reply or a 2s deadline. A query reply before DA1 means supported; DA1 alone refuses naming the missing protocol and the multiplexer case; no reply by the deadline refuses as unconfirmed. Raw mode is restored on every path. The probe runs after the format and terminal checks and before the corpus scan. Reverses the SL-245 scope non-goal of no capability handshake."
alternatives = ["Amend POL-002 so -X is itself the capability assertion for terminal protocols", "Environment sniffing via TERM or KITTY_WINDOW_ID which is wrong inside the jail"]
rationale = "DA1 is answered by every VT-compatible terminal so the handshake cannot hang the way the scope feared; the deadline is a backstop. It turns the tmux residual and every unsupported terminal into a descriptive refusal and keeps POL-002 intact."
consequences = ["tty gains a raw-mode query seam", "kitty gains the query bytes and a pure reply classifier", "A timed-out probe leaves a reader thread blocked on the tty until the process exits moments later", "DEC-256 geometry can rely on a probed terminal reporting pixel sizes"]
decided_by = "user"
decided_on = "2026-09-15"

