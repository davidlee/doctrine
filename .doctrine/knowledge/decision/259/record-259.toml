title = "Render probes kitty graphics support before rendering"
record_kind = "decision"
status = "accepted"
created = "2026-09-15"
updated = "2026-09-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "RV-368 F-1: POL-002 facet (3) names a terminal protocol as a host capability; a feature-scoped capability must fail descriptively when absent. With isatty alone -X exited 0 and drew nothing on terminals without kitty graphics, tmux included. The kitty protocol documents a support query: an a=q query followed by a primary device attributes (DA1) request; a DA1 reply with no query reply means unsupported."
choice = "Before rendering, -X queries the terminal on one verified endpoint: open /dev/tty (blocking) and refuse unless it is the same device as stdout (st_rdev); read window size, set raw mode with termios timed reads (VMIN=0, VTIME=1) and exchange the query on that one fd. Write the kitty a=q query then DA1, and read replies in a loop until the DA1 reply or a 2s deadline; each read returns on the first byte or after 100 ms. A graphics reply before DA1 means supported; DA1 first refuses naming the missing protocol and the multiplexer case; no reply by the deadline refuses as unconfirmed. Raw mode is restored explicitly and checked on every return path, a restore failure taking precedence over the query outcome; a drop guard restores best-effort during unwinding. The probe runs after the format and terminal checks and before the corpus scan. Reverses the SL-245 scope non-goal of no capability handshake. Amended 2026-09-15 after RV-368 F-9/F-10/F-11, and after F-12: timed reads replace poll, which does not work on /dev/tty on macOS."
alternatives = ["Amend POL-002 so -X is itself the capability assertion for terminal protocols", "Environment sniffing via TERM or KITTY_WINDOW_ID which is wrong inside the jail", "rustix event poll on the tty which does not work on /dev/tty on macOS", "rustix event select which works on macOS but is unsafe and would add a third site to the workspace unsafe_code budget of two"]
rationale = "DA1 is answered by every VT-compatible terminal so the handshake cannot hang the way the scope feared; the deadline is a backstop. It turns the tmux residual and every unsupported terminal into a descriptive refusal and keeps POL-002 intact."
consequences = ["tty gains a single-endpoint render-terminal seam over rustix termios timed reads with no readiness syscall and no unsafe", "kitty gains the query bytes and an order-aware pure reply classifier", "No reader thread outlives the probe", "The deadline is honoured to within one 100 ms read", "DEC-256 geometry can rely on a probed terminal reporting pixel sizes", "A stdout redirected to a terminal other than the controlling one is refused", "Behaviour on macOS rests on POSIX non-canonical read semantics until a macOS VH run"]
decided_by = "user"
decided_on = "2026-09-15"

