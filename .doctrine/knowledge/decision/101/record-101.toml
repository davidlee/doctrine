  "src/commands/prompt.rs:215-222 — prompt check loads the hymn corpus only. Revision 1's claim that TOML 'inherits validation' from it was wishful",
  "src/design_run/prompt.rs:32-38,96-110 — Fragment is a closed four-variant enum with NO exploring variant, and for_stage collapses Exploring|Inquiring into Inquiry. Revision 2 claimed the runbook is selected by that rule; there was nothing for exploring.toml to be selected by",
  "src/design_run/gate.rs:22-121 + facts.rs:96-99 — Condition is payload-free and satisfies() is existential. Revision 2 put the clause in that vocabulary; it cannot carry a step identity or express a universal quantifier over an asset-derived set",
  "src/design_run/snapshot.rs:386 + run.rs:196-203,1263 — DerivedDesignFacts is persisted snapshot state, and payload-claimed derived conditions are refused. Revision 2's 'results enter as payload, riding DerivedDesignFacts' was wrong on both halves",
  "src/design_run/attestation.rs:109-112 — the four-part binding is AcceptanceAttestation's, not a section attestation's. Revisions 1 and 2 mis-cited it, quoting install/design-prompts/reviewing.md:6-9, which states the same error",
]
notes       = [
  "narrows DEC-077 rather than superseding it: DEC-077 deferred user-override semantics, it did not forbid them",
  "took TWO external adversarial PROSE reviews (codex, read-only, deliberately not RV ledgers), the second by a fresh agent over the first's repairs. Nine of ten findings stood in the first pass; eight in the second, three of them structural. Sketch §12 carries both disposition tables",
  "the two passes each found the previous round's repairs resting on false claims about the code. The owner's ruling (2026-07-31) is therefore to ship and correct from operation rather than seek a third pre-implementation pass, spending remaining design attention only on what hardens into contract at ship time (sketch §0)",
  "open at phase-plan: the seventh act's wire key; the digest's canonical encoding and version tag; and which shipped checks `doctrine verify` launches with beyond research-current",
  "runbook drift is NO LONGER open — it is load-bearing, and the answer is the per-step definition digest",
  "the stale-after-clear rule is NO LONGER open — owner's ruling: it warns, it does not block, and the requirement is evaluated per-edge rather than cumulatively",
]

