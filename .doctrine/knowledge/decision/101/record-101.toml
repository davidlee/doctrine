created = "2026-07-31"
updated = "2026-07-31"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context      = """
Comparing the incumbent design skill against the built surface showed Doctrine \
took the state and the invariants but not the checklists or the craft. No part \
of the built surface is in the "do this now" register: the envelope holds \
state, the stage hymn holds invariants, and the four process fragments hold \
refusal-invariants wearing the word "Obligation". The state with the most \
explicit ordered checklist — exploring — has no fragment of its own."""
choice       = """
Ship a generic ordered-obligation primitive. Rust owns the closed concept — \
ordered, one step at a time, no skipping, position visible in the envelope, \
gate::advance blocks until every required step is discharged — and the step \
contents are asset data in a TOML sibling keyed to a FORWARD EDGE of the stage \
machine, beside the edge-keyed guard table that already exists. A step declares \
an id, text, required, and an OPTIONAL verify command: an arbitrary executable, \
zero on success. Progression is attestation of the step at the cursor; there is \
no bare "next". Revised twice against external adversarial review: the clause \
was first placed on can_advance (edge legality, not clearance), then on \
advance's Condition vocabulary (which cannot express a dynamic, \
identity-carrying conjunction), and finally as a third derived input to \
advance. Selection was first claimed to reuse Fragment::for_stage, which has no \
exploring variant to reuse."""
alternatives = [
  "sub-state per step in Rust — maximum adherence, but every prose revision needs a recompile, for text that changes far more often than the mechanism",
  "richer fragments and no new state — cheapest, but adherence stays voluntary, which is the defect being fixed",
  "a closed Rust predicate vocabulary instead of executable verifiers — reimports the recompile-per-check cost the first alternative was rejected for",
  "a Markdown convention rather than TOML — closer to 'hymn + conventions', but puts structured step ids and modes in prose and needs a bespoke validator",
]
rationale    = """
DEC-077's own split one level deeper, applied to procedure rather than prose. \
Executable verifiers keep the check set open-ended so it grows without Rust \
changes; what stays closed is the placeholder vocabulary ({slice}, {run}, \
{repo_root}, {step}), which is small and does not grow when checks grow. TOML \
is the project's own two-tier convention. Explicit author-assigned step ids — \
never positional — are the same immutability rule already enforced on PHASE-NN \
and EN-/EX-/VT- ids; but an id solves REFERENCE, not EQUIVALENCE, so a \
discharge additionally binds the digest of the step's definition. The precedent \
is Attestation's subject-plus-fingerprint binding under DEC-066 liveness; the \
richer four-part binding (payload fingerprint, disposition, revision) belongs to \
AcceptanceAttestation, and earlier revisions of this record mis-attributed it to \
section attestations — as does the shipped reviewing.md fragment. \
WRITER_ACTS is a closed [WriterAct; 6] guarded by a second set-equality table \
in the e2e suite, so a seventh act fails loudly rather than widening the class \
silently — the extension path is real, and better guarded than first claimed. \
Guards belong on edges: the runbook is a transition guard, and keying it to a \
forward edge adds no states, no stages and no Fragment variants, because the \
cursor is run data a guard consults rather than a node in the machine (the \
ReviewStanding precedent)."""
consequences = [
  "a seventh writer act joins the closed vocabulary; wire change (working name `discharge`, final name at phase-plan). TWO enumerations move together — the production array and the e2e set-equality table",
  "new run state: per-obligation discharge records, VERSIONED, binding step id, STEP-DEFINITION DIGEST, revision, and outcome; plus a cursor. The record shape and the digest's canonical encoding harden on ship, so the encoding is length-delimited and version-tagged — which is what makes a fourth outcome arm (a bound null result: 'swept this scope, nothing applicable') cheap to add later rather than guessed at now",
  "the runbook is keyed to a FORWARD EDGE, not to a Fragment. `Fragment` is a closed four-variant enum with no exploring variant and for_stage collapses Exploring|Inquiring into Inquiry, so the original 'one selection axis' claim was not implementable. The selector is a static edge table beside boundary_conditions; can_advance is a total function on non-terminal stages, so edge-keying and origin-state-keying are isomorphic",
  "the clearance clause lands on `gate::advance` as a THIRD DERIVED INPUT (a RunbookStanding beside ReviewStanding) plus one new refusal variant — NOT as a new `Condition`. The Condition vocabulary is payload-free, its satisfies() is existential where the gate needs universal, and GateNotCleared carries only Vec<Condition> with no room for a step id. Every guard in the machine today is a static conjunction; a runbook guard is a dynamic one. Without the clause the runner is decoration and adherence stays voluntary",
  "the runbook does NOT derive the incumbent conditions and MUST NOT: truth cannot flow from user-customisable material into a Doctrine-owned closed vocabulary without mixed step ownership or a decorative OR-fallback. There is also nothing to reconcile — governing-context-recorded and initial-concerns-recorded are stubs (nine words at design.md:268, named in zero shipped guidance, bound to an arbitrary section's fingerprint), so they are a placeholder for what the runbook records, not a competing account",
  "the runbook requirement is evaluated ON ITS OWN EDGE and does not join cumulative_conditions: a stale discharge WARNS, it does not block and does not un-advance. It is the first non-cumulative condition in the machine. DEC-067's property survives by another route — regressing returns the run to the edge's origin, where it faces the guard again",
  "shipped step ids become API — downstream logic keys on the id, never on the command behind it, so once the override seam lands a project MAY substitute a verifier. The digest binding is what makes the substitution visible rather than silent: the discharge goes stale and must be re-made under the new contract",
  "verifier command addresses become API: a top-level `doctrine verify <key>` family whose ONLY contract is exit code plus explanatory output. Borrowing exit codes from verbs that exist for other reasons is explicitly rejected. The name is free of collision but must join `FAMILIES`, whose partition test panics on an unclassified visible command and whose taxonomy drives help and boot-map goldens",
  "`verify` is an ARGV ARRAY, never a shell command string: {repo_root} may hold spaces and metacharacters, so string interpolation would turn data into syntax. (An earlier revision also rested this on free-form step ids; that leg is dropped, since a step id may be constrained by whatever slot it rides — DesignId requires one of seven closed prefixes and an alnum/-/_ body. The {repo_root} leg carries the argument alone.)",
  "verifiers execute shell-side and their results enter through DerivedInput or a sibling ephemeral type — NEVER through caller-authored payload. StageDeclaration is {to, reason} with no slot, and routing results through request.evidence compiles and is then refused by Refusal::DerivedConditionClaimed, because a verifier result is exactly a fact Doctrine must derive. DerivedDesignFacts is persisted snapshot state, not the shell-input carrier — an earlier revision claimed both halves wrongly. The pure core executes nothing, and no subprocess sits inside apply's admit→persist span, which has no revision recheck and is negligible only while nothing slow is in it",
  "runbook validation is OWNED, not inherited: `doctrine prompt check` loads only the hymn corpus and knows nothing about this asset class, so the phase adds a second loader and validation domain",
  "the runner guarantees sequenced, gated and auditable; only steps carrying a verifier are additionally verified. Steps without one are best-effort and trust-reliant, and the record says so per step",
  "PHASE-09's rubric must score adherence-under-attestation separately from verified discharge",
  "project-authored executables run during a design run — accepted at the trust level of the repo's own justfile and CI config (see the body)",
  "`sequence` and `set` are two admission rules over one act, not one rule behind a flag: a sequence refuses any discharge not at its cursor, a set derives no refusal from ordering. PHASE-16 ships `sequence` ONLY. AMENDED 2026-08-01 (owner ruling; RV-325 round 5 F-11, contested and re-fixed at round 6): `set` is NO LONGER deferred to PHASE-08 — it is deferred to IMP-373. This consequence previously read `deferred to PHASE-08, which converts the two genuinely coverage-set checklists and will have real instances to design it against`, and BOTH halves lapsed: D14 reclassified those checklists as stage framing, so the conversions do not happen; and F-5's settlement then produced five order-independent steps under `sequence`, so the real-instances precondition is MET by different instances. `Shipping it would land a mode with no user` is therefore WITHDRAWN AS FALSE. What defers `set` now is its RENDER — a cursorless runbook under EX-14's token bound — which is unsketched and outside PHASE-08 EN-2's scope, so landing it there would hand a design choice to implementation. The admission-rule distinction above is untouched; only the delivery and the owner moved. See the body's 2026-08-01 amendment, PHASE-16 EX-7/EX-14's annotations, and IMP-373's repayment condition",
  "the `doctrine verify` family has TWO integration points in the CLI taxonomy, not one: FAMILIES membership, and the hard census assertion in the same partition test, which a 56th visible command reds independently of classification",
]
decided_by   = "owner"
decided_on   = "2026-07-31"

