updated = "2026-08-12"
tags = ["area:dispatch", "area:worktree", "cluster:capsule", "harness:claude"]

[facet]                         # every field typed; seeded empty (captured later)
context = "EVD-023 falsifies the billing half of ADR-011's founding premise: claude -p draws from subscription usage limits. ADR-011 Context concluded 'for claude the only viable backend is the in-session Agent tool' and D3 recorded 'OS confinement — none: Agent is not a subprocess to wrap'. Four incumbent mechanisms — the disk marker as sole identity, the SubagentStart stamp hook, the worktree pretooluse confinement wall, and the gated worker_commit tool — exist only as workarounds for that conclusion. Meanwhile SL-247 was mid-design patching the wall's fourth arm so that ordinary non-worktree subagents stop being useless."
choice = "Retire the claude in-session Agent dispatch arm and run claude -p as a confined subprocess under the same bwrap prefix the pi arm already uses (scripts/pi-spawn-confined.sh lines 120-127). Provision each worker as a clone rather than a linked worktree. Delete the pretooluse and SubagentStart confinement hooks and the worker marker stamping. Update the dispatch skills to the subprocess shape. Abandon SL-247 rather than amend it."
alternatives = ["Amend SL-247 to fit the new direction. Rejected because no part of its scope survives — it patches a wall being deleted and its verification leg proposed new e2e coverage for a verb being removed.", "Proceed with SL-247 as designed and let the capsule programme reach the arm later. Rejected because it spends implementation on a surface RFC-025's census already marks DELETE and grows what the cutover must unpick.", "Wait for the capsule programme to retire the arm at its slice 5 cutover. Rejected on sequencing — slices 2 through 4 are unminted and slice 2 is itself gated behind SL-248's close and a 24-item follow-up register. Collapsing claude onto the existing subprocess arm is incumbent simplification rather than a capsule deliverable and needs none of that machinery.", "Keep the in-session Agent arm as a second supported backend alongside the subprocess arm. Rejected because carrying both keeps every mechanism the collapse is meant to delete."]
rationale = "The four mechanisms being deleted are not independently motivated designs — they are one workaround wearing four hats. ADR-011 D3 states it plainly: OS confinement is 'none' because 'Agent is not a subprocess to wrap'. Restore the subprocess and their cause disappears rather than their symptoms being managed. The move is also cheap where it matters: the bwrap prefix in scripts/pi-spawn-confined.sh is eight argv tokens already factored as a PREFIX array with a macOS sandbox-exec sibling beside it. Its --setenv DOCTRINE_WORKER 1 is precisely the env seam ADR-011 D4 says claude cannot have. Claude-specific edits amount to rebinding $HOME/.pi to $HOME/.claude and changing the exec target. Crucially the decision does not rest on billing. EVD-023 records a pause rather than a settled position and Anthropic promises notice before any change. Billing removed the blocker but the subprocess arm is the better shape independently — uniform across all three harnesses, real OS confinement instead of a fail-open hook wall, and net deletion of mechanism. Owner's position is that this holds even if billing flips back."
consequences = ["ADR-011's Context premise and its D3 claude column become false in an accepted ADR. Correcting them routes through a REV per ADR-013 — the same in-place FALSIFIED amendment shape D5 and D6 already carry from SL-064.", "ADR-006 §D2b is likely touched too. SL-247's inq-7 declined to amend it on the reasoning that a cutover would rewrite the section anyway — this is that cutover arriving early.", "SL-247 is abandoned at design. DEC-152 and DEC-154 stay accepted as accurate reasoning at a moment and are superseded rather than retracted. Both in fact pre-argue this direction — DEC-152's rationale argues the wall is not earning its keep and DEC-154's residual names assert-at-spawn as the successor to infer-at-deny.", "The repo sits mid-cutover on the incumbent arm which is exactly what RFC-025's 'every slice but the last lands beside the incumbent arms' discipline was written to prevent. Accepted knowingly because this removes an arm rather than adding one and makes the eventual capsule slice 5 strictly smaller.", "Clone-per-worker gives the worker a writable .git which should dissolve the pi arm's standing no-self-commit constraint and converge both arms on self-commit. To be confirmed rather than assumed.", "Two PreToolUse hooks are 'memory surface' and must survive. Only the four 'worktree pretooluse' matchers and the SubagentStart stamp are in scope for deletion.", "The capsule programme's microVM turn does not apply here. DEC-190 and DEC-191 concern the capsule authority boundary — this is parity with what the pi arm already does today and must not inherit capsule-grade assurance bars or it will stall."]
decided_by = "user"
decided_on = "2026-08-12"

