id = 382
slug = "install-commit-hint"
title = "Install prints a commit hint for the tracked paths it changed"
record_kind = "decision"
status = "accepted"
created = "2026-10-16"
updated = "2026-10-16"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-282 inq-3 / IMP-516: install should hand over the next step."
choice = """After a successful run, install prints a path-limited `git add -- <paths> && git commit -m "chore: install doctrine X" -- <paths>` ("update doctrine to X" on upgrade), naming exactly the tracked paths doctrine's own writers created, changed or removed in this run, taken from InstallPlan write results with paths under the install-managed ignore contract excluded. Writes made by a delegated tool (today the `npx skills` leg) cannot be enumerated; when that leg ran, the hint adds a line telling the user to review `.agents/skills/`. Nothing tracked changed: prints "nothing to commit". Not a git repository: no hint. The hint is printed, never executed."""
alternatives = ["Run the commit for the user: outward-facing, surprising", "Name a fixed path list: stale and wrong when nothing changed", "Query git status for changed paths: extra git dependency for what install already knows"]
rationale = """Install already knows what it wrote; deriving the hint from InstallPlan keeps one source and stays exact for doctrine's writes. The delegated npx leg reports only success, and npx delivery is likely to be retired soon, so a disclosure line beats building a before/after diff for it. Amended 2026-10-17 by the user's ruling on RV-421 F-11 ("1a — npx is likely going soon")."""
consequences = ["InstallPlan execution must report per-path written/changed outcomes"]
decided_by = "user"
decided_on = "2026-10-16"

