[facet]                         # every field typed; seeded empty (captured later)
context = "SL-254's scope surveyed the governance landing as the larger half of the slice and research thread 1 confirmed its shape. Reading the spec TOML directly adds two surfaces the survey did not reach. First, spec-021.toml:15 carries the funnel cadence as a governed ordered contract — 'precondition -> delta-check -> R-5 .doctrine//.claude/ belt -> import (non-committing) -> verify -> branch-point guard -> one coordination commit -> record' — so DEC-204's belt re-homing and DEC-203's fetch transport both change GOVERNED prose, not just code. Second, spec-012.toml:18 describes fork as 'create + provision + stamp + emit per-wt env' and import as 'the belted dispatch funnel'; DEC-207 deletes the stamp and DEC-203 replaces the import, so SPEC-012's responsibility prose changes and not only its source-anchor comment. The scope named SPEC-012's shape change but not its prose."
choice = """
Mint one REV for SL-254 carrying: (A) ADR-011 amended in place on the D5/D6 'AMENDED — FALSIFIED' precedent, at four sites — the Context premise that the in-session Agent tool is claude's only viable backend, D1's justification for disk-primary identity (DEC-207), D3's claude column, and D4's three enhancements listed as codex/pi-only until a free claude env backend lands, all three of which now land. (B) ADR-006 D2b, a new note on the SL-181 note pattern, reversing SL-247's inq-7 declination on thread 1's scope argument — PLUS a second correction at the same site, added 2026-08-13: D2b names IMP-065 as 'the real positive-marker close (coordination-tree identity by a present orchestrator signal, not by absence)', but IMP-065 was closed OBSOLETE on 2026-07-02 via REV-018, superseded by confinement rather than delivered. The ADR therefore carries a live forward-reference to a retired item, and the marker-absence transitional assumption that reference hedges is itself deleted by DEC-207. Both halves re-cut together, so the note does not point a reader at a close that will never arrive. (C) SPEC-021: REQ-288 retires, REQ-291 rewrites, and THREE responsibilities move — line 15's funnel cadence, line 16's arm routing, and line 19's enforcement altitude. Line 19 is rewritten in its FIRST half only: its second half is FR-007/REQ-335's confined-orchestrator tier, an explicit non-goal that stays pending. (D) SPEC-012's responsibility at line 18. (E) DEC-204's INV-2 posture change, landing in SPEC-021's funnel-cadence responsibility because that is where the belt is actually governed. (F) the source-anchor sweep, by hand. Untouched: ADR-012 (DEC-203), ADR-020, SPEC-030, REV-046, REQ-335/FR-007.

NARROWED 2026-08-13 by DEC-213, which re-scopes SL-254 to the arm collapse alone. The REV's target set is unchanged at four entities, but two items leave it and one is re-grounded:

- (A) ADR-011 — UNCHANGED. The arm collapse is the whole of what falsifies its Context, D1, D3 and D4, and none of that depends on the clone.
- (B) ADR-006 D2b — UNCHANGED, including the IMP-065 correction added above. DEC-207's marker deletion is topology-independent, so it lands whether workers ride clones or linked worktrees.
- (C) SPEC-021 — NARROWED. REQ-288's retirement and REQ-291's rewrite stand; line 16's arm routing and line 19's first half stand. Line 15's funnel cadence NO LONGER CHANGES: the belt does not re-home because the incumbent import transport is retained.
- (D) SPEC-012 line 18 — NARROWED to the stamp. "fork = create + provision + stamp + emit per-wt env" loses the stamp with the marker (DEC-207); "import as the belted dispatch funnel" is UNCHANGED because import survives.
- (E) DEC-204's INV-2 posture change — LEAVES THE REV entirely. The posture does not change: classify_import survives as the scope belt's enforcing caller, so a worker still cannot skip a belt.
- (F) the source-anchor sweep — UNCHANGED, and spec-021.toml:30's dangling [[source]] at plugins/doctrine/skills/dispatch-agent/SKILL.md still resolves by deletion.

Untouched set grows: ADR-012 (DEC-203), ADR-020, SPEC-030, REV-046, REQ-335/FR-007 — plus everything the clone half would have reached, which is now the successor slice's governance surface to survey in its own right.

SITE ENUMERATION CORRECTED 2026-08-13. (A)'s "at four sites" under-counts ADR-011 materially. The four named — the Context premise, D1's disk-primary rationale, D3's claude column, D4's three codex/pi-only enhancements — are all real and all stand. Four further regions change, found by reading ADR-011 end to end against DEC-207/208/209/210 rather than through the research round's quotations:

- D2 (58-74), THE CORE CONTRACT. Two load-bearing claims move. Its agnostic core is "create-or-mark + provision + marker"; DEC-207 removes the marker from it. And "claude's `Agent` path has no worker env channel and cannot consume it" is the stated reason env delivery sits outside the everywhere-enforced core — a confined `claude -p` subprocess falsifies it directly. D2 is the section the rest of the ADR argues from, and it was absent from the list.
- D6 (146-207), THE CLAUDE FAIL-CLOSED ALTITUDE. Sixty lines resting on the SubagentStart stamp, the disk marker, IMP-052's post-spawn check and the M2 matcher caveat — every one of those mechanisms is deleted by this slice. The section is marked "asserted, not proposed", and its conclusion ("not fail-closable") inverts under DEC-208, which fails closed at spawn as the pi arm already does. This is not a restatement of D3's table cell; it is the argument beneath it.
- CONSEQUENCES (248-259). Three bullets falsified: the O3-red altitude (Negative), the doc-supported-but-unprobed `dispatch-worker` matcher (Negative), and "the subprocess enhancements are optimisation-tier and codex/pi-only until a free claude env backend lands" (Neutral).
- VERIFICATION (265-275). The ADR's acceptance basis, not prose restatement. One VA criterion reads "no harness-specific command (`claude -p`) appears as a required element"; another states that `DOCTRINE_WORKER` is "codex/pi-only, never the identity". DEC-207 makes it exactly the identity, and DEC-208 makes `claude -p` the sole backend for that harness. Both criteria invert.

So ADR-011's amendment covers EIGHT regions, not four, with two further candidates considered and deferred below. The consequences bullet that says to budget more hand-finishing than the scope's survey implied holds harder, and its estimate should be read against eight.

CONSIDERED AND DEFERRED, deliberately not folded in:
- D5 (113-144). Already carries an "AMENDED — FALSIFIED (SL-064 §8)" note; its base-pinning residual dissolves a second time under `fork --base <B>`, because there is no opaque base once the worker is a subprocess on an orchestrator-forked linked worktree. Whether an already-falsified section needs a second amendment note is an authoring call for the REV, not a survey finding.
- D7 (209-232). Its withdrawal of the sigma blast-radius holds and in fact strengthens, but it leaves a live forward-reference to the deferred `WorktreeCreate` pre-worker fail-closed arm (IMP-072) that can now never land — the same dangling-reference defect (B) catches at ADR-006 D2b with IMP-065, in this same document, missed on the first pass. It belongs in the anchor sweep (F) at most, not in a decision-section amendment.

The REV's target set is unchanged at four entities. This corrects the SIZE of ADR-011's amendment within that set, not its membership."""
alternatives = ["Ride REV-046. Rejected by scope and confirmed by thread 1: REV-046 is proposed with approval=none and gates the capsule cutover at slice 5, which RFC-025 holds until there is an exact migration plan. Riding it couples SL-254 to hostile-ingestion, interpretation-policy and microVM-measurement evidence it does not need.", "Amend ADR-011's Context only and leave D1 and D4 standing. Rejected: D1's 'identity rides disk — the one medium every harness has — not a process env seam, which not every harness has' is the RATIONALE beneath a decision the REV corrects, and leaving a stale rationale under a corrected decision is how the next reader re-derives the deleted mechanism.", "Treat the source anchors as an execution detail. Rejected: spec validate does not catch a dangling [[source]] anchor, so nothing goes red and the rot is silent."]
rationale = "The governance work is the larger half because the two-arm posture is encoded in prose in more places than it is in code, and prose does not fail to compile. Enumerating the anchors concretely rather than describing them is the whole mitigation for the silent-rot hazard: spec-021.toml:30 is the only true dangling [[source]] (identifier plugins/doctrine/skills/dispatch-agent/SKILL.md, pointing at a skill this slice deletes), while spec-012.toml:30 and spec-022.toml:45 are comment lists naming pretooluse.rs and subagent.rs. Splitting responsibility 19's rewrite in half is the precision that keeps the slice inside its own non-goals: the requirement's dissolving half is the per-harness altitude table, and its surviving half is a pending tier this slice must not disturb."
consequences = ["ISS-347 — REQ-288 and SPEC-021 responsibility 2 misstate the env-marker as `.claude/` presence when the router tests CLAUDECODE=1 — closes by REQ-288's retirement. Record that it was fixed by DELETION rather than by edit, so the drift is not silently lost from the record.", "SPEC-021 responsibility prose is surfaced-for-manual at REV apply, and there are now three responsibilities plus a half-rewrite rather than two — budget more hand-finishing than the scope's survey implied.", "DEC-202's own choice text is corrected in place (DEC-203's consequence): it is proposed rather than settled, so this is an edit and not part of the REV.", "The REV's target set is ADR-011, ADR-006, SPEC-021, SPEC-012 — four entities. SPEC-022's change is a comment-only anchor sweep and needs no REV target."]
