id = 406
slug = "codex-mcp-layered-ownership"
title = "Codex MCP ownership: user slot by name, project slot is the override"
record_kind = "decision"
status = "accepted"
created = "2026-10-23"
updated = "2026-10-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-286 inq-4. Codex prefers a project-level `[mcp_servers.doctrine]` over the user-level one (probe). The binary path changes across installs (cargo, ~/.local/share, nix store), so path-equality ownership would strand entries as foreign."
choice = "User level is doctrine's default slot: install owns `[mcp_servers.doctrine]` by table name and writes only `command` and `args`, preserving every other key (env, startup_timeout_sec, enabled, ...); a changed command is reported old → new; a non-table entry or wrongly-typed command/args is left untouched with snippet and disclosure. Project level is the user's override slot: the emitted wrapper shapes (`CODEX_MCP_WRAPPER_FORMS`) are owned and removed; a foreign entry with an absolute command is a deliberate override — left untouched, reported 'project override in effect: <path>', not held incomplete; a foreign PATH-dependent entry is left untouched, warned as shadowing and daemon-fragile (EVD-032), and holds install incomplete as today."
alternatives = ["Own user-level entries only when shape matches and path equals the current binary — strands every moved install", "Own user-level entries of the emitted shape with any absolute path — still strands hand-written variants and replaces whole tables", "Treat every foreign project entry as incomplete (ISS-528 status quo) — penalises deliberate overrides"]
rationale = "Per-project overrides now have a home (the project layer, which codex prefers), so the user-level table has one job and doctrine can own it outright. Field-level writes keep user settings; reporting old → new keeps a path change visible."
consequences = ["Supersedes DEC-323 and DEC-332", "Partially resolves ISS-528: an absolute-path project override no longer holds install incomplete", "Doctrine never writes a project-level override (POL-002); manual only"]
decided_by = "user"
decided_on = "2026-10-23"

