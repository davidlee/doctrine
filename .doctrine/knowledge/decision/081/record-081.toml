created = "2026-07-27"
updated = "2026-07-27"
tags = ["memory", "schema", "cli", "mcp"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "SL-232 objective 3 declares `scope.unobservable` -- the sanctioned way to say a declared entry is deliberately outside git's view, so its non-contribution is not a defect. RV-314 F-2 (blocker) found the design specified the field, its matching rule, V1-V5 and T52 but named no write path: no CLI flag, no MCP field, no replace-vs-append semantics, no absent-field default, and no position on whether `record` may author it. A declared boundary with no authoring verb is not declarable."
choice       = "`memory edit` is the sole producer, riding the existing scope-array arm exactly: a repeatable `--unobservable` flag, `EditFields.unobservable: Option<Vec<String>>`, a matching `has_any()` arm, a fourth replace-whole-array block in `apply_edit`, and a mirrored `unobservable` field on the MCP `EditParams`. Semantics are REPLACE, matching `--path-scope` / `--glob` / `--command`. The clap shape is `num_args = 0..=1` so a bare `--unobservable` clears the array -- absent is None, bare is Some([]), repeated occurrences append into one array. `record` does NOT author it and the embedded memory.toml template is untouched, so the key materialises only when declared. No corpus backfill lands in this slice."
alternatives = ["Copy `--glob` exactly (`Vec<String>`, empty collapses to None) -- rejected: it makes the array unclearable from the CLI, and V2 (an unobservable entry git DOES match is a stale declaration) has no remedy but deleting the entry. § 5.3 measures the typical memory as declaring one unobservable, so the unclearable case is the mainstream case, not an edge", "`require_equals = true` -- eliminates the residual hazard outright but forces `--unobservable=a` for every value and errors on `--unobservable a`, giving one of four sibling flags a different call syntax. Rejected as a worse trap than the one it removes", "A separate value-less `--clear-unobservable` flag -- keeps the set path byte-identical to the siblings and cannot misfire, but adds a fifth flag and admits `--unobservable a --clear-unobservable` together, a contradictory input needing its own refusal rule. Rejected", "Let `record` author it too -- rejected as unevidenced: at record time no contribution report has been seen, so the declaration is a response to a finding rather than an a-priori claim. Purely additive later; removing later would be breaking", "Backfill the ~33 candidate entries -- rejected: `check-ignore` is a local-state instrument, which is precisely why § 5.3 requires the boundary to be DECLARED rather than derived. A mechanical bulk backfill is the derived judgement the field exists to refuse"]
rationale    = "The read path needs nothing: RawScope and Scope are tolerant `#[serde(default)]` reads, `scope_array` returns empty for an absent key, and the only `toml::to_string` round-trips in src/memory.rs are in tests -- production writes are all toml_edit, which is format-preserving. So there is no migration and no backfill problem for reads, and this is purely a write-surface question. Riding the existing arm adds no mechanism; `scope.insert` mints the key on demand. Replace semantics are forced by uniformity and by coupling: `unobservable` shadows entries in `paths` union `globs` by exact string match, so if those replace and this appends, the two drift and V1 fires on the residue."
consequences = ["ClaimSnapshot stays five fields (title, summary, paths, globs, commands). `unobservable` must NOT join it -- T52 asserts editing it does not clear the verification axis, and RV-314 F-4's disposition leans on that. Untouched by construction: the fourth apply_edit block writes the array and claim_snapshot never reads it", "T52 extends to the write path with a discriminating half -- editing `unobservable` on a verified memory leaves verification_state and verified_sha standing, while editing `globs` on the same fixture clears them", "No lexical guard at write time. `--unobservable ../gone` writes; `validate` reports it malformed and V5 refuses to let the declaration suppress that. Same posture as paths/globs, and § 5.3's 'all findings, none refusals' already commits to it", "Residual hazard, documented in the flag's help: a bare `--unobservable` placed immediately BEFORE the positional eats the reference, leaving <REFERENCE> unfilled. It can never be silent -- <REFERENCE> is the sole positional, so the outcome is always a hard clap error with nothing written -- but the wording names a missing argument and does not hint that the flag consumed it", "`--unobservable=` yields Some([\"\"]), a single empty-string entry rather than a clear. V3 already covers it and it is exactly what `--glob=` does today, so it needs no new rule -- but § 5.3 must say so, or it reads as a second clearing route", "The ~33 candidate entries route to a backlog improvement, HEAD-stamped, not to this slice"]
decided_by   = "david"
decided_on   = "2026-07-27"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["clap 4 probe (scratch crate, three candidate shapes): `num_args = 0..=1` with Option<Vec<String>> gives absent=None, bare=Some([]), `--unobservable a`=Some([\"a\"]), repeated=Some([\"a\",\"b\"]), and `--unobservable a mem_x`=ref mem_x + Some([\"a\"]) -- the value count caps at 1 so the positional falls through", "Same probe: the only misfiring shape is `--unobservable mem_x` (bare flag before the positional), which errors 'the following required arguments were not provided'. `--unobservable --glob g mem_x` parses correctly to Some([]) because the next token is a flag", "Same probe, require_equals candidate: `--unobservable a` errors 'unexpected argument a found', confirming the ergonomic cost", "src/memory.rs:717-727 -- the CLI seam collapses empty Vec to None for all three existing scope arms, which is why they cannot be cleared; the MCP surface CAN clear them by sending [], a live asymmetry"]
contradicts = ["The reading of RV-314 F-2 that treats the backfill as mandatory -- F-4's disposition re-based T49 onto a constructed GitScratch fixture rather than the live corpus, so T49 no longer needs it"]
notes       = ["The CLI-cannot-clear / MCP-can-clear asymmetry on --path-scope, --glob and --command is pre-existing and out of scope here; routed to the backlog", "Naming was settled earlier in § 5.3: not `untracked` (a git term of art for a state, and misleading given E8's force-added case) and not `external` (answers 'is this part of the claim?' with no, which is wrong)"]

