updated = "2026-09-27"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "RFC-026 P10's first trial window (E12) recorded 0 of 18 severe design findings routed, because nothing checked the form. SL-268 made --route a validated field but left it optional. SL-270 must make route presence enforced before a second window. Two sites were available: review conclude, or the design-run lock gate, which already observes the design review's ledger through observe_pass (src/review_ledger/gate.rs:281) and refuses on undisposed blockers (src/design_run/gate.rs:1711, DEC-138)."
choice = "The check sits at the design-run lock, beside the undisposed-blocker check: the pass observation gains a list of unrouted severe findings, and a non-empty list is a new refusal cause on review-disposition-attested. Coverage: severity blocker or major (DEC-267); status answered, contested or verified (a disposition exists), excluding a finding already listed as an undisposed blocker so nothing is reported twice; withdrawn exempt; an out-of-vocabulary status counts as disposed, failing closed (RV-400 F-11); open findings not counted (open blockers already refuse, open majors are admissible at lock today). A finding is routed only when its route field holds a known Route value; absent, unknown, and a legacy route: prefix in the disposition all read unrouted, failing closed. The refusal names each finding with which of the three it is (STD-003); vocabulary_defects covers status and severity only, so the gate carries the disclosure itself. An out-of-vocabulary severity counts as severe, as the blocker check does. The refusal names the repair per status: answered - amend with --route; contested - dispose again with --route; verified - raiser reopen, then dispose with --route; out-of-vocabulary status - repair the status by hand edit, as the blocker check already requires. (Amended on RV-400 F-7 and F-11.)"
alternatives = ["Refuse review conclude while a severe finding is unrouted. Rejected: contradicts ADR-007 D-C8 ('open findings do not block conclude') and so needs a revision, and it binds audit and code-review ledgers unless separately gated by facet.", "Leave presence to the reviewing.md prose, as in the first window. Rejected: that is the delivery failure E12 measured."]
rationale = "The lock is the one moment the design's findings must be settled, it already reads the ledger, and it covers exactly the trial population (design-run reviews) with no ADR-007 revision. Failing closed on degraded values keeps a missing route a datum rather than a silence, which is DEC-265's measurement argument."
consequences = ["A verified finding without a route cannot be amended; the path is raiser reopen then responder dispose with --route. Accepted: it arises only when the rule was skipped, and is documented where the refusal names it.", "The gate is permanent code on a provisional axis (DEC-268); if the trial kills P10, removing it is part of that outcome.", "A waived review disposition bypasses the check, as it bypasses the blocker check."]
decided_by = "owner, on agent proposal (SL-270 design inq-1/inq-2)"
decided_on = "2026-09-27"

