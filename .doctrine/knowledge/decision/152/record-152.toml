[facet]                         # every field typed; seeded empty (captured later)
context      = "SL-247. The PreToolUse confinement wall's fourth arm (`resolve_target`, jail.rs:377 — agent_id present, not nominated, cwd not a project worktree) resolves `Reject`, denying Bash and Edit/Write to every ordinary subagent. No authority states a threat model for a non-dispatch, non-worktree subagent: the `Reject` arm was a dispatch-motivated fail-closed choice that incidentally caught them."
choice       = "An ordinary (un-nominated, non-worktree) subagent passes through unconfined — no repo-root floor, no write filter. The wall's remit is the worktree population only."
alternatives = [
  "A repo-root floor — `Jail(<main_root>)` rather than pass-through. This was the recommended option and it is CHEAP: `Target::Jail(PathBuf)` is already parameterised by exactly one path, and `bwrap_core_argv` (jail.rs:537) is `--ro-bind / /`, `--bind <p> <p>`, `--chdir <p>` with no worktree-specific logic, so the floor needs no new `Target` arm, no new match arm in `decide_bash`/`decide_write`, and no new plumbing. Rejected on what it would buy and cost in this environment, not on implementation cost — see the rationale.",
  "Broaden the nomination allowlist to cover ordinary subagents. Rejected — `PRIVILEGED_AGENT_TYPES` (jail.rs:122) is deliberately fused as both nomination-eligibility and `decide_agent`'s privileged deny-set (jail.rs:113-121, RV-258 F-1), so broadening it to win a PassThrough would simultaneously forbid jailed callers from spawning that type. This inverts SL-247's `OQ-2`, which read nomination as the machinery-reusing option.",
  "Carry the policy in `JailPolicy`. Rejected — its layout precondition confines it to `.worktrees/<name>`, it is consulted only under `Target::Jail`, and `deny_unknown_fields` makes any schema change breaking.",
]
rationale    = "The wall is a guard-rail against mostly-accidental holes in the primary tree, not adversarial containment (user, settling SL-247 `OQ-4`); RSK-225 already makes the stronger claim untrue on the Claude arm. Three legs decided it against the (cheap, recommended) repo-root floor. (1) DECISIVE, and environment-dependent: development runs inside an outer bubblewrap jail where `$HOME` and `/tmp` are already jail-local and disposable, so the only thing a repo-root floor additionally walls off is throwaway state. (2) The floor has a concrete, recurring cost: `Jail(p)` mounts `--tmpfs /tmp` (jail.rs:547-548), so a floored subagent gets a fresh empty `/tmp` and cannot see the orchestrator's at all — the session scratchpad lives there, and losing it wastes tokens on every delegation. (3) What disposes of the objection that the wall ships in the binary to consumer projects with NO outer jail: it is opt-in via hooks, so an unconfined non-worktree subagent there is no worse than not installing doctrine at all."
consequences = [
  "Ordinary subagents regain Bash and Edit/Write — the acute leg of IMP-401. IMP-269 and IMP-342 plausibly discharge with it; confirm at reconcile (SL-247 `OQ-3`), do not assume.",
  "The fourth arm's fail-closed posture — a subagent whose cwd or topology cannot be resolved is currently rejected, never silently jailed-nowhere (pretooluse.rs:94-97) — flips to fail-open unless the design keeps a discriminator. Carried into `inq-5`.",
  "`Jail(wt)` behaviour is unchanged and stays proven by the existing suites (the behaviour-preservation gate).",
  "What the wall guarantees must be restated where the posture is documented — SL-247 objective 4.",
  "The decisive premise is ENVIRONMENT-DEPENDENT. It holds inside doctrine's own outer bubblewrap jail; on an unjailed host, `$HOME` and `/tmp` are not disposable and a repo-root floor would stop an accidental write the pass-through does not. What makes pass-through safe to ship there is leg (3) — hook opt-in — not leg (1). Re-derive before carrying this decision to another environment.",
]
decided_by   = "user"
decided_on   = "2026-08-05"

