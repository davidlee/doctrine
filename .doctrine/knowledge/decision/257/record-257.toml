status = "accepted"
created = "2026-09-15"
updated = "2026-09-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "No agent can see the image and no jail has a raster viewer. Real `dot -Tpng` bytes are not byte-stable across graphviz versions, so they cannot enter a golden."
choice = "VH is the real test: the user runs doctrine graph <id> -X in ghostty on a small and a large graph, runs concept-map export -X, pipes -X to cat, and tries -X under tmux; the user judges the image and DEC-256's placement. VT scaffolds arrival and prevents silent regression without graphviz or a terminal, chosen for confidence per cost: logic tested pure over synthetic inputs (encoder framing and chunking, IHDR parse, placement table, window-geometry decision, format and geometry refusals, kitty support-reply classifier, graphviz outcome classifier with ExitStatus built from a raw wait status under cfg(unix)); exactly two real spawns (a nonexistent program yields ToolUnavailable, and a child ignoring a 1 MiB stdin still times out with wide margins); three CLI tests run outside any doctrine project (graph --format json -X, concept-map export --format mermaid -X, and concept-map export <id> -X with no --format off a terminal). No binary fixture. Amended 2026-09-15: the user's leaner ruling replaced the fixture and sleep-timing tests; RV-368 F-6 restored per-shell format wiring coverage."
alternatives = ["Add a VT against real graphviz checking the PNG signature which ties the suite to an installed dot", "A pty-driven end-to-end test re-proving bytes the encoder tests already pin", "A committed PNG fixture which the encoder never parses"]
rationale = "Whether the picture is right is a human judgement; the automated tests exist to make arrival incremental and to stop the non-visual layers regressing silently."
consequences = ["The suite needs no graphviz and no terminal", "classify is a pure function separate from the spawn", "The probe's raw tty I/O is proven only at VH", "DEC-256's rule is expected to be tuned after the VH run"]
decided_by = "user"
decided_on = "2026-09-15"

