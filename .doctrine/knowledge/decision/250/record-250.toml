[facet]                         # every field typed; seeded empty (captured later)
context = "EVD-029: commands/design.rs::apply materialises knowledge records in the mint loop, then runs a second run::apply (:1728), write_journal (:1740) and recheck_watermark_before_write (:1748) — so an authored record can outlive a revision that never landed. The two-pass structure is the intended guard and its doc already claims pass 1 refuses 'while the authored tier is still untouched'. RV-365 F-2 then established two corrections: the call order above (an earlier statement of this record put journal and recheck ahead of pass 2), and that the differential-refusal mechanism this record originally assumed is UNWITNESSED — pass 1 stands in provisional ids of the real shape precisely so both passes refuse identically (design.rs:1688-1701, D2), and the only value-dependent predicate on a resolved record is the 32-byte DESIGN_ID_BYTES bound at run.rs:1589-1596, which canonical refs of at most nine bytes cannot reach."
choice = "Hoist every check that CAN be hoisted ahead of the mints — on principle, not on a witness. The purpose is to make the guarantee the code already claims true BY CONSTRUCTION rather than by the accident that today's pass-2 predicates happen not to discriminate between a provisional id and a claimed one. Separately, state the residual the hoist cannot reach: recheck_watermark_before_write reads state that may change concurrently and runs after the mints, so it is inherently late. Leg 1's promise is then stated precisely: on a refused or failed submission the revision, the receipt and the change log are unmoved, and the authored tier is unmoved except across the named late-check window, whose recovery is the journal."
alternatives = ["Unwind record materialisation on refusal. Rejected: a compensating transaction is a SECOND writer of the authored tier, and this codebase has deliberately kept that single — it is where the next generation of this defect would live.", "Keep the ordering and disclose it only. Rejected as the whole answer: leg 1 is the slice's headline invariant, and an invariant with an undocumented exception is precisely what ISS-361 was reported against. Disclosure is the residual, not the fix."]
rationale = "The hoist is cheap and defensible as hygiene alone: a guarantee that survives only while nobody adds a value-dependent check to pass 2 is a coincidence with good manners, not a guarantee. Naming the residual converts an unstated exception into a stated one, which is what STD-003's disclosure principle asks of a degraded guarantee. Crucially the record no longer claims a defect it cannot witness — SL-259 refuses to close ISS-361 on a plausible story and must hold its own rulings to that standard (RV-365 F-2)."
consequences = ["The doc claim on apply's two-pass structure stops being aspirational and becomes true by construction rather than by coincidence.", "The carve-out in leg 1 rests on ONE mechanism — the late watermark check — not two; the differential-refusal mechanism is withdrawn as unwitnessed.", "Verification pins the hoist structurally (every hoistable check runs ahead of the mint loop) and the late window for recoverability through the journal; it does NOT manufacture a pass-1-clears/pass-2-fails case", " since a pin over a manufactured predicate proves only that the manufacture worked."]
decided_by = "SL-259 design run dr-01a08e32, revised under RV-365 F-2, user-directed"
decided_on = "2026-09-14"

