[facet]                         # every field typed; seeded empty (captured later)
context = "RFC-026 P10's first window (E12) measured delivery and found it absent. SL-270 enforces route presence at the design-run lock (DEC-326), fixes the route set at six (DEC-330, DEC-327, DEC-331, DEC-333), and must fix the second window's protocol before any eligible slice opens, since every mid-window change so far has been a confound. This decision carries forward DEC-276's collection procedure, minus the at-conclusion capture DEC-327 withdrew."
choice = "(1) ELIGIBILITY: a code-changing slice is eligible when its design run mints a review pass after the window opens (CHR-082 records the moment). The first 3 such slices, in order of pass minting, form the window; none is selected. A slice whose review is waived is recorded and skipped. A slice parked or abandoned after entering stays in the count, reported with its status. (2) BUILD FLOOR, checked and recorded at window open and at each eligible slice's design start: review dispose --help lists the six routes; the MCP server's review_dispose schema offers route with the six (reviewing.md is embedded in the binary, so these two cover the route prose); doctrine install is run at window open and the installed projections recorded as current. A failing check holds the slice until fixed; it is never counted without the floor. (3) PER SEVERE FINDING (blocker/major): route; for demonstrate, probe and control, whether the instrument produced the evidence it promised; L - whether the finding's repair or instrument obligation drew a related finding or a contest in the same ledger, a later design pass of the slice, or the slice's audit ledger, up to slice close. Same-ledger L alone is not the measure: instrument routes carry no prose repair, so it would fall by construction. (4) PER LEDGER, as counts: rounds and contests (journal, DEC-327), artefact-prose findings, findings against repair text, design line growth during review, later audit findings, slice completed. (5) SECOND RATER: re-routes blind from the same ledger JSON with the six-route prompt including the tie-break and the probe/control sentence (DEC-333); disagreements reported as disagreements, with kappa against E14's design-review value of 0.44. The prompt differs from E14's in three ways (six routes, tie-break included, probe/control sentence), so a kappa change is not attributed to any one of them. Probe/control disagreement is reported separately. (6) READING: no pass mark, and the headline is descriptive at this sample size. Route presence is a manipulation check on its gated population only: severe findings disposed on the final review pass at lock, where the lock forces 100%, so a miss there is a gate failure. Findings outside that population - open at lock, on superseded passes, or disposed after lock - are counted and reported separately, never folded into presence. The headline is L on routed findings against E12's window (same-ledger L 50-61%, the only baseline; E11 did not measure L), with the scope difference stated. Cases where a route needed the owner to interpret it are reported (a P10 kill condition). (Amended on RV-400 F-1, F-3, F-4, F-5, F-9.)"
alternatives = ["N = 5 slices. Rejected for now: more findings, but a longer window and more exposure to mid-window change; N = 3 matches the first window for direct comparison.", "Leave the method to the trial chore. Rejected: DEC-276's reason stands - a method chosen after outcomes are visible can be tuned to them."]
rationale = "Every lever that could move the answer after the fact - eligibility, collection, reading - is fixed now, and the build floor closes the stale-binary and stale-projection gap that could silently disable routing (SL-270 context finding 2)."
consequences = ["The trial chore carries this protocol and records each build-floor check.", "DEC-276 is superseded: its capture rule by DEC-327, its procedure by this record.", "Presence can no longer be a finding of the trial; the trial measures the mechanism."]
decided_by = "owner, on agent proposal (SL-270 design inq-7)"
decided_on = "2026-09-27"

