[facet]                         # every field typed; seeded empty (captured later)
context = "SL-273 introduces the lib: citation form and a DeepSeek citation sweep; the sweep needs a finish line, and client repos need the same resolution check over their own .doctrine/** prose."
choice = "One pure library — a lib: citation scanner plus the publication resolver — with two callers: a build-repo test over shipped files (the sweep's finish line) and a doctor check over client .doctrine/**."
alternatives = ["doctor leg only (IMP-309 shape)", "test-side scan only (e2e_no_shipped_couplings.rs precedent)", "two separate implementations"]
rationale = "The shipped corpus and client authored prose need the same resolution rule; one pure core avoids a parallel implementation while each caller owns only its file set and reporting."
consequences = ["the scanner and resolver sit beside the publication register and stay pure", "the build test gates the sweep's completion", "doctor gains a citation-resolution leg"]
