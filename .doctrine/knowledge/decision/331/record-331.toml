[facet]                         # every field typed; seeded empty (captured later)
context = "SL-270's scope proposed refusing --route on ledgers outside the design facet, making QUE-224's 'not extended' structural. That needed a revision to ADR-007 D-C5 and SPEC-032. Re-weighed against the evidence: E13's ground for not extending (owner-fix swamps audit and code-review findings) was withdrawn by RFC-026 E14, which found the taxonomy discriminates there unsteered (kappa 0.56 against 0.44 in design review); the surviving ground, that routing adds no instrument after code exists, is argued but unmeasured; and DEC-268's population concern is met by DEC-326, whose lock check fires only on design-run reviews, and by counting on facet."
choice = "No facet refusal. --route stays optional on every facet, as ADR-007 D-C5 and SPEC-032 already say. The design-review scope is held by DEC-326's lock check and the review-ledger.md scope line. No revision to ADR-007 or SPEC-032 is raised by SL-270."
alternatives = ["Refuse --route outside the design facet inside run_dispose/run_amend (the original scope item). Rejected: a revision, code and tests to guard against a harm the lock check and facet-scoped counting already prevent, on an axis DEC-268 calls provisional, and it forecloses the only cheap evidence from other facets.", "Warn rather than refuse. Rejected: new code for the same absent harm."]
rationale = "The refusal's empirical ground is gone and its protective job is already done elsewhere; what remains is cost."
consequences = ["SL-270 scope step 2 loses the facet refusal.", "QUE-224's recorded answer is edited to say the scope is held by the lock check and the docs.", "A voluntary route on an audit or code-review ledger is legitimate data, not a defect."]
decided_by = "owner (SL-270 design inq-4)"
decided_on = "2026-09-27"

