id = 256
slug = "render-at-native-size-when-it-fits-the-terminals-pixel-width-else-scale-to-columns"
title = "Place the image on an explicit cell rectangle: native if it fits, else scale to columns minus one"
record_kind = "decision"
status = "accepted"
created = "2026-09-15"
updated = "2026-09-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "The kitty protocol sizes in cells (c columns, r rows). After placement the cursor moves right by c and down by r, and if that leaves the screen or scroll area the cursor position is undefined (RV-368 F-4). c equal to the full terminal width from column 0 crosses the right edge; a height left to the terminal leaves the row count unknown to doctrine. A terminal that passes the DEC-259 probe reports columns, rows and pixel width and height through the window-size ioctl; a PNG carries its pixel width and height in the IHDR header."
choice = "Always send both c and r, and C=1 so the terminal does not move the cursor; doctrine then writes exactly r newlines, making scrolling deterministic. Cell size is pixel width over columns and pixel height over rows. If the PNG's native width in whole cells fits within columns minus one, use native size rounded up to whole cells; otherwise c is columns minus one and r follows the aspect ratio, rounded up. A terminal that does not report its pixel size is refused descriptively. Amended 2026-09-15 after RV-368 F-4; supersedes the earlier c-only rule and its unknown-pixel-width fallback. Amended 2026-09-17 at reconcile after RV-369 F-6: a CELL bound is not a RESOURCE bound. This rule bounds columns, deliberately does not bound height, and bounds nothing in bytes, so the whole corpus placed perfectly legally into a 199 x 237 cell rectangle on top of a 62 MiB PNG that ghostty silently declined, leaving 237 blank rows. The rule now carries a companion byte budget enforced between the spawn and the encode: MAX_IMAGE_BYTES = 8 MiB, calibrated to this corpus rather than derived from any published terminal limit, refusing with a message that names the two flags which narrow a graph. The placement rule itself is no longer provisional for the case it governs: VH-1 confirmed it in ghostty on the fixed binary. HiDPI was not separately exercised and remains a named risk."
alternatives = ["c only with default cursor movement which is undefined at the right edge", "Always native which clips wide graphs", "Fall back to c=columns when pixel size is unknown which reintroduces an unknown row count"]
rationale = "User judgement: fit to width only when needed. An explicit rectangle plus doctrine-written newlines removes every protocol-undefined cursor path; distortion is under one cell on each axis."
consequences = ["TerminalGeometry carries columns and rows and pixel width and height", " kitty reads PNG width and height from IHDR", " A tall image scrolls rather than being bounded vertically", " A rasterised PNG over MAX_IMAGE_BYTES is refused before encoding rather than placed (RV-369 F-6)", " VH-1 confirmed the rule for the case it governs; HiDPI remains unexercised"]
decided_by = "user"
decided_on = "2026-09-15"

