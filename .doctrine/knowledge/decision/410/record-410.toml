id = 410
slug = "install-out-of-repo-write-rule"
title = "Install may write outside the repo only to a harness's own user config"
record_kind = "decision"
status = "accepted"
created = "2026-10-23"
updated = "2026-10-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-286 inq-8 / scope objective 5. First user-level install write; later arms need a rule rather than reinventing one."
choice = "`install` may write outside the repo only when: the target is the harness's own user-level config; the write goes through the harness's own CLI where it has one, else a narrow-path, edit-preserving write to the harness's documented location (env override first, symlinks written through); the user consents first — a dedicated prompt naming the file, the change and its scope, with `-y` granting consent and documented as doing so; any baked path is an absolute binary outside the project being installed (DEC-404); every write names the target and the baked value in the report; and any degradation or decline is disclosed with a pasteable fallback. Never a file a client repo tracks."
alternatives = ["Leave the rule implicit in the codex arm"]
rationale = "Names the pattern once so the Claude/pi question (inq-9) and future arms follow it."
consequences = ["REQ-484 (SPEC-011) revised through a Revision (ADR-013) to the user-level form", "Supersessions: DEC-323, DEC-332, DEC-325 by this slice's records"]
decided_by = "user"
decided_on = "2026-10-23"

