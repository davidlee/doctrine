[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-395 assumed existing rollback covers every caller; the clean candidate arm leaves its detached worktree on provision failure (dispatch.rs:2247) and standalone `worktree provision` has no wrapper (worktree/mod.rs:388)."
choice = "Creation paths (fork_core; the WorktreeCreate hook passthrough; the coordination worktree; both dispatch candidate arms) compensate every resource they created on any provision failure, including fixing the clean-candidate worktree leak. Repair (standalone 'worktree provision') never deletes: it discloses what changed, exits non-zero, and is safe to re-run."
alternatives = ["Keep a created worktree and disclose degradation", "Uniform rollback for repair too"]
rationale = "A created half-provisioned worktree reproduces ISS-352's quiet failure; deleting a worktree under repair would destroy user work."
consequences = ["Supersedes DEC-395", "Per-caller failure-compensation tests"]
