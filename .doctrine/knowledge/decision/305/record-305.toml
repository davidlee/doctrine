[facet]                         # every field typed; seeded empty (captured later)
context = "design tree [SLICE] may omit the slice (DEC-304). The state tier holds many snapshots; unlocked runs of abandoned slices and idle design-status slices are common."
choice = "Candidates: snapshots whose stage is not locked, on slices not done or abandoned. Tie-break: newest snapshot file mtime (read in the command shell). Header names the chosen run and marks it chosen, e.g. SL-266 (latest of 4 open runs). No candidate: error naming design tree SL-NNN."
alternatives = ["Tie-break by highest slice number"]
rationale = "mtime tracks the run actually being worked; slice number is pure but picks a newer idle run over an older resumed one. STD-003 requires the choice be disclosed."
consequences = ["filesystem read confined to the command layer (ADR-001)"]
