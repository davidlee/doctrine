[facet]                         # every field typed; seeded empty (captured later)
context = "SL-253 inq-4. BackendId (backend.rs) is named by DEC-190 as kernel content but sits in a unit layering.toml classifies leaf, while conformance is engine; the node framed this as a new ADR-001 edge to check. Reading the map dissolves the framing: the rule is engine imports engine + leaf, so engine to leaf is the permitted direction, and conformance's own row already declares an edge to backend. Working the question surfaced a third kernel-to-payload reference DEC-196 did not enumerate — ConformanceBackend (conformance.rs:630) names PropertyRemoval, AuthorityGrant and Under in every method past as_capsule_backend, all three placed payload-side by DEC-196, so verify_over's &dyn ConformanceBackend parameter points the wrong way."
choice = "The kernel is extracted as its own unit and CLASSIFIES AS A LEAF; layering.toml gains one row for it and conformance — now the payload — keeps engine. That classification is a REQUIRED EXIT CRITERION of the slice: the architecture gate must classify the kernel unit leaf and pass. BackendId AND Availability MOVE INTO THE KERNEL (recut 2026-08-12; the original rider kept BackendId in backend.rs). backend.rs imports both from the kernel — a legal leaf-to-leaf edge with no cycle — and so do transaction.rs main.rs and conformance.rs; no re-export anywhere so one type keeps one name. The kernel then imports no other doctrine-control module at all. verify_over's backend parameter DROPS rather than narrowing to &dyn CapsuleBackend: SL-253's D10 takes BackendId and Availability as values instead so no backend trait survives in the kernel. ConformanceBackend goes to the payload with the rest of the construction vocabulary and the payload-supplied row runner captures its own concrete backend. The split stays a sub-module boundary within doctrine-control for THIS SLICE — scope not principle; IMP-404 holds the production crate boundary."
alternatives = ["Keep BackendId in backend.rs and give the compile probe a two-symbol fake module — the original rider; refused because the fake is a hand-maintained allowlist and widening it is exactly how a guard gets weakened to fit the code", "Project Availability into a kernel-owned value instead of moving the type — refused as an isomorphic copy; the projection would preserve every distinction so it buys nothing and adds a judgement of the class that has already been wrong three times", "Re-export BackendId from the kernel through backend — refused as a second name for one type; with the move there is one name and the edge points the other way", "Extract the kernel as a doctrine-qualification crate — the only shape that makes I7 compiler-proven in production; refused for SL-253 on scope and cost and left to IMP-404 with structural promotion triggers rather than a time-based promise"]
rationale = "The leaf classification is the real find and is unchanged: DEC-190's central claim is that the kernel is reviewable without loading a confinement mechanism and a tier is the one form of that claim a machine can check. What is recut is the placement rider. Its original argument — BackendId's open &'static str newtype is the contract's business and not the verdict's — was formed at inq-4 and never faced its counterexample: inq-8 minted AssuranceKey which SL-253 5.2.1 describes as exactly BackendId's shape and exactly its justification and which P3 places IN THE KERNEL. Keeping identically-constructed identity atoms on opposite sides of the seam has no merits-based defence; mechanisms minting a value determines its openness not its ownership. The consumer of a cross-mechanism contract owns the contract's shape and backends implement it. Availability moves on the same test that keeps ArmResult's diagnostics out — observational equivalence at the seam: two ArmResults differing only in termination/stdout/stderr can never change row_verdict so that quotient is narrower than the type and must be PROJECTED; every distinction in an Availability is consumed by the kernel and reproduced in its top-level verdict so that quotient IS the type and MOVING it beats inventing an isomorphic projection. The prize is the boundary probe: a kernel importing nothing from the crate needs no fake backend module and therefore has no hand-maintained allowlist a later agent can widen to turn a red target green — which is the exact failure mode R1 and F7 exist to prevent. Crate extraction is declined for cost not principle: pub(crate) to pub on every kernel item; the layering gate is blind across crate boundaries so the exit criterion would be falsified rather than met; just gate's test-all names its packages so a new member is not auto-gated; and IMP-404 warns against speculative extraction before a second consumer forces an interface."
consequences = ["layering.toml gains one row for the kernel unit at leaf; conformance keeps engine; no existing classification moves", "EXIT CRITERION — the architecture gate classifies the kernel unit leaf and passes. ISS-326 does not void it: the gate flags any unit appearing as an edge target and backend/conformance/transaction/main all import the kernel", "Import-line churn in five files — backend.rs backend/bubblewrap.rs transaction.rs main.rs conformance.rs — three of which this slice already opens", "A harness=false cargo test target compiles qualification.rs into a synthetic crate with NO fake module; compilation is the assertion and a negative control is required at implementation or the probe can be present and non-load-bearing", "The probe proves the kernel needs no other doctrine-control module. It does NOT prove std-only: the target stays in the doctrine-control package so that package's external deps remain nameable and duplicated constants stay invisible. That residual belongs to R1", "Kernel and payload stay pub(crate) within doctrine-control for this slice — a scope boundary not a principle; IMP-404 carries the crate extraction"]
