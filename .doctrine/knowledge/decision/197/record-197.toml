tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-253 inq-4. BackendId (backend.rs) is named by DEC-190 as kernel content but sits in a unit layering.toml classifies leaf, while conformance is engine; the node framed this as a new ADR-001 edge to check. Reading the map dissolves the framing: the rule is engine imports engine + leaf, so engine to leaf is the permitted direction, and conformance's own row already declares an edge to backend. Working the question surfaced a third kernel-to-payload reference DEC-196 did not enumerate — ConformanceBackend (conformance.rs:630) names PropertyRemoval, AuthorityGrant and Under in every method past as_capsule_backend, all three placed payload-side by DEC-196, so verify_over's &dyn ConformanceBackend parameter points the wrong way."
choice = "BackendId stays in backend.rs — no move, no re-export, no re-classification of anything existing. The kernel is extracted as its own unit whose imports are std, backend (leaf) and host (leaf), so it CLASSIFIES AS A LEAF; layering.toml gains one row for it and conformance, now the payload, keeps engine. verify_over's backend parameter narrows from &dyn ConformanceBackend to &dyn CapsuleBackend — it calls only id() and availability(), both leaf-side — and ConformanceBackend goes to the payload with the rest of the construction vocabulary, the payload-supplied row runner capturing its own concrete backend. The leaf classification is a REQUIRED EXIT CRITERION of the slice, not a happy consequence: the architecture gate must classify the kernel unit leaf and pass."
alternatives = ["Move BackendId into the kernel — refused because it inverts the edge: backend (leaf) would import the kernel, forcing the kernel leaf anyway or promoting backend to engine and cascading into transaction and provision", "Re-export BackendId from the kernel — refused as a second name for one type across the same dependency edge, buying nothing the placement does not already give", "Amend DEC-196 to enumerate the ConformanceBackend reference — declined by the owner: it is a refinement in DEC-196's direction rather than a contradiction, and re-cutting a decision for something it implies is churn"]
rationale = "BackendId's own doc comment states why it belongs to the backend contract — a &'static str newtype rather than a closed enum, deliberately open so a profile nobody has written yet mints its own constant (DEC-156). That is the contract's business, not the verdict's, and DEC-190 naming it as kernel content reads as the kernel depends on it and must not close it. The leaf classification is the real find: DEC-190's central claim is that the kernel is reviewable without loading a confinement mechanism, and a tier is the one form of that claim a machine can check. Made an exit criterion so a later phase reaching for provision or transaction fails the gate rather than quietly re-entangling the file. The ConformanceBackend narrowing is what makes the classification hold rather than merely look plausible — verify_over's only uses of the backend are id() and availability()."
consequences = ["layering.toml gains one row for the kernel unit at leaf; conformance keeps engine; no existing classification moves", "EXIT CRITERION — the architecture gate classifies the kernel unit leaf and passes. A kernel reaching provision or transaction fails the gate", "verify_over's signature changes a second time: the backend parameter narrows to &dyn CapsuleBackend or drops. Folds into inq-5's behaviour-preservation argument alongside DEC-196's RowId re-keying", "ConformanceBackend joins the payload. SL-253 Objective 1 and the research codemap both list it as a kernel candidate; both are superseded on this point", "Kernel and payload stay pub(crate) within doctrine-control — bin-only, publish = false — so the split is a sub-module boundary, never a crate boundary"]
decided_by = "owner"
decided_on = "2026-08-12"

