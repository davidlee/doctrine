updated = "2026-10-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-400 excluded BootWiring because it can edit tracked files, but BootWiring also writes gitignored harness config absent from every fork (.mcp.json, .claude/settings.local.json, .pi/settings.json, .codex/config.toml in this repo). Regenerating the boot snapshot needs render_boot_map injected from commands::cli. Every harness's session hook runs 'doctrine prompt resolve', which regenerates boot.md. A full install on a committed, wired clone changed only the tracked version stamp."
choice = "Regenerate = MemorySync + BootWiring + Convergence (install's forward legs minus LegacyStarters). No boot snapshot leg, no local marker, no tracked stamp. Guard: BootWiring is planned dry-run first; if it would change a tracked file, regeneration refuses (creation rolls back, repair leaves the worktree untouched) with 'run doctrine install in the source and commit'."
alternatives = ["DEC-400 legs (no BootWiring; regenerate boot snapshot)", "Allow tracked wiring changes and disclose them"]
rationale = "Forks need the ignored harness config for MCP and session hooks; hooks then regenerate boot.md in every harness, so no command_map plumbing. On a committed, wired source BootWiring writes only ignored files; a tracked change means stale source wiring, which a worker diff must not carry into the import funnel."
consequences = ["Forks get doctrine MCP and session hooks for every installed harness", "Stale committed wiring in the source blocks provisioning until fixed", "Hook commands use ${DOCTRINE_BIN:-doctrine} so wiring is binary-path independent"]
decided_by = "user"
decided_on = "2026-10-23"

