[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-116's `cargo clippy --workspace` now selects crates/doctrine-control, which RV-353 F-4 removed from every default selection; DEC-116 also left the adapter crate's tests out of the gate."
choice = "One justfile variable names the gate's packages; test-all and a new lint-all both expand it; gate runs lint-all; the adapter crate joins the list; doctrine-control stays with capsule-check."
alternatives = ["Name packages separately in lint-all and test-all (two lists that can drift)", "cargo clippy --workspace --exclude doctrine-control (auto-gates new members, reversing RV-353's opt-in selection)"]
rationale = "Keeps RV-353's explicit opt-in selection while making lint and test coverage of the gate one list that cannot half-change."
consequences = ["Adding a gated crate is one edit", "New workspace members are still not auto-gated", "The adapter crate is tested at the gate, not only linted"]
