[facet]                         # every field typed; seeded empty (captured later)
context = "SL-253 inq-5. AGENTS.md requires existing suites green unchanged for shared machinery; DEC-190 names RV-352's baseline as the bar; DEC-191 requires the output to change; no record reconciled them. Three shape changes taken in this design run compound it — DEC-196's RowId re-keying, DEC-197's backend-parameter narrowing, DEC-198's floor/profile key split — each editing test source that names the moved types, so green unchanged cannot be literally true. Two gate facts constrain the answer: just gate's test-all NAMES its packages (-p doctrine -p cordage) and crates/doctrine-control sits outside every default selection (RV-353 F-4, on ISS-342/ISS-343); the crate is reached by just capsule-check and just capsule-verify, the latter deliberately not wired into gate because RV-352 F-8 left open what a host failing the rows should report. EVD-022 captured the pre-split run at 4662e64eb, in-jail, before any code lands. RECUT 2026-08-12 by SL-253's second review pass, finding fnd-11: the original layer 2 — a closed list of three permitted differences — cannot express what the split does to the artefact. Front labels are new content on a line rather than a {:?} re-spelling of RowId. And the floor row leaves the flat row list entirely: after the split, table A row 3 lives inside Floor and has no (RowId, RowVerdict) entry, so `row Property(DeniedCanonicalStateAndCredentials)=Proven` has no successor at all. A deletion is not an exception to a list of exceptions; it is a hole the list has no vocabulary for."
choice = "The bar is stated in three layers and both instruments are used. LAYER 1 INVARIANT — the nineteen row-to-verdict mappings, the four auxiliary claims and the two unrowed readings reproduce exactly. LAYER 2 — a CLOSED TRANSFORMATION CONTRACT (recut 2026-08-12, replacing the original list of three permitted differences). The contract is a TOTAL MAP from the pre-split artefact's lines to the post-split artefact's, and its two totality clauses carry the weight: every pre-split line has EXACTLY ONE successor, so nothing may silently disappear; and every post-split line has EXACTLY ONE predecessor, so nothing may silently appear. Seven rules. (1) The header line `backend= os= kernel= arch= date=` is byte-identical — SL-253's D9 keeps the rendered `date=` key. (2) `outcome=<word>` becomes the floor's standing plus the published profile, which is DEC-191's one licensed semantic change. (3) `row Property(DeniedCanonicalStateAndCredentials)=V` becomes `row Floor(...)=V`, DERIVED FROM FloorReading rather than from the row list, because after the split the floor row has no (RowId, RowVerdict) entry and would otherwise vanish. (4) Each of the thirteen other `row Property(X)=V` lines becomes `row Assurance(<key>)=V front=<front>` — the key spelling per DEC-198, the front label riding the EXISTING line rather than arriving as a group header. (5) The five `row Axis(A)=V` lines are byte-identical; the renderer reconstructs RowId::Axis(axis). (6) The four claim lines are byte-identical. (7) The two observation lines are byte-identical. Two clauses sit outside the line map: the assurance block is ORDERED BY FRONT, a stated permutation rather than an unlicensed difference; and the process exit code moves EXIT_REFUSED to EXIT_DISQUALIFIED per DEC-194. A line the contract does not derive is a regression. LAYER 3 MECHANICAL — test source naming moved types is translated and reviewed as a translation diff in which no asserted value moves. INSTRUMENTS — just capsule-check is the per-phase gate, green at the end of every phase; just capsule-verify is a PHASE EXIT CRITERION for every phase touching the payload and the default for any phase where it is arguable, only a phase that plainly cannot reach a row omitting it. BOTH NEED bwrap (corrected 2026-08-12; this record originally said capsule-check did not) — cargo test -p doctrine-control provisions real capsules at conformance.rs:6915, :7244 and :7453, and EX-14 forbids them skipping. ARTEFACTS — a committed KEY TRANSLATION TABLE authored in the phase that changes RowId, so the post-split comparison is mechanical rather than a judgement at audit; a CHARACTERISATION TEST recording the row-to-verdict mapping as data, written before the split and carried through it mechanically; and a WHOLE-OUTPUT GOLDEN TEST committed in the same phase as the translation table, asserting the post-split artefact verbatim so the contract's two totality clauses are checked by a machine rather than by a reader at audit."
alternatives = ["Add a fourth and fifth entry to the original list of permitted differences — one for the front labels and one for the floor row's successor — refused because it does not close the class: the sixth and seventh differences arrive at implementation when the pressure is to ship and each would then be an owner decision taken under exactly that pressure", "Keep the enumerated-exception form and widen it as needed — refused because an exception list makes the design pay a governance cost each time it is honest about what it does; SL-253's D9 already declined a one-rendered-key change on that basis which is the right instinct with the wrong mechanism", "Algebra-only — lean entirely on verify_over's injected seam with hand-built row sets and scripted runners treating the live run as optional — refused because it proves nothing about the payload which is where the fourteen rows live", "Artefact comparison alone without the characterisation test — superseded by the owner taking both: an executable assertion fails at the phase that broke it and a compared artefact fails at audit", "One slice-level capsule-verify run at the end — refused because a regression's cause would then be bisected across several large mechanical phases"]
rationale = "Green unchanged is not achievable across three type-shape changes, and asserting it would let the slice redefine its own bar silently. What RV-352 actually measured is the row-level verdict, and that is exactly what DEC-191 does not touch: the collapse and the rendering change, the row outcomes do not. The recut is about the FORM of layer 2, not its strictness. An enumerated exception list is stated against a baseline of identical, so it can only ever say which lines are allowed to read differently — it has no vocabulary for a line that ceases to exist, which is precisely what happens to the floor row, nor for content added to a line, which is what a front label is. Worse, it inverts the burden the wrong way: under exceptions an unlisted difference is a regression IF SOMEONE NOTICES, and the noticing is unpaid-for reviewer attention at audit. A total map makes every post-split line something that must be DERIVED, and the whole-output golden test does the noticing. That is P2 — make the wrong state unrepresentable rather than guarded — applied to the preservation bar itself: widening the licence stops being a judgement nobody is making and becomes an edit to a contract with a failing test beside it. The cost is accepted and named: the contract is deliberately brittle, and a later legitimate change to the assurance ordering or to a line's shape must amend it rather than be absorbed. The rendering is constrained to fit rather than the contract widened to admit it — no standalone group headers, since a header line has no pre-split predecessor and nothing would derive it; grouping carried by ordering alone. The characterisation test costs a throwaway scaffold written against types with a two-phase lifespan, accepted because it moves the failure from audit time to the phase that caused it. Running capsule-verify often is cheap on this host — EVD-022's run completed in-jail without difficulty, and capsule time-to-interactive is about two minutes from capsule-baseline — so the default leans to more often rather than less."
consequences = ["LAYER 2 IS A CONTRACT NOT A LIST — a post-split output line the contract does not derive is a regression; so is a pre-split line with no successor", "The transformation contract must be WRITTEN BEFORE the phase that changes RowId because the whole-output golden test consumes it", "A WHOLE-OUTPUT GOLDEN TEST is a committed artefact of the phase that changes RowId; it is what makes the two totality clauses machine-checked rather than reviewer discipline", "THE RENDERING IS CONSTRAINED NOT LICENSED — no standalone group headers; one self-contained line per assurance row carrying its front label; a derived `row ...=` successor for the established floor row; byte-identical axis lines. SL-253 § 5.4 carries the constraints and § 9.1 the contract", "The contract is deliberately brittle: a later change to the assurance ordering or to a line's shape must AMEND it rather than be absorbed. That is the feature — widening becomes visible where it used to be a judgement nobody was making", "EVD-022 is the pre-split half of a bracket; the post-split run is its pair compared under the transformation contract rather than as a text diff", "PHASE EXIT CRITERION — just capsule-verify green for every payload-touching phase and by default for any arguable one", "PER-PHASE GATE — just capsule-check green at the end of every phase", "BOTH INSTRUMENTS NEED bwrap — this record's original claim that capsule-check does not is WITHDRAWN (SL-253 RF-4); a host without bwrap has no instrument at all until IMP-427 lands", "The key translation table is a committed artefact of the phase that changes RowId never reconstructed at audit", "A characterisation test recording row-to-verdict as data is written pre-split and carried through; it is scaffolding with a short lifespan and is expected to be retired or rewritten once the split lands", "just gate stays the wrong instrument for this slice and doctrine-control is not wired into it; RV-352 F-8's open question about what a failing host should report is untouched"]
decided_by = "owner"
decided_on = "2026-08-12"

