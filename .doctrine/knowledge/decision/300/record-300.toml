updated = "2026-09-25"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Two cumulative conditions bind the inquiry map - initial-concerns-recorded and user-accepts-sufficiency - and coverage_moved compares the union of keys, so adding a node, adding a needs or parent edge, or re-wording a question voids both and re-faces the human gates at inquiring->drafting, drafting->reviewing and reviewing->locked. DEC-062 says ordinary inquiry-map maintenance does not require human approval; the implementation required exactly that. But the derived blocking-inquiries-dispositioned quantifies over the DECLARED blocking set and relies on that map-moved staleness to force a re-declaration rather than silently re-reading the map, so narrowing the binding alone would let a newly-added blocking question pass unblocked."
choice = "Narrow the two attested rows' map comparison so that additions do not invalidate them, and add a derived cumulative condition requiring the map's additions since the recorded declaration to be re-declared before the next edge. The declaration's confirmation digest binds the declared set and not its coverage, so re-declaring an unchanged set is free and re-faces nobody; re-declaring a changed set moves the digest and trips ConfirmationStale, which is exactly when the delta should be shown. AMENDED 2026-09-25 (SL-264, DEC-302): the mechanism changes and the intent does not. The derived cumulative condition is not needed, because the blocking set stops being a free-standing agent act and becomes a derived projection of a per-node blocking attribute; the two attested rows' narrowing stands, and initial-concerns-recorded's coverage compares blocking membership over the full set so an added blocking question moves the user's act. R4 is closed by construction rather than by a ninth condition. DEC-302 records the decision."
alternatives = ["Narrow only, letting change rows and the envelope carry the guard - rejected: nothing refuses, so a new blocking question can pass, and the slice's own VT-1 requires that it cannot.", "Narrow plus an explicit non-blocking warning, per DEC-101's stale-warns precedent - rejected: an unseen warning is worth nothing (ISS-299), and enforcing that it is seen is the blocking condition in weaker clothing."]
rationale = "DEC-120 holds that liveness is the whole mechanism of an attested act, and DEC-067 that only dependent evidence goes stale. The human's judgement is about the content they were shown, so a later addition is not evidence that the judgement was wrong; the blocking set, by contrast, is the agent's assertion about the current map and must be current for the derived row to mean anything."
consequences = ["No ninth condition is added (amended 2026-09-25 by DEC-302); install/design-run-stages.md and its render pins regenerate for the single-act initial-concerns rule.", "DEC-062's reconciliation needs a separate record because revises cannot target a DEC.", "The two attested rows' binding narrows to what the act originally covered."]
decided_by = "user"
decided_on = "2026-09-25"

