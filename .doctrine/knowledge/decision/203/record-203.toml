[facet]                         # every field typed; seeded empty (captured later)
context = "QUE-214 asked Pole A or Pole B, and research thread 4 recommended B on a framing that treats worktree parallelisation and the dispatch workflow as one thing. DEC-202's choice text — 'provision each worker as a clone rather than a linked worktree' — reads as a claim about worktrees when its subject is dispatch workers. The owner's actual position, stated at design: the capsule pattern becomes the expected default for aggressively parallelised autonomous implementation, dispatch as currently understood will be replaced by capsules, and worktrees are a separate capability that stays in the primary clone."
choice = "Bounded Pole B. Take every deletion the clone forces on the WORKER side — clone provisioning, confined-subprocess spawn, DOCTRINE_WORKER env identity in place of the disk marker, worker self-commit, worker_commit retirement, and fetch-from-clone in place of the working-tree-diff import belt. Leave ADR-012's coordination worktree, its projection and its class routing untouched. Solo /worktree isolation is untouched and remains the worktree capability's home."
alternatives = ["Full Pole B — additionally demolish the coordination worktree, the branch-point guard and the projection machinery. Rejected: it falsifies ADR-012 D1, which is accepted and which SL-254's governance survey does not carry, and it spends the slice's budget rewriting the exact surface the capsule cutover replaces.", "Pole A as QUE-214 states it — keep worktree parallelisation and delete only what the claude arm's retirement forces. Rejected: it either reopens DEC-202's clone provisioning or bolts the incumbent transport onto a clone topology whose premises (read-only .git, linked-worktree marker identity) no longer hold.", "Reopen DEC-202. Rejected as unnecessary: its direction is right and only its expression is under-nuanced. DEC-202 is proposed rather than settled, so its choice text is corrected in place rather than retracted."]
rationale = "Worktrees and the dispatch workflow are separate capabilities that DEC-202's phrasing conflated. Worktrees serve isolation in the primary clone and stay; dispatch-as-currently-understood is scheduled for replacement by capsules. That split draws the boundary. Work that moves the worker toward the capsule shape is on-path and pays twice — once here as incumbent simplification, once at the capsule cutover as work already done. Work that reworks orchestrator-side integration machinery is investment in a surface with a scheduled replacement. The transport is the case that looks like the second and is actually the first: once the worker self-commits into its clone the import belt has nothing to import — clean tree, work in a commit — so `git fetch <clone> <branch>` is the smaller mechanism, not the larger one, which is what research thread 4 meant by the surviving core re-homing onto a strictly simpler transport. The two-provisioning-paths objection raised at design is void: dispatch on clones beside /worktree on linked worktrees is the intended terminus, not duplication."
consequences = ["SL-254's governance landing stays inside the surveyed set — ADR-011, ADR-006 D2b, SPEC-021, SPEC-012, STD-001. ADR-012 is not touched and does not join the REV.", "The disk marker, worker_commit, the SubagentStart stamp, the four worktree pretooluse matchers and the claude-force-subprocess-dispatch key all go. The marker's retirement is mechanical rather than chosen: is_linked_worktree is false for a clone by construction (shared.rs:54-58), so describe_mode's marker leg (marker.rs:89) can never fire for a dispatch worker.", "describe_mode's truth table must be re-cut for a topology where not-linked is the expected case rather than the anomaly — carried by inq-7. Left undone, every legitimate worker gets the DUAL_CAUSE diagnosis telling the operator to re-dispatch or unset the env.", "The import belt's working-tree-diff path is replaced by fetch-from-clone. The branch-point guard re-homes onto fetched refs rather than dying — checking C^ == B works the same on a fetched branch.", "DEC-202's choice text is corrected in place to name dispatch workers rather than a bare 'each worker', so the record stops reading as a claim about worktrees. DEC-202 is proposed, so this is an edit and not a REV.", "/worktree solo isolation is untouched. The linked-worktree machinery — create.rs, gc.rs, inventory.rs, fork.rs, claim_lock.rs — survives in full to serve it; dispatch simply stops calling it."]
decided_by = "user"
decided_on = "2026-08-13"

