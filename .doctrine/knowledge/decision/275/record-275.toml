slug = "compound-findings-take-a-deterministic-route-precedence"
title = "Compound findings take a deterministic route precedence"
record_kind = "decision"
status = "accepted"
created = "2026-09-20"
updated = "2026-09-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-260's routing convention requires the responder to emit exactly one route token from a closed set of five for every blocker or major finding. RV-371 F-6 established that the five routes are not mutually exclusive: RFC-026 E11 says its own classification axes mix, and a single severe finding can readily ask both a probe question (does the mechanism withstand the adversary) and a review question (should we accept this exposure). The drafted convention had only a no-default rule, which handles the responder who cannot tell which question is being asked; it said nothing about the responder who can tell that two apply. A mandatory single-token field with an ambiguous pair and no tie-break is an operational defect, and P10's own would-kill list includes 'the routes need the owner to interpret'."
choice = "A four-step decision procedure, ending in a fixed order so the answer is deterministic rather than a judgement. (1) Route on the claim whose failure would make the rest of the finding moot. (2) If two still fit, prefer any route other than review, because a route that ends in an act narrows an argument prose would only restate - owner-fix counts here even though it is not an instrument route. (3) If two non-review routes still fit, take the first of owner-fix, control, probe, demonstrate - owner-fix leads because a fact with two contradictory owners cannot be probed until one of them is gone. AMENDED 2026-09-20 (owner ruling): steps 2 and 3 originally turned on 'instrument route', which by this design's own definition excludes owner-fix, so the pair review + owner-fix - RV-371 F-6's own second example - fell through unresolved. Recast on 'other than review', the two steps are total over the five. (4) Where the finding carries a genuinely separable second arm, the responder NAMES it in --response; since findings are immutable and only the raiser may raise, the second arm becomes a sibling finding rather than a second route."
alternatives = ["Leave it to judgement with a heuristic. Rejected: it adds an interpretation where P10's would-kill condition is precisely that the routes need interpreting; a fixed order costs one sentence and removes one", "Allow a compound token such as route:probe+review. Rejected: it breaks the single-token recording shape the counting method and DEC-263's ledger-readability argument both rest on", " and it lets a responder avoid choosing", "Let the responder split the finding in place. Foreclosed: a finding is immutable and raise is the raiser's verb; splitting in place would need a src/ change"]
rationale = "The tie-break is deterministic so that two responders facing the same finding reach the same token, which is what makes the trial's per-finding counts mean anything. Step 2 encodes P10's own reasoning about why instruments were introduced. Step 4 is the only structural answer this design offers to R5, the twin-arm failure mode observed four times in RV-370: it converts a silently dropped second arm into a named one. It does not solve R5, because it only fires when somebody notices the twin."
consequences = ["The convention text gains a four-step 'when more than one route fits' block on the fixed fragment only", "R5's mitigation moves from wholly partial to partial-and-named for the compound case", "The rule is unenforced by construction and joins the CON-006 register: nothing parses the disposition", " so nothing can observe that the precedence was applied", "The trial can observe at ledger grain whether responders reached for the precedence rule", " since a named second arm leaves a sibling finding behind"]
decided_by = "owner"
decided_on = "2026-09-20"

