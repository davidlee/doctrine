  "SL-244 slice-244.md Non-Goals -- 'the wire acts, the artefact storage, the runbook steps and the CLI rendering are the follow-on'",
  "IMP-391 What is here -- five deliverables, of which the first two are the wire acts and the artefact storage",
  "SL-243 design run dr-019fc13a-24f5-75b3-be8f-5bee1529c172 rev 28 -- at drafting, three sections, nine resolved nodes; the one live run owing a repair",
]
contradicts = []
notes       = [
  "The cumulative-reach consequence is what makes this a decision rather than a correction: activating a row on the bottom edge guards every edge above it, so the cost lands on runs that have already left exploring.",
  "Activation's retirement is a consequence, not a separate decision -- it follows from the design's own rule that an unbuildable arm needs no activation exception.",
]

