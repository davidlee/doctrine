id = 302
slug = "blocking-is-a-node-attribute-and-the-blocking-set-is-derived"
title = "Blocking is a node attribute and the blocking set is derived"
record_kind = "decision"
status = "proposed"
created = "2026-09-25"
updated = "2026-09-25"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-264. The agent's free-standing blocking-set-declared act carries a list of node ids; it is a second representation of a fact the node itself can hold. The user reviews it beside the map, while initial-concerns-recorded's own guidance already instructs the agent to show the tree with the blocking ones marked. RV-386 F-2 showed the act model's hole: re-declaring an unchanged set over a larger map is free, so a question the agent judges blocking can be omitted and pass unseen."
choice = "blocking becomes a node attribute: required on creation (null refused), optional on update, stored Option(bool) where None means an unjudged legacy node, and a member of NodeMaterial. Every creation path judges: import seeds blocking true. A node's effective judgement is its own, else its membership in the stored legacy set, resolved per node. The blocking set derives as open nodes whose effective judgement is blocking. initial-concerns-recorded becomes a single user act (GraphReviewed) under a new Coverage::ReviewedGraph that compares material over carried keys and effective blocking membership over the full set; user-accepts-sufficiency keeps Coverage::InquiryMap narrowed to material over carried keys. CoveredSet::moved takes the rule's Coverage so the gate and the change log share one predicate. The blocking-set-declared key leaves the payload contract and parser, but AgentAct::BlockingSetDeclared and ActKind::BlockingSetDeclared stay as legacy read-only variants so stored snapshots parse; a stored confirms digest is still compared (frozen) and reported as ConfirmationStale. blocking is one wire key with two homes: Finding create-only (unchanged) and Inquiry either state. A NodeBlockingChanged change event joins the emittable roster. AMENDED 2026-09-25 under RV-386 F-6..F-14."
alternatives = ["Keep the act and constrain it to the derived set - rejected: two representations plus an admission consistency check; and a set act can still omit a node so F-2 stays open", "Narrow the guarantee and ship a set-act guard - rejected: throwaway machinery that leaves R4 open by design", "Re-face the human on every addition - rejected by DEC-300", "Delete the legacy act variants outright - rejected under RV-386 F-7: most stored snapshots hold the act and the snapshot is parsed whole"]
rationale = "One representation and one API: the set is exactly the node judgements, and the user's existing review binds nodes and blocking marks together. It closes R4 against the human rather than only the agent, which is what OQ-4's blocking-not-a-warning asked for. DEC-126's kind axis is untouched - no EngineSource and no new derivation rule - because the condition stays Attested and only its coverage projection changes."
consequences = ["New submissions of blocking-set-declared are refused; stored ones are read only", "install/design-payload-contract.md and install/design-run-stages.md regenerate", "The wire-key table admits a key with more than one home", "NodeBlockingChanged joins the emittable roster and its fixture ladder", "Judging a covered legacy node re-faces its acts once", "DEC-300's mechanism is superseded and its intent kept", "DEC-121's two-act letter is amended: both actors' judgements remain but the agent's is node state"]
decided_by = "user"
decided_on = "2026-09-25"

