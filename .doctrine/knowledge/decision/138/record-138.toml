id = 138
slug = "review-disposition-binds-the-responders-turn-not-the-raisers-assent"
title = "Review disposition binds the responder's turn, not the raiser's assent"
record_kind = "decision"
status = "accepted"
created = "2026-08-03"
updated = "2026-08-03"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context      = "DEC-125 gives `review-disposition-attested` two arms — `Conducted { review }` and `Waived { reason }` — and no admissibility rule for either. An SL-244 draft made `Waived` inadmissible over live blocking findings, requiring `Conducted`. That is the prohibition-shaped fence the same design refuses for the review policy, and it removes the user's exit exactly where it is wanted."
choice       = "`Conducted { review }` satisfies the row while the minted RV carries no finding that is both `blocker`-severity AND in `open` or `contested` state — a per-finding predicate, not the review-level `await`. `Waived { reason }` satisfies it unconditionally — before a review, or over live findings. Both arms are user acts carrying an `AcceptanceDeclaration`, so each must be presented in the user's name and each lands in the change log. Waived findings stay on the RV, undisposed and visible, beside the stated reason."
alternatives = [
  "`Waived` inadmissible while blocking findings are outstanding, forcing `Conducted`. Rejected: prohibition does not fence an agent that drives the CLI — this design's own argument for a mutable review policy — and it leaves `withdraw`, meaning raised in error, as the user's only exit. That is the dishonest spelling of 'I have read these and I am proceeding'.",
  "Require terminal resolution (`verify` or `withdraw`), matching the RV close-gate D-C9b. Rejected: it blocks on {open, answered, contested}, so the responder's disposal moves a finding to `answered` and the edge stays shut — no act available to the responder opens it, only the raiser's `verify` or `withdraw`. The chosen predicate differs by exactly that one state. Note what this does NOT claim: `contest` moves `answered → contested` (review.rs:2354), which blocks again, so a raiser can re-block repeatedly. The property is that the responder always holds a clearing act, not that contest is harmless.",
  "Bind on the review-level `await == Responder`. Rejected on reading the code: `derived_status` (review.rs:1009-1022) reads `status` only and never `severity`, so a single open `nit` would hold the edge; and its own doc calls `await` a priority summary for display, `never an exclusive gate — the turn gate is per-finding can`. The predicate this row needs exists nowhere yet: D-C9b's `doc_unresolved_blockers` (review.rs:1490) is the same filter minus the state restriction.",
  "Bind to content currency rather than to the finding set. Already rejected by DEC-126: integrating a finding moves the sections the pass covered, which RFC-026 E3 refutes as a termination rule.",
]
rationale    = "The fence that works here is the one this design uses everywhere else — authority and visibility, not prohibition. The two halves are load-bearing together and neither survives alone: blocking on undisposed blockers is safe only because the waiver is an unconditional exit, and the waiver is safe only because it is a user act that leaves the findings standing and the reason logged. Be precise about what the block gives. The responder always holds an act that clears it, which terminal resolution does not. It does NOT bound the interaction: finding state is not monotone — contest cycles `answered` back to `contested` — so a determined raiser can make the responder respond repeatedly. Termination comes from the waiver, not from disposal, which is the second reason that arm cannot carry a precondition."
consequences = [
  "Severity is the ledger's own `blocker`, not a new notion — DEC-125 brings it for free, and it is already the only severity that gates anything (D-C9b).",
  "Two gates read one RV under different rules: this row on undisposed blockers for the design run's `reviewing → locked`, and D-C9b's close-gate on the slice, which requires terminal resolution. Different subjects, so not duplication — but the asymmetry must be stated in the design or it reads as a bug.",
  "The fence is presentation and trace, NOT prevention. `--as` is cooperative role assertion and not a security boundary (ADR-007, review.rs:2813), and an `AcceptanceDeclaration` cannot distinguish a user's payload from an agent's — DEC-088's standing limitation. What both arms buy is that the choice must be made in the user's name and leaves a change row. Any implementation must preserve that; none can promise more.",
  "`Conducted` is admissible only over an RV carrying a concluded-pass marker. Without that rule it would be satisfied on entry to `reviewing`, since DEC-125 mints the RV there and this record's predicate is universally quantified over the finding set — it never reads `status` — so it is VACUOUSLY TRUE on an empty ledger. Corrected 2026-08-04 (RV-344 F-8): an earlier wording argued this from the review-level status instead, `an empty ledger reads (Done, None)`, which is wrong twice. It is wrong as governance — ADR-007 D-C8 fixes an empty ledger at `active`/`raiser` precisely so an implementation can never mistake no-findings-yet for completion — and wrong as an argument, since this record rejects binding to `await` on D7's ground, so what that value returns cannot be the hazard. ISS-314 records that the incumbent `derived_status` does return `(Done, None)` against the ADR; that is a real defect and NOT this one, and repairing it leaves the vacuous satisfaction exactly where it is. Nothing DEFAULTS to `Conducted` — until the user performs `ReviewDisposed` the act does not exist and the edge is barred — but the arm reads as the normal path, so a false claim wants refusing rather than discouraging. `Waived` is where an unreviewed run goes, truthfully and at no extra cost.",
  "The marker is structured state on the RV, added by IMP-392. Findings cannot carry it: a clean pass is structurally identical to one never run. The `## Synthesis` prose does distinguish them and is refused on a different ground — the gate would parse authored prose to answer a condition, which is sec-2's fourth-prose-loader risk in its thinnest form.",
  "DEC-125's two arms had no home in any type. They ride a fourth optional slot on `CheckpointAct` beside `covered` / `observed` / `confirms`, with a fourth admission correspondence row. That omission is why the semantics read as ambiguous.",
  "Needs IMP-392 for the `Conducted` predicate and for the concluded marker. The `Waived` arm needs nothing from it. Until IMP-392 lands the interim is the same on both arms, not one strict path and one lax one.",
  "Reverses an SL-244 self-review finding already integrated at run revision 51. sec-3's admissibility passage, its `Conducted` paragraph and the matching verification bullets are rewritten against this record.",
]
