id = 91
slug = "the-claim-base-is-the-resolved-directory-not-the-parsed-uid"
title = "The claim base is the resolved directory, not the parsed uid"
record_kind = "decision"
status = "accepted"
created = "2026-07-27"
updated = "2026-07-27"
tags = ["memory", "verify", "claim-surface", "symlink", "identity"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "RV-314 F-26. Round 3 repaired F-18 (the parsed `memory_uid` was never bound to the storage identity) by requiring `read_link` on the KEY SYMLINK to equal the parsed uid. That mechanism has no object on two of the three references `verify` accepts. `src/memory.rs::MemoryRef::parse` classifies a reference into `Uid`, `UidPrefix` or `Key`; `::resolve_show` takes the literal name for `Uid`/`Key`, calls `resolve_uid_prefix` for `UidPrefix`, and then `crate::fsutil::safe_join`s it — a plain join with two rejections and NO canonicalisation. So on the `Key` route the joined dir IS the symlink and `read_link` works, while on the `Uid` and `UidPrefix` routes the joined dir is the real uid directory and there is no symlink to read. § 5.2 never mentions the three variants. F-18's exact false attestation therefore survives on both unreached routes: `memory verify mem_AAAA…` where `items/mem_AAAA/memory.toml` declares an independently-valid `memory_uid = mem_BBBB…` yields a claim base of `items/mem_BBBB`, which need not exist — and under DEC-080/T68 an unmatched `:(literal)` pathspec is inert on all three legs, so the surface reads clean while `items/mem_AAAA/memory.md`, the body actually read and the file `run_verify` then stamps, is measured by nothing. This is the fourth instance of the round-2 lesson: the repair was written where the finding pointed rather than where the class lived."
choice       = "Stop deriving the claim base from `memory_uid` at all. `run_verify` already binds `dir` from `resolve_show` (`src/memory.rs::run_verify`) and already load-bears on it three lines later, stamping `dir.join(\"memory.toml\")`. THAT path is the claim base, on every route, with one symlink hop resolved when `dir` is itself a symlink (`read_link` yielding a bare single-component name, joined back onto `items_root`) and used as-is otherwise. The parsed `memory_uid` is not consulted, so there is no identity to bind and no equality check to write: the file that gets stamped and the directory that gets measured are the same value by construction rather than by agreement between two derivations. A `read_link` target that is not a single bare component is malformed and reported (I10's existing lexical guard), not silently followed."
alternatives = ["Extend F-18's equality check to the Uid and UidPrefix routes -- i.e. compare the parsed `memory_uid` against the directory name on all three. Lawful and it closes the hole, rejected because it keeps TWO derivations of one fact and a rule that they agree. The class of defect is 'two paths to the same identity', and adding a third comparison is the enumeration answer again", "Canonicalise the resolved directory with `realpath` -- rejected outright: DEC-053 forbids it, and this decision does not need it. One `read_link` hop reads the memory's OWN storage location, which is a different question from classifying a declared pathspec's shape; the corpus was measured at 349 key symlinks, all single-component bare-uid targets, none absolute, nested or dangling", "Reject the Uid/UidPrefix routes from `verify` entirely, making it key-only -- rejected: agents address memories by uid routinely (the boot snapshot emits both forms), and narrowing a verb's accepted input to make an internal mechanism total is the wrong direction"]
rationale    = "Resolution has already answered the identity question by the time the surface is built; the design reached past the answer it held to reconstruct one. Carrying the resolved value is strictly less machinery than F-18's repair — it DELETES the `memory_uid` equality check rather than generalising it — and it is total across the accepted routes by construction, which the equality check could only be by enumeration. It also removes the divergence between what is measured and what is stamped, which was the actual harm in both F-18 and F-26."
consequences = ["F-18's repair prose in § 5.2 is REPLACED, not extended. The 'read_link on the key symlink … the parsed memory_uid must equal it' rule is struck; a design that carried both would carry two constructors for one surface, which is F-29's defect in a new place", "T71 is rewritten. It asserted refusal plus a corpus-integrity finding on a uid mismatch; under this decision a uid mismatch is no longer a verify-time concern at all -- the base is right regardless -- so the test becomes a THREE-ROUTE test (uid, uid-prefix, key) asserting the same directory is measured and stamped on each, with the discriminating half being the parsed-uid construction reading clean on the Uid route", "A memory whose TOML declares a uid disagreeing with its directory is still a corpus defect, but it belongs to `validate`, not to `verify`. Routed there rather than dropped", "§ 5.2's 'the uid directory base is CONSTRUCTED, not resolved' subsection inverts. Its supporting argument -- that a fresh record's key symlink is untracked, so a base depending on the closure firing would not exist -- SURVIVES intact and is in fact better served: `resolve_show` reads the directory from disk, which does not require the symlink to be tracked", "The two lexical defences the design already recorded (the closed uid alphabet, and `verify` being items-only) are no longer load-bearing for the base. They stay as true statements about the reference, demoted from the safety argument"]
decided_by   = "responder"
decided_on   = "2026-07-27"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["Confirmed in source by the responder before disposal: `MemoryRef` has exactly the three variants `Uid`/`UidPrefix`/`Key`; `resolve_show` takes the literal name for `Uid | Key` and `resolve_uid_prefix` for `UidPrefix`, then `fsutil::safe_join`s and returns `(Memory, String, PathBuf)`; `run_verify` destructures that `dir` and stamps `dir.join(\"memory.toml\")`", "`fsutil::safe_join` performs no canonicalisation -- confirmed in source, two rejections only", "Corpus shape measured at 349 key symlinks, every target a single-component bare uid, none absolute, nested or dangling"]
contradicts = ["§ 5.2's F-18 repair as written -- Key-route-only, and silent about the other two routes", "§ 5.2's claim that the base is constructed from `memory_uid` by string construction"]
notes       = ["DEC-053 is untouched. `read_link` resolves the memory's own storage location; it does not classify a declared pathspec's shape, and no `realpath` is introduced", "This does not reopen F-18 -- F-18's charge (parsed uid not bound to storage identity) is closed more completely here than by the mechanism it originally got"]

