title = "Instruction is delivered at the point of effect"
record_kind = "decision"
status = "accepted"
created = "2026-08-01"
updated = "2026-08-01"
tags = ["authoring-rule", "runbooks", "skill-prose", "delivery", "vigilance"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "PHASE-08's triage of `plugins/doctrine/skills/design/SKILL.md` needed a rule for obligations that are neither engine invariants nor obviously edge-shaped. The shipped authoring rule (`install/design-prompts/exploring.toml:8-13`) is a TWO-branch test — could a project legitimately do this differently? yes -> runbook step, no -> engine invariant — and is total over its two answers. It has NO prose branch. The PHASE-08 sketch nonetheless invented a third tier (`skill prose — soft, voluntary, agent judgement`) and spent most of its `EN-2` (b) answer legitimising what lands there, on the reasoning that an obligation with no single trigger point has nowhere else to go. DEC-101 and DEC-102 both cite the two-branch rule as their frame without noticing the third tier is unauthorised by it."
choice       = "Instruction — and guardrails governing invariants the system does not itself enforce — is DELIVERED AT THE MOMENT IT MUST TAKE EFFECT. Prose is not a destination in the mediation axis; it is a FAILURE TO LOCATE A DELIVERY MOMENT, and residue must be labelled as such rather than defended as legitimate. Corollaries: (1) DRY is the wrong model for agent instruction. Its premise — stated once, referenced perfectly thereafter — is false for agents, so 'something with more authority already says this elsewhere' does not justify deleting an obligation unless that authority fires WHERE AND WHEN the obligation bites. (2) An obligation firing at several moments is hung at EVERY one of them, not demoted to prose. Multi-hook is a reason to deliver repeatedly, not a reason to give up delivering. (3) General vigilance is the weakest available form. 'Be on the lookout for X' is worth little; 'apply this lens to this artefact now' is worth a great deal. Where an obligation genuinely has no locatable moment, it stays prose AND is recorded as unenforced-by-construction."
alternatives = ["keep the three-tier axis with prose as a legitimate resting place — rejected: it makes 'we decided to keep this' indistinguishable from 'we found no mechanism', which is exactly the distinction VH-1 must judge", "treat DRY as governing, deleting any obligation restated with more authority anywhere in the corpus — rejected: this is the model that produced two failed deletions in PHASE-08's own triage (:198, :203), both of which cited an authority that fires on the wrong edge or about the wrong object", "hang multi-moment obligations on a single representative edge — rejected: a discharge that overclaims is a real harm (DEC-101/D10's false-completeness objection), but the remedy is step text that does not overclaim, not abandoning delivery"]
rationale    = "The evidence is in the artefact the rule was derived from. PHASE-08's triage deleted `SKILL.md:203` ('governance is not optional WHEN THE DESIGN MAKES ARCHITECTURAL OR WORKFLOW CHOICES') against the shipped step `explore.canon` — which guards EDGE 1 and discharges once, at the start of the run, while the obligation bites at edges 3 and 4. It deleted `:198` ('do not hide unresolved assumptions inside polished prose') against a stage-hymn bullet whose subject is THE INQUIRY MAP, not the design document's prose. Both deletions are defensible under DRY and both silently drop the obligation at the moment it matters. A third instance is first-person: the agent conducting this triage violated `:111-113` (qualify doc-local acronyms by their containing artifact) while presenting the triage to the owner — the single obligation with no locatable delivery moment is the one that demonstrably did not fire. Three independent failures of the same shape, one of them observed live, is what makes this a rule rather than a preference."
consequences = ["the mediation axis keeps three tiers but tier 3 changes meaning: it is a residue register, not a destination, and every item in it carries WHY no delivery moment was found", "the shipped authoring rule in `install/design-prompts/exploring.toml:8-13` gains a third clause. NOT delivered by SL-233 — the header edit and its propagation to every runbook authored after it is out of PHASE-08's scope; a backlog item carries it", "PHASE-08's `EN-2` (b) answer collapses from three kept items to one. `:198`, `:199` and `:200-201` all take edge-3 steps (their trigger is the moment a draft is handed to a reader); `:203` takes steps on edges 3 AND 4. Only `:111-113` survives as prose, because it fires on every message and no edge can hold it — and it is recorded as unenforced-by-construction rather than kept without apology", "D10 (design-target selector recording) is revisited: it is delivered on the edges it fires on, with step text that does not assert finality, rather than left as prose on a false-completeness objection", "D8 (the Locked exit) survives as prose but its warrant narrows to DEFERRAL — the stage-to-stage handoff interface is designed once against two cases — and it is recorded as deferred-and-known-weak, not as legitimately kept", "this governs every skill rewrite in the programme, not just `/design`; `/plan` and `/handover` inherit it", "it narrows DEC-102 rather than contradicting it: DEC-102 settles WHICH assets may be overridden, this settles WHERE an obligation is delivered. An asset can be overridable craft and still owe a delivery moment"]
decided_by   = "owner"
decided_on   = "2026-08-01"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["install/design-prompts/exploring.toml:8-13 — the shipped authoring rule, two branches, NO prose branch; the third tier is unauthorised by the rule the PHASE-08 sketch cites as its frame", "plugins/doctrine/skills/design/SKILL.md:203 against install/design-prompts/exploring.toml:40-42 — `explore.canon` guards edge 1 and discharges once; :203 bites at edges 3 and 4", "plugins/doctrine/skills/design/SKILL.md:198 against install/hymns/stage/design.md:19-21 — the hymn bullet's subject is the inquiry map, under the heading `Provisional is not evidence`; :198's subject is the design document's prose", ".doctrine/slice/233/sketches/thin-adapter.md — the EN-2 sketch whose triage produced both failures", ".doctrine/slice/233/sketches/workflow-as-prose.d2:11 — diagram A's own definition of `vigilance`, `a standing be-on-the-lookout with NO trigger point`, which names the weakness without drawing the conclusion"]
contradicts = ["a DRY reading of skill authoring, under which an obligation stated with more authority anywhere in the corpus may be deleted from where it fires — the model that produced both failed deletions above"]
notes       = ["the rule was stated by the owner in response to a recommendation that :198 and :203 be kept as ambient prose; that recommendation had imported D10's `worse lie than prose` precedent without checking that its actual objection (false completeness of a discharge) transferred. It does not: a per-edge discharge of :203 claims only what is true of that edge", "shorthand for the corollary that does the most work: `do this when you happen to notice it` is not delivery"]

