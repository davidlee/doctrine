id = 384
slug = "hymn-starters-on-demand"
title = "Hymn starters on demand via prompt customise; install removes identical leftovers"
record_kind = "decision"
status = "accepted"
created = "2026-10-16"
updated = "2026-10-16"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-282 inq-7 / IMP-513 / ISS-210 / ISS-521. Install writes the [hymns].expose starter set every run, against SPEC-009 D8 (REQ-355). Byte-identical starters with self-replaces sidecars freeze their slots against framework updates; this repo carries five, a dead sealed preamble/core copy, and a sidecar-less adherence/low twin that double-emits."
choice = "(1) Remove the install starter leg and the [hymns].expose list. (2) New verb `doctrine prompt customise <slot>` (alias `customize`) writes the framework body of one slot as a user-provenance starter plus a self-replaces sidecar, reusing project_starters for one slot; any non-sealed framework slot; refuses sealed slots; leaves an existing file alone and reports it; prints a one-line note that the copy replaces the framework text and no longer receives framework updates. SPEC-023 REQ-322/329 re-home the self-replaces obligation to this verb. role/worker stays customisable on explicit request (ISS-210 resolved). (3) Install removes, and reports, any .doctrine/hymns file whose body is byte-identical to its slot framework body and whose sidecar is absent or exactly the default self-replace — only while the repo has no recorded version (tracked installed-version absent, i.e. a pre-SL-282 install). Once the stamp exists, nothing is removed, so starters written by `prompt customise` survive. Edited files are never touched. This runs where the starter leg ran, before convergence bakes worker defs from the disk corpus. Removals appear in the commit hint."
alternatives = ["Keep an expose allowlist for the verb: a stale list to maintain, sealing already guards", "Seal role/worker: removes a legitimate override", "Report legacy starters without removing: leaves frozen slots and the ISS-521 double-emit in place", "Leave legacy cleanup to IMP-378 migrations: identity check makes it safe now"]
rationale = """Materialise on the user's intent, as REQ-355 already says. Byte identity plus the default sidecar proves a file carries no edits, but not that nobody asked for it: an unedited `prompt customise` starter is byte-identical too (RV-421 F-16). Legacy starters exist only in repos installed before the version stamp, so gating removal on an absent stamp makes it a one-time migration that cannot reach a deliberate customisation. Amended 2026-10-17 by the user's ruling on RV-421 F-16 ("only delete unversioned")."""
consequences = ["Fresh installs write no hymn files", "Install may delete tracked files; they show in the commit hint", "Model-key vocabulary discoverability is out of scope (IMP-489 concern 5, ISS-491)"]
decided_by = "user"
decided_on = "2026-10-17"

