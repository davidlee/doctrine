tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "The `--render` path needs terminal and graphviz capability handed to a pure core. `tty::stdout_terminal_width()` returns `None` for both not-a-terminal and unreadable-size, which `--render` must tell apart (DEC-254 refuses the first; the second still renders). `mem.pattern.design.capability-as-data-seam` forbids collapsing such states into bool/Option."
choice = "Two probes, each typed. (1) Terminal, probed before any work, in `src/tty.rs` beside `terminal_width`, from the same isatty + window-size ioctl the module already reads, via a pure both-injected decision fn. (2) Graphviz, probed by the render spawn itself — no `dot -V` pre-flight — returning the DEC-143 taxonomy. The pure encoder takes PNG bytes plus the terminal descriptor and returns escape bytes. Amended 2026-09-17 at reconcile: the TimedOut arm this decision named was never built. The bounded-subprocess helper and RENDER_TIMEOUT were removed by the 2026-09-15 scope cut (IMP-452), so graphviz spawns dot with no deadline and Ctrl-C is the interactive user's timeout. The shipped taxonomy is Png { png, notes } | ToolUnavailable | CommandFailed { status, stderr } | Io, where notes carries dot's stderr on a clean exit so a forced downscale is disclosed rather than dropped (RV-369 F-8; STD-003)."
alternatives = ["Pre-probe everything into one struct, spawning `dot -V` before work — one guard site, but an extra process, a time-of-check/time-of-use window, and a duplicate of map_server's `dot_version`", "Reuse `stdout_terminal_width()` unchanged — conflates the two states DEC-254 must separate"]
rationale = "Follows the tty.rs shape (thin impure `stdout_*` wrapper, pure injected decision) and the capability-as-data-seam pattern. The spawn is the only truthful answer to whether dot works; a pre-flight answers an earlier question."
consequences = ["DEC-254's guards run on `RenderTarget` and format before any spawn", "Descriptive absence messages map one-to-one from the spawn outcome arms", "The pure encoder is testable with a stub PNG and synthetic descriptors"]
decided_by = "user"
decided_on = "2026-09-15"

