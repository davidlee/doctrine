[facet]                         # every field typed; seeded empty (captured later)
context = "Install detects harnesses by directory existence; a fresh worktree lacks the gitignored dirs, so detection there diverges. The local marker records only the last --agent selection."
choice = "Resolve the harness set in the SOURCE tree via resolve_install_harnesses (no explicit agents) and pass it to regeneration in the fork."
alternatives = ["Detect in the fork", "Read the install marker's harnesses"]
rationale = "Source detection is what a bare install would do there; chains stay consistent because a regenerated tree carries the harness dirs."
consequences = ["Regeneration takes an explicit harness list"]
