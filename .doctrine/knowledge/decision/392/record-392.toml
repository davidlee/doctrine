[facet]                         # every field typed; seeded empty (captured later)
context = "A provisioned worktree lacks the derived tier install projects (ISS-352)."
choice = "Regenerate = MemorySync + Convergence (skills, agent defs, harness link dirs) + universal boot snapshot + local install marker (.doctrine/state/install.toml). Exclude BootWiring, LegacyStarters and the tracked doctrine.toml stamp."
alternatives = ["Run full doctrine install in the fork", "Convergence only"]
rationale = "BootWiring and the tracked stamp dirty tracked files; a full install in a clone modified .doctrine/doctrine.toml. Without the local marker status reports 'not installed'."
consequences = ["Fork tree stays clean against its born frame", "boot snapshot no longer depends on a harness session hook"]
