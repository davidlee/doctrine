[facet]                         # every field typed; seeded empty (captured later)
context = "SL-278: DEC-362 makes the index the default and drops the brief; DEC-364 makes it the doctrine show RV-N render too, so it is the shared entry point. The user wanted more at-a-glance information."
choice = "The table default renders: title line; facet, status, await, rounds and the concluded marker; the reviews edge with raiser and responder; an outstanding line counting non-terminal findings by severity and naming whose turn each group awaits (or none); the finding index with a route column shown only when any finding has a route; and a one-line hint giving the brief line count and the review show --full and -f invocations. In table renders the severities blocker and major print in capitals (BLOCKER, MAJOR); JSON keeps the lowercase vocabulary tokens."
alternatives = ["Excerpt the first brief paragraph instead of a hint", "Keep severity lowercase and rely on colour"]
rationale = "The outstanding line answers what is left and whose move it is without scanning; its counts reuse the close-gate tally. Capitals make gating severities scannable without colour. An excerpt needs prose parsing (rejected in DEC-361); the hint is enough."
consequences = ["table severity rendering diverges from JSON tokens by case only", "e2e goldens for review show change"]
