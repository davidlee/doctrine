updated = "2026-09-27"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "inq-3, SL-271, needs inq-1 (DEC-323): the two MCP legs run over different formats, so a single core would have to abstract over both while the classification rules must stay identical."
choice = "Separate pure planner + shell per arm; share one classification enum and the stale/foreign decision table as a pure function."
alternatives = ["Fully separate planner with no shared vocabulary — the house precedent (the settings-key planner written beside the owner-locked hook merge core), at the cost of two hand-maintained copies of the same judgement.", "One generic core parameterised over the format — maximum sharing and the coupling hazard ADR-001 names."]
rationale = "Satisfies the no-parallel-implementation rule at the seam where duplication would actually cause divergence, while keeping each arm's format handling legible and independent. ADR-001 is honoured: the shared core carries no format-specific concept, and each planner owns its own rendering."
consequences = ["The codex planner's unit suite mirrors the Claude `plan_mcp_*` cases one-to-one, which is what makes the comparator-thrash risk testable.", "A third harness reuses the classification and writes only its planner/shell.", "The shared function is pure and format-blind, so it is testable without either format."]
