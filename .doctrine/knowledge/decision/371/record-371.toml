id = 371
slug = "memory-attestation-is-claim-shaped-the-anchor-and-allow-dirty-retire"
title = "Memory attestation is claim-shaped; the anchor and --allow-dirty retire"
record_kind = "decision"
status = "accepted"
created = "2026-10-07"
updated = "2026-10-07"
tags = ["anchor", "attestation", "memory", "verify"]

[facet]                         # every field typed; seeded empty (captured later)
context = "RFC-035: memory verify refuses any dirty tree in a shared worktree (six open friction observations). SL-232 parked after five non-converging review rounds. EVD-030 showed raw byte+mode+set comparison detects every hazard the three git legs read clean on. A consumer census (2026-10-07) found every reader of verified_sha uses it only as a since-base for commits_touching over claimed paths; none relies on whole-tree cleanliness."
choice = "A stamp asserts that the claimed paths (scope.paths plus the memory's own memory.md) matched commit X in bytes and mode and set at verify time. verified_sha is always a commit sha. The anchor (rest-of-tree cleanliness; I3) is dropped. --allow-dirty is deleted. The 62 existing checkout_state_id stamps are reset to unverified and re-verified."
alternatives = ["Keep the anchor and amend the machinery: the loop that did not converge in SL-232", "Narrow the anchor to declared scopes (SL-232 OQ-5): needs its own evidence and reopens the loop", "Keep --allow-dirty with output unreadable as an attestation: redundant once the claim is measured directly", "Keep the checkout_state_id stamps and render them honestly: preserves an overloaded field every consumer must special-case"]
rationale = "Byte comparison proves exactly the claim-shaped statement and nothing about unrelated files. The census shows that statement is all the consumers need. Under CON-003 a bypass the adversary may invoke is not a control. Dropping the anchor removes the git-view-versus-bytes separation that every parked-design mechanism existed to repair."
consequences = ["SL-232 re-enters design for the reduced mechanism; RV-314 is disposed wholesale as superseded-by-redesign", "The conversion/freshness apparatus (attr-source; attributesFile/fsmonitor/stat-cache neutralisation; info/attributes refusal; unmeasurable taxonomy) and CON-002's git floor are deleted rather than amended", "The claim set must include the memory's own memory.md or validate check 4 (own-body drift) loses its guarantee", "memory.toml cannot be in the claim set since verify writes the stamp into it", "One-shot migration resets 62 checkout_state_id stamps (56% of attested memories) to unverified", "ISS-257 (validate silently skips an undeterminable stamp) stays in SL-232 scope; the migration removes its current population but not the defect", "REV-034 must state the claim-shaped stamp in SPEC-007 before SL-232 implements"]
decided_by = "user"
decided_on = "2026-10-07"

