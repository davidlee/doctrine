[facet]                         # every field typed; seeded empty (captured later)
context = "The tree needs a CLI surface; design show is the agent-facing read and takes a mandatory slice."
choice = "ShowFormat gains Tree (--format tree). doctrine design tree [SLICE] is shorthand for design show --format tree, and only it makes the slice optional (run resolution per inq-default-run). Tree follows the envelope-rendering flag partition: --json and --knowledge refused; --full accepted, redundant; --known-revision legal."
alternatives = ["Slice optional on both show and tree via one resolver"]
rationale = "design show is what agents call; a required slice keeps them from silently reading the wrong run among several idle ones. Convenience belongs on the human verb."
consequences = ["design tree is not a pure alias: it adds run resolution, stated in its doc comment"]
