[facet]                         # every field typed; seeded empty (captured later)
context = "Non-Claude harnesses got skills via npx skills add from the published GitHub repo, lagging the binary and requiring Node/network."
choice = 'codex, pi and universal registry entries take skills = ".agents/skills"; the existing canon+relative-link convergence serves them from the embed. Doctrine never links into .pi/skills (pi warns on duplicates).'
alternatives = ["keep npx delegation", "per-harness dirs (.pi/skills)"]
rationale = "Removes version skew and Node/network dependency; reuses the SL-281 mechanism; .agents/skills is what codex, pi and most non-Claude harnesses read."
