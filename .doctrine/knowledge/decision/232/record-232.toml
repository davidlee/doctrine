created = "2026-08-15"
updated = "2026-08-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = 'DEC-231 settled that a cross-kind dep/seq edge is diagnosed, never ordered, leaving inq-6 to say what the disclosure actually contains, in which direction, and how the needs/after pair collapses. Measured on the live corpus 2026-08-15: 30 authored cross-kind `needs`/`after` edges, of which 25 reach the footer (the other 5 hang off already-terminal dependents, which `project` never admits as nodes); 10 of those 25 have a non-terminal target and 15 a terminal one. A probe fixture - one open item with `needs = ["not-a-ref", "ISS-999", "QUE-219", "SL-9999"]` - showed `doctrine doctor` reporting `corpus clean` on all four, while `backlog list --by sequence` rendered two of them in one `overrides:` block with opposite arrows: `ISS-001 -> not-a-ref` (dependent-first, the project-level `AbsentDrop` leg) beside `ISS-999 -> ISS-001` (predecessor-first, the adapter leg, whose `Override::from` is documented as uniformly the predecessor). Nothing re-checks `[relationships] needs`/`after` after authoring time: `doctrine validate` is id-integrity only, and `relation_graph::validate_relations` reads `[[relation]]` rows.'
choice = "The footer's contract is ONLY what is needed to understand the rendered content. By that rule: evicted and contradicted `after` edges stay in `overrides:`; a cross-kind edge with a non-terminal target is disclosed in a separate `boundary:` block naming the dependent, the relation word, the target and its status - `ISS-327 needs QUE-219 (open)` - dependent-first, stated with the relation word and no arrow; a cross-kind edge with a terminal target, and a dangling edge onto a terminal backlog item, are reveal-flag only; and every ref-integrity failure - a malformed ref, a dangling edge onto an absent backlog id, and a well-formed cross-kind ref that does not resolve - leaves the footer entirely for `doctrine doctor`. The project-level `AbsentDrop` leg is therefore removed from the footer, and a ref-integrity check over every backlog item's `needs`/`after` refs is folded into this slice, routed through `kinds::ensure_ref_resolves` (the same function `run_needs` uses at authoring time) and reported under the existing `RelationIntegrity` category. Logic and display are separated: one pure classifier emits records tagged by class and two consumers filter by their own rule, so `classify_dangling` stops returning a display string and becomes a classifier whose `absent` arm is a routing discriminator rather than a rendered word."
alternatives = ["Report cross-kind edges inside `overrides:` under a new reason word. Rejected - it keeps the false verb `dropped` (the edge was never a candidate for this order) and still places a dependent-first line two lines from a predecessor-first one in the same block.", "Keep one block and make its direction uniform by flipping the adapter leg to dependent-first. Rejected - a golden change on a leg unrelated to this slice, widening the already-realised golden-churn risk, and it still calls the edge `dropped`.", "Flip the `AbsentDrop` leg to predecessor-first instead. Rejected - the raw ref string is not an `ItemId` and may not be an id at all, so `ZZZ-1 -> ISS-001` asserts a predecessor relation `parse_ref` cannot know.", "Move ref-integrity failures out of the footer and defer the doctor check to a separate item. Rejected - nothing else checks these refs, so the removal alone would make a malformed ref surface nowhere: a silent regression rather than a cleanup.", "Mint a new doctor `Category` for dep/seq integrity. Rejected - adding one touches six sites with a known failure mode where a missed site drops findings silently, and `RelationIntegrity` is already the Error-severity home for target-resolution failures."]
rationale = "The render-relevance rule earns what the slice had been asserting. IDE-019's default-quiet stops being a noise heuristic and becomes a consequence - a satisfied prerequisite explains nothing about where a row landed - and the direction clash between the two legs dissolves by deletion rather than adjudication, because the leg carrying the minority orientation is a validation reporter that does not belong on a listing surface at all. Separating the concerns also gives each its right audience: an author reading a work order wants to know why a row sits where it does; an author fixing broken data wants one place that lists every break, not a footnote under an unrelated command. The resulting seam is stable and statable in one line each: `overrides:` is edges that could have ordered and did not, `boundary:` is edges that were never in this order's universe, and doctor is authored data that is wrong."
consequences = ["The slice gains a doctor check and its tests - a real addition to its surface, accepted deliberately, because the footer removal is only honest if the errors have somewhere to go.", "`render_overrides`'s project-level `AbsentDrop` leg is deleted from the footer; `AbsentDrop` itself survives as an input to the classifier on the doctor path.", "The two interim tests from 74b773690 (src/backlog.rs:5301, :5332) are superseded. The first asserts a malformed ref is NAMED in the footer, which this decision moves to doctor, so it is superseded on a second count beyond the one DEC-231 already recorded.", "Default footer size on the live corpus is 10 boundary lines, not 25; the 15 terminal-target edges are reveal-only.", "Dedup of a `needs`+`after` pair onto one target is observable only under the reveal flag in today's corpus - IMP-172/SL-154 is the sole duplicate pair and its target is terminal - so the dedup is correct to specify and wrong to over-invest in.", "inq-7's reveal flag now gates exactly one class: suppressed-but-render-relevant rows. Validation errors are never behind it, in either mode.", "inq-5's cross-kind status probe is load-bearing for both consumers - the footer needs the target's status to render it and the suppression rule needs its class - so it is no longer a footer-only cost.", "A well-formed cross-kind ref that does not resolve (`SL-9999`) is a doctor finding, not a `boundary:` line with `(absent)`. This reverses an earlier sub-choice in the same exchange."]
decided_by = "owner"
