id = 87
slug = "attribute-conversion-is-neutralised-at-the-probe-not-detected-per-file"
title = "Attribute conversion is neutralised at the probe, not detected per file"
record_kind = "decision"
status = "accepted"
created = "2026-07-27"
updated = "2026-07-27"
tags = ["memory", "verify", "git", "attestation", "byte-equality"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "RV-314 F-19: the three dirt legs answer 'is git satisfied?' while I6/T24 claim 'the attested commit contains these bytes'. Committed `.gitattributes` separates those questions. NORMATIVE_FLAGS (src/git.rs:451-458) pins core.autocrlf, core.eol and core.fileMode so machine-local config cannot perturb the frame, but `.gitattributes` is COMMITTED CONTENT and slipped a net built for exactly this purpose. Measured on git 2.54.0 with the design's own flags: `text eol=crlf` gives HEAD blob ...0a versus worktree ...0d0a with all three legs clean and `git status` empty; and a `clean` filter mapping every line to CANONICAL hides ARBITRARY worktree content — tracked=0, untracked=0, and `diff-index --quiet --cached HEAD`=0, which is the leg § 5.1 specifies. All inside DEC-070, DEC-071 and DEC-082, so I9-prime's bounds do not reach it and I6 was false."
choice       = "Neutralise the conversion at the probe rather than detect its effect per file: add `--attr-source=<empty tree>` to NORMATIVE_FLAGS, so every doctrine git invocation reads attributes from an empty tree and compares raw bytes. The empty-tree oid is DERIVED per repository via `git hash-object -t tree /dev/null`, never hardcoded (STD-001) — it is hash-algorithm dependent. On the REFUSAL PATH ONLY, additionally run the un-neutralised probe: when the two disagree the refusal names attribute conversion as the cause rather than blaming the operator's edits. Normal repositories pay nothing on the happy path."
alternatives = ["Raw-byte comparison between `verified_sha:<uid>/memory.md` and the body on disk (the reviewer's proposal) -- INSUFFICIENT as scoped: the claim surface is the uid directory PLUS every declared scope entry, i.e. arbitrary project files, each carrying the identical hazard. A body-only check closes the smaller half", "Raw-byte comparison over the WHOLE claim surface -- total but expensive, and it collides with D18: it requires enumerating concrete paths (the `.doctrine/**` case is 7,670) which D18 rejected merely as pathspecs, then hashing or fetching each. Strictly worse than what was already refused", "`git hash-object --no-filters` per path compared against the tree oid -- a genuine raw-byte check and cheaper than fetching blobs, but still per-file and still needs the same rejected enumeration", "Switch the index leg from `diff-index --quiet --cached HEAD` to the worktree-inclusive form -- it does catch the filter case (measured rc=1) and still catches § 5.2's decisive HEAD=A/index=B/worktree=A case, but it is an incidental fix to one instance rather than to attribute conversion as a class, and capture()'s byte-identity (I1/T59) sits downstream of the leg choice. Rejected as insufficiently general, not as wrong", "Narrow I6 -- abandon the byte-equality guarantee and state what verify does promise instead. Lawful and honest, rejected because the guarantee is keepable at acceptable cost"]
rationale    = "NORMATIVE_FLAGS exists so that 'local config cannot perturb the frame'. Committed attributes perturb it identically; closing the gap FINISHES that mechanism rather than inventing one, which is why this is a smaller change than the per-file alternatives despite covering more. It also covers attribute-driven conversion AS A CLASS instead of enumerating the two routes that happened to be found -- the totality-by-construction property this design keeps requiring of itself, and the reason the leg-swap alternative was rejected even though it works on the probed case."
consequences = ["The measured effect is exactly the repair: with `--attr-source=<empty tree>` the tracked leg goes from 0 to 172 bytes on the clean-filter case and 0 to 156 on the eol case", "It CHANGES WHAT CLEAN MEANS in repositories that legitimately use attributes. Under `* text eol=crlf` every worktree file differs from its blob, so the anchor leg reports dirty near-universally and verify refuses almost always. That is I9-prime's recoverable direction, but it is the usability failure DEC-070 rejected for ignored files, and POL-002 makes a CRLF client project a real case rather than a hypothetical. Live population here is 0 -- this repo has no `.gitattributes` at all", "The refusal-path diagnosis is what makes that acceptable: an attribute-converting repo is told its tree differs by conversion rather than by its edits, so the operator can act. This lands inside objective 6's existing refusal-legibility work rather than opening a new one", "It touches capture(), so the behaviour-preservation gate applies -- I1 and T59's byte-identity assertions must be re-run, not assumed. In a repository with no `.gitattributes` nothing changes and the suites should stay green unchanged; that has to be DEMONSTRATED", "checkout_state_id's inputs change in attribute-using repositories, so previously persisted values are not reproducible there. Population 0 here; stated because the value is persisted in memory.toml", "It creates a doctrine-wide git version floor that did not previously exist -- see CON-002, which also fixes the behaviour when the floor is unmet (refuse legibly, never degrade silently)"]
decided_by   = "david"
decided_on   = "2026-07-27"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["eol route, git 2.54.0 with the design's normative flags: HEAD blob 617474657374656420626f64790a, worktree 617474657374656420626f64790d0a, cmp NOT identical, tracked=0 untracked=0 index_rc=0, `git status` empty", "clean-filter route, same flags: HEAD blob 'CANONICAL', worktree 'TOTALLY DIFFERENT ATTACKER CONTENT', tracked=0, untracked=0, `diff-index --quiet --cached HEAD`=0. The reviewer probed the non---cached form, got 1, and acquitted the limb; against the leg § 5.1 specifies the miss is total", "Repair measured: `--attr-source=<empty tree>` raises the tracked leg to 172 bytes (filter) and 156 bytes (eol)", "`git hash-object --no-filters` confirms the divergence independently -- raw oid differs from the HEAD oid in both routes", "Empty-tree oid derivation measured under both hash algorithms: 4b825dc6... (sha1) and 6ef19b41... (sha256)"]
contradicts = ["I6 and T24 as written before this round -- they asserted byte equality that the probes did not deliver", "The reviewer's acquittal of the clean-filter limb"]
notes       = ["The `--cached` index leg is left as specified. It was not wrong, merely insufficient alone; once attributes are neutralised the tracked leg catches this route, and `--cached` still supplies § 5.2's decisive HEAD=A/index=B/worktree=A case", "Scoping the flag to verify's probes alone was rejected: capture() and verify would then observe different trees, the split-brain I1/T59 exist to forbid"]

