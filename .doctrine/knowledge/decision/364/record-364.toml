[facet]                         # every field typed; seeded empty (captured later)
context = "SPEC-013 pins doctrine show RV-N byte-identical to review show RV-N; the kind-blind router forwards only --format (src/commands/show.rs:66-80)."
choice = "doctrine show RV-N prints exactly what plain review show RV-N prints, in table and JSON. The router gains no review-specific flags; -f/--full/filters are reached through review show, which the default render names."
alternatives = ["Extend the kind-blind router with review flags"]
rationale = "Keeps the router kind-blind; the default render is the shared entry point and points onward. What that default contains is settled separately (inq-11)."
consequences = ["the default render must name the review show flags that reach detail"]
