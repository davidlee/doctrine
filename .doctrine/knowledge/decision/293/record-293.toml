created = "2026-09-24"
updated = "2026-09-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-290 adds TurnEnvelope::forward; REQ-424/REQ-437 require named projection limits and signalled omission; resume renders a runbook_section outside the envelope."
choice = "forward is no-drop (outside the eviction ladder, like contract_pointer). Its size is bounded by the binary: unmet rows <= Condition::ALL (ENVELOPE_FORWARD_UNMET); every list-carrying Cause is capped at ENVELOPE_CAUSE_MEMBERS with (+N more) disclosure at Detail::Normal, uncapped at --full and in refusals; runbook parts are bounded by the embedded assets. The bounding fixture adds a growing run and a maximal forward per embedded runbook. JSON serialises forward; show --format prompt renders the header plus every row; status renders one summary line; resume renders the full rows and they replace runbook_section. Discharged-history lines leave resume; a stale discharge shows as a marker row. The contracts receipt stays (DEC-124). (Amended 2026-09-24, RV-382 F-1: cause-member cap.)"
alternatives = ["Evictable forward rows, tail-first with an omitted counter — weakens the slice's point for little budget"]
rationale = "forward is bounded by the binary, not by the run, so the ladder has nothing to gain by holding it; one row family replaces resume's out-of-envelope runbook row."
consequences = ["resume output changes: runbook_section removed", "bounds.rs gains a derived forward limit; bounding fixture extended"]
decided_by = "user"
decided_on = "2026-09-24"

