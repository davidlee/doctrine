title = "Unmeasurable is a third gate outcome beside clean and dirty"
record_kind = "decision"
status = "accepted"
created = "2026-07-27"
updated = "2026-07-27"
tags = ["memory", "verify", "validate", "invariant", "git", "refusal"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "Five RV-314 findings are one shape: the design offers the claim question two outcomes, clean and dirty, and keeps meeting states that are neither. F-22 — `core.fsmonitor` blinds all three legs on a tracked, unflagged path on a stable checkout, so DEC-082's enumeration of `assume-unchanged` and `skip-worktree` is a list rather than a principle and I9-prime is false again by the shape DEC-082 was minted to close. F-30 — an unmerged index entry (stages 1/2/3, the state any conflicted merge produces) passes § 5.2a step 4's mode-120000 test and then dies on `git cat-file blob :link` with exit 128, and the design does not say whether that is malformed, non-contributing or a probe error. F-31 — under DEC-080 every lexically-eligible joined target must be EMITTED, so a non-UTF-8 target that cannot cross `run_git_env`'s `&[&str]` boundary converts F-8 from a reporting-fidelity question into an I9-prime under-approximation. F-7 — the exhaustion classification these all land in has been verified-but-unchosen for four rounds. And D10 ('verify's only refusals are the two gate questions') contradicts § 5.4's own outcome table, which still carries a 'probe errored ⇒ refuse' row."
choice       = "Give the claim question a THIRD outcome — `Unmeasurable` — that is neither clean nor dirty. `verify` REFUSES on it, naming the cause; `validate` emits a finding and continues, per B18's existing continuation policy. Its members, which is the whole of F-7's classification: (a) any claim-surface index entry whose `ls-files -v` tag is not `H` — `h` assume-unchanged, `S` skip-worktree, `S` sparse-checkout; (b) any entry at a stage other than 0, i.e. unmerged (tag `M`), which is F-30 caught BEFORE step 4 ever calls `cat-file`; (c) any index pathname or derived symlink target that is not valid UTF-8, which is F-8's byte domain settled by REFUSING rather than by widening argv; (d) a git probe that errors. The mechanism costs no new git invocation: § 5.2a step 4 already runs `git ls-files -s -z` per entry, and `-s -v -z` carries the suppression tag and the stage in the same output — measured layout `<tag> <mode> <oid> <stage>\\t<path>`, NUL-terminated. The uid-directory base adds one narrow invocation over its own literal pathspec. `observe_dirt`, `Dirt`, `capture_with` and `capture()` are NOT touched, so I1/T59 byte-identity and `retrieve::freeze`'s per-query cost are unchanged. D10 is amended: `verify` has THREE refusals, and § 5.4's outcome table was right where D10 was under-stated."
alternatives = ["Keep DEC-082's posture — declare the blindness a bound on I9-prime and pin it with expected-blind tests (T64). This is the status quo and F-22 refuted it: the enumeration was incomplete one round after it was written, and there is no argument that the next mechanism will be enumerated either. Rejected because the failure mode recurs by construction", "Honour the index flags, on DEC-082's own reasoning that 'the flags exist precisely to tell git to stop looking, and honouring them is consistent' -- rejected on the verb's promise. Honouring them is consistent for a STATUS verb; `verify` issues an attestation whose whole content is I6, and an attestation over a path git was told to stop looking at is exactly the worthless stamp § 5.4 refuses to trade for an extra `git commit`", "Widen `run_git_env`'s argument shape to `OsStr`/`OsString` and emit non-UTF-8 pathspecs (F-8's other horn) -- rejected on cost against population. It widens the signature of the single chokepoint across every caller in the codebase, to MEASURE a path that `scrub_line` can then only report in escaped form anyway, for a live population of 0. Refusing is total, costs nothing, and is in the recoverable direction", "Classify the unmerged entry as malformed and report-then-attest -- rejected: malformedness is a LEXICAL property (I10/D16) decided without reading repository state, and stage number is repository state. Putting it in the malformed bucket would be the derived-instrument classification DEC-020 forbids", "Treat suppression as non-contribution -- rejected as dishonest by DEC-082's own argument: these paths are tracked, and hiding a boundary by redefinition is the opposite of declaring it"]
rationale    = "The taxonomy had two outcomes because the question was framed as 'is it dirty?'. The verb's actual question is 'can I attest this?', which has three answers: yes, no, and I-cannot-tell. Once the third answer exists, four findings stop being separate defects and become members of it, and the invariant changes polarity from 'I9-prime holds within these bounds' to 'I9-prime holds, or the verb refuses' — a closure rather than a bound, which is what F-22 charged DEC-082 with failing to be. It is also the cheapest available answer: the discriminating data was already being read and thrown away."
consequences = ["DEC-082 is superseded as a BOUND and survives as a CAUSE. `assume-unchanged` and `skip-worktree` remain exactly the states DEC-082 measured; they are now refusals rather than declared blindness", "T64 INVERTS. It was an expected-blind test asserting all three legs read clean under the two index flags; it becomes a refusal test asserting the same fixtures are classified Unmeasurable and named. The inversion is the point and must not be smoothed over -- the old assertion was pinning a defect in place", "R-E is discharged rather than promoted. It was raised to I9-prime's third bound by DEC-082; it is now closed, and § 8 must say so rather than leaving a stale risk", "Sparse checkout is a MAINSTREAM population that lands here: `git sparse-checkout set` marks every out-of-cone entry `S` (measured). A memory declaring a scope outside the cone will refuse rather than silently attest. That is correct and it is a real usability cost that must be stated where the relaxation is described, alongside R6", "Live population in this repository is 0: all 8,521 index entries read `H`. Every branch needs a constructed fixture", "`validate`'s findings surface gains a fourth category, which lands inside REQ-155's 'explicit fresh/stale/unknown/unanchored/reference state' obligation rather than outside it -- § 5.6's REV-034 row already covers the widening"]
decided_by   = "responder"
decided_on   = "2026-07-27"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["`ls-files -v` discriminates every member, measured on git 2.54.0: `h` for assume-unchanged, `S` for skip-worktree, `S` for a sparse-checkout out-of-cone entry, `M` for an unmerged entry, `H` otherwise. Restricting to a pathspec set works unchanged (`ls-files -v -- ':(literal)a' ':(literal)c'` returns only those two rows)", "`-s` and `-v` combine into ONE invocation: `h 100644 78981922613b2afb6025042ff6bd878ac1994e85 0\\ta`, and survive `-z` with NUL termination. So the classification is free where the expander already runs", "F-30 reproduced end to end: an unmerged symlink shows two `M link` rows under `ls-files -v` and `120000 <oid> 2` / `120000 <oid> 3` under `ls-files -s`, while `git cat-file blob :link` exits 128 with 'is in the index, but not at stage 0'. The stage field is in the data step 4 already reads, so the refusal precedes the error rather than classifying it after the fact", "F-22 reproduced: fsmonitor blinds all three legs while `ls-files -v` reports `H`, confirming the fsmonitor case is NOT a DEC-082 flag and that a tag-only test would miss it -- which is why `-c core.fsmonitor=false` (DEC-089) closes that member by neutralisation and the tag closes the others by refusal", "This repository: 8,521 index entries, tag histogram 8,521 `H`, zero non-H rows"]
contradicts = ["DEC-082 as a complete bound on I9-prime", "D10's 'verify's only refusals are the two gate questions'", "§ 9's T64 as written -- the expected-blind assertion is inverted by this decision", "F-8's implied requirement to widen the byte domain; the domain stays UTF-8 and the out-of-domain case refuses"]
notes       = ["The fsmonitor member is closed by DEC-089's neutralisation rather than by this classification, because `ls-files -v` cannot see it -- the two decisions partition the freshness class between them and neither is sufficient alone", "Over-refusal is I9-prime's recoverable direction throughout: `--allow-dirty` remains available and bypasses both gate questions (I4), so no state reached here is a dead end"]

