[facet]                         # every field typed; seeded empty (captured later)
context = "SL-286 inq-1. EVD-032: interactive codex spawns MCP servers from a daemon whose PATH is frozen; only an absolute command survives. POL-002 forbids that path in a client-tracked file; the user-level codex config is not one."
choice = 'Plain `doctrine install` (codex harness) registers doctrine at the user level by running `codex mcp add doctrine -- <absolute doctrine path> serve --mcp` — with explicit consent. No `--global` gate. Consent: a dedicated prompt, default No, asked only when the user-level entry would change (absent, or command/args differ). It names the file, the exact codex command, the scope (every codex session on this machine, every project), the replaced command and any keys the replacement drops, and that codex asks to trust each new folder before use. `-y` grants consent; the `-y` help and README say so. Declining changes neither layer (the project wrapper stays), prints the codex command and an EVD-032 warning, and reports "declined" — not incomplete.'
alternatives = ["Gate the user-level write behind `install --global` — the codex fix would be inert for anyone not passing it", "Keep the project-level `sh -c` wrapper (DEC-323) — fails under the daemon (EVD-032)", "Restart the codex daemon from install — rejected in EVD-032"]
rationale = "Running install for the codex harness is already the opt-in; a separate gate would leave the default broken."
consequences = ["First user-level write by install; governed by the out-of-repo write rule (inq-8)", "The entry applies to every codex session on the machine, hence inq-3"]
decided_by = "user"
decided_on = "2026-10-23"

