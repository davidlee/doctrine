updated = "2026-09-19"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "RFC-026 P10 says demonstrate, probe and control findings are not repaired in prose but become entry or exit criteria on the first phase. SPEC-031 owns criterion identity and evolution and is silent on promoting a finding into a criterion, so the leg has no governance owner and no tooling check. The form has precedent: .doctrine/slice/026/plan.toml:46 carries EX-3 with an inline (RV-093 F-1) citation. The transcription cannot happen at disposition, because the plan does not exist until after the design lock - the same sequencing fact that produced DEC-263."
choice = "The convention states the leg and adds no surface. A routed obligation becomes an entry or exit criterion on a phase citing RV-NNN F-n inline in the criterion text reusing the precedent at .doctrine/slice/026/plan.toml:46. AMENDED 2026-09-19 (owner): an earlier form of this decision had the responder name the host phase at disposition. That is impossible - phases are devised at planning well after the design review - so what the responder states in --response is the part that IS knowable at disposition: a CRITERION SKETCH (what the criterion must assert) and a PLACEMENT CONSTRAINT (what the obligation requires of its host - that it run after the parser exists say or that it needs a worktree branch). The placement decision belongs to whoever writes the plan. The obligation travels with the finding: the planner reads the sketch and the constraint off the RV ledger they must already be reading in order to transcribe at all so the plan-time half is delivered without a third normative surface. Enforcement is transitive and AUDIT-GRADE RATHER THAN PREVENTIVE: DEC-263 holds the raiser does not verify until the criterion exists and an unverified blocker refuses the slice close (doc_unresolved_blockers src/review.rs:1669). That bites at audit-to-reconcile many agent sessions after the phase that should have carried the criterion has already run. It detects a dropped obligation; it does not prevent the defect the finding named from going unguarded through execution. The design says so rather than claiming teeth it does not have. AMENDED 2026-09-20 (owner ruling on RV-371 F-4): the obligation is ALSO hung at the plan moment. The earlier form of this decision rejected a plan-surface touchpoint on cost and relied on the planner reading the ledger they must already open. RV-371 F-4 defeated that reasoning on two grounds. First, install/design-prompts/reviewing.md lines 63-64 - the same file the convention appends to - holds that the current design must stand alone and that a history ledger may not carry context required to implement it, which is exactly what a ledger-held criterion sketch and placement constraint do. Second, nothing shipped instructs a planner to open a review ledger at all, so the obligation was addressed to nobody. The resolution is two edits: the stand-alone rule gains an explicit provisional carve-out where it lives, and plugins/doctrine/skills/plan/SKILL.md gains a transcription pointer. The pointer owns no normative content - it restates no route definition, no form rule and no severity boundary - so the rule still has one owner and RFC-026 P2 is not violated by the fix. Skills are replaced on every install (copy_skill writes unconditionally, src/install.rs:2036-2038), so the plan surface has delivery strength comparable to the fixed fragment. CORRECTED 2026-09-20 (RV-371 F-2): the enforcement claim above is too strong and is withdrawn. doctrine review verify takes only the review reference, --finding, an ephemeral --note and --as, and its gate checks status and role and never content (src/review.rs:2834). It does not read plan.toml and nothing establishes that a criterion exists. So the close gate is a FORCING MOMENT, not a check: it will not let a blocker be closed over unverified, which forces the raiser to act, but a raiser who verifies a routed finding with no criterion behind it produces a clean terminal immutable record of a transcription that never happened and no gate in the corpus can tell. Enforcement is not transitive. What replaces it is the plan-side pointer above, which reaches the planner at the moment of transcription - a delivery improvement, not a check."
alternatives = ["ADOPTED 2026-09-20 under RV-371 F-4, and recorded here as the alternative it was: also hang the obligation in the /plan surface, where transcription actually fires. The purest DEC-103 reading, and originally rejected on cost: it mints a third normative touchpoint and widens the slice's Affected surface beyond its two install/ files, against the no-new-normative-surface constraint. Named as the place a reviewer is most likely to push, and as the obvious follow-up if the trial shows obligations being dropped between plan and execute.", "Give the promotion leg a knowledge record of its own, cited from the convention. Rejected: it adds an entity with no delivery moment for the one obligation that does have a mechanical consequence."]
rationale = "The form needs no invention so the only real question is ownership and the close gate supplies a structural incentive that exhortation cannot. Two owner corrections are carried rather than argued away. First: a gate at slice close is an audit mechanism and by the time it fires the execution it was meant to protect has happened. Second: the responder cannot name a phase that does not yet exist. What survives of the preventive half is the criterion sketch and the placement constraint - both fully knowable at disposition - which convert plan-time transcription from an act of recall into a copy and remove the failure where an obligation survives but its content does not."
consequences = ["The convention gains two sentences: the criterion form with its inline RV-NNN F-n citation; and the responder's criterion sketch plus placement constraint stated in --response at disposition", " CON-006 is corrected. SUPERSEDED 2026-09-20 (RV-371 F-2) - this consequence read 'two clauses have teeth rather than one: the raiser half of the accumulation rule where contest blocks the design lock; and transcription transitively at the slice close'. The second is withdrawn: verify reads nothing outside the ledger, so transcription has no teeth at all. One clause has teeth - the raiser half of the accumulation rule - and the slice close is a forcing moment on the verify act, not a check on its content", " If the trial observes routed obligations dropped between plan and execute then hanging the obligation in the /plan surface is the named next move", " The sketch and the constraint share --response with the adversary clause so DEC-269's plain-prose and read-back rules cover them too", " The obligation is hung at three moments: disposition (the reviewing fragment)", " lookup (review-ledger.md section 4)", " and transcription (the plan skill). Normative content stays in the fragment alone", " install/design-prompts/reviewing.md lines 63-64 are amended with an explicit provisional carve-out naming the routed obligation as the one thing the design deliberately does not carry", " The close gate is described everywhere as a forcing moment on the verify act and never as a check on transcription; CON-006 and design section 5.5 are corrected to match", " Q3 is closed rather than deferred. Q1 - whether the convention survives WEAKER delivery - is untouched and remains open"]
decided_by = "owner"
decided_on = "2026-09-19"

