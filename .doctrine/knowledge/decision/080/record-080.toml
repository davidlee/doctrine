tags = ["memory", "verify", "claim-surface", "symlink"]

[facet]                         # every field typed; seeded empty (captured later)
context      = "DEC-069 split the measurement surface off the index for DECLARED scope entries and left the DERIVED ones behind. design.md § 5.2a step 4 resolves a matched symlink's target from its index blob, joins it lexically, and re-expands it through `git ls-files -s` -- emitting only what the index matched. RV-314 F-15 and F-16 proved the resulting prose admits exactly two readings and neither is safe: index-conditioned emission under-measures (F-1 relocated one hop behind a symlink), and raw emission lets author-controlled blob content act as pathspec magic and subtract the mandatory uid directory. DEC-069's own consequences already said 'its eligible target closure is measured additionally'; design.md never specified emission independent of the index, so this is a specification gap against recorded intent, not a wrong decision."
choice       = "Step 4 is doing two jobs and they are separated. EMISSION: every lexically-eligible joined target is emitted to the MEASUREMENT surface immediately as `:(literal)<target>`, whether or not the index carries it. DISCOVERY: the index re-expansion is retained solely to find deeper mode-120000 entries and continue the walk, bounded and cycle-checked as before. Contribution REPORTING (§ 5.2a's question) is untouched and stays index-first per DEC-053. The `:(literal)` prefix is mandatory on the derived path for the same reason it is mandatory on the declared one -- I8 is restated to cover both sources."
alternatives = ["Drop the symlink closure from measurement entirely and pin the boundary alongside E15/R-H -- lawful (the inquisitor named it for F-1) and it deletes the injection surface rather than guarding it, but it concedes a declared UNDER-approximation in the invariant this round exists to establish, and it lands across the idiomatic path: doctrine mints a slug symlink for every entity and tells you to commit it, so a memory scoping another memory or a slice reaches it through a link by default. Rejected", "Keep index-conditioned emission -- under-measures; this is F-15", "Emit derived targets raw, without the literal prefix -- permits pathspec subtraction; this is F-16", "Rely on I10's lexical guard (RV-314 F-7's repair) to reject injected magic -- refuted: `:(exclude)uid/**` is relative, escapes nothing, and carries no control character, so the guard accepts it. The constant prefix is the mitigation, not the guard"]
rationale    = "The polarity argument DEC-069 established decides it. Over-measuring yields a refusal, which is recoverable; under-measuring yields a false attestation, which is not. F-16's injection is guardable by a constant prefix already probed to work and already precedented in this design; F-15's under-approximation is the failure direction the round proved unrecoverable. Deleting an injection surface is the better instinct in general, but conceding an unmeasured evidence class to do it is the worse trade. The population argument reinforces rather than carries it: `census.py` measures 0 symlink-rooted entries today, but that is 0 by accident, not by construction -- entity slug symlinks are the ergonomic handle agents hold, so the alternative would pin a boundary directly across the path declarations would naturally take."
consequences = ["I8 is restated to cover DERIVED pathspecs, not only what a memory `declares`. § 5.2a's constant-prefix rule was scoped 'per entry of scope.paths and scope.globs' and must now name both sources", "The measurement surface over-approximates further: an emitted target may match nothing anywhere. Measured inert -- all three legs return rc=0 on an unmatched `:(literal)` pathspec and it does not mask a real dirt signal alongside it", "RV-314 F-7's lexical guard stays a prerequisite and its scope widens: it now runs on every emitted derived target, not only on those the index matched", "The uid directory base should be constructed arithmetically from `memory_uid` rather than by resolving the key symlink -- the link target IS the uid field verbatim. Independent of this decision, but it removes the base's dependency on the closure firing", "T62 gains a derived-route half; new tests are needed for a detached/untracked derived target and for derived exclusion magic"]
decided_by   = "david"
decided_on   = "2026-07-27"

[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["RV-314 F-15 -- reproduced on git 2.54.0: HEAD carries tracked `link -> target.txt` and tracked `target.txt`; after `git rm --cached target.txt` with a modified copy on disk, index re-expansion of the blob target is EMPTY and the surface [:(literal)link] reports tracked=0 / untracked=0 / index_rc=0, while the control emitting the target literally reports tracked=145 bytes / index_rc=1", "RV-314 F-16 -- reproduced on git 2.54.0: a tracked symlink whose blob content is the literal string `:(exclude)uid/**`, with uid/memory.md modified, reports tracked=0 / index_rc=0 when the derived target is emitted raw and tracked=152 / index_rc=1 when emitted as `:(literal):(exclude)uid/**`", "Unmatched-pathspec inertness -- `:(literal)ghost/never-existed` alongside a real selector returns rc=0 on `diff HEAD`, `ls-files --others` and `diff-index`, and still passes a real signal through (tracked=143 bytes, rc=1). Unconditional emission does not break the legs", "DEC-069 facet.consequences already required 'a matched symlink is measured itself, and its eligible target closure is measured additionally'"]
contradicts = ["design.md § 5.2a step 4 as written before this round, which conditioned emission on the index re-expansion's match set", "The reading of I8 that scopes constant-prefixing to declared entries alone"]
notes       = ["E15/R-H is untouched: it concerns an entry whose ANCESTRY traverses a symlinked directory, where the link is never itself matched and step 4 never fires. F-15/F-16 live inside the machinery E15 sits outside of", "DEC-053 stands whole for contribution reporting -- no realpath, no character-based shape classification, no whole-component-prefix rule"]

