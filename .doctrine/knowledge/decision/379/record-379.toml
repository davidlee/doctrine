slug = "install-currency-and-install-plan"
title = "Install currency: pure classifier plus composed install plan"
record_kind = "decision"
status = "accepted"
created = "2026-10-16"
updated = "2026-10-16"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-282 inq-1. Overview, commit hint and staleness advisory must read one account of install-owned state. Three disjoint projections exist (stage-1 Plan, ownership Actions, boot_check); no model spans them."
choice = "(1) Install writes a gitignored per-checkout marker `.doctrine/state/install.toml` (binary version, harnesses converged); only install writes it; absent means this checkout is not installed. (2) A new pure leaf module `install_state` owns `Currency` (current / checkout-not-installed / checkout-older / repo-older-than-binary / repo-newer-than-binary / unreadable), `classify(tracked, local, binary)`, and `advisory(&Currency)` as the single source of message text. File reads stay in the command-tier shell; boot, status and prompt depend on the leaf. (3) `install.rs` composes an `InstallPlan` from the existing builders: base Plan, forward steps (memory sync, boot wire, harness convergence with ownership Actions), gitignore change, both stamp writes. Overview, detail view (existing printers) and commit hint all render from it."
alternatives = ["Detect installedness from boot.md or shipped-memory presence — both regenerated by the session hook in an uninstalled clone", "Infer installedness from harness link dirs — depends on harness choice; fragile", "A fourth standalone model of install-owned paths — parallel implementation"]
rationale = "Composition of existing projections avoids a parallel model. A leaf classifier keeps ADR-001 layering (boot/status/prompt reach it downward) and makes the message text single-sourced (STD-001). A marker written only by install is the one per-checkout signal nothing else regenerates."
consequences = ["Wiping .doctrine/state/ reads as not installed; advice (run install) is correct", "New leaf module registered in .doctrine/adr/001/layering.toml"]
decided_by = "user"
decided_on = "2026-10-16"

