answer = '''Soften. The advisory now reads `backlog list: at least {n} authored needs/after {ref names|refs name} nothing — run \`doctrine doctor\` for the full check` — the count is declared a lower bound and the pointer is declared the complete check. Settled together with RV-363 F-4 (the template hardcoded the plural and rendered "1 ... refs name nothing"), because both defects rode one string: one edit, one template plus two agreement constants (STD-001), four contains-assertions in src/backlog.rs of which two needed the singular. The case for softening is design.md §2's own argument — a signpost trusted as complete when it is not is worse than no signpost — and the two gaps that make it incomplete (terminal dependents, unreadable items) are unclosable without the second corpus traversal §4 forbids. Declining would have left the rendered string overclaiming while the design prose disowned it.'''
answered_by = "SL-238 reconcile (owner call)"
answered_on = "2026-08-17"

