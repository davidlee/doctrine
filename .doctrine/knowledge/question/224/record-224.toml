question = "Should the route axis extend beyond design-review ledgers to /audit and /code-review passes?"
why_matters = "The trial scoped routing to design reviews so its population is defined. Extending it is a decision for trial conclusion, not an automatic consequence of a good result. Argument: SL-260 design §6 Q2. Owned and settled by CHR-077."
answer = "Not extended. Routes choose the instrument that settles a finding before code exists; reconciliation and code-review findings arise after it, where a stale record is simply edited (as /reconcile already does), so routing is not expected to add an instrument there. This is argued, not measured. The earlier ground, that owner-fix stops discriminating outside design review, does not hold: E13 rater prompt steered toward owner-fix, and unsteered the taxonomy discriminates on the same 47 findings (owner-fix 33.0 percent; RFC-026 E14). The scope is held by the design-run lock check (DEC-326) and the review-ledger.md scope line, not by refusing --route on other facets: nothing counts routes outside design review, and a voluntary route elsewhere is evidence rather than contamination. Owner ruling 2026-09-27, revised twice the same day: on the owner approving the E14 analysis, then on the owner dropping the facet refusal in SL-270 design (inq-4)."
answered_by = "owner"
answered_on = "2026-09-27"

