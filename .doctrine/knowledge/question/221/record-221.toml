answer = "Yes — pin it. Landed 2026-08-17 as `backlog_after_pins_the_cross_kind_target_refusal_on_both_legs` in tests/e2e_dep_seq_verbs.rs (c84966546), between PHASE-06 and PHASE-07, i.e. inside the only window where a before-state pin can still be written. Rationale: it meets §7's own definition of deliberately changed behaviour even though §7's named set omits it, and the cost is one test against existing fixtures. The refusal is pinned by message EQUALITY, not by exit status or `contains` — mutation testing showed that with both `require_item` target gates removed the remove leg still exits non-zero with stderr naming the target (`ISS-001 has no after edge to SL-154`), so the loose forms would have survived the exact change the pin exists to catch. PHASE-08 must find this test RED and rewrite it in place into its opposite, not delete it."
answered_by = "david"
answered_on = "2026-08-17"

