[facet]                         # every field typed; seeded empty (captured later)
question    = "Can CPT-001's taxonomy usefully name interpreters that sit DOWNSTREAM of the toolchain — an LLM agent, a terminal emulator, a human reviewer — given that their trigger paths are not enumerable and so cannot be expressed in a per-project `interpret:` declaration?"
why_matters = "The declaration format assumes a deterministic interpreter with a defined grammar reachable from a declarable set of paths, which is what makes a trigger-path list a sufficient defence. Downstream interpreters violate all three. If the taxonomy cannot name them, the shipped audit is silently narrower than the concept it claims to implement — but a class nobody can enforce may be worse than an honest omission."
