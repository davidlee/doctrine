question = "Should the route set become a code-backed closed vocabulary?"
why_matters = "Available if the trial validates the convention; foreclosed during SL-260 by its no-src tripwire, and taking it newly binds three standards. Argument: SL-260 design §6 Q4; unenforced clauses it would close: CON-006. Owned and settled by CHR-077."
answer = "Answered by events, not by the trial. SL-268 (Review ledger v2, closed 2026-09-27) shipped exactly this: a validated closed Route enum written through --route, single-sourced with a canary, with the CLI refusing a route: prefix in --disposition. It therefore landed mid-trial rather than after a validating result — DEC-266's sequencing inverted — and is recorded as E12 confound 1. The question as written is historical; the surviving question, whether taking the code-backing before the trial reported was the right call, rests on E12. Owner ruling, 2026-09-27."
