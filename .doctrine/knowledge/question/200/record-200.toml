supports    = [
  "EVD-006 — hostile git config, hooks and disk-cap hazards behave identically on fetch and bundle",
  "EVD-007 — every scored refusal token is computed trusted-side, downstream of the mechanism",
  "EVD-008 — both mechanisms preserve the worker's commit identity into quarantine",
  "EVD-009 — wall-clock cost is equal; bundle's larger transfer trips git auto-maintenance",
]
contradicts = [
  "EVD-010 — bundle adds a trusted-side file-ingestion boundary that fetch does not carry, disputing candidate 2's 'cleanest trust story'",
]
notes       = [
  "All five inputs are SL-241 PHASE-05 C3-probe results; scored data in probes/c3/results.tsv, summarised under .doctrine/rfc/025/evidence/ (SL-241 T8).",
  "EX-9 RULED, SL-241 PHASE-06 T8 (D-P06-9): the EVD does NOT suffice. Status stays `open`; it settles in the post-spike REV. EX-9 explicitly permits this answer and it is recorded rather than forced.",
  "The reason, in one line: candidates 1 and 2 each carry exactly one trusted-side surface the other lacks, and only M-B's was measured. M-B's (parse a capsule-authored file) is enumerated and tested — EVD-010's four legs. M-A's (run git inside a capsule-authored repository — three touches in harvest-fetch.sh) is sampled at two config keys, and the sample shows it is not uniformly defended (F-P06-11).",
  "The three measured asymmetries all sit on M-B and are all COSTS (extra boundary, defective two-site token, quiesce obligation). The one asymmetry on M-A is a SAFETY asymmetry. This question asks for the minimal SAFE mechanism, so 'M-B has costs' does not settle it.",
  "Candidate 3 (tree materialization) IS excluded, on this question's own grounds — EVD-008, forfeits the forensic-history invariant by construction; neither rigged mechanism failed anything that would reopen it.",
  "What would close it: bound or eliminate M-A's trusted-side git surface in the capsule repo rather than sample it further. The residual is a universal over git's config space that no probe can exhaustively discharge; the tractable question is whether the parent needs to run git in that repository at all. Carried into the RFC-025 go/no-go's outstanding work.",
]

