question = "Does the capsule control plane's CAS-gated integration ever advance a canonical ref that a live worktree has checked out — and if so, does it sync-or-refuse first?"
why_matters = "SL-240 scoped the phantom-staged-reversal defect class (commit_on_behalf → update_ref_cas landing under a live checkout) and was abandoned with the dispatch funnel, which that mechanism was exclusive to. RFC-025 migration step 4 retains one CAS ref advance in the trusted control plane; if that advance targets a checked-out ref (e.g. main/trunk), ISS-038's class re-emerges inside the control plane. Answering this decides whether the capsule cutover needs a forward-sync guard or is out of the class by construction."
