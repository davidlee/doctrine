question = "Should the inquiry map grow the semantic tier RFC-026 E8.5 names — cascade on a changed answer, a retained prior answer, an explicit cauterised-by edge, structured rejected alternatives — or is the map's current flat, edge-free shape adequate at slice altitude?"
why_matters = "RFC-026 E8.3 measured SL-243's run at nine nodes and zero edges of either kind across seventeen revisions, by a competent agent never told not to use them. Both edge kinds shipped with full render support. So the four map improvements (IMP-386/387/388/389) would deepen a structure the corpus has not yet shown anyone using, and building them first risks answering E8.6's meaning-tier gap with more machinery rather than more use. The answer decides whether that batch is work or waste."
