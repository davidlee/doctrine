[facet]                         # every field typed; seeded empty (captured later)
claim           = "CPT-001's classes divide cleanly by WHO OWNS THEM: classes 1-3 (explicit execution, build-system evaluation, toolchain auto-load) are language-bound and are the CLIENT PROJECT's to declare; 3g, 4 and 5 (git-level auto-load, path-shaped data, resource shape) are universal and are DOCTRINE's to ship. The split is sound and stays sound as the class list changes."
confidence      = "medium"
basis           = "design-inference"
validation_plan = "Falsified by finding a trigger that is language-bound but cannot be declared by the client (doctrine would have to hardcode a host-project convention, violating POL-002), or one that is universal but cannot be shipped by doctrine without knowing the client's toolchain. NOT falsified by finding a new class — a new class is placed on one side of the split or the other, which is the split working. The SL-241 light fixture is the live test: the same DQ-4 audit must run unchanged against a Rust and a TypeScript project, reading only what each declared."
