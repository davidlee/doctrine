supports    = [
  "SL-241 PHASE-04 step 0: all four residue items (R1-R4) place cleanly on one side of the split — R2 and R4 universal, R3 universal, R1 language-independent — so the split absorbed a taxonomy failure without itself moving.",
  "SL-241 PHASE-04 step 0: three unforced Rust/TypeScript parallels (binding.gyp = build.rs; packageManager = rust-toolchain.toml; .mise.toml = .envrc) land in the same class from opposite ecosystems.",
  "RFC-012 section 2 'Resource taxonomy by responsibility' — an independent Doctrine-duty / Project-duty matrix for containment, arrived at for a different problem. Same shape, different subject (operator ruling, 2026-08-02).",
]
