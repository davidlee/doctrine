[facet]                         # every field typed; seeded empty (captured later)
statement     = "The adversary `memory verify` defends against is an AGENT compromised by prompt injection, seriously misaligned, or stupid in a way indistinguishable from malice. The goal is BLAST-RADIUS CONTAINMENT: a bad agent must not be able to propagate a false belief into the corpus and have later agents act on it. OUT OF MODEL, explicitly: a hostile human operator, and confidentiality. IN MODEL: everything the agent can reach with the privileges it actually holds — which in this harness includes a shell, so it includes writing machine-local git config, writing under .git (including info/attributes), setting index flags, and controlling the environment of any git process doctrine spawns. NOT NARROWED to `ordinary authoring`: the adversary is the agent, and the agent has the operator's filesystem privileges. CONSEQUENCE FOR SCOPE: a control the adversary can simply invoke or disable is not a control — this reaches --allow-dirty directly. OPEN, and deliberately not settled here: whether a defence is worth building against a route the adversary could equally reach by editing the memory file directly. That is a cost question per route, not a boundary of the model."
source        = "operator"
applies_to    = ["SL-232", "src/memory.rs::run_verify", "src/git.rs::capture", "RFC-022"]
