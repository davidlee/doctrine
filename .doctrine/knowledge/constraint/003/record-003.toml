[evidence]                      # free-text citations (supports / contradicts / notes)
supports    = ["Stated by the operator 2026-07-27 after RV-314 round 5, in direct response to the observation that five review rounds had produced 42 findings without converging", "RV-314 rounds 1-5: each round refuted the previous round's repair. Round 4 and round 5 both found blockers in decisions written that same round, so the refutation rate was not decaying"]
contradicts = []
notes       = ["ROOT CAUSE THIS RECORD ADDRESSES: with no stated adversary there is no completeness criterion, so every review round could always find another mechanism and no repair could ever be shown sufficient. This is the constraint that makes the question answerable", "Bounds the review, not just the design: a round-6 finding that requires a privilege excluded above is out of scope by this record rather than by argument", "The `don't record incorrect facts` harm is a DIFFERENT problem, largely accident rather than adversary, and is better served by outcome tracking than by dirty-file checking (RFC-022)", "Does NOT decide the three open design questions it bears on (whether the anchor question survives, what happens to --allow-dirty, whether byte-comparison replaces the three legs). It is the yardstick those decisions are measured against"]

