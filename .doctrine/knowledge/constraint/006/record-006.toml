[facet]                         # every field typed; seeded empty (captured later)
statement = "The SL-260 design-review routing convention is UNENFORCED BY CONSTRUCTION. No shipped mechanism validates that a route was chosen that the chosen route is in the closed set that a probe stated its adversary that a control named its fault that an owner-fix swept its class that the settle-first test was applied or that a phase criterion was authored before a routed finding was verified. EXACTLY ONE clause has mechanical force. (1) MECHANICAL - the raiser half of the accumulation rule: contest moves a finding from answered to contested and contested blocks the design lock (undisposed_blockers src/review.rs:1705). This fires at the moment it matters. (2) A FORCING MOMENT, NOT A CHECK - the slice close. doc_unresolved_blockers (src/review.rs:1669) refuses audit-to-reconcile while a blocker is short of verified, so a routed blocker cannot be closed over in silence: someone must perform the verify act. But that is all it buys. CORRECTED 2026-09-20 (RV-371 F-2): an earlier form of this record said a routed finding cannot reach verified without a criterion and therefore that a dropped obligation cannot be closed over. That is false and it contradicted this record's own applies_to row. doctrine review verify takes only the review reference, --finding, an ephemeral --note and --as; its gate checks status and role and never content (src/review.rs:2834); it does not read plan.toml. A raiser who verifies a routed finding with no criterion transcribed produces a clean, terminal, immutable record of a transcription that never happened, and no gate in the corpus can tell. The close gate buys attention at a late moment; it does not buy transcription. Everything else is detected, if at all, after the fact by the trial's counting pass, which is post-hoc measurement and not enforcement. Enforcing any of it would require a src/ change which SL-260's scope forecloses as its own tripwire - a src/ change newly binds STD-001 STD-003 and POL-002. This record is the residue register DEC-103 requires: its residue rule holds that where an obligation genuinely has no locatable delivery moment it stays prose AND is recorded as unenforced-by-construction with each item carrying why no delivery moment was found. PLACEMENT: the convention text on all three surfaces carries a one-line pointer to this record, so the FACT of non-enforcement is delivered at the point of effect while the enumeration stays pull-tier audit material. CORRECTED 2026-09-20 (RV-371 F-3): that pointer previously read 'this convention is enforced only by the trial's counting pass'. A counting pass cannot reject, block or repair a nonconforming disposition, so the word enforced was false and it breached the design's own principle of never implying an enforcement that does not exist. The shipped wording now says that nothing validates the convention, that the close gate forces the verify act without reading it, and that the counting pass measures after the fact. The enumeration was deliberately not inlined: it would ship an apology in a fragment delivered every reviewing turn and bury the operative rules under caveats about them."
source = "technical"
applies_to = ["Routed verify asserts transcription rather than repair (DEC-263) - doctrine review verify takes only an ephemeral --note documented as NOT rationale (src/review.rs:2670-2673) and its gate checks status and role and never content (src/review.rs:2834). Nothing can check that a phase criterion was authored before the verify", " Every severe finding carries an explicit route (DEC-265) - nothing validates the --disposition field; it is free text and RFC-026 E1 found 61 distinct values already in use", " A probe route states its adversary in --response (SL-260 scope section 4) - nothing parses --response. Worse: a double-quoted shell argument silently eats backtick spans so an eaten clause is indistinguishable from an absent one. DEC-269 dodges this with a plain-prose rule and a read-back step; DEC-270 records that both cases count the same", " A control route names the concrete incorrect candidate its check must reject (DEC-267) - nothing parses --response", " An owner-fix route sweeps the affected class (DEC-267) - nothing observes whether a sweep happened", " The settle-first test bounding when a routed finding may stay open past the gate (DEC-267) - nothing evaluates external reliance durable state authority or exposure dependency spread or governing meaning", " The responder half of the accumulation rule (DEC-264) - advisory by construction; the responder is the party motivated not to notice", " The earliest-phase-that-satisfies-the-constraint placement rule addressed to the planner (DEC-272) - nothing checks placement against the stated constraint", " The route set is prose-only rather than a code-backed closed vocabulary (DEC-266) - a named absence of mechanism recorded here rather than left as an omission", " The responder's criterion sketch and placement constraint at disposition (DEC-271) - nothing checks either was written, and nothing checks it was honoured at plan time. The plan-side pointer added under RV-371 F-4 improves DELIVERY of this obligation; it adds no check", " The compound-finding route precedence and the sibling-split rule (DEC-275) - nothing parses the disposition, so nothing can observe that the precedence was applied or that a named second arm was ever raised", " The trial's at-conclusion capture of rounds and contests (DEC-276) - the runtime baton holding both is gitignored and documented as lost on baton loss (src/review.rs:2185-2208), so a missed capture is unrecoverable and must be reported as unavailable rather than estimated"]
