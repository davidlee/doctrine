[facet]                         # every field typed; seeded empty (captured later)
datum = "Probed on SL-259's own run against ./target/debug/doctrine. A truncated JSON payload exits 1 with `parse the apply payload as JSON: EOF while parsing an object`, leaves the run at revision 12, and does NOT consume its submission_id — re-sending the identical submission_id with well-formed content landed normally at revision 13. This matches the code: commands/design.rs:1624 parses before run::admit, so the parse site cannot reach the idempotency receipt. ISS-361's reported mechanism — a JSON parse error that nonetheless advances the revision and receipt-locks the submission — does not reproduce on the parse path."
provenance = "reproduction"
confidence = "high"

