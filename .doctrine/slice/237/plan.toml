[[phase]]
id        = "PHASE-04"
name      = "boundaries_path becomes infallible; the registry takes the root types"
objective = """
Discharge DEC-098: `boundaries_path` stops resolving git internally and loses its \
`Result`, becoming a pure join off a `ReadRoot`. `read_source_deltas` and \
`forget_source_delta` follow, and the transitional double-resolution PHASE-01 \
left behind — a primary handed in, then re-resolved inside the registry path — \
disappears. Deliberately separable from the rest (DEC-098): nothing above it \
depends on the contract change, only on the homing PHASE-01 already delivered."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete — its callers already hold a resolved root to hand in. Until then `boundaries_path` cannot stop resolving, because nobody upstream has resolved" },
  { id = "EN-2", text = "DEC-098 read as authored — it is what makes the lost `Result` a decision rather than a convenience" },
]
