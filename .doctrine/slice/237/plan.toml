[[phase]]
id        = "PHASE-02"
name      = "Retire the completion mirror; split run_phases"
objective = """
Delete `mirror_completion_into_primary` and its guards — the patch whose \
generator PHASE-01 removed — and make `run_phases` read `plan.toml` from the \
INVOKED root while writing sheets to the PRIMARY. The asymmetry is deliberate \
and is what dissolves SL-228 / RV-312 F-6, where `dispatch sync --prepare-review` \
hard-refused two fully-landed phases because a mid-drive-appended phase had no \
primary sheet and the mirror could not create one."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete — phase sheets already home in the primary. The mirror cannot be retired before that: it is the thing standing in for single-homing, and deleting it first reintroduces ISS-212 verbatim" },
]
exit_criteria = [
  { id = "EX-1", text = "`mirror_completion_into_primary` (`state.rs:535`), its call site (`:513`), and its distinct-primary and live-coord guards are DELETED — not deprecated, not left unused" },
  { id = "EX-2", text = "`run_phases` (`slice.rs:796`) reads `plan.toml` from the INVOKED root and writes sheets to the PRIMARY. Today both are one tree; afterwards they diverge on purpose" },
  { id = "EX-3", text = "the asymmetry carries a comment saying it is INTENTIONAL and naming SL-228 / RV-312 F-6 as the case it dissolves. Without it a later reader `fixes` the split back — R3, and the comment IS the mitigation" },
  { id = "EX-4", text = "`tests/e2e_slice_phases_single_home.rs` exists and contains `phases_appended_in_a_coord_tree_materialise_in_the_primary` — a phase appended to a coord tree's `plan.toml`, `slice phases` run THERE, sheet asserted in the primary where `registry_completeness` reads it" },
]
verification = [
  { id = "VT-1", expects = "the RV-312 F-6 case is pinned end to end: append in the coord tree, materialise in the primary", test_file = "tests/e2e_slice_phases_single_home.rs", keywords = ["plan.toml"], patterns = ['^\s*fn phases_appended_in_a_coord_tree_materialise_in_the_primary\('], waived = false },
  { id = "VT-2", expects = "the intentional-asymmetry comment exists and cites its case — a keyword over a COMMENT is the correct mandate here, because the comment is the artifact R3 asks for", test_file = "src/slice.rs", keywords = ["RV-312 F-6", "intentional"], waived = false },
  { id = "VA-1", text = "RUN `rg -n 'mirror_completion_into_primary' src/ tests/` — zero hits. A retired function with a surviving caller or doc reference is not retired" },
