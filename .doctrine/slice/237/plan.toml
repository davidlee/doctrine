[[phase]]
id        = "PHASE-05"
name      = "Symlink mint-and-retire; kind-scoped reseat guard; doctor visibility"
objective = """
Close the projection surfaces. Mint the `phases` convenience symlink in the \
primary ONLY and retire a stale one on encounter in a linked worktree \
(DEC-097 + F-8); migrate the reseat guard's hand-built state path — the site a \
`phases_dir` call-site census structurally could not find — SCOPED TO THE SLICE \
KIND ALONE; and make the accepted residual visible in `doctrine doctor` rather \
than silently carried."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete — the guard and the symlink both resolve through the root types this phase consumes" },
  { id = "EN-2", text = "CHR-050 exists and still owns `.doctrine/state/review` and `.doctrine/state/dispatch`. This phase must NOT ship that deferred work; EX-3 is the boundary and V-17 is its proof" },
]
exit_criteria = [
  { id = "EX-1", text = "`refresh_symlink` (`state.rs:345`) mints the `phases` link in the PRIMARY only — which already holds from PHASE-01, see EX-6b there — and RETIRES a stale link already present in the invoked linked worktree, which is this phase's actual delta. The pre-slice version mints into the invoked root, so worktrees predating the slice already carry one: not removing it leaves exactly the misleading runtime projection DEC-097 exists to prevent (I-4, F-8)" },
  { id = "EX-1b", text = "THE SIGNATURE TENSION IS RESOLVED HERE, DELIBERATELY. Design § 5.2 gives `init_phases` ONE root (`&PrimaryRoot`) and `refresh_symlink` BOTH — and they are caller and sole callee (`state.rs:219`), so the two rows cannot both hold at the same moment. PHASE-01 honours the `init_phases` row as written, which delivers the MINT half; this phase adds the second param — the INVOKED root, threaded `run_phases` → `init_phases` → `refresh_symlink` — because retirement is the first thing that needs it. Note the second root here is NOT a `git_cwd`: retirement is a filesystem op on the invoked tree, not a git query, so it takes the F-3 shape without being an F-3 case" },
  { id = "EX-2", text = "retirement is ON ENCOUNTER and that is an accepted BOUND, not a defect. Sweeping sibling worktrees was CONSIDERED AND REJECTED — enumerating `git worktree list` and writing into other people's trees breaks ADR-006's sole-writer posture, races a live drive, and can touch a worktree whose owner never ran this code. Do not implement a sweep (F-14)" },
  { id = "EX-3", text = "the reseat guard (`integrity.rs:322-323`) resolves `kind.state_dir` through `ReadRoot` for the SLICE kind ONLY. Every other kind — notably REVIEW, `.doctrine/state/review` (`kinds/mod.rs:410`) — keeps today's invoked-root join. A generic `resolve every state_dir through the root type` edit silently primary-scopes review runtime state, shipping OQ-2/CHR-050's deferred change while claiming not to (F-13)" },
  { id = "EX-4", text = "`doctrine doctor` reports a `phases` symlink present in a NON-PRIMARY worktree as a stale-projection finding. The bound in EX-2 is only honest if it is visible: the operator retires the link by visiting or removing the tree (F-14's named residual). Fresh forks are unaffected — `WITHHELD` carries `Tier::PhaseLink` (`worktree/allowlist.rs:74`), so provisioning never creates one" },
  { id = "EX-5", text = "the tests are: `symlink_is_minted_in_the_primary_and_a_stale_link_is_retired` (`src/state.rs` — the UPGRADE case, a pre-existing link in a linked worktree, not a fresh tree); `reseat_refuses_when_primary_phase_state_is_live` and `reseat_keeps_the_review_kind_on_the_invoked_root` (`tests/e2e_integrity.rs`); `doctor_flags_a_phases_link_in_a_non_primary_worktree` (`tests/e2e_doctor_golden.rs`)" },
]
verification = [
  { id = "VT-1", expects = "the symlink's upgrade path is pinned: minted in the primary, stale link retired where encountered", test_file = "src/state.rs", keywords = ["PrimaryRoot"], patterns = ['^\s*fn refresh_symlink\(', '^\s*fn symlink_is_minted_in_the_primary_and_a_stale_link_is_retired\('], waived = false },
  { id = "VT-2", expects = "the reseat guard still guards from a linked worktree (V-11) AND the deferred-subtree boundary holds (V-17) — the pair is the point: one asserts the slice kind MOVED, the other that the review kind did NOT", test_file = "tests/e2e_integrity.rs", keywords = ["state_dir"], patterns = ['^\s*fn reseat_refuses_when_primary_phase_state_is_live\(', '^\s*fn reseat_keeps_the_review_kind_on_the_invoked_root\('], waived = false },
  { id = "VT-3", expects = "the accepted residual is visible rather than silently carried (F-14)", test_file = "tests/e2e_doctor_golden.rs", keywords = ["phases"], patterns = ['^\s*fn doctor_flags_a_phases_link_in_a_non_primary_worktree\('], waived = false },
  { id = "VA-1", text = "V-12 — RE-RUN THE CENSUS ON THE CORRECTED AXIS: search for `.doctrine/state` path CONSTRUCTION, not `phases_dir` call sites. `rg -n 'state_dir|STATE_SLICE_DIR|\\.doctrine/state' src/` and disposition EVERY production hit. The RV-322-B pass found `integrity.rs:322` to be the only production hand-built site (`lazyspec.rs:1600` and `dispatch.rs:8300` are test helpers); this re-run must also cover sites THIS SLICE added across PHASE-01..05. R7 is live: one such site already existed and would have silently stopped guarding, and there is no guarantee another does not" },
