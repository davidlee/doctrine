# Implementation plan for SL-237 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-237"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (.doctrine/glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.
#
# ARRAY ORDER IS EXECUTION ORDER (`src/plan.rs` reads the ordered array and never
# sorts by id). Order here is 01 → 02 → 03 → 04 → 05, matching design.md § 8a.
#
# ── WHAT A VT MANDATE PROVES, AND WHAT IT DOES NOT ────────────────────────────
# `src/vtgate.rs::check_vt` NEVER RUNS A TEST. It proves that a slice-modified
# file contains each `keyword` as a raw substring — over unstripped source, so a
# comment satisfies it — and that each `patterns` regex matches at least one
# LINE. Nothing more. Three devices carry the real weight, per SL-233's plan:
#   1. `patterns` anchored at line start on a DECLARATION shape — a comment line
#      begins with `/`, so it cannot match.
#   2. Exit criteria that ENUMERATE THE EXACT TEST FUNCTION NAMES. The names are
#      the contract; omission is one grep away instead of hidden in a paraphrase.
#   3. `VA-NC` per phase — every named test observed RED before green, failing
#      output recorded in the phase sheet. A test never seen red is not evidence.
# Plus `VA-ES` (escape sweep) and `VA-G` (`doctrine check gate`) uniformly.
#
# ── THE BEHAVIOUR-PRESERVATION GATE (design V-1a / V-1b) ─────────────────────
# V-1a ("existing suites green") is an EXIT CRITERION on every phase and is
# discharged by `VA-G`; it carries no VT row of its own because a mandate over
# "the suites" has no single `test_file`. V-1b — the judgement that existing
# ASSERTIONS are unchanged and only construction sites were adapted — is VA-1 on
# PHASE-01, where the ~50-site churn actually lands.

[[phase]]
id        = "PHASE-01"
name      = "Root capability types and the phase-state migration"
objective = """
Introduce `PrimaryRoot` and `ReadRoot` in `src/git.rs` — the fallible write \
capability, the total read root, the one-way `From`, and the `#[cfg(test)]` \
`assume` seam — then migrate `phases_dir` and every phase-state function to them \
per design § 5.2's contract table, resolving ONCE per invocation at the \
command tier including both fan-out sites. This is the phase that actually \
single-homes repo-scoped phase state in the primary worktree; the remaining four \
phases are consequences of it. Registry functions that only need the F-3 \
two-root split (`capture_phase_boundary`, `record_source_delta`) migrate here; \
`boundaries_path`'s own contract change is PHASE-04."""
entrance_criteria = [
  { id = "EN-1", text = "REV-043 is `approved` (design § 8a, R4). `SL-237 needs REV-043` is an authored gate raised by RV-322 F-7: this phase does not start while the REV is `proposed`, because landing code that falsifies accepted governance is the risk the gate exists to stop. Check with `doctrine revision show REV-043` — approval `none` means STOP" },
  { id = "EN-2", text = "the working tree builds and `doctrine check gate` is green at the phase's branch point. The behaviour-preservation gate is a DELTA against a green baseline; a red baseline makes V-1a unfalsifiable. Note (2026-07-29): an unrelated `tests/common/mod.rs` `doctrine_cmd` signature refactor was in flight in the shared tree — confirm it has landed or is absent before starting" },
  { id = "EN-3", text = "design § 5.2's contract table is read as the authority for each signature. NO function's root type is inferred from its tier or its name — RV-322-B F-E is the finding that a tier-inferred split gives two names where one meaning suffices, and F-D is the finding that a name-inferred one asks the wrong tree" },
]
exit_criteria = [
  { id = "EX-1", text = "`PrimaryRoot` and `ReadRoot` are declared in `src/git.rs`, each wrapping a `PathBuf`, with `PrimaryRoot::resolve` (fallible), `PrimaryRoot::assume` (`#[cfg(test)]` only), `ReadRoot::resolve_for_read` (total), `as_path` on both, and `impl From<&PrimaryRoot> for ReadRoot`" },
  { id = "EX-2", text = "NO conversion from `ReadRoot` to `PrimaryRoot` exists anywhere in the tree — no `From`, no `TryFrom`, no constructor, no `as_primary`. This is the single property that makes the unsound direction unrepresentable rather than merely discouraged (RV-322 F-10); it is the one place in the slice where a type buys impossibility instead of visibility" },
  { id = "EX-3", text = "the repo/no-repo discriminator looks for `.git` in `cwd.ancestors()` using `exists()`, NEVER `is_dir()`, and rides `root::find_from` with `.git` ALONE — never `default_markers()`, which include `Cargo.toml`/`.project` and would read a non-repo Cargo project as a repo, inverting I-1. An `is_dir()` spelling classifies every linked worktree as `no repo`, hands it I-1's fallback, and homes state in the fork: the exact defect this slice removes, reintroduced by its own fallback (RV-322-B F-A)" },
  { id = "EX-4", text = "`resolve` is TOTAL only for I-1 (no repo at all ⇒ the given root is its own primary) and returns `Err` for a genuine resolution fault under a visible `.git` (I-2). It does not warn-and-continue: a warning does not stop the write that follows it (RV-322 F-6)" },
  { id = "EX-5", text = "`resolve_for_read` is TOTAL and falls back to the invoked `cwd` on a fault — byte-for-byte today's result, since `phases_dir` is a pure join off the invoked root (I-2b). This is not F-6's mistake repeated: F-6 killed a WRITE proceeding after a signal; this degrades a READ to the answer it already gives and writes nothing" },
  { id = "EX-6", text = "the § 5.2 rows owned by this phase have all landed: `phases_dir` → `(&ReadRoot, u32) -> PathBuf`; `phase_rollup` / `completed_phase_ids` / `read_phase_statuses` first param → `&ReadRoot`; `init_phases` → `&PrimaryRoot`; `edit_phase_sheet` and `reconcile_phase_status` → `&PrimaryRoot` ALONE (verified zero `git::` calls in either); `registry_completeness` COLLAPSES `(cwd, project_root)` to one `&PrimaryRoot`; `set_phase_status` and `capture_phase_boundary` take BOTH roots as `(primary: &PrimaryRoot, git_cwd: &Path, …)`; `record_source_delta` takes both (its `is_ancestor` and `parents` guards are git queries on the INVOKED tree)" },
  { id = "EX-6b", text = "SIDE EFFECT, EXPECTED, NOT SCOPE CREEP: `init_phases` is the SOLE caller of `refresh_symlink` (`state.rs:219`), so migrating it to `&PrimaryRoot` makes the `phases` symlink mint in the primary from this phase onward — DEC-097's MINT half, delivered incidentally. That is correct and must not be worked around. The RETIRE half is PHASE-05 and needs a second param this phase does NOT add; see PHASE-05 EX-1b for why the addition lands there rather than here" },
  { id = "EX-7", text = "`single_commit_boundary` (`state.rs:825`) is UNCHANGED and still takes `&Path` as the git cwd — it resolves a possibly-symbolic ref. Its caller (`slice.rs:3004`) has not been `tidied` onto the primary. § 5.2 lists it precisely so this phase does not touch it" },
  { id = "EX-8", text = "resolution happens ONCE per invocation at the command tier: the `run_*` entry points in `slice.rs`, `dispatch.rs`, `mcp_server/dispatch.rs`, plus `phase_receipt` (`mcp_server/dispatch.rs:1085`, which resolves `phases_dir` off `coord.root` today and is not a `run_*`), plus `lazyspec::load_slices` (`lazyspec.rs:495`)" },
  { id = "EX-9", text = "BOTH fan-out sites resolve OUTSIDE their loop: `list_rows` (`slice.rs:2145`, the `.map()` at `:2161` over every surviving `Meta`) and `load_slices` (`lazyspec.rs:495` → `load_plan:518` → `phase_rollup:535`, where the root is threaded THROUGH `load_plan`). With 221 slice dirs a per-call resolution is ~221 `git worktree list` subprocesses per command, twice over. The pre-design round found only the first; missing the second leaves half the regression in place because lazyspec projects EVERY slice" },
  { id = "EX-10", text = "the tests named in EX-11 exist and are green, and existing suites are green with their ASSERTIONS unchanged — only construction sites adapted, via `PrimaryRoot::assume` in test modules. Routing tests through the impure `resolve` would convert pure path-join tests into git-dependent ones, changing what the suites prove (R1)" },
  { id = "EX-11", text = "the tests are EXACTLY these seven, and the names are the contract: in `src/git.rs` — `resolve_without_a_repo_yields_the_given_root`, `resolve_from_a_linked_worktree_yields_the_primary`, `resolve_refuses_when_resolution_faults_under_a_visible_git`, `resolve_for_read_falls_back_to_the_invoked_root_on_a_fault`; in `src/state.rs` — `phases_dir_resolves_against_the_primary_from_a_linked_worktree`, `set_phase_status_records_the_invoked_trees_head_as_the_boundary`; in `src/slice.rs` — `list_rows_renders_when_git_worktree_list_fails`. Plus the e2e in EX-12" },
  { id = "EX-12", text = "`tests/e2e_conformance_single_home.rs` exists and contains `conformance_agrees_from_the_primary_and_a_linked_worktree` — ISS-269's reproduction INVERTING. This is the slice's headline outcome and the first point at which it is observable end to end" },
]
verification = [
  { id = "VT-1", expects = "both capability types are real declarations with the one-way conversion — the patterns anchor at line start on `struct` and `impl`, which a comment cannot satisfy", test_file = "src/git.rs", keywords = ["PrimaryRoot", "ReadRoot", "resolve_for_read"], patterns = ['^\s*pub\(crate\) struct PrimaryRoot\b', '^\s*pub\(crate\) struct ReadRoot\b', '^\s*impl From<&PrimaryRoot> for ReadRoot\b'], waived = false },
  { id = "VT-2", expects = "all four resolver-contract tests exist as functions (I-1, R10's linked-worktree discriminator, I-2's refusal, I-2b's read fallback)", test_file = "src/git.rs", keywords = ["assume"], patterns = ['^\s*fn resolve_without_a_repo_yields_the_given_root\(', '^\s*fn resolve_from_a_linked_worktree_yields_the_primary\(', '^\s*fn resolve_refuses_when_resolution_faults_under_a_visible_git\(', '^\s*fn resolve_for_read_falls_back_to_the_invoked_root_on_a_fault\('], waived = false },
  { id = "VT-3", expects = "`phases_dir` takes the WEAKER type and its primary-resolution is pinned from a linked worktree — the migration's core assertion", test_file = "src/state.rs", keywords = ["ReadRoot", "PrimaryRoot"], patterns = ['^\s*pub\(crate\) fn phases_dir\(', '^\s*fn phases_dir_resolves_against_the_primary_from_a_linked_worktree\('], waived = false },
  { id = "VT-4", expects = "the F-3 two-root split is real at the signature AND pinned by the regression it exists to prevent — a solo linked worktree recording the INVOKED tree's HEAD, not the primary's", test_file = "src/state.rs", keywords = ["git_cwd"], patterns = ['^\s*pub\(crate\) fn set_phase_status\(', '^\s*fn set_phase_status_records_the_invoked_trees_head_as_the_boundary\('], waived = false },
  { id = "VT-5", expects = "a read verb keeps working in a repo whose `git worktree list` exits fatal (R9) — reproduce with a linked worktree whose admin dir is pruned, where `.git` survives as a file", test_file = "src/slice.rs", keywords = ["ReadRoot"], patterns = ['^\s*fn list_rows_renders_when_git_worktree_list_fails\('], waived = false },
  { id = "VT-6", expects = "ISS-269's inversion is observable end to end: `slice conformance` agrees from the primary and from a linked worktree", test_file = "tests/e2e_conformance_single_home.rs", keywords = ["conformance"], patterns = ['^\s*fn conformance_agrees_from_the_primary_and_a_linked_worktree\('], waived = false },
  { id = "VA-1", text = "V-1b — DIFF REVIEW: `git diff` over every touched test module shows only CONSTRUCTION sites adapted (a `&Path` becoming `PrimaryRoot::assume(p)` or `(&root).into()`). No assertion's expected value changed. An assertion edited to accommodate the new types is a behaviour-preservation FAILURE, not a fix — the ~20 tests that run on non-git tempdirs and rely on I-1 are this invariant's acceptance evidence and must stay green UNCHANGED" },
  { id = "VA-2", text = "V-9 — RUN and READ, do not infer from the type: open `slice.rs:2145` (`list_rows`) and `lazyspec.rs:495` (`load_slices`) and confirm at the CALL SITE that the root is resolved before the loop and threaded in. R-2 is the proof that a type makes a fan-out VISIBLE, not impossible — a caller can still put `resolve` inside a loop, and one already did. Report both line numbers" },
  { id = "VA-3", text = "V-15 — `registry_completeness` takes ONE root, and BOTH call sites (`slice.rs:2861`, `dispatch.rs:3477`) pass the primary. Keeping two params preserves the one-name-two-jobs hazard inverted: a site left passing `(&primary, &invoked_root)` reads the completed-set from a tree that no longer holds sheets — spurious `Incomplete` when rows exist, and VACUOUS `Complete` when they do not, because `check_completeness` returns `Complete` for empty/empty (`state.rs:947`)" },
  { id = "VA-4", text = "V-16 — RUN `rg -n 'PrimaryRoot::assume' src/` and confirm every hit is inside a `#[cfg(test)]` module: `assume` has NO production consumer (F-C). `prepare_review` (`dispatch.rs:3449-3471`) does `git::primary_worktree(root)?`, which is exactly what `resolve` does at identical cost, so `resolve` fits there. Also confirm `edit_phase_sheet` / `reconcile_phase_status` take the primary ALONE, and `record_source_delta`'s `is_ancestor`/`parents` guards take `git_cwd`" },
  { id = "VA-5", text = "V-18 — RUN `rg -n 'impl From<.*ReadRoot.*> for PrimaryRoot|fn as_primary|fn to_primary|TryFrom<ReadRoot>' src/` — zero hits, and confirm by reading that no other path forges the write capability from a fallback root. A compile-fail test (trybuild or equivalent) is PREFERABLE to a review assertion if one is cheap; if it is not, say so explicitly rather than silently downgrading to the grep" },
  { id = "VA-6", text = "V-8b — argue worker write exclusion PER ARM from the actual mechanism, NOT by testing an unreachable EROFS path. All four legs: (i) the CLI refusal covers the whole `WriteClass::Write` set, not just `slice phase`/`slice phases` (`commands/guard.rs:74-101` — `record-delta`, `reconcile-phases`, `slice status` are all `Write`); (ii) `worker_mode` holds via the ENV leg on codex/pi (`scripts/pi-spawn-confined.sh:110` sets `DOCTRINE_WORKER 1` unconditionally) and via the MARKER leg on claude (`worktree/marker.rs:158-166`) — the arms DIFFER and the argument must say so; (iii) each arm's OS floor; (iv) `worker_commit`'s unconfined-server exception writes no phase sheet and no registry row (`mcp_server/worker_commit.rs:313-338`). An invariant asserted without its known exception is the F-2 failure again" },
  { id = "VA-7", text = "ANTI-TIDY: `git diff src/state.rs` shows `single_commit_boundary` untouched and `slice.rs:3004` still passing the invoked tree (EX-7). This row exists because the surrounding functions all move and a tidying instinct will reach for this one" },
