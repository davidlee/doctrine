[[phase]]
id        = "PHASE-06"
name      = "Retire the plugin activation, and document the cutover"
objective = """
Delete doctrine's automated marketplace and plugin-install steps with their
transitive closure and their `--dev` flag, correct the four claims the
retirement falsifies, and ship the activation, scope-key, command-form, cutover
and escape-hatch documentation the removal makes load-bearing. Last, because
activation and skills must both come from direct writes before the plugin path
goes — order toward the degraded state, never the absent one.
"""

entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 and PHASE-05 landed, so both direct-write channels are live before the plugin path is removed. `DEC-167`'s ordering argument applied at phase granularity: between PHASE-04 and this phase every hook fires twice, which is the intended cost; the reverse order would leave an interval with no activation, and absence is the more dangerous state because `isolation: worktree` teardown is conditional on `WorktreeCreate` firing." },
  { id = "EN-2", text = "The deletion inventory and its transitive closure are enumerated in design.md `sec-4`, and every symbol resolves at the cited line — `claude_plugin_install` (`src/install.rs:619`), `MarketplaceManifest` (`:672`), `ManifestPlugin` (`:679`), `select_plugin` (`:687`), `enable_key` (`:698`), `MARKETPLACE_MANIFEST_REL` (`:703`), `select_marketplace_source` (`:713`), `claude_list_has` (`:765`), `parse_registered_source` (`:796`), `source_matches` (`:830`), `marketplace_action` (`:843`), `refresh_failure_is_fatal` (`:858`), `InstallArgs.dev` (`:187`). Verified 2026-08-08. The workspace denies `dead_code`, so an implementer working a partial inventory ships a red gate, not a stale helper." },
  { id = "EN-3", text = "`publication/manifest.toml` is the registry for published reference docs — `using-doctrine.md` is registered there as `address = \"reference/using-doctrine.md\"` (`:866-873`). Reference docs are published, not projected (ADR-019), so a new one is an `[[entry]]` there plus the file under `install/`, not a projected copy on disk." },
]

