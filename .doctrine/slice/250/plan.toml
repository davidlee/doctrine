# Implementation plan for SL-250 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-250"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

[[phase]]
id        = "PHASE-01"
name      = "The merge core: ordered matcher set and the command-form axis"
objective = """
Generalise `HookSpec` from one matcher to an ordered matcher set and from a
rendered command to `exec` + `args`, introduce the `CommandForm` rendering axis
threaded to both harness arms, and collapse the suffix-strip ownership
predicates onto one helper. A strict generalisation with N=1 as the existing
case, so both arms' emitted JSON stays byte-identical and nothing about
activation changes yet.
"""

entrance_criteria = [
  { id = "EN-1", text = "design.md `sec-2` is the reference, and every symbol it names resolves in the current tree — `HookSpec` (`src/boot.rs:965`), `desired_entry` (`:876`), `owned_positions` (`:1039`), `entry_is_canonical` (`:1060`), `hook_is_sole` (`:1078`), `entry_has_foreign_hook` (`:1090`), `drop_owned_hooks` (`:1108`), `hook_array_mut` (`:1127`), `plan_hook` (`:1153`), `fallback_for` (`:1224`), `annotate_fallback` (`:1579`), `install_hook_to_file` (`:1595`), `install_claude_hook` (`:1617`), `install_codex_hook` (`:1628`). Verified 2026-08-08; the design's `:1587` for `fallback_for` is its call site inside `annotate_fallback`, not its definition." },
  { id = "EN-2", text = "`MCP_COMMAND` (`src/boot.rs:549`) already holds the literal `${DOCTRINE_BIN:-doctrine}`, so `PORTABLE_EXEC` is a rename of a live constant with three existing consumers (`desired_mcp_entry`, the `plan_mcp` comparator, `is_doctrine_mcp_entry`) — not a new literal (STD-001)." },
  { id = "EN-3", text = "`RESOLVE_EMIT_ARGS` (`:862`) and `LEGACY_EMIT_ARGS` (`:866`) exist and `is_doctrine_emit_command` (`:932`) already recognises both, so the `SessionStart` emit spec's canonical-vs-legacy healing needs no new machinery." },
]

exit_criteria = [
  { id = "EX-1", text = "`HookSpec` carries `exec: PathBuf`, `args: &'static str`, `is_ours`, `event`, and `matchers: &'static [&'static str]`. No rendered `command` field remains — rendering is a function of the spec and the form." },
  { id = "EX-2", text = "`CommandForm { Baked, Portable }` and `command_for(spec, form)` live in `src/boot.rs`. The form is an explicit parameter of `install_hook_to_file`, `plan_hook`, `annotate_fallback` and `fallback_for`, and is NEVER re-derived from `rel_path` inside the core — the caller's decision is passed, not reverse-engineered. `CommandForm` is `pub(crate)`, because `fallback_for` is and `src/corpus.rs:521` is its SIXTH call site: widening `fallback_for` compels a change in `corpus.rs` this phase, which passes `CommandForm::Baked` until PHASE-02 gives it a scope to ask." },
  { id = "EX-3", text = "`install_codex_hook` passes `CommandForm::Baked` on its own file's gitignored status (`.gitignore:9`, `/.codex`), not on any Claude-settings concept. `install_claude_hook` also passes `CommandForm::Baked` this phase, because it still writes `settings.local.json`; PHASE-02 replaces that one expression. No Claude-settings scope type exists yet." },
  { id = "EX-4", text = "`desired_entries(spec, form)` emits one entry per matcher in matcher order, each carrying the one rendered command. `fallback_for` renders the whole set, so a malformed-settings repair snippet is complete rather than one entry of it." },
  { id = "EX-5", text = "`plan_hook`'s no-write short-circuit is a positional zip of `owned_positions` against `spec.matchers` — same length, same order, each canonical and sole. The write branch drops every owned hook and inserts the set contiguously at the first owned slot (`ins + k`), or appends at the tail when nothing is owned. `drop_owned_hooks`, `owned_positions`, `entry_has_foreign_hook`, `hook_is_sole` and `hook_array_mut` are unchanged." },
  { id = "EX-6", text = "`is_doctrine_command(cmd, args)` is the shared suffix-strip ownership helper, and `is_doctrine_sync_command`, `is_doctrine_create_fork_command` and `is_doctrine_emit_command` become one-liners over it. `is_doctrine_boot_command` is deliberately LEFT ALONE: its `rsplit_once(char::is_whitespace)` form (`:891-896`) accepts a tab or newline separator where the helper requires a literal single space, so collapsing it would be a behaviour change, not a refactor." },
  { id = "EX-7", text = "`is_doctrine_program` gains exactly one arm, `p == PORTABLE_EXEC`. It is a strict widening — `Path::new(\"${DOCTRINE_BIN:-doctrine}\").file_name()` yields the whole token, never `doctrine` — so the two arms cannot collide and no foreign command becomes owned." },
  { id = "EX-8", text = "Constants are named per STD-001: `SETTINGS_LOCAL_REL` (renamed from `SETTINGS_REL`), `SETTINGS_PROJECT_REL`, `PORTABLE_EXEC` (renamed from `MCP_COMMAND`), the five `EVENT_*` names replacing inline event literals, and the matcher-set slices `SESSION_MATCHERS` / `SESSION_MATCHERS_CODEX` / `WORKTREE_CREATE_MATCHERS`." },
  { id = "EX-9", text = "`HookSpec::boot_emit(exec, matchers)` takes its matcher set; the Codex caller passes `SESSION_MATCHERS_CODEX`. NO new production constructors land this phase — the four new specs arrive in PHASE-04 with their caller, so this phase introduces no `dead_code` allowance. Multi-matcher coverage is driven by a test-local `HookSpec`, which also keeps the core's tests independent of the registry." },
  { id = "EX-10", text = "`HookSpec::create_fork` and `HookSpec::boot` keep their existing `expect(dead_code)` attributes — nothing ships them until PHASE-04 (`create_fork`) or ever (`boot`, `DEC-162`)." },
]

verification = [
  { id = "VT-1", expects = "the matcher set emits, is idempotent, and heals: a four-matcher spec into empty settings yields four entries in matcher order; re-planning returns RefreshOutcome::None with no JSON; deleting one of the four rewrites all four; and an owned entry on a retired matcher is recognised by command-only ownership and rewritten onto the canonical set", test_file = "src/boot.rs", keywords = ["desired_entries", "plan_hook_emits_one_entry_per_matcher", "plan_hook_is_a_no_op_on_the_canonical_set", "plan_hook_heals_a_partial_hand_edit", "plan_hook_heals_a_stale_matcher"], waived = false },
  { id = "VT-2", expects = "never-clobber survives N>1: foreign entries before and after the owned block survive and the set inserts at the first owned slot, and an entry carrying both an owned and a foreign hook keeps the foreign one with the set inserted after it", test_file = "src/boot.rs", keywords = ["plan_hook_preserves_foreign_entries_around_a_matcher_set", "plan_hook_preserves_a_foreign_hook_sibling"], waived = false },
  { id = "VT-3", expects = "the N=1 gate, asserted rather than assumed: HookSpec::sync produces byte-identical JSON to the pre-slice output, and install_codex_hook under CommandForm::Baked emits a byte-identical .codex/hooks.json", test_file = "src/boot.rs", keywords = ["CommandForm", "single_matcher_specs_are_unchanged", "the_codex_arm_renders_the_baked_form"], waived = false },
  { id = "VT-4", expects = "ownership spans both command forms — is_doctrine_program recognises the portable literal and an abspath including the `/proc/self/exe` ` (deleted)` poison suffix — and the shared suffix-strip helper backs the collapsed predicates", test_file = "src/boot.rs", keywords = ["PORTABLE_EXEC", "is_doctrine_command", "ownership_spans_both_command_forms"], waived = false },
  { id = "VA-1", expects = "behaviour-preservation class (i): no file under tests/ is edited by this phase. `plan_mcp`'s tests change in the MCP_COMMAND → PORTABLE_EXEC identifier only, with no assertion rewritten; `check_spawn_seam_symmetry_passes_the_shipped_hooks_config` (src/doctor_checks.rs:1983) passes unmodified; `is_doctrine_boot_command` is textually unchanged. Any red here is a real narrowing of the merge core, not an expected consequence." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Scope selection: the sticky key and the scope-selected write"
objective = """
Add `ClaudeSettingsScope` and its sticky `[install] claude-settings-scope` key,
resolve it INSIDE `install_claude_hook` rather than at its call sites, point
both the hook write and `install_baseref` at the selected file, flip the default
to `Project` with the portable command form that a tracked file requires — and
rewrite the enumerated class-(ii) assertions the flip knowingly invalidates,
and only those.
"""

entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 landed: `CommandForm` is a parameter of the merge core and `install_claude_hook` passes `CommandForm::Baked`. This phase replaces that one expression with the scope's form, so the wire already exists and nothing threads further." },
  { id = "EN-2", text = "`InstallConfig` (`src/install_config.rs:21`) carries `repo` under `#[serde(default)]` with NO container `rename_all`, and `DispatchConfig` (`src/dispatch_config.rs:50-51`) carries `#[serde(rename_all = \"kebab-case\", default)]` — the precedent that makes `[dispatch] preferred-subprocess-harness` bind. Neither `InstallConfig` nor `DoctrineToml` sets `deny_unknown_fields`, so a misbound key is silently discarded. Verified 2026-08-08." },
  { id = "EN-3", text = "ADR-001 layering is authoritative and encoded: `install_config = \"leaf\"` with out=0, `boot = \"command\"` (`.doctrine/adr/001/layering.toml:34`, `:90`). `install_config` therefore cannot name a type from `boot` — that is both a tier inversion and a cycle, since `boot` already reaches `install_config` through `dtoml`. See plan.md § The one departure from design sec-2." },
]

exit_criteria = [
  { id = "EX-1", text = "`ClaudeSettingsScope { Project (#[default]), Local }` lives in `src/install_config.rs` with `#[serde(rename_all = \"kebab-case\")]` on the ENUM (governing the values `project` / `local`) and `#[serde(rename_all = \"kebab-case\", default)]` on the CONTAINER `InstallConfig` (governing the field name `claude-settings-scope`). Both attributes are present — the enum one alone leaves the documented spelling silently discarded." },
  { id = "EX-2", text = "`ClaudeSettingsScope::sibling()` is defined in `install_config` (pure vocabulary, no path knowledge). The two mappings that need a `boot` type or a `boot` constant — `settings_rel(scope) -> &'static str` and `command_form(scope) -> CommandForm` — BOTH live in `src/boot.rs` beside the path constants and the core that consumes them. `install_config` gains no out-edge and stays out=0." },
  { id = "EX-3", text = "`install_claude_hook` resolves the scope from `load_doctrine_toml(root)` ITSELF and returns `HookWrite { scope, written }`. The scope is not a parameter: `run_sync_install` is the routine flagless caller `DEC-163` argues about, and a parameter it could omit is the defect. The cost is one small TOML read per spec, deliberately accepted." },
  { id = "EX-4", text = "`install_baseref(root, scope, dry_run)` writes `worktree.baseRef` into the SAME file as the hooks, so doctrine authors one Claude settings file per install rather than two. The value `\"head\"` is project semantics with nothing per-machine in it, so it is safe in a tracked file." },
  { id = "EX-5", text = "`RefreshReport.hook: RefreshOutcome` becomes `hooks: Vec<RefreshOutcome>` and the struct gains `claude_scope: Option<ClaudeSettingsScope>` — `None` on the Codex arm, widened to a tuple with `SweepReport` in PHASE-03. `wire`'s `match report.hook { … }` becomes the same match inside a `for`, with the four `RefreshOutcome` arms and their message strings unchanged, so the Codex arm's output stays byte-identical." },
  { id = "EX-6", text = "`run_sync_install` (`src/corpus.rs:506`) matches `write.written` for its four existing arms and passes `write.scope`'s form to `fallback_for` at `:521`. `memory sync install` inherits the scope and the command form without electing to." },
  { id = "EX-7", text = "The class-(ii) sites the default flip invalidates are rewritten to `SETTINGS_PROJECT_REL` — NOT mechanically renamed to `SETTINGS_LOCAL_REL`, which would land red with the wrong constant: `install_claude_hook_wires_boot_and_sync_as_two_entries` (`src/boot.rs:4180`, reads `:4190`, `:4204`), `install_claude_hook_sync_respects_dry_run` (`:4216`, `:4223`), the create-fork case (`:4250`), `wire_adds_import_and_hook_then_is_idempotent` (`:4755`, `:4766`, `:4782`, `:4797`), the malformed-settings case (`:4809`), the hymns/boot case (`:5523`), the three and only three `out.hook` assertions (`:3916`, `:3924`, `:3953`), and the `worktree.baseRef` assertions in `:3904`. The design cites the last two by line only; they are `wire_isolates_one_harness_failure` (`:4802`, reads `:4809`) and `claude_hook_unchanged_after_dry_refactor` (`:5514`, reads `:5523`) — named here because PHASE-01's renames move every line number in this list." },
  { id = "EX-8", text = "`install_refresh_writes_settings_and_respects_dry_run`'s `commands(&json).is_empty()` assertion is NOT touched here. The Claude arm still writes no hooks until PHASE-04, which is where that assertion inverts. Touching it now would move an expected red off the phase that causes it." },
  { id = "EX-9", text = "`:3926`, `:3948` (`out.mcp`) and `:5303` (`out.mcp_extension`) are deliberately NOT edited — neither field changes shape. The class-(ii) enumeration is exact, because a table that exists so an uncited red reads as class (i) is worthless if it is loose." },
  { id = "EX-10", text = "ONE class-(ii) site outside `src/boot.rs`, which design.md `sec-7`'s table does not reach because it is scoped to that file: `sync_install_wires_a_session_hook_no_boot_hook_settings_wired` (`tests/e2e_memory_sync.rs:154`) reads `.claude/settings.local.json` at `:159` and asserts the sync hook landed there with `.expect(\"settings written\")` at `:189`. `run_sync_install` writing to the project file makes that PANIC, not merely fail. It is rewritten to the scope-selected file. Found by re-grepping `tests/` for both settings paths on 2026-08-08; `tests/e2e_worktree_import.rs:333` / `:635` only SEED settings files as fixtures and are unaffected." },
]

verification = [
  { id = "VT-1", expects = "the key binds from its documented spelling, written against PARSED TOML TEXT rather than the constructed enum: `[install]\\nclaude-settings-scope = \"local\"` yields Local, an absent key and an absent [install] table both yield Project, and the underscore spelling does NOT bind (so a serde alias cannot be used to 'fix' a missing container rename_all)", test_file = "src/install_config.rs", keywords = ["ClaudeSettingsScope", "claude_settings_scope", "rename_all", "absent_key_defaults_to_project_scope", "scope_key_binds_from_its_documented_spelling"], waived = false },
  { id = "VT-2", expects = "the scope selects the file for both writers: `local` puts hooks and worktree.baseRef in .claude/settings.local.json and `project` puts both in .claude/settings.json, so doctrine authors one Claude settings file rather than two", test_file = "src/boot.rs", keywords = ["settings_rel", "SETTINGS_PROJECT_REL", "scope_key_selects_the_settings_file", "baseref_follows_the_scope"], waived = false },
  { id = "VT-3", expects = "the command form follows the file's tracking status in both directions — the tracked project file carries ${DOCTRINE_BIN:-doctrine} and no absolute exec path anywhere, the gitignored local file keeps the baked abspath — which is SL-195's INV-1 (no absolute host path in any tracked file) asserted for hooks", test_file = "src/boot.rs", keywords = ["project_scope_writes_the_portable_command", "local_scope_keeps_the_baked_path"], waived = false },
  { id = "VT-4", expects = "memory sync install honours the scope key, driven through run_sync_install rather than install_claude_hook — so it proves the resolution-inside-the-installer decision rather than restating it", test_file = "src/corpus.rs", keywords = ["run_sync_install", "HookWrite", "memory_sync_install_honours_the_scope_key"], waived = false },
  { id = "VA-1", expects = "behaviour-preservation class (i) still holds under a knowingly-red class (ii): the Codex arm's emitted .codex/hooks.json is byte-identical, `check_spawn_seam_symmetry_passes_the_shipped_hooks_config` passes unmodified, and `plan_mcp`'s tests are untouched beyond PHASE-01's rename. Every rewritten assertion is on the EX-7 list; any red outside it is a real narrowing." },
  { id = "VA-2", expects = "`install_config` remains a pure leaf with out=0 — `tests/architecture_layering.rs` passes with no new edge and no entry added to `.doctrine/adr/001/layering.toml` for it. This is the criterion the design's literal placement of `command_form()` would fail." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "The abandoned-scope sweep and the shared scope report"
objective = """
Add the drop-only sweep of the scope being left — gated on the target write
actually landing, reported as a per-spec `EvictOutcome` folded into a per-file
`SweepReport` that prints every true fact rather than the most severe one — and
the shared announcement writer both install paths call, so the slice's one
destructive write is never silent on either path.
"""

entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 landed: `install_claude_hook` resolves the scope and returns `HookWrite`, and `ClaudeSettingsScope::sibling()` exists. This phase adds the `evicted` field to `HookWrite` and widens `RefreshReport.claude_scope` to `Option<(ClaudeSettingsScope, SweepReport)>`." },
  { id = "EN-2", text = "`plan_hook` turns malformed JSON and a wrongly-typed `hooks` / `hooks.<event>` into `RefreshOutcome::PrintedFallback` (`src/boot.rs:1159-1168`, `:1170-1178`), an Ok value carried out through `install_hook_to_file` (`:1611`). A bare `?` therefore CANNOT see a failed write — the guard must match on the value. Verified 2026-08-08." },
  { id = "EN-3", text = "`BaseRefOutcome::Conflict(String)` (`src/boot.rs:1333-1340`) already exists and already reports a non-`head` override left untouched, and Claude settings precedence is explicit — Local 'overrides project and user settings' (`docs/claude/settings.md:56-57`), with only permission rules merging. Verified 2026-08-08." },
]

exit_criteria = [
  { id = "EX-1", text = "`parse_settings(existing_json) -> Option<Value>` is extracted and shared by both planners: absent or empty yields an empty object, malformed yields `None`. This is what keeps `plan_evict` from being a second copy of `plan_hook`'s prologue." },
  { id = "EX-2", text = "`plan_evict(existing_json, spec)` drops this spec's owned entries and NEVER inserts; `evict_hook_from_file` is `install_hook_to_file` with `plan_evict` in place of `plan_hook`, writes atomically through `fsutil::write_atomic`, and creates no file that does not exist. Neither takes a `CommandForm` — eviction is by ownership predicate and ownership is command-only (`DEC-161`), so both command forms are owned in either file, which is exactly what makes the scope switch heal rather than orphan." },
  { id = "EX-3", text = "`EvictOutcome { Nothing, Removed(usize), Unreadable, NotAttempted }` — four states. `NotAttempted` ('we chose not to sweep') is distinct from `Nothing` ('there was nothing to sweep') and from `Unreadable` ('we could not'); an ABSENT sibling parses to an empty object and reaches `Nothing`, never `Unreadable`." },
  { id = "EX-4", text = "The sweep runs ONLY when this spec's write to the target landed: `Wired` / `Refreshed` / `None` sweep, `PrintedFallback` yields `NotAttempted`. Ordering write-before-evict does not buy this on its own — the sibling reads fine and the sweep would SUCCEED, which is what makes it destructive. This guard is what stops one malformed committed settings file producing zero activation." },
  { id = "EX-5", text = "`SweepReport { removed: usize, unreadable: bool, skipped: bool }` — a count and two flags, folded by `absorb`. NO state is absorbing: `Unreadable` is a fact about one spec's `hooks.<event>`, not about the file, so a run can remove entries AND fail to sweep another event AND skip a third, and all three print." },
  { id = "EX-6", text = "`write_scope_report(out: &mut dyn Write, tag, scope, swept)` is the single writer of the scope announcement and the sweep rider, called by BOTH `wire`'s Claude arm (before its hook lines, with the folded report) and `run_sync_install` (with its single `HookWrite` lifted through `SweepReport::from`). It takes the handle its callers already hold — `print_stdout` is denied (`Cargo.toml:228`) and no new output surface is created." },
  { id = "EX-7", text = "The announcement names the target file and the `[install] claude-settings-scope` key that changes it, and prints before any hook line — this is what replaces the `--scope` flag `DEC-163` drops, so it is a criterion, not a nicety. The rider prints one line per TRUE `SweepReport` fact, and the skipped line reads as the warning it is: the activation is still in the other file and it is the only copy." },
  { id = "EX-8", text = "`install_baseref` inspects the sibling for a `worktree.baseRef` and the report names the stranded file, value and remedy. The key is NEVER swept — eviction is spec-keyed over `hooks.<event>` arrays and `worktree.baseRef` is a top-level key with no spec, and extending a destructive path to non-hook keys is the wrong trade. No-clobber survives, so the report is the whole of the signal, and it matters because local precedence means the stranded value still governs where the Claude dispatch arm forks from." },
]

verification = [
  { id = "VT-1", expects = "the R10 behavioural criterion and its safety contracts: installing at project scope removes the owned entry seeded in settings.local.json, leaves it present in settings.json, and reports the count; a foreign hook in the abandoned file survives; a stale-matcher owned entry there is still evicted (the healing property, where an orphan would be unreachable by any later install); and the abandoned file only ever shrinks, with a sweep of an absent sibling creating nothing", test_file = "src/boot.rs", keywords = ["plan_evict", "EvictOutcome", "writing_one_scope_evicts_the_other", "eviction_spares_foreign_entries", "eviction_heals_a_stale_matcher_in_the_abandoned_file", "eviction_never_inserts"], waived = false },
  { id = "VT-2", expects = "a failed sweep is reported, not silent, and the fold is not absorbing: malformed JSON and a wrongly-typed hooks.<event> are both left untouched and both yield Unreadable with the file named; and one sibling whose hooks.SessionStart holds an owned entry while hooks.SubagentStart is a string yields removed == 1 AND unreadable == true, with both rider lines printed", test_file = "src/boot.rs", keywords = ["SweepReport", "absorb", "plan_evict_is_fail_soft_on_malformed_json", "a_failed_sweep_is_reported_not_silent", "a_partly_successful_sweep_reports_both_facts"], waived = false },
  { id = "VT-3", expects = "the F-12 criterion, and the one that would go red without the guard: with a malformed .claude/settings.json and a well-formed .claude/settings.local.json carrying the owned entries, installing at Project scope leaves the local entries SURVIVING, yields EvictOutcome::NotAttempted, and says it did not sweep and why. The failure this catches is a SUCCESSFUL sweep", test_file = "src/boot.rs", keywords = ["NotAttempted", "a_failed_target_write_does_not_trigger_the_sweep"], waived = false },
  { id = "VT-4", expects = "a scope switch heals rather than orphans, and a stranded override is reported: an abspath entry in the file now being written is owned-but-not-canonical so it is rewritten to the portable form, an abspath entry in the abandoned file is evicted; and a seeded worktree.baseRef = \"main\" in the abandoned file is NOT removed while the project file gets \"head\" and the report names the stranded value and the remedy", test_file = "src/boot.rs", keywords = ["a_scope_switch_rewrites_the_command_form", "a_stranded_baseref_override_is_reported"], waived = false },
  { id = "VT-5", expects = "the F-2 criterion: run_sync_install with a seeded owned entry in the sibling emits both the scope announcement and the eviction rider into its captured output — without this the slice's one destructive write is silent on the highest-frequency install path and every other test still passes", test_file = "src/corpus.rs", keywords = ["write_scope_report", "memory_sync_install_reports_scope_and_eviction"], waived = false },
  { id = "VA-1", expects = "never-clobber is untouched on the destructive path: eviction is gated by exactly the predicate that protects foreign entries during a normal merge, `plan_evict` shares `owned_positions` and `drop_owned_hooks` with `plan_hook` rather than reimplementing either, and no new ownership predicate is introduced for the sweep." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "The seven-spec registry: wire the Claude arm"
objective = """
Add the four new specs and their predicates, build `claude_hook_specs` as the
single enumeration of what doctrine activates, and drive it from
`install_refresh`'s Claude arm — eleven settings entries across five events
where the arm has written none since SL-152 PHASE-06. This is the phase where
activation flips and every golden that asserts the opposite inverts.
"""

entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 through PHASE-03 landed: the matcher set, the command form, the scope dial, the sweep and the shared report all exist, so this phase adds specs and a loop rather than mechanism." },
  { id = "EN-2", text = "`plugins/doctrine/hooks/hooks.json` carries exactly TEN entries across five events, every command already `${DOCTRINE_BIN:-doctrine} <verb>` with `${CLAUDE_PLUGIN_ROOT}` appearing nowhere. Verified 2026-08-08 by parsing the file. The ten collapse onto SIX specs; `sync` is the seventh because it shares the file, the scope dial and the sweep, having been direct-written since SL-018." },
  { id = "EN-3", text = "The `SessionStart` emit spec writes the CANONICAL CURRENT command `prompt resolve --role orchestrator` on `startup|clear`, not the plugin's stale `boot --emit` on `*`. `is_doctrine_emit_command` (`src/boot.rs:932-934`) already recognises both `RESOLVE_EMIT_ARGS` and `LEGACY_EMIT_ARGS`, so the stale entry retires by the healing property with no migration step." },
]

exit_criteria = [
  { id = "EX-1", text = "Four new `HookSpec` constructors — `nominate`, `denominate`, `pretooluse`, `memory_surface` — and their four ownership predicates, each a one-liner over PHASE-01's `is_doctrine_command`. `HookSpec::create_fork`'s `expect(dead_code)` comes off: it acquires a production caller here. `HookSpec::boot` keeps its own — nothing ships it (`DEC-162`)." },
  { id = "EX-2", text = "`claude_hook_specs(exec) -> Vec<HookSpec>` is the single enumeration, in emission order: `boot_emit` (SESSION_MATCHERS), `sync`, `create_fork`, `nominate`, `denominate`, `pretooluse`, `memory_surface`. Building it as a function rather than seven scattered calls is what makes IMP-407's conformance check cheap." },
  { id = "EX-3", text = "`install_refresh`'s Claude arm loops the registry, folding each `HookWrite` into `hooks` and `swept`, then calls `install_baseref(root, scope, dry_run)` and the unchanged `install_mcp`. A mid-loop failure aborts the arm via `?` — the correct shape, since every write is atomic and independently idempotent and a re-run completes the set — but carries `with_context` naming the spec that failed and how many landed before it, because the accumulated report is dropped with the aborted arm and the interim state straddles both files." },
  { id = "EX-4", text = "Eleven settings entries land in the scope-selected file across five events: SessionStart 2, WorktreeCreate 1, SubagentStart 1, SubagentStop 1, PreToolUse 6. Eleven is the number a human counts in `/hooks`; seven is the spec count, and a criterion written against seven would pass a four-entries-short install." },
  { id = "EX-5", text = "`install_refresh_writes_settings_and_respects_dry_run`'s `commands(&json).is_empty()` assertion (`src/boot.rs:3904`) INVERTS — it is not renamed. Its comment ('no boot hook wired for Claude (ships via plugin)') goes with it." },
  { id = "EX-6", text = "`tests/e2e_claude_install.rs`'s three 'ships via plugin' assertions (`:170`, `:174`, `:178`) invert to assert the entries are present in the scope-selected file. The SubagentStart assertion changes meaning: the retired SL-152 stamp hook stays absent, but the `worktree nominate` entry is now present." },
  { id = "EX-7", text = "`plugins/doctrine/hooks/hooks.json` is NOT edited and `SpawnSeamSymmetry` (`src/doctor_checks.rs:673`) needs no change — its input survives this slice as the published plugin's payload." },
]

verification = [
  { id = "VT-1", expects = "the registry is internally safe: no predicate matches another spec's command, asserted over claude_hook_specs itself rather than by hand so an eighth spec cannot join unchecked — non-obvious now that two specs share SessionStart and two share PreToolUse — and each of the four new arg strings is recognised with a spaced program path and with the `/proc/self/exe` ` (deleted)` poison suffix", test_file = "src/boot.rs", keywords = ["claude_hook_specs", "predicates_are_pairwise_disjoint", "is_doctrine_command_recognises_each_new_spec"], waived = false },
  { id = "VT-2", expects = "every one of the eleven wired entries carries ${DOCTRINE_BIN:-doctrine} and NO entry contains the test's absolute exec path — SL-195's INV-1 asserted across the whole set rather than the single spec PHASE-02 could reach", test_file = "src/boot.rs", keywords = ["every_wired_entry_carries_the_portable_command"], waived = false },
  { id = "VT-3", expects = "a real install wires eleven entries across five events into the scope-selected settings file — SessionStart 2, WorktreeCreate 1, SubagentStart 1, SubagentStop 1, PreToolUse 6 — where the arm previously wired none, with the pre-slice 'ships via plugin' assertions inverted rather than deleted", test_file = "tests/e2e_claude_install.rs", keywords = ["install_wires_eleven_hook_entries_across_five_events", "SubagentStop", "WorktreeCreate", "PreToolUse"], waived = false },
  { id = "VA-1", expects = "the Codex arm's output is still byte-identical and `check_spawn_seam_symmetry_passes_the_shipped_hooks_config` still passes unmodified, with `plugins/doctrine/hooks/hooks.json` untouched in the diff. The registry and the shipped manifest now diverge only in the SessionStart emit command's canonical-vs-legacy form — un-policed drift, already live, and IMP-407's Leg 2 rather than this slice's." },
