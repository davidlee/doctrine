[[phase]]
id        = "PHASE-05"
name      = "Restore the Claude skills channel"
objective = """
Extract the byte-identical link-reconcile trichotomy into `reconcile_link`, and
restore the binary-sourced canonical skills tree plus proven-ownership symlinks
as `install_skills_direct`, parameterised over link dirs — the channel
SPEC-010 responsibilities 3–6 already describe, deleted at `347197e8` with no
amendment. Sequenced BEFORE the plugin retirement so the repo is never left with
no skills channel at all.
"""

entrance_criteria = [
  { id = "EN-1", text = "Every helper the channel needs is live in `src/install.rs` because the agents and workflows legs use them: `install_base` (`:1816`), `relative_path` (`:1859`), `relative_target` (`:1877`), `ForeignReason` (`:1883`), `Link` (`:1892`), `classify_link` (`:1918`), `staging_path` (`:1954`), `write_link` (`:1964`), `foreign_reason` (`:1981`), `Entry` (`:1670`), `discover` (`:1731`), `select_for_install` (`:2079`), `PluginAssets` (`:22`). Verified 2026-08-08." },
  { id = "EN-2", text = "The deleted orchestration is recoverable verbatim at `git show 347197e8^:src/skills.rs` — the commit is reachable in this repo (verified 2026-08-08). Only `install_for_claude`, `claude_dir`, `canonical_dir`, `claude_links`, `materialise_canonical`, `copy_skill` and the `Canonical` struct went." },
  { id = "EN-3", text = "`install/manifest.toml:46` already lists `.doctrine/skills/*`, so the install manifest's gitignore leg lands the entry and NO `ensure_gitignored` call is needed. Verified 2026-08-08." },
]

exit_criteria = [
  { id = "EX-1", text = "`reconcile_link(name, dest, target, out)` replaces the byte-identical thirteen-line blocks at `src/install.rs:2179-2191` (agents) and `:2279-2291` (workflows). Skills is the third caller, not a fourth copy. The boundary is deliberate (`DEC-166`): no materialise callback, no trait, and no absorption of the agents leg's claude/pi dir branching — the three legs' materialise phases are genuinely unlike, and a generic driver would absorb precisely the part that varies." },
  { id = "EX-2", text = "`install_skills_direct(root, selected, link_dirs, global, dry_run, out)` refreshes the canonical tree once per entry, then loops `link_dirs` reconciling one link each. `skills_canonical_dir` (`.doctrine/skills` under `install_base`) and `claude_skills_dir` (`.claude/skills`) are the two path helpers, and the latter is the only Claude-specific element in the leg." },
  { id = "EX-3", text = "The name is `install_skills_direct`, not `install_for_claude`: once `link_dirs` is a parameter nothing in the body is Claude-specific, and a Claude-named function would mislead IMP-406's author. `run()`'s Claude branch calls it with ONE link dir; shipping `.agents/skills` as a second target is IMP-406's call-site change, not a mechanism change." },
  { id = "EX-4", text = "`materialise_canonical` and `copy_skill` return VERBATIM — `.tmp-<id>` staging, remove-then-rename swap, and `symlink_metadata`-not-`exists` leftover clearing are settled SPEC-010 responsibility-5 reasoning and are not re-derived." },
  { id = "EX-5", text = "The recovered `Canonical` struct does NOT return (it carried a plan between a `build_plan`/`execute` split the consolidated `install::run()` no longer has), and neither does the up-front `claude_links` classify — classification happens once, at mutation time, which is what `reconcile_link` does and what the agents and workflows legs already do." },
  { id = "EX-6", text = "The restored code lands in `src/install.rs`, NOT a new module: every helper above is private to that file, and a `skills_claude` module would widen six private items to `pub(crate)` to buy separation for ~150 lines. Splitting `install.rs` is a distinct chore over the whole file, not a boundary to draw around one leg." },
  { id = "EX-7", text = "`ensure_gitignored`'s doc-comment (`src/install.rs:1482`) stops claiming `skills install` reuses it and names `install/manifest.toml` instead, so the next reader does not go looking for a call site that should not exist." },
]

verification = [
  { id = "VT-1", expects = "the channel materialises and links: a canonical tree at .doctrine/skills/<id> and a RELATIVE symlink at .claude/skills/<id> whose value is ../../.doctrine/skills/<id>, and a second run relinks without churn", test_file = "src/install.rs", keywords = ["install_skills_direct", "skills_canonical_dir", "install_skills_direct_materialises_and_links", "install_skills_direct_is_idempotent"], waived = false },
  { id = "VT-2", expects = "proven ownership holds on both edges: a real directory at the link path is kept and warned rather than replaced, and a link whose value equals our target but whose canonical is missing is healed rather than reclassified as foreign", test_file = "src/install.rs", keywords = ["install_skills_direct_keeps_a_foreign_skill_dir", "install_skills_direct_heals_a_dangling_owned_link"], waived = false },
  { id = "VT-3", expects = "the link phase is a real loop, driven with TWO link dirs — this slice ships one, and an untested loop driven with N=1 is indistinguishable from a hard-coded target, which is exactly the deliverable OQ-9 scopes for IMP-406", test_file = "src/install.rs", keywords = ["reconcile_link", "install_skills_direct_links_every_target_dir"], waived = false },
  { id = "VA-1", expects = "SPEC-010 responsibilities 3–6 confirmed TRUE of the restored code — derived canonical .doctrine/skills/<id> tree, relative agent symlink reconciled by proven ownership, .tmp-<id> staging with remove-then-rename, and the self-enforced .doctrine/skills/* gitignore — with file/line citations transcribed into the reconciliation brief so the evidence is re-derivable at audit. DEC-171 makes this a conformance claim, not a REV amendment: SPEC-010 does not enter the REV." },
  { id = "VA-2", expects = "the extraction is proven by the incumbent suites: the agents and workflows legs' existing link tests pass UNCHANGED. A changed assertion there is a defect in the extraction, not a licensed edit." },
]
