  { id = "VA-1", expects = "`just gate` is green with the full closure deleted and NOTHING re-added behind an allowance: no `expect(dead_code)` or `allow` gains a new site in `src/install.rs`, and `grep` for `DOCTRINE_MARKETPLACE`, `MarketplaceSource`, `RegisteredSource`, `MarketplaceAction` and `--dev` over `src/` returns nothing outside deleted-code history. The dead_code denial is the closure's proof, so a green gate with the inventory removed IS the criterion." },
  { id = "VA-2", expects = "the new reference doc resolves through the published seam — `doctrine library tree` lists it and `doctrine library show reference/<name>.md` returns its body — and `doctrine publication validate` is green. Its content is checked against EX-6's six topics, each present and each naming its remedy rather than only its risk." },
  { id = "VH-1", expects = "A COLD INSTALL ACTIVATES — the claim the whole slice rests on, and one no test can make: /hooks is the only surface reporting which hooks are live and which file each came from, and it is interactive-only. PRECONDITIONS, so the run is reproducible rather than recounted: a scratch project, no `enabledPlugins` entry for doctrine, no marketplace registration, the scope key absent (exercising the Project default), and a binary built from this slice. EVIDENCE TO CAPTURE: the /hooks output showing ALL ELEVEN entries sourced from .claude/settings.json — eleven, not seven; seven is the spec count and a criterion written against it would pass a four-entries-short install — plus one observed effect per event class: a session boot emitting, a WorktreeCreate fork, and a PreToolUse surfacing. WHERE IT LANDS: the transcript and the preconditions are transcribed VERBATIM into the reconciliation brief. In the prescribed scratch project the .claude/settings.json being reported from is itself untracked, so pasting the transcript is the only thing that makes this re-derivable by an auditor." },
