  { id = "EX-1", text = "`src/install.rs` loses the `run()` Claude branch's marketplace and plugin steps (`:445`–`:518`) with their prompts, the trailing 'Claude Code requires the doctrine plugin' reminder and its `skipped_marketplace` / `skipped_plugin` tracking, the twelve helper and type items EN-2 enumerates plus `claude_plugin_add_marketplace`, `claude_plugin_update`, `claude_plugin_has`, `claude_cmd_stdout`, `MarketplaceSource` / `as_arg`, `RegisteredSource` and `MarketplaceAction`, and the `--dev` manifest precondition checks." },
  { id = "EX-2", text = "Their nine tests go with them: `enable_key_is_qualified_doctrine` (`:3031`), `select_plugin_picks_by_name_not_first` (`:3037`), `plugin_presence_is_exact_not_substring` (`:3059`), `marketplace_presence_is_exact_token` (`:3075`), `source_default_is_github_slug` (`:3084`), `parse_registered_source_reads_directory_and_github` (`:3148`), `parse_registered_source_absent_or_sibling_is_none` (`:3163`), `marketplace_action_add_skip_refresh` (`:3173`), `refresh_failure_is_fatal_only_on_refresh` (`:3210`), and the `--dev` precondition cases." },
  { id = "EX-3", text = "`InstallArgs.dev` (`src/install.rs:187`) and the `--dev` flag (`src/commands/cli.rs:126`, threaded at `:1500` / `:1511`) are removed — its sole consumer was `select_marketplace_source`, and a flag selecting between two sources for a registration nobody performs is worse than no flag. `DOCTRINE_MARKETPLACE` has no remaining reader (its three were `:457`, `:699`, `:751`, all deleted). `[install] repo` SURVIVES: `delegate_argv` on the npx path still consumes it." },
  { id = "EX-4", text = "The four claims the retirement falsifies are corrected, not left to be found later: the dead 'Hooks plugin leg' banner (`src/install.rs:2296-2301`) is DELETED — there is no code under it and after this slice it asserts the opposite of the slice's name; `src/install_config.rs:2-8` and its mirror `src/dtoml.rs:44-45` stop describing `[install]` as parameterising only the printed delegation instructions; `install_claude_hook`'s doc (`src/boot.rs:1614-1616`) stops naming `settings.local.json`; and `HookSpec`'s (`:960-964`) and `plan_hook`'s (`:1147-1152`) docs stop describing a `SessionStart` hook." },
  { id = "EX-5", text = "`plugins/`, `plugins/doctrine/hooks/hooks.json`, `.claude-plugin/marketplace.json` and `SpawnSeamSymmetry` are untouched — the tree stays the canonical skill source (IMP-400 `OQ-1`), the manifest stays the published plugin's payload and `R9`'s escape hatch, and the check's input survives so it needs no change." },
  { id = "EX-6", text = "`install/` acquires a published reference doc covering: which file doctrine writes and that Claude Code hot-reloads settings files (hooks included) so no restart is needed; the `[install] claude-settings-scope` key, its two values, its default and why a collaborator on a client project might set `local`; the command form, why the committed scope writes `${DOCTRINE_BIN:-doctrine}` (no host path in a tracked file — SL-195, POL-002), what to do when `doctrine` is off the harness PATH, and the stated POSIX-shell boundary; the two-act cutover note in the prescribed order (install first, THEN disable the plugin); the `R10` sweep description — doctrine-owned hook entries only, in the other of doctrine's two settings files, never anything foreign; and `R9`'s escape hatch for a `strictPluginOnlyCustomization` environment, framed honestly as FEWER failure modes rather than a subset, since direct-write sheds two plugin-only modes and ACQUIRES that one." },
