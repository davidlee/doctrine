[[phase]]
id        = "PHASE-07"
name      = "Conformance classification and verdict algebra"
objective = "Build the suite's pure core — the sealed weakening vocabulary, arm classification with liveness established before any observation is read, and the row and admission verdict algebra in which a control that still held yields `Unproven`."

entrance_criteria = [
  { id = "EN-1", text = "`provision`, `transaction`, `backend`, `config` and `host` all exist (PHASE-03 to PHASE-06). Those five are `conformance`'s out-edges because its **own signatures** force them — `verify` names `HostFacts`, the fixture synthesizes a `CapsuleConfig`, the freshness delta reaches a provisioned transaction's `TransactionRoot`. An earlier draft listed `provision` and `backend` alone, which the layering gate would have failed: the edge check reads imports, and a transitive path through `provision` is not one." },
  { id = "EN-2", text = "`doctrine-control` is bin-only with no lib target (PHASE-01 `EX-5`). That is what forces this unit's second caller to be a `#[cfg(test)]` module rather than a `tests/` file, and what lets `verify`, `ConformanceBackend` and `PropertyRemoval` stay `pub(crate)` — all three verified by execution: a `tests/` file cannot link a bin-only crate (`E0433`), and with a lib target the same test fails `E0603` until `verify` is promoted to `pub`, which would take the weakening vocabulary public with it." },
  { id = "EN-3", text = "`clock::today` is exported from the root library (PHASE-01 `EX-1`, `EX-2`), so `verify` takes `today: String` from the shell. Without that export the signature's `Date` would need a `time` edge — a second date formatter in a workspace whose `src/clock.rs` module contract forbids exactly that (`RV-346` `F-29`)." },
]

exit_criteria = [
  { id = "EX-1", text = "`crates/doctrine-control/src/conformance.rs` exists and `.doctrine/adr/001/layering.toml` classifies `conformance` as engine with out-edges `provision`, `transaction`, `backend`, `config`, `host`." },
  { id = "EX-2", text = "`pub(crate) fn verify(backend: &dyn ConformanceBackend, host: &dyn HostFacts, today: String) -> AdmissionVerdict`. `today` is a parameter rather than a read, for the reason `HostFacts` carries no clock: `src/clock.rs` is the single home for wall-clock reads and `main.rs` is the shell that performs it. The verdict is dated because `DEC-156` requires admission to be a recorded verdict naming backend, host and date, so `REQ-459` criterion 3's *independently* has an artefact to point at." },
  { id = "EX-3", text = "**No `CapsuleConfig` parameter.** Taking the operator's `[capsule]` table would be wrong twice over: the suite would be testing the operator's configuration rather than the backend's enforcement, and a table whose `readable-roots` omitted a shell would make every probe `NotExecutable` and the whole run indeterminate for a reason it never named. The fixture synthesizes its own `CapsuleConfig` over its own root instead, so the only host facts admission depends on are the backend's availability and a working shell — and a host without one is reported through `NotAdmitted::Unavailable`, naming what is missing." },
  { id = "EX-4", text = "`PropertyRemoval` is a closed `pub(crate)` enum carrying all ten variants — `WorkingDirectory`, `Teardown`, `ProcessVisibility`, `ResourceBound(Bound)`, `InputsWritable`, `DescriptorsClosed`, `EnvCleared`, `StdioOwned`, `MappedIdentity` — plus `Bound { FileSize, Wall }`; and `AuthorityGrant::AllCapabilities` is a **separate** enum. Every variant documents the mechanism unique to it *and what it does not change*, because a removal that moves two things names no mechanism when its row fails. The vocabulary is property-shaped, never flag-shaped: what a removal costs in flags is the backend's business, and a flag-shaped vocabulary would be bubblewrap's and could not be asked of a second backend." },
  { id = "EX-5", text = "The enum is **complete at this phase**, and that is the sequencing reason it is: `execute_weakened`'s ten removals and the one grant all land in PHASE-08 rather than arriving per row, because a non-exhaustive match does not compile. PHASE-08 makes the backend weakenable in ten named ways; PHASE-09 and PHASE-10 measure that each weakening falsifies exactly its own row." },
  { id = "EX-6", text = "`pub(crate) trait ConformanceBackend: CapsuleBackend` carries `execute_weakened` and `execute_observed`, plus the `HostPid` newtype. The seam is here and **not on `CapsuleBackend`** (invariant 6): production has no use for an observer and would pass a no-op, and putting it here makes it part of what admission *costs* — a backend that cannot name the process it spawned cannot have its process-isolation property controlled, and a property that cannot be controlled cannot be proven. Refusing to admit such a backend is the correct outcome, not an inconvenience. `execute_observed` exists because nothing else can supply row B5's pid: `execute` is synchronous and yields only a finished `Observation`, and a pid the capsule reports about itself is capsule-written state that invariant 9 and `REQ-448` criterion 3 forbid as evidence." },
  { id = "EX-7", text = "**A dishonest implementation fails closed.** An `execute_weakened` that ignores its argument and runs fully confined makes every control arm show the property still holding, which the harness reports as `Unproven` — not admitted. There is no lazy implementation that yields a green verdict, and `VT-2` asserts it against a stub." },
  { id = "EX-8", text = "`Delta` has exactly five variants — `SharedRoot`, `Widened(fn)`, `NetworkPermitted`, `Removed(PropertyRemoval)`, `Granted(AuthorityGrant)` — so *differs by one thing* is a type rather than a promise. `SharedRoot` re-points **only the second placement**, not a second provision: `sec-3` step 9 creates the transaction root exclusively and refuses, and a control the system refuses to build proves nothing. `Granted` is a distinct variant rather than a `PropertyRemoval` member because `Widened` widens the mount set and a capability grant touches no mount — reusing it would make the two indistinguishable in the verdict and a reader counting removals would count a grant among them (`F-31`'s lesson one level up)." },
  { id = "EX-9", text = "`ArmShape` has `Single`, `Sequential { writer, reader }` and `Concurrent { subject, observer }`, and is **identical on a row's probe and control arms** — a control that changed the payload would not be a control. The arm, not the capsule, is the unit of execution, because six rows across tables A and B are two-capsule and one runs its two concurrently. `PidProbe`'s argv is built from the pid the **trusted side** observed, in the **host's** pid namespace: under the probe arm the observer has its own namespace in which that number names nothing, so both assertions hold for the reason the property claims. A namespace-local pid would make the probe arm hold for an arithmetic reason instead of an isolation one." },
  { id = "EX-10", text = "**Classification is two-stage and the order is the fix: unless the payload proved it ran, the arm is `Indeterminate` regardless of what the observation says.** A probe that was denied and a probe that never ran look identical on an empty stdout, and if `Failed` were merely *not `Held`* then a payload breaking on the control arm only would read as `Failed` — which is exactly what a row needs to report `Proven`. A false green through the very hole a token rule exists to close. Every payload emits a liveness marker before anything else, and `Failed` is a positive observation, never the absence of one (invariant 5)." },
  { id = "EX-11", text = "`Observed` has `Token { held, failed }`, `Exactly(String)` (row 6's value comparison, where a missing value line is `Indeterminate` and never `Failed`) and `Termination` (row 8, whose marker still arrives because `Observation` carries `stdout` whatever the termination). `ArmResult` is `Held` / `Failed` / `Indeterminate { reason, termination, stdout, stderr }`, and `Indeterminacy` distinguishes `NoLiveness`, `NoObservation`, `AmbiguousObservation` and `BackendError`. The vocabulary is *held/failed* rather than *reached/denied* because rows 6 and 8 observe a value and a termination, not a reach." },
  { id = "EX-12", text = "The one payload that cannot print its own marker is row 8's `NotExecutable` case, which by definition never runs. Its liveness comes from a **liveness execution preceding it in the same capsule**, and only if that succeeds is a subsequent `NotExecutable` meaningful. Without that ordering the sub-row passes on any host where the shell is missing — for the wrong reason, and looking exactly like success." },
  { id = "EX-13", text = "`RowVerdict` is `Proven` / `Violated` / `Unproven` / `Indeterminate { arm, detail }`. Only `Proven` on every row admits. `Violated` and `Unproven` are both not-admitted and are reported **distinctly**, because they name different repairs: the first says the guard is broken, the second says the row is. This is `SL-241`'s rule — a guard never seen to fire is not known to work — turned on the suite itself." },
  { id = "EX-14", text = "`RowId` is `Property(Property)` or `Axis(Axis)`, one enum spanning both tables because table B's rows are freshness axes rather than properties and a `Property` key could not hold half of what the verdict reports. `Property` carries **one variant per table A row, ordered as the table is**, and `RowId::Property` keys the verdict — so a row the suite can construct that the enum cannot name is a compile error. That is the **one machine-checked projection** of table A (`sec-9` `R9`); everything else is reader discipline." },
  { id = "EX-15", text = "`AdmissionVerdict` carries backend, host, date, outcome, **every** row of tables A and B including the proven ones, and table C's auxiliary claims. `Admission::Admitted` requires every row in A and B to be `Proven`; `NotAdmitted` distinguishes `Unavailable { missing, remedy }` from `Rows`. There is **exactly one green path and it requires every row to have been run** — no skip, no early return, no conditional reaches `Admitted` (invariant 1). Auxiliary outcomes are reported and never admitted on." },
  { id = "EX-16", text = "Payloads are `Argv` values holding fixed constants — not compiled helpers, not embedded assets — which is what keeps the product weight of shipping the suite small (`DEC-160`). They *do* invoke `/bin/sh -c`, which provisioning deliberately avoids, and the distinction is stated rather than left to look like an inconsistency: `sec-2`'s rule exists to keep caller-supplied text off a security boundary, and these payloads interpolate nothing except B5's trusted-side-observed pid." },
  { id = "EX-17", text = "The sealing assumption is **recorded in the module, not silently relied on**: `PropertyRemoval` and `ConformanceBackend` are `pub(crate)` because every backend lives in this crate and the only callers are `main.rs` and this module's own tests. That is an assumption, not a law — if a backend ever ships from outside the crate this vocabulary becomes public API and needs sealing behind a newtype over a private enum, so nothing but the suite can ask a backend to weaken itself (`sec-9`)." },
]

# NOTES for the integration pass.
#
# 1. This phase defines the vocabulary; it constructs no `Row`. Tables A and B
#    are populated in PHASE-09 and PHASE-10 and the executing harness in
#    PHASE-08, so `verify` is exercised here against stub backends and
#    hand-built row sets only. `admitted_requires_every_row_proven` is
#    therefore a test over the algebra, not over the real tables.
# 2. `every_row_id_is_covered_by_exactly_one_table` asserts a property of the
#    **code's** tables. It says nothing about the design document's row list —
#    `RV-346` `F-28` found this exact test cited as enforcement of the prose
#    while being an unwritten planned test. VA-2 guards the re-emergence.
# 3. `sec-7`'s alignment records that twice the executed titles have lagged the
#    rows (round 5 added rows 12 and 13 without titles; round 6 split row 13 by
#    hand). Until `R9`'s generator exists, adding a row and adding its title are
#    one edit held together by a reader — a standing hazard for PHASE-09 and
#    PHASE-10, not for this phase.
verification = [
  { id = "VT-1", expects = "Classification, over all three `Observed` kinds — the part of the suite that can be wrong with no capsule running at all, and where a suite silently degrades into one that always passes. `an_arm_specific_breakage_on_the_control_arm_does_not_yield_proven` is the false-green path stated directly.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["no_liveness_marker_is_indeterminate_not_failed", "an_arm_specific_breakage_on_the_control_arm_does_not_yield_proven", "both_tokens_present_is_ambiguous_not_held", "a_missing_value_line_is_indeterminate_rather_than_unequal", "a_termination_observation_reads_its_marker_from_a_killed_run", "an_observed_execution_that_never_calls_back_is_indeterminate_not_held", "a_subject_that_exited_before_the_observer_ran_is_indeterminate"], waived = false },
  { id = "VT-2", expects = "The row verdict algebra, including the fails-closed claim asserted against a stub whose `execute_weakened` delegates to `execute` — the proof that there is no lazy implementation yielding green.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["held_probe_and_failed_control_is_proven", "failed_probe_is_violated_even_when_the_control_failed", "held_control_is_unproven_rather_than_proven", "an_indeterminate_arm_is_never_proven", "a_backend_ignoring_its_removal_yields_unproven_for_every_row"], waived = false },
  { id = "VT-3", expects = "The admission algebra: one green path requiring every row, unavailability short-circuiting before any row runs, auxiliary claims unable to reach the outcome in either direction, and the verdict carrying its three identifying facts.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["admitted_requires_every_row_proven", "an_unavailable_backend_is_not_admitted_and_runs_no_row", "a_host_without_a_usable_shell_is_unavailable_not_violated", "auxiliary_outcomes_do_not_reach_the_admission", "a_skipped_auxiliary_claim_leaves_the_verdict_admitted", "the_verdict_names_backend_host_and_date", "every_row_id_is_covered_by_exactly_one_table"], waived = false },
  { id = "VA-1", expects = "Invariant 6 holds: `CapsuleBackend` gains no weakening or observation surface, and `ConformanceBackend`, `PropertyRemoval`, `AuthorityGrant` and `HostPid` are all `pub(crate)`. An absence a keyword mandate cannot express, and the one that keeps production from acquiring an admission affordance." },
  { id = "VA-2", expects = "No test, comment or doc line in this unit claims that `every_row_id_is_covered_by_exactly_one_table` — or anything else in the code — checks the **design document's** row list against the enum. `RV-346` `F-28` is exactly that claim, made in the remediation of the finding it was meant to close. State `R9`'s real altitude where the enum is declared: the compiler checks one projection, and the rest is reader discipline." },
  { id = "VA-3", expects = "Confirm `EX-17`'s sealing assumption is written where the vocabulary is declared, and that no row, delta or payload defined in later phases is reachable from outside the crate through a `pub` item added here." },
]
