verification = [
  { id = "VT-1", expects = "Classification, over all three `Observed` kinds — the part of the suite that can be wrong with no capsule running at all, and where a suite silently degrades into one that always passes. `an_arm_specific_breakage_on_the_control_arm_does_not_yield_proven` is the false-green path stated directly.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["no_liveness_marker_is_indeterminate_not_failed", "an_arm_specific_breakage_on_the_control_arm_does_not_yield_proven", "both_tokens_present_is_ambiguous_not_held", "a_missing_value_line_is_indeterminate_rather_than_unequal", "a_termination_observation_reads_its_marker_from_a_killed_run", "an_observed_execution_that_never_calls_back_is_indeterminate_not_held", "a_subject_that_exited_before_the_observer_ran_is_indeterminate"], waived = false },
  { id = "VT-2", expects = "The row verdict algebra, including the fails-closed claim asserted against a stub whose `execute_weakened` delegates to `execute` — the proof that there is no lazy implementation yielding green.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["held_probe_and_failed_control_is_proven", "failed_probe_is_violated_even_when_the_control_failed", "held_control_is_unproven_rather_than_proven", "an_indeterminate_arm_is_never_proven", "a_backend_ignoring_its_removal_yields_unproven_for_every_row"], waived = false },
  { id = "VT-3", expects = "The admission algebra: one green path requiring every row, unavailability short-circuiting before any row runs, auxiliary claims unable to reach the outcome in either direction, and the verdict carrying its three identifying facts.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["admitted_requires_every_row_proven", "an_unavailable_backend_is_not_admitted_and_runs_no_row", "a_host_without_a_usable_shell_is_unavailable_not_violated", "auxiliary_outcomes_do_not_reach_the_admission", "a_skipped_auxiliary_claim_leaves_the_verdict_admitted", "the_verdict_names_backend_host_and_date", "every_row_id_is_covered_by_exactly_one_table"], waived = false },
  { id = "VA-1", expects = "Invariant 6 holds: `CapsuleBackend` gains no weakening or observation surface, and `ConformanceBackend`, `PropertyRemoval`, `AuthorityGrant` and `HostPid` are all `pub(crate)`. An absence a keyword mandate cannot express, and the one that keeps production from acquiring an admission affordance." },
  { id = "VA-2", expects = "No test, comment or doc line in this unit claims that `every_row_id_is_covered_by_exactly_one_table` — or anything else in the code — checks the **design document's** row list against the enum. `RV-346` `F-28` is exactly that claim, made in the remediation of the finding it was meant to close. State `R9`'s real altitude where the enum is declared: the compiler checks one projection, and the rest is reader discipline." },
  { id = "VA-3", expects = "Confirm `EX-17`'s sealing assumption is written where the vocabulary is declared, and that no row, delta or payload defined in later phases is reachable from outside the crate through a `pub` item added here." },
]
