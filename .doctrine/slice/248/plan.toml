[[phase]]
id        = "PHASE-10"
name      = "The channel rows and the on-host verdict"
objective = "Land table A rows 9–14 — the channels the ledger surfaced — each with its own stub mutant and its credential measurements re-run on this phase's own host, and expose the completed admission verdict behind `backend verify`."

entrance_criteria = [
  { id = "EN-1", text = "Rows 1–8 and table B are `Proven` (PHASE-09), so `Admission::Admitted` is already reachable and this phase widens a working verdict rather than first making one work." },
  { id = "EN-2", text = "The fixture already carries every decoy these rows need (PHASE-08 `EX-1`, `EX-11`, `EX-13`): row 9's readable decoy and per-run `own_export`, row 10's three descriptor decoys with the write-only one **unlinked**, row 11's decoy variable set in the fixture's own child, and row 12's fixture-opened `stdin` decoy and socket pair. No row here opens a channel onto anything the trusted side holds for real." },
  { id = "EN-3", text = "`execute_weakened` already carries `InputsWritable`, `DescriptorsClosed`, `EnvCleared`, `StdioOwned`, `MappedIdentity` and `Granted(AllCapabilities)` (PHASE-08 `EX-8`), with the measured-versus-reasoned split recorded beside them (`EX-18`). This phase measures the four reasoned ones it depends on rather than discovering which they are." },
]

exit_criteria = [
  { id = "EX-1", text = "Table A rows 9–14 land, each asserting `RowVerdict::Proven`. `Property` reaches its full fourteen variants, ordered as the table is, and the admission test asserts `Admitted` **unconditionally**." },
  { id = "EX-2", text = "**Row 9's mechanism is the read-onlyness of a bind that exists under both arms.** Its delta changes no mount's presence and no path, only how an existing mount is attached — which is why it is a `PropertyRemoval` and not a `Widened`, and why a row-9 failure cannot be produced by any other guard in the table. Its probe is stated **per entry**, so a backend binding one entry read-only and another writable cannot pass on the first. `RV-346` `F-19` found this by executing the mutant rather than reading the profile: as drafted, every row of tables A and B passed a backend binding declared inputs writable, because the suite had no row that wrote to something it had asked to be read-only — the one guard `DEC-157` depends on was the one guard never seen to fire." },
  { id = "EX-3", text = "**Row 10 holds when every descriptor above 2 resolves to the payload's own handle on `/proc/self/fd`** — the payload *resolves* each entry rather than counting them. The earlier condition, *no descriptor above 2 appears*, is unsatisfiable by any process while enumerating: `ls -1 /proc/self/fd` in a clean process reports `0 1 2 3`, so the row failed before any decoy was inherited and its control had nothing to distinguish (`RV-346` `F-36`). The repair is **not** relaxing to *none of the nominated decoys appears* — that is row 11's denylist defect one level down, passing a backend that leaks a descriptor the fixture never thought to nominate. The claim stays *nothing above 2 that the observation did not itself open*, excluding exactly one descriptor by **identity** rather than by number." },
  { id = "EX-4", text = "**Row 10 exercises all three authority modes a descriptor can carry** — readable, write-only, and one end of a socket pair — and the write-only decoy is checked trusted-side in **both** directions: unmodified after the probe arm, mutated after the control. Only the pair carries it, because a descriptor that yields no bytes on read can still carry write authority: `F-31`'s mutant returned zero bytes exactly as a closed descriptor would while a write through the same descriptor mutated seventeen host bytes. **Reading was never the property — presence was**, and no amount of strengthening a read-shaped payload repairs an observation with three innocent explanations." },
  { id = "EX-5", text = "**Row 11 asserts set-equality against `CapsuleEnv`**, not a search for known credential names. A denylist of variable names would pass a backend leaking a variable nobody thought to list — the defect this row exists to close, restated one level down. Its previous proof was `CapsuleEnvVar` being a closed enum, which binds *callers* and says nothing about a backend, plus an argv assertion that `--clearenv` is present — and `sec-2`'s own note that `--clearenv` stops inheritance only is the concession that inheritance is a separate channel nothing executed ever checked." },
  { id = "EX-6", text = "**Row 12 observes readability, not delivery.** The payload reads `stdin` to EOF and then attempts to **read** descriptors 1 and 2, holding when both reads fail. Bytes written by the capsule reaching the trusted side is the *specified* behaviour under `EmptyInputCapturedOutput` — capturing output is the entire point — so a row asserting the write-back does not arrive asserts that capture is broken. What a socket pair confers and a capture pipe's write end does not is that the capsule can **read** descriptor 1: the undeclared inbound channel (`RV-346` `F-30`)." },
  { id = "EX-7", text = "**Row 12 carries a mutant per leg.** The whole-stdio mutant trips both legs at once, so on its own it leaves the verdict free to key on the `stdin` leg alone — the conforming backend passes because neither descriptor is readable, the whole-stdio mutant reports `Violated` through its `stdin`, and the undeclared inbound channel the row exists to forbid is admitted. The leg-specific mutant (`F-38`) is empty `stdin`, otherwise conforming, one readable socket on descriptor 1. This is row 10's `F-31` lesson at row 12: **a row with two independently observable legs needs a mutant per leg, or the legs are not separately gating.**" },
  { id = "EX-8", text = "**Rows 13 and 14 answer no `SPEC-030` clause and are rowed on `ADR-020`'s credential-authority class**, which names credential authority as one of five a second backend must independently demonstrate. That is governance this design is already bound by, and rowing against it needs no Revision because `DEC-156` stopped deriving rows from clauses in round 4 — rows come from channels, `ADR-020` names this channel, the row follows. The reason it matters: invariant 4 achieves denial by *absence*, and absence is a denial only if the capsule cannot reach what was never bound — which is a claim about process credentials, not about mounts. A payload holding host uid with `CAP_SYS_ADMIN` retained can mount what was never bound." },
  { id = "EX-9", text = "Row 13's payload reports uid, gid and `uid_map` and requires all three to equal the placement's declared capsule identity. Row 14 reads **`CapBnd` and `CapInh` only** — never `CapPrm`/`CapEff`, which are all-zero for any unprivileged process on any host and so discriminate nothing. That second defect is the generalising one: the retired credential row read fields that cannot vary, which is a probe that is true vacuously. Rows 13 and 14 are **disjoint by field**, so a failure names one row without ambiguity — the property the single credential row could not offer." },
  { id = "EX-10", text = "**Row 14's control is the table's only grant**, and it satisfies the discipline because it negates exactly one protection: `--cap-add ALL` moves capability confinement and nothing else — no mount, no descriptor, no environment variable, no identity. Whether a control negates by withdrawing a mechanism or by conferring the authority the mechanism withholds is an implementation detail of the backend; what the discipline forbids is a control that moves two things at once, because then a failing row names no mechanism." },
  { id = "EX-11", text = "**Setuid regain is neither probed nor rowed, and that is recorded as a deliberate weakening.** The obvious payload cannot be built by a suite that must not be privileged: creating a setuid-*root* file requires root, and a setuid file the test user owns confers the uid the payload already has. `no_new_privs` was substituted for it in an earlier draft and is now retained as an *observation* and withdrawn as a *row*. Stated here rather than left for a later reader, because a row whose payload was quietly narrowed is exactly what `F-27` was, and a row whose payload cannot vary is what `F-32` became." },
  { id = "EX-12", text = "**Supplementary-group authority and `no_new_privs` are observed but unrowed** (`sec-9` `R8`). The fixture reports both and rows 13 and 14 assert them as *supporting* observations, but neither carries a verdict and neither can move `Admission` — a condition no delta can change is not a test, and rowing either would produce a row whose control cannot fire, which is the `B4` class exactly and would add two instances of the defect the split exists to remove. `EVD-014` measured both: a user namespace may not `setgroups`, so bubblewrap unmaps the host list rather than dropping it and every arm reads the same list; and bubblewrap sets `no_new_privs` unconditionally, reading `1` in every arm including under `--cap-add ALL`. The exposure is specific: `sec-7` cannot tell a backend that confines these from one that never had to — **a fact about one backend, not about the contract**." },
  { id = "EX-13", text = "`backend verify` is added to `crates/doctrine-control/src/main.rs`: it runs the suite for an on-host verdict, exiting **nonzero with structured output** when the backend is not admitted. It is also `POL-002` facet 3's descriptive absence path — absent bubblewrap, the verdict names what was missing and what would satisfy it, rather than the suite skipping green. `main.rs` performs the wall-clock read and passes `today` in." },
  { id = "EX-14", text = "**No mitigation is added for `sec-9` residual 3, and that is the ruling rather than an omission.** The admission test asserts `Admitted` unconditionally because conditioning it on availability reintroduces the green skip `DEC-156` forbids, and `default-members` brings the failure forward into `just check`. The affected set is not *macOS* but **any host, or any nesting, that denies what the backend needs** — a seccomp-filtered CI runner as much as an agent sandbox. The slice owner ruled at plan time that this is acceptable for the local host (`DEC-180`), so no phase owes a mitigation. What stays open is the **CI** ruling, owed by whichever slice first runs this suite in CI." },
  { id = "EX-15", text = "This phase adds **no new enumeration of the properties**. Table A is normative; every other list — the `PropertyRemoval` set, the removal-to-flag table, `sec-2`'s properties table and channel ledger, `sec-8`'s evidence table, `sec-9`'s residuals — is a manually maintained projection, labelled as one, and wrong by default when it disagrees. Exactly one projection is machine-checked, and no code, comment or test written here claims otherwise (`R9`; PHASE-07 `VA-2`)." },
  { id = "EX-16", text = "`REQ-459`'s closure is reported honestly: criterion 1 is discharged by table A **over the channels the ledger names**, which is a qualifier rather than hedging — *in full* was claimed for this criterion four times against four different tables and was false the first three, and what makes this claim checkable is that it quantifies over a written enumeration that fails visibly when a channel is added without a row. Criterion 2 needs production acceptance tests this slice does not have and is recorded as a contributing `--change`, reported **partial** in the reconciliation brief. Criterion 3 is discharged structurally: there is one suite, it is parameterised by backend, and a second backend passing it edits nothing." },
]

# Stage-3 record.
#
# 1. `sec-9` residual 5 states that the channel ledger cannot establish its own
#    completeness, and `sec-2`'s invariant 5 restates it: every channel we have
#    thought of has a row, and an unrowed one becomes visible — it does not mean
#    the channels are all known. Round 5 proved both halves in one round (`F-32`
#    surfaced as a blank cell, `F-30` was never listed at all). The design
#    predicts a sixth of the same shape is more likely than not. Nothing here
#    discharges that, and no criterion should pretend to.
# 2. **`sec-9` residual 2's arithmetic — THIS RULING WAS WRONG. Corrected at the
#    design reopen.** It said the residual's **nine** `PropertyRemoval` variants
#    were stale and the vocabulary this plan lands is **ten**. Checked against
#    the design's own enum: nine is right. `SharedRoot` — the obvious tenth to a
#    fast reader, and probably the source of the error — is a `Delta` variant,
#    not a `PropertyRemoval` one (PHASE-07 `EX-8` says so explicitly).
#    PHASE-07 `EX-4` was the actual defect, saying *all ten variants* above a
#    list of nine; PHASE-09 `EN-1` repeated it. Both are fixed.
#    **Nine variants, ten removals**, and the two are not interchangeable:
#    `ResourceBound(Bound)` is one variant carrying two removals (`FileSize`,
#    `Wall`), so PHASE-09 `EN-1`'s *ten removals land together* was right all
#    along. The design was not left untouched — residual 2 named
#    `CredentialsConfined`, a variant replaced by `MappedIdentity` after
#    `RV-346` `F-32`, and now names the replacement and states this distinction.
#    The residual's *trend* claim carries and is strengthened, since
#    `AuthorityGrant` is a second enum the seal would expose.
verification = [
  { id = "VT-1", expects = "Table A rows 9–14, each asserting `Proven` and so running both arms. One title per row.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["immutable_input_set_is_proven", "closed_descriptor_set_is_proven", "closed_environment_is_proven", "owned_standard_streams_is_proven", "mapped_capsule_identity_is_proven", "confined_capabilities_is_proven"], waived = false },
  { id = "VT-2", expects = "Row 9 stated per entry so a partially-writable backend cannot pass on the first, the `DEC-157` half named specifically, single-axis-ness of the delta, and the containment that the control writes only to this run's own export.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["a_write_through_every_readable_mount_fails", "a_write_into_the_source_export_fails", "the_writable_inputs_delta_changes_no_mount_and_no_path", "the_writable_inputs_control_writes_only_to_this_runs_own_export"], waived = false },
  { id = "VT-3", expects = "Row 10 asserting presence from a resolved enumeration rather than readability, all three authority modes exercised, the write-only decoy observed in both directions, single-axis-ness, and both stub mutants — the `F-26` one and the `F-31` one that would have passed the round-4 row.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["no_descriptor_above_two_appears_in_the_capsules_enumeration", "each_descriptor_authority_mode_is_exercised_readable_write_only_and_socket", "the_write_only_decoy_is_unmodified_after_the_probe_arm_and_mutated_after_the_control", "the_descriptor_control_changes_no_mount_no_env_and_no_argv_byte", "a_descriptor_leaking_backend_fails_row_ten", "a_write_only_descriptor_leaking_backend_fails_row_ten"], waived = false },
  { id = "VT-4", expects = "Row 11 as set-equality rather than a denylist, its decoy half, and the passthrough mutant as a stub — the backend that omits `--clearenv` and passes every other row while handing the capsule whatever the trusted-side process holds.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["the_capsule_environment_equals_capsule_env_exactly", "a_trusted_side_variable_does_not_appear_in_the_capsule", "an_environment_passthrough_backend_fails_row_eleven"], waived = false },
  { id = "VT-5", expects = "Row 12's two legs, its disjointness from row 10 by descriptor number, and **a mutant per leg** — the whole-stdio one and the readable-descriptor-1 one that the pair cannot stand in for.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["the_capsules_stdin_yields_no_bytes", "neither_descriptor_one_nor_two_is_readable_by_the_capsule", "the_stdio_control_changes_nothing_above_descriptor_two", "a_stdin_inheriting_backend_fails_row_twelve", "a_readable_descriptor_one_backend_fails_row_twelve"], waived = false },
  { id = "VT-6", expects = "Rows 13 and 14's probe arms, their single-axis assertions (row 14's being the only one asserted against a *granting* control), both stub mutants, and that the two unrowed credential observations are reported without a verdict so a later reader cannot mistake them for admission evidence.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["the_capsule_reports_the_declared_identity", "the_identity_control_changes_no_mount_no_env_and_no_descriptor", "a_host_identity_backend_fails_row_thirteen", "the_capsule_holds_no_capabilities_in_the_bounding_or_inheritable_set", "the_capability_grant_changes_no_mount_no_env_no_descriptor_and_no_identity", "a_capability_retaining_backend_fails_row_fourteen", "the_unrowed_credential_observations_are_reported_without_a_verdict"], waived = false },
  { id = "VA-1", expects = "**Phase obligation — re-run the credential measurements on this phase's own host, outside this project's jail.** `EVD-014`'s figures are from a single host and must not be inherited: the jail already strips capabilities and sets `no_new_privs`, so a jailed probe cannot distinguish a backend that confines credentials from a cage that had already done it (`F-20`'s rule, and the reason `EVD-014` discards two earlier runs). Record the run and its host. **Negative path (added at the critical pass): if the off-jail run does not reproduce `EVD-014` — if uid/gid/`uid_map` do not match the declared identity, or `CapBnd`/`CapInh` do not vary between the probe arm and `--cap-add ALL` — then rows 13 and 14 are wrong, not the measurement.** A non-varying field is the retired `CredentialsConfined` defect exactly (a probe true vacuously), and `EX-9`'s disjoint-by-field claim is what fails with it. Route that through `/consult`: it is the same class as PHASE-09 `VA-1`, where a control that turns out not to be required makes the argument and not just the number wrong. Do not narrow the payload to make the row pass — `EX-11` records that a quietly narrowed row is what `F-27` was." },
  { id = "VA-2", expects = "**Phase obligation — measure the reasoned deltas these rows depend on.** `MappedIdentity` and `Granted(AllCapabilities)` are measured; `InputsWritable`, `DescriptorsClosed`, `EnvCleared` and `StdioOwned` are reasoned. A delta that does not produce its row's control failure means **the row is wrong**, not that the measurement is inconvenient — the retired `CredentialsConfined` was reasoned, adopted, and wrong." },
  { id = "VA-3", expects = "**Phase obligation — measure the executed suite's wall-clock cost on the fast inner loop.** Tables A, B and C are on the order of fifty capsule provisions and executions per run, plus two payloads sleeping a small fixed multiple of a fixture-chosen bound. **The default is unfiltered.** If measurement makes the loop unusable, the one lawful adjustment is `cargo test -- --skip <executed module path>` on `test:` alone, with `test-all` unfiltered so the commit gate still runs every row. `#[ignore]` on the admission test is **not** available: it would put the skip inside the default run where a reader would take its absence for a pass." },
  { id = "VA-4", expects = "Confirm `EX-14` was honoured: no availability condition, no `#[ignore]`, no skip and no early return reaches `Admitted`, and nothing in this phase quietly mitigates residual 3. `DEC-180` settles the local host and leaves the CI half open — carry it forward as an open question rather than answering it here." },
  { id = "VA-5", expects = "Confirm `EX-11` and `EX-12` are written down where the rows are, not merely absent: setuid regain unprobed and why, and the two unrowed observations reported without a verdict. Both are deliberate weakenings, and a deliberate weakening that is not recorded is indistinguishable from an oversight to the next reader." },
]
