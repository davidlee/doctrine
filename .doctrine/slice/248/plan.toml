verification = [
  { id = "VT-1", expects = "Placement validation, one per refusal variant, with the `RV-346` `F-1` class first because it was found by execution rather than by reading: a declared root resolving into each forbidden scope, and one resolving to the filesystem root.", test_file = "crates/doctrine-control/src/backend.rs", keywords = ["declared_root_that_resolves_into_the_canonical_repository_refuses", "declared_root_that_resolves_into_the_credential_scope_refuses", "declared_root_that_resolves_into_the_capsule_root_refuses", "declared_root_that_resolves_to_the_filesystem_root_refuses", "the_resolved_root_is_the_forbidden_scope_a_placement_is_validated_against"], waived = false },
  { id = "VT-2", expects = "Descendant mutants, one per forbidden scope — the `F-10` class an equal-or-ancestor test admits — with the transaction-root carve-out asserted positively so a fix that refuses everything under the capsule root cannot pass, and asserted as writable-only.", test_file = "crates/doctrine-control/src/backend.rs", keywords = ["a_file_inside_the_canonical_repository_refuses", "a_file_inside_the_control_plane_state_refuses", "a_file_inside_a_credential_location_refuses", "a_sibling_transaction_root_under_the_capsule_root_refuses", "a_sibling_transaction_under_the_resolved_root_is_refused_by_the_placement", "a_writable_entry_under_this_placements_own_transaction_root_is_admitted", "a_readable_entry_under_this_placements_own_transaction_root_refuses"], waived = false },
  { id = "VT-3", expects = "The source-export carve-out, its refusals, and — the `F-25` class — the lawful case each refusal must not capture. The positive control is the one whose absence let `F-25` stand: it fails against a validator that refuses everything beneath `capsule_root`, which is what this design specified until round 4. The two carve-outs cannot be composed into a third.", test_file = "crates/doctrine-control/src/backend.rs", keywords = ["the_lawful_source_export_for_this_base_is_admitted", "a_source_export_of_a_different_base_refuses", "a_source_outside_the_export_directory_refuses", "a_readable_entry_naming_the_export_directory_refuses", "a_sibling_directory_whose_name_extends_a_forbidden_scope_is_admitted"], waived = false },
  { id = "VT-4", expects = "The inner-destination rules: one case per reserved path (`/source` included, since shadowing it substitutes the contracted export), the two ordering-independence rules, that the bound path is the resolved one, and the lawful case the reserved rule must not capture — a readable entry beneath a profile-owned mount, `/tmp` being the one a host is most likely to hit.", test_file = "crates/doctrine-control/src/backend.rs", keywords = ["reserved_inner_destination_supplied_as_a_readable_entry_refuses", "two_entries_with_the_same_inner_path_refuse", "an_inner_path_that_is_an_ancestor_of_another_refuses", "the_bound_host_path_is_the_resolved_path_not_the_declared_one", "a_readable_entry_beneath_a_profile_owned_mount_is_admitted"], waived = false },
  { id = "VT-5", expects = "The two closed vocabularies, each asserted on both halves — that the type is closed with trusted-side values, and that no public route carries the thing the type exists to make unrepresentable. The stdio pair is not decoration: a closed enum is what makes an inherited descriptor unrepresentable rather than merely discouraged.", test_file = "crates/doctrine-control/src/backend.rs", keywords = ["capsule_env_is_a_closed_vocabulary_with_trusted_side_values", "no_public_route_carries_caller_supplied_environment_text", "capsule_stdio_is_a_closed_vocabulary_with_parent_owned_endpoints", "no_public_route_supplies_a_raw_descriptor_to_execution"], waived = false },
  { id = "VT-6", expects = "The default is refusal at this unit's two entry points: an empty mount vector refuses rather than running unconfined, and an empty argv refuses (invariant 9).", test_file = "crates/doctrine-control/src/backend.rs", keywords = ["empty_mount_vector_refuses_rather_than_running_unconfined", "empty_argv_refuses"], waived = false },
  { id = "VA-1", expects = "`working_directory` has no inherit value — a type-level property asserted by construction rather than by test (`sec-2` § Verification alignment says so explicitly). Confirm `InnerPath` admits no sentinel or `Option` that would reintroduce one." },
  { id = "VA-2", expects = "No pure test in this unit stands in for one of the five executed-only invariants (EX-16). In particular, confirm no argv or flag-list assertion over `--unshare-all`, `--clearenv` or a descriptor flag appears here presenting itself as proof of a running-capsule property — `DEC-156` is explicit that shape assertions are necessary and never sufficient, and four channels were once closed by exactly that substitution." },
  { id = "VA-3", expects = "No numeral stating a property count appears anywhere in this unit (EX-15). An absence a keyword mandate cannot express, and the defect `F-28` found three rounds running." },
]
