# Implementation plan for SL-248 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-248"

# STAGE 2 IN PROGRESS. The spine (stage 1) is complete: every phase carries its
# id, name and objective. Criteria are expanded per phase — PHASE-02 is done;
# the rest still carry empty `entrance_criteria` / `exit_criteria` /
# `verification` and are the remaining stage-2 work (plan.md § Authoring stages).
# The phase list itself is settled, because PHASE-NN ids are immutable and edits
# append rather than renumber.

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

[[phase]]
id        = "PHASE-01"
name      = "Workspace foundation and the checked set"
objective = "Create the `doctrine-control` workspace member and the root package's lib target with its curated export set, and bring the new crate into the checked set in the same change — so no later phase can ship a suite that is green by never running."

# Entry state only: this is the first phase, so every EN is a fact about the
# tree as the slice found it rather than an earlier phase's EX. Each was
# re-checked at the /plan gate (plan.md § The design's premises were re-checked);
# they are restated here because a phase that starts against a moved premise
# builds the wrong thing, and this is the phase where that is most expensive.
entrance_criteria = [
  { id = "EN-1", text = "The root package has no lib target — `src/lib.rs` does not exist — and the workspace `Cargo.toml` carries `members = [\".\", \"crates/cordage\"]` with no `default-members` key. Both matter: the first is what this phase creates, and the second is why a new member would inherit `cordage`'s exclusion from `lint`, `build` and `test` unless this phase adds the key." },
  { id = "EN-2", text = "`tests/architecture_layering.rs` already parameterises `discover_units` and `extract_edges` by source directory (`:40`, `:123`); only `check`'s module filter builds its on-disk probe from a hardcoded `\"src\"` (`:558`). So the two-tree gate is one parameter and one further call, not a generalised extractor. Its existing synthetic-fixture tests (`check_unclassified_detected`, `check_upward_edge_rejected`) are the shape this phase's two new-crate gate tests extend." },
  { id = "EN-3", text = "`DOCTRINE_TOML` and `read_doctrine_toml_text` live in `src/dtoml.rs` and are reached by 35 call sites across 33 files, none of which this phase edits; `read_path_at` and `CaptureError` are `pub(crate)` in `src/git.rs`; `git.rs`'s `#[cfg(test)]` module reaches `crate::kinds` (`:2896`); and `clock`, `git`, `kinds` and `dtoml` are all classified `leaf` in `.doctrine/adr/001/layering.toml`, which is what makes the export set assertable as leaf-only." },
  { id = "EN-4", text = "`just pkg-check` already asserts a force-included embed root survives `cargo package -p doctrine --list`, and already names `-p doctrine`; `just publish` runs a bare `cargo publish`. The `R7` exclusion assertion extends the first recipe and the package selection corrects the second — neither is authored from nothing." },
]

exit_criteria = [
  { id = "EX-1", text = "`src/lib.rs` exists as the root package's lib target and is the whole public surface of the doctrine library: `clock`, `config_file`, `git` and `kinds` declared privately, and `today`, `DOCTRINE_TOML`, `read_doctrine_toml_text`, `CaptureError` and `read_path_at` re-exported from them. `kinds` is a path target that exports nothing — it is declared because `git.rs`'s `#[cfg(test)]` module reaches `crate::kinds` and the lib target compiles that module under `cargo test`. This is the trap in the arrangement: `cargo build` is green while `kinds` is missing, and `E0432` surfaces only when the library's tests first compile." },
  { id = "EX-2", text = "The export-set constant carries the five items this phase exports — `today`, `DOCTRINE_TOML`, `read_doctrine_toml_text`, `read_path_at`, `CaptureError` — and PHASE-02 appends `interpretation`, taking it to six. `today` is present against `sec-6`'s literal constant, which omits it: the same section's prose calls `clock::today` the third export and explains that taking it is what avoids a `time` edge, and `sec-8`'s touch-set counts five items behind three private modules, which is true only with `today` among them (`ISS-323`; plan.md § Two corrections owed at execution)." },
  { id = "EX-3", text = "`src/config_file.rs` exists, out-edge-free and leaf, holding `DOCTRINE_TOML` and `read_doctrine_toml_text`; `src/dtoml.rs` re-exports both under their existing names via `pub(crate) use crate::config_file::{…}`; and `src/main.rs` gains exactly one new declaration, `mod config_file;`. All 35 call sites across the other 32 files are unedited — the relocation's whole point is that `STD-001`'s single source moves without a call-site diff." },
  { id = "EX-4", text = "`read_path_at` and `CaptureError` are `pub` in `src/git.rs`, and no other item anywhere in the root package changes visibility. This is compiler-required rather than stylistic: `pub use` of a `pub(crate)` item is `E0364`." },
  { id = "EX-5", text = "`crates/doctrine-control/` exists as a bin-only workspace member — a `Cargo.toml` declaring the `doctrine` path dependency and `publish = false`, and a `src/main.rs` skeleton carrying no verb yet (`provision` lands in PHASE-06, `backend verify` in PHASE-10). The crate has **no** lib target and acquires none: a `tests/` file cannot link a bin-only package (`E0433`), and a lib target would force `sec-7`'s weakening vocabulary public (`E0603`). Every test in this crate is therefore a `#[cfg(test)]` module inside the unit it tests." },
  { id = "EX-6", text = "The new manifest's dependency list is derived from the crate's own `use` statements and not copied from `sec-6`'s table. At this phase that list is the `doctrine` path edge alone; `rustix` (`fs` **and** `std`), `serde` (`derive`) and `toml` arrive in PHASE-03 with the code that calls them. Any disagreement with the design's table is the table being stale (`RV-346` `F-29`)." },
  { id = "EX-7", text = "The workspace `Cargo.toml` gains `crates/doctrine-control` in `members`, the key `default-members = [\".\", \"crates/doctrine-control\"]`, and `\"!/src/lib.rs\"` in the published `include` allow-list. `cordage` stays outside the default set exactly as today, and `test-all`'s `--workspace` is unchanged and still covers all three packages." },
  { id = "EX-8", text = "`Cargo.lock` carries the new member's package entry and is committed. Adding a workspace member rewrites the lock whether or not a registry dependency arrives; `cargo build --locked` refuses against a stale one and the crane build consumes it (`RV-346` `F-22`)." },
  { id = "EX-9", text = "`justfile`: `publish` runs `cargo publish -p doctrine`, and `pkg-check` gains the assertion that `src/lib.rs` is **absent** from `cargo package -p doctrine --list` while `publication/manifest.toml` remains present. `publish = false` (EX-5) and `-p doctrine` are both required and neither substitutes for the other — the manifest key alone makes a bare `cargo publish` fail outright rather than skip the member, and the recipe flag alone leaves the intent to a flag someone may drop." },
  { id = "EX-10", text = "`tests/architecture_layering.rs`: `check`'s module filter takes its source directory as a parameter instead of building the probe from a hardcoded `\"src\"`; the gate runs once per source tree, each against that tree's own tier section; and the export-set assertions are added. `discover_units` and `extract_edges` are called with the second directory, **not** generalised to cross crates — a cross-crate import is not a `crate::` path, so `CratePathCollector` would yield no edge either way, and the export list is what bounds the crossing instead." },
  { id = "EX-11", text = "`.doctrine/adr/001/layering.toml` gains `config_file = \"leaf\"` (out=0) and the edge `dtoml → config_file`, plus a second tier section keyed to the `doctrine-control` tree holding the units this phase introduces. Unit names are unique only within a tree, so the new crate's map is a separate section rather than merged into the root's — merging would make `config` ambiguous once PHASE-03 lands. Later phases append one row per unit they introduce." },
  { id = "EX-12", text = "`just check`'s `lint`, `build` and `test` legs reach `crates/doctrine-control`, and `just gate` lints it. `fmt` already reached it — `cargo fmt` walks every member regardless of `default-members`, measured — and `lint-js` and `validate` are unaffected. From this phase onward the fast inner loop compiles and tests the new crate: that is the intent, not a side effect, and it is what stops every later phase shipping a suite that is green by never running." },
  { id = "EX-13", text = "The root binary imports nothing through `doctrine::` — no path under `src/` outside `src/lib.rs` names one. `git`, `config_file` and `kinds` now compile twice, once per target, and the two copies never meet only while this holds; the day the binary names a `doctrine::` path, `doctrine::git::CaptureError` and `crate::git::CaptureError` become distinct types with identical names. `sec-9` `R6` is explicit that the mitigation is this rule and not a test, and that the alternative — `main.rs` as a thin binary over the library — was rejected because it publishes most of the product as library API." },
]

# NOTES for the integration pass.
#
# 1. `src/lib.rs` and `tests/architecture_layering.rs` are shared append-only
#    between PHASE-01 and PHASE-02, not exclusively owned by PHASE-01 as
#    plan.md § File ownership records. PHASE-02 `EX-8` appends `pub mod
#    interpretation;` and the sixth export-set entry; PHASE-02 `VT-10` re-runs
#    two of this phase's assertions with `interpretation` added. Stage 3 should
#    move both files to the shared table rather than leave the tables
#    disagreeing with the criteria.
# 2. `src/main.rs` (root package) appears in neither ownership table. PHASE-01
#    is its only toucher — one `mod config_file;` declaration — because PHASE-02
#    `EX-9` deliberately declines to declare `mod interpretation;` there. It
#    belongs in PHASE-01's exclusive row.
# 3. `the_root_library_exports_exactly_the_named_set` and
#    `every_exported_item_belongs_to_a_leaf_tier_module` are keyworded by both
#    this phase's VT-1 and PHASE-02's VT-10. That is the same test observed at
#    two different export-set sizes, not a duplicated obligation — but stage 3
#    owns the ruling on whether the no-duplication rule tolerates it.
verification = [
  { id = "VT-1", expects = "The export set is exactly the named list and every contributing module is leaf-tier — the cross-crate enforcement ruling, which bounds every edge from `doctrine-control` into the root package without any graph analysis.", test_file = "tests/architecture_layering.rs", keywords = ["EXPORTED", "the_root_library_exports_exactly_the_named_set", "every_exported_item_belongs_to_a_leaf_tier_module"], waived = false },
  { id = "VT-2", expects = "The gate runs over both source trees, and parameterising it moves no existing classification — the behaviour-preservation obligation for a change to shared machinery, and the reason a parameter is added rather than the extractor generalised.", test_file = "tests/architecture_layering.rs", keywords = ["the_layering_gate_runs_over_both_source_trees", "the_existing_layering_gate_is_unchanged_in_verdict_over_the_root_tree"], waived = false },
  { id = "VT-3", expects = "The second tree is genuinely gated, not merely walked: over synthetic fixtures in the existing `check_*` shape, an unclassified unit and a command-tier import from an engine unit each fail. Without these the second call could pass vacuously on a tree whose only unit is `main`.", test_file = "tests/architecture_layering.rs", keywords = ["an_unclassified_unit_in_the_new_crate_fails_the_gate", "a_command_tier_import_from_an_engine_unit_in_the_new_crate_fails_the_gate"], waived = false },
  { id = "VT-4", expects = "`doctrine-control` cannot reach the root package's worktree modules — `sec-2` invariant 10, enforced here through the export set, which carries no worktree surface at all rather than through an edge check that would permit it.", test_file = "tests/architecture_layering.rs", keywords = ["doctrine_control_does_not_depend_on_the_worktree_modules"], waived = false },
  { id = "VT-5", expects = "The library's own test target compiles: the export set is transitively closed over `crate::` paths in `#[cfg(test)]` code, so `git.rs`'s test-module reach into `crate::kinds` resolves. Verified by `cargo test` building the lib target at all; the keyword floor is the private module declaration that makes it true.", test_file = "src/lib.rs", keywords = ["mod clock;", "mod config_file;", "mod git;", "mod kinds;", "read_path_at"], waived = false },
  { id = "VT-6", expects = "The relocation is behind re-exports under the existing names, so `dtoml`'s consumers are unchanged. The 35 call sites are proven by suites written for something else (VA-4); this row asserts only the seam that makes that possible.", test_file = "src/dtoml.rs", keywords = ["pub(crate) use crate::config_file::", "DOCTRINE_TOML", "read_doctrine_toml_text"], waived = false },
  { id = "VA-1", expects = "The checked set, observed by running it: `just check` compiles and runs the new crate's tests under `lint`, `build` and `test`, and `just gate` lints it, while `crates/cordage` stays outside those three legs. Not a cargo test — it is a property of each recipe's package selection, which only running the recipe can show. Record the observed evidence (the crate named in each leg's output) in the phase notes." },
  { id = "VA-2", expects = "`just pkg-check` passes with the new assertion — `src/lib.rs` absent from `cargo package -p doctrine --list`, `publication/manifest.toml` still present — and `just publish`'s recipe names `-p doctrine`. Executed recipe evidence, not a cargo test. `sec-9` `R7` is explicit that the packaged/local divergence is asserted rather than trusted, being the same shape as the crane embed-strip trap that shipped a hollow binary at v0.5.0." },
  { id = "VA-3", expects = "No path under `src/` outside `src/lib.rs` names a `doctrine::` import (EX-13, `sec-9` `R6`). Asserted by inspection: a keyword mandate cannot express the absence of a line, and the design states the mitigation is the rule rather than a test." },
  { id = "VA-4", expects = "Behaviour preservation: the existing root-package suites pass unchanged, with no test file edited except `tests/architecture_layering.rs`. Confirm by diff that none of the 32 other files holding a `DOCTRINE_TOML` / `read_doctrine_toml_text` call site is touched — if any behaviour moved, tests that never heard of this slice are what fail." },
  { id = "VA-5", expects = "The new manifest's dependency list was derived from the crate's own `use` statements rather than copied from `sec-6`'s table (EX-6). Confirm the derivation was actually performed and record the resulting list; a disagreement with the table is reported as the table being stale, not silently reconciled." },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-02"
name      = "Interpretation policy: parse, normalize, hash, restrict"
objective = "Build `src/interpretation.rs` as a strict typed projection of `[interpretation]` beside the deliberately tolerant shared reader — six distinguishable refusals, duplicate rejection before sorting, an injective canonical hash, and the monotonic restriction algebra — and export it through the lib target."

entrance_criteria = [
  { id = "EN-1", text = "`src/lib.rs` exists as the root package's lib target and `crates/doctrine-control` is in `default-members`, so a module declared in `lib.rs` is compiled and its `#[cfg(test)]` tests actually run under `just check` (PHASE-01). Without this the module is compiled by no target and this phase's tests are green by never running." },
  { id = "EN-2", text = "`tests/architecture_layering.rs` carries the export-set assertion and `.doctrine/adr/001/layering.toml` carries the root tree's tier map, so this phase extends each by one entry rather than authoring either." },
]

exit_criteria = [
  { id = "EX-1", text = "`src/interpretation.rs` exists, leaf-tier and out-edge-free, and is pure throughout: nothing in it reads a file, a clock, or a repository. It exposes `parse`, `canonical_hash`, `restrict`, `InterpretationPolicy`, `ExecutableName`, `PathPattern`, `VerificationRow`, `PolicyHash`, `INTERPRETATION_SCHEMA`, and the refusal types." },
  { id = "EX-2", text = "`InterpretationPolicy` is constructible only through `parse` — no other public constructor, no public field mutation — so an unnormalized value of the type cannot exist, which is what lets `canonical_hash` and `restrict` assume normalization instead of re-checking it." },
  { id = "EX-3", text = "The `[interpretation]` table is projected out of a tolerant outer document and then walked key-by-key against a known set rather than deserialized, so `BlockMissing`, `KeyMissing`, `UnknownKey`, `UnsupportedSchema`, invalid-value and `EmptyVerificationSequence` are six distinguishable typed refusals and not a formatted dependency error string." },
  { id = "EX-4", text = "The walk is recursive: each verification row is walked against its own known key set (`argv`, and nothing else), with `RowKeyMissing` and `UnknownRowKey` distinguished. A row spelled `{ argv = [...], extra = true }` has a defined refusal rather than being projected silently." },
  { id = "EX-5", text = "Duplicate rejection is an explicit refusing step that runs before sorting, and both run before the hash. Set-valued lists are `Vec` byte-sorted after that check — never a `BTreeSet`, which would make the sort free and the duplicate invisible. Verification row order and argument order are preserved." },
  { id = "EX-6", text = "`canonical_hash` is SHA-256 over the domain-separated, length-prefixed encoding of the typed value — never over source text or a re-serialized TOML document. `PolicyHash` is a newtype with no public constructor other than `canonical_hash`." },
  { id = "EX-7", text = "`restrict` evaluates its four rules in order, and rule 4's failure is diagnosed by the ordered classification: row-removed, then row-inserted (base is a subsequence but not a prefix), then row-reordered, then row-replaced. Prefix decides acceptance; subsequence decides which refusal." },
  { id = "EX-8", text = "`src/lib.rs` declares `pub mod interpretation;`, the export-set constant names it, and `.doctrine/adr/001/layering.toml` classifies `interpretation = \"leaf\"` with out=0." },
  { id = "EX-9", text = "`src/main.rs` does **not** declare `mod interpretation;` — nothing in the agent-facing binary consumes the policy in this slice, and declaring it in both targets would compile it twice for nothing. The module is still discovered and classified by the layering gate, which walks the file tree rather than `mod` declarations." },
]

# NOTE for the integration pass: `REQ-449` criterion 3 (read-once) is NOT
# verified here. `sec-4` routes it to an executed test in `sec-7`'s environment
# — `rewriting_doctrine_toml_inside_a_capsule_does_not_change_the_bound_policy`
# — which is table C and lands in PHASE-08. This phase proves the parser, not
# the provenance.
verification = [
  { id = "VT-1", expects = "The six distinguishable table-level refusals, one test each, over the real parser.", test_file = "src/interpretation.rs", keywords = ["missing_interpretation_block_refuses", "missing_required_key_refuses_naming_the_key", "unknown_key_refuses_naming_the_key", "unsupported_schema_version_refuses_naming_the_version", "empty_verification_sequence_refuses"], waived = false },
  { id = "VT-2", expects = "The recursive row walk: strictness that stops at the first level is a strict outer table wrapping a tolerant inner one (RV-346 F-11).", test_file = "src/interpretation.rs", keywords = ["unknown_key_inside_a_verification_row_refuses_naming_the_row_and_the_key", "verification_row_missing_argv_refuses_naming_the_row", "verification_row_that_is_not_a_table_refuses", "argv_that_is_not_an_array_of_strings_refuses"], waived = false },
  { id = "VT-3", expects = "Per-field normalized-value validation and duplicate rejection, one test per rule of the validation table.", test_file = "src/interpretation.rs", keywords = ["executable_with_a_slash_refuses", "absolute_path_pattern_refuses", "lexical_dotdot_component_refuses", "duplicate_forbidden_executable_refuses", "duplicate_interpreted_path_refuses", "empty_argv_row_refuses", "empty_argument_refuses"], waived = false },
  { id = "VT-4", expects = "An explicitly empty list is accepted and is not equivalent to omission — the distinction a serde default would collapse.", test_file = "src/interpretation.rs", keywords = ["explicitly_empty_list_is_accepted_and_is_not_the_same_as_omission"], waived = false },
  { id = "VT-5", expects = "Normalization: set-valued lists sort by raw UTF-8 bytes; verification row and argument order survive.", test_file = "src/interpretation.rs", keywords = ["set_valued_lists_sort_by_raw_utf8_bytes", "verification_row_and_argument_order_are_preserved"], waived = false },
  { id = "VT-6", expects = "The hash is stable across formatting, injective across split boundaries (the length prefixes), and not computed over source text.", test_file = "src/interpretation.rs", keywords = ["canonical_hash_is_stable_across_key_order_and_whitespace", "canonical_hash_distinguishes_split_boundaries_in_adjacent_entries", "canonical_hash_is_not_computed_over_source_text"], waived = false },
  { id = "VT-7", expects = "What a refinement may lawfully do — the positive cases each refusal must not capture.", test_file = "src/interpretation.rs", keywords = ["refinement_may_add_forbidden_entries", "refinement_may_append_verification_rows", "restrict_is_identity_on_its_own_base"], waived = false },
  { id = "VT-8", expects = "Every restriction refusal, and that rule 4's diagnosis is classified in the stated order — a refinement that both removes and reorders reports Removed.", test_file = "src/interpretation.rs", keywords = ["refinement_removing_a_forbidden_entry_refuses", "refinement_removing_an_interpreted_path_refuses", "refinement_removing_a_project_verification_row_refuses", "refinement_reordering_project_verification_refuses", "refinement_replacing_a_project_verification_row_refuses", "refinement_inserting_a_row_before_a_project_row_refuses_as_inserted", "refinement_inserting_a_row_between_project_rows_refuses_as_inserted", "refinement_swapping_two_project_rows_refuses_as_reordered", "the_diagnosis_is_classified_in_the_stated_order", "refinement_with_a_different_schema_refuses"], waived = false },
  { id = "VT-9", expects = "Monotonicity as a property over generated policy pairs: there is no input for which restrict returns a policy weaker than its base on any axis.", test_file = "src/interpretation.rs", keywords = ["restrict_never_weakens_any_axis"], waived = false },
  { id = "VT-10", expects = "The module joins the export set and the tier map, and the export-set assertion still bounds the crossing exactly.", test_file = "tests/architecture_layering.rs", keywords = ["interpretation", "the_root_library_exports_exactly_the_named_set", "every_exported_item_belongs_to_a_leaf_tier_module"], waived = false },
  { id = "VA-1", expects = "`src/main.rs` declares no `mod interpretation;` (EX-9), and the layering gate still classifies the module despite its absence from the binary. Asserted by inspection rather than by test: a keyword mandate cannot express the absence of a line." },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-03"
name      = "Host facts, the `[capsule]` table, and advisory capacity"
objective = "Build the crate's `HostFacts` seam and `SystemHost`, the `[capsule]` reader with its capsule-root resolution and required bounds, and the pure capacity tiering that warns and refuses without ever reserving or deleting."

entrance_criteria = [
  { id = "EN-1", text = "`crates/doctrine-control` exists as a bin-only workspace member inside the checked set (PHASE-01 `EX-5`, `EX-7`, `EX-12`), so this phase's ≈33 tests — all `#[cfg(test)]` modules inside the units they test, because the crate has no `tests/` directory — are actually built and run by `just check`." },
  { id = "EN-2", text = "The crate's manifest carries the `doctrine` path edge alone (PHASE-01 `EX-6`). This phase adds every further edge its own code uses and inherits none: a workspace member is a separate compilation unit with a separate manifest, and the root package having already paid for a crate makes it available to the root package and nothing else." },
  { id = "EN-3", text = "`.doctrine/adr/001/layering.toml` carries the `doctrine-control` tier section (PHASE-01 `EX-11`), so this phase appends three unit rows rather than authoring the section. An unclassified unit fails the gate, so the appends are self-enforcing." },
]

exit_criteria = [
  { id = "EX-1", text = "`crates/doctrine-control/src/host.rs` defines `HostFacts` with exactly four methods — `available_bytes`, `resolve`, `path_exists`, `env_var` — plus `SystemHost` as the production implementation and a fixture implementation in tests that answers all four from a table. Naming the impure inputs as one contract is what makes every pure step above it testable without a filesystem." },
  { id = "EX-2", text = "`HostFacts` carries **no clock**, which corrects the sketch in `sec-3`'s signature comment. Provisioning needs no wall-clock read — the transaction id comes from a collision-resistant source, not a timestamp — and `src/clock.rs` is already this project's single home for wall-clock reads under the rule that the value is passed in rather than a clock handed down. A `now()` here would be a second one." },
  { id = "EX-3", text = "`ByteCount` is defined in `config.rs`, because this section owns the arithmetic that can overflow and `sec-2`'s `file_size_cap` and `disk_used` are this type. That placement is what makes `backend → config` the edge `sec-6`'s unit table records, and PHASE-04 depends on this phase for it." },
  { id = "EX-4", text = "The `[capsule]` table is read by serde projection out of a tolerant outer document — `src/reserve.rs:78-103`'s shape — with `#[serde(rename_all = \"kebab-case\")]` and `#[serde(deny_unknown_fields)]`. Keys are kebab-case, which puts this table with `[dispatch]` and `[reservation]`; `[interpretation]`'s snake_case is `SPEC-030`'s verbatim contract vocabulary and not a house style. **This amends `sec-2`**, whose sample was written `readable_roots` / `closure_roots` / `closure_resolver`: the keys are `readable-roots`, `closure-roots`, `closure-resolver`, and PHASE-04 and PHASE-05 consume the kebab spellings." },
  { id = "EX-5", text = "Serde here and a hand walk in `sec-4` is not inconsistency, and the reason is recorded rather than left to a reader: `REQ-449` criterion 1 demands six *distinguishable* refusals, which serde would collapse into a formatted string for four of them; `[capsule]` needs only that a mistyped key be refused rather than silently defaulted — `execution-timeout-secconds` quietly restoring a 300s bound on a project that configured 900 — which `deny_unknown_fields` supplies while naming the key." },
  { id = "EX-6", text = "The reader splits at the one place this table touches the host: `parse_capsule_config(text) -> Result<UnrootedCapsuleConfig, ConfigRefusal>` is pure and decides every list rule, every bound and the multiplier from text alone; `root_capsule_config(parsed, &dyn HostFacts) -> Result<CapsuleConfig, ConfigRefusal>` resolves the root. `CapsuleConfig` has private fields and one fallible constructor, so a caller cannot assemble a configuration that never went through the readable-list rule or the root resolution." },
  { id = "EX-7", text = "`execution-timeout-seconds` and `file-size-cap-mib` are **required** keys — absent, provisioning refuses naming the key — because there is no measurement to default them from. The spike used one `disk_cap` for both `ulimit -f` and a whole-tree `du`, so its 256 MiB figure measures neither quantity; and its 300s figure is not merely unmeasured but falsified, at 352s on a Rust workspace. An optional default terminates work, so shipping either as a default would present an unmeasured value as generally usable (`RV-346` `F-15`)." },
  { id = "EX-8", text = "The three defaulting keys take named constants (`STD-001`): `execution-kill-grace-seconds` = 5 (directly measured at `sandbox.sh:68`, and a window between two signals rather than a bound that ends work), `expected-capsule-size-mib` = 4096, `capacity-warn-multiplier` = 2. The size default survives `EX-7`'s argument because it denotes whole-tree size, which is exactly what the spike's 4.4 GiB peak measured, and because the tier it feeds warns rather than terminates." },
  { id = "EX-9", text = "Every mebibyte figure converts once, at construction, into `ByteCount` through **checked** arithmetic: above `u64::MAX / 1_048_576` it refuses `BoundOverflows { key }` rather than wrapping. The threshold multiplication downstream **saturates** at `u64::MAX`. `RV-346` `F-12` found the hole — overflow was specified for the two downstream multiplications and not for the conversion feeding them, which left construction undefined at the top of the range and every saturation argument resting on an unchecked value." },
  { id = "EX-10", text = "`capacity-warn-multiplier` is a plain integer **strictly greater than 1**; at or below 1 it refuses `WarnMultiplierNotAboveOne { found }`. At exactly 1 the warning region `expected ≤ available < expected × multiplier` is empty, so no amount of free space could emit the conspicuous warning `REQ-461` criterion 1 requires — the policy would be accepted and the requirement silently unmet (`RV-346` `F-13`)." },
  { id = "EX-11", text = "Ten typed refusal variants, each carrying the key or path it is about: `MalformedTable { detail }`, `NoReadableInputs`, `ClosureRootsWithoutResolver`, `EmptyResolverArgv`, `RelativeCapsuleRoot { path }`, `UnresolvableCapsuleRoot`, `ZeroBound { key }`, `BoundMissing { key }`, `BoundOverflows { key }`, `WarnMultiplierNotAboveOne { found }`. The first three of `sec-2` invariant 9's probes are discharged here because this is where the lists are read; its filesystem probes — an entry that does not exist, a `closure-roots` entry that is not realised — stay at `sec-3` step 2 and land in PHASE-06." },
  { id = "EX-12", text = "Capsule-root resolution runs through `HostFacts` so it is testable, in this order: an absolute configured `root` wins; else `XDG_DATA_HOME` if set, non-empty **and absolute**; else `HOME` under the same three conditions, joined with `.local/share`; else refuse `UnresolvableCapsuleRoot`. `CAPSULE_ROOT_LEAF` and `XDG_DATA_HOME` are named constants. Both variables are held to the *same* test and an unusable value in either is skipped rather than joined — `RV-346` `F-16`: the earlier draft rejected a relative `XDG_DATA_HOME` and then joined `HOME` unconditionally, so `HOME=` rooted capsules at `.local/share/doctrine/capsules` under the working directory, which on an ordinary invocation is the repository. That is precisely what `DEC-158` rules out." },
  { id = "EX-13", text = "Both environment reads use `var_os`. This repository bans `std::env::var` through `disallowed_methods` (`src/tty.rs:41`), and `src/install.rs:1818` is the precedent for the `HOME` read and its refusal message. No platform-directory crate is added: it would buy macOS and Windows arms for a slice whose backend is Linux, against the standing zero-new-compiled-crates posture. The last arm refuses rather than guessing — a capsule root silently landing in a temporary directory is how large live work ends up somewhere a reboot removes." },
  { id = "EX-14", text = "`assess_capacity(probe: Result<ByteCount, CapacityUnknown>, policy: &CapacityPolicy) -> CapacityVerdict` is pure given the probe's answer, with four verdicts and the tiers exactly as tabulated: `≥ threshold` Ample, `expected ≤ a < threshold` Low, `< expected` Insufficient, unusable probe Unknown. `CapacityUnknown` has three constructors — `ProbeFailed { errno }`, `UnusableFigure` (zero `f_frsize`), `FigureOverflows` — and Unknown is reported rather than refusing, and is *distinguishable in the report* from Ample, because those two are identical to a silent implementation and opposite to an operator (`POL-002` facet 3)." },
  { id = "EX-15", text = "The probe is `rustix::fs::statvfs`, available bytes as `f_bavail × f_frsize`, run **against the capsule root** — or its nearest existing ancestor — and not against the repository, which is a different filesystem on any host separating `/home` from `/var`. `f_bavail` is the unprivileged-process figure, the honest one; `f_bfree` includes reserved blocks a capsule cannot have. `f_frsize` is the unit `f_bavail` counts in; `f_bsize` is the preferred I/O size and the wrong multiplier." },
  { id = "EX-16", text = "The `Low` warning is structured, not a sentence: named fields `available_bytes`, `expected_bytes`, `threshold_bytes`, `capsule_root` and the config key to change, emitted through the same reporting the refusals use — so a warning and a refusal about the same condition differ in severity and not in vocabulary. `REQ-461` criterion 1 asks for conspicuous, and a formatted line is neither machine-readable nor greppable by an operator triaging a stalled queue." },
  { id = "EX-17", text = "The manifest gains `rustix = { version = \"1\", default-features = false, features = [\"fs\", \"std\"] }`, `serde = { version = \"1\", features = [\"derive\"] }` and `toml`, derived from the crate's own `use` statements. `std` matters: without it `rustix::fd::AsFd` is a `no_std` polyfill that `std::fs::File` does not implement and every call site fails `E0277`; the root package gets `std` by unification from `crossterm`, `which` and `tempfile`, none of which this crate depends on. `rustix::process` stays undeclared and unreachable — it is behind a `process` feature neither manifest declares, so a call into it is `E0433` (`RV-346` `F-29`). Still zero new compiled crates; a second manifest that has to say so." },
  { id = "EX-18", text = "`.doctrine/adr/001/layering.toml` gains `host` (leaf, out=0), `config` (leaf → `host`) and `capacity` (leaf → `config`, `host`) in the `doctrine-control` section." },
  { id = "EX-19", text = "`.doctrine/doctrine.toml` gains this project's own `[capsule]` table. It is operator configuration and not a platform default: `POL-002` facet 1 is why the shipped default is 4096 rather than the 8192 this repository should set for itself, and this phase sets the repository's own figures without moving the platform's." },
  { id = "EX-20", text = "`REQ-461`'s negative half is structurally true rather than merely unimplemented: `CapacityPolicy` holds no reserved figure and nothing is written or claimed at `Low` (no pre-reservation); `assess_capacity` is a function of one probe and one policy and does not know how many capsules exist (no backpressure); the phase's files contain no delete capability at all (no eviction); and nothing is copied or compressed on any refusal path (no rescue archive). The whole-tree disk figure is observed and not capped — the enforced bound is the per-file `file_size_cap`." },
]

# NOTES for the integration pass.
#
# 1. `sec-5` § Verification alignment lists two capsule-root titles this phase
#    CANNOT write:
#      the_resolved_root_is_the_forbidden_scope_a_placement_is_validated_against
#      a_sibling_transaction_under_the_resolved_root_is_refused_by_the_placement
#    Both exercise `CapsulePlacement::try_new`, which is PHASE-04's `backend.rs`.
#    They are claimed by PHASE-04's provenance row (`sec-2` § Verification
#    alignment, the placement-validation group). Recorded so stage 3 does not
#    read them as dropped.
# 2. `sec-5`'s two Table C rows are excluded from this phase by its provenance
#    row and land in PHASE-08 — the unconditional `SystemHost` statvfs-agreement
#    claim and the conditional cross-filesystem one. `REQ-461`'s executed closure
#    rests on the first, which cannot skip (`RV-346` `F-24`).
# 3. `unknown_key_refuses_naming_the_key` is also PHASE-02's title, in
#    `src/interpretation.rs`. Two `#[cfg(test)]` modules in different files, so
#    Rust-legal and each mandate is file-scoped — but a grep for the title finds
#    two tests. Stage 3 may want one of them qualified.
verification = [
  { id = "VT-1", expects = "The tier boundaries either side, so no comparison is off by one, and the threshold saturates rather than overflowing on a large multiplier.", test_file = "crates/doctrine-control/src/capacity.rs", keywords = ["available_at_the_threshold_is_ample_and_one_byte_below_it_is_low", "available_at_expected_is_low_and_one_byte_below_it_is_insufficient", "threshold_saturates_rather_than_overflowing_on_a_large_multiplier"], waived = false },
  { id = "VT-2", expects = "What each verdict does: Insufficient refuses naming the root and the key, Low warns with named fields and continues, and Low reserves nothing — the whole of `REQ-461` criterion 2's no-reservation story, asserted by a second assessment seeing the same figure.", test_file = "crates/doctrine-control/src/capacity.rs", keywords = ["insufficient_refuses_and_names_the_capsule_root_and_the_config_key", "low_warns_with_named_fields_and_provisioning_continues", "low_reserves_nothing_so_a_second_assessment_sees_the_same_figure"], waived = false },
  { id = "VT-3", expects = "An unusable probe is reported and never read as ample, and carries which of the three reasons produced it — the distinction that is invisible to a silent implementation and opposite to an operator.", test_file = "crates/doctrine-control/src/capacity.rs", keywords = ["unknown_is_reported_and_is_not_ample", "unknown_carries_which_of_the_three_reasons_produced_it"], waived = false },
  { id = "VT-4", expects = "The list and resolver rules, and that an unknown key refuses rather than silently defaulting — the hazard `deny_unknown_fields` exists to catch.", test_file = "crates/doctrine-control/src/config.rs", keywords = ["unknown_key_refuses_naming_the_key", "both_readable_lists_empty_refuses", "closure_roots_without_a_resolver_refuses_naming_both_keys", "empty_resolver_argv_refuses", "relative_configured_root_refuses"], waived = false },
  { id = "VT-5", expects = "The bounds: zero refuses, each required key refuses by name when absent, and the mebibyte conversion ceiling is asserted on both sides so the check is not off by one.", test_file = "crates/doctrine-control/src/config.rs", keywords = ["zero_valued_bound_refuses_naming_the_key", "absent_execution_timeout_refuses_naming_the_key", "absent_file_size_cap_refuses_naming_the_key", "a_mebibyte_figure_above_the_conversion_ceiling_refuses_naming_the_key", "the_largest_convertible_mebibyte_figure_is_accepted", "sizes_in_the_key_unit_convert_once_into_bytes_and_seconds"], waived = false },
  { id = "VT-6", expects = "The multiplier floor at both refusing values, and that the three defaulting keys take their named constants while the two enforced bounds have no default to take.", test_file = "crates/doctrine-control/src/config.rs", keywords = ["warn_multiplier_of_one_refuses_because_the_warning_region_would_be_empty", "warn_multiplier_of_zero_refuses", "absent_optional_keys_take_the_named_default_constants"], waived = false },
  { id = "VT-7", expects = "Root resolution over every combination of the two variables, including the empty-`HOME` case that would otherwise root capsules under the working directory. `no_resolution_path_yields_a_relative_root` is the property over the whole space, not a further example.", test_file = "crates/doctrine-control/src/config.rs", keywords = ["configured_root_wins_over_the_environment", "xdg_data_home_is_used_when_set_and_absolute", "home_supplies_the_default_when_xdg_data_home_is_unset", "relative_xdg_data_home_is_ignored_rather_than_joined", "relative_home_is_ignored_rather_than_joined", "empty_home_is_ignored_rather_than_joined", "no_resolution_path_yields_a_relative_root", "neither_variable_usable_refuses_naming_the_config_key"], waived = false },
  { id = "VT-8", expects = "The four-method contract and its production implementation exist, and the tests carry the fixture implementation every pure test in this phase and in PHASE-06 depends on.", test_file = "crates/doctrine-control/src/host.rs", keywords = ["HostFacts", "SystemHost", "available_bytes", "path_exists", "env_var"], waived = false },
  { id = "VA-1", expects = "`HostFacts` and its implementations reach no clock — no `now`, `Instant`, `SystemTime` or `crate::clock` anywhere in `host.rs` (EX-2). Asserted by inspection: a keyword mandate cannot express the absence of a line." },
  { id = "VA-2", expects = "The manifest's three new edges were derived from the crate's own `use` statements rather than copied from `sec-6`'s table (EX-17), and no call site reaches `rustix::process` — the trap the next reader is most likely to walk into, since credentials, pids and signals all live there and PHASE-10's rows 13 and 14 are about credentials. Record the derived list and any disagreement with the table." },
  { id = "VA-3", expects = "`REQ-461`'s four negatives hold structurally, not just behaviourally (EX-20): confirm by inspection that no reserved figure exists on `CapacityPolicy`, that `assess_capacity`'s signature admits no capsule count or queue, that the phase's files contain no removal call, and that no refusal path copies or compresses anything." },
  { id = "VH-1", expects = "The `[capsule]` values written into `.doctrine/doctrine.toml` (EX-19) are this repository's own operating choice — the required timeout and file-size cap in particular, which have no default and which the slice owner is the authority on. Confirm the figures before they land." },
]
