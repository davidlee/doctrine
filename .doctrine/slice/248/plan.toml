[[phase]]
id        = "PHASE-08"
name      = "The executed harness: fixture, arms, containment, table C"
objective = "Build the executing half of the suite — the self-contained fixture, the three arm shapes, `ConformanceBackend` on the bubblewrap backend carrying all ten removals and the one grant, and per-row hazard containment — and prove it end to end on table C's four non-admitting claims."

entrance_criteria = [
  { id = "EN-1", text = "`PropertyRemoval`'s nine variants, `AuthorityGrant`, `Delta`, `ArmShape`, the classification pipeline and the verdict algebra are all complete (PHASE-07 `EX-4`, `EX-5`). This phase implements `execute_weakened` against a **finished** enum, which is why the ten removals land together rather than per row — a non-exhaustive match does not compile. Nine and ten are both right and are not a contradiction: `ResourceBound(Bound)` is the one variant carrying two removals (`FileSize`, `Wall`)." },
  { id = "EN-2", text = "`provision` works end to end (PHASE-06). Every capsule in every arm — probe and control alike — is placed by it, and the probe arm's placement is exactly what it returned, unmodified. That is what makes the suite end-to-end in `DEC-160`'s sense and keeps it honest about `sec-2` invariant 1: the suite does not hand a backend placements provisioning would never produce." },
  { id = "EN-3", text = "`BubblewrapBackend` implements `CapsuleBackend` with the full confining profile (PHASE-05). This phase adds a second trait implementation beside it and changes none of the confining behaviour — production continues to use `CapsuleBackend`, which carries no way to weaken anything." },
]

exit_criteria = [
  { id = "EX-1", text = "`Fixture` is built once, trusted-side, before any row runs, carrying every field `sec-7` names: `root`, `project_root`, `base`, `scopes`, `capsule_root`, the row-3 decoys, row 9's readable decoy and `own_export`, `second_filesystem`, row 4's and row 2's decoys, and row 5's trusted-side `listener`." },
  { id = "EX-2", text = "The fixture root is on **real disk, never tmpfs** (`DEC-156`): `sec-5`'s probe must read real available space, and a resource observation on tmpfs would measure the mount's size rather than the disk's. `TempRoot`'s `Drop` removes the run's root, and that is the whole of cleanup — it mints **no** product-side capsule-delete capability for test convenience, because `DEC-133` and `DEC-137` hold that a harvested capsule is live work and a delete primitive introduced here for tidiness is what a later slice would reach for (invariant 8)." },
  { id = "EX-3", text = "The fixture is a **self-contained control plane**: its own git repository supplying the contracted base, and its own `.doctrine/doctrine.toml` carrying the synthesized `[capsule]` table. `provision` reads this and never the operator's project. `scopes` names `project_root`, its `.doctrine/` and `capsule_root`, so the fixture's own canonical repository stands in for the real one — which is referenced by no arm and bound under neither (invariant 7)." },
  { id = "EX-4", text = "Row 3's decoy credential and decoy repository are **deliberately not members of `scopes`**, so that row's control is a lawful widening rather than a refusal. Getting this backwards would make the control unbuildable, which is the `SharedRoot` mistake in a second guise." },
  { id = "EX-5", text = "`second_filesystem` is chosen from the host's own mounts at fixture build time and is `Option`: where the host offers no second filesystem the dependent table C row reports **skipped naming that reason**, which is a report about the host rather than a silent pass. On Linux a tmpfs at `/dev/shm` or `/tmp` supplies the pair in practice — measured at 272 GiB against 32 GiB." },
  { id = "EX-6", text = "**One transaction per capsule per arm.** A capsule that left state behind would contaminate the next, and the `Sequential` and `Concurrent` shapes need two within a single arm. The cost is bounded by `sec-3`'s export being built once per base and adopted by every transaction after it, so a transaction is a local clone from a warm export." },
  { id = "EX-7", text = "All three arm shapes execute, including `Concurrent`'s choreography: the subject runs through `execute_observed` on its own thread, the observer publishes the host-namespace pid to the main thread, the main thread renders the observer's argv from it and runs the observer **while the subject is still alive** — the subject's payload sleeps a bounded interval so the window exists rather than being raced for. Two failure modes are classified `Indeterminate` and never `Failed`: the subject exiting before the observer runs, and `execute_observed` returning without ever having called the observer. The second is a backend that did not implement the seam, and a suite reading it as a passing probe would admit the backend it was least able to check." },
  { id = "EX-8", text = "`ConformanceBackend` is implemented on `BubblewrapBackend` with all **ten** removals and the **one** grant, each the delta `sec-7`'s mapping table names, and each changing exactly what that table says and nothing else. `Granted(AllCapabilities)` adds `--cap-add ALL` with every other flag unchanged — it negates exactly one protection, which is what the discipline requires; whether a control does so by withdrawing a mechanism or by conferring the authority the mechanism withholds is an implementation detail of the backend." },
  { id = "EX-9", text = "`ProcessVisibility` **enumerates rather than subtracting** — `--unshare-all` replaced by the explicit non-pid unshare set — because bubblewrap has no `--share-pid`; `--share-net` is its only re-share flag and it can only combine with `--unshare-all`. That removal is the one place the backend does not assemble its profile the usual way, and the asymmetry is worth paying: the alternative is a suite that cannot control its own process-tree row." },
  { id = "EX-10", text = "Every mount-set delta is rebuilt through `CapsulePlacement::try_new`, and that the rebuilt placement is still lawful **is itself evidence** — it passes the same validating constructor the probe's placement passed. `Delta::SharedRoot` re-points only the *second* placement: both transactions are still provisioned normally, and `try_new` admits the re-pointed one because its carve-out accepts a writable entry descending from this placement's own root and both satisfy it against the same root." },
  { id = "EX-11", text = "Per-row hazard containment is implemented as `sec-7`'s table specifies for all nine hazardous rows — decoys only and inside the fixture's own root (3); a trusted-side loopback listener, never the internet (5); the unbounded write going to the size-capped **transient** tmpfs at `/tmp` and never the retained scratch (8); the control arm's readable entries fixture-owned and its `/source` an export this run built for itself (9); the environment assertion over a decoy variable the fixture sets in its own child (11); both stdio ends fixture-created, `stdin` a fixture-opened decoy file rather than the trusted process's own descriptor 0 (12); and a payload that only *reports* credentials, never acts on them (13)." },
  { id = "EX-12", text = "Rows 7 and B5 are contained by `timeout -k` outside the sandbox **plus a session kill**, never a process-group kill: the fixture records the capsule's session id trusted-side before the arm runs and kills the session on the way out. `RV-346` `F-27` strengthened row 7's payload to a descendant that leaves the original session precisely so a process-group-only backend cannot pass, so a process-group kill cannot reap the survivor its own control arm creates. **The general rule, because it will recur: when a row's payload is strengthened, its containment is part of the payload.** A harness reaping by the mechanism the row exists to defeat is not containment, and the failure is silent — a leaked process per run, found by a developer whose machine is slowly filling with them rather than by a red test." },
  { id = "EX-13", text = "Row 10's write-only decoy is an **unlinked** file, so the control arm's mutation is unreachable by name and dies with the descriptor, and all three decoys are fixture-created under the fixture's own root. No descriptor the trusted side holds for real is ever marked inheritable." },
  { id = "EX-14", text = "Table C's four claims run on this fixture and are reported through `AdmissionVerdict::auxiliary`. **Table C may skip; tables A and B may not**, and the distinction is structural rather than a promise: `Admission` is computed from A and B alone, so a table C row has no path to it. That is what makes a skip there lawful where `DEC-156` forbids one in an admission." },
  { id = "EX-15", text = "The object-set claim compares **trusted-side**: the capsule prints its object names with `git -C /capsule/repo cat-file --batch-all-objects --batch-check='%(objectname)'` and the trusted side compares that set against the same query run on the export. `--batch-check` is not optional — bare `--batch-all-objects` is a fatal error, verified by execution." },
  { id = "EX-16", text = "The two capacity claims are two rows, not one. The **unconditional** one calls `SystemHost` on the fixture's own capsule root and requires agreement within one allocation unit with a `statvfs` the test performs itself on the same path — ruling out never calling `statvfs`, a manufactured or cached figure, and reading the wrong *kind* of quantity, and depending on no particular disk layout so it never skips. The **conditional** one is the discriminator for a probe reading the wrong path, which is unobservable where the capsule root and the repository share a filesystem. `REQ-461`'s executed closure rests on the first (`RV-346` `F-24`: as one skippable row it was the only executed evidence `REQ-461` had)." },
  { id = "EX-17", text = "The harness is proven end to end **on table C before any admission row exists**. That is the phase's sequencing argument, not a convenience: table C's four claims contribute to no admission, so they cannot mask a broken harness with a green verdict, and a harness proven only by the rows it is supposed to judge is proven by nothing." },
  { id = "EX-18", text = "The measured-versus-reasoned split is recorded beside `execute_weakened`, not smoothed over: **three** deltas are measured — `Teardown` by `EVD-013`, `MappedIdentity` and `Granted(AllCapabilities)` by `EVD-014` — and **every other delta in the table is reasoned**, with no measurement cited by this design. `EVD-013`'s adjacent fact that bubblewrap has no `--share-pid` tells us how `ProcessVisibility`'s delta must be *expressed*, which is not the same as having seen it produce its row's control failure. PHASE-09 and PHASE-10 inherit the measuring obligation from an honest list rather than from a caption that once claimed all of them were measured." },
]

# Stage-3 record.
#
# 1. `the_shared_root_delta_repoints_only_the_second_placement` is claimed here
#    rather than with table B (PHASE-09), because `Delta` application is this
#    phase's machinery and the assertion is about the delta, not about the
#    freshness axes it serves.
# 2. `a_probe_arm_placement_is_byte_identical_to_what_provision_returned` is
#    invariant 4 and `sec-7` notes nothing else would catch it. Harness-level,
#    so it lands here rather than with any row.
# 3. The two `sec-5` table C rows this phase carries are the ones PHASE-03's
#    note routed forward; the `sec-4` read-once row is the one PHASE-02's note
#    routed forward. Both seams close here.
verification = [
  { id = "VT-1", expects = "Table C's four claims, each on the real fixture: read-once made physical, the clone's object set compared trusted-side, and the two capacity rows — the unconditional one that cannot skip and the discriminator that reports *skipped* naming its reason when the host offers no second filesystem.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["rewriting_doctrine_toml_inside_a_capsule_does_not_change_the_bound_policy", "the_clones_object_set_is_exactly_the_exports", "the_capacity_probe_reads_real_space_at_the_path_it_is_given", "the_capacity_probe_reads_the_filesystem_the_capsule_root_is_on"], waived = false },
  { id = "VT-2", expects = "The harness's own invariants: the probe arm's placement is byte-identical to what `provision` returned (invariant 4, which nothing else would catch), the freshness delta re-points only the second placement, and the orphan a teardown or visibility control leaves is reaped **by session kill** — the containment that had to move with the payload.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["a_probe_arm_placement_is_byte_identical_to_what_provision_returned", "the_shared_root_delta_repoints_only_the_second_placement", "the_orphan_left_by_a_teardown_or_visibility_control_is_reaped_by_the_harness"], waived = false },
  { id = "VA-1", expects = "After a full run, no process the suite started survives and nothing was written outside the fixture root. `EX-12` names this failure as silent by construction — a leaked process per run — so it is checked deliberately once rather than trusted to surface. Record the check." },
  { id = "VA-2", expects = "Invariant 7 holds for every arm, not only the tested ones: walk each arm's placement and confirm no operator path — repository, `.doctrine/`, credential location, or an export any real transaction could adopt — is named or bound. `own_export` in particular must be built for this run and adopted by nothing else." },
  { id = "VA-3", expects = "Invariant 8 holds: no capsule-delete capability exists anywhere in the crate as a result of this phase. Cleanup is `TempRoot`'s `Drop` over a root the fixture created, and nothing public removes anything." },
  { id = "VA-4", expects = "`execute_weakened` changes exactly what `EX-8`'s table says for each variant and nothing else — in particular that `EnvCleared` leaves the explicit `--setenv` list unchanged, that `StdioOwned` touches nothing above descriptor 2, and that `MappedIdentity` touches no namespace. Single-axis-ness is asserted per row in PHASE-09 and PHASE-10; this is the implementation-side read of the same property, done once while the ten deltas are being written." },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-09"
name      = "Admission tables: the clause-derived rows and the freshness axes"
objective = "Land table A rows 1–8 and table B's five freshness axes with each control measured to fire rather than reasoned about, including re-running EVD-013's 2×2 against the strengthened session-escaping payload."

entrance_criteria = [
  { id = "EN-1", text = "The executing harness works end to end and is proven on table C (PHASE-08 `EX-17`) — fixture, all three arm shapes, all ten removals, the one grant, and per-row containment including the session kill. This phase adds rows to a harness already shown to run, rather than debugging both at once." },
  { id = "EN-2", text = "The classification and verdict algebra exist and are proven pure — PHASE-07 `EX-10`, `EX-11` and `EX-13` are what land them, and PHASE-07 `VT-1`, `VT-2` and `VT-3` are the evidence they hold — so a row reading `Unproven` here means the delta did not fire, not that the algebra misread it. That separation is the whole reason `sec-7` is four phases and not one." },
  { id = "EN-3", text = "PHASE-08 recorded which deltas are measured and which reasoned (`EX-18`): three measured, the rest reasoned. This phase inherits that list and discharges the measuring obligation for the rows it lands, rather than re-deriving which is which." },
]

exit_criteria = [
  { id = "EX-1", text = "Table A rows 1–8 land, each asserting `RowVerdict::Proven` and therefore running both arms. `Property` gains its first eight variants, ordered as the table is, and `Axis` its five. `Admission::Admitted` is reachable at this phase and means what it will mean at PHASE-10: every row in tables A and B is `Proven`." },
  { id = "EX-2", text = "**Row 1's payload writes to every writable location the placement declares** — `/capsule/out`, `/capsule/tmp` and `/agent` — and not the transient `/tmp`, which is the profile's own mount rather than a declared entry. The narrower version wrote to `/capsule/out` alone and passed a backend that freshened the output area while sharing the agent home or the retained scratch. Its overlap with B4 is **intended**: tables A and B discharge different requirements, and the non-overlap rule binds a row's *control* to a mechanism unique to it, not a row's payload to untouched ground." },
  { id = "EX-3", text = "**Row 2 executes a binary from each bound path rather than stat-ing it** — the spike's `F-P05-17` lesson, where the shebang class was found by running the project's own suite and not by inspecting the profile — then execs the decoy and requires `NotExecutable`." },
  { id = "EX-4", text = "Rows 3 and 4 are landed as independent rows sharing a mechanism. Row 4 asks whether an *arbitrary* undeclared path is unreachable and enumerates `/`; row 3 asks whether the specific shapes `SPEC-030` names — a repository holding history the capsule was not given, and a credential file — are. A backend could deny arbitrary undeclared files and still be handed a placement containing a credential store. The suite does **not** repeat `sec-2`'s construction-time refusals and could not: a placement declaring a real forbidden scope never gets built, so there is no arm to run." },
  { id = "EX-5", text = "**Row 5 attempts both legs** — the trusted-side TCP loopback listener *and* a trusted-side abstract unix socket — because a backend denying by packet filter rather than by network namespace blocks TCP and leaves the abstract socket, a distinct mechanism in the same channel, reachable. The TCP arm is measured (refused under `--unshare-all`, connects under `--share-net`, and a fresh network namespace has its own loopback so the distinction holds offline and in CI). The abstract leg is **reasoned, not executed**, and `VA-2` discharges it." },
  { id = "EX-6", text = "**Row 6 runs its arm from two different trusted-side working directories**, because without `--chdir` the capsule's working directory tracks the trusted side's — exactly the inheritance the property forbids, and invisible to a probe run from a single cwd. It observes a *value* rather than a binary, so a missing value line is `Indeterminate` and never unequal. `sec-2`'s `working_directory_has_no_inherit_value` is the type-level half; this is the executed half." },
  { id = "EX-7", text = "**Row 7's payload is the strongest negation the property admits**: a descendant that leaves the original session and process group via `setsid` before its parent exits. A plain orphan is a *representative* negation and a backend reaping by process-group kill passes it, so the row would be weaker than the property it is named after — and the gap was invisible because both readings use the same words (`RV-346` `F-27`). The escape is asserted **directly**, so a payload that silently stops escaping cannot weaken the row without failing." },
  { id = "EX-8", text = "**Row 7's control is `--die-with-parent`, the mechanism unique to teardown, and not the pid namespace.** `EVD-013`'s 2×2 shows teardown needs both — bubblewrap runs its own init as pid 1, so the namespace never collapses when the command exits — and either removal makes the control fail as required. Taking the namespace instead would remove the mechanism row B5 also depends on, and a control removing two rows' guards at once cannot establish which produced the result. The general rule follows: **a row's control removes the mechanism unique to that row's property; where a property has no unique mechanism it cannot be controlled independently and the rows must be re-cut.**" },
  { id = "EX-9", text = "Row 8 is five payloads, one per `Termination` variant. **Three of the five carry no control, and that is stated rather than papered over**: `Exited`, `Signalled` and `NotExecutable` are observations of what the OS reports, not enforcement claims, so there is no guard whose firing is in question; the enforcement half is the two bounded payloads and the row is `Proven` on those. `NotExecutable` and `Exited { code: 127 }` are asserted as **distinct outcomes** rather than merely distinct codes — the pair the spike had to separate by hand, because *the runner refused* and *the runner never ran* otherwise read identically. `NotExecutable`'s liveness comes from a preceding execution in the same capsule (PHASE-07 `EX-12`)." },
  { id = "EX-10", text = "Row 8's timeout payload sleeps a **small fixed multiple** of the configured timeout, not an open-ended duration: under `Removed(ResourceBound(Wall))` the bound is gone, so whatever the payload sleeps is what the control arm costs, and an open-ended sleep would hang `backend verify` rather than fail it." },
  { id = "EX-11", text = "Table B's five axes land, four sharing `SharedRoot` and B5 taking `Removed(ProcessVisibility)`. **B4 targets the retained scratch at `/capsule/tmp`, never the transient `/tmp`**: `/tmp` is `--tmpfs`, an anonymous mount the profile makes fresh on every `execute`, so `SharedRoot` — which re-points a placement's root and reaches only what the placement *declares* writable — cannot reach it at all. A's file died with A's capsule and B saw an empty tmpfs under **both** arms, which is `Unproven`, and since `Admission` is computed from tables A and B alone the suite as specified could never return `Admitted`. The transient area carries no row deliberately: its privacy is `--tmpfs`'s by construction, it holds no transaction state, and a row for it would need its own removal, widening a vocabulary `sec-9` residual 2 already tracks as growing every round." },
  { id = "EX-12", text = "B5's probe asserts **two things positively** — B's process is absent from A's `/proc`, and the signal fails — and its control asserts that with the pid namespace shared and *only* that changed, both become possible. The pid handed to the observer is the one the trusted side observed, in the **host's** namespace, never one the subject reported (`REQ-448` criterion 3, invariant 10). B5's control breaks teardown as a side effect and leaks a descendant; containment is PHASE-08's session kill, and `EVD-013` is why it is needed on B5's arm and not only on row 7's." },
  { id = "EX-13", text = "The two payload rules are applied to every row this phase lands, not just to the ones that forced them: **each payload is the hardest instance of the property's negation the property admits**, exercising every distinguishable negation mechanism where a property has several; and **a row observes the property, not a consequence of the property that happens to be convenient to observe.** An observation with three innocent explanations and one guilty one is not a proof, and no amount of strengthening the payload repairs it." },
]

# Stage-3 record.
#
# 1. The flag day is **PHASE-08**, not this phase: table C provisions real
#    capsules, so the tree reds on a bubblewrap-less host from PHASE-08 onward
#    and every row here compounds it. plan.md § What each phase changes about
#    the tree and `DEC-180` § Where it lands both now say so; the decision
#    itself does not move.
# 2. `Property`'s membership is eight after this phase and fourteen after
#    PHASE-10; PHASE-07 `EX-14` declares the type and the ordering rule only.
#    The compile-time fence (a constructible row the enum cannot name) holds at
#    every phase regardless.
# 3. Table B's eight titles are `sec-3`'s, routed forward by PHASE-06's note.
#    The storage control is a *placement* carrying the same `TransactionRoot`,
#    not a second provision — step 9 refuses that, and a control the system
#    refuses to build proves nothing.
verification = [
  { id = "VT-1", expects = "Table A rows 1–8, each asserting `Proven` and so running both arms. One title per row; `sec-7` records that twice the titles have lagged the rows and that until `R9`'s generator exists, adding a row and adding its title are one edit held together by a reader.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["fresh_mutable_state_is_proven", "bounded_input_set_is_proven", "denial_of_canonical_state_and_credentials_is_proven", "bounded_filesystem_visibility_is_proven", "explicit_network_posture_is_proven", "deterministic_working_directory_is_proven", "process_tree_teardown_is_proven", "resource_and_termination_observation_is_proven"], waived = false },
  { id = "VT-2", expects = "The claims rows 2, 6 and 8 need beyond their verdict: execution rather than stat, the working directory not tracking the trusted side across two cwds, all five termination variants distinguished, and the `NotExecutable` pair separated as outcomes rather than as codes — with its liveness established by a preceding execution in the same capsule.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["a_binary_is_executed_from_each_bound_path", "the_working_directory_does_not_track_the_trusted_side_cwd", "every_termination_variant_is_distinguished", "not_executable_is_distinct_from_exit_127", "not_executable_is_preceded_by_a_liveness_execution_in_the_same_capsule"], waived = false },
  { id = "VT-3", expects = "Row 7's payload precondition asserted directly, its probe established trusted-side, and the `F-27` mutant as a stub — a backend that reaps the original process group and nothing else must report `Violated`. Without that mutant the strengthened payload is a claim no test defends.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["the_descendant_escapes_the_original_session_before_its_parent_exits", "no_descendant_outlives_the_execute_call", "a_process_group_only_reaper_fails_row_seven"], waived = false },
  { id = "VT-4", expects = "Table B's four storage axes and its storage control, which shares the first transaction's root through a second *placement* rather than a second provision.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["two_transactions_on_one_base_share_no_writable_checkout", "two_transactions_on_one_base_share_no_repository_objects", "two_transactions_on_one_base_share_no_runtime_state_in_the_agent_home", "two_transactions_on_one_base_share_no_temporary_state", "control_second_transaction_in_the_first_root_does_share_each_storage_axis"], waived = false },
  { id = "VT-5", expects = "B5's process axis: both positive assertions on the probe arm, both becoming possible under the shared pid namespace, and the pid being the parent's observation rather than the subject's own output — the distinction invariant 10 exists for.", test_file = "crates/doctrine-control/src/conformance.rs", keywords = ["concurrent_capsules_cannot_see_each_others_processes", "concurrent_capsules_cannot_signal_each_others_processes", "control_with_the_pid_namespace_shared_both_become_possible", "the_observed_pid_is_the_one_the_parent_reported_not_one_the_subject_printed"], waived = false },
  { id = "VA-1", expects = "**Phase obligation — re-run `EVD-013`'s pid-namespace × `--die-with-parent` 2×2 against the session-escaping payload.** The existing 2×2 was measured against the old payload, and reasoning about the new one from it is the altitude error `R1` forbids. If `--die-with-parent` turns out not to be required for the escaping descendant, **row 7's control is wrong and the argument — not just the number — has to be redone**; route that through `/consult`. Record the measurement either way." },
  { id = "VA-2", expects = "**Phase obligation — execute both legs of row 5.** The abstract unix socket leg is reasoned (abstract sockets are namespace-scoped, so `--unshare-all` *should* deny it). If it is denied by a different mechanism than the TCP leg, **it is a further row rather than a second assertion in this one** — which moves `DEC-156`'s count as a consequence of the ledger, needing no separate authorisation, but does need the row written." },
  { id = "VA-3", expects = "**Phase obligation — measure every unmeasured delta this phase's rows depend on.** Of the removals rows 1–8 and table B use, only `Teardown` is measured; `WorkingDirectory`, `ResourceBound(FileSize)`, `ResourceBound(Wall)` and `ProcessVisibility` are reasoned. A delta that does not produce its row's control failure means **the row is wrong**, not that the measurement is inconvenient. The retired `CredentialsConfined` is the worked example: reasoned, adopted, and wrong." },
  { id = "VA-4", expects = "Every row this phase lands has a control that was **seen to fail** (invariant 2), and every control differs from its probe by exactly one typed `Delta` with both arms running the same `ArmShape` (invariant 3). Confirm per row rather than in aggregate — a row reading `Proven` because its arms differ by two things is indistinguishable, from the verdict, from one that is correct." },
]
