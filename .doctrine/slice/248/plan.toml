verification = [
  { id = "VT-1", expects = "The export's adoption rules, each refusal against the artefact class it excludes. `export_that_is_a_symlink_refuses` is the `sec-2` `F-1` escape arriving by another route; the alternates case is the one that binds host object state the export was supposed to replace.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["export_is_adopted_across_transactions_on_the_same_base", "export_holds_the_contracted_history_and_no_other_ref", "export_with_an_alternates_file_refuses_rather_than_being_adopted", "export_that_is_a_symlink_refuses"], waived = false },
  { id = "VT-2", expects = "The publish-or-adopt protocol under concurrency converges on one export with neither builder repairing or replacing anything, and a base paired with another base's export refuses before the clone rather than producing a capsule whose contracted base is a fiction.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["concurrent_publication_converges_on_one_export_and_the_loser_adopts_it", "placement_pairing_a_base_with_another_bases_export_refuses", "failed_provision_leaves_an_existing_export_intact"], waived = false },
  { id = "VT-3", expects = "Exclusive ownership at both keyed directories, reached deterministically by handing the same `TransactionId` twice, plus the separator refusal at construction. These are the tests `EX-7`'s signature change exists to make writable.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["provision_onto_an_existing_transaction_root_refuses_and_removes_nothing", "provision_onto_an_existing_temporary_export_directory_refuses_and_removes_nothing", "a_transaction_id_carrying_a_path_separator_refuses_at_construction", "failed_provision_removes_only_the_root_it_created"], waived = false },
  { id = "VT-4", expects = "The three-execution clone: no working tree is materialised trusted-side, the pinned identity actually persisted into the clone's config, and a failing execution refuses **at that step** rather than as one aggregate status.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["clone_inside_leaves_no_working_tree_trusted_side", "capsule_identity_persists_into_the_clone_config", "a_failing_execution_in_the_three_step_clone_refuses_at_that_step"], waived = false },
  { id = "VT-5", expects = "Step 6's ordering made observable: a refinement that adds the resolver's basename to `trusted_side_forbidden_executables` refuses **this** provisioning, which a check against the base policy alone would not.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["resolver_whose_basename_is_forbidden_by_the_policy_refuses"], waived = false },
  { id = "VA-1", expects = "Invariant 6 holds on every refusal path, not only the tested ones: walk each `ProvisionRefusal` construction site and confirm either that no directory was created before it or that the creation token guards the removal. A test proves the paths it takes; this is the sweep for the ones it does not." },
  { id = "VA-2", expects = "No delete capability leaks out of the module (`EX-16`). Confirm rollback is private to `provision`, that no public function removes anything, and that nothing in `main.rs`'s `provision` verb exposes one — `DEC-156`'s hazard is a tidiness primitive a later slice reaches for." },
  { id = "VA-3", expects = "Steps 1, 4, 5 and 6 are pure given `HostFacts` (`EX-6`): confirm no clock, rng, git or disk access outside the thin outer part, per the project's pure/imperative split, and that `HostFacts` is still clock-free at the call site." },
