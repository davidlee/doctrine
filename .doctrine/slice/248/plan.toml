[[phase]]
id        = "PHASE-05"
name      = "The bubblewrap backend profile"
objective = "Implement the self-contained Linux profile — argv assembly in order, declared readable set and closure expansion, the derived inner PATH, resolve-then-validate-then-bind, parent-side descriptor closure and standard-stream ownership, and trusted-side wall and file-size bounds."

entrance_criteria = [
  { id = "EN-1", text = "`CapsuleBackend`, `CapsulePlacement`, `Execution`, `Observation`, `Termination`, `Availability` and both closed vocabularies exist in `backend.rs` (PHASE-04). This phase implements the contract; it defines none of it, and adds no variant to either vocabulary." },
  { id = "EN-2", text = "`CapsulePlacement::try_new` already refuses a reserved inner destination, so this phase can rely on an entry *naming* one being impossible and need only handle an entry *beneath* one (PHASE-04 `EX-5`, and its positive control `a_readable_entry_beneath_a_profile_owned_mount_is_admitted`)." },
  { id = "EN-3", text = "The manifest carries `rustix` with **both** `fs` and `std` (PHASE-03 `EX-17`). `rustix::io::fcntl_setfd` is ungated and compiles under that set; `rustix::process` is not declared and is not reached by this phase." },
  { id = "EN-4", text = "`HostFacts` and its fixture implementation exist (PHASE-03 `EX-1`), which is what makes this phase's declared-list probes and `PATH` derivation hermetic — the whole ≈39-test group is pure, over a fixture, with no disk of a particular shape." },
]

exit_criteria = [
  { id = "EX-1", text = "`crates/doctrine-control/src/backend/bubblewrap.rs` defines `BubblewrapBackend` implementing `CapsuleBackend`, self-contained per `DEC-155`. Naming is plural-ready throughout: this is a backend, never *the confinement profile*. `availability()` names what is missing and what would satisfy it when bubblewrap is absent, rather than the suite skipping green (`POL-002` facet 3)." },
  { id = "EX-2", text = "The inner layout is four constants named once (`STD-001`): `/capsule`, `/source`, `/agent`, `/tmp`. They are **fixed inner paths, not the host's** — `--bind \"$D\" \"$D\"`, the worktree arm's form, would reproduce the capsule's host path inside and so read the parent directory of every other capsule into existence as a mountpoint chain." },
  { id = "EX-3", text = "Those four are the profile's own; a **declared readable input keeps its resolved host path as its inner path**, identity-mapped, which is what makes the derived inner `PATH` computable at all. A `readable-roots` entry resolving under `/tmp` is therefore lawful and lands inside the `--tmpfs` that precedes it in assembly order — refusing it would be the `F-25` shape one level down, refusing a host whose toolchain sits beneath a profile-owned path." },
  { id = "EX-4", text = "The flag tokens are named once in this module and nowhere else, and argv is assembled in this order: `--unshare-all`; `--uid`/`--gid`; `--proc /proc` and `--dev /dev`; `--tmpfs /tmp`; one `--ro-bind` per readable input in declared order; one `--bind` per writable area in declared order; `--chdir`; `--die-with-parent`; `--new-session`; `--clearenv`; one `--setenv` per env entry in sorted order; and `--share-net` **only** when the posture is `Permitted`." },
  { id = "EX-5", text = "`--uid`/`--gid` carry values fixed by the profile and **not configurable**: an operator-chosen uid would be a second way to weaken the capsule, and `sec-5` deliberately carries no credential knob. They are a real behaviour change rather than bookkeeping — without them a capsule runs as the trusted side's uid inside its user namespace, which is what `EVD-014` measured, and row 13 asserts a *declared* identity, so there has to be one to declare. They require `--unshare-user`, which `--unshare-all` already implies: two tokens, no new namespace." },
  { id = "EX-6", text = "`--share-net` is last and conditional, and the capsule is default-denied. This is the inversion `DEC-155` names: the worktree arm's `Default` is the permissive floor (`network=true`), and a capsule must not inherit it. `sec-7` property 5 asserts the default **positively**, via a probe that reaches a trusted-side loopback listener only when the posture is `Permitted`, because a negative-only assertion passes on a host with no network at all." },
  { id = "EX-7", text = "Two fail-closed guards, both from the spike's own findings: an empty mount vector refuses rather than executing unconfined, and an empty `argv` refuses (invariant 9; the assertions are PHASE-04 `VT-6`, over the types this profile consumes)." },
  { id = "EX-8", text = "**No package store is ever bound whole** (invariant 6). Every readable input is a declared path or a member of a declared closure; there is no configuration, and no fallback taken on missing configuration, under which `/nix/store` or an equivalent host-wide artefact store becomes readable in its entirety. The spike bound one root and filtered `PATH` under it; the product does not, for safety rather than `POL-002` — a store holds every package ever realised on that host, so binding it whole gives a capsule a *larger* executable set than an ordinary unconfined process, inverting `REQ-459` property 2 into an implicit and enormous input set." },
  { id = "EX-9", text = "`readable-roots` is bound exactly as declared, and a **single-file** entry is supported: shebang interpreters are resolved by the kernel before `PATH` exists and cost the spike two separate findings. Binding the interpreter file is portable by construction; binding `/bin` is a posture that silently widens on a host where it holds hundreds of binaries." },
  { id = "EX-10", text = "`closure-roots` entries are resolved through their symlinks to a realised path, handed **one at a time** to `closure-resolver`, and every path the resolver returns is bound read-only **individually, never their common parent**. A closure is exactly the transitive runtime set of a realised derivation — what the toolchain specifies and nothing else — which is why the closure rather than the store is the preferred form." },
  { id = "EX-11", text = "The resolver is a query and never a build, and the limits are enforced rather than assumed: it is given an **already-realised path**, never a flake reference or a repository path — `nix build` would evaluate `flake.nix`, a repository-controlled file this project's own `interpreted_paths` names, and evaluating it trusted-side is precisely what `trusted_side_forbidden_executables` exists to deny. Its output is **data, not trust**: one absolute path per line; a relative path, an empty line, a non-existent path, or output exceeding a named bound refuses, and the resolver's own nonzero exit refuses naming it. `[capsule]` comes from the control plane's own `.doctrine/doctrine.toml` at root, never from a capsule checkout, a harvested tree, or the contracted base." },
  { id = "EX-12", text = "**Provisioning realises nothing** (invariant 7): a `closure-roots` entry that does not already resolve to an existing realised path refuses, and the operator builds it out of band. At least one of the two declared lists must be non-empty — a capsule with no readable inputs can execute nothing, and silently producing one would report a confinement success that is really a configuration failure." },
  { id = "EX-13", text = "The inner `PATH` is **derived**: the host `PATH` entries lying beneath *any* bound path, after closure expansion, in host `PATH` order, deduplicated, and nothing else. Several bound paths contributing is the ordinary case, and a file entry contributes none because no `PATH` entry can be beneath a file. The containment test runs over **resolved** paths on both sides." },
  { id = "EX-14", text = "Resolve, then validate, then bind — one rule rather than a policy. Every declared entry and every resolver-returned path is fully resolved through all symlink components before anything looks at it; the resolved path is what `try_new` validates; and the resolved path is what the backend binds, so no window exists in which the two differ. `RV-346` `F-1` demonstrated by execution that **bubblewrap dereferences the source path of a `--ro-bind`**: an earlier draft's lexical containment would have let a declared root of `/opt/tools` pointing at the canonical repository bind the canonical repository while passing every check. This does *not* follow links created **inside** a bound directory at execution time — nothing can, since the capsule may create them — and a `closure-roots` entry pays nothing for it, since every target a closure member links to is itself a closure member." },
  { id = "EX-15", text = "Bounds are enforced **outside** the sandbox: `timeout -k <grace> <secs>` wraps the `bwrap` exec, and the per-file cap is `setrlimit(RLIMIT_FSIZE)` on the child before it — the typed equivalent of the spike's `ulimit -f`. Neither is reachable from inside the namespace, which is what makes property 8 an observation rather than a report. The whole-tree disk figure is computed trusted-side after the run, because a per-file limit does not catch a capsule writing many small files. Rust owns the process orchestration; no shell is generated trusted-side, which would reintroduce quoting hazards on a security boundary (`DEC-160`)." },
  { id = "EX-16", text = "The descriptor sweep enumerates `/proc/self/fd` **in the parent, before the fork**, and sets `FdFlags::CLOEXEC` on every descriptor above 2 through `rustix::io::fcntl_setfd`. Enumerate-and-mark rather than close-after-fork, because a post-fork closure runs between `fork` and `exec` where allocation is unsafe and reading a directory there is precisely the allocation to avoid; `close_range` would be the direct form and needs `libc`, which the zero-new-crates posture rules out and which `rustix` 1.1.4 does not carry. Invariant 12 is the only enforcement in this section with **no flag behind it** — an already-open descriptor is not a namespace, a mount or an environment entry, so neither `--unshare-all` nor `--clearenv` reaches it." },
  { id = "EX-17", text = "**The sweep stops at 2, and the parent replaces 0, 1 and 2 rather than leaving them**: descriptor 0 attached to an empty source, 1 and 2 to one-way capture endpoints the parent created, per `CapsuleStdio`. Marking them close-on-exec instead would be wrong in the obvious way — a capsule with no `stdout` cannot report, and `sec-7`'s probes read their arms' output. Two mechanisms, two invariants, two rows: mark above 2 (invariant 12, row 10), replace at and below 2 (invariant 14, row 12). `RV-346` `F-30` is what the unstated bound cost — *every descriptor is closed* and *every descriptor above 2 is closed* differ by exactly the three a shell hands a process by default." },
  { id = "EX-18", text = "The sweep's two bounding facts are recorded where the code is, not inferred: Rust opens its own files `O_CLOEXEC`, so the backend's own handles are already closed and what the sweep exists for is anything the trusted-side process inherited from *its* parent or that an FFI path opened without the flag; and the residual — a descriptor opened between the sweep and the spawn — rests on `sec-7` row 10 having seen the sweep fire, not on the argument. Likewise the provisioning-time resolution race (a declared path re-pointed after resolution) is recorded as a **known limit**, not presented as closed: it is control-plane-side on operator-owned configuration, a capsule cannot write any declared path, and closing it would need the bind performed against an open descriptor rather than a path." },
  { id = "EX-19", text = "`backend/bubblewrap.rs` adds **no** row to `.doctrine/adr/001/layering.toml`: the gate maps submodule files to their parent unit, so this file is part of the `backend` unit PHASE-04 classified. Confirmed against the gate rather than assumed (VA-4)." },
]

# NOTES for the integration pass.
#
# 1. `resolver_whose_basename_is_forbidden_by_the_policy_refuses` sits in the
#    closure group this phase's provenance row names, but the design states the
#    check as a *provisioning* refusal — "after sec-4 resolves the policy,
#    provisioning refuses when the normalized basename of closure-resolver[0]
#    appears in trusted_side_forbidden_executables" — and PHASE-06 owns both
#    `provision.rs` and `sec-4` § The forbidden list has a consumer in this
#    slice. Claimed by PHASE-06. A VT here would gate code this phase does not
#    write.
# 2. This phase's ≈39-test figure shares `sec-8`'s row with PHASE-04; the row is
#    subdivided along the file boundary, which is a finer cut on the same axis
#    rather than a cut across it (plan.md § Why the backend splits).
verification = [
  { id = "VT-1", expects = "The argv's network posture, asserted on both the conditional and its position — `--share-net` is the inversion DEC-155 names, and where it sits relative to `--unshare-all` decides whether it takes effect at all.", test_file = "crates/doctrine-control/src/backend/bubblewrap.rs", keywords = ["bubblewrap_argv_denies_network_unless_posture_is_permitted", "bubblewrap_argv_places_share_net_only_after_unshare_all"], waived = false },
  { id = "VT-2", expects = "The derived inner `PATH`: nothing enters it that is not beneath a bound path, every bound path contributes in host `PATH` order, and a file entry contributes nothing — the third being the case a naive containment test gets wrong.", test_file = "crates/doctrine-control/src/backend/bubblewrap.rs", keywords = ["inner_path_is_derived_only_from_bound_paths", "inner_path_draws_from_every_bound_path_in_host_path_order", "a_file_readable_root_contributes_no_inner_path_entry"], waived = false },
  { id = "VT-3", expects = "The declared-list and resolver refusals, each naming the entry and the key, plus the individual-binding rule — binding the resolver's returned paths' common parent would silently restore the whole-store posture EX-8 refuses.", test_file = "crates/doctrine-control/src/backend/bubblewrap.rs", keywords = ["absent_readable_root_refuses_naming_the_entry_and_the_config_key", "unrealised_closure_root_refuses_and_provisioning_never_realises_it", "resolver_returning_a_relative_or_absent_path_refuses", "resolver_nonzero_exit_refuses_naming_the_resolver", "closure_expansion_binds_each_returned_path_individually_never_their_common_parent"], waived = false },
  { id = "VT-4", expects = "The parent-side half of invariant 12, asserted over a descriptor the test opens **without** `O_CLOEXEC` — a Rust-opened one is already closed and would pass against a backend that swept nothing. The executed half is `sec-7` row 10 (PHASE-09).", test_file = "crates/doctrine-control/src/backend/bubblewrap.rs", keywords = ["every_descriptor_above_two_is_marked_close_on_exec_before_the_exec"], waived = false },
  { id = "VA-1", expects = "**Execute the phase obligation** (`sec-2`; plan.md § Phase obligations): does bubblewrap create the mountpoint inside the tmpfs for a `readable-roots` entry resolving beneath `/tmp`, or refuse the bind? The design explicitly declines to claim this on the phase's behalf. Record the measurement. If bubblewrap refuses, `EX-3`'s lawful case is not lawful under this backend and that is a design-affecting finding — route it through `/consult`, do not accommodate it quietly." },
  { id = "VA-2", expects = "No bubblewrap flag token appears anywhere outside this module (`STD-001`, EX-4). An absence a keyword mandate cannot express, and the constraint that keeps a second backend from inheriting this one's vocabulary." },
  { id = "VA-3", expects = "Invariant 6 holds structurally: confirm by inspection that no configuration path — including every branch taken on absent configuration — can make a host-wide artefact store readable in its entirety, and that the closure path binds members individually rather than any enclosing directory." },
  { id = "VA-4", expects = "The layering gate classifies `backend/bubblewrap.rs` under the existing `backend` unit and reports no unclassified unit (EX-19). Run the gate; do not infer it from the extractor's documented behaviour." },
]
