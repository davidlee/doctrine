[[phase]]
id        = "PHASE-06"
name      = "The capsule transaction and provisioning"
objective = "Build `provision` end to end — the thirteen steps, the atomic export publish-or-adopt protocol, exclusive root ownership by creation token, the three-execution clone inside the sandbox, and token-guarded rollback — behind the `provision` verb."

entrance_criteria = [
  { id = "EN-1", text = "Every unit `provision` composes exists: `CapsuleConfig` and `assess_capacity` (PHASE-03), `CapsulePlacement::try_new`, `Execution`, `Observation` (PHASE-04), and a working `BubblewrapBackend` (PHASE-05). This phase is the first that runs a real capsule, so it is the first that can be wrong about how the pieces fit rather than about any one of them." },
  { id = "EN-2", text = "`doctrine::interpretation` is exported and reachable from this crate (PHASE-01 `EX-2`, PHASE-02 `EX-8`): `parse`, `canonical_hash`, `restrict`, `InterpretationPolicy` and `PolicyHash`. Steps 4, 5 and 6 call them; this phase re-implements none of the algebra." },
  { id = "EN-3", text = "`git::read_path_at(root, refish, path)` is `pub` on the root library (PHASE-01 `EX-1`) — the working-tree-free blob read step 4's resolution runs on, and the whole impure surface that resolution needs. The export build does **not** reach for `fetch_refspec`. It is `pub(crate)` (`src/git.rs:2718`), `provision.rs` is in the other crate, and `sec-6`'s export set does not carry it — so this phase drives `git` as a subprocess behind a wrapper local to `doctrine-control` (`EX-11`, and `sec-3` § Why the wrapper is local). There is **no** clone or bundle helper in `src/git.rs` to reuse, verified, so that half is net-new whatever input form is chosen. This criterion therefore asserts nothing about `fetch_refspec` at all, which is what closes the entrance-passes-while-exit-is-unbuildable mismatch the critical pass found (note 5)." },
]

exit_criteria = [
  { id = "EX-1", text = "`transaction.rs` defines `CapsuleTransaction` with exactly `DEC-159`'s field set plus the two additions that decision's own terms justify — `backend`, which has provisioning's own `execute` calls as a consumer in this slice, and `AcceptedBase` in place of a bare `CommitId`, because nothing else would let step 8 check that the export it binds is an export of the base it claims. Neither anticipates a later slice's needs. `PhaseIdentity` carries slice and the immutable `PHASE-NN` and nothing more." },
  { id = "EX-2", text = "Two obligations are **documented and not checked**, in the same words as each other so a later slice inherits two stated obligations rather than one stated and one silent. `AcceptedBase` carries the assertion that a trusted-side caller resolved the commit as accepted and does not verify it against the canonical accepted ref — that is admission (`REQ-455`), an explicit Non-Goal. `backend` records the mechanism that created the capsule and step 11 executes through it; `provision` does **not** check that mechanism ever passed `sec-7`'s suite. `backend verify` is what a caller runs to discharge it today, and nothing yet records that it did." },
  { id = "EX-3", text = "Phase identity is bound; plan schema is not. Provisioning reads neither `plan.toml` nor a phase sheet — the refinement arrives as its own document in the `[interpretation]` schema — so everything criteria-bearing, which is where `RFC-027`'s open churn would land, stays with the later launch slice by construction. This slice's exposure to that reshaping is the two fields of `PhaseIdentity`." },
  { id = "EX-4", text = "The layout is `<capsule_root>/export/<base-oid>/` and `<capsule_root>/tx/<id>/` with `capsule/{repo,out,tmp}` and `agent/` beneath it, on **real disk, not tmpfs**: `sec-5`'s free-space probe must read real available space, and property 7's resource observation on a tmpfs would measure the mount's size rather than the disk's. The agent home is a sibling directory rather than the spike's tmpfs for the same two reasons — it is capsule state, and capsule state is what the disk figure is about." },
  { id = "EX-5", text = "The **two scratch areas are distinguished by name throughout**: `/tmp` is *transient* (`--tmpfs`, anonymous, one `execute`, not in `disk_used`, the profile's own mount, no placement delta reaches it) and `/capsule/tmp` is *retained* (host disk, the whole transaction, counted in `disk_used`, the only one that is a declared writable entry). Transient/retained rather than isolated/shared: the design called both *the writable temporary area* until the naming hid a defect (`sec-7` B4), and bare *shared* collides head-on with `REQ-450` criterion 1's vocabulary, whose whole claim is that two transactions share no such state." },
  { id = "EX-6", text = "`provision(request, host: &dyn HostFacts, backend: &dyn CapsuleBackend) -> Result<CapsuleTransaction, ProvisionRefusal>` implements all thirteen steps in order. Steps 1, 4, 5 and 6 are pure given `HostFacts`; 2, 3 and 7–12 are the impure part, in the thin outer part of the module per the project's pure/imperative split." },
  { id = "EX-7", text = "The `TransactionId` is a **request field, allocated by the caller**, not minted by `provision`. This is the pure/imperative rule and it is also what makes two tests writable at all: with no allocator named in the signature the collision branch could not be reached through the stated API (`RV-346` `F-9`, `F-14`), so the refusal tests could not be written. With the id as a parameter the test hands the same id twice and no entropy is involved. The type refuses a value that is not a single path component, so an id can never carry a separator into the layout." },
  { id = "EX-8", text = "Step 4 is the **only** read of `.doctrine/doctrine.toml` from the contracted base — `DEC-136`'s read-once invariant made physical — and it runs through `read_path_at` against the blob at `base`, with no working tree materialised. Step 5 applies the refinement through `sec-4`'s pure monotonic restriction algebra, and any widening refuses." },
  { id = "EX-9", text = "Step 6 admits the closure resolver **against the policy just bound**, refusing when the normalized basename of `closure-resolver[0]` appears in `trusted_side_forbidden_executables`. The ordering is load-bearing: the check runs *after* step 5, because a phase refinement may add a forbidden entry and the entry it adds must bind the transaction it was supplied for — a check against the base policy alone would let a refinement forbid an executable that this very provisioning had already run. This is what makes `REQ-449`'s forbidden list a live constraint in this slice rather than a validated field nothing reads until launch exists." },
  { id = "EX-10", text = "Step 8 publishes or adopts the per-base export by the atomic protocol. **Adopt** only when `export/<base-oid>/` is a real directory (never a symlink — a symlink here is a `sec-2` `F-1` escape by another route), is bare, has **no** `objects/info/alternates`, holds `base` as a complete object closure, and holds **no ref other than** the one naming `base`. Anything else **refuses rather than being repaired**: a partially-built or widened export binds more host object state than `DEC-157` permits, and repairing one in place is how a shared artefact silently acquires a second writer." },
  { id = "EX-11", text = "**Otherwise build in a temporary directory this call exclusively created** — `export/.building-<transaction-id>/`, with `mkdir` semantics that fail when the path exists, never entered, never cleaned, never reused — then `git init --bare` and a fetch of `base`, both driven as `git` subprocesses through a small wrapper local to this crate. That wrapper **carries a comment naming the alternative** — widen the root library's export set to re-use `fetch_refspec` (`src/git.rs:2718`) — so the road not taken is recorded at the seam rather than only in the design; and it inherits that function's one real discipline, an explicit per-command refspec, never a `git remote add` or a `git config` write. The name is *derived* from the id but ownership does **not** rest on it: this step runs before step 9, so nothing has yet established that this call owns the id, collision-resistant is not collision-free, and a retry with the same id is not even improbable (`RV-346` `F-8`). The exclusive create is what establishes ownership, and it establishes it here, independently of step 9." },
  { id = "EX-12", text = "The temporary export is validated by the **same function** as step 1's adoption check, so what is published and what is adopted are checked by one rule. Publication is a no-replace rename — **`rustix::fs::renameat_with(.., RenameFlags::NOREPLACE)`** — so the loser of a concurrent race gets `EEXIST` rather than replacing a live export other capsules already have bound. The loser then adopts the winner and removes **only its own** temporary directory: never the published export, never another builder's temporary directory." },
  { id = "EX-13", text = "Step 9 creates the transaction root with **`mkdir` semantics that fail when the path exists** — never a recursive create-if-missing — and provisioning holds a **creation token** minted by the create rather than by the id. Without this the rollback rationale inverts: on an id collision or a retry, a recursive create would enter an existing transaction root and the failure path would delete another transaction's work, which is exactly the automated deletion of live work `REQ-461` criterion 3 and `DEC-133`/`DEC-137` forbid. Exclusivity is a fact the filesystem establishes; the id's entropy only makes the refusing case rare rather than impossible." },
  { id = "EX-14", text = "Step 11 clones **inside** the sandbox as three separate `backend.execute` calls — `git clone --no-hardlinks --quiet -c user.name=… -c user.email=… -- /source /capsule/repo`, then `git -C /capsule/repo switch --detach --quiet <base>`, then `git -C /capsule/repo remote remove origin` — each checked, refusing on the first that does not exit zero. `sh -c` would reintroduce the quoting hazard on a security boundary; running 2 and 3 trusted-side would put trusted Git in a capsule-authored repository, which `SPEC-030` forbids outright; a mounted helper script is the right answer for a conditional *sequence* and buys a mount and a shipped script to avoid two sandbox starts here. Three executions also make each step's termination separately observable, which is better evidence than one aggregate status." },
  { id = "EX-15", text = "`--no-hardlinks` is a **mitigation, not tuning**: a local clone hardlinks object files by default, so a hostile capsule corrupting a shared object would corrupt its source. The read-only binding makes the write fail rather than corrupt; the flag is what survives someone making the export writable. Capsule identity is pinned by `git clone -c`, which takes effect after init and before the fetch so it covers the clone's own reflog writes — configured afterwards, git guesses an identity, resolving the hostname, and inside `--unshare-all` that is a DNS query for an unshared UTS name that blocks until the resolver gives up (~3.9s per ident-needing operation against 40ms pinned). Step 12 **asserts** the identity persisted by reading it back, because a git that stopped persisting `-c` would restore the stall silently. No remotes: the capsule has nowhere to push, and harvest is a control-plane pull." },
  { id = "EX-16", text = "Rollback removes the transaction root this call created, **only** that path, and **only** on the creation token step 9 issued. A call that failed *because* the root already existed holds no token and removes nothing. It is a private step of `provision` and not a product-side delete capability — `DEC-156` names the hazard precisely: a delete primitive introduced here for tidiness is what a later slice would reach for." },
  { id = "EX-17", text = "The `provision` verb is added to `crates/doctrine-control/src/main.rs`, minting the `TransactionId` from a collision-resistant source in the shell and passing it in. A transaction `show` verb is deliberately omitted: nothing operates a transaction yet and the tests inspect the returned value directly." },
  { id = "EX-18", text = "`.doctrine/adr/001/layering.toml` gains `transaction` (engine → `backend`, `config`) and `provision` (engine → `transaction`, `backend`, `capacity`, `config`, `host`) in the `doctrine-control` section." },
  { id = "EX-19", text = "`REQ-450` is reported as **partial**, not quietly claimed: criteria 2 and 3 need candidate identity and harvest from later slices. This slice records a contributing `--change` against criterion 1 and says so in the reconciliation brief." },
]

# Stage-3 record.
#
# 1. The five `REQ-450` axis titles and their two controls are handed to the
#    harness by this phase's provenance row and land in PHASE-09 as table B:
#      two_transactions_on_one_base_share_no_writable_checkout
#      two_transactions_on_one_base_share_no_repository_objects
#      two_transactions_on_one_base_share_no_runtime_state_in_the_agent_home
#      two_transactions_on_one_base_share_no_temporary_state
#      control_second_transaction_in_the_first_root_does_share_each_storage_axis
#      concurrent_capsules_cannot_see_each_others_processes
#      concurrent_capsules_cannot_signal_each_others_processes
#      control_with_the_pid_namespace_shared_both_become_possible
#    Note the storage control is a *placement* carrying the same TransactionRoot,
#    not a second provision — step 9 refuses that, and a control the system
#    refuses to build proves nothing. PHASE-09 needs that distinction.
# 2. `resolver_whose_basename_is_forbidden_by_the_policy_refuses` is claimed here
#    rather than in PHASE-05, whose alignment block lists it: the check is a
#    provisioning step (step 6) and this phase owns both `provision.rs` and
#    `sec-4` § The forbidden list has a consumer in this slice.
# 3. `REQ-449` criterion 3 (read-once) is `EX-8`'s structural claim and is
#    verified in PHASE-08's table C, not here — the same seam PHASE-02's note
#    records from the other end.
#
# Critical-pass record.
#
# 4. **`rustix` availability verified against the vendored crate source, not
#    inferred.** `rustix` 1.1.4. `renameat_with` is `src/fs/at.rs:296`, gated
#    `#[cfg(any(apple, linux_kernel, target_os = "redox"))]` and re-exported by
#    `pub use at::*`; `RenameFlags::NOREPLACE` is a real bitflag. There is **no
#    symbol named `renameat2`** — that is the syscall and the `#[doc(alias)]`,
#    which is why EX-12 was corrected. `rustix::fs::statvfs` is `src/fs/abs.rs:288`,
#    gated only `not(wasi)`, and `StatVfs.f_bavail` / `.f_frsize` are both `u64`
#    (so PHASE-03 `EX-15`'s multiplication and `EX-14`'s `FigureOverflows` agree).
#    Zero-new-compiled-crates holds under `fs` + `std`: `fs = []` pulls in no
#    dependency and `std` adds only `bitflags/std`, already compiled. The export
#    publish-or-adopt protocol's atomicity is therefore safe as specified, and no
#    `libc` edge is needed.
# 5. **`EN-3` was satisfiable on a false premise. SETTLED at the design reopen.**
#    It said `read_path_at` is "`pub` on the root library" but `fetch_refspec`
#    merely "exists". `fetch_refspec` is `pub(crate)` (`src/git.rs:2718`) and
#    absent from the export set PHASE-01 `EX-2` fixes, so `EX-11` could not
#    compile as written while `EN-3` still read as met — the entrance criterion
#    passing while the exit criterion was unbuildable, which no phase gate
#    catches. **Ruled by the slice owner: wrap `git` locally in
#    `doctrine-control`**, rather than widening the root library's export set.
#    `fetch_refspec` is eleven lines, `src/git.rs:2718-2728` (one `git fetch`
#    with an explicit refspec,
#    plus error formatting), so exporting it would pay `sec-9` `R7`'s
#    minimal-surface cost — on a crate that ships — for almost nothing, and pay
#    it at PHASE-01, five phases before the need appears. `SPEC-030`
#    (`spec-030.md:80`) puts Doctrine-owned Git operations under the ingestion
#    contract rather than the `trusted_side_forbidden_executables` check, so a
#    trusted-side `git` here is governed and not a new hazard. `EN-3` and `EX-11`
#    are both rewritten above, and `sec-3` § Why the wrapper is local says the
#    same thing in the design. **This
#    phase is no longer blocked** — the export set PHASE-01 lands is unchanged by
#    the ruling, so PHASE-01 is unaffected.
verification = [
  { id = "VT-1", expects = "The export's adoption rules, each refusal against the artefact class it excludes. `export_that_is_a_symlink_refuses` is the `sec-2` `F-1` escape arriving by another route; the alternates case is the one that binds host object state the export was supposed to replace.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["export_is_adopted_across_transactions_on_the_same_base", "export_holds_the_contracted_history_and_no_other_ref", "export_with_an_alternates_file_refuses_rather_than_being_adopted", "export_that_is_a_symlink_refuses"], waived = false },
  { id = "VT-2", expects = "The publish-or-adopt protocol under concurrency converges on one export with neither builder repairing or replacing anything, and a base paired with another base's export refuses before the clone rather than producing a capsule whose contracted base is a fiction.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["concurrent_publication_converges_on_one_export_and_the_loser_adopts_it", "placement_pairing_a_base_with_another_bases_export_refuses", "failed_provision_leaves_an_existing_export_intact"], waived = false },
  { id = "VT-3", expects = "Exclusive ownership at both keyed directories, reached deterministically by handing the same `TransactionId` twice. These are the tests `EX-7`'s signature change exists to make writable. The separator refusal is `VT-6`, in the file that defines the type.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["provision_onto_an_existing_transaction_root_refuses_and_removes_nothing", "provision_onto_an_existing_temporary_export_directory_refuses_and_removes_nothing", "failed_provision_removes_only_the_root_it_created"], waived = false },
  { id = "VT-4", expects = "The three-execution clone: no working tree is materialised trusted-side, the pinned identity actually persisted into the clone's config, and a failing execution refuses **at that step** rather than as one aggregate status.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["clone_inside_leaves_no_working_tree_trusted_side", "capsule_identity_persists_into_the_clone_config", "a_failing_execution_in_the_three_step_clone_refuses_at_that_step"], waived = false },
  { id = "VT-5", expects = "Step 6's ordering made observable: a refinement that adds the resolver's basename to `trusted_side_forbidden_executables` refuses **this** provisioning, which a check against the base policy alone would not.", test_file = "crates/doctrine-control/src/provision.rs", keywords = ["resolver_whose_basename_is_forbidden_by_the_policy_refuses"], waived = false },
  { id = "VT-6", expects = "`TransactionId` refuses a value that is not a single path component, so an id can never carry a separator into the layout (`EX-7`). Appended at stage 3: the assertion is about the type's constructor, and the type is defined in `transaction.rs`, which `sec-8`'s evidence table names as a home for `sec-3`'s tests and which no other mandate anchored — a `VT` whose `test_file` is `provision.rs` carries no keyword floor over this file at all. The keywords also pin `DEC-159`'s field set and `PhaseIdentity`, so the unit's other types are not invisible to the gate.", test_file = "crates/doctrine-control/src/transaction.rs", keywords = ["a_transaction_id_carrying_a_path_separator_refuses_at_construction", "CapsuleTransaction", "TransactionId", "AcceptedBase", "PhaseIdentity"], waived = false },
  { id = "VA-1", expects = "Invariant 6 holds on every refusal path, not only the tested ones: walk each `ProvisionRefusal` construction site and confirm either that no directory was created before it or that the creation token guards the removal. A test proves the paths it takes; this is the sweep for the ones it does not." },
  { id = "VA-2", expects = "No delete capability leaks out of the module (`EX-16`). Confirm rollback is private to `provision`, that no public function removes anything, and that nothing in `main.rs`'s `provision` verb exposes one — `DEC-156`'s hazard is a tidiness primitive a later slice reaches for." },
  { id = "VA-3", expects = "Steps 1, 4, 5 and 6 are pure given `HostFacts` (`EX-6`): confirm no clock, rng, git or disk access outside the thin outer part, per the project's pure/imperative split, and that `HostFacts` is still clock-free at the call site." },
