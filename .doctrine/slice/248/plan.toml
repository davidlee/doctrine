# Implementation plan for SL-248 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-248"

# STAGE 1 OF 3 — the spine only. Every phase below carries its id, name and
# objective; `entrance_criteria`, `exit_criteria` and `verification` are
# deliberately empty and are stage 2's work (plan.md § Authoring stages).
# The phase list is the artefact that had to be right first time, because
# PHASE-NN ids are immutable and edits append rather than renumber.

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

[[phase]]
id        = "PHASE-01"
name      = "Workspace foundation and the checked set"
objective = "Create the `doctrine-control` workspace member and the root package's lib target with its curated export set, and bring the new crate into the checked set in the same change — so no later phase can ship a suite that is green by never running."
entrance_criteria = []
exit_criteria     = []
verification      = []
specs             = []
requirements      = []

