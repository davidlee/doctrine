[[phase]]
id        = "PHASE-02"
name      = "Interpretation policy: parse, normalize, hash, restrict"
objective = "Build `src/interpretation.rs` as a strict typed projection of `[interpretation]` beside the deliberately tolerant shared reader — six distinguishable refusals, duplicate rejection before sorting, an injective canonical hash, and the monotonic restriction algebra — and export it through the lib target."

entrance_criteria = [
  { id = "EN-1", text = "`src/lib.rs` exists as the root package's lib target and `crates/doctrine-control` is in `default-members`, so a module declared in `lib.rs` is compiled and its `#[cfg(test)]` tests actually run under `just check` (PHASE-01). Without this the module is compiled by no target and this phase's tests are green by never running." },
  { id = "EN-2", text = "`tests/architecture_layering.rs` carries the export-set assertion and `.doctrine/adr/001/layering.toml` carries the root tree's tier map, so this phase extends each by one entry rather than authoring either." },
]

exit_criteria = [
  { id = "EX-1", text = "`src/interpretation.rs` exists, leaf-tier and out-edge-free, and is pure throughout: nothing in it reads a file, a clock, or a repository. It exposes `parse`, `canonical_hash`, `restrict`, `InterpretationPolicy`, `ExecutableName`, `PathPattern`, `VerificationRow`, `PolicyHash`, `INTERPRETATION_SCHEMA`, and the refusal types." },
  { id = "EX-2", text = "`InterpretationPolicy` is constructible only through `parse` — no other public constructor, no public field mutation — so an unnormalized value of the type cannot exist, which is what lets `canonical_hash` and `restrict` assume normalization instead of re-checking it." },
  { id = "EX-3", text = "The `[interpretation]` table is projected out of a tolerant outer document and then walked key-by-key against a known set rather than deserialized, so `BlockMissing`, `KeyMissing`, `UnknownKey`, `UnsupportedSchema`, invalid-value and `EmptyVerificationSequence` are six distinguishable typed refusals and not a formatted dependency error string." },
  { id = "EX-4", text = "The walk is recursive: each verification row is walked against its own known key set (`argv`, and nothing else), with `RowKeyMissing` and `UnknownRowKey` distinguished. A row spelled `{ argv = [...], extra = true }` has a defined refusal rather than being projected silently." },
  { id = "EX-5", text = "Duplicate rejection is an explicit refusing step that runs before sorting, and both run before the hash. Set-valued lists are `Vec` byte-sorted after that check — never a `BTreeSet`, which would make the sort free and the duplicate invisible. Verification row order and argument order are preserved." },
  { id = "EX-6", text = "`canonical_hash` is SHA-256 over the domain-separated, length-prefixed encoding of the typed value — never over source text or a re-serialized TOML document. `PolicyHash` is a newtype with no public constructor other than `canonical_hash`." },
  { id = "EX-7", text = "`restrict` evaluates its four rules in order, and rule 4's failure is diagnosed by the ordered classification: row-removed, then row-inserted (base is a subsequence but not a prefix), then row-reordered, then row-replaced. Prefix decides acceptance; subsequence decides which refusal." },
  { id = "EX-8", text = "`src/lib.rs` declares `pub mod interpretation;`, the export-set constant names it, and `.doctrine/adr/001/layering.toml` classifies `interpretation = \"leaf\"` with out=0." },
  { id = "EX-9", text = "`src/main.rs` does **not** declare `mod interpretation;` — nothing in the agent-facing binary consumes the policy in this slice, and declaring it in both targets would compile it twice for nothing. The module is still discovered and classified by the layering gate, which walks the file tree rather than `mod` declarations." },
]

