[[phase]]
id        = "PHASE-04"
name      = "The backend contract and placement validation"
objective = "Define the `CapsuleBackend` contract and its closed vocabularies, and the single validating `CapsulePlacement` constructor — bidirectional overlap, reserved inner destinations, and the two typed carve-outs — with every refusal paired against the lawful case it must not capture."

entrance_criteria = [
  { id = "EN-1", text = "`ByteCount` exists in `config.rs` (PHASE-03 `EX-3`). `Execution.file_size_cap` and `Observation.disk_used` are that type, which is what makes `backend → config` the one out-edge `sec-6`'s unit table gives this leaf unit." },
  { id = "EN-2", text = "`CapsuleConfig`'s resolved capsule root exists (PHASE-03 `EX-12`) and is what populates `ForbiddenScopes::capsule_root`. `sec-5` invariant 4 states the geometry this phase enforces; the resolution that produces the path is not re-done here." },
  { id = "EN-3", text = "The crate is in the checked set and its manifest carries every edge its code uses (PHASE-01 `EX-12`, PHASE-03 `EX-17`), so this unit's ≈20 pure tests run and no dependency is added by this phase." },
]

exit_criteria = [
  { id = "EX-1", text = "`crates/doctrine-control/src/backend.rs` defines `CapsuleBackend` with exactly three methods — `id() -> BackendId` (a stable identity recorded in an admission verdict, never a display string), `availability() -> Availability`, and `execute(&CapsulePlacement, &Execution) -> Result<Observation, BackendError>`. Every method is total with respect to the host: an unavailable backend reports that it is unavailable rather than failing at execution time." },
  { id = "EX-2", text = "`execute` is the whole capability and is deliberately smaller than a launch verb — no work contract, no notification, no harvest, no result publication. `DEC-156` requires it because `REQ-459`'s process-teardown and resource-observation criteria are claims about *this* primitive with nowhere else to attach, and because a suite driving `bwrap` directly would certify a path production never takes." },
  { id = "EX-3", text = "`CapsulePlacement` has every field private and exactly one constructor, `try_new(parts: PlacementParts, scopes: &ForbiddenScopes)`. A public struct literal would let a caller assemble a placement that satisfies every property the suite asserts and still reaches host state the suite never looked at — the mount set *is* the confinement, so an unvalidated one is an unconfined capsule with a confined shape. `scopes` is a parameter rather than knowledge the type holds, because a confinement type cannot know where a particular host keeps its canonical repository." },
  { id = "EX-4", text = "`ForbiddenScopes` carries `canonical_repository`, `control_plane_state` (the whole `.doctrine/` tree at root), `capsule_root`, and a `credentials` list the operator extends." },
  { id = "EX-5", text = "`try_new` refuses with a named variant per class: an inner destination in the reserved set (`/proc`, `/dev`, `/tmp`, `/source`, `/capsule`, `/agent`) supplied as an ordinary readable or writable entry; two entries with the same inner path, or one inner path an ancestor of another, so mount order can never decide what is visible; a resolved host path overlapping a `ForbiddenScopes` member **in either direction**; a `source` that does not descend from `<capsule_root>/export/` or whose carried base identity is not the placement's accepted base; and a resolved host path that is the filesystem root." },
  { id = "EX-6", text = "Overlap is bidirectional and the descendant half is the half that matters. `overlaps(a, b)` is `a == b || a.starts_with(b) || b.starts_with(a)` over **already-resolved** paths — a component comparison, not a textual prefix test, so `/var/lib/doctrine-other` is not under `/var/lib/doctrine`. `RV-346` `F-10` refuted the equal-or-ancestor version: `repository/.git/config`, `credentials/token` and `capsule-root/tx/<another-transaction>` are all descendants of a forbidden scope, all pass an equal-or-ancestor test, and each is exactly what its scope exists to deny. Provenance cannot carry the argument, so the geometry does." },
  { id = "EX-7", text = "Both carve-outs are **typed fields, not entries in `readable`/`writable`**: `root: TransactionRoot` (minted by `sec-3` step 9) and `source: SourceExport` (minted by `sec-3` step 8's publish-or-adopt, carrying the base OID it is an export of). `try_new` admits a writable entry descending from *this placement's* `root` and refuses every other overlap with `capsule_root`; it admits `source` when it descends from `<capsule_root>/export/` **and** its carried identity equals the accepted base. So a sibling transaction and a sibling export are each refused by the same test that admits the lawful pair, and the vectors stay carve-out-free — no declared entry of any kind is ever admitted beneath a forbidden scope." },
  { id = "EX-8", text = "Every host path is fully resolved **before** validation and the resolved path is the one handed to the backend (invariant 3), and a backend chooses no path of its own (invariant 1) — every host path in a `CapsulePlacement` is computed by provisioning. A backend that resolved its own paths could satisfy the suite and still place a capsule somewhere the suite never looked." },
  { id = "EX-9", text = "**Each refusal is paired with a positive case the refusal must not capture, and the pair is what gets written — never the refusal alone.** This is the discipline `RV-346` `F-25` bought: `F-10` was the under-denial defect in this rule and `F-25` the over-denial mirror, and only one of the two directions had a test. Read literally, the `F-25` version refused the design's only lawful source placement, which would have failed every conformance row before running for a reason unrelated to any property under test. The tests below are ordered to make each pairing visible." },
  { id = "EX-10", text = "`Execution` carries a typed `Argv` — never a shell string, because `SPEC-030` says the trusted plan uses typed argv and a string would put quoting on a security boundary — plus `env: CapsuleEnv`, `timeout`, `file_size_cap: ByteCount`, and `stdio: CapsuleStdio`. Both vocabularies are closed enums for the same reason and neither has an open map or a raw-descriptor field." },
  { id = "EX-11", text = "`CapsuleEnvVar` is a closed enum — `Path` (derived from the bound readable paths, never the host's), `Home`, `Term` (always `dumb`), and the four git identity variants (the capsule's own, never the host's). Every variant's *value* is computed trusted-side from the placement; none is caller-supplied text. A `BTreeMap<String, String>` is rejected: `--clearenv` stops *inheritance* only, so an open map is a second unguarded route for exactly the credentials the mount set denies, and a caller passing `GITHUB_TOKEN` by value would satisfy every mount assertion in `sec-7`." },
  { id = "EX-12", text = "`CapsuleStdio` has exactly one variant, `EmptyInputCapturedOutput`: descriptor 0 an empty source yielding EOF, descriptors 1 and 2 **one-way** endpoints the parent created and reads. One-way rather than merely parent-created, because a socket pair would satisfy *the parent made it* while carrying bytes back into the trusted side. A `RawFd` field or an `Inherit` variant would make handing a capsule a live trusted-side descriptor the ordinary case rather than an unrepresentable one — `RV-346` `F-30` is what the omission cost, since invariant 12's sweep starts above 2 and nothing else covered 0. `/dev/null` is deliberately not named: the property is *yields no bytes*, not *is `/dev/null`*, and which paths exist inside a capsule is the profile's business." },
  { id = "EX-13", text = "`Observation` carries `termination`, `stdout`, `stderr` and `disk_used`, every field observed by the **parent** — nothing in it is reported by the capsule (`REQ-448` criterion 3: worker output is evidence, never authority). `Termination` has five distinguishable variants — `Exited`, `Signalled`, `TimedOut`, `FileSizeExceeded`, `NotExecutable` — because *the runner refused* and *the runner never ran* otherwise read identically. `Availability::Unavailable { missing, remedy }` names what is absent and what would satisfy it (`POL-002` facet 3)." },
  { id = "EX-14", text = "`BackendError` is reserved for failures of the *backend* and never for a capsule's own nonzero exit: a capsule that exits 1 is `Ok(Observation { termination: Exited { code: 1 }, .. })`." },
  { id = "EX-15", text = "Nothing in this unit states a property **count** as a numeral. `sec-7`'s Table A is the single source and `sec-2`'s table is a projection answerable to it; `RV-346` `F-28` found `sec-2` still instructing eight properties three rounds after the first correction, as current implementation instructions contradicting `sec-7`. A numeral repeated across sections is a constant with several definitions (`STD-001`). The one machine-checked projection is PHASE-07's `Property` enum, and this phase adds no second unchecked one." },
  { id = "EX-16", text = "The five executed-only invariants get **no pure test standing in for them here**, and the reason is recorded rather than left implicit: read-only attachment (11), descriptor closure above 2 (12), a computed environment (13), parent-owned standard streams (14) and established process credentials (15) are properties of the running capsule rather than of the argv. The sharpest case is 15, where the pure test that *looks* sufficient is an argv assertion over `--unshare-all` — a flag from one backend standing in for a property every backend owes, which a second backend satisfies vacuously by having no argv to check. Their homes are `sec-7` rows 9, 10, 11, 12, and 13–14 respectively." },
]

# NOTES for the integration pass.
