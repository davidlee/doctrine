# Implementation plan for SL-191 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-191"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (.doctrine/glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-01"
name      = "Trait-coverage predicate (engine core)"
objective = """
Add the shared pure predicate `traits_covered(declared: &BTreeSet<String>, corpus)
-> Vec<String>` to `src/hymns.rs`, returning declared trait keys that match NO
model-band selector in the corpus. This is the DRY core both the bake (PHASE-03)
and `prompt check` (PHASE-04) call down to (design D4). "Covered" is decided by
the engine's membership matcher (a declared key fires >=1 model snippet), NOT
string equality — so `adherence/_default` covers a declared `adherence/low`
(design F5b). Pure over (traits, corpus): no disk/clock/env (pure/imperative
split, ADR-001 engine layer).
"""
entrance_criteria = [
  { id = "EN-1", text = "SL-192 set-valued context shipped: hymns.rs carries Selector.model / ContextVector.model as BTreeSet<String> and the membership matcher (verified at plan)." },
]
exit_criteria = [
  { id = "EX-1", text = "`traits_covered` exists in src/hymns.rs, pure, using the engine membership matcher (not string equality)." },
  { id = "EX-2", text = "Unit tests cover: a covered trait (exact + `_default` wildcard), an uncovered/typo trait ('adherance/low'), the empty declared-set case." },
  { id = "EX-3", text = "`doctrine check gate` green (clippy zero warnings)." },
]
verification = [
  { id = "VT-1", expects = "traits_covered unit tests present and green in src/hymns.rs", test_file = "src/hymns.rs", keywords = ["traits_covered", "adherence"] },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-02"
name      = "Worker-contract + trait-keyed delivery hymns (content)"
objective = """
Author the two Framework hymns (design D2/D3, ownership table):
`install/hymns/role/worker.md` — the negative contract expressed on the owned
"constrained writer / declared file set" primitive (touch only declared set;
no `.doctrine/`/`.claude/` writes; only git verb = final commit; no unauthored-test
edits; hermetic goldens; component-anchored paths + owned dirs `.dispatch/`/
`.worktrees/`; module-home + layer-rationale DIRECTIVE; run `doctrine check
quick`/`commit`), and `install/hymns/model/adherence/low.md` — the SL-168 §5c
delivery patterns (explicit negatives, concrete-over-abstract, high-density),
homed as low-adherence guidance reachable by any loose model via membership.
POL-002: NO host literals (`cargo`/`target/`/`just`) in the SL-191-AUTHORED hymns
(`install/hymns/role/worker.md`, `install/hymns/model/**`) — those belong in the
`.doctrine/hymns` overlay (PHASE-07). NB the gate is scoped to the authored set,
NOT the whole `install/hymns` tree: the pre-existing `harness/` band (e.g.
`harness/cursor.md`, IMP-245) legitimately names host tooling — the harness band's
job — and is out of SL-191 scope (codex F1). Content only; no bake yet.
Live-verification caveat (codex F5/F6): in THIS repo the overlay `role/worker`
FULLY replaces the Framework slot, so a live in-repo `prompt explain --role worker`
reflects the overlay, NOT this enrichment — the role-band live composition is only
observable after PHASE-07 re-homes the overlay. The MODEL band (`adherence/low`)
has no overlay twin, so its composition IS live-observable. Verify role content
via a hermetic fixture / embedded corpus; verify the model band live.
"""
entrance_criteria = [
  { id = "EN-1", text = "Ownership cut settled (design § Content ownership): every contract line assigned to role/worker, model/adherence/low, or the overlay." },
]
exit_criteria = [
  { id = "EX-1", text = "install/hymns/role/worker.md carries the full negative contract per the ownership table, host-agnostic." },
  { id = "EX-2", text = "install/hymns/model/adherence/low.md carries the §5c delivery patterns as low-adherence guidance." },
  { id = "EX-3", text = "No host literal (cargo/target/just/node_modules) appears in the SL-191-authored hymns (install/hymns/role/worker.md + install/hymns/model/**) — asserted by a POL-002 content-gate test scoped to that set (NOT the whole install/hymns tree — harness band excluded)." },
  { id = "EX-4", text = "MODEL band live-observable: `prompt explain --model adherence/low` traces the adherence/low composition in-repo. ROLE band verified via a hermetic fixture / embedded corpus (overlay suppresses it live until PHASE-07)." },
]
verification = [
  { id = "VT-1", expects = "POL-002 content-gate test with a unique fn name (e.g. install_hymns_authored_set_has_no_host_literals) that enumerates install/hymns/role/worker.md + install/hymns/model/** and asserts absence of a named FORBIDDEN_HOST_LITERALS-style list. Keyword the fn name + the forbidden-list constant (whole-file substring), not a line-anchored assert regex (codex F7: verify-vt patterns match per-line; a loop-over-list test asserts on a different line than the literals appear)", test_file = "src/install.rs", keywords = ["no_host_literals", "FORBIDDEN_HOST_LITERALS", "adherence"] },
  { id = "VA-1", expects = "Agent review: role/worker + adherence/low hymns adequately encode the SL-168 defect-class contract and read host-agnostic" },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-03"
name      = "Agent-def frontmatter parser + bake widening"
objective = """
Deliver the trait content to the baked def (design D2/D4, adversarial C2). No
agent-def frontmatter parser exists today — the bake does a byte-level marker
replace only (install.rs:1796-1803). Add a dedicated agent-def frontmatter parser
(schema: `traits` optional list, `model` cascade-ignored, unknown keys tolerated)
with negative tests (malformed / absent `traits` / unknown keys). Widen
`resolve_worker_role_body` to take `traits: &BTreeSet<String>`, populate the
context's `model` set and add `Band::Model` (bands become `Only([Role, Model])`);
absent traits → empty set → role band only, byte-identical to today. The bake
call site parses the def's `traits:` and passes them, then runs `traits_covered`
as an INSTALL-TIME HARD ERROR (a contractless worker cannot ship). Declare
`traits = ["adherence/low"]` in `install/agents/pi/dispatch-worker.md` (+ installed
universal twin); the claude def stays trait-less (role band only, D1). Marker
stays the literal sentinel `{{ prompt resolve --role worker }}` with a loud comment
documenting "full worker context (role+traits); bake reads frontmatter, not marker
args" (F4/C6: keep-literal chosen over rename — lower blast radius, no installed-def
churn). Behaviour-preservation: `expand_worker_marker` unit tests + subagent-def
drift test stay green.

Shared context-builder (codex F5): extract a pure `worker_context(traits:
&BTreeSet<String>) -> ContextVector` that both the bake AND `prompt check`
(PHASE-04) call — `resolve_worker_role_body` becomes `resolve(worker_context(traits),
…)`. Without this seam PHASE-04 can only substring-grep the resolved String body and
cannot assert the band filter structurally; the builder is the DRY seam that lets
PHASE-04 check `worker_context(traits).bands ∋ Band::Model` directly.

Intra-phase ordering (parser-first): land the frontmatter parser red/green FIRST
(it is the new, de-riskable surface), then widen the resolver onto it, then the
call-site + hard-error, then the def declarations.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 predicate green; PHASE-02 content present so resolve is non-empty." },
]
exit_criteria = [
  { id = "EX-1", text = "A dedicated agent-def frontmatter parser exists in src/install.rs with negative tests (malformed / absent traits / unknown keys)." },
  { id = "EX-2", text = "resolve_worker_role_body takes a `traits` param, populates ContextVector.model, and adds Band::Model; trait-less resolve is byte-identical to today." },
  { id = "EX-3", text = "The bake call site parses def `traits:`, passes them, and runs traits_covered as an install-time hard error (a def declaring an uncovered trait fails install — test)." },
  { id = "EX-4", text = "install/agents/pi/dispatch-worker.md (+ universal twin) declare traits = [\"adherence/low\"]; claude def has none." },
  { id = "EX-5", text = "expand_worker_marker unit tests + subagent-def drift test green; a baked pi/universal def inlines role+adherence content." },
  { id = "EX-6", text = "A pure `worker_context(traits) -> ContextVector` builder exists, used by both the bake and PHASE-04's prompt check (codex F5 — the structural seam for band-filter assertion)." },
]
verification = [
  { id = "VT-1", expects = "Frontmatter parser negative tests: malformed / absent traits / unknown keys", test_file = "src/install.rs", keywords = ["fn parse", "frontmatter", "traits"] },
  { id = "VT-2", expects = "Trait-less resolve is byte-identical to today (behaviour-preservation of the role-only path)", test_file = "src/install.rs", keywords = ["worker_context", "Band::Role"] },
  { id = "VT-3", expects = "Covered-trait bake inlines adherence content; an uncovered-trait bake is an install-time hard error", test_file = "src/install.rs", keywords = ["worker_context", "adherence/low", "Band::Model"] },
  { id = "VT-4", expects = "Behaviour-preservation: expand_worker_marker + subagent-def drift tests green", test_file = "src/install.rs", keywords = ["expand_worker_marker", "WORKER_RESOLVE_MARKER"] },
  { id = "VT-5", expects = "Def-declaration test (codex F4): reads the embedded agent defs and asserts the pi/universal dispatch-worker def declares traits = [\"adherence/low\"] and the claude def declares none — so a shipped def that loses its declaration fails, not just a fixture", test_file = "src/install.rs", keywords = ["embedded_agent_defs", "dispatch-worker", "adherence/low"] },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-04"
name      = "prompt check: coverage finding + delivered-band assertion"
objective = """
Extend the existing def-loop in `check_corpus` (prompt.rs:322 already enumerates
`embedded_agent_defs()` and checks marker presence) with two author-time findings
(design D4, adversarial C3): (1) parse each embedded def's `traits:`, run
`traits_covered`, and flag a declared-but-uncovered trait BEFORE install; (2) run
the SAME full-context resolver the bake uses (not the role-only helper) per worker
def and assert — marker present, full-context resolve succeeds, and when `traits:`
is non-empty the resolved band filter INCLUDES `Model`. This closes the "trait
hymn authored but never baked" gap coverage alone leaves (a bake that parses
`traits:` but forgets to widen `bands` would evade a coverage-only check). Rides
the `check_def_marker_present_role_unresolvable` precedent. Def→corpus direction,
embedded defs only.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 widened resolver + frontmatter parser landed." },
]
exit_criteria = [
  { id = "EX-1", text = "check_corpus flags a def declaring an uncovered trait as a finding (author-time, before install)." },
  { id = "EX-2", text = "check_corpus runs the full-context resolver per worker def and asserts Model band present when traits: is non-empty." },
  { id = "EX-3", text = "New tests ride the check_def_marker_present_role_unresolvable precedent: uncovered-trait finding + missing-Model-band finding." },
]
verification = [
  { id = "VT-1", expects = "prompt check coverage test: a def declaring an uncovered/typo'd trait yields a finding", test_file = "src/commands/prompt.rs", keywords = ["traits_covered", "check_corpus"] },
  { id = "VT-2", expects = "Delivered-band test: a worker def with non-empty traits whose bake drops Band::Model yields a finding (via the shared worker_context builder, not body-substring)", test_file = "src/commands/prompt.rs", keywords = ["worker_context", "Band::Model"] },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-05"
name      = "Funnel check-cadence wiring (base-clean + reject-and-halt)"
objective = """
Wire the owned `doctrine check` cadence into the dispatch funnel (design D5,
adversarial C1). Base-clean precondition — a NON-MUTATING prove-clean gate
(`fmt --check` / dry-gate semantics) before arm-spawn (and on `main` before
branching): assert the base is clean, never fix-in-place (a mutating check on the
shared base has no owner and re-creates the spill). Pre-existing red is reported
as a BASE defect distinct from any worker finding; real cleanup is an
operator-owned commit, never folded into a worker delta. Reject-and-halt import
gate — run `doctrine check <cadence>` on the post-import tree; a red (unformatted
OR lint-fail) delta HALTS and reports to the orchestrator, never lands, never
auto-fixes (belt, not self-report; ADR-012 sole-writer).

Non-mutating mechanism (codex F2): `doctrine check {quick|commit|gate}` is a
config-cadence PROXY (src/commands/check.rs) — non-mutating-ness depends on the
configured argv, and no built-in prove-clean variant exists today. `check quick`
runs `cargo fmt` (MUTATING); `check gate` runs clippy (non-mutating but no fmt
check). So this phase must ESTABLISH the non-mutating base-clean mechanism, not
assume it: resolve a non-mutating cadence (fmt `--check` + lint, no in-place fmt)
via the owned `[verification]` config and have the base-clean beat invoke exactly
that. Naming the argv is in scope; a mutating base-clean is rejected (C1).

Homes (codex F3): the import belt is `src/worktree/import.rs` (`classify_import`,
`run_import_from_worktree`), NOT `src/dispatch.rs`. The base-clean + funnel beats
also touch `plugins/doctrine/skills/dispatch/**` and `dispatch-agent/**`. Resolve
the open code-detail: whether the subprocess arm needs its own base-clean beat or
the shared funnel covers it.
"""
entrance_criteria = [
  { id = "EN-1", text = "`doctrine check` cadence seam (SL-163) confirmed present as the owned formatter/lint proxy (src/commands/check.rs) — a config-cadence proxy with no built-in prove-clean variant." },
]
exit_criteria = [
  { id = "EX-1", text = "A NON-MUTATING base-clean cadence is established (fmt --check + lint, no in-place fmt) via the owned [verification] config; the base-clean beat invokes exactly that argv (no mutating check on the shared base)." },
  { id = "EX-2", text = "A dirty base is reported as a base defect distinct from any worker finding, never auto-fixed." },
  { id = "EX-3", text = "Import gate (src/worktree/import.rs) runs doctrine check on the post-import tree; an unformatted or lint-red delta halts-and-reports and does not land (test)." },
  { id = "EX-4", text = "Subprocess-arm base-clean coverage decided and recorded (its own beat vs shared funnel)." },
]
verification = [
  { id = "VT-1", expects = "Reject-and-halt import-gate test in the real import belt: a red (unformatted or lint-fail) imported delta halts and does not land", test_file = "src/worktree/import.rs", keywords = ["classify_import", "check"] },
  { id = "VA-1", expects = "Agent review: base-clean beat is non-mutating in both dispatch skills, invokes the established non-mutating cadence, and does not double-run on the hot path" },
]
specs        = []
requirements = []

