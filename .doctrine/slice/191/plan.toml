[[phase]]
id        = "PHASE-06"
name      = "Corpus knowledge refresh (READMEs + shipped memory)"
objective = """
Refresh the shipped corpus knowledge so it stops teaching the obsolete mental
model (design C4/C6, scope obj #7). Rewrite `install/hymns/README.md` and
`.doctrine/hymns/README.md` — both stale (they describe the model band as
"model-family / exact-model notes" and claim exposed slots win by the provenance
tiebreak, contradicting SPEC-023's trait-space contract and SL-193's
self-`replaces` override) — to the post-unlock authoring model. Author a SHIPPED
concept memory `memory/mem.concept.doctrine.hymn-cascade/` (embedded `memory/`
corpus, corpus.rs:44; installs to every doctrine project) capturing: trait-keyed
model band, the bands registry, seal/expose symmetry, `replaces` suppression, and
the precedence key. After adding the memory: `cargo build` (re-embed via
RustEmbed), `doctrine memory sync`, `doctrine memory validate`.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02/03 landed: the authoring model the READMEs + memory describe is now the actual shipped behaviour." },
]
exit_criteria = [
  { id = "EX-1", text = "Both hymn READMEs describe the trait-space model band and SL-193 self-replaces override; no residual model-family/provenance-tiebreak language." },
  { id = "EX-2", text = "mem.concept.doctrine.hymn-cascade authored under memory/, embeds via RustEmbed, and validates (`doctrine memory validate`)." },
]
verification = [
  { id = "VT-1", expects = "Embedded-corpus test confirms mem.concept.doctrine.hymn-cascade ships in the embedded memory corpus", test_file = "src/corpus.rs", keywords = ["hymn-cascade"] },
  { id = "VA-1", expects = "Agent review: READMEs + shipped memory teach the trait-space / self-replaces model with no obsolete rules" },
]
