# Implementation plan for SL-245 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-245"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-01"
name      = "Bounded subprocess extraction"
objective = """
Move coverage_verify's bounded synchronous spawn down into a new leaf,
src/subprocess.rs (design sec-5), and make coverage_verify::run_argv delegate to
it. The helper gains what the render spawn needs: optional stdin fed on a
detached, unjoined writer thread, and a bounded reap (kill, then try_wait for
REAP_GRACE, never a blocking wait). coverage_verify's RunResult mapping and
current_dir handling are unchanged; its suite is the behaviour-preservation proof.
"""
entrance_criteria = [
  { id = "EN-1", text = "SL-245 design locked (run dr-019fd12e…); plan approved" },
  { id = "EN-2", text = "`doctrine check gate` green on the starting tree" },
]
exit_criteria = [
  { id = "EX-1", text = "src/subprocess.rs exists as a leaf with `Bounded { Completed { status, stdout, stderr }, TimedOut }`, `run_bounded(command, stdin, timeout) -> io::Result<Bounded>`, and named constants for the 50 ms poll interval and the 1 s reap grace (STD-001). stdout and stderr are always piped; stdin is piped only when `stdin` is Some — with None the Command's own stdin setting stands, so coverage_verify keeps inheriting stdin as it does today" },
  { id = "EX-2", text = "coverage_verify::run_argv delegates to subprocess::run_bounded; its local drain/reap mechanism is gone (no parallel implementation); Err/TimedOut → Unobtainable and Completed → Ran, exactly as before" },
  { id = "EX-3", text = "The timeout path never calls a blocking wait: on expiry it kills, polls try_wait for at most REAP_GRACE, and returns TimedOut whether or not the child was reaped. A try_wait failure likewise kills and bounded-reaps before returning Err" },
  { id = "EX-4", text = "The stdin writer thread is not joined; a BrokenPipe from a child that exits early is not surfaced as an error" },
  { id = "EX-5", text = "`subprocess = \"leaf\"` registered in .doctrine/adr/001/layering.toml; the ADR-001 layering gate passes" },
  { id = "EX-6", text = "`doctrine check gate` green (fmt, clippy zero warnings, tests)" },
]
verification = [
  { id = "VT-1", expects = "a 1 MiB stdin to `sleep 30` under a 200 ms timeout returns TimedOut in under 5 s — the only test of the detached writer and the bounded reap (real spawn)", test_file = "src/subprocess.rs", keywords = ["fn run_bounded", "REAP_GRACE", "Bounded::TimedOut", "\"sleep\""], waived = false },
  { id = "VT-2", expects = "the existing coverage_verify unit suite passes unchanged across the extraction", test_file = "src/coverage_verify.rs", keywords = ["subprocess::run_bounded", "RunResult::Unobtainable"], waived = false },
  { id = "VT-3", expects = "the existing coverage verify e2e goldens pass unchanged", test_file = "tests/e2e_coverage_record_golden.rs", keywords = ["coverage_verify_prints_transition_and_audit_lines"], waived = false },
  { id = "VA-1", expects = "diff review: coverage_verify.rs test module is byte-unchanged, and no drain/reap/try_wait loop remains outside subprocess.rs" },
]
specs        = []
requirements = []

