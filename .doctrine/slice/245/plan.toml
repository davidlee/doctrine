[[phase]]
id        = "PHASE-03"
name      = "tty render endpoint and raw-mode query"
objective = """
Extend src/tty.rs with the single verified terminal endpoint (design sec-2,
DEC-259): RenderTarget, RenderTerminal, WindowGeometry, the thin
open_render_terminal shell (isatty stdout; open /dev/tty read-write and blocking;
fstat both; tcgetwinsize on the tty), the pure endpoint decision, and
RenderTerminal::query built on a pure, closure-injected bracket. query enters raw
mode with termios timed reads (VMIN=0, VTIME=1), writes the request, reads in a
loop until complete or the deadline, and restores explicitly with a checked
error that beats the body's result; an unwind-only drop guard is disarmed after
the explicit restore. rustix gains the `termios` feature only; no unsafe, no
thread, no readiness syscall.
"""
entrance_criteria = [
  { id = "EN-1", text = "Design locked; no code dependency on PHASE-01 or PHASE-02, so it may run in parallel with them" },
]
exit_criteria = [
  { id = "EX-1", text = "tty.rs exposes RenderTarget { NotTerminal, NotControllingTerminal, Terminal(RenderTerminal) }, RenderTerminal { tty, window }, WindowGeometry { columns, rows, pixel_width, pixel_height }, open_render_terminal, RenderTerminal::query, QueryError { Io, Restore }" },
  { id = "EX-2", text = "Pure `endpoint(stdout_is_tty, stdout_device, tty_device) -> Endpoint { NotTerminal, NotControlling, Same }` decides topology over st_rdev values; a failed /dev/tty open maps to NotControlling" },
  { id = "EX-3", text = "Pure `bracket(enter, body, exit)`: exit runs whenever enter succeeded; an exit error beats the body result (QueryError::Restore); a body error is QueryError::Io; an enter error runs neither body nor exit" },
  { id = "EX-4", text = "query sets VMIN=0 and VTIME=1 (named constants), opens the tty without O_NONBLOCK, and returns Ok(None) at the deadline; all termios, winsize and I/O go through the one tty fd" },
  { id = "EX-5", text = "Cargo.toml rustix features are exactly [\"fs\", \"termios\"]; no `event` feature; the workspace unsafe budget is unchanged" },
  { id = "EX-6", text = "stdout_terminal_width and the existing color helpers are unchanged; tty stays out=0 to the crate in layering.toml" },
  { id = "EX-7", text = "`doctrine check gate` green" },
]
verification = [
  { id = "VT-1", expects = "endpoint decision: stdout not a tty → NotTerminal; no controlling terminal → NotControlling; different device ids → NotControlling; equal ids → Same", test_file = "src/tty.rs", keywords = ["fn endpoint", "Endpoint::NotControlling", "Endpoint::Same"], waived = false },
  { id = "VT-2", expects = "bracket restores on every path: body ok → exit runs, result returned; body error → exit runs, Io; exit error after body ok or body error → Restore wins; enter error → neither body nor exit runs", test_file = "src/tty.rs", keywords = ["fn bracket", "QueryError::Restore", "QueryError::Io"], waived = false },
  { id = "VT-3", expects = "timed-read constants and termios wiring are present in the query path", test_file = "src/tty.rs", keywords = ["SpecialCodeIndex::VMIN", "SpecialCodeIndex::VTIME", "fn open_render_terminal"], waived = false },
  { id = "VA-1", expects = "code review of RenderTerminal::query: every return path reaches the checked restore; the drop guard is disarmed after it; no O_NONBLOCK; no poll/select; no unsafe" },
]
specs        = []
requirements = []

