name      = "graphviz leaf and dot single-sourcing"
objective = """
Add src/graphviz.rs (design sec-2, sec-5): DOT_PROGRAM, RENDER_TIMEOUT,
RasterOutcome, the thin rasterise_png shell over subprocess::run_bounded, and the
pure classify. Replace every `"dot"` program/tool literal in map_server (shell.rs,
routes.rs, and the error.rs test assertions) with graphviz::DOT_PROGRAM, name
routes.rs's 2 s probe budget DOT_VERSION_TIMEOUT, and add the reciprocal
cross-reference comments between RealDotRenderer and rasterise_png (DEC-143).
The `/health` JSON key "dot" stays a literal.
"""
