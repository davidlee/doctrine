[[phase]]
id        = "PHASE-05"
name      = "terminal_image and doctrine graph -X"
objective = """
Add src/terminal_image.rs (design sec-2, sec-3): RenderRefusal with Display
messages as named constants, the pure check functions over probe results,
prepare (format → controlling terminal → pixel size → support probe, cheapest
first, returning CellGeometry) and render_dot (rasterise → png_size → place →
encode into one buffer). Wire `doctrine graph`: `render: bool` with
`#[arg(short = 'X', long)]` on the Graph variant, passed through dispatch, and
run_graph's prepare-before-root-lookup, single write_all shell (DEC-253,
DEC-254). build_graph_output is untouched. This phase proves the seam end to end
and carries the human acceptance that judges DEC-256's provisional placement.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 and PHASE-03 complete" },
]
exit_criteria = [
  { id = "EX-1", text = "terminal_image.rs exposes RenderRefusal { FormatNotDot, NotTerminal, NotControllingTerminal, Unsupported, Unconfirmed, NoPixelSize }, prepare(format, is_dot) -> anyhow::Result<CellGeometry>, render_dot(dot, cell) -> anyhow::Result<Vec<u8>>; every message in design sec-3's table is a named constant naming the flag and its fix" },
  { id = "EX-2", text = "prepare runs the checks in design order and stops at the first refusal; QueryError::Io and ::Restore map to their own messages; the probe uses a 2 s named deadline" },
  { id = "EX-3", text = "render_dot maps each RasterOutcome to its sec-3 message (no timed-out arm) and refuses a non-PNG payload; the image bytes and trailing newlines are one buffer" },
  { id = "EX-4", text = "`doctrine graph … -X` exists; without -X every graph path is byte-identical (existing graph tests unchanged); run_graph calls prepare before crate::root::find" },
  { id = "EX-5", text = "`terminal_image = \"leaf\"` registered in layering.toml; graph → terminal_image is downward; layering gate passes" },
  { id = "EX-6", text = "`doctrine check gate` green" },
]
verification = [
  { id = "VT-1", expects = "check order and arms over synthetic probe results: non-DOT beats everything; not-a-terminal and not-controlling beat pixel size; zero pixel size → NoPixelSize; each SupportReply and each QueryError maps to its refusal or to the geometry", test_file = "src/terminal_image.rs", keywords = ["RenderRefusal::FormatNotDot", "RenderRefusal::NoPixelSize", "RenderRefusal::Unconfirmed", "fn prepare"], waived = false },
  { id = "VT-2", expects = "each refusal message contains the flag and its remedy (substring, not exact text)", test_file = "src/terminal_image.rs", keywords = ["Display for RenderRefusal", "drop -X"], waived = false },
  { id = "VT-3", expects = "e2e: `graph --format json -X` from a working directory outside any doctrine project exits non-zero, stdout empty, stderr carries the format message (proves prepare runs before the root lookup)", test_file = "tests/e2e_render_guard.rs", keywords = ["doctrine_bin", "--format", "json", "-X"], waived = false },
  { id = "VT-4", expects = "e2e: `graph -X` (default dot format) off a terminal, outside any doctrine project, exits non-zero with stdout empty and the not-a-terminal message (proves the live open_render_terminal stdout check)", test_file = "tests/e2e_render_guard.rs", keywords = ["doctrine_bin", "terminal"], waived = false },
  { id = "VA-1", expects = "diff review: build_graph_output unchanged; no escape byte can reach stdout on any refusal path; one write_all" },
  { id = "VH-1", expects = "ghostty, landed binary: `doctrine graph <small focus> --depth 1 -X` — image at native size, legible; prompt returns directly below; no stray reply text in the shell input (design sec-8 VH step 1)" },
  { id = "VH-2", expects = "ghostty: `doctrine graph -X`, whole corpus — scaled to one column short of the window, not clipped; tall output scrolls cleanly; judged on HiDPI too (VH step 2; decides DEC-256)" },
  { id = "VH-3", expects = "`doctrine graph <focus> -X | cat` refused with the not-a-terminal message; no escape bytes (VH step 4)" },
  { id = "VH-4", expects = "inside tmux, `doctrine graph <focus> -X` refused with the unsupported message (VH step 5)" },
]
specs        = []
requirements = []
