[[phase]]
id        = "PHASE-04"
name      = "kitty protocol leaf"
objective = """
Add src/kitty.rs, a pure leaf (design sec-2, sec-4): the SUPPORT_QUERY bytes
(a=q id 31 1×1 RGB query, then DA1), the order-aware classify_support_reply,
png_size from IHDR, cell_geometry from tty::WindowGeometry, the DEC-256 place
rule (u64 arithmetic, rounding up, columns−1 bound floored at 1, rows ≥ 1,
saturating), and encode_png (a=T,f=100,t=d,q=2,C=1,c,r; standard padded base64
chunked at 4096; continuations carry only m and q; rows newlines appended; one
allocation). Every protocol literal is a named constant (STD-001).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete: tty::WindowGeometry exists" },
]
exit_criteria = [
  { id = "EX-1", text = "kitty.rs exposes SUPPORT_QUERY, SupportReply { Incomplete, Supported, Unsupported }, classify_support_reply, PngSize, png_size, CellGeometry, cell_geometry, Placement, place, encode_png" },
  { id = "EX-2", text = "classify_support_reply walks complete frames in arrival order; the first graphics reply for i=31 or DA1 reply decides; other-id graphics replies and noise are skipped" },
  { id = "EX-3", text = "place reproduces every row of design sec-4's placement table" },
  { id = "EX-4", text = "kitty imports only tty::WindowGeometry from the crate; `kitty = \"leaf\"` registered in layering.toml; layering gate passes" },
  { id = "EX-5", text = "`doctrine check gate` green" },
]
verification = [
  { id = "VT-1", expects = "single-chunk payload encodes to one escape: exact bytes `a=T,f=100,t=d,q=2,C=1,c=…,r=…,m=0`, base64, terminator, then r newlines", test_file = "src/kitty.rs", keywords = ["fn encode_png", "a=T,f=100,t=d,q=2,C=1"], waived = false },
  { id = "VT-2", expects = "multi-chunk payload over vec![0; 5000]: non-final chunks exactly 4096 bytes with m=1; continuations carry only m and q; last has m=0; concatenated payloads decode to the input", test_file = "src/kitty.rs", keywords = ["vec![0; 5000]", "4096", "m=1,q=2"], waived = false },
  { id = "VT-3", expects = "png_size reads width and height from a hand-built 24-byte IHDR header; None for short input, bad signature, non-IHDR first chunk", test_file = "src/kitty.rs", keywords = ["fn png_size", "IHDR"], waived = false },
  { id = "VT-4", expects = "cell_geometry: any zero field or zero quotient → None; otherwise integer cell size", test_file = "src/kitty.rs", keywords = ["fn cell_geometry"], waived = false },
  { id = "VT-5", expects = "placement table: one case per design sec-4 row — small (30×10), exactly fits (199×20), wide (199×25), tall (40×150), one-column clamp (1×1)", test_file = "src/kitty.rs", keywords = ["fn place", "199", "150"], waived = false },
  { id = "VT-6", expects = "support reply classifier: graphics then DA1 → Supported; graphics with error status → Supported; DA1 then graphics → Unsupported; DA1 alone → Unsupported; other-id graphics then DA1 → Unsupported; noise skipped; empty, partial, and a frame split at every byte boundary → Incomplete until complete", test_file = "src/kitty.rs", keywords = ["fn classify_support_reply", "SupportReply::Incomplete", "SupportReply::Unsupported", "SupportReply::Supported"], waived = false },
]
