# Implementation plan for SL-245 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-245"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-02"
name      = "graphviz leaf and dot single-sourcing"
objective = """
Add src/graphviz.rs (design sec-2, sec-5, as cut by the slice scope): DOT_PROGRAM,
RasterOutcome, the thin rasterise_png shell and the pure classify. The CLI spawn
has no deadline and does not use a bounded-subprocess helper (IMP-452):
rasterise_png spawns `dot -Tpng` with piped stdio, writes the DOT on a writer
thread, and collects stdout/stderr with wait_with_output. Replace every `"dot"` program/tool literal in map_server (shell.rs,
routes.rs, and the error.rs test assertions) with graphviz::DOT_PROGRAM, name
routes.rs's 2 s probe budget DOT_VERSION_TIMEOUT, and add the reciprocal
cross-reference comments between RealDotRenderer and rasterise_png (DEC-143).
The `/health` JSON key "dot" stays a literal.
"""
entrance_criteria = [
  { id = "EN-1", text = "SL-245 design locked and plan approved; `doctrine check gate` green on the starting tree" },
]
exit_criteria = [
  { id = "EX-1", text = "src/graphviz.rs exists as a leaf with DOT_PROGRAM, RasterOutcome { Png, ToolUnavailable, CommandFailed { status, stderr }, Io }, rasterise_png(dot, program) and a private pure classify(io::Result<Output>)" },
  { id = "EX-2", text = "No `\"dot\"` program or tool literal remains in src/map_server/{shell,routes,error}.rs other than the /health wire key; DOT_TIMEOUT stays local to shell.rs" },
  { id = "EX-3", text = "routes.rs's dot -V budget is a named DOT_VERSION_TIMEOUT" },
  { id = "EX-4", text = "RealDotRenderer and rasterise_png each carry a comment naming the other as its async/sync counterpart" },
  { id = "EX-5", text = "`graphviz = \"leaf\"` registered in layering.toml; map_server → graphviz is a downward edge; layering gate passes" },
  { id = "EX-6", text = "`doctrine check gate` green" },
  { id = "EX-7", text = "rasterise_png cannot deadlock on a large DOT: stdin is written on its own thread while wait_with_output drains stdout and stderr; a write error from a child that exits early is not surfaced (the exit status and stderr report it); coverage_verify is untouched" },
]
verification = [
  { id = "VT-1", expects = "pure classify over synthetic results: NotFound → ToolUnavailable; other io::Error → Io; success → Png(stdout); exit 1 → CommandFailed { status: Some(1), stderr } — statuses via cfg(unix) ExitStatusExt::from_raw (0, 1 << 8)", test_file = "src/graphviz.rs", keywords = ["fn classify", "ExitStatusExt::from_raw", "RasterOutcome::ToolUnavailable", "RasterOutcome::CommandFailed", "RasterOutcome::Io"], waived = false },
  { id = "VT-2", expects = "rasterise_png with a nonexistent program path → ToolUnavailable (real spawn, deterministic)", test_file = "src/graphviz.rs", keywords = ["fn rasterise_png", "wait_with_output"], waived = false },
  { id = "VT-3", expects = "map_server error and shell tests pass with only the literal-to-constant substitution", test_file = "src/map_server/error.rs", keywords = ["graphviz::DOT_PROGRAM"], waived = false },
  { id = "VT-4", expects = "routes.rs uses the named probe budget and the shared program name", test_file = "src/map_server/routes.rs", keywords = ["DOT_VERSION_TIMEOUT", "graphviz::DOT_PROGRAM"], waived = false },
  { id = "VA-1", expects = "grep sweep: `\"dot\"` in src/map_server appears only as the /health JSON key" },
]
specs        = []
requirements = []

