[[phase]]
id        = "PHASE-03"
name      = "Terminal: tty endpoint, raw-mode query, kitty protocol"
objective = """
Extend src/tty.rs with the single verified terminal endpoint (design sec-2,
DEC-259): RenderTarget, RenderTerminal, WindowGeometry, the thin
open_render_terminal shell (isatty stdout; open /dev/tty read-write and blocking;
fstat both; tcgetwinsize on the tty), the pure endpoint decision, and
RenderTerminal::query built on a pure, closure-injected bracket. query enters raw
mode with termios timed reads (VMIN=0, VTIME=1), writes the request, reads in a
loop until complete or the deadline, and restores explicitly with a checked
error that beats the body's result; an unwind-only drop guard is disarmed after
the explicit restore. rustix gains the `termios` feature only; no unsafe, no
thread, no readiness syscall.

Also add src/kitty.rs, a pure leaf (design sec-2, sec-4): the SUPPORT_QUERY bytes
(a=q id 31 1×1 RGB query, then DA1), the order-aware classify_support_reply,
png_size from IHDR, cell_geometry from tty::WindowGeometry, the DEC-256 place
rule (u64 arithmetic, rounding up, columns−1 bound floored at 1, rows ≥ 1,
saturating), and encode_png (a=T,f=100,t=d,q=2,C=1,c,r; standard padded base64
chunked at 4096; continuations carry only m and q; rows newlines appended; one
allocation). Every protocol literal is a named constant (STD-001).
"""
entrance_criteria = [
  { id = "EN-1", text = "SL-245 design locked and plan approved; no code dependency on PHASE-02, so the two may run in parallel" },
]
exit_criteria = [
  { id = "EX-1", text = "tty.rs exposes RenderTarget { NotTerminal, NotControllingTerminal, Terminal(RenderTerminal) }, RenderTerminal { tty, window }, WindowGeometry { columns, rows, pixel_width, pixel_height }, open_render_terminal, RenderTerminal::query, QueryError { Io, Restore }" },
  { id = "EX-2", text = "Pure `endpoint(stdout_is_tty, stdout_device, tty_device) -> Endpoint { NotTerminal, NotControlling, Same }` decides topology over st_rdev values; a failed /dev/tty open maps to NotControlling" },
  { id = "EX-3", text = "Pure `bracket(enter, body, exit)`: exit runs whenever enter succeeded; an exit error beats the body result (QueryError::Restore); a body error is QueryError::Io; an enter error runs neither body nor exit" },
  { id = "EX-4", text = "query sets VMIN=0 and VTIME=1 (named constants), opens the tty without O_NONBLOCK, and returns Ok(None) at the deadline; all termios, winsize and I/O go through the one tty fd" },
  { id = "EX-5", text = "Cargo.toml rustix features are exactly [\"fs\", \"termios\"]; no `event` feature; the workspace unsafe budget is unchanged" },
  { id = "EX-6", text = "stdout_terminal_width and the existing color helpers are unchanged; tty stays out=0 to the crate in layering.toml" },
  { id = "EX-7", text = "`doctrine check gate` green" },
  { id = "EX-8", text = "kitty.rs exposes SUPPORT_QUERY, SupportReply { Incomplete, Supported, Unsupported }, classify_support_reply, PngSize, png_size, CellGeometry, cell_geometry, Placement, place, encode_png" },
  { id = "EX-9", text = "classify_support_reply walks complete frames in arrival order; the first graphics reply for i=31 or DA1 reply decides; other-id graphics replies and noise are skipped" },
  { id = "EX-10", text = "place reproduces every row of design sec-4's placement table" },
  { id = "EX-11", text = "kitty imports only tty::WindowGeometry from the crate; `kitty = \"leaf\"` registered in layering.toml; layering gate passes" },
]
verification = [
  { id = "VT-1", expects = "endpoint decision: stdout not a tty → NotTerminal; no controlling terminal → NotControlling; different device ids → NotControlling; equal ids → Same", test_file = "src/tty.rs", keywords = ["fn endpoint", "Endpoint::NotControlling", "Endpoint::Same"], waived = false },
  { id = "VT-2", expects = "bracket restores on every path: body ok → exit runs, result returned; body error → exit runs, Io; exit error after body ok or body error → Restore wins; enter error → neither body nor exit runs", test_file = "src/tty.rs", keywords = ["fn bracket", "QueryError::Restore", "QueryError::Io"], waived = false },
  { id = "VT-3", expects = "timed-read constants and termios wiring are present in the query path", test_file = "src/tty.rs", keywords = ["SpecialCodeIndex::VMIN", "SpecialCodeIndex::VTIME", "fn open_render_terminal"], waived = false },
  { id = "VT-4", expects = "single-chunk payload encodes to one escape: exact bytes `a=T,f=100,t=d,q=2,C=1,c=…,r=…,m=0`, base64, terminator, then r newlines", test_file = "src/kitty.rs", keywords = ["fn encode_png", "a=T,f=100,t=d,q=2,C=1"], waived = false },
  { id = "VT-5", expects = "multi-chunk payload over vec![0; 5000]: non-final chunks exactly 4096 bytes with m=1; continuations carry only m and q; last has m=0; concatenated payloads decode to the input", test_file = "src/kitty.rs", keywords = ["vec![0; 5000]", "4096", "m=1,q=2"], waived = false },
  { id = "VT-6", expects = "png_size reads width and height from a hand-built 24-byte IHDR header; None for short input, bad signature, non-IHDR first chunk", test_file = "src/kitty.rs", keywords = ["fn png_size", "IHDR"], waived = false },
  { id = "VT-7", expects = "cell_geometry: any zero field or zero quotient → None; otherwise integer cell size", test_file = "src/kitty.rs", keywords = ["fn cell_geometry"], waived = false },
  { id = "VT-8", expects = "placement table: one case per design sec-4 row — small (30×10), exactly fits (199×20), wide (199×25), tall (40×150), one-column clamp (1×1)", test_file = "src/kitty.rs", keywords = ["fn place", "199", "150"], waived = false },
  { id = "VT-9", expects = "support reply classifier: graphics then DA1 → Supported; graphics with error status → Supported; DA1 then graphics → Unsupported; DA1 alone → Unsupported; other-id graphics then DA1 → Unsupported; noise skipped; empty, partial, and a frame split at every byte boundary → Incomplete until complete", test_file = "src/kitty.rs", keywords = ["fn classify_support_reply", "SupportReply::Incomplete", "SupportReply::Unsupported", "SupportReply::Supported"], waived = false },
  { id = "VA-1", expects = "code review of RenderTerminal::query: every return path reaches the checked restore; the drop guard is disarmed after it; no O_NONBLOCK; no poll/select; no unsafe" },
]
specs        = []
requirements = []

