# ── PHASE-07 ──────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-07"
name      = "Merge the spawn skills and re-cut the reference docs"
objective = """
One arm means one spawn skill. Merge `/dispatch-agent` and \
`/dispatch-subprocess` into a single skill, promote today's 'Fallback (A)' to \
