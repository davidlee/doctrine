objective = """
Delete the disk marker. DEC-207: identity collapses to the env leg, \
topology-independently. `DOCTRINE_WORKER` has no stale class by construction — \
it dies with the process and is set by the same bwrap argv that establishes the \
write floor (design §4). This phase also closes ISS-028, where a stamped tree \
refused CLI writes and broke tests that shell the doctrine CLI."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02/EX-3 holds — the spawn profile sets `DOCTRINE_WORKER=1`, so the env leg has a writer before the marker leg is removed." },
]
exit_criteria = [
  { id = "EX-1", text = "`src/worktree/marker.rs` collapses to the env predicate plus the status render: `env_worker_set`, `describe_mode`, `resolve_mode`, `run_status`. Deleted: `marker_path`, `marker_present`, `write_marker`, `remove_marker`, `run_marker_clear`, `enum Cause`, `is_stale_marker`, `is_env_on_nonlinked`, `cause_token`, `DUAL_CAUSE`." },
