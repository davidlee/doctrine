# ── PHASE-06 ──────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-06"
name      = "Retire worker_commit, arm-spawn, the Fork arm and the config key"
objective = """
Delete the last four claude-arm-only surfaces. DEC-204: `worker_commit` retires \
as transport and nothing re-homes — the orchestrator's incumbent import already \
covers the surviving path, and `classify_import` survives as the scope belt's \
