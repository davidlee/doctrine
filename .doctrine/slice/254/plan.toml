  { id = "EX-5", text = "`justfile:37` drops the `[ -f .doctrine/state/dispatch/worker ]` leg from `validate`'s worker-context skip. `DOCTRINE_WORKER=1` and `DOCTRINE_DISPATCH_GATE` survive — a clean deletion, not a behaviour change. NOT in the design's file list; found by grepping the literal path string." },
