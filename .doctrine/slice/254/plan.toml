# Implementation plan for SL-254 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-254"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# NOTE ON VT MANDATES. A mandate asserts PRESENCE (raw substrings that must
# appear in one file). This slice is mostly deletion, and absence is not
# directly expressible — so each deletion phase anchors its mandate on the
# SURVIVING or RENAMED artefact that only exists once the deletion landed
# (a renamed test fn, a re-cut assertion). That is a presence check which
# proves the deletion, and it is deliberate rather than a workaround.
#
# Design-level VT ids (design §9.2, VT-1..VT-12) are cited inside `expects`.
# Phase criterion ids are phase-local and restart at 1 in every phase.

# ── PHASE-01 ──────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-01"
name      = "Re-home the four jail primitives"
objective = """
Move the four non-decision primitives out of `pretooluse.rs` into `jail.rs`, \
and re-point `jail_prefix.rs` at their new home. Behaviour-preserving by \
construction: no call site changes meaning, no test changes at all. This is \
DEC-206's ordering, stated in design §4 as a design fact rather than an \
implementer's preference, and §9.1 names it the cheapest point at which the \
behaviour-preservation gate does useful work."""
entrance_criteria = [
  { id = "EN-1", text = "Design locked (run dr-019ff653 at stage `locked`); slice status `ready`." },
  { id = "EN-2", text = "Tree green: `doctrine check gate` passes on the branch point." },
]
exit_criteria = [
  { id = "EX-1", text = "`REASON_NO_BWRAP`, `REASON_PROFILE_WRITE_FAILED`, `have_bwrap` and `write_seatbelt_profile` are defined in `src/worktree/jail.rs`." },
  { id = "EX-2", text = "`src/worktree/jail_prefix.rs` imports all four from `super::jail`; it no longer names `super::pretooluse` at all." },
  { id = "EX-3", text = "`src/worktree/pretooluse.rs` retains only the wall — `run_pretooluse` and its decision plumbing — and no longer defines any of the four." },
  { id = "EX-4", text = "ZERO edits to any file under `tests/` — the e2e suites are the behaviour-preservation proof and must not move (design §9.1). Unit tests MOVE WITH their subject, content unchanged: `pretooluse.rs` currently holds `write_seatbelt_profile_writes_exact_body_to_profile_path` (`:1083`) and `write_seatbelt_profile_io_error_returns_err` (`:1100`), which relocate to `jail.rs` verbatim. A relocated test whose ASSERTIONS changed means the move was not behaviour-preserving and the phase has failed." },
]
verification = [
  { id = "VT-1", expects = "design VT-1 — the four primitives are defined in jail.rs and the re-home is complete", test_file = "src/worktree/jail.rs", keywords = ["REASON_NO_BWRAP", "REASON_PROFILE_WRITE_FAILED", "fn have_bwrap", "fn write_seatbelt_profile"], waived = false },
  { id = "VT-2", expects = "design VT-1 — jail_prefix sources all four from jail, closing the last pretooluse dependency of the SURVIVING path", test_file = "src/worktree/jail_prefix.rs", keywords = ["use super::jail::", "have_bwrap", "write_seatbelt_profile"], waived = false },
  { id = "VA-1", expects = "the existing suite passes and `git diff --stat tests/` is EMPTY. The two relocated `write_seatbelt_profile` unit tests are diffed line-by-line against their pre-move text and are identical but for the module they sit in. This is the behaviour-preservation gate (design §9.1) and it cannot be checked by a test that is itself allowed to change." },
]
specs        = []
requirements = []

# ── PHASE-02 ──────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-02"
name      = "Generalise the spawn script to two harness profiles"
objective = """
Build the replacement before deleting what it replaces. Rename \
`scripts/pi-spawn-confined.sh` to `scripts/spawn-confined.sh`, generalise it \
past `pi` with a second `claude` profile (DEC-209, DEC-215), add the Linux \
`have_bwrap` probe so the arm fails closed NAMED rather than merely closed \
(D7, RV-355 F-6), and put `DOCTRINE_WORKER=1` on both confinement paths — the \
bwrap prefix and `sandbox_exec_argv`'s trailing `env` token (RV-355 F-2). \
Purely additive to the binary: nothing is deleted in this phase, so the tree \
stays green throughout and the pi arm is untouched."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01/EX-1 holds — `have_bwrap` is reachable from `jail.rs`, so the Linux probe has a caller that is free to use." },
]
exit_criteria = [
  { id = "EX-1", text = "`scripts/spawn-confined.sh` exists, takes `<harness> <B> <BRANCH> <DIR> <PROMPT_FILE> [BACKSTOP]` (design §5.2), and dispatches on the harness token to a `pi` or `claude` profile." },
  { id = "EX-2", text = "The `pi` profile is byte-for-byte equivalent in behaviour to today's script: same PREFIX tokens, same `$HOME/.pi` bind, same reap path. Divergence must be argued, per design §4 'substitution, not construction'." },
  { id = "EX-3", text = "The `claude` profile binds `$HOME/.claude` wholesale (DEC-210) and execs `claude -p --output-format stream-json` (DEC-215); it does NOT source `scripts/lib/pi-reap.sh` — its completion signal is process exit (§5.2.1, R4)." },
  { id = "EX-4", text = "`scripts/lib/pi-reap.sh` is UNCHANGED: its `agent_settled`/`agent_end` either-match is correct and must survive the generalisation (ISS-293, RV-355 F-7)." },
  { id = "EX-5", text = "A Linux capability probe runs BEFORE the inline PREFIX array; with `bwrap` absent the script exits non-zero naming `bwrap-unavailable` (the `REASON_NO_BWRAP` value) and spawns no fork." },
  { id = "EX-6", text = "`sandbox_exec_argv` emits `DOCTRINE_WORKER=1` in its trailing `env` token — the one place macOS parity was NOT true by construction (RV-355 F-2)." },
]
verification = [
  { id = "VT-1", expects = "design VT-10 — the macOS prefix carries worker identity. Pure over `ResolvedMac`, so this is Linux-testable and does not wait on a mac (OQ-5)", test_file = "src/worktree/jail.rs", keywords = ["sandbox_exec_argv", "DOCTRINE_WORKER"], patterns = ["^\\s*fn sandbox_exec_argv_.*worker"], waived = false },
  { id = "VT-2", expects = "design VT-11 — the Linux arm refuses BY NAME, not merely by exec failure: the probe and the reason token are both in the shipped script", test_file = "scripts/spawn-confined.sh", keywords = ["bwrap-unavailable", "claude", "pi"], waived = false },
  { id = "VT-3", expects = "design VT-2 + VT-3 — a worker under the prefix cannot write outside its directory, refused by the KERNEL not a hook; and on a host without bwrap the proof SKIPS rather than passing vacuously (DEC-212 — a vacuous pass is the fail-open shape being deleted)", test_file = "tests/e2e_worker_confinement.rs", keywords = ["bwrap", "skip", "DOCTRINE_WORKER"], waived = false },
  { id = "VH-1", expects = "the pi arm is untouched in behaviour. Reviewed by eye against the pre-rename script, because 'the codex/pi suites stay green unchanged' (design §9.1) is the strongest evidence the collapse disturbed nothing, and a green suite alone does not prove the PREFIX tokens are identical." },
]
specs        = []
requirements = []

# ── PHASE-03 ──────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-03"
name      = "Retire nomination and the spawn gate"
objective = """
Delete `nominate`/`denominate` and the `PreToolUse(Agent|Workflow)` spawn gate \
they scope. DEC-205: these die with the wall as a closed loop, not as a \
separate choice — the nomination allowlist exists only to exempt an in-session \
orchestrator from a wall that is going away. Cut first because it is the \
cleanest separable half of the wall: it takes `PRIVILEGED_AGENT_TYPES`, \
`is_privileged_agent_type`, `decide_agent`, `decide_workflow` and \
`resolve_target`'s `is_nominated` leg with it, and it is what forces doctor \
check #10 out (which does not compile without it)."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 landed — the surviving arm's spawn path exists and is proven, so removing the in-session arm's gate removes nothing still in use." },
]
exit_criteria = [
  { id = "EX-1", text = "`worktree nominate` and `worktree denominate` are gone: the subcommand arms in `src/worktree/mod.rs`, the nomination half of `src/worktree/subagent.rs` (`append_nomination`, `remove_nomination`, `is_nominated`, `classify_nominate`, `act_nominate`, `act_denominate`, `run_nominate`, `run_denominate`, `NominateRefusal`)." },
  { id = "EX-2", text = "`src/boot.rs` drops `HookSpec::nominate` and `::denominate` from the registry; ALL THREE eleven-entry comment sites move (`:1624`, `:1687`, `:4982`) — the survey said one." },
  { id = "EX-3", text = "`.claude/settings.json` loses the `SubagentStart` and `SubagentStop` entries. Both EVENTS disappear entirely (each had exactly one entry), so the installed set goes from eleven entries across five events to nine across three. The file is TRACKED and is reconciled by `doctrine install` against `boot.rs`'s `HookSpec` registry (design §5.6) — edit the registry and re-run `install`, never hand-edit the JSON, or the two sides drift." },
  { id = "EX-4", text = "`src/commands/guard.rs` drops the `Nominate` and `Denominate` write-class arms — their `Command` variants are gone, so the match does not compile with them. `src/main.rs`'s `mod write_class_tests` (`:326`) drops `worktree_nominate_is_hookmint` (`:650`) and its denominate sibling; the module's table-driven exhaustiveness comment (`:335`) is what makes this a compile-adjacent edit rather than an optional one." },
  { id = "EX-4b", text = "`tests/e2e_claude_install.rs` moves IN THIS PHASE as well as in PHASE-04: the `total == 11` assertion (`:312`) becomes 9, the events list (`:307`) drops `SubagentStart`/`SubagentStop`, the test fn name (`:285`) is re-cut, and the nominate assertions (`:184-199`) are deleted. Leaving this to PHASE-04 would end PHASE-03 on a RED tree — the whole point of the phase cut." },
  { id = "EX-5", text = "`src/worktree/jail.rs` drops `PRIVILEGED_AGENT_TYPES` (`:121`), `is_privileged_agent_type` (`:126`), `decide_agent` (`:399`), `decide_workflow` (`:418`) and their unit tests; `resolve_target` loses its `is_nominated` parameter and the nomination leg." },
  { id = "EX-6", text = "Doctor check #10 `SpawnSeamSymmetry` is DELETED from `src/doctor_checks.rs` (`:728-830`) — it reads `PRIVILEGED_AGENT_TYPES`, the `SubagentStart` matchers and `SEAM_REGISTRY`, so the deletion does not compile without it. `src/finding.rs` drops `Category::SpawnSeamSymmetry` (`:82`) and renumbers the ordinal (`:123`); `CATEGORY_ORDER` and the severity test move with it. `src/commands/doctor.rs` drops the #10 registration." },
  { id = "EX-7", text = "`just gate` is green at ZERO clippy warnings — no orphaned `pub(crate)` left behind by the cascade." },
]
verification = [
  { id = "VT-1", expects = "the spawn gate and its allowlist are gone from the jail leaf, and resolve_target no longer takes a nomination argument", test_file = "src/worktree/jail.rs", keywords = ["fn resolve_target", "cwd_is_project_worktree"], waived = false },
  { id = "VT-2", expects = "the finding taxonomy lost the check-#10 category cleanly, ordinals renumbered", test_file = "src/finding.rs", keywords = ["CATEGORY_ORDER"], waived = false },
  { id = "VA-1", expects = "`doctrine doctor` runs and reports a coherent check set with #10 absent and no gap in the numbering presented to the user." },
]
specs        = []
requirements = []

# ── PHASE-04 ──────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-04"
name      = "Delete the PreToolUse wall"
objective = """
