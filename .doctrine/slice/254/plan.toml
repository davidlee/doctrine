  { id = "EX-7", text = "`just gate` green at zero clippy warnings." },
]
verification = [
  { id = "VT-1", expects = "design VT-7 — the installed hook set is five entries across three events; anchored on the RENAMED test fn, which can only exist once the deletion landed", test_file = "tests/e2e_claude_install.rs", keywords = ["five_hook_entries", "WorktreeCreate", "SessionStart"], waived = false },
  { id = "VT-2", expects = "jail.rs retains its confinement mechanism and nothing of the wall — the surviving closure is intact", test_file = "src/worktree/jail.rs", keywords = ["fn bwrap_argv", "fn sandbox_exec_argv", "fn select_jailer", "fn validate_policy", "fn resolve_with_policy"], waived = false },
  { id = "VA-1", expects = "no `pub(crate)` item in `src/worktree/jail.rs` lacks a caller outside its own `#[cfg(test)]` block. Verified by the clippy dead_code lint being clean at zero warnings, which is the mechanical form of this claim." },
