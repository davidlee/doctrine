caller of. This is the phase the symbol census resized: `jail.rs` loses ~300 of \
its 981 production lines and about half its ~60 unit tests, because \
`pub(crate)` with no caller is `dead_code` and `just gate` runs clippy at zero \
warnings. `jail.rs` survives — but only its confinement mechanism, which is \
what `jail_prefix.rs` consumes."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 landed — the nomination half is already out, so what remains in `pretooluse.rs` is the wall proper." },
]
exit_criteria = [
  { id = "EX-1", text = "`src/worktree/pretooluse.rs` is deleted; the `Pretooluse` subcommand arm and re-export leave `src/worktree/mod.rs`." },
  { id = "EX-2", text = "`src/worktree/jail.rs` deletes every item orphaned by that: `enum Decision` (`:231`), `enum Target` (`:248`), `resolve_target` (`:377`), `pathcheck` (`:433`), `opaque_wrap` (`:472`), `shell_single_quote` (`:491`), `acquire_policy` (`:761`), `resolve_inputs` (`:825`), `seatbelt_backend` (`:839`), `decide_bash` (`:928`), `decide_write` (`:964`), and the five `REASON_*` constants feeding only them (`:94`, `:95`, `:96`, `:103`, `:109`), with their unit tests." },
  { id = "EX-3", text = "What SURVIVES in `jail.rs` is exactly the transitive closure of `jail_prefix.rs`'s imports plus `mod.rs`'s `JailPolicy` re-export: `resolve_with_policy`, `validate_policy`, `Backend`, `JailPolicy`, `RealEnv`, `ResolveEnv`, `select_jailer`, `Bwrap`, `Seatbelt`, `Jailer::wrap_argv`, `bwrap_argv`, `bwrap_core_argv`, `sandbox_exec_argv`, `seatbelt_profile`, `Topology`, `ResolveDeny`, `ResolvedMac`, `PolicyError`. Nothing else." },
  { id = "EX-4", text = "`src/commands/guard.rs` drops the `Marker { stamp_subagent: true }` arm and the `WriteClass::MarkerClear` class with its pass-through leg (`:499`)." },
  { id = "EX-5", text = "`src/boot.rs` drops `HookSpec::pretooluse`; re-running `doctrine install` reconciles `.claude/settings.json`, removing the four `worktree pretooluse` entries across the `Bash`, `Edit|Write`, `Agent` and `Workflow` matchers. The two surviving `PreToolUse` entries are `memory surface` and are UNRELATED to this slice — do not touch them. Final installed set: FIVE entries across THREE events." },
  { id = "EX-6", text = "`tests/e2e_claude_install.rs` takes its SECOND cut: the count goes 9 → 5 and the test fn name settles at five-entries-across-three-events. PHASE-03/EX-4b already moved it 11 → 9 and dropped the nominate assertions; the design's 'the exact hook-count assertion moves by six' was one edit standing in for two phases' worth — under-count #7." },
