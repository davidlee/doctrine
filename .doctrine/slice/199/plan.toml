Author .claude/agents/dispatch-orchestrator.md (doctrine-role: orchestrator; tools: \
Read/Edit/Write/Bash/Grep/Glob/Agent + the PHASE-03 funnel MCP tools, nothing else \
writable) and extend SL-198's tool-surface conformance lint with the orchestrator \
allowlist ROW — data, not new parsing (SL-198 already parses the marker + tools: \
list). The lint asserts the def's mcp__* tokens ⊆ the orchestrator allowlist (the §B \
funnel set); any other mcp__* (second server, bare mcp__doctrine grant, worker_commit) \
fails. Per STD-001 the allowlist references the SAME named constants §B defines for \
the tool names — no second literal. The orchestrator's reads go raw (in-jail doctrine \
CLI); only git-boundary writes go MCP, so the tight allowlist is sufficient (design §C)."""
