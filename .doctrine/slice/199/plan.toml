# Implementation plan for SL-199 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-199"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# SLICE-LEVEL PRECONDITION (all phases): SL-198 landed on the execution base.
# Verified 2026-07-04 as NOT present on edge — no worker_commit, no --branch
# coherence belt on run_import_fork, no agent-def tool-surface lint, no per-worktree
# dispatch record / coord resolver. SL-199 `needs` SL-198; execution is gated on it.
# The plan is authored against the post-SL-198 world (scope: "consumed, not rebuilt").

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-01"
name      = "create-fork confined discriminator + one-shot arm (§A)"
objective = """
Decouple Fork discrimination from the spawner's transient cwd so a CONFINED \
orchestrator can arm a nested worker. classify_create (pure, create.rs:166) gains \
an additive second Fork trigger — cwd_is_coord_root ∧ coord_in_dispatch ∧ base — \
leaving the main-thread positional path (cwd_is_arming_dir) unchanged; both arms \
run the same act_on_create::Fork -> fork_core + provision_jail_policy (no second \
impl). The shell gather (run_create_fork, create.rs:338) computes the two new \
inputs from payload.cwd/root and the coord branch. The arm is ONE-SHOT: the hook \
CONSUMES (deletes) the base file the moment it Forks, so an orchestrator crash \
mid-spawn cannot leave a stale arm that mis-forks the next benign spawn (ext-review \
F4). base is read from the SAME location for both arms — <root>/ARMING_SUBPATH/base \
— only the trigger differs (design §A)."""
entrance_criteria = [
  { id = "EN-1", text = "SL-199 design locked + externally reviewed (codex 2026-07-04, F1/F2/F3/F4/F6 integrated). classify_create (create.rs:166), run_create_fork positional gather (create.rs:362-372), provision_jail_policy (create.rs:244), ARMING_SUBPATH (create.rs:197) confirmed present on the current tree." },
  { id = "EN-2", text = "OS1 RESOLVED at plan (design R1 closed): the coordination worktree is ALWAYS on the dispatch/<NNN> branch — coordinate() creates it with `git worktree add -b dispatch/<NNN> <dir> <trunk>` (Create) or `git worktree add <dir> <branch>` (Resume), never --detach (coordinate.rs:212-227). The coord_in_dispatch branch check is sound; no state-file marker needed. Re-confirm only if setup's worktree-add changes." },
]
exit_criteria = [
  { id = "EX-1", text = "classify_create Forks on the confined trigger (cwd_is_coord_root ∧ coord_in_dispatch ∧ base present/plausible) AND on the unchanged positional trigger (cwd_is_arming_dir); Passthrough otherwise. Both Fork arms provision the jail record via the single existing act_on_create::Fork path — no forked classification or provisioning logic." },
  { id = "EX-2", text = "The confined trigger's inputs are gathered in the thin shell (run_create_fork): cwd_is_coord_root = (root == payload.cwd); coord_in_dispatch = coord branch matches ^dispatch/[0-9]+$ (or the OS1 marker); base read from <root>/ARMING_SUBPATH/base whenever either Fork condition is live. The pure classifier takes no clock/git/disk." },
  { id = "EX-3", text = "One-shot arm: on any Fork, the hook deletes <root>/ARMING_SUBPATH/base atomically at the fork point (before returning), so a second WorktreeCreate with no re-arm classifies Passthrough. Consumption is atomic w.r.t. the fork decision (no window where the fork happens but base survives)." },
  { id = "EX-4", text = "Benign-spawn safety: a plain isolation:worktree spawn from an armed coord root with NO base (already consumed / never armed) takes Passthrough; a spawn from a non-dispatch-branch coord root with base takes Passthrough. The branch guard is hygiene (design §A): a loose guard at worst spuriously Forks (debris, not escape); a jailed worker cannot arm (spawn dir + shared .git are RO to it)." },
]
verification = [
  { id = "VT-1", expects = "Pure classify_create table: positional cases unchanged -> Fork (regression); confined coord_root ∧ dispatch-branch ∧ base -> Fork; benign coord_root ∧ dispatch-branch ∧ ¬base -> Passthrough; coord_root ∧ ¬dispatch-branch ∧ base -> Passthrough; coord_root ∧ base ∧ bad-sha -> BadBase.", test_file = "src/worktree/create.rs", keywords = ["classify_create", "cwd_is_coord_root", "coord_in_dispatch", "Passthrough"] },
  { id = "VT-2", expects = "One-shot consume: after a Fork the hook has deleted base; a re-invocation with no re-arm classifies Passthrough (no double-fork off a stale base).", test_file = "src/worktree/create.rs", keywords = ["consume", "Passthrough", "base"] },
  { id = "VT-3", expects = "Both Fork arms reach the SAME act_on_create::Fork -> provision_jail_policy: the jail record is written for the confined trigger exactly as for the positional trigger.", test_file = "src/worktree/create.rs", keywords = ["provision_jail_policy", "Fork"] },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-02"
name      = "Server-side commit-on-behalf + coord-by-slice resolver (§B transactional core)"
objective = """
The trusted git-write primitive the confined funnel rests on. (1) coord-by-slice \
resolver: given a slice-id, ENUMERATE worktrees (git worktree list --porcelain via \
list_worktrees, git.rs:1390 — NOT the single-hit worktree_for_ref/live_worktree_for_ref \
probes, which cannot surface >1) and filter to the ONE live worktree on dispatch/<NNN> \
-> typed refusal on 0 / >1 / stale. Sibling of SL-198's worker-by-agent resolver, \
sharing the enumerate step (design D-B2). (2) commit-on-behalf: the UNCONFINED MCP \
server composes a commit WORKING-TREE-FREE onto the coord branch and advances the ref \
— via the repo's existing tree-level primitives: merge_tree --write-tree (git.rs:846, \
`working-tree-free, object-db only`) and commit_tree (git.rs:828), or a scratch \
GIT_INDEX_FILE (filter_tree plumbing, git.rs:677-732/789-802) applied `--cached` \
(index-only) — NEVER `git apply --index` (which writes the WORKING TREE), and never the \
live coord index. This is load-bearing: the confined orchestrator cannot reach coord .git \
(RO-walled) and so cannot `git reset` residue — a fault must therefore leave the live \
coord index+worktree BYTE-UNCHANGED (ext-review blocker: no poisoned-index window). \
Provenance is DEFINED by reusing the codebase's GIT_AUTHOR_*/GIT_COMMITTER_* = \
`<id> <id@doctrine>` convention (git.rs:2157-2160, asserted git.rs:3789), as \
worker_commit does (slice-198.md:101). This primitive is the seam dispatch_import and \
dispatch_conclude_phase (PHASE-03) both ride — built and tested once here, index-\
isolation + no-residue OWNED here (not left as ambient hygiene between phases), before \
the tool surface (ext-review F1/F6)."""
entrance_criteria = [
  { id = "EN-1", text = "SL-198 landed: the per-worktree dispatch record {name,dir,branch,base,coord}, resolve_agent + refusal table exist and are green. The ENUMERATE seam is list_worktrees (git.rs:1390 — returns Vec<WorktreeRecord>, the true multi-hit enumerator); worktree_for_ref/live_worktree_for_ref (git.rs:1372/1406) are single-hit first-match probes and are NOT the resolver seam (they cannot detect the >1 arm EX-1 promises)." },
  { id = "EN-2", text = "Working-tree-free commit plumbing confirmed reusable on the post-SL-198 base: commit_tree (git.rs:828, `no working-tree touch`), the scratch-GIT_INDEX_FILE staging kit (filter_tree, git.rs:677-732/789-802), and the GIT_AUTHOR_*/GIT_COMMITTER_* provenance env (git.rs:2157-2160). commit_on_behalf COMPOSES these — it does not fork worker_commit's compose path and does not stage into the live coord index." },
]
exit_criteria = [
  { id = "EX-1", text = "resolve_coord(slice) ENUMERATES via list_worktrees and filters to the live worktree on dispatch/<NNN>, returning its root on exactly one live consistent hit; typed refusals: unknown-slice (0 live), ambiguous (>1 — a DEFENSIVE assert git's one-branch-one-worktree invariant normally precludes, but reachable only because we enumerate; a single-hit probe could not raise it), stale (dir absent / branch unresolved). No caller-supplied path enters resolution (mirrors SL-198 X1)." },
  { id = "EX-2", text = "commit_on_behalf(coord_root, tree_or_delta, message) composes ONE commit WORKING-TREE-FREE onto the coord branch (commit_tree over a scratch GIT_INDEX_FILE) and advances the coord ref by exactly that commit, returning the new tip oid. It NEVER `git apply --index`es into the live coord index. Atomicity by construction: on any fault before the ref update the live coord index+worktree are BYTE-UNCHANGED — no dirty residue for the confined orchestrator to reset (it cannot). Fails typed on an empty delta or a lost ref race (coord tip moved under it)." },
  { id = "EX-3", text = "Provenance contract DECIDED and asserted (ext-review R4/F6), reusing the codebase convention (git.rs:2157-2160 GIT_AUTHOR_*/GIT_COMMITTER_*, asserted git.rs:3789 `<id> <id@doctrine>`): IMPORT (code) preserves the worker commit's AUTHOR (blame points at who wrote the code) with the dispatch identity as COMMITTER; CONCLUDE (metadata) sets author==committer to the dispatch identity. Message convention: a stable funnel marker naming the acting slice/phase (grep-stable committer-of-record). NOTE the patch-id landed-oracle (git cherry) is diff-based ⇒ provenance-IMMUNE — the reap belt survives any author/message choice." },
  { id = "EX-4", text = "The primitive is behaviour-preserving w.r.t. existing git helpers: it composes commit_tree/filter_tree, does not fork them or worker_commit's compose path; the main-thread funnel + existing suites stay green unchanged." },
]
verification = [
  { id = "VT-1", expects = "resolve_coord enumerates (list_worktrees) and filters: refusal table (unknown-slice, ambiguous, stale) + a happy single-hit resolve to the dispatch/<NNN> worktree root; no path parameter. The ambiguous arm is exercised on a synthetic >1 listing to prove enumeration (a single-hit probe would silently pick the first).", test_file = "src/mcp_server/dispatch.rs", keywords = ["resolve_coord", "unknown-slice", "stale", "list_worktrees"] },
  { id = "VT-2", expects = "commit_on_behalf empty-delta refusal; happy path lands exactly one commit on the coord branch, returns the new tip; the coord tip advances by exactly that commit.", test_file = "src/mcp_server/dispatch.rs", keywords = ["commit_on_behalf", "tip"] },
  { id = "VT-3", expects = "Provenance: the commit-on-behalf author + committer + message match the decided contract (import preserves worker author + dispatch committer; conclude author==committer==dispatch id; funnel marker names slice/phase); asserted on the produced commit object.", test_file = "src/mcp_server/dispatch.rs", keywords = ["author", "committer", "message"] },
  { id = "VT-4", expects = "No-residue / working-tree-free atomicity: a fault injected between tree-compose and ref-update leaves the coord ref AND the live coord index+worktree byte-unchanged (git status --porcelain empty, tip unmoved) — proving commit_on_behalf never dirties the live index the confined orchestrator cannot reset. Also: a pre-existing staged/dirty coord tree is NOT swept into the commit (compose is from the named tree, not the live index).", test_file = "src/mcp_server/dispatch.rs", keywords = ["commit_on_behalf", "GIT_INDEX_FILE", "porcelain"] },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-03"
name      = "The dispatch funnel MCP tools — import / conclude-phase / reap (§B surface)"
objective = """
Register the confined orchestrator's write surface in the MCP server, each tool \
resolving the coord tree server-side by slice-id (PHASE-02) and riding an existing \
run_* belt — one seam, two doors, no forked logic. dispatch_import: run_import fork \
arm THEN commit_on_behalf (code commit); the classify_import scope belt is a HARD \
PRE-COMMIT gate (import.rs:136 UndeclaredScope) — a violation lands NOTHING and \
report-and-halts (not advisory; ext-review F2/F5). dispatch_conclude_phase: \
run_phase(completed) + run_record_boundary folded into ONE atomic commit_on_behalf \
(metadata) — the phase never reaches completed in committed history without its true \
(B, coord_tip) boundary in the same commit (ext-review F1/F3). dispatch_reap: run_gc, \
patch-id landed-oracle belt intact. Pin nothing here beyond registration — the \
tool-surface lint is PHASE-04."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete: resolve_coord + commit_on_behalf + provenance contract exist and are green." },
  { id = "EN-2", text = "SL-198's import-a-commit switch landed: run_import_fork accepts the committed worker branch (--branch coherence belt) so dispatch_import imports the branch the confined arm spawned, not a working-tree diff. classify_import (import.rs:106) + run_gc landed-oracle (git cherry) + run_record_boundary (dispatch.rs:718) + run_phase (slice.rs:881) confirmed reusable as-is." },
  { id = "EN-3", text = "MCP tools/call entrypoint (tools.rs:408 call_tool) + tool registration (tools.rs:25 tools) confirmed; root is server-resolved, never caller-supplied." },
]
exit_criteria = [
  { id = "EX-1", text = "dispatch_import{slice,name}: resolve coord -> classify_import scope belt -> commit_on_behalf composing the COMMITTED worker branch onto the coord tip TREE-LEVEL and working-tree-free (merge_tree --write-tree, git.rs:846 `working-tree-free, object-db only`, over base=coord tip / theirs=worker tip; or when B==coord tip, commit_tree of the worker tip's tree directly) -> update coord ref; returns {coord_tip}. It touches NEITHER the live coord working tree NOR the live index. NB the working-tree-free bar: `git apply --index` writes the WORKING TREE (only `--cached` is index-only) — so if any apply path is used at all it MUST be `--cached` against a scratch GIT_INDEX_FILE, never `--index`; the tree-level merge_tree primitive is preferred precisely because it sidesteps that trap. Undeclared-scope is HARD-refused BEFORE the compose (classify_import runs before apply, import.rs:336) — nothing is composed, typed report-and-halt. Any fault after a clean classify leaves the live coord index+worktree byte-unchanged (PHASE-02 no-residue), so there is nothing the confined orchestrator would need to `git reset`. No post-commit bless path." },
  { id = "EX-2", text = "dispatch_conclude_phase{slice,phase,code_start,code_end,note?} = the runtime flip (disposable) + the committed boundary (the completion signal), kept in their correct tiers. (a) run_phase(completed) writes the GITIGNORED phase sheet (.doctrine/state/, non-atomic fs::write by design, state.rs:388) — disposable runtime, re-established idempotently on retry; it is NEVER in committed history, so it cannot be the completed-without-boundary hazard. (b) The COMMITTED boundary row (.doctrine/dispatch/<NNN>/boundaries.toml, committed ON the coord branch, tree-read by prepare-review) lands via ONE working-tree-free commit_on_behalf: conclude reuses run_record_boundary's PURE row-compute (BoundaryRow), NOT its live-file write, handing the new boundaries.toml blob to commit_on_behalf to compose into a scratch tree. Atomicity by construction: the boundary commit is all-or-nothing (P02); the only fault outcome is a completed sheet with no committed boundary — self-healing, since the sheet is disposable and a retry re-composes the boundary. Boundary UPSERT-by-phase is harmless — the solo-bind clobber is suppressed in coord context (state.rs arm-guard ~535)." },
  { id = "EX-3", text = "dispatch_reap{slice,name}: resolve coord -> run_gc; the patch-id landed-oracle (git cherry) refuses to delete a fork whose patch is not yet in coord history. Inherited unchanged." },
  { id = "EX-4", text = "Confined-arm undeclared response is report-and-halt, by construction: unlike the main-thread orchestrator (which amends selectors + commits — SL-198 EX-6), the confined orchestrator cannot amend+commit from inside the jail, so dispatch_import's hard scope refusal surfaces to the main thread. Documented as the funnel's undeclared boundary." },
  { id = "EX-5", text = "Belt reuse, not fork: dispatch_import and the CLI import agree on the scope verdict for the same change-set (classify_import shared); dispatch_reap and the CLI gc agree on the landed verdict (run_gc shared); existing suites stay green (behaviour-preservation gate)." },
]
verification = [
  { id = "VT-1", expects = "dispatch_import happy path: in-scope worker branch -> coord tip advances by one commit, returns {coord_tip}. Undeclared path in the delta -> HARD refuse before commit, coord tip UNCHANGED, typed report-and-halt refusal.", test_file = "src/mcp_server/dispatch.rs", keywords = ["dispatch_import", "UndeclaredScope", "coord_tip"] },
  { id = "VT-2", expects = "dispatch_conclude_phase atomicity: happy path lands the committed boundary row in ONE working-tree-free commit with the true (B,coord_tip) range (coord tip advances by one; boundaries.toml row present in the committed tree). Fault seam: a failure injected between the scratch write-tree/commit_tree and the ref update leaves the committed boundary ABSENT and the live coord index+worktree byte-unchanged (git status --porcelain empty). The disposable runtime phase sheet is out of committed history by design; a retry re-composes the boundary (self-healing). completed-WITH-committed-boundary is the only durable success state.", test_file = "src/mcp_server/dispatch.rs", keywords = ["dispatch_conclude_phase", "boundary", "porcelain"] },
  { id = "VT-3", expects = "dispatch_reap: a not-yet-landed fork is refused by the patch-id oracle; a landed fork is reaped (worktree+branch gone); shares run_gc with the CLI verb.", test_file = "src/mcp_server/dispatch.rs", keywords = ["dispatch_reap", "run_gc", "cherry"] },
  { id = "VA-1", expects = "Belt reuse is genuine (not token presence): an agent reads the wiring and confirms dispatch_import calls classify_import and dispatch_reap calls run_gc — no forked scope/landed logic." },
]
specs        = []
requirements = []

