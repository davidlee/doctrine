# Implementation plan for SL-194 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-194"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (.doctrine/glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

[[phase]]
id        = "PHASE-01"
name      = "Runnable core probe"
objective = """
Extract the config-injectable rebuild seam (build_from_with_cfg) and the ordering
primitives (order.rs), both strictly behaviour-preserving, then land the pure
findings catalogue for today's-data detectors and the `findings` verb — runnable
end-to-end against the live corpus so the core probe can be judged before any
β-family investment (design D1, PHASE-01).
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md is locked (status plan) with the external adversarial pass integrated (F-ext-1..5)." },
  { id = "EN-2", text = "Substrate premises confirmed against the live tree: build_from (graph.rs), the private frontier_order/surviving_seq_predecessors (surface.rs), channels base/blocking/blocked_by/evicted_seq_edges/dep_cycles/class_of, ReasonKind::{EvictedEdge,CycleDegraded} (view.rs), estimate.skew (config.rs), run_* dispatch peers (mod.rs), explain_human fragment (render.rs), Survey/Explain verb pattern (cli.rs)." },
]
exit_criteria = [
  { id = "EX-1", text = "build_from_with_cfg(scanned, root, &cfg) exists and threads the injected cfg to BOTH base_score and consequence_post_pass; build_from delegates via config::load(root); the existing graph + surface suites pass UNMODIFIED (behaviour-preservation gate)." },
  { id = "EX-2", text = "frontier_order + surviving_seq_predecessors moved to a new pure src/priority/order.rs; surface::next reuses them; next output is byte-identical (the existing surface next/VT-7 assertions pass unmodified)." },
  { id = "EX-3", text = "src/priority/findings.rs defines the Finding enum + magnitude()/kind_label() impl + a single named-const threshold block (STD-001: PLATEAU_EPS, INVERSION_MIN_GAP, DISPLACEMENT_MIN_DELTA, FORK_MIN_ARMS, JOIN_MIN_PREREQS, GATING_MIN_BLOCKS). Engine-pure (ADR-001): no disk/clock/rng." },
  { id = "EX-4", text = "Today's-data detectors implemented pure and covered positive+negative each: Fork (blocking out, non-terminal arms, excludes gating-class hubs), Join (blocked_by in), GatingFanOut (blocking out, gating-class hub; Fork/Gating precedence — no double report), ValueInversion (compares base(blocked) − base(blocker), NOT score — F-ext-2), Displacement (survey-order vs pure-score-order), Plateau (near-ties over next order), Provenance (evictions globally deduped over (from,to,reason) + dep_cycles — F-ext-3)." },
  { id = "EX-5", text = "surface::findings(root) is the impure shell that owns all disk (one scan + build_from_with_cfg); findings::detect(&base, &cfg, betas) is pure and graph-only, deriving every order via order.rs." },
  { id = "EX-6", text = "doctrine findings [--json] wired: run_findings peer in mod.rs + cli match arm + members list; findings_human groups by kind_label (magnitude ranks WITHIN a kind group — F-ext-5); findings_json emits {kind, ...payload, magnitude}; Provenance reuses the extracted explain_human EvictedEdge/CycleDegraded fragment (no re-format)." },
  { id = "EX-7", text = "doctrine findings runs green against the live corpus, producing the core catalogue output." },
]
verification = [
  { id = "VT-1", expects = "Rebuild-seam equivalence: build_from == build_from_with_cfg(scanned, root, &config::load(root)); the existing graph suite passes unmodified.", test_file = "src/priority/graph.rs", keywords = ["build_from_with_cfg"] },
  { id = "VT-2", expects = "order.rs carries frontier_order + surviving_seq_predecessors as pure fns; a fixture proves the frontier order it produces (and surface::next stays byte-identical via the unmodified surface suite).", test_file = "src/priority/order.rs", keywords = ["frontier_order", "surviving_seq_predecessors"] },
  { id = "VT-3", expects = "Structural detectors each fire on a positive fixture and stay silent on a negative one, with correct direction and terminal/precedence handling.", test_file = "src/priority/findings.rs", keywords = ["Fork", "Join", "GatingFanOut", "Displacement", "Plateau"] },
  { id = "VT-4", expects = "ValueInversion fires on base(blocked) − base(blocker) and is NOT suppressed by leverage inflation: a small-base blocker gating a large-base dependent is flagged even though score(blocker) > score(blocked).", test_file = "src/priority/findings.rs", keywords = ["ValueInversion", "base"] },
  { id = "VT-5", expects = "A single evicted seq edge yields exactly ONE Provenance finding (global dedupe over the node-local evicted_seq_edges accessor).", test_file = "src/priority/findings.rs", keywords = ["Provenance", "evicted"] },
  { id = "VT-6", expects = "findings_human golden (grouped by kind) + findings_json shape ({kind, payload, magnitude}); Provenance line reuses the explain_human fragment.", test_file = "src/priority/render.rs", keywords = ["findings_human", "findings_json"] },
  { id = "VH-1", expects = "Core probe verdict: run doctrine findings on the live corpus — does the core catalogue read more useful than the flat next/survey list? Record the verdict and the decision to proceed (or not) to the β-family (PHASE-02)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "β-family (contested orderings)"
objective = """
Add the β endpoint sweep (skew {0,1} over the one scan) and the two
contested-ordering detectors — OrderInstability and ArmResequencing — over the
pre-built BetaEndpoints, with render support. This is the differentiated value a
flat list conspicuously cannot show (design D1/D4, PHASE-02).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete: the core probe is runnable + green, build_from_with_cfg + the graph-only detect seam are in place, and the PHASE-01 core verdict (VH-1) elected to proceed." },
]
exit_criteria = [
  { id = "EX-1", text = "beta_endpoints(scanned, root, &cfg) builds lo/hi via build_from_with_cfg over the SAME scanned at skew BETA_LO=0.0 / BETA_HI=1.0 (named consts); returns None when no non-terminal estimate exists (no wasted builds; β-family silent)." },
  { id = "EX-2", text = "BetaEndpoints{lo, hi} (raw graphs) is passed to detect; the β detectors derive their frontier orders via order.rs (pure, graph-only, no disk) — the purity boundary holds." },
  { id = "EX-3", text = "OrderInstability (adjacent, endpoint-contested — R5 scope) + ArmResequencing detectors implemented, covered positive+negative; direction/terminal handling consistent with the core detectors." },
  { id = "EX-4", text = "render extended for the two new variants (human + json); on an estimate-free corpus the β-family emits nothing (starved-until-estimates behaviour, R1)." },
]
verification = [
  { id = "VT-1", expects = "beta_endpoints returns Some over a corpus with a non-terminal interval estimate and None over an estimate-free corpus (no wasted builds).", test_file = "src/priority/surface.rs", keywords = ["beta_endpoints"] },
  { id = "VT-2", expects = "OrderInstability fires on an adjacent base pair whose order inverts between the β=0 and β=1 frontier orders, and is silent when the order is endpoint-stable; ArmResequencing fires on a fork whose arm order differs lo↔hi.", test_file = "src/priority/findings.rs", keywords = ["OrderInstability", "ArmResequencing"] },
  { id = "VT-3", expects = "render golden extension: the two β-family variants render one line each (human) and emit their payload + magnitude (json).", test_file = "src/priority/render.rs", keywords = ["OrderInstability", "ArmResequencing"] },
  { id = "VH-1", expects = "Full probe verdict: with contested-ordering findings live, does findings-over-flat-list read more useful? Record the verdict and whether the rendering follow-on (arc-strip, fold-into-survey) is warranted (design Verification alignment / Follow-ups)." },
]
specs        = []
requirements = []
