# Implementation plan for SL-224 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-224"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Two ordered, file-disjoint phases (design §5.1). PHASE-01 (obj 1) touches
# conformance.rs + worktree/import.rs + mcp_server/dispatch.rs; PHASE-02 (obj 2)
# touches plan.rs + commands/check.rs. Disjoint touch-sets — dispatchable serial
# (default) or parallel. Ordered obj1-then-obj2 only for narrative coherence; no
# code dependency between them (both read the shared, pre-existing
# conformance::undeclared_paths predicate, which neither edits).

[[phase]]
id        = "PHASE-01"
name      = "Honest undeclared-scope refusal detail"
objective = """
Give the MCP dispatch_import undeclared-scope refusal a non-empty, runnable \
Refused.detail naming the offending paths, via a new pure leaf formatter \
conformance::undeclared_detail(slice, undeclared) shared with the CLI import \
arm. The formatter emits each undeclared path + a RUNNABLE `doctrine slice \
selector add <ID> <path> --intent design-target` remediation (F1: the id is a \
required leading positional; the current CLI hint at import.rs:161 omits it and \
would misparse). It does NOT embed the `undeclared-scope` token (F2: the MCP \
`reason` field carries it; a leaf->engine reference to Refusal::token() would \
cycle). Refactor import.rs::report_undeclared_scope through the formatter \
(output deliberately CHANGES — id added, token header dropped; no golden pins it; \
F7); wire import_compose's UndeclaredScope refusal arm to recompute \
undeclared_paths and pass undeclared_detail(slice, ..) into funnel_refused. \
Refusal stays a fieldless Copy enum — no payload added. The slice id must be \
THREADED through the CLI import chain (run_import -> run_import_fork / \
run_import_from_worktree -> classify_or_report -> report_undeclared_scope) — none \
carry it today; the scope belt is reached only when --slice was supplied, so the \
resolved u32 is always present on this arm (F4, ~4-signature change).
"""
entrance_criteria = [
  { id = "EN-1", text = "conformance::undeclared_paths exists and is pub(crate) (conformance.rs:131); import_compose refuses UndeclaredScope with String::new() detail (dispatch.rs:301,335)." },
  { id = "EN-2", text = "The CLI arm's report_undeclared_scope (import.rs:146) already computes the undeclared set — the refactor target; classify_or_report/run_import* do NOT carry the slice id yet (F4)." },
]
exit_criteria = [
  { id = "EX-1", text = "conformance::undeclared_detail(slice: u32, undeclared: &[String]) -> String exists (pure; no fs/git/clock); token-free header (F2); each line a runnable `selector add <ID> <path> --intent design-target` (F1)." },
  { id = "EX-2", text = "import.rs::report_undeclared_scope renders via undeclared_detail; slice: u32 is threaded through the CLI import chain to the call site (F4); the emitted remediation includes the id and is runnable." },
  { id = "EX-3", text = "import_compose's UndeclaredScope arm passes undeclared_detail(slice, ..) into funnel_refused; every other refusal keeps String::new()." },
  { id = "EX-4", text = "The existing dispatch.rs:873 test (…refuses_before_compose_and_leaves_the_tip) is UPDATED to assert non-empty detail naming the path — the expected wiring-assertion flip, not a regression (F3)." },
  { id = "EX-5", text = "classify_import / Refusal (pure verdict) suite green UNCHANGED (behaviour-preservation); Refusal remains fieldless + Copy." },
]
verification = [
  { id = "VT-1", expects = "pure golden: undeclared_detail over a 2-path set renders the count line + one runnable `selector add <ID> <path> --intent design-target` line per path (id present).", test_file = "src/conformance.rs", keywords = ["fn undeclared_detail", "selector add", "design-target"], patterns = ["fn undeclared_detail\\("], waived = false },
  { id = "VT-2", expects = "wiring (integration, existing VT-1 git-fixture harness): an UndeclaredScope dispatch_import refusal yields FunnelOutcome::Refused whose detail NAMES the offending path (non-empty).", test_file = "src/mcp_server/dispatch.rs", keywords = ["undeclared_detail", "UndeclaredScope"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Plan-time selector-completeness lint"
objective = """
Catch selector under-declaration at plan time. Add a sibling pure fn \
plan::undeclared_test_files(plan, selectors) -> Vec<VtSelectorFinding> that \
flags every non-waived VT whose test_file is covered by no design-target \
selector — reusing conformance::undeclared_paths so a flagged plan's DECLARED \
test_file is one the import belt would refuse (F6: same predicate, authored vs \
git inputs). EMPTY selectors => EMPTY result (A3: guard before undeclared_paths, \
which flags all paths on empty input; mirrors the belt's VA-3 no-op). Waived VTs \
and VTs with no test_file are skipped. Wire run_check_plan (check.rs): read \
design-target selectors via slice::selectors(root, id, DesignTarget) and compute \
coverage ABOVE the clean short-circuit (F1 must-fix: today's early-return at \
check.rs:173 fires when check_vt_shape is empty — obj-2's primary case — and \
would silently no-op; the short-circuit now fires only when BOTH shape and \
coverage sets are empty). Render coverage findings alongside shape findings; the \
remediation footer routes through conformance::undeclared_detail(id, paths) — the \
SAME id-bearing formatter, not a re-inlined hint (F2/F5). Exit non-zero iff \
bare_count > 0 OR the coverage set is non-empty (D1: hard). check_vt_shape and \
its plan-only tests are untouched (D3 cohesion + behaviour-preservation).
"""
entrance_criteria = [
  { id = "EN-1", text = "check_vt_shape / VtShapeFinding / VtShapeProblem exist (plan.rs:213,239); run_check_plan renders them + exits non-zero on bare VTs (check.rs:166)." },
  { id = "EN-2", text = "slice::selectors(root, id, Some(SelectorIntent::DesignTarget)) reads design-target selectors (used at dispatch.rs:246)." },
]
exit_criteria = [
  { id = "EX-1", text = "plan::VtSelectorFinding { phase_id, vt_id, path } and plan::undeclared_test_files(plan, selectors) exist (pure)." },
  { id = "EX-2", text = "undeclared_test_files returns empty for empty selectors (A3), skips waived + no-test_file VTs, and honours glob selectors (via undeclared_paths)." },
  { id = "EX-3", text = "run_check_plan computes coverage ABOVE the clean short-circuit — which now fires only when BOTH shape and coverage are empty (F1); renders UndeclaredTestFile lines + a footer via undeclared_detail(id, paths) (F2); exits non-zero when the coverage set is non-empty." },
  { id = "EX-4", text = "check_vt_shape and its vt_shape_tests are byte-for-byte unchanged (behaviour-preservation)." },
  { id = "EX-5", text = "The check-plan wiring test fixture scaffolds a COMPLETE slice-NNN.toml (selectors present), since run_check_plan now reads the slice doc via slice::selectors (PLAUSIBLE — bare plan.toml would error at setup, not logic)." },
]
verification = [
  { id = "VT-1", expects = "pure unit: a VT test_file not in the passed selectors => one VtSelectorFinding; covered => none; empty selectors => none (A3); a glob-covered test_file => none.", test_file = "src/plan.rs", keywords = ["fn undeclared_test_files", "VtSelectorFinding", "undeclared_paths"], patterns = ["fn undeclared_test_files\\("], waived = false },
  { id = "VT-2", expects = "check plan wiring: run_check_plan reads design-target selectors and folds the coverage set into the non-zero-exit decision; render names the undeclared test_file path.", test_file = "src/commands/check.rs", keywords = ["undeclared_test_files", "SelectorIntent"], waived = false },
]
specs        = []
requirements = []
