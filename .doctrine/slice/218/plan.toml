# Implementation plan for SL-218 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-218"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "D7 agent-evidence demotion knob"
objective = "Ship `[priority.compare] demote_agent_evidence` (default false). Knob-on: every determinacy consumer (elicit queue states/candidates, hypothetical_outcome, the pair grades PHASE-02 adds) reads `determined()` over a fresh human-rows-only compile (its own C2-C4 quarantine); full system keeps bounds/projection/queue pool. Disclosure line on elicit/explain surfaces when on. confirm_boost untouched (design INV-3)."
entrance_criteria = [
  { id = "EN-1", text = "Design locked: RV-271 done, all findings verified; slice status = plan→ready" },
  { id = "EN-2", text = "Baseline: full test suite green on the phase branch-point (byte-identity reference for EX-2)" },
]
exit_criteria = [
  { id = "EX-1", text = "Knob parses from doctrine.toml [priority.compare]; absent/false = shipped behaviour; key name single-sourced as named const (STD-001)" },
  { id = "EX-2", text = "Knob-off: ALL existing suites green unchanged (design INV-1 at PHASE-01 scope — comparison, elicit, inference, priority)" },
  { id = "EX-3", text = "Knob-on: no pair whose determining constraints require an agent row reads determined (design INV-2); elicit determinacy source moves with the knob; disclosure line renders" },
]
verification = [
  { id = "VT-1", expects = "CompareConfig parse + default: knob absent => false; [priority.compare] demote_agent_evidence = true parses; key name is a named const",
    test_file = "src/priority/config.rs", keywords = ["CompareConfig", "demote_agent_evidence"], waived = false },
  { id = "VT-2", expects = "knob-on: agent-only-evidence pair indeterminate, same pair knob-off determined; anchored pair determined both states (design VT-B)",
    test_file = "tests/e2e_compare_inference.rs", keywords = ["demote_agent_evidence", "agent"], waived = false },
  { id = "VT-3", expects = "human-subset compile self-consistency: human row quarantined in full system (cycle with agent rows) is retained in human-only system; subset runs its own C2-C4 (design VT-C)",
    test_file = "src/comparison/compile.rs", keywords = ["human", "RaterKind::Human"], waived = false },
  { id = "VT-4", expects = "knob-on elicit: previously agent-determined pair re-enters queue as candidate; state line reflects it; disclosure line 'agent evidence demoted' present (design VT-F)",
    test_file = "tests/e2e_compare_elicit.rs", keywords = ["demote_agent_evidence", "agent evidence demoted"], waived = false },
  { id = "VA-1", expects = "Full suite run knob-off at phase close: zero diffs vs EN-2 baseline (byte-identity, design VT-A/INV-1)" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Tension detection + evidence grading"
objective = "New pure module src/priority/tension.rs: detect value_dim-order vs delivery-order inversions (surfaced member on page, preferred counterparty over full frontier order; m=0 pairs excluded; equal-full-score tiebreak excluded; Structure via full-graph surviving-edge reachability, else Composition with component deltas). Grade each tension via shipped PairSide/determined() machinery assembled in-priority (elicit pattern): Determined / AgentProposed / Projected, counts from the verdict system. No render changes this phase."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 landed: human-system determinacy seam and knob available" },
]
exit_criteria = [
  { id = "EX-1", text = "Detection is a pure fn over passed-in data (no clock/rng/disk); deterministic output order; O(K·N) window per design D4" },
  { id = "EX-2", text = "Grades computed only for detected pairs; grade/queue verdicts share predicate + system selection (one truth per question)" },
  { id = "EX-3", text = "Priority render surfaces untouched: existing priority goldens green unchanged this phase" },
]
verification = [
  { id = "VT-1", expects = "detection fixtures: no-tension, structure (direct + transitive + path through off-page node), composition, mixed, value_dim tie excluded, equal-full-score tiebreak excluded, off-page preferred counterparty detected, m=0 pair excluded, determinism (design VT-D)",
    test_file = "src/priority/tension.rs", keywords = ["TensionCause", "Composition"], waived = false },
  { id = "VT-2", expects = "grade vocabulary states: knob-on agent-only-determined pair => AgentProposed; human-determined => Determined with human-system counts only; neither => Projected; knob-off AgentProposed unreachable (design VT-J state-level)",
    test_file = "src/priority/tension.rs", keywords = ["AgentProposed", "EvidenceGrade"], waived = false },
  { id = "VT-3", expects = "multiplier correctness: kind/tag multipliers invert value_dim order relative to raw v/c; grade tracks the value_dim claim via eff_weight = m·c_other (design VT-G)",
    test_file = "src/priority/surface.rs", keywords = ["eff_weight", "EvidenceGrade"], waived = false },
  { id = "VA-1", expects = "layering check: tension.rs pure (no comparison compile calls inside the pure fn); grading assembly follows elicit pattern in surface.rs; no new cross-layer API added to comparison/query.rs (design F-5 fence)" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Tension narrative render"
objective = "Render tensions: new ReasonKind arm(s), all wording via reason_line()/shared fragments. explain: tensions section (both classes) for any frontier-participating id, disclosure line for non-actionable ids. next: structure callouts by default capped at TENSION_MAX_CALLOUTS (named const), verbosity flag adds composition; JSON carries full structured tensions list (additive field). Wording per design samples: value_dim named explicitly (SL-217 D5), no stability/membership language (D15), grade + counts always present."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 landed: Tension rows with grades available on next/explain assembly paths" },
]
exit_criteria = [
  { id = "EX-1", text = "next/explain human + JSON surfaces render tensions per design §3; priority golden diffs reviewed as intentional (design INV-1 rescope)" },
  { id = "EX-2", text = "Wording goldens pin the four design samples (structure determined / structure projected / agent-proposed / composition) and the m=0 scoped disclosure" },
]
verification = [
  { id = "VT-1", expects = "wording goldens: four design §3 samples + cap behaviour + verbosity flag pulls composition into next (design VT-E)",
    test_file = "tests/e2e_priority_golden.rs", keywords = ["tension", "value_dim"], waived = false },
  { id = "VT-2", expects = "explain: non-actionable id gets 'not on the current frontier' disclosure, no invented tensions; off-page-but-on-frontier id renders its displaced-counterparty tension (design VT-H)",
    test_file = "tests/e2e_priority_golden.rs", keywords = ["not on the current frontier"], waived = false },
  { id = "VT-3", expects = "cross-surface agreement, both knob states: pairs graded Determined absent from elicit indeterminate set; AgentProposed/Projected admissible pairs offerable; grades and queue never disagree (design VT-I)",
    test_file = "tests/e2e_priority_golden.rs", keywords = ["cross_surface_agreement"], waived = false },
  { id = "VT-4", expects = "knob-state wording: knob-on agent-proposed callout with 'unconfirmed'; knob-off same corpus Determined with mixed counts disclosed (design VT-J wording-level)",
    test_file = "tests/e2e_priority_golden.rs", keywords = ["agent-proposed", "unconfirmed"], waived = false },
  { id = "VT-5", expects = "JSON: tensions array additive (schema fields preferred/surfaced/cause/edge/deltas/grade/counts); lean-JSON participant reads tolerate the new field",
    test_file = "tests/e2e_priority_golden.rs", keywords = ["tensions"], waived = false },
  { id = "VT-6", expects = "human callout cap: TENSION_MAX_CALLOUTS named const bounds next callouts; JSON list uncapped",
    test_file = "src/priority/render.rs", keywords = ["TENSION_MAX_CALLOUTS"], waived = false },
  { id = "VA-1", expects = "render wording reviewed against product-critique tensions #3 (agent authority disclosed, never silently authoritative) and #6 (no cardinal-spacing overclaim; grades qualify every order claim) (design VA)" },
]
specs        = []
requirements = []
