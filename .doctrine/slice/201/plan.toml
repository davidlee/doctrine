# Implementation plan for SL-201 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-201"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Single phase: the change is ~3 file-adjacent surfaces (map.rs, cli.rs,
# guard.rs) forming one cohesive unit — memory-ref focus support and the onboard
# verb that consumes it. See plan.md for why it is not split.
[[phase]]
id        = "PHASE-01"
name      = "Memory-ref focus + onboard verb"
objective = """
Accept memory refs on `--focus` and add the `doctrine onboard` verb.
`validate_focus` shape-checks a `mem.<key>`/`mem_<uid>` via `MemoryRef::parse`;
`run_serve` resolves a memory-ref focus to its `mem_<uid>` via
`resolve_inspect_uid` before building `Config` (unknown ref → Err before the
server binds). Add `ONBOARDING_MEMORY_KEY` and a `run_onboard()` that delegates
to `run_serve` with that focus and `open=true`; wire the `Onboard` command
variant + dispatch (`cli.rs`) and worktree-guard classification (`guard.rs`).
Design.md D1/D2 + § Reuse seam are canon.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md locked; reuse seam confirmed live — resolve_inspect_uid resolves mem.signpost.doctrine.overview to a uid (shipped fallback)." },
]
exit_criteria = [
  { id = "EX-1", text = "`doctrine map serve --focus mem.<key>` and `--focus mem_<uid>` resolve to `#/focus/mem_<uid>`; an unknown mem ref errors before the server binds." },
  { id = "EX-2", text = "`doctrine onboard` (no flags) serves the map focused on ONBOARDING_MEMORY_KEY with the browser opened." },
  { id = "EX-3", text = "Existing map.rs validate_focus suite (SL-001 / numeric / bogus / empty) stays green unchanged — behaviour-preserving." },
  { id = "EX-4", text = "`doctrine check gate` clean (clippy zero warnings, fmt)." },
]
verification = [
  { id = "VT-1", expects = "validate_focus accepts a memory key and a full memory uid.", test_file = "src/commands/map.rs", keywords = ["valid_focus_memory_key", "valid_focus_memory_uid"] },
  { id = "VT-2", expects = "A malformed memory ref is rejected with a memory-ref message (not the canonical-id message).", test_file = "src/commands/map.rs", keywords = ["invalid_focus_memory_ref"] },
  { id = "VT-3", expects = "run_onboard builds MapServeArgs carrying focus=ONBOARDING_MEMORY_KEY and open=true (wiring assertion, no disk).", test_file = "src/commands/map.rs", keywords = ["ONBOARDING_MEMORY_KEY", "run_onboard"] },
  { id = "VH-1", expects = "Manual: `doctrine onboard` opens the browser focused on the overview memory, node shows its title (not the uid); `--focus mem.nope.key` prints a clear error and the server never starts." },
]
specs             = []
requirements      = []
