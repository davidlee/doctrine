# Implementation plan for SL-205 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-205"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Layered per ADR-001 (leaf ← engine ← command): the engine seam (retrieve_rows)
# lands first, then the pure command helpers, then the impure shell + wiring, then
# the live battery. Each phase is red/green/refactor with its own VTs; the shell
# phase carries the RV-254 fail-open penances (F-1/F-2/F-3).

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-01"
name      = "Engine seam: retrieve_rows + SurfaceRow"
objective = "Add the neutral in-process query seam the adapter consumes: a lean SurfaceRow projection and a retrieve_rows helper that composes the existing load_query/query/check_retrievable path (holdback applied, no body read, no framing). Expose severity_rank pub(crate) for the command-surface gate (RV-254 F-1 precursor / internal F1). No change to query behaviour."
entrance_criteria = [
  { id = "EN-1", text = "design.md locked; RV-254 findings terminal (done · await=none)." },
  { id = "EN-2", text = "retrieve.rs premises resolve: load_query, query, check_retrievable, held_back, Staleness enum, MemorySearchRow all present (re-grepped)." },
]
exit_criteria = [
  { id = "EX-1", text = "SurfaceRow { uid, title, severity, stale: bool, trust } exists in retrieve.rs; stale is computed from the Staleness enum (not a string compare — internal F2)." },
  { id = "EX-2", text = "retrieve_rows(root, scope, fetch) -> Result<Vec<SurfaceRow>> composes load_query/query/check_retrievable; a held-back (low-trust ∧ high-severity) memory is absent from the result." },
  { id = "EX-3", text = "severity_rank is pub(crate); no other visibility widened." },
  { id = "EX-4", text = "existing retrieve + memory suites green unchanged (behaviour-preservation gate)." },
]
verification = [
  { id = "VT-1", expects = "retrieve_rows applies the retrieve holdback and projects SurfaceRow with stale as bool: a low-trust∧high-severity memory is absent; a surfaced row carries uid/title/severity/stale/trust.", test_file = "src/retrieve.rs", keywords = ["retrieve_rows", "SurfaceRow", "stale"], waived = false },
  { id = "VT-2", expects = "severity_rank is reachable cross-module (pub(crate)) so memory.rs can gate on it.", test_file = "src/retrieve.rs", keywords = ["pub(crate) fn severity_rank"], waived = false },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-02"
name      = "Pure adapter helpers"
objective = "Add the pure, unit-tested core of the adapter in memory.rs: the Surface discriminator and the admit / dedup_diff / cap / format_block functions over Vec<SurfaceRow>. No stdin, no IO, no dispatch wiring yet — pure functions only (ADR-001 leaf discipline; the impurity lands in PHASE-03)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete: SurfaceRow + retrieve_rows available; severity_rank pub(crate)." },
]
exit_criteria = [
  { id = "EX-1", text = "Surface enum { Path, Command } exists; per-surface cap constants CAP_PATH=3, CAP_COMMAND=2, FETCH_LIMIT=8, SEV_FLOOR=\"high\", KEY_LOG_MAX named (STD-001)." },
  { id = "EX-2", text = "admits(row, surface): Path ⇒ true (ungated); Command ⇒ severity_rank(row.severity) <= severity_rank(SEV_FLOOR) — reuses the engine ordinal, no string list (internal F3 / no magic scale)." },
  { id = "EX-3", text = "dedup_diff(rows, seen) drops rows whose uid ∈ seen; cap(rows, n) truncates to n." },
  { id = "EX-4", text = "format_block(rows, surface): path header 'Doctrine memories for this file:' with '[<trust> ⚠stale?]', command header 'Doctrine footguns (severity-gated):' with '[<severity> ⚠stale?]'; empty rows ⇒ None." },
]
verification = [
  { id = "VT-1", expects = "admits: command surface admits critical/high, rejects medium/low/none; path surface admits a none-severity row.", test_file = "src/memory.rs", keywords = ["fn admits", "severity_rank"], waived = false },
  { id = "VT-2", expects = "dedup_diff drops seen uids, keeps fresh.", test_file = "src/memory.rs", keywords = ["fn dedup_diff"], waived = false },
  { id = "VT-3", expects = "cap truncates to CAP_PATH / CAP_COMMAND.", test_file = "src/memory.rs", keywords = ["fn cap", "CAP_COMMAND"], waived = false },
  { id = "VT-4", expects = "format_block emits the per-surface header + triage field, appends ⚠ for stale rows, returns None for empty input.", test_file = "src/memory.rs", keywords = ["fn format_block", "Doctrine footguns", "Doctrine memories for this file"], waived = false },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-03"
name      = "Command shell + dispatch + guard"
objective = "Add MemoryCommand::Surface and the impure run_surface shell (stdin parse, main-thread gate, tool_name discriminate, in-process retrieve_rows, admit/dedup/cap/format, emit, record). Wire dispatch and classify Surface as Read in guard.rs. This phase carries the RV-254 fail-open penances: emit swallows stdout Err (never ?), seen-set/log append only after a successful non-empty emit, absent/empty session_id disables dedup for the fire, every failure ⇒ emit-nothing + exit 0."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete: Surface enum + pure helpers available." },
]
exit_criteria = [
  { id = "EX-1", text = "MemoryCommand::Surface variant exists and dispatches to run_surface; `doctrine memory surface` runs (reads stdin, exits 0)." },
  { id = "EX-2", text = "run_surface: parses SurfaceInput { session_id, agent_id, cwd, tool_name, tool_input } (all optional, serde default); agent_id.is_some() ⇒ emit nothing (main-thread only, INV-3); tool_name discriminates Path (Read|Edit|Write) vs Command (Bash)." },
  { id = "EX-3", text = "The emit is via an injectable seam (emit_surface) that SWALLOWS a writer Err to Ok — never `?`-propagates it (RV-254 F-1 / INV-2)." },
  { id = "EX-4", text = "seen-set + log append happen ONLY after a successful non-empty emit (RV-254 F-3 / INV-6); a failed or empty emit leaves the seen-set untouched." },
  { id = "EX-5", text = "absent/empty session_id ⇒ dedup disabled for the fire: no seen-set file read or written, no synthetic key, no panic; the fire still surfaces (RV-254 F-2)." },
  { id = "EX-6", text = "run_surface emits ONLY additionalContext — never permissionDecision/updatedInput (advisory INV-1); every failure path (unparseable stdin, no root, retrieve Err, IO error) ⇒ emit nothing + exit 0 (INV-2)." },
  { id = "EX-7", text = "guard.rs classifies MemoryCommand::Surface as Read (the Command::Memory match is exhaustive — omission fails to compile; RV-254-cleared / internal F3)." },
]
verification = [
  { id = "VT-1", expects = "Synthetic main-thread Read stdin ⇒ emitted JSON carries hookSpecificOutput.additionalContext with the path block.", test_file = "src/memory.rs", keywords = ["fn run_surface", "additionalContext"], waived = false },
  { id = "VT-2", expects = "agent_id present (subagent) ⇒ emit nothing.", test_file = "src/memory.rs", keywords = ["agent_id"], waived = false },
  { id = "VT-3", expects = "Advisory invariant: emitted JSON never carries permissionDecision or updatedInput.", test_file = "src/memory.rs", keywords = ["permissionDecision", "hookSpecificOutput"], waived = false },
  { id = "VT-4", expects = "Unparseable stdin and a sub-floor Bash both ⇒ emit nothing, no error.", test_file = "src/memory.rs", keywords = ["SurfaceInput"], waived = false },
  { id = "VT-5", expects = "emit_surface swallows a failing writer Err (returns Ok) AND the seen-set is not mutated on emit failure (RV-254 F-1 + F-3).", test_file = "src/memory.rs", keywords = ["fn emit_surface"], patterns = ["Ok\\("], waived = false },
  { id = "VT-6", expects = "Absent/empty session_id ⇒ no seen-set IO, no panic, block still emitted (RV-254 F-2).", test_file = "src/memory.rs", keywords = ["session_id"], waived = false },
  { id = "VT-7", expects = "A no-hit / all-deduped fire leaves the seen-set untouched (RV-254 F-3 ordering).", test_file = "src/memory.rs", keywords = ["fn run_surface"], waived = false },
  { id = "VT-8", expects = "guard.rs classifies MemoryCommand::Surface as Read (the arm exists; the exhaustive Command::Memory match + EX-7 force the Read grouping — no line-anchored pattern, the Read arm spans multiple lines).", test_file = "src/commands/guard.rs", keywords = ["MemoryCommand::Surface"], waived = false },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-04"
name      = "Hook wiring + live battery"
objective = "Wire the shipped Claude plugin to the new command and prove it live. Add PreToolUse matcher entries (Read|Edit|Write + Bash) → `${DOCTRINE_BIN:-doctrine} memory surface` in plugins/doctrine/hooks/hooks.json, separate from the jail entries. Rebuild (re-embeds the RustEmbed plugins/ root) and install so the wiring materializes, then run the live battery."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete: `doctrine memory surface` runs and is fully VT-gated via synthetic stdin." },
]
exit_criteria = [
  { id = "EX-1", text = "hooks.json carries PreToolUse entries for Read|Edit|Write and Bash → `${DOCTRINE_BIN:-doctrine} memory surface`, as separate hook entries from the jail's worktree pretooluse (opposite audience)." },
  { id = "EX-2", text = "cargo build re-embeds plugins/hooks.json (RustEmbed root); doctrine install materializes the updated hooks.json into the installed plugin." },
  { id = "EX-3", text = "Live: after install + session restart/reload, a main-thread Read of a path-scoped file surfaces its memories; a Bash of a severity≥high command-scoped footgun surfaces it; a spawned subagent surfaces nothing." },
]
verification = [
  { id = "VT-1", expects = "hooks.json contains the surface wiring on both matchers.", test_file = "plugins/doctrine/hooks/hooks.json", keywords = ["memory surface", "Read|Edit|Write"], waived = false },
  { id = "VA-1", expects = "Live battery (agent-observed): main-thread Read surfaces path memories; main-thread Bash of a footgun-severity command surfaces it; subagent Read/Bash surfaces nothing; no tool call is ever blocked." },
]
specs        = []
requirements = []
