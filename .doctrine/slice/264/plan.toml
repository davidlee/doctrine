[[phase]]
id        = "PHASE-05"
name      = "Prose mirrors, whole-slice integration and the fitness re-measure"
objective = "Bring the condition's own prompt prose current, verify the slice whole, and re-measure the property that motivated it (design sec-3, sec-6 VA, sec-7; slice closure intent). The generated goldens are regenerated inside the phases that invalidate them; this phase closes what remains — the authored prompt prose, the full gate, and the on-a-real-run measurement."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 complete: the derived set and the narrowed predicate are in place, and both `install/design-run-stages.md` and `install/design-payload-contract.md` are regenerated and green." },
]
exit_criteria = [
  { id = "EX-1", text = "`install/design-prompts/conditions/initial-concerns-recorded.md` states the single-act shape — show the map as an indented tree with the blocking ones marked, and record the review of it in one submission — with no separate blocking-set declaration to confirm. No prompt file is minted for `blocking-set-current`, the condition the design dropped; every condition in the vocabulary still has its prompt and every prompt a condition." },
  { id = "EX-2", text = "`doctrine check gate` is green (format, clippy at zero warnings, the fleet suites), `cargo test --test architecture_layering` passes, and the design e2e suites (`tests/e2e_design_*.rs`) pass." },
  { id = "EX-3", text = "The slice's selectors still name the surface the plan touched — `src/design_run/**`, `install/design-prompts/conditions/**`, `install/design-payload-contract.md`, `install/design-run-stages.md` — and no changed path escaped them." },
  { id = "EX-4", text = "VA: on a real run, a node added with `blocking: false` after `user-accepts-sufficiency` does not re-face the human gates, while a node added `blocking: true` does. Re-measured against `RFC-031`'s fitness measure (nodes and edges added after `user-accepts-sufficiency`) and recorded in the slice notes." },
  { id = "EX-5", text = "Any probe that shows behaviour the design did not claim is reported, not absorbed; a substantive design problem re-enters `/design` rather than being settled here." },
]
verification = [
  { id = "VT-1", expects = "the regenerated condition table binds `initial-concerns-recorded` to `reviewed-graph`", test_file = "install/design-run-stages.md", keywords = ["reviewed-graph"], waived = false },
  { id = "VT-2", expects = "the condition's own prompt states the single-act shape: the tree and its marks are what the user confirms, with no separate set to declare", test_file = "install/design-prompts/conditions/initial-concerns-recorded.md", keywords = ["there is no separate set to declare"], waived = false },
  { id = "VA-1", text = "`doctrine check gate` green, `cargo test --test architecture_layering` green, the design e2e suites green." },
  { id = "VA-2", text = "The RFC-031 fitness re-measure is recorded in the slice notes, with the run it was taken from named." },
  { id = "VA-3", text = "The prompt store stays complete after the prose edit: `cargo test --bin doctrine every_condition_has_a_distinct_key_under_the_conditions_prefix` green, nine condition prompts and none for the designed-and-dropped `blocking-set-current`. Agent-verified rather than `VT` because the test lives in `src/design_run/prompt.rs`, which no phase of this slice modifies — a `VT` mandate there could not be attributed (IMP-209)." },
]
