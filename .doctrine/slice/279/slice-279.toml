id = 279
slug = "rv-rec-relation-targets"
title = "RV and REC as relation targets"
status = "proposed"
created = "2026-10-03"
updated = "2026-10-03"
tags = []

[relationships]
needs = []                      # slice→work hard prerequisite
after = []                      # slice→work soft sequence: { to, rank }

[[selector]]
selector = "src/relation*"
intent = "scope-relevant"

[[selector]]
selector = "src/partition*"
intent = "scope-relevant"

[[selector]]
selector = "src/kinds/**"
intent = "scope-relevant"

[[selector]]
selector = "src/review_ledger/**"
intent = "scope-relevant"

[[relation]]
label = "fulfils"
target = "IMP-480"

[[relation]]
label = "governed_by"
target = "ADR-010"

[[relation]]
label = "related"
target = "RFC-032"

# STRUCTURAL relations are uniform `[[relation]]` rows, never a typed
# `[relationships]` axis. Slices carry no typed STRUCTURAL
# relation axes — the `[relationships]` table above holds only the dep/seq payload
# (`needs`/`after`). Author a structural edge with the `doctrine link` verb
# — it validates the (source, label) pair and resolves the target:
#   doctrine link SL-NNN specs SPEC-NNN
#   doctrine link SL-NNN governed_by ADR-NNN
# `doctrine inspect SL-NNN` renders the inbound + outbound edges.
