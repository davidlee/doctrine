[[phase]]
id        = "PHASE-06"
name      = "Uniform done and conclude --basis"
objective = "done ⇔ all findings terminal ∧ concluded, derived on every read; conclude takes a required basis stored as a review-level turn; raise and reopen clear concluded (D2, RV-396 F-4, design sec-3)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 complete (reopen exists to clear concluded)." },
]
exit_criteria = [
  { id = "EX-1", text = "derived_status(findings, concluded) implements sec-3's table; every caller moves with the signature (ReviewDoc::derived, reconcile_baton_fields, run_status, show/list, derived_status_string). doc_unresolved_blockers keeps its Active guard." },
  { id = "EX-2", text = "review conclude requires a non-empty --basis, appends a [[review.turn]] act = conclude row and sets concluded in the same edit; already reports the prior flag. Open or answered findings are allowed." },
  { id = "EX-3", text = "raise and reopen on a concluded ledger clear concluded in the write that appends their turn." },
  { id = "EX-4", text = "PassFacts predicates and the design-run gate are unchanged (DEC-138). After a late raise, a new Conducted disposition is refused until a re-conclude; one already recorded stands." },
  { id = "EX-5", text = "MCP review_conclude.basis is required." },
  { id = "EX-6", text = "Pre-existing test changes are named in the phase notes as flips (derived_status_empty_is_done_none, derived_status_all_terminal_is_done_none, derived_status_total_over_enum, show_renders_empty_ledger_done_and_the_edge, list_renders_empty_ledger_done_and_the_edge, in-file golden_* strings) or fixture-setup changes (the tests near the old review.rs:3777, 3805, 4748 and golden_run_status gain concluded = true or a conclude step, assertion unchanged). Any other assertion change is a finding (RV-396 F-1)." },
  { id = "EX-7", text = "Golden updated. doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "derived_status over finding states × concluded, including empty × both (sec-8 VT 5)", test_file = "src/review_ledger/derive.rs", keywords = ["derived_status_total_over_enum", "concluded", "derived_status_empty_unconcluded_is_active"], waived = false },
  { id = "VT-2", expects = "conclude with open findings reaches done once they turn terminal; raise and reopen clear concluded (sec-8 VT 5)", test_file = "src/review/tests.rs", keywords = ["conclude_then_terminal_is_done", "raise_clears_concluded", "reopen_clears_concluded"], waived = false },
  { id = "VT-3", expects = "missing or empty --basis refused (sec-8 VT 3)", test_file = "src/review/tests.rs", keywords = ["conclude_requires_basis"], waived = false },
  { id = "VT-4", expects = "PassFacts.concluded false after a late raise; Conducted refused until re-conclude; PassFacts unchanged over v2 ledgers (sec-8 VT 5, 14)", test_file = "tests/e2e_design_review.rs", keywords = ["late_raise_refuses_conducted_until_reconclude"], waived = false },
]
specs        = []
