# Implementation plan for SL-268 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-268"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable. VT = test, VA = agent,
# VH = human. Reference another phase's criterion phase-qualified (PHASE-03/EX-2).

[[phase]]
id        = "PHASE-01"
name      = "Behaviour-preservation golden"
objective = "Pin today's review CLI surface byte-exact in a black-box e2e golden over the built binary, before any code moves (D4, IMP-029, design sec-8)."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (run dr-01a0dc9c, revision 36); slice status plan or later." },
  { id = "EN-2", text = "No change to src/ in this phase: the golden is written against the current binary." },
]
exit_criteria = [
  { id = "EX-1", text = "tests/e2e_review_golden.rs pins stdout and error text for every review verb (new, raise, dispose, verify, contest, withdraw, conclude, list, show, show --json, status, prime, unlock, paths) and each role refusal and state refusal, over hand-seeded fixtures." },
  { id = "EX-2", text = "It pins the authored ledger TOML byte-exact after each write." },
  { id = "EX-3", text = "The only normalisation replaces the fixture root with a fixed <ROOT> token (RV-396 F-7): it covers new's created directory and every path-bearing error. Nothing else is carved out." },
  { id = "EX-4", text = "Write-path tests skip under the worker marker (the e2e_adr_cli_golden.rs skip_under_worker_marker pattern, ISS-260), so the coordinator-tree run is the authoritative one." },
  { id = "EX-5", text = "doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "golden covers every verb and normalises only the fixture root", test_file = "tests/e2e_review_golden.rs", keywords = ["<ROOT>", "skip_under_worker_marker", "\"raise\"", "\"dispose\"", "\"verify\"", "\"contest\"", "\"withdraw\"", "\"conclude\"", "\"prime\"", "\"--json\""], waived = false },
  { id = "VA-1", text = "The golden is run in an unmarked (coordinator) tree and every test executes rather than skips; the run's test count is recorded in the phase notes." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Tier split"
objective = "Move src/review.rs into the engine module src/review_ledger/ and the command module src/review/ along design sec-12's file table, with no behaviour change (D4)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete; the golden is green in the coordinator tree." },
]
exit_criteria = [
  { id = "EX-1", text = "src/review.rs is gone. src/review_ledger/{mod,vocab,schema,derive,transition,gate}.rs and src/review/{mod,cli,turn,verbs,read,prime}.rs hold the items design sec-12 assigns them. Items that sec-12 names but that do not exist yet (Disposition, Route, TurnKind, Act, TurnRow, vocabulary_defects) are not created here." },
  { id = "EX-2", text = "review_ledger imports nothing from a command-tier module. layering.toml gains review_ledger = \"engine\", keeps review = \"command\", corrects the ledger comment to the dispatch run-ledger (SL-064), and updates or drops catalog::scan's review reach to match what it still imports." },
  { id = "EX-3", text = "External callers use crate::review_ledger:: for engine items and crate::review:: for verbs. No re-export shim: one path per item." },
  { id = "EX-4", text = "The 97 in-file unit tests move to src/review/tests.rs with their assertions byte-unchanged; only use lines and module paths differ." },
  { id = "EX-5", text = "DEC-318: the DERIVED_STATUS comment in src/kinds/mod.rs and its pinning test's wording say derivation is engine-tier (review_ledger::derive), the probe does not call it yet, and the arm retires with D14." },
  { id = "EX-6", text = "The golden and every existing suite are green unchanged (the behaviour-preservation gate). doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "review_ledger is classified engine and the layering gate passes", test_file = ".doctrine/adr/001/layering.toml", keywords = ["review_ledger = \"engine\"", "review = \"command\"", "SL-064"], waived = false },
  { id = "VT-2", expects = "derivation lives in the engine module", test_file = "src/review_ledger/derive.rs", keywords = ["fn derived_status"], waived = false },
  { id = "VT-3", expects = "DEC-318 comment names the engine-tier home and D14 retirement", test_file = "src/kinds/mod.rs", keywords = ["review_ledger::derive", "D14"], waived = false },
  { id = "VA-1", text = "git diff PHASE-01's tip..PHASE-02's tip -- tests/ shows no assertion change: only the tests/ side of the moved suite's use lines. The golden file is byte-identical across the phase." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Fail-safe reads and disclosure"
objective = "Every closed vocabulary reads fail-safe and every read surface discloses the defect on its caller's channel (D15, DEC-319, design sec-3)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "FindingStatus::parse returns Result; parse_finding_status and the Open fallback are gone. An unknown status reads non-terminal, keeps the review active, counts in every blocker predicate, is refused by every act with ReviewError::UnknownStatus naming the known set and the repair, and renders verbatim." },
  { id = "EX-2", text = "One gates_as_blocker(raw) predicate (Blocker or out of vocabulary) feeds all three blocker predicates; outstanding_by_severity buckets an unknown severity as blocker. The three predicates keep their state differences (SL-244)." },
  { id = "EX-3", text = "The typed Finding projection carries status and severity as Vocab<T> (Known | Unknown(raw)), serialising the raw string; finding_of_row's Major fallback is gone (RV-396 F-5)." },
  { id = "EX-4", text = "Pure vocabulary_defects(&ReviewDoc) yields {finding, field, raw, effect}. It is disclosed on: show/status (warning: lines, plus a warnings array in JSON and MCP); list (a structured warnings array naming the RV, printed to stderr on the CLI and carried as a field in --json and MCP review_list, RV-396 F-2); the close gate (BlockerRef.reason printed beside the finding); the catalog scan (one warning CatalogDiagnostic per defective RV, RV-396 F-3, surfaced by no caller until ISS-492); the design run (PassFacts.defects, printed by commands/design.rs in the outstanding projection and gate admission, no predicate reading it, RV-396 F-9)." },
  { id = "EX-5", text = "An out-of-vocabulary disposition, route, act or role renders verbatim and is not a defect." },
  { id = "EX-6", text = "Golden updated in the same commit; its diff is the evidence. doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "unknown status: non-terminal, act-refused with the repair, verbatim with a warning (sec-8 VT 6)", test_file = "src/review/tests.rs", keywords = ["unknown_status_reads_non_terminal", "unknown_status_refuses_every_act", "UnknownStatus"], waived = false },
  { id = "VT-2", expects = "unknown severity gates the close gate, counts as blocker, and is warned on show/status/list/close (sec-8 VT 7)", test_file = "src/review/tests.rs", keywords = ["unknown_severity_gates_as_blocker", "unknown_severity_warned_on_every_surface", "gates_as_blocker"], waived = false },
  { id = "VT-3", expects = "raw-preserving projection in table, index, --json and MCP (sec-8 VT 16)", test_file = "src/review/tests.rs", keywords = ["unknown_vocab_renders_verbatim_everywhere", "Vocab::Unknown"], waived = false },
  { id = "VT-4", expects = "catalog scan emits a warning diagnostic for a defective RV (sec-8 VT 18)", test_file = "src/catalog/scan.rs", keywords = ["defective_rv_emits_warning_diagnostic"], waived = false },
  { id = "VT-5", expects = "design-run projection and admission print the defect warning; gate outcome unchanged (sec-8 VT 19)", test_file = "tests/e2e_design_review.rs", keywords = ["defect_warning_printed_gate_unchanged"], waived = false },
  { id = "VT-6", expects = "MCP review_list carries warnings (sec-8 VT 13, list arm)", test_file = "tests/e2e_mcp_server.rs", keywords = ["review_list_carries_warnings"], waived = false },
  { id = "VT-7", expects = "a legacy unknown disposition renders verbatim with no warning (sec-8 VT 8, read arm)", test_file = "src/review/tests.rs", keywords = ["legacy_disposition_quiet"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Turn journal"
objective = "Every existing act appends its turn row in the same CAS-guarded write that moves status; the ephemeral note and the out-of-lock baton write are deleted; counters become base plus count (D1, CHR-001, design sec-2)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "Verb and TurnAct are one Act enum. can(act, from, role) is the single table; required_for is removed and the state refusal reports the admissible from-set computed from can." },
  { id = "EX-2", text = "TurnRow { act, role, note?, disposition?, route?, response? } is read open-vocabulary. apply_act is the only writer of a finding's state fields and its turn; append_finding writes the raise turn; dispose turns snapshot disposition and response." },
  { id = "EX-3", text = "contest requires a non-empty note; withdraw gains an optional note; verify's note lands in its turn. Baton.handoff and run_raiser_transition's post-turn baton write are deleted." },
  { id = "EX-4", text = "Counters: the first journalled write to a ledger with no turns and no rounds_base seeds rounds_base/contests_base from the baton (0 when absent); afterwards rounds = base + count(all turns) and contests = base + count(contest turns). A never-journalled ledger reports the baton. The baton stops incrementing and keeps the fields serde-default." },
  { id = "EX-5", text = "MCP review_contest.note (required) and review_withdraw.note call the same run_* functions." },
  { id = "EX-6", text = "Flip named in the phase notes: note_is_handoff_chatter_in_the_baton_not_the_ledger is replaced by a note-in-turn test. Any other assertion change is a finding. Golden updated. doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "every act appends exactly one turn in the same write as status, with act/role/note (sec-8 VT 1)", test_file = "src/review/tests.rs", keywords = ["every_act_appends_one_turn", "note_lands_in_turn"], waived = false },
  { id = "VT-2", expects = "contest without a note is refused, CLI and MCP (sec-8 VT 3, contest arm)", test_file = "src/review/tests.rs", keywords = ["contest_requires_note"], waived = false },
  { id = "VT-3", expects = "counter seeding from the baton, 0 with no baton, base+count after, legacy reads the baton (sec-8 VT 4)", test_file = "src/review_ledger/derive.rs", keywords = ["rounds_base", "counters_seed_from_baton", "counters_legacy_reads_baton"], waived = false },
  { id = "VT-4", expects = "the refusal's from-set is computed from can (no second table)", test_file = "src/review_ledger/transition.rs", keywords = ["pub(crate) enum Act", "admissible_from"], waived = false },
  { id = "VT-5", expects = "MCP contest/withdraw note round-trips through the same run_* (sec-8 VT 13, note arm)", test_file = "tests/e2e_mcp_server.rs", keywords = ["review_contest_note_round_trips"], waived = false },
]
specs        = []
requirements = []

