objective = "prime degrades and discloses on a target with no path-set, clears a stale cache, and filters non-file literal selectors (D11, IMP-259, ISS-059, RV-396 F-6, design sec-5)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete. Independent of PHASE-03..07: may run in parallel with them on a disjoint file set (src/review/prime.rs)." },
]
exit_criteria = [
  { id = "EX-1", text = "A non-slice target or a zero-selector slice returns Primed { tracked_count: 0, degraded: Some(reason), cleared }, prints primed nothing: <reason> (plus removed the previous cache when one existed) on stdout, exit 0. The MCP output carries degraded." },
  { id = "EX-2", text = "Under the prime lock, a degraded prime removes any earlier cache.toml, so status reports no cache rather than a stale current." },
  { id = "EX-3", text = "Literal selectors: absent kept, regular file kept, directory or symlink (via symlink_metadata, never followed) excluded and listed on a skipped non-file selector: line." },
  { id = "EX-4", text = "Golden updated. doctrine check gate green." },
]
verification = [
