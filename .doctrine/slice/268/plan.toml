[[phase]]
id        = "PHASE-07"
name      = "Prose input, role aliases, target spelling"
objective = "Prose arguments accept - and @path through one engine-tier resolver; --as accepts the ledger's declared labels; @PHASE-NN is a target spelling (D10, D8, design sec-4)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 complete (every prose flag it resolves exists: --note, --basis, --response)." },
]
exit_criteria = [
  { id = "EX-1", text = "input::resolve_prose(raw, flag, stdin, fs_read) resolves - (stdin), @path (cwd-relative file) or literal; resolve_body delegates to it with its callers' behaviour unchanged. A second - is refused before any read, naming both flags; an empty resolved required value is refused." },
  { id = "EX-2", text = "review/cli.rs resolves --title, --detail, --response, --note and --basis before calling a verb; run_* take resolved Strings. MCP does no resolution: a literal - or @x stays literal." },
  { id = "EX-3", text = "parse_role(token, default, meta) accepts raiser/responder and the ledger's declared labels; review new refuses colliding labels and a label naming the other role; --as help and the refusal name the legal values and the ledger's labels. MCP role accepts the aliases." },
  { id = "EX-4", text = "review new --target SL-NNN@PHASE-NN equals --target SL-NNN --phase PHASE-NN; both at once is refused; review list --target accepts it via one Target::parse. Help says @ in a target is not @path." },
  { id = "EX-5", text = "Golden updated. doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "- and @path on every review prose argument; two - refused; leading-@ literal via stdin; resolve_body unchanged (sec-8 VT 9)", test_file = "src/input.rs", keywords = ["fn resolve_prose", "second_dash_refused", "at_path_reads_file", "resolve_body_unchanged"], waived = false },
  { id = "VT-2", expects = "--as aliases, collision refusal at new, help naming the values (sec-8 VT 10)", test_file = "src/review/tests.rs", keywords = ["as_accepts_declared_labels", "new_refuses_colliding_labels"], waived = false },
  { id = "VT-3", expects = "@PHASE-NN target spelling and its conflict with --phase (sec-8 VT 11)", test_file = "src/review_ledger/schema.rs", keywords = ["at_phase_spelling", "at_phase_conflicts_with_phase_flag"], waived = false },
  { id = "VT-4", expects = "MCP literal - stays literal; role alias accepted (sec-8 VT 13)", test_file = "tests/e2e_mcp_server.rs", keywords = ["review_literal_dash_stays_literal"], waived = false },
]
specs        = []
requirements = []

