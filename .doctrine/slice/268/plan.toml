  { id = "VT-2", expects = "amend and reopen refuse a missing or empty note (sec-8 VT 3)", test_file = "src/review/tests.rs", keywords = ["amend_requires_note", "reopen_requires_note"], waived = false },
  { id = "VT-3", expects = "closed disposition/route refusals name the set; route: prefix refused (sec-8 VT 8)", test_file = "src/review/tests.rs", keywords = ["disposition_refusal_names_set", "route_prefix_refused"], waived = false },
  { id = "VT-4", expects = "canaries for the two new vocabularies", test_file = "src/review_ledger/vocab.rs", keywords = ["disposition_known_set_matches_variants", "route_known_set_matches_variants"], waived = false },
