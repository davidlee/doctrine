# Implementation plan for SL-214 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-214"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Author /knowledge skill + capture touchpoints"
objective = "Author plugins/doctrine/skills/knowledge/SKILL.md per design D2 (trigger-surface description, four-homes line, seven-kind picker, DEC-vs-ADR altitude, intent→verb table, wrong-home cross-pointers, ADR-017 gating teaching, rules), and add the D3 capture pointers to the design, consult, and preflight skills."
entrance_criteria = [
  { id = "EN-1", text = "design.md D1–D3 locked; embed site confirmed as src/install.rs (IMP-226)" },
  { id = "EN-2", text = "plugins/doctrine/skills/backlog/SKILL.md read as the structural model" },
]
exit_criteria = [
  { id = "EX-1", text = "SKILL.md exists with every D2 element; frontmatter description carries capture-intent trigger phrases (resolves OQ-1) and parses — no bare colons in YAML values (mem.pattern.skills.yaml-frontmatter-colons: block scalar or quote)" },
  { id = "EX-2", text = "design, consult, and preflight SKILL.md each carry a 1–2-line capture pointer to /knowledge per D3 — pointers only, no re-implementation" },
  { id = "EX-3", text = "POL-002 reflex clean: no `just `, repo-local paths, branch names, or [[mem.…]] keys absent from the shipped memory/ corpus in any new/edited skill file; the shipped skill does not cite repo-local governance ids (ADR-017 teaching rides as content, not citation)" },
]
verification = [
  { id = "VT-1", expects = "the knowledge SKILL.md carries the verb table and gating section floor", test_file = "plugins/doctrine/skills/knowledge/SKILL.md", keywords = ["knowledge new", "knowledge status", "shapes", "needs"], waived = false },
  { id = "VT-2", expects = "design skill points capture intent at /knowledge", test_file = "plugins/doctrine/skills/design/SKILL.md", keywords = ["/knowledge"], waived = false },
  { id = "VT-3", expects = "consult skill points capture intent at /knowledge", test_file = "plugins/doctrine/skills/consult/SKILL.md", keywords = ["/knowledge"], waived = false },
  { id = "VT-4", expects = "preflight skill points at /knowledge and prompts an inbound-gating check", test_file = "plugins/doctrine/skills/preflight/SKILL.md", keywords = ["/knowledge"], waived = false },
  { id = "VA-1", text = "POL-002 grep pass over all five touched files returns zero hits; any [[mem.…]] key cited resolves against shipped memory/ corpus keys" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Distribute, route, and boot"
objective = "Re-embed and install the skill, then land the routing row and reference amendment in F14 order: touch src/install.rs → cargo build → install -s knowledge → routing row in install/routing-process.md → gating sentence in install/using-doctrine.md → doctrine boot."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 committed: SKILL.md and touchpoint pointers exist under plugins/ (the sole source of truth — .doctrine/skills/ and .agents/skills/ copies are never hand-edited)" },
]
exit_criteria = [
  { id = "EX-1", text = "./target/debug/doctrine install -s knowledge -y succeeds from the rebuilt binary and the skill resolves in the installed set" },
  { id = "EX-2", text = "install/routing-process.md carries the epistemic capture/settle → /knowledge row, landed only after EX-1 (ADR-009 F14); OQ-2 resolved while editing (lean: row suffices, no /route digest change)" },
  { id = "EX-3", text = "install/using-doctrine.md knowledge_record bullet names the gating model in one sentence (inbound needs on an unsettled record); glossary.md untouched" },
  { id = "EX-4", text = "doctrine boot --check clean; boot snapshot routing table includes the new row" },
]
verification = [
  { id = "VT-1", expects = "routing table routes epistemic capture to the knowledge skill", test_file = "install/routing-process.md", keywords = ["/knowledge"], waived = false },
  { id = "VT-2", expects = "using-doctrine names the inbound-needs gating model on the knowledge_record bullet", test_file = "install/using-doctrine.md", keywords = ["unsettled"], waived = false },
  { id = "VA-1", text = "installed skill list shows knowledge; installed copy is byte-identical to plugins/ source" },
  { id = "VH-1", text = "human confirms sequencing was honoured (install before row before boot) and the boot snapshot reads correctly" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Dogfood capture — first corpus records"
objective = "Author the corpus's first knowledge records through the installed skill (D5, adversarial finding 2: cross-slice-reach only): one DEC recording the SL-214/SL-215 capture-vs-harvest boundary with `link DEC-n shapes SL-215`, one ASM recording that touchpoint pointers drive population (validation plan: re-census after SL-215 lands)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete: /knowledge installed, routed, boot regenerated" },
]
exit_criteria = [
  { id = "EX-1", text = "DEC and ASM records exist, created via the CLI verbs (never hand-edited TOML), each with a prose body stating rationale and, for the ASM, the validation plan" },
  { id = "EX-2", text = "DEC carries a shapes edge to SL-215; edges authored outbound-from-record (ADR-004)" },
  { id = "EX-3", text = "doctrine knowledge list is non-empty — census non-zero at close" },
]
verification = [
  { id = "VA-1", text = "doctrine knowledge show on each record renders well-formed metadata + body; kinds seeded with their default states" },
  { id = "VA-2", text = "no record authors dep/seq edges (ADR-017: records never gate; only shapes/spawns outbound)" },
  { id = "VH-1", text = "human accepts the two records as fair first citizens — teaching by example, not record-spam" },
]
specs        = []
requirements = []
