# Implementation plan for SL-287 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-287"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable
# (`lib:reference/glossary.md` § reference forms). Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.
[[phase]]
id        = "PHASE-01"
name      = "Commitment-ledger reference doc"
objective = "Ship install/commitment-ledger.md as lib:reference/commitment-ledger.md: purpose, trigger, ledger format, procedure, plan review, variances and refresh — published, with a test that keeps its TOML example honest."
entrance_criteria = [
  { id = "EN-1", text = "SL-287 design locked (run dr-01a1b821, rev 47); commitment-ledger.toml committed and cross-checked." },
]
exit_criteria = [
  { id = "EX-1", text = "install/commitment-ledger.md exists and publication/manifest.toml has an [[entry]] address reference/commitment-ledger.md, backing commitment-ledger.md, kind reference, beside review-ledger's." },
  { id = "EX-2", text = "The doc carries exactly one fenced toml example, the ledger's schema: schema = \"commitment-ledger/1\"; [[extracted]] (section, fingerprint); [[commitment]] (id, kind explicit|implicit, source, quote, satisfied_by phase-qualified, how, needs, gated_by, verdict proportionate|weak|excessive|deferred, note) with one design-source row {section, heading} and one review-source row {review, finding}; [[proof]] (criterion, proves); [[variance]] (commitment, class realisation|intent, change, basis, phase, retires, successor). Commitment ids author-assigned, immutable and never reused; criteria phase-qualified." },
  { id = "EX-3", text = "The doc states the ledger rules: authored TOML in the slice folder, committed and reviewed with the plan, read by nothing yet; quote verbatim and never edited, change recorded as a variance (a quote ending mid-line closes its literal on its last line, so it carries no newline the source lacks); source = design-run section id plus heading, never a line; two source kinds, a review row quoting the routed finding's whole response, checked by equality not containment; the governing set (intent variance with retires ends a row — superseded with a successor, withdrawn without; retired rows are history and every check reads the governing set only); [[extracted]] stamps fingerprints per section; implicit commitments quote the entailing passage; needs is correctness-only, optional, sparse, acyclic, with no soft ordering field; proofs are a separate table and coverage is derived from the two links; no link field goes into plan.toml because the plan reader drops unknown fields; 'commitment ledger' vs bare 'ledger'." },
  { id = "EX-4", text = "The doc states the procedure inside /plan: trigger (required for more than one phase; a single-phase plan may skip it and, if it does, says so in one line of plan.md; reads only the plan's own content); extract (after scaffolding, before phases; per section; explicit and implicit; routed findings become review rows; stamp [[extracted]]; a gap or contradiction returns to /design); satisfy (satisfied_by, how, gated_by, [[proof]] rows; needs drives sequencing — never earlier than what it needs; gates — a cross-phase edge appears as gated_by on an EN; parallel candidates — no needs path and disjoint surfaces, host directives decide); cross-check before the first commit — coverage over the governing set (unsatisfied commitment, unproved EX, criterion proving nothing, EX meeting no commitment), content (counts, names, sets, conditions), proportionality (four verdicts; never count tests), entry criteria (gated_by real, every cross-phase edge gated, no cycle, never forward); fix then commit both; the orchestration seam in neutral terms (planner, delegate, reviewer), prescribing no split or mechanism." },
  { id = "EX-5", text = "The doc states the plan review: for multi-phase plans it replaces /plan step 7 and feeds steps 8-9; two RVs at the existing facet plan, opened in parallel, raiser labels commitments and sequencing, each with the reads/checks of design sec-4's table; plan.toml owns the realised sequence and needs is its rationale; reviewers are fresh contexts; it runs in a primary or solo tree because review writes are refused in dispatch workers; findings follow the review-ledger protocol unchanged; no new facet, kind or multi-raiser mechanism." },
  { id = "EX-6", text = "The doc states variances and refresh: append-only, quote stays; realisation (a recorded basis suffices) vs intent (the user or a design revision first, basis cites it); detect staleness at the locked-exit handoff to /plan and at each /phase-plan if any of five conditions holds (section-id set differs from [[extracted]]; a fingerprint differs; a governing design row's quote no longer occurs verbatim in design.md; a governing review row's quote no longer equals its response; a routed finding with no governing row), with the no-run fallback; refresh scoped to what changed (extract added/changed sections, unrowed findings, amended responses; retire with successor or none, basis the design revision or amended response; add rows; re-cross-check; re-stamp); between lock and planning, defects return to /design and a plan-time realisation is a variance with phase = \"plan\"; the loop closes — an intent variance during execution sends work back to design, and the post-relock refresh confirms the design now says it." },
  { id = "EX-7", text = "The doc grounds only on prose, lib: addresses, skill names and CLI verbs: no repo-private ids (placeholders like RV-NNN / DEC-NNN / C-NN are fine), no src/ paths, the defect classes described not cited; other shipped docs named only as lib: addresses, never bare file names (no_bare_library_mention_in_shipped_text arms on the new manifest entry); says 'commitment', never 'obligation'; presents itself as guidance, never as an enforced check." },
  { id = "EX-8", text = "src/install.rs gains one test beside review_ledger_is_shipped: commitment-ledger.md is embedded and non-empty, the manifest publishes reference/commitment-ledger.md, and the doc's fenced toml block parses. No other src change; existing tests unmodified; doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "commitment_ledger_is_shipped: doc embedded, non-empty, published at reference/commitment-ledger.md, fenced toml block parses", test_file = "src/install.rs", keywords = ["fn commitment_ledger_is_shipped", "commitment-ledger.md", "reference/commitment-ledger.md", "toml::"], waived = false },
  { id = "VT-2", expects = "doctrine check gate green with the shipped-asset and skill-dedup tests unchanged", test_file = "src/install.rs", keywords = ["fn review_ledger_is_shipped", "fn dedup_skills_route_not_restate"], waived = false },
  { id = "VA-1", text = "Content read-through: each EX-2..EX-7 clause (EX-7: guidance status, terminology, defect classes described not cited) against the governing ledger rows' quotes (design sec-2..sec-5) and DEC-415..DEC-420 — counts, names, sets, conditions; nothing contradicts, nothing omitted." },
  { id = "VA-2", text = "Shipped-text sweep of install/commitment-ledger.md for the full id-prefix set with digits ([A-Z]{2,4}-[0-9]) and src/ paths, with a positive control on a file known to carry ids; 'obligation' absent." },
  { id = "VA-3", text = "git diff --stat for the phase touches only install/commitment-ledger.md, publication/manifest.toml, src/install.rs; the src/install.rs diff adds one test and modifies none." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Skill pointers and adjacent guidance"
objective = "Route five skills to lib:reference/commitment-ledger.md without restating it, correct /plan step 4, and add the ledger to the glossary and using-doctrine."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 landed: the manifest publishes reference/commitment-ledger.md, so a lib: citation of it resolves (every_shipped_lib_citation_resolves green). Gates commitment-ledger C-31 and C-29, which need C-22/C-23." },
]
exit_criteria = [
  { id = "EX-1", text = "Each of five skills points to lib:reference/commitment-ledger.md, as guidance and without restating the procedure: /plan — build the ledger at step 3 (extract), satisfy and cross-check at step 4, the plan review replacing step 7 for multi-phase plans, and on entry after a relock run the refresh; /phase-plan step 5 — run the staleness check and copy the phase's governing rows' quotes into the runtime phase sheet; /execute step 10 — a change to how or whether a commitment is met is recorded as a variance; /consult outcome capture — an outcome that changes a commitment is recorded as a variance citing the DEC; /audit step 2 — read the ledger: each commitment's quote, its variances, and where it was finally satisfied." },
  { id = "EX-2", text = "/plan step 4's specs/requirements line no longer says they stay empty '(no registry yet)'; it states only that relations are written with doctrine link and the in-file tables are not read." },
  { id = "EX-3", text = "install/glossary.md: the slice-directory layout gains commitment-ledger.toml (authored), and the term 'commitment ledger' is distinguished from the review ledger. install/using-doctrine.md: the storage-tier slice example gains it." },
  { id = "EX-4", text = "Installed copies (.doctrine/skills/, .claude/skills/) refreshed by ./target/debug/doctrine install from the freshly built binary, not hand-edited." },
  { id = "EX-5", text = "Every edited install/ and plugins/ file grounds only on prose, lib: addresses, skill names and CLI verbs, and names shipped docs only as lib: addresses (no_bare_library_mention_in_shipped_text); no src change; existing tests unmodified; doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = "doctrine check gate green: every_shipped_lib_citation_resolves now resolves the five pointers; dedup_skills_route_not_restate unchanged. The keyword floor only proves the /plan pointer exists; the gate run is the proof", test_file = "plugins/doctrine/skills/plan/SKILL.md", keywords = ["lib:reference/commitment-ledger.md"], waived = false },
  { id = "VA-1", text = "After cargo build, with the freshly built ./target/debug/doctrine (never the PATH release binary, which lacks the entry and would reinstall stale skills): ./target/debug/doctrine install, then ./target/debug/doctrine library show lib:reference/commitment-ledger.md resolves, and grep finds that address in each of the five plugins/doctrine/skills/{plan,phase-plan,execute,consult,audit}/SKILL.md." },
  { id = "VA-2", text = "Shipped-text sweep over every file this phase edits under install/ and plugins/, full id-prefix set with digits and src/ paths, with a positive control." },
  { id = "VA-3", text = "Read-through: each pointer matches EX-1's anchor and wording and design sec-5's touchpoint table; none restates the procedure; step 4 and the glossary/using-doctrine edits match EX-2/EX-3." },
]
specs        = []
requirements = []
