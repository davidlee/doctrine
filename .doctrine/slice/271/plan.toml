# Implementation plan for SL-271 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-271"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance. The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.

[[phase]]
id        = "PHASE-01"
name      = "Shared decision core and the Claude planner refactor"
objective = "Introduce the format-free McpEntryClass + mcp_action decision table both arms will call, and refactor the Claude plan_mcp onto it, with the existing plan_mcp_* suite kept green unchanged as the behaviour-preservation proof. The Wired/Refreshed payload becomes the full rendered invocation (DEC-328, DEC-325; design sec-5.2/5.4/9)."
entrance_criteria = [
  { id = "EN-1", text = "Design run dr-01a0e17c is locked (revision 44); slice status plan or later." },
  { id = "EN-2", text = "doctrine check gate green on the starting tree." },
  { id = "EN-3", text = "The design premises resolve in the current tree: McpPlan (src/boot.rs:1976), desired_mcp_entry (:1996), is_doctrine_mcp_entry (:2010), plan_mcp (:2034), mcp_fallback_snippet (:2079), install_mcp (:2087); the wire() MCP block (:2851-2878); the plan_mcp_* suite (:5293-5416). Verified 2026-09-27; src/boot.rs and src/install.rs are unchanged since the design commit e569620cd." },
]
exit_criteria = [
  { id = "EX-1", text = "src/boot.rs gains pub(crate) enum McpEntryClass { Absent, OwnedCurrent, OwnedStale, Foreign } and fn mcp_action(class: McpEntryClass, payload: String, file: &'static str) -> (RefreshOutcome, bool). The table is the one shared element; it names no format and no caller domain concept (ADR-001), carries no Malformed arm and no refusal channel." },
  { id = "EX-2", text = "plan_mcp derives its class from its own JSON parse with a total match and calls mcp_action; parsing, mutation and rendering stay in plan_mcp. Malformed remains the PrintedFallback sentinel decided before classification. McpPlan keeps its shape." },
  { id = "EX-3", text = "The Wired/Refreshed payload plan_mcp carries becomes the FULL rendered invocation (command plus its serve args), derived from desired_mcp_entry so the literal is not re-spelled; wire()'s two Claude MCP message lines (src/boot.rs:2855, :2862) print the payload once and drop the appended serve --mcp. A new plan_mcp_carries_the_full_invocation unit test pins the payload; the stdout form is asserted by the PHASE-02 Claude-only e2e. The RefreshOutcome doc comment stops calling the carried string the command." },
  { id = "EX-4", text = "The PrintedFallback arm and install_mcp keep their behaviour; the fallback snippet remains mcp_fallback_snippet." },
  { id = "EX-5", text = "Behaviour preservation: the existing plan_mcp_* and is_doctrine_mcp_entry_* tests (src/boot.rs:5293-5416) stay green UNCHANGED. The suite matches the Wired/Refreshed carried string by wildcard, so widening the payload to the full invocation rewrites no assertion; any red is a classification regression, not an expected consequence." },
  { id = "EX-6", text = "doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = 'the shared table is total over the four classes and each maps to exactly one outcome plus write/no-write decision: Absent -> Wired/write, OwnedCurrent -> None/no-write, OwnedStale -> Refreshed/write, Foreign -> PrintedFallback/no-write', test_file = "src/boot.rs", keywords = ["mcp_action", "McpEntryClass", "Absent", "OwnedCurrent", "OwnedStale", "Foreign"], waived = false },
  { id = "VT-2", expects = 'the Claude planner stays green unchanged and its carried payload is the full invocation printed once at the wire seam', test_file = "src/boot.rs", keywords = ["plan_mcp_idempotent_when_current", "plan_mcp_foreign_doctrine_key_not_clobbered", "plan_mcp_migrates_legacy_abs_to_env_form", "plan_mcp_carries_the_full_invocation"], waived = false },
  { id = "VA-1", expects = 'behaviour-preservation class (i): the diff of the plan_mcp_* / is_doctrine_mcp_entry_* test block shows no assertion edited (identifier-only renames and a spelled-append expectation are the only class-ii edits allowed); the agent records the diff check in the slice notes.' },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "The codex MCP leg: planner, edit-preserving writer, report seam, sh declaration"
objective = "Register the doctrine MCP server in a project .codex/config.toml from boot install, to the Claude leg standard: a pure strict-ownership planner, a toml_edit edit-preserving narrow-path write, a distinctly reported leg whose wording states what was written, and the POL-002 facet 3 declaration of the sh dependency (DEC-323, DEC-325, DEC-332; design sec-5.2/5.3/5.4/9)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete — McpEntryClass and mcp_action exist and plan_mcp rides them." },
  { id = "EN-2", text = "Verified tree facts (2026-09-27): MCP_REL (src/boot.rs:594), MCP_SERVER_KEY (:598), PORTABLE_EXEC (:613); the Codex arm sets mcp: RefreshOutcome::None at :1702; write_codex_activation (:2684) never writes the [features] hooks key; src/boot.rs uses no toml_edit today; the house edit-preserving TOML seam is dep_seq::set_authored_status (src/dep_seq.rs:433) parsing to toml_edit::DocumentMut (:299); toml_edit = 0.22 (Cargo.toml:174); .codex/config.toml is not written by doctrine today; the codex-arm expectation at :5170 is the line that flips." },
  { id = "EN-3", text = "The design sec-5.2 strict-ownership formula and the sec-5.5 edge-case table are the specification for the planner matrix; they are not restated in criteria below." },
]
exit_criteria = [
  { id = "EX-1", text = "Constants beside MCP_REL (STD-001): CODEX_CONFIG_REL, CODEX_MCP_TABLE, CODEX_MCP_SERVER_KEY, CODEX_MCP_SHELL, CODEX_MCP_SHELL_FLAG, CODEX_MCP_SERVE_ARGS, CODEX_MCP_WRAPPER, CODEX_MCP_WRAPPER_FORMS (a slice, today one element), CODEX_MCP_ENV. const cannot compose strings, so each holds its own literal and the agreement test pins them together." },
  { id = "EX-2", text = "codex_mcp_entry() -> toml_edit::Item builds the [mcp_servers.doctrine] table ONCE, with command = CODEX_MCP_SHELL, args = [CODEX_MCP_SHELL_FLAG, CODEX_MCP_WRAPPER], env_vars = [CODEX_MCP_ENV]; the writer inserts that item and codex_mcp_fallback_snippet() renders the SAME item standalone as TOML (never the Claude JSON block)." },
  { id = "EX-3", text = "plan_codex_mcp(existing_toml: Option<&str>) -> CodexMcpPlan { class: Result<McpEntryClass, Malformed>, new_toml: Option<String> } is pure. Malformed covers an unparseable file, an mcp_servers key neither table nor inline table, and a doctrine entry neither; then new_toml is None. The insert is a narrow-path as_table_like_mut at [mcp_servers][doctrine], creating mcp_servers when absent, so a table and an inline parent both work (Item::into_value yields the container spelling; no adapter, no panic); an owned-but-stale entry is replaced wholesale." },
  { id = "EX-4", text = "Ownership is the design formula, byte-exact where it says so: key set subset of {command, args, env_vars}; command == CODEX_MCP_SHELL; args.len() == 2 checked BEFORE any index; args[0] == CODEX_MCP_SHELL_FLAG; normalise(args[1]) is a member of CODEX_MCP_WRAPPER_FORMS; env_vars absent or exactly [CODEX_MCP_ENV]. current = owned AND args[1] == CODEX_MCP_WRAPPER AND env_vars == [CODEX_MCP_ENV]. normalise trims and collapses internal whitespace runs. A plain doctrine literal, /bin/sh, a baked abspath, an extra key and a third argument are Foreign." },
  { id = "EX-5", text = "install_codex_mcp(root, dry_run) -> anyhow::Result<RefreshOutcome> reads .codex/config.toml with a NotFound-vs-any-other-error split (only ErrorKind::NotFound is None; a permission or non-UTF-8 read is malformed, never absent), plans, and writes via toml_edit + fsutil::write_atomic only when new_toml is Some and not dry_run, ensuring the parent directory. The Codex arm sets mcp: install_codex_mcp(root, dry_run).with_context(...), the leg written LAST in the arm (after the hook merge and the pi extensions) with boundary context naming how far the arm got." },
  { id = "EX-6", text = "The report seam: wire() selects the reported file from its harness (Harness::Codex => CODEX_CONFIG_REL, otherwise MCP_REL). The Claude lines keep their existing conditions, printing the payload once (PHASE-01 EX-3). For Codex the wrote-line prints iff report.mcp is Wired or Refreshed AND not dry_run, stating what was written; under dry_run it renders would write and prints nothing else. The fallback line is ONE wording for both arms and both causes (a foreign entry or an uninterpretable file) and carries the codex TOML snippet. report.mcp does NOT gate the hooks warning." },
  { id = "EX-7", text = "The stale doc comments the design names are refreshed to describe both harnesses: RefreshOutcome (src/boot.rs:940), RefreshReport.mcp (:1787), the wire() MCP block comment (:2851)." },
  { id = "EX-8", text = "The codex-arm expectation at src/boot.rs:5170 flips to a Wired/Refreshed assertion; the three Claude pinned assertions at :5121, :5129, :5157 keep their meaning; the test seeds ownership fixtures literally, never via a real installer, and every absence assertion carries a positive control." },
  { id = "EX-9", text = "POL-002 facet 3: the sh dependency is declared in README.md (installation or post-install prose), naming that the codex MCP entry executes through a POSIX sh so DOCTRINE_BIN is read, and that the declaration is not silent." },
  { id = "EX-10", text = "A no-host-abspath assertion extends the existing portable-command discipline to the codex config file, asserted on parsed values." },
  { id = "EX-11", text = "doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = 'the codex planner matrix mirrors the plan_mcp cases over the design edge table: absent -> Wired (parent ensured); current -> None; wrapper with env_vars absent -> Refreshed; a spacing variant or an earlier emitted wording -> Refreshed; a user env_vars value (extra element, wrong type, other value) -> Foreign; command sh with args [] or [-c] -> Foreign with no panic; plain doctrine -> Foreign; /bin/sh -> Foreign; wrapped abspath -> Foreign; extra key or third argument -> Foreign; mcp_servers neither table nor inline table -> Malformed; unparseable TOML -> Malformed; inline mcp_servers parent and inline doctrine entry in the emitted shape. Assertions are on parsed values, never on the bytes.', test_file = "src/boot.rs", keywords = ["plan_codex_mcp", "codex_mcp_entry", "codex_mcp_fallback_snippet", "CODEX_MCP_WRAPPER_FORMS", "OwnedStale"], waived = false },
  { id = "VT-2", expects = 'the constants agree: CODEX_MCP_WRAPPER equals the format of PORTABLE_EXEC and CODEX_MCP_SERVE_ARGS; CODEX_MCP_ENV occurs inside PORTABLE_EXEC; every CODEX_MCP_WRAPPER_FORMS member is a fixed point of normalise; CODEX_MCP_SERVER_KEY == MCP_SERVER_KEY pinned with its reason. The test fails if PORTABLE_EXEC wording changes.', test_file = "src/boot.rs", keywords = ["CODEX_MCP_WRAPPER", "PORTABLE_EXEC", "CODEX_MCP_SERVE_ARGS", "CODEX_MCP_ENV", "MCP_SERVER_KEY", "CODEX_MCP_SERVER_KEY"], waived = false },
  { id = "VT-3", expects = 'the writer is edit-preserving and creation-safe on PARSED values: absent file creates the file and parent dir; a file carrying [features] hooks = true and a comment keeps both plus sibling servers; an owned-but-stale entry is replaced wholesale; a non-UTF-8 or unparseable file is untouched with the fallback line; a second run over an unchanged file reports None with no write and no output.', test_file = "src/boot.rs", keywords = ["install_codex_mcp", "toml_edit", "as_table_like", "write_atomic"], waived = false },
  { id = "VT-4", expects = 'codex install e2e: a project whose .codex/config.toml carries [features] hooks = true and a comment gains the emitted entry (parsed value equals the design sec-5.3 table) with keys and comment intact and a second run reporting nothing to do; a project with no .codex/config.toml gets the file and parent directory created; a non-UTF-8 file is unchanged with the fallback line printed; a foreign entry second-run output is stable rather than a fresh instruction; no host abspath is present; a Claude-only run emits neither the codex file line nor a codex caveat and its MCP line prints the invocation once, with no doubled serve --mcp.', test_file = "tests/e2e_codex_install.rs", keywords = ["mcp_servers", "config.toml", "DOCTRINE_BIN"], waived = false },
  { id = "VT-5", expects = 'a dry run over an absent or stale entry prints the codex MCP line as would write MCP server registration and leaves the file unwritten. The assertion scopes to the CODEX MCP LINE, not the whole stdout: the pre-existing hook activation notice still says wrote until PHASE-03 flips it.', test_file = "tests/e2e_codex_install.rs", keywords = ["dry_run", "would write"], waived = false },
  { id = "VA-1", expects = 'the sh dependency is declared in README.md and names the POSIX shell requirement without claiming silent availability (POL-002 facet 3); the sentence and its location are recorded in the slice notes.' },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Hooks probe and disclosure folding"
objective = "Probe codex hooks state from the harness itself, never from a file, and fold the answer into the install disclosure: the activation notice states the probe result and the trust caveat prints exactly once per arm. A cwd-bound capture seam is injectable so tests need no real codex (DEC-329; design sec-5.2/5.4/9)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete — the codex leg writes and reports, so report.mcp carries the Wired/Refreshed signal the trust caveat keys on." },
  { id = "EN-2", text = "Verified tree facts (2026-09-27): the existing trait Runner (src/install.rs:1713) with run(&self, program, args) -> Result<bool> and ProcessRunner (:1720) inherit stdio and cannot capture stdout; boot::wire is called at src/install.rs:414 in install::run and at src/boot.rs:2645 in boot::run_install; the activation-notice gate is codex_hook_written && matches!(h, Harness::Codex) (src/boot.rs:2799) and write_codex_activation (:2684) prints three steps; the four wire(...) test call sites are src/boot.rs:6647, :6663, :6683, :6702." },
  { id = "EN-3", text = "The design sec-5.4 disclosure predicate (the three separate conditions) is the specification; the criteria below pin the seam and the folding, not the formula text." },
]
exit_criteria = [
  { id = "EX-1", text = "src/install.rs gains struct Capture { success: bool, stdout: String, stderr: String }, trait CommandRunner { fn run_capture(&self, program: &str, args: &[&str], cwd: &Path) -> anyhow::Result<Capture>; }, and the default struct CaptureRunner (Command::output() with current_dir(cwd)). The existing Runner/ProcessRunner are untouched; the capture seam is separate because they cannot capture stdout." },
  { id = "EX-2", text = "wire() takes the runner as a parameter; both production call sites pass &CaptureRunner (src/install.rs:414 in install::run; src/boot.rs:2645 in boot::run_install) and the four src/boot.rs test call sites pass a fake." },
  { id = "EX-3", text = "parse_codex_features(stdout: &str) -> Option<bool> is pure: the row whose first token is hooks contributes its final token, true -> Some(true), false -> Some(false); no row or any other shape -> None. It reads stdout regardless of success." },
  { id = "EX-4", text = "codex_hooks_state(run: &dyn CommandRunner, cwd: &Path) -> HooksState runs codex features list with cwd bound to the install root and is total: success with a parseable true/false row -> Enabled/Disabled; success with no parseable row -> Unknown(reason); a non-zero exit that still printed a parseable row -> the parsed answer; a runner error with useful stderr -> Unknown(reason) naming it. Nothing is gated on the probe." },
  { id = "EX-5", text = "The probe fires iff h == Harness::Codex AND codex_hook_written AND not dry_run. write_codex_activation takes state: Option<HooksState>: None (dry run) prints step 1 unconditionally as today; Some(Enabled) omits step 1; Some(Disabled) and Some(Unknown(reason)) print it naming the key or the reason. No dry_run output contains the word wrote, the activation notice included." },
  { id = "EX-6", text = "The trust caveat prints iff h == Harness::Codex AND the MCP entry was written AND not dry_run AND not codex_hook_written, stated once per arm, naming that codex loads project-scoped config only for trusted projects and skips an untrusted layer silently. It is not printed on dry_run or on PrintedFallback." },
  { id = "EX-7", text = "A Claude-only run emits neither the codex caveat nor the hooks warning; the probe does not run for Claude." },
  { id = "EX-8", text = "doctrine check gate green." },
]
verification = [
  { id = "VT-1", expects = 'parse_codex_features reads the verified shape (a hooks row ending true or false), an absent row, unexpected columns and garbage; a failed command that still printed a parseable row yields the parsed answer.', test_file = "src/boot.rs", keywords = ["parse_codex_features", "HooksState", "hooks", "true", "false"], waived = false },
  { id = "VT-2", expects = 'codex_hooks_state through an injected runner over five cases: success hooks true -> Enabled; success hooks false -> Disabled; success with empty stdout -> Unknown; non-zero exit carrying a parseable row -> the parsed answer; runner error with useful stderr -> Unknown naming that reason. One case asserts the runner received the install root as its cwd.', test_file = "src/boot.rs", keywords = ["codex_hooks_state", "CommandRunner", "Enabled", "Disabled", "Unknown", "run_capture"], waived = false },
  { id = "VT-3", expects = 'codex install e2e: with PATH emptied the REAL CaptureRunner fails and the warning carries a non-empty Unknown reason; the probe fires on a hook write even when the MCP entry was already current and does not fire when only the MCP entry was refreshed; a Claude-only run emits neither the codex caveat nor the hooks warning; and after this phase no dry_run output contains the word wrote, the codex MCP line and the activation notice both rendering would write.', test_file = "tests/e2e_codex_install.rs", keywords = ["Unknown", "trust", "hooks", "PATH", "wrote"], waived = false },
  { id = "VT-4", expects = 'the dry-run activation notice prints step 1 unconditionally with no probe run and no wrote wording, and the trust caveat is absent under dry_run and on PrintedFallback.', test_file = "src/boot.rs", keywords = ["write_codex_activation", "HooksState", "would write", "None"], waived = false },
  { id = "VA-1", expects = 'the three disclosure conditions (MCP wrote-line, probe trigger, trust caveat) are reviewed against design sec-5.4 and exercised by the named VTs; the review is recorded in the slice notes.' },
]
