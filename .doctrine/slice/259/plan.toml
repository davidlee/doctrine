# Implementation plan for SL-259 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-259"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance. The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.

[[phase]]
id        = "PHASE-01"
name      = "Truthful rows at the seam"
objective = """
Leg 2 (`DEC-248`): a material change is emitted by the code that performs it. \
Node creation reaches the same needs diff the update path runs by diffing \
against an empty prior instead of returning early, and BOTH retain-by-kind act \
stores emit their replacement row. Closes `ISS-450` and `ISS-367`.
"""
entrance_criteria = [
  { id = "EN-1", text = "The design is locked at revision 57 and `RV-365` is concluded." },
  { id = "EN-2", text = "`SL-256`'s unified admit-store-emit seam (`DEC-238`) is in place: `admit_and_record` at `run.rs:672-708` carries both `ActRecord` arms." },
  { id = "EN-3", text = "Re-verified against the tree: `run.rs:1294` returns a lone `NodeCreated` before the needs diff at `run.rs:1330`; `CheckpointActGroup::record` and `AgentDeclarationGroup::record` both retain-by-kind (`snapshot.rs:382-393`)." },
]
exit_criteria = [
  { id = "EX-1", text = "`declare_node`'s create branch no longer returns early: it diffs the declared state against an empty prior and reaches the same row-producing code the update branch runs. The create/update branch split on the diff is gone." },
  { id = "EX-2", text = "`CheckpointActGroup::record` emits `ActInvalidated` for the act it displaces — at the retain-then-push site that knows a replacement happened, not by a later set difference." },
  { id = "EX-3", text = "`AgentDeclarationGroup::record` emits `ActInvalidated` on the identical retain-by-kind. Neither store is repaired without the other (`RV-365` `F-1`)." },
  { id = "EX-4", text = "`live_acts` / `invalidation_rows` stop carrying an invalidation claim the derivation cannot keep; `live_acts`' doc comment states only what the derivation actually guarantees." },
  { id = "EX-5", text = "No row is emitted twice: the seam is the sole emitter, and any derived row that duplicated it is removed rather than left alongside." },
]
verification = [
  { id = "VT-1", expects = "A `needs` edge declared at node CREATION emits `needs_added`, with the control being the same edge declared on an existing node — the distinction that separated `ISS-450` from a dropped key.", test_file = "src/design_run/run.rs", keywords = ["a_needs_edge_declared_at_node_creation_emits_its_row", "ChangeEvent::NeedsAdded"], waived = false },
  { id = "VT-2", expects = "A same-kind CHECKPOINT act replacement emits `ActInvalidated`.", test_file = "src/design_run/run.rs", keywords = ["a_same_kind_checkpoint_act_replacement_emits_its_invalidation", "ChangeEvent::ActInvalidated"], waived = false },
  { id = "VT-3", expects = "A same-kind AGENT DECLARATION replacement emits `ActInvalidated` — pinned separately per act store, because a single undifferentiated case is what let one store go unrepaired (`sec-8` leg 2).", test_file = "src/design_run/run.rs", keywords = ["a_same_kind_agent_declaration_replacement_emits_its_invalidation"], waived = false },
  { id = "VA-1", expects = "Grep confirms no remaining retain-by-kind act store emits no row: every `retain(|held| held.act.kind() != …)` site in `snapshot.rs` is covered by EX-2 or EX-3." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Degrade history, disclose it"
objective = """
Leg 4 (`DEC-249`, `DEC-251`): a change-log row carrying an unrecognised token is \
retained opaquely AT THE ROW and disclosed as unreadable with its classified \
reason, rather than failing the file. `ChangeEvent` is deliberately untouched. \
Closes `ISS-315`. Storage and disclosure land together so `STD-003` is never \
violated at a phase boundary.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete — the emission sites are settled before the row's storage type changes under them." },
  { id = "EN-2", text = "Re-verified: `ChangeLog`'s method surface is exactly `record` / `retain_window` / `covers` / `since`; the only external field read is `floor` (`envelope.rs:560`, `:1064`), and the sole production consumer of the contents is `envelope.rs:1071` via `since()` (`RV-365` `F-6`)." },
  { id = "EN-3", text = "Known test-only readers of `.rows` that the type change will touch: `snapshot.rs:767`, `:816` and `commands/design.rs:2878`. These are tests, not production — `sec-5`'s encapsulation claim is about production and holds." },
]
exit_criteria = [
  { id = "EX-1", text = "`change_log.rs` carries `enum StoredRow { Read(ChangeRow), Unreadable(RawRow) }`, `struct RawRow { revision, index, raw, why }` and `enum Unreadable { Event, PayloadKey, ValueKind, TermTooLong }`; `ChangeLog.rows` is `Vec<StoredRow>`." },
  { id = "EX-2", text = "`record`, `retain_window`, `covers` and `since` handle both arms. Retention and ordering read `revision`/`index` off either arm identically." },
  { id = "EX-3", text = "Deserialisation is an ORDERED TRY that classifies the cause at the point of failure — the `why` is captured where it is known, never re-derived by the renderer (`RV-365` `F-4`, `STD-003`)." },
  { id = "EX-4", text = "`revision` and `index` stay REQUIRED on `RawRow`: a structurally broken row still refuses. The tolerance is for vocabulary, never for rows that cannot be placed." },
  { id = "EX-5", text = "`render/envelope.rs` discloses each degraded row as unreadable AND names its `why`. A degraded read is disclosed with what was skipped and why (`STD-003`)." },
  { id = "EX-6", text = "`ChangeEvent` is untouched: still closed, `Copy`, `const fn as_str(self) -> &'static str`, and both `const _: ()` proofs at `change_log.rs:98` and `:113` intact. `sec-9` `R3` — `is_subset(&EMITTABLE, &READABLE)` is the only reader of `EMITTABLE` in `src/`; deleting it passes `cargo check` and fails `cargo test --bin doctrine`." },
  { id = "EX-7", text = "The opacity reaches change-log rows and nothing else. The delegation group's `Vec<Declaration>` is NOT given `StoredRow` treatment — `DEC-249` puts stored state on the refusing side (`RV-365` `F-3`); `IMP-446` carries that repair." },
]
verification = [
  { id = "VT-1", expects = "`snapshot::parse` over a LITERAL LEGACY FRAGMENT carrying a retired `ChangeEvent` token parses, retains the row, and classifies it `Unreadable::Event`. Copy the shape of `a_snapshot_written_before_the_policy_reads_as_human_only` (`snapshot.rs:677`). A unit round-trip over the inner type does NOT discharge this.", test_file = "src/design_run/snapshot.rs", keywords = ["a_snapshot_carrying_a_retired_change_event_token_retains_the_row", "Unreadable::Event"], waived = false },
  { id = "VT-2", expects = "A change-log row missing `revision` (or `index`) still REFUSES the parse — tolerance is not leniency about row shape (`sec-5`).", test_file = "src/design_run/snapshot.rs", keywords = ["a_change_log_row_missing_its_revision_is_still_refused"], waived = false },
  { id = "VT-3", expects = "The rendered envelope discloses a degraded row WITH its reason, and a wrong reason fails the test — pinned the way leg 3 pins a refusal's reason (`sec-8` leg 4).", test_file = "src/design_run/render/envelope.rs", keywords = ["a_degraded_row_is_disclosed_with_the_reason_it_was_unreadable", "Unreadable"], waived = false },
  { id = "VA-1", expects = "Behaviour preservation: `ChangeEvent`'s existing suites are green UNCHANGED — `git diff` shows no edit to them. That is the evidence `DEC-251` sited the opacity correctly and the gate `AGENTS.md` requires when shared machinery moves." },
  { id = "VA-2", expects = "`doctrine design show 244` reads. It fails today; that failure is `ISS-315`." },
]
specs        = []
