# Implementation plan for SL-198 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-198"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (.doctrine/glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated, structured mandate), VA-1 agent check, VH-1 human.

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-01"
name      = "Per-worktree dispatch record + lifecycle"
objective = """
The trusted create-fork hook writes an atomic per-worktree record \
{name, dir, branch, base=B, coord} at the fork point (pre-worker); reap/gc \
deletes it. A resolver maps an opaque, sanitised agent-id -> that record on \
exactly one live, consistent hit, else a typed refusal. This is the trust \
anchor worker_commit (PHASE-02) consumes: no worker-supplied path enters \
resolution (design 5.2/5.3, 10 pass-2)."""
entrance_criteria = [
  { id = "EN-1", text = "SL-198 design locked (codex LOCK-READY-WITH-THIS); create.rs fork path (fork_core, write_atomic:257, sanitise_name:112) and gc reap (gc.rs:36/203) confirmed present against the current tree." },
]
exit_criteria = [
  { id = "EX-1", text = "create-fork writes the per-worktree record (name, dir, branch, base=B, coord) atomically beside the jail policy at the fork point, before the worker's first tool call; base sourced at fork time, not the mutable arming slot." },
  { id = "EX-2", text = "reap/gc deletes the record when removing the worker worktree; a record with no live worktree is never left behind (stale-oracle closed)." },
  { id = "EX-3", text = "resolve_agent(agent) returns the record on exactly one live consistent hit; refuses unknown-agent (0 hits), ambiguous-agent (>1 live hit), stale-record (dir absent / branch unresolved / HEAD != base). agent is sanitised via the single sanitise_name validator before any path join." },
  { id = "EX-4", text = "resolution keys on the worker branch dispatch/<agent> via the existing git worktree list --porcelain seam (worktree_for_ref, git.rs:555/1335): git guarantees at most one worktree per branch, so a valid agent resolves to exactly one worktree with no new coord registry and no worker path input. ambiguous-agent is retained as a defensive refusal (normally unreachable under the per-branch invariant; fires only if git ever reports >1)." },
]
verification = [
  { id = "VT-1", expects = "create-fork writes the record with all five fields; asserted at the fork point.", test_file = "src/worktree/create.rs", keywords = ["DispatchRecord", "coord", "base"] },
  { id = "VT-2", expects = "reap/gc removes the record; a post-reap resolve of the same agent yields unknown-agent.", test_file = "src/worktree/gc.rs", keywords = ["DispatchRecord"] },
  { id = "VT-3", expects = "resolver refusal table (unknown-agent, ambiguous-agent, stale-record) plus a happy single-hit resolve; agent sanitised before any path join.", test_file = "src/worktree/create.rs", keywords = ["unknown-agent", "ambiguous-agent", "stale-record", "sanitise_name"] },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-02"
name      = "Gated worker_commit MCP tool (keystone, IMP-253)"
objective = """
Register mcp__doctrine__worker_commit in the doctrine MCP server. Handler: \
resolve the opaque agent-id via PHASE-01, then cheap-first belts: non-empty \
pre-fmt in-scope delta -> scope belt (classify_import vs design-target \
selectors, reject .doctrine/ and .claude/) -> HEAD==B -> then the mutating \
check commit gate (resolve_check(Commit)) -> exactly one non-merge commit C, \
C^==B. Reuse classify_import and resolve_check; no re-implementation. Pin \
dispatch-worker tools: to grant exactly this tool (design 5.2, 7 D2, 10 X4)."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete: the record + resolve_agent + refusal table exist and are green." },
  { id = "EN-2", text = "Reuse seams confirmed: classify_import (scope), resolve_check(CheckKind::Commit) -> DEFAULT_COMMIT (verify.rs:208), MCP tools/call entrypoint (tools.rs:395) with no caller agent_id (opaque-id resolution only)." },
]
exit_criteria = [
  { id = "EX-1", text = "worker_commit registered and callable; input { agent, message }; returns { oid, base } or a typed refusal. No dir/path parameter." },
  { id = "EX-2", text = "Belts run cheap-first: sanitise+resolve -> non-empty pre-fmt delta -> scope (classify_import, two-tier) -> HEAD==B -> check commit gate -> commit. Hard refusals: unknown-agent/ambiguous-agent/stale-record/empty-delta/forbidden-zone/not-at-base/commit-gate-red." },
  { id = "EX-6", text = "Scope belt is two-tier (owner steer): a write to an escalation zone (.doctrine/**, .claude/**, .agents/**, install/agents/**, build/gate config) HARD-refuses (forbidden-zone); a src write outside the design-target selectors but in no forbidden zone COMMITS and is reported as undeclared:[paths] in the result (soft warn — orchestrator amends selectors or rejects at import; feeds the audit conformance delta). Undeclared paths are never silently dropped and never hard-block." },
  { id = "EX-3", text = "On success exactly one non-merge commit lands on the worker's dispatch/<agent> branch with C^==B, parents(C)==1; the worker's raw Bash git commit remains walled (ro .git)." },
  { id = "EX-4", text = "dispatch-worker agent-def tools: pinned to add exactly mcp__doctrine__worker_commit and no other writable MCP token." },
  { id = "EX-5", text = "The commit includes ONLY the pre-fmt in-scope declared paths: a repo-wide check-commit fmt that normalises pre-existing/out-of-scope files does not drag them into the commit (closes F2 — the belt scopes the pre-fmt intended delta, and the commit stages exactly those classified paths, not the post-fmt working-tree diff)." },
]
verification = [
  { id = "VT-1", expects = "Hard belt refusals each fire: unknown/ambiguous/stale, empty-delta, forbidden-zone (.doctrine/.claude/agent-defs/gate-config), not-at-base (HEAD!=B), commit-gate-red.", test_file = "src/mcp_server/worker_commit.rs", keywords = ["forbidden-zone", "not-at-base", "empty-delta", "commit-gate-red"] },
  { id = "VT-5", expects = "Soft tier: a src write outside the design-target selectors (no forbidden zone) COMMITS and returns undeclared:[that path]; a forbidden-zone write in the same call still hard-refuses.", test_file = "src/mcp_server/worker_commit.rs", keywords = ["undeclared", "forbidden-zone"] },
  { id = "VT-4", expects = "F2 guard: a worktree with a pre-existing out-of-scope mis-formatted file, plus an in-scope change, yields a commit containing ONLY the in-scope path after the gate's fmt runs.", test_file = "src/mcp_server/worker_commit.rs", keywords = ["fmt"] },
  { id = "VT-2", expects = "Happy path: in-scope, gate-green tree -> one non-merge commit, C^==B, parents==1; returns { oid, base }.", test_file = "src/mcp_server/worker_commit.rs", keywords = ["worker_commit", "parents"] },
  { id = "VT-3", expects = "Belt reuse: worker_commit and the import path agree on the scope verdict for the same change-set (classify_import shared, not forked).", test_file = "src/mcp_server/worker_commit.rs", keywords = ["classify_import"] },
  { id = "VA-1", expects = "Scope belt genuinely rejects a .doctrine/.claude write and an out-of-selector src write; confirmed by an agent reading the belt wiring, not only token presence." },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-03"
name      = "Orchestrator commit-import switch (claude arm) + doctrine note"
objective = """
Retire the working-tree-diff import on the claude arm: the (still main-thread) \
orchestrator imports the worker's commit via run_import's fork/commit path with \
the --branch dispatch/<agent> coherence belt (subagent.rs:316), binding the \
import to the branch it armed (bounds the X1 residual). run_verify_worker's \
expectation relaxes from HEAD==B to 'HEAD one non-merge commit, HEAD^==B'. \
Subprocess arm keeps --from-worktree untouched. Update CLAUDE.md # orchestration \
(design 5.4, 10 X3)."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete: worker_commit lands a commit on the worker branch." },
  { id = "EN-2", text = "run_import fork path + run_verify_worker --branch coherence belt confirmed reusable (import.rs, subagent.rs:316/328)." },
]
exit_criteria = [
  { id = "EX-1", text = "Claude-arm orchestrator imports the worker COMMIT (run_import fork path) with --branch coherence, not the working-tree diff; the diff-dance is retired on the claude arm only." },
  { id = "EX-2", text = "run_verify_worker accepts HEAD as one non-merge commit above B (HEAD^==B) for the post-commit claude case without disturbing the subprocess arm's HEAD==B expectation." },
  { id = "EX-3", text = "Subprocess arm import (--from-worktree) unchanged; existing funnel/import suites stay green (behaviour-preservation gate)." },
  { id = "EX-4", text = "CLAUDE.md # orchestration note reflects worker self-commit (claude arm) with the diff-import retained for subprocess + MCP-down fallback." },
  { id = "EX-5", text = "CLAUDE.md # orchestration pre-dispatch ritual adds: orchestrator runs fmt on trunk/main BEFORE arming, so base B is fmt-clean at fork (F2 does not arise operationally; the stage-classified-paths invariant remains the fallback)." },
]
verification = [
  { id = "VT-1", expects = "verify-worker --branch rejects a dir<->branch mismatch (branch-mismatch); accepts HEAD one non-merge commit above B.", test_file = "src/worktree/subagent.rs", keywords = ["branch-mismatch", "is-ancestor"] },
  { id = "VT-2", expects = "Existing import/funnel suites (subprocess arm, --from-worktree) remain green unchanged.", test_file = "src/worktree/import.rs", keywords = ["from-worktree", "fork"] },
  { id = "VA-1", expects = "End-to-end on the claude arm: a jailed worker whose raw git commit is walled calls worker_commit; the delta lands as one commit; the orchestrator imports it onto dispatch/<slice>. Requires the live harness — agent-verified." },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-04"
name      = "Worker tool-surface conformance lint (RSK-225 mitigation)"
objective = """
Because MCP writes bypass the SL-182 wall, jail completeness now depends on the \
worker tools: list being pinned. Add a conformance lint (ride doctrine doctor, \
already in just validate -> check/gate) over the AUTHORED agent-defs \
.doctrine/agents/** + install/agents/** (NOT the installed .claude/ copy). The \
doctrine-role marker is MANDATORY (deny-by-default): an unmarked def used as a \
dispatch worker is a lint failure. A marked worker/orchestrator def may hold no \
writable mcp__* token except mcp__doctrine__worker_commit (design 5.2, 10 X3)."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 pinned dispatch-worker's tools: (the lint's passing fixture)." },
  { id = "EN-2", text = "Lint host confirmed at phase-plan: ride doctrine doctor (DRY — just validate runs it in check + gate); no parallel lint host." },
]
exit_criteria = [
  { id = "EX-1", text = "Lint scans .doctrine/agents/** + install/agents/** (authored + install trees), not .claude/agents (installed copy)." },
  { id = "EX-2", text = "doctrine-role marker is mandatory: an unmarked def is a lint FAILURE (deny-by-default), not a doc gap." },
  { id = "EX-3", text = "A marked def granting any writable mcp__* token beyond mcp__doctrine__worker_commit (or a bare mcp__doctrine server grant) fails the lint with the offending token + file; the pinned dispatch-worker passes." },
  { id = "EX-4", text = "The lint is wired into just validate (-> check + gate) via doctrine doctor and runs zero-warning on the current tree." },
]
verification = [
  { id = "VT-1", expects = "Lint FAILS an unmarked worker def, a marked def with an extra writable MCP token, and a bare mcp__doctrine grant; PASSES the pinned dispatch-worker.", test_file = "src/commands/doctor.rs", keywords = ["doctrine-role", "mcp__doctrine__worker_commit", "install/agents"] },
  { id = "VH-1", expects = "Owner confirms the allowlist semantics (only worker_commit, no third-party writability introspection) match intent before close." },
]
specs        = []
requirements = []
