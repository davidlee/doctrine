[[phase]]
id        = "PHASE-16"
name      = "End-to-end acceptance drive (unjail)"
objective = """
Run the shipped `/drive-slice` against a real multi-phase scratch slice in a \
dispatch coord tree and assert every load-bearing UNJAIL invariant in anger: \
phases drive to Completed via typed HopReceipts consumed by the JS loop; the \
alternating O/W topology holds (one O between two workers, two jobs); an injected \
red verify halts the loop without auto-merge (SL-199 §D intact, coord tip \
