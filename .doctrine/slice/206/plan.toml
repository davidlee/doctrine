entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 landed: tools registered, allowlist grown, probe role known to doctor" },
]
exit_criteria = [
  { id = "EX-1", text = "install/agents/claude/dispatch-probe.md exists: doctrine-role: probe, MCP tokens = exactly the three reads, NO raw Write/Edit/Bash/Agent" },
  { id = "EX-2", text = "dispatch-orchestrator.md tools: lists the three new read-only MCP tokens alongside the funnel tokens" },
  { id = "EX-3", text = "doctor check #9 green on all three defs (worker, orchestrator, probe) — each def's mcp tokens ⊆ its role allowlist" },
  { id = "EX-4", text = "install/workflows/drive-slice.js (or the agreed home, OQ-1) exists: budget-adaptive loop, per-phase orchestrator with PhaseReceipt schema, named HALT contract, no auto-merge; halt vocabulary references named members not inline literals" },
  { id = "EX-5", text = "The reference script and defs are seeded by doctrine install (or the documented placement per PHASE-01/ISS-216)" },
  { id = "EX-6", text = "SELECTOR GATE (audit-clean): the moment OQ-1 fixes the /drive-slice authored home, that committed path is registered as a design-target selector — `doctrine slice selector add SL-206 <home> --intent design-target` — BEFORE the script is committed. The 7 current design-targets do NOT cover install/workflows/**; .claude/workflows/** is scope-relevant AND gitignored (installed copy only), so an unregistered committed script reds conformance as undeclared" },
  { id = "EX-7", text = "The 'seeded by doctrine install' claim (EX-5) is made real OR explicitly waived — no hand-wave: either src/install.rs grows a dispatch-probe agent-def asset registration + a workflows seeding leg (install enumerates hardcoded assets today; covered by the scope-relevant src/** selector), or EX-5 is narrowed to the documented manual placement (PHASE-01/ISS-216) and the install claim struck" },
]
verification = [
  { id = "VT-1", expects = "doctor conformance: probe + orchestrator + worker defs all pass check #9 with the grown allowlist", test_file = "src/doctor_checks.rs", keywords = ["ROLE_PROBE", "agent_conformance_findings"], waived = false },
  { id = "VA-1", expects = "Agent inspects dispatch-probe.md: doctrine-role probe, exactly the three read MCP tokens, no raw write/bash/agent tools" },
  { id = "VA-2", expects = "Agent inspects /drive-slice: budget-adaptive loop, PhaseReceipt schema on the per-phase orchestrator agent(), named HALT contract (no inline halt literals), no auto-merge path, probes via dispatch-probe" },
