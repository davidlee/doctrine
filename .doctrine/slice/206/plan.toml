# ═════════════════════════════════════════════════════════════════════════════
# UNJAIL REWORK — PHASE-08..16 (appended 2026-07-06 after the §5 unjail re-open).
# PHASE-01..07 are FROZEN as the confined-model historical record: PHASE-06/07's
# coord-root PLACEMENT fix is RETIRED by design §5.4 (the confined orchestrator is
# superseded by the nominated-UNJAIL orchestrator; unjail-direction.md P1/P3/P4).
# None of the confined design-targets landed — the Rust emitter, ROLE_PROBE,
# dispatch-probe.md, and install/workflows/drive-slice.js do NOT exist; the
# confined POC lived only in gitignored .claude/+.dispatch copies. So PHASE-08..16
# build the unjail design from the Rust down. Ordering: derisk → projection →
# read-only tools+allowlist → nomination hook config → conformance checks that
# validate it → agent defs → the alternating-unjail driver → ADR-008 amendment →
# e2e acceptance. Rationale + the confined→unjail why in plan.md.
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# PHASE-08 — De-risk gate (UNJAIL). Kills or greenlights the unjail approach
# before any code is written, against a scratch slice with shipped machinery +
# the nomination hooks. Supersedes the confined PHASE-01. A failure re-enters
# /design, not /plan.
# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-08"
name      = "De-risk gate (unjail): worker fork-at-base + P5 handoff + Workflow-seam gate + revive-base"
objective = """
Empirically confirm the load-bearing UNJAIL harness premises before investing in \
the receipt plumbing, against a throwaway scratch slice. (1) R4: a workflow \
`agent(isolation:'worktree')` WORKER leaf (not a nested confined orchestrator) \
mints its fork AT the armed base on `dispatch/<n>`. (2) OQ-3/P5: prove which \
handoff mode a claude-arm worker leaf runs — a successful `worker_commit` landing \
a non-null `fork_tip` (mode B, target), OR an explicit recorded fall-to-(A) with \
the P5 failure reason; a silent degrade is a FAILURE. (3) OQ-4 Workflow-seam: a \
jailed subagent attempting a privileged `agent()`/`Workflow` spawn is DENIED \
(caller-identity gate if the seam carries it, else the blanket subagent-deny \
default §5.6). (4) OQ-6: probe whether the `WorktreeCreate` arming hook can \
redirect a revive worktree's fork BASE ref to an existing `fork_tip` (mechanism 1) \
or only cwd (falls to mechanism 2, worker-side reset + `worker_commit` re-stamp). \
(5) R6/ISS-216: a CHANGED agent-def is confirmed live under `.claude/agents/` via \
reseat or documented manual placement. Uses shipped SL-199 machinery + the \
nomination/spawn-gate hooks; no receipt code. A failure re-enters `/design`."""
entrance_criteria = [
  { id = "EN-1", text = "design.md locked (unjail §5); RV-258 done with no open blocker" },
  { id = "EN-2", text = "edge promoted to main; a throwaway scratch slice + dispatch coord tree on dispatch/<n> available" },
]
