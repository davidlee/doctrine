refused/absent against the INSTALLED def (grant gate runtime probe, F2), exercised \
as an EXPLICIT standalone step (not inferred from a clean happy-path); the \
Workflow-seam escalation attempt is denied; the authored_divergence advisory emits \
(never gates); the budget loop paces under +Nk and runs unmetered under null total. \
Arming PROVEN: the happy-path boundary.code_start == the pre-arm coord tip B (the \
worker forked at the armed base, not a Passthrough fresh-fork)."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-14 landed (driver live, reseated) + PHASE-13 defs installed; a multi-phase scratch rig on dispatch/<n>; DOCTRINE_BIN serves the slice binary" },
]
exit_criteria = [
