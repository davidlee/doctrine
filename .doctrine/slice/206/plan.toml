# scratch slice end-to-end; asserts the safety + halt invariants hold in anger.
# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-05"
name      = "End-to-end acceptance drive"
objective = """
Run the shipped `/drive-slice` against a real multi-phase scratch slice in a \
dispatch coord tree and assert every load-bearing invariant in anger: phases \
drive to Completed via typed PhaseReceipts; an injected red verify halts the loop \
without auto-merge; a forbidden review_*/memory_* write attempted from a spawned \
agent is refused/absent against the INSTALLED def (grant gate, F2 runtime probe); \
the authored_divergence advisory emits (never gates); the budget loop paces under \
a set +Nk target and runs unmetered when total is null."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 landed: defs + reference script live (installed per PHASE-01 procedure)" },
]
exit_criteria = [
  { id = "EX-1", text = "A multi-phase scratch slice drives to all-Completed via /drive-slice; each phase returns a valid typed PhaseReceipt consumed by the JS loop" },
  { id = "EX-2", text = "An injected red verify (verify.green=false) halts the loop at that phase; no funnel integrate/auto-merge occurs (SL-199 §D boundary intact)" },
  { id = "EX-3", text = "A forbidden review_*/memory_* write from a spawned agent is refused/absent against the installed def; granted funnel tools are callable (grant gate proven at runtime, not just source)" },
  { id = "EX-4", text = "authored_divergence advisory emits in the final report and is never acted on; budget loop paces under +Nk and runs unmetered under null total" },
]
verification = [
