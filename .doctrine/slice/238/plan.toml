# Implementation plan for SL-238 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-238"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable (glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance. The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-01"
name      = "Authored-status vocabulary and the engine reader"
objective = """
Land §3's substrate: the status vocabulary in `kinds` (leaf), the per-kind status
reader as a new engine module `src/authored_status.rs`, the `authored_class`
adapter over `partition::status_class`, and the collapse of
`catalog::scan::status_and_title_for` onto the same reader as its command-tier
overlay. Nothing on any CLI surface changes; every later phase reads terminality
through what this phase builds.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §3 and §8 read. Per DEC-242 the red suite is authored by a seat with no access to `proto/SL-238-types`; the planner and code author may read it as an oracle only." },
  { id = "EN-2", text = "`just check` green at the phase's base commit, and `git status --porcelain` clean of unexpected staged paths." },
]
exit_criteria = [
  { id = "EX-1", text = "`src/kinds/mod.rs` declares `STATUS_LESS = &[REC]`, `DERIVED_STATUS = &[RV]` and `enum AuthoredStatus { Known(String), Absent, Unavailable }` beside the existing membership constants. `Axis` is NOT added here — it is backlog-local (§8)." },
  { id = "EX-2", text = "`src/authored_status.rs` exists at engine tier carrying `Authored { status, title }` and `read(root, kref: &KindRef, id) -> anyhow::Result<Authored>` — three arms static on the two kind sets, one `meta::read_meta` on the common path, `kref` a plain borrow with no `'static` bound." },
  { id = "EX-3", text = "`catalog::scan::title_for` is absorbed into `authored_status::read` as its lenient title reader and no longer exists as a second lenient reader outside `meta.rs`'s `IdOnly` confinement." },
  { id = "EX-4", text = "`src/main.rs` declares `mod authored_status;`." },
  { id = "EX-5", text = "`priority::partition::authored_class(kind, &AuthoredStatus) -> StatusClass` exists over `status_class`, and the `Unavailable -> Unrecognised` rule is stated exactly once, in the policy module." },
  { id = "EX-6", text = "`catalog::scan::status_and_title_for` delegates to `authored_status::read` and maps only the `Unavailable` arm through `review::derived_status_string`; its two inline `RV`/`REC` arms are gone." },
  { id = "EX-7", text = "`.doctrine/adr/001/layering.toml` carries one authored row classifying `authored_status` as engine — no accepted-violation entry, no tangle-baseline movement." },
  { id = "EX-8", text = "`src/meta.rs` is unmodified (§7, §8 — a design commitment, not an omission)." },
  { id = "EX-9", text = "`catalog::scan` is consumed by the 24-kind corpus walk behind `search`, `map` and `catalog`; those suites are green UNMODIFIED. The overlay is a delegation, not a behaviour change, and a suite edited to pass is a finding." },
]
verification = [
  { id = "VT-1", expects = "`authored_status read returns a known status for each admissible target kind`; `... returns Absent for a status-less kind`. One read per call, title and status from the same parse.", test_file = "src/authored_status.rs", keywords = ["AuthoredStatus", "read_meta", "returns_a_known_status"], waived = false },
  { id = "VT-2", expects = "`authored_status read returns Unavailable for a derived status kind without reading` — a fixture whose toml DOES carry `status = \"open\"` still returns `Unavailable`, so the arm is static on the kind set rather than a read outcome. AMENDED 2026-08-16 (PHASE-01 T2, owner accepted): the original fixture was `no toml at all`, which §3's arm table contradicts — both special arms take a lenient title read, so an absent file is `Err`, not `Ok(Unavailable)`. Three supports agree: §3 rule 3 (a short-circuiting arm would launder a CORRUPT `RV` into `Ok(Unavailable)`, the exact STD-003 violation the rule forbids); the overlay needs the title (`catalog::scan` reads every `RV` on every walk); and EX-9 (today's `title_for` already `Err`s on a missing `RV` toml, so short-circuiting would be a behaviour CHANGE in a phase that is a delegation). `without reading` names the STATUS read, which is never attempted — not the title read, which always is. The design-text half of this correction (§7's VT-2 bullet) is carried to reconcile in `notes.md`.", test_file = "src/authored_status.rs", keywords = ["Unavailable", "without_reading"], waived = false },
  { id = "VT-3", expects = "`authored_status read returns Err on a present but unparseable toml` — never `Unavailable`, never `Absent`. STD-003: the two signals stay distinct at the type level.", test_file = "src/authored_status.rs", keywords = ["unparseable"], waived = false },
  { id = "VT-4", expects = "`authored_class never returns Terminal for Unavailable` — the standing rule as an assertion; `Terminal` is the one class the footer suppresses.", test_file = "src/priority/partition.rs", keywords = ["authored_class", "AuthoredStatus", "never_returns_terminal"], waived = false },
  { id = "VT-5", expects = "`the derived status kind set is pinned` — `DERIVED_STATUS == [RV]` and `STATUS_LESS == [REC]`, so a future kind that derives its status and is not added fails here rather than degrading quietly.", test_file = "src/kinds/mod.rs", keywords = ["DERIVED_STATUS", "STATUS_LESS"], waived = false },
  { id = "VT-6", expects = "`catalog scan status_and_title_for delegates to authored_status`, asserted by behaviour: one `RV` fixture yields its derived status through `catalog::scan` and `Unavailable` through the engine reader, from one read path. This is what makes VT-5's pin bind behaviour rather than a membership list.", test_file = "src/catalog/scan.rs", keywords = ["authored_status", "status_and_title_for", "delegates"], waived = false },
  { id = "VT-7", expects = "`catalog scan yields status and title from one parse` — SL-050 `F-1` preserved across the move; a regression is a doubled parse on a 24-kind walk.", test_file = "src/catalog/scan.rs", keywords = ["one_parse", "status_and_title_for"], waived = false },
  { id = "VT-8", expects = "`tests/architecture_layering.rs` stays green with the command tangle baseline unchanged at 76 and no new accepted violation; the authored row for `authored_status` is what the suite reads.", test_file = ".doctrine/adr/001/layering.toml", keywords = ["authored_status", "command = 76"], waived = false },
  { id = "VA-1", expects = "One per-ref status reader survives: grep shows no second `match` on `kref.kind.prefix` selecting a status strategy, and `STATUS_LESS`/`DERIVED_STATUS` have exactly one consumer each. Run with a positive control so an empty result is a known absence." },
  { id = "VA-2", expects = "`src/meta.rs` is unmodified — `git diff` over the phase's landed range names no change to it." },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-02"
name      = "Characterisation: pin the before-state of every deliberately changed leg"
objective = """
§7 requires that deliberately changed behaviour has its before-state pinned first,
so the change is visible as a change rather than as a passing test that was always
going to pass. `--prune` has no coverage at all, in either of its two copies, and
R3 names that as the slice's untested leg. This phase adds characterisation tests
only — no production line moves — pinning today's `--prune` behaviour in both
copies and today's `after --remove` target gate. PHASE-06 and PHASE-07 then
supersede these tests deliberately, each replacement stating what it now asserts
and why the old assertion no longer holds.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §6 (`--prune`'s probe, collapsed; the remove path gates the source, not the target) and §7 (Characterisation first) read. Written from the current production tree, never from `proto/SL-238-types` (DEC-242)." },
  { id = "EN-2", text = "PHASE-01 landed and green." },
]
exit_criteria = [
  { id = "EX-1", text = "Today's `--prune` behaviour is pinned in BOTH copies (`backlog.rs`'s leg and `commands/dep_seq.rs`'s): the `resolved`/`closed` terminal vocabulary, the `/resolution` reason suffix, the silent keep on a target whose toml will not read, and a hand-authored bare `to = \"154\"` being dropped without the target being read at all." },
  { id = "EX-2", text = "Today's `after --remove` refusal of a target that does not resolve on disk is pinned." },
  { id = "EX-3", text = "The phase's diff touches test modules only — no production statement changes. `just gate` green." },
  { id = "EX-4", text = "Each characterisation test carries a comment naming the phase that will supersede it and the design section that authorises the change, so a later reader cannot mistake a superseded pin for a regression." },
]
verification = [
  { id = "VT-1", expects = "`commands::dep_seq::run_after_prune`'s current vocabulary, reason wording, silent-keep-on-unreadable and bare-ref-deletion are each pinned by a named test that passes against today's code. AMENDED 2026-08-16 (PHASE-02 planning): `test_file` moved from `src/commands/dep_seq.rs` to the black-box golden file, and `keywords` with it. The reason wording this criterion pins is written straight to `std::io::stdout()` with no pure render seam, so an in-module test cannot observe it (`mem.pattern.testing.black-box-cli-golden`: the unit tests write to stdout WITHOUT capturing it) and extracting a seam would be a production statement change, which EX-3 forbids. `verify-vt` judges this row against the named file, so the field is load-bearing rather than documentary. The e2e file invokes the CLI and so never contains the identifier `run_after_prune`; the keyword is the test-name stem instead. `design.md` §7 names the assertions, not their file, and needs no correction.", test_file = "tests/e2e_dep_seq_verbs.rs", keywords = ["after_prune_pins", "closed/wont-do"], waived = false },
  { id = "VT-2", expects = "The same four behaviours are pinned against `backlog.rs`'s duplicate prune leg, so the collapse in PHASE-07/PHASE-08 can be shown behaviour-preserving where it should be. Two wording divergences from the top-level copy are pinned with them: the unparseable reason renders `(unparseable)` rather than `absent (unparseable ref)`, and the echo prefix is the CANONICAL source id where the top-level copy echoes the source string as typed. AMENDED 2026-08-16 (PHASE-02 planning): `test_file`/`keywords` moved to the black-box golden file for the reason recorded on VT-1.", test_file = "tests/e2e_dep_seq_verbs.rs", keywords = ["backlog_after_prune_pins", "(unparseable)"], waived = false },
  { id = "VT-3", expects = "`after --remove` refuses a target that does not resolve — pinned as today's behaviour, and deliberately superseded by PHASE-06/EX-3. The pin asserts the refusal AND that the edge survives it: the pre-existing `after_remove_nonexistent` refuses a target with no edge present, so it never demonstrates §6's actual gap (the ref is unremovable and hand-editing the toml is the only path). AMENDED 2026-08-16 (PHASE-02 planning): `test_file`/`keywords` moved to the black-box golden file for the reason recorded on VT-1.", test_file = "tests/e2e_dep_seq_verbs.rs", keywords = ["after_remove_pins", "does not resolve"], waived = false },
  { id = "VA-1", expects = "The phase's diff is test-only: `git diff` over the landed range shows changes inside `#[cfg(test)]` modules exclusively." },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-03"
name      = "The doctor check: authored refs that name nothing"
objective = """
§5, and it is GREENFIELD — no prototype code exists for any of it (DEC-242's third
consequence). Add `dep_seq_ref_findings` beside `lifecycle_findings`, the tolerant
diagnostic reader `read_all_tolerant` with its `ReadFailure`, and the one `extend`
in `run_doctor` under the existing `RelationIntegrity` category. This is the home
the errors go to before §2 deletes the only place they are currently mentioned, so
it lands before the footer change rather than after it, and its count semantics —
every item including terminal ones, both axes, undeduplicated — are what PHASE-04's
stderr advisory has to agree with.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §5 read in full, including `When the check itself cannot read the corpus`. No skeleton exists for this section; plan and implement it as greenfield rather than as a diff against something (DEC-242)." },
  { id = "EN-2", text = "PHASE-02 landed and green." },
]
exit_criteria = [
  { id = "EX-1", text = "`backlog::dep_seq_ref_findings(root: &Path) -> Vec<String>` exists beside `lifecycle_findings`, returning lines rather than `Finding`s — the hand-back shape `relation_graph::validate_relations` already uses." },
  { id = "EX-2", text = "`read_all_tolerant(root) -> (Vec<BacklogItem>, Vec<ReadFailure>)` and `struct ReadFailure { entity, reason }` exist. `read_all` keeps its fail-fast contract unchanged — this is a second named reader, not a change to the first." },
  { id = "EX-3", text = "`run_doctor` extends `RelationIntegrity` with the new lines via `Finding::from_lines`, immediately after the existing relation-integrity leg. No new `Category` variant is minted." },
  { id = "EX-4", text = "The check covers every backlog item INCLUDING terminal ones, both axes, undeduplicated, and judges resolution only — admissibility is explicitly not folded in (§5, §9 follow-up)." },
  { id = "EX-5", text = "The verdict comes from `kinds::parse_resolvable_ref`; the wording is re-classified with a second pure `parse_canonical_ref` call into exactly two reasons — `not a canonical ref` and `no such entity`. The resolver's own `dir.display()` message is never folded into a finding." },
  { id = "EX-6", text = "A read failure is disclosed as a finding beside the items that did parse, and the walk continues (STD-003: tolerate AND disclose). A missing kind tree is still the empty set, not a failure — `entity::scan_ids`'s total-function tolerance is preserved." },
]
verification = [
  { id = "VT-1", expects = "`a malformed needs ref raises a RelationIntegrity finding` (reason `not a canonical ref`); `a needs ref to an absent backlog id raises a finding` (reason `no such entity`); `an unresolvable cross kind ref raises a finding`.", test_file = "src/backlog.rs", keywords = ["dep_seq_ref_findings", "not a canonical ref", "no such entity"], waived = false },
  { id = "VT-2", expects = "`a resolvable cross kind ref raises nothing` — the positive control. Without it, a check that reports everything is indistinguishable from one that works.", test_file = "src/backlog.rs", keywords = ["dep_seq_ref_findings", "resolvable"], waived = false },
  { id = "VT-3", expects = "`no doctor finding contains an absolute path` — pins that the resolver's `dir.display()` dangling message is not what the finding renders.", test_file = "src/backlog.rs", keywords = ["absolute", "dep_seq_ref_findings"], waived = false },
  { id = "VT-4", expects = "`a broken ref on a terminal item is still reported` — the class the footer structurally cannot see (5 of the 31 authored cross-kind edges hang off terminal dependents). And `both axes are checked independently`.", test_file = "src/backlog.rs", keywords = ["terminal", "both_axes", "dep_seq_ref_findings"], waived = false },
  { id = "VT-5", expects = "`a corpus read failure raises a finding rather than reporting clean` — STD-003's disclose half; the check does not mirror `lifecycle_findings`'s empty-vec degrade.", test_file = "src/backlog.rs", keywords = ["read_all_tolerant", "ReadFailure", "cannot read"], waived = false },
  { id = "VT-6", expects = "`an unreadable item is named and its readable siblings are still checked` — STD-003's tolerate half, and the one that fails against `read_all`. The fixture authors the unreadable item at the LOWER id so a fail-fast walk aborts before reaching the broken ref and the test goes red for the right reason; both findings must appear in one run.", test_file = "src/backlog.rs", keywords = ["read_all_tolerant", "siblings"], waived = false },
  { id = "VT-7", expects = "`a missing kind tree is clean, not a failure` — the boundary against VT-6's rule; a virgin repo reports nothing rather than five findings.", test_file = "src/backlog.rs", keywords = ["missing", "dep_seq_ref_findings"], waived = false },
  { id = "VA-1", expects = "`doctrine doctor` on the live corpus reports zero findings from the new check — §5 measured zero unresolvable authored refs, so the drift guard starts from an empty population. A non-zero result is real data, not a test failure: report it rather than adjusting the check." },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-04"
name      = "The projection and the footer: boundary:, overrides:, and the signpost"
objective = """
§4 and §2's listing half — the largest single surface in the slice. `AbsentDrop`
gains an axis and a second recording case; `project` is hoisted out of `compose`
into `list_rows` so the one new impure read can sit between them; `probe_ref` /
`probe_boundary` classify what an authored ref turned out to be; `render_overrides`
loses its `corpus` parameter, loses the `AbsentDrop` leg and the `Dangling` arm,
and gains the `boundary:` block; `classify_dangling` is deleted and `compose`'s
`cmap` build goes with it; and `backlog list` emits the count-only stderr advisory.
Membership, row order and the JSON envelope are the load-bearing non-goals.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §2 and §4 read in full. The red suite is authored blind to `proto/SL-238-types` (DEC-242); every output string the tests assert comes from the design, not from code." },
  { id = "EN-2", text = "PHASE-01 landed (the probe reads terminality through `authored_class`) and PHASE-03 landed (the advisory's count must report the same population `dep_seq_ref_findings` does)." },
]
exit_criteria = [
  { id = "EX-1", text = "`enum Axis { Needs, After }` is declared backlog-local, and `AbsentDrop` carries it. `project` records an `AbsentDrop` for the second case too — a ref that PARSES but whose `ItemId` matches no item in the corpus. `project` still never pre-filters edges by node membership, and the adapter's inputs are byte-identical." },
  { id = "EX-2", text = "`project` is hoisted out of `compose` into `list_rows`; the corpus is walked once, not twice. `compose` no longer builds `cmap`." },
  { id = "EX-3", text = "`RefState { Resolved { kind, status }, Unreadable, Unresolved }`, `BoundaryRow { dependent, target, axes, status }` and `BoundaryProbe { rows, unresolved }` exist. `RefState` WRAPS `AuthoredStatus` — it does not flatten it to a status word (the kind and the status-less case are both needed)." },
  { id = "EX-4", text = "`probe_ref(root, target) -> RefState` is the single classification (`parse_resolvable_ref` -> `authored_status::read` -> `authored_class`), memoised per distinct ref, and is the only new disk touch on the listing path. `probe_boundary(root, &absent) -> BoundaryProbe` dedups per `(dependent, target)` with axes joined, sorts by dependent then target, drops terminal targets, and counts rather than shows unresolvable refs." },
  { id = "EX-5", text = "`render_overrides(boundary: &[BoundaryRow], overrides: &[Override]) -> String` — the `corpus` parameter deleted, the `AbsentDrop` loop deleted, the adapter's `Dangling` arm deleted, `SoftCycleEvicted` and `Contradicted` rendering as today, and a `boundary:` block appended after `overrides:` when non-empty. Either block may appear without the other; both empty means no footer, as today. `classify_dangling` is deleted." },
  { id = "EX-6", text = "`backlog list --by sequence` emits one count-only stderr advisory when the probe drops one or more unresolvable refs: it names no individual ref, names `doctrine doctor`, counts distinct `(dependent, axis, ref)` occurrences, and never fires under `--by id`." },
  { id = "EX-7", text = "THREE tests are SUPERSEDED, not relaxed, and each replacement states what it now asserts and why the old assertion no longer holds: the two interim tests from `74b773690` — `list_sequence_stays_silent_on_a_cross_kind_drop_but_names_a_malformed_ref` (superseded on two counts) and `list_sequence_emits_no_footer_when_every_drop_is_cross_kind` — and `list_sequence_records_terminal_and_absent_drops_with_status_and_resolution`. AMENDED 2026-08-17 (PHASE-04 planning, R5): the third test was omitted. It asserts `overrides:` is present and that `ISS-099` renders with the word `absent` (`src/backlog.rs:5388`, fixture `ISS-001 needs CHR-001 [terminal] + ISS-099 [absent]`). Under EX-5 the `Dangling` arm is deleted, and under EX-1/EX-6 an absent backlog id becomes an `AbsentDrop` that is COUNTED on stderr rather than shown on stdout — so that fixture yields an empty footer and no `absent` anywhere, which is precisely what VT-6 requires. Both of its assertions become false, so it is a supersession on the same terms as the other two, not fallout to be patched." },
  { id = "EX-8", text = "`src/backlog_order.rs` is unmodified and the `backlog_order` and `priority` suites are green UNMODIFIED. A suite edited to pass is a finding, not a pass (R1, §7)." },
]
verification = [
  { id = "VT-1", expects = "`a live cross_kind needs emits one boundary line naming target and status` — `ISS-327 needs QUE-219 (open)`, dependent-first, no arrow; the word `absent` appears nowhere in the output.", test_file = "src/backlog.rs", keywords = ["boundary:", "probe_boundary", "BoundaryRow"], waived = false },
  { id = "VT-2", expects = "`a terminal cross_kind target emits no boundary line` (the 15-edge class) and `a terminal dependent contributes no boundary line` (the 5 edges the projection never admits).", test_file = "src/backlog.rs", keywords = ["terminal", "boundary"], waived = false },
  { id = "VT-3", expects = "`a pair declared on both axes emits one boundary line with both relation words`, and `boundary lines sort by dependent then target` — asserted on a fixture whose correct order INTERLEAVES kinds (`IMP` before `ISS`), so a sort that groups by kind fails rather than passing by accident.", test_file = "src/backlog.rs", keywords = ["Axis", "sort", "boundary"], waived = false },
  { id = "VT-4", expects = "`overrides keeps soft cycle and contradicted and nothing else` — the `Dangling` arm gone, the two surviving reasons rendered as today.", test_file = "src/backlog.rs", keywords = ["render_overrides", "SoftCycleEvicted", "Contradicted"], waived = false },
  { id = "VT-5", expects = "`the json envelope carries rows only and both footer blocks go to stderr`, alongside the existing `Ordering::Degraded` cycle warning.", test_file = "src/backlog.rs", keywords = ["json", "stderr", "boundary"], waived = false },
  { id = "VT-6", expects = "`an unresolvable ref emits no footer line` — malformed, absent backlog id, and unresolvable cross-kind ref, each asserted absent from STDOUT; and `a corpus with no unresolvable refs emits no advisory`, the positive control and the state of the live corpus.", test_file = "src/backlog.rs", keywords = ["unresolved", "advisory", "doctrine doctor"], waived = false },
  { id = "VT-7", expects = "`an unresolvable ref emits one count-only advisory on stderr` (count present, no individual ref, `doctrine doctor` named); `the advisory counts distinct dependent-axis-ref occurrences` — the same bad ref on both axes counts twice, which is unreachable under a `(dependent, ref)` key and is what forces the axis into the key.", test_file = "src/backlog.rs", keywords = ["advisory", "Axis", "occurrences"], waived = false },
  { id = "VT-8", expects = "`the advisory counts an absent backlog id` — `needs: ISS-999` on a live item: one `doctor` finding, no footer line, and ONE on the advisory's count. Red without EX-1's added projection case, because that class would otherwise reach only the adapter.", test_file = "src/backlog.rs", keywords = ["ISS-999", "advisory"], waived = false },
  { id = "VT-9", expects = "`--by id emits neither footer nor advisory` — the order mode never composes and so never probes.", test_file = "src/backlog.rs", keywords = ["OrderBy::Id", "advisory"], waived = false },
  { id = "VT-10", expects = "`list_sequence_and_id_share_membership_differ_on_order` holds unmodified — sequence remains a permutation of id. The `backlog_order` and `priority` suites pass with no edit.", test_file = "src/backlog.rs", keywords = ["list_sequence_and_id_share_membership_differ_on_order"], waived = false },
  { id = "VA-1", expects = "`render_overrides` no longer takes `corpus` and `compose` no longer builds `cmap` — enforced by the repo's `dead_code`/`unused` denials rather than by a test, but confirmed as a deliberate deletion rather than fallout." },
  { id = "VA-2", expects = "Every intentional output change in this phase is recorded for the reconciliation brief with its reason: the two superseded tests, the new stderr advisory, and the `boundary:` block's introduction." },
]
specs        = []
requirements = []

# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-05"
name      = "inspect and show gain the target's state"
objective = """
§4's record half. `probe_item_refs` is the SECOND projection over the shared
`probe_ref` — it classifies every ref an item declares, keyed by `(Axis, String)`,
drops nothing, and is threaded into `run_show_inspect` / `format_metadata` so
`backlog inspect` and `backlog show` print each declared target's state. The split
from `probe_boundary` is load-bearing and is pinned as a test so a later tidy-up
cannot quietly re-merge them.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §4 `inspect and show gain the target's state` and its five rendering rules read; `DEC-234` inspected. Red suite blind to the prototype (DEC-242)." },
  { id = "EN-2", text = "PHASE-04 landed and green — `RefState`, `Axis` and `probe_ref` exist." },
]
exit_criteria = [
  { id = "EX-1", text = "`probe_item_refs(root, item) -> BTreeMap<(Axis, String), RefState>` exists: every declared ref classified, nothing dropped, backlog-shaped refs probed rather than filtered out ahead of the probe." },
  { id = "EX-2", text = "`run_show_inspect` threads the map into `format_metadata` beside the value and estimate lines it already threads; `backlog show` gains the annotation through the shared renderer." },
