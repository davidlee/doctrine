[[phase]]
id        = "PHASE-08"
name      = "DepSeqOps injection: backlog after routed, backlog needs gated"
objective = """
§6's routing half, and the slice's live layering result. `backlog` must reach three
`commands::dep_seq` operations plus the admissible-target gate WITHOUT gaining a
`crate::commands` import: a `backlog -> commands` edge merges two SCCs and moves the
command tangle baseline. So `cli.rs` fills a `DepSeqOps` struct of `fn` pointers and
threads it through `backlog::dispatch` into `run_after` (all three legs) and
`run_needs` (the prerequisite loop's new gate). This closes ISS-368 as a side effect
and removes `backlog.rs`'s duplicate prune leg, which PHASE-02 also pinned.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §6 `How backlog reaches them: injection, not import` and `backlog needs is routed for its target gate` read, plus §9 items 10 and 11 — both are behaviour changes named rather than folded in. Red suite blind to the prototype (DEC-242)." },
  { id = "EN-2", text = "PHASE-06 and PHASE-07 landed — the injected pointers must point at the final implementations, not at intermediate ones." },
]
exit_criteria = [
  { id = "EX-1", text = "`commands::dep_seq::ensure_admissible_dep_target(kind, target)` is extracted from the existing `ensure!` and called by `resolve_dep_seq_src`, so both paths refuse in one voice. It takes the target REF as well as its kind, because the message interpolates both." },
  { id = "EX-2", text = "`backlog::DepSeqOps { edge, remove, prune, admit_target }` exists with `edge`/`remove` typed `fn(Option<PathBuf>, &str, &str, i32)` — rank as `i32`, NOT `Option<i32>`, and `remove` KEEPS its rank, which on `--remove` is an upper bound. `run_needs_remove` is not a member (the `needs` array carries no rank)." },
  { id = "EX-3", text = "`backlog::dispatch(cmd, color, ops)` receives the struct and threads it into `run_after` and `run_needs`; `cli.rs`'s `Command::Backlog` arm fills it. All three `run_after` legs — append, `--remove`, `--prune` — run the injected operation; `backlog.rs`'s duplicate prune leg and its `require_item(to)` twins are gone, and PHASE-02's backlog-side characterisation tests are removed WITH the leg they pin — not left failing." },
  { id = "EX-4", text = "`run_needs`' prerequisite loop calls `(ops.admit_target)(tkref.kind, prereq)` after `parse_resolvable_ref`. `backlog needs` now refuses `RV`, `REC` and governance docs — a deliberate refusal of input accepted today (ISS-368, §9 item 11)." },
  { id = "EX-5", text = "`src/knowledge.rs` is untouched — `commands::dep_seq` keeps its `RecordKind::ALL` read for the refusal message, because injection leaves that module at command tier where the edge is legal." },
  { id = "EX-6", text = "Echo strings on the routed `backlog after` legs unify on the canonical source id — a named output change for the reconciliation brief." },
]
