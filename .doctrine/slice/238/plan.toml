# ─────────────────────────────────────────────────────────────────────────────
[[phase]]
id        = "PHASE-06"
name      = "The needs removal, and the remove path's source-only gate"
objective = """
§6's clearing half, minus `--prune`. The leaf gains `remove_needs` symmetric with
`append`, `RelRemove` carries the axis into the one IO wrapper, and `doctrine needs
<SRC> <TGT> --remove` appears on the CLI. Both axes' remove paths then gate the
SOURCE only and treat the target as an authored string canonicalised through the
three-tier needle — which is what makes every ref PHASE-03's check reports at Error
severity actually clearable. That is a deliberate behaviour change on `after
--remove`, which today refuses an unresolvable target.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §6 through `The remove path gates the source, not the target` read, including the named unpadded-ref bound. Red suite blind to the prototype (DEC-242)." },
  { id = "EN-2", text = "PHASE-02 landed — `after --remove`'s current target-gate refusal is pinned, so its removal reads as an intentional change." },
]
exit_criteria = [
  { id = "EX-1", text = "`dep_seq::remove_needs(doc, to) -> Result<usize>` exists at leaf tier with `remove_after`'s F-1 strict-refuse posture on a missing seeded array; `enum RelRemove { Needs(&str), After { to, rank_ceiling } }` exists; `remove(toml_path, &RelRemove)` is the single IO wrapper and all FOUR existing production call sites move to it. AMENDED 2026-08-17 (PHASE-06 planning): this criterion read `all three existing call sites (backlog.rs:2077, backlog.rs:2099, commands/dep_seq.rs:167)`. Two corrections, both established by grep with a positive control. (a) The two backlog line numbers were stale — PHASE-05 grew `backlog.rs` and the sites are now `backlog.rs:2353` and `backlog.rs:2375`. (b) The census was short by one: `commands/dep_seq.rs:254`, the `--prune` removal loop, also calls `dep_seq::remove` and cannot compile against the new signature, so it moves in THIS phase and is rewritten again by PHASE-07 (as the two backlog-side sites are by PHASE-08). `src/dep_seq.rs`'s own two test call sites (`:849`, `:877`) move with them. `design.md:1187` carries the same `Three call sites` count; the design run is locked, so that half goes to `notes.md` `### Open` as a reconcile action. `remove_after`'s own logic is unchanged." },
  { id = "EX-2", text = "`Command::Needs` carries `remove: bool` with its dispatch arm, and `commands::dep_seq::run_needs_remove(path, source, target)` echoes `{source_id} needs {target_id} removed (N edges)` and bails when nothing matched, mirroring `run_after_remove`. There is no `needs --prune`." },
  { id = "EX-3", text = "Both remove paths gate the source through `resolve_dep_seq_src_path` only, and canonicalise the target through the three tiers in order: `parse_resolvable_ref` (preserving today's bare-id tolerance), then `parse_canonical_ref` (a well-formed ref to a deleted target), then verbatim." },
  { id = "EX-4", text = "The unpadded-ref bound is preserved deliberately and asserted, not fixed: a stored `needs = [\"SL-1\"]` is not cleared by `--remove SL-1`, because the needle canonicalises to `SL-001`. Closing it later must be a deliberate change with a red test." },
]
verification = [
  { id = "VT-1", expects = "`needs remove clears one edge and reports the count` and `needs remove bails when no edge matches`.", test_file = "src/commands/dep_seq.rs", keywords = ["run_needs_remove", "removed"], waived = false },
  { id = "VT-2", expects = "`needs remove clears a ref that does not resolve` and `after remove clears a ref that does not resolve` — the repair path PHASE-03's check depends on, and the deliberate supersession of PHASE-02/VT-3.", test_file = "src/commands/dep_seq.rs", keywords = ["run_needs_remove", "run_after_remove", "does_not_resolve"], waived = false },
  { id = "VT-3", expects = "`remove accepts a bare id target` — `after SRC 154 --remove` clears the `SL-154` edge. This works today through `resolve_dep_seq_src` and must survive the gate change; it is the regression the three-tier needle exists to prevent.", test_file = "src/commands/dep_seq.rs", keywords = ["bare", "run_after_remove"], waived = false },
  { id = "VT-4", expects = "`remove canonicalises a parseable ref to a deleted target` — `SL-9999` does not resolve but still canonicalises, so a stale edge is clearable; and `remove matches an unparseable ref verbatim`.", test_file = "src/commands/dep_seq.rs", keywords = ["SL-9999", "verbatim"], waived = false },
  { id = "VT-5", expects = "`remove does not match a well-formed unpadded ref` — a stored `needs = [\"SL-1\"]` is NOT cleared by `--remove SL-1`. Asserted as the known bound §6 names.", test_file = "src/commands/dep_seq.rs", keywords = ["unpadded"], waived = false },
