[[phase]]
id        = "PHASE-07"
name      = "--prune's probe, collapsed onto one resolver and one read"
objective = """
§6's `--prune` half. Four hardcoded copies of `status == \"resolved\" || status ==
\"closed\"` — two near-verbatim duplicate functions, each doubling its own
read-parse block — collapse to one probe routing terminality through
`partition::authored_class`. That closes the STD-001 duplicated-table violation and
the REQ-238 routing breach together, and repairs four `unwrap_or_default()` laundered
reads (STD-003). Four consequences are behaviour changes, each tested as what it is
against PHASE-02's pins.
"""
entrance_criteria = [
  { id = "EN-1", text = "design.md §6 `--prune's probe, collapsed` and its four consequences read. Red suite blind to the prototype (DEC-242)." },
  { id = "EN-2", text = "PHASE-01 landed (`authored_class`, `authored_status::read`) and PHASE-02 landed (the four pinned behaviours), PHASE-06 landed (the shared `RelRemove` seam)." },
]
exit_criteria = [
  { id = "EX-1", text = "`run_after_prune` runs ONE probe per edge: `parse_resolvable_ref` — `Err` -> prunable; `Ok` -> `authored_status::read` — `Err` -> KEEP and say so on stderr; `Ok` -> `authored_class` — `Terminal` -> prunable, anything else -> keep. One read per edge, not two; the internal double read is collapsed." },
  { id = "EX-2", text = "No hardcoded `resolved`/`closed` terminal-status literal survives in `src/commands/dep_seq.rs`; `partition::status_class` is the sole classifier reached through `authored_class`." },
  { id = "EX-3", text = "All four `read_to_string(..).unwrap_or_default()` -> empty-`toml::Table` laundered reads are gone. The unreadable-target case keeps the edge (the conservative call) AND says why on stderr." },
  { id = "EX-4", text = "The three reason strings the two copies render today (`absent`, `(unparseable)`, `absent (unparseable ref)`) collapse to one — `dropped (dangling: unresolved)` — reusing §4's token, and the reason word loses its `/resolution` suffix: output becomes `dropped (dangling: closed)`." },
  { id = "EX-5", text = "PHASE-02's characterisation tests for `--prune` are superseded, each replacement naming what it now asserts and why the old assertion no longer holds." },
]
verification = [
  { id = "VT-1", expects = "`after prune clears an edge onto a done slice` and `... onto an answered question` — the deliberate vocabulary change; `IMP-172 -> SL-154` is the standing live instance.", test_file = "src/commands/dep_seq.rs", keywords = ["run_after_prune", "authored_class", "dangling"], waived = false },
