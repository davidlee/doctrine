  { id = "VT-1", expects = "`backlog after accepts a cross kind target on every leg` — append, `--remove`, `--prune`, each asserted against the same target that fails today with `unknown backlog prefix SL`.", test_file = "src/backlog.rs", keywords = ["DepSeqOps", "run_after", "cross_kind"], waived = false },
  { id = "VT-2", expects = "`backlog after --remove honours the rank ceiling` — with edges at rank 1 and rank 5, `--remove --rank 3` clears the first and keeps the second, on the backlog-scoped leg as on the top-level one. A pointer that had dropped the rank argument would pass every other test here while silently widening the delete; a type prototype of this design shipped exactly that signature.", test_file = "src/backlog.rs", keywords = ["rank", "DepSeqOps"], waived = false },
