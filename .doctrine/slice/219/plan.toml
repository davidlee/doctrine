# Implementation plan for SL-219 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-219"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Wire vocabulary & admissibility"
objective = "Estimate domain enters the closed wire vocabulary: DOMAIN_ESTIMATE, FRAME_MORE_WORK, frame-table row, admissible_estimate_pair derived from VALUE_BEARING + RECORD, capture routing by derived domain (design §1, D3/D5). Strictly additive; no consumer yet."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (RV-273 done); plan approved" },
]
exit_criteria = [
  { id = "EX-1", text = "compare record A B --frame more-work captures an estimate-domain row for admissible pairs (work kinds + records, RSK included) and refuses inadmissible kinds with a currency-naming message" },
  { id = "EX-2", text = "Estimate rows resolve Active (no InertDomain); cross-domain identity-key separation holds (design §6.2)" },
  { id = "EX-3", text = "just gate green; all existing suites unchanged" },
]
verification = [
  { id = "VT-1", expects = "frame table row + domain derivation: more-work derives estimate; census property admitted <=> VALUE_BEARING+RECORD derivation over ALL_KINDS", test_file = "src/comparison/wire.rs", keywords = ["DOMAIN_ESTIMATE", "FRAME_MORE_WORK", "admissible_estimate_pair"], waived = false },
  { id = "VT-2", expects = "capture routes admissibility by derived domain; est-domain capture e2e-lite through run_capture; record-kind pair admitted in estimate domain, refused in value domain", test_file = "src/commands/compare.rs", keywords = ["admissible_estimate_pair", "more-work"], waived = false },
  { id = "VT-3", expects = "resolution: est rows Active; same pair value+est rows neither collide nor supersede across domains; R3 scoped per domain", test_file = "src/comparison/resolve.rs", keywords = ["DOMAIN_ESTIMATE"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Pipeline split & est compile"
objective = "Pipeline refactors to per-domain DomainSystem { constraint_set, anchors, projection } with shared resolution; authored_est_cost extracted as the one formula site; est anchor builder; row-status routing to owning domain (compare list unbiased); est-domain findings with domain-at-construction (design §2, D6/D7/D9)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 landed (est rows exist to compile)" },
]
exit_criteria = [
  { id = "EX-1", text = "Two independent compile() systems per refresh; quarantine maps disjoint by row uid; RowState joins by owning domain" },
  { id = "EX-2", text = "authored_est_cost shared helper: builder output == graph authored branch (pinned by test)" },
  { id = "EX-3", text = "Findings carry domain, set at construction; compile.rs untouched (VA below); existing suites green unchanged" },
]
verification = [
  { id = "VT-1", expects = "DomainSystem split; est anchors from authored_est_cost; C2 cost-anchor merge conflict; C4 stale-estimate violation-closure golden; disjoint quarantine maps", test_file = "src/comparison/store.rs", keywords = ["DomainSystem", "authored_est_cost"], waived = false },
  { id = "VT-2", expects = "one formula site: anchor-builder value equals graph.rs authored-branch est_cost for the same bounds+cfg", test_file = "src/priority/graph.rs", keywords = ["authored_est_cost"], waived = false },
  { id = "VT-3", expects = "compare list status column routes per-row to owning domain system; est-domain quarantined row renders quarantined while value rows unaffected (test seeds est rows via DOMAIN_ESTIMATE)", test_file = "src/commands/compare.rs", keywords = ["DOMAIN_ESTIMATE"], waived = false },
  { id = "VT-4", expects = "findings domain discriminator (intended symbol ComparisonDomain — amend keyword at phase-plan if named otherwise) present in render + JSON parity", test_file = "src/priority/findings.rs", keywords = ["ComparisonDomain"], waived = false },
  { id = "VA-1", expects = "diff shows src/comparison/compile.rs untouched across the phase (design D9: domain enters at finding construction)" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Cost projection & feed"
objective = "project() parameterized via the ProjectionCfg seam (D8): value site passes shipped constants (byte-identical goldens), est site passes EST_GAUGE_STEP + gauge_center = ctx.absent; cost-feed fn = est projection minus Gauge tier; positivity invariant (D11). No scoring consumption yet (design §2 feed rule, §3)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 landed (est ConstraintSet exists to project)" },
]
exit_criteria = [
  { id = "EX-1", text = "Value projection byte-identical under the parameterization (existing goldens are the proof)" },
  { id = "EX-2", text = "Est projection: anchored chain, P5 above-top-anchor, P6 compression golden, gauge present-in-projection absent-from-feed; fed costs > 0" },
  { id = "EX-3", text = "EST_GAUGE_STEP named const + [priority.estimate] gauge_step parse + clamp idiom" },
]
verification = [
  { id = "VT-1", expects = "value call site passes shipped constants; existing projection goldens byte-identical; no config reads inside project()", test_file = "src/comparison/project.rs", keywords = ["gauge_center"], waived = false },
  { id = "VT-2", expects = "est projection goldens: anchored chain, P5, P6 chain-of-3-below-0.5 compression artifact, gauge component render-only; EST_GAUGE_STEP sensitivity sweep (order-safety + provenance invariance); fed-costs > 0 property", test_file = "src/comparison/store.rs", keywords = ["cost_feed", "EST_GAUGE_STEP"], waived = false },
  { id = "VT-3", expects = "config: EST_GAUGE_STEP default 0.25, [priority.estimate] gauge_step override + clamp", test_file = "src/priority/config.rs", keywords = ["EST_GAUGE_STEP", "gauge_step"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "REV & scoring feed"
objective = "REV against ADR-015 (estimate-source resolution: authored pin > projected > bare anchor; INV-2 restated; gauge-never-divides; positivity axiom) authored and approved; then graph::est_cost ladder consumes the cost feed (design §3, D2/D6/D7)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 landed (feed exists)" },
  { id = "EN-2", text = "REV drafted, reviewed, APPROVED (human gate) before the ladder lands" },
]
exit_criteria = [
  { id = "EX-1", text = "est_cost ladder live: authored -> feed (EPSILON-floored) -> bare anchor; single consumption seam; ctx.absent computed from authored uppers only" },
  { id = "EX-2", text = "Zero est rows => bitwise-identical scoring; every existing priority suite green unchanged" },
  { id = "EX-3", text = "REV applied to ADR-015; boot regenerated (doctrine boot --check clean)" },
]
verification = [
  { id = "VT-1", expects = "ladder goldens: authored beats feed; evidenced-bare fed; unevidenced-bare at bare anchor; gauge-masked at bare anchor; merge-hoisted member fed at class anchor; regime-flip golden; projected-above-bare-anchor INV-2 pin; EPSILON floor at feed branch", test_file = "src/priority/graph.rs", keywords = ["cost_feed", "est_cost"], waived = false },
  { id = "VT-2", expects = "behaviour preservation: empty feed => identical graph build; reprobe: authored range edit / beta edit moves anchor => est projection + value determinacy re-run", test_file = "src/priority/elicit.rs", keywords = ["cost_feed"], waived = false },
  { id = "VH-1", expects = "REV against ADR-015 approved by the user before this phase's ladder commit lands" },
  { id = "VA-1", expects = "ADR-015 shows the estimate-source resolution section post-apply; spec-coherence note recorded for /close" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-05"
name      = "Sizing probes"
objective = "CandidateKind::SizingProbe in the elicit queue: pool predicate (no authored estimate, zero est rows any status), deterministic median target with authored-estimates-only fallback tiers, existence admission, D15 state extension with disclosed-not-gating residual debt, JSON kind (design §4)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 landed (probe postcondition 'fed on next refresh' is testable)" },
]
exit_criteria = [
  { id = "EX-1", text = "Un-sized top-K items yield one probe each; incomparable retires the probe (no re-probe loop); probes sink below yield-motivated entries" },
  { id = "EX-2", text = "Probe answer postcondition: fed on next refresh with non-Gauge provenance (prefer => Projected, equal => Authored via class anchor), never bare-anchor fallthrough" },
  { id = "EX-3", text = "State semantics: probes gate Candidates/Stable; sizing-debt disclosure line on Stable; byte-deterministic output" },
]
verification = [
  { id = "VT-1", expects = "pool predicate; incomparable-retires-probe golden; target selection (median, even-count lower-middle, authored-only fallback tiers, none-anywhere state detail); existence admission with score 0; id-order among probes", test_file = "src/priority/elicit.rs", keywords = ["SizingProbe", "Calibration"], waived = false },
  { id = "VT-2", expects = "postcondition golden: prefer => Projected fed; equal => Authored-via-class fed; never bare anchor; probes gate Candidates; Stable disclosure wording", test_file = "src/priority/elicit.rs", keywords = ["sizing-probe"], waived = false },
  { id = "VT-3", expects = "JSON: sizing-probe kind entry, spine intact (guaranteed_yield 0, yield_basis calibration, score 0), subject/target/ask payload; schema stays v1; byte-determinism", test_file = "src/commands/compare.rs", keywords = ["sizing-probe", "calibration"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-06"
name      = "Surfaces & e2e"
objective = "explain cost-source block (three shapes + gauge flag line), domain-tagged findings render, probe render with exact answer command, e2e round-trip (design §5, §6.9-10)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 landed (all machinery present to surface)" },
]
exit_criteria = [
  { id = "EX-1", text = "explain shows authored/projected/bare-anchor cost-source shapes; gauge case shows bare anchor as what scoring used plus the sizing line — never implies gauge fed the divisor" },
  { id = "EX-2", text = "e2e: capture more-work -> visible score shift in explain; probe round-trip elicit -> record -> re-elicit shows subject sized" },
  { id = "EX-3", text = "just gate green; full suite green; JSON parity across new renders" },
]
verification = [
  { id = "VT-1", expects = "three cost-source shapes + gauge flag line goldens; rater split with NoConstraint excluded from counts", test_file = "src/priority/surface.rs", keywords = ["cost_source", "bare anchor"], waived = false },
  { id = "VT-2", expects = "e2e: capture -> compile -> project -> feed -> score shift; probe round-trip; domain-tagged finding render + JSON parity", test_file = "tests/e2e_compare_estimate.rs", keywords = ["more-work", "sizing-probe"], waived = false },
  { id = "VA-1", expects = "design §6 checklist swept: every numbered suite maps to landed tests or a recorded waiver" },
]
specs        = []
requirements = []
