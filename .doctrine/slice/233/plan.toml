  { id = "EN-1", text = "PHASE-12 complete — the four process fragments name obligations that all now exist, including the reviewing stage's" },
  { id = "EN-2", text = "the stage-band resolution path is exercised end-to-end at least once before the pack is relied upon — zero prior stage hymns exist on disk, so the band's happy path has never run. Evidence is a passing resolve against a throwaway stage hymn, recorded in the phase sheet, not an inspection of the resolver" },
]
exit_criteria = [
  { id = "EX-1", text = "the `install/hymns/stage/` directory is created (it does not exist at head), `install/hymns/stage/design.md` exists, and `stage/design` is added to `[hymns].seal` — exactly one SPEC-023 entry, matching PHASE-01's amendment" },
  { id = "EX-2", text = "the four fragments (inquiry, drafting, reviewing, delegation) live under `install/design-prompts/` as a closed, code-owned store: one next-obligation enum selects at most one file, with no selector algebra, no `replaces` validation, and no user override" },
  { id = "EX-3", text = "all five new install assets carry explicit `publication/manifest.toml` library addresses, satisfying `src/asset_source.rs::assert_unprojected_install_assets_are_published`" },
  { id = "EX-4", text = "prompt checks prove a user twin of the sealed hymn is dropped; install tests prove the sealed hymn is not projected as user-editable content" },
  { id = "EX-5", text = "PRECEDENT BOUND (research thread 5, high risk): a test asserts `install/design-prompts/` has no consumer outside the design run, and `name@digest` appears nowhere outside `design show`/`design resume` — the RFC-021 cascade fork is bounded by test, not by intention" },
