[[phase]]
id        = "PHASE-06"
name      = "The wire contract and the derived title"
objective = """
Close the three defects that let the snapshot and the wire disagree silently: \
collapse the dual route to `Disposition::Adopted`, derive a section title from its \
own prose instead of carrying an independent caller-supplied field, and make \
`Declaration` refuse a removed key rather than silently discard it. This is the \
half of the original PHASE-06 that touches neither markers nor materialise, and it \
is sequenced FIRST because `deny_unknown_fields` (EX-14) is the precondition that \
makes both wire removals falsifiable at all -- without it serde accepts and \
discards an old key, and every removal test passes for the wrong reason. \
The 2026-07-29 revision split what was left of PHASE-06 again, on the same argument that moved conservative import out on 2026-07-28: the phase was still carrying ten separable deliverables and eighteen named tests behind one design gate. PHASE-13 takes the write side (markers, framing, document order), PHASE-14 takes the read side (re-adoption, its refusals, the shim), and this phase keeps the wire contract, which depends on neither."""
entrance_criteria = [
