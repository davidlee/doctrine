both directions survive: a kit that collects only (i) is one-directional and cannot detect 2b-should-have-been-2a. AMENDED (2026-08-01, owner ruling; RV-325 round 5 F-12): ADD THE CONTROL CHECK AND THE CONSEQUENCE CHECK, since the previous amendment satisfied this criterion's letter and breached its substance. CONTROL: confirm the kit records, for every claimed misclassification observation, HOW THE SAME RUN TREATED THE SIBLING OBLIGATIONS AT THAT EDGE. Without that contrast the observation is equally evidence of ordinary noncompliance or of misleading step text, and a signal with three live explanations routes to none of them — which is this criterion's failure mode stated exactly. An observation offered with no sibling contrast MUST be rejected as uncollected, not weighed. CONSEQUENCE: confirm the kit routes a firing to REOPENING THE DISCRIMINATOR FOR THAT STEP with three admissible outcomes (reword, reclassify, stand) and NOWHERE ELSE. A kit that reports the raw event as proof the obligation was never a step has overclaimed, and overclaiming is how a falsifier becomes a formality: it makes reclassification the only exit and so guarantees a result the evidence cannot support. AMENDED AT ROUND 6 (2026-08-01, owner ruling; RV-325 F-13): THE THREE-OUTCOME SET IS NOW TWO. Confirm the kit offers REWORD or RECLASSIFY and NO THIRD EXIT once the signal fires. `Stand` was admitted at round 5 to absorb an anomalous run and instead made every firing narratable after the fact, which is this criterion's own failure mode arriving by the opposite door — not routing the result to the cheapest revision, but routing it to none. Confirm INSTEAD that the anomaly control sits in the PRE-REGISTERED FIRING CONDITION and is stated before any run: sibling control satisfied, no deliberate context break or resume crossed at that edge, no abort or restart mid-edge. A kit that leaves anomaly to post-hoc judgement has reinvented `stand` under another name and must be rejected. Confirm too that