# Implementation plan for SL-233 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-233"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (.doctrine/glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.
#
# ARRAY ORDER IS EXECUTION ORDER (`src/plan.rs` reads the ordered phase array and
# never sorts by id). The 2026-07-28 revision split the two oversized phases and
# gave six unowned scope objectives their own homes; because ids are immutable
# and append-only, the new phases carry PHASE-10…PHASE-12 and are positioned in
# the array where they actually run. Execution order is therefore:
#   01 → 02 → 03 → 04 → 05 → 06 → 11 → 12 → 10 → 07 → 08 → 09
# See plan.md § Sequencing for why.
#
# ── WHAT A VT MANDATE PROVES, AND WHAT IT DOES NOT ────────────────────────────
# `src/vtgate.rs::check_vt` NEVER RUNS A TEST. It proves that a slice-modified
# file contains each `keyword` as a raw substring — over unstripped source, so a
# comment satisfies it — and that each `patterns` regex matches at least one
# LINE. Nothing more.
#
# Three devices therefore carry the real weight, and every code phase uses all
# three. A phase is not disposable without them:
#
#   1. `patterns` anchored at line start on a DECLARATION shape (`^\s*fn name\(`,
#      `^\s*pub enum X`). A comment line begins with `/`, so it cannot match.
#      This forces the named item to exist as code.
#   2. Exit criteria that ENUMERATE THE EXACT TEST FUNCTION NAMES. The names are
#      the contract; the patterns anchor on them; omission is then visible in one
#      grep instead of hidden behind a paraphrase.
#   3. A negative control (`VA-NC` in each phase): every named test was observed
#      RED before it was made green, with the failing output recorded in the
#      phase sheet. This is the only device that catches a test which passes
#      because it asserts nothing. A test never seen red is not evidence.
#
# Plus a uniform escape sweep (`VA-ES`) — no `#[ignore]`, no `todo!()`, no
# `unimplemented!()`, no `assert!(true)`, and a test census that never shrinks.
# The coordinator runs VA rows; the worker does not self-certify them.

[[phase]]
id        = "PHASE-01"
name      = "Governance descent"
objective = """
Descend RFC-021 into exactly four specification entities — one new product spec, \
one new technical spec, and two narrow amendments (SPEC-019, SPEC-023, both tech \
specs) — appending all four exact paths as design-target selectors BEFORE any \
body is edited. Coordinator-only by construction: a dispatch worker never writes \
authored .doctrine/ state."""
entrance_criteria = [
  { id = "EN-1", text = "design.md is locked and RV-315 is terminal (all 20 findings)" },
  { id = "EN-2", text = "the selector list carries no exact NEW spec-entity paths yet. The two amendment targets are already declared design-target (`.doctrine/spec/tech/019/**`, `.doctrine/spec/tech/023/**`, added 2026-07-28), so only the two newly allocated ids remain to append" },
]
exit_criteria = [
  { id = "EX-1", text = "one new product spec and one new technical spec exist, each descending RFC-021, with ids allocated by the CLI (never guessed)" },
  { id = "EX-2", text = "the new technical spec owns the reserve-then-journal mechanism, the prompt pack, and the reserved-materialisation seam" },
  { id = "EX-3", text = "SPEC-019 carries only an acknowledgement that a managed design run is a legitimate provenance for DEC/QUE/ASM created through the reserve-then-journal protocol — no mechanism ownership transfers (RV-315 F-16)" },
  { id = "EX-4", text = "SPEC-023 gains exactly one entry — `stage/design` in `[hymns].seal` — and nothing else; the prompt pack is NOT swept under SPEC-023 (RV-315 F-18)" },
  { id = "EX-5", text = "both new exact spec paths were appended as design-target selectors BEFORE the first body edit, not after" },
  { id = "EX-6", text = "no skill contract is amended: no specification owns a skill body, so `plugins/doctrine/skills/design/SKILL.md` remains a source target only (RV-315 F-17)" },
  { id = "EX-7", text = "the selector append lands as its own commit, distinct from and preceding every spec-body commit — the phase does not land as one commit, because a single commit makes EX-5 unfalsifiable" },
]
verification = [
  { id = "VT-1", expects = "SPEC-023's body actually names the one sealed slot, so EX-4 is anchored to bytes rather than to a claim", test_file = ".doctrine/spec/tech/023/spec-023.md", keywords = ["stage/design"], waived = false },
  { id = "VT-2", expects = "SPEC-019's body actually carries the managed-design-run provenance acknowledgement", test_file = ".doctrine/spec/tech/019/spec-019.md", keywords = ["managed design run"], waived = false },
  { id = "VA-1", text = "RUN: `doctrine slice conformance SL-233` — exit 0 and no undeclared spec edits. The design's named exit condition for this phase" },
  { id = "VA-2", text = "RUN: `doctrine spec validate` — exit 0 for both new entities and both amendments" },
  { id = "VA-3", text = "RUN: `git log --oneline -- .doctrine/slice/233/slice-233.toml` and the spec dirs — the selector-only commit hash strictly precedes every spec-body commit hash, per EX-7. Report both hashes, not a summary" },
  { id = "VA-4", text = "RUN: `doctrine spec list` before and after — the delta is EXACTLY two new ids. A fifth spurious entity or a missing one is undoable only by a later slice, so the count is asserted, not eyeballed" },
  { id = "VA-5", text = "ANTI-VACUITY: `git diff` for SPEC-023 shows a single added seal entry and no mechanism prose; `git diff` for SPEC-019 shows an acknowledgement paragraph and no mechanism prose. A diff that moves mechanism into either amendment fails EX-3/EX-4 regardless of what the body claims" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Pure run model"
objective = """
Introduce `src/design_run/` carrying the pure run model: stage vocabulary, the \
coarse gate table, inquiry-map types (including node provenance and the separate \
cursor/posture), regression semantics, and the serialization contract. No clock, \
rng, git, or disk — impurity stays in the thin shell (AGENTS.md pure/imperative \
split). Ride the review ledger's const-fn `can()` table rather than inventing a \
second permission vocabulary. Registering the module is an authored ADR-001 edit, \
so this phase is coordinator-only too."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete — the technical spec exists and can be cited as the governing contract" },
  { id = "EN-2", text = "DESIGN GATE (projection). `.doctrine/slice/233/sketches/projection-bounds.md` exists, is committed, and answers ALL SEVEN of: (a) the named limit for each bounded field and the number chosen; (b) what is dropped first when a limit binds, and how the drop is signalled rather than silent; (c) how the `nearby frontier` is selected from the map; (d) how the material-change delta is computed and against what baseline; (e) the worst-case envelope size in tokens for the large-run fixture; (f) what `show --full` may scale with that normal `show` may not; (g) what the agent loses when a limit binds, and why that loss is acceptable. A sketch missing any of the seven is not a sketch. A dedicated RV ledger raised against it by a reviewer who is NOT its author is terminal with every finding dispositioned. It gates THIS phase, not PHASE-04, because the envelope type defined here is the thing being bounded" },
]
exit_criteria = [
  { id = "EX-1", text = "`src/design_run/` exists and is registered under ADR-001 layering — the tier assignment is a new line in `.doctrine/adr/001/layering.toml`, the authoritative classification the gate loads; `tests/architecture_layering.rs` auto-discovers the unit and needs no edit" },
  { id = "EX-2", text = "the five coarse stages of design.md §5.4 are a closed vocabulary: Exploring, Inquiring, Drafting, Reviewing, Locked — declared as a single enum NAMED `Stage` at `src/design_run/mod.rs`. The name is the VT-1 anchor; renaming it requires a plan revision, not a local decision" },
  { id = "EX-3", text = "forward-boundary gates are a const-fn table modelled on `src/review.rs`'s `can()`, not a bespoke matcher" },
  { id = "EX-4", text = "stage, inquiry lifecycle, cursor/posture, review, delegation and recovery are separate types with derived facts — no accidental hierarchical state machine (design R3)" },
  { id = "EX-5", text = "the module is pure: no clock, rng, git, or filesystem access anywhere under `src/design_run/`" },
  { id = "EX-6", text = "DEC-067 is pure-layer semantics: a direct regression carries a recorded reason, and returning forward requires every applicable cumulative gate to hold again against current content — no ceremonial replay, no inherited clearance" },
  { id = "EX-7", text = "an inquiry node carries `provenance` as a first-class field, and cursor is distinct from traversal posture (DEC-060, DEC-061) — user-pinned or user-locked direction is representably distinct from agent-proposed structure, so design R4 (authority laundering) is a type-level property rather than a convention" },
  { id = "EX-8", text = "design.md §9.1's pure-engine suite lives in ONE file, `src/design_run/tests.rs`, and contains EXACTLY these eight named tests: `stage_gate_table_admits_only_legal_forward_moves`, `direct_regression_requires_a_recorded_reason`, `changed_fingerprint_invalidates_only_affected_evidence`, `parent_and_needs_cycles_are_refused`, `blocked_is_derived_not_stored`, `resolved_node_without_disposition_is_refused`, `sparse_omission_null_and_empty_collection_differ`, `unordered_batch_refuses_duplicate_subjects`. The names are the contract — VT-3 anchors on them, so a paraphrased or merged test fails the gate. All eight operate on values and injected `DerivedDesignFacts` only" },
]
verification = [
  { id = "VT-1", expects = "the closed stage vocabulary is a real enum declaration at the module root — the pattern anchors at line start on `enum`, which a comment cannot satisfy", test_file = "src/design_run/mod.rs", keywords = ["Exploring", "Inquiring", "Drafting", "Reviewing", "Locked"], patterns = ['^\s*pub(\(crate\))?\s+enum\s+Stage\b'], waived = false },
  { id = "VT-2", expects = "the new module is classified in the authoritative ADR-001 tier map with a real assignment line, not a comment mentioning it", test_file = ".doctrine/adr/001/layering.toml", keywords = ["design_run"], patterns = ['^design_run\s*=\s*"(leaf|engine|command)"'], waived = false },
  { id = "VT-3", expects = "all eight §9.1 tests exist as functions, each anchored at line start so a comment or a docstring listing the names cannot satisfy the mandate", test_file = "src/design_run/tests.rs", keywords = ["DerivedDesignFacts"], patterns = ['^\s*fn stage_gate_table_admits_only_legal_forward_moves\(', '^\s*fn direct_regression_requires_a_recorded_reason\(', '^\s*fn changed_fingerprint_invalidates_only_affected_evidence\(', '^\s*fn parent_and_needs_cycles_are_refused\(', '^\s*fn blocked_is_derived_not_stored\(', '^\s*fn resolved_node_without_disposition_is_refused\(', '^\s*fn sparse_omission_null_and_empty_collection_differ\(', '^\s*fn unordered_batch_refuses_duplicate_subjects\('], waived = false },
  { id = "VA-1", text = "RUN: `rg -n 'std::fs|std::time|SystemTime|rand::|std::process|Command::new' src/design_run/` — zero hits. The purity claim is a grep result, not an assertion" },
  { id = "VA-2", text = "RUN: `cargo test` — existing suites green and UNCHANGED. `git diff --stat` shows no edit to any pre-existing test file except `.doctrine/adr/001/layering.toml`. Editing an existing test to accommodate the new module is a behaviour-preservation failure, not a fix" },
  { id = "VA-3", text = "RUN: `cargo test design_run -- --list` — all eight EX-8 names appear. Then open `src/design_run/tests.rs` and confirm each of the eight contains at least one assertion whose expected value is a literal, not a value recomputed from the code under test. A test that asserts `f(x) == f(x)` is not a test" },
  { id = "VA-NC", text = "NEGATIVE CONTROL: each of the eight EX-8 tests was observed RED before being made green. The phase sheet records, per test, the failing output. A test that has never been seen red is not evidence — this is the only check that catches an assertion-free test, and the phase is not disposable without it" },
  { id = "VA-ES", text = "ESCAPE SWEEP: `rg -n '#\\[ignore\\]|todo!\\(|unimplemented!\\(|assert!\\(true|unreachable!\\(' src/design_run/` returns nothing, and `cargo test -- --list | wc -l` is >= the pre-phase count. No test disabled, stubbed, or trivially satisfied to make the gate green" },
  { id = "VA-G", text = "RUN: `doctrine check gate` — exit 0 at the phase's final commit (clippy zero warnings across the workspace, full suite green)" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Persistence and the authored watermark"
objective = """
Persist the run at `.doctrine/state/slice/<NNN>/design.toml`, riding \
`src/comparison/wire.rs` as the schema+version precedent and `src/state.rs`'s \
`STATE_SLICE_DIR` as the single-source path root (STD-001). Deliver run identity, \
revision CAS, submission idempotency, bounded receipt eviction, the grouped \
§5.3 state, and DEC-092's authored watermark under its three distinct rules."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete — the pure model exists to serialize" },
  { id = "EN-2", text = "DEC-092 is accepted and its three rules are read as authored, not summarised from recall" },
]
exit_criteria = [
  { id = "EX-1", text = "the snapshot is schema-versioned with parse-time rejection of unknown versions, riding wire.rs's precedent rather than a second scheme" },
  { id = "EX-2", text = "a monotonic revision compare-and-swaps every mutation; stale writers are refused" },
  { id = "EX-3", text = "submission idempotency: a retried submission id resumes; a changed payload under a reused id is refused; an id outside the replay window is refused as expired, never treated as new" },
  { id = "EX-4", text = "receipt eviction is bounded but can never remove the latest receipt or one referenced by an outstanding delegation" },
  { id = "EX-5", text = "DEC-092 rule 1: `start`, ordinary `apply`, `materialise` and the shim's live-run arm entry-refuse an authored-watermark divergence; absent design.md is cold before first materialisation and divergent after" },
  { id = "EX-6", text = "DEC-092 rule 3: every mutating verb re-fingerprints immediately before the snapshot write and abandons the write if bytes moved — rule-1 verbs compare against the watermark, a rule-2 re-adoption against the fingerprint it was admitted on, NEVER against the old watermark (RV-315 F-20)" },
  { id = "EX-7", text = "the abandoned-write guarantee is implemented as `the run does not advance`, not `nothing was written` — journalled effects ordered before the snapshot under DEC-083/086 remain and stay recoverable" },
  { id = "EX-8", text = "writes use the existing `src/fsutil.rs::write_atomic` sibling-replacement helper, not a new writer. The snapshot path derives from `src/state.rs`'s existing private `STATE_SLICE_DIR` constant through a new `pub(crate) fn design_snapshot_path` in that same module — the constant stays private and the helper is the single source (STD-001). The helper's name is the VT-4 anchor; renaming it requires a plan revision. A second `.doctrine/state/slice` literal anywhere is the violation this criterion exists to prevent" },
  { id = "EX-9", text = "run identity is persisted: one active run per slice in v1, with an explicit run UID for stale-context detection, and every `apply` payload asserts `run_uid` + `known_revision` + `submission_id` irrespective of the optional CLI addressing flags (§5.2)" },
  { id = "EX-10", text = "the snapshot groups rather than flattens all of §5.3: run header / stage / next obligation / receipts; inquiry map, cursor, posture; gate evidence bound to its subject fingerprint (DEC-066); fingerprinted draft sections; content-bound review attestations and runtime findings; prompt-fragment receipts; recoverable checkpoint intent; the authored watermark" },
  { id = "EX-11", text = "the pre-write window is reachable by a DETERMINISTIC INJECTABLE HOOK, not by a timing race. §9.2 requires an edit injected into the named window to abandon the write; without a seam that a test can drive, that assertion is untestable and every rule-3 test would be theatre. The hook is test-only and must not alter the production path" },
  { id = "EX-12", text = "`tests/e2e_design_state.rs` contains EXACTLY these thirteen named tests, and the names are the contract. Rule-1/2/3 (seven, from §9.2): `hand_edit_between_applies_is_refused_at_entry`, `edit_in_prewrite_window_abandons_the_write`, `checkpoint_effects_survive_an_abandoned_write_without_duplicate`, `edit_after_final_comparison_is_caught_by_next_entry_check`, `adopt_authored_crosses_divergence_and_rebaselines_alone`, `stale_or_invalid_adoption_changes_neither_clearance_nor_watermark`, `absent_design_md_is_cold_before_first_materialise_divergent_after`. Persistence (six): `unknown_schema_version_is_refused_with_a_useful_message`, `snapshot_toml_round_trips_deterministically`, `stale_known_revision_is_refused_with_a_conflict_report`, `validation_failure_leaves_the_snapshot_byte_identical`, `reused_submission_id_with_changed_payload_is_refused`, `eviction_preserves_latest_and_outstanding_delegation_receipts`" },
  { id = "EX-13", text = "SUPERSEDED IN PART by EX-14 and EX-15 (RV-320 F-7, third verify round) — the retirement notice is the final sentence of this criterion, and the id is retained rather than renumbered (immutability), following the PHASE-05 EX-7 precedent. APPENDED (RV-320 F-7, verify round). The per-revision change log persists as its own snapshot group alongside EX-10's §5.3 groups. Rows are `(revision, index, event, subject, payload)` over the closed event vocabulary in the projection-bounds sketch (d); `change_log_floor` is recorded EXPLICITLY and never inferred from the oldest surviving row, because inference breaks when intervening revisions produced no material rows; the within-revision `index` is assigned in validated-candidate serialisation order, NEVER submission order (DEC-063 makes one apply an unordered batch); retention is bounded by `CHANGE_LOG_REVISIONS`; a `known_revision` below the floor renders as UNAVAILABLE with the floor named, never as empty — 'nothing changed' and 'I cannot tell you what changed' are opposite facts (design R2). EX-12's thirteen names are a FLOOR, not a ceiling — VA-1 verifies 'thirteen or more' — and this criterion adds three. RETIREMENT NOTICE: this criterion's original final clause required PERSISTED payload scalars to be bounded by `ENVELOPE_CHANGE_REASON_BYTES` and 12-character short-form fingerprints within `ENVELOPE_PAYLOAD_BYTES`. That clause is RETIRED — void, not merely overridden — because it bound the stored record with rendering constants, violating the layer rule (projection-bounds sketch § The layer rule). A reader must NOT satisfy it. The authoritative persisted contract is EX-14(a) alone: the stored row keeps full fidelity, the accepted regression reason is bounded only by `CHANGE_REASON_INPUT_BYTES` at admission, and no `ENVELOPE_*` constant applies to storage. RV-320 F-7's third round was right that leaving two contradictory live obligations is not settled by EX-14 merely naming the clause it supersedes" },
  { id = "EX-14", text = "APPENDED (RV-320 F-7, second verify round). SUPERSEDES EX-13's final clause on payload scalar caps, which bound the STORED record and was wrong: `ENVELOPE_*` constants bound the BUDGETED RENDERING (`design show --format prompt`) and must never propagate into the persisted row. (a) The stored change row keeps FULL fidelity — the whole regression reason EXACTLY AS ACCEPTED, stored with NO BOUND AT ALL (AMENDED TWICE: this clause originally read 'to `ENVELOPE_REASON_BYTES`', which was the layer violation it purported to forbid; EX-15 then replaced that with `CHANGE_REASON_INPUT_BYTES` = 2048, which RV-320's fourth round showed was underivable — EX-16 deletes it. The snapshot already stores unbounded prose in section bodies, so bounding this one field was special-casing without a rationale), whole fingerprints — because the snapshot is gitignored runtime state bounded by `CHANGE_LOG_REVISIONS`, so truncating it at write time destroys information to buy space in a rendering the reader may not request. `show --full` reads the stored row. (b) The RENDERED row is bounded, every term by a named cap: `DESIGN_ID_BYTES`, `DESIGN_STAGE_LABEL_BYTES`, `DESIGN_EVENT_NAME_BYTES` (RENAMED by EX-15 from the `ENVELOPE_*` forms at UNCHANGED values — they are admission bounds that never truncate, so the rendered row receives values already within them), `ENVELOPE_FINGERPRINT_SHORT_BYTES`, `ENVELOPE_CHANGE_REASON_BYTES`, within `ENVELOPE_PAYLOAD_BYTES` = 160. (c) A MECHANICAL CONTAINMENT CHECK: for every member of the closed event vocabulary, the rendered payload with every scalar at its cap is proved to fit `ENVELOPE_PAYLOAD_BYTES`, and the rendered row to fit its own worst case. This is the criterion F-1's defect class has escaped three times — in the reason, in the digests, and in an unbounded subject id — so it is a test, not an author's reading. An elided reason carries an explicit marker. AMENDED IN PART by EX-15 (RV-320 F-7, third verify round): clause (a)'s stored-reason bound and clause (b)'s three identity/vocabulary constants were themselves layer violations — F-1's defect class a FIFTH time, inside the criterion written to stop it. Where this criterion and EX-15 differ, EX-15 GOVERNS" },
  { id = "EX-15", text = "APPENDED (RV-320 F-7, third verify round). THE LAYER RULE, and the mechanism replacing three rounds of per-instance patching. A constant's prefix declares the layer it binds, and a layer may bind ONLY its own artefacts. (a) `ENVELOPE_*` bounds the budgeted rendering and NOTHING else — it may never appear in a storage-write or admission path. (b) `DESIGN_*` bounds a value at ADMISSION, the moment it is created or accepted; exceeding it is a REFUSAL, never a trim. `DESIGN_ID_BYTES` = 32 (any run-local id: node, section, gate, inquiry, attestation), `DESIGN_STAGE_LABEL_BYTES` = 16, `DESIGN_EVENT_NAME_BYTES` = 32 — all renamed from `ENVELOPE_*` at unchanged values. (c) AMENDED BY EX-16 — this clause set `CHANGE_REASON_INPUT_BYTES` = 2048 as an admission bound on an accepted regression reason. The number was never derived, so EX-16 DELETES the constant under the provenance rule and the stored reason carries NO bound. Do not implement 2048. (d) IDENTITY AND CLOSED VOCABULARIES ARE NEVER TRUNCATED: ids, stage names and event names are within bound before rendering sees them, so the emission path has no cap to apply. Truncating an id makes two distinct subjects render identically, which is F-7's own subject failing. Only gracefully degrading prose may be elided at render time. (e) The rule must RETRO-CATCH all five recurrences to date — rev 3's stored reason, rev 3's stored fingerprints, rev 3's unbounded subject id, rev 4's stored reason at `ENVELOPE_REASON_BYTES`, rev 4's truncating id cap. A rule that only explains the newest instance is not a mechanism. See projection-bounds sketch § The layer rule. AMENDED IN PART by EX-16 (RV-320 F-7, fourth verify round): this criterion's clause (c) is deleted, and its enforcement model — a grep for `ENVELOPE_*` on storage paths — is replaced by structural enforcement. The layer rule itself stands; EX-16 GOVERNS where they differ" },
  { id = "EX-16", text = "APPENDED (RV-320 F-7, fourth verify round). THE PROVENANCE RULE, plus structural enforcement. EX-15's falsifier fired on EX-15's own fix, so the mechanism widens rather than the instance being patched. (a) THE PROVENANCE RULE: every bound states what derives it, and a bound that cannot be derived is REMOVED rather than guessed, because an underivable number is a decision in disguise that will later be used to settle questions it has no standing to settle. This is orthogonal to the layer rule — `CHANGE_REASON_INPUT_BYTES` = 2048 was correctly layered AND correctly enforced AND entirely asserted, so the layer rule was blind to it by construction. (b) EX-15(c) IS DELETED: no bound applies to a stored regression reason. The snapshot already stores unbounded prose in section bodies, so bounding one field was special-casing; the projection is safe regardless because the rendered reason elides to `ENVELOPE_CHANGE_REASON_BYTES` = 96 however long the stored one is. (c) THE LAYER BOUNDARY IS ENFORCED BY RUST PRIVACY — a COMPILE ERROR, not a test and not a grep. `ENVELOPE_*` constants are PRIVATE to the rendering module; a storage or admission path cannot reference what it cannot name. Closed under aliasing and indirection, because an out-of-scope name cannot be aliased and a re-export is a visible line inside the rendering module. AMENDS THIS CRITERION'S OWN FIRST FORM, which proposed expressing the boundary in ADR-001's layering map and checking it with `tests/architecture_layering.rs`: that is IMPOSSIBLE and the reason must not be lost. `layering.toml` models ONE axis — altitude, `leaf|engine|command` — with the rule 'tier = highest altitude of any non-test file'. Pure constants import nothing, classify as LEAF, and leaf is the tier every module may depend on; the checker would LICENSE the violation rather than catch it. Do not attempt to add a rendering/storage axis to ADR-001 for this — privacy already gives a stronger guarantee at no cost. LIMIT, STATED: privacy does not catch a COPIED LITERAL (a bare `96` typed into storage code). Nothing here does; that is STD-001's no-magic-numbers rule and it is caught by review, not construction. Claiming otherwise is what lost rounds 3 and 4. (d) ADMISSION IS ENFORCED BY CONSTRUCTION: every run-local id — node, section, gate, inquiry, attestation — is built through ONE VALIDATING CONSTRUCTOR and there is no other way to make one. Per-path checks are insufficient because ids now render whole, so a single path accepting an over-bound id breaks the 32-byte row premise and the envelope arithmetic while every other test still passes. (e) The retro-catch obligation of EX-15(e) now applies to the PAIR, and the pair must account for the asserted-number instances too: rev 3's ~320 B payload, rev 3's 220 B row, F-4's 3.5 bytes/token, and 2048. A seventh instance neither rule catches means widen again. See projection-bounds sketch § The second rule: provenance" },
  { id = "EX-17", text = "APPENDED (SL-233 PHASE-03 phase-plan, 2026-07-29; owner ruling). AMENDS EX-12's test-location clause and SETTLES EX-11's hook placement. THE DEFECT: the crate is BINARY-ONLY — `Cargo.toml` declares no `[lib]` and `src/lib.rs` does not exist — so an integration test under `tests/` can only SPAWN the built binary and cannot pass a closure into any item in `src/`. EX-11 requires the pre-write window be reachable by a deterministic injectable hook; EX-12 requires `edit_in_prewrite_window_abandons_the_write` to live in `tests/e2e_design_state.rs`. Those two obligations are structurally incompatible, and no amount of care satisfies both. The precedent EX-11 rides proves the point rather than solving it: `vt5c_pre_write_cas_aborts_a_mid_turn_edit` drives `with_turn_hooked` successfully ONLY because it is a unit test inside `src/review.rs` (:3725), compiled in the same crate. (a) EXACTLY TWO of EX-12's thirteen relocate to a `#[cfg(test)] mod tests` inside `src/commands/design.rs`, beside the seam they drive: `edit_in_prewrite_window_abandons_the_write` and `checkpoint_effects_survive_an_abandoned_write_without_duplicate`. Their new home is VT-9's anchor. (b) The remaining ELEVEN stay in `tests/e2e_design_state.rs` as black-box CLI behaviours; VT-2's pattern list is narrowed to the five §9.2 names that stay, and VT-3/VT-5/VT-6/VT-7/VT-8 are untouched. (c) `edit_after_final_comparison_is_caught_by_next_entry_check` DOES NOT relocate — it asserts the NEXT invocation's entry check, which needs no in-process injection and is black-box testable. Relocating it would weaken the phase by moving a genuinely end-to-end assertion in-process. (d) THE REJECTED ALTERNATIVE, recorded so it is not re-proposed: an env-var injection seam read by the production binary and gated `#[cfg(debug_assertions)]`. It satisfies every criterion literally with no plan revision, and that is its whole appeal — but it puts a live injection branch in the dev binary whose absence from the production path a reviewer must TRUST, where relocation gets the same guarantee from the compiler for free. Rounds 3 and 4 of RV-320 were both lost to claiming more enforcement than existed; choosing trust over an available compile-time guarantee would be that error a third time. (e) EX-11's SUBSTANCE IS UNCHANGED and still binding: the hook is deterministic, test-only, and must not alter the production path — a no-hook production wrapper delegating to a `*_hooked` inner fn, exactly as `with_turn`/`with_turn_hooked` do. Only the test's LOCATION moves." },
  { id = "EX-18", text = "APPENDED (SL-233 PHASE-03 dispatch, 2026-07-29; owner ruling). AUTHORISES the partial `doctrine design show` this phase landed, which the phase brief had excluded. THE DEFECT IT CORRECTS IS IN THE PLAN, NOT THE CODE. VT-6, VT-7 and VT-8 mandate five assertions on RENDERED output — `rendered_payload_fits_its_cap_for_every_event_kind`, `elided_reason_carries_an_explicit_marker`, `stored_change_row_keeps_full_reason_and_fingerprint`, `distinct_ids_sharing_a_long_prefix_render_distinguishably`, `stored_reason_is_byte_identical_at_any_length` — and all five are anchored in `tests/e2e_design_state.rs`, a BLACK-BOX suite over a binary-only crate (EX-17's finding). A black-box test can reach a rendering only through a CLI verb. With `show` deferred to PHASE-04 no such verb exists, so those five criteria were UNREACHABLE AS WRITTEN: the same structural incompatibility EX-17 found between EX-11 and EX-12, in a different pair and missed at the same phase-plan. Landing the verb is what makes the phase's own mandated assertions executable, so it is the plan that is corrected here, not the scope that is widened. (a) AUTHORISED, exactly: `design show <slice> [--known-revision N] [--full]` — the run header and the material-change delta, the read that exercises the budgeted rendering EX-14(b) and EX-16 bound. (b) NOT AUTHORISED, and still PHASE-04's: the `TurnEnvelope` projection, `resume`, and the deprecated `slice design` shim arm. (c) The command carries `#[command(hide = true)]` on the `Design` variant in `src/commands/cli.rs`, so it is excluded from `visible_commands()`; the FAMILIES taxonomy and the help and boot goldens are UNTOUCHED by this phase. PHASE-04 therefore inherits a declared stub to extend and classify deliberately, NOT a conflict to resolve — which is precisely why this is an appended criterion rather than a deviation carried to reconcile. (d) THE GENERAL LESSON, recorded so the next phase-plan checks for it mechanically rather than discovering it at execution: a criterion that asserts on an artefact owned by a LATER phase is unreachable, and the check is cheap — for every VT whose `test_file` is a black-box suite, the verb that test must drive has to be landed by the phase that owns the VT. EX-17 and EX-18 are two instances of one defect class in this plan; a third means the phase-plan gains this check as a step, not another appended criterion" },
]
verification = [
  { id = "VT-1", expects = "the authored watermark is a real named function in the persistence shell, not a comment or a string in an error message", test_file = "src/commands/design.rs", keywords = ["watermark"], patterns = ['^\s*(pub(\(crate\))?\s+)?fn\s+\w*watermark\w*\s*\('], waived = false },
  { id = "VT-2", expects = "AMENDED by EX-17 (2026-07-29, owner ruling). The §9.2 watermark assertions that remain BLACK-BOX, each anchored at line start. Two of the original seven — `edit_in_prewrite_window_abandons_the_write` and `checkpoint_effects_survive_an_abandoned_write_without_duplicate` — are WITHDRAWN from this criterion and relocated to `src/commands/design.rs`'s test module under VT-9, because a binary-only crate cannot inject the EX-11 hook from an integration test. The other five stay here. Narrowing the pattern list and recording the withdrawal in `expects` follows the VT-7 precedent set in this same plan; the id is retained rather than renumbered (immutability). Coverage is unchanged in total — VT-2 and VT-9 together still mandate all seven", test_file = "tests/e2e_design_state.rs", keywords = ["watermark"], patterns = ['^\s*fn hand_edit_between_applies_is_refused_at_entry\(', '^\s*fn edit_after_final_comparison_is_caught_by_next_entry_check\(', '^\s*fn adopt_authored_crosses_divergence_and_rebaselines_alone\(', '^\s*fn stale_or_invalid_adoption_changes_neither_clearance_nor_watermark\(', '^\s*fn absent_design_md_is_cold_before_first_materialise_divergent_after\('], waived = false },
  { id = "VT-3", expects = "the six persistence assertions exist as functions in the same file", test_file = "tests/e2e_design_state.rs", keywords = ["revision"], patterns = ['^\s*fn unknown_schema_version_is_refused_with_a_useful_message\(', '^\s*fn snapshot_toml_round_trips_deterministically\(', '^\s*fn stale_known_revision_is_refused_with_a_conflict_report\(', '^\s*fn validation_failure_leaves_the_snapshot_byte_identical\(', '^\s*fn reused_submission_id_with_changed_payload_is_refused\(', '^\s*fn eviction_preserves_latest_and_outstanding_delegation_receipts\('], waived = false },
  { id = "VA-1", text = "RUN: `cargo test --test e2e_design_state -- --list` — all thirteen EX-12 names appear and the count is thirteen or more. A missing name is a missing assertion" },
  { id = "VA-2", text = "RUN: `rg -n 'nothing was written|nothing written' src/ tests/` — zero hits. The guarantee is `the run does not advance`, and the wrong phrasing in a comment or an error string is how the wrong guarantee gets implemented later" },
  { id = "VT-4", expects = "the snapshot path helper is a real new function in the module that owns the private constant — `design_snapshot_path` does not exist at head, so this cannot pass vacuously", test_file = "src/state.rs", keywords = ["STATE_SLICE_DIR"], patterns = ['^\s*pub\(crate\)\s+fn\s+design_snapshot_path'], waived = false },
  { id = "VA-3", text = "RUN: `rg -n '\\.doctrine/state/slice' src/ --glob '!src/state.rs'` — zero hits. The path must derive from `design_snapshot_path`; a second literal is an STD-001 violation and the two will drift" },
  { id = "VA-4", text = "ANTI-THEATRE on the pre-write window: read `edit_in_prewrite_window_abandons_the_write` and confirm it drives the EX-11 hook and asserts BOTH that the snapshot file is byte-identical AND that stage/gate state did not advance. A test that only asserts an error is returned does not prove the write was abandoned" },
  { id = "VA-5", text = "ANTI-THEATRE on rule 2: read `stale_or_invalid_adoption_changes_neither_clearance_nor_watermark` and confirm it asserts the watermark field is UNCHANGED by comparing to the pre-call value, not merely that the call errored. F-20 was raised precisely because a guard can be present and still self-refuse" },
  { id = "VA-NC", text = "NEGATIVE CONTROL: each of the thirteen EX-12 tests was observed RED before being made green, with failing output recorded in the phase sheet. For the three rule-3 tests specifically, the red must come from removing the pre-write re-check, not from a compile error — a compile failure is not a behavioural red" },
  { id = "VA-ES", text = "ESCAPE SWEEP: `rg -n '#\\[ignore\\]|todo!\\(|unimplemented!\\(|assert!\\(true' src/commands/design.rs src/design_run/ tests/e2e_design_state.rs` returns nothing; `cargo test -- --list | wc -l` has not shrunk" },
  { id = "VA-G", text = "RUN: `doctrine check gate` — exit 0 at the phase's final commit" },
  { id = "VT-5", expects = "APPENDED (RV-320 F-7). The three change-log assertions exist as functions in the same file; none exists at head, so none can pass vacuously", test_file = "tests/e2e_design_state.rs", keywords = ["change_log"], patterns = ['^\s*fn change_log_floor_is_recorded_not_inferred\(', '^\s*fn known_revision_below_floor_is_unavailable_not_empty\(', '^\s*fn within_revision_index_is_candidate_order_not_submission_order\('], waived = false },
  { id = "VA-6", text = "APPENDED (RV-320 F-7). NEGATIVE CONTROL on the three VT-5 tests: each observed RED before being made green, with failing output recorded in the phase sheet. For `within_revision_index_is_candidate_order_not_submission_order` the red must come from feeding the same declaration set in a DIFFERENT submission order and observing a different index assignment — a test that submits one order and asserts that order proves nothing about determinism" },
  { id = "VT-6", expects = "APPENDED (RV-320 F-7, second round). The five behavioural gaps EX-13 named but no test could fail for; none exists at head", test_file = "tests/e2e_design_state.rs", keywords = ["change_log"], patterns = ['^\s*fn every_material_event_kind_persists_a_change_row\(', '^\s*fn retention_evicts_oldest_revisions_and_advances_the_floor\(', '^\s*fn stored_change_row_keeps_full_reason_and_fingerprint\(', '^\s*fn rendered_payload_fits_its_cap_for_every_event_kind\(', '^\s*fn elided_reason_carries_an_explicit_marker\('], waived = false },
  { id = "VA-7", text = "APPENDED (RV-320 F-7, second round). ANTI-THEATRE on the containment check: read `rendered_payload_fits_its_cap_for_every_event_kind` and confirm it enumerates the CLOSED VOCABULARY programmatically and renders each member with every scalar SATURATED at its cap — not a hand-picked example, and not a check that merely truncates output to the cap (which can never fail). Confirm `stored_change_row_keeps_full_reason_and_fingerprint` asserts the persisted row is byte-identical to the full input after a round trip, proving the render-side cap did not leak into the store. F-1's defect class escaped three prior revisions; a containment test that cannot fail is how it escapes a fourth" },
  { id = "VT-7", expects = "APPENDED (RV-320 F-7, third round); AMENDED by VT-8 (fourth round) — `reason_over_the_input_bound_is_refused_not_truncated` is WITHDRAWN because EX-16(b) deletes the bound it tested, and `no_envelope_constant_is_referenced_on_a_storage_or_admission_path` is WITHDRAWN because EX-16(c) replaces the grep with a dependency rule. Only the first assertion below remains required by this criterion; see VT-8 for its replacements", test_file = "tests/e2e_design_state.rs", keywords = ["DESIGN_ID_BYTES"], patterns = ['^\s*fn distinct_ids_sharing_a_long_prefix_render_distinguishably\('], waived = false },
  { id = "VT-8", expects = "APPENDED (RV-320 F-7, fourth round). The EX-16 structural assertions; none exists at head, so none can pass vacuously. The unbounded-reason test replaces the withdrawn refusal test, and the id-constructor tests replace the withdrawn grep", test_file = "tests/e2e_design_state.rs", keywords = ["DESIGN_ID_BYTES"], patterns = ['^\s*fn stored_reason_is_byte_identical_at_any_length\(', '^\s*fn every_run_local_id_kind_refuses_an_over_bound_value\(', '^\s*fn no_id_is_constructed_outside_the_validating_constructor\('], waived = false },
  { id = "VA-8", text = "APPENDED (RV-320 F-7, third round). ANTI-THEATRE on the layer rule, three legs. (1) `distinct_ids_sharing_a_long_prefix_render_distinguishably` must use two ids identical for at least `DESIGN_ID_BYTES` - 1 bytes and differing only after, then assert the two RENDERED change rows differ. Two short ids prove nothing — the defect only appears at the bound. (2) `reason_over_the_input_bound_is_refused_not_truncated` must feed a reason LONGER than `CHANGE_REASON_INPUT_BYTES` and assert `apply` REFUSED it and wrote nothing; it must also feed one just under and assert the stored bytes are IDENTICAL to the input, which is what proves no rendering cap leaked into the store. A test that only checks the short case cannot fail. (3) WITHDRAWN by VA-9 — the grep leg was itself the containment check's error one level up, proving sensitivity to one spelling rather than the semantic property" },
  { id = "VA-9", text = "APPENDED (RV-320 F-7, fourth round). ANTI-THEATRE on EX-16's structural enforcement, three legs, replacing VA-8 legs 2 and 3. (1) `stored_reason_is_byte_identical_at_any_length` must store a reason far larger than any constant in the design — at minimum well past `ENVELOPE_REASON_BYTES` and past the deleted 2048 — and assert the persisted bytes are IDENTICAL to the input after a round trip, AND that the RENDERED row still fits `ENVELOPE_PAYLOAD_BYTES` with the elision marker present. Both halves are the point: full fidelity in the store, bounded in the projection, from one input. (2) `every_run_local_id_kind_refuses_an_over_bound_value` must ENUMERATE the id kinds programmatically — node, section, gate, inquiry, attestation — and for EACH feed a value one byte over `DESIGN_ID_BYTES` and assert refusal. A hand-picked kind proves nothing about the others, and it is the unenumerated kind that carries the defect. (3) `no_id_is_constructed_outside_the_validating_constructor` is the leg that makes enforcement universal rather than remembered: it must establish that the id type cannot be built by any other route — a private inner field with no public raw constructor, or the equivalent — and be demonstrated to FAIL when a bypass constructor is introduced. LAYER BOUNDARY: EX-16(c) is verified BY THE COMPILER, not by a test in this file and NOT by `tests/architecture_layering.rs` (which cannot express it — see EX-16(c)). Confirm by inspection that the `ENVELOPE_*` constants carry no `pub`/`pub(crate)` reaching storage or admission, and demonstrate the guarantee by adding a reference to one from a storage path and observing a COMPILE FAILURE, then removing it. A compile error is the evidence; there is no assertion to write. Do NOT accept a test that greps for the identifier as a substitute — that was the withdrawn VA-8 leg 3" },
  { id = "VT-9", expects = "APPENDED (EX-17, 2026-07-29, owner ruling). The two relocated rule-3 assertions live beside the pre-write seam they drive, as a `#[cfg(test)] mod tests` inside the persistence shell — the `src/review.rs` unit-test precedent EX-11 cites. Neither exists at head, so neither can pass vacuously. The anchor being `src/commands/design.rs` rather than a `tests/` file IS the criterion: it is what makes the closure injectable at all", test_file = "src/commands/design.rs", keywords = ["watermark", "prewrite"], patterns = ['^\s*fn edit_in_prewrite_window_abandons_the_write\(', '^\s*fn checkpoint_effects_survive_an_abandoned_write_without_duplicate\('], waived = false },
  { id = "VA-10", text = "APPENDED (EX-17, 2026-07-29, owner ruling). AMENDS VA-1, which read `cargo test --test e2e_design_state -- --list` and expected all thirteen EX-12 names in one suite. EX-17 splits them across two, so the count check splits with them and NOTHING is dropped. RUN BOTH: (1) `cargo test --test e2e_design_state -- --list` — the ELEVEN black-box names appear, count eleven or more (VT-5/VT-6/VT-7/VT-8 add further names to this file, so the floor-not-ceiling reading EX-13 established still holds); (2) `cargo test --bin doctrine -- --list` filtered to the design persistence module — the TWO relocated names appear. Thirteen across the two suites, or a name is missing. A missing name is a missing assertion" },
  { id = "VA-11", text = "APPENDED (SL-233 PHASE-03 phase-plan, 2026-07-29; owner ruling). AMENDS VA-2, which is UNSATISFIABLE AS WRITTEN and must not be attempted literally. VA-2 swept all of `src/` and `tests/` for `nothing was written|nothing written` expecting zero hits; measured at head that returns 25 HITS ACROSS 12 FILES, every one pre-existing and belonging to a different mechanism. `src/review.rs:2120` is the sharpest: `with_turn` holds a writer lock and hashes the very file it atomically replaces, so `nothing was written` is its TRUE guarantee — satisfying VA-2 literally would mean falsifying correct code in another subsystem. The defect is the sweep's SCOPE, not its intent. RUN INSTEAD: `rg -n 'nothing was written|nothing written' src/commands/design.rs src/design_run/ tests/e2e_design_state.rs` — zero hits. VA-2's substance is unchanged and still binding: this phase's guarantee is `the run does not advance` (EX-7), and the wrong phrasing in a comment or an error string is how the wrong guarantee gets implemented later" },
  { id = "VA-12", text = "APPENDED (SL-233 PHASE-03 phase-plan, 2026-07-29; owner ruling). AMENDS VA-3, unsatisfiable as written for the same reason as VA-11. VA-3 swept all of `src/` less `src/state.rs` for `.doctrine/state/slice` expecting zero hits; measured at head that returns 8 HITS ACROSS 6 FILES (`integrity.rs`, `doctor_checks.rs`, `lazyspec.rs`, `kinds/mod.rs`, `worktree/allowlist.rs`, `dispatch.rs`), all pre-existing. `src/kinds/mod.rs` already holds a `.doctrine/state/slice` state_dir literal, so EX-8's `a second literal anywhere is the violation` describes a condition that ALREADY EXISTS AT HEAD and that this phase is not chartered to fix. RUN INSTEAD: `rg -n '\\.doctrine/state/slice' src/commands/design.rs src/design_run/ tests/e2e_design_state.rs` — zero hits. EX-8's substance is unchanged and still binding on this phase's own code: the path derives from `design_snapshot_path`, and a second literal introduced HERE is an STD-001 violation. The pre-existing corpus-wide duplication is captured as backlog rather than silently absorbed or silently fixed" },
  { id = "VA-13", text = "APPENDED (EX-18, 2026-07-29; owner ruling). CONTAINMENT on the surface EX-18 authorises, so the legitimisation cannot later be read wider than it was granted. An authorisation with no boundary check is how a deliberate stub becomes an accidental implementation. Three legs, each with a named negative. (1) RUN `rg -n 'TurnEnvelope|resume' src/commands/design.rs` — the ONLY permitted hit is the `DesignCommand` doc comment naming both as PHASE-04's. No `TurnEnvelope` type reference, no `Resume` variant, no `run_resume` handler. Stated this way deliberately: the naive `zero hits` form FAILS on correct code here, which is the VA-11/VA-12 defect class and must not be re-introduced. (2) `DesignCommand` declares EXACTLY four variants — `Start`, `Show`, `Apply`, `Materialise`. A fifth means the surface grew past EX-18(a). (3) The `Design` variant in `src/commands/cli.rs` still carries `#[command(hide = true)]`, and `doctrine --help` does not list `design` (measured: zero hits at the phase's final commit). A visible `design` at PHASE-03 means the FAMILIES taxonomy and the help/boot goldens moved as a side effect of a persistence phase, which EX-18(c) exists to prevent" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Command surface and bounded projections"
objective = """
Wire the `doctrine design` family (start / show / apply / resume) and the single \
structured envelope every read derives from. Deliver the sparse mutation contract, \
traversal direction, the resume projection, and bounded projections with named \
limits proven against a large-run fixture. The delegation seam that the first \
revision bolted on here now lands in PHASE-10; this phase is the command surface \
and the read model, nothing else."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete — a persisted run exists to project" },
  { id = "EN-2", text = "the PHASE-02 projection sketch is re-read against the model as implemented and each of its seven answers is confirmed still true or amended on the same RV ledger. `no drift` is an acceptable and expected finding — this is a re-read, not a mandatory second review round. Record which of the seven were re-confirmed, so `no drift` is a checked claim rather than a skipped step" },
]
exit_criteria = [
  { id = "EX-1", text = "`doctrine design start|show|apply|resume` are wired and accepted by the built binary" },
  { id = "EX-2", text = "one structured `TurnEnvelope` is the canonical read model, declared as a single type under `src/design_run/` and re-exported from `src/design_run/mod.rs` BY NAME, not via a glob (`pub(crate) use envelope::TurnEnvelope;`) — the named re-export is the VT-1 anchor. Projected by the command shell as prompt, JSON, or human status (DEC-064): one type, three renderings, never three models" },
  { id = "EX-3", text = "normal output carries active path, nearby frontier, blockers, counts and material changes; full detail is explicit through `show --full`" },
  { id = "EX-4", text = "the named limits from the PHASE-02 sketch are NAMED CONSTANTS in one module (STD-001), not literals at their use sites, and they bound normal envelope frontier, change-summary, blocker and declaration-example detail against a generated fixture of hundreds of nodes" },
  { id = "EX-5", text = "`show` is a strict subset of any `inspect`-style surface; the help-text convention test guards that polarity rather than prose asserting it" },
  { id = "EX-6", text = "`apply` validates the whole candidate before any authored mutation; validation failure leaves state byte-identical" },
  { id = "EX-7", text = "the DEC-063 sparse mutation contract is implemented as authored: an omitted key persists, `null` clears a nullable scalar, `[]` clears a collection, a stable-ID object partially updates its subject, one batch is unordered, a duplicate subject is refused, and v1 has lifecycle transitions rather than deletion" },
  { id = "EX-8", text = "traversal direction is a first-class declaration set (scope §2): the user may pin, defer, prune, or select breadth/depth posture at any time, and the adaptive default — establish major branches breadth-first, pursue a consequential or blocking arm depth-first, then reassess — is the posture the run starts in. User-directed changes are distinguishable from agent-proposed ones through PHASE-02 EX-7's provenance" },
  { id = "EX-9", text = "`doctrine design resume` returns the compact projection scope §4 enumerates — active path, accepted decisions, open questions, assumptions, evidence references, blockers, next obligation — and the happy path needs only `doctrine design resume SL-NNN`; `--run`, `--known-revision`, and `--known-fragment` add explicit assumption checking or change-only projection and are never required addressing" },
  { id = "EX-10", text = "`tests/e2e_design_projection.rs` contains EXACTLY these seven named tests, and the names are the contract: `normal_envelope_stays_within_named_limits_on_a_large_run`, `show_full_may_scale_but_normal_show_does_not`, `omitted_key_persists_null_clears_scalar_empty_clears_collection`, `duplicate_subject_in_one_batch_is_refused`, `validation_failure_leaves_state_byte_identical`, `pin_defer_prune_and_posture_are_user_directed_declarations`, `resume_returns_the_seven_scope_fields_without_optional_flags`" },
  { id = "EX-11", text = "APPENDED (RV-321 disposition, 2026-07-29; owner ruling). CARRIES the three findings accepted against PHASE-03's landed delta. They are mandated HERE rather than fixed there because PHASE-03's boundary is already recorded (7c4eb95b..4e2ad8e6) and re-recording it wider would pull the funnel commit inside the range — the conformance-noise hazard PHASE-02 hit. PHASE-04 owns the budgeted projection these findings bear on and starts from that tip, so the fixes fall inside its boundary naturally. (a) RV-321 F-1 — ADMISSION BY CONSTRUCTION FOR PAYLOAD TERMS. `PayloadTerm::token` and `::label` accept `impl Into<String>` with no bound check, the fields are `pub(crate)`, `Deserialize` is derived, and `render_value` emits Token and Label WHOLE — so nothing structurally stops an over-bound identity reaching the rendered payload and breaching the 160-byte premise this phase load-bears. No live breach exists (every current caller passes an already-validated value, and the one raw-string caller is bounded at `run.rs:539`), so this is a LATENT gap: the bound is enforced by convention at each call site rather than by construction. Close it the way EX-16(d) closes it for ids — a validating constructor with no other route — AND on the deserialization path, which is an admission point that currently re-enters without re-validating. EX-16(d)'s own rationale is the warrant: per-path checks are insufficient because it is the unenumerated route that carries the defect. (b) RV-321 F-2, literal half — `render/mod.rs:82-88` retypes `\"from=\"`, `\"to=\"` and `\"reason=\"` instead of deriving their lengths from `PayloadKey::as_str` (`change_log.rs:199-216`), and `:105` pins a second bare `264` when `WIDEST_ROW_BYTES` already names it. Both are STD-001 drift that goes stale silently against a payload-key respelling. The finding's OTHER half — that `ROW_FRAMING_BYTES` = 10 against an encoder emitting four separator bytes is 'fictional framing' — was REJECTED and must not be re-fixed as though accepted: the constant's doc comment discloses the reserve, and the reserve runs in the safe direction, so containment holds a fortiori. What survives is narrow: `WIDEST_ROW_BYTES` describes a RESERVED BUDGET, not the emitted row, and nothing says so where a reader meets it. (c) RV-321 F-3 — `no_id_is_constructed_outside_the_validating_constructor` (`tests/e2e_design_state.rs:1029`) counts occurrences of the source text `DesignId {`, which is the grep-as-test VA-9(3) explicitly withdrew ('that was the withdrawn VA-8 leg 3'). It does not fail for `fn unchecked(raw: String) -> Self { Self { raw } }` inside `ids.rs`, nor for `#[derive(Default)]`, so it cannot satisfy VA-9(3)'s demonstrated-to-fail requirement. BUILD ON WHAT SURVIVES: the test's private-field assertions are the real structural guarantee and stay. Strengthen the in-module routes (Default, manual Deserialize) and DELETE the source-text count. Do NOT replace it with a second grep — that repeats the error rounds 3 and 4 of RV-320 were lost to. (d) RV-321 F-4 — `.doctrine/slice`, `design.md` and the section-marker grammar are hand-copied in `tests/e2e_design_state.rs` (:66, :89, :91, :258, :307) where `crate::kinds::SLICE_DIR`, `DESIGN_DOC` and `MARKER_OPEN`/`MARKER_CLOSE` name them. Black-box fixtures are NOT an STD-001 exception. THE ACHIEVABLE BAR IS STATED so this is not held to an impossible one: the crate is binary-only, so an integration test cannot name the private `src/commands/design.rs` constants. `SLICE_DIR` is reachable and must be used; for the marker grammar and the doc name the obligation is ONE fixture helper inside the test support module owning the spelling, so the suite holds one copy rather than five. Zero copies is forbidden by the crate layout, and claiming zero would be the over-claim (c) is about" },
]
