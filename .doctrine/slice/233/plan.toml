[[phase]]
id        = "PHASE-16"
name      = "Obligation runbook runner"
objective = """
Implement the ordered-obligation primitive per DEC-101: a TOML runbook asset per \
obligation, a seventh writer act, per-obligation discharge state bound to each \
step's definition digest, a clearance clause on `gate::advance`, envelope \
rendering of the current obligation, the `doctrine verify` family with its first \
shipped check, and ONE shipped runbook (`exploring`). Appended after PHASE-15 \
because phase ids are immutable, but it **executes before PHASE-08** — PHASE-08 \
`EX-1` claims the workflow machine's deterministic mechanism now lives in \
Doctrine, and without this primitive that rewrite can only drop the checklists or \
keep them and stay fat. Design: `.doctrine/slice/233/sketches/runbook-runner.md` \
(revision 2, post-review). The remaining two prose checklists (present-design's \
fifteen content items, the adversarial pass's attack list) are PHASE-08's to \
convert — prose is cheaper than mechanism, and splitting them balances the two \
phases. Criteria text has been amended TWICE, both times before this phase started and \
before any evidence was recorded against it, to absorb two external adversarial \
reviews. Ids are unchanged throughout; EX-16/EX-17 were appended by the first \
amendment and EX-18/EX-19 by the second, never renumbered. The second amendment \
is disclosed as a PATTERN rather than a one-off: each review found that the \
previous round's repairs rested on claims about the code that were false, which \
is why the owner's standing ruling is now to ship the mechanism and correct it \
from operation rather than to seek a third pre-implementation pass (sketch §0). \
Design: `.doctrine/slice/233/sketches/runbook-runner.md` revision 3."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-07 complete — the family is executable end-to-end, including materialise and the prompt pack" },
  { id = "EN-2", text = "DEC-101 and DEC-102 are `accepted` and `sketches/runbook-runner.md` is committed. This phase's design gate is the sketch plus the two decisions, NOT a further adversarial artefact: the owner replaced PHASE-08's six-question procedure with a design conversation on 2026-07-30, and this phase is that conversation's product. The sketch has additionally taken one external adversarial PROSE review (deliberately not an RV ledger); its ten findings are dispositioned in sketch §12" },
]
exit_criteria = [
  { id = "EX-1", text = "AMENDED (2nd review, G1): a runbook is a TOML sibling keyed to a FORWARD EDGE of the stage machine, not to a fragment. `Fragment` is a closed four-variant enum with NO exploring variant and `for_stage` collapses `Exploring | Inquiring → Inquiry` (`src/design_run/prompt.rs:32-38,96-110`), so the original 'selected by the rule fragments already use — one selection axis, not two' was not implementable. The selector is a static edge table beside the one that already exists — `boundary_runbook(from, to) -> Option<RunbookKey>` alongside `boundary_conditions` (`gate.rs:161-183`) — adding NO states, NO stages and NO `Fragment` variants. `can_advance` is a total function on non-terminal stages, so edge-keying and origin-state-keying are isomorphic and `exploring.toml` survives as authored. A step carries `id`, `text`, `required`, and an OPTIONAL `verify`; the file carries `mode`. `verify` is an ARGV ARRAY, never a shell command string" },
  { id = "EX-2", text = "a discharge binds the DIGEST OF THE STEP'S DEFINITION (`id`, `text`, `required`, `verify`), not the step id alone. An id solves reference, not equivalence: editing a step's text, its `required`, or its verifier while keeping its id must make the discharge STALE by construction — surfaced as stale and re-made deliberately. Delete-then-re-add with different content yields a different digest so nothing resurrects; delete-then-re-add identically yields the same digest and legitimately stays discharged. Skips bind the digest too. Granularity is PER STEP, not per asset — a whole-asset digest would reset step 1 because someone fixed a typo in step 5" },
  { id = "EX-3", text = "runbook validation is OWNED, not inherited. `doctrine prompt check` loads `.doctrine/hymns` plus embedded hymns and knows nothing about `design-prompts/*.toml`, so this phase adds a second corpus loader and validation domain. It rejects: unknown fields, an empty step list, empty `text`, a duplicate or ill-formed step id, an empty `verify` argv, a `mode` outside the closed set, and any placeholder outside the closed vocabulary. Every one of those is refused at VALIDATION, never discovered at execution" },
  { id = "EX-4", text = "the placeholder vocabulary (`{slice}`, `{run}`, `{repo_root}`, `{step}`) is a single-sourced named constant set per STD-001 — the closed thing is the placeholders, NOT the set of checks, which stays open-ended by design so it grows without a Rust change. Each placeholder interpolates as ONE opaque argv element with no shell between it and exec; a value containing a space or a shell metacharacter must not become syntax" },
  { id = "EX-5", text = "a seventh writer act joins `ApplyRequest::WRITER_ACTS` with its own presence predicate, arity 6 → 7. TWO enumerations move together: the production array (`src/design_run/submission.rs:600-641`) and the set-equality table in `tests/e2e_design_delegation.rs:386-398`, which exists so a seventh act fails loudly there rather than quietly widening the class (RV-324 F-6's shape). Updating one without the other must fail the suite" },
  { id = "EX-6", text = "run state gains per-obligation discharge records. Each binds the step id, the step-definition digest (EX-2), the revision it was discharged at, and its outcome: attested / verified (with the verifier's exit and captured output) / skipped (with a required reason)" },
  { id = "EX-7", text = "AMENDED (2nd review, G4/G7 + owner's ship-and-learn ruling): progression IS attestation of a NAMED step — there is no bare `next`, no way to advance without a name attached to why. PHASE-16 ships ONE mode, `sequence`: a cursor, a discharge REFUSED unless it names the step at the cursor, the cursor advancing on success. `set` mode is DEFERRED TO PHASE-08, which converts the two genuinely set-shaped checklists and will have real instances to design it against. Rationale: PHASE-16 ships exactly one runbook and it is a sequence, so `set` would land with no shipped user and — since ruling (b) removed the project-path seam — no end-to-end test able to reach it. The sequence/set DISTINCTION (imposing an order on a coverage set is fake determinism) survives intact as the argument for adding it then; only the delivery was premature. ANNOTATED 2026-08-01 (owner ruling; RV-325 round 5 F-11) — THE DISCHARGED OBLIGATION IS UNCHANGED AND NOTHING HERE REOPENS IT. PHASE-16 shipped `sequence` only, which was and remains correct; this note records only that the criterion's FORWARD ASSIGNMENT no longer holds. `set` does NOT move to PHASE-08. D14 turned both named set-shaped checklists into fragment prose, so the conversions promised here do not occur; F-5's settlement then produced five order-independent steps under `sequence`, so the `real instances` precondition is MET by different instances. `set` is deferred anyway — not for want of a user, which is withdrawn as false, but because its RENDER (cursorless, under EX-14's token bound) is unsketched and outside PHASE-08 EN-2's scope. IMP-373 now owns it, with an evidence-triggered repayment condition. DEC-101 is amended to match" },
  { id = "EX-8", text = "AMENDED (2nd review, G2): the clearance clause lands on `gate::advance` — right function, and NOT on `gate::can_advance`, which decides edge legality only (`gate.rs:149-157`) — but as a THIRD DERIVED INPUT, not as a new `Condition`. The existing vocabulary cannot express this: `Condition` is payload-free with nowhere for a step identity to ride (`gate.rs:22-121`); `DerivedDesignFacts::satisfies` is EXISTENTIAL (`live_evidence().any(..)`, `facts.rs:96-99`) while the gate needs EVERY required step; and `Refusal::GateNotCleared` carries only `Vec<Condition>`, so it cannot name a step. Underneath all three: every guard today is a STATIC conjunction whose arity is fixed at compile time, and a runbook guard is a DYNAMIC one whose members come from an asset and carry identity. So `advance` gains a `RunbookStanding { outstanding }` parameter beside `ReviewStanding` — its precedent — plus ONE new refusal variant naming the undischarged steps. NO new `Condition` variants. (If one were added anyway, the const assert at `gate.rs:141` caps its kebab name at `DESIGN_ID_BYTES` = 32 — a build stop, not a lint.) Without this clause the runner is decoration and adherence stays voluntary, which is the defect it exists to fix" },
  { id = "EX-9", text = "discharge-with-reason exists, the reason is mandatory, and it is rendered in the envelope and kept in the record. A project whose runbook carries a step its agent cannot satisfy must be able to proceed with a disclosed deviation rather than wedge the run" },
  { id = "EX-10", text = "AMENDED (2nd review, G3): verifiers execute SHELL-SIDE and their results enter through `DerivedInput` (`run.rs:87-96`) or a sibling ephemeral verifier-standing type — NEVER through caller-authored payload. The original 'results enter as PAYLOAD' was not implementable: `StageDeclaration` is `{ to, reason }` (`submission.rs:445-450`) with no slot; and routing them through `request.evidence` COMPILES and is then refused by `Refusal::DerivedConditionClaimed` (`run.rs:196-203`), because a verifier result is exactly a fact Doctrine must derive rather than accept on a caller's word. A caller-supplied result is never trusted; a result is persisted only when a discharge is admitted. The pure layer takes results as INPUTS and executes nothing. No subprocess runs inside `apply`'s admit→persist span: `apply` reads one snapshot (`src/commands/design.rs:1224`) and the only pre-write recheck covers the authored watermark before `write_snapshot` (`:1305-1315` — recheck 1311, fault hook 1313, write 1314), so that window stays as narrow as it is today. A non-zero exit refuses the discharge, and the verifier's captured stdout/stderr IS the refusal's detail, not merely a code" },
  { id = "EX-11", text = "AMENDED (2nd review, G3): required verifiers are RE-EVALUATED shell-side before the stage act is submitted, and their results reach `gate::advance` by the EX-10 derived-input path, threaded `apply` → `stage_move` → `advance`. The original claim that they 'ride the payload into `DerivedDesignFacts` — already where `gate::advance` takes its inputs' was wrong on both halves: `DerivedDesignFacts` is PERSISTED SNAPSHOT STATE (`snapshot.rs:386`), re-observed from sections (`run.rs:1272-1279`) and read off the snapshot at `run.rs:1263` — it is not the shell-input carrier. A step that verified early and has since regressed must block the advance, and it must do so without any process running inside the pure core" },
  { id = "EX-12", text = "`doctrine verify` exists as a TOP-LEVEL family carrying at least `research-current`, and it JOINS `FAMILIES` — `families_partition_the_visible_command_tree` (`src/commands/cli.rs:1917`) panics on an unclassified visible command, and help plus boot-map goldens derive from the same taxonomy, so that integration is owned here rather than discovered. AMENDED (2nd review, G8): there are TWO integration points in that test, not one — it also asserts a HARD CENSUS, `assert_eq!(visible.len(), 55)` at `:1953`, which a 56th visible command reds independently of classification. Both move, with the comment's provenance lineage extended. Its only contract is exit code plus explanatory output, documented as such. NO existing verb's exit code is repurposed as a runbook check — `doctrine slice research <id>` exits for reasons unrelated to any runbook contract, and borrowing it would break runbooks silently the day that changes" },
  { id = "EX-13", text = "exactly ONE shipped runbook lands — `install/design-prompts/exploring.toml`, carrying the five explore steps — EMBEDDED like every other design asset, resolved through the same path fragments use (`install::asset_text`). Per the owner's 2026-07-31 ruling (b) the project-override seam is IDENTIFIED AND DEFERRED, not delivered: `customization` is parsed and displayed but has no execution consumer outside the library view (`src/commands/library.rs:111`), so declaring a runbook customizable would make it no more overridable than anything else. No manifest entry is reversed, `[hymns].seal` is untouched, and nothing in this phase claims a project can override a runbook without a rebuild" },
  { id = "EX-14", text = "AMENDED (2nd review): the envelope renders the current obligation — the step at the cursor with its position. The `set` half of this criterion (rendering the undischarged required items) moves to PHASE-08 with the mode itself, per EX-7. It composes with `resume --known-fragment`: carrying one step's text is CHEAPER than today's whole fragment, so this must not become a net token regression. ANNOTATED 2026-08-01 (owner ruling; RV-325 round 5 F-11) — THE DISCHARGED OBLIGATION IS UNCHANGED. PHASE-16 rendered the cursor step and its position, as required. Only the FORWARD ASSIGNMENT moves: the `set` half — rendering the undischarged required items with no cursor to privilege — does NOT go to PHASE-08 with the mode. It is the open design question itself, not a follow-on from it, and it sits outside PHASE-08 EN-2's scope; landing it there would settle a token-budget question inside a phase whose job is to SHRINK guidance prose. IMP-373 owns it. See EX-7's annotation and DEC-101's 2026-08-01 amendment" },
  { id = "EX-15", text = "attested and verified discharge are distinguishable in both the envelope and the record. A step with no verifier is NEVER rendered as verified — the runner guarantees sequenced/gated/auditable, and only SOME steps are additionally verified (DEC-101 § what this does not claim)" },
  { id = "EX-16", text = "the stale-after-clear rule is STATED and implemented, not left to whoever gets there first: a discharge whose step definition changed after its stage already advanced surfaces as stale in the envelope and does NOT un-advance the cleared stage. Un-advancing a stage on a prose edit is worse than the problem it solves. AMENDED (2nd review, G6 + owner's ruling 2026-07-31): the EVALUATION half this rendering rule rested on is now stated too — it WARNS, it does not BLOCK. The runbook requirement is evaluated ON ITS OWN EDGE and does NOT join `cumulative_conditions` (`gate.rs:187-199`), so a prose edit to an explore step cannot block a boundary two stages later. This preserves DEC-067's actual property by another route: regressing to `Exploring` returns the run to that edge's origin, where it faces the guard again. Cumulative re-derivation is right for the existing conditions because they are global facts that rot independently of where the run stands; a runbook is an entry ritual for one transition. It is the FIRST non-cumulative condition in the machine, which is why it is stated here rather than left to whoever implements it first" },
  { id = "EX-17", text = "the deferred override seam is TRACKED, not forgotten: DEC-102's delivery claim is corrected to identify-and-defer, and a backlog item exists for the resolution work (project-path lookup, framework fallback, precedence, fingerprint scope). A deferral nobody recorded is indistinguishable from an oversight" },
  { id = "EX-18", text = "APPENDED (2nd review, G5): the step-definition digest's CANONICAL ENCODING is specified and VERSIONED, not implied. EX-2 asserts the digest's properties — notably that delete-then-re-add-identically yields the same digest — and those are not stable claims across parser versions, field ordering, or optional-field representation unless the bytes hashed are pinned. The encoding is length-delimited over the parsed fields (`id`, `text`, `required`, `verify`), computed shell-side, compared in the pure core, and carries a version tag so it can change later without silently invalidating every persisted record. The discharge record itself is likewise versioned. This is a HARDENS-ON-SHIP contract: it is snapshot state, so getting it wrong means migrating records in every repo, and the version tag is what buys the right to be wrong cheaply. Specifically it is what makes a FOURTH outcome arm — a bound null result, 'swept this scope and found nothing applicable' (sketch §7.1) — cheap to add later, which is why that arm is deliberately NOT guessed at now" },
  { id = "EX-19", text = "APPENDED (2nd review): SCOPE FENCE on the closed vocabularies. The runbook does NOT derive, satisfy, or otherwise feed the incumbent `Condition` set. `Condition::is_derived` is UNCHANGED for every variant, `ReviewStanding` is untouched, and `cleared_through` (`src/design_run/tests.rs:37-53`) is not edited. Two independent reasons, both recorded because either alone would settle it: (a) truth may not flow from user-customisable material into a Doctrine-owned closed vocabulary — once the override seam lands a project could delete a step and a built-in condition would derive true with no sweep, and the only repairs are mixed step ownership or an OR-fallback that makes the derivation decorative, both designs against a seam that does not exist; (b) there is nothing to reconcile — `governing-context-recorded` and `initial-concerns-recorded` are STUBS, specified in nine words at `design.md:268`, named in ZERO shipped guidance (absent from `install/`, `plugins/`, `.doctrine/spec/`; every occurrence outside `gate.rs` is a test), and bound to an arbitrary draft section's fingerprint because `current_fingerprint` resolves subjects only from `next.sections` (`run.rs:1283-1290`). They are a placeholder for what the runbook records, not a competing account of it. Verify the fence by grep WITH A POSITIVE CONTROL" },
]
verification = [
  { id = "VT-1", expects = "AMENDED (2nd review, G4/G7): the named behavioural assertions exist as functions, each anchored at line start; the names are the contract and they cover the behaviours the design load-bears on, not only the happy path. SEVEN, not eight — `a_set_accepts_required_steps_in_any_order` is REMOVED because EX-7 defers `set` mode to PHASE-08, and it was one of two tests unreachable under ruling (b). The other, `editing_a_step_definition_makes_its_discharge_stale`, STAYS and is explicitly a FIXTURE-BASED test over the `#[path]`-included pure model (the idiom at `tests/e2e_design_delegation.rs:36-43`), NOT a CLI end-to-end test: the only runbook source is the embed, so no black-box test can vary a step definition. It is not waived, because the digest binding is the one thing that must not ship unverified", test_file = "tests/e2e_design_runbook.rs", keywords = ["runbook", "discharge"], patterns = ['^\s*fn gate_refuses_to_advance_while_a_required_step_is_undischarged\(', '^\s*fn a_failing_verifier_refuses_the_discharge_and_surfaces_its_output\(', '^\s*fn editing_a_step_definition_makes_its_discharge_stale\(', '^\s*fn a_sequence_refuses_a_discharge_that_is_not_at_the_cursor\(', '^\s*fn a_skip_without_a_reason_is_refused\(', '^\s*fn a_verifier_that_regressed_since_discharge_blocks_the_gate\(', '^\s*fn an_attested_step_is_never_rendered_as_verified\('], waived = false },
  { id = "VT-2", expects = "the ONE shipped runbook exists in the embedded asset root with the five explore step ids and the sequence mode. Rev 1's VT-2 searched publication/manifest.toml for the new address and independently for any `customization = \"customizable\"` line, which the manifest already contains many of — it could pass without the new entry being customizable at all. That criterion is replaced rather than patched, and under ruling (b) there is no customizable entry to assert", test_file = "install/design-prompts/exploring.toml", keywords = ["explore.canon", "explore.triage"], patterns = ['^mode = "sequence"', '^id\s*=\s*"explore\.research"'], waived = false },
  { id = "VA-1", text = "RUN both writer-act vocabulary tests — the production array and `tests/e2e_design_delegation.rs`'s set-equality table each enumerate SEVEN. Then a POSITIVE CONTROL: add a seventh act to one table only and confirm the suite goes red. EX-5's guard is that the tables enforce each other, not that a human counted" },
  { id = "VA-2", text = "ANTI-THEATRE on EX-10: read the pure layer and confirm it executes NO process — a `Command::` construction anywhere in the pure core fails this criterion whatever the prose claims. Pair it with a read of the `apply` path confirming no subprocess spawn sits between `admit` and `write_snapshot`" },
  { id = "VA-3", text = "ANTI-THEATRE on EX-15: exhibit a run holding one attested and one verified discharge and confirm the envelope and record distinguish them. A single 'discharged' rendering collapses the claim the mechanism is not entitled to make" },
  { id = "VA-4", text = "ANTI-THEATRE on EX-3: introduce a runbook carrying an unknown placeholder and confirm validation refuses it BEFORE any execution path runs. A check that only fails at execution has not validated anything. Repeat for an empty `verify` argv and a duplicate step id" },
  { id = "VA-5", text = "SCOPE FENCE — `git diff --stat` for this phase shows ZERO changes to `plugins/doctrine/skills/**` and ZERO under `.doctrine/{adr,revision,requirement,memory}/`. PHASE-16 ships mechanism; the skill body is PHASE-08's. Run WITH a positive control on the same pathspec form — a negative diff is untrustworthy without one" },
  { id = "VA-6", text = "ANTI-THEATRE on EX-4: exercise a verifier whose interpolated value contains BOTH a space and a shell metacharacter, and assert it arrives as ONE argv element rather than as syntax. This is the whole point of the argv form; a test using only well-behaved values proves nothing about the failure it prevents" },
  { id = "VA-7", text = "ANTI-THEATRE on EX-2: change a step's `text` only — not its id — and confirm the prior discharge reports STALE. Then restore the text byte-for-byte and confirm it reports discharged again. The second half is what distinguishes a digest binding from a blunt invalidate-on-any-edit" },
  { id = "VA-NC", text = "AMENDED (2nd review, G7): NEGATIVE CONTROL — each of VT-1's SEVEN named tests was observed RED before being made green. Apply the phase-plan reachability check FIRST (the PHASE-05 sub-shape), but the earlier diagnosis was WRONG and is corrected rather than repeated: the digest binding, the cursor rule and the gate condition do NOT inherently collapse into one commit. They occupy separable seams — digest currency, sequence admission, verifier execution, discharge persistence, gate re-verification, skip validation, rendering — and the pure model can be compiled directly into the integration crate while the binary is spawned separately, so tests can be authored and run individually. The real coupling is limited to three pairs (gate-undischarged with verifier-regressed; failing-verifier with verifier-regressed on result capture; and nothing now shares the discharge act, since `set` is deferred). SEQUENCE THE SEVEN BY SEAM at phase-plan and expect genuine independent reds. Labelled post-green mutation stays available as a FALLBACK, not as an anticipated outcome" },
  { id = "VA-ES", text = "ESCAPE SWEEP: `rg -n '#\\[ignore\\]|todo!\\(|unimplemented!\\(|assert!\\(true' tests/e2e_design_runbook.rs` returns nothing, with a positive control; `cargo test -- --list | wc -l` has not shrunk below the standing floor of 5866" },
  { id = "VA-G", text = "RUN: `doctrine check gate` — exit 0 at the phase's final commit" },
]
