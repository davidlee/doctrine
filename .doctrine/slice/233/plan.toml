  { id = "EX-3", text = "DISCHARGES PHASE-06 EX-13(a), which remains the argument of record and is cited rather than copied. The operative rule, restated so this phase is executable without re-reading it: materialise emits, for each section in `seq` order, the marker line, a newline, the escaped body VERBATIM, then ONE newline, and CONCATENATES the blocks WITH NO SEPARATOR -- `blocks.join` is DELETED, because the join and not the trim carried the position dependence that gave interior blocks two framing newlines and the last one. Parse takes the region from just after a marker line's newline to the first byte of the next marker line or end of document, and removes EXACTLY ONE trailing newline. `trim_end` is removed from `authored_sections` (`design.rs:266`) and no trimming is reintroduced anywhere. The two regions with no trailing newline are CLASSIFIED, not left undefined: an EMPTY region is `StructuralDeletion`, and a non-empty region without a trailing newline is `UnterminatedDocument`, reachable ONLY at end of document. The oracle is byte equality, `parse(materialise(S)) == S`, NOT equality modulo whitespace, and it MUST be exercised at SECTION COUNTS 1, 2 AND 3 -- the defect rev 3 shipped was invisible at n=1 and lived entirely in the interior/last distinction" },
  { id = "EX-4", text = "NEW AT THE 2026-07-29 SPLIT -- the carriage-return obligation RV-323 round 7 left open, recorded in `notes.md` § Harvest because the raiser's argument lived only in the gitignored baton. Attacking the probe as invited, the raiser found its corpus OMITS `\\r`, and a targeted run shows `Title\\r` derives `Title` after formatting. The disposition was implementation-correctable, not design-invalidating: formatter stability is withdrawn, and `CarriageReturnInDocument` is ALREADY the document boundary. What this phase owes is therefore ALIGNMENT, not a new refusal -- declaration admission must reject a declared body carrying `\\r` on the same boundary the document parse already enforces, so a body cannot reach derivation or materialise through a door the document boundary has already closed. A test names the boundary from the ADMISSION side; a `\\r` accepted at declare and refused only at parse is the split-door defect this criterion exists to close" },
  { id = "EX-5", text = "RESTATES PHASE-06 EX-10, unchanged in substance and now binding on the phase that actually chooses the format. (a) `sketches/marker-grammar.md`'s answer to EN-2(a) states the section-id grammar's maximum encoded length and it is <= `DESIGN_ID_BYTES` (32); this is already satisfied by rev 5 and is re-checked, not re-litigated. (b) The implementation enforces the bound at id CREATION by REFUSAL -- never by truncation, per PHASE-03 EX-15(d), because a truncated id is a wrong identity rather than a short one. (c) Collision behaviour is answered and implemented for ids that are distinct but share a long common prefix, not only for exact duplicates" },
  { id = "EX-6", text = "DISCHARGES PHASE-06 EX-11 ARMS (a) AND (b) -- DOCUMENT ORDER IS NOT ID ORDER. `SectionGroup` is id-ordered for serialisation determinism and `render_document` (`src/commands/design.rs:1148`) iterates it directly, so the incumbent materialises in id order -- under this grammar `sec-11` precedes `sec-2`, and declaring `sec-10` silently moves existing prose. (a) `Section` gains a `seq` claimed from the run's existing `next_seq` counter via `claim_seq` -- no new machinery, and it inherits that counter's monotonic, pure, snapshot-derived properties. (b) materialise emits sections in `seq` order while `SectionGroup`'s id ordering is left EXACTLY as it is, because that is a serialisation rule and this is a document rule and conflating them is what produced the gap. ARM (c) -- re-adopt renumbering `seq` to the marker sequence -- is PHASE-14 EX-7 and is NOT in scope here" },
  { id = "EX-7", text = "RESTATES PHASE-06 EX-9, unchanged: the marker grammar has a ROUND-TRIP PROPERTY TEST -- for a generated section body containing marker-lookalike text, adversarial whitespace, and nested Markdown, materialise-then-parse recovers the identical section map. The sketch's escaping answer (c) is worthless unless something GENERATES the inputs it claims to survive. Generated, not enumerated: the enumerated-oracle failure is the lesson RV-323 round 5 cost a revision to learn" },
