]
exit_criteria = [
  { id = "EX-1", text = "REASSIGNED to PHASE-13 EX-1 by the 2026-07-29 plan revision. Materialise riding `write_body` belongs with the writer PHASE-13 builds. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-2", text = "REASSIGNED to PHASE-13 EX-2 by the 2026-07-29 plan revision. The marker comments and the §5.3 watermark are both emitted by that writer. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-3", text = "REASSIGNED to PHASE-14 EX-1 by the 2026-07-29 plan revision. DEC-092 rule 2 is the re-adoption protocol PHASE-14 is named for. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
