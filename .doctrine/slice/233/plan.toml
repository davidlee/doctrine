[[phase]]
id        = "PHASE-13"
name      = "Markers, byte-exact framing, and document order"
objective = """
Build the write side of the authored document: the stable-section-ID marker \
grammar of `sketches/marker-grammar.md` rev 5, a materialise that rides \
`src/entity.rs::write_body` and records the §5.3 watermark, framing that makes \
`parse(materialise(S)) == S` true BYTE-FOR-BYTE, and an emit order that is \
document order rather than id order. Split out of PHASE-06 on 2026-07-29. This \
phase deliberately stops at the write side: nothing here parses a document a \
HUMAN edited -- that is PHASE-14, and separating them is what lets this phase's \
round trip be proved against bytes Doctrine itself produced before the same \
grammar is asked to survive a hand edit."""
