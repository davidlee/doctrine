  { id = "VA-5", text = "REPLACED at rev 4. The grep this criterion used to be had the same defect F-6 found in VA-7 — `rg` returning nothing proves a spelling is absent, not that the old payload is refused, and without EX-14 serde accepts and discards it. BEHAVIOURAL: submit an apply payload carrying the removed `record` / `adopt_record` keys ALONGSIDE a valid `dispose`, and assert the submission is REFUSED naming the unknown field. The `dispose` is what makes it a real test — without it the payload would be refused as `CheckpointDispositionMissing` and the assertion would pass for the wrong reason. The grep survives only as a supporting check, never as the proof" },
  { id = "VA-6", text = "REASSIGNED to PHASE-14 VA-6 by the 2026-07-29 plan revision -- it verifies criteria that moved. The EX-13(c) anti-theatre check verifies the arm now at PHASE-14 EX-5. Restated at its new home." },
  { id = "VA-7", text = "REPLACED at rev 4 (RV-323 F-6). The grep this criterion used to be proved NEITHER half of EX-13(b): without `deny_unknown_fields` an old `title` key is accepted and ignored, the broad `rg 'title'` necessarily matches unrelated spellings such as `CreateRecord.title` (`submission.rs:224`), and `rg 'fn title'` is satisfied by a function returning a retained field, an empty string, or a wrong extraction. F-6 is this sketch's own §(d) principle — detecting one spelling is not proving a property — turned against it, and the answer is not a better grep. TWO BEHAVIOURAL OBLIGATIONS, both in VT-6. (a) WIRE REMOVAL: a declare payload carrying the old `title` key alongside a valid `body` is REFUSED naming the unknown field. (b) DERIVED-TITLE SEMANTICS — REPLACED AT REV 5 (RV-323 round 5, F-6). Rev 4 answered with a TABLE OF HEADING FORMS. Round 5 contested it for omitting one row, and the row was genuinely missing — but ADDING IT WOULD HAVE BEEN THE WRONG REPAIR, because it would have been the third patch to a hand-written enumeration (rev 3's table twice, then rev 4's). A table of cases someone thought of is not an oracle. THE INSTRUMENT IS A GENERATED PROPERTY, and the prototype that produced every number below is committed at `.doctrine/slice/233/sketches/probe/title-differential.py`. PROOF THAT THIS WAS THE RIGHT CALL RATHER THAN A PREFERENCE: the fix that looked obviously right for the first family — refuse a bare-`#`-run title — closed ZERO divergences of 4,224, and no amount of reading would have shown that. THREE OBLIGATIONS, ALL FORMATTER-FREE, because prettier is a node package that is NOT INSTALLED IN THIS REPOSITORY and a Rust test must not shell out to one: (b1) DERIVATION IDEMPOTENCE, as a generated property over the SAME PRODUCT CORPUS the probe uses (indents × hash runs × delimiters × contents × trailers, plus non-heading first lines for arms 1 and 2 — a PRODUCT, not a list): for every generated body, re-emitting the derived title as a heading and re-deriving yields the SAME title. This is exactly what strip-to-exhaustion buys, it needs no formatter, and it is the property whose absence produced the cascade. (b2) A CASE TABLE WHOSE ROWS ARE THE PROBE'S OUTPUT, NOT SOMEONE'S RECOLLECTION — that provenance is the entire difference from rev 4 and must be stated in the test, including at minimum the two the differential found: `## ###` → `SectionTitleEmpty` (the closing sequence, NOT title `###`) and `## # # #` → `SectionTitleEmpty` (the cascade, NOT title `# #`) — plus rev 4's forms, which remain correct: `## Title` → `Title`; `# T` through `###### T` → `T`; `####### T` → `SectionBodyHeadingMissing`; `#hashtag` → `SectionBodyHeadingMissing`; tab after the hashes → `T`; `## Title ##` → `Title`; three-space indent → `Title`; four-space indent → `SectionBodyHeadingMissing`; setext `T` over `===` → `SectionBodyHeadingMissing`; a body opening with a code fence → `SectionBodyHeadingMissing`; empty, newline, and blank-only → `SectionBodyEmpty`; bare `##` → `SectionTitleEmpty`; leading blank lines then `## Late` → `Late`; `## First` then `## Second` → `First` with both headings retained in the body. (b3) THE RESIDUAL IS ASSERTED AS PRESENT, NOT AS ABSENT: `# a  b` derives `a  b` WITH THE DOUBLE SPACE INTACT, pinning the declined whitespace collapse so a later reader cannot reintroduce it as an obvious tidy-up without confronting this criterion. THE RESIDUAL AGENT JUDGEMENT, which is what a VA is FOR: confirm no construction path seats a `Section` bypassing the derivation; that no stored title field survives anywhere in the snapshot; and that NO TEST, COMMENT OR DOC ASSERTS FORMATTER STABILITY OF THE DERIVED TITLE — the claim is withdrawn, and a test re-asserting it would be reinstating a property the design measured to be unreachable" },
  { id = "VA-NC", text = "REASSIGNED to PHASE-13 VA-NC and PHASE-14 VA-NC by the 2026-07-29 plan revision -- it verifies criteria that moved. It is the negative control for the six VT-1 tests, which split across both phases; each phase carries the control for the tests it writes. Restated at its new home." },
  { id = "VA-NC2", text = "NARROWED BY THE 2026-07-29 SPLIT to VT-4 alone -- VT-3 moved to PHASE-13 and PHASE-14, which carry its negative control. UNCHANGED FOR VT-4: both tests were observed RED before being made green, with failing output in the phase sheet. For `checkpoint_annotation_spelling_is_refused` the red must be a WRONG ACCEPTANCE -- the annotation payload accepted and recorded as `Adopted` before the fields were removed -- not a compile error from a field that no longer exists. Order the work so the test is written and run against the CURRENT wire first" },
  { id = "VA-NC3", text = "NEGATIVE CONTROL for VT-6's two refusal tests. Each red must be a WRONG ACCEPTANCE — the payload carrying the old key ACCEPTED and the section or checkpoint recorded — not a compile error from a field that no longer exists and not a refusal for an unrelated reason. Order the work so both tests are written and run against the CURRENT wire first, while the fields still exist; then remove the fields and add `deny_unknown_fields` together. `section_title_derivation_covers_every_heading_form` reds as a wrong acceptance too: before the procedure exists, bodies that must be refused are accepted. EXTENDED AT REV 5: the two tests VT-6 adds carry the same obligation, and one of them carries a STRONGER one. `section_title_derivation_is_idempotent_over_generated_bodies` must be demonstrated to FAIL against the rev 4 extraction rule before the rev 5 rule replaces it — the rev 4 rule is retained in the committed probe (`sketches/probe/title-differential.py`, `extract_rev4`) expressly as that positive control, and its failing output is recorded in the phase sheet. A generated property that has never been seen to fail is the same defect F-6 found in a grep, one altitude up: an instrument that cannot fire proves nothing. `section_title_keeps_internal_whitespace_runs` reds as a wrong acceptance only if an implementer has already applied the declined collapse; if it passes on first write that is EXPECTED and is not a missing red, because it pins an absence rather than a change" },
