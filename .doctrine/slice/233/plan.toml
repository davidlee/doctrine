[[phase]]
id        = "PHASE-08"
name      = "Thin adapter and guidance convergence"
objective = """
Rewrite `plugins/doctrine/skills/design/SKILL.md` from an eight-state workflow \
machine into a thin activation/recovery adapter, converge the handover adapter, \
and converge shipped guidance onto the canonical command family. This is the \
phase that ships the executable `doctrine design` family end-to-end, so design.md \
§5.5 places the `install/routing-process.md` rewrite here — see plan.md for that \
reading. Carries a design gate: no specification owns a skill body (RV-315 F-17), \
so the adapter's shape is ungoverned by any spec."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-07 complete — the family is executable end-to-end, including materialise and the prompt pack" },
  { id = "EN-2", text = "DESIGN GATE (thin adapter). `.doctrine/slice/233/sketches/thin-adapter.md` exists, is committed, and answers ALL SIX of: (a) a line-by-line disposition of the incumbent eight-state machine — for each state, moved to Doctrine / retained in the skill / dropped, with the reason; (b) what the skill still owns on activation; (c) what it owns on recovery, when no run exists and when a stale one does; (d) the target body size, with the incumbent's size as the baseline; (e) what an agent does when `doctrine design` is absent or errors — the degradation path; (f) which existing skills cross-reference `/design` and what breaks in each. A sketch missing any of the six is not a sketch. A dedicated RV ledger raised against it by a reviewer who is NOT its author is terminal with every finding dispositioned. F-17 established that no spec governs this artifact, so the adversarial pass is the only gate it gets" },
]
exit_criteria = [
  { id = "EX-1", text = "the design skill is a thin activation/recovery adapter; the workflow machine's deterministic mechanism now lives in Doctrine, and rendered guidance is invariant hymn + at most one process fragment + envelope" },
  { id = "EX-2", text = "`install/routing-process.md`'s core-process sentence teaches the canonical family, and every command it names is accepted by the just-built binary — the F-15 lower bound, proven not assumed" },
  { id = "EX-3", text = "the full install-asset delivery tail runs in this phase, since editing an `install/` asset is not self-delivering: `cargo build` re-embeds, `doctrine boot` regenerates, `doctrine boot --check` reports current, `doctrine install` refreshes the projected `.doctrine/routing-process.md`" },
  { id = "EX-4", text = "no shipped or generated core-process guidance advertises `slice design` as the canonical design-stage verb; deprecation documentation may still name the shim explicitly (§9.4)" },
  { id = "EX-5", text = "the projected `.doctrine/routing-process.md` is refreshed and no longer divergent from the embed. Both files are declared design targets; at head both contain the `slice design` core-process sentence, so both move" },
  { id = "EX-6", text = "static `/design` activation is retained — this slice does not use successful dynamic delivery as evidence that privileged activation can be removed (scope §5, A2)" },
  { id = "EX-7", text = "the handover adapter converges too (scope §4, DEC-058): `plugins/doctrine/skills/handover/SKILL.md` is a declared design target, and handover short-circuits when structured state is current — verifying persistence and returning the slice/run reference plus only residual unstructured state, instead of restating what the run already holds" },
  { id = "EX-8", text = "`skills-lock.json` is regenerated and committed. It is tracked and holds a `computedHash` per skill; rewriting two SKILL.md bodies drifts it, and leaving the drift uncommitted contaminates the next agent's `git status` and every subsequent path-limited commit" },
  { id = "EX-9", text = "`tests/e2e_claude_install.rs` gains EXACTLY these two named tests, and the names are the contract: `no_shipped_guidance_advertises_slice_design_as_canonical`, `every_command_named_by_core_process_is_accepted_by_the_binary`. The second one PARSES the generated core process for command invocations and executes each against the built binary — it does not check a hardcoded list, which would drift the moment the sentence changes" },
]
verification = [
  { id = "VT-1", expects = "the core-process sentence still exists and the file names the canonical family; VA-3's repo-wide grep is what proves `slice design` left", test_file = "install/routing-process.md", keywords = ["doctrine design"], patterns = ['^\*\*Core process:\*\*'], waived = false },
  { id = "VT-2", expects = "the two EX-9 assertions exist as functions, each anchored at line start", test_file = "tests/e2e_claude_install.rs", keywords = ["routing-process"], patterns = ['^\s*fn no_shipped_guidance_advertises_slice_design_as_canonical\(', '^\s*fn every_command_named_by_core_process_is_accepted_by_the_binary\('], waived = false },
  { id = "VA-1", text = "RUN: `doctrine boot --check` — exit 0 AND reports current, re-run at the phase's FINAL commit rather than mid-phase. A claim recorded before the last edit is not evidence about the last edit" },
  { id = "VA-2", text = "RUN: `git status --porcelain` — clean of `skills-lock.json` and of `.doctrine/routing-process.md`, per EX-5 and EX-8" },
  { id = "VA-3", text = "RUN: `rg -n 'slice design' install/ plugins/ .doctrine/routing-process.md .doctrine/state/boot.md` — every remaining hit is explicitly deprecation documentation, enumerated in the phase sheet with its justification. At plan time the only two real hits were `install/routing-process.md:47` and `.doctrine/routing-process.md:20`; both must move, and they are the ONLY guidance files that must" },
  { id = "VA-6", text = "SCOPE FENCE — do NOT converge history. A repo-wide `git grep -l 'slice design'` at plan time also hit ADR-005, ADR-014, DEC-075, QUE-190, a memory item, REV-030/032/036, REQ-089 and REQ-384. Every one is either a historical record that correctly names the verb of its own era, or a noun-phrase false positive (`the boundary against slice design`). `git diff --stat` for this phase must show ZERO changes under `.doctrine/adr/`, `.doctrine/knowledge/`, `.doctrine/revision/`, `.doctrine/requirement/`, `.doctrine/memory/`. Rewriting an accepted ADR to make a grep clean is corpus vandalism, not convergence" },
  { id = "VA-4", text = "ANTI-THEATRE on the adapter: compare the rewritten SKILL.md against the sketch's answer (d) target size and against the incumbent baseline. If the body did not substantially shrink, the workflow machine was copied rather than moved, and EX-1 is unmet whatever the prose claims" },
  { id = "VA-5", text = "ANTI-THEATRE on EX-9: read `every_command_named_by_core_process_is_accepted_by_the_binary` and confirm it EXTRACTS invocations from the generated text at runtime. A test enumerating commands in its own source is a hardcoded list wearing a parser's name, and it is exactly what let F-15 through" },
  { id = "VA-NC", text = "NEGATIVE CONTROL: both EX-9 tests were observed RED before being made green — the first against the pre-rewrite guidance, the second against a deliberately introduced bogus command name in the core-process sentence" },
  { id = "VA-ES", text = "ESCAPE SWEEP: `rg -n '#\\[ignore\\]|todo!\\(|unimplemented!\\(|assert!\\(true' tests/e2e_claude_install.rs` returns nothing; `cargo test -- --list | wc -l` has not shrunk" },
  { id = "VA-G", text = "RUN: `doctrine check gate` — exit 0 at the phase's final commit" },
]
