on shows is no truthful observable boundary WITHIN THE OBSERVED WINDOW, so the reclassification must be recorded WITH that scope and its enumeration attached, and qualifying candidate text produced later on the same standard must REVERSE it. Check this is not `stand` restored: the placement must be revised IMMEDIATELY and reversal must cost the same artefact the reword arm would have cost. A kit whose reclassification is unscoped, or whose reversal costs nothing, fails. (8) CONFIRM AN UNINFORMATIVE WINDOW IS REPORTED AS INCONCLUSIVE AND DOES NOT RECLASSIFY — an edge exercised once, or a subject never in scope across the window, demonstrates nothing, and converting it into a verdict is the defect this amendment removes. This pairs with (5): the kit reports its inconclusive rate alongside its deny rate. AMENDED AT ROUND 10 (2026-08-01, OWNER RULING; RV-325 F-16 contest). CHECKS (6)-(8) ARE WITHDRAWN with the run-side inference they verified — subject presence is a precondition, not a completion, so an exhaustive enumeration over turns asks the wrong question at each one. REQUIRED INSTEAD: (9) CONFIRM THE AUTHORING GATE IS APPLIED AND RECORDED — every obligation the assets classify 2a states a completion condition in its text; the verifier reads each one and confirms it is TRUTHFUL (satisfying it discharges the obligation, not starts it) and CHECKABLE IN RUN STATE. An obligation whose condition cannot be stated must be 2b, and a 2a step carrying no stated condition FAILS this criterion. This is the check that makes DEC-104 falsifiable and it runs over the WHOLE SET, before and independently of any exercise. (10) CONFIRM THE KIT COLLECTS ADHERENCE AGAINST THE STATED CONDITION, NOT CLASSIFICATION FROM BEHAVIOUR: the misclassification observation becomes `discharged at a turn where the step's stated condition was not satisfied`, which is mechanical. A kit that still asks a moderator to infer whether an obligation COULD have been complete has restored the intent-reading this criterion removed at round 4 AMENDED AT ROUND 11 (2026-08-01, OWNER RULING; RV-325 F-17, CONCEDED). CHECK (9)'S `CHECKABLE IN RUN STATE` IS WITHDRAWN FROM THE CLASSIFICATION TEST AND RELOCATED TO CHECK (10) AS A COLLECTION SCOPE. (9) NOW READS: confirm every obligation the assets classify 2a STATES A TRUTHFUL COMPLETION CONDITION in its text — satisfying it discharges the obligation rather than starting it — and that an obligation which cannot state one is 2b; a 2a step carrying no stated condition still FAILS this criterion. THE WITHDRAWN CLAUSE CONTRADICTED THE ROUND-3 OWNER RULING THIS CRITERION NEVER REOPENED — `verification strength is an orthogonal axis, not the sorting rule`, which exists to give mechanically unverifiable but genuinely mandatory human acts (semantic scope reconciliation, knowledge capture) somewhere honest to sit rather than being demoted to lenses. Round 10 argued against RUN INFERENCE, not against that orthogonality. Applying the gate is what exposed the conflict, and it condemned FOUR OF `exploring.toml`'S FIVE SHIPPED STEPS alongside the two acts round 3 protected by name — a runbook whose only admissible steps carry mechanical verifiers is a verifier list, which is DEC-101 and DEC-102 gutted. (10) IS EXTENDED: the adherence observation is collected ONLY over conditions that are STATE-VISIBLE — both terms readable from run state — and THE KIT MUST NAME THE OBLIGATIONS THE SIGNAL CANNOT REACH AND REPORT THE COVERED FRACTION, on the same footing as the deny rate at (5). A kit reporting an adherence rate over a denominator it never covered fails this criterion. State-visibility grades a condition's EVIDENCE; it never decides classification. (11) CONFIRM THE GATE WAS ACTUALLY APPLIED AND ITS RESULT RECORDED PER OBLIGATION. The verifier reads the design's own worked table over ALL NINE 2a obligations — the four this slice relocates AND `exploring.toml`'s five, which are 2a assignments this slice made — and checks that each row carries a stated condition and a state-visible verdict. A gate applied to one exemplar has not reproduced its own assignments, which is F-17 exactly, and the count is nine rather than four because a whole shipped asset had been excused on the strength of one of its five members carrying a verifier. NOTE FOR THE VERIFIER: VERIFIER-REACHABILITY IS NOT STATE-VISIBILITY. A verifier is an argv whose exit code decides; scope reconciliation has no reachable verifier and IS state-visible at edge 4. Conflating them is how F-17 read the `no reachable verifier even in principle` row as condemning three obligations under the gate." },
