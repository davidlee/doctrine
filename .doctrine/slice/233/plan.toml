[[phase]]
id        = "PHASE-09"
name      = "Evaluation kit"
objective = """
Deliver the deterministic evaluation kit beneath `.doctrine/slice/233/evaluation/`: \
fixture, moderator protocol, rubric, evidence collectors, and assertions covering \
the adopt / adhere / refresh / recover / complete evidence classes. These artifacts \
gate SL-233 closure; CHR-049 runs the live human-in-the-loop exercise post-close \
against installed bytes. Coordinator-only: a dispatch worker never writes authored \
.doctrine/ state, and a fork carries its own empty `.doctrine/state` (verified at \
plan time), so this cannot run from a worktree."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-08 complete — the skill and prompt assets exist in the shape the kit will evaluate" },
]
exit_criteria = [
  { id = "EX-1", text = "a deterministic fixture, moderator protocol, rubric, evidence collectors, and assertions exist under `.doctrine/slice/233/evaluation/`" },
  { id = "EX-2", text = "evidence is classified separately as adopt, adhere, refresh, recover, and complete — not collapsed into one score" },
  { id = "EX-3", text = "the kit measures interaction cost and token cost, so R1 (ceremony exceeding its value) can be judged on evidence rather than impression" },
  { id = "EX-4", text = "the kit samples acceptance-basis usefulness: whether reviewers or resumed agents use it, whether it disambiguates acceptance, and its interaction cost" },
  { id = "EX-5", text = "the kit is mechanically verified — the assertions run, not merely exist" },
  { id = "EX-6", text = "the kit records honestly that a successful outcome alone is not proof of behavioural adoption, and that CHR-049's live exercise against genuinely installed assets is the actual evidence" },
  { id = "EX-7", text = "`tests/e2e_design_evaluation.rs` contains EXACTLY these two named tests, and the names are the contract: `evaluation_kit_assertions_run_over_all_five_evidence_classes`, `rubric_scores_a_known_bad_transcript_below_a_known_good_one`. The second is the kit's own negative control — a rubric that cannot separate a deliberately bad transcript from a good one is not measuring anything" },
  { id = "EX-8", text = "APPENDED (2026-08-01, owner ruling; RV-325 round 3 F-7). THE FRAGMENT-VERSUS-STEP TRADE IS PRE-REGISTERED, NOT NARRATED. DEC-104 chose every-turn 2b fragment delivery over discharged 2a steps on the asserted ground of `fewer receipts, better odds the content is in front of the agent`, and admitted no test can fail. EX-3 measures interaction cost but supplies no decision rule, so the exercise could only report what happened. The kit therefore carries, WRITTEN BEFORE ANY RUN: (a) the compared treatments — the pre-SL-233 skill baseline, and where a fixture permits, the nineteen-step edge-3 shape D14 rejected, so the comparison is against the step shape rather than against nothing; (b) the three falsifying signals named in `sketches/thin-adapter.md` — adherence no better than the step shape, receipt churn implying arrival without attention, and per-turn fragment cost exceeding the interaction cost it replaced; (c) the revision each result triggers, ROUTED BY SUBJECT. AMENDED at RV-325 round 4 (F-10): the original text sent a negative delivery result to a COVERAGE-SET step and declared DEC-104 not reopened. That is incoherent — DEC-104 classifies the content as 2b precisely BECAUSE it has no truthful boundary completion, so moving it to 2a either falsifies that classification or is inadmissible under it — and exempting DEC-104 from the falsifier is the very manoeuvre F-7 raised, one level up. The premise was also a category error: NONE of the three delivery signals is evidence about completability. REQUIRED INSTEAD: a negative delivery result triggers MECHANISM-SIDE revision (re-emission semantics, fragment size/split, envelope-visible digest) and DEC-104 STANDS; IMP-373 is not the fallback and stays deferred on DEC-104's own merits. (d) A FOURTH, SEPARATELY-SUBJECTED SIGNAL — MISCLASSIFICATION — whose firing reopens DEC-104's discriminator and nothing else: agents discharging a 2a step at a moment where it cannot honestly be complete (no real boundary — it was never a step), or agents treating a 2b lens as having a natural completion moment they would gate on (an act the rule demoted). The kit must keep the delivery signals and the classification signal DISTINCT, since a result that could be routed to whichever revision is cheapest is not a falsifier. CHR-049 runs this and may not substitute a narrative for the comparison. AMENDED AGAIN (2026-08-01, owner ruling; post-round-4 self-audit): (d)'S TWO HALVES ASKED A MODERATOR TO READ INTENT. `cannot honestly be complete` and `treating a 2b lens as gate-worthy` are inferences about a mind, with no adjudicator and no rubric anchor named — structurally the criticism F-3 made of the ORIGINAL discriminator, and it leaves DEC-104 unfalsifiable by F-7's route one level down. BOTH HALVES ARE RE-ANCHORED TO OBSERVABLE EVENTS. (i) A 2a STEP WAS DISCHARGED AT A TURN WHERE ITS SUBJECT DID NOT YET EXIST IN RUN STATE — checkable from the run record without inferring honesty; SCOPED, deliberately, to the steps where it is checkable (selector recording via `slice selector list`; knowledge capture via a record `shapes SL-NNN` inside the run's window) and DISCLOSED as not collectible for `inquire.scope`'s `or explicitly confirm` branch, which by design leaves no artefact — that clause is what makes the step finite. A conservative signal that never fires falsely beats a broad one that needs an inference to fire at all. (ii) THE AGENT EXPLICITLY ASKED WHETHER A LENS WAS COMPLETE, OR REQUESTED A GATE OR CHECKPOINT ON ONE, QUOTED VERBATIM — a speech act in the transcript, not a read of what the agent WOULD do. Half (ii) cannot be run-state anchored at all, since a lens is fragment prose with no discharge event; dropping it was the alternative and was REJECTED, because it would leave the falsifier one-directional — able to detect 2a-was-never-a-step and never 2b-should-have-been-2a. AMENDED AGAIN (2026-08-01, owner ruling; RV-325 round 5 F-12): THE RE-ANCHORED SIGNAL OVERCLAIMED ITS CONSEQUENCE AND SO BREACHED VA-5 — the defect VA-5 exists to catch, reproduced inside the repair meant to satisfy it. A 2a discharge before its subject exists is ALSO produced by a correctly classified boundary act that was falsely or prematurely attested, or by step text that misled a compliant agent about when it completes. The event therefore does NOT prove `no real boundary — it was never a step`, and that clause is WITHDRAWN. TWO CORRECTIONS. FIRST, THE CONSEQUENCE IS WEAKENED TO WHAT THE EVIDENCE CARRIES: firing REOPENS THE DISCRIMINATOR'S APPLICATION TO THAT STEP, and reopening admits exactly three outcomes — REWORD (a truthful completion boundary exists and the text failed to name it), RECLASSIFY to 2b (no truthful boundary exists), or STAND (the run was anomalous). Reopening is not reversal, and nothing here reclassifies on the raw event. SECOND, THE EVIDENCE MUST CARRY A WITHIN-RUN CONTROL: record, at the same edge and in the same run, whether the OTHER 2a steps were discharged with their subjects present. A premature discharge of one step BESIDE correct discharges of its siblings is step-specific and reaches the discriminator; premature discharge across the board is agent-general adherence, routes to the adherence signal, and reaches the discriminator not at all. Where more than one run is available the same contrast across runs strengthens it, but CHR-049 specifies a single moderated exercise, so the WITHIN-RUN control is the collectible one and cross-run corroboration is opportunistic — this is disclosed, not assumed. THE SAME CORRECTION APPLIES TO HALF (ii): a lone request to gate a lens is also ordinary confusion, so it likewise reopens rather than reclassifies, and likewise needs the contrast against how the same agent treated the other lenses in that run. AMENDED AT ROUND 6 (2026-08-01, owner ruling; RV-325 F-11 contest and F-13). THREE STALE OR DEFECTIVE CLAUSES ABOVE ARE WITHDRAWN. (1) `IMP-373 is not the fallback and stays deferred on DEC-104's own merits` — the first half stands, the second is FALSE and was withdrawn at round 5 without this criterion being swept: `set` is deferred because its RENDER is unsketched and outside EN-2, and IMP-373 owns it. (2) `envelope-visible digest` as a mechanism-side revision candidate is VACUOUS and is removed from that list: the digest ALREADY rides every emission as the `name@digest` header `design resume` emits (`prompt.rs` RECEIPT_SEPARATOR and `receipt`/`parse_receipt`), so proposing it as a revision proposes the status quo. The mechanism-side candidates are RE-EMISSION SEMANTICS and FRAGMENT SIZE/SPLIT — two, not three. (3) `STAND` IS REMOVED FROM THE RESOLUTION SET (F-13). VA-4 requires every falsifying signal to name a result that WOULD REVISE THE PLACEMENT, and an unconditioned `stand` let any firing be narrated after the fact as an anomalous run — the route-to-the-cheapest-revision manoeuvre VA-5 forbids, reappearing as route-to-no-revision. ONCE THE SIGNAL FIRES THE PLACEMENT IS REVISED: REWORD or RECLASSIFY, and no third exit. THE ANOMALY CONTROL MOVES INTO THE PRE-REGISTERED FIRING CONDITION, which is where it belongs and where it can be stated before any run. The signal fires only when ALL of: (a) the within-run sibling control is satisfied — the other 2a steps at that edge were discharged with their subjects present; (b) the run did NOT cross a deliberate context break or resume at that edge, which CHR-049's protocol deliberately induces and therefore makes identifiable rather than hypothetical; and (c) the run was not aborted or restarted mid-edge. THE ASYMMETRY IS DELIBERATE AND STATED: reword is the conservative outcome and absorbs the marginal case, so the cost of a false firing is a text improvement, not a wrongly reclassified obligation. A resolution set whose cheap arm is safe does not need an escape hatch. AMENDED AT ROUND 7 (2026-08-01, owner ruling; RV-325 F-14 and F-15). THE ROUND-6 AMENDMENT NARROWED THE EXIT SET AND THE EXCLUSION SET IN ONE MOVE AND EACH NARROWING LOST WHAT IT REPLACED — the seventh instance of a repair reproducing its own finding's defect, and the reason these two findings must be answered together rather than in sequence. (1) `BOTH REVISE THE PLACEMENT OR ITS BOUNDARY CONTRACT, WHICH IS WHAT VA-4 ASKS` IS WITHDRAWN AS FALSE (F-15): rewording a 2a step's boundary text leaves it a 2a step on the same edge, revising the obligation's CONTRACT and not its PLACEMENT, and VA-4's noun is PLACEMENT. Broadening the noun so the cheap arm qualifies is structurally what `stand` was doing — an exit that changes no placement, reached by a route nothing pre-registers. VA-4 IS NOT AMENDED: it asks each signal to name A result that would revise the placement, and RECLASSIFICATION is that result; what would defeat it is not the presence of a cheap arm but an UNREACHABLE EXPENSIVE ONE. (2) THE REOPENING IS ITSELF PRE-REGISTERED, because that is where the routing manoeuvre had migrated to: every other link — the observation, the sibling control, the firing condition, the resolution set — was pre-registered while the CHOICE BETWEEN THE TWO ARMS was left to `the reopening`, which is route-to-the-cheapest-revision with the routing step renamed and a VA-5 breach on its own terms. THE RULE: (a) RECLASSIFY TO 2b IS THE DEFAULT — what a firing means unless the reword arm earns its exit; (b) REWORD MUST PRODUCE AN ARTEFACT — the reopening records CANDIDATE STEP TEXT naming a completion boundary that is truthful for that obligation AND observable in run state at the moment the new text says the step completes, which is the standard signal (i) already meets; no candidate text, no reword; (c) REWORD IS ONE-SHOT PER STEP — the reworded boundary is a prediction, so a second firing on the same step after a reword spends cause (C) and reclassifies with no further reopening (disclosed: at N=1 CHR-049 cannot itself exercise (c); it binds the step's post-close life and is stated as a commitment, not as a control the exercise collects). This inverts the cost gradient the round-6 asymmetry rested on. F-12's correction is untouched — nothing reclassifies on the raw event, and cause (B) still routes to adherence. (3) THE FIRING CONDITION IS COMPLETED (F-14). `Stand` covered ANOMALY unbounded; its replacement covered three NAMED events and omitted the commonest, INCIDENTAL CONTEXT EXHAUSTION OR COMPACTION, which nothing marks — CHR-049's observation list records only `refresh and exact resume across a deliberate context break`, so a run could satisfy the written condition after an UNMARKED context loss and force a revision for exactly the anomaly the control exists to exclude. The RUN RECORD cannot close this and was never going to: Doctrine observes writes, not an agent's context, the same limit already disclosed for IMP-373's repayment signal. Of F-14's three remedies, bounding the exercise below the context window is unverifiable in advance and would still need the observation to confirm it held, a mechanically observable run-record proxy does not exist for the reason just given, and INSTRUMENTING EVERY CONTEXT BOUNDARY is the one that lands — its site being the MODERATOR PROTOCOL, which is SL-233's to write and not CHR-049's (that chore's Boundary says so in terms), so the repair lands here rather than as a request on the chore. THE CONDITION BECOMES, ALL REQUIRED: (a) the within-run sibling control is satisfied; (b) THE RUN CROSSED NO CONTEXT BOUNDARY AT THAT EDGE — neither the deliberate break and resume CHR-049 induces NOR AN INCIDENTAL ONE (context exhaustion, compaction, or harness-initiated summarisation); (c) the run was not aborted or restarted mid-edge; (d) THE MODERATOR PROTOCOL RECORDED THE CONTEXT STATE across the window containing the discharge — absent that record (b) is UNDECIDED and the observation is UNCOLLECTED, NOT WEIGHED, which is the disposal the round-5 sibling control already takes. DEFAULT-DENY IS WHAT MAKES THE CONDITION DECIDABLE: it is satisfied only on positive evidence, never by the absence of a mark. COST, DISCLOSED: default-deny lowers the probability the signal fires at all, and at N=1 a falsifier that cannot fire is a formality; recording context boundaries is a standing moderator obligation with a named field rather than a lucky observation, so the deny branch should be rare, and IF IT IS NOT RARE THE KIT MUST REPORT THAT — a run whose context state went unrecorded is evidence the exercise cannot support this signal, and saying so is the honest outcome rather than absorbing it. (4) THE ROUND-6 WARRANT FOR REMOVING `STAND` HAS LAPSED AND IS REPLACED, NOT RESTATED. `A resolution set whose cheap arm is safe does not need an escape hatch` no longer holds once reword must earn its exit and reclassification is the default. `Stand` goes because IT WAS POST-HOC AND UNCONDITIONED — anomaly belongs in the pre-registered firing condition, which is where (3) now puts all of it including the incidental case. One principle applied twice in one turn: EVERY EXIT AND EVERY EXCLUSION IS PRE-REGISTERED; NOTHING IS CHOSEN AFTER THE RUN. CLARIFIED AT ROUND 8 (2026-08-01, owner ruling; RV-325 F-15 contest, REJECTED — NO RULE CHANGES, EXPOSITION ONLY). The round-8 contest read (2)(c) as the sole route to compulsory reclassification and concluded that placement revision is unreachable within CHR-049's single exercise. IT SKIPS (2)(a) AND (2)(b). THE FIRST-FIRING ROUTE IS (b)-FAILS-THEREFORE-(a)-APPLIES: candidate text that names no observable completion moment does not earn the reword arm and THE FIRING RECLASSIFIES — first firing, N=1, no second firing required, which VA-5 (2) already states in terms. It is not a formality, because THE CANDIDATE-TEXT BAR IS UNMEETABLE EXACTLY UNDER CAUSE (A): DEC-104 classifies content as 2b PRECISELY BECAUSE it has no truthful boundary completion. Text producible means a truthful observable completion boundary exists and the step is 2a-eligible, so REWORD IS THE CORRECT OUTCOME rather than an escape — VA-4 asks each signal to name A result that would revise the placement, not that every firing produce one. Text not producible means no such boundary exists, which IS cause (A). The artefact test is therefore the (A)-against-(C) discriminator the round-5 scale note leaves to the reopening. RESIDUAL, DISCLOSED: failure to produce candidate text can also mean nobody thought of the right text, so default-deny biases toward the EXPENSIVE arm — the residual is a FALSE RECLASSIFICATION, the safe direction, and the gradient round 7 inverted on purpose. AMENDED AT ROUND 9 (2026-08-01, owner ruling; RV-325 F-16, CONCEDED IN FULL). THE ROUND-8 CLAUSE INFERRED `TEXT NOT PRODUCIBLE THEREFORE NO SUCH BOUNDARY EXISTS` AND CONCEDED IN THE SAME BREATH THAT NON-PRODUCTION CAN EQUALLY BE FAILURE TO INVENT — so the reclassify branch revised a placement on an ADMITTED FALSE-POSITIVE ROUTE, and disclosing that is not repairing it. THAT INFERENCE IS WITHDRAWN AS INVALID. THE SEARCH IS NOW BOUNDED, AND IT ENUMERATES MOMENTS RATHER THAN WORDINGS: wordings are unbounded so failing to find one licenses nothing, but the candidate completion MOMENTS are finite — the run record holds a finite sequence of turns in the window at that edge and at each one the obligation's subject is present in run state or it is not, which is exhaustive over an enumerable domain and is the check VA-5 already performs on signal (i), run once per turn instead of once. THE REOPENING RECORDS: (1) THE OBLIGATION'S SUBJECT — what it actually delivers; a candidate boundary naming something else fails the truthfulness leg and is not a competing wording; (2) THE TURNS in the run's window at that edge and, for each, whether that subject was present; (3) THE OUTCOME — if some turn has it present, that turn IS a truthful observable boundary, candidate text naming it exists, and the arm is REWORD; if no turn does, reclassification proceeds ON THE ENUMERATION and not on anyone's failure to think of a wording. THE CLAIM IS SCOPED TO WHAT THE ENUMERATION SHOWS: no truthful observable boundary WITHIN THE OBSERVED WINDOW, not `none exists`. Two consequences, both pre-registered: (a) THE RECLASSIFICATION CARRIES THAT SCOPE AND ITS ENUMERATION AND IS DEFEASIBLE — qualifying candidate text produced at any later point on the same (i)/(ii) standard REVERSES it; this is NOT `stand` returning under a third name, since `stand` changed no placement and cost no artefact whereas here the placement is revised IMMEDIATELY and reversal costs exactly the artefact the reword arm would have cost — the reword arm arriving late; and (b) AN UNINFORMATIVE WINDOW IS REPORTED, NOT CONVERTED INTO A VERDICT — if the edge was exercised once, or the subject was never in scope during the window, the enumeration demonstrates nothing, and the kit REPORTS THE RESULT INCONCLUSIVE and does not reclassify. F-16'S THIRD REMEDY IS NOT TAKEN WHOLESALE: `classify the result as inconclusive and state that the N=1 exercise cannot falsify this direction` would make the expensive arm unreachable again, which is F-15 exactly, and answering F-16 by reversing F-15 would be the EIGHTH INSTANCE of a repair reproducing its own finding's defect — this time by restoring a defect the review had already removed. RESIDUAL, DISCLOSED: the enumeration is exhaustive over MOMENTS, not over SUBJECTS. Which deliverable is the obligation's real subject is a judgement, and the truthfulness leg defeats a subject-redefining reword only if that judgement holds — the same judgement VA-5 already performs on signal (i), not a new one. Reduced, not eliminated. AMENDED AT ROUND 10 (2026-08-01, OWNER RULING; RV-325 F-16 contest, CONCEDED). THE ROUND-9 ENUMERATION IS WITHDRAWN, AND WITH IT THE WHOLE ATTEMPT TO DERIVE THE CLASSIFICATION FROM RUN EVIDENCE. Subject ABSENCE proves a step is not complete; subject PRESENCE does not prove a truthful completion moment exists — the selector obligation commits to `what the code-impact section NOW commits to` (thin-adapter.md:463-474), so a recorded selector coexists with an unfinished obligation, and enumerating turns exhaustively only asks the wrong question at every turn. Rounds 5-10 all failed the same way because CLASSIFICATION IS A PROPERTY OF AN OBLIGATION'S TEXT, NOT OF A RUN: no single exercise can establish that no truthful completion moment exists. REQUIRED INSTEAD — THE CLASSIFICATION TEST IS AN AUTHORING GATE. (1) EVERY 2a STEP STATES ITS OWN COMPLETION CONDITION IN ITS TEXT, at authoring time, and the condition must be TRUTHFUL (satisfying it DISCHARGES the obligation rather than starting it) and CHECKABLE IN RUN STATE. (2) AN OBLIGATION WHOSE COMPLETION CONDITION CANNOT BE STATED IS NOT A STEP — it is 2b. This is decidable over the whole set BEFORE ANY RUN and re-runnable by anyone, which is what makes DEC-104 falsifiable by a check that can actually fail. (3) THE EXERCISE COLLECTS ADHERENCE, NOT CLASSIFICATION: the observation becomes `the agent discharged at a turn where the step's STATED condition was not satisfied` — mechanical, with no inference about a mind and no claim about what does not exist. Routing is unchanged: agent-general across siblings routes to adherence; step-specific means THE CONDITION WAS MIS-STATED and the repair is the condition. The reopening keeps its two arms and its firing condition and no longer derives the classification. CHR-049 feeds evidence into the design; the owner arbitrates the design. AMENDED AT ROUND 11 (2026-08-01, owner ruling; RV-325 F-17, conceded). THE GATE'S TWO LIMBS ARE SPLIT: `checkable in run state` is WITHDRAWN from the classification test — which now asks only that a 2a step state a TRUTHFUL completion condition in its text — and RELOCATED to collection. It contradicted the round-3 ruling that verification strength is orthogonal to the sort, demoting the two mechanically unverifiable but mandatory acts that ruling protects by name and condemning four of `exploring.toml`'s five shipped steps. (i)'S SCOPING ABOVE IS SUPERSEDED IN BOTH HALVES: knowledge capture is OUT (its condition's left-hand term is not in run state, and a record's presence was never its completion), and `inquire.scope` is IN at edge 4 (the gate asks for a STATE CONDITION, not an artefact, so the `or explicitly confirm` branch's artefact-lessness does not bear on it). The signal is collected over the STATE-VISIBLE conditions and the kit must NAME the obligations it cannot reach and REPORT the covered fraction — five of nine, applied over all nine 2a obligations including `exploring.toml`'s five. The reword arm retains `checkable in run state` deliberately, so that a firing cannot be answered by rewording a condition out of visibility" },
]
