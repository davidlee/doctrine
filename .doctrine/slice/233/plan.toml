objective = """
Deliver the `reviewing` stage, which the first plan draft left entirely unowned \
despite scope §5 naming its preservation as an objective: content-bound human and \
adversarial section attestations, the v1 choreography (section-level human \
alignment then an integrated adversarial pass), finding disposition, and the \
`reviewing -> locked` predicate including the user-acceptance attestation."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 complete — fingerprinted sections exist for an attestation to bind to" },
