  { id = "EX-6", text = "REASSIGNED to PHASE-14 EX-4 by the 2026-07-29 plan revision. The shim forwards to `design materialise`, so it cannot land before materialise does. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-7", text = "SUPERSEDED by PHASE-11. Conservative import was assigned here by the 2026-07-27 revision and reassigned to its own phase on 2026-07-28 because PHASE-06 was carrying four separable deliverables behind one design gate. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home" },
  { id = "EX-8", text = "REASSIGNED to PHASE-14 EX-8 by the 2026-07-29 plan revision. The `tests/e2e_design_materialise.rs` enumeration is completed by PHASE-14; PHASE-13 EX-8 states the subset that must exist when PHASE-13 ends, so the file is never asserted complete while it is not. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-9", text = "REASSIGNED to PHASE-13 EX-7 by the 2026-07-29 plan revision. The round-trip property tests the marker grammar's escaping answer, which PHASE-13 implements. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-10", text = "REASSIGNED to PHASE-13 EX-5 by the 2026-07-29 plan revision. The `DESIGN_ID_BYTES` bound constrains the section-id format PHASE-13 chooses. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-11", text = "REASSIGNED to PHASE-13 EX-6 (arms a and b) and PHASE-14 EX-7 (arm c) by the 2026-07-29 plan revision. Arms (a) and (b) are `seq` and the emit order, both write-side; arm (c) -- document order authoritative on re-adopt -- is re-adoption behaviour and is unstatable before PHASE-14. The id is retained rather than renumbered (immutability); the requirement is unchanged, only its home -- the EX-7 precedent of 2026-07-28. The obligation is RESTATED at its new home, not merely pointed at from it." },
  { id = "EX-12", text = "APPENDED (PHASE-05 carried finding — the dual route to `Disposition::Adopted`). ONE SPELLING REACHES A DISPOSITION. Two do today: `Dispose::Adopt` (`run.rs:573`), which passes `plan_checkpoints`' EX-4 validation — `knowledge::adoptable`, kind and usable status against the real record — and the retained annotation `record` + `adopt_record` (`run.rs:582`), which reaches the same `Disposition::Adopted` with NEITHER that validation nor the `shapes` edge, because `plan_checkpoints` returns early when `declaration.dispose()` is `None` (`design.rs:681`). The same hole reaches `Disposition::Created` via `run.rs:585`. The consequence is not nothing: the snapshot, and through `envelope.rs:833` the TurnEnvelope an agent reads, can assert an adoption of a record that does not exist or has been withdrawn. RESOLUTION IS COLLAPSE, NOT A SECOND VALIDATION PATH: the `record` and `adopt_record` fields are removed from `Declaration`, `checkpoint_disposition` loses both `(None, Some(_))` arms, and a checkpoint that names no `dispose` is `CheckpointDispositionMissing`. Justified because the pair is WIRE-ONLY — nothing in the shell ever sets them (only `resolved_record` has a builder, `resolving`, for DEC-086's claimed id), so no recovery path depends on them — and because `doctrine design` is not yet executable, making this the last point at which removing a wire spelling is a cleanup rather than a breaking change. Three landed fixtures migrate to the `dispose` form: `tests/e2e_design_state.rs:755`, `tests/e2e_design_projection.rs:272`, `src/commands/design.rs:1359`" },
  { id = "EX-13", text = "APPENDED (marker-grammar sketch rev 2, after RV-323 round 1 — findings F-1 and F-3). THE DOCUMENT AND THE SNAPSHOT MAY NOT DISAGREE UNDETECTED. Three obligations, one defect seen from three sides. (a) BODIES ROUND-TRIP BYTE-EXACTLY, BY FIXED FRAMING AND NO TRIMMING ANYWHERE. `render_document` emits `section.body` raw while `authored_sections` applies `trim_end` (`design.rs:258`, `:266`), so a body ending in spaces or a blank line does not survive and nothing refuses. REVISED after RV-323's verify round contested the first repair: admission-time normalisation silently alters prose the caller declared, which is a smaller instance of this sketch's own defect class, and `trim_end` is not the only option — it consumes greedily and cannot know how much of what it ate was separator, but a FIXED-WIDTH separator is removable exactly because the amount is known. REVISED AGAIN after RV-323 round 3 contested the second repair, and the contest understated the problem: `render_document` builds each block as marker + newline + body + newline and then calls `blocks.join(\"\\n\")`, so an INTERIOR block carries TWO framing newlines and the LAST carries ONE — verified by `od -c` over a materialised three-section document. `exactly one newline as the block separator` therefore described neither the incumbent nor a total rule, and remove-exactly-one would have left a spurious blank line on every interior body. THE FRAMING AFFIX MUST BE UNIFORM, because position-independence is what makes the EOF case disappear instead of needing a special case. So: materialise emits, for each section in `seq` order, the marker line, a newline, the escaped body VERBATIM, then ONE newline — and CONCATENATES the blocks WITH NO SEPARATOR (`blocks.join` is deleted; the join, not the trim, carried the position dependence). Parse takes the region from just after a marker line's newline to the first byte of the next marker line or end of document, and removes EXACTLY ONE trailing newline. The two region states with no trailing newline are classified rather than undefined: an EMPTY region is `StructuralDeletion`, and a non-empty region without a trailing newline is `UnterminatedDocument` and is reachable ONLY at end of document — provable, because a marker line starts at column 0, so the byte before it is a newline, so every non-final region either is empty or ends in one. The oracle is byte equality, `parse(materialise(S)) == S`, NOT equality modulo whitespace, and it MUST be exercised at SECTION COUNTS 1, 2 AND 3 — the defect rev 3 shipped was invisible at n=1 and lived entirely in the interior/last distinction. (b) `title` IS DERIVED, AND THE WIRE FIELD IS REMOVED. `title` and `body` are independent caller-supplied fields (`submission.rs:124-132`) and `render_document` never emits `title` (`design.rs:1148-1157`), so a section's title can drift from its prose forever with nothing to detect it, and a retitle moves no fingerprint and invalidates no attestation. A section's body BEGINS with its own ATX heading — which is what `render_document` already assumes — and `Section.title` is derived from that heading. The derivation must be TOTAL. Rev 2's rule was not, and rev 3's four-row table was not either — RV-323 round 3 contested it for being NEITHER EXHAUSTIVE NOR DISJOINT (an empty body was caught by two rows; setext headings, an ATX heading inside a fenced code block, and a bare `#hashtag` were classified by no row). A table of cases is not a partition, so the rule is a DECISION PROCEDURE over a named domain. DOMAIN: an arbitrary `String`. RECOGNISER, spelled out because `an ATX heading` is not self-defining: a line is an ATX HEADING LINE iff it is zero to three U+0020 spaces, then a run of one to six `#`, then either end-of-line or a space or a tab. PROCEDURE, in order, where `f` is the first line that is not blank (blank = nothing but spaces and tabs): (1) no such `f` → `SectionBodyEmpty`; (2) `f` is not an ATX heading line → `SectionBodyHeadingMissing`; (3) `f`'s extracted text is empty → `SectionTitleEmpty`; (4) otherwise the title is that text and every other line, heading or not, is ordinary body content. Disjoint because each guard negates its predecessors; total because arm 4 is the unguarded remainder. EXTRACTION — REWRITTEN AT REV 5 (RV-323 round 5, F-3), and the rev 4 wording it replaces was wrong in TWO ways, only one of which the contest found. Drop the leading spaces and the `#` run; call what remains the CONTENT REGION, which by the recogniser is empty or begins with a space or tab. Then, ON THE CONTENT REGION WITH ITS LEADING WHITESPACE STILL PRESENT: drop trailing whitespace; then WHILE what remains ends in a run of `#` that is either preceded by whitespace or is the whole region, drop that run and any whitespace before it; finally trim leading and trailing whitespace. (1) THE LEADING WHITESPACE MUST SURVIVE UNTIL AFTER THE CLOSING-SEQUENCE TEST. Rev 4 dropped it first, so on `## ###` the region became `###`, the trailing run was preceded by nothing, the test could not fire, and the title derived as `###` — while CommonMark reads that heading as EMPTY, because the closing sequence is preceded by the delimiter space. (2) THE STRIP MUST RUN TO EXHAUSTION, NOT ONCE — rev 4's single pass leaves a CASCADE (`## # # #` derives `# #`, then `#`, then nothing, one group per formatting pass). Defect (2) was NOT in the contest; it was found by the generated differential that replaced VA-7's enumerated table, which is the whole argument for replacing it. WHY THE CLOSING SEQUENCE IS DROPPED AT ALL, RESTATED: rev 4 justified this step by prettier's behaviour. THAT JUSTIFICATION IS WITHDRAWN AND THE RULE IS KEPT ON A BETTER ONE — CommonMark defines a trailing `#` run preceded by whitespace as the heading's OPTIONAL CLOSING SEQUENCE, i.e. framing and not content, which is true whether or not any formatter exists. FORMATTER STABILITY OF THE DERIVED TITLE IS NOT CLAIMED AND MUST NOT BE ASSERTED: the differential shows the families fall one at a time (closing sequences, cascades, whitespace runs, then inline emphasis `*em*` to `_em_`), a per-character probe over all printable ASCII plus unicode found NO unstable character because the instability is a TOKEN-PAIR property so no charset can close it, and a title derived from source bytes cannot be stable under a tool that rewrites source bytes while preserving meaning. Only a Markdown INLINE PARSER could close it; that is a dependency this CLI does not have and PHASE-06 is NOT scoped for it — route it to its own slice if a reviewer judges it required. CONSEQUENTLY THE INTERNAL-WHITESPACE COLLAPSE IS NOT ADOPTED even though it closes a measured family (`# a  b` to `# a b`, 832 divergences), because its ONLY justification was the withdrawn one, and keeping a rule whose derivation has been retracted is the habit F-4 named. A double space in a heading stays in the derived title. Setext and `#hashtag` are classified as REFUSED by decision, not left undefined. An ATX heading inside a fence CANNOT be `f` — every line before `f` is blank and a blank line opens no fence — so no fence handling is needed. The rule is deliberately `first non-blank line` and NOT `first heading anywhere`, which would let prose precede the title and silently promote a third-paragraph heading. THE SAME PROCEDURE RUNS AT ADOPTION, not only at declare: otherwise a hand-edited document could seat a section whose title is underivable, which is the partiality reintroduced through the other door. Same reasoning as EX-12: two ways to say one thing, one of them unvalidated, is the defect. (c) RE-ADOPTION ADOPTS THE PROSE. `adopt_authored` updates only `fingerprint` (`run.rs:281-295`); `body` is assigned in exactly one place in that file (`run.rs:497`, the declare path), and `DerivedInput.authored_sections` is a `BTreeMap<DesignId, Fingerprint>` (`run.rs:64`) carrying digests WITHOUT bodies, so the pure layer cannot adopt prose even in principle. Consequence today: a user hand-edits `design.md`, adoption records the new fingerprint, the snapshot keeps the pre-edit body, and the next `materialise` renders that stale body over the edit and re-baselines the watermark to the reverted bytes — silent data loss with the watermark certifying it. `DerivedInput.authored_sections` must carry the authored body alongside its digest and `adopt_authored` must store it PARTITIONED BY THE 2026-07-29 PLAN REVISION, WITHOUT CHANGING ONE WORD OF THE ARGUMENT ABOVE: this criterion remains the record of record for all three obligations and is cited by id from its new homes rather than copied. (a) BODIES ROUND-TRIP BYTE-EXACTLY is discharged by PHASE-13 EX-3, which is where the marker grammar that delimits a region first exists -- (a) is unstatable before it. (b) `title` IS DERIVED stays HERE for the DECLARE arm and the wire-field removal, which need nothing but `submission.rs`; its ADOPTION arm ('THE SAME PROCEDURE RUNS AT ADOPTION') is discharged by PHASE-14 EX-6, because the hand-edited document that arm guards against can only reach adoption once PHASE-14 opens that door -- placing the guard with the door is not deferral, and the arm is NOT waived. (c) RE-ADOPTION ADOPTS THE PROSE is discharged by PHASE-14 EX-5, with which it shares `DerivedInput` and `adopt_authored`" },
  { id = "EX-14", text = "APPENDED (marker-grammar sketch rev 4, after RV-323 round 3 — finding F-6). A REMOVED WIRE FIELD MUST BE REFUSED, NOT IGNORED. `Declaration` derives `Deserialize` WITHOUT `#[serde(deny_unknown_fields)]` (`submission.rs:106`), so deleting a field leaves serde silently accepting and discarding the old key. RUN, with a positive control: a declare payload carrying `totally_bogus_key` was ACCEPTED and the section created (`section_created sec-4`); a payload with a type error on a real field was refused, so the deserializer does reject what it is asked to — the negative result is trustworthy. CONSEQUENCE: the field removals EX-12 (`record`, `adopt_record`) and EX-13(b) (`title`) are UNFALSIFIABLE without this attribute, which is exactly what F-6 found. So `Declaration` gains `#[serde(deny_unknown_fields)]`. SCOPED DELIBERATELY: `ApplyRequest` carries `#[serde(flatten)]` on its envelope (`submission.rs:467`) and the attribute is incompatible with flatten, so it must NOT be applied there; the obligation is `Declaration` only. This rides an existing seam rather than introducing a mechanism — `observation/wire.rs`, `observation/request.rs`, `publication.rs` and `worktree/jail.rs` all carry the attribute already" },
]
