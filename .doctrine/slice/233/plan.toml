  { id = "VA-NC", text = "NEGATIVE CONTROL: both EX-7 tests were observed RED before being made green, with failing output in the phase sheet" },
  { id = "VA-ES", text = "ESCAPE SWEEP: `rg -n '#\\[ignore\\]|todo!\\(|unimplemented!\\(|assert!\\(true' tests/e2e_design_evaluation.rs` returns nothing; `cargo test -- --list | wc -l` has not shrunk" },
  { id = "VA-G", text = "RUN: `doctrine check gate` — exit 0 at the phase's final commit" },
