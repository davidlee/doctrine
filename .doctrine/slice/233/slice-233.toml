[[selector]]
selector = "src/kinds/dirs.rs"
intent = "design-target"
note = "PHASE-04 EX-11(d)/RV-321 F-4: `.doctrine/slice` must come from crate::kinds::SLICE_DIR, not a copied literal. Reaching it from a black-box fixture required the entity-tree roots extracted to a dependency-free src/kinds/dirs.rs, because kinds::resolve pulls crate::fsutil and kinds/mod.rs therefore cannot be #[path]-included into a test. Crate-level visibility is preserved exactly: mod dirs is private, the pub(crate) use re-exports the same seven roots that were pub(crate) before, the other seventeen stay leaf-private. Verified against the base tree."

