# ── After the model (06–08) ────────────────────────────────────────────────
# Each renders or publishes the finished model; none can precede it.

[[phase]]
id        = "PHASE-06"
name      = "The contract corpus and the stage-entry receipt"
objective = """
Make the contract readable before it is violated: nine narrative assets keyed by
the condition's kebab token, published and `fixed`, and a stage-entry receipt
that delivers the edge's ENFORCED set — what the edge judges by, not its own
rows alone — with the structure injected from CONTRACTS so the prose can never
restate it and contradict it.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05's exit criteria are met: CONTRACTS exists, `Contract::remedy()` renders from the rule, and `cumulative_conditions` applies the reach filter." },
  { id = "EN-2", text = "`fragment_section` (design.rs:1832-1851) is the live receipt register — per-invocation declaration, identity line unconditional, body only when the declaration does not match. `DesignSnapshot::fragments` is dead state and is NOT the register to build on." },
]
exit_criteria = [
  { id = "EX-1", text = "Nine narrative assets exist at install/design-prompts/conditions/<token>.md, one per generated condition, addressed by `Condition::contract_asset_key`. The subdirectory is not cosmetic: it makes the corpus set-equality test a prefix filter rather than a filter minus a hand-maintained exclusion list for the four fragment stems (STD-001)." },
  { id = "EX-2", text = "Nine [[entry]] rows in publication/manifest.toml, kind=guidance, customization=fixed, citing the same reason in the same words the obligation runbooks already give: not that a project may not disagree, but that the override seam does not exist yet (DEC-102 ruling (b); IMP-372 carries the resolution)." },
  { id = "EX-3", text = "The prose restates nothing structural. The renderer injects kind, the acts with their required actors, the binding, the observed facts and the reach from the const row; the asset carries narrative only." },
  { id = "EX-4", text = "`design resume` emits a contract block beside the fragment and the runbook step, selected by `Advance::from_stage`, carrying the enforced set — cumulative_conditions, reach-filtered and accumulated — so the counts are two / four / six / eight up the machine. The renderer calls the function the gate calls; there is no second copy of the reach rule." },
  { id = "EX-5", text = "`--known-contracts <edge>` is repeatable and takes Advance's kebab name — bare, per DEC-124's no-digest ruling, which is defensible here precisely because no contract is parameterised by the run. Declared held elides every narrative body and no header line. An unknown or mismatched token elides nothing." },
  { id = "EX-6", text = "A locked run emits no contract block — the same real answer `Fragment::for_stage` and `boundary_runbook` already give there, and asserted so that None is not read as a gap." },
  { id = "EX-7", text = "The receipt token is NOT folded into the fragment receipt. A fragment binds bytes by digest and a contract deliberately does not; folding would force one of them to change. Two tokens on one emission." },
]
verification = [
  { id = "VT-1", expects = "every condition has an asset and the corpus has no orphan — set equality over the generated vocabulary and the design-prompts/conditions/ prefix — and the manifest's rows for that prefix are set-equal to the vocabulary too, so a row naming a retired condition fails", test_file = "src/design_run/tests.rs", keywords = ["contract_asset_key", "every_condition_has_an_asset_and_no_orphan", "design-prompts/conditions"], waived = false },
  { id = "VT-2", expects = "the remedy is the contract's: the refusal's remedy text for a condition equals the discharge the receipt injects for the same condition, asserted over EVERY row rather than a sample. `review-disposition-attested` is the row that makes the quantifier matter — it is the only multi-line discharge, and a test over the easy eight would pass without it.", test_file = "src/design_run/tests.rs", keywords = ["remedy_equals_discharge_for_every_row", "review-disposition-attested"], waived = false },
  { id = "VT-3", expects = "the receipt covers what the edge judges by: at reviewing the block carries eight contracts, five from edges below; at drafting six, four from below. Asserted as set equality against cumulative_conditions for that edge, not as a count, so it cannot pass on the right number of wrong rows.", test_file = "src/design_run/tests.rs", keywords = ["receipt_covers_the_enforced_set", "cumulative_conditions"], waived = false },
  { id = "VT-4", expects = "the bottom edge's receipt is its own boundary and nothing more — the exploring block carries exactly `governing-context-recorded` and `initial-concerns-recorded` — and both also appear in the reviewing block, which is what an accumulating receipt means", test_file = "src/design_run/tests.rs", keywords = ["bottom_edge_receipt_is_its_own_boundary", "governing-context-recorded"], waived = false },
  { id = "VT-5", expects = "a declared receipt elides bodies and keeps identity; an unknown or mismatched edge token elides nothing; a locked run emits no block; and a refusal reads no asset — the gate leg renders every remedy with no embedded corpus available, which asserts the tier boundary rather than trusting it", test_file = "tests/e2e_design_state.rs", keywords = ["known-contracts", "declared_receipt_elides_bodies_not_headers", "locked_run_emits_no_contract_block"], waived = false },
  { id = "VA-1", expects = "the nine narratives are read end to end against their const rows: each says what the const does not, restates nothing the renderer injects, and cites no repo-private id (DEC-127's general rule; ISS-309 owns the existing corpus violations, and this corpus must not add to them)" },
  { id = "VH-1", expects = "the slice's acceptance test, taken here because this is where it becomes true: a reader who has not seen src/** or the test suite can say what exploring→inquiring requires and how to discharge it, from the receipt and a refusal alone" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-07"
name      = "The warning lamps"
objective = """
Ship the two derived facts that must inform a decision without barring it —
integrated-pass currency and outstanding findings by severity. Neither is a
condition: a guard bars a move, and a fact whose own repair invalidates it
cannot be a guard. Both render as no-passive-cost scalars, following
`cursor_stale`.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05's exit criteria are met, and PHASE-04 has put `ReviewPass` and `ObservedReview` on the run." },
  { id = "EN-2", text = "`SectionRow::clearances` has already retired with the evidence store (PHASE-05 EX-11), so the envelope's uncapped neighbour is gone and this phase's additions are measured against the budget that leaves." },
]
exit_criteria = [
  { id = "EX-1", text = "Currency derives as `pass.covered.is_current(current_section_digests)` — the comparison `integrated_current` already performs, over a record that can name an RV — and is never stored." },
  { id = "EX-2", text = "`OutstandingBySeverity { blocker, major, minor, nit }` is a fixed record rather than a map, because the ledger's severity vocabulary is closed at four and an absent key and a zero count would be one fact with two spellings. Outstanding means status not in {verified, withdrawn} — deliberately wider than DEC-138's gating predicate, and the two filters stay separately spelled." },
  { id = "EX-3", text = "Both render as scalars on `TurnEnvelope`: the currency flag inline only when true, the severity summary as one line of four counts omitted entirely when every count is zero. No passive cost, not evictable (the byte-budget ladder in `evict_one` holds lists, not scalars), and no rung to choose." },
  { id = "EX-4", text = "Neither warning is a condition and neither can refuse: a stale pass sets the flag and reviewing→locked still succeeds." },
  { id = "EX-5", text = "The envelope carries no contract prose at any stage, so DEC-124's byte-budget ruling is asserted rather than assumed. What this slice adds to the envelope is exactly two scalars and one enum name — the third being PHASE-03's rendered ReviewPolicy, which is the visibility half of that policy's fence and must not be trimmed as a convenience." },
]
verification = [
  { id = "VT-1", expects = "the currency lamp is rendered and never refuses: a stale integrated pass sets the envelope flag and the forward move still succeeds. Asserted at the render surface, not the gate, because it is not a condition.", test_file = "src/design_run/render/envelope.rs", keywords = ["currency_lamp_renders_and_never_refuses", "is_current"], waived = false },
  { id = "VT-2", expects = "the severity summary counts every non-terminal finding, omits itself entirely when all four counts are zero, and is wider than the gating predicate — an `answered` blocker is counted here and does not hold the edge", test_file = "src/design_run/render/envelope.rs", keywords = ["OutstandingBySeverity", "severity_summary_is_wider_than_the_gate"], waived = false },
  { id = "VT-3", expects = "the envelope carries no contract body and no remedy at any stage", test_file = "src/design_run/render/envelope.rs", keywords = ["envelope_carries_no_contract_prose"], waived = false },
]
