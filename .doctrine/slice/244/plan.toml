[[phase]]
id        = "PHASE-08"
name      = "The published stage-machine diagram"
objective = """
Objective 6, and the one deliverable the model does not touch: a single
published, generated document showing the machine an agent is standing in —
four stages, four forward edges, which conditions guard which, and what each
edge INHERITS, which is the fact no local view carries. Published because the
reader is always a repo-external consumer; generated because that reader cannot
check freshness for itself.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05's exit criteria are met — `Advance::ALL`, `boundary_conditions` and CONTRACTS are the macro's output and are the single source this artefact is pinned to." },
  { id = "EN-2", text = "src/funnel_machine.rs (ARTIFACT_PATH + render_artifact, fixed prose consts, derived rows, golden test) is read as the in-tree precedent — the only diagram-documenting-a-machine in the tree, and it transfers whole." },
]
exit_criteria = [
  { id = "EX-1", text = "src/design_run/artifact.rs is a new leaf-tier sibling module with out-degree into `gate` only, exporting ARTIFACT_PATH = install/design-run-stages.md and `render_artifact() -> String`. A sibling rather than more of gate.rs, which is about gating; rendering a string is pure, so ADR-001 is untouched." },
  { id = "EX-2", text = "The artefact carries, in the order a reader needs them: a mermaid stateDiagram-v2 over Advance's four values with each edge labelled by its enforced count; an edge table whose INHERITED column is the point of it; a condition table whose every column is a projection of the CONTRACTS row; and fixed prose on backward moves, because there is nothing to derive — the backward relation is not enumerable and a regression is guarded by a stated reason." },
  { id = "EX-3", text = "It does NOT carry the contract narratives. They are addressable per condition and delivered per edge; inlining nine of them makes one document nobody reads instead of nine delivered when they apply." },
  { id = "EX-4", text = "install/design-run-stages.md is published at reference/design-run-stages.md, kind=reference, customization=fixed, reachable by `doctrine library show`. The reference/ prefix and not design-prompts/: this is a document a reader asks for by name, not a member the machine selects and delivers." },
  { id = "EX-5", text = "The shipped file states its PROVENANCE, not its edit procedure — funnel-machine.md's change-the-table-and-re-render banner is correct in this repo and useless in a client project. The banner wording is the policy this slice sets for the first generated asset in the shipped corpus, and a second one reuses it." },
  { id = "EX-6", text = "customization=fixed here is STRUCTURAL, a third class beside DEC-102's permanently sealed entries and the genuinely provisional runbooks: overriding a derived description does not change what is derived, it only makes the description wrong. Recorded in the manifest header, because IMP-372's sweep has two kinds of entry it must not move, not one." },
  { id = "EX-7", text = "No flake.nix change is owed — install/ is already grafted into srcWithDist. Confirmed rather than assumed before the phase closes." },
]
verification = [
  { id = "VT-1", expects = "the golden holds: render_artifact() equals the embedded bytes. The one test that makes every claim below mechanical, and the test a vocabulary addition, a reach change, a binding change or a new edge all break until the file is re-rendered.", test_file = "src/design_run/artifact.rs", keywords = ["ARTIFACT_PATH", "render_artifact", "rendered_artifact_matches_the_embedded_bytes"], waived = false },
  { id = "VT-2", expects = "every condition appears exactly once and every edge appears exactly once — the rendered tables' key sets equal Condition::ALL and Advance's four values, and the diagram carries one labelled transition per edge row", test_file = "src/design_run/artifact.rs", keywords = ["every_condition_appears_exactly_once", "every_edge_appears_exactly_once"], waived = false },
  { id = "VT-3", expects = "the inherited column is the enforced set: for each edge, the row's inherited conditions equal cumulative_conditions minus that edge's own boundary rows. Asserted because that column is the artefact's reason to exist and is the one a hand-render would get wrong.", test_file = "src/design_run/artifact.rs", keywords = ["inherited_column_is_the_enforced_set", "cumulative_conditions"], waived = false },
  { id = "VT-4", expects = "the diagram and the contract headers agree: for each condition, the kind, discharging act, binding and reach rendered here equal what the receipt injects. Two renderings of one CONTRACTS row, asserted equal.", test_file = "src/design_run/artifact.rs", keywords = ["diagram_and_contract_headers_agree", "CONTRACTS"], waived = false },
  { id = "VT-5", expects = "it is reachable by address — `doctrine library show reference/design-run-stages.md` returns the artefact — asserted at the surface a client repo would actually use, which is DEC-127's whole reason for refusing the spec-sibling", test_file = "src/publication.rs", keywords = ["design-run-stages", "reference/design-run-stages.md"], waived = false },
  { id = "VA-1", expects = "the artefact cites no DEC-, SL- or ISS- id. Per-repo sequential ids do not dangle in a client project — they resolve to an unrelated record silently, which is worse (ISS-309)." },
