[[phase]]
id        = "PHASE-03"
name      = "Sweep inventory"
objective = """
Enumerate and adjudicate (design 6.1, 6.2): a DeepSeek pi worker \
(`./scripts/pi-research`, read-only) records every `*.md` token, library path \
form and restate offender over the inventory roots with a recommendation; the \
orchestrator writes `.doctrine/slice/273/inventory.toml`, sets a verdict on \
every row, logs ownerless-concept rows to IMP-500, and commits.\
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete and committed: the rename and retirement have landed, so targets are stable (R2)." },
  { id = "EN-2", text = "The worker brief (roots, occurrence definition, row schema, class and recommend vocabularies of design 6.1) is written in notes.md." },
]
exit_criteria = [
  { id = "EX-1", text = "`.doctrine/slice/273/inventory.toml` holds one `[[row]]` per occurrence with the design 6.1 fields; ids C-nnn / R-nnn, append-only. Roots: `plugins/doctrine/skills/**`, `install/**`, prose-bearing string literals in `src/**`." },
  { id = "EX-2", text = "Completeness control: every mention printed by `cargo test -- --ignored no_bare_library_mention_in_shipped_text` maps to an inventory row by file and excerpt; unmapped mentions are added as rows before adjudication." },
  { id = "EX-3", text = "Every row carries a verdict (accept | amend | reject), applying the design 6.2 rules; `resolved` is set on every amend; convert targets use post-rename addresses (`reference/essentials.md`). No empty verdict." },
  { id = "EX-4", text = "Every `log` row's file and line is appended to IMP-500's body." },
  { id = "EX-5", text = "The adjudicated inventory is committed on edge and edge is promoted to main (`git fetch . edge:main`) before PHASE-04 dispatch." },
]
verification = [
  { id = "VA-1", text = "Script over inventory.toml: zero rows with empty verdict; zero amend rows with empty `resolved`. Output in notes.md." },
  { id = "VA-2", text = "Completeness cross-check (EX-2) output in notes.md: zero unmapped mentions." },
  { id = "VA-3", text = "`doctrine show IMP-500` lists every `log` row's location." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Apply and enforce"
objective = """
Apply the adjudicated inventory and make the bare report enforcing (design \
6.3): a DeepSeek pi worker, dispatched confined, applies exactly the accept and \
amend rows; the orchestrator un-ignores `no_bare_library_mention_in_shipped_text` \
and verifies the diff per occurrence against the inventory before accepting \
the import. Hosts RV-408 F-1.\
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete; the adjudicated inventory is on main." },
  { id = "EN-2", text = "RV-408 F-1 (control), before dispatch: the per-occurrence verification script (design 6.3 steps 2-4, over inventory.toml and `git diff`) exists and, run on a seeded diff that converts a slice-artefact `design.md` mention adjudicated `leave` to `lib:templates/design.md` in the same hunk as an authorised glossary conversion, reports that occurrence as unauthorised. Script and control output recorded in notes.md." },
]
exit_criteria = [
  { id = "EX-1", text = "The worker's hand-back changes only occurrences of accept / amend rows, located by file and excerpt. If the diff is too large to verify in one pass, the phase splits into two dispatches along the C-/R- boundary (design 6.3)." },
  { id = "EX-2", text = "RV-408 F-1: before the import is accepted, the verification script runs on the real hand-back: every accept/amend excerpt reads as adjudicated; every leave/reject excerpt is unchanged; every changed occurrence maps to exactly one applied row — sharing a hunk with an authorised row authorises nothing; every `log` row is in IMP-500. Zero violations; output in notes.md." },
  { id = "EX-3", text = "`#[ignore]` removed from `no_bare_library_mention_in_shipped_text`; it and `every_shipped_lib_citation_resolves` pass (I1, I2)." },
  { id = "EX-4", text = "`doctrine check gate` green." },
]
verification = [
  { id = "VT-1", expects = "both shipped-roots tests run by default and pass", test_file = "src/lib_citation.rs", keywords = ["no_bare_library_mention_in_shipped_text", "every_shipped_lib_citation_resolves"], waived = false },
  { id = "VA-1", text = "RV-408 F-1 control run (EN-2) and real-diff run (EX-2) outputs present in notes.md; both show the expected result." },
  { id = "VA-2", text = "`grep -B2 'fn no_bare_library_mention_in_shipped_text' src/lib_citation.rs` shows no `#[ignore]`." },
]
