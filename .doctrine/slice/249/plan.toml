[[phase]]
id        = "PHASE-06"
name      = "The filled mint"
objective = """
Close the hole. A `form = "create"` disposition mints a record already holding
its facet and its prose, in one act, with no follow-up write.

`CreateRecord` gains the facet payload as a map keyed by field name, because
`CreateRecord.kind` is a runtime token and a typed per-kind struct cannot be
selected at compile time. The map is validated at ADMISSION by the same
`plan_facet_edits` the CLI runs — not a second check — so a disposition naming a
field the kind does not own is refused with the run unchanged: no hollow record,
no reserved id burned (D5).

The write joins the prose write PHASE-01 sited at step 5, for the reason DEC-168
actually holds on: `apply_record_effects` already exists, is already idempotent,
and already carries the status move and the `shapes` edge, so a record's content
joins effects that resume as a unit rather than splitting across two steps with
different resume semantics. (DEC-168's RECORDED rationale — that step 4 can only
reach the journal — is false about the code; D8a carries the correction, and it
rides the objective-4 REV because this slice has no verb for amending a knowledge
record, which is precisely the hole it exists to close.)

After this phase the two headline losses are both closed: the wire has a slot and
the sink is loud.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 complete: `plan_facet_edits` exists, so admission validates through the same seam the CLI does." },
  { id = "EN-2", text = "PHASE-01 complete: the prose half is already written at step 5, so this phase adds a second payload to an existing site rather than opening one." },
]
exit_criteria = [
  { id = "EX-1", text = "A `form = \"create\"` disposition mints a record whose facet AND prose are populated in one act, with no follow-up write. This is the criterion that closes the data loss." },
  { id = "EX-2", text = "The facet payload is validated at admission, before any id is reserved, by the same `plan_facet_edits` the CLI runs. A bad payload costs no hollow record and no burned id." },
  { id = "EX-3", text = "The validation is the same function, not a second copy — a facet key rejected at the CLI is rejected on the wire with the same refusal." },
  { id = "EX-4", text = "The step-5 write is idempotent on the same terms as its neighbours: the same payload applied twice produces the same bytes, so a resumed mint completes rather than double-writing." },
  { id = "EX-5", text = "PHASE-01's payload digest covers the facet automatically, because the material is the whole `Declaration`'s serde form — no enumeration is extended and no second digest domain appears. A test pins this rather than leaving it to the reader: changing only the facet payload changes the digest." },
]
verification = [
  { id = "VT-1", expects = "A create disposition carrying kind, title, body and facet mints one record holding all of it, after one apply, asserted from the record's two tiers on disk.", test_file = "src/design_run/submission.rs", keywords = ["CreateRecord", "facet"], waived = false },
  { id = "VT-2", expects = "Admission refuses a facet key the kind does not own, with the run revision unmoved, no record on disk and no id consumed — the whole of D5's claim, not just the refusal.", test_file = "src/commands/design.rs", keywords = ["apply_record_effects", "facet"], waived = false },
  { id = "VT-3", expects = "EX-5: two submissions differing only in the facet payload digest differently, so the PHASE-01 retry guard covers the facet by construction rather than by an enumeration someone must maintain.", test_file = "src/commands/design.rs", keywords = ["digest", "facet"], waived = false },
]
