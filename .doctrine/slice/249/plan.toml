[[phase]]
id        = "PHASE-07"
name      = "Governance coverage — the kinds that actually exist"
objective = """
Make the kinds the corpus has the kinds governance describes, and make that
correspondence checkable by something other than a promise.

SPEC-019 is emphatically four-kind and PRD-010 § 4 carries the same enumeration.
The corpus has seven. SL-159 (EVD, HYP) and SL-197 (CPT) each ruled their
contracts in a closed slice's design and neither landed the governance axis it
scoped — the debt this slice pays. DEC-175 rules how PRD-010 binds: its kind-set
clause is a stale ENUMERATION plus an extension RULE, and only the enumeration is
stale, because "may not be extended without a reserved id" names a precondition
SL-159 and SL-197 met. So the PRD half is a refresh, not a reversal.

R4 is the risk that this gets ASSERTED rather than done, and it is the risk this
slice has already recurred on once. RV-349 spent five findings on the canary
alone (F-5, F-7, F-9, F-11, F-14) and each attempt claimed a totality without
enumerating what would have to be true. So the canary is specified by an
arithmetic identity a reader can evaluate, not by a claim a reader must trust —
see EX-3.

LANDING POINT — settled by the user, 2026-08-08: the REV is created, populated,
approved and APPLIED in this phase, the prose is authored here, and the canary
ships green. Reconcile records a REV already done rather than performing it.

This departs from design §3 and §5.3, which say the amendment lands at
reconcile. The reason it is not left there: `revision apply` auto-lands only
`status` rows and surfaces prose rows for manual handling (probed during
planning — this also resolves §6's stated unknown), so a canary authored in a
phase would be RED until reconcile, and no phase may end red. D9's canary is
R4's CONTROL, R4 is the risk this slice has already recurred on once via SL-159,
and a control left red across a reconcile cycle is one somebody disables — D9's
own stated failure mode. A plan does not overrule a design silently, so the
departure is recorded for reconcile to settle in design.md's wording (EX-11).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 complete: the verb set objective 4 must register is the set that actually shipped, so the registration describes fact rather than intent." },
  { id = "EN-2", text = "Settled: the REV lands in this phase, not at reconcile (see the objective). No further approval is owed before the prose is touched." },
]
exit_criteria = [
  { id = "EX-1", text = "A REV over SPEC-019 and PRD-010 carries the typed change rows, is approved, and its prose amendment has landed in both entities' authored tiers." },
  { id = "EX-2", text = "Every kind in `kinds::RECORD` is named, in its paired form (`assumption (ASM)`), in BOTH authored tiers of BOTH entities. Reading both tiers is load-bearing for SPEC-019: its structured `responsibilities` carry three of the stale sites, which a prose-only canary would never see." },
  { id = "EX-3", text = "The word `four` — matched case-insensitively on a word boundary, over whitespace-collapsed text — occurs in neither entity's two tiers outside a declared allowlist, and the allowlist is held to an ARITHMETIC IDENTITY: total occurrences equal the sum of the allowlist entries' expected counts, and each entry's own count matches. Presence is not enough (F-11): an entry that must merely occur keeps its exemption alive when the phrase is duplicated elsewhere, so the escape hatch widens with no allowlist edit and no red test. Under the identity a duplicated exemption fails, a new arrival fails, and a stale entry expires loudly." },
  { id = "EX-4", text = "The whitespace collapse is implemented, not assumed. The one legitimate `four` (`spec-019.md`, \"four coupled sites\" — a correct count of integration sites, independent of the kind count) WRAPS MID-PHRASE, so a literal match finds it zero times and the identity would have been red on the day it was authored, with no green path but rewording the very sentence the exemption protects (F-14)." },
  { id = "EX-5", text = "Each allowlist entry carries, in the test, the argument for why its `four` is independent of the kind count. An exception has to be STATED to exist, and stating it is where a bad one gets caught in review." },
  { id = "EX-6", text = "The per-kind FACET contracts for EVD, HYP and CPT are present and coherent in SPEC-019, and the verb set names what this slice ships. NOT their lifecycle vocabularies or supersession rules — the scope card defers those to ISS-316, and an earlier draft of this criterion quietly re-acquired them (F-13)." },
  { id = "EX-7", text = "SPEC-019's false self-description (\"forward-intent: no code is shipped yet\") is corrected." },
  { id = "EX-8", text = "It is a project-local test, never a `validate` rule (POL-002) — no host-project convention leaks into engine rules." },
  { id = "EX-9", text = "The REV records, as stated consequences of the F-1 posture: that the scaffold templates are load-bearing for the write posture (a future template edit dropping a seeded field silently converts every record of that kind into one the writer refuses), and that adding a facet field to an existing kind is a corpus MIGRATION rather than an edit (R7)." },
  { id = "EX-10", text = "D8a's correction to DEC-168's recorded rationale rides this REV, and inq-7 / inq-9 are dispositioned at authorship against §6's recorded recommendations rather than re-derived." },
  { id = "EX-11", text = "The landing-point departure is carried into reconcile as a design-wording item: design §3 and §5.3 say the amendment lands at reconcile, and it landed here. Reconcile settles the wording. A plan that quietly outranks its design is the failure this criterion exists to prevent — the plan is not higher authority than the design, so the divergence is recorded rather than absorbed." },
]
verification = [
  { id = "VT-1", expects = "The canary: paired-form presence for every kinds::RECORD kind across both tiers of both entities, plus the four-identity with its allowlist. Driven by iterating kinds::RECORD, so a new record kind joins the assertion with no test edit — the same totality argument the wire-key and facet tables make.", test_file = "tests/governance_kind_coverage.rs", keywords = ["kinds", "four", "spec-019"], waived = false },
  { id = "VT-2", expects = "The identity's own failure modes, on fixtures rather than on the live corpus: a duplicated exempt phrase fails, a new non-exempt `four` fails, a removed exempt phrase fails. Fixtures because the live corpus can only be in one state at a time, and a control that is never seen red is not known to work.", test_file = "tests/governance_kind_coverage.rs", keywords = ["allowlist", "collapse"], waived = false },
  { id = "VA-1", expects = "Read SPEC-019's EVD / HYP / CPT facet contracts and the registered verb set for coherence — a canary proves the enumeration moved, not that the contracts are right. Confirm the ISS-316 boundary held: lifecycle vocabularies and supersession rules are NOT in scope and must not have been re-acquired." },
  { id = "VH-1", expects = "Human acceptance that the amendment says what the project means, across two governance entities. This is prose that outlives the fix, and R4's whole point is that its completion is easy to assert and expensive to get wrong." },
]
