detail = "The reviewer's remit was ledger dispositions on RV-322. It also rewrote .doctrine/slice/237/notes.md, replacing 112 lines of accumulated single-copy Harvest content (durable findings, settled decisions, open items, follow-ups) with 14 lines describing round 4 only. The section is explicitly marked 'single-copy: updated in place each harvest; ids only, never restated content' — a reviewer reading that as 'replace with this round' is a plausible misread of the annotation. Restored from HEAD; the round's two genuine observation ids and one proposed memory were re-captured by hand. Cost: a full diff read to detect the loss, plus restore. A reviewer given workspace-write to record dispositions can silently damage authored artefacts outside the ledger; the responder must diff every touched path, not just the ledger."

