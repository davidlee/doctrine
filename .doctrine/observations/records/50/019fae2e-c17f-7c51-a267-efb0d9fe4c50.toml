detail = "SL-233 PHASE-11. The phase sheet was materialised by 'slice phases' before the 2026-07-29 phase split. The split moved the marker machinery from PHASE-06 to PHASE-13/14 and amended plan.toml's EN-1 to say so, but the already-materialised sheet still carried the pre-split objective citing PHASE-06. An agent opening the sheet first reads a wrong objective with no staleness signal; nothing marks the sheet as behind its authored source. Cost: re-derivation of the objective against plan.toml, plus the risk of planning the phase against superseded entrance criteria. The materialise-once/amend-later seam has no freshness check."

