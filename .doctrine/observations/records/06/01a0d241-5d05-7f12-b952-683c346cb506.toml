summary = "RV-380 arrived pre-disposed (raiser+responder collapsed); fixes' landed-state ambiguous"
detail = "A code-review agent returned RV-380 with all four findings already at disposition=fix-now AND status=verified, each carrying a responder-voice response with a detailed fix plan. In the ADR-007 two-role protocol the responder leg should be the receiving agent's; here it was pre-filled by the review side. Cost: the receiver cannot tell from the ledger whether the fixes were applied or only described (the responses say 'Reconciled in this unit of work'), and has no ledger move left to make — only the code change. Read the findings as advisory fix-now intent was the only safe reading."

