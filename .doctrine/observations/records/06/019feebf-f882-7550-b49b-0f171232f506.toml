summary = "tag set and backlog tag take incompatible flag shapes"
detail = "Following ISS-343's fix I tagged a new backlog item. 'doctrine backlog tag --help' documents add/remove flags, so I reached for 'doctrine tag set ISS-345 --add area:build ...' and got 'unexpected argument --add'. The facet verb is positional ('tag set <REFERENCE> [TAGS]...'); the backlog verb is flagged. Two tag surfaces, two grammars, one round-trip lost. Skill: none (RV-353 F-4 remediation)."

