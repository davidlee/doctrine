summary = "<CHR-178> root [package] lacked rust-version inheritance, so clippy assumed MSRV=toolchain and pushed post-1.85 APIs"
detail = "Cargo.toml declared rust-version only under [workspace.package]; root package never inherited it (cordage/doctrine-control did). Clippy msrv-gated lints (map_unwrap_or -> map_or_default, stable 1.98) therefore fired on every beta bump; 4 sites already used post-1.85 APIs (is_multiple_of, const Vec::is_empty/char::is_whitespace, 1.87) unnoticed. Also: a previous agent masked the cargo 1.100 test-exe layout change with 464 symlink shims in target/debug/build, hiding the real failure."

