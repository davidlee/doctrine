summary = "preflight: 'doctrine <kind> status' is a setter, not a report — collides with 'doctrine status'"
detail = "Reaching for a lifecycle overview of RFC-025 and SL-252, I ran 'doctrine rfc status' and 'doctrine slice status' and got clap usage errors twice in one turn: both require '<ID> <STATE>' (a transition verb). The report verb is the bare 'doctrine status'. The spine advertises 'new list show paths (+status where lifecycle)' which reads as a per-kind status *report*. Two wasted round-trips. Candidate fixes: rename the transition verb (set-status / transition), or make bare 'doctrine <kind> status' with no args print the kind's lifecycle rollup instead of erroring."

