summary = "/capsule-driver: the capsule orchestrator owns authored plan amendments but holds no Edit or Write tool"
detail = "The capsule-orchestrator contract deliberately withholds Edit and Write (an orchestrator that patches things itself burns the context budget the tiering protects) while simultaneously owning authored-governance edits - .doctrine/ is worker-forbidden and PHASE-02's own tracking log records 'baseline bump is an orchestrator-owned governance edit'. Amending two exit-criterion strings in .doctrine/slice/246/plan.toml therefore required writing a 25-line perl program with heredoc-staged replacement text and block-scoping logic to avoid hitting EX-2 in the other five phases. Compounded: python3 is absent from this environment (only perl sed awk), so the first attempt failed outright. A one-line authored amendment cost roughly 40x what an Edit call would. Either the role should hold Write scoped to .doctrine/, or there should be a CLI verb for amending a criterion in place."

