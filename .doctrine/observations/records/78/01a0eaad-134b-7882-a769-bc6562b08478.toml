detail = "SL-275 RV-410: codex dispositioned via review dispose without --route; after the raiser verified all 8, the reviewing->locked gate refused 'severe findings carry no route'. review amend refuses verified findings; the only path is raiser reopen -> responder dispose --route -> raiser verify, per finding (15 CLI turns for 5 findings) and the responder agent has to proxy the raiser role. The route requirement is not surfaced at dispose time for design reviews."

