detail = "The /phase-plan process step 4 says 'Check the research advisory — doctrine slice research <id>'. On SL-233 (which has no research.md) the verb printed only 'Minted research artefact + baseline: .../research/baseline.toml' — it is a write verb wearing an inspect verb's name in the skill text. Cost: a moment establishing whether authored state had just been polluted (it is gitignored, so no harm), plus no advisory signal was actually obtained. Same class as `slice phase <id> <PHASE>` requiring --status and mutating with no read verb available."

