summary = "codex reviewer exhausted credits mid-turn after a full design read, producing no ledger action"
detail = "Round 2 of RV-370 (/design reviewing stage, external adversarial pass via codex-cli MCP, gpt-5.6-sol). The reviewer read the brief, the ledger and the whole 1287-line design.md — 45,105 tokens — then terminated on 'ERROR: Your workspace is out of credits.' It verified/contested nothing and raised nothing, so the ledger correctly shows all 8 findings still 'answered' with the baton at the raiser. Cost: a full design read bought zero review, and the failure surfaced only in the transcript tail, not as a tool-level error — the MCP call returned an output-too-large notice, which reads like success. Mitigation for next time: the ledger is the durable record, so checking 'review status' rather than the agent's report caught it immediately. Worth knowing that an external reviewer can consume a large read and fail silently at the end; budget a status check after every external round rather than trusting the returned report."

