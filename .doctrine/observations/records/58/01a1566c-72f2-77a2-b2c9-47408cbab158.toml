summary = "plan.toml with a commented-out [[phase]] header yields a silently shorter plan"
detail = "SL-284's plan.toml had '# One [[phase]]' commented and no live [[phase]] header before PHASE-01's keys, so PHASE-01's id/name/objective/criteria were absorbed into the [requirements] table. slice list reported 0/4, slice phases reported 'Phases up to date', and no PHASE-01 runtime sheet was materialised - with no warning about the unknown keys in [requirements] or the missing phase. The missing phase was only found by reading the plan against plan.md's five-phase overview."

