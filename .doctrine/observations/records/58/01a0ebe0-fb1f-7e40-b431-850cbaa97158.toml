summary = "just commit-doctrine sweeps the whole .doctrine/ tree, discarding per-path staging"
detail = "The justfile recipe 'commit-doctrine' (justfile:294-295) is 'git reset && git add .doctrine/ && git ci -m doctrine' — a pathless, whole-tree commit with a content-free message. It directly contradicts the repo's own stated discipline (AGENTS.md: 'git add specifies paths, don't use -A', 'path-limit the commit itself'). Cost this session: freshly-scaffolded entities (RFC-035, EVD-030, HYP-002) were committed mid-authoring by another agent's invocation as '6ef6ae303 doctrine', alongside that agent's observation record. Diagnosing why new files showed as tracked-and-modified (M) rather than untracked (??) cost a detour through a foreign commit's stat. Skill: none."

