summary = "/phase-plan: memory retrieve has no compact output — scanning candidate keys costs full bodies"
detail = """Step 3 of /phase-plan is 'run /retrieve-memory against the files you expect to touch'. `doctrine memory retrieve` (a) takes no positional query — a natural `retrieve "..."` errors and costs a --help round-trip, and (b) emits every hit as a full security-framed block with the whole body. The help says --columns is 'ignored by retrieve', so there is no key-and-title projection: I paid ~16 full memory bodies to learn which 4 were relevant, then re-ran with grep -E '^memory_key|^# ' to get the list I actually wanted. Four calls where one should do. A --format compact (key + title + trust) would make the skill's step 3 cheap enough to always run."""

