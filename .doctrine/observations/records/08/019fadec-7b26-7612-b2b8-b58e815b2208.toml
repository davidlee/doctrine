detail = "SL-233 PHASE-14 VA-NC requires each of the five §5.5 refusal tests to be observed red as a WRONG ACCEPTANCE. Measured at head: duplicate marker, unknown marker and marker-free addition do red as wrong acceptances (run mutated, revision advanced); MISSING MARKER and STRUCTURAL DELETION cannot, by construction — a deleted marker or an emptied region produces no entry in `authored_section_digests`, so the caller's declared map can never match and adoption already refuses with the generic `AdoptionMarkersInvalid`. Their honest red is a WRONG REFUSAL REASON. The phase sheet's §4 predicted this for StructuralDeletion and UnterminatedDocument but NOT for MissingMarker, so establishing it needed a round of arm-by-arm probing (temporarily neutralising the earlier assertion in each multi-arm test so the later arms' reds became observable, then restoring) — roughly 6 extra binary runs and 3 file round-trips. Cheaper shape for a future sheet: state the expected red KIND per test in the sheet, and where a multi-arm test hides later arms behind an early assertion, ask for the arms to be probed once via a helper that reports both channels rather than panicking."

