summary = "capsule-worker: expect(dead_code) on an enum does not cover its impl methods — a second cfg_attr is needed"
detail = "Reported by the SL-246 PHASE-02 worker. It placed #[cfg_attr(not(test), expect(dead_code, ...))] on the KnowledgeLevel enum per the in-file TierFilter precedent, and still got a hard error for the unreachable KnowledgeLevel::as_str method: an associated impl method is its own dead-code unit and the enum's attribute does not cover it. Needed a second, method-level cfg_attr on as_str itself. The existing memory on dead-code altitude (attribute goes on the OUTERMOST dead item, never a field or variant) covers the field/variant case but reads as if the enum attribute would cover everything defined on the enum; the enum-vs-impl-method split is a distinct case. Cost one clippy cycle. Worth folding into the dead-code altitude memory: type and impl-method are separate dead-code units even when the impl is on the dead type."

