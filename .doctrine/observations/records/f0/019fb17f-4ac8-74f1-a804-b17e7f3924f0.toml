summary = "code-review/feedback: shipped review-ledger.md says the review verbs refuse a worktree-resolved root, but they work fine from the dispatch coord tree"
detail = "install/review-ledger.md's closing 'Parent-tree caveat' states: 'Drive reviews from the parent tree — the doctrine review verbs refuse a worktree/fork-resolved root. Run a review from the main tree (or merge the fork first), never from inside an isolated worktree.' RV-324 was RAISED from the SL-233 dispatch coord tree and all six findings were DISPOSED from it without complaint. Either the caveat is stale or it means a worker fork specifically and does not say so. Cost: a real hesitation before the first dispose, and an agent that trusts the doc would relocate to the primary tree — where .doctrine/review/** edits do not belong for a dispatched slice. The doc should distinguish a coordination worktree (sole authored writer, ADR-006/ADR-012) from a worker fork."

