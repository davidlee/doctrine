summary = "reconcile SL-266: design show calls an out-of-band reconcile edit 'behind its run' and suggests materialise"
detail = "After the sanctioned reconcile direct edit of a locked run's design.md, 'doctrine design show 266' prints 'note: design.md is behind its run (revision 48); doctrine design materialise SL-266'. The file is ahead of (diverged from) the run, not behind, and materialise is the wrong move at reconcile (mem.pattern.reconcile.edit-design-out-of-band). An agent without that memory would be steered into materialising."

