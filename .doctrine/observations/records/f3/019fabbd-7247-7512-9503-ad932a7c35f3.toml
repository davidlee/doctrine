detail = "Running the owed adversarial review for SL-233 PHASE-03, the external reviewer (codex mcp, workspace-write, cwd = the SL-233 coord worktree) reported it had to hunt for the routing skill: '/route was not present at the conventional agent-skill path and had to be located under plugins/doctrine/skills/'. Cost is small but repeated — every externally-spawned reviewer pays the same search before it can orient. The orchestrator's brief named the ledger protocol doc (install/review-ledger.md) explicitly and that was found first time; the skills path was left implicit, which is the asymmetry. Cheap fix on the orchestrator side is to name the skills root in the spawn brief the way the protocol doc already is; the broader question is whether plugins/doctrine/skills/ should be discoverable from a conventional path for agents that are not Claude-harness-resident."

