summary = "/preflight: doctrine memory retrieve rejects a positional query"
detail = """Called `doctrine memory retrieve "design run turn envelope ..."` during /preflight on IMP-390; refused with 'unexpected argument'. The sibling verb `memory search` DOES take a positional, so the family is inconsistent at the shell and the refusal names no alternative — it prints usage but does not say 'did you mean search?' or which option carries the query. One wasted call plus a re-read of --help. Same class as the item under preflight (IMP-390): the refusal names the objection, not the remedy."""

