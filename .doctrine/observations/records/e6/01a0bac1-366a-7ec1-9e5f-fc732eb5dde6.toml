summary = "capsule-orchestrator: doctrine slice record-delta's usage line is self-contradictory — it lists --commit, --start and --end as all required, then refuses --commit combined with either"
detail = "Running 'doctrine slice record-delta SL-246' printed: 'error: the following required arguments were not provided: --end <END> --start <START> <PHASE>' with usage 'record-delta --commit <COMMIT> --end <END> --start <START> <ID> <PHASE>'. Supplying all three then failed with 'the argument --commit cannot be used with: --start, --end'. So the usage string demands a combination the parser rejects. --commit alone is what works. Cost: two wasted round trips at exactly the point an orchestrator is discharging verification, and the error text actively misleads toward the invalid form. The clap groups should be expressed as an either/or in the usage line."

