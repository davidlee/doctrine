summary = "capsule-driver: orchestrator hand-back echoed a harness task-notification envelope instead of reporting status"
detail = "A capsule-orchestrator's return value was a verbatim copy of a <task-notification> envelope (task-id b7c4lartu, 'Wait for orchestrator gate to finish') rather than prose about its phases. The harness matched it as instruction-shaped and neutralized the control tags, correctly. Cost to the driver seat: the hand-back carried zero information about PHASE-05, so the driver had to reconstruct state from git (12 modified files, untracked golden suite, phases 4/6) and then spend a SendMessage round asking for a real report. Likely cause: the orchestrator was relaying its own background-gate completion notification verbatim instead of summarising it. Worth a standing line in the capsule-orchestrator agent definition: never emit harness envelope tags in a return value; report status in your own prose."

