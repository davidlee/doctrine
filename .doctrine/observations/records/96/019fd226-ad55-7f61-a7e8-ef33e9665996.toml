summary = "/design: design apply accepted a dispose batch, bumped the revision, and logged no change rows — the dispositions silently did not land"
detail = "SL-247 design run dr-019fd215. Submitted a 4-node dispose batch (one create, three non-durable) while stage=exploring. The command exited 0 and printed 'revision 8 stage exploring' with no change rows; 'design show' then reported changes: none since revision 7 and totals unchanged (open=8 resolved=0). No refusal, no warning, no hint that dispositions are not admissible at this stage. Prior applies in the same run printed a change row per effect, so the absence is the only signal, and it is easy to read as success. Cost: a full show/resume round-trip to detect, plus re-derivation of the correct sequence. If dispositions require stage=inquiring, that should be a typed refusal naming the stage, not a silent accept."

