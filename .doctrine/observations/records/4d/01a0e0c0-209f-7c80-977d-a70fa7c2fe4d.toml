summary = "skill research: an RFC-context research artefact has no staleness verb and no baseline, so its freshness is unprovable"
detail = "The /research skill's staleness machinery is slice-scoped (doctrine slice research <id> mints research/baseline.toml). RFC-032/033/034 put research.md at the RFC folder, where no baseline exists and no verb can report drift. A consuming agent must re-check by hand or trust the header's compile date. RFC-033's own research.md records the same gap ('RFCs carry no baseline.toml'). Related: IMP-314 (no harvest pointer at close) covers only the slice leg."

