summary = "/phase-plan: 'doctrine memory retrieve' returns uid/title/trust only, forcing a second 'memory show' per candidate"
detail = "Distilling memory into a phase sheet is the planner's core job, but retrieve returns no body and no snippet, so judging relevance costs one 'memory show' round trip per candidate. The SL-245 PHASE-05 planner estimated a --snippet or body-in-retrieve mode would cut roughly half the token cost of the phase-plan step."

