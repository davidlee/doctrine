summary = "Recursive grep from the repo root reports skills under plugins/doctrine/skills/, not .agents/skills/"
detail = "RV-370 round 2. The reviewer needed to establish which skills reference `design show`. A recursive grep from the repo root surfaced the hit under `plugins/doctrine/skills/handover/SKILL.md` and not under `.agents/skills/handover/SKILL.md`, costing an extra round trip to establish that the two paths carry the same content. Any agent grepping for skill text from the root hits this: the duplicate roots make a single hit look like the whole population, or make the authored copy look absent. Worth either a note in the file-map memory or a canonical-root convention for skill greps."

