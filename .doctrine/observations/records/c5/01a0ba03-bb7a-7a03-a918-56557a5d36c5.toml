summary = "knowledge edit: comma-separated list flags split prose mid-sentence with no escape documented"
detail = "Authoring DEC-274 via 'doctrine knowledge edit decision --alternatives / --consequences', the comma-separated parsing split my list items at every comma INSIDE a sentence, producing fragments like ' which is normal' and ' so it retains its power' as separate list entries. The flag help says '(comma-separated; bare flag clears)' but documents no escape, so any list item containing ordinary English punctuation is mangled. The mangling is silent and only visible on read-back. I worked around it by rewriting every clause to avoid internal commas, which distorts the prose to satisfy the parser. For a facet field whose content is argued prose -- alternatives and consequences on a DEC are exactly that -- comma-splitting is the wrong delimiter. Either document an escape, support a repeatable flag (--alternatives X --alternatives Y), or accept stdin-fed items. Cost: one full rewrite of two fields plus a read-back to notice."

