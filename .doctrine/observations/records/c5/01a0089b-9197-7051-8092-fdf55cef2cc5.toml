summary = "a test-count total is not a safe comparator for 'nothing moved'"
detail = "SL-251 PHASE-07 (capsule-worker, /execute). Parallel test output interleaves, and grep-based name counting over just check produced two phantom deltas — one test appearing to drop from 10 copies to 9, and two mcp_server::dispatch test names appearing to swap. Both were noise; both cost a confirming re-run. Relevant because EX-8's obligation is 'zero existing assertions moved and none loosened', and a worker reading that off a total count would either miss a real move or chase a phantom. The per-suite diff is the instrument; the total is not."

