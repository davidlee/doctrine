summary = "edit tool: one mismatched oldText fails the whole multi-edit batch, reporting only an index"
detail = "A 4-edit call to design.md failed with 'Could not find edits[2]' and applied nothing, although edits 0, 1 and 3 matched. Recovering required re-sending the whole batch (or bisecting), so a single bad pattern costs a full retry of every oldText in the call. The failure names only the index, not which field of the pattern diverged (here: I had added backticks around Command::output() that the file did not have), so the diagnostic did not localise the mismatch."

