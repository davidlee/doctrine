summary = "/audit: doctrine supersede refuses backlog kinds, and the merge needs two other verbs instead"
detail = "notes.md and plan.md both recorded 'merge ISS-346 into ISS-333' as owed work. `doctrine supersede ISS-333 ISS-346` refuses: 'supersession not yet supported for ISS (follow-up F2)'. The working route is two verbs — `doctrine link ISS-346 related ISS-333` then `doctrine backlog edit ISS-346 --status closed --resolution duplicate` — neither of which the refusal names. A refusal that names the remedy would have cost nothing here; this is IMP-390's fourth candidate (refusals naming remedies) biting outside the design run."

