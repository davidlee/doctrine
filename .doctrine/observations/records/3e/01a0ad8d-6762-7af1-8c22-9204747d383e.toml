summary = "capsule-driver: newly-installed agent definitions are invisible until session restart, so the first spawn always fails in an uninstalled tree"
detail = "After copying capsule-orchestrator/worker/phase-planner into .claude/agents/, the Agent tool still refused subagent_type 'capsule-orchestrator' — the harness enumerates agent types at session start and does not hot-reload. So discovering the missing definitions mid-run cannot be repaired mid-run: it costs a full session restart plus re-derivation of whatever the seat had built. Compounds the earlier friction record about the missing precondition: the cost of not checking agent-type availability up front is not one copy command, it is a restart. A driver-side preflight (list .claude/agents/ against the types the skill names, BEFORE building any charter) would turn a restart into a no-op. Same root cause as the settings-pin refusal: capsule-driver assumes an installed, already-configured harness and has no check for it."

