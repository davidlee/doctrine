summary = "preflight/canon: boot snapshot command grammar omits 'knowledge show'"
detail = "Boot snapshot Commands block lists '[knowledge] memory knowledge backlog / knowledge inspect status' — no 'show'. Following it, I tried 'knowledge inspect' (metadata only, no prose), then 'explain', then 'inspect', then 'paths' before discovering 'doctrine knowledge show' exists and returns metadata+prose. Four wasted calls to read one DEC statement. The grammar's per-command verb rows are lossy: 'knowledge' shows 'inspect status' while the real verb set is 'new list show inspect status paths'. Either the SPINE line (new list show paths) is meant to cover it implicitly and doesn't read that way, or the row is stale."

