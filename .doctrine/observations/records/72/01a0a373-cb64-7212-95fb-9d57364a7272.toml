summary = "/audit: a backlog item raised by a review cannot record that provenance as an edge"
detail = "doctrine link IMP-449 references --role originates_from RV-366 is refused: '`references` target must be one of [ISS, IMP, CHR, RSK, IDE, SL], got a RV'. A review IS the thing that originated the item, and the ledger is the durable record of why it exists. The fallback is a prose line in the item body plus an edge to the slice instead, which loses the machine-readable link in exactly the direction an auditor traverses (given RV-366 F-5, what was captured?). Cost two round trips and left the provenance unqueryable. Hit twice in one audit (IMP-449, ISS-452)."

