summary = "/design gate: Bash cwd resets to the primary tree between calls, silently running coord-tree commands in the wrong worktree"
detail = "Driving SL-233 PHASE-06's design gate from the coord worktree (/workspace/doctrine/.dispatch/SL-233). The Bash tool's cwd does not persist across calls in this session — it resets to the primary tree /workspace/doctrine. Two commands ran in the primary tree without any signal: 'rg -n seq src/design_run/snapshot.rs' returned 'IO error ... No such file or directory', which reads exactly like a missing module or a bad path, not like a wrong worktree. Cost: one wasted round trip plus a moment of doubting whether design_run existed at all. The handover packet says 'Park Bash cwd here' — that instruction is not actionable under a harness that resets cwd per call. Every coord-tree command needs an explicit 'cd <coord> &&' prefix, and the packet should say so instead."

