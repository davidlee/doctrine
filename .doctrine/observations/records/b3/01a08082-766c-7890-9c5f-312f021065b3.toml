summary = "/phase-plan: no read-only verb for per-phase status"
detail = "Reading which phase is planned/in_progress/completed cost three calls. 'doctrine slice phase SL-256' is write-only (errors demanding --status and PHASE_ID); 'slice phases' answers materialisation ('Phases up to date.'); 'slice status' gives only a 2/3 rollup. The per-phase status lives in gitignored .doctrine/state/.../phase-NN.toml, which the guardrail says not to read raw. A 'slice phase list <ID>' or per-phase rows under 'slice status' would collapse it to one call."

