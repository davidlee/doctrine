summary = "/audit: doctrine review paths emits no trailing newline, so its last path runs into the next command's output"
detail = "`doctrine review paths RV-362` printed '.doctrine/review/358/review-358.md' with no trailing newline; in a compound shell invocation the next echo landed on the same line ('review-358.md=== raise help ==='). Cosmetic, but it makes the output unsafe to pipe or read positionally without normalising, and every sibling `paths` verb should be checked for the same."

