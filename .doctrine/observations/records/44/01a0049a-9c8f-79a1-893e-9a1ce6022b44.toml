summary = "/feedback: review show prints no finding detail, so a responder cannot read the ledger it must dispose"
detail = "Adjudicating RV-357's 12 findings needed each finding's title+detail. 'doctrine review show RV-357' prints derived status, the reviews edge and the brief body only — no findings. 'review list' is cross-review. The only route was 'review show --json' piped through a hand-written python walker to reach review.finding[]. The responder role is the one that must read every finding in full, and the table view omits exactly that. Cost: two exploratory calls plus a scratch parser before adjudication could start."

