summary = "design skill: top-level acceptance on a checkpoint-dispose submission recorded design-accepted"
detail = "SL-277 run rev 33: a design apply payload with declare=[cp-13 dispose create] plus a top-level acceptance{basis} (meant as the basis for creating DEC-360) also emitted act_recorded cpa-design-accepted, although the user had not accepted the design. There is no retract verb; the act only goes stale when the payload changes. The contract does not say that a bare top-level acceptance means design-accepted in stage reviewing."

