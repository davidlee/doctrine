summary = "/execute SL-248 PHASE-07: verify-vt reports the phase's VTs UNATTRIBUTABLE after the file is committed"
detail = "Ran `doctrine slice verify-vt 248` before and after committing conformance.rs on branch sl-248. Both times PHASE-07/08/09/10 read '≈ UNATTRIBUTABLE VT-N — keyword present but crates/doctrine-control/src/conformance.rs not modified by this slice', while PHASE-01..06 PASS. `git diff --name-only edge...HEAD` does list conformance.rs, so the file IS in the branch delta; whatever base verify-vt resolves is not that. Cost: two runs plus a git-topology detour to establish it was not a worker error. Two smaller oddities in the same output: (a) later phases whose tests do not exist yet also report 'keyword present', which makes the phrase unreliable as a signal; (b) UNATTRIBUTABLE is indistinguishable at a glance from a real miss, so a worker cannot tell 'my keyword is absent' from 'attribution did not resolve'. Reported rather than chased — the driver owns the attribution base."

