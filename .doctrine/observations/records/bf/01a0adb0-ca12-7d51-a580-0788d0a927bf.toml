summary = "execute: shipped memory wrongly claims dead-code deny is cargo-test-only, costing a worker a full build cycle"
detail = "mem_01a0089ad3337e13b6308ace9742306b states that dead-code deny 'fires only under cargo test, not cargo build/cargo clippy'. A capsule-worker on SL-245 PHASE-02 measured the opposite: plain 'cargo build --bin doctrine' failed identically to cargo test on all four new items in a brand-new leaf module (RasterOutcome, rasterise_png, run, classify) until a module-level allow(dead_code) was added. The documented asymmetry does not hold for a new module whose only consumer is its own #[cfg(test)] mod tests block, because that block is cfg-stripped in a non-test build leaving genuinely zero non-test callers. The memory should be corrected or qualified; as written it sends workers into a confusing red."

