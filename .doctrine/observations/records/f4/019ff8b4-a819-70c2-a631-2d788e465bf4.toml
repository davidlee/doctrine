summary = "/design — the inquiring runbook's inquire.scope step necessarily regresses the exploring runbook's explore.research step, because one edits the file the other hashes"
detail = "explore.research verifies via doctrine verify research-current, which hashes .doctrine/slice/254/slice-254.md in research/baseline.toml. The very next runbook step the machine asks for — inquire.scope, 'update or explicitly confirm the slice scope against the decisions this inquiry accepted' — mandates editing that same file. So discharging step N+1 regresses step N by construction, and a --restamp is owed after every scope edit. Cost this session: two restamp cycles, and the first drift was mis-read as a stale research artefact when the second was purely annotation. The signal is also lossy in the dangerous direction: a real research staleness and a benign scope annotation produce the identical 'changed slice-254.md' line, so an agent that learns to reflex-restamp will eventually restamp over a genuine drift. Splitting the baseline hash by section, or excluding decision-provenance annotations, would separate the two."

