summary = "backlog id in an authored design doc went stale under concurrent allocation"
detail = "While closing ISS-350 (informal small-item flow, no skill), the design.md I had read cited ISS-351 for a spun-off issue. A concurrent agent in the same tree then allocated ISS-351 to an unrelated issue (pi-spawn confinement) and the provisioning issue became ISS-352; someone corrected the design doc between my two reads. Cost: a confused re-read plus an ls to work out which id was real, and a stale citation would have shipped silently had I not re-read the tail. Shared id namespace + shared worktree means an authored cross-reference can rot between writing it and committing it, with no signal."

