summary = "/execute: PHASE-04 T4's compensating control could not reach the region the sheet named, in one run"
detail = "The sheet required the injected-defect control to send the I11 test red 'on the comment and on [[relation]]' — i.e. D8's region (b), the tail. But the test asserts region (a) (the meta tier above [facet]) first, and the naive toml::to_string writer perturbs (a) too, so assert_eq short-circuits there and the tail assertion never runs. Reaching the named evidence took a second run with (a) temporarily disabled — two injections and two reverts instead of one. Cheap fix for a future sheet: when a control's expected failure is named against a specific assertion, either order that assertion first or tell the worker the control will fire earlier and must be narrowed. Generalises: a multi-assertion test used as a defect detector proves only its FIRST failing assertion unless the run is narrowed."

