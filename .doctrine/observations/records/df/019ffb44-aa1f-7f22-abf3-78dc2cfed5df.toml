summary = "/design: a successful agent_declaration prints no change row, which reads as the silent-discard failure"
detail = "apply with agent_declaration returned 'revision 8 stage exploring' and nothing else. mem.fact.design-run.apply-payload-vocabulary tells agents 'if an apply reports no event rows, treat that as a refusal, not a success' (ISS-346/ISS-333). So a lawful act is indistinguishable at the CLI from the silent-key-discard bug, and confirming it took a grep of the gitignored runtime snapshot .doctrine/state/slice/251/design.toml — reading runtime state by hand because the projection has no read-back. design show --full also reported changes_since_baseline=0 after having reported 9."

