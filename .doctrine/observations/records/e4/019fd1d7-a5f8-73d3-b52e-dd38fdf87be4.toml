summary = "/design: the design apply payload shape had to be reverse-engineered from serde errors and source"
detail = """Four probe cycles to learn one submission shape. `design show` prints a single `declare` example carrying subject/question/parent/needs; every other field had to be found by reading src/design_run/submission.rs. Specific costs: `discharge` is a struct that serde will also accept from a sequence, so passing a list produced 'invalid length 1, expected struct DischargeDeclaration with 3 elements' rather than naming the field; `provenance` is an internally-tagged enum needing {"provenance":"user-directed"} and rejected the bare string with 'expected internally tagged enum Provenance'; `known_revision" is required on every submission and its absence is a parse error, not a refusal naming it. Roughly 6 tool calls and a source read to get the first checkpoint accepted. A worked example per act kind in the envelope, or a --explain on apply, would collapse it."""

