summary = "dispatch: coord-worktree teardown refuses on prepare-review's phantom staged deletion"
detail = "After `dispatch sync --prepare-review` (which commits the CAS journal onto dispatch/265 via plumbing, advancing the ref without touching index/worktree), the coordination worktree reads `D .doctrine/dispatch/265/journal.toml` as a STAGED deletion (index lacks the file HEAD has). The documented conclude step 'remove coordination worktree directory' then fails: `git worktree remove .dispatch/SL-265` refuses on the staged change. Recovery is a manual, undocumented resync — `git -C <coord> restore --source=HEAD --staged --worktree -- .doctrine/dispatch/<slice>/journal.toml` — before remove succeeds. Skill: dispatch. Consequence: every prepare-review→teardown cycle needs an undocumented escape, and a naive operative reaches for `git worktree remove --force` (the very 'drunk with a chainsaw' the skill forbids). Related memory: mem.pattern.dispatch.prepare-review-plumbing-desync-reverts-journal (covers the working-tree-commit variant, not the teardown variant)."

