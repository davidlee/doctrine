detail = "SL-250 design run dr-019fd692, exploring stage. The explore.research runbook step verifies via 'doctrine verify research-current', which binds the research baseline to slice-250.md. But the design run legitimately EDITS slice-250.md (scope amendment: carving the doctor leg out to IMP-407). So the step regressed after discharge and blocked the exploring->inquiring advance, needing a second '--restamp' plus a retry. Restamped twice in one stage. The re-restamp is also slightly dishonest-feeling: it asserts the artefact is current when what changed was the consumer, not the research. Cost this session: ~3 extra tool calls and one refused advance. Would recur on every stage advance that follows a scope edit."

