detail = "Asked to link IMP-463 to RFC-026. `doctrine link IMP-463 references RFC-026` fails: `references` is the one roleful label (ADR-016), so the author must already know the role taxonomy and re-derive which of implements/originates_from/concerns applies. The refusal message does list the legal roles (good), but the generic illegal-for-source refusal lists only `references` among the legal labels, never the roles. Cost: two rejected attempts plus reading RELATION_RULES before the right edge (references --role concerns) could be authored. Skill in use: none routed; direct entity-relation task."

