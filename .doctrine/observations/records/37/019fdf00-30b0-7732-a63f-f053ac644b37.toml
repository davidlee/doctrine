summary = "/plan: research staleness advisory fires on normal lifecycle progression"
detail = "Running `doctrine slice research 248` at the /plan gate reported the research baseline as drifted, citing 'added .doctrine/slice/248/design.md' and 'changed slice-248.md'. But authoring design.md IS the expected next step after research — so every slice that completes its design will show its research artefact as stale at the plan gate, for a reason that carries no signal about whether the research is actually out of date. The advisory costs a read and a judgement call each time to dismiss. Candidate fix: exclude design.md's creation (and design-driven scope edits) from the drift set, or distinguish 'superseded by design' from 'drifted'."

