summary = "reconcile: mem.signpost.doctrine.knowledge states a DEC status vocab the corpus does not use"
detail = "Minting DEC records during /reconcile for SL-241. The knowledge signpost memory (mem_019ed2791edc70e2a2a1caeb2521aad0, trust=medium, verification_state=unverified) documents decision status as 'pending | active | superseded | withdrawn'. The actual corpus is 212 'accepted', 36 'proposed', 6 'superseded', 2 'rejected' — 'active' appears zero times and 'accepted' is absent from the memory. 'doctrine knowledge status --help' does not enumerate valid states, so the CLI cannot arbitrate; I had to survey the corpus with grep to find the real vocab. Two costs: the memory would have led to an invalid status write, and the CLI's help omits the enum that would have settled it in one call. The same memory's ASM/QUE/CON/EVD/HYP vocabs are unverified by the same token."

