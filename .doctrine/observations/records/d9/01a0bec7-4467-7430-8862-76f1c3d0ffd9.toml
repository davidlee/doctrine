summary = "/plan: .doctrine/state/ is unlistable — 316 of its 356 entries are per-session mem-surface-seen files"
detail = "`ls .doctrine/state/` during orientation returned 356 entries, 316 of them one-per-session `mem-surface-seen-<uuid>.txt` markers. The listing alone burned several thousand tokens of context and buried the forty entries an agent is actually looking for (boot.md, dispatch/, slice/, review/, phases). The markers are runtime tier and correctly gitignored, but they are unbounded and never pruned, so the cost grows with every session and any agent that lists the directory pays it. A per-session marker subdirectory, or a prune on boot, would dissolve it."

