summary = "/phase-plan: design provenance rows are prose, so every planner re-resolves them to line ranges by hand over a 301KB design"
detail = "SL-248 PHASE-06 planning. plan.md's 'Design-section provenance' row grants sections by name ('sec-3 entire, less the freshness rows its Verification alignment hands to the harness'). design.md is 301KB and read-scope is explicitly capped, so the planner must convert names to line ranges before reading anything — a grep/sed hunt repeated per phase, per planner, over a file too large to scan. The ranges are stable once found (sec-3 = 1112-1601, sec-4's forbidden-list section = 1861-1875, sec-6's two-verbs = 2753-2806) and were written into the phase-06 sheet's Reading list so the worker does not repeat it, but nothing carries them back to plan.md for PHASE-07's planner. Either the provenance table should carry ranges, or 'doctrine slice' should offer a section-extract verb."

