summary = "'doctrine slice verify-vt' has no --phase selector, so a per-phase check reports the whole slice"
detail = "Verifying one phase's VT conformance at capsule-orchestrator commit time, 'doctrine slice verify-vt SL-245 --phase PHASE-05' errored with 'unexpected argument'. The verb takes only the slice id and prints every phase. Harmless here (17 rows), but on a long slice an orchestrator that only wants its own phase's verdict pays for all of them and has to eyeball the right block."

