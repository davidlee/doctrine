summary = "execute skill: reading the measured layering tangle requires forcing a violation"
detail = "SL-238 PHASE-08's VA-3 asked whether the command tangle was UNCHANGED at 76. The ratchet in tests/architecture_layering.rs only raises TangleGrew when actual > baseline, so a green suite answers a weaker question (<= 76) than the criterion asks, and nothing in the suite reports the measured number. dump_real_graph (#[ignore]) prints units and edges but no SCC/tangle count. The only route to the number was: edit .doctrine/adr/001/layering.toml's baseline to 0, run the gate, read 'actual: 76' out of the failure struct, revert, and verify with git diff --stat — mutating an authored governance file to perform a read. Cost: three extra tool rounds plus the care needed to guarantee the revert. Filed as IMP for the 3-line fix; the workaround is recorded in mem.fact.layering.ratchet-green-is-one-sided."

