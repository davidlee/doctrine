summary = "design apply silently accepts unknown payload keys and bumps the revision"
detail = """In /design on SL-238, probing the apply payload shape with an unknown key ({"run_uid":...,"bogus_key":1}) returned 'revision 42 stage drafting' — accepted, no refusal, revision consumed. ApplyRequest deliberately omits serde deny_unknown_fields because it carries a #[serde(flatten)] envelope (documented at src/design_run/submission.rs:923); Declaration does deny unknown fields. Consequence: a misspelled run-level key ('stag' for 'stage', 'discharg' for 'discharge') is a silent no-op that prints a success line indistinguishable from the intended write, and the agent must diff the envelope to notice. Cost this session: one wasted revision plus a source read to establish the payload schema, because the schema is not printed by --help or by design show (whose 'declare' template only covers inquiry declarations)."""

