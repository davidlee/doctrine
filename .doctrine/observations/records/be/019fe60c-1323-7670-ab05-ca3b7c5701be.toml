detail = "conformance.rs lives in crates/doctrine-control, not the root doctrine bin. 'cargo test --bin doctrine conformance::tests::...' reports 'ok. 0 passed; 4406 filtered out' — a green exit code for a run that executed nothing of what was asked. The correct invocation is 'cargo test -p doctrine-control --bin doctrine-control -- <filter>'. Same fails-open shape as the row-6 selector trap this very task had to close: a name-based selector that matches nothing exits 0. Worth a line in the project's test-running guidance, since the boot snapshot's 'cargo --bin doctrine memory' example points the other way."

