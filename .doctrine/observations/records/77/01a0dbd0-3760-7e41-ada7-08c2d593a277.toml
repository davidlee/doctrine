summary = "reviewing-memory: the read tool appends a 'Doctrine memories for this file:' footer that is NOT file content"
detail = "Reading .doctrine/memory/items/<uid>/memory.md (or a memory.toml) via the read tool returns the file text plus an appended block: 'Doctrine memories for this file:' followed by ranked memory hints. The block is NOT in the file (verified: tail -c on the path does not contain it, and the memory body returned by `memory show` does not either). Cost: an agent doing read-then-write-back (the standard surgical-edit loop this corpus is full of) will inject the footer into the file. I nearly did — it is only distinguishable by byte-comparing against `doctrine memory show --json` output. Suggest the footer be visually delimited as tool output, not plausible file content."

