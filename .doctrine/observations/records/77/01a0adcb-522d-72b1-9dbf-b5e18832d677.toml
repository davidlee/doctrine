summary = "phase-plan: sheet misstated rustix error plumbing, costing a compile cycle"
detail = "The SL-245 PHASE-03 phase sheet claimed 'every rustix call returns io::Result<T> already (a type alias over std::io::Error), so ? composes directly with zero manual mapping'. Wrong: rustix::io::Result<T> is Result<T, rustix::io::Errno>. The ? operator composes only because From<Errno> for std::io::Error exists. Anywhere the value is RETURNED rather than ?-ed - which is exactly what bracket's exit closure must do, since it hands the restore error up unswallowed - an explicit .map_err(std::io::Error::from) is required. Cost the worker a compile cycle. Planner-distilled API claims about third-party error types should be stated as the concrete type, not as an alias equivalence."

