summary = "/feedback: review show --json nests findings at review.finding, not findings — two wasted probes"
detail = "'doctrine review show RV-325 --json' returns {body, kind, review}, and the findings array is at review.finding (singular, the TOML array-of-tables name leaking through) rather than a top-level 'findings'. Two failed python probes before the shape was discovered by printing keys at each level. Minor per occurrence, but it is paid by every agent that scripts against a ledger, and the singular key reads as a single object rather than a list. Same class as the plan.toml column-alignment gotcha the RV brief has to warn readers about."

