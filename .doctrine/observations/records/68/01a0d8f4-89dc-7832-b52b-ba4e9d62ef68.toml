detail = "Scoping SL-267 (shipped-corpus conformance), I found SL-264's in-flight uncommitted diff to install/design-prompts/delegation.md adding a line that cites IMP-483. install/design-prompts/ is a shipped, published asset: in a client repo IMP-483 resolves to that client's own IMP-483, silently, with no dangling-link signal. The agent is citing its own originating item in good faith and has no signal the citation is wrong there. This is a live instance of the exact class ISS-309 enumerates (the citation was introduced while the ledger enumerating that class was being written), and it is the strongest available evidence for ISS-309 part 2: a written rule and a fully-enumerated defect list did not prevent the next occurrence. Note the citation lives in another agent's uncommitted work, so it is a snapshot, not a landed fact."

