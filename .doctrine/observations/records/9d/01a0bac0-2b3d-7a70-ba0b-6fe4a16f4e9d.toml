summary = "capsule-worker: the STD-003 stderr disclosure for an unparseable design-run snapshot is multi-line and reads badly"
detail = "On the design show document arm, when the run snapshot exists but will not parse, the disclosure inlines the whole indented TOML parse error and then trails ' — the design document renders without its run disclosure'. Honest and STD-003-compliant (the degraded read is disclosed, the document still renders), but the shape is hard to read at a terminal. A one-line summary form with the detail behind a flag would serve the reader better. Cosmetic, not a defect; noted so it is not rediscovered."

