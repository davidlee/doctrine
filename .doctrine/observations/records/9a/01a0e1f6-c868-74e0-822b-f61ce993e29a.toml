summary = "code-review: an unlanded fork cannot host its own RV, so prime hashes the wrong tree"
detail = "SL-271's implementation lives only on slice/SL-271-... in .worktrees/SL-271, but review turn verbs refuse a worktree fork, so RV-402 had to be opened and driven from the primary tree. review prime then hashed the 230 selector paths in the PRE-change primary tree (src/boot.rs unchanged since 0da371b37), so the staleness signal for a 915-line delta was meaningless by construction and had to be disclaimed in the Brief. The reviewer had to read every artefact twice (primary copy for the ledger, fork copy for the truth), and the primary tree's SL-271 slice metadata is itself a plan-amendment behind (status plan vs audit). Cost: a fork cannot be reviewed where it is; the workable paths are land-first (inverts the review/land order) or review-blind against a stale tree."

