summary = "[backlog] check quick always emits the full standing warning set — no delta against the previous run"
detail = "Completion-checklist lint after a doc-only change: `doctrine check quick` prints the verdict line (`check: corpus OK`) buried mid-stream, then 51 findings — lifecycle warnings on long-terminal slices, prose citations of deliberate test-fixture ids (SL-998/999/1000, REQ-999, DEC-00), raw-label counts, and coord-hook warnings for two worktrees. All 51 are pre-existing; none referenced my change. Distinguishing 'did I break something' from 'this is the permanent background' meant eyeballing 51 lines and grepping for my own id, on every invocation. The verb has no 'new since baseline' or exit-status-vs-advisory split, so the signal in a cheap inner-loop check is a small fraction of its output."

