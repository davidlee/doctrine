summary = "/inquisition: review raise --as rejects the posture role that review new accepts"
detail = "review new takes --raiser inquisitor (accepted, stored on the ledger), but review raise --as inquisitor is refused with 'unknown --as role (known: raiser, responder)'. The skill tells you posture rides --raiser, which is true at open time; the raise verb's --as is a role assertion against the ledger's two seats, not the posture label. Cost one round-trip. A clearer refusal ('--as asserts a seat; this ledger's raiser seat is labelled inquisitor') would dissolve it."

