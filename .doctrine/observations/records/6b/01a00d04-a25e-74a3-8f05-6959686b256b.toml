summary = "phase-plan: research drift advisory is structural noise on every phase of a long slice"
detail = "SL-238 PHASE-06. /phase-plan step 4 mandates checking 'doctrine slice research <id>'. It has reported drift since PHASE-01 and will until close: the four 'changed/added' paths are design.md, plan.md, plan.toml and slice-238.md — the artefacts the research FED, not inputs that moved under it. Authoring the design necessarily dirties the baseline, so the advisory fires on every phase-plan of every multi-phase slice and is dismissed identically each time. Six dismissals so far. A baseline that excluded the slice's own downstream artefacts, or a --restamp prompt at design lock, would make the signal mean something."

