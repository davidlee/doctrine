detail = "SL-246 PHASE-03 EX-4 as authored mandates render_block(root, selected, level) -> String and requires that an empty selection return X1's explicit line. D3/X1 (design.md:1199 and :1404) specify that line as '(no knowledge records point at SL-999)' - it NAMES THE SUBJECT, which the three-argument signature cannot see. The criterion is internally unsatisfiable as written. Found by the phase planner cross-reading the criterion against the design's own specimen line; nothing in the criterion text hints at the gap. Resolved by the orchestrator as an arity-only amendment (add subject) rather than escalated, because intent is determinable - the design specifies the output and there is exactly one way to produce it. Cost: one planner escalation round plus an authored plan amendment."

