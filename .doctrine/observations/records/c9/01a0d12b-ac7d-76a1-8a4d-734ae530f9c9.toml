summary = "slice: pi extensions are installed on the Harness::Codex arm, so a claude-only repo gets none"
detail = "Recon for SL-263: resolve_harnesses only knows Claude and Codex; install_refresh's Harness::Codex arm is where install_pi_extension/install_mcp_extension are called. A repo with .claude/ but no .codex/ or separate AGENTS.md would resolve to Claude only and silently receive no pi extensions at all. Cost me several reads to establish that pi is not a first-class harness and that its install path is hosted on an unrelated arm."

