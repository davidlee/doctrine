summary = "phase sheet named a writer verb as the read surface (/execute, SL-241 T8)"
detail = "PHASE-06's sheet instructed 'doctrine knowledge status is the surface' for surveying QUE-200's evidence before ruling on EX-9. `knowledge status` is a WRITER — 'Set a knowledge record's status', usage 'knowledge status <ID> <STATE>' — so it errored on missing args. The read surfaces are `knowledge show` (both tiers) and `knowledge inspect` (metadata only). Costs one wasted call plus the --help round trip to recover. Root cause is a plausible-sounding verb name doing double duty across the corpus: several kinds expose `status` as a lifecycle WRITER while readers habitually expect `status` to mean 'survey' (cf. `doctrine status`, `review status`, `rfc status`, which ARE surveys). The kind-level `<kind> status` verbs are not uniform in direction, and nothing at the call site signals which sense applies."

