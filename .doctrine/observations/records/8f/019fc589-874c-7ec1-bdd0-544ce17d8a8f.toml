summary = "phase-plan: the authored plan entry and the handover both described PHASE-06 as a write-up phase; two rig files it needs do not exist"
detail = "SL-241 PHASE-06. plan.toml's objective ('run the one probe, fill the table, land a go/no-go') and handover.md ('one probe plus a piece of careful writing') both read as a writing phase. In fact control/probe-c1b.sh — which rig:151 already dispatches — and capsule/worker-agent.sh, named in design 9.1's tree, are both absent. Discovering this cost a directory listing plus a grep that would have been free if either artefact had named the build work. Neither surface is wrong per se: the plan states outcomes and the handover was written by the agent that closed PHASE-05, not one that had inspected PHASE-06's inputs. The generalisable friction is that a phase's effort SHAPE (build vs write) is nowhere carried, so every phase-plan re-derives it from the filesystem."

