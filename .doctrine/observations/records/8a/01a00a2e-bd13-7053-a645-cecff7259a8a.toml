summary = "design: a prose repair looks like adopt_authored but is a declare+body; section fingerprints are undiscoverable"
detail = "Integrating a prototype finding into SL-256's design run cost three refused submissions. (1) adopt_authored reads as the verb for 'design.md was hand-edited' — its doc calls it the sole lawful crossing of an authored-watermark divergence — but it reconciles the WATERMARK only: the section marker map must still match what the run stores, so it cannot carry a content change. A prose repair is declare[{subject: sec-N, body: <full section prose>}] then materialise. (2) The section fingerprints the marker map needs are not obtainable from the tool: design show prints them truncated to 12 chars in BOTH prompt and json formats, and there is no verb that emits the full digest. I recovered the rule by reverse-engineering it — sha256 of the raw inter-marker body, validated against three unmodified sections — which worked but should not have been necessary. Compounds mem_019ff439bede7fb29c7c09b7fd76d893 (design apply payload vocabulary is undiscoverable from the tool)."

