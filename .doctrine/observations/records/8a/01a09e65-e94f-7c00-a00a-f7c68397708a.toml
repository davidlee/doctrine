summary = "doctrine link: legal label+role set is only discoverable by failing (/design, RV-365 disposition)"
detail = "Minting IMP-446 and relating it to SL-259 took three attempts. 'doctrine link IMP-446 originates_from SL-259' failed — 'IMP may not author originates_from' — with a legal-label list that printed 'references' twice and named no roles. 'doctrine link IMP-446 references SL-259' then failed with 'references requires a role — author it with --role <originates_from|concerns>'. So originates_from is both an illegal label AND a legal role for a different label, and nothing surfaces the label-role pairing up front. 'link --help' does not enumerate per-source-kind legality. Cost: two wasted round trips per relation authored. A single error naming the legal (label, role) pairs for the source kind would dissolve it."

