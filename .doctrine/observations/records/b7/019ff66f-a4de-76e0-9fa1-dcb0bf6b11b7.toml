summary = "/design: exploring runbook steps invisible in the turn envelope until a stage transition refuses"
detail = "The design skill's activation text says the envelope 'carries the stage, the next obligation, and the outstanding runbook steps'. `doctrine design show 254` and `show --full` both printed no runbook section at all across revisions 1-7 — sections/records/blockers/frontier only. The five outstanding exploring steps (explore.scope, explore.research, explore.canon, explore.memory, explore.triage) first became visible in the REFUSAL text of `design apply` with a stage declaration, after all ten inquiry nodes were already declared and disposed. Cost: the whole exploring stage was worked without knowing its runbook existed, then a discharge pass has to be reconstructed retroactively. A turn envelope that omits the turn's obligations inverts the skill's own instruction to read the envelope and do what it says."

