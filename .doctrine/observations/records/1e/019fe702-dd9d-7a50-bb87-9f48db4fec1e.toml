summary = "/execute SL-248 PHASE-10 T12: the card's prescribed --skip adjustment named a module that does not exist"
detail = "T12's card and D4 offer one lawful adjustment: 'cargo test -- --skip <executed module path>'. That phrasing presumes a module holding only the executed rows. There is none — conformance::tests is flat, 164 tests, the ~6 executed rows interleaved by name with cheap pure-function tests, so the skip filters 164 to save 6. Discovering this cost a --list enumeration plus two filtered timed runs (one of them 92s). A plan-time instruction that names a code structure should be checked against the code when the phase sheet is written, or phrased as an intent ('skip the executed rows, however they are selectable') rather than a command shape."

