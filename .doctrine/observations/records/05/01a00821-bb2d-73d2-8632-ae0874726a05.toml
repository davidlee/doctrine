summary = "a plan's VT test_file was wrong four times in one slice, always the same way, and DEC-140 already decided it"
detail = "SL-251, observed across PHASE-01/VT-1, PHASE-03/VT-3, PHASE-04/VT-1 and PHASE-06/VT-1 (skills: /plan, /phase-plan). A criterion is authored where its SUBJECT MATTER lives; tests/architecture_layering.rs sites tests by IMPORT LEGALITY. They disagree whenever a leaf-tier subject needs a command-tier oracle, and nothing surfaces the disagreement until someone sits down to write the test — after plan approval. DEC-140 ('verification evidence lives at the tier that can produce its subject') decided the general case on 2026-08-04; it is accepted governance /plan does not enforce, so each instance costs a planner's discovery plus an orchestrator's authored-plan amendment. Three of the four would have redded the build. The fourth would have gone GREEN while pinning the shipped, published document to a two-row test fixture — a knowledge region that does not exist, with a passing test underneath. Carried out of the slice as IMP-438."

