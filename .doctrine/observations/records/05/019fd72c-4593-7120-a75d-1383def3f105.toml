summary = "/design skill's Recovery block omits the required positional SLICE on design resume/show"
detail = "The design SKILL.md Activation and Recovery blocks write the commands as 'doctrine design resume' and 'doctrine design resume --run <id> --known-revision <rev> --known-fragment <frag>' with no positional argument. The binary requires <SLICE> positionally on both resume and show, and rejects a --slice flag. Cost two failed invocations plus a --help round trip before the first useful envelope. The flags themselves are all real; only the positional is missing from the skill text."

