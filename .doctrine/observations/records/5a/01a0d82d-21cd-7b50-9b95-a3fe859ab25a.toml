detail = "SL-265 PHASE-01 verify beat. Baseline at B=2464bbfd6 recorded one failure, reserve::tests::vt3_auto_degradation_is_fail_closed_with_explicit_optin, panicking 'auto + failing configured remote hard-errors when fallback declined' (ambient DOCTRINE_RESERVATION_FALLBACK=1). At S=1ca75a00a the same test fails identically, but the diff classified it 'changed' and halted: the signature normalises src/reserve.rs:LINE:COL yet leaves the panic's thread id '(39267)' in the text, so capture and diff can never produce equal signatures. Independently reproduced the identical panic at B in the primary tree (pid 152043), proving it pre-existing and unrelated to the phase delta. The tool's signature normalisation should strip the thread id."

