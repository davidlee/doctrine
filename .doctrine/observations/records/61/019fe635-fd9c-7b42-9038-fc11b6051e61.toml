detail = "The PHASE-10 sheet cites RV-346's F-36 and F-38 by bare id while its own findings series had reached F-35. Continuing the sheet series per the brief produced a sheet-local F-36 and F-38 that denote different findings from the bare-id citations already in the same document. Cost: a decision I had to reason about and then flag, plus a notes item, on top of re-reading three citation sites to work out which namespace each belonged to. Doc-local ids are correctly scoped in the reference-forms rule; the sheets stopped qualifying them once the two series overlapped."

