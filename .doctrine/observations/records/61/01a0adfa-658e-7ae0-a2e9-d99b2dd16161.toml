summary = "audit: a fresh linked worktree cannot cargo build — web/map/dist is gitignored and absent"
detail = "SL-245's capsule worktree .worktrees/SL-245-c11 failed 'cargo build' with: #[derive(RustEmbed)] folder 'web/map/dist/' does not exist, plus two knock-on E0599s on Assets::get. web/map/dist is gitignored (.gitignore:61) and produced by 'just map-build' (needs bun). Any audit/dispatch/capsule worktree therefore cannot build until the dist is copied in from the primary tree (what I did) or rebuilt. Cost: a failed build, a diagnosis detour, and a manual cp before any gate could run. Candidate fixes: have worktree/capsule provisioning copy or symlink web/map/dist, or make the embed root tolerate an absent dist in dev builds."

