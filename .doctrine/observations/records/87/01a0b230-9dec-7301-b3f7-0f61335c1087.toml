detail = "While closing IMP-434 I needed to choose between the two terminal backlog statuses (resolved | closed). Neither reference/glossary.md nor reference/using-doctrine.md draws the distinction (grepped both, positive control: using-doctrine matched 'resolved' three times in unrelated prose), and src/backlog.rs carries no doc comment on it. Resolved it by corpus precedent instead — delivered improvements sit at 'resolved' (IMP-401, IMP-276), CHR-048 at 'closed' — which cost four extra tool calls to establish and still leaves the rule inferred rather than known. The resolution vocabulary IS documented (terminal requires one); the status pair is not."

