summary = "PHASE-09 closed as 'gate exit 0' on a single green run of a race-carrying suite; the defect cost a whole extra worker dispatch to find and fix"
detail = "SL-248 PHASE-09's conformance suite asserts on live processes, /proc entries, reaps and spawn windows. Its close-time evidence was one green 'doctrine check gate'. The orchestrator then measured 2/3 gate runs red on the_observed_pid_is_the_one_the_parent_reported_not_one_the_subject_printed against 3/3 green on bare cargo test — the gate builds immediately before testing, so load is the discriminator. Cost: the phase could not close, an extra worker dispatch was spent on a one-line-class defect, and pressing the suite under 24-way load then surfaced four MORE load-fragile sibling tests (F-35) that remain open. The friction is that neither /execute nor /phase-plan asks for a tally of gate runs when a phase's tests read a clock or a process — a single exit code is accepted as the phase's green. Skills involved: /execute (worker green claim) and /dispatch (orchestrator close-time gate)."

