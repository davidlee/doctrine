summary = "knowledge: backlog has no body-edit verb, so updating IMP-426's prose meant hand-editing the authored .md"
detail = "doctrine knowledge edit takes --body/--body-mode append; doctrine backlog edit only transitions status+resolution. Landing round findings back into a backlog item therefore drops out of the CLI and into a raw file append, against the read-via-show guardrail. Also: knowledge inspect prints metadata only, so orienting on a record costs an extra call when show was wanted."

