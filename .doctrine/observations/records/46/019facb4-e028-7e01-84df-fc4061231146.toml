summary = "review: no CLI verb prints a ledger's findings — the responder must read review-NNN.toml raw"
detail = "Disposing RV-323 as responder needs each finding's id, severity, status, title, detail and prior response. 'review show RV-323' prints the derived status, the reviews edge and the prose brief, and then only a COUNT ('findings: 6'). 'review status' prints one line. There is no --findings flag (rejected as an unexpected argument) and no other verb in 'review --help' that emits them. So the only route is opening .doctrine/review/323/review-323.toml directly, which the boot guardrail explicitly tells agents not to do ('read entities via doctrine <kind> show, not raw files'). The guardrail and the tool disagree, and the agent pays for it twice: once discovering the flag does not exist, once reading a 70-line TOML to recover what show already had in hand."

