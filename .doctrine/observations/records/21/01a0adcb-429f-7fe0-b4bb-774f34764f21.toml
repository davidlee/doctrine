detail = "VT-5 names input vec![0; 5000] and requires the keyword 'm=1,q=2'. 5000 bytes base64-encode to 6668 bytes, i.e. exactly TWO 4096-byte chunks, whose continuation is the LAST chunk and therefore reads 'm=0,q=2'. No middle continuation exists, so 'm=1,q=2' is unobservable in that case. The worker kept the vec![0; 5000] test verbatim and added a second test over vec![0; 7000] (9336 base64 bytes, three chunks) where the keyword is actually observable. The plan row as authored is not self-consistent; criteria ids are immutable so this needs an appended correction at reconcile, not an edit."

