summary = "execute/phase-07 worker: staging a stub-based red costs a compile cycle under -D unused"
detail = "The phase sheet's TDD instruction was 'write every fixture assertion against a stub check that returns vec![]'. In this repo that does not compile: -D unused makes the stub's unread struct fields (Exempt::{tier,phrase,expect,why}, Tier::{name,text}) and the unused paired_form helper hard errors, and -D elided-lifetimes-in-paths rejects &[Tier] in the stub signature. So the first red was a COMPILE red carrying no information about the assertions, and a second cycle was needed after adding a temporary dead_code allow and spelling Tier<'_>. Cost: one build plus the reasoning to tell a lint red from a test red. A sheet prescribing a stub-based red in a deny-unused crate should say to seed the temporary allow up front."

