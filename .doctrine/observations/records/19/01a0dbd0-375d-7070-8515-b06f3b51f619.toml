summary = "reviewing-memory: memory edit --key late-binds memory_key without minting the key symlink — the key is then unresolvable"
detail = "Repairing a dangling relation (memory.toml [[relation]] target naming a key), I used the documented remedy `doctrine memory edit <uid> --key <key>` on the unkeyed target. The verb wrote memory_key into memory.toml and reported success, but `memory show <key>` and `memory validate` still reported not-found. Cause (src/memory.rs resolve_show doc): key resolution is SYMLINK-ONLY — 'there is no memory_key scan fallback, so a stale hand-edited key with no live symlink is a not-found'. Keyed memories are stored in a mem_<uid>/ dir with a sibling symlink named by the key (592 such symlinks in .doctrine/memory/items). --key mints the field but not the symlink, so it produces exactly the stale-unbacked-key state the doc calls a not-found. Fix applied by hand: ln -s mem_<uid> <key> in items/. The verb should either mint the symlink or refuse."

