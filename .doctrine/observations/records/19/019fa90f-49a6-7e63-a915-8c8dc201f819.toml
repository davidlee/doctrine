summary = "/dispatch: the funnel prescribes spawn for coordinator-only phases"
detail = "SL-233 has three phases whose work is authored .doctrine/ state, which a worker never writes. 'dispatch next' has no representation for that, so it prescribes spawn and the orchestrator must knowingly not act on a prescription — against the funnel's own 'do the one thing it says' discipline. Cost: a full handover STOP, a user decision round, and proving from tests/architecture_layering.rs (Unclassified + StaleEntry) that PHASE-02 genuinely cannot be split worker/coordinator, before any phase work could start. Captured as IMP-346."

