summary = "design apply forces a full section-body resubmission for a surgical edit (/design, SL-253)"
detail = "Integrating RV-354's four findings meant changing 6 spots in sec-5 (806 lines), 4 in sec-9, 2 in sec-7 and 7 in sec-10. Declaration.body is a whole-section replacement, so the cheapest correct path was to write a Python script per section that reads design.md, slices the section between its doctrine:section markers, applies exact-string replacements each asserted to fire exactly once, and emits the apply JSON. That worked well and is probably the right idiom to document — but the agent has to invent it, and the naive path (re-emitting 1400+ lines of prose across four sections) costs an order of magnitude more output tokens for the same diff. Worth noting the assert-fires-once discipline is load-bearing: one of my 19 replacements silently missed on a line-wrap difference and the script caught it, where a hand-rewrite would have dropped the edit."

