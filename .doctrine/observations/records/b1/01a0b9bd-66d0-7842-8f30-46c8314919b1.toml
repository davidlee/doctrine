detail = "Planning SL-246 PHASE-01 (src/knowledge.rs facet render collapse), 'doctrine memory retrieve --path-scope src/knowledge.rs' returned nothing about knowledge or facets. The three memories that actually shaped the phase sheet — dead-code reported at the outermost item so an expect() must sit at enum not variant level, 'unused = deny' collapsing TDD into one compile point, and the additive-widening one-input-two-readings test shape — were all found by 'memory search' on LINT and TEST vocabulary, not by path or subject scope. The corpus was well stocked on the phase's real hazards; the scope probes were the wrong index into it. Suggests path-scope is indexed on something other than the hazards a phase touching that path will hit."

