summary = "Sourcing the spike-capsule rig libraries re-enables set -e, silently overriding a driver's own shell options"
detail = "My F-P05-28 diagnostic driver opened with 'set -uo pipefail' — deliberately WITHOUT -e, because in a probe driver a refusing command IS the datum and must not abort the run. Sourcing control/pipeline.sh + lib/instantiations.sh re-enabled set -e underneath me. The driver then died at its first measured 'git fsck' (which legitimately exits 16) having printed only a section header, with every later measurement — the resume, the decomposition of git's swallowed stderr, the fresh-quarantine control — unrun. It looked exactly like the earlier SIGPIPE abort, so I initially diagnosed it as the same bug. Two costs: a wasted heavy run, and the near-miss that an abort mid-measurement is shaped like an absence-shaped result, which is the failure mode this whole phase keeps meeting. Generalisation for any driver that sources the rig: set your shell options AFTER the sources, not before, or the library silently wins. Recovered value: the abort's exit status (16) was itself the first real evidence the fsck was failing, which is luck, not design."

