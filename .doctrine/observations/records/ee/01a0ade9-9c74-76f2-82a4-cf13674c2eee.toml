detail = "The SL-245 PHASE-05 sheet asserted CellGeometry does NOT derive Clone/Copy/Debug. It does (src/kitty.rs:258 is #[derive(Debug, Clone, Copy, PartialEq, Eq)]). The worker therefore did not anticipate clippy::trivially_copy_pass_by_ref firing on its own &WindowGeometry / &CellGeometry params, ate a gate red, and had to make an in-remit judgement about adding two suppressions on a phase whose sheet had explicitly fenced off suppression edits. A sheet that transcribes a type's shape must transcribe its derives from source."

