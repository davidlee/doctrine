detail = "Typed 'doctrine slice notes 256' expecting to read the slice's notes; got 'Error: Refusing to overwrite existing .../256/notes.md'. Correct refusal, but the verb reads as a noun-accessor. mem_019facc24ac576e0a4d9ace5b2eeb12f already records that 'slice plan' and 'slice phase' are writers with no read-back verb; 'slice notes' is the third member of that family, so the memory understates the pattern. Cost one turn plus a Read of the raw file."

