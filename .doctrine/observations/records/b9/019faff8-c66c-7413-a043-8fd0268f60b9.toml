summary = "/phase-plan: no read-only way to view one phase's authored plan entry"
detail = '''`doctrine slice phase <id> <PHASE>` requires --status and MUTATES, so there is no verb that prints a single phase's objective/EN/EX/VT. Fell back to reading .doctrine/slice/233/plan.toml with an offset+limit Read, which needs the line number found first (and plan.toml is column-aligned, so the obvious `rg 'id = "PHASE-'` matches nothing — it has to be `id\s*=`). Two extra tool calls per phase plan, plus the risk that an agent reaching for the read verb mutates status instead. A `slice phase show` or `--dry-run` would remove it.'''

