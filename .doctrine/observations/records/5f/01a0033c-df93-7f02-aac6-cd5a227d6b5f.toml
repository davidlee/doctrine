summary = "knowledge edit decision: --alternatives/--consequences split on every comma with no escape, silently fragmenting prose items"
detail = "While recording DEC-229 during /design drafting for SL-251. The comma-separated list flags have no documented escape, so ordinary prose containing commas (nearly all of it) is split into many spurious list items. Nothing refuses or warns; the mangling is only visible on a subsequent 'knowledge inspect'. Cost: one wasted write plus a scripted TOML repair with a sentinel separator. This is the same defect class as the slice under design — an undocumented payload contract for a structured field — but on the CLI flag surface rather than the design-run JSON surface, so SL-251's contract would not cover it."

