summary = "knowledge/feedback: doctrine supersede writes the relation edge but leaves the predecessor's status 'accepted'; validate does not catch the resulting two-live-records state"
detail = "Ran 'doctrine supersede DEC-099 DEC-092'. It correctly set supersedes=[DEC-092] on the successor and superseded_by=[DEC-099] on the predecessor. It did NOT move DEC-092's status, which stayed 'accepted' — even though 'superseded' is a valid decision status (known: proposed, accepted, rejected, superseded). 'doctrine validate' reported 'corpus clean' in that state, so nothing surfaces the contradiction: two accepted decision records describing the same rule, which is the exact failure mode DEC-099 rejected an alternative to avoid. Needed a separate 'knowledge status DEC-092 superseded'. Either supersede should move the predecessor's status as part of the same verb (it already owns both records' relationship fields), or validate should flag a record that is superseded_by something while still accepted. Cost: caught only because the diff was read line by line; an agent trusting 'corpus clean' would have left canon asserting both."

