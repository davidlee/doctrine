summary = "/design: no read verb for a knowledge record's prose body"
detail = "Resuming SL-256 I needed the bodies of DEC-237/238/239. The guardrail says read entities via 'doctrine <kind> show <ID>', but the knowledge kind has no 'show' verb — its verbs are inspect/edit/status/settle. 'knowledge inspect' is documented metadata-only (no prose body) and returned relations + actionability only; 'doctrine inspect DEC-238' gave the same; 'doctrine explain DEC-238' gave scoring. Three commands, no prose. Net effect: the substance of a decision the run itself minted is unreachable through the CLI, so the fallback is reading raw MD, which the guardrails prohibit. Cost ~3 wasted calls; I proceeded from the slice scope and notes.md instead."

