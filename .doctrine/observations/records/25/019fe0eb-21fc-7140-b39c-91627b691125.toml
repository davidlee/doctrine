summary = "/execute (SL-249 PHASE-08): phase sheet's reading list omitted src/commands/guard.rs, whose exhaustive match makes a new CLI variant a compile error"
detail = "The PHASE-08 sheet named every seam the verb writes through and where the verb is declared, but not src/commands/guard.rs:212, which classifies each KnowledgeCommand variant Read/Write for the worker-mode guard. Adding KnowledgeCommand::Edit was therefore a build failure discovered at first cargo build rather than a planned edit. One-line fix, small cost, but it is a systematic gap: any phase adding a CLI verb meets it, and no reading list has named it so far. Captured as mem.pattern.doctrine.new-cli-variant-needs-guard-classification."

