summary = "[/close] slice conformance reports a declared .doctrine entity selector as undeclared"
detail = "Closing SL-231. .doctrine/adr/001/layering.toml carries a well-formed [[selector]] with intent design-target in slice-231.toml, yet 'slice conformance 231' lists it under undeclared. Same selector shape for .gitignore and .doctrine/governance.md comes back conformant, so it is not a blanket .doctrine exclusion — it looks specific to entity-file paths (adr/NNN/*.toml). Cost: had to hand-derive the honest cross-match (git diff --name-only main...<bundle> vs the selector registry) to establish that all 29 bundle files were accounted for and nothing was actually undeclared. Distinct from the already-filed file-set skew (ISS-268)."

