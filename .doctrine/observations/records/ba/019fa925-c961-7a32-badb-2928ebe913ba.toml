detail = "review new in the coordination worktree allocated RV-319, which the primary tree had already allocated for a live SL-236 review (untracked, so invisible to the dispatch branch). reach = 'local' with allow-local-fallback = true means neither tree can see the other's allocation. Two different entities would have shared an id and collided at integrate. Predicted as SL-233 PHASE-01 R-1 and now actually bitten. Recovery is manual: keep the collided scaffold in place so the allocator skips it, re-allocate to RV-320, then delete the scaffold — there is no --id override."

