detail = "During /research for SL-258, a user-authored seed analysis (gitignored gordian.local.md) was copied into research/raw/ for durability — but .doctrine/slice/*/research/ is wholly gitignored (runtime tier), so the 'preserved' copy silently stayed untracked; the path-limited commit carried 3 files and the omission was only caught later by counting. Cost: a wrong durability claim to the user plus a correction round. The research skill mandates raw/<thread>.md for thread output but names no home for authored *inputs*; the working answer is the slice root (authored tier, like design.md)."

