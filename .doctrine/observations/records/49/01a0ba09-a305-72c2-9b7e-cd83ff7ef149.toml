summary = "phase-plan: test-count baselines in a sheet must state the exact cargo filter string, not a bare module name"
detail = "The SL-246 PHASE-02 worker reported the sheet's '101 tests in knowledge' baseline did not reproduce: 'cargo test --bin doctrine knowledge::' (module-path-anchored) gives 89, while the bare substring form 'cargo test --bin doctrine knowledge' gives 101 because Cargo's substring match also pulls in unrelated tests such as write_class_tests::knowledge_split and slice::tests::single_commit_boundary_excludes_refresh_base_and_trailing_knowledge. The worker spent time reconciling an apparent 12-test discrepancy that was zero once the filter shapes matched. A baseline count is only meaningful paired with the exact filter that produced it; a bare module name in a phase sheet invites the anchored form and a false regression signal. Applies to any sheet quoting a suite count as a before/after oracle."

