detail = "The design-review route axis wants 'route:<route> <vocab>'. Four re-dispositions of F-6..F-9 wrote only the route token and the dispose verb accepted them. The only repair is a contest round, so the defect was tolerated and noted in the synthesis. A dispose-time check that a vocab token is present would have caught it for free."

