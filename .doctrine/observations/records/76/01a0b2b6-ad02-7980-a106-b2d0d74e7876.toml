summary = "/design: `slice notes <ID>` is a scaffolder, not a read — the reflex read costs a refusal"
detail = "Resuming SL-246's design run, I reached for the slice notes to read the Harvest section and ran `doctrine slice notes SL-246`. It refused: 'Refusing to overwrite existing .doctrine/slice/246/notes.md'. The verb creates the file; there is no read verb for it, so the read falls back to sed/cat over the raw path — which the guardrails otherwise tell agents not to do. Same shape as IMP-393 / DEC-261: a writer-facing operation occupying the slot an agent reads as the reader-facing one. Cost is small per hit but it is a guaranteed hit on every cold resume."

