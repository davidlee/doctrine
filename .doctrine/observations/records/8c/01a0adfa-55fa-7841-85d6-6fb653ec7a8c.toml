summary = "audit: review new succeeds in a worktree fork but every other review verb refuses it"
detail = "Running /audit for SL-245 from the linked worktree .worktrees/SL-245-c11 (capsule branch), 'doctrine review new --facet reconciliation --target SL-245' SUCCEEDED and allocated RV-369 into the fork's .doctrine/review/369/. Every subsequent verb then refused: 'review prime RV-369', 'review status RV-369' -> 'review verbs are not supported on a worktree fork (IMP-024)'. 'review show' also works. So the gate is applied to the baton-driving verbs but not to the allocating one, which mints an id and an authored entity in a tree that cannot then drive it. Cost: a wasted id + untracked files to reconcile, and a mid-audit re-plan. Expected: 'review new' refuses in a fork with the same message, before allocating."

