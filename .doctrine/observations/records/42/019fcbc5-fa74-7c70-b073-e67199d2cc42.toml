detail = "RV-344 pass 1 (Opus subagent spawned via the Agent tool for a design review). The subagent reported every Bash call refused by a 'worktree-jail: cwd-not-a-worktree' PreToolUse hook on /workspace/doctrine, despite the primary tree being a normal git worktree on edge. It completed the pass by reading entity files off disk directly and using the Monitor tool as a shell substitute, plus the doctrine MCP review tools for the ledger. Costs: entities read raw instead of via 'doctrine <kind> show' (the guardrail the boot snapshot mandates), a tool-substitution detour, and pass 2 of the same review needs grep over src/ so it will hit this harder. Skill in use: doctrine:design (reviewing stage), review driven on RV-344."

