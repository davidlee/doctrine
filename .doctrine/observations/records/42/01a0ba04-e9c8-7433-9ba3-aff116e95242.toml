summary = "capsule-orchestrator: Agent tool documents SendMessage for continuing a running agent but the orchestrator holds no such tool"
detail = "Mid-task I needed to extend a live capsule-worker's brief (PHASE-02's VT-2 keyword mandate became unsatisfiable as a side effect of the ruling the worker was implementing, and the worker was already editing the exact file). The Agent tool's own description says 'Use SendMessage with the agent's ID or name to continue a previously spawned agent with its context intact', and every spawn result restates it. But the capsule-orchestrator's tool set is Agent/Read/Grep/Glob/Bash -- no SendMessage. So the documented affordance does not exist at this seat. I burned a spawn on a noop fork before noticing. Consequence: an orchestrator cannot amend a running worker's task and must either wait and spawn a second worker (another full agent spin-up for a one-line edit) or do the edit itself with Bash, which cuts against the no-Edit/no-Write boundary the seat exists to enforce. Either grant SendMessage at this seat or stop advertising it in the tool description the seat reads."

