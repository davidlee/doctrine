summary = "/feedback: the reviewing runbook stays discharged across adopt+materialise, so it cannot signal a re-review"
detail = "SL-246's reviewing runbook (review.scope, review.selectors, review.passes) refused all three discharges with 'every step of this runbook is already discharged against its current definition' - after two adversarial rounds, four design revisions and four moved sections. review.passes' own text requires its statement be 'written after the last pass', which was false at the moment the gate reported clear. The runbook tracks its own definition, not the document it attested. Same class as IMP-461 (slice scope has no staleness signal against its design), one gate along; adjacent to ISS-359."

