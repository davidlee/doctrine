summary = "/route: AGENTS.md's path-limited commit form 'git commit <paths> -F -' fails as written — '--' ends option parsing, so -F - is read as a pathspec"
detail = "AGENTS.md (git section) prescribes: git commit <paths> -F - (or -- <paths>). Taken literally as 'git commit -- $PATHS -F -' git errors: pathspec '-F' did not match any file(s). The working form is 'git commit -F - -- <paths>' — the message flag must precede the -- separator. One wasted commit round-trip; harmless here because the add had already staged, but on a tree shared with other agents a retry loop around a pathless fallback is exactly the footgun the rule exists to prevent. The guidance should show the working order."

