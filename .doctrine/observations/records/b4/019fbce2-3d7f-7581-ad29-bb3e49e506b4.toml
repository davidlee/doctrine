summary = "route/plan: handover prescribed 'slice status SL-241 --status design'; CLI takes STATE positionally"
detail = "The SL-241 handover packet's 'Next actions' block gave the flip as 'doctrine slice status SL-241 --status design'. The real shape is 'doctrine slice status <ID> [STATE]' — a positional. One wasted round-trip on a clap error. Handovers that inline command shapes can encode a guess; the CLI is the source of truth, so a handover citing a verb should either be copied from a run or omit the flags."

