summary = "capsule-driver: harness auto-mode classifier refuses the skill's own mandated settings pin"
detail = "The capsule-driver skill lists 'pin CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=2 in settings' as precondition 2, because at the spawn-depth limit the Agent tool is silently withheld and an orchestrator quietly does the work itself. But writing .claude/settings.local.json is refused by the auto-mode permission classifier as [Self-Modification] — via both Bash and the Edit tool. The skill therefore cannot satisfy its own precondition; the driver must stop and hand the edit back to the human, costing a round trip at the start of every capsule-driver run. Either the skill should tell the operator to set the env var before invoking, or the settings pin should live in the tracked .claude/settings.json so it is already in place."

