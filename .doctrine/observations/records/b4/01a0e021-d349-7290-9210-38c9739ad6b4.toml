summary = "audit: capsule adopt says 'audit here, not on edge' but review verbs refuse the adopted worktree as a fork"
detail = "capsule-adopt of SL-268 c20 lands branch capsule/SL-268/c20 in .worktrees/SL-268-c20 and instructs 'Audit here, not on edge'. The audit skill needs raise/dispose/conclude on an RV, but review/turn.rs resolve_review_root classifies any linked worktree whose branch is not dispatch/<NNN> as 'fork' and bails (IMP-024). Also: the adopted worktree lacks gitignored web/map/dist, so 'doctrine check gate' fails to compile (RustEmbed folder missing) until copied in. Opening the RV on edge instead risks an RV id collision: the capsule branch already minted RV-397, which edge does not have."

