summary = "phase-plan: Bash cwd persisted across a worktree cd, silently reading a prototype fork's source as the primary tree"
detail = "While planning SL-256 PHASE-01 I ran 'cd .worktrees/proto-SL-256 && git diff --stat' to size the prototype. The Bash tool's working directory persists across calls, so the next four reads (src/design_run/run.rs, src/design_run/submission.rs, tests/e2e_design_state.rs) resolved against the PROTOTYPE worktree — which has an uncommitted 359-line diff to run.rs and change_log.rs. Four line anchors went into the phase sheet wrong (mod tests :1920 vs the real :1870, a_waived_disposition :1102 vs :1110, the fixture payload anchors off by 1). Caught only because a later 'head target/debug/doctrine' failed with 'No such file' in a tree that has no build. Cost: ~6 extra tool calls to re-derive every anchor with awk against an absolute cwd. Mitigation that would have prevented it: never 'cd' into a sibling worktree in a shared shell — use 'git -C <dir>' or absolute paths, or re-anchor with 'cd /workspace/doctrine &&' on every subsequent call."

