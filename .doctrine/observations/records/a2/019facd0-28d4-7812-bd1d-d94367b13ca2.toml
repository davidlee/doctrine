summary = "review: a contest's rationale is ephemeral — only --note, never durable on the finding"
detail = "RV-323 round 5. 'review contest' takes only --note, documented as 'ephemeral handoff chatter for the baton log — NOT durable rationale'. But a contest IS the raiser's durable argument: the Expected/Observed/counterexample that the responder must answer. It landed in .doctrine/state/review/323/baton.toml, which is gitignored runtime state, while the finding's authored 'detail' still shows the ROUND-1 text and 'response' still shows the round-4 answer the contest rejects. Reading the ledger after a contest tells you a finding is contested but not why. Recovering the argument meant find-ing the baton log and tailing raw TOML — the second read-back gap on this ledger this slice (the first: no verb prints findings at all). Cost this round: the reviewer's summary was the only cheap path to its own reasoning, which makes adjudication depend on a subagent's prose rather than the record."

