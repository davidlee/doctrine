summary = "audit; SL-281: pathspec commit cannot record a git rm --cached"
detail = "git commit <paths> takes the worktree state of each path, so committing a 'git rm --cached' file with the path-limited commit rule silently re-adds it (the file still exists on disk). Needed a verified-index pathless commit. Also: slice status started→reconcile refused; must step through audit first — the /audit skill's step 7 names only the reconcile move."

