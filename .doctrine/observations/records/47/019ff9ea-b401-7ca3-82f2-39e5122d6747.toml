summary = "/design: design apply's payload schema is only discoverable by reading Rust source"
detail = "Resuming a drafting run cold, the only spelled envelope anywhere in reach is the single 'declare' example on design show's last line (inquiry-node shaped). Revising a section body, attesting drafting-ready, and moving the stage each needed a different writer act, and none of the three is documented in design apply --help, design show, or design resume's fragment. Recovered them by reading src/design_run/submission.rs (Declaration.body, StageDeclaration) and src/design_run/attestation.rs (AgentAct, externally tagged kebab-case). ~6 tool calls and a few thousand tokens of Rust reading to learn three JSON shapes the run could have printed. The resume fragment names the acts in prose ('the agent performs drafting-ready') without their wire form, which is the gap: it tells you what to do and not how to say it."

