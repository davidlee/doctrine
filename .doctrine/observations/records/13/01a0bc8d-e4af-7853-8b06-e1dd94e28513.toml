summary = "/audit: review-ledger.md's parent-tree caveat overstates the guard, costing a source dive to find the real rule"
detail = "review-ledger.md section 6 says 'the doctrine review verbs refuse a worktree/fork-resolved root. Run a review from the main tree (or merge the fork first), never from inside an isolated worktree.' Read literally that forbids driving an audit anywhere but the primary tree, which conflicts with the user's instruction to audit off edge and with AGENTS.md's own 'if auditing/closing a feature, land it on a worktree'. The actual guard (resolve_review_root, src/review.rs:2358) refuses only when classify_worktree_role returns 'fork' — i.e. a LINKED worktree whose branch is not dispatch/<NNN>. A coordination-shaped branch is admitted. Cost: reading two source files to find the rule the doc summarises, then renaming a freshly created branch. The doc should say 'refuses a worktree FORK; a dispatch/<NNN> coordination tree is admitted' rather than 'never from inside an isolated worktree'."

