summary = "memory verify refuses a dirty tree, forcing one commit per attestation"
detail = "Correcting two stale gate memories then attesting them cost three commits instead of one: 'memory verify' refuses a dirty tree, but verifying the first memory dirties the tree (it stamps the sister toml), which then blocks verifying the second. The rule is right in principle — an attestation over uncommitted content attests nothing — but it serialises a batch into commit/verify ping-pong with no batch verb. Skill: none (RV-353 F-4 remediation)."

