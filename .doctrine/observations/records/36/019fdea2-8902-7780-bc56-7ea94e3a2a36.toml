summary = "design apply adopt_authored envelope is snake_case while sibling payload vocab is kebab-case (/design, ISS-320)"
detail = "Recovering from a hand-edit during the SL-248 managed design run. ISS-320 documents that no verb emits the adopt_authored section map, so the payload must be hand-built. It does not state the key wire detail: ApplyRequest and SubmissionEnvelope carry NO serde rename_all, so the envelope is snake_case (run_uid, known_revision, submission_id, adopt_authored) — while several sibling enums in the same module ARE kebab-case. A first attempt built with kebab keys is refused with 'missing field run_uid', which names one field and not the convention, so the natural fix is to correct that one key and be refused again. Cost one wasted apply cycle. Compounds ISS-320's existing unactionable-refusal complaint."

