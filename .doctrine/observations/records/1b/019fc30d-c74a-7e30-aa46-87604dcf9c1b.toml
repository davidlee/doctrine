summary = "/execute: pgrep -a on a jail bwrap dumps multi-KB of env per match"
detail = "Checking whether a background heavy-fixture run was still alive, I ran 'pgrep -a bwrap'. In this jail every bwrap invocation carries the full --setenv PATH (60+ nix store paths) plus the whole mount ladder, so three matches cost several thousand tokens for one bit of information (is it running). 'pgrep bwrap' or 'pgrep -c' answers the same question for nothing. Also noted in passing: /usr/bin/time is ABSENT in the jail — a timing wrapper on a background loop failed rc=127 four times before I switched to bash SECONDS."

