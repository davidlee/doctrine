summary = "/inquisition: review show omits finding bodies; only --json carries them"
detail = """
Driving RV-340 under /inquisition. After raising 13 findings I wanted to verify the details had persisted intact (the known backtick-mangling footgun, mem.pattern.doctrine.review-response-shell-backtick-mangling, makes that verification necessary rather than paranoid).

"doctrine review show RV-340" renders derived status, the reviews edge, and the full brief body — but of the findings only the count line "findings: 13 (raiser inquisitor . responder responder)". No titles, no severities, no details. So the one verb the guardrails tell you to use ("read entities via doctrine <kind> show, not raw files") shows you everything about a review EXCEPT the thing a review is for.

Cost: two wasted greps against show output that could not contain the answer, then a fallback to grepping .doctrine/review/323/review-323.toml directly — i.e. the raw-tier read the guardrail exists to prevent. Only afterwards did --json turn out to carry the finding bodies.

Two candidate fixes, neither large: render a findings table in the default view (id, severity, state, title — details behind a flag or a per-finding show), or at minimum have the count line name --json as where the bodies live. The second is a one-line change and removes the dead end.

Note the asymmetry that makes this bite harder for a review than for other kinds: for a slice or an ADR, "show" synthesizing both tiers is exactly right and the body IS the content. For a review the content is the structured findings, and those are the tier that does not surface."""

