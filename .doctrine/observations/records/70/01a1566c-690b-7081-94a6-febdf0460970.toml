summary = "capsule-driver under pi: the planner agent ignores an explicit sheet path"
detail = "Twice, a planner spawn charted to write .doctrine/state/slice/NNN/phases/phase-NN.md returned its plan as a session artifact (plan.md) and left the sheet untouched, despite an explicit one-file write instruction. The agent def's output: plan.md frontmatter wins over the task text. The parent had to read the artifact and author the sheet itself, adding a round-trip and ~3k tokens per phase."

