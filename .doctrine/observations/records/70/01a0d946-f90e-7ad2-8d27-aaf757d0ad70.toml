detail = "Running /retrieve-memory, I had the exact durable keys in hand (from the handover). `doctrine memory retrieve <key>` is refused — `retrieve` takes only scope/query flags, no reference argument. So the only way to read those exact memories is `doctrine memory show <key>`, which the retrieve-memory skill treats as the *inspection* verb (holdback-exempt, not the safe-recall surface). Cost: three failed invocations over the CLI + one MCP attempt (server unreachable) before falling back to `show` for five keys, and `show` dumps full bodies + relations + backlinks where the skill's framing expects bounded framed blocks. Skill: retrieve-memory. Phase: SL-267 PHASE-03 /phase-plan."

