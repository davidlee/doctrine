detail = "Design run dr-019fd6b6 (SL-249, inquiring). Disposed inq-17 via a create disposition; DEC-165 minted with an empty [facet] and a template-only .md body. The ruling was fully in hand at the moment the checkpoint was written — context, choice, alternatives, rationale, consequences all decided — and there is no wire slot to carry any of it. Filling DEC-165 now means hand-editing record-165.toml and record-165.md, because `doctrine knowledge` has no edit verb. This is IMP-403 lead 2 and lead 1 biting simultaneously, observed from inside the slice scoped to fix them. Cost this instance: two hand-edits plus the re-derivation of prose already written in the conversation."

