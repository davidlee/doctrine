summary = "design (SL-261): resolving an inquiry takes three refusals to find the cp- disposal shape"
detail = "declare on inq-N with resolution -> 'inert, honoured for fnd-'; with dispose -> 'inert, honoured for cp-'; bare lifecycle resolved -> 'cannot resolve without a disposition'. Working shape: {subject: cp-N, disposes: inq-N, dispose:{form:create,...}} plus {subject: inq-N, lifecycle: resolved}. Neither the envelope nor the contract says how to resolve an inquiry."

