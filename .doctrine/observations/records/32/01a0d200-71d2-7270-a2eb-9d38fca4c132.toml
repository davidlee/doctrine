summary = "code-review: review new --target rejects the <ref>@PHASE-NN spelling its own records display"
detail = 'RV-375/RV-376 store target = "SL-261@PHASE-01"/"SL-261@PHASE-02" in their TOML, so I passed --target SL-261@PHASE-05 and got DANGLING_REF: Target not found. The accepted spelling is --target SL-261 --phase PHASE-05. --help documents --phase, so this cost one failed call; the trap is that the canonical stored/displayed target is not an accepted input for the verb that writes it.'

