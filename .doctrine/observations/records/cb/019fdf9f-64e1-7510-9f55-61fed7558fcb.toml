summary = "phase-plan: design claim verified on a minimal package missed the repo's own lint policy"
detail = "SL-248 sec-6 verified the pub(crate)->pub promotions 'by execution' on a minimal package, but that package did not carry the workspace lint policy ([workspace.lints] warnings=deny, unreachable_pub=deny, clippy::allow_attributes=deny). Under the real policy the promotion breaks the bin target, and both obvious suppressions are also denied. Cost: four probe builds at phase-plan time to establish what the design asserted as settled. Minimal-package verification should inherit the repo's lint config, or the claim should be scoped to 'compiles in isolation'."

