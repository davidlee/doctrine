summary = "design skill: every user-authority acceptance in reviewing also records design-accepted"
detail = "SL-277 run rev 46: attesting sec-1..3 needs a top-level acceptance, since section-reviewed as a checkpoint_act is refused ('binds to per-section coverage and the act carries none'). That submission also emitted act_recorded cpa-design-accepted, and the gate then counted user-acceptance-attested as met although the user had only okayed three sections. A traversal-only apply (rev 47) did not stale it. No retract verb exists; the only remedy is a later change to a bound input (sections, disposition). Same mechanism as the rev-33 observation. The recording-the-lock example in the reviewing fragment shows declare+acceptance only for the lock itself, implying but not stating this."

