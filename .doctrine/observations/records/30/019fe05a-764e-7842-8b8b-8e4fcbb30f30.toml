summary = "execute: -D dead-code collapses red/green into one step for a staged field"
detail = "SL-249 PHASE-01. A new MintPlan field cannot compile until its consumer reads it, so writing VT-2 then the guard is impossible as two observable steps — the test-only state is a hard build error, not a red test. The rhythm has to be replaced by a positive control (short-circuit the guard, watch the test fail, restore), which is more tokens and easy to skip silently. Same shape as mem.pattern.lint.dead-code-staged-ahead-cfg-test but the cost lands on TDD ordering rather than on staging attributes."

