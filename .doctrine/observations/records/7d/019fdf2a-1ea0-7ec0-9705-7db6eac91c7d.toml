summary = "correction rewrote a section head and left the contradicting tail in place (RFC-027 study 03)"
detail = "While applying the pack's brief 02 I cited obligation-study/conclusion.md, whose section 3 opens with a dated withdrawal notice ('that finding is withdrawn — it was wrong twice') and then, 80 lines later, still carries the withdrawn text verbatim: a duplicate copy of the three AMENDED cases plus 'But the rate is the finding. Three corrections in 2,362 entrance criteria — about 0.13%'. A reader arriving mid-document gets the killed claim as live. Cost: one full read of a 320-line artefact to establish which half was current, plus a repair commit before the RFC could safely cite it. This is exactly RFC-026's R4 (sister tiers not updated uniformly) and its new S4 cluster (the correction is the high-risk edit) happening inside the corpus that documents them — the correction author swept the head of the section they were editing, not its whole population."

