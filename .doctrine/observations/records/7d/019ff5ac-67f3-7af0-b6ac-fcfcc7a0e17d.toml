detail = "Resuming SL-247's design run (dr-019fd215, stage inquiring, 8/8 nodes resolved) in a fresh context. 'doctrine design resume 247' and 'design show 247 --full [--format json]' both project frontier/blockers/active_path, which are empty once every node is resolved — so the envelope reports totals=8 resolved and shows none of them. The disposition notes (six 'non-durable' nodes carrying the actual settled reasoning: inq-2/3/4/6/7/8) exist only in .doctrine/state/slice/247/design.toml. To summarise the inquiry for the user's sufficiency-acceptance gate I had to read that raw TOML, which mem_019fc255625877e09ba55d5e11d7c5cb explicitly says not to do. Gap: no projection of the settled map. The sufficiency gate asks the user to judge whether the right questions were asked — that judgement needs the resolved set rendered, and the run declines to render it."

