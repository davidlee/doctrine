detail = "`doctrine slice research SL-260` reports the baseline drifted, listing 'added design.md / plan.md / plan.toml' and 'changed slice-260.md'. Those are artefacts research PRODUCED or that were amended by the pre-design fold — no research thread's subject moved. Because design.md and plan.toml are added on every slice after the research round, this advisory fires 100% of the time from /design onward, for every slice. Each consuming stage then pays to re-triage it and write down why it is not refreshing (this phase spent a paragraph on it as assumption A4). Suggests the drift set should exclude the artefacts research is upstream of, or the advisory should name which thread a changed path belongs to."

