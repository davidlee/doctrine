summary = "/execute PHASE-10 T5: sheet's prescribed claim was falsified by the shipping backend, costing a full diagnostic detour"
detail = "The T5 task card prescribed set equality against CapsuleEnv and a red test named the_capsule_environment_equals_capsule_env_exactly. Written exactly as briefed the row read Violated against the real bubblewrap backend, because bwrap writes PWD into the child exec block itself after --clearenv/--setenv. Recovering cost: one scratch instrument to dump the probe arm's stdout, two hand-run bwrap invocations to isolate the cause to --chdir, then a redesign of the payload's admission rule and a renamed test. The sheet author could not have known, so this is not a defect in the sheet — but it is the cost of a task card that states a claim rather than a question. A card phrased 'establish what the capsule's environment actually is, then state the equality over it' would have led to the same code without the false red."

