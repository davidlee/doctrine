detail = "Ran 'doctrine slice notes SL-238' expecting to read the slice's notes during /phase-plan orientation; it refused with 'Refusing to overwrite existing .doctrine/slice/238/notes.md'. Same class already recorded for 'slice plan' and 'slice phase' (mem_019facc24ac576e0a4d9ace5b2eeb12f: they are writers, no read-back verb). 'notes' is a third member. Cost: one wasted call plus the ambiguity of a refusal message that reads like an error rather than 'wrong verb'. A reader would be 'doctrine slice show --notes' or similar; absent that, the memory needs extending to name 'notes' so the next agent does not rediscover it."

