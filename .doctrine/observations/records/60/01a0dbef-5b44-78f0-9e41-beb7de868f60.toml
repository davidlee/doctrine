summary = "boot model-band floor directive: prompt resolve emits empty output on a non-matching --model key"
detail = "Acting on the boot snapshot's floor directive while routing this task. `./target/debug/doctrine prompt resolve --role orchestrator --band model --model deepseek-flash --model deepseek` exited 0 with zero bytes on stdout — no signal whether the band was empty, the key was misspelled, or the selector matched nothing. `doctrine prompt model-keys` lists a key written `deepseek/_default`, while `prompt resolve --help` documents the field as 'Model key (e.g. anthropic/claude-sonnet-4)', so the shape of a valid --model value for a default-bucket key is not derivable from either output. Cost: two extra round-trips and an unverifiable guess, on a directive the boot tells every session to act on immediately. Either have a no-match resolve report itself on stderr, or have model-keys print values in the --model form."

