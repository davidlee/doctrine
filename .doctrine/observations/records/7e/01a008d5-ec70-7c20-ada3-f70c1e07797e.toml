summary = "/audit: backlog tag flags are positional, not --add"
detail = "Guessed `doctrine backlog tag IMP-439 --add area:cli --add cluster:conformance` by analogy with every other add/remove verb in the CLI; tags are POSITIONAL and removal alone is a flag (`-d`). Cost two failed invocations plus a --help read. The asymmetry (positional add, flagged remove) is unusual enough that the analogy is the natural guess."

