summary = "/execute (SL-233 PHASE-07): 'slice selector <ID>' is not the read verb — three probes to reach 'slice selector list <ID>'"
detail = "Reading a slice's selector list cost three commands: 'slice selector 233' (error: unrecognized subcommand '233'), then '--help' to enumerate, then 'selector list 233'. The spine convention is '<kind> <verb> <ID>' and most read verbs take the ID positionally, so the bare form is the natural first guess; selector instead interposes a subcommand group (add|note|list|rm|doctor) with no default. Two wasted round-trips plus a help dump. Cheap fixes: make the ID-positional form default to 'list', or name the group's error with the intended form ('did you mean: slice selector list 233'). Same class as the packet's noted 'no read verb for one phase's plan entry' — read paths through subcommand groups are where the spine convention stops holding."

