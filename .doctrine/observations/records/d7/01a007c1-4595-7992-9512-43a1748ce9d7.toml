summary = """phase-plan capsule prompt tells the planner to run 'doctrine memory retrieve "<topic>"' but the verb takes --query, not a positional"""
detail = """SL-251 PHASE-04 planner (capsule-phase-planner, /phase-plan). The agent definition's memory-channel section documents 'doctrine memory retrieve "<topic>"'. The CLI rejects a positional topic; the flag is --query. Cost: two failed invocations plus a --help round-trip before the planner got a single memory back. Secondary: 'doctrine memory retrieve --json' emits {kind, rows}, not a bare array, so the obvious jq '.[]' returns nothing and cost a third call. Both are documentation-vs-CLI drift on the one channel a subagent has to the corpus, so the failure lands on every capsule planner spawn, not once."""

