summary = "audit (SL-267): a skipped `doctrine memory sync` leaves the delivered corpus stale while every gate stays green"
detail = "PHASE-06's final commit (795317bdb) edited four shipped memory masters and never re-materialised. At HEAD .doctrine/memory/shipped/ still carried the pre-repair repo-private paths (install/, install/hymns/, ADR-019, memory/). `doctrine doctor` (51), `doctrine check gate` (exit 0), `publication validate` (98) and `e2e_claude_install` (13/13) were all green throughout. Only a re-run of `cargo build && doctrine memory sync` exposes it ('0 new, 9 changed'). design R5 predicted exactly this invisibility; no gate compares the materialised corpus against its sources."

