kind = "friction"
summary = "dispatch status prescribes 'refresh-base then re-prepare' for a slice that is already closed"
detail = "After a dispatched slice reached 'done' and its code landed on trunk, 'doctrine dispatch status --slice 265' still ends with: next: trunk advanced past the prepared base — run 'dispatch refresh-base --slice 265' then re-prepare. Both acts are pointless (and refresh-base needs a live coordination worktree, already removed): the funnel is complete and the slice is closed. 'dispatch next' correctly reports all-reaped, so the two verbs disagree about what a finished slice should hear. Skill: close. Consequence: a next agent reading the funnel rollup is invited to re-prepare reviewable refs for a done slice."

