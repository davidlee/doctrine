summary = "reconcile/close: conformance can't see a reconcile-stage write (IMP-292 defect 4, second instance)"
detail = "SL-250's audit brief predicted .doctrine/spec/tech/011/** would clear once REV-049 landed. It did not — every recorded delta binds to a PHASE-NN and a reconcile commit belongs to no phase, so a governance target discharged at reconcile reads undelivered forever. Cost: I burned a diagnosis cycle (a --against run plus a backlog search) to establish that the selector was fine and the fold was blind, on a defect already recorded as IMP-292 defect 4 with SL-244/REV-048 as the first instance. The brief's confident wrong prediction is itself the tell: an auditor who knew the mechanism would not have written it, so each slice pays the diagnosis again. Cheapest fix short of the real one: /audit should stop predicting the cell clears, and /close should know the red cell is expected for any slice with a governance design-target selector."

