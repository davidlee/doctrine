summary = "/design: no CLI surface prints an inquiry node's question text"
detail = "User asked to see inq-1..inq-13. 'doctrine design show --full --format json' returns blockers as {id, reason, needs_in_degree} only — no question field — and the prompt format prints ids plus blocker reasons. The only place the question text exists is the gitignored runtime snapshot .doctrine/state/slice/258/design.toml, which the project's own guardrail says not to read directly ('read entities via show, not raw files'). So the agent must either violate that guidance or reconstruct the questions from its own submission payloads, which is unavailable to a resumed cold context. 'design resume' is the documented cold re-entry projection but is scoped to re-entry, not to reviewing the graph's content. A run whose whole purpose is to hold shaping questions has no read verb for them."

