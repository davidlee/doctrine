summary = "/phase-plan: 'check the research advisory' minted a research baseline on a slice that never ran /research"
detail = "SL-254 has no research artefact (design was authored without the /research round). The /phase-plan skill step 4 says to check the advisory with 'doctrine slice research <id>'. On a slice with no research/ dir that verb MINTS the dir and stamps baseline.toml against the current design/plan hashes rather than reporting 'no research artefact — nothing to be stale against'. A read-intent instruction produced a write, and the stamp asserts a baseline that no research round ever stood behind, so a later /research would read as un-drifted. Removed the stub by hand (gitignored, so invisible to git status too). Wanted: a no-op advisory when the dir is absent, with minting reserved for /research itself or an explicit --init."

