summary = "phase-plan: doctrine memory retrieve takes --query, not a positional, unlike memory search"
detail = "A capsule-phase-planner lost three invocations to 'error: unexpected argument' before reading --help. 'doctrine memory search <q>' takes a positional; 'doctrine memory retrieve' requires --query. The inconsistency between two sibling verbs in the same group is the trap. Compounding it: /phase-plan step 3 instructs 'run /retrieve-memory', which a subagent cannot invoke, so every planner subagent falls back to the raw CLI and meets this edge. Reported via hand-back; recorded by the orchestrator."

