summary = "/phase-plan: broken memory search drove a planner to read .doctrine/memory raw files, defeating the read-via-verb guardrail"
detail = "SECOND independent occurrence, now from the SL-246 PHASE-04 capsule-phase-planner after the PHASE-03 planner hit it (recorded separately). Recurrence is the point: two different agents on the same slice both lost the verb. New and worse datum this time - 'doctrine memory search' returned an apparently relevance-blind list, the SAME eleven rows (bwrap, capsule, sandbox) for the query 'black-box CLI golden byte-exact stdout test' AND for 'inspect knowledge facet', with no matching row surfaced in either. The planner recovered by grepping memory_key/title pairs straight out of .doctrine/memory/items/*/memory.toml, which found ten directly relevant memories in ONE call. So a broken ranking verb actively pushed an agent into the raw-file read that the boot guardrail ('read entities via doctrine <kind> show, not raw files') exists to prevent - and the raw read was roughly ten times cheaper and strictly more effective. A guardrail that is more expensive and less effective than violating it will be violated. Also re-confirmed: 'doctrine memory retrieve' takes no positional query and errors 'unexpected argument'; the real flag is --query. Cost four wasted invocations for this planner on top of the PHASE-03 planner's three."

