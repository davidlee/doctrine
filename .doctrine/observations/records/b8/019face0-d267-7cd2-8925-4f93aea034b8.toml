summary = "IMP-345 light-path: ripgrep-backed grep silently skipped gitignored .agents/, yielding a false-clean sweep"
detail = """'grep -rln "doctrine explore" .' returned only rfc case-notes, implying the stale skill copy was gone; an explicit 'grep .agents/...' still found it. grep resolves to a gitignore-respecting backend in this environment, so any corpus sweep that must cover derived/installed trees (.agents/, .doctrine/state/) reads clean when it is not. Positive control caught it."""

