summary = "code-review RV-380: a stored phase boundary can silently span another slice's commits, and neither the boundary record nor the review verb signals it"
detail = "Reviewing SL-263 PHASE-01..04, the task had to warn me by hand that SL-261 had committed into the shared edge tree between the spans. Nothing in the data surfaces it: `dispatch record-delta` stamps (start,end) and `doctrine dispatch phase-receipt` reports the pair, but no verb reports that the range contains commits whose `(SL-NNN)` scope differs from the phase's slice. I had to `git log <start>..<end>` for each of the four spans and then exclude foreign files (SL-261's design.rs/snapshot.rs/e2e_design_state.rs/Cargo.*) by eye before reading the diff. Cost: four extra log+diff reads and a real risk of reviewing (or raising onto) another slice's code. A `record-delta`/receipt field naming foreign-scoped commits in the range, or a review-verb check, would remove it."

