kind = "friction"
summary = "capsule-worker: the record-delta then verify-vt ritual is unreachable to a worker by construction — record-delta requires --commit <sha> and a capsule worker must not commit"
detail = "Phase sheets (and the /execute-shaped ritual they inherit) instruct the implementer to run record-delta then verify-vt then grep. In the capsule split the worker hands back an UNCOMMITTED delta, so it has no sha and cannot run step 1; step 2 then reports UNATTRIBUTABLE for every row because file-in-delta is tested before keyword. Only the grep step is actually the worker's. The pair belongs to the orchestrator, after the commit. Sheets should route it there explicitly rather than leaving the worker to discover the verb is closed to it."

