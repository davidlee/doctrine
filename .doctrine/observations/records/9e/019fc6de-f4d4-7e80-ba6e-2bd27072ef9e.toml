summary = "/close: piping `doctrine check gate` masks its exit code — a red gate reads as exit 0"
detail = "The close ritual (CLAUDE.md) says run `doctrine check gate` at close. Run as `doctrine check gate 2>&1 | tail -40` to bound output, the pipe swallows the recipe's exit 101 and the harness reported 'exit code 0'. Only reading the tail itself revealed 'test result: FAILED ... recipe test-all failed with exit code 101'. An agent that trusted the reported status — or that tailed too few lines to catch the failure block — would close a slice on a red gate believing it green. Bit during SL-241 close. Mitigation is either PIPESTATUS, or gate emitting a terminal verdict line that survives any tail depth."

