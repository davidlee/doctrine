summary = "/phase-plan: 'doctrine memory retrieve' takes --query, not a positional, and its error does not name the flag"
detail = "A capsule-phase-planner on SL-245 PHASE-05 invoked 'doctrine memory retrieve <text>' and got 'unexpected argument ... found' with no mention of --query, costing a round trip. Compounding it, /phase-plan step 3 instructs 'run /retrieve-memory', which a subagent cannot invoke, so every subagent planner must rediscover the CLI shape by trial. Either the error should name --query, or retrieve should accept a positional query."

