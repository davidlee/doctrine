summary = "/design: ReviewPolicy variants adversarial-then-human and human-then-adversarial are undeclarable — 22 B label vs the 16 B admission bound"
detail = "design apply with review_policy.policy=adversarial-then-human refuses: 'payload label term is 22 bytes, over the 16-byte admission bound'. src/design_run/run.rs:449 admits the policy label via PayloadTerm::label, whose ValueKind::Label bound is bounds.rs DESIGN_STAGE_LABEL_BYTES=16 — derived from the Stage vocabulary (longest 'exploring', 9 B) and const-asserted for Stage (mod.rs:176) and DispositionForm (inquiry.rs:188), but never for ReviewPolicy. Two of the four advertised policies are therefore unreachable via the contract; only human-only (10 B, the default, so it emits no row) and adversarial-only (16 B, exactly at the bound) can be declared. Cost: user chose adversarial-then-human for SL-260 and the run cannot record it."

