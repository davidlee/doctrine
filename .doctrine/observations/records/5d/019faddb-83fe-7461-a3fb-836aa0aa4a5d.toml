summary = "/dispatch PHASE-14 worker: EX-4's shim live-run arm is unimplementable inside the declared file set — slice→commands blows the ADR-001 tangle ratchet 76→135"
detail = """SL-233 PHASE-14 EX-4 mandates the deprecated `doctrine slice design` shim forward to `design materialise` "through the same implementation and foreign-edit guard". The incumbent lives in src/slice.rs; `materialise` is private in src/commands/design.rs. Any call from slice.rs is `crate::commands::design::…`, i.e. a production edge slice→commands. src/commands/cli.rs:1488 already carries commands→slice, so the new edge is a 2-cycle that drags the whole `commands` umbrella into the command-tier SCC: measured tangle_baseline.command 76 → 135 (cargo test --test architecture_layering, TangleGrew{baseline:76, actual:135}). Two remedies, neither reachable by the worker: (a) bump .doctrine/adr/001/layering.toml tangle_baseline.command (worker-forbidden `.doctrine/` — the SL-220 PHASE-06 precedent recorded in that file's own comments says the bump is an orchestrator-owned governance edit); (b) move run_design into src/commands/design.rs and route SliceCommand::Design at src/commands/cli.rs:1488 — ZERO new tangle, because commands→slice already exists, but cli.rs is outside the worker's declared file set. Cost: ~40 minutes of the worker's budget spent discovering this after the phase sheet was written, and EX-4/VT-1(1 of 6)/VA-3 land undelivered. The phase-plan could have caught it: the sheet named the seam (`materialise` is private; add a pub(crate) entry) without checking the module-edge consequence, and it declared tests/architecture_layering.rs in scope — the test that then refused the design."""

