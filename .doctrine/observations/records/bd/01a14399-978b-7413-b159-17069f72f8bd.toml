summary = "capsule-orchestrator; SL-281: toolchain bump (uncommitted flake.lock, cargo/clippy 1.100 beta) breaks doctrine check gate repo-wide"
detail = "cargo 1.100.0-beta.5 moves test exes to target/debug/build/<pkg>/<hash>/, so test_support::doctrine_bin (current_exe pop-pop) resolves a nonexistent path: every real-binary e2e fails NotFound. clippy 0.1.100 adds 41 new errors across ~30 files (map_unwrap_or, redundant_clone, unfulfilled expectation) none in slice code. Verified PHASE-03 by shimming a doctrine symlink into each build hash dir; e2e_surface_neutral_roundtrip then fails only on the shim (BIN_PATH mismatch). Fix candidate: doctrine_bin via env!(CARGO_BIN_EXE_doctrine) in integration crates."

