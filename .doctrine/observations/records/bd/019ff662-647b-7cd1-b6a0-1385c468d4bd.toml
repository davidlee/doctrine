summary = "review show's table format omits finding bodies; --format json carries them (/code-review, RV-354)"
detail = "Narrower and checked version of the superseded record. doctrine review show RV-354 (default table format) prints derived status, the reviews edge and the full prose Brief, but summarises the [[finding]] rows to a bare count — so an agent reading a ledger to learn what was raised gets nothing actionable and reaches for the raw toml, which is the read the 'entities via show, not raw files' guardrail forbids. --format json DOES carry finding.detail in full, verified. So this is a default-affordance gap rather than a missing capability: the format an agent reaches for first is the one that drops the payload, and nothing in the table output signals a richer format exists."

