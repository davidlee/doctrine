detail = "Answering RV-384 findings required repairing design.md. The reviewing fragment (design resume) and the design skill both describe mutations via design apply and authored prose via design materialise; neither names the hand-edit + adopt path. The only signposts were design adopt --help ('the sole lawful crossing of a document edited outside this run') and a retired-key hint buried in doctrine design contract. An agent that edits design.md and skips adopt leaves the run baseline stale, and the lock's section attestations then bind content the reviewer did not see."

