detail = "Corrects 01a0031f-8c8e-7b63-ad98-8ca6dc52f9d0, which claimed the gate was inert. Measured after: 'doctrine next' gates QUE-218's four and QUE-219's five out of 378 actionable rows, and 'blockers ISS-327' names QUE-219. The actionability graph (priority/graph.rs) admits cross-kind edges; only backlog_order.rs cannot represent the target, since ItemId is (ItemKind,u32) over the five backlog prefixes. So the defect was one view's footer stating a falsehood, not a broken gate. The friction that cost real tokens was believing the footer: it is the loudest surface on that view and asserted the opposite of the truth, so diagnosing it meant reading three call sites. Interim fix landed 74b773690 (suppress the false lines); SL-238 still owns admission."

