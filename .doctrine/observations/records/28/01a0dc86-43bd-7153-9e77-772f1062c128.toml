summary = "record-memory: the doctrine MCP server was unavailable (server_backoff) mid-session, forcing a CLI fallback"
detail = """Attempting doctrine_memory_record via the MCP tool returned {code: server_backoff, message: 'Server "doctrine" not available (last failed 0s ago)'}. The fallback to `doctrine memory record` then cost an extra round trip because --provenance-source requires KIND:REF (my first attempt passed the bare IMP-490 and was refused). Net: 2 extra tool calls to record one memory. Likely the server process was launched from a stale DOCTRINE_BIN and died when cargo rebuilt ./target/debug/doctrine, but the tool reported backoff rather than a diagnosable cause."""

