summary = "/rigour: review ledger findings are not readable via `review show`"
detail = "Reviewing RV-322's dispositions. `doctrine review show 322` renders the derived status + brief prose but NOT the findings; `review status` gives counts only. The findings are reachable only via `--json`, where each finding's `summary` is empty and `detail` carries a full inlined entity dump (the PRD-015 body, several KB, pasted into finding F-1's detail). Cost: a truncated head -c 3000 read, then a jq projection, to learn nine one-line dispositions. A `review show --findings` (id / severity / status / disposition / one-line summary) would have been ~200 tokens instead of several thousand."

