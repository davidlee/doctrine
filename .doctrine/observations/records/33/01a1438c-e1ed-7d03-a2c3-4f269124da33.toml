detail = "slice verify-vt 281 reported PHASE-02 VT-1 UNATTRIBUTABLE ('not modified by this slice') after the code was committed, because attribution reads the phase's recorded boundary, which is only closed at --status completed. Checking VT before completing the phase is the natural order; the verdict didn't say it was waiting on the boundary. Also: verify-vt takes no phase arg (tried 'verify-vt 281 PHASE-02')."

