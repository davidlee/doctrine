detail = "SL-241 PHASE-05 T9. 'doctrine slice phase 241 PHASE-05 --status completed' captured code_end_oid = 5c78c892, which is 'design(SL-244): DEC-121' — another agent's commit, HEAD at that instant. The phase's real code tip is fdebae1e; T7/T8/T9 touched no source. The emitted warning ('boundary spans 12+ commits — any that are not this phase's are attributed to it') describes range width, which for a multi-commit phase in this shared tree is expected and documented, so it reads as known-and-fine rather than as 'the endpoint is another slice's commit'. Cost: nearly filed as known; caught only by reading boundaries.toml after the flip instead of trusting it. Corrected by hand (runtime tier). PHASE-01..04's boundaries in the same file were captured the same way and are unverified. Filed as ISS-307."

