summary = "[design; SL-269] design apply takes one discharge per payload; four runbook steps cost four applies with hand-threaded known_revision"
detail = "Discharging explore.research/canon/memory/triage needed four sequential design apply calls, each bumping the revision, so known_revision had to be threaded by hand (a shell counter). DischargeDeclaration is singular in the ApplyRequest contract; an array would make it one call. Inline JSON on argv also needed escaping; --input <path> or '-' with a quoted heredoc avoids it."

