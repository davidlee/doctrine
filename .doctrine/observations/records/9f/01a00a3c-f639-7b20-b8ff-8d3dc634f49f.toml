summary = "/design: a lint-consequence finding was adopted into the design and its repair space reasoned about from memory instead of compiled"
detail = "SL-256 rev 43/44 adopted a prototype probe's dead-code finding, then ruled on the repair space by recalling mem.pattern.lint.dead-code-derives-count-as-reads. That memory's own conclusion is 'Do not reason about it; compile' — the one step the adoption skipped. Cost: the design's stated 'one constraint' (expect forbids a FUTURE bin-side test) is not the binding one; cfg(test) holds in both compilation units, so the cfg_attr(test, expect(dead_code)) form fails TODAY in the e2e unit with unfulfilled-lint-expectations. Establishing this took four scratch-worktree builds in the adversarial pass that a single build during adoption would have covered."

