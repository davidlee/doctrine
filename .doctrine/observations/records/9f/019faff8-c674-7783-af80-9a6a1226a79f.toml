detail = "Ran `doctrine backlog list --limit 5` to check for an existing fixture-extraction item. clap refused with 'unexpected argument --limit found' and the tip 'to pass --limit as a value, use -- --limit' — which is a suggestion for passing it as the positional SUBSTR, i.e. it would search for the literal string '--limit'. Following the tip produces a silently empty result rather than an error. One wasted call plus a plausible wrong path."

