summary = "phase-plan: grep for a phase block in plan.toml misses aligned TOML keys"
detail = """grep -n 'id = "PHASE-' returns nothing against .doctrine/slice/NNN/plan.toml because the authored file aligns its keys: 'id        = "PHASE-01"'. That is the obvious first grep for locating one phase's block in a 6-phase plan, and it silently returns empty rather than failing loudly. Minor but it costs a retry every time a planner orients."""

