detail = "The SL-246 PHASE-02 planner deliberately skipped /phase-plan step 4's 'doctrine slice research 246' as disproportionate for a three-item pure-code phase (an enum, a struct, and one pure function), citing the project's disciplined-laziness rule, and flagged the skip rather than omitting it silently. That is the right call, but it means the skill's step list is calibrated for large phases and every planner on a small phase must either overspend or deviate. A proportionality clause in the skill -- naming when the research step is and is not warranted -- would let a planner comply instead of justifying non-compliance."

