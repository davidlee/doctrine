detail = "Updating mem.pattern.testing.no-root-find-walk during ISS-281, then verifying it, failed twice: 'working tree is dirty: refusing to verify'. The gate is whole-tree, but the tree carries other agents' uncommitted work (tests/*.rs, .doctrine/knowledge, .doctrine/slice/237). Committing my own memory item did not clear it. In a repo whose own AGENTS.md assumes multiple agents share one worktree, the gate can only be satisfied by committing someone else's work or waiting for them to finish — so a re-confirmed memory stays 'unverified' for reasons unrelated to its truth. Scoping the gate to the memory's own paths (or to scope.paths) would make it satisfiable. Already homed as work at IMP-221 ('relax dirty-tree gate'); recorded here as the token/flow cost datapoint, not a new item."

