summary = "/phase-plan: no read verb for a single phase's plan entry — 'slice phase' is a status setter"
detail = "Reading PHASE-03's authored plan entry (objective + EN/EX/VT) required grepping plan.toml for the id, computing the line span against the next phase marker, and Read-ing a 57-line window. 'doctrine slice phase <id> <phase>' looks like the read verb but is a status SETTER (errors: --status required); 'slice phases <id>' only reports 'Phases up to date.' The routing table sends /phase-plan at exactly this artefact, so every phase plan pays raw-file navigation the 'read entities via show, not raw files' guardrail exists to prevent. A 'slice phase show <id> <PHASE-NN>' would collapse ~4 calls to 1."

