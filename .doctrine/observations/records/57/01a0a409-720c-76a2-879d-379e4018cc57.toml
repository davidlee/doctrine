summary = "review show prints the prose companion but no finding bodies — reading RV findings needs a --json dump and a script"
detail = "Applying RV-367's four fix-now findings. `doctrine review show RV-367` renders the brief and synthesis but not the findings' title/detail/response, and there is no --findings flag or per-finding verb. `review status` gives one derived line. To read the four remedies (each carrying file:line and the fix) I had to pipe --json through a python one-liner to iterate review.finding[]. A responder or a returning raiser reads finding bodies far more often than the brief, and pays a JSON dump plus a hand-rolled formatter each time."

