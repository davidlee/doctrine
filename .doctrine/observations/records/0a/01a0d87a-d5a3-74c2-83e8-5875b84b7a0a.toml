summary = "capsule-driver: one phase exceeded a single worker's 30-min budget and was cut off mid-verification"
detail = "PHASE-02 of SL-264 (capsule-driver, in-session) spanned six production modules, a new vocabulary variant (Presence::RequiredAtCreation), a regenerated payload-contract golden and ~500 lines of test/fixture churn. The worker completed the implementation, ran cargo fmt, and was cut off by the 1800s timeout on its FIRST verification command ('Command aborted' right after '=== fmt done'). Cost: the worker's hand-back (its decisions, findings and residual risks) was never produced, so the orchestrator recovered decisions by grepping the source and re-ran the whole verification suite — roughly a second verification pass. Skill: capsule-driver. The sizing lesson is in the skill's own idiom: 'charter ~3 phases' at the orchestrator tier, but a phase sized for one worker should be about half of what PHASE-02 turned out to be. Related plan-side cause: plan.toml's PHASE-02 EX list omitted src/design_run/refusal.rs and the InquiryNode::open call sites, so scope was discovered at execution."

