summary = "design (SL-238): rtk output filter rewrote source identifiers in rg results"
detail = "While verifying design claims, rg output through the rtk proxy substituted the identifier 'title_for' with 'n' in matched lines (e.g. 'fn status_and_title_for' rendered as 'fn status_and_n'). The mangling is silent and looks like real source text, so a claim about a function's name/arity read from that output would be wrong. Had to re-derive the fact from an unmangled sed range. Cost: one wasted verification round plus the tokens to notice."

