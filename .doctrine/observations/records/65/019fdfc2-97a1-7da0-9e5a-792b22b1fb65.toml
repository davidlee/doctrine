detail = "SL-250 PHASE-05. design.md sec-5 and plan.toml PHASE-06 EX-8 enumerate tests/e2e_skills_symlink.rs as the file whose 'no skills symlink' assertions invert. tests/e2e_claude_install.rs::install_wires_skills_agent_and_hooks_directly carried the identical assertion and is named in neither. It surfaced only from the full suite at the close-out gate, after the phase-plan reading list had been built from the design's citations. Same class as PHASE-04's F1: a precise enumeration reads as exhaustive. Cost: a late unplanned edit inside a close-out gate run, plus an inventory in an authored plan (EX-8) that is now wrong. Cheap remedy the design could have used: grep the assertion CLASS across tests/ rather than citing paths."

