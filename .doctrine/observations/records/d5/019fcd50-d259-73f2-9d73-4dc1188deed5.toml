detail = "SL-244 PHASE-05's sheet orders T4..T14 so that each task ends compiling and green (EN-2). T5 (admission owns the rule/record correspondence) and T6 (construction fills covered/observed/confirms in the shape the rule names) both need to resolve ActKind -> ActRequirement, whose only route is the CONTRACTS table. T9 emits that table, four tasks later. Nothing at /phase-plan time checked the task graph against the data dependencies between tasks — the ordering was reasoned about in terms of 'what breaks when Evidence goes' and 'fixtures before the flip', which is a different axis. Cost: a full consult round-trip mid-execute, plus re-reading three design regions to establish that no partial lookup exists. Same class as F3 (nothing at /plan time checks a test_file path is free or apt)."

