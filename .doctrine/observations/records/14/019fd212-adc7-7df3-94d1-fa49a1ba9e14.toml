detail = "Scoping SL-248. Both the slice skill's step-4 example and the generated slice-248.toml header comment demonstrate 'doctrine link SL-NNN specs SPEC-018'. Running it errors: '`specs` is not a relation label authorable by SL via `link`. Legal labels: references, references, references, supersedes, governed_by, related, fulfils'. Then 'fulfils SPEC-030' also fails (targets must be ISS/IMP/CHR/RSK/IDE), then 'references SPEC-030' fails again for a missing --role. Three failed invocations to author one edge, each error revealing only one layer of the constraint. Also: the legal-label list prints 'references' three times (once per role) rather than naming the roles inline."

