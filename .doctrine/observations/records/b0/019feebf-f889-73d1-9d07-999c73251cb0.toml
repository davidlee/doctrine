summary = "references edges cannot target an RV, so a spawned backlog item cannot cite its review"
detail = "Splitting ISS-345 out of ISS-343 under RV-353, I tried 'doctrine link ISS-345 references RV-353 --role originates_from' and got 'references target must be one of [ISS, IMP, CHR, RSK, IDE, SL], got a RV'. An adversarial review is a first-class kind (ADR-007) and is a legitimate origin for work intake, but the relation model cannot express it — the provenance survives only as prose. Linked to ISS-343 instead, which loses the actual originator. Skill: none (RV-353 F-4 remediation)."

