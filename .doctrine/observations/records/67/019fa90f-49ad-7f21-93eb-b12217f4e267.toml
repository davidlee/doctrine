summary = "/dispatch: record-boundary leaves a staged deletion in the coord tree"
detail = "'dispatch record-boundary' lands a working-tree-free commit but does not sync the coordination worktree's index, so 'git status' and 'dispatch tree-state' both report a staged deletion of the boundary row just written. Reads as a funnel-reversion signature produced by the funnel's own verb; cost a diagnosis round mid-task to establish the commit was fine and only the tree state was wrong. Captured as ISS-274."

