detail = "Edited plugins/doctrine/skills/spec-coverage-assessment/SKILL.md, ran 'install -y --skill', and the installed mirror at .agents/skills/ still held the old text. Burned ~5 tool calls chasing a RustEmbed staleness hypothesis (touch src/install.rs + rebuild) before reading delegate_argv: non-Claude skill install is 'npx skills add <github-slug>', i.e. sourced from the PUBLISHED repo, so a working-tree skill edit is invisible to .agents/ by construction until landed. Nothing was broken. Cost was the absence of any signal that the mirror's source is remote — the install plan line says only 'delegates to npx'."

