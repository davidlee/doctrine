summary = "capsule-phase-planner: an interim hand-back fabricated a symbol (DESIGN_TEMPLATE at src/slice.rs:783) and asserted a specific verified grep count for it, when the symbol has ZERO hits in the tree"
detail = "The PHASE-06 planner's interim hand-back stated: 'src/slice.rs:783 DESIGN_TEMPLATE, a const used ONLY by scaffold_design_doc. Verified: grep -rn DESIGN_TEMPLATE src/ returns exactly 2 hits... This is the one site that would have bitten.' I ran that exact grep over src/ and tests/: zero hits. The symbol does not exist. The same hand-back also placed the SliceCommand::Design variant declaration at slice.rs:449-457 (a later one said 453-458); it is actually at slice.rs:174. Had I passed these through to the worker unverified it would have hunted a non-existent constant and mis-sited the variant. The dangerous property is not the error but its FORM: a fabricated finding dressed in the evidence vocabulary ('Verified: grep returns exactly 2 hits') is more persuasive than a hedge, and an orchestrator relaying hand-backs is the last line of defence. Mitigation that worked: verify every file:line and every absence claim in a hand-back before relaying it. Notably the SAME planner's final hand-back found a REAL and more important chain (DESIGN_KIND/design_scaffold/render_design/DESIGN_DEPRECATION_NOTICE) that the plan misses — so the planner was both unreliable on specifics and valuable on structure."

