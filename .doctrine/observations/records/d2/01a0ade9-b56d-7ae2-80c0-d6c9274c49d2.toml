summary = "A module-level #![allow(dead_code)]'s reason line is not its scope — inventories of what a blanket hides are wrong by construction"
detail = "SL-245 PHASE-05's suppression inventory enumerated the items each blanket NAMED in its reason string, and was complete by that measure. But a module-level #![allow(dead_code)] covers the whole module, so kitty.rs's blanket was also hiding DA1_REQUEST, a private const with no production reader that no reason line mentioned. It only became visible when the blanket was deleted and the module recompiled. The general lesson: the set of items a blanket hides is discoverable only by removing it, never by reading it, so any plan that budgets for a blanket removal must budget for unknown residue too. Worth promoting to a memory beside mem_019fab1f3de77403adfe1487790e6d53 (suppression scopes)."

