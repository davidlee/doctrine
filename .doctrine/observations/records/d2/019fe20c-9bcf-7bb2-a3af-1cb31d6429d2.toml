summary = "/execute (SL-248 PHASE-06): a rustfmt pass mid-battery silently invalidated three mutation anchors"
detail = "The mutation battery applies each mutation by exact text replacement against a snapshot of green source. Fixing the phase's clippy findings changed argument counts, so 'cargo fmt' reflowed three multi-argument call sites onto separate lines. The next battery run aborted on an anchor miss and had to be re-derived by hand from the reflowed source — three times, once per reflowed site, because the driver stops at the first miss rather than validating every anchor up front. Cost: three extra full battery runs and the reading to re-derive each anchor. Two cheap mitigations: validate all anchors before running any mutation (fail fast, once, with the full list), and re-snapshot after every format pass rather than after every edit."

