detail = "Answered 'where does pi-specific boot guidance go?'. pi's context-file candidates (AGENTS.override.md/AGENTS.md/AGENTS.MD/CLAUDE.md/CLAUDE.MD) are discoverable only as a string constant in the pi binary — docs/configuration.md documents the project .pi/ table and the context-file section separately, and neither says the two do not intersect. Both the user and I proposed .pi/AGENTS.md; it is silently dead. Confirming this needed binary-string extraction plus an empirical sentinel run."

