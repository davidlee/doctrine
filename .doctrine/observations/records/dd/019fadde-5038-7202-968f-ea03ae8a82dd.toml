summary = "/slice: search --kind error message advertises groups, inviting a nonexistent --group flag"
detail = """Ran 'doctrine search <q> --kind slice' (lowercase kind name). Error: "unknown kind prefix or group: 'slice'. Valid prefixes: ADR, ASM, ... Valid groups: all, backlog, governance, knowledge, specs". The message names two vocabularies for one flag, so the natural next attempt was 'doctrine search <q> --group backlog' — which fails with "unexpected argument '--group' found". Two wasted round-trips during slice scoping. Groups are values of --kind, not a separate flag; the error text should say so (e.g. '--kind accepts a prefix OR a group: ...') rather than listing 'Valid groups' as if a --group flag existed."""

