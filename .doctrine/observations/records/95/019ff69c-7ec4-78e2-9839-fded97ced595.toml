summary = "record-memory: edit→attest cycle forces a commit per step"
detail = "Strengthening an existing memory (mem.fact.dispatch.worker-confinement-is-actor-based) cost THREE commits for what is one logical change. Two rules compose badly: (1) 'doctrine memory edit' resets verification_state to unverified on ANY field change — including a scope.paths tweak that cannot invalidate the body; (2) 'doctrine memory verify' refuses a dirty tree by design (no false attestation), so attesting requires committing first. So every edit+attest is at minimum commit → verify → commit, and a follow-up scope correction restarts the cycle: body commit, scope commit, attestation commit. The refusal in (2) is right and I would not weaken it. The cost is in (1): a metadata-only edit that cannot affect the body's truth still burns the attestation. Candidate: scope the reset to body/summary changes, or let 'verify' accept a tree whose only dirt is the memory item being attested. Skill: /record-memory (via /design harvest)."

