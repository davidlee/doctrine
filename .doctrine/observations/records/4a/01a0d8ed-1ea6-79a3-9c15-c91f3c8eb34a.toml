summary = "memory list reports zero rows for the shipped corpus, with no indication it excluded it"
detail = "Auditing shipped memories, I ran 'doctrine memory list --limit 0' and got an empty result (0 rows) despite 71 shipped memory items existing under memory/. The verb enumerates local items only; the shipped corpus is silently absent. An empty list from a --limit 0 'all' query reads as 'corpus is empty', not 'this verb has a narrower scope than you assumed'. I had to fall back to ls on the shipped tree and to the boot snapshot's Memory index to enumerate what actually ships."

