summary = "review show renders the brief but not the finding bodies (/code-review, RV-354)"
detail = "doctrine review show RV-354 prints the derived status, the reviews edge, and the full prose Brief from review-354.md — but not the [[finding]] rows' severity/title/detail from review-354.toml. To read what the external reviewer actually raised I had to cat .doctrine/review/354/review-354.toml directly, which is exactly the raw-file read the 'read entities via show, not raw files' guardrail exists to prevent. The two-tier synthesis show performs for other kinds (TOML structured + MD prose) appears to run in only one direction here: the MD tier is rendered in full, the TOML tier's findings are summarised to a count. --format json was not checked as an alternative; the table format is what an agent reaches for first."

