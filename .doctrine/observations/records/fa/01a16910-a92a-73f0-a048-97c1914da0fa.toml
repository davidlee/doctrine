summary = "[execute; SL-286] pi write profiles cannot take the repo root and have no cargo"
detail = "quotient refuses a read-write root of /home/david/dev/doctrine (view-overlaps-protected: <root>/.quotient/profiles, even though that path does not exist). A subdirectory root works, but the child sees only that subtree and cargo is not on its PATH. Consequence: write delegates edit one subtree per call; the orchestrator runs every build/test and relays errors back, and a change spanning src/ and tests/ needs two sessions."

