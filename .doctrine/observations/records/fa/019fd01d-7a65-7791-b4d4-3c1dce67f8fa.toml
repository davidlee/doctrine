summary = "/execute: memory retrieve --path takes a repo root, not a file path, and fails obscurely"
detail = "Retrieving scope-bound memories for the files T12 touches, I ran `doctrine memory retrieve --path src/design_run/change_log.rs`. Two frictions: (1) --path cannot be repeated, so per-file retrieval is N invocations; (2) given a FILE path it errors 'Failed to read src/design_run/change_log.rs/.doctrine/memory/items — Not a directory (os error 20)', i.e. it treats the argument as a corpus root. The /execute skill step 3 says 'run /retrieve-memory against those paths', which reads as file paths. Cost: two wasted invocations plus a fallback to `memory search` with hand-built keywords. Either the flag is misnamed (--root) or it should accept a file and resolve upward."

