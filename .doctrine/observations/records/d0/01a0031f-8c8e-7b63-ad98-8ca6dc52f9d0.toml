summary = "backlog: a cross-kind needs edge is accepted at write and silently dropped at order, with a footer that calls the live target 'absent'"
detail = "doctrine backlog needs ISS-327 QUE-219 validates the ref and writes it. doctrine backlog list --by sequence then reports 'ISS-327 -> QUE-219 dropped (dangling: QUE-219 absent)' and contributes no ordering edge. QUE-219 exists. This directly defeats ADR-017's actionability gating on unsettled records: the gate is authored, validated, and then inert. Known and already scoped -- SL-238 (design), which names the same false 'absent' and the same silent discard for SL- prefixes. Recording because it now bites live gates rather than only stale done-slices, which raises SL-238's value."

