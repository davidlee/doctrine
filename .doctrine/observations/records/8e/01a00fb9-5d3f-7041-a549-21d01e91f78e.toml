summary = "evidence cannot dispute an RFC finding"
detail = "Authoring RFC-030's evidence trail: EVD-026 re-measures RFC-026 E8.3's zero-edge finding and contradicts its inference. `doctrine link EVD-026 disputes RFC-026` is refused — `disputes` targets only [ASM DEC QUE CON EVD HYP CPT]. So evidence bearing against a *deliberation* artefact has no edge to ride; the fallback is `references --role concerns` on the gating QUE, which loses the polarity. RFCs carry measured findings (the whole E8 series), so the gap is reachable in normal use, not exotic."

