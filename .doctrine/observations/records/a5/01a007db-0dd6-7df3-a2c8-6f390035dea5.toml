summary = "cargo test --lib silently tests nothing under src/commands/ — those live in the bin target"
detail = "SL-251 PHASE-04 worker (capsule-worker, /execute). The worker's first focused run of a new src/commands/design.rs test printed 'running 0 tests ... 212 filtered out' in 0.06s with no recompilation, which reads as green. commands::design is in the BIN target, not the lib; the correct focused form is 'cargo test --bin doctrine <filter>'. AGENTS.md carries 'cargo --bin doctrine memory # focused tests; don't use --lib' but it reads as advice about the memory subsystem rather than the general rule it is. Cost here was low because the worker noticed the timing; the failure mode is a worker that does not, and hands back a green it never ran."

