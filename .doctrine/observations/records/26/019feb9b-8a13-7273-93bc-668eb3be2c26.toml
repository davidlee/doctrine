summary = "design run: amending a node's question text invalidates graph-reviewed and blocking-set-declared"
detail = "In /design on SL-252 I amended inq-3's question text to carry a measurement (jail and host have different PATH shapes). The edit changed no structure — no node added or removed, no parent or needs edge touched, and inq-3 is not in the blocking set. The apply still emitted act_invalidated for both cpa-graph-reviewed and agd-blocking-set-declared, so the user must re-review the graph and I must re-declare an identical blocking set. Second occurrence this session; the first was a genuine structural change (adding inq-10) where invalidation was correct. Cost is a full re-review request per text amendment, which pushes an agent toward either batching amendments (losing the just-measured-it timing) or not recording measurements on nodes at all."

