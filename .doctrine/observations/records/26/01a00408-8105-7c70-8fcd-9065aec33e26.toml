detail = "Drafting SL-251's own design, I needed the wire keys for a section declaration (subject/body) and the run's declare envelope. The turn envelope's worked example shows an inquiry declaration only, so I read src/design_run/submission.rs:563 (Declaration::WIRE_KEYS) to confirm 'body' is the section key. This is exactly the cost SL-251 exists to remove — one payload-shape source read, inside the design run for the slice that fixes it. Second-order: DEC-228's pin as recorded ('the worked example deserialises as a valid ApplyRequest') is not achievable as written, because the example carries the placeholder <n> for known_revision and is a template rather than JSON; sec-8 now specifies a substitution before parsing."

