detail = """The PHASE-13 worker prompt (T0c) instructed: "declare `sec-11` **first**, then `sec-2`" for `materialise_emits_document_order_not_id_order`. That fixture is inert: `SectionGroup` is id-ordered and "sec-11" < "sec-2" lexicographically ('1' < '2'), so declaring sec-11 first makes seq order and id order COINCIDE and the test passes against the exact defect EX-6 exists to close. The plan's own VA-3 says the opposite and is correct: "ids whose lexical order is not their seq order, e.g. declaring `sec-2` before `sec-11`". Cost: a re-derivation of the lexical ordering plus a check of the sketch's separate sec-1/sec-11 collision fixture (where "sec-11 declared first" IS right, for a different reason - prefix matching), to establish which instruction governed. Authority order (plan > sketch > prompt) resolved it, but the prompt had confidently inverted the one detail the anti-theatre criterion exists to pin. Suggests distilled worker prompts should quote a VA verbatim rather than paraphrase its fixture."""

