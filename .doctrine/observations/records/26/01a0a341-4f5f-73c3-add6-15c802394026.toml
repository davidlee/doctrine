summary = "phase-plan: `slice notes <ID>` refuses instead of showing"
detail = "Invoked `doctrine slice notes SL-259` expecting to READ the slice's notes.md (the boot digest lists `notes` under the slice spine beside `design`/`plan`/`phases`). It is a create-only verb and answered 'Error: Refusing to overwrite existing .doctrine/slice/259/notes.md'. The refusal is correct for a creator but reads as a failure to a reader, and costs a round trip plus a fallback to cat. A no-op-with-path or a --show would make the read intent free."

