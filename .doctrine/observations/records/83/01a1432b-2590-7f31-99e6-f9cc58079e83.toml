detail = "The jail's git is a guarded wrapper (/nix/store/...-git-guarded). It refuses 'git checkout -f main' and 'git reset --hard' inside test temp repos (slice close-integration, ledger trunk_integration, dispatch ingest, e2e_dispatch_candidate): 26 failures, 'would overwrite local modifications'. Gate unusable as a green signal; cargo test stops at first failing binary, so I had to rerun with --no-fail-fast to see the rest. Fixtures should set GIT_GUARD=off in their own Command env (they own the temp repo), or the guard should exempt repos outside the workspace."

