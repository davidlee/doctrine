summary = "/reconcile: the audit brief named a verb whose enum does not admit the state it asked for"
detail = "RV-366's reconciliation brief instructed 'doctrine knowledge settle DEC-252 — proposed to accepted'. knowledge settle's <STATE> enum is answered|validated|invalidated|waived (resolving states); a decision's proposed->accepted is knowledge status, and the facet fields need knowledge edit decision. Cost: three --help round-trips at reconcile to discover the brief's named verb was wrong. The brief's other named verb (slice selector add) was correct and the skill told me to confirm its flags, which I did; the knowledge verb carried no such hedge. Generalises: an audit writing a brief names verbs from recall, and /reconcile is where that recall is spent."

