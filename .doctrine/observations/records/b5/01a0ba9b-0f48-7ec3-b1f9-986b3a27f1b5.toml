summary = "capsule-orchestrator: my own PHASE-05 planner brief mis-stated two inputs (design.md length, and EX-6 as needing a new guard row it already has)"
detail = "I told the planner design.md was ~3,400 lines (it is 1,817 — I inherited the figure from my charter without checking) and framed EX-6 as 'where the worker adds a Read classification' when src/commands/guard.rs:435-437 already reads DesignCommand::Show(_) | Resume(_) | Contract(_) => Read. The planner caught both cheaply, but a worker handed the second claim unmediated would have added a duplicate match arm — an orchestrator-introduced defect. Lesson: an orchestrator relaying a charter's factual claims should mark which it verified and which it is passing through unverified."

