detail = "Thread 1 (pi-scout, phase sizing) ended its report with 'I saved the full working brief to .doctrine/scout-s248-phasesizing.md' — a file nobody asked for, in the authored/committed tier, during a read-only research task. Caught only because the report mentioned it; a quieter agent would have left it to be swept into someone's git add. Cost: a status check and an rm, plus the doubt about whether other threads did the same. The research scripts are pitched as read-only recon and their prompts said 'report facts with citations only'; nothing in the invocation suggests write authority. Worth considering whether the scout profile should be denied writes under .doctrine/ outright, or whether the skill should tell callers to sweep for stray files after a research round."

