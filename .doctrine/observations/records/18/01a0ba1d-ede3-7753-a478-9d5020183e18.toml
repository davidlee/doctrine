summary = "/phase-plan: review status needs a reference with no way to list reviews for a slice"
detail = "Reported by the SL-246 PHASE-03 capsule-phase-planner. 'doctrine review status' requires a positional REFERENCE and there is no listing verb scoped to a slice. The planner needed the review that raised finding F-23 (which PHASE-03 EX-3 exists to fix) and had to fall back to grepping .doctrine/review/*/ for the literal string F-23 to discover it was RV-370. A finding id cited in an authored plan is not resolvable to its owning review through the CLI."

