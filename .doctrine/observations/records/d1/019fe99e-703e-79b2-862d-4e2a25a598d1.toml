summary = "execute/T9: a pinned test-binary path turned a mutation battery's leftovers into a fake load failure"
detail = "SL-248 PHASE-09 T9. $BIN was resolved once from cargo test --no-run and reused across the battery. After the last mutant was restored the source was newer than that binary, and doctrine check gate builds/tests its own artefact — so the gate was green at 296 while five hand-run 'load tally' rounds were red, identically, with the mutant's own panic. Diagnosed only by comparing binary and source mtimes. Cost: one full tally round plus a diagnosis round."

