summary = "/design: `slice notes <n>` reads as a getter but is a create verb"
detail = "Wanted to read SL-249's notes.md while resuming its design run; ran `doctrine slice notes 249` expecting a read and got 'Refusing to overwrite existing .doctrine/slice/249/notes.md'. The SPINE (new/list/show/paths) does not cover notes, so the reader has no obvious read verb and the bare-noun form is the natural guess. One wasted round-trip plus the ambiguity about whether notes are readable via the CLI at all."

