summary = "/audit: review verbs refuse every ordinary worktree, contradicting AGENTS.md's 'audit/close on a worktree' ritual"
detail = "SL-251 close. AGENTS.md instructs auditing/closing a feature on a worktree, and the user asked for exactly that. But resolve_review_root (src/review.rs:2358) bails on IMP-024 for any tree where classify_worktree_role == 'fork', and classify_worktree_role (src/worktree/shared.rs:77) returns 'fork' for EVERY linked worktree whose branch is not dispatch/<digits>. So a plain 'git worktree add -b close/SL-251' tree cannot run prime/status/raise/dispose — the whole audit ledger. ISS-275 already widened the guard once to spare dispatch coordination trees; the solo /worktree isolation branch that AGENTS.md prescribes for audit/close was not included. There is no env escape hatch. Cost: a full merge + build + conformance run in the worktree, then the audit has to relocate to the primary tree on edge, plus one premature RV entity created and deleted (review new does NOT route through the guard, so it succeeded where every later verb refuses — that inconsistency is its own defect)."

