summary = "/slice: slice show omits outbound fulfils edges that inspect renders"
detail = "After 'doctrine link SL-238 fulfils IMP-099' and 'fulfils IDE-019', 'doctrine slice show SL-238' printed only 'governed_by: ADR-017' and 'references(implements): SPEC-015, PRD-011' — no fulfils line. 'doctrine inspect SL-238' shows all three axes, and slice-238.toml carries both [[relation]] fulfils rows. Cost: a re-read of the raw TOML plus an inspect call to confirm the link verb had not silently failed, against a boot rule that says read entities via show, not raw files. If show is the mandated read path it must not drop an authored outbound axis."

