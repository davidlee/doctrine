summary = "design: apply→materialise round-trip grows a blank line per section edit"
detail = "SL-287 /design reviewing. Extracting a section body from design.md (text between doctrine:section markers, which includes the trailing blank separator) and declaring it back via design apply makes materialise emit an extra blank line before the next marker each time. Needed a second apply with trailing blanks stripped. Either materialise should normalise trailing whitespace in section bodies, or design show should expose the canonical body for round-tripping."

