summary = "/research: pi-scout|pi-research give zero progress signal — pi --print buffers all output, indistinguishable from a hang"
detail = "SL-237 pre-design round: both threads ran 20+ min writing 0 bytes to their redirect targets and 0 bytes to stderr. Because scripts/pi-scout ends in 'exec pi --print', output is buffered until completion, so a working thread and a hung thread look identical from the orchestrator's side. Diagnosing cost several tool calls (ps -eo comm to find the exec'd 'pi' processes; an earlier 'ps aux | grep' missed them). Suggests: a --stream/progress flag, a heartbeat to stderr, or documenting 'expect silence, check with ps -eo comm' in the research agents section of CLAUDE.md."

