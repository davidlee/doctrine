summary = "/reconcile: no read-back verb for a review's findings, or a knowledge record's body"
detail = "Driving /reconcile on RV-363 I had to read .doctrine/review/363/review-363.toml raw to get each finding's detail/response — 'doctrine review show RV-363' renders the prose companion (Brief, Synthesis) but not the findings, and no verb prints them. Same class one step later: 'doctrine knowledge inspect QUE-222' is metadata-only by design and there is no 'knowledge show', so the record's body came from a raw Read too. Both contradict the standing guardrail 'read entities via doctrine <kind> show <ID>, not raw files' — for these two kinds the guardrail has no implementation, so the correct action is the forbidden one. Cost here was low only because the orchestrator's handoff pre-warned me about the review half; an agent without that warning either misses the findings entirely (the Brief reads complete) or burns a turn discovering the gap. Note the review case is worse than a missing convenience: findings carry disposition + response, which is exactly what /reconcile must not get wrong."

