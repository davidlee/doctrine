summary = "In /backlog + RFC authoring: doctrine check quick cannot separate my delta from pre-existing findings"
detail = "After authoring RFC-031 and four backlog items, `doctrine check quick` reported 51 findings — dominated by unresolved-citation warnings from test fixtures (SL-998/999/1000/1001, RFC-035, QUE-005) plus stale worktree-hook warnings. There is no baseline or 'findings in changed files' view, so the only way to establish that my change introduced nothing was to pipe the whole run through grep for my entity ids. For an agent making an authored-only change this is the one verification step that should be cheap and isn't; a --changed/--since or file-scoped mode would remove it."

