summary = "/execute PHASE-04: staged module cannot compile until the last test lands, so the sheet's per-task red/green sequencing is unavailable"
detail = 'SL-248 PHASE-04 sheet sequences T2-T10 as red/green/refactor cycles over crates/doctrine-control/src/backend.rs. The module carries the house `#![cfg_attr(not(test), expect(dead_code, ...))]` header, which cfg(test) strips; with `unused = "deny"` every item without a test reader is a hard error. After the task that landed the type vocabulary, `cargo test -p doctrine-control` produced 69 errors, none of them signal. There is no partial-green state between the first task and the last: ~700 lines had to be written before the first successful compile, and then all 30 tests passed at once. Cost: the intermediate compile cycles were pure waste (three runs, ~0 information), and the red phase had to be reconstructed afterwards as a seven-mutation battery. A phase sheet that sequences tasks as red/green cycles over a single staged module is describing a workflow the lint configuration forbids; the planner could instead prescribe write-all-then-mutate, which is what actually happened.'

