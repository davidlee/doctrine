summary = "/design: agent_declaration's act is externally tagged, and nothing says so"
detail = """Submitting the blocking set, I wrote {"act":{"act":"blocking-set-declared","blocking":[...]}} by analogy with DelegationAct (internally tagged, tag="act") and CheckpointActDeclaration (act: ActKind). AgentAct is externally tagged, so the correct spelling is {"act":{"blocking-set-declared":{"blocking":[...]}}}. Cost: one refused apply plus a source read of src/design_run/attestation.rs:664-683. Three sibling act types, three different taggings, no fetchable contract — this is SL-251's own thesis biting during SL-251's design run."""

