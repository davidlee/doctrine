summary = "design: listing .doctrine/state/ to find design run storage dumps ~220 mem-surface-seen-*.txt lines"
detail = "Locating the design run's state file cost a bare ls of .doctrine/state/, which returned about 220 mem-surface-seen-<uuid>.txt entries ahead of the handful of real subdirectories. The signal (state/slice/253/design.toml) was two lines; the noise was the rest of a screen. Per-session memory-surface receipts are runtime bookkeeping and could live in a subdirectory, or the design run could name its own storage path in the resume envelope so no directory listing is needed at all."

