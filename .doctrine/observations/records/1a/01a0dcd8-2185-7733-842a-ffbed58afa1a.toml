summary = "[design; SL-268] design materialise orders sections lexically: sec-10 renders before sec-2"
detail = "DesignId derives Ord over its string (src/design_run/ids.rs:157), so a design with more than nine sections materialises sec-1, sec-10, sec-11, sec-12, sec-2… The contract exposes no order key and no section removal, so the workaround was to reassign bodies to ids so lexical order reads correctly, remapping every cross-reference by hand. Fix: numeric ordering on the sec- suffix, or an explicit order."

