summary = "phase-plan: a sheet decision invented a compat requirement the authored plan never asked for, and it shipped code"
detail = """SL-244 PHASE-04. The runtime phase sheet's D3 required the DEC-086 intent journal to stay readable by a LATER binary ('the journal is precisely what a crash from the previous binary is resumed from'), and T6 bought that with a serde(alias = "checkpoint") plus a unit test over literal legacy TOML. Nothing authored asks for it: plan.toml PHASE-04 EX-4 and VA-1 are both same-binary claims (resuming the SAME submission), and the journal is per-submission runtime state under .doctrine/state/ that complete_journal clears. The window the alias protected is 'a submission crashes mid-mint AND the binary is upgraded before that same submission is re-run' — a guarantee the project makes nowhere else. Cost: shipped code plus a test carried for two commits, a handover caveat devoted to explaining its evidence, and the user had to ask 'where does the plan specify this?' to surface it. Generalises: a /phase-plan sheet is disposable runtime state and outranks nothing, but its decisions read as settled by the time /execute picks them up — a D-row asserting a requirement should cite the authored criterion it descends from, or mark itself as the planner's own addition."""

