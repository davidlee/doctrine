kind = "friction"
summary = "/plan: the plan.toml scaffold's VT-mandate example is invalid TOML"
detail = """
The template written by `doctrine slice plan` (and the same example in plugins/doctrine/skills/plan/SKILL.md step 4) shows the structured VT mandate as a multi-line inline table:
  { id = "VT-1",
    expects = "...",
    test_file = "src/plan.rs", ... }
TOML 1.0 forbids newlines inside an inline table, so an author who copies the shape verbatim gets a parse error. Cost one full authoring round-trip of plan.toml (rewrite every verification row onto one line). Every real plan.toml in the corpus uses the single-line form, so the template is the only place the wrong shape appears."""

