detail = "SL-272 PHASE-01. /execute's solo recipe says land the fork (git merge --no-ff) then flip the phase completed; completion captures code_end_oid = HEAD, which is now the merge commit, and the non-merge guard skips the capture with a warning. Needed manual 'slice record-delta --start <base> --end <last code commit>'. Either flip completed inside the fork before land, or have the capture resolve a merge HEAD to its fork parent."

