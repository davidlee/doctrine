detail = "SL-241 PHASE-05 T7. using-doctrine.md § Relating entities states 'Storage is outbound-only — you link from the source side and reciprocity is derived (ADR-004); inspect / show render both directions.' For knowledge records the second clause is false: after 'doctrine link EVD-006 supports QUE-200', 'knowledge show QUE-200' and 'knowledge inspect QUE-200' render nothing, and --json's relationships map carries outbound only. EVD-006's own view renders 'supports: [QUE-200]' correctly. Verified against pre-existing data too: 'knowledge show DEC-048' does not render 'supported_by: EVD-002'. Cost: a detour to establish how VA-5 ('show QUE-200 renders the linked EVD records in BOTH tiers') could be satisfied at all. Resolved by populating each question's own [evidence] supports/contradicts citation block plus a prose section — but that was discovered empirically, against a reference doc that asserted the opposite."

