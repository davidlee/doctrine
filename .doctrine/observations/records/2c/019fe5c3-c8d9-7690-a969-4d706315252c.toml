detail = "SL-248 PHASE-10 T4. The worker isolated the row-10 assertions needing the decoy fds present (closing F-16/F-18) and tallied 5/5 through doctrine check gate. The mirror leg — a_descriptor_leaking_backend_fails_row_ten's discriminating 'leaks nothing' path — still forked from the shared multi-threaded test process via payload_output_leaking, and inherited a concurrent test fixture's inheritable decoys. Red on the orchestrator's first gate run. Cost: a full extra worker firing. Root cause is a briefing defect, not worker error: the brief asked for a tally where the hazard is shared process state, for which the only evidence is structural isolation. LOOP.md amended at source with two rules — isolate rather than tally for process-wide state, and the orchestrator's verification run convicts, not the worker's self-tally."

