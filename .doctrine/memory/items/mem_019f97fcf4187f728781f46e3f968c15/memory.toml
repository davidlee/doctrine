title = "dispatch sync --integrate projects .doctrine/** too — coord-authored corrections DO reach trunk"
summary = "Integrate is NOT code-only: it carries the candidate's `.doctrine/**` (FF+CAS, clobber-guarded by --allow-corpus-clobber). So selector/plan corrections authored on review/NNN propagate to trunk — redoing them on edge is redundant, and reconcile edits made on edge diverge from what integrate lands."
