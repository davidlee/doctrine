schema_version = 1
memory_type = "pattern"
status = "active"
title = "worker_commit false-reds on a stale PATH doctrine binary when a phase depends on an earlier unpromoted phase's binary-level change — land-not-rewrite"
summary = "The worker_commit gate belt runs `doctrine doctor` via PATH ~/.cargo/bin/doctrine, which lags in-flight dispatch branches; when a later phase's authored content depends on an earlier phase's not-yet-promoted binary-level change, the gate false-reds. Land-not-rewrite with fresh-binary verification is the remedy."
created = "2026-07-06"
updated = "2026-07-06"

