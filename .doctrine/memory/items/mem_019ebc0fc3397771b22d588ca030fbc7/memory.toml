schema_version = 1
memory_type = "pattern"
status = "active"
title = "just gate runs a named-package test gate; new members are not auto-gated"
summary = "test-all is 'cargo test -p doctrine -p cordage', NOT --workspace (RV-353 F-4 / ISS-342): doctrine-control's live-bwrap rows are host-capability-dependent and redded gate+release off-jail. default-members is ['.']. Reach the capsule crate with just capsule-check / capsule-verify. A new workspace member must be added to test-all by name."
created = "2026-06-12"
updated = "2026-08-11"

