title = "A VT's test_file is a plan-time guess; retarget it at phase-plan rather than let it choose the architecture"
summary = "A VT mandate names where behaviour was expected to be observable, authored before the code exists. At phase-plan time it is amendable — ids and keywords unchanged — and deferring to it lets a grep decide module layout."
