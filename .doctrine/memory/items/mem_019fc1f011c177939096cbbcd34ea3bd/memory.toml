title = "shellcheck source=/dev/null disables cross-file checks and invents SC2034/SC2153"
summary = "Stubbing a shellcheck source directive to /dev/null suppresses cross-file resolution, so variables published by the sourced file read as unused/misspelled — point the directive at the real path instead of adding disable directives."
