title = "governed_by targets are governance kinds only — a spec-scoped item takes `related`"
summary = '`governed_by` targets are restricted to ADR/POL/STD, so a backlog item or slice scoped by a PRD/SPEC takes `related` (as IMP-309 does with SPEC-026). descends_from is SPEC-only and shapes is knowledge-record-only, so no label means "issue → its governing spec".'
