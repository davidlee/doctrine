title = "cargo package --list cannot detect a missing embed; the verify build is the only oracle"
summary = "Cargo.toml [package] include is an allow-list, so --list reports an omitted embed root as agreement. Compile the packaged crate (cargo package's verify step) to catch a dropped include_str!/RustEmbed root — it fails there instead of inside cargo publish."
created = "2026-09-26"
updated = "2026-09-26"

