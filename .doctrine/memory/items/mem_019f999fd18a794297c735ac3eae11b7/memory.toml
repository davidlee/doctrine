title = "Spec draft→active is a hand-edit — no `spec status` verb exists, though `spec req status` does for requirements"
summary = "A spec's status is advanced by editing `status =` in its TOML — `spec edit` covers descent/parent scalars only and there is no `spec status`. Requirements are the opposite: `spec req status` transitions them any→any. Generalising from either axis to the other guesses wrong."
