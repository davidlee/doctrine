title = "Both merge sides bumping the same assert counter to the same value auto-merges to a wrong total"
summary = "Two branches each add one entity and bump `assert_eq!(visible.len(), N)` from 52 to 53; git sees identical text and auto-merges clean — but the merged tree needs base+Δ_ours+Δ_theirs (54). Verify census/count assertions empirically after any merge, never trust the clean auto-merge."
