title = "pi extension handler rejections are caught by the host; unhandled stream 'error' events are not"
summary = "pi's ExtensionRunner wraps every event handler in try/catch (emitError), so a thrown/rejected handler is fail-open; a stream 'error' event it does not catch can still kill the process."
