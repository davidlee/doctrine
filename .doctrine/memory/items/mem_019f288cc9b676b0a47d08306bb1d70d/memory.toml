title = "Jail RO-bind of a mutable binary goes stale after in-session reinstall; bind the immutable store path instead"
summary = "bwrap RO-binds a specific inode at jail creation; cargo install atomic-renames over the path so the bind goes stale and hooks/MCP hard-break till reload. Bind the immutable nix store output over the cargo path instead."
