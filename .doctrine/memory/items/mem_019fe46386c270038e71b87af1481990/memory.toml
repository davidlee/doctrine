title = "Jail harness shares session 0 with pid 1, so session-scoped kills can destroy the sandbox"
summary = "Measured in the doctrine bubblewrap jail: bwrap is pid 1 in session 0 and the agent process is pid 2 also in session 0, while a test suite runs in its own session — so a sweep that refuses only its own session can SIGKILL the sandbox and the agent with no error."
