title = "The memory and partner plugins mount doctrine's skill masters by tracked symlink — one master file, three paths"
summary = "plugins/doctrine-memory/skills/{record-memory,retrieve-memory} and plugins/doctrine-partner/skills/{pair,walkthrough} are tracked symlinks (mode 120000) into plugins/doctrine/skills/. The only skill master content is plugins/doctrine/skills/**; editing either path writes the same inode, and git reports the doctrineside path."
