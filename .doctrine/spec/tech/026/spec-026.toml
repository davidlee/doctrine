responsibilities = [
  "Own the publication manifest — the runtime-parsed declaration of which framework-owned assets are public and, per asset, its stable logical address, backing source, content kind, title or summary, licence, and customization status. A publication policy independent of install's projection policy; the two are separate surfaces that may share one backing source (embedded by default, not universal).",
  "Map a stable logical-address namespace onto backing storage via a resolver over source adapters — each logical address resolves to its backing source (embedded by default; runtime-loaded via its adapter) so addressing survives a source-root reorganisation and never leaks storage layout.",
  "Serve the read-only library surface (`library list | tree | show`) over the resolver — list and tree read manifest metadata; show streams the resolved asset's raw bytes to stdout through a neutral byte-level asset-read seam shared with projection. No verb writes, installs, or materializes; read-only is structural over every protected root.",
  "Carry each published asset's licence as an explicit declared field validated against a fixed allowed policy at validate/build time (rule-based classification assists authoring only), so no asset publishes with an unestablished licence and every licence is auditable.",
  "Generalize entity-corpus search into a provider-federation model — a search-provider interface and a federation coordinator that dispatches one fixed-common-argument query (query text, optional provider selection, per-provider result limit) to every registered corpus provider (entities including RFCs, memory, library, and others).",
  "Assemble federated results grouped by corpus, preserving each provider's native trust/severity/staleness semantics and refusing cross-provider score comparison; each group carries a typed terminal status and the machine output is one common envelope of typed per-corpus result groups.",
  "Bound and isolate federation — providers run concurrently under a federation-wide deadline with each provider's errors and panics isolated, degrading to a typed status without stalling the search and bounding total search time by the federation deadline — and preserve every corpus's native query surface behind its native command (`memory find`, entity search).",
]

