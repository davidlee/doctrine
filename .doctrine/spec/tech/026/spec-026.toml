responsibilities = [
  "Own the publication manifest — the runtime-parsed, embedded declaration of which framework-owned assets are public and, per asset, its stable logical address, backing source, content kind, title or summary, licence, and customization status. A publication policy separate from install's projection policy: one embed, two independent manifests.",
  "Map a stable logical-address namespace onto physical storage via a resolver — each logical address resolves to its backing source (an embedded asset key or a runtime-loaded path) so addressing survives a source-root reorganisation and never leaks embed layout.",
  "Serve the read-only library surface (`library list | tree | show`) over the resolver — list and tree read manifest metadata; show streams the resolved asset's raw bytes to stdout through a byte-level asset-read seam. No verb writes, installs, or materializes.",
  "Derive each published asset's licence from a crisp, manifest-encoded classification rule (copyable authoring material vs owned process/engine/registry content), asserted at validate/build time so no asset publishes unclassified and the rule is auditable.",
  "Generalize entity-corpus search into a provider-federation model — a search-provider interface and a federation coordinator that dispatches one common-argument query to every registered corpus provider (entities, memory, library, and others).",
  "Assemble federated results grouped by corpus, preserving each provider's native trust/severity/staleness semantics and refusing cross-provider score comparison; machine output is one common envelope with typed per-corpus result groups.",
  "Preserve every corpus's native query surface: providers expose only common discovery arguments to the federated entry point while their specialized query languages stay behind their native commands (`memory find`, entity search).",
]

