responsibilities = [
  "Own the versioned observation wire model: a minimal UUID-addressed envelope, typed kind payloads, independently versioned facets with field origins, and typed correction controls.",
  "Persist every observation as one immutable TOML file partitioned by kind and UTC date, with atomic create-new, caller-intent replay, collision refusal, and no Git side effects.",
  "Load the corpus tolerantly and derive deterministic active and historical projections through append-only supersession and retraction controls, leaving invalid control components diagnostic and inert.",
  "Provide exact identity lookup, structured filtering, lexical search, stable ordering, and pagination without embedding aggregation or reporting policy.",
  "Expose one shared observation service through trusted CLI capture/read/correction adapters and a narrower MCP capture adapter for confined workers.",
  "Apply allowlisted best-effort enrichment with explicit-over-automatic precedence, omission for unknown values, and strict refusal of invalid explicit data.",
  "Keep wire validation, resolution, and querying pure; confine disk, clock, UUID generation, environment discovery, terminal rendering, and MCP translation to thin imperative seams.",
]

