tags = ["dispatch", "worktree", "orchestrator", "funnel", "cadence", "confinement", "spawn", "integration-sync", "gotchas"]
responsibilities = [
  "Carry the per-batch funnel cadence as a fixed ordered contract — capture `B` pre-spawn, then precondition → delta-check → R-5 `.doctrine/`/`.claude/` belt → import (non-committing) → verify → branch-point guard → one coordination commit → record — with report-and-halt on any breach and knowledge trailing only the confirmed code commit (ADR-006 D7). The verbs themselves are SPEC-012's; this owns their ordering and the halt discipline.",
  "Spawn every worker down ONE confined path, with no arm to route to (SL-254, DEC-208/DEC-213): `scripts/spawn-confined.sh <harness>` probes the jail (Linux `bwrap`, macOS `worktree jail-prefix`) and refuses by name before minting anything, forks orchestrator-side and unbound via `worktree fork --base B --branch --dir --worker`, then execs the harness under `timeout <backstop> <jail prefix>` with the fork dir rw-bound, everything else ro-bound, and `DOCTRINE_WORKER=1` set inside the namespace. There is NO unconfined fallback and NO degraded-enforcement rung — an unresolvable jail aborts the spawn. Harness difference is confined to the exec line, the config dir, and the completion signal.",
  "Govern the concurrency decision — parallel *execution* of file-disjoint phases is first-class, parallel *landing* is not: v1 lands one worker per base under the stationary-head precondition, and serial-dependent phases self-base by advancing coordination HEAD to phase N's integrated tip before spawning N+1 (SL-056 §7c, SL-064 §7c).",
  "Own coordination-tree placement and lifecycle: an always-on `dispatch/<slice>` worktree provisioned per run via `worktree coordinate`, created *inside* the project root (the jail cwd-revert hazard), with Bash cwd parked there for the whole drive loop so `B`-capture and every funnel verb run against coordination HEAD; concurrent same-slice dispatch refused at creation; worktree-life < branch-life (ADR-012 D1, SL-064 §2, ISS-029). Write authority is the orchestrator PROCESS not carrying `DOCTRINE_WORKER` — no tree carries a marker (SL-254, DEC-207), and the worker's base is pinned explicitly by `fork --base B`, never inherited from placement.",
  "State enforcement altitude as ONE uniform, fail-closed contract reached by every harness alike (SL-254 replaces the former per-harness split; ADR-011 D2, its D3/D5/D6 amended): explicit base (`fork --base B`), kernel-level confinement (bwrap on Linux / `sandbox-exec` on macOS) with the fork's worktree as the sole write floor, worker identity carried ONLY by the `DOCTRINE_WORKER` env var set by that same confining argv (DEC-207 — no disk marker, no stamping hook, no `verify-worker`), an orchestrator-owned pre-spawn base-clean assertion, and a named refusal instead of a lesser rung when the jail cannot be established (DEC-208). There is exactly ONE altitude: a main-thread orchestrator with direct coordination `.git` write authority driving confined subprocess workers — Mode B — the confined-orchestrator path — is retired as a shipped entry point (DEC-217), though its mediated-write tools (`import` → `conclude` → `reap`, routing by declared args alone) are retained unchanged as machinery, and REQ-335's tier itself stays `pending` as a forward contract rather than being retired (SL-254 design §6, OQ-2). One residual: `worker_commit`'s retirement (DEC-204) left the CONFIGURABLE tail of `worker_forbidden_writes` with no production reader — the import belt enforces only its two hard-coded floors (`.doctrine/**`, `.claude/**`) — carried to SL-255 as IDE-051.",
  "Drive the two-stage, audit-gated integration projection: stage-1 `dispatch sync --prepare-review` materialises `review/<slice>` + `phase/<slice>-NN` and a CAS journal committed before any ref mutation (no trunk write); audit runs from the parent/root against the prepared refs; stage-2 `dispatch sync --integrate` is opt-in, fast-forward-only, expected-tip-CAS, and reports — never auto-resolves — a moved/non-ff target (ADR-012 D4/D5, SL-064 §4).",
  "Encode the load-bearing operational gotchas as durable constraints the orchestrator must honour: read git through failure-tolerant idioms under output-rewriting proxies (rtk) — printed-output checks or `rtk proxy`, never a chained exit code; substitute the checkout-import idiom when `git apply` patches corrupt or stat-proxy; never widen a delta (`git add -A`/`commit -a` forbidden); re-anchor onto a moved HEAD only on a per-path byte-identical disjointness proof; the combined-tree project verify is the real gate; record durable memory on trunk, never inside a fork branch.",
]

