  "Establish a minimal, justified base of Doctrine's working files inside a project, materializing further surfaces on demand — a home to operate from without projecting material no one services.",
  "Keep the projected footprint minimal — only files with a stated project-level reason occupy a stable path; standing governance and volatile orientation stay physically distinct surfaces.",
  "Locate the project's root reliably from anywhere inside it, so files land in the right place without the operator stating where.",
  "Show the operator exactly what will change before anything is written, so provisioning is reviewable rather than blind.",
  "Preserve operator-owned edits across repeated runs — provisioning adds what is missing and never overwrites what already exists.",
  "Keep the project's ignore boundary correct so Doctrine's disposable and private files stay out of version control.",
