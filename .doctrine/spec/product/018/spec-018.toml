responsibilities = [
  "Give raw occurrence signals a durable home before they become interpreted knowledge, actionable work, or an aggregate pattern.",
  "Make an observation cheap to record with stable identity and minimal required content, while admitting typed optional context without making classification a precondition.",
  "Let operators and agents inspect, filter, and search current and historical observations without collapsing repeated occurrences into one record.",
  "Preserve correction history through explicit supersession and retraction rather than destructive mutation.",
  "Keep observation collection separate from consumer-owned analysis, triage, aggregation, promotion, retention, and reporting state.",
  "Permit bounded capture from constrained execution environments without granting a general repository-write capability.",
]

