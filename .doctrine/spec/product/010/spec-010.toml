responsibilities = [
  "Give a durable, typed, citable home — below ADR weight and above disposable notes — to the seven record kinds: assumption (`ASM`), decision (`DEC`), question (`QUE`), constraint (`CON`), evidence (`EVD`), hypothesis (`HYP`), and concept (`CPT`).",
  "Model the family as one knowledge_record entity discriminated by a record_kind facet, never a fork of parallel per-kind schemas.",
  "Carry each kind through its own lifecycle vocabulary — truth lifecycles, not the work-intake lifecycle the backlog owns.",
  "Hold kind-specific facets and a minimal evidence support structure as typed, enumerated storage, never an untyped bag.",
  "Expose outbound relations from a record to backlog items, risks, slices, specs, ADRs, requirements, and drift records.",
  "Let a record spawn backlog work or relate to artefacts without itself becoming work — truth is not work.",
]
