[[change]]
action = "introduce"
primary = false
new_label = "FR-008"
member_of = "SPEC-021"
new_statement = "Dispatch funnel position is persisted per-phase as authoritative run-state, advancing through explicit transitions that include verification as an authoritative, evidence-carrying step faithful to REQ-287 ordering (spawned, worker-committed, imported, verified, concluded, reaped); the record names a single persistence home, a single-writer authority, and crash-safe idempotent recovery."

[[change]]
action = "introduce"
primary = true
new_label = "FR-009"
member_of = "SPEC-021"
new_statement = "Every funnel verb is legality-gated on funnel position: it refuses out-of-order execution and names the expected next verb (report-and-halt with prescription); conclude refuses after skipped or failed verification."

[[change]]
action = "introduce"
primary = false
new_label = "FR-010"
member_of = "SPEC-021"
new_statement = "dispatch next emits the single prescribed next action for the per-phase import-verify-conclude-reap sub-funnel from the current position; candidate/close/audit sourcing (REQ-317, OQ-4) is outside the oracle scope until a sibling revision settles it."

[[change]]
action = "introduce"
primary = false
new_label = "FR-011"
member_of = "SPEC-021"
new_statement = "One funnel state machine owns the shared transition semantics; each dispatch transport (main-thread, subprocess, confined-orchestrator) projects into that single authority, recording the same transitions whether committing directly or through mediation; per-transport altitude reconciles with REQ-291 and REQ-335."

[[change]]
action = "introduce"
primary = false
new_label = "FR-010"
member_of = "SPEC-022"
new_statement = "Every funnel git read is a first-class read verb over the object-db and ref primitives; no funnel read shells raw git. Existing seams are reused or relocated rather than reimplemented (e.g. is_linked_worktree for isolation detection); only genuinely absent reads are newly built."

[[change]]
action = "introduce"
primary = false
new_label = "FR-011"
member_of = "SPEC-022"
new_statement = "The funnel is working-tree-free and every coord-tree operation is bounded by a no-pathless-commit / safe-commit guard, so the ISS-234 reverse-diff cannot commit mass reversions; read verbs keep funnel reads from observing the reverse-diff, the guard closes the write side, and ISS-234 is absorbed only when both hold."
