new_statement = "The codex install leg wires doctrine's owned codex hook registry — a `SessionStart` emit hook and a `PreToolUse` memory-surface hook across codex's `Bash` and `apply_patch` matchers — with the per-hook `additionalContextLimit` and `timeout` on the handler (beside `command`, never on the matcher group), and judges an owned entry canonical only when those handler fields equal what doctrine emits, so a missing or stale limit is healed rather than left."

[[change]]
action = "introduce"
primary = false
new_label = "FR-011"
member_of = "SPEC-011"
new_statement = "`boot install` plans and installs the generated pi extensions — `index.ts`, `mcp.ts`, and `surface.ts` — through one descriptor core (four-way action, foreign-skip, regenerate-on-change) and reports each as its own `RefreshReport` leg; `surface.ts` is the neutral-wire adapter that maps pi's `read`/`edit`/`write` and `bash` tool results onto doctrine's neutral envelope, writes it to `memory surface --input neutral` on an async, bounded, fail-open child, and appends the returned block."
