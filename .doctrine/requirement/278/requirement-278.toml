schema = "doctrine.requirement"
version = 1

id = 278
slug = "define-a-reusable-valuefacet-with-a-single-finite-f64-magnitude-parsed-from-an-optional-value-toml"
title = "Capture value as an anchor-claim ledger row with a single finite f64 magnitude"
status = "active"
kind = "functional"

description = "The normative value-capture shape is the wire-level anchor-claim row (form = anchor, value payload {magnitude}: finite f64) in the comparison ledger (REV-024, RFC-020); integer or float authoring normalizes to finite f64, non-finite is rejected at the parse boundary. The [value] facet parse seam is retired as the value surface and survives transitionally only to serve resolution rung 5 and the migration census."
tags = []
acceptance_criteria = [
  "A value capture lands as an anchor-claim row (form = anchor) whose value payload carries magnitude as f64.",
  "A magnitude authored as a TOML integer or float normalizes to a finite f64.",
  "NaN, +Infinity, and -Infinity are rejected at the parse boundary, never carried inward.",
  "The claim-row shape is defined once on the comparison wire seam, not specialised per entity kind.",
  "The [value] facet parse survives transitionally, consumed only by the unmigrated-facet resolution rung and the migration census.",
]
