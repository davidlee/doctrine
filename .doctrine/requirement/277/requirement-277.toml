schema = "doctrine.requirement"
version = 1

id = 277
slug = "keep-the-estimate-schema-forward-compatible"
title = "Keep the estimate schema forward-compatible"
status = "active"
kind = "quality"

description = "The wire's lossless-over-absent-optionals posture (SL-222 E2) is the forward-compat mechanism: the v3 row extends with optional columns without version bumps, and rows authored before an extension remain valid (REV-026)."
tags = []
acceptance_criteria = [
  "Adding optional payload columns (as est_lower/est_upper were added) invalidates no previously-authored session rows.",
  "The parser preserves unknown/absent optional fields losslessly rather than rejecting the row.",
  "No inferred mode or distribution is persisted.",
]
