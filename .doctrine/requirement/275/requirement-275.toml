acceptance_criteria = [
  "No dispatch, execute, audit, or close predicate reads estimate-claim (or transitional facet) presence.",
  "A missing estimate cannot block, fatally warn, or refuse any workflow, and is never a validation error.",
  "Probe eligibility and retirement are elicitation policy under demote_agent_evidence, not workflow gating.",
  "The absence of a gating read is demonstrable structurally, not merely by a passing run.",
