schema = "doctrine.requirement"
version = 1

id = 359
slug = "declare-published-assets-in-a-manifest"
title = "Publication is deliberate and fully declared"
status = "pending"
kind = "functional"

description = "Publication is a deliberate act: a user or agent can see exactly which framework-owned assets are public and, per asset, its stable logical address, content kind, human title or summary, licence, and customization status. Nothing becomes public as a side effect of being embedded in the tool."
tags = []
acceptance_criteria = [
  "What is public is fully declared and inspectable, independent of what the tool happens to embed; an embedded-but-undeclared asset is not public.",
  "Every published asset carries all of: logical address, content kind, title or summary, licence, and customization status.",
  "A user can tell that an asset is published deliberately, not because the binary happens to carry its bytes.",
]
