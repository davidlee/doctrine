  "The next obligation is derived from persisted run state on every read, not stored and not taken from conversational recall.",
  "A run's stage and next obligation are readable without consulting the transcript.",
  "Open-ended inquiry, synthesis, drafting, and adversarial reasoning remain the agent's and are not prescribed as mechanical steps.",
