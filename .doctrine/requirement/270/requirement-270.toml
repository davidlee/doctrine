schema = "doctrine.requirement"
version = 1

id = 270
slug = "validate-a-present-estimate-as-a-hard-error-and-accept-absence"
title = "Validate a present estimate claim at capture and accept absence"
status = "active"
kind = "functional"

description = "A captured estimate anchor row is validated by the capture-time validation matrix as a hard refusal; absence of estimate claims validates everywhere. Optional means omittable, not malformed (REV-026)."
tags = []
acceptance_criteria = [
  "An estimate anchor row validates only when est_lower and est_upper are both present and finite with lower >= 0 and upper >= lower (estimate::validate).",
  "Missing est_lower, missing est_upper, negative lower, and upper < lower are each hard capture refusals.",
  "An item with no estimate claims passes validation on every surface.",
  "A malformed row is refused loudly at capture, never silently repaired.",
]
