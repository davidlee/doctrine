description = "The shipped entity-corpus search and the memory search are exposed as federation providers behind the common interface without losing their native query surfaces, and the entity-search refactor preserves its observable contract."
tags = []
acceptance_criteria = [
  "Entity search and memory search each appear as a provider in federated results.",
  "Their native commands (entity search `-k`, `memory find`) retain their full specialized query surfaces.",
  "The entity-search refactor preserves its observable contract — result ranking order, kind filtering, human and machine output schema, empty-query behaviour, and exit status; existing suites staying green is necessary but not sufficient, and gaps in that contract are covered before the refactor. The BM25 internals are free to change; the behaviour is not.",
]
