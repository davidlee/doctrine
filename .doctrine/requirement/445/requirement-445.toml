description = "Existing valid plans remain readable and retain their active meaning as the content model evolves; migrations are explicit and deterministic and impose no lineage ceremony on unchanged criteria."
tags = []
acceptance_criteria = [
  "A valid plan authored before criterion evolution support remains readable with its existing criteria governing in their declared order.",
  "An unchanged existing criterion requires no generated lineage record, replacement identity, or manual re-authoring.",
  "A required migration produces the same authored result from the same input and can be reviewed before it governs execution.",
  "A failed migration leaves the prior authored plan intact and reports the blocking incompatibility.",
]
