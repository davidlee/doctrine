acceptance_criteria = [
  "Mandate matching reads raw file content and performs no comment or string-literal stripping.",
  "No check assumes a host build tool, test runner, or language-specific file layout.",
  "A stronger shape assertion is expressed as an author-supplied pattern rather than as built-in language knowledge.",
  "The accepted consequence — a keyword satisfied from inside a comment — is documented rather than repaired by language-aware parsing.",
]
