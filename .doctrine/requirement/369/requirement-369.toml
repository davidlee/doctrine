schema = "doctrine.requirement"
version = 1

id = 369
slug = "publication-is-independent-of-storage-mechanism"
title = "Publication is independent of storage"
status = "pending"
kind = "quality"

description = "Whether an asset is public, and the address by which it is read, are independent of how or where the asset is stored or delivered; a storage or delivery change never changes its publication or its address."
tags = []
acceptance_criteria = [
  "The same logical address reads the same asset regardless of how that asset is stored or delivered.",
  "Changing an asset's storage or delivery does not change whether, or how, it is published.",
]
