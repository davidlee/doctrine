id = 273
slug = "render-the-estimate-in-display-without-classifying-spread"
title = "Render the resolved estimate in display without classifying spread"
status = "active"
kind = "functional"

description = "Display renders the claim-resolved estimate as a pure function: resolved range + tier + attribution + unit when evidence exists, omitted when absent, scoring-inert annotation for record kinds, classifying nothing (REV-026)."
tags = []
acceptance_criteria = [
  "The estimate line renders the resolved range, claim tier, attribution, and unit from the comparison pipeline; absent evidence omits the line.",
  "Rater-stated range confidence renders as claim content, distinct from any derived certainty.",
  "Normal display never classifies spread as wide, very wide, risky, or split-worthy.",
]
