title = "Route each registered harness with a `skills` route directly from the embedded catalog: materialise `.doctrine/skills/<id>` and reconcile relative links at its declared link site (`.claude/skills` for Claude; `.agents/skills` for codex, pi and universal). Refuse an explicit `--agent` absent from the registry before any write, suggesting `universal` for another harness that reads `.agents/skills`. No npx delegation."
