description = "Once authored, phase and criterion identifiers remain immutable and are never reused or renumbered; additions preserve existing identity and declared order."
tags = []
acceptance_criteria = [
  "Editing or extending a plan never changes or reuses an existing phase or criterion identifier.",
  "New phases and criteria append new identities without renumbering existing records or changing their established relative order.",
  "A criterion reference outside its owning phase is phase-qualified or otherwise unambiguous.",
]
