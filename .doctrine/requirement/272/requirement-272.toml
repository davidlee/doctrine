description = "Transitional until the SL-222 deletion census: a valid [estimate] facet survives parse -> hydrate -> catalog projection unchanged in its normalized form. The durable successor obligation is wire round-trip losslessness of estimate anchor rows (SL-222 design 8.1 goldens); this requirement retires when the facet read paths delete (REV-026 disposition: retire at deletion)."
