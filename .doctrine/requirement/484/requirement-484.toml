slug = "boot-install-registers-the-doctrine-mcp-server-by-a-narrow-path-edit-preserving-write-of-mcp"
title = "`boot install` registers the doctrine MCP server by a narrow-path, edit-preserving write of `[mcp_servers.doctrine]` into the project `.codex/config.toml` — a portable `sh -c` entry carrying no host absolute path — owning only a shape doctrine has emitted (the wrapper line in the emitted-forms set, `env_vars` absent or exactly the emitted whitelist), refreshing a stale owned entry, preserving foreign keys and tables, and printing the TOML snippet rather than clobbering a file or entry it cannot own; the report states what was written, never that the harness has activated it."
status = "pending"
kind = "functional"

