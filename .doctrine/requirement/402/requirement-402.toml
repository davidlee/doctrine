title = "Preserve merge-safe identity and idempotent retry"
status = "pending"
kind = "quality"
description = "Observation identity and persistence remain merge-safe under concurrent capture and idempotent under a caller-stable retry."

# description — the requirement statement (structured, queryable; `show` renders
