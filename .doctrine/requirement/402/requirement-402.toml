tags = ["observation", "identity", "concurrency", "idempotency"]
acceptance_criteria = [
  "Concurrent distinct observations do not contend on a shared record or overwrite one another.",
  "A retry with the same identity and caller intent returns the existing observation without rewriting first-write facts.",
  "Different caller intent under an existing identity is refused, and different identities are never content-deduplicated.",
]
