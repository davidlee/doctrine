schema = "doctrine.requirement"
version = 1

id = 367
slug = "classify-every-published-assets-licence"
title = "Every published asset carries a declared licence"
status = "pending"
kind = "functional"

description = "Every published asset carries an explicit, declared licence drawn from a fixed allowed set — MIT for copyable authoring material, GPL for owned internal content (RFC-021) — so a user knows before copying what terms govern the asset. Publication fails for any asset whose licence is not established."
tags = []
acceptance_criteria = [
  "No asset is published without a declared licence from the allowed set (MIT or GPL) and a declared customization status.",
  "The declared licence is visible alongside the asset in list, tree, and show.",
  "An asset whose licence cannot be established fails publication rather than being published under a guessed licence.",
]
