description = "Readers can obtain an ordered current plan in which governing criteria are unmistakable, while superseded and withdrawn criteria remain auditable history and cannot appear active."
tags = []
acceptance_criteria = [
  "The ordinary plan read presents one deterministic ordered governing criterion set.",
  "A superseded or withdrawn criterion is never presented as governing, including after split, merge, or cross-phase relocation.",
  "Historical reads preserve predecessor and successor identities, dispositions, and phase locations without requiring Git archaeology.",
]
