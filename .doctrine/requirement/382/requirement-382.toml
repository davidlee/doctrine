description = "Federated search is fail-soft per provider: an unavailable or failing provider degrades to a reported gap in its group without failing or stalling the whole search."
tags = []
acceptance_criteria = [
  "An unavailable provider yields a reported empty/failed group; other providers' results still return.",
  "One slow or erroring provider does not abort the federated query.",
]
