id    = 391
slug  = "design-review-of-sl-267"
title = "design review of SL-267"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
concluded = true

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-267"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Verification has no concrete evidence artefact or bound"
detail = 'sec-8 states the evidence is "the replacement resolving" but defines no artefact that captures it and no bound on the ~239-site read. As written the pass is unbounded and unreviewable: a reader cannot tell which sites were classified, what disposition each took, or which replacement was verified. Name the evidence artefact (a per-site disposition ledger: site to class to disposition to resolution, plus a per-corpus read record for the published / materialised / installed copies) and bound the read (mechanical locate, then per-site disposition and one whole-file read per corpus file).'
disposition = "route:review fix-now"
response = 'sec-8 revised (rev 24, materialised rev 25): added "The evidence artefact and the bound" - a per-site disposition ledger in notes.md (file:line | class | disposition | resolution), repoints proven to resolve via doctrine library show, and the read bounded to one whole-file read per changed corpus file per channel.'

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Sufficiency destinations underspecified"
detail = 'sec-6 Axis C says each IMP-484 gap "gains shipped orientation at its ADR-005 tier" but names no destination and no decision rule. IMP-484 lists at least six surfaces; without a placement rule the phase cannot know whether a gap becomes a signpost, a section of a reference doc, or a boot line. Add the placement procedure (e.g. corpus-health group to a reference doc; observation to a shipped signpost/reference; reports/config/facets to reference orientation) and record each kept-out surface with its reason.'
disposition = "route:review fix-now"
response = "sec-6 revised: added the ADR-005 placement-procedure table - corpus-health group to a PULL reference doc; observation to a shipped signpost plus a reference section; reports/config/facets to reference sections; supersede/serve-mcp/worktree to the owning domain doc; developer-only recorded out of scope with reason."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "POL-002 textual gap left unaddressed"
detail = "Research T1 records that POL-002's prohibitions are mechanism-worded and a shipped prose citation is outside its text, so the corpus is enforced against by interpretation; it names POL-002 as a revision candidate. sec-3 notes the gap but the design mints only an ADR and never states whether POL-002 is revised, left as-is, or explicitly relies on the ADR. State the disposition."
disposition = "fix-now"
response = "sec-5 revised: POL-002's textual gap is now dispositioned explicitly - left unrevised, with the new ADR (DEC-312) supplying the content-facet rule as a descendant; a POL-002 revision is named as the escalation if the drift gate finds the descendant insufficient."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "New design-run rationale doc may duplicate existing design-run docs"
detail = "sec-5 adds install/design-run-obligations.md for the thin-adapter reasoning. The design-run already ships reference/design-run-stages.md (generated) and the design-prompt fragments. State why a new doc rather than an existing home, to satisfy the no-parallel-implementation rule."
disposition = "fix-now"
response = "sec-5 revised: rationale for a new doc recorded - reference/design-run-stages.md is generated and golden-pinned to the gate tables, the design-prompt fragments are runtime runbooks, so a new reference/design-run-obligations.md is the only ADR-005 PULL-tier home that forks neither."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Grounding rule admits only inline prose or reference/<name>.md; the corpus's own shipped memory keys and skill names are outlawed"
detail = "Expected: DEC-311 (sec-5) enumerates every client-resolvable referent form. Observed: it permits exactly two forms and explicitly rejects 'a widened vocabulary', yet the shipped corpus carries 149 [[mem.*]] wikilinks (grep over memory/ plugins/ install/) and 117 backtick skill references such as /audit, /design — both resolve in every client (shipped memories materialise into .doctrine/memory/shipped/; skills install). DEC-311's body is silent on both. sec-6 Axis B simultaneously treats only *dangling* [[mem.*]] links as defects, implying the live ones are fine — the design contradicts its own rule. Consequence: the ADR (DEC-312) would bind future authoring to a rule the corpus violates ~266 times by design, and a faithful sweep would strip the navigation mesh. Penance: widen the rule to 'a client-resolvable address' and enumerate the forms — published reference/<name>.md, shipped memory key, shipped skill name, doctrine CLI verb — then amend DEC-311 and sec-5."
disposition = "route:review fix-now"
response = "Rule widened in sec-5 and re-recorded on DEC-311: six admissible forms (inline prose; published reference/<name>.md; shipped memory key; skill name; CLI verb; in-corpus relative path, admissible only where the target is installed beside the citing file, per ADR-019). The sentence rejecting a widened vocabulary is struck from both. Counts verified: 149 [[mem.*]] links, 272 slash-skill code-span references."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Observation 'gap' is false: using-doctrine.md already orients it; the placement table would duplicate that section"
detail = "Expected: sec-1 item 3 and sec-6's placement row for observation rest on a true gap. Observed: install/using-doctrine.md:68-105 ('Capturing friction — observations', since 6e834a6fd, 2026-07-28 — before the audit) covers what it is for, the capture verb, the per-context interface table, fork-local refusal, and 'Records are authored by default' — every item IMP-484 says is missing; IMP-484 claims 'One table row ... is the entire coverage'. Further, IMP-484/sec-1 say the *shipped boot snapshot's* Instrumentation section instructs every agent; that section is this repo's CLAUDE.md, not a shipped install/ fragment (no hit in install/). Minting 'a shipped memory signpost plus a reference section' is a parallel implementation. Penance: re-verify each IMP-484 gap against the corpus before placement; dispose observation as already-oriented (or a pointer from boot at most); correct sec-1, sec-6 and IMP-484."
disposition = "route:owner-fix"
response = "Both extra copies swept. IMP-484's observation paragraph is replaced with a re-verified NOT-a-gap note (using-doctrine.md:68-105 is the documented home; the quoted Instrumentation text is repo-local .doctrine/governance.md surfaced into boot, not shipped). slice-267.md's context sentence is corrected likewise and cites RV-391 F-6. Design sec-1 and sec-6 were already corrected at the prior pass."

[[finding]]
id = "F-7"
status = "answered"
severity = "major"
title = "Client-read test is run inside the doctrine repo, where repo-private ids silently resolve — the exact failure it must detect"
detail = "Expected: sec-8 / slice closure intent read the corpus 'as an agent with no doctrine corpus'. Observed: the verification reads via doctrine library show and the materialised/installed copies, but names no environment; run from this repo, ADR-007 resolves to doctrine's own ADR-007, so a leftover citation reads as correct — the silent-resolution defect sec-1 describes. Penance: perform the read test in a scratch client (git init + doctrine install in a temp dir, memory sync), where any surviving repo-private id visibly resolves to nothing or the wrong thing; record that environment in the evidence artefact."
disposition = "route:control"
response = "sec-8 now states what the check asserts and what the phase must supply. Assert: in a scratch-repo copy, no swept file in any channel carries a repo-private id or path; every citation resolves to a listed form (sec-5) or stands alone. Negative control: plant one repo-private id, e.g. ADR-007, in one swept file per channel; the scratch-repo read must flag each planted id, and a clean read over a planted id fails. Hosting-phase supply: a scratch-repo fixture, one planted-id file per channel, and the recorded flag for each - the obligation becomes a phase criterion at /plan, since a control-route finding verifies only once it is a criterion."

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "install/ reaches clients through more channels than 'published'; only library show is reach-tested"
detail = "Expected: sec-6 'three channels, three reach tests' covers every seam by which install/ text reaches a client reader. Observed: install/manifest.toml projects only three backings, but install/templates/** are rendered into every entity a client mints (src/adr.rs:209, src/concept_map.rs:266 via asset_text), install/model-band.md / routing-process.md / boot-footer.md are composed into the client's boot snapshot, install/design-prompts/** are served in design-run turn envelopes, and install/agents/** + git-hooks are installed. sec-7 sweeps all of them; sec-6/sec-8 verify only the published copy. Penance: map each swept install/ path to its actual channel and name the read that proves it (mint an entity from each swept template; regenerate boot; render a design-run turn; read installed agents/hook) in the scratch-client test."
disposition = "route:owner-fix"
response = "sec-2 corrected to agree with sec-6: the sub-corpora/embed-root table no longer claims three delivery channels, install/ now lists its five seams (published, rendered, boot-assembled, design-run-served, installed), and the diagram fans install/ to those seams into a single client agent. The two accounts now agree."

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "'One rule, one home' is contradicted by the design's own delivery: ADR + restating reference doc + DEC-127 + two memories"
detail = "Expected: sec-4 'the rule is recorded once, as an ADR; the corpus carries pointers, not restatements', and sec-3 'do not mint a third POL-002 rule'. Observed: sec-5 has reference/shipped-corpus-authoring.md 'state the rule and the disposition procedure' — a restatement, necessarily so, because by the rule itself the shipped corpus cannot point at the new ADR's repo-private id. DEC-127 (the same rule for install/) and mem.pattern.doctrine.shipped-skill-platform-independence / shipped-master-body-scrub persist, with no stated relation to the new ADR (supersede? refine?). Result: five statements of one rule. Penance: state the ADR's relation to DEC-127 (supersedes) and to the two memories (retire or repoint in this slice, since their bodies are in memory/**/.doctrine scope), and replace the principle with the honest one: the ADR governs the repo, the published doc is the sole shipped statement."
disposition = "route:owner-fix"
response = "Backlog item CHR-081 created for consolidating the two local memories that restate the grounding rule. sec-9 cites CHR-081 by id as the follow-up, excluded from this slice because local-memory health is a non-goal corpus. No selector widening."

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "'prompt' classed developer-only, but the shipped boot instructs every agent to run doctrine prompt resolve"
detail = "Expected: sec-6's developer-only list contains surfaces no client agent is told to use. Observed: install/model-band.md:8 (composed into every client boot) directs 'doctrine prompt resolve --band model --model <id>' as a floor directive. Penance: move prompt (at least resolve) out of the developer-only row; the boot fragment may already suffice as orientation — record that disposition."
disposition = "fix-now"
response = "sec-6 moves prompt out of developer-only and into the placement table as a client-facing surface: the shipped band directive (install/model-band.md:8) invokes doctrine prompt resolve. Developer-only is now reseat, export, reservation, verify, catalog."

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "sec-2 says neither POL-002 memory reaches shipped memory prose; shipped-master-body-scrub does"
detail = "Expected: sec-2's current-state claims are true. Observed: mem.pattern.doctrine.shipped-master-body-scrub states a promoted master's body must be scrubbed of ISS-/SL-/REC-/REQ- ids — precisely shipped memory prose. The true gap is install/ reference docs only. Penance: correct sec-2."
disposition = "fix-now"
response = "sec-2 corrected: shipped-master-body-scrub is a body-scrub rule for promoting a master, so it reaches shipped memory prose but is not a citation rule; neither memory reaches install/ reference docs, and there is no single corpus-wide citation rule."

[[finding]]
id = "F-12"
status = "verified"
severity = "minor"
title = "No disposition class for maintainer-directed text in shipped files"
detail = "Expected: sec-5's classes cover every site kind in ISS-309. Observed: five published docs open with '<!-- Shipped reference (ADR-005 PULL tier). Edit the source in install/<file>.md -->' (claude-activation, harvest, using-doctrine, review-ledger, dispatch-mechanics) — addressed to doctrine maintainers, and published verbatim (visible in library show output). The procedure would 'drop' it, losing the maintainer pointer; 'leave' violates the rule. Penance: add a class (e.g. maintainer note: keep the path-free instruction, drop the ids; or move to a non-published location) and apply it uniformly."
disposition = "fix-now"
response = "sec-5 names the maintainer-note class: the five Edit the source in install/... headers citing ADR-005 are shipped but aimed at maintainers; strip the repo-private id and express the source as the published corpus path, or keep the note with references admitted only to the published corpus. The class is named so it is governed."

