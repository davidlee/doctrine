title = "conformance reports 2 undeclared paths: the slice's own notes.md and slice-275.toml"
detail = """
Expected: no undeclared paths, or each explained.
Observed: `slice conformance 275` undeclared = `.doctrine/slice/275/notes.md`,
`.doctrine/slice/275/slice-275.toml`. Both are the slice's own lifecycle
bookkeeping (harvest notes, status flip), committed inside recorded phase ranges.
No source or governance file is undeclared.
"""
disposition = "aligned"
response = """
Expected noise: a slice's own notes/status toml are not design targets and should
not be declared as such. Conformance on source paths is 9/9 with 0 undelivered.
"""

