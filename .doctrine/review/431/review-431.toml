disposition = "fix-now"
response = 'Fixed: PHASE-01/EX-4 now reads "a single-phase plan may skip it and, if it does, says so in one line of plan.md"; C-12 how updated to match.'

[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "C-27's satisfying EX omits immutable, never-reused commitment identities"
detail = """
Expected: .doctrine/slice/287/design.md:53 makes a commitment id 'author-assigned, immutable, never reused'; sec-6:281-282 repeats the immutability requirement. commitment-ledger.toml C-27 quotes the latter and maps it to PHASE-01/EX-2 and EX-7. Observed: plan.toml:36, PHASE-01/EX-2, ends 'Ids author-assigned, criteria phase-qualified.' It never requires immutable or never-reused commitment ids. PHASE-01/EX-7 addresses naming, private references and guidance status, and EX-3's ledger rules do not restore the identity rule either. The plan-file header's immutable PHASE/criterion ids are not a requirement on the shipped commitment schema.

Inference: a doc that permits renumbering or reusing C ids meets the written exits, breaking the stable targets on which satisfied_by/needs/variance history depend. Add the immutable/never-reused identity requirement to the shipped-doc EX and its content verification; keep C-27's mapping faithful. This is a missing condition in the exit criterion, not evidence that an implementation already renumbers ids."""
disposition = "fix-now"
response = "Fixed: PHASE-01/EX-2 now requires commitment ids author-assigned, immutable and never reused."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fixed: PHASE-01/EX-2 now requires commitment ids author-assigned, immutable and never reused."

[[finding]]
id = "F-4"
status = "answered"
severity = "minor"
title = "EX-7's sole linked proof cannot establish its semantic guidance requirements"
detail = """
Verified proof coverage: .doctrine/slice/287/commitment-ledger.toml:500-502 maps only PHASE-01/VA-2 to PHASE-01/EX-7. plan.toml:41 requires EX-7's doc to describe defect classes rather than cite them, use the intended commitment terminology, and present the procedure as guidance rather than an enforced check, as well as exclude private ids and src paths. VA-2 (line 48) only sweeps id/path patterns and checks that 'obligation' is absent. VA-1 (line 47) explicitly reads EX-2..EX-6, so EX-7 is excluded from the semantic content review. For example, 'This is an enforced check' contains none of VA-2's forbidden patterns but contradicts EX-7 and C-28's guidance rule. This counterexample is inference from the proposed checks, not observed shipped text.

C-28 and the relevant part of C-24 therefore cannot be fully supported as proportionate by these proofs; mark the uncovered parts weak until a semantic read-through covers EX-7 and is linked in [[proof]]. Also reconcile C-11's mapping: it links PHASE-01/EX-7 for the distinction between 'commitment ledger' and bare 'ledger', but that rule is actually in PHASE-01/EX-3 (plan.toml:37), already covered by VA-1. A keyword/pattern floor is appropriate for forbidden tokens, but does not prove guidance status, terminology meaning or the description of defect classes."""
disposition = "fix-now"
response = "Fixed: PHASE-01/VA-1 now reads EX-2..EX-7, covering EX-7 semantics (guidance status, terminology, defect classes described not cited); its [[proof]] row now proves EX-7. VA-2 stays the token floor. C-11 now maps to PHASE-01/EX-3, where the naming rule lives."

