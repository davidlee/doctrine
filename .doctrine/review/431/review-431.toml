[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "Three stored quotes fail the literal fidelity predicate on unchanged design text"
detail = '''
Verified with Python tomllib parsing and exact substring checks against .doctrine/slice/287/design.md: C-16, C-18 and C-21 in commitment-ledger.toml have quote not in design.md; the other 30 quotes pass. All three pass only after quote.strip(), so their words are faithful but their stored trailing newline is not. C-16 (lines 251-255) ends 'nothing more.\n' while design.md:177 continues 'nothing more. The plan review'; C-18 (276-280) ends 'contention).\n' while design.md:188 continues 'contention). After authoring'; C-21 (323-327) ends 'phase = "plan".\n' while design.md:263 continues 'phase = "plan". The cost'.

Design sec-2 requires verbatim quotes, and sec-5:240 marks a governing design row stale if its quote no longer occurs verbatim in design.md. Inference: applying the literal predicate to this unchanged design already reports three stale rows, despite every extracted section fingerprint matching the current managed design run. The design specifies no whitespace-normalisation exception.

Correct these stored quotes so they are actual substrings (widening to the full source line/passage also addresses lost context), following the immutable-row/history rules. Re-run the exact parsed-string fidelity check, not only a trimmed comparison. No claim is made that a runtime checker exists; this is a failure of the manual predicate the procedure prescribes.'''
disposition = "fix-now"
response = "Fixed by a plan-time realisation variance on C-03 (basis RV-431 F-5), not by editing quotes: the design is silent on the closing newline a TOML multi-line literal adds, so the shipped doc will state it is layout, not quote text, and the verbatim check removes exactly one trailing newline. PHASE-01/EX-3 carries the rule. Strict check under that rule: 37/37 quotes pass."

