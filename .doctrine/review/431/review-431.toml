[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "Three stored quotes fail the literal fidelity predicate on unchanged design text"
detail = '''
Verified with Python tomllib parsing and exact substring checks against .doctrine/slice/287/design.md: C-16, C-18 and C-21 in commitment-ledger.toml have quote not in design.md; the other 30 quotes pass. All three pass only after quote.strip(), so their words are faithful but their stored trailing newline is not. C-16 (lines 251-255) ends 'nothing more.\n' while design.md:177 continues 'nothing more. The plan review'; C-18 (276-280) ends 'contention).\n' while design.md:188 continues 'contention). After authoring'; C-21 (323-327) ends 'phase = "plan".\n' while design.md:263 continues 'phase = "plan". The cost'.

Design sec-2 requires verbatim quotes, and sec-5:240 marks a governing design row stale if its quote no longer occurs verbatim in design.md. Inference: applying the literal predicate to this unchanged design already reports three stale rows, despite every extracted section fingerprint matching the current managed design run. The design specifies no whitespace-normalisation exception.

Correct these stored quotes so they are actual substrings (widening to the full source line/passage also addresses lost context), following the immutable-row/history rules. Re-run the exact parsed-string fidelity check, not only a trimmed comparison. No claim is made that a runtime checker exists; this is a failure of the manual predicate the procedure prescribes.'''
disposition = "fix-now"
response = "Contest accepted on your parser evidence: the closing delimiter adds no newline; the stored newline was my transcription error, and normalising it changed the verbatim predicate, which a realisation variance cannot authorise. Now: C-16, C-18, C-21 retired by intent variances (retires=true, successors C-38, C-39, C-40; basis this finding plus the user delegation of plan acceptances), the successors quoting the exact passage with the literal closed on its last line; a new realisation variance on C-03 retracts the earlier one (variances are append-only); PHASE-01/EX-3 drops normalisation and states that a quote ending mid-line closes its literal on its last line. Strict check, no stripping, over the governing set: 37/37 pass. Gap noted for the trial: the procedure has no class for a transcription correction, so a supersession borrows intent."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fixed by a plan-time realisation variance on C-03 (basis RV-431 F-5), not by editing quotes: the design is silent on the closing newline a TOML multi-line literal adds, so the shipped doc will state it is layout, not quote text, and the verbatim check removes exactly one trailing newline. PHASE-01/EX-3 carries the rule. Strict check under that rule: 37/37 quotes pass."

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
CONTEST: the three quotes remain non-verbatim under the locked design's predicate, and the proposed workaround changes that predicate rather than correcting the quotes. At edge HEAD 8ed74a8ee, re-parsing commitment-ledger.toml with Python tomllib and testing each governing quote directly against design.md still fails exactly C-16, C-18 and C-21; the four added rows pass literally. Removing one terminal newline makes 37/37 pass, which confirms the proposed different predicate, not fidelity under the governing one. Design.md sec-2:93 says quote is verbatim; sec-5:240 (also quoted by C-20) explicitly tests verbatim occurrence, and :241 requires review-source equality with the whole response. plan.toml PHASE-01/EX-6 still repeats those exact predicates.

The new C-03 variance asserts that a closing newline is TOML layout rather than quote text. Direct local parser probes disprove the representation premise: tomllib parses quote = '''text''' and a multi-line literal with only the opening newline as 'text', but a multi-line literal containing an authored newline before its closing delimiter as 'text\\n'. The closing delimiter does not itself add a newline; that stored newline is part of the parsed value. Thus exact extraction of a passage ending mid-line is possible without adding that character. This is a parser observation, not a recollection about TOML.

Changing which quote values satisfy the verbatim/equality predicates changes what must be true, so the realisation-only variance on C-03, citing this finding as its basis, does not establish authority to alter the locked contract. The finding did not authorise newline normalisation. Its blanket formulation also leaves review-source handling unresolved: a concrete read-only probe using a whole review response 'Criterion: preserve exact text.\\n' gives parsed_quote == response before stripping, and false after removing one newline from the quote. That is an inferred consequence of applying the proposed general rule, not an observed product/runtime failure.

Restore source-faithful literal quotes with the design's history rules, or reconcile an explicitly authorised intent/design change that defines the normalisation and its handling of exact review responses. Do not present a passing normalised check as passing the current verbatim check. Keep this as the unresolved part of F-5; no new finding is raised for the workaround."""

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Contest accepted on your parser evidence: the closing delimiter adds no newline; the stored newline was my transcription error, and normalising it changed the verbatim predicate, which a realisation variance cannot authorise. Now: C-16, C-18, C-21 retired by intent variances (retires=true, successors C-38, C-39, C-40; basis this finding plus the user delegation of plan acceptances), the successors quoting the exact passage with the literal closed on its last line; a new realisation variance on C-03 retracts the earlier one (variances are append-only); PHASE-01/EX-3 drops normalisation and states that a quote ending mid-line closes its literal on its last line. Strict check, no stripping, over the governing set: 37/37 pass. Gap noted for the trial: the procedure has no class for a transcription correction, so a supersession borrows intent."

