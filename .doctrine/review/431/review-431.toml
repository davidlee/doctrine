[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Extracted quotes omit operative rules that their satisfying criteria claim to cover"
detail = """
Expected: design.md sec-2..sec-3 requires quoted commitments wide enough to compare satisfying EX wording against the governing intent; PHASE-01/VA-1 explicitly uses the governing rows' quotes as its content-check evidence. Observed in .doctrine/slice/287/commitment-ledger.toml: C-19 (lines 285-295) quotes only the introductory variance paragraph, omitting design.md:209-212's definitions of realisation (how changes, intent holds) and intent (what must be true changes) and their different authority/basis rules. C-20 (297-317) quotes Detect and its fallback only, but its how claims to cover scoped refresh, retirement and re-stamping: design.md:247-257's refresh procedure and execution-to-design loop have no quoted row. C-31 (451-463) quotes only the touchpoint lead-in, omitting the table at design.md:221-227 that its how and PHASE-02/EX-1 claim to satisfy. Likewise C-18's quote stops before the review reads/checks table and fresh-context/tree constraints used by PHASE-01/EX-5 (design.md:188-200).

Verified by reading all 33 rows against the full design: these passages are not quoted elsewhere. The plan often retains the intended clauses, but the ledger does not retain their source evidence. Inference: a later EX or shipped-doc mistranscription of refresh, variance semantics or pointer behaviour can pass the planned quote-based comparison because the quoted baseline contains none of the rule being checked. This recreates the cited-but-wrong blind spot the slice is intended to remove; link coverage alone is green.

Repair the extraction with sufficiently wide quotes or additional commitment rows for these operative passages, then reconcile satisfaction/proof mappings and re-run content/proportionality checks against that complete baseline. Preserve the design's immutable-quote/history rules when correcting existing rows. This finding concerns extraction and comparison evidence, not phase order or implementation."""
disposition = "fix-now"
response = "Fixed: quotes are immutable once committed, so the omitted passages became new rows rather than widened quotes: C-34 (realisation/intent definitions, design sec-5), C-35 (scoped refresh and the loop back to design), C-36 (the touchpoint table), C-37 (sequence ownership, fresh contexts, tree constraint, reads/checks table). Each maps to the EX that carries it (PHASE-01/EX-5, EX-6; PHASE-02/EX-1). Content re-check against the new quotes found EX-6 missing the loop-closes clause; added. Coverage re-run clean (37 rows)."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fixed: quotes are immutable once committed, so the omitted passages became new rows rather than widened quotes: C-34 (realisation/intent definitions, design sec-5), C-35 (scoped refresh and the loop back to design), C-36 (the touchpoint table), C-37 (sequence ownership, fresh contexts, tree constraint, reads/checks table). Each maps to the EX that carries it (PHASE-01/EX-5, EX-6; PHASE-02/EX-1). Content re-check against the new quotes found EX-6 missing the loop-closes clause; added. Coverage re-run clean (37 rows)."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED against edge HEAD 8ed74a8ee. Read the revised commitment-ledger.toml and plan.toml against design.md. C-34 quotes the realisation/intent definitions and authority rules; C-35 quotes the complete scoped refresh and execution-to-design loop; C-36 quotes the touchpoint table; C-37 quotes sequence ownership, fresh-context/tree constraints and the review reads/checks table. All four added parsed quotes occur literally in design.md and map to PHASE-01/EX-6, PHASE-02/EX-1, or PHASE-01/EX-5 as appropriate. EX-6 now includes the loop-closes clause; PHASE-01/VA-1 covers the relevant exits against their governing quotes, and PHASE-02/VA-3 compares pointers with the touchpoint table. Re-ran coverage: no unclaimed or unproved EX, unmapped verification criteria or invalid links across 37 rows. All 33 original quotes are preserved. This resolves F-1's missing source-evidence complaint; the separate literal-fidelity issue remains under F-5. Plan/design verification only, not implementation or runtime proof."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "PHASE-01/EX-4 drops the single-phase trigger's permission to use the procedure"
detail = """
Verified comparison: .doctrine/slice/287/design.md:130-132 and commitment-ledger.toml C-12 state 'A single-phase plan may skip it and says so in one line of plan.md.' DEC-417 likewise makes the procedure optional for a single-phase plan. In .doctrine/slice/287/plan.toml:38, PHASE-01/EX-4 instead requires 'a single-phase plan says it skips in one line of plan.md', with no conditional or permission to elect to use the commitment ledger. C-12's how calls this faithful and its verdict is proportionate.

Inference: the criterion can be satisfied by shipped guidance telling every single-phase plan to skip, excluding the design's permitted use on a single-phase plan. State the condition explicitly: a single-phase plan may use the procedure; if it skips, record that skip in one line of plan.md. Recheck C-12's content mapping and proof against that wording."""
disposition = "fix-now"
response = 'Fixed: PHASE-01/EX-4 now reads "a single-phase plan may skip it and, if it does, says so in one line of plan.md"; C-12 how updated to match.'

