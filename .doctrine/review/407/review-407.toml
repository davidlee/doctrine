[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected the exemplar census to reach every Presence arm; observed it misses OptionalNullRefused (and RequiredAtCreation)"
detail = """`payload_contract.rs` `the_exemplar_reaches_every_arm_of_the_model` claims a total statement ("every arm of every model type is exercised"), but its Presence block reads "all three" and lists only Required/Optional/Sparse. `census_key` records presence via `{:?}`, not an exhaustive match, so a new `Presence` arm is not a build failure there — the census silently lost totality when this slice added `Presence::OptionalNullRefused` (`94e655d92`). `RequiredAtCreation` was already missing (pre-existing, same cause). Flagged as Open in `notes.md` Harvest. `EXEMPLAR_ROOT` is used only by the census tests, so the fix is local: add exemplar keys carrying the two presences, list them in the expected set, and make `census_key`'s presence read exhaustive so the next arm fails the build."""
disposition = "fix-now"
response = "Fixed in b0d8f9963: EXEMPLAR_ROOT gains `question` (RequiredAtCreation) and `blocking` (OptionalNullRefused); the census expects all five presences; census_key matches Presence exhaustively, so the next arm is a build failure. Red observed (census missed the two arms) before the exemplar keys were added; payload_contract tests green; `doctrine check commit` green."

