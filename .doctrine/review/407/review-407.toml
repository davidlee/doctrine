title = "Expected every touched path declared; observed src/design_run/tests.rs undeclared"
detail = "`doctrine slice conformance 272` reports one undeclared path: `M src/design_run/tests.rs` (commit `3dd526fcb`). The edit relaxes `SL-259`'s `a_term_constructed_at_an_undeclared_kind_is_refused`, which asserted every emittable event declares a term; `DEC-335` makes `node_question_changed` term-free, so the edit is a necessary consequence of the design, not scope creep. It is recorded in `notes.md` (Decisions). But design sec-4's code-impact table and the design-target selectors list eight paths and omit it, so conformance stays red."
disposition = "design-wrong"
response = "The touch is a necessary consequence of DEC-335 (a term-free emittable event) and is correct; the design's declared surface is what is wrong. Delegated to /reconcile: `doctrine slice selector add` a design-target selector for `src/design_run/tests.rs` (load-bearing; conformance reads the registry), mirrored by a design.md sec-4 row. See RV-407 ## Reconciliation Brief."

