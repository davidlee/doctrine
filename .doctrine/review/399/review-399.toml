[[finding]]
id = "F-33"
status = "verified"
severity = "major"
title = "env_vars: a stale refresh clobbers a user's list; extra elements tolerated"
detail = """
Ownership admits any `env_vars` value (keys subset of {command,args,env_vars}); `current` requires "an array containing CODEX_MCP_ENV". Two inconsistencies with Principle 4 ("strict ownership ... doctrine heals its own output, never a user's edit"):
(a) Clobber: `env_vars = ["FOO"]`, `env_vars = "DOCTRINE_BIN"` (wrong type) or `env_vars = []` classify OwnedStale and are rewritten to `["DOCTRINE_BIN"]`, silently dropping the user's forwarded variable. Doctrine never emitted any of these; they are user edits.
(b) Looseness: `env_vars = ["DOCTRINE_BIN", "FOO"]` is OwnedCurrent — an extra element is tolerated while an extra key is foreign. Strict for keys, loose for elements, and destructive when the element is missing.
The only env_vars doctrine has ever emitted is absent (none, pre-this-slice) or exactly ["DOCTRINE_BIN"]. Proposal: owned requires env_vars absent OR exactly equal to the emitted array; anything else is Foreign (left alone, snippet printed). current requires exact equality. That keeps the missing-whitelist refresh (the Dead-override risk mitigation) without rewriting a user's list. Update sec-5.2 formula, sec-5.5 table ("env_vars missing/short -> Refreshed" becomes "missing -> Refreshed; any other value -> Foreign") and sec-9.
