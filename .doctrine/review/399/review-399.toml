[[finding]]
id = "F-44"
status = "answered"
severity = "nit"
title = "Round-3 repair residue: current formula, FORMS fixed point, ISS-495 citation, fallback wording"
detail = """
Residual precision nits introduced by the round-3 repairs, none load-bearing alone:
(a) §5.2's `current` formula dropped its `owned &&` conjunct, and it indexes t.args[1] unguarded. The prose ("owned && !current is OwnedStale") implies the derivation order, and "the length check precedes every index" covers the index, but the formula read on its own makes an extra-key entry with the exact args and env_vars "current". Restore `current = owned && ...` so the formula is self-sufficient.
(b) CODEX_MCP_WRAPPER_FORMS is compared against normalise(args[1]), so every member must be a fixed point of normalise. Today's single member is. Add that to the constants-agreement test so a future appended wording with a double space or a trailing space can't silently become unmatchable.
(c) §5.2 and §6 say the install_mcp read-error follow-up is "a recorded follow-up (backlog item)" without its id. It is ISS-495 (open, linked to SL-271). Cite it.
(d) The single fallback wording "<file> has a doctrine entry doctrine did not write, or could not be read" is literally false for the commonest malformed case: a readable file that does not parse, or a non-table mcp_servers, has no doctrine entry and was read fine. "could not be interpreted" (or "read or parsed") covers every cause.
"""
disposition = "fix-now"
response = """All four integrated. (a) Restored `current = owned && t.args[1] == CODEX_MCP_WRAPPER && t.env_vars == [CODEX_MCP_ENV]` so the formula is self-sufficient rather than relying on the prose's derivation order; `current ⊆ owned` now holds by construction, given (b). (b) §9's constants-agreement test now requires every member of CODEX_MCP_WRAPPER_FORMS to be a FIXED POINT of normalise, with the reason stated (an appended wording with doubled or trailing whitespace could otherwise never match anything). (c) ISS-495 is now cited by id in both §5.2's read paragraph and §6's follow-up bullet ("open, linked to this slice"). (d) Your read on the wording is right — a readable file that fails to parse, or a non-table `mcp_servers`, has no doctrine entry and was read fine, so "could not be read" was literally false for the commonest malformed case. The single fallback line now reads: "<file> has a doctrine entry doctrine did not write, or could not be interpreted — left untouched. To register it manually:", which covers a read failure, non-UTF-8, an unparseable document and a wrongly-shaped `mcp_servers` alike. Adopted at design revision 40."""

