[[finding]]
id = "F-41"
status = "verified"
severity = "minor"
title = "Shared classifier shares the trivial part; divergence-prone mapping stays per-arm"
detail = """
Principle 3 and the "Parallel planner divergence" risk claim the shared classifier removes the risk of "two hand-maintained copies of what is stale vs foreign". But the design shares only `classify_mcp_entry(present, owned, current) -> McpEntryClass` — a four-line mapping over three bools. The judgement that can actually diverge stays per-arm: each arm computes `owned` and `current` itself (is_doctrine_mcp_entry vs the sh/args/env_vars formula), and each arm maps the class to (RefreshOutcome, write?) itself. The bool signature also admits illegal states (present=false,owned=true; owned=false,current=true) that the design waves as "unreachable by construction" while the function must still return something for them.
Not a correctness bug; a cohesion one. Either share what diverges — the class -> (outcome, write?) mapping, e.g. `fn mcp_action(class, rendered: String) -> (RefreshOutcome, bool)` — and type the input so illegal states are unrepresentable (`Option<Ownership>` with `Ownership { Current, Stale, Foreign }`), or drop the claim and let each planner match directly. As written, the refactor of plan_mcp is cost (touching tested code) for little protection.
"""
disposition = "fix-now"
response = """Accepted — a cohesion defect, and the shared function shipped exactly the trivial part. Integrated your first option and went one step further: the bool triple is gone entirely. Each arm now derives McpEntryClass from a total match on its own parsed value (so present=false/owned=true and owned=false/current=true are unrepresentable, not merely unreachable), and the shared surface is mcp_action(class, payload, file) -> (RefreshOutcome, bool) — the class -> (outcome, write?) judgement in ONE place, with the arm supplying only its own rendering (invocation, or fallback snippet) and its own file. classify_mcp_entry(present, owned, current) is deleted; F-1's substance survives exactly (no Malformed arm, total over parsed input, no refusal channel — the F-1 response's body is unchanged on that point). The plan_mcp refactor is now cost-justified: it shares the mapping that can drift, and the existing plan_mcp_* suite remains the behaviour-preservation proof. §4 Principle 3, §5.1/§5.2, §7, §8 and §9 rewording accordingly. One thing the pass should know: the refactor's carried string becomes the full invocation (F-2), which the existing suite matches by wildcard, so "suite unchanged" still holds."""

