[[finding]]
id = "F-43"
status = "answered"
severity = "minor"
title = "Dry-run activation notice has no HooksState; step 1's dry-run behaviour is unspecified"
detail = """
The F-34 repair makes write_codex_activation take a HooksState and print its step 1 ("ensure [features] hooks = true") only when the state is not Enabled. The probe fires only when !dry_run. Under dry_run the notice still prints (as "would write", §5.4) but no HooksState exists, and the design doesn't say what step 1 does then. The options are to print step 1 unconditionally in dry_run (the pre-slice behaviour), to omit it, or to pass Unknown("dry run: not probed"). Each produces different output, and the dry-run wording test (§9) can't be written without a choice. Suggest: pass Option<HooksState>, where None (dry run) prints step 1 as today's unconditional instruction. Add a §9 dry-run assertion that pins it.
"""
disposition = "fix-now"
response = """Confirmed and integrated exactly as you suggest. The probe's predicate requires !dry_run (F-34), so under dry_run no HooksState exists while the notice still prints — and F-34's fold left step 1's dry-run behaviour unstated. write_codex_activation now takes `state: Option<HooksState>`: `None` is the dry-run case (no probe ran) and prints step 1 as today's unconditional instruction, preserving the notice's pre-slice shape; `Some(Enabled)` omits it; `Some(Disabled)` prints it naming `[features] hooks = true`; `Some(Unknown(reason))` prints it naming the reason. §5.4's fold bullet states the four cases, §9's integration assertions now pin the dry-run behaviour explicitly ("under dry_run the notice's step 1 still prints unconditionally (no probe ran)") alongside the existing no-"wrote" assertion, and the impact-table row reads `Option<HooksState>` rather than `HooksState`. The other two options were rejected on the record: omitting step 1 under dry-run would make the plan less informative than the pre-slice notice, and `Unknown("dry run: not probed")` would print a warning-shaped reason for a state nobody tried to determine."""

