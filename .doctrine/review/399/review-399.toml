title = "Ownership formula reduces to string equality; the Refreshed edge rows are unreachable"
detail = '''
sec-5.2's formula makes `is_doctrine_wrapper_line(normalise(l))` true iff `normalise(l) == format!("exec \"{}\" {}", PORTABLE_EXEC, CODEX_MCP_SERVE_ARGS)` (program "must BE PORTABLE_EXEC"), i.e. iff `normalise(l) == CODEX_MCP_WRAPPER`. `current` then re-tests the same equality. Consequences, each contradicting sec-5.5's edge table and sec-9's unit list:
(a) "wrapper from an earlier doctrine wording -> Refreshed" is unreachable: any other wording fails the owned test, so it is Foreign. This is exactly the false negative the notes' pass-1 probe list warned of (stranding our own older wording); the first time doctrine changes the wrapper, every installed entry becomes "foreign" and nags forever.
(b) "wrapper with stray whitespace -> Refreshed" is also wrong: normalise makes it equal, so it is OwnedCurrent -> None, no write (arguably fine, but the table and sec-9 assert Refreshed; a test written to the table fails against an implementation written to the formula).
(c) The quoted-span "program extraction" is dead machinery: with the abspath arm gone it reduces to string equality after normalise.
So the only reachable OwnedStale input is a bad env_vars. Fix: decide explicitly. Either (1) ownership = normalised equality with a named set of historic wordings (today: just the current one), current = byte-equality of args[1] AND env_vars — then whitespace variants refresh, and future wording changes add to the set; or (2) drop "earlier wording" and "whitespace -> Refreshed" from the tables and delete the extraction step. Either way the formula, sec-5.5 table and sec-9 list must agree.
'''
