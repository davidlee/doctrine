title = "Shared classification type cannot express the class it declares"
detail = """
sec-5.2 types `classify_mcp_entry(present, owned, current) -> McpEntryClass` and lists `Malformed` as a member, but malformed is a PARSE outcome (bad TOML, non-table `mcp_servers`, non-table entry) taken before any ownership test — exactly as `plan_mcp` returns `mcp_fallback()` at boot.rs:2042/2050/2054 ahead of classification. The signature therefore has an unreachable arm and every implementor must invent where Malformed originates, which is the divergence the shared function exists to prevent.
"""
