response = 'Intended, not a regression. design §2 considered-set + EX-1/INV-1 rescope: an off-frontier (blocked) id has no tension analysis and now says so ("not on the current frontier — no tension analysis", render.rs:648). The single updated e2e explain golden (ISS-001) carries a test comment documenting the rescope; commit 394a15c4 names it intentional. Behaviour is more honest than the prior silent output.'

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "needs/Dep structure tensions unreachable on actionable frontier — pinned as unit goldens"
detail = "An actionable frontier item has no non-terminal blocker, so no needs(dep) edge holds between two actionable members; graded_tensions only ever emits Seq(after) structure e2e. The pure detect Dep branch + the needs/projected wording sample are pinned as UNIT goldens (render + PHASE-02 detect, VT-D), not black-box e2e. Structure-after, composition, and all three grades ARE e2e-golden'd. Recorded in mem.pattern.priority.tension-render-reachability. Auditor question: is the unit-level coverage faithful, not a gap?"
disposition = "aligned"
response = """Faithful coverage, not a gap. VT-D is a unit-fixture criterion by design ("detection unit fixtures — … direct + transitive edge … m=0 …"); the needs/Dep branch is proven UNREACHABLE on the actionable frontier (no non-terminal blocker between two actionable members ⇒ no dep edge), so a black-box e2e for it cannot be constructed with valid inputs. Pinning the Dep branch + needs/projected wording at the pure/render unit level exercises the exact code path; structure-after, composition, and all three grades are additionally e2e-golden'd. Recorded in mem.pattern.priority.tension-render-reachability."""

[[finding]]
