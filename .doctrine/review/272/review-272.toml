status = "verified"
severity = "minor"
title = "Intentional golden diff — off-frontier explain now emits disclosure line"
detail = 'explain of a blocked/off-frontier id (ISS-001) now emits "not on the current frontier — no tension analysis" (render.rs:648); one existing e2e_priority_golden explain golden updated (394a15c4). Intended per design §2 considered-set + EX-1/INV-1 rescope; the test comment documents the rescope. Confirm captured as intended, not a regression.'
