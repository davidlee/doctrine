title = "Undeclared source edit — src/status.rs not in design-target selectors"
detail = 'conformance reports src/status.rs undeclared. Change (394a15c4): the status `next_up` caller adapts to surface::next now returning NextView { rows, tensions, zero_weight } (design §3) via `.map(|v| v.rows)`. A necessary mechanical ripple of the designed return-type change — design §Code-impact declared src/priority/surface.rs ("thread tensions into next/explain rows") but did not enumerate the downstream status.rs caller. No behaviour change; gate green. Registry + design-mirror should record the touch.'
disposition = "verified"
response = "Observation confirmed: status.rs is a real undeclared touch, a necessary call-site ripple of the designed NextView return-type change — no defect, gate green. Remediation is reconcile's (per-slice write surface): `doctrine slice selector add src/status.rs` (the load-bearing change conformance reads) + mirror row in design §Code-impact. Delegated to /reconcile brief (Per-slice / direct edit)."

[[finding]]
id = "F-2"
status = "verified"
severity = "nit"
title = "Undelivered selector — src/comparison/query.rs (conscious design fence)"
detail = 'conformance reports src/comparison/query.rs undelivered. design §Code-impact declares it "no new API expected — existing determined()/PairSide reused by priority-side grading; row retained as fence in case exports need widening." The fence did not fire (F-5 held: no new comparison/query.rs API — notes PHASE-02). undelivered is the expected/desired outcome, not dropped work or a stale design.'
disposition = "tolerated"
response = """Conscious design fence, not dropped work. design §Code-impact explicitly retained the src/comparison/query.rs row as a contingency ("no new API expected … in case exports need widening"); F-5 held (no new query.rs API), so the fence correctly did not fire. undelivered is the desired outcome; the row is documentation of a considered-and-not-needed export widening. Accepted drift — leaving the selector preserves the fence's intent; no registry change."""

[[finding]]
