[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "VA-1 (external, codex): ranks-above verb + grade clause — overclaim risk across grades"
detail = 'External adversarial pass (codex GPT-5.x) flagged that each callout leads with a hard ordering verb ("ranks above"/"ranks higher") before the grade qualifier, for Projected ("projected order — no determining evidence") and AgentProposed ("agent-proposed — N agent judgements, unconfirmed"). Adjudication: design D6 consciously replaced the two-state vocabulary with the three-grade one for exactly this reason; the grade clause is parenthetical and adjacent, directly negating determinacy; "ranks" names the value_dim computation result, not a feasible-set determinacy claim (the grade states the latter). Critique #3 provenance disclosure + critique #6 projection disclaimer are both present; goldens pin the shapes (design §3).'
disposition = "aligned"
response = 'VA-1 passes. The concern is the design-adjudicated grade vocabulary (D6), authored precisely to answer critiques #3/#6: two-state was replaced by three grades so demoted agent evidence reads "agent-proposed … unconfirmed" (not "no determining evidence"), and projection reads "projected order — no determining evidence". The grade clause is parenthetical, adjacent, and directly qualifies the ordering; "ranks above" names the value_dim computation result while the grade states the determinacy standing. Critique #3 provenance disclosure and critique #6 projection disclaimer are both present; the shapes are golden-pinned (design §3). No overclaim survives adjudication.'

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = 'VA-1: AgentProposed render shows agent-share only vs D6 "full-system counts"'
detail = 'codex #2: TensionGradeView::AgentProposed{agent} (view.rs:150) narrows the pure EvidenceGrade::AgentProposed{counts: RaterCounts} full counts (tension.rs:88) to the agent share (surface.rs:702-704). A full basis {2 human, 4 agent} would render "agent-proposed — 4 agent judgements, unconfirmed", hiding the humans. Adjudication: AgentProposed means the human-only system is INDETERMINATE for the pair — the present human rows are non-decisive, so naming them would imply an endorsement the "unconfirmed" grade explicitly denies; the direction is conservative (understates, never inflates, agent authority — no critique #3 violation). The pure model retains D6 full counts. design D6 prose "counts always come from the system that produced the verdict" reads loosely vs the deliberate agent-share render — optional prose clarification.'
disposition = "aligned"
response = """Deliberate and conservative. AgentProposed is by definition the state where the human-only verdict system is INDETERMINATE for the pair — the present human rows do not close it, so they are non-decisive; the render's agent-share ("N agent judgements, unconfirmed") avoids implying a human endorsement the grade explicitly denies. Direction never inflates agent authority (it understates human input), so critique #3 is not violated. The pure model (EvidenceGrade::AgentProposed{counts: RaterCounts}) retains the D6 full counts; the view narrows by intent. Optional (non-blocking) reconcile note: tighten design D6 prose "counts come from the producing system" to state the render surfaces the agent share for AgentProposed."""

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = 'VA-1: Determined + zero judgements renders "determined — no constraining judgements"'
detail = 'codex #5: an anchor-determined tension pair with zero judgement rows yields RaterCounts (0,0); tension_counts_clause (render.rs:456) emits "determined — no constraining judgements" — technically accurate (anchors are point constraints, not judgement rows; D6) but reads self-undermining. Rare (anchor-determined + zero judgements + a surviving value/delivery inversion) and not exercised by current fixtures. A durable wording improvement (e.g. "determined — anchor-constrained" when counts are 0,0) rather than an audit-scope fix.'
disposition = "follow-up"
response = 'Real but out-of-audit-scope wording edge; captured as IMP-288. The "determined — no constraining judgements" phrase is accurate (anchor point-constraints, not judgement rows) but reads self-undermining; rare (anchor-determined + zero judgements + surviving inversion), unfixtured. IMP-288 carries the fix sketch (anchor-aware clause when counts are (0,0)) — small render change + unit golden, no semantics change.'

