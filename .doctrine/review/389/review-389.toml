[[finding]]
id = "F-15"
status = "verified"
severity = "minor"
title = "[tests] Retired-act refusal must preserve stored state; the unchanged-set assertion compares an immutable input to itself"
detail = "In src/design_run/tests.rs:3315-3354, submitted_legacy_act_is_refused_and_the_stored_set_unchanged clones run.declarations, calls apply(&run, ...), then compares run.declarations to the clone after consuming refused.err(). The production signature at src/design_run/run.rs:329-336 takes prior: &DesignSnapshot and returns Result<Applied, Refusal>, so this assertion cannot fail for a persistence regression: the caller-owned run is immutable, and an Err exposes no candidate snapshot. The RetiredAct refusal assertion is useful, but the claimed unchanged stored set is untested. No mutation is needed for this proof; Rust’s borrow type guarantees the assertion. Exercise a real design apply refusal against a snapshot with a stored legacy declaration, comparing the snapshot bytes and effective blocking set before/after."
disposition = "fix-now"
response = "Drop the tautological stored-set-unchanged assertion; the test doc states that apply takes &DesignSnapshot so the type guarantees it; keep the RetiredAct refusal assertion. User assented to the proposed disposition 2026-09-25 (session reply: 'agreed to dispositions')."

[[finding]]
id = "F-16"
status = "verified"
severity = "major"
title = "[r2][correctness] null at the inquiry home must be refused on every route; observed a delegated proposal carrying blocking: null or needs: null is accepted and the null silently dropped"
detail = 'Expected (design sec-3, sec-4; invariants 3 and 4): blocking: null is refused at the inquiry home in either state, and needs: null clears exactly as needs: [] does. Observed: via the delegation route both nulls are accepted with success and then ignored. Mechanism: DelegationAct::Propose stores the submitted Declarations in the snapshot (src/design_run/run.rs:1200, Proposal::of(by, summary, declare.clone())); the snapshot is TOML; Sparse::serialize writes Null as serialize_none (src/design_run/submission.rs:80) and TOML drops a none-valued field, so on the next invocation the stored declaration re-reads as Sparse::Omitted. Accept (run.rs:1238) then replays it through declare, where Omitted persists. Proof (throwaway e2e appended to tests/e2e_design_delegation.rs, since reverted byte-for-byte): Fixture::inquiring(); export; propose declare [{subject: inq-1, blocking: null}] -> exit 0; stored proposal holds only subject = "inq-1"; accept -> exit 0; inq-1 blocking=Some(false) unchanged. The same payload applied directly is refused (BlockingJudgementWithdrawn). Second probe: inq-1 needs [inq-3]; export; propose [{subject: inq-1, needs: null}] -> ok; accept -> ok; inq-1 needs still {inq-3}, whereas needs: [] would be stored and clear. So the new null refusal is bypassable and null != [] on this route: success for ignored input, the class SL-264 exists to kill. Root cause predates the slice (any Sparse::Null in a proposal - question, parent - is dropped the same way), but SL-264 added the null refusal and the null==[] claim without covering the proposal path. Fix options: refuse at propose time by running the proposed declarations through the inquiry-home null checks (resolve_blocking needs held state; at minimum refuse Sparse::Null for blocking and normalise needs: null to an empty Value before storing), or give Sparse::Null a storable representation. A test should drive propose and accept as separate invocations.'
disposition = "fix-now"
response = "Option 1, per user reply '1.' (2026-09-26): Propose refuses any Sparse null in its declarations (loud refusal replaces the silent TOML drop), and the proposal's declarations are checked at Propose against the same inquiry-home rules a direct apply enforces, so blocking null is refused identically on both paths. Restoring null-clearing through proposals (null-preserving storage) is routed to IMP-483."

