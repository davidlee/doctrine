[[finding]]
id = "F-18"
status = "verified"
severity = "minor"
title = "[r2-f16] nulled_keys guard should pin every Sparse<T> field; observed the KEY_BLOCKING row is unpinned and its only live effect is a false refusal at fnd-"
detail = "every_sparse_key_is_reported_when_null (src/design_run/tests.rs:5182) compares nulled_keys against contract rows with Presence::Sparse = {question, needs, parent}; blocking is Presence::RequiredAtCreation and Declaration::sparse_nulled (submission.rs:982) sets it Sparse::Value(true), so the guard never exercises the blocking row. Proven: deleting (KEY_BLOCKING, self.blocking.is_null()) from nulled_keys (submission.rs:844) leaves the guard, all design_run:: unit tests and e2e_design_delegation green (reverted). Deleting the KEY_NEEDS row does fail the guard, so totality holds only for Presence::Sparse, not for every Sparse<T> field as the nulled_keys doc implies. The unpinned row is also the only thing refusing blocking:null at a fnd- subject (inq- is caught earlier by the declare_node rehearsal), and there it is a false refusal: probed e2e, a direct apply of {subject: fnd-1, concerns: sec-spine, summary: x, blocking: null} succeeds (finding_blocks reads null as absence, ISS-482, so storage dropping it is lossless) while the same declaration in a proposal is refused with ProposalCannotClear claiming a clear. rehearse_proposal doc (run.rs:1271) says it refuses nulls the direct path would honour; at fnd- the direct path honours none. Fix: either derive the pin from the Sparse<T> field set (sparse_nulled with blocking Null, excluded from the contract comparison by name) and keep the fnd- refusal as a stated, tested choice, or drop the fnd- case and document why."
disposition = "fix-now"
response = "Fixed in the F-18 commit: blocking leaves nulled_keys (inquiry-home null is already refused by the rehearsal through the direct rule; a finding null reads as absent, so storage drops nothing). Red-first e2e a_proposal_may_send_a_findings_blocking_null; the sparse-key guard now matches the contract sparse set exactly. Gate green, 8681 passed."

