[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "design.md claims `prompt explain` demonstrates single-emit/suppression; it prints the raw ranked set (no suppression)"
detail = """
Expected (design.md): three loci assert `prompt explain` demonstrates the fix — §Target behaviour ("Verified corpus-wide: `prompt explain` shows no exposed slot doubling", ~L92), §Verification/E2E ("`prompt explain` shows framework role/worker suppressed, not rank-ordered-but-present", ~L164-167), §Corpus check ("in-repo, `prompt explain` across a full context shows no exposed slot double-emitting", ~L180-181). Same wording rides plan.toml PHASE-02 EX-2.

Observed (empirical, built binary on review/193): `prompt explain --role worker` over a projected corpus prints BOTH `role/worker` prov=Framework rank=1 AND prov=User rank=2 ★ WINNER — the raw ranked active set. The `replaces` suppression graph is NOT applied by explain; the framework twin is present, ordering-ranked only. Suppression is a resolve-time operation: `prompt resolve --role worker` emits the user body exactly once. The implementation correctly verifies single-emit over `prompt resolve` (e2e VT-4 `exposed_slots_single_emit_all_five`) and the implementer left an in-test comment noting explain "prints the raw active set, ranked-but-present". So the CODE is right; the DESIGN PROSE names the wrong verb. `prompt explain` cannot demonstrate suppression — it is a pre-suppression diagnostic."""
disposition = "design-wrong"
response = "Observation confirmed — the code is correct (verifies over `prompt resolve`), the design PROSE names the wrong verb. Per-slice design.md defect, reconcile's DIRECT-EDIT surface (not governance/REV). Remediation delegated to /reconcile via the Reconciliation Brief: rewrite the three `prompt explain` loci in design.md (§Target behaviour, §Verification/E2E, §Corpus check) to `prompt resolve` — the verb that applies the `replaces` suppression graph — and reframe `prompt explain` as a pre-suppression diagnostic (raw ranked set). The identical wording in plan.toml PHASE-02 EX-2 is OFF-SURFACE (immutable-append; not a reconcile direct-edit target) — flagged as a design/plan note, not edited. Finding terminal-verified; the observation stands, remediation is reconcile's."

