id    = 306
slug  = "sl-229-post-implementation-audit-pre-design-research-stage-v1-vs-designplan"
title = "SL-229 post-implementation audit: pre-design research stage v1 vs design/plan"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-229"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected: PHASE-03's four consumption hooks visible to agents (EX-2 contract). Observed: absent from every harness-visible copy — the slice's mechanism is inert, including in this repo."
detail = "PHASE-01 (73b6c29d) and PHASE-02 (14a9f9f8) are ancestors of tag v0.31.0; PHASE-03 (64fcc7ad) is not (`git merge-base --is-ancestor` YES/YES/NO). `.claude-plugin/marketplace.json` sources `repo: davidlee/doctrine, ref: main` at version 0.31.0, and 64fcc7ad is on local `edge`+`main` only — not `origin/main`. Consequence, measured in the live cache this very session loads its skills from: `/home/david/.claude/plugins/cache/doctrine/doctrine/0.31.0/skills/research/SKILL.md` EXISTS (PHASE-02 shipped), but grep for 'slice research|/research' in the cached slice/design/plan/phase-plan SKILL.md returns 0 matches in all four. So `/research` is installed and nothing points at it: no agent — in this repo or any other — is told to run the pre-design round. PHASE-03 EX-2 ('installed copies match plugins/ masters for research + the four hooked skills') is unsatisfied under notes.md D-a's own reinterpretation (contract = the harness-visible copy matches its master). The authored masters are correct; the gap is purely distribution. Fix is a release action (promote edge, push origin/main, bump the marketplace/plugin version per CHR-045, re-cut the tag, `claude plugin update`) — not a code change."
disposition = "follow-up"
response = "Confirmed exactly as raised; routed to CHR-048 (release SL-229's consumption hooks), operator decision. Not fix-now: the remediation is a release action — promote edge, push origin/main, just release <bump>, claude plugin update — and just release-check runs a hermetic nix flake build, with nix absent from this jail, so it cannot be executed from the audit context at all. Not tolerated: this is not accepted drift, it is scheduled work with an owner; the authored masters are correct and complete, and the repo already batches skill releases rather than cutting one per slice (CHR-045 is open on the version-bump half of the same cadence). The operator was presented with both routes — hold the close for a host-side release, or close with the release tracked — and elected to close with it tracked. CHR-048 carries the exact verification recipe (re-grep the four cached hook files against their masters post-update) so the claim can be settled mechanically rather than re-derived."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Expected: design § Verification alignment VH — 'one further real slice driven through the round, observations to RFC-011 case-notes'. Observed: no such slice exists; the VH is unevidenced at audit."
detail = "`ls -d .doctrine/slice/*/research` returns only SL-229's own dogfood dir (and SL-055's unrelated pre-existing scratch). SL-228 — designed, planned and moved to ready/started AFTER 64fcc7ad landed (70cf9ea5, 7fe780182) — has no research/ dir and did not run the round. The design's own closure intent ('Closure evidence includes at least one real slice driven with the research round, with token/friction observations recorded to RFC-011 case-notes' — scope § Verification/closure intent, restated in design § Verification alignment VH) therefore has zero evidence. Causally downstream of F-1: with the hooks absent from every harness, no agent is prompted to run the round, so the VH cannot be gathered by the mechanism the slice shipped — only by a human deliberately invoking /research. This is also the evidence R1 ('advisory hooks may under-deliver without enforcement') was to be judged on: R1 is not merely carried, it is currently untestable."
disposition = "follow-up"
response = "Confirmed: the VH is unevidenced at close, and the slice does not claim otherwise. Routed to CHR-048 step 4, which is where the evidence can first exist — F-2 is strictly downstream of F-1, since no agent is prompted to run the round until the hooks are distributed. Not tolerated: tolerated means consciously accepted drift, and this is deferred evidence with a named trigger, not drift. Not fix-now: satisfying it means driving a further real slice through the pre-design round end-to-end, which is a slice of work, not an audit repair. What the slice DOES have as closure evidence is the dogfood round on SL-229 itself — research/research.md with its raw/ thread output, cited throughout design.md, and the round that surfaced the pre-existing SL-055 storage convention and thereby overturned the scope's original state-tier+symlink wording (D1). That is real, and it is why the mechanism is credible; it is simply not the independent second datapoint the VH asks for. Consequence to carry forward: R1 (advisory hooks may under-deliver without enforcement) stays open and, until CHR-048 lands, untestable — so the RFC-011 eval that was to decide whether harder gating needs an ADR cannot yet run."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected: the one genuine undeclared touch declared as a design-target. Observed: .doctrine/adr/001/layering.toml edited in PHASE-01 but absent from both the selector registry and design § Code impact summary."
detail = """73b6c29d touches 6 files; 5 are declared design-targets, the 6th is `.doctrine/adr/001/layering.toml` (adds `research = "leaf"` and bumps the leaf count 31→32). It is a required, entirely predictable consequence of introducing a new module — the `architecture_layering` gate fails `Unclassified` without it (notes.md 'Learned', case-notes [SL-229-PHASE-01-a1f]) — yet neither design § Code impact summary nor slice-229.toml's 15 selectors name it. It surfaces as the single genuine `undeclared` row in `slice conformance` (the other 18 are noise — see F-4). Load-bearing fix is the selector registry (`doctrine slice selector add`), which is what conformance reads; design § Code impact summary is the human mirror. Prose alone leaves conformance red."""
disposition = "verified"
response = "Observation confirmed; remediation delegated to /reconcile — see § Reconciliation Brief, Per-slice (direct edit). Two writes, in order of authority: (1) the load-bearing one, 'doctrine slice selector add 229 .doctrine/adr/001/layering.toml --intent design-target' (or the CLI's actual flag shape) — the registry is what slice conformance reads, so prose alone leaves the row red; (2) the human mirror, a row in design.md § Code impact summary. Not fix-now: slice-229.toml and design.md are per-slice authored artefacts, which D3 assigns to reconcile's direct-edit surface, not audit's. Deliberately NOT touching plan.toml — no criterion changes, and criteria ids are immutable-append. Worth carrying into the design's own lesson: a new src/ module ALWAYS implies an ADR-001 layering.toml entry (the architecture_layering gate fails Unclassified without it), so any future design declaring a new module should declare that path as a design-target up front."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected: slice conformance yields a mechanical verdict an auditor can read. Observed: 18 of 19 undeclared rows are foreign commits swept in by shared-edge boundary ranges; the algebra had to be reconstructed by hand."
detail = "`.doctrine/state/slice/229/boundaries.toml` records wall-clock ranges (provenance=solo, code_start_oid stamped at in_progress, end at completed): PHASE-01 203bbd83..73b6c29d also contains 8e8a4c45 (SL-227 audit); PHASE-02 90ea2d6b..14a9f9f8 also contains 434c5f75 (ISS-238); PHASE-03 b627cb02..70cf9ea5 also contains 74274d3d + 70cf9ea5 (SL-228). Those foreign commits contribute all 18 non-SL-229 undeclared rows (backlog 312/313/238, review 302, slice 227/228 metadata, RFC-011 case-notes). Verifying the real touch-set required three `git show --stat` calls and per-row adjudication. Root causes are already known and open — IMP-175 (solo phase-binding stamps a start oid that goes stale when edge advances mid-phase) and IMP-292 item 1 (`.doctrine/**` authored metadata should be classified out of the algebra, not reported as scope creep). SL-229 reproduces both exactly; the value here is the second independent datapoint, not a new defect."
disposition = "follow-up"
response = "Confirmed and reproduced, but neither root cause is SL-229's to fix, and both are already owned: IMP-175 (solo phase-binding stamps a code_start_oid that goes stale when edge advances mid-phase — the mechanism producing the wide ranges here) and IMP-292 item 1 (.doctrine/** authored metadata should be classified out of the conformance algebra rather than reported as scope creep — the mechanism turning those foreign commits into 18 undeclared rows). SL-229 contributes a clean second datapoint on a SOLO (not dispatched) slice, which matters: IMP-175's evidence was SL-138 and IMP-292's was the SL-219 dispatch funnel, so this shows the defect is not funnel-specific. No new item minted — a third duplicate would dilute, not sharpen. Not tolerated-as-drift: the underlying conformance verdict is clean once adjudicated (12/12 design-targets delivered, 0 undelivered, exactly 1 genuine undeclared row — see F-3)."

[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Expected: D1's 'end-of-slice harvest is explicit' backed by a surface an agent actually reads at close. Observed: the claim lives only in /research; neither /close nor /harvest mentions the artefact, so a gitignored, disposable evidence doc evaporates unnoticed."
detail = "D1 justifies storing research/ gitignored-in-place partly on 'harvest at close is explicit', and /research's SKILL.md states 'Runtime tier: disposable working evidence; durable findings are harvested at slice close.' But `grep -rn research plugins/doctrine/skills/close/SKILL.md plugins/doctrine/skills/harvest/SKILL.md install/harvest.md` returns nothing, and the only five skill masters mentioning research at all are research/slice/design/plan/phase-plan. The agent running /close or /harvest is never told the artefact exists, and it is invisible to `git status` (.gitignore:48) — so the failure is silent. Note the risk is real but bounded: research.md is derived evidence whose conclusions should already be cited into design.md, so what is lost is the audit trail and the raw/ thread output, not the design rationale itself."
disposition = "follow-up"
response = "Accepted as a real gap, routed to IMP-314. Not fix-now: /close and /harvest are outside the four hook targets D-locked by design § Consumption hooks, so a fifth hook is a scope extension, not an audit repair — and it would land in the same undistributed state as F-1, so fixing it now would buy nothing observable. Not tolerated: it is a genuine unimplemented leg of D1's rationale, owned and scheduled, not accepted drift. The design prose is not wrong, only ahead of the implementation — D1 says harvest is explicit and /research does tell the reader so; what is missing is the close-side reminder. Bounded blast radius: research.md's conclusions are cited into design.md by the /design hook's own discipline, so what an unharvested slice loses is the audit trail and raw/ thread output, not the design rationale."

[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "Expected: this repo fills the § Research agents socket the shipped skill points at. Observed: .doctrine/governance.md has no such section — doctrine's own dogfood runs the graceful-degradation path."
detail = "PHASE-02 added the socket to the TEMPLATE (`install/governance.md`, verified present in the published asset via `library show reference/governance.md`), which is correct and POL-002-clean. But /research tells the agent 'see the project governance doc's Research agents section', and `grep -c 'Research agents' .doctrine/governance.md` = 0. This repo's actual research convention lives in CLAUDE.md ('DON'T use subagents; use ./scripts/pi-scout or ./scripts/pi-research'), which the skill does not name. So doctrine — the one project guaranteed to exercise this skill — resolves the pointer to nothing and falls through to 'run the threads yourself'. Note .doctrine/governance.md is user-owned and not overwritten by install, so this is an authoring omission, not a projection defect; a four-line section pointing at the two scripts closes it."
disposition = "fix-now"
response = "Fixed in this audit. Added a § Research agents section to .doctrine/governance.md naming the two project runners (./scripts/pi-scout for the cheaper code-map thread, ./scripts/pi-research for governance applicability / judgement threads), their stdin/arg-and-stdout contract, the raw/<thread>.md capture destination, and the repo's standing 'no harness subagents for research' rule. Regenerated the boot snapshot from the in-tree binary (boot --check now reports in sync), so the section is live in every subsequent session's prefix and /research's pointer resolves. In-scope for audit: this is a project-local pointer file, user-owned and seeded-once, NOT a REV-governed governance entity (ADR/POL/STD/spec) — the fix-now ban on governance edits protects those, which route through /reconcile. Residual noted, not fixed: CLAUDE.md § Research carries the same guidance, so the runner choice is now stated twice. Deduplicating a user-owned file is the user's call, not the auditor's."

[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "Expected: an agent reading .doctrine/glossary.md sees the research/ layout line PHASE-02 authored. Observed: the tracked on-disk copy is many releases stale and install no longer refreshes it — pre-existing SL-227 fallout, surfaced here."
detail = "PHASE-02's glossary line is present in `install/glossary.md` and in the published asset (`library show reference/glossary.md` line 111-113, from the freshly-built in-tree binary) — the deliverable is correct and reachable. But the tracked projected copy `.doctrine/glossary.md` still shows the old bare `- ./research/*` bullet, and is stale far beyond this slice: it is missing the entire knowledge-record kind table (ASM/DEC/QUE/CON/EVD/HYP) and the knowledge lifecycle vocabulary. `install --dry-run` post-SL-227 emits only `doctrine.toml` and `project-orientation.md` — reference docs are no longer projected, so this copy can never refresh. Meanwhile boot's 'Reference docs (read on demand): glossary.md' invites agents to read exactly that stale file (this auditor read the sibling .doctrine/review-ledger.md on the same instruction). Not SL-229's defect — SL-229 merely exposed it — but 9 tracked, stale, agent-facing files is a live correctness hazard that belongs in the backlog next to IMP-312."
disposition = "follow-up"
response = "Confirmed, and wider than first raised: five of the nine projected reference docs under .doctrine/ are stale against their install/ masters (glossary, review-ledger, using-doctrine, routing-process, dispatch-mechanics); harvest/boot-footer/model-band are current; governance.md differs by design as a user-owned seeded file. Routed to IMP-315 with three options (delete + repoint boot at library show / restore reference-tier projection / doctor stale-detection). Out of SL-229's scope entirely — this is SL-227 minimal-projection fallout that SL-229 only exposed, and SL-229's own deliverable is verified correct and reachable at both surfaces that matter (install/glossary.md master, and library show reference/glossary.md from a fresh binary)."

