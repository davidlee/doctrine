[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "RefreshOutcome's doc comment (EX-7's required refresh) documents Claude's payload as the enum's contract; the Codex arm carries only the shell wrapper line"
detail = """
EXPECTED. PHASE-02/EX-7: "The stale doc comments the design names are refreshed to describe both harnesses: RefreshOutcome (src/boot.rs:940), RefreshReport.mcp (:1787), the wire() MCP block comment (:2851)."

OBSERVED. `src/boot.rs:973-974` reads: "What the hook merge did, for reporting. The carried string is the full rendered invocation (command plus args), never re-appended by the caller."

That is true of the Claude arm only. The Codex arm carries `CODEX_MCP_WRAPPER` — the shell's `args[1]` alone (`src/boot.rs:2395-2399`), i.e. `exec "${DOCTRINE_BIN:-doctrine}" serve --mcp` — which is neither the command (`sh`) nor command-plus-args (`sh -c '...'`). The design's own message contract (sec-5.2) shows `<wrapper line>` for Codex, so the code is right and the comment is wrong.

IMPACT. The comment is the guard against the exact defect DEC-325/PHASE-01 fixed (a caller re-appending ` serve --mcp`); it now documents one arm's meaning as the enum's invariant on a `pub(crate)` enum whose two consumers disagree. The `RefreshReport.mcp` comment (EX-7's other line) was refreshed correctly for both harnesses — this one was not.

FIX. State that the payload is the arm's own rendered string, printed verbatim by the caller: the Claude arm's full invocation, the Codex arm's shell wrapper line."""
disposition = "fix-now"
response = """Accepted. One doc comment, and EX-7 is the criterion that asked for exactly this refresh, so it is a fix before the phase batch closes rather than a follow-up. Replacement wording: "What an install leg did, for reporting. The carried string is the arm's own rendering, printed verbatim by the caller and never re-appended: the full invocation (command plus args) for the Claude arm, the shell wrapper line for the Codex arm." Also drop the stale "hook merge" framing while the line is open — `RefreshOutcome` is also the baseref/mcp/extension outcome."""

