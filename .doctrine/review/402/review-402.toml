[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "The hooks probe answers for the user codex layer, not the project file the notice names — `Enabled` suppresses step 1 for a project that disables hooks"
detail = '''
EXPECTED. PHASE-03's objective is "Probe codex hooks state from the harness itself … fold the answer into the install disclosure"; design sec-5.2 says the probe's `cwd` is "the install root, so the probe answers for the project being installed"; PHASE-03/EX-4 runs `codex features list` with cwd bound to the install root. The disclosure step 1 the probe gates is about the PROJECT file: "Ensure [features] hooks = true in .codex/config.toml" (`src/boot.rs:3073-3084`).

OBSERVED. `codex features list` (codex-cli 0.155.1) applies the project layer `.codex/config.toml` only when the project is TRUSTED. At install time it never is: the notice's own step 2 is "Start codex in this project and accept the project trust prompt", and the trust caveat this slice adds (`src/boot.rs:3309-3314`) states "codex loads project-scoped config only for projects you have trusted; an untrusted project's layer is skipped silently". So the probe's answer is the USER layer (`$CODEX_HOME/config.toml`), not the file the notice names.

Evidence — a 2x2 run in the jail, codex-cli 0.155.1, cwd = a project whose `.codex/config.toml` is exactly `[features]\nhooks = false`:

  control   (CODEX_HOME config has no [projects] entry)                -> `hooks  stable  true`
  treatment (CODEX_HOME config adds [projects."/tmp/ptest"] trust_level = "trusted") -> `hooks  stable  false`

Same cwd, same project file, same binary; only the trust entry moved the answer. The project layer is trust-gated, and install runs before trust.

Consequence, observed live on a fresh root (`boot install --agent codex -y -p <tmp>`):

    codex: wrote .codex/hooks.json. To activate:
      2. Start codex in this project and accept the project trust prompt.
      3. Run /hooks in codex to trust all three doctrine hooks — the

Step 1 is absent because the probe said `Enabled` (the user layer's value). For a project whose `.codex/config.toml` disables hooks, the operator is therefore never told to check `[features] hooks = true`; once they follow step 2 the project layer takes effect and the doctrine hooks stay off, silently. That is precisely the failure POL-003 facet 3 and DEC-329 exist to prevent, and the probe's premise is invalidated by the very next step the notice prescribes: the answer is a snapshot of the pre-trust state that step 2 changes.

The `Disabled` arm is wrong in the other direction too: its remedy names the project file ("Enable [features] hooks = true in .codex/config.toml (currently off)") while the finding it reports is the user layer's.

WHY NO TEST CAUGHT IT. PHASE-03/VT-2 exercises injected-runner fakes only — the fake supplies the answer, so nothing can observe what real codex would have said for a given project; VT-3 pins only the PATH-empty failure. No unit or e2e case plants a project `.codex/config.toml` with `[features] hooks = false` and asks what the probe reports.

DISPOSITION SOUGHT. `design-wrong`: the code implements PHASE-03/EX-4 as written; the defect is the probe's input choice in DEC-329 / design sec-5.2, whose stated intent ("the probe answers for the project being installed") is falsified by the trust gate. A code-only fix is not available — either the probe reads the project file's `[features] hooks` key directly (doctrine reads that file already) or step 1 stops being probe-gated pre-trust; both are design changes, and either way the design's claim must be amended before this slice closes, or canon ships a disclosure rule that is wrong in the case it was written for.'''
disposition = "design-wrong"
response = """
Accepted in full, and the evidence is decisive — the 2x2 is not explicable any other way than the trust gate, and the design's own sentence ("the probe answers for the project being installed") is the thing that is false.

This is `design-wrong`, not `fix-now`: PHASE-03/EX-4 is implemented exactly as authored, so there is nothing to edit in the code without first deciding what the probe should mean. The decision to reconcile is DEC-329's input choice in design sec-5.2/5.4, and the design's stated intent must be corrected whether or not the mechanism changes.

Route for reconcile (my recommendation; the design pass owns the decision):
(a) Read the project file's `[features] hooks` key directly — doctrine already reads and writes `.codex/config.toml`, so the disclosure question becomes a file question with no trust dependency and no subprocess. Cost: the probe seam, `CaptureRunner` and the captured `codex features list` shell lose their reason to exist; PHASE-03 shrinks instead of growing. It also removes F-5's host-tool dependency by construction.
(b) Keep the probe, drop the gate: always print step 1 with the probe's answer as a rider ("hooks are currently enabled in your user codex config"), which states what the probe can actually know and never suppresses the instruction.
(c) Keep the probe and `cwd`, and amend sec-5.2 to say what it truly answers (the user layer, pre-trust), accepting the silent-hooks hole.

I do not favour (c): it keeps the defect and only corrects the documentation, which is the failure mode the review exists to prevent. Recommendation is (a), with (b) acceptable; (c) only with a stated rationale.

Also required by this finding, whatever the mechanism: a test that plants a project `.codex/config.toml` with `[features] hooks = false` and asserts the step-1 instruction is still delivered. The existing VT-2/VT-3 cannot fail on this because the fakes inject the answer.

No design change is recorded here — this is the responder's position on the disposition, and /reconcile writes it."""

