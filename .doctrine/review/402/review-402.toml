[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "The Codex MCP report ladder duplicates the writeln! four ways, and its Wired and Refreshed lines are identical"
detail = """
EXPECTED. PHASE-02/EX-6: "For Codex the wrote-line prints iff report.mcp is Wired or Refreshed AND not dry_run, stating what was written" — and the report is the operator's only signal for what the leg did.

OBSERVED. `src/boot.rs:3266-3299`: the `Wired` and `Refreshed` arms each branch on `matches!(h, Harness::Codex)`. The two Codex branches are byte-identical — both print `"  {tag}{}: {codex_verb} {mcp_rel}: {cmd}"` with the same `codex_verb` — so refreshing a stale entry is reported exactly as a fresh registration. Claude keeps "registered" vs "refreshed"; Codex loses the distinction while paying four `writeln!` call sites for two messages (the pre-change code used two).

The output itself is per contract (design sec-5.2 shows only the "wrote" form for Codex), so this is raised on the code shape and the lost signal, not on conformance.

FIX. Fold the ladder to one writeln! over a computed `(verb, line)` per harness, and decide whether Codex should keep the wire/refresh distinction its Claude sibling has (a stale entry silently healed is worth saying, since it means the operator's own edit was overwritten)."""
disposition = "fix-now"
response = """
Accepted on the code shape; the four-branch ladder is avoidable and the two Codex branches are literally the same statement. Fix as suggested: compute the line once (`match h` gives the verb phrase; `match report.mcp` gives the tail) and emit a single writeln!.

On the lost distinction I am deliberately NOT changing the output in this pass: design sec-5.2's contract shows one "wrote" line for Codex, so adding a refresh form would be a design divergence made unilaterally. Recommend the design pass take it up with F-1 (both are the Codex disclosure's precision), and if it says yes the second verb is a one-line change."""

