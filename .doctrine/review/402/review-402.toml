[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = """README's "Host dependencies" section declares the MCP runtime's `sh` but not that install executes `codex`"""
detail = """
EXPECTED. POL-002 facet 3 — no *silent* host-tool dependency; PHASE-02/EX-9 chose README's post-install prose as the declaring home, and the "Host dependencies" section (`README.md:160-176`) is that home.

OBSERVED. That section declares only the MCP runtime's `sh`. The install path now also EXECUTES `codex features list` on the installing machine — `codex_hooks_state` (`src/boot.rs:3034-3040`) called from `wire` (`src/boot.rs:3189-3198`) — which is a host-tool dependency of the install command, not of the harness's runtime. It is announced only when it fails (the `Unknown(reason)` arm, e.g. "Failed to run 'codex'…"); the ordinary success is silent. It also mutates user-global codex state: `~/.codex/tmp/arg0` (codex's private helper dir) was rewritten while running `boot install --agent codex -y -p <fresh tmp>` and nothing else (mtime advanced across the single run).

This is a nit rather than more because the dependency is confined to `--agent codex`, where codex is the thing being installed for, and every failure path is disclosed with a reason.

FIX. One sentence in the existing "Host dependencies" section: `boot install --agent codex` probes `codex features list` to report the hooks feature state, and degrades to an explicit "unknown" reason when codex is absent."""
disposition = "fix-now"
response = 'Accepted: one sentence in the section that already exists for this. Note the coupling — if F-1 resolves by reading the project file, the subprocess disappears and this sentence becomes untrue, so the fix should land with (or after) F-1 rather than being written into README twice. If F-1 resolves by keeping the probe, the sentence is: "`boot install --agent codex` also runs `codex features list` to report the hooks feature state; when codex is absent the notice says so explicitly and the install continues."'

