note = """
RV-402 examined the SL-271 implementation delta (12 commits on slice/SL-271-codex-mcp-registration-during-install in .worktrees/SL-271: src/boot.rs +915/-47, src/install.rs +36, tests/e2e_codex_install.rs +320, README prose) against the locked design dr-01a0e17c rev 44 sec-5.2/5.3/5.4, plan.toml PHASE-01..03 EX/VT rows, and the governance they cite (ADR-001, POL-002 facet 3, POL-003, STD-001, DEC-323/325/328/329/332). Prior review depth (RV-399, 44 design findings) was taken as read: this pass attacked the implementation of the accepted decisions and the implementation's own seams rather than re-litigating the decisions.

Five findings, all verified: F-1 blocker (the hooks probe answers for the user codex layer, not the project file the notice names, because the project layer is trust-gated and install runs pre-trust — design-wrong, evidence a 2x2 codex 0.155.1 trust experiment plus a live install run); F-2 minor (RefreshOutcome's doc comment, EX-7's required refresh, documents Claude's payload as the enum's contract); F-3 minor (three construction sites, two representations, for the MCP PrintedFallback outcome); F-4 nit (the Codex report ladder's four-branch duplication and identical Wired/Refreshed lines); F-5 nit (README's Host dependencies section does not declare that install executes codex). Three code paths were probed and found sound: the strict ownership formula and its index guards (classify_codex_entry, including args arity, extra keys, non-table entries, inline parents), the edit-preserving write (comments/siblings/[features] preserved, byte-stable second run, non-UTF-8 left untouched), and the Claude payload refactor's behaviour preservation (payload derived from desired_mcp_entry, printed once, plan_mcp_* suite unchanged). Evidence ran as executables, not recollection: cargo test --bin doctrine codex (22 pass), --test e2e_codex_install (12 pass), --test architecture_layering (25 pass), plus live boot install runs in scratch roots in dry, real, idempotent, non-UTF-8 and foreign states."""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
