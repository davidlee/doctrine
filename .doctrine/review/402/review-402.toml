[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "The MCP PrintedFallback outcome has three construction sites and two representations; the Claude Foreign render is immediately discarded"
detail = """
EXPECTED. PHASE-01/EX-2: "Malformed remains the PrintedFallback sentinel decided before classification" — one representation per outcome, made meaningful at one place. PHASE-01/EX-4: "The PrintedFallback arm and install_mcp keep their behaviour."

OBSERVED. The MCP `PrintedFallback` outcome is now constructed in three places, in two mutually incompatible representations:

1. `plan_mcp`'s Foreign arm fills it eagerly — `mcp_action(class, mcp_fallback_snippet(), MCP_REL)` (`src/boot.rs:2172`).
2. `install_mcp` then discards that value and re-renders the identical one (`src/boot.rs:2214-2217`): `RefreshOutcome::PrintedFallback { .. } => PrintedFallback { hook_file: MCP_REL, snippet: mcp_fallback_snippet() }`.
3. The Malformed paths keep the empty sentinel `mcp_fallback()` (`src/boot.rs:2061-2068`, returned at `:2146`, `:2150`, `:2157`, `:2188`), and `install_codex_mcp`'s Malformed arm builds the variant inline instead (`src/boot.rs:2406-2411`).

So `plan_mcp(x).outcome` is not a well-formed report on its own: for the same variant, `hook_file`/`snippet` are correct-and-then-thrown-away in one branch and empty in three others, discriminated only by whether the caller re-stamps. The Foreign branch's eager render is dead work by construction — `mcp_action(class, String::new(), MCP_REL)` would produce the same net result — and the boundary is a second, unchecked construction site for values the planner already knew.

IMPACT. This is the drift class the slice itself acted on (`DEC-332`): two sources for one value, reconciled by a caller's re-stamp that nothing enforces. A future planner arm that forgets the boundary re-stamp reports an empty snippet rather than failing.

FIX. Pick one convention — either the sentinel is always empty and the boundary alone annotates (then drop the eager render at `:2172`), or every planner fills it and the boundary stops re-stamping — and make the boundary the single constructor for both arms."""
disposition = "fix-now"
response = """Accepted; the finding is exact (the Foreign render at `:2172` is dead by construction, and `install_mcp` is a second unchecked constructor). Cheapest coherent fix, keeping the sentinel convention PHASE-01/EX-2 named: `plan_mcp`'s Foreign arm becomes `mcp_action(class, String::new(), MCP_REL)` alongside the other sentinel returns, and `install_mcp` stays the single boundary that annotates. That leaves one representation and one construction site per arm. Worth doing now because the alternative — filling at plan time everywhere — would re-open EX-2's "sentinel decided before classification" wording, which is the design's call, not ours."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """Accepted; the finding is exact (the Foreign render at `:2172` is dead by construction, and `install_mcp` is a second unchecked constructor). Cheapest coherent fix, keeping the sentinel convention PHASE-01/EX-2 named: `plan_mcp`'s Foreign arm becomes `mcp_action(class, String::new(), MCP_REL)` alongside the other sentinel returns, and `install_mcp` stays the single boundary that annotates. That leaves one representation and one construction site per arm. Worth doing now because the alternative — filling at plan time everywhere — would re-open EX-2's "sentinel decided before classification" wording, which is the design's call, not ours."""

