detail = """
Expected: scratch-repo fixtures are independent of the developer's git config and doctrine env.
Observed: `git.rs` `ScratchRepo::git`, `BareRemote`, `common::git`, `LinkedTrees`, the four memory.rs git fixtures (GitScratch ~6009, temp_project_with_* ~9191/10268, temp_root_seeded ~11258) and review/tests.rs git closures (~1532, ~3591, ~3674) pin only commit dates; production `run_git_env` (src/git.rs:503) forwards the whole process env.
Evidence (reviewer runs): injecting `commit.gpgsign=true` via GIT_CONFIG_COUNT fails 91/130 git::tests; `DOCTRINE_TRUNK_REF` set fails 4 `trunk_entity_ids_*`; `DOCTRINE_AGENT_ID` fails `resolve_holder_falls_back_to_git_config_identity`. Host `core.hookspath` runs the user's global post-commit hook on every fixture commit (that hook already special-cases temp repos). memory.rs fixtures call `.output().unwrap()` without checking exit status, so a refused commit passes silently.
Only src/dispatch.rs:11098 isolates GIT_CONFIG_GLOBAL.
Direction: one hermetic scratch-repo type in src/test_support.rs (shared by bin + integration tests) and a `.cargo/config.toml` `[env]` block (GIT_CONFIG_GLOBAL=/dev/null, GIT_CONFIG_NOSYSTEM=1, LC_ALL=C) — reaches production spawns that fixture-side `.env()` cannot. Pass DOCTRINE_AGENT_ID into resolve_holder as an input, like trunk_ladder.
"""
