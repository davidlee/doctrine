[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Sweep verification permits edits to leave rows"
detail = """
Expected: DEC-341 and SL-273 design I5 require every sweep edit to be authorized by an adjudicated inventory row, including a check that rows marked leave stayed unchanged.
Observed: design.md:376-383 requires checking that applied rows changed and that no diff hunk lacks a row; it does not require unchanged leave rows, and hunk membership is weaker than occurrence membership. A phase-4 worker can turn the slice-artefact `design.md` in install/using-doctrine.md:187-189 into resolving `lib:templates/design.md` despite its leave verdict. The nearby conversion of `glossary.md` at install/using-doctrine.md:191 gives that diff hunk an authorized row. The lib resolver passes, the bare check excludes templates (design.md:157-162), and the audit re-pass exempts text already in target form (design.md:388-393). The unadjudicated semantic change can therefore pass all specified checks. Verify each diff occurrence against its own verdict, including leave rows, and compare the audit inventory against original leave rows.
"""
disposition = "fix-now"
response = """
Accepted. Design sec-5 (section 6.3): verification is per occurrence against each row's own verdict — accept/amend rows read as adjudicated, leave/reject rows unchanged — and every changed occurrence must map to exactly one applied row; hunk co-residence no longer authorises. Mechanical over inventory.toml + git diff, output in notes.md. Section 6.4: the audit re-pass also flags any lib: occurrence at a first-inventory leave/reject location. I5 restated per occurrence (sec-6).
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Accepted. Design sec-5 (section 6.3): verification is per occurrence against each row's own verdict — accept/amend rows read as adjudicated, leave/reject rows unchanged — and every changed occurrence must map to exactly one applied row; hunk co-residence no longer authorises. Mechanical over inventory.toml + git diff, output in notes.md. Section 6.4: the audit re-pass also flags any lib: occurrence at a first-inventory leave/reject location. I5 restated per occurrence (sec-6).
"""

