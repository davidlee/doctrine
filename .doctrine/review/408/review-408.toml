[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Scanner silently validates a truncated citation"
detail = """
Expected: a citation copied from prose must be the same address the check validates (design.md:83-92), and section 3.1 forbids anchors (design.md:80-81).
Observed: the maximal `[A-Za-z0-9_./-]` run at design.md:72-76 stops before `#` or `?`. For `lib:reference/glossary.md#section`, `scan` returns the declared `reference/glossary.md` (publication/manifest.toml declares that address), so `unresolved` reports nothing. But `doctrine library show lib:reference/glossary.md#section` passes the full post-prefix string to LogicalAddress::parse; src/publication.rs:162-172 accepts `#` as a character, and src/publication.rs:500-510 then reports UnknownAddress. The prose check thus claims a citation resolves although the copied citation fails. Reject unsupported suffixes as malformed or define a syntax that consumes and validates them; add a core and doctor test.
"""
disposition = "fix-now"
response = """
Accepted; verified LogicalAddress::parse accepts '#'. Design sec-2 (3.1): recognition takes a whole run up to whitespace, backtick, quote, angle brackets, parens or square brackets, then trims trailing .,;: — a suffix such as #section stays in the address and fails resolution, so the check validates exactly what library show receives. Core test added (4.4); edge case in 7.2.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Accepted; verified LogicalAddress::parse accepts '#'. Design sec-2 (3.1): recognition takes a whole run up to whitespace, backtick, quote, angle brackets, parens or square brackets, then trims trailing .,;: — a suffix such as #section stays in the address and fails resolution, so the check validates exactly what library show receives. Core test added (4.4); edge case in 7.2.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Section 3.1 consumes #section and ?x as part of the address, so unresolved rejects those suffixes; section 4.4 adds the corresponding core case."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Shipped citation test trusts the potentially stale embed"
detail = """
Expected: the finish-line test should compare current shipped prose to current publication declarations, so a removed or renamed address fails immediately.
Observed: design.md:170-179 loads PublicationManifest::load(), which reads the compiled manifest embed (src/publication.rs:340-346), and design.md:125-127 relies on every_shipped_entry_resolves_and_is_mit, which also uses the compiled resolver (src/publication.rs:989-1005). src/asset_source.rs:69-74 explicitly documents that incremental builds can leave RustEmbed data stale and provides disk-source helpers for staleness-proof gates. If publication/manifest.toml removes an address while a prose file still cites it, both proposed resolution tests can pass against the old embed; the disk-source reachability gate checks backing coverage, not citation address membership (src/asset_source.rs:126-153). Admit the manifest from disk for the build-repo citation test, and keep the embedded resolver test for backing availability.
"""
disposition = "fix-now"
response = """
Accepted; verified src/asset_source.rs:69-74. Design sec-3 (4.2): the build-repo test admits the manifest from disk via asset_source::publication_manifest_bytes_from_disk; the doctor leg keeps the embed; backing availability stays with every_shipped_entry_resolves_and_is_mit. R5 mitigation updated.
"""

[[finding.turn]]
