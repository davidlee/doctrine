[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "Revised scanner rejects a previously valid citation before an exclamation mark"
detail = """
Expected: the F-3 repair must consume unsupported address suffixes without making a previously valid citation fail. The pre-revision SL-273 design (a5d7d32e0, section 3.1) scanned a maximal `[A-Za-z0-9_./-]` run, so `lib:reference/glossary.md!` yielded the declared address `reference/glossary.md`; `!` was ordinary sentence punctuation. The manifest declares that address (publication/manifest.toml:309).
Observed: revised design.md:72-80 consumes every non-delimiter character and trims only `.,;:`. It therefore passes `reference/glossary.md!` to `unresolved`, which reports undeclared even though the citation before sentence punctuation resolves. The same regression affects `**lib:reference/glossary.md**` and similar Markdown delimiters outside inline code; scanner recognition is specified independently of formatting at design.md:81-83. Narrow or trim sentence/formatting punctuation without truncating `#section` and `?x`, and cover both cases in section 4.4 tests.
"""
disposition = "fix-now"
response = """
Accepted. Design sec-2 (3.1): after taking the run, trailing sentence punctuation and Markdown emphasis (. , ; : ! ? * _ ~, repeatedly) are trimmed from the end only; inner suffixes (#x, ?x) are kept and fail resolution. Section 4.4 tests cover trailing !, ?, bold, and inner #x / ?x.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Accepted. Design sec-2 (3.1): after taking the run, trailing sentence punctuation and Markdown emphasis (. , ; : ! ? * _ ~, repeatedly) are trimmed from the end only; inner suffixes (#x, ?x) are kept and fail resolution. Section 4.4 tests cover trailing !, ?, bold, and inner #x / ?x.
"""

[[finding.turn]]
