[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Shipped TOML citations escape the enforcing sweep test"
detail = """
Expected: design.md:399-402 and 447-449 promise that the shipped-corpus tests enforce resolution and no bare library mention across shipped prose.
Observed: design.md:170-179 walks only `*.md` under `install` and `plugins/doctrine/skills`. Shipped non-Markdown assets already contain real library citations: install/templates/plan.toml:25 cites `glossary.md`, and install/doctrine.toml:25 cites `claude-activation.md`; install/manifest.toml:11 projects doctrine.toml into every client. The inventory may repair today's instances, but future bare or unresolved `lib:` citations in these shipped comments pass both permanent tests. The roots need text-bearing shipped assets beyond `*.md`, or the invariant and test claim need a narrower explicit boundary with another gate for those assets.
"""
disposition = "fix-now"
response = """
Accepted; verified install/templates/plan.toml:25 and install/doctrine.toml:25. Design sec-3 (4.2): SHIPPED_TEXT_ROOTS walks every file under the roots, not only *.md; a non-UTF-8 file fails by name. Test renamed no_bare_library_mention_in_shipped_text; I2 and verification restated for shipped text.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Accepted; verified install/templates/plan.toml:25 and install/doctrine.toml:25. Design sec-3 (4.2): SHIPPED_TEXT_ROOTS walks every file under the roots, not only *.md; a non-UTF-8 file fails by name. Test renamed no_bare_library_mention_in_shipped_text; I2 and verification restated for shipped text.
"""

