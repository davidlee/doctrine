[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Doctor can report clean after an unreadable authored Markdown file"
detail = """
Expected: STD-003 requires a corpus diagnostic to disclose each degraded read, and SL-273 design.md:188-203 promises a citation check over client `.doctrine/**/*.md` with a manifest-load failure finding.
Observed: the design names only manifest admission failure; it gives no per-file read or glob-error result and tests only the load failure (design.md:205-213, 450-452). The existing sibling walk it reuses silently skips unreadable Markdown at src/doctor_checks.rs:301-321 and returns an empty finding set on invalid glob setup at src/doctor_checks.rs:284-290. A client file containing an unresolved `lib:` citation that cannot be read can therefore produce a clean doctor result if the new leg copies that walk. Require and test a finding naming an unreadable matched file and reason, while continuing over readable siblings, as STD-003 specifies.
"""
disposition = "fix-now"
response = """
Accepted; verified src/doctor_checks.rs:284-321 silently skips. Design sec-3 (4.3): the leg discloses manifest admission failure, glob construction failure, and each unreadable matched file (name + reason) while continuing over readable siblings; it does not copy prose_cite's walk. Tests added (4.4) and verification row updated.
"""

