[[finding]]
id = "F-6"
status = "answered"
severity = "blocker"
title = "The expanded dangler report still silently skips unreadable authored files"
detail = """
Section: sec-3, scan_danglers becomes the rewrite worklist over *.md and *.toml.
Evidence: .doctrine/slice/269/design.md:255-275 changes the glob and canonicalisation but retains the scan reader. src/integrity.rs:421-435 currently continues without any diagnostic when read_to_string fails; src/integrity.rs:393-395 returns success when the resulting hits list is empty. STD-003 requires an authored-corpus read failure to be named and disclosed, and permits a write path to refuse instead of continuing.
Failure: Reseat RV-320 while an authored review TOML containing an inbound RV-320 edge is unreadable or invalid UTF-8. The move succeeds, scan_danglers drops that file, and the command can exit successfully with an incomplete rewrite worklist. Expanding the glob to TOML makes this an explicit structured-edge integrity hole and violates STD-003's no-silent-skip rule.
Repair: Include named read failures in the report and force a non-zero result, or preflight the full scan before committing the move. Preserve the path and underlying read error; add a fixture with one readable citation and one unreadable authored file.
"""
