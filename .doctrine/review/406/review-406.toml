[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "A one-time sibling snapshot cannot cover concurrent legacy writers"
detail = """
Section: sec-2, “sibling dirs are read once because they only matter for claims that predate the ref.”
Evidence: .doctrine/slice/269/design.md:116-132 reads sibling dirs once at backend construction, then only refs per retry. src/entity.rs:548-575 scans, computes max+1 and claims later; src/entity.rs:71-77 shows the older LocalFs writer only creates a directory and emits no ref.
Failure: Two worktrees run different installed Doctrine versions during rollout, or one makes a hand-authored numeric dir. The new process snapshots sibling dirs; the old process then mkdirs SL-270 without a ref; the new process CAS-creates reservation-local/SL/270 and mkdirs its own SL-270. Re-reading refs on retry does not reveal the old writer. A scan immediately before CAS alone cannot make an uncooperative mkdir atomic with the ref CAS.
Repair: State the mixed-version/manual-writer boundary and provide a rollout or reconciliation rule that prevents simultaneous unreserved writers, or a coordination mechanism they can both obey. Do not claim unconditional same-clone collision freedom while that window exists.
"""
disposition = "tolerated"
route = "review"
response = """
Accepted as a stated boundary, not closed. A ref-less mkdir by a pre-slice binary or by hand cannot be made atomic with the ref CAS, and re-reading sibling dirs would narrow the window without closing it. The design no longer claims unconditional same-clone freedom. Its rollout rule is to upgrade every tree of a clone together and not hand-make numbered dirs (sec-2 "Existing claims", sec-8), and the residual is added to DEC-337's. The F-3 repair means CloneRef treats a same-tree occupant as AlreadyHeld. The user accepted this with the design.
"""

