[[finding]]
id = "F-7"
status = "answered"
severity = "major"
title = "Canonical paths can hide an externally symlinked runtime state tree"
detail = """
Section: sec-3, “is_disposable_prose itself is unchanged; only scan_danglers passes it the canonical path.”
Evidence: .doctrine/slice/269/design.md:263-269 makes the canonical path the sole disposability input. src/integrity.rs:443-452 recognises runtime files only when adjacent path components are literally .doctrine/state. glob follows directory symlinks before yielding files (Cargo.lock:610-611 selects glob 0.3.3; its PathWrapper resolves symlinks with fs::metadata at glob-0.3.3/src/lib.rs:336-352).
Failure: A client symlinks .doctrine/state to /tmp/doctrine-state. The proposed glob walks runtime TOML/MD through .doctrine/state, then canonicalises each path to /tmp/doctrine-state/... . The unchanged prefix test returns false, so disposable baton or phase text containing the old ref is reported as an authored citation and may make a completed reseat exit non-zero. The lexical path would have classified it correctly.
Repair: Test both the lexical path and resolved path against the disposable rule, anchored to the project's configured state root, before matching. Include an external-state-symlink fixture alongside the normal phases symlink fixture.
"""
disposition = "fix-now"
route = "review"
response = """
Observation accepted; prescription replaced. canonicalise-and-dedup is dropped. scan_danglers now walks .doctrine/ with walkdir, follow_links(false), and skips symlink entries. A symlinked .doctrine/state is then never entered, and is_disposable_prose keeps running on the lexical path, so the external-state case cannot arise. Every symlink under .doctrine/ is an alias for a real sibling or the phases link (inventoried with find -type l), so nothing authored is lost.
"""

