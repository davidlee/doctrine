[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "A failed local ref update is misreported as contention"
detail = """
Section: sec-2, CloneRef maps git::update_ref_cas Updated/Moved to Won/AlreadyHeld and retries contention.
Evidence: .doctrine/slice/269/design.md:69-74,90-97 chooses update_ref_cas as the arbiter. src/git.rs:1104-1116 converts every non-successful git update-ref exit into RefCas::Moved, using rev-parse only to report the current value; it does not distinguish an expected-old mismatch from lock, permission, or ref-store errors. src/entity.rs:548-582 retries AlreadyHeld and eventually gives a reseat hint.
Failure: A writable tree with a read-only or broken common git ref store attempts a fresh local claim. git update-ref fails for a storage error, is returned as Moved { actual: None }, and the claim loop retries the same id until exhaustion, falsely advising reseat instead of naming the broken store. A confined worker has exactly a read-only common dir; its guard prevents supported mint entry points, but the backend still needs a sound error contract.
Repair: Make update_ref_cas report real Git failures distinctly from a verified current-ref mismatch (or add a strict variant for CloneRef). Propagate storage failures with the Git stderr and ref path; only retry a confirmed rival claim.
"""
disposition = "fix-now"
route = "review"
response = """
Verified at src/git.rs:1104-1116. Integrated: update_ref_cas returns Moved only when the ref has left expected_old; a failure leaving it at expected_old is an error with git stderr and the ref name (sec-2 "A failed CAS is not always a rival"; src/git.rs added to sec-6; test in sec-7). Fixing the primitive, not adding a strict variant, corrects every caller.
"""

