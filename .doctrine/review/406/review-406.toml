[[finding]]
id = "F-5"
status = "answered"
severity = "major"
title = "Reseat cleanup must stop at the commit point and preserve a populated claim"
detail = """
Section: sec-3, “failure after the claim removes the claimed dir, as a failed build does.”
Evidence: .doctrine/slice/269/design.md:215-245 claims an empty destination, renames staging over it, then prescribes removal on failure without a pre-commit boundary or empty-dir condition. src/entity.rs:567-570 is the cited failed-build precedent and uses remove_dir_all. src/integrity.rs:364-386 shows that rename is followed by fallible alias removal/creation and source cleanup.
Failure: If a foreign process populates the empty claimed directory while staging fails, copying the failed-build remove_dir_all cleanup deletes foreign data. If cleanup also runs after a successful rename when alias creation fails, it deletes the newly seated entity. Conversely, after the rename the destination is no longer merely a disposable claim. A directory removed after claim can also make rename create a new destination, so the LocalFs exclusion must be re-established at the commit point.
Repair: Specify a pre-commit-only cleanup guard and remove_dir (empty directory only) for the claim, preserving unexpected contents with an explicit error. Treat post-rename failures as partial committed moves requiring repair, never roll back by deleting dst. Assert the destination is still the claimed empty directory before rename, and test the populated/removed/raced destination cases.
"""
disposition = "fix-now"
route = "review"
response = """
Accepted. sec-3 now splits failure at the commit rename. Before it: the claimed dir is removed with remove_dir (empty only), a populated dir is kept and named, and the remove_dir_all precedent is not copied. After it: a committed move, never rolled back, and the error names the partial state. Flowchart updated; tests for a populated claim and a post-rename alias failure added. A pre-rename emptiness assert was not added: rename(2) already fails ENOTEMPTY on a populated destination. A claimed dir removed and re-made empty by another writer before the rename is covered by the ref under CloneRef/GitRef; that leaves only the non-git LocalFs case, which is negligible.
"""

