[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "The split-state reseat hint cannot repair a missing directory"
detail = """
Section: sec-2, “CAS won, mkdir failed” returns a hard error naming doctrine reseat <REF> as recovery.
Evidence: .doctrine/slice/269/design.md:105-109 explicitly copies GitRef's message. src/reserve.rs:160-171 discards the create_dir error and recommends reseat. src/integrity.rs:286-295 requires a real source directory and readable authored TOML before it can reseat.
Failure: The ref CAS succeeds but mkdir fails because the kind parent was removed, permissions changed, or the filesystem returned I/O error. There is no source directory or entity to reseat, so the prescribed command immediately fails while the reservation ref persists. The error also hides the actual mkdir cause, making repair harder.
Repair: Preserve the mkdir error and distinguish an occupied valid entity from an absent directory. For an absent directory, provide a CAS-checked reservation repair/release or materialisation path; suggest reseat only when its source preconditions hold.
"""
disposition = "fix-now"
route = "review"
response = """
Observation verified (src/reserve.rs:160-171 discards the mkdir error; reseat needs a source dir, src/integrity.rs:286-295). Integrated in sec-2 "After the CAS": one post-CAS mkdir helper for both git backends with an outcome table. It keeps the I/O cause; it suggests reseat only when the dir exists (GitRef occupant); CloneRef treats an existing dir as AlreadyHeld and retries; any other error says the id is burnt and a re-run takes the next one. No repair/release verb was added: an orphan ref is a numbering gap (sec-8), so there is nothing to repair. Tests in sec-7.
"""

