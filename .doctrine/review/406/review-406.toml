[[finding]]
id = "F-8"
status = "answered"
severity = "major"
title = "Canonicalising matched files does not bound symlink traversal"
detail = """
Section: sec-3, “each path is canonicalised and de-duplicated before matching” and “source outside .doctrine/ is not scanned.”
Evidence: .doctrine/slice/269/design.md:263-275 deduplicates only after glob emits a file. src/integrity.rs:415-423 uses glob::glob over .doctrine/**/*.md; the proposed second glob is likewise recursive. Cargo.lock:610-611 selects glob 0.3.3; glob-0.3.3/src/lib.rs:336-352 follows directory symlinks with fs::metadata, and :937-958 descends into them without a visited-directory set.
Failure: A .doctrine/external symlink to a directory outside .doctrine causes the report to read and cite outside files despite its stated bound. A .doctrine/loop symlink back into .doctrine makes the walker revisit the same tree repeatedly before file-level canonicalisation/deduplication, potentially producing a huge scan or an ELOOP failure. File-level deduplication cannot prevent either traversal.
Repair: Bound traversal at the directory level using canonical directory identities and an explicit in-scope policy; do not descend an already visited directory, and decide whether external symlink targets are excluded or expressly reported. Test an external directory symlink and a loop.
"""
disposition = "fix-now"
route = "review"
response = """
Verified that glob follows directory symlinks. Integrated through the same change as F-7: a walkdir walk that does not follow links stays inside .doctrine/ and cannot loop, and it also removes the alias double-count without dedup. The report header states that symlinks are not followed. sec-7 tests an external dir symlink and a loop.
"""

