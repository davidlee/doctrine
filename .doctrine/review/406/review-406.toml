id    = 406
slug  = "design-review-of-sl-269"
title = "design review of SL-269"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Adversarial design pass on SL-269 sec-2 through sec-4. Probed the composed id scan, clone-local Git ref CAS and split-state recovery, subdirectory and symlinked roots, legacy-writer races, reseat claim/rename/cleanup ordering, dangler glob and disposability rules, and every review CLI/MCP write path against DEC-337, DEC-338, ASM-012, ADR-001/006/007, POL-002, STD-001 and STD-003. The eight verified findings are F-1 through F-8. No finding on Git's shared-ref namespace (refs/doctrine is outside the per-worktree exceptions), packed-refs/reftable abstraction via Git plumbing, same-mount staging, exact-target refusal order, or supported MCP review and design-run mint guard coverage. A /tmp glob 0.3.3 probe confirmed external symlink traversal and repeated loop traversal. The review CLI exposes no command to edit the prose Brief, so this conclude basis records the probe scope without a forbidden direct file edit.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-269"

[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "A moved Doctrine root makes the sibling scan miss a live id"
detail = """
Section: sec-2, “each sibling's kind dir is <sibling path>/<rel>/<kind dir>” and the scan closes ISS-279.
Evidence: .doctrine/slice/269/design.md:117-132 fixes <rel> from the invoking tree. src/root.rs:22-50 resolves a project root independently within each tree, and src/entity.rs:242-247 treats a missing kind directory as an empty scan. src/git.rs:1807-1809 lists worktree tops, not their Doctrine roots.
Failure: A live main tree has an uncommitted pre-SL-269 SL-270 at apps/old/.doctrine/slice/270. A linked branch moved that project's root to apps/new and still has max id 269. Invoked from apps/new, the proposed scan reads apps/new in the sibling, finds no directory, then the new ref CAS can win SL-270. The live same-clone collision that ISS-279 targets remains. Symlinked or differently rooted project paths have the same identity problem. This also makes project layout a correctness condition under POL-002.
Repair: Discover and validate each sibling's actual Doctrine root or use an explicit stable project identity/path mapping; treat an unresolved or unreadable live sibling as a disclosed refusal on this write path. Test worktrees whose project-relative roots differ.
"""
disposition = "tolerated"
route = "review"
response = """
The observation holds, but only for ids minted before this slice. The fix is partial. A sibling with no doctrine root at <rel>, or with an unreadable kind dir, is no longer skipped silently: a stderr warning names it (STD-003; sec-2). The remaining case, a pre-slice uncommitted id in a live sibling whose root moved, is added to DEC-337's accepted residual (sec-2 "Existing claims", sec-8, slice R2), with git merge as the backstop and reseat as the repair. Sibling-root discovery was not adopted: it is ambiguous when one repo holds several doctrine projects, and it would make layout guessing a correctness condition. The user accepted this residual widening with the design.
"""

