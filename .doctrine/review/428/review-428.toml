disposition = "fix-now"
response = "Fixed in audit: the assertion message at tests/e2e_install_flow.rs:396 now names `user MCP registration skipped`, restoring the keyword without undoing the shared constant (DRY kept). `doctrine slice verify-vt 286` re-run: all VT PASS incl. PHASE-04 VT-3. Committed with the audit."

