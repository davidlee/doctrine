[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "Empty project `url` classifies Malformed; design table says url → Override"
detail = """
Expected (design.md:81 project table): "`command` contains `/`, or a `url` transport → Override (untouched; reported; not incomplete)"; Malformed = "empty command, wrong types, not a table".
Observed: src/codex_mcp.rs:394-400 sends `url = ""` (and non-string url) to Malformed, which holds install incomplete; pinned by classify_project_malformed_when_url_is_empty. An empty string is not a transport, so Malformed is the coherent reading (parallel to empty command), but the design table does not say so and no DEC records it."""
disposition = "design-wrong"
response = "Code reading is coherent (empty url ≅ empty command). Reconciliation Brief § Per-slice: design.md project table — Override needs a non-empty string url; an empty or non-string url is Malformed."

