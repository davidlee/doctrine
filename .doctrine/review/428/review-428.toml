[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Daemon hint after removal-only success: design scopes it to user writes"
detail = """
Expected (design.md:142): "Every user write is followed by the daemon hint".
Observed: src/codex_mcp.rs:884 emits the hint when `wrote_user || !touched.is_empty()` — also after a removal-only success (project wrapper removed, no user write), pinned by execute_removal_only_removes_the_wrapper_without_calling_codex. Not covered by DEC-413 (item 6 covers the removal-only *failure*, no hint). Code rationale: removing the project entry changes the effective config, so a running daemon is stale either way."""
disposition = "design-wrong"
response = """Code is right: removing the project entry changes codex's effective config, so a running daemon is stale exactly as after a user write. Reconciliation Brief § Per-slice: design.md:142 → "every write (user entry or project retirement) is followed by the daemon hint"."""

