id    = 428
slug  = "sl-286-audit"
title = "SL-286 audit"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance self-audit of SL-286 on edge at 08e6f1b74 (code through 9f802dc6a): slice conformance algebra (all undeclared/undelivered leads dispositioned), doctrine check gate re-run (green), slice verify-vt re-run (PHASE-04 VT-3 regression found and fixed; all PASS), codex_mcp + install/boot wiring against design sec-leg/execute/report net of DEC-412/413/414, rootless serve (DEC-405), ADR-001 layering, README/REQ-484/DEC supersession debts from scope §4. First-pass reads by pi, spot-checked.
"""

