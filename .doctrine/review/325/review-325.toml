[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected an exhaustive single disposition; SKILL.md:187-188 is both moved and deleted, and the deletion drops repeat-review guidance"
detail = "The incumbent says both that multiple review/feedback passes may be required and that approval must not be presumed (plugins/doctrine/skills/design/SKILL.md:187-188). The sketch moves the entire :162-191 block to the edge-4 runbook (.doctrine/slice/233/sketches/thin-adapter.md:167,335,469), but separately deletes A s6.a6, explicitly equated to :187-188, as supposedly covered by hymn :24 and Condition::UserAcceptanceAttested (.doctrine/slice/233/sketches/thin-adapter.md:223-225,241,337). The primary diagram repeats both dispositions: edge 4 takes SKILL.md:162-191 (.doctrine/slice/233/sketches/target-machine.d2:412) while D11 deletes A s6.a6 = :187-188 (:190-193; identity at :176). The cited sources only say 'You propose; the user accepts' (install/hymns/stage/design.md:22-24) and refuse terminal advance without acceptance; neither says another adversarial pass may be needed after feedback. Expected: account for :187-188 once and preserve or explicitly reject the repeat-review obligation. Observed: the disposition table double-counts the same lines and its deletion rationale proves only the no-presumed-approval half, so PHASE-08 has no unambiguous contract for whether repeat review becomes an edge-4 step or disappears."
disposition = "fixed"
response = "ACCEPTED, both halves, verified against source. (1) DOUBLE DISPOSITION confirmed: :187-188 sits inside :162-191, which thin-adapter.md:167, :335 and :469 all move wholesale to the edge-4 runbook, while the D11 triage separately deleted it as A s6.a6. That is the same defect as state 8's :26-28 — a range claimed twice in a table VA-4 requires to sum to the incumbent. A s6.a6 is no longer a triage row; :187-188 is now disposed exactly once, as a clause split inside the :162-191 move. Census drops from 2/1/6/1 over ten rows to 1/1/6/1 over nine. (2) HALF-COVERAGE confirmed and it is the more interesting half. SKILL.md:187-188 carries two obligations in one bullet. 'Do not presume approval' is genuinely doubly covered — hymn install/hymns/stage/design.md:24 plus Condition::UserAcceptanceAttested refusing the edge-4 advance — and that clause stays DELETED. 'Multiple passes of review and feedback may be required before acceptance' is covered by nothing. DEC-067's regress PERMITS iteration but a mechanism existing is not the instruction arriving, which is DEC-103's own rule turned back on this sketch's reasoning. It becomes a STEP ON EDGE 4, firing when an agent believes one pass sufficed: 'a single review pass is not evidence of sufficiency; say what a further pass would probe, or why none is needed.' The row had been labelled 'the strongest deletion in the set'. It was the weakest: covered twice on one half, zero times on the other, and that self-assessment is now corrected in place rather than removed. Severity blocker accepted without argument — for a design gate the disposition table IS the deliverable. Repaired in both artefacts: thin-adapter.md (a.2) census, triage table, a new clause-split subsection, and the (a.3) destination table; target-machine.d2 D11 delete bucket, the residue guards node, and the edge-4 runbook node. Diagram recompiles."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Expected DEC-103 to bound point-of-effect delivery; it mandates unbounded serial runbook accretion and D7 calls a 19-step gate cheap without evidence"
detail = "DEC-103 requires every instruction to be delivered where it bites and every multi-hook obligation to be hung at every such moment (.doctrine/knowledge/decision/103/record-103.toml:14-18), but states no admission limit, merge rule, optionality rule, or cost threshold. The primary decision record applies that unbounded rule to edge 3 as 15 content-item steps (.doctrine/slice/233/sketches/target-machine.d2:414-420), while the total disposition adds :197, merged :198+:200-201, :199, :203, and :144-161 at that edge (.doctrine/slice/233/sketches/thin-adapter.md:359-366), i.e. at least 19 required obligations by the sketch's own '15 plus four' framing. This is not merely a large TOML file: the shipped mechanism admits one cursor step at a time (src/design_run/runbook.rs:193-205), renders only that step's text (:435-476), and the request carries exactly one discharge because batching two is forbidden (src/design_run/submission.rs:636-641). Thus edge 3 imposes at least 19 separately named serial mutation/attestation turns before advance. Yet D7 concedes these are coverage sets and asserts an imposed sequence on a 'short list costs almost nothing' without evidence (.doctrine/slice/233/sketches/thin-adapter.md:385-389), directly against DEC-101's retained rule that ordering a coverage set is fake determinism (.doctrine/knowledge/decision/101/record-101.toml:76) and the owning design's named R1 that protocol ceremony can exceed its value (.doctrine/slice/233/design.md:568-572; .doctrine/slice/233/slice-233.md:147-151). PHASE-09 only measures that risk after PHASE-08 implements this shape (.doctrine/slice/233/plan.toml:680-686); it does not supply the missing design bound at this EN-2 gate. Expected: DEC-103/D7 define a bounded admission or aggregation rule (or evidence that this concrete serial ritual is below a stated limit) before the ruling governs this and every later skill rewrite. Observed: timing alone automatically promotes obligations into required single-step gates with no stopping condition, relocating the incumbent attention failure into serial attestation ceremony rather than solving it."
disposition = "accepted — remedy proposed, owner ratification required"
response = "ACCEPTED. Every mechanical claim verified against source. Mode::Sequence is 'a cursor, one step at a time, no skipping' (src/design_run/runbook.rs:201-205); discharge on a submission is an Option, NOT a Vec, because 'a batch of two would need an order Batch explicitly refuses to carry (DEC-063)' (src/design_run/submission.rs:636-641). So nineteen obligations at edge 3 is nineteen serial CAS mutation turns before advance, not merely a long TOML file. The R1 citation lands too: 'protocol ceremony exceeds its value' is this slice's own named risk (design.md:568-572), and PHASE-09 EX-3 measures interaction cost 'on evidence rather than impression' while PHASE-09 EN-1 requires PHASE-08 complete — so the measurement is a post-mortem, not a bound. D7's 'costs almost nothing' was an assertion against a risk the slice had already named. Conceded without argument. THE DEFECT IS REAL AND THE DIAGNOSIS IS EXACT: DEC-103 governs WHEN an obligation is delivered and was silently read as also governing HOW MANY steps carry it. One step per obligation was never the requirement; it was smuggled in. PROPOSED REMEDY — an admission bound: obligations that share a MOMENT and a SUBJECT merge into one step whose text carries the coverage list. Delivery is preserved (the whole list arrives when it bites); ceremony becomes one discharge, not N. This dissolves the DEC-101 tension rather than trading against it — a coverage set expressed as ONE step carrying the set has no order to fake, so the fifteen content items stop being fifteen ordered steps, which is precisely what DEC-101 calls fake determinism. Consequence: set mode is not the missing mechanism it appeared to be, and IMP-373 stays deferred on merit rather than convenience. Edge 3 under the bound is ~6 steps: the content-item coverage set, :197, :198+:200-201, :199, :203, :144-161 — each a distinct subject, none a re-ordering of another. STATUS: the sketch and diagram C adopt the bound (thin-adapter.md new section (a.3.1); target-machine.d2 D13 block and the edge-3 runbook node). DEC-103 does NOT yet carry it — the clause amends an owner ruling and is recorded as PROPOSED pending ratification. I am not amending an accepted owner decision unilaterally to make a sketch consistent. If the owner declines the bound, edge 3 reverts to the nineteen-step shape and F-2 stands unresolved. Flagging that explicitly rather than closing over it."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Expected a reproducible 2a/2b discriminator; observed hypothetical corroborability"
detail = "thin-adapter.md:129-140 calls the split mechanical and sorts by whether a verifier could ever corroborate an obligation; thin-adapter.md:433-438 then infers corroborability from selector existence and later conformance. target-machine.d2:551-577 assigns knowledge capture, semantic scope reconciliation, repeat-pass judgement, and selector recording to 2a, while target-machine.d2:395-400 concedes that none ships a verifier. A trace existing does not mechanically corroborate semantic completeness, and could ever permits an imagined future verifier for almost any lens. The rule therefore cannot reproduce its own assignments. Define 2a by a present objective postcondition and ship its verifier, or define it candidly as a mandatory gate-blocked attestation and justify that ceremony."
disposition = "fixed"
response = """
ACCEPTED IN FULL, and it is the sharpest finding of the review. The diagnosis is exact: 'could ever' admits an imagined future verifier for almost any lens, so the rule could not reproduce its own assignments. Verified: thin-adapter.md sorted by 'whether a verifier could ever corroborate them', DEC-104 carried the same words as its central rule in BOTH tiers (record-104.toml facet and the .md body's 'The discriminator, in one line'), and target-machine.d2 conceded in the same breath that none of the four surviving 2a steps ships a verifier. DEC-104's own consequences already declared this open as a KNOWN WEAKNESS. F-3 found the thing the record flagged and declined to close, which is the harder half of the job.

REMEDY, ratified by the owner 2026-08-01 and applied in both tiers of DEC-104 plus both artefacts. The discriminator becomes: CAN THIS OBLIGATION BE TRUTHFULLY COMPLETED AT A SPECIFIC BOUNDARY, WITH A FINITE RESULT WHOSE COMPLETION IS NECESSARY BEFORE ADVANCING? Yes -> a finite gate-worthy act, 2a. No -> a continuous lens with no truthful completion point, 2b. VERIFICATION STRENGTH BECOMES AN ORTHOGONAL AXIS: a verifier strengthens a discharge from attested to verified; its availability does not decide whether the obligation is a step at all. CODICIL: a 2a step shipping no verifier must state why mandatory attestation earns blocking the edge.

WHY THIS IS THE RIGHT SHAPE RATHER THAN A CHEAPER ONE. The alternative — require every 2a step to ship a verifier — would demote semantic scope reconciliation and knowledge capture to lenses, which is wrong: they are mandatory human acts that genuinely complete at a boundary and merely cannot be machine-checked. Completability gives them somewhere honest to sit. The DischargeOutcome mechanics F-3 leaves standing (three arms in the record, two on the wire, runbook.rs:604-606, 745-752) are still exactly true and still cited — they just grade evidence instead of sorting kinds.

EVERY ASSIGNMENT SURVIVES UNCHANGED. Selector recording stays 2a; the fifteen content items and the adversarial attack surfaces stay 2b; knowledge capture and scope reconciliation stay 2a on the strengthened reading. That is the tell that the original was a sound judgement resting on the wrong reason — and it is also why this is an amendment rather than a re-triage. DEC-104's RULING (a set of heuristics is framing, not a checklist) is untouched.

THE CODICIL IS DISCHARGED, NOT PROMISED. thin-adapter.md (a.3) now carries a per-obligation warrant table for all four unverified 2a steps. Two of the four will say 'attested' exactly as a fragment would, and that is stated rather than disguised: what distinguishes them from a fragment is not the receipt, it is that THE RUN CANNOT ADVANCE until an agent asserts the act is done. A fragment carries no such refusal. Applied at record-104.toml/.md, thin-adapter.md (the discriminator section, the selector-recording warrant, and the reviewer list), and target-machine.d2 D14. Diagram recompiles; corpus validates clean. Commit 6958c635."""

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Expected an atomic obligation rehome; observed deletion before replacement"
detail = "plugins/doctrine/skills/design/SKILL.md:111-113 is the current delivery of the doc-local-acronym qualification rule. thin-adapter.md:358-384 sends it to the boot snapshot but explicitly backlogs the edit, while thin-adapter.md:470-475 removes it from the skill. PHASE-08 already rewrites both the skill and install/routing-process.md (plan.toml:629-645), yet no criterion lands the missing introduction clause. The phase therefore creates an interval with zero delivery for a rule DEC-103 says must arrive where it bites. Land the boot replacement atomically in PHASE-08, or retain :111-113 until the replacement lands."
disposition = "fixed"
response = """
ACCEPTED. Verified against source: SKILL.md:111-113 is the acronym qualification rule verbatim; thin-adapter.md sent it out of the skill and carried the edit as backlog (IMP-376); PHASE-08's exit criteria EX-1 through EX-9 were read in full and NONE lands the replacement. IMP-376 is unscheduled, so the interval is unbounded, not merely an ordering wrinkle.

THE DIAGNOSIS IS THE PART THAT STINGS AND IT IS RIGHT. DEC-103 says an instruction must be delivered where it bites. This phase was about to enforce that principle on every obligation in the incumbent skill while exempting itself for the one obligation it was removing. 'Deletion before replacement' is the correct name for it.

WHAT THE PRIOR REASONING GOT WRONG. The deferral rested on 'a boot-snapshot edit is a governance change touching every agent in every project, and mid-review is the wrong moment' — the same manoeuvre declined for IMP-374. On inspection that is near-vacuous HERE. IMP-376's target is install/routing-process.md:60-63 (the Reference forms paragraph, which already carries the first half of exactly this rule — it governs how a doc-local id is WRITTEN and says nothing about how it is INTRODUCED). PHASE-08 ALREADY rewrites that file (EX-2), and EX-3 already runs the whole delivery tail: cargo build re-embeds, doctrine boot regenerates, doctrine boot --check confirms, doctrine install refreshes the projection. The clause lands in a paragraph already inside this phase's blast radius, with no new machinery, for the cost of two lines. The IMP-374 analogy does not hold: that deferral concerns a file PHASE-08 does not otherwise touch.

REMEDY (owner ruling 2026-08-01): PHASE-08 EX-10 appended. The rule leaves SKILL.md:111-113 and arrives at install/routing-process.md IN THE SAME COMMIT. EX-10 also pins the wording constraint the rehome implies but the sketch never stated — the clause must be framework-level and stage-agnostic, NOT worded as a /design obligation, since its whole warrant is that it applies to /audit reading F- findings, /plan citing OQ-, and every skill putting a bare enumerated id in front of a human. IMP-376 closes with the phase rather than outliving it.

WHAT THIS DOES NOT SETTLE, kept open honestly: whether an obligation placed in the boot snapshot actually FIRES. The snapshot is large and always present, which is close to the ambient delivery DEC-103 distrusts. That is an efficacy question, it belongs to CHR-049 (DEC-079), and it no longer stands between the deletion and its replacement — which was F-4's actual complaint. Applied at plan.toml PHASE-08 EX-10, thin-adapter.md (the :111-113 rationale and the destination table), target-machine.d2. Commit 6958c635."""

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Expected a settled edge-2 asset shape; observed an implementation fork"
detail = "target-machine.d2:547-554 labels the edge-2 runbook proposed and asks whether the two-act residue justifies any runbook. thin-adapter.md:491-506 repeats that the sketch does not settle it, even though thin-adapter.md:462-475 presents the runbook as a destination and PHASE-08 must author the target assets. D14 dissolved D12 original craft-migration warrant but did not decide whether knowledge capture and scope reconciliation remain gate-blocked acts. Settle yes with exact obligations and rationale, or settle no and state where each current obligation is delivered; implementation must not choose this design fork."
disposition = "fixed"
response = """
ACCEPTED, and the framing correction matters more than the fix. Verified: target-machine.d2 labelled the edge-2 runbook 'proposed' and asked the question in the node text; thin-adapter.md said in terms 'This sketch does not settle it'. The sketch had filed that as a DISCLOSURE. F-5 is right that it is not one. A disclosure names something the reader can then judge; this left PHASE-08 — which must author the target assets — to pick between two shapes. Handing a design fork to implementation is the single thing an EN-2 design gate exists to prevent, and dressing it as candour does not change what it is.

SETTLED (owner ruling 2026-08-01): EDGE 2 CARRIES A RUNBOOK, EXACTLY TWO STEPS. It is now answerable on the rule rather than on taste, because F-3's amended discriminator asks whether an obligation completes at a boundary, and both do. inquire.knowledge (:107-109) — the inquiry has produced a determinate set of answers and sweeping THEM is finite, done once, at the moment the stage ends. inquire.scope (:115-116) — reconciling slice-nnn.md against the understanding just accepted is a discrete edit with a determinate subject. A file count is not a reason to demote an act to a lens, which is what 'does a two-act residue justify a third runbook' was really asking.

THE STEP TEXT IS BOUNDED AND THAT BOUND IS LOAD-BEARING. 'Capture everything important' has no completion point and would be a lens wearing a step's costume — the exact failure D14/DEC-104 corrects, reintroduced one edge over. So: 'Record, via /knowledge, what THIS INQUIRY settled that outlives the session' (subject is this run's answers, not the design at large), and 'Update OR EXPLICITLY CONFIRM the slice scope against the decisions this inquiry accepted' — the confirm branch is what makes it finite; without it the step is unsatisfiable whenever nothing changed. The knowledge step deliberately does NOT enumerate record kinds: :107-109 names three of a closed seven, and a skill restating a Doctrine-owned vocabulary is a second source of truth that already disagrees.

WHAT F-5 CORRECTLY DID NOT ABSORB. D14 dissolved D12's ORIGINAL warrant (inquiry craft reaching data, which inquiry.md now satisfies without any runbook) but left the separate question of whether the two acts are gate-blocked. Those are different claims and the finding kept them apart. Both steps are attestation-only and neither ships a verifier; per the F-3 codicil each now carries a written warrant for why mandatory attestation earns blocking the edge — see thin-adapter.md (a.3). Applied at thin-adapter.md (a.3) and target-machine.d2 D12 + the edge-2 runbook node, now labelled SETTLED with both step texts. Diagram recompiles. Commit 6958c635."""

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Expected VA-4 to count all relocated payload; observed TOML-only accounting"
detail = "plan.toml:658 says VA-4 closes the relocation loophole by stating runbook TOML bytes separately. D14 moves most process payload into Markdown fragments, and thin-adapter.md:727-735 explicitly says the gross corpus grows across both TOML runbooks and MD fragments. VA-4 can therefore pass while omitting the majority of relocated bytes, recreating the exact loophole it was amended to close. Require separate byte and line totals for every destination asset kind, including each changed design-prompts Markdown fragment and duplicated content, not only runbook TOML."
disposition = "fixed"
response = """
ACCEPTED, and reading VA-4's text closely makes it WORSE than the finding states. F-6 says VA-4 counts runbook TOML and omits the larger Markdown payload. True — but the defect is not only in the byte accounting. VA-4's DESTINATION VOCABULARY is 'deleted / engine invariant / runbook step, naming the edge / retained as prose'. THERE IS NO 2b FRAGMENT SLOT IN IT AT ALL. So the disposition table VA-4 demands cannot even CLASSIFY the majority destination, let alone total its bytes. A conscientious agent filling that table has no honest row for drafting.md.

THE IRONY IS EXACT AND WORTH RECORDING. VA-4 was amended on 2026-08-01 precisely because the original 'did the body substantially shrink' was defeatable by relocation — under DEC-101 the checklists move to a different FILE, so shrinkage is satisfiable without mechanism. D14 then reopened that same loophole one FILE EXTENSION over: relocation into *.md fragments is invisible to the check written to catch relocation. The sketch compounded it by asserting that stating the two asset kinds separately was 'precisely the manoeuvre VA-4 was amended to require'. It was not — VA-4 requires no such thing, and that sentence read the criterion as the author wished it said. Corrected in place with the misreading named rather than quietly deleted.

REMEDY (owner ruling 2026-08-01): PHASE-08 VA-7 appended, amending VA-4 by the VA-12 precedent in this same plan — append, never renumber. It requires: (1) the destination vocabulary gains 'stage fragment, naming the asset' alongside 'runbook step, naming the edge'; (2) byte AND line totals PER DESTINATION ASSET, not per asset kind and never netted — each runbook and each changed install/design-prompts/*.md carries its own before/after against the shipped baseline; (3) CONTENT DUPLICATED ACROSS DESTINATIONS IS COUNTED IN EVERY DESTINATION AND FLAGGED AS DUPLICATED — :203 lands in both drafting.md and reviewing.md by DEC-103, and a table counting it once understates the very corpus it exists to measure; (4) the totals are stated against the shipped baseline, so 'the gross corpus grows while the skill shrinks' becomes a measured claim rather than the assertion it currently is in the sketch. VA-4's disposition-table requirement and its 'a table that does not sum to the incumbent is incomplete' rule are unchanged and still binding. Applied at plan.toml PHASE-08 VA-7 and thin-adapter.md (d). Commit 6958c635."""

[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "Expected a falsifiable delivery trade; observed measurement without a decision rule"
detail = "thin-adapter.md:591-598 chooses fewer receipts for better odds of attention and admits no test can fail. PHASE-09 plan.toml:683-700 measures interaction cost and generic adherence, while the live CHR-049 record contains no comparison, acceptance threshold, or rollback condition for fragment delivery versus attestations. Those observations cannot falsify the chosen side of the trade, so the post-close exercise can only narrate what happened. Pre-register the compared treatments or baseline, the attention/adherence signal, and the result that would cause the fragment placement to be revised."
disposition = "fixed"
response = '''
ACCEPTED on substance. One correction of AIM that changes where the repair lands, offered as a discrepancy report rather than a defence — the finding's conclusion stands either way.

THE CORRECTION. F-7 locates the absence in CHR-049: 'the live CHR-049 record contains no comparison, acceptance threshold, or rollback condition for fragment delivery versus attestations'. Two facts about that record: its Boundary says in terms 'SL-233 must leave behind the fixture, moderator protocol, scoring rubric, and mechanically collectible evidence surfaces. This chore owns the live run and interpretation' — so a decision rule was never CHR-049's to hold; and it was created 2026-07-27, five days before D14 existed, so it could not carry a trade that had not been made. Reading its silence as the defect would send the repair to the wrong artefact. THE ABSENCE THAT ACTUALLY MATTERS IS THE ONE F-7 ALSO NAMES: neither PHASE-09's criteria NOR the sketch carries a falsifier either. That is real, and it is ours.

WHAT THE SKETCH WAS DOING WRONG, PLAINLY. The trade paragraph stopped at 'no test can fail here. VH-1 is the judge.' That is true of the GATE, and it was quietly doing duty as a reason to state no decision rule AT ALL. Those are different things, and the inference runs the wrong way: an ungoverned artifact is exactly the case where the falsifier must be written down IN ADVANCE, because after the fact any outcome narrates as vindication. F-7's phrase — 'the post-close exercise can only narrate what happened' — is the correct description of what we had built.

REMEDY (owner ruling 2026-08-01), landed in two places. IN THE SKETCH, at the gate that CHOSE the shape: the claim is stated as falsifiable — fragment prose delivered every turn puts craft in front of an agent more reliably than discharged steps at an exit — with three falsifying signals. (i) ADHERENCE: fragment-delivered craft followed no more often than the same content as a step. (ii) RECEIPT CHURN: re-request/re-receipt rates implying the bytes are not read on arrival, which is delivery without attention and is precisely what the trade purchased. (iii) COST: per-turn fragment tokens exceeding the interaction cost of the step shape replaced — the trade was FEWER RECEIPTS, and if it is not also cheaper then attention must carry it alone. The comparison is against the STEP SHAPE, not against nothing: the pre-SL-233 skill baseline, and where a fixture permits, the nineteen-step edge-3 shape D14 rejected. THE REVISION IS BOUNDED AND NAMED IN ADVANCE: a negative result returns the 2b content as a COVERAGE-SET step (one step carrying the list — what IMP-373's `set` mode exists to make honest), NEVER the nineteen ordered steps DEC-101 independently rejects as fake determinism. So a negative result reopens IMP-373 on merit; it does not reopen DEC-104.

IN THE PLAN: PHASE-09 EX-8 appended, requiring all three written BEFORE any run, plus PHASE-09 VA-4 as its anti-theatre check — each signal must name A RESULT THAT WOULD REVISE THE PLACEMENT, not a quantity to report ('we will measure adherence' is not a falsifier), and the baseline must name a concrete artefact rather than an unspecified 'before'. A pre-registration no observation could contradict is EX-8 satisfied in form and defeated in substance. CHR-049 runs it and may not substitute a narrative for the comparison. Applied at thin-adapter.md, plan.toml PHASE-09 EX-8 + VA-4, target-machine.d2 D14. Commit 6958c635.'''

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Expected inquiry framing to be scoped to Inquiring; observed Exploring receives it too"
detail = "target-machine.d2:547-553 describes inquiry.md as delivered every Inquiring turn, and thin-adapter.md:470 moves the clarifying-question body there. src/design_run/prompt.rs:107-113 actually selects Fragment::Inquiry for both Exploring and Inquiring. The rewrite therefore injects one-question-per-message and option-shaping craft during Exploring as well, an additional delivery moment absent from the disposition. State and justify that cross-stage delivery, or split the fragment mapping; do not let it arrive as an accidental consequence of an existing shared variant."
disposition = "fixed"
response = """
ACCEPTED. Verified directly at src/design_run/prompt.rs:107-115: Fragment::for_stage matches Stage::Exploring | Stage::Inquiring => Some(Fragment::Inquiry). One Inquiry variant serves both stages, and the match is exhaustive over Stage by construction, so nothing in this rewrite could narrow it without adding a variant and a fifth asset. Both artefacts said 'delivered EVERY INQUIRING TURN'. That was simply WRONG ABOUT THE MECHANISM, and the consequence is what earns the finding its place: a second delivery moment sat outside the disposition entirely, in a document whose entire job is to account for every delivery moment.

Minor by severity, but it is the same defect class as F-1 and F-4 — an accounting document that does not account for something — and the third instance in this review. Worth saying: all three sat in material no EN-2 question interrogated.

RULED: STATE AND JUSTIFY THE CROSS-STAGE DELIVERY, do not split the mapping. The delivery is WANTED, not merely tolerated. The code gives the warrant in its own words — 'Exploring and inquiring are both question-shaping work' (prompt.rs:109) — and every item moving into inquiry.md holds in both stages: one question per message, two or three options with tradeoffs plus a recommendation, focus on purpose / constraints / success criteria / verification strategy, and :98's multiple-choice preference. None of it is Inquiring-specific. Splitting would cost a new Fragment variant, a fifth asset, and a duplicate of substantially the same prose, to separate two stages that want the same craft. F-8's own remedy admits both routes; this is the cheaper one and it is also the correct one on the merits.

ONE CONSEQUENCE THE FINDING DID NOT NAME AND THE DISPOSITION NOW DOES. Exploring therefore carries BOTH tier-2 asset kinds at once: exploring.toml (shipped, five steps, fired at edge 1) and inquiry.md (every turn). They do not overlap — the runbook's steps are boundary acts (scope, research, canon, memory, triage), the fragment is question craft — and it is the first place in the design where a stage holds both. That is the shape DEC-104 predicts, arriving one edge earlier than the sketch expected, and it is now recorded rather than discovered at implementation. Applied at thin-adapter.md (a.3) and target-machine.d2's edge-2 fragment node. Diagram recompiles. Commit 6958c635."""

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "Expected the amended discriminator throughout; observed the withdrawn test still classifying D14"
detail = "thin-adapter.md:702-706 still says the edge-3 population is sorted by the DischargeOutcome/verifier test and derives one act plus eighteen lenses from it, although DEC-104's amended rule says verification is orthogonal and classification turns on finite boundary completability (knowledge/decision/104/record-104.md:35-46). The same sketch then says only two of four obligations are attestation-only (thin-adapter.md:626-629), while the primary diagram says none of the surviving 2a steps ships a verifier and all four warrants are unverified (target-machine.d2:435-448). Replace the surviving old classifier and reconcile the evidence count so implementation receives one rule."
disposition = "fixed"
response = """
ACCEPTED, and the finding is worth more than the site it names. Both halves verified.

HALF ONE — THE SURVIVING CLASSIFIER. thin-adapter.md still read 'Sorted by the DischargeOutcome test (can a verifier ever corroborate this?), the edge-3 population splits cleanly: one discrete act, and eighteen lenses.' That is the withdrawn rule still performing the classification the F-3 amendment took it out of. Confirmed exactly as cited.

