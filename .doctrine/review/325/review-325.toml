[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "Expected misclassification evidence to support only reclassification; observed premature attestation has another explanation"
detail = "PHASE-09 VA-5 requires each signal's evidence to support only its routed consequence (plan.toml:703), but EX-8(d) treats a 2a discharge before its subject exists as proof the obligation has no real boundary and reopens DEC-104 (plan.toml:692; thin-adapter.md:867). The same observable event is produced when a correctly classified finite boundary act is falsely or prematurely attested—evidence about discharge admission, wording, or adherence rather than classification. The diagram's claim that this conservative signal never fires falsely is therefore unsupported (target-machine.d2:514-525). Re-anchor the 2a half to evidence that discriminates missing boundary from early noncompliance, or relax VA-5 and route the event first to adjudication rather than directly to DEC-104."
disposition = "fixed"
response = """
CONCEDED IN FULL. Fixed at fba4ceb8. This is the sharpest finding of the review,
because the thing it catches is the criterion catching its own repair.

Verified before responding. VA-5 does require each signal's evidence to support
only its routed consequence. EX-8(d) as amended at round 4 did read the raw event
as showing the obligation "has no real boundary -- it was never a step". And the
same observable event is produced by a correctly classified boundary act that was
prematurely attested. The finding is correct on all three legs.

The diagnosis is one step stronger than the finding states, and the extra step
matters for the remedy. There are THREE live causes, not two:

  A  the obligation has no real boundary          -> reclassify to 2b
  B  a correctly classified act, prematurely or
     falsely attested                              -> ordinary noncompliance,
                                                      which is the adherence
                                                      signal, not this one
  C  step TEXT that misled a compliant agent
     about when it completes                       -> reword; the classification
                                                      stands

(C) is the one the finding gestures at with "wording" and it is why a purely
distributional remedy is not enough: a systematically premature discharge is
equally consistent with A and C.

TWO CORRECTIONS, because there were two defects and the finding named one of
each.

FIRST -- THE CONSEQUENCE WAS OVERCLAIMED, and that is the primary defect. A
firing now REOPENS THE DISCRIMINATOR'S APPLICATION TO THAT STEP, and the
reopening admits exactly three outcomes: REWORD, RECLASSIFY, or STAND.
"Reopens" was always the verb EX-8(d) used; the defect was the parenthetical
asserting the event PROVED misclassification, which made reclassification the
only exit and so guaranteed a result the evidence cannot support. That clause is
withdrawn. With the consequence weakened to what the evidence carries, VA-5's
single-consequence requirement is satisfied honestly rather than by narrowing the
evidence until it fits.

SECOND -- THE OBSERVATION NOW CARRIES A WITHIN-RUN CONTROL. Record, at the same
edge and in the same run, how the SIBLING 2a steps were discharged. One step
premature beside correct siblings is step-specific and reaches the discriminator;
everything premature is agent-general, routes to the adherence signal, and
reaches the discriminator not at all. That separates B from {A, C}. An
observation offered with no sibling contrast is now REJECTED AS UNCOLLECTED
rather than weighed -- VA-5 carries that as an explicit check.

SCALE, DISCLOSED RATHER THAN ASSUMED. A cross-run distribution would be the
stronger discriminator, and CHR-049 specifies ONE moderated exercise, so it is
not reliably available. The within-run control is what is collectible at that
scale; cross-run corroboration is recorded as opportunistic. Claiming a
collectibility the exercise cannot deliver would repeat this finding at one
remove, which is the failure mode this review keeps producing.

ALSO WITHDRAWN: the diagram's claim that the conservative signal "never fires
falsely" (target-machine.d2, the F-10 re-anchor block). The finding is right that
it is unsupported. What is true is smaller -- the signal stays SILENT where it
cannot collect, which is not the same property as soundness, and the two were
conflated. Replaced with the accurate statement.

HALF (ii) TAKES THE SAME CORRECTION on both counts. A lone request to gate a lens
is also ordinary confusion; it reopens rather than reclassifies, and it needs the
same contrast against how that run treated the other lenses. Symmetry was not
imposed for tidiness -- (ii) has exactly the same defect and would otherwise
survive the repair to (i).

Landed in PHASE-09 EX-8(d) and VA-5 (appended, ids immutable), the sketch's
signal table and the section beneath it, the diagram's F-10 block, and DEC-104's
reopening consequence.

NOTED FOR THE RECORD, since it is the third time in this review: repairing a
finding reproduced the finding's own defect. Round 3 F-3 attacked an
un-cashable discriminator; the round-4 repair built an un-cashable falsifier for
it; this round's finding catches the round-4 repair overclaiming what that
falsifier proves. The repair above was written against that pattern deliberately
-- which is why the three-outcome resolution set and the collectibility limit are
named in the criterion rather than left to whoever reads the result.
"""

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "Expected a falsifying signal to require revision; observed stand can preserve the placement"
detail = "PHASE-09 VA-4 requires every falsifying signal to name a result that would revise placement (plan.toml:702). After the controlled misclassification signal fires, EX-8 and VA-5 permit reword, reclassify, or stand (plan.toml:692-703; thin-adapter.md:923-931). Reword and reclassify revise the placement or its boundary contract; stand permits the same observation to leave everything unchanged as an anomalous run, with no pre-registered condition distinguishing that exit. The within-run sibling control separates agent-general behavior from step-specific behavior, but at N=1 it cannot rule out anomaly, so stand makes every firing narratable after the fact. Remove stand once the controlled signal fires, pre-register independent evidence that selects it, or stop calling this observation a falsifier and amend VA-4 accordingly."
disposition = "fixed"
response = """
CONCEDED IN FULL. Fixed at a15c81d3. `stand` is removed.

This is the fourth instance in this review of a repair reproducing its own
finding's defect, and the cleanest example of the class: the round-5 fix stopped
the signal over-routing to reclassification by adding an exit that routes it
NOWHERE. F-12 said the evidence supported more than one consequence; the remedy
added a consequence supported by no evidence at all.

Verified before responding. VA-4 does require every falsifying signal to name a
result that would revise the placement. Reword and reclassify both do; `stand`
does not, and nothing pre-registered selected it. And the finding is right about
why the sibling control does not rescue it: at N=1 the contrast separates
step-specific from agent-general behaviour but cannot rule out anomaly, so
`stand` was always reachable for any firing. That makes it VA-5's forbidden
manoeuvre arriving by the opposite door -- not routing a result to the cheapest
revision, but routing it to none.

REMEDY -- the finding's first option, made workable by relocating what `stand`
was there to do.

ONCE THE SIGNAL FIRES, THE PLACEMENT IS REVISED. Two outcomes: REWORD or
RECLASSIFY. No third exit. Rewording a step's text IS a change to its boundary
contract, not a null outcome dressed as one -- VA-5 now carries that as an
explicit check, because "reword" is exactly where a future reader would try to
reinstate `stand` under another name.

THE ANOMALY CONTROL MOVES INTO THE PRE-REGISTERED FIRING CONDITION. That is where
it belonged: an anomaly test chosen after seeing the result is not a control, and
one written before any run is. The signal fires only when all hold:

  (a) the within-run sibling control is satisfied -- the other 2a steps at that
      edge were discharged with their subjects present;
  (b) the run did NOT cross a deliberate context break or resume at that edge.
      This is not a hypothetical exclusion: CHR-049's protocol deliberately
      induces a context break and tests exact resume across it, so the condition
      is identifiable in the run record rather than adjudicated;
  (c) the run was not aborted or restarted mid-edge.

VA-5 additionally rejects a kit that leaves anomaly to post-hoc judgement, on the
ground that it has reinvented `stand` under another name.

WHY REMOVING THE ESCAPE HATCH IS SAFE, STATED RATHER THAN ASSUMED. The two
remaining arms are not equally costly, and that asymmetry is what `stand` was
covering for. Reword is conservative: it improves step text and leaves the
classification standing. Reclassify is the expensive arm. Since the marginal case
lands on the cheap arm, THE COST OF A FALSE FIRING IS A TEXT IMPROVEMENT, not a
wrongly reclassified obligation. A resolution set whose cheap arm is safe does
not need an escape hatch -- `stand` looked necessary only while the two arms were
being treated as symmetric, which they never were.

Landed in PHASE-09 EX-8 and VA-5 (appended, ids immutable), the sketch's
misclassification section, the diagram's F-12 block, and DEC-104's reopening
consequence. The round-5 three-outcome text is left in place with a forward
pointer rather than silently rewritten, so the reduction is visible in the record.
"""

[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "Expected a determinable anomaly control; observed incidental context loss is unobservable"
detail = "The F-13 firing condition excludes deliberate context breaks/resumes and aborts/restarts (thin-adapter.md:968-975; plan.toml:692-703), all events CHR-049 can intentionally identify. It does not exclude incidental context exhaustion or compaction, and neither the run record nor CHR-049's current observations records that event (backlog/chore/049/backlog-049.md:18-25). A run can therefore satisfy the written condition after an unmarked context loss, forcing revision for an anomaly the control was meant to exclude. Instrument every context boundary, bound the exercise below the context window, or define a mechanically observable proxy that makes the firing condition decidable."
disposition = "fixed"
response = """
UPHELD. Every citation checked before repair: thin-adapter.md's firing
condition named only the deliberate break/resume and the abort/restart;
CHR-049's observation list records "refresh and exact resume across a
deliberate context break" and no other context event. Fixed at aaa80ef3,
jointly with F-15.

WHY THIS AND F-15 ARE ONE DEFECT WITH TWO FACES. The round-6 repair narrowed
the EXIT SET and the EXCLUSION SET in a single move, and each narrowing lost
something the thing it replaced had covered. `Stand` covered ANOMALY --
unbounded, and post hoc. Its replacement covers three NAMED events, and the
enumeration omits the commonest one. That is the seventh instance of a repair
reproducing its own finding's defect, and it explains why both findings landed
in the same round: they are the two halves of one over-narrowing. It also
explains why answering them in sequence produces a wrong answer -- see the
interaction at the end.

THE DURABLE FORM OF THE LESSON, RECORDED IN notes.md `## Learned`: when a
repair replaces an open-ended thing with an ENUMERATION, the enumeration is
the new defect surface. Ask what the open-ended version covered that the list
does not.

ONE CORRECTION OF AIM, WHICH CHANGES WHERE THE REPAIR LANDS -- OFFERED AS A
DISCREPANCY REPORT, SINCE THE FINDING'S CONCLUSION STANDS EITHER WAY. The
finding says "neither the run record nor CHR-049's current observations records
that event", which is true, but the run record was never going to. Doctrine
observes WRITES, not an agent's context; there is no journalled event for
compaction to produce. That is the same limit already disclosed for IMP-373's
repayment signal, which is collected from the exercise rather than the journal
because a refusal aborts the write and nothing is journalled. So of the three
remedies named:

  - BOUND THE EXERCISE BELOW THE CONTEXT WINDOW -- rejected. Unverifiable in
    advance, and it would still need an observation to confirm the bound held,
    which is the observation we lack.
  - A MECHANICALLY OBSERVABLE PROXY IN THE RUN RECORD -- rejected, for the
    reason above. There is nothing to proxy from.
  - INSTRUMENT EVERY CONTEXT BOUNDARY -- taken. Its site is the MODERATOR
    PROTOCOL, not CHR-049: that chore's Boundary says in terms that "SL-233
    must leave behind the fixture, moderator protocol, scoring rubric, and
    mechanically collectible evidence surfaces. This chore owns the live run
    and interpretation." The protocol is ours to write. Reading the gap as
    CHR-049's would send the repair to the artefact that merely consumes it --
    the same misdirection F-7 was corrected on at round 3.

THE FIRING CONDITION, AS AMENDED. The signal fires only when ALL hold:

  (a) the within-run sibling control is satisfied;
  (b) the run crossed NO CONTEXT BOUNDARY at that edge -- neither the
      deliberate break and resume CHR-049's protocol induces, NOR AN
      INCIDENTAL ONE (context exhaustion, compaction, or harness-initiated
      summarisation);
  (c) the run was not aborted or restarted mid-edge;
  (d) THE MODERATOR PROTOCOL RECORDED THE CONTEXT STATE across the window
      containing the discharge. Absent that record, (b) is UNDECIDED and the
      observation is UNCOLLECTED, NOT WEIGHED.

(d) IS THE PART THAT ANSWERS THE FINDING, AND IT IS DEFAULT-DENY BY DESIGN.
Widening (b) alone would have left the condition exactly as undecidable as the
finding says it is -- a condition satisfied by the ABSENCE OF A MARK is not
decidable. (d) makes satisfaction require POSITIVE EVIDENCE. The disposal it
uses is not new machinery: it is the same "reject as uncollected, not weighed"
that the round-5 sibling control already imposes on an observation offered
without its contrast.

WHAT THIS NOW OVER-FORBIDS -- ASKED BECAUSE THE PATTERN DEMANDS IT, AND THE
ANSWER IS NOT COMFORTABLE. Default-deny lowers the probability the signal fires
at all, and at N=1 a falsifier that cannot fire is a formality. Two things
bound that, and the second is the honest one: recording context boundaries is a
standing moderator obligation with a named field rather than a lucky
observation, so the deny branch should be rare; and IF IT IS NOT RARE, THE KIT
MUST REPORT ITS OWN DENY RATE. A run whose context state went unrecorded is
evidence the exercise cannot support this signal, and saying so is the outcome
-- not absorbing it into a silence that reads as "the signal did not fire".
VA-5 carries that as an explicit check.

THE INTERACTION WITH F-15, WHICH IS WHY THESE COULD NOT BE ANSWERED IN
SEQUENCE. F-15's repair makes RECLASSIFICATION the default exit of a firing.
That raises the cost of a false firing from a text improvement to a placement
revision -- precisely the cost the round-6 asymmetry claimed the cheap arm was
there to absorb. This finding shows the firing condition cannot currently
exclude the likeliest cause of a false firing. So: tightening the resolution
set while the firing condition stayed undecidable would convert an unrecorded
compaction into a FORCED RECLASSIFICATION; tightening the firing condition
while the resolution set kept an unconditioned cheap arm would only reduce the
frequency of an exit that changes nothing anyway. Each repair is what makes the
other safe, and I would not have shipped either alone.

CONSEQUENTLY THE ROUND-6 WARRANT FOR REMOVING `STAND` LAPSES -- see F-15's
response. `Stand`'s removal survives on a replaced warrant: it was POST-HOC AND
UNCONDITIONED, and anomaly belongs in the pre-registered firing condition,
which is where this repair now puts all of it including the incidental case.
One principle covers both halves of the round-6 over-narrowing: EVERY EXIT AND
EVERY EXCLUSION IS PRE-REGISTERED; NOTHING IS CHOSEN AFTER THE RUN.

LANDED AT: sketches/thin-adapter.md (the firing condition list, and the new
subsection's face-two argument), sketches/target-machine.d2 (round-6 block
marked in place, round-7 block appended -- the diagram governs), plan.toml
PHASE-09 EX-8 (the condition as amended) and VA-5 (check (4): confirm the
condition names incidental loss and requires the positive record, and confirm
an observation without it is rejected rather than weighed), and DEC-104's
STRUCTURED TIER, which carried the three-item condition and would otherwise
have emitted it beside its own replacement.
"""

[[finding]]
id = "F-15"
status = "verified"
severity = "major"
title = "Expected a falsifier to revise placement; observed reword preserves tier and edge"
detail = "VA-4 requires every falsifying result to revise placement (plan.toml:702). The F-13 repair offers REWORD or RECLASSIFY and asserts both satisfy that rule (thin-adapter.md:963-979; plan.toml:692-703), but rewording a 2a step's boundary text leaves it a 2a step on the same edge. That revises the obligation contract, not its placement, and so cannot falsify the fragment-versus-step placement choice F-7 required. Either amend VA-4 explicitly to govern placement-or-boundary-contract and explain why that remains a falsifier, or require a controlled firing to change placement; do not satisfy the criterion by silently broadening its noun."
disposition = "contest rejected — clarified, no rule change"
response = """
ROUND-8 CONTEST REJECTED. The claim is false on the pre-registered text, on all
four surfaces that carry it. No rule changes. An exposition repair landed at
8abbb98f because the misreading was available and a VA-5 verifier could make it
too -- that repair is named below and changes nothing about how an arm is chosen.

THE CONTEST, RESTATED SO THE DISPOSITION IS AUDITABLE. "The one-shot rule makes
reclassification compulsory only on a second firing that the N=1 exercise cannot
collect, so it does not make placement revision reachable within this
pre-registered falsifier."

THAT SKIPS (a) AND (b). The one-shot rule -- (c) -- is not the compulsion route
and never was. The route to reclassification on the FIRST AND ONLY FIRING is
(b)-fails-therefore-(a)-applies, and it is written in terms on every surface:

  VA-5 (2), plan.toml:703 -- "text that names no observable completion moment
  does not earn the arm, AND THE FIRING RECLASSIFIES."

  EX-8 (2)(a)+(b), plan.toml:692 -- "RECLASSIFY TO 2b IS THE DEFAULT -- what a
  firing means unless the reword arm earns its exit ... no candidate text, no
  reword."

  thin-adapter.md:1042-1043 -- "the cheap arm now costs a checkable artefact, and
  FAILING TO PRODUCE ONE COMPELS THE EXPENSIVE ONE."

  target-machine.d2:690-692 (the diagram governs) -- same sentence.

  And the cause table at thin-adapter.md:924-928 already routes cause (A)
  straight to "reclassify to 2b", with reword reserved to (C) and qualified
  "if that arm earns its exit ... otherwise reclassify."

No second firing appears in any of that. (c) is a separate, additional
compulsion that binds the step's post-close life; I disclosed at round 7 that
CHR-049 cannot exercise it, and that disclosure is what the contest has picked
up and mistaken for the whole mechanism.

WHY THE BAR HAS TEETH -- the part round 7 left implicit, and the real substance
of "candidate text constrains the escape but does not change its non-placement
outcome". The contest is right that reword, WHEN TAKEN, revises no placement.
What it misses is that the candidate-text bar is UNMEETABLE EXACTLY UNDER CAUSE
(A). DEC-104 classifies content as 2b PRECISELY BECAUSE IT HAS NO TRUTHFUL
BOUNDARY COMPLETION -- that is the discriminator's own criterion, not a fresh
argument. So the two arms are complementary, not competing:

  - candidate text meeting (i) truthful and (ii) observable in run state CAN be
    produced  =>  a truthful observable completion boundary exists  =>  the
    obligation is 2a-eligible, the defect was the step's TEXT, and reword is the
    CORRECT outcome rather than an escape from one;

  - it CANNOT be produced  =>  no such boundary exists  =>  that IS cause (A)
    =>  the default applies and the firing RECLASSIFIES, first firing, inside
    the single exercise.

The artefact test therefore IS the (A)-against-(C) discriminator that the round-5
scale note leaves "settled at the reopening". It is checkable against the run
record that just fired -- the candidate boundary either has an observable
correlate in that run's state or it does not -- so it is a determination, not a
say-so, and VA-5 (2) instructs the verifier to check it "exactly as (i) is
checked".

That is what makes the falsifier a falsifier: reclassification is reachable at
N=1 precisely in the world where DEC-104's placement is WRONG. A signal that
could only revise the placement in a world where the placement was right would
be the defect; this is its inverse.

"PERMITS REWORD" IS NOT THE DEFECT, AND THE REMEDY THE CONTEST REASSERTS IS THE
ONE F-12 ALREADY REMOVED. VA-4 asks each signal to name A RESULT THAT WOULD
REVISE THE PLACEMENT. Its quantifier is existential, not universal; it does not
require that every firing revise placement, and reading it that way is the same
noun-level move -- one level up -- that F-15 correctly forbade at round 7 when
the response tried to broaden PLACEMENT to PLACEMENT-OR-CONTRACT. Requiring a
controlled firing to CHANGE the placement is reclassify-always, which forces
reclassification on evidence that cause (C) also explains. That is exactly the
overclaim F-12 stripped out one round earlier, and adopting it now would be the
eighth instance of a repair reproducing its own finding's defect -- this time by
reinstating a defect the review had already fixed. Declined at round 7 for that
reason; declined again, on the same ground.

WHAT LANDED ANYWAY, AND WHY IT IS NOT A CONCESSION. The rule is unchanged.
What changed is that the entailment above -- candidate text is producible if and
only if a truthful observable boundary exists, hence the test decides (A) against
(C), hence the first firing can reclassify -- was load-bearing at round 7 and
stated nowhere. A reader eight rounds into this ledger read (c) as the operative
compulsion and (b) as a mere constraint. A VA-5 verifier reading the same text
could pass a kit that treats the arms as freely selectable, which is the failure
VA-5 (1) exists to catch. So the entailment is now written, on the four surfaces
that carry the rule: EX-8, DEC-104's structured tier, thin-adapter.md (new
paragraph under the round-7 subsection) and target-machine.d2 (round-8 block
appended; the diagram governs). Each is marked CLARIFIED / NO RULE CHANGES so
the record shows a rejected contest, not a silent repair.

RESIDUAL, DISCLOSED RATHER THAN ABSORBED -- asked in the form step 4 demands of
any repair. Failure to produce candidate text is not PROOF that no boundary
exists; it can also mean nobody thought of the right text. Default-deny therefore
biases toward the EXPENSIVE arm, so the residual error is a FALSE
RECLASSIFICATION, not a false reword. That is the safe direction for a falsifier
and it is the cost gradient round 7 inverted on purpose -- VA-5's round-7 text
already says so in terms ("(1)-(3) raise the cost of a false firing from a text
improvement to a placement revision"). It is stated here because the round-8
clarification makes the deny branch more visibly operative than it was, and a
finding on THIS -- that the exercise's one firing may reclassify a correctly
classified 2a step because the reopening was uninventive -- would be fair.

The other two round-7 disclosures stand unchanged and unrelitigated: the reword
arm's honesty rests on candidate text being checkable, which is the judgement
VA-5 already performs on signal (i); and (c) is thin at N=1, stated as a
commitment binding the step's post-close life rather than dressed as a control
the exercise collects.
"""

[[finding]]
id = "F-16"
status = "verified"
severity = "major"
title = "Expected evidence to distinguish no boundary; observed failure to invent text forces reclassification"
detail = "The round-8 clarification makes the first-firing route explicit: if candidate boundary text cannot be produced, the default forces reclassification to 2b (sketches/thin-adapter.md:1048-1065). The same clarification then concedes that failure to produce text may instead mean nobody found the right wording (sketches/thin-adapter.md:1071-1076). Thus the reopening treats failure of invention as evidence that no truthful boundary exists and revises placement on an admitted false-positive route. Require evidence that distinguishes absence of a boundary from failure to formulate one—such as independent adjudication or corroboration—or classify the result as inconclusive and state honestly that the N=1 exercise cannot falsify this direction."
disposition = "fixed"
response = """
CONCEDED. Fixed at 0fa8f49d, and the repair is structural rather than another
patch: the run-side inference is withdrawn entirely.

THE CONTEST IS CORRECT AND THE ERROR IS LOGICAL, NOT EVIDENTIAL. Verified before
responding: thin-adapter.md:463-474 says exactly what the contest says it says --
the step reads "record the design-target selectors the code-impact section NOW
commits to", it is "true at each firing and asserts nothing about finality", and
it fires at two edges. So the obligation tracks a moving set, and a recorded
selector coexists with an unfinished obligation.

The defect is sharper than "proxy rather than discriminator". THE ORIGINAL SIGNAL
IS SOUND PRECISELY BECAUSE IT IS NEGATIVE: subject ABSENT at the discharge turn
proves the step was not complete. That is why it was described as conservative --
it cannot fire falsely in that direction. Round 9 INVERTED it: subject PRESENT at
some turn therefore a truthful completion moment exists. That is affirming the
consequent, and no amount of exhaustiveness rescues it, because an exhaustive
enumeration asks the wrong question at every turn rather than at one of them.

THE LOOP WAS STRUCTURAL, WHICH IS THE PART WORTH RECORDING. Rounds 5 through 10
are one move repeated: infer "this obligation has no truthful completion moment"
from RUN BEHAVIOUR. It cannot work, and not for want of cleverness.
CLASSIFICATION IS A PROPERTY OF AN OBLIGATION'S TEXT, NOT OF A RUN. A run tells
you how one agent behaved on one occasion; it cannot establish a universal
negative about the obligation. Each round produced a subtler inference with the
same defect in new clothes, and the cheap patch available each round converged on
an authoring-time property anyway -- "enumerate turns where the subject is present
AND THE OBLIGATION'S STATED SCOPE IS SATISFIED" just relocates the whole question
to the stated scope. That convergence is what says the fix below is the fixed
point rather than an escalation.

THE REMEDY -- THE CLASSIFICATION TEST IS AN AUTHORING GATE.

  1. EVERY 2a STEP STATES ITS OWN COMPLETION CONDITION, in its text, at authoring
     time. The condition must be TRUTHFUL -- satisfying it DISCHARGES the
     obligation rather than starting it -- and CHECKABLE IN RUN STATE.

  2. AN OBLIGATION WHOSE COMPLETION CONDITION CANNOT BE STATED IS NOT A STEP. It
     is 2b.

  3. THE EXERCISE COLLECTS ADHERENCE, NOT CLASSIFICATION. With a stated
     condition the observation is mechanical: did the agent discharge at a turn
     where its STATED condition was not satisfied? No inference about a mind, no
     claim about what does not exist. Routing is unchanged -- agent-general
     across siblings is adherence; step-specific means THE CONDITION WAS
     MIS-STATED, and the repair is the condition.

The selector obligation passes the gate and shows the shape: it completes when
THE RECORDED SELECTOR SET MATCHES THE SECTION'S CURRENT COMMITMENTS -- statable,
checkable at each firing, and asserting nothing about finality. So the gate is
not a formality that waves everything through; it is the discriminator finally
being applied where the discriminating fact lives.

WHY THIS IS STRONGER THAN WHAT IT REPLACES, AND NOT A RETREAT. The finding's own
fallback -- declare the direction unfalsifiable at N=1 -- would have left DEC-104
with no failing check at all. The gate is decidable OVER THE WHOLE SET, BEFORE
ANY RUN, and RE-RUNNABLE BY ANYONE. It can fail this week rather than once,
post-close, in a single moderated session. That is a better answer to the
original demand (a decision no observation could contradict is not a decision)
than anything the run-side chain produced, and it costs the exercise nothing it
could actually deliver.

OWNER RULING, RECORDED BECAUSE IT GOVERNS THE SHAPE. We do not build taxonomical
truth from first principles -- that is what design is. CHR-049 feeds evidence
INTO the design; the owner arbitrates whether the design is good. The category
error underneath rounds 5-10 was asking one observation to settle a question that
belongs to design judgement, and then building progressively more elaborate
machinery to disguise that it could not.

WHAT WAS CUT, NOT ADDED. Per the same ruling, the design surfaces carry THE RULE
and this ledger carries the REASONING. The rounds 8-9 epistemology is removed
from sketches/thin-adapter.md and sketches/target-machine.d2 rather than extended
-- roughly 160 lines deleted, net -60 across the five surfaces after the gate was
written in. A superseded-in-place note records the withdrawal so the reduction is
visible without the argument being re-staged in the design.

LANDED AT: plan.toml PHASE-09 EX-8 (round-10 amendment) and VA-5 (checks (6)-(8)
withdrawn with the inference they verified; new (9) the authoring gate is applied
and recorded over the whole set, and (10) the kit collects adherence against the
stated condition and not classification from behaviour), DEC-104's structured
tier, sketches/thin-adapter.md, sketches/target-machine.d2 (the diagram governs),
and notes.md.

STILL UNREWRITABLE, RESTATED SO A VERIFIER DOES NOT CLOSE FALSELY: F-15's stored
response argues from the withdrawn inference and F-2's describes a withdrawn
remedy; both are past `open` and `review dispose` refuses. The artefacts are
current; those two ledger copies are not.
"""

[[finding]]
id = "F-17"
status = "verified"
severity = "major"
title = "Expected authoring gate applied to every 2a step; observed three assignments lack checkable completion state"
detail = "The round-10 gate requires every 2a step to state a truthful completion condition checkable in run state and says any obligation that cannot do so is 2b (sketches/thin-adapter.md:1056-1063; plan.toml:703 VA-5(9)). The design applies that test only to selector recording (thin-adapter.md:1065-1068). Its surviving census still says knowledge capture, scope reconciliation, and repeat-pass judgement have no reachable verifier even in principle (thin-adapter.md:645-646), and the inquire.scope explicit-confirm branch deliberately leaves no artefact (thin-adapter.md:901-906). Therefore the new discriminator has not reproduced or revised its own assignments: at least inquire.scope cannot satisfy its checkable-in-run-state requirement as designed. Apply and record the gate over every surviving 2a step, supplying the exact state-visible completion condition, or reclassify any step that cannot meet it."
disposition = "fixed"
response = """
CONCEDED, and the repair goes further than the finding asks. Repaired at 7f45f3d4; re-primed.

WHAT WAS RIGHT. Every mechanical claim verifies. The gate is stated at thin-adapter.md:1058-1063 and target-machine.d2:748-754 and plan.toml VA-5(9); exactly one obligation was worked (`completes when` returns a single hit, thin-adapter.md:1066, against 6 hits for `completes` as a positive control); the census at :644-646 stood unreconciled with it; :901-906 stood unreconciled with it. A discriminator that has not reproduced its own assignments has not been applied, and round 10 left it unapplied. That is the finding and it is upheld.

WHAT APPLYING IT FOUND — the reason this took a ruling and not an edit. Round 10's `and checkable in run state` CONTRADICTS A ROUND-3 OWNER RULING NOBODY REOPENED: target-machine.d2:449, `VERIFICATION STRENGTH IS AN ORTHOGONAL AXIS, NOT THE SORTING RULE`, and :464-468, which adopted completability precisely because it gives `mechanically unverifiable but genuinely mandatory human acts — semantic scope reconciliation, knowledge capture — somewhere honest to sit rather than being demoted to lenses`. Round 10 was arguing against RUN INFERENCE; it did not argue against that orthogonality. The clause rode in as a qualifier on a correct ruling, which is why ten rounds of reading the sentence never surfaced it and one attempt to APPLY it did.

Two reductios, both mechanical. (1) It demotes the two acts round 3 protects by name. (2) It condemns FOUR OF install/design-prompts/exploring.toml's FIVE SHIPPED STEPS — `explore.scope`, `explore.canon`, `explore.memory`, `explore.triage` state no state-visible condition, only `explore.research` carries a verifier. Those are 2a assignments this slice made ((a.3), tier 2a, :61-75). A runbook whose only admissible steps carry mechanical verifiers is a verifier list, which is DEC-101 and DEC-102 gutted.

THE RULING (owner, 2026-08-01, round 11): SPLIT THE LIMBS. Classification asks only that a 2a step state a TRUTHFUL completion condition in its text; unstatable is still 2b. State-visibility — both of a condition's terms readable from run state — moves to COLLECTION, where it grades a condition's EVIDENCE exactly as a verifier grades a discharge's. That is round 3's orthogonality one level down, not a new exit: nothing about round 10's core survives weaker, and the gate is still decidable over the whole set before any run.

THE GATE, APPLIED — thin-adapter.md `The gate, applied`, a row per obligation over ALL NINE, the four relocated plus exploring.toml's five. All nine state a condition and all nine survive as 2a. FIVE OF NINE ARE STATE-VISIBLE, and the kit must now NAME the four it cannot reach and REPORT the fraction rather than publish a rate over a denominator it never covered (VA-5(10) as extended).

ONE PREMISE OF THE FINDING IS CORRECTED. `inquire.scope cannot satisfy its checkable-in-run-state requirement as designed` does not hold, and the finding inherited that from the stale paragraph at :901-906 rather than from the gate. The gate asks for a STATE CONDITION, not an artefact: `slice-nnn.md asserts nothing the accepted decisions contradict and omits nothing they add to scope` holds or fails whether or not an edit occurred, so the `or explicitly confirm` branch's artefact-lessness — which bore on the WITHDRAWN subject-presence test — does not bear on this one. inquire.scope is state-visible at edge 4. The paragraph that said otherwise is now marked superseded in both halves, and the one that genuinely fails is KNOWLEDGE CAPTURE, which the finding did not name as the hard case: its condition's left-hand term is what this inquiry settled, and that is in context, not in run state.

Related correction the count forced: the codicil excused a whole shipped asset on one of its five members carrying a verifier (`four distinct obligations qualify (exploring.toml is shipped and already carries a verifier on explore.research)`). Invalid as reasoned. Eight of nine ship no verifier; the four shipped ones are now warranted in the codicil table rather than left as a disclosure.

TWO STEP TEXTS BOUGHT VISIBILITY by naming a landing site — `explore.triage` and the edge-4 repeat-pass judgement now record their finite result into the slice notes. PHASE-08 already owns exploring.toml's before/after under VA-7(2), so this costs no new machinery. KNOWLEDGE CAPTURE DELIBERATELY DID NOT: making its condition state-visible needs a new artefact enumerating what the inquiry settled, a fresh obligation invented to measure an old one, which is F-2's ceremony objection by the back door. It stays 2a on a truthful condition with weak evidence — the position round 3 ruled honest.

ONE ASYMMETRY KEPT ON PURPOSE, since it will read as an inconsistency otherwise: the REWORD ARM (thin-adapter.md, the pre-registered reopening) still demands candidate text that is checkable in run state. Only a state-visible condition can fire the signal at all, so the reopening always starts from one; dropping the requirement there would let a step ESCAPE THE SIGNAL BY REWORDING ITS CONDITION OUT OF VISIBILITY — a firing answered by becoming uncollectible, which is route-to-no-revision arriving through a door round 11 would otherwise have opened. The sweep was per-site adjudication, not find-and-replace.

WHERE IT LANDED. thin-adapter.md — gate section rewritten with the round-11 amendment and the nine-row applied table; codicil count and parenthetical corrected with four new warrants; the verifier-vs-state-visibility distinction stated where F-17 read the counts; :901-906 superseded; the two step texts recorded; reviewer surface 7 added. target-machine.d2 — round-11 amendment block after the round-10 one. plan.toml — PHASE-09 EX-8 and VA-5, the latter gaining (11), a check that the gate was actually applied per obligation. DEC-104 — both tiers. notes.md Learned — the round-11 entry, whose durable part is the shape of the error rather than the ruling: a qualifier attached to a correct ruling can carry a second, unargued ruling, and it survives because everyone reads the sentence for the part that was contested.

WHAT REMAINS OPEN, DISCLOSED AS COST NOT DEFECT (reviewer surface 7): whether a signal reaching five of nine is worth running at N=1, given that the four it cannot reach include knowledge capture — the case this argument has circled since round 3. That is a judgement about the instrument's power, not an invalid step, and it is stated in the design rather than absorbed into a rate.

VERIFICATION. doctrine validate exit 0, corpus clean; d2 compiles the diagram; doctrine check quick exit 0 (the IMP-373/374/376 unresolved-citation warnings are the known primary-tree items). Commit 7f45f3d4, RV-325 re-primed at it.
"""
