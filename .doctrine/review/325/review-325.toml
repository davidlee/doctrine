[[finding]]
id = "F-10"
status = "verified"
severity = "major"
title = "Expected the delivery trade to revise its governing classification; observed a falsifier exempting DEC-104"
detail = "The pre-registered fallback moves 2b content into a 2a coverage-set step but declares that this does not reopen DEC-104 (thin-adapter.md:750-754; plan.toml:692). DEC-104 defines 2b precisely as a lens with no truthful boundary completion and 2a as a finite boundary act (knowledge/decision/104/record-104.md:35-46). Evidence that warrants moving the same content across that boundary either falsifies or qualifies DEC-104's classification, or the fallback is not admissible under the decision. Name a revision that preserves DEC-104 (for example, change the 2b delivery/attention mechanism without reclassifying the lenses), or state that a negative result reopens DEC-104 alongside any mechanism work in IMP-373."
disposition = "fixed"
response = """
ACCEPTED IN FULL. This is the best finding of the review, because the thing it catches is not a slip — it is the same instinct failing twice, and the second time inside the repair for the first.

VERIFIED. thin-adapter.md said the 2b content "returns to 2a as a coverage-set step" and that "a negative result reopens IMP-373 on merit; it does not reopen DEC-104"; plan.toml PHASE-09 EX-8(c) said the same. DEC-104 (record-104.md, the discriminator section) defines 2b as a lens with no truthful boundary completion and 2a as a finite boundary act. F-10's dilemma is exact and has no third horn: evidence warranting the move across that line either falsifies the classification or the move is inadmissible under it. The fallback could not both contradict DEC-104 and exempt it.

THE PART THAT MATTERS MORE THAN THE INCOHERENCE. F-7 objected to a claim shielded from evidence. The remedy I wrote for F-7 shielded the governing decision instead — an exemption clause protecting DEC-104 from the very falsifier F-7 had just forced into existence. That is F-7's own defect re-inserted one level up, by the repair for F-7, and I did not see it. Two rounds, same instinct: bound the damage, keep the ruling. Recorded in the artefacts in those terms rather than as a wording fix, because the pattern is the durable finding and the incoherent sentence is only where it surfaced.

THE SUBSTANTIVE ERROR UNDERNEATH, which is what makes the repair better than either option F-10 offers. NONE OF THE THREE SIGNALS IS EVIDENCE ABOUT COMPLETABILITY. Adherence, receipt churn and per-turn cost all measure whether every-turn fragment delivery WORKS; not one of them could show that "consider data-flow boundaries" finishes at a moment. So a delivery failure was being answered with a classification remedy — a category error, and the coverage-set fallback was answering a question nobody had asked. That is why the exemption felt necessary: the remedy was in the wrong category, and the clause was there to stop it colliding with DEC-104.

REMEDY, ruled 2026-08-01. FOUR SIGNALS, ROUTED BY SUBJECT.

(1) THREE DELIVERY SIGNALS -> MECHANISM-SIDE REVISION, DEC-104 STANDS. Not by fiat, but because nothing in them bears on the discriminator. Named candidates in escalating cost: tighten name-at-digest re-emission so a stale receipt cannot suppress a fragment an agent never read; shorten or split the fragment so the lens is not buried; put a fragment digest in the envelope so non-attention is VISIBLE even though it stays non-dischargeable. IMP-373 is NO LONGER THE NAMED FALLBACK and stays deferred on DEC-104's own merits.

(2) ONE MISCLASSIFICATION SIGNAL -> DEC-104's DISCRIMINATOR REOPENS. This is F-10's option (b), admitted for the right trigger rather than for any negative result. Either direction: agents discharging a 2a step at a moment where it cannot honestly be complete, e.g. attesting scope-reconciled before the design settles, which says the obligation has no real boundary and was never a step; or moderators observing agents treat a 2b lens as having a natural completion moment they pause at and would gate on, which says the lens is an act the rule demoted. WITHOUT THIS SIGNAL DEC-104 IS UNFALSIFIABLE BY CONSTRUCTION, which is precisely the charge F-7 laid against the trade. DEC-104 now carries the reopening condition in its own consequences, so it does not live only in a sketch.

ONE THING F-10 DID NOT ASK FOR, ADDED BECAUSE THE ROUTING IS DEFEATABLE. Four named signals collected as one undifferentiated score restores the exemption under a fourth name: any result could then be routed to whichever revision is cheapest. PHASE-09 VA-5 is appended as the anti-theatre check — each signal's evidence must be capable of supporting ONLY its own consequence, and the misclassification signal must be collected as observations of discharge timing and agent pause behaviour, never as a delivery proxy. If it is collected as "did adherence improve", it is the delivery signals wearing a fourth name.

Applied at thin-adapter.md, plan.toml PHASE-09 EX-8(c)/(d) + VA-5, target-machine.d2 D14, and DEC-104's consequences. Diagram recompiles; corpus validates clean. Commit 0cfd87b1.

APPENDED — A DEFECT IN MY OWN F-9 RESPONSE, disclosed here because the protocol gives me no way to correct it. F-9 is now "answered", so dispose refuses to rewrite it. Its stored text was mangled by SHELL BACKTICK EXPANSION when I submitted it: three code-quoted spans were evaluated as commands and silently replaced with empty strings. Read those two sentences as: "...selector recording, since `doctrine slice selector list` and `doctrine slice conformance` already exist to reach it..." and "...So ALL FOUR will report `attested`." Nothing else in F-9 is affected and the disposition stands as written. The artefacts are correct; only the ledger copy is damaged. Flagging rather than leaving a reviewer to parse "since  and  already exist to reach it".
"""

