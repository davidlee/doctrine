[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Green-ness rationale misses the bare-mention gate that PHASE-01 arms for both phases"
detail = """
Claim: the plan's "each phase ends green" reasoning (plan.md § Sequencing, bullet "Each phase ends green") checks only for an orphan test and misses the bare-mention test, which becomes binding on both phases the moment PHASE-01's manifest entry lands. No EX in either phase names it.

Evidence (tree):
- src/lib_citation.rs:140-150 `bare_targets` = every `reference/*.md` address basename in the manifest (minus `governance.md`).
- src/lib_citation.rs:192 `SHIPPED_TEXT_ROOTS = ["plugins/doctrine/skills", "install"]`; src/lib_citation.rs:452-465 `no_bare_library_mention_in_shipped_text` fails on any occurrence of a target outside a `lib:` citation, including path forms (`install/x.md`, `reference/x.md`; test at :349-367).
- So after PHASE-01/EX-1 adds `reference/commitment-ledger.md`, the string `commitment-ledger.md` becomes a bare target. `grep -rn commitment-ledger install plugins/doctrine/skills` today: no hits, so existing text is safe.

Consequence (inference):
- PHASE-01: `install/commitment-ledger.md` is itself walked. Any bare `review-ledger.md`, `glossary.md`, `using-doctrine.md` or a self-mention `commitment-ledger.md` in it fails the gate. EX-5 ("findings follow the review-ledger protocol") invites exactly such a reference. (`commitment-ledger.toml` is safe: the target is `commitment-ledger.md`.)
- PHASE-02: every pointer and the glossary/using-doctrine edit (EX-3, "distinguishes it from the review ledger") must name the doc only as `lib:reference/commitment-ledger.md`; a pointer like "see commitment-ledger.md § Refresh" fails.

EX-7 / PHASE-02/EX-5 ("grounds only on prose, lib: addresses...") arguably cover this by implication, and the gate would catch it, so this is not a correctness hole — but the plan's stated green-ness rationale is incomplete and the worker gets no warning.

Suggested fix: in plan.md's green bullet and PHASE-01/EX-7 + PHASE-02/EX-5, name `no_bare_library_mention_in_shipped_text`: library docs are named only by `lib:` address, never bare basename or path.
"""
disposition = "fix-now"
response = "Fixed: verified no_bare_library_mention_in_shipped_text (src/lib_citation.rs:452) arms on the new manifest entry. PHASE-01/EX-7 and PHASE-02/EX-5 now require shipped docs named only by lib: address; plan.md green-ness bullet names the test."

