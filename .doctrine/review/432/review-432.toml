[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "New C-36 (touchpoint pointers) carries no needs/gated_by; duplicates C-31 edge-less"
detail = """
Claim: the revision added C-36 (commitment-ledger.toml, "Added by the plan review (RV-431 F-1)") with no `needs` and no `gated_by`. C-36 quotes the touchpoint passage, satisfied by PHASE-02/EX-1: five pointers to `lib:reference/commitment-ledger.md`. That is the same cross-phase dependency C-31 carries (`needs = ["C-23"]`, `gated_by = ["PHASE-02/EN-1"]`). C-36's quote is a superset of C-31's (C-31 is its lead-in).

Evidence: `git diff HEAD~1 -- .doctrine/slice/287/commitment-ledger.toml`: C-36 has `satisfied_by = ["PHASE-02/EX-1"]` and no needs/gated_by fields. C-31 is unchanged apart from its needs, and is not retired: no [[variance]] retires it.

Effect: none on the realised order. PHASE-02/EN-1 already gates PHASE-02, and C-31 still records the edge. But it breaks the ledger's own entry-criteria rule (design sec-3, "every cross-phase `needs` edge has such an EN"; ledger-wise, a pointer commitment with no recorded edge), and two governing rows now cover one passage.

Suggested fix: give C-36 `needs = ["C-23"]` and `gated_by = ["PHASE-02/EN-1"]`. Or, if C-36 is meant to replace C-31's lead-in-only quote, retire C-31 with an intent variance (successor C-36) and carry the needs onto C-36. Which one is the commitments reviewer's call (RV-431); the missing edge is the sequencing defect.
"""
