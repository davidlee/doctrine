response = "Fixed: PHASE-02/VA-1 and EX-4 name ./target/debug/doctrine (freshly built) for install and library show, and warn off the PATH release binary."

[[finding]]
id = "F-3"
status = "answered"
severity = "nit"
title = "C-31/C-29 need C-22, which PHASE-02/EX-1 itself completes; the real edge is C-23"
detail = """
Claim: C-31's `needs = ["C-22", "C-23"]` points partly at itself. C-22 is satisfied by PHASE-01/EX-1 AND PHASE-02/EX-1 (commitment-ledger.toml, C-22 `satisfied_by`), and PHASE-02/EX-1 is C-31's own satisfying EX. C-22's quote ("five skills do") is the pointer work C-31 delivers.

Evidence: commitment-ledger.toml C-22 (`satisfied_by = ["PHASE-01/EX-1", "PHASE-02/EX-1"]`), C-31 (`satisfied_by = ["PHASE-02/EX-1"]`, `needs = ["C-22", "C-23"]`). plan.md's diagram labels PHASE-01 with "(C-22, C-23)", but C-22 is not complete until PHASE-02.

No cycle is recorded (C-22 has no `needs`), and the phase order is unaffected: the real correctness edge is C-23 (the manifest entry, PHASE-01/EX-1), which PHASE-02/EN-1 gates correctly. Same for C-29 (`needs = ["C-22"]`). This is precision in the dogfooded rationale, not a sequencing defect.

Suggested fix: C-31 and C-29 need C-23 only (or split C-22 into "the doc exists and is published" vs "five skills point at it", with the latter satisfied in PHASE-02).
"""
disposition = "fix-now"
response = "Fixed: C-29 and C-31 now need C-23 (the manifest entry) only; plan.md diagram and rationale credit C-22 to both phases."

