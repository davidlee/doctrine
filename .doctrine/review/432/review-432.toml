[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "PHASE-02/VA-1 names no binary; PATH doctrine is the release and reverts or false-fails"
detail = """
Claim: PHASE-02/VA-1 ("After cargo build + doctrine install, doctrine library show lib:reference/commitment-ledger.md resolves") does not say which binary. On this tree the bare `doctrine` is the installed release and will not do what VA-1 expects.

Evidence:
- `which -a doctrine` → `/home/david/.local/share/doctrine/bin/doctrine` only (the boot snapshot's "Invoking doctrine" names the same path). `./target/debug/doctrine` is the cargo build output.
- `doctrine library show lib:reference/commitment-ledger.md` today → `Error: unknown library address 'lib:reference/commitment-ledger.md': no published entry`. The PATH binary's embed will not gain the entry until a release.
- `.gitignore:65` ignores `.doctrine/skills/*`, so a wrong-binary `doctrine install` silently reinstalls the release's skills (without the five pointers) and nothing in git shows it.

Inference: a worker following VA-1 literally either sees a false failure (library show) or reverts the installed copies (install), contradicting PHASE-02/EX-4. EX-4 itself is correct ("from the freshly built binary"); VA-1 should match it.

Suggested fix: VA-1 names `./target/debug/doctrine install` and `./target/debug/doctrine library show ...` (or "the freshly built binary", as EX-4 does).
"""
disposition = "fix-now"
response = "Fixed: PHASE-02/VA-1 and EX-4 name ./target/debug/doctrine (freshly built) for install and library show, and warn off the PATH release binary."

