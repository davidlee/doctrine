[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Tracked-file guard has no mechanism: apply_wire dry-run reports no touched paths"
detail = "Raised from an independent pi design + comparison (quotient research profile, session 32554e48; raw: .doctrine/slice/285/research/raw/pi-design-comparison.md D-1). design.md §3/§4 rely on 'git ls-files over the dry-run's touched paths', but apply_wire(dry_run=true) collects imports only when !dry_run (boot.rs:3448) and empties per-harness touches under dry run (boot.rs:3683); boot.rs:8013-8016 pins dry.touched() empty. As written the guard always passes, voiding DEC-402's refusal."
disposition = "fix-now"
response = "Verified boot.rs:3448, :3456, :8013-8016. Integrated (design rev 28 sec-3/sec-4): boot::plan_wire(root, exec, harnesses) -> Result<Vec<Touched>> keeps the dry-run arms' paths (import_touched, refresh_touched); regenerate intersects them with git ls-files before any write; apply_wire and its pinned test unchanged. Negative control: a source whose committed .mcp.json (or another tracked wiring file) differs from what BootWiring would write must be refused before any write, naming the path — observe the refusal fire. Implementer confirms each dry-run arm reports the path it would write."
route = "control"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified boot.rs:3448, :3683, :8013-8016. Integrate: add boot::plan_wire(root, exec, harnesses) -> Result<Vec<Touched>> composing the existing dry-run halves (ensure_boot_import dry-run, install_refresh dry-run, refresh_touched); apply_wire and its pinned test unchanged. regenerate intersects plan_wire's paths with git ls-files before any write. Implementer must verify that each dry-run arm reports the paths it would write (reviewer cites boot.rs:3067, :3221)."

[[finding.turn]]
act = "amend"
role = "responder"
note = "route assigned at lock: the finding doubts that the tracked-file guard can detect anything"
disposition = "fix-now"
route = "control"
response = "Verified boot.rs:3448, :3456, :8013-8016. Integrated (design rev 28 sec-3/sec-4): boot::plan_wire(root, exec, harnesses) -> Result<Vec<Touched>> keeps the dry-run arms' paths (import_touched, refresh_touched); regenerate intersects them with git ls-files before any write; apply_wire and its pinned test unchanged. Negative control: a source whose committed .mcp.json (or another tracked wiring file) differs from what BootWiring would write must be refused before any write, naming the path — observe the refusal fire. Implementer confirms each dry-run arm reports the path it would write."

