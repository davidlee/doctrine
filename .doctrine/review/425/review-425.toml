[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "No post-regeneration check that tracked content stayed clean"
detail = "Raised from an independent pi design + comparison (quotient research profile, session 32554e48; raw: .doctrine/slice/285/research/raw/pi-design-comparison.md D-3). §3 assumes BootWiring is the only tracked-file hazard; convergence can PruneCanon/Unlink entries (install_ownership.rs:105, :290; applied install.rs:3295-3316). A client that un-ignores and commits an entry under a canon root could see a tracked deletion in the fork."
disposition = "fix-now"
response = "Observation accepted; prescription modified. Integrate a post-regeneration check: git status --porcelain -uno before vs after; any new tracked change is a regeneration failure (creation rolls back; repair discloses the paths and exits non-zero). No auto-restore on repair — restoring writes more and DEC-397 keeps repair minimal; the user decides. Also rewrite §3's premise: BootWiring is the predicted hazard (preflight), the post-check covers the rest."

