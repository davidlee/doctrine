[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "Two entry points (run_provision + copy_allowlisted) let a caller silently skip regeneration"
detail = "Raised from an independent pi design + comparison (quotient research profile, session 32554e48; raw: .doctrine/slice/285/research/raw/pi-design-comparison.md D-5). The conflicted arm calling a bare copy_allowlisted reopens the ISS-352 door for future callers. A ProvisionMode {CopyOnly, CopyThenRegenerate{allow_downgrade}} argument keeps one entry and makes the exemption visible at the call site."
disposition = "fix-now"
response = "Accepted: one entry point. Integrate run_provision(path, fork, ProvisionMode) with ProvisionMode::{CopyOnly, CopyThenRegenerate { allow_downgrade }}; the copy stays a private function. Conflicted candidate passes CopyOnly. Supersedes the copy_allowlisted public seam in §2/§4."

