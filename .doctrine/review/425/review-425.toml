[[finding]]
id = "F-7"
status = "answered"
severity = "major"
title = "Ignored harness files bake the running binary's absolute path (DEC-402 consequence wrong)"
detail = "Raised from an independent pi design + comparison (quotient research profile, session 32554e48; raw: .doctrine/slice/285/research/raw/pi-design-comparison.md D-7). CommandForm::Baked renders '<abs exec> <args>' for gitignored files (boot.rs:1105-1119); codex hooks are always Baked (boot.rs:2854); claude Local settings Baked (boot.rs:594-599). DEC-402's consequence 'hook commands use ${DOCTRINE_BIN:-doctrine}' holds only for tracked files. A fork's ignored config pins the orchestrator binary path."
disposition = "fix-now"
response = "Verified boot.rs:1105-1119, :2854, :594-599. Integrated: DEC-402 consequence corrected (portable form only for tracked files; gitignored config bakes the absolute exec); rev 28 sec-6 adds the baked-path risk. Separable second arm for the raiser to raise as a sibling if wanted: whether a confined fork's baked hook path resolves inside the worker jail (inference, not observed) — implementer checks one confined fork; backlog item if it does not resolve."
