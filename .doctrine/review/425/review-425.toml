[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "Per-caller failure-compensation tests have no failure lever"
detail = """Raised from an independent pi design + comparison (quotient research profile, session 32554e48; raw: .doctrine/slice/285/research/raw/pi-design-comparison.md D-6). §5 requires compensation 'after an injected regeneration failure', but the worktree e2e tests drive the built binary as a subprocess (e.g. tests/e2e_worktree_fork.rs:293) — no in-process injection seam. A committed installed-version = "999.0.0" in the source's doctrine.toml triggers the downgrade refusal deterministically in every creation arm."""
disposition = "fix-now"
response = """Accepted. Integrated (rev 28 sec-5): failure lever = committed installed-version = "999.0.0" in the source doctrine.toml (the new worktree inherits it), firing the downgrade refusal before any write. Negative control: a creation arm that leaks its worktree, ref or ledger row after that refusal must fail the test — observe it red against today's clean candidate arm (which leaks its detached worktree) before the fix. Repair: worktree kept, non-zero exit; --allow-downgrade then succeeds. Implementer confirms no earlier currency check refuses on the raised stamp."""
