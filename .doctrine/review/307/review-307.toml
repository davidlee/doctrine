id    = 307
slug  = "inquisition-sl-230-memory-body-write-seam-corpus-aware-verify-gate-external-codex-pass"
title = "Inquisition — SL-230 memory body-write seam + corpus-aware verify gate (external codex pass)"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "inquisitor"
responder = "architect"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-230"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected verified_sha to contain the attested body; observed T7/T8 stamp a HEAD that omits it"
detail = 'Design evidence: .doctrine/slice/230/design.md:241-245 makes corpus-only dirt yield a Commit frame and :380-381 requires T7/T8 to stamp HEAD even when the target item is dirty or wholly untracked; :299-302 defers the only body-content anchor it names. Current stamp logic at src/memory.rs:3357-3361 writes frame.commit unless allow_dirty is explicitly paired with CheckoutState. Empirical probe: in /tmp/sl230-attest-*, after creating an untracked .doctrine/memory/items/mem_probe/memory.md, `git cat-file -e "$verified_sha:.doctrine/memory/items/mem_probe/memory.md"` returned exit 128, while `git rev-list --count "$verified_sha..HEAD" -- .doctrine/memory/items/mem_probe` printed 0 both at stamp time and after an unrelated commit; `git ls-files --others` still printed the body. Therefore D5 sees no commit and reports no drift while verified_sha names a commit that never contained the claim. This is a false attestation and must not ship; OQ-3 or an equivalent content-bearing anchor is load-bearing.'
disposition = "fix-now"
response = """
Charge sustained; proven, not argued. The relaxation excluded .doctrine/** wholesale, and memory items live inside it — so record → verify stamped a HEAD that provably lacked the body, and D5's rev-list drift count returned 0 forever because it counts commits and there was none to count. The design's own OQ-3 was the only named remedy and it was deferred; the charge is right that this made the deferral load-bearing.

Remedy is not OQ-3 (schema change, own slice) but a claim-aware gate, which needs no new field. § 5.2 is restructured around a single leaf primitive: dirty_under(root, pathspecs) -> Result<bool>, the three probes with an arbitrary pathspec set. capture_with(root, excludes) delegates its dirty decision to it; capture(root) = capture_with(root, &[]) as before. verify then composes TWO calls to the one primitive:

  source = capture_with(root, corpus_excludes)   // Frame — the anchor
  claim  = dirty_under(root, claim_pathspecs)?   // bool — is the evidence committed?

where claim_pathspecs = the memory's own item directory (+ its declared scopes, see F-6). Refuse unless the source frame is Commit-anchored AND the claim surface is clean. verified_sha is then a commit that provably contains the attested body.

Consequence accepted deliberately: T8's record → verify case now REFUSES until the memory is committed. That is the honest answer — an attestation naming a commit that does not contain the claim is worthless, and 'commit the memory, then verify' is one command. The friction this slice actually set out to kill — unrelated corpus dirt, another agent's uncommitted backlog file, your own unrelated spec edit — is still killed. T8 rewritten accordingly; the refusal names the fix."""

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected one integrated exclusion design; observed dead is_excluded and stale source_clean mechanisms"
detail = 'The corrected D3 at .doctrine/slice/230/design.md:148-186 performs exclusion natively through pathspecs inside capture_with. Yet the system model at :98-99 still specifies corpus_guard::is_excluded plus source_clean, :192-196 describes a pure exclusion predicate without any consumer, and :200-201 says source_clean returns a value. Command `rg -n "is_excluded|source_clean|capture_with" .doctrine/slice/230/design.md src/corpus_guard.rs src/git.rs src/memory.rs` found is_excluded/source_clean only in the design and no live seam to receive the predicate. A1 was not completely integrated: the design currently specifies two exclusion mechanisms, one dead, and retains the rejected function in normative sections.'
disposition = "fix-now"
response = """
Sustained — A1 was integrated in the decision (D3) but not in the normative sections, leaving the retired source_clean standing in the § 5.1 tier diagram and § 5.3 prose, and a corpus_guard::is_excluded predicate with no consumer anywhere. Two specified mechanisms for one job, one dead, is the very duplication A1 was raised to destroy; the charge is right that partial integration of a settled finding is itself a defect.

§ 5.1 and § 5.3 rewritten. source_clean is gone from every section, not just from D3. is_excluded is deleted outright rather than rehomed: exclusion is performed entirely by git pathspecs inside dirty_under, so a path predicate has no work to do. corpus_guard keeps DOCTRINE_PATHSPEC (src/corpus_guard.rs:43) as the named constant STD-001 requires; the pathspec vectors are composed at command tier, which is where the memory-layout knowledge legitimately lives."""

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Expected rejected edit arguments to leave both tiers untouched; observed body-first ordering mutates before validation"
detail = "Design steps at .doctrine/slice/230/design.md:218-229 call write_body before apply_edit. Actual apply_edit performs fallible validation after entry: src/memory.rs:3817-3827 rejects key/title, :3844-3860 rejects status/lifespan, :3893-3921 rejects trust/severity, and :3935-3939 can reject key normalization. The current shell at :4005-4014 safely mutates only an in-memory DocumentMut until apply_edit succeeds. Under the proposed order, `memory edit --body ... --trust bogus` returns an error after memory.md has already been atomically replaced, while memory.toml, updated, and verification remain untouched. This is mutation on an argument-validation failure, distinct from the acknowledged crash window. Validate against a cloned document before the first disk write or otherwise restore failure atomicity."
disposition = "fix-now"
response = """
Sustained. apply_edit is fallible at four sites after entry (src/memory.rs:3817-3827 key/title, :3844-3860 status/lifespan, :3893-3921 trust/severity, :3935-3939 key normalisation), and the current shell mutates only an in-memory DocumentMut until it succeeds. Body-first would have made 'memory edit --body - --trust bogus' rewrite memory.md and then error — mutation on an argument-validation failure, which is a strictly new failure mode, not the acknowledged crash window.

The fix costs nothing, because apply_edit's mutation is already in-memory only. Validation moves first without giving up the body-dependent TOML content:

  1. toml_changed = apply_edit(&mut doc, fields, today)?   // validates + mutates IN MEMORY only
  2. body_changed = write_body(dir, 'memory.md', text, mode)?   // first and only disk write so far
  3. if body_changed { clear_verification(&mut doc); doc['updated'] = today }   // see F-12
  4. if body_changed || toml_changed { write_atomic(toml_path) }

Every fallible step now precedes every disk write. R1's crash asymmetry survives intact — body still lands before TOML — so a crash still leaves a changed body with a stale updated, never the reverse. A2's insight that TOML content depends on body_changed also survives: step 3 applies it to the same in-memory document. The draft simply confused 'the TOML WRITE must follow the body write' with 'the TOML COMPUTATION must follow it'; only the former is true."""

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Expected ADR-013 dependency to name an active Revision; observed SL-230 has no REV anchor"
detail = 'ADR-013 states that work waiting on governance or spec change declares `needs REV-NNN`. The design promises a Revision at .doctrine/slice/230/design.md:68-69 and requires it applied at :392-393, but names no REV and the synthesized `doctrine slice show SL-230` output contains governed_by POL-002/STD-001 and implements SPEC-007 with no needs relation. `doctrine revision list --format json` printed an empty rows array; `doctrine revision list --all --format json` showed only REV-001 through REV-033, all status done; `rg -n "SPEC-007" .doctrine/revision` printed nothing. The governance dependency is therefore uninstantiated and cannot order or gate this work as ADR-013 requires.'
disposition = "fix-now"
response = "Sustained without defence — the design promised a Revision twice (:68-69, :392-393) and named none, and no revision in the corpus touched SPEC-007. Discharged during this disposition: REV-034 minted ('Verify attests against a claim-relevant clean tree, not a globally clean one'), and 'doctrine needs SL-230 REV-034' authored, so slice show now reports the needs edge. ADR-013's ordering constraint is instantiated rather than promised. Rationale, both change rows and their before/after excerpts are in .doctrine/revision/034/revision-034.md; application is deferred to SL-230 close so spec and code turn over at the same moment."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Expected the SPEC-007 revision inventory to cover every binding contract; observed REQ-147 is omitted"
detail = 'The design and scope assert that only spec-007.toml:22 and spec-007.md:132 carry the clean-tree contract (.doctrine/slice/230/design.md:68; slice-230.md:88-92). Repository search `rg -n -i "clean working tree|refus.*dirty|no false attestation" .doctrine/spec/tech/007 .doctrine/requirement` also found .doctrine/requirement/147/requirement-147.toml:5-6 and requirement-147.md:1. `doctrine inspect REQ-147` printed inbound membership in SPEC-007. The active REQ-147 title is itself the exact old contract: clean working tree, refuse dirty tree, no false attestation. A Revision changing only the two cited spec sites would leave SPEC-007 internally incoherent and the requirement false. Also, the prose citation is currently line 133, not 132.'
disposition = "fix-now"
response = """
Sustained, and verified independently before disposition: 'doctrine inspect REQ-147' reports inbound members: SPEC-007, and requirement-147.toml:6 carries the retired contract as its literal title — 'against a clean working tree, refusing a dirty tree so no false attestation is recorded'. A two-site amendment would have shipped an active SPEC-007 member asserting the opposite of the code. This was the most dangerous of the governance charges precisely because it was invisible from the spec files themselves.

REV-034 carries REQ-147 as its --primary change row, with the before/after title text written out. A further fact the charge did not reach: requirement-147.md is still an unfilled template — Statement and Rationale are both empty comment stubs — so the title has been carrying the entire contract alone. REV-034 fills both bodies rather than only retitling.

The line-number correction is accepted too: the prose site is spec-007.md:133, not :132 (the sentence spans :131-133); design § 3 and § 9 now cite :132-133 as a range."""

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Expected exclusions to ignore irrelevant corpus dirt; observed blanket roots hide legitimately scoped evidence"
detail = '''Design principle .doctrine/slice/230/design.md:80-82 assumes every memory attests its body only against code, then :195-196 and :241-245 exclude all .doctrine plus repo-root memory. SPEC-007, as rendered by `doctrine spec show SPEC-007`, owns arbitrary path/glob/command scopes and does not restrict claims to source code. Live corpus evidence from `rg -n '"?\\.doctrine/' .doctrine/memory/items/*/memory.toml` printed many legitimate scopes including .doctrine/spec, .doctrine/adr, .doctrine/slice, and .doctrine/review. Thus an uncommitted change to a governance file explicitly named by the memory scope is ignored and verify stamps the old HEAD. Doctrine ownership makes the path constant legal under POL-002; it does not make the changed evidence irrelevant. Exclusion must be claim-aware or the anchor must include the excluded state.'''
disposition = "fix-now"
response = """
Contest sustained; answered by **DEC-020**, and the answer has moved since round 6 — see F-25 and F-31 for the full history, which this response deliberately does not restate.

Your objection was that D10 knowingly attests a surface missing declared evidence, and that a warning now plus a `validate` finding later does not make the PRESENT stamp true. That remains correct, and the design no longer disputes it. What changed is that the design stops trying to make the stamp true by refusing on part of the shortfall, and instead states what the stamp actually asserts:

  A `verified_sha` asserts that everything git COULD OBSERVE about this claim was
  committed and unchanged at that commit — not that every declared entry was observed.

That is now the design's ONLY reading (F-33 removed the competing strong one from four sites). The overclaim you identified is real, is not closed here, and is routed as IMP-318/R8 rather than papered.

THE LIMB OF F-6 THAT WAS FULLY FIXED, and is worth separating from the classification argument it got entangled with: blanket exclusion of `.doctrine/**` was simply wrong, and that is repaired without qualification. Items live at `.doctrine/memory/items/<key>/`, so the exclusion removed the memory being verified; and 81 items in this corpus declare `.doctrine/**` scopes, so an ADR a memory explicitly names is claim evidence exactly as `src/` is. The exclusion is now claim-aware: `verify` asks whether the UNCLAIMED tree is dirty and whether the OBSERVABLE claim is committed. T25 pins scoped governance dirt as a refusal.

Round 7 found that limb still leaking: the § 4 guiding principle ("a memory attests its body against the CODE; dirt in the governance corpus says nothing") was the strong reading's premise and contradicted both the 81-item census and T25. Cited by F-33, fixed at f63c267c, and named here because it was YOUR finding's premise that had been left standing in the one section that shapes every other.

Applied at f63c267c."""

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "Expected own-directory staleness to catch masters as claimed; observed masters are unanchored and never scanned"
detail = 'The design says own-directory drift catches masters at .doctrine/slice/230/design.md:252-257, but later concedes at :299-302 that masters have no verified_sha. Actual code corroborates the latter: src/memory.rs:1705-1707 records globals with unanchored_frame; :1750-1757 writes them under MEMORY_MASTERS_DIR; collect_all at :2826-2834 scans only items and shipped; run_validate consumes collect_all at :3480-3488; and writable resolution at :2468-2505 is items-only. `rg -n "MEMORY_MASTERS_DIR" src/memory.rs` found production use only in record placement, not validate. E2 is correct that the minted master anchor is None, but D5 cannot catch master edits and the design should stop claiming that it does.'
disposition = "fix-now"
response = """
Sustained; the design asserted at :252-257 that own-directory drift is 'edit-path agnostic: catches the verb, hand-edits, masters, and other agents', then conceded at :299-302 that masters have no verified_sha. Corroborated independently: rg -n MEMORY_MASTERS_DIR src/memory.rs returns production use only at :1753 (record placement) and :5931 (a test) — it appears nowhere in collect_all or run_validate, so masters are not scanned at all, quite apart from being unanchored.

The claim is struck rather than the behaviour changed. D6 already puts masters out of scope, and making validate scan them is a separate slice. § 5.4 now states the truth plainly: own-directory staleness catches the verb path, hand-edits to items, and other agents; it does NOT catch masters, which are unanchored (anchor_kind = None, no verified_sha to diff from) and are not scanned by collect_all. The only mitigation for masters remains the mem.system.memory.global-master-authoring guard memory, glob-scoped memory/** at severity high — stated as a known gap in § 8 (R5) rather than left as a false capability claim. E2 stands unaltered; the charge agreed it was correct."""

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "Expected claim changes to invalidate verification; observed title and summary edits remain verified by design"
detail = "The design problem says it closes the defect that nothing invalidates an attestation when the claim changes (.doctrine/slice/230/design.md:23-24), and its principle says a change to the body says everything (:80-82). Yet OQ-1 at :291-295 explicitly defers title and summary invalidation even while admitting both are claim-bearing. Actual apply_edit changes title/summary at src/memory.rs:3822-3842 and has no verification mutation. After SL-230, a user can still replace the summary or title of a verified memory and retain verification. This is a known residual false-stamp path concealed beneath a broader closure claim; either narrow the stated invariant and problem honestly or clear verification for all claim-bearing fields in this slice."
disposition = "fix-now"
response = """
Contest sustained without argument. Verified: design.md:272 still reads 'if body_changed { clear_verification(...) }' while the § 5.4 table names body, title, summary and scope.* as claim fields. D8 was written as a decision and a table and never wired into the operation — the exact incomplete-integration pattern the same commit added a closing paragraph about. The pattern held up better as a diagnosis than as a discipline.

Mechanism specified rather than asserted. apply_edit returns one bool that cannot distinguish claim fields from record fields, and widening its return type would break its existing suite, which R3 forbids. So the signal is computed at the caller by a pure snapshot comparison, additive and shared-machinery-safe:

  fn claim_snapshot(doc: &DocumentMut) -> ClaimSnapshot   // title, summary, scope.paths/globs/commands

  let before = claim_snapshot(&doc);                          // 0. pure read, pre-edit
  let toml_changed = apply_edit(&mut doc, fields, today)?;    // 1. validates; in-memory only
  let body_changed = write_body(dir, 'memory.md', text, mode)?;  // 2. first disk write
  let claim_changed = body_changed || claim_snapshot(&doc) != before;  // 3.
  if claim_changed { clear_verification(&mut doc) }           // 4. D8
  if body_changed { doc['updated'] = today }                  // 5. F-12 re-stamp
  if body_changed || toml_changed { write_atomic(toml_path) } // 6.

Snapshot comparison rather than inspecting which flags were supplied, because supplied is not changed: setting --title to its existing value must not clear a valid attestation, consistent with T12b. Step 5 stays gated on body_changed alone since apply_edit already stamps updated for any metadata change. T20/T21 now have a mechanism to exercise; T20 gains an idempotent-title case pinning that a no-op claim-field write does not clear."""

[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Expected hostile-body protection to gate closure; observed T16 is excluded from the closure commandment"
detail = "Internal finding A3 added T16 specifically to pin read-time nonce and data framing (.doctrine/slice/230/design.md:420-426), and the test table lists T16 at :390. But the normative closure sentence at :392 requires only T1-T15 green. This is an incomplete integration of settled A3: the newly required hostile-body regression may fail while the authored closure condition still passes. Change the closure range to T1-T16 or name every required test explicitly."
disposition = "fix-now"
response = "Sustained — a settled finding (A3) added T16 to the table but the normative closure sentence at :392 still read 'T1-T15 green', so the hostile-body regression could fail while the authored closure condition passed. Range corrected to T1-T21 (the matrix grows under F-8, F-10 and F-11). The lesson generalises and is applied: the closure sentence now reads 'every test in § 9 green' rather than a hand-maintained numeric range, so a test added by a later review cannot fall outside the gate by omission."

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "Expected body_mode to have a total cross-surface contract; observed mode-without-body is undefined and untested"
detail = 'The interface says CLI body/body-mode maps one-to-one to MCP body/body_mode (.doctrine/slice/230/design.md:128-145), and EditFields gains both while has_any counts body at :215-216. It specifies rejection only for body_mode on record (:141-142). It never defines `memory edit --body-mode append` without --body, MCP `{body_mode:"append"}` without body, or body_mode combined with metadata-only edits; T1-T6 and T12/T12b contain no such case. The two adapters can therefore reject, ignore, or count the same request differently while each still satisfies the written tests. Specify rejection or a meaningful default and pin both surfaces.'
disposition = "fix-now"
response = """
Sustained. The design specified rejection only for --body-mode on record, and left --body-mode append without --body undefined on the CLI, {body_mode: 'append'} without body undefined over MCP, and body_mode alongside a metadata-only edit undefined on both. As charged, the two adapters could each satisfy every written test while behaving differently — which is precisely the divergence the 1:1 CLI/MCP mapping in § 5.2 exists to prevent.

Contract made total: body_mode without body is REJECTED on both surfaces, with the same message. Rejection over a default because a silent default would let a caller believe an append happened when nothing was written, and because it is symmetric with the existing --body-mode-on-record rejection — one rule ('body_mode is meaningless without body'), two instances, rather than two unrelated special cases. has_any() is unaffected: body_mode alone never constitutes an edit. T22 pins both surfaces."""

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "Expected every stated capture invariant to be pinned; observed I2 and the three exclusion probes lack explicit tests"
detail = 'I2 at .doctrine/slice/230/design.md:273-275 preserves a concurrency property: clean-after-exclusion must never call write-tree. The test table has no lock/write-tree observation; T11 at :384 checks only frame equality and cannot detect an unnecessary write-tree call. T7 says only `.doctrine/** dirty` without identifying staged versus unstaged, while the design changes three independent probes at :178-186; T8 pins only the untracked leg. `rg -n "index\\.lock|capture.*lock|write-tree" src/git.rs` found implementation comments/retry code but no capture lock-avoidance test. Add explicit staged, unstaged/binary, and untracked exclusion cases plus a seam or lock-contention canary for I2.'
disposition = "fix-now"
response = """
Sustained in full. T11 compares frames and cannot observe an unnecessary write-tree call; T7 said only '.doctrine/** dirty' without partitioning staged from unstaged; only the untracked leg (T8) was individually pinned, though the design modifies three independent probes.

I2's substance is confirmed sound — capture takes the lock only in the dirty branch, and src/git.rs:1996-2000 documents exactly that ('write-tree acquires .git/index.lock, so we defer it to the rare dirty case'). The restructure under F-1 strengthens it: the claim probe is dirty_under, which returns a bool and never computes checkout_state_id, so it never reaches write_tree_with_retry (src/git.rs:1924) even when the claim surface IS dirty. I2 is restated to that stronger, testable form.

Tests added: T17 staged-only corpus change excluded; T18 unstaged/binary corpus change excluded; T19 untracked corpus change excluded (T8 keeps the record → verify case, now as a refusal). T23 is the I2 canary — hold .git/index.lock and assert verify still completes on the clean-after-exclusion path, which fails if write-tree creeps back in. Frame equality (T11) stays as the I1 pin."""

[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "Expected stamp_updated to be a composable step; observed apply_edit stamps `updated` internally, so a body-only edit never stamps it"
detail = 'Raised by the responder during disposition of F-3; missed by both the internal pass (A2) and the external pass. Design .doctrine/slice/230/design.md:223-229 models step 4 as `if body_changed || toml_changed { stamp_updated(&mut doc) }`, treating `stamp_updated` as a discrete helper the caller composes. No such helper exists. `apply_edit` (src/memory.rs:3810) ends with its own terminal block — "Stamp `updated` ONCE at root if any field changed" — writing `doc["updated"] = toml_edit::value(today)` gated solely on its internal `changed` flag, which counts metadata fields only and cannot see the body. Consequence: under the design as written, `memory edit --body -` with no metadata flags yields toml_changed=false, so `updated` is never stamped, directly falsifying T5 (":378 — body-only edit | has_any() true; updated stamped"). The composed-flag correction A2 introduced is therefore incomplete: it composed a flag over a step that does not exist as a separate step. Fix requires either an explicit re-stamp after write_body (idempotent — same date value) or splitting the stamp out of apply_edit; the former avoids touching shared machinery under R3.'
disposition = "fix-now"
response = "Self-raised during F-3's disposition; sustained. Step 3 above re-stamps updated explicitly after a body change. The re-stamp is idempotent when apply_edit already stamped (identical date value), so no double-write and no ordering hazard, and it leaves apply_edit's signature untouched — which matters under R3, since apply_edit is shared machinery whose existing suite must stay green unchanged. T5 is now satisfiable; T12b (identical-content body replace) is unaffected because body_changed is false there and step 3 never runs."

[[finding]]
id = "F-13"
status = "verified"
severity = "blocker"
title = "Expected allow-dirty to stamp the complete dirty checkout; observed the only Frame excludes claim-relevant corpus dirt"
detail = "Design §5.4 lines 309-318 computes only `source = capture_with(root, corpus_excludes)` plus a boolean `claim_dirty`; I4 and T10 nevertheless require `--allow-dirty` to override either failed question and stamp `checkout_state_id`. If the sole dirt is an edited or untracked memory body, `source` is Commit-anchored because that directory was excluded, while `claim_dirty` is true. The boolean carries no content and dirty_under explicitly never computes checkout_state_id. Current stamp_verification at src/memory.rs:3357-3361 can stamp a checkout id only from a CheckoutState Frame. The proposed flow therefore has no content-bearing value to stamp on this required path: it must recapture the unexcluded frame or specify an equivalent full-state anchor, and T10 must exercise claim-only dirt."
disposition = "fix-now"
response = """
Sustained, and confirmed in the source before disposition: src/git.rs:2036 and :2048 both construct Commit-anchored frames with checkout_state_id: String::new(). Only the dirty branch computes one. So under the two-question gate, a claim-only-dirty tree yields a source Frame that is Commit-anchored and carries no checkout_state_id — and I4 promises --allow-dirty stamps exactly that. The escape hatch would have stamped an empty string or silently fallen back to the commit, which is worse than either honest outcome: it would record a clean-looking attestation for a tree the operator explicitly acknowledged was dirty.

Root cause is the same shape as F-1: I reasoned about the default path and let the escape hatch inherit machinery built for a different question. The claim leg is deliberately a bool (I2 — it must not compute checkout_state_id, because that takes the index lock), so it structurally cannot supply the anchor the escape hatch needs.

Fix: --allow-dirty takes its anchor from a full UNEXCLUDED capture(root), not from the exclusion-aware frame.

  if allow_dirty {
      let full = capture(root)?;   // unexcluded — the real state of the tree
      stamp(full);                 // Commit if genuinely clean, CheckoutState otherwise
  } else {
      // two-question gate as specified
  }

This restores I4 to literal truth — --allow-dirty semantics are unchanged, because it now uses the same unmodified capture() it uses today. Cost is one extra capture confined to the escape-hatch path, where the index lock is already acceptable (today's --allow-dirty on a dirty tree takes it anyway), so I2 is untouched. I4 is restated to say which frame it stamps rather than leaving it inferred, and T10 is extended with the claim-only-dirty case that exposed this."""

[[finding]]
id = "F-14"
status = "verified"
severity = "minor"
title = "Expected T24 to prove the committed blob equals the attested body; observed it proves only that some blob exists at the path"
detail = 'Design I6 lines 395-397 says successful verified_sha contains the attested body, but T24 lines 559 tests only `git cat-file -e "$verified_sha:<dir>/memory.md"`. A previously committed stale body satisfies that command. T8 covers an entirely untracked directory and T25 covers a scoped ADR; no test modifies an already-tracked memory.md directly and requires verify to refuse, nor compares the committed blob bytes with the current body. Thus an implementation that omits the own-directory pathspec for scoped memories can pass the claimed I6 pin. Require byte equality or a tracked-body-dirty refusal case.'
disposition = "fix-now"
response = """
Sustained. I6 still cited the assertion F-14 discredited: 'pinned by T24 (git cat-file -e ... must succeed)' while T24 had already moved to byte equality. Same incomplete-integration shape as F-16 — the decision landed in the test matrix and not in the invariant it pins.

I6 now reads: pinned by T24 as BYTE EQUALITY — git show "$verified_sha:<uid-dir>/memory.md" equals the on-disk body — with the explicit statement that existence is not the assertion and never was sufficient, since any stale ancestor blob at that path satisfies it. Also corrected to <uid-dir>, per F-15."""

[[finding]]
id = "F-15"
status = "verified"
severity = "blocker"
title = "claim probe is blind when verify is given a key: symlink pathspec matches only the symlink"
detail = """
Expected: the claim probe (§ 5.2/§ 5.4, the F-1/F-6 remedy) measures the memory's own item directory, so an uncommitted body always refuses (I6, T24).

Observed: run_verify resolves the item dir via resolve_show(items_root, mref) -> fsutil::safe_join(items_root, name) (src/memory.rs:3380, src/fsutil.rs:20-33). safe_join is a plain tree_root.join(rel) with NO canonicalisation, so when the reference is a KEY the returned dir is .doctrine/memory/items/<key> — which is a SYMLINK to the uid dir (verified: 388 entries in items/ are key symlinks, e.g. mem.concept.backlog.work-intake-membership -> mem_019ea25af18d77e2b0f981473c50753e).

Git does not traverse symlinks in pathspecs. Proven in a scratch repo (git 2.54.0): with a tracked memory whose memory.md is modified, ALL THREE probe legs report clean via the key pathspec and dirty via the uid pathspec —
  git diff HEAD --name-only -- items/<key>        => (empty)
  git diff HEAD --name-only -- items/<uid>        => items/<uid>/memory.md
  git diff-index --quiet --cached HEAD -- <key>   => exit 0 (clean)
  git diff-index --quiet --cached HEAD -- <uid>   => exit 1 (dirty)
  git ls-files -- items/<key>                     => 1 entry (the symlink itself)
  git ls-files -- items/<uid>                     => memory.md, memory.toml

So verify <key> on a tracked memory with an edited-but-uncommitted body stamps verified_sha = HEAD while HEAD does not contain the attested prose. This is F-1 exactly, resurrected through the reference form the design never enumerated.

Blast radius is the MAINSTREAM path, not an edge: D4/D8 clear the axis on every claim edit, so edit -> re-verify is the flow this slice creates, and agents address memories by key (the boot snapshot and /retrieve-memory both emit keys). The fresh-record case (T8) survives by luck — the untracked SYMLINK itself trips the untracked leg (verified) — so T8 passing proves nothing about this hole.

Remedy: claim_pathspecs must be built from the canonicalised uid directory, repo-relative, never from resolve_show's returned path. D5's own-directory drift count (git rev-list ... -- <dir>) has the identical exposure and must take the uid dir too. Pin with a test that verifies BY KEY against a modified tracked body and asserts refusal."""
disposition = "fix-now"
response = """
Sustained. Confirmed against the code and proven in a scratch repo before writing a line of remedy: safe_join is a bare join (src/fsutil.rs:20-33), items/ keys are symlinks (388 of them), and git does not traverse a symlink in a pathspec — diff-index --quiet via the key returns 0 (clean) against a body that diff via the uid reports as modified.

design.md § 5.2 now opens the claim-surface rule by rooting it at the CANONICALISED UID DIRECTORY, with the three-leg key-vs-uid comparison table as evidence rather than assertion, and states plainly that this is F-1 restored through the reference form on the mainstream edit -> re-verify flow. D5's own-directory drift count takes the uid dir for the same reason (§ 5.4). New invariant I7 — the claim surface names real tracked files, never a symlink standing in for them. New test T28 verifies BY KEY against a modified tracked body and requires refusal, with the note that the uid form passes either way, so the test must use the key form to have meaning.

Also recorded: T8's fresh-record case survives only because the untracked symlink itself trips the untracked leg. T8 passing is not evidence about this hole, and the design now says so."""

[[finding]]
id = "F-16"
status = "verified"
severity = "major"
title = "claim_pathspecs construction table states two git mechanics backwards and drops evidence it should keep"
detail = """
The F-6 round-2 remedy (§ 5.2 'claim_pathspecs construction is total') rests on three claims about git. Two are inverted and one is unsafe. Probed on git 2.54.0, this repo + a scratch repo.

ROW 'absolute path inside the repo'. Design says: 'git resolves a leading slash against the repo root, so unnormalised they match NOTHING'. Observed: git resolves absolute pathspecs against the FILESYSTEM and converts them to repo-relative — they match correctly.
  git ls-files -- /workspace/doctrine/src/git.rs      => src/git.rs
  git diff HEAD --name-only -- $S/items/<uid>/memory.md => items/<uid>/memory.md   (modified file, reported)
So the four items carrying absolute scopes (mem.fact.claude.jail-ro-git-is-bwrap-wrap-passthrough-commits, mem.fact.claude.subagentstart-fires-from-child-session, mem_019f36401beb76338b9eda2112f592b1, mem_019f363b08cc7221a624308e3fc24844) are NOT silently narrowed in the primary tree. Normalisation is hygiene, not a correctness fix, and the stated failure mode does not exist.

ROW 'absolute path outside the repo'. Design says: 'dropped — git cannot observe it', which reads as a benign no-match. Observed: git ABORTS.
  git diff HEAD --stat -- /etc/passwd  => fatal: '/etc/passwd' is outside repository
  git ls-files --others -- /etc/passwd => fatal: same
So the drop is MANDATORY, not tidy: pass one through and the whole probe dies and verify fails hard. Right rule, wrong reason — and the reason is what an implementer follows.

These two combine into an interaction the design does not enumerate: THE SAME SCOPE STRING IS INSIDE-REPO IN ONE CHECKOUT AND OUTSIDE IT IN ANOTHER. '/workspace/doctrine/src/worktree/jail.rs' is inside the primary tree and outside a dispatch worktree at any other path. So classification is a property of the checkout location, not the string, and a memory's claim surface silently narrows depending on WHERE it is verified from — in a repo whose whole dispatch model is linked worktrees. E7 makes it audible but the design never says the surface is location-dependent.

ROW 'gitignored path -> dropped'. Unsafe and unnecessary. Ignore rules do not apply to TRACKED files, so a force-added tracked file under an ignored root is real, claim-relevant evidence that the drop discards. Keeping the pathspec costs nothing — it matches nothing in all three legs when genuinely untracked (worktree diff and diff-index see only tracked paths; ls-files --others --exclude-standard skips ignored) — and detecting 'gitignored' at all needs an extra git check-ignore call. Dropping is strictly weaker than keeping, buys nothing, and costs machinery. Verified .doctrine/state/ is ignored (.gitignore:39) with 0 tracked files TODAY, which is a fact about today, not an invariant.

The premise the whole table is built on IS sound and is confirmed: git does not fail an unmatched repo-relative pathspec absent --error-unmatch (git diff HEAD -- src/nope.rs => exit 0, no output). Silent narrowing is real; the table just mislocates where it comes from."""
disposition = "fix-now"
response = """
Sustained on both sites, and the meta-point lands harder than the finding.

Site 1 (§ 10 round-2 narrative): still recited 'git resolves against the repo root and therefore match nothing', 'gitignored ... shrink the claim surface silently', and 'E7 makes every drop audible' — all three superseded by F-16 round 3 and D10. Rewritten to record only that F-6 was correct to fire, with pointers to the live rule.

Site 2 (§ 5.2 table): 'normalise so the pathspec set is legible and checkout-independent' sat two paragraphs above E9 stating the classification IS checkout-dependent. Reworded: normalisation keeps the emitted pathspec stable across checkouts *when the entry is observable at all*, which is itself checkout-dependent.

The pattern is now the third occurrence, and it was committed in the very edit that named it for the third time. So the remedy is no longer 'sweep harder'. § 10 now states the mechanical rule instead: normative sections are the single source, and history sections POINT at them rather than restating them. A design doc that narrates its own history accumulates exactly the stale text that hides the next finding — which is what happened here, twice."""

[[finding]]
id = "F-17"
status = "verified"
severity = "minor"
title = "T20b cannot fail: it pins claim_snapshot on the one field apply_edit already guards"
detail = """
Expected (F-8 remedy): T20b — 'set --title to its existing value => does not clear' — demonstrates that claim_snapshot COMPARES rather than counting supplied flags.

Observed: apply_edit already guards title. src/memory.rs:3826-3831 reads the existing value and only assigns when 'existing != trimmed'; summary (:3837-3843), lifespan and review_by do the same. So an idempotent --title yields toml_changed = false regardless of claim_snapshot, and T20b passes even if claim_snapshot were absent, buggy, or wired to flag-presence. A test that cannot fail for the reason it names verifies nothing.

The discriminating case is scope. All three scope arrays are replaced UNCONDITIONALLY with no comparison — src/memory.rs:3944-3978, each arm building a fresh toml_edit::Array and setting 'changed = true' outright. So apply_edit's bool is a CHANGED flag for the scalars and a SUPPLIED flag for the scope arrays, and claim_snapshot's comparison is genuinely load-bearing only there. Retarget T20b at --path-scope set to its existing value.

Consequent behaviour the design should state rather than let an implementer discover: an idempotent --path-scope still stamps 'updated' (apply_edit sets changed, so the terminal block at :3980-3983 fires) while claim_snapshot correctly declines to clear the attestation. Defensible, but it is the only place where 'updated' moves and the verification axis does not, and nothing currently asserts it."""
disposition = "fix-now"
response = """
Sustained. apply_edit guards title/summary/lifespan/review_by by comparison (src/memory.rs:3826-3843) and sets changed unconditionally for all three scope arrays (:3944-3978) — so its bool is a changed flag for the scalars and a supplied flag for the scope arrays, and T20b as written passed with claim_snapshot absent.

T20b retargeted to --path-scope, with the reason stated in the test row so it is not silently reverted to the more readable title case. § 5.4 gains a paragraph naming the asymmetry and the code sites, so the implementer knows WHY the comparison exists rather than inferring that apply_edit is careless.

The divergence that falls out is now stated instead of discovered: an idempotent --path-scope stamps updated while the attestation survives. Defensible — updated tracks the write, the axis tracks the claim — but it is the only place the two move apart, so T29 asserts it."""

[[finding]]
id = "F-18"
status = "verified"
severity = "blocker"
title = "Expected scope data to name evidence literally; observed scope.paths can inject Git exclude magic and subtract the claim surface"
detail = 'Expected: user-authored scope.paths values are data naming claim evidence, and the mandatory uid directory cannot be removed from the positive claim probe. Observed: .doctrine/slice/230/design.md:180-185 defines the input as arbitrary Git pathspecs and :259-266 contributes repo-relative paths as-is; current apply_edit accepts every supplied string verbatim at src/memory.rs:3942-3952. On Git 2.54.0 in /tmp/rv307-git-probes2.kfnIsT, a modified tracked items/uid/memory.md appeared under `git diff HEAD -- items/uid`, but `git diff HEAD -- items/uid ":(exclude)items/uid"` exited 0 with no output. Therefore a scope.paths entry carrying pathspec magic can subtract the canonical uid directory and restore the F-1/F-15 false attestation. Path entries must be encoded as literal pathspec data, and glob entries must be constructed through a controlled glob form; T26 must pin leading-colon/magic input.'
disposition = "fix-now"
response = """
Contest sustained. My round-4 claim of totality was wrong and the way it was wrong matters more than the gap.

I probed the prefix rule against every magic form — :(exclude), :!, :^, :(exclude,glob), :(glob,exclude), :/, :(top), :(attr:x), bare colon — and read exit=1 as 'neutralised'. For the EMPTY entry, exit=1 meant 'the surface is now the entire index and something in it is dirty'. The probe could not distinguish neutralisation from total expansion, so it proved nothing about the case it was supposed to cover. That is F-17's defect — a test that cannot fail for the reason it names — committed by the party that raised F-17, one round later. Recorded as a standing lesson in § 10 rather than as a one-off.

Verified your charge directly: git ls-files -- ':(literal)' returns every tracked file (6/6 in the scratch repo). With an empty scope entry present, the claim probe refuses on unrelated src dirt where the correct answer is clean.

Fixed as E11: an empty or whitespace-only entry is dropped before emission and refused as malformed (D10's first class) — never prefixed, never emitted. NO BARE MAGIC PREFIX IS EVER EMITTED. Note the raw path is not survivable either: git rejects an empty pathspec outright ('fatal: empty string is not a valid pathspec'), so the entry must be filtered whichever way the prefix rule goes. T34 pins the discriminating half — the constructed surface is asserted NOT to contain a bare :(literal)/:(glob), rather than asserting a refusal that would pass for the wrong reason.

The non-empty forms are confirmed neutralised on both arms, including :(glob) — which I re-tested after you flagged the possible asymmetry; it neutralises as reliably as :(literal)."""

[[finding]]
id = "F-19"
status = "verified"
severity = "major"
title = "Expected validate to reuse the repaired claim surface; observed it retains the principal-path-only scope.paths assumptions"
detail = "Expected: the D5 drift count watches the same uid-rooted, normalised claim evidence that verify attests, including glob scopes and items with no scope.paths. Observed: .doctrine/slice/230/design.md:461-479 says only to add the uid directory alongside the existing scoped-paths count and T13 at :682 does not require an empty-path or glob-only item. The live seam at src/memory.rs:3413-3419 is gated by `!memory.scope.paths.is_empty()` and passes only raw `memory.scope.paths` to commits_touching; it ignores scope.globs and does not share the F-15/F-16 construction rule. A real verified item, mem.fact.claude.pretooluse-hook-fail-open, has scope.paths=[] and non-empty scope.globs. Thus an implementation can satisfy the written D5/T13 on a path-scoped fixture while validate remains blind to committed evidence changes for glob-only claims and can retain raw absolute or magic pathspec assumptions. Specify one shared claim-surface constructor for verify and validate, and pin empty-path plus glob-only drift."
disposition = "fix-now"
response = """
Contest sustained on both limbs, and the second limb reversed the round-4 decision rather than refining it.

Limb 1 (the constructor is unavailable at validate) — verified, and it is worse than 'unavailable'. memory_health_findings(root, &[Memory], today) at src/memory.rs:3400 receives no directory; run_validate discards _dir at :3480-3483; and collect_all at :2826-2834 unions items/ and shipped/ into one Vec<Memory>, so the row's ORIGIN is not merely absent but unrecoverable from uid — which is why read_body at :2788-2797 probes both roots. See F-28.

Limb 2 (canonicalisation corrupts the historical query) — verified, and this is the one that changed the decision. See F-27. Measured, git 2.54.0: after a committed retarget of link from real/a to real/b, rev-list BASE..HEAD -- link returns 1 and the same over the canonicalised real/b returns 0.

So D11 is NARROWED, not repaired: the claim-surface constructor serves verify alone. validate keeps its raw seam and gains only D5's own-directory count. My round-4 reasoning ('two constructions in one slice is the parallel implementation A1 rejected') was wrong because the two verbs are not asking the same question — verify asks 'dirty now' where canonicalisation is mandatory, validate asks 'commits since' where it is actively wrong. A shared surface is not shared correctness.

The raw seam's four defects are retained deliberately and named rather than silently inherited; T31 is retargeted to PIN the gap (glob-only memories still not staleness-checked) so R7 cannot be silently closed or widened. Fixing them means building validate a history-stable surface — a second constructor with different rules — which is corpus-wide staleness ranking, i.e. OQ-2's deferred decision. Carried as R7, routed as IMP-317 with corrected scope and cost."""

[[finding]]
id = "F-20"
status = "verified"
severity = "blocker"
title = "Expected D10 to reject unobservable scope evidence; observed a tracked symlink contributes while its target is invisible"
detail = "Expected: D10's contributing-entry test and I7 ensure every declared path on the claim surface names observable tracked evidence, so a target change cannot pass verify clean. Observed: design.md:313-325 defines contribution solely through git ls-files --error-unmatch, while I7 at :578-581 claims the claim surface names real tracked files, never a symlink standing in for them. On Git 2.54.0 in /tmp/rv307-round5-git.UZlCjm, a tracked external-link symlink to /tmp/rv307-round5-external.YEmabG passed 'git ls-files --error-unmatch -- :(literal)external-link' (exit 0); after changing external-link/evidence.txt, 'git diff --quiet HEAD -- :(literal)external-link' still exited 0, and the nested path matched no tracked file. The parent source leg is likewise clean. A memory scoped to the symlink therefore passes D10 and can attest while the evidence reached through its declared path changed. Expected refusal or an explicit contract that symlink scope entries attest only the link inode; observed a contributing-but-unobservable false attestation path."
disposition = "fix-now"
response = """
Contest sustained. I9 was neither total nor internally consistent, and the way it failed is the round's lesson.

Reproduced all three limbs (git 2.54.0):
  - realpath -e on a deleted path (src/worktree.rs) exits 1; on a glob (.claude/workflows/**) exits 1. Existence-requiring resolution cannot serve two of D10's classes.
  - a tracked symlink to an external target: ls-files --error-unmatch on the link exits 0 (contributes), while the canonical absolute path aborts exit 128. Two mandated responses for one entry.
  - and one you did not charge, found while fixing: ':(glob)<slug-symlink>/**' matches 0 files and reports clean against a modified target, exactly as the literal form did in F-20. Glob scopes are symlink-blind too. No glob declaration in this corpus is currently symlink-rooted, so it is latent, not live — closed at zero migration cost.

Root cause: I stated I9 as a universal ('nothing reaches the claim surface uncanonicalised') without checking the domain it holds over. That is the inverse of the error this review kept finding — not a remedy too narrow for its invariant, but an invariant too broad for its remedy. It also produced F-27, one verb over.

Fixed structurally. § 5.2's case table is replaced by an ORDERED ALGORITHM whose classes are decided by probe outcome, never by the shape of the string: empty refuses; shape splits pattern from concrete path; a pattern resolves its longest wildcard-free prefix and re-appends the tail; resolution outcome then classifies — inside the repo emits, outside refuses as malformed (E13, the collision cut in favour of the probe, since aborting the probe IS the malformed class's definition), does-not-resolve goes to history. I9 is now total by construction because the two unresolvable shapes are refused rather than emitted, and it is explicitly SCOPED to verify (F-27). T36 pins the glob case, T27 the collision."""

[[finding]]
id = "F-21"
status = "verified"
severity = "major"
title = "Expected D10's accepted cost to describe the corpus migration; observed 55 current items become unverifiable"
detail = "Expected: a refusal rule that deliberately breaks existing verification enumerates its real migration cost before planning. D10 at design.md:691-693 states only that the absolute-scope items fail from a linked worktree. Observed: a full CLI-derived census using memory list --all --json and memory show --json for every row found 386 addressable items and 438 declared path/glob entries. Applying the proposed literal/glob prefixing plus git ls-files --error-unmatch individually on Git 2.54.0 refuses 55 items in the primary checkout, not merely linked worktrees: 51 are active, and 12 active items already carry a non-empty verified_sha. There are 59 non-contributing entries, including retired paths such as src/worktree.rs and src/skills.rs, ignored runtime paths such as .doctrine/state/slice/, and absent installed surfaces under .claude/. The remedy may be principled, but the design contains no 55-item scope migration, compatibility step, or acceptance of disabling re-verification for roughly 14% of the item corpus. Expected a shippable transition; observed an undeclared corpus-wide breaking change."
disposition = "fix-now"
response = """
Sustained. I ran the same census independently before your report landed and reached the same figure — 55 items, 59 non-matching entries — over a denominator of 236 memories that declare any path or glob scope (23%); your 51-active refinement is accepted and is the number that matters, since inactive items are not attestation candidates.

This is the finding that changed a decision rather than a mechanism, so it went to the user rather than being absorbed. D10 is re-cut to classify non-contribution (see F-6's disposition for the four classes). The determining evidence was the composition of the 55, not the count: they split into genuine memory defects (src/worktree.rs, src/skills.rs — files since refactored into directories, where refusal correctly forces a fix) and paths git can never observe (.claude/workflows/**, .mcp.json, .worktrees/**, .doctrine/state/slice/), where refusal would make an entire class of harness memory permanently unattestable. A blanket rule cannot tell those apart, which is why the round-4 answer was wrong rather than merely expensive.

Recorded in D10 as a rejected alternative with the measurement attached, so the reasoning survives: correctness that costs a fifth of the corpus is a decision to take deliberately, and this design declines it."""

[[finding]]
id = "F-22"
status = "verified"
severity = "major"
title = "Expected review history to point at normative rules; observed section 10 still restates them throughout"
detail = "Expected: the structural remedy claimed at design.md:1021-1029 makes normative sections the single source and history sections point rather than restate, preventing a fourth stale copy. Observed: only the round-2 F-6 paragraph follows that rule. Section 10 still restates live mechanisms and outcomes at :916-921 (claim_snapshot and idempotent-title behaviour), :935-944 (allow-dirty capture and T24 byte equality), :953-967 (uid canonicalisation, absolute-path mechanics, ignore handling, T20b), and :989-1003 (D10 refusal, magic-prefixing/I8/T30, and D11). The latter passages are exactly the newly changed rules most likely to drift. Expected the asserted mechanical sweep remedy to be applied document-wide; observed the document immediately violates it in the same section that declares it, leaving multiple normative copies whose consistency remains manual."
disposition = "fix-now"
response = """
Contest sustained again, and round 7 supplied a sixth instance — inside the very section the round-6 remediation had just rewritten to stop doing this.

The round-6 response deleted the mechanism descriptions and left a pointer table, which was the right structural move and held for the passages you cited. What it did not catch: the Round 6 NARRATIVE paragraph then described the round-6 D10 cut in the present tense — "D10 now refuses where refusal is *actionable*, at a measured cost of 4 currently-stamped active items" — with the 30/43/13 census inline. DEC-020 superseded that cut at round 7, so the paragraph was asserting a withdrawn rule as current, in a section whose stated contract is that it points and does not restate. Exactly your finding, one round later, in the fix for it.

Fixed at f63c267c by applying the rule to the narrative subsections, not only to the passages you enumerated:
  - The round-6 paragraph now carries ONLY the practice that survives — a class boundary of this shape is taken on a census of the whole corpus, and re-measured when the discriminator changes — and points at D10/DEC-020 as authoritative. No rule, no number.
  - The new Round 7 subsection is written to the same constraint from the start: it names what fired, says the classification attempt ENDED rather than describing what replaced it, and explicitly defers to D10 and § 5.2.
  - Pointer table extended with F-31 through F-35, which had no rows at all.

The generalisation, now stated as structural rather than as diligence: ANY historical paragraph that names a number or a rule will eventually describe a superseded one, because a round updates the ledger and the normative section but not the narrative. So history may name what fired and where it landed — nothing a reader could act on. The one durable exception is a PRACTICE (how a decision of this kind is taken), which cannot go stale the way a rule can.

Related, and the reason the counts line survives at all: F-35 established that even the round/finding counts in this section's preamble were wrong. That line now directs the reader to `doctrine review status RV-307` instead of asserting a number."""

[[finding]]
id = "F-23"
status = "verified"
severity = "major"
title = "Expected magic-prefixing to encode every scope value as inert data; observed an empty value becomes a whole-index pathspec"
detail = "Expected: design.md:288-294 says prefixing renders the remainder inert and a hostile entry degrades to a literal path that matches nothing; D10 then refuses it as non-contributing. Empty scope values are reachable because apply_edit copies path/glob strings verbatim at src/memory.rs:3942-3965 and the CLI accepts empty flag values. Observed on Git 2.54.0 in /tmp/rv307-round5-git.UZlCjm: both 'git ls-files --error-unmatch -- :(literal)' and the corresponding :(glob) form exited 0 and listed the entire index. Thus empty scope.paths or scope.globs evades D10 and expands validate's commit count to the whole repository rather than naming no evidence. Every tested non-empty magic form was neutralised (:!, :^, :/, exclude+glob, attr, bare colon), but the empty boundary falsifies the total construction claim and is absent from T30. Expected reject/normalise empty entries or encode them without the bare-prefix sentinel; observed a reachable semantic wildcard."
disposition = "fix-now"
response = """
Sustained — see F-18's disposition, which carries the full response since the two are one defect: the magic-prefix rule was correct for hostile input and inverted for empty input.

Summary here for the ledger: a bare :(literal)/:(glob) matches the entire index (verified, git ls-files -- ':(literal)' returns every tracked file), so an empty or whitespace-only scope entry expands the claim surface to the whole repository instead of narrowing it, and verify then refuses on unrelated dirt anywhere. Fixed as E11 — empty entries are dropped before emission and refused as malformed (D10 class 1); no bare magic prefix is ever emitted. T34 asserts the constructed surface does not contain one, rather than asserting a refusal that would pass for the wrong reason.

Also recorded: raw, the empty entry aborts the probe outright, so it must be filtered regardless of the prefix rule. The prefix was never the only thing standing between this design and that failure."""

[[finding]]
id = "F-24"
status = "verified"
severity = "major"
title = "Expected D11 to be the single scope-derived Git surface; observed retrieve remains a third raw consumer"
detail = "Expected: D11 at design.md:513-530 and :694-701 establishes one claim-surface constructor rather than leaving an adjacent path with the assumptions F-19 condemned. Observed: src/retrieve.rs:551-569 is a third Git consumer derived from a memory's scope; it gates on scope.paths, passes scope.paths raw to commits_touching, omits scope.globs and the uid directory, and performs no absolute normalisation or magic neutralisation. The same file's staleness mode at :354-377 also keys commit freshness on paths only. OQ-2 at design.md:618-620 defers feeding own-directory drift into retrieve, but does not acknowledge that retrieve already derives a divergent scope path-set. Expected D11 to name and reconcile every scope-derived Git surface, or narrow its claim and explicitly adjudicate this consumer; observed the principal-path repair has moved one sibling over while the next sibling retains the dead assumptions."
disposition = "fix-now"
response = """
Contest sustained and unchanged by DEC-020 — recorded explicitly, because this is one of the two returned contests the ruling does NOT touch, and treating it as swept up would be the easy error this round.

The position, restated once and not re-argued: `retrieve::git_facts` (`src/retrieve.rs:556`) remains a raw scope-derived consumer, and `validate`'s staleness check (`src/memory.rs:3413-3421`) is a second one. D11 no longer claims otherwise — it is narrowed to serve `verify` alone (F-27), not because sharing was inconvenient but because the two verbs ask different questions: `verify` asks *dirty now*, where canonicalisation is mandatory, and `validate`/`retrieve` ask *commits since*, where canonicalising against today's checkout erases a committed symlink retarget (measured 1 → 0). R7 names both consumers; T31 and T32 pin the gap so it can be neither silently closed nor silently widened.

VERIFIED BEFORE RE-ANSWERING, rather than asserted. The round-6 response claimed IMP-317 had been rewritten with the corrected cost. Read back this round: IMP-317's body carries the F-28 correction verbatim — `memory_health_findings(root, &[Memory], today)` at `:3400` receives no directory, `run_validate` discards `_dir` at `:3480-3483`, `collect_all` at `:2826-2834` unions items/ and shipped/ so origin is UNRECOVERABLE from uid, and adoption is therefore a dataflow change threading item-directory provenance, not a call-site swap. It also carries the gate on OQ-2/QUE-175 and the `wont-do` disposition if that answers "no". QUE-175's body likewise carries the corrected framing. Both records match what the ledger says about them.

Why DEC-020 does not reach this. The ruling governs how `verify` treats a non-contributing entry on ITS OWN surface. It does not build a surface for `validate` or `retrieve`, and it does not change the historical-versus-current-state distinction that forced D11's narrowing. If anything it slightly sharpens the standing risk you named: with `verify` no longer refusing on non-contribution, the two weaker notions of "scoped drift" are now the only signal for a moved source path, and they are the ones driving staleness and ranking. R7 stands as written, deliberately.

The bound remains legitimate; what was illegitimate was round 5's claim that lifting it was cheap. That is corrected on the record, in the routing item, and in R7."""

[[finding]]
id = "F-25"
status = "verified"
severity = "blocker"
title = "Expected every successful stamp to cover declared path evidence; observed D10 explicitly attests partial surfaces"
detail = "Expected: F-6's remedy must prevent verify from stamping when a declared path/glob contributes no observable evidence, because a warning or later health finding cannot make the present attestation true. Observed: .doctrine/slice/230/design.md:345-357 and D10 at :765-777 direct verify to report stale and natively-unobservable entries, then attest anyway; the text itself concedes at :339-340 and :770-771 that a warning does not make an unobservable claim committed. A full CLI-derived scan (, then  for all 417 rows) found 63 memories with at least one nonobservable/nonmatching declaration under the proposed prefixed probes, 59 active and 13 already carrying verified_sha. Thus the remedy restores F-6's false overclaim by policy rather than accident: a changed .mcp.json/.claude workflow may be the memory's declared evidence, yet verify stamps a surface that excludes it. Expected refusal or a content-bearing anchor for uncovered evidence; observed report-now/validate-later followed by a successful false attestation."
disposition = "descoped-to-SL-232"
response = """
Contest sustained; **descoped to SL-232** (DEC-027), not resolved and not withdrawn.

Your charge — that a stamp covering less than the declared evidence is a false attestation by policy rather than by accident — was never fully answered. Round 6 answered it with a class boundary; round 7 replaced that with DEC-020's weak reading plus a routed residual; round 8 you contested that, and the contest stands: adopting the advisory explicitly makes the design *consistent*, but consistency is not the same as making the present stamp true. It does not close what you raised.

**What that residual is now recognised to be.** It is not a wording problem and not a boundary problem — it is a **missing field**. A stamp cannot distinguish full from partial coverage because coverage is not recorded anywhere. DEC-020 established the same conclusion from the other direction: the only boundary that survives cloning is a **declared** one, on the record, not derived from local repository state. Both roads end at a schema change, and SL-230 had "no change to the memory TOML/MD schema" as an explicit non-goal — so inside this slice your finding was **structurally unanswerable**. Three rounds of instruments were, in retrospect, attempts to answer it without the field it requires.

That is the substantive reason for the split rather than a procedural one. SL-232 carries the schema change as **objective 3**, scoped with IMP-318 (persist attested coverage) and QUE-173 (body digest), because all three exist to make an attestation say more than a sha. Your finding is what that objective is for.

Inherited explicitly: SL-232 § 6 **OQ-6** (should non-contribution refuse, and the declared-boundary answer), § 8 **R8** (the stamp records no coverage, widened by DEC-020 to span all non-contribution rather than only the never-tracked), and § 10's contested-inherited list, which names this as SL-232's to answer.

**Not conceded:** that refusal is the right answer. Three derived instruments were refuted on measurement (F-21, F-25, F-31), and a fourth derived one is still not a finding. What is conceded is that "report it and route the residual" is a holding position, not a closure — which is exactly what you charged."""

[[finding]]
id = "F-26"
status = "answered"
severity = "major"
title = "Expected I9 to define a total pre-pathspec transformation; observed two classes cannot be canonicalised and one has contradictory outcomes"
detail = "Expected: I9 at .doctrine/slice/230/design.md:643-645 and section 5.2 at :323-326 define how every declared entry is symlink-resolved before emission, with a total, disjoint D10 classification. Observed on Git 2.54.0: realpath -e returned exit 1 for both a deleted path and .claude/workflows/**; the former is D10 stale and the latter is a glob pattern with no single real path. The construction table at :265-266 nevertheless emits glob patterns directly, without resolution. A tracked symlink to /tmp/rv307-external-target canonicalised outside: git ls-files --error-unmatch on the link returned 0, while the canonical absolute path aborted with exit 128. Section 5.2:323-325 classifies that result unobservable/report-and-attest, but D10 :347 and :765-769 classifies absolute-outside malformed/refuse. The same entry therefore has two mandated responses, and 21 path declarations in the 417-memory corpus currently fail existence-requiring canonicalisation. Expected an explicit ordered algorithm covering patterns, missing paths, and outside targets; observed an unimplementable universal invariant and a response collision."
disposition = "descoped-to-SL-232"
response = """
Contest sustained; **descoped to SL-232** (DEC-027).

Your contest is vindicated by F-37 in the same round, and that is the honest framing. F-26 charged that I9 was stated past the domain it holds in — an invariant asserting totality over a transformation that cannot be applied to two of its inputs. Round 6 answered with the ordered algorithm and claimed totality by *refusing* the unresolvable shapes. Round 7 narrowed that (DEC-020 removed one refusal, so absent paths were emitted inert instead) and re-asserted totality on new grounds: an absent path carries no evidence, so nothing uncanonicalised bears evidence.

F-37 falsified that too, by three routes. So I9 has now been asserted as total **three times** and refuted three times, each time on different grounds. The pattern is the one your finding named at round 6 and it has not been broken: the invariant keeps being stated over a domain that has not been enumerated.

**What travels to SL-232, and why it is not a patch.** The remaining work is not a third rewording of I9. It is: enumerate the reachable entry shapes — `..` aliases, sparse checkout, `skip-worktree`, literal filenames containing glob metacharacters, case-insensitive collisions, `core.quotePath`, control characters (F-38) — probe each, and only then state a rule over the set that was measured. Plus the structural correction F-37 exposed underneath: path-versus-pattern must come from **which field the entry was declared in** (`scope.paths` vs `scope.globs`), not from sniffing characters, because the schema already carries the distinction and step 2 discards it.

Carried as SL-232 § 8 **R-A** with that shape list as a standing obligation, § 5.5 marking I9 falsified-as-written and retained so the replacement is authored against the reasoning that failed, and § 10's contested-inherited list.

**What stands from your original finding and should not be re-litigated:** the class collision is cut in favour of the probe — where an entry points is not the test, what it does to the probe is — and that cut survived both DEC-020 and F-32, which widened E13 twice on your own reasoning. That part is settled."""

[[finding]]
id = "F-27"
status = "verified"
severity = "blocker"
title = "Expected validate to count history over the attested surface; observed current canonicalisation erases symlink-retarget commits"
detail = "Expected: D11 at .doctrine/slice/230/design.md:562-580 may share construction only if validate still answers its historical question: commits touching the evidence since verified_sha. Observed on Git 2.54.0 in /tmp/rv307-r6.dDb2g4: after base recorded link -> real/a and a later commit retargeted link -> real/b, git rev-list --count BASE..HEAD -- link returned 1, while the same command over the current canonical target real/b returned 0. Magic itself is accepted: raw src/git.rs and :(literal)src/git.rs both returned 1; raw src and :(literal)src both returned 1. The regression is canonicalising against todays checkout before querying yesterday-to-today history. A verified memory scoped by the link can therefore survive a committed retarget with no validate staleness finding. T31/T32 test current surface equality, not historical identity; T33 tests dirty target content, not a committed link retarget. Expected a history-stable representation or separate validate construction; observed D11 silently changes the existing drift count into a false negative."
disposition = "fix-now"
response = """
Sustained. This is the round's most consequential finding and it refutes a decision, not a mechanism.

Reproduced independently before answering (git 2.54.0, scratch repo, base records link -> real/a, a later commit retargets link -> real/b):
  rev-list --count BASE..HEAD -- link      => 1   (the retarget is drift, correctly counted)
  rev-list --count BASE..HEAD -- real/b    => 0   (canonicalised: the drift disappears)
  diff-index --quiet HEAD -- link          => 0   (blind — why verify MUST canonicalise)
  diff-index --quiet HEAD -- real/b        => 1   (dirty — correct for verify)

One transformation, opposite correctness on the two consumers. verify asks 'is this evidence dirty right now'; validate asks 'how many commits touched it since verified_sha'. Canonicalisation resolves against today's checkout and then queries yesterday-to-today history.

So D11 is narrowed: the constructor serves verify alone, and validate keeps its raw seam plus D5's own-directory count. I9 is explicitly scoped to verify. This is the inverse of the error the review has been finding for five rounds — not a remedy authored against the finding, but an invariant (I9, from F-20) generalised past its domain and then handed to a sibling verb by D11. Recorded in § 10 as such, because the two failure modes need distinguishing: the fix for over-specificity was over-generality.

Your point that T31/T32 tested current-surface equality rather than historical identity is taken and is the sharper half. T32 is inverted: it now asserts validate does NOT canonicalise, using a committed symlink retarget, and fails if verify's surface leaks into the staleness seam. Surface equality between the two verbs is explicitly no longer asserted — round 5's T32 asserted it and was wrong.

D5's own-directory count is unaffected: the uid directory is reached by resolving the key symlink, and a uid never changes, so there is no retarget for history to lose. Stated in § 5.4 rather than left to be inferred."""

[[finding]]
id = "F-28"
status = "verified"
severity = "major"
title = "Expected D11s constructor inputs at both consumers; observed validate and retrieve discard item-directory provenance"
detail = "Expected: .doctrine/slice/230/design.md:591-595 and D11 :778-789 make constructor(root, memory, dir) usable by validate now and later adoptable by retrieve as a call-site swap. Observed: memory_health_findings(root, memories, today) at src/memory.rs:3400 receives only Memory values; run_validate discards _dir for a single reference at :3480-3483 and corpus mode calls collect_all at :3485. collect_all at :2826-2834 unions items and shipped into Vec<Memory>, erasing which root supplied each row. retrieve::git_facts at src/retrieve.rs:556 and its caller at :628 likewise have root, Memory and Snapshot but no dir; read_body at src/memory.rs:2788-2797 must probe items then shipped, confirming origin is not present in Memory. Thus validate cannot call the specified constructor without a dataflow/signature redesign, and IMP-317 is not a two-argument replacement. Expected a constructor signature supported by actual call sites or an authored provenance change; observed D11s integration and R7 mitigation rest on an unavailable argument."
disposition = "fix-now"
response = """
Contest sustained. Nothing in DEC-020 touches this finding, and the round-6 response is reaffirmed rather than revised — but re-verified rather than assumed, since its whole substance was a claim I had made without checking.

Re-confirmed against source this round: `memory_health_findings(root, &[Memory], today)` at `src/memory.rs:3400` takes no directory; `run_validate` discards `_dir` at `:3480-3483`; `collect_all` at `:2826-2834` unions `items/` and `shipped/` into one `Vec<Memory>`; `read_body` at `:2788-2797` probes both roots, which is the standing proof that origin is not carried on the row; `retrieve::git_facts` at `src/retrieve.rs:556` and its caller at `:628` have `root`, `Memory` and `Snapshot` and no `dir`.

The sharp part remains the one your finding supplied and mine had missed: the directory is not merely ABSENT, it is UNRECOVERABLE from uid, because `collect_all` has already erased which root supplied the row. I had assumed derivability when choosing the signature. That is the difference between "not wired up yet" and "cannot be wired up without a dataflow change", and it is what made this a finding rather than a note.

Both consequences remain taken: D11's integration claim is withdrawn (`validate` does not call the constructor at all — F-27 forces that independently), and R7's mitigation states the corrected cost. IMP-317's body was read back this round and carries it — the `collect_all` provenance-erasure argument is in the item verbatim, not merely referenced.

One thing worth recording for the ledger rather than left implicit: DEC-020 does not reduce this finding's force by removing the classification `validate` would have had to reproduce. `validate` still needs a history-stable surface to answer its own question correctly (glob-only memories get no drift signal today), and that need is independent of whether `verify` classifies non-contribution. IMP-317 is unaffected in scope and cost.

Bounding a slice is legitimate. Claiming the bound is cheap to lift, without checking, is not — and the discipline that follows from it is the one this round applied to your other findings: verify the call sites before describing them."""

[[finding]]
id = "F-29"
status = "verified"
severity = "major"
title = "Expected validate to define per-memory handling of malformed surfaces; observed only verify has a response"
detail = "Expected: a shared D11 constructor serving corpus-wide validate specifies what happens when one memory contains D10 malformed input, without aborting unrelated health checks or silently dropping the defect. Observed: .doctrine/slice/230/design.md:369-374 says the command tier refuses on malformed members, in the run_verify seam; :562-580 says validate consumes the same constructor, but gives no validate policy for its classified malformed list. E7 at :670-676 and T35 at :890 cover only stale/unobservable entries; T27/T34 cover verify only. Current run_validate scans all memories then reports accumulated findings at src/memory.rs:3471-3498. If construction returns an error, one bad row can abort the whole corpus scan; if it returns classifications, the design never says whether malformed is a finding and validation continues. Expected an explicit per-memory finding/continuation contract and discriminating test; observed a shared constructor whose second consumer has no defined behavior for its first class."
disposition = "fix-now"
response = """
Sustained as a real gap in the round-5 design, and dissolved structurally rather than patched.

The charge is correct on its own terms: § 5.4 specified the malformed refusal in run_verify's command tier, said validate consumes the same constructor, and then gave validate no policy for a malformed classification — with run_validate accumulating findings across the corpus at :3471-3498, so an Err return from construction would abort the whole scan on one bad row, while a classification return had no specified handling.

It no longer arises. D11 is narrowed (F-27): validate does not build a claim surface at all, so it has no malformed class to have a policy for. Its staleness check keeps the existing raw seam plus D5's own-directory count.

Recorded rather than dropped, because the gap would return the moment IMP-317 is taken up: whoever builds validate a history-stable surface must specify per-memory continuation before that constructor can serve a corpus-wide verb. Noted on IMP-317."""

[[finding]]
id = "F-30"
status = "verified"
severity = "minor"
title = "Expected R7 insertion to preserve adjacent R6; observed its heading was overwritten and its body fused into R7"
detail = "Expected: the round-5 risk sweep adds R7 without damaging the existing risk inventory. Observed: .doctrine/slice/230/design.md:829-837 ends R7, then :838 continues with the orphan fragment memory.** record -> verify, with no list marker or R6 title. Diff 03c89b4d..0b12ed0c0 shows the edit replaced the line beginning R6 — verify is now harder... with the new R7 heading while leaving the remainder of R6 in place. The rendered section therefore attributes two unrelated risks to R7 and no longer names R6. Expected a separate R7 bullet plus intact R6; observed the exact adjacent-text overwrite pattern this remediation claims to structurally prevent."
disposition = "fix-now"
response = """
Sustained, confirmed by diff. git show 03c89b4d:.doctrine/slice/230/design.md shows R6's bullet line ('- **R6 — verify is now harder to satisfy, not easier, for the freshly-recorded') was replaced by the new R7 heading, leaving R6's remaining four lines attributed to R7 and R6 unnamed in the rendered section.

R6 is restored intact and R7 rewritten in place above it. R8 added (the F-25 residual) as a separate bullet.

Taking the sting: this is the adjacent-text overwrite pattern in the very section that inventories the risks of not sweeping, committed in the edit that added a risk about an unconverted sibling consumer. Severity minor is right for the artifact, but it is the sixth instance of the same mechanical failure and the structural remedy (§ 10 points, never restates) does not reach § 8. The only defence there is the one the design already prescribes and I did not apply: after an edit, re-read the section rather than the diff hunk."""

[[finding]]
id = "F-31"
status = "verified"
severity = "blocker"
title = "D10's history discriminator is ref-set-dependent, not checkout-stable"
detail = "Expected: D10's stale/unobservable boundary must be stable across checkouts and hosts, as design.md:320-331 and :900-913 assert, so the same declaration cannot switch from refusal to attestation because a local ref differs (POL-002). Observed: Git 2.54.0 scratch repo. A branch-only commit 5d8b6f346405e01a7df9ce53b0d06892f028c628 tracked branch-only/path.txt. While the branch existed, 'git rev-list --all --max-count=1 -- :(literal)branch-only/path.txt' returned that commit. After 'git branch -D ephemeral', the identical command exited 0 with empty output, while 'git cat-file -e 5d8b6f346405e01a7df9ce53b0d06892f028c628^{commit}' still exited 0 and 'git fsck --unreachable --no-reflogs' reported the commit unreachable. A retained unmerged branch, conversely, makes --all report its add/remove history. Therefore --all means reachable from this clone's current refs, not 'ever tracked'; deleting a local ref changes D10 from stale/refuse to unobservable/report-and-attest without changing the worktree, entry, or extant commit object. T27c/T37 vary history content but do not vary ref reachability, so they cannot catch this decision-level false premise."
disposition = "fix-now"
response = """
Sustained, reproduced, and it ended the classification attempt rather than re-cutting it.

Reproduced independently (git 2.54.0, scratch repo): with the branch present, `rev-list --all --max-count=1 -- <path>` returns the commit; after `git branch -D`, it returns empty while `cat-file -e <commit>^{commit}` still exits 0. Your reading of `--all` is correct — it means REACHABLE FROM THIS CLONE'S CURRENT REFS, not "ever tracked". The design asserted checkout-stability and never probed it.

The charge is decision-level and was escalated rather than absorbed. The user ruled the question out of the slice: **DEC-020** — `verify` attests over every non-contributing scope entry, reports each on stderr, and `validate` raises them. No classification, no refusal on any of them.

Why the ruling rather than a fourth instrument. This boundary was drawn three times and refuted three times, and the pattern is not three unlucky choices: blanket refusal (F-21, 36 active items), filesystem existence (F-25, checkout-dependent), `rev-list --all` (F-31, ref-set-dependent). Every candidate reads LOCAL REPOSITORY STATE, and a shallow clone, a pruned repo, a fresh clone and a dispatch worktree legitimately hold different answers. A fourth derived instrument fails for the same reason as the first three.

Applied at f63c267c:
  - D10 shrunk. The only surviving refusal is the PROBE-ABORTING entry — empty (E11) or an emitted form outside the repo (E13) — because there git returns no verdict at all. That is a mechanical necessity, not a judgement about the memory, which is what makes the cut principled rather than merely smaller.
  - E12 WITHDRAWN, struck in place; the id is never reused.
  - E7 widened back to the whole of non-contribution.
  - § 5.2's history branch and the four-class table are gone; the ordered algorithm now ends at the `--error-unmatch` verdict.
  - T37 INVERTED into the DEC-020 regression test: one non-resolving entry under three ref states — never tracked, tracked on a live branch, that branch then `branch -D`'d — must produce an IDENTICAL outcome all three times. Your last sentence is the reason the third arm exists: varying history CONTENT cannot catch ref-set dependence, so the old T37 could not have failed.
  - Cost of the chosen cut: zero. No memory loses a stamp, where the round-6 cut cost 4.

What DEC-020 does not concede: the question is relocated, not dismissed. The answer that survives cloning is a DECLARED boundary — a signal on the record marking evidence git is not expected to observe — not one derived from repository state. That is a schema change of the same shape as IMP-318 and QUE-173, and the three are to be scoped together. Carried as design OQ-6.

The root cause, recorded because it outlives this slice: a property of a tool — stable, total, deterministic — is a CLAIM NEEDING A FALSIFIER, not a premise. Measuring that a discriminator works is not evidence that it is stable. Two of seven rounds went on that error."""

[[finding]]
id = "F-32"
status = "answered"
severity = "major"
title = "The ordered scope algorithm has reachable unclassified and misclassified patterns"
detail = "Expected: the §5.2 algorithm must be total and classify by probe outcome, as design.md:267-318 and :333-336 claim; a currently contributing glob must reach observable, and every non-resolving input must have a defined response. Observed under Git 2.54.0: in a scratch repo with tracked foobar/bar, 'git ls-files --error-unmatch -- :(glob)foo*/bar' exited 0 and printed foobar/bar, but step 3's textual 'longest wildcard-free prefix' is foo and 'realpath -e <repo>/foo' exited 1. The written algorithm therefore sends an observable glob to the non-resolving history branch and can refuse it as stale. Separately, non-resolving outside-shaped entries make the prescribed history probe abort, an outcome step 4 does not classify: 'git rev-list --all --max-count=1 -- :(literal)/tmp/rv307-no-such-absolute' exited 128 ('is outside repository'); ':(glob)/tmp/rv307-no-such-*/**' exited 128 ('Invalid path'); and ':(literal)../outside-no-such' exited 128. The ever/never sub-branches at design.md:302-312 omit probe abort. T36 covers a symlink-rooted directory prefix, not a wildcard inside a component; T27 covers resolvable outside targets, not non-resolving outside strings."
disposition = "descoped-to-SL-232"
response = """
Contest sustained; **descoped to SL-232** (DEC-027).

Round 7 fixed both limbs as stated — the whole-component prefix rule for limb 1, E13 widened to "the emitted form is outside the repository" for limb 2 — and those fixes are carried into SL-232 intact with their measured evidence (`:(glob)foo*/bar` → exit 0, `foobar/bar`; the four-row exit-code table separating a verdict from an abort).

**Why your contest is nevertheless correct.** F-37, raised in the same round, shows limb 1's fix was incomplete in a way I did not see. I corrected *where* the prefix splits while leaving intact the deeper error: **the algorithm infers path-versus-pattern from characters at all.** Your F-37 route 3 is the proof — a `scope.paths` entry whose real filename contains `*` is a concrete path, but step 2 reads the star and classifies it a pattern, so whole-path resolution is skipped and the entry contributes while bypassing canonicalisation. Fixing the split point does not touch that. The rule needs to take the distinction from the field the entry was declared in, which the schema already records and step 2 discards.

So limb 1 is *narrower* than I treated it: I answered "the prefix is computed wrongly" when the finding also implied "the shape classification has no business being textual." That is a structural change to step 2, in a document that has moved.

Limb 2's widening of E13 stands and was extended twice on your reasoning, but F-38 then showed even that taxonomy is not total — a NUL-bearing entry produces no git exit code at all, because no git process runs.

Carried into SL-232: § 5.2 steps 3-4 with the corrected prefix rule and the exit-code table, § 5.5 E13, tests **T38** and **T39** (both naming the tests that could not have caught these — T36 covers a symlink-rooted directory prefix, T27 covers resolvable outside targets only), § 8 R-A for the enumerate-then-probe obligation, and § 10's contested-inherited list."""

[[finding]]
id = "F-33"
status = "verified"
severity = "blocker"
title = "The design states incompatible strong and weak attestation contracts"
detail = "Expected: one normative definition of verified_sha must govern scope construction, success, and closure. Observed: design.md:433-436 deliberately defines the weak reading (everything git could observe; a proper subset of declared scope may be stamped), but design.md:604-607 says every declared scope path must be committed 'because that is what the stamp asserts'. The arraigned scope repeats the strong contract at slice-230.md:31-36 and :82-87 ('declared scopes are never excluded'; 'is the claim committed?') while only later acknowledging partial coverage at :114-116. The guiding principle at design.md:80-82 also says governance dirt says nothing although 81 memories declare .doctrine/** evidence and T25 makes such dirt claim-relevant. This is not historical wording: these are the guiding principle, mechanism conclusion, and governing scope. A planner can implement either refusal over every declaration or D10's partial attestation and remain textually compliant. The core stamp contract must not ship unreconciled."
disposition = "part-fixed-part-descoped"
response = """
Contest sustained. Your contest was correct and F-39 is the proof of it: round 7 claimed the strong reading was deleted from every normative site, and four sites survived — `design.md:227`, `:236`, `:624`, and **D9** at `:936`, all framing the first gate question as "is the **code** dirty?" while § 4 asserted the boundary is the *claim*. A decision site and a mechanism conclusion, not historical wording. So the incompatible-contracts charge was still live when you contested it.

**Where it stands now, split by slice.**

**SL-230 (this slice) is clean.** Verified by grep after the split, not asserted: zero occurrences of code-only framing in the narrowed `design.md`. Three of the four sites were gate text and the fourth was D9, a gate decision — all moved to SL-232 with DEC-027. § 4's principle here is now "attestation is about the claim", and the slice no longer contains any statement about what `verified_sha` asserts beyond invalidation semantics, because the stamp contract went with the gate. There is no longer a second reading in this document to conflict with anything.

**SL-232 inherits the unfinished limb**, and it is named rather than left to be rediscovered: § 0 lists it in the open-majors line, and § 7 carries an explicit note after D9 recording that its first gate question is worded "is the code dirty?" at three sites and contradicts § 4 — positioned so the next author cannot edit D9 without meeting it. § 5.2's weak reading is marked as the design's only reading, and § 10's settled-terrain list states the strong one must not be reintroduced.

**What was genuinely fixed at round 7 and stands:** the strong reading is gone from the mechanism conclusion (what must be committed is the body and every declared path *git can observe*), § 4's guiding principle no longer claims governance dirt says nothing — with the 81-item census and T25 as the reason — and `slice-230.md`'s three sites are reconciled. Your finding also surfaced a fourth site you had not cited (§ 4's principle), which was the premise of the whole conflict.

**The lesson, at the altitude your finding was actually about.** F-33 was the first instance of this ledger's stale-text pattern reaching the *core contract* rather than prose, and F-39 then showed the sweep that fixed it was one tier short. The sweep now has three tiers: normative prose, routing-record bodies (F-34), and queried metadata (F-39). Two normative readings of one stamp cannot coexist — but neither can a claim of completeness that was never checked against every tier the claim spans."""

[[finding]]
id = "F-34"
status = "answered"
severity = "major"
title = "QUE-175 still gates IMP-317 on the rejected shared-surface model"
detail = "Expected: F-24/F-28's sustained remedy must update every durable decision surface, especially the open question that gates IMP-317. Observed: 'doctrine knowledge show QUE-175 --json' and .doctrine/knowledge/question/175/record-175.md:9-12 still say one constructor is adopted by verify and validate; :19-23 routes retrieve through that shared constructor; :33-37 says later adoption is cheap and a call-site swap; :51-53 retains the superseded 236/55 census. In contrast design.md:648-713 and IMP-317 say verify-only, a distinct history-stable construction, and a provenance-threading dataflow change. The live gating question would direct the follow-up to reintroduce F-27 and understate F-28's cost."
disposition = "fix-now"
response = """
Contest sustained, and **now actually fixed** — the limb that justified your contest is closed this round.

Round 7 claimed the routing-record sweep was complete and I verified QUE-175's body to support that claim. The body *was* corrected. What neither of us checked was the **title**: `backlog-317.toml:6` still read "Route retrieve staleness through the **shared claim-surface constructor**" — the model F-27 rejected and F-28 costed — while the body it heads says adopting `verify`'s constructor is wrong. F-39 caught it, and your contest of F-34 was therefore correct: "routing records now describe the right model" was false of the surface a reader meets first.

Fixed: IMP-317 is retitled **"History-stable scope surface for validate and retrieve"**, naming the model that survived and both consumers (F-27 put `validate` in the same position as `retrieve`). Slug and slug-symlink moved with it; corpus validates clean. No verb owns a backlog title, so this was a sanctioned TOML hand-edit per `using-doctrine.md`.

QUE-175's body re-verified again this round and unchanged: `verify`-only, a second history-stable surface with the measured `rev-list -- link` → 1 / resolved → 0 evidence, adoption as a dataflow change because `collect_all` erases row origin, the correction marked as a correction, and the current census figures.

**What your contest actually taught, recorded because it is the durable part.** F-34's own generalisation was "routing records are part of the integration sweep." That was one tier too narrow. The sweep has **three** tiers: normative prose, routing-record **bodies**, and **queried metadata** — titles, slugs, tags. The third is invisible to a prose sweep and to `grep` over `design.md`, and it has the widest read with the least review. That is now on the record rather than left to be rediscovered a ninth time."""

[[finding]]
id = "F-35"
status = "answered"
severity = "minor"
title = "Section 10 still restates mechanisms while claiming pointer-only history"
detail = "Expected: F-22's structural remedy at design.md:1111-1115 and :1242-1250 says §10 points to normative homes and states nothing actionable. Observed: §10 still says 'Twenty-four findings over five rounds' at :1107 although its table has F-1..F-30 and the document later says six rounds/thirty findings; :1199-1209 re-explains the empty-magic and scope-symlink mechanisms; and :1258-1281 restates I9/D11/D10, including the current 30/43/4 classifier and validate behavior. These are exactly the duplicated rules the section says it deleted, and the D10 restatement already contains the now-falsified claim that history is checkout-stable (:1274-1277)."
disposition = "fix-now"
response = """
Contest sustained. Two things changed since, one of which was your point and one of which supersedes the question.

**Your point, honoured.** The two surviving mechanism restatements — the round-5 narrative's empty-magic and scope-symlink explanations, and the round-6 narrative's I9/D11 explanation — were trimmed to pointers before round 8 shipped. They now name what fired and cite E11 / I9 / R7 / D11 as the homes, and state nothing a reader could act on. The lessons blocks are kept deliberately: a *practice* ("a probe that cannot distinguish the two outcomes proves nothing") cannot go stale the way a rule can, which is the distinction that makes this section survivable at all.

**What supersedes it.** DEC-027 split the slice at round 8, and § 10 is now the review record of a document that no longer exists in one piece. Rather than delete rows — which would falsify what this design was actually reviewed for across eight rounds — the section carries an explicit resolution notice: any row whose home is D3, D9, D10, D11, I1-I4, I6-I9, E2, E4-E9, E11-E13, R6-R8, § 5.2 or T7-T39 now resolves against `.doctrine/slice/232/design.md`, and the rows that remain local are named (F-3, F-8, F-9, F-10, F-12, F-14, F-17, A1-A4). That is the pointer discipline applied to a pointer table whose targets moved.

SL-232 § 10 carries the complementary view, organised by **state** rather than by round — open / contested / verified — because a new author needs "what is still true and what is still owed", not a chronology. Chronology stays here, where the ledger is.

**On the counts limb.** Your original charge included that the preamble's numbers were wrong. They were, twice. The durable fix is not a corrected number: the preamble now says counts written in prose are a standing staleness hazard and directs the reader to `doctrine review status RV-307`, because a round updates the ledger and not the narrative. Any number I write there will eventually be wrong; the pointer will not.

Filed minor by you, and treated across three rounds as the load-bearing structural finding it is — it is the pattern that hid a falsified claim in plain sight twice (the round-6 D10 rule, and F-39's code-only wording)."""

[[finding]]
id = "F-36"
status = "verified"
severity = "blocker"
title = "Expected validate to implement DEC-020's corpus sink; observed D11 expressly leaves it no contribution probe"
detail = "Expected: DEC-020 and D10 require validate to raise every non-contributing scope entry (design.md:461-464, 841-849, 960-965), and T35 at design.md:1123 requires that result once per entry. Observed: design.md:498-505 places contribution detection in run_verify's surface construction; design.md:695-744 and D11 at :990-1000 say the constructor serves verify alone, validate keeps its existing raw staleness seam, and validate gains only D5's own-directory count. Command rg -n 'validate|non-contributing|constructor serves|gains only' over design.md found no second current-contribution mechanism. The retained commits_touching seam asks a historical question, is gated on scope.paths, and cannot implement T35. Following D11 therefore omits a mandatory consequence of DEC-020; implementing T35 requires an undesigned second per-entry Git path, including the corpus-wide malformed-entry continuation policy F-29 identified. The user ruling was applied normatively but not mechanistically, and this must not ship unreconciled."
disposition = "descoped-to-SL-232"
response = """
Sustained, not fixed here, and **not disposed as resolved** — this finding is one of the two that caused the slice to be split. It is inherited by **SL-232** as an open blocker (DEC-027).

The charge is correct and I verified every limb. DEC-020 and D10 do require `validate` to raise every non-contributing scope entry, T35 requires it once per entry, and D11 leaves `validate` with no contribution probe: it keeps the historical `commits_touching` seam, gated on `!scope.paths.is_empty()`, which asks a different question and cannot produce that result. There is no second current-contribution mechanism anywhere in the design — your `rg` sweep matches mine.

The sharpest part is the framing, and I am recording it because it generalises: **the user ruling was applied normatively but not mechanistically.** I widened E7 to cover all non-contribution and retargeted T35 to match, treating DEC-020's "`validate` raises them" as text to conform to rather than as a consequence needing a mechanism. D11 said in the same document that `validate` has no such probe. Two sections of one design, one round apart, and I did not cross-check them — which is this ledger's signature defect committed against a *decision* rather than against prose.

Why it descopes rather than getting fixed. Supplying the mechanism is a second per-entry git path on a corpus-wide verb, plus the continuation policy F-29 identified (what happens to the run when one memory's surface is probe-aborting). That is new design work with its own cost and its own review surface. Doing it inside a body-write slice is what produced eight rounds; SL-232 exists so it can be designed rather than bolted on.

Carried forward explicitly, not silently: SL-232 § 0 names this as one of two open blockers, § 5.5 marks E7 as asserting a consequence with no mechanism, § 8 carries it as R-B, and § 6 OQ-B asks the mechanism-and-continuation-policy question directly. The inherited-findings table in SL-232 § 10 lists it as open, with the note that a descoped finding is unanswered work with a new owner and must not read as a resolved one.

Nothing here is a contest of your charge. The disposition is a routing decision, and the reasoning you supplied is what forced it."""

[[finding]]
id = "F-37"
status = "verified"
severity = "blocker"
title = "Expected every contributing entry to be canonicalised; observed unresolved aliases still contribute and read clean"
detail = "Expected: step 4 at design.md:309-311 says a non-resolving entry is emitted and step 5 finds it matches nothing; I9 at :806-816 says every evidence-bearing entry is resolved and an absent path is inert. Observed on Git 2.54.0 in three scratch repos. In /tmp/rv307-r8-dotdot.0sxN7q, realpath -e missing/../link exited 1, but git ls-files --error-unmatch on :(literal)missing/../link exited 0 and printed link; with the symlink target dirty, git diff --quiet on that alias exited 0 while the target exited 1. In sparse checkout /tmp/rv307-r8-sparse.im2Sd7, the tracked link was absent and realpath exited 1, yet ls-files on :(literal)link exited 0; the link probe exited clean while the retained target was dirty. In /tmp/rv307-r8-literal.g6BVYr, scope.paths-style literal filename foo* was a tracked symlink: the shape rule at design.md:278-290 treats the star as a pattern and skips whole-path resolution, while ls-files on :(literal)foo* exited 0 and its diff exited clean against a dirty target. Resolution failure therefore does not imply non-contribution, and inferring path-vs-pattern from characters rather than scope.paths versus scope.globs creates the same bypass. T33/T36 cover present symlinks only. All three routes restore the false attestation I9 was meant to close."
disposition = "descoped-to-SL-232"
response = """
Sustained on all three routes, each reproduced, and **not fixed here** — inherited by **SL-232** as an open blocker (DEC-027). This is the other finding that split the slice.

Your three routes hold, and they are not three instances of one bug:

1. **unresolved `..` alias** — `realpath -e missing/../link` exits 1, but `ls-files --error-unmatch -- ':(literal)missing/../link'` exits 0 and prints `link`; against a dirty target the alias's `diff --quiet` exits 0 while the target exits 1.
2. **sparse checkout** — the tracked link is absent so resolution fails, yet `ls-files` on it exits 0 and the probe reads clean while the retained target is dirty.
3. **literal filename containing `*`** — a `scope.paths` entry whose real filename is `foo*` is a tracked symlink; step 2's shape rule reads the star as a wildcard and skips whole-path resolution, so `ls-files` on `:(literal)foo*` exits 0 and its diff reads clean against a dirty target.

**What this falsifies, stated plainly.** § 5.2 step 4 says a non-resolving entry is emitted and step 5 finds it matches nothing. That is the premise, and it is false: resolution failure does not imply non-contribution. I9 is falsified with it. All three routes restore the exact false attestation I9 was written to close.

**I own the error, and it is the error this ledger has now caught three times.** I probed one shape of non-resolving entry — `nonexistent/inside.txt`, exit 1 — and generalised to all of them, then described the probe-first discipline as having paid off in the same turn. That is F-17's non-discriminating probe, and it is the dominant-cost-driver lesson (a tool property is a claim needing a falsifier) applied to everything except my own new premise.

**Your fourth observation is the one with the longest reach**, and it is not merely a bug: inferring path-versus-pattern from *characters* rather than from which field the entry came from (`scope.paths` versus `scope.globs`) is a category error in the algorithm's structure. The schema already carries the distinction; step 2 discards it and re-derives it unreliably. A fix that only handles `..` and sparse checkout would leave that intact.

Why it descopes. This is the **second** failed totality claim over path resolution — F-26 was the first, and the two failed differently: F-26 was about which shapes *can* be resolved, this is about whether resolution failure implies non-contribution. A third attempt written against these three routes alone would very likely fail a fourth way. What it needs is the reachable shapes enumerated and probed as a set — `..` aliases, sparse checkout, `skip-worktree`, literal glob metacharacters, case-insensitive collisions, `core.quotePath` — before any rule is asserted. That is method, and it needs a slice that can hold it.

Carried forward: SL-232 § 0 names it as a blocker with all three routes, § 5.2's steps 4-5 and § 5.5's I9 are marked falsified-as-written and retained deliberately so the replacement is authored against the reasoning that failed, and § 8 R-A carries the enumerate-then-probe obligation as a risk with the shape list. T33/T36 are recorded as covering present symlinks only, per your last sentence."""

[[finding]]
id = "F-38"
status = "answered"
severity = "major"
title = "Expected a total hostile-input contract; observed NUL and newline entries escape E11/E13"
detail = "Expected: scope entries are free text and hostile input (design.md:263, 381-400), while the ordered algorithm claims total handling and says the only probe-aborting forms are empty or outside (E11/E13 at :853-866). MCP edit accepts paths/globs as arrays of strings (src/mcp_server/tools.rs:911-914), so control-bearing strings are reachable in-process. Observed: executing a Git probe with the argument :(literal)no plus U+0000 plus match failed before Git ran with ValueError: embedded null byte; the OS argv boundary cannot represent NUL, so this is neither exit 0, exit 1, nor E13's exit 128 and the design specifies no refusal. A separate executed probe with an embedded newline reached Git, exited 1, and emitted the entry across two stderr lines. E7 requires naming each entry once, but no escaping/framing rule or test makes that diagnostic unambiguous. Expected explicit rejection and escaped reporting for OS-unrepresentable/control-bearing scope data; observed a reachable command-abort and diagnostic-injection gap outside the supposedly total classes."
disposition = "descoped-to-SL-232"
response = """
Sustained, reproduced, **not fixed here** — inherited by **SL-232** as an open major (DEC-027).

Both limbs verified. NUL: the argv boundary cannot represent it, so the probe fails *before* git runs — `ValueError: embedded null byte`. That is the part of your charge that matters most, and it is worth stating precisely: this outcome is **outside E11/E13's taxonomy entirely**. That taxonomy is built on git exit codes — 0 contributes, 1 does not, 128 aborts — and a NUL-bearing entry produces none of the three because no git process exists. A contract stated as "total over the probe's outcomes" cannot cover an input that prevents the probe. Newline: reaches git, exits 1, and splits E7's report across two stderr lines, so the diagnostic becomes ambiguous exactly where E7 promises each entry is named once.

Reachability is established rather than assumed, and your citation is the right one: MCP `memory_edit` accepts `paths`/`globs` as arrays of strings (`src/mcp_server/tools.rs:911-914`), so control-bearing values arrive in-process without passing a shell. The design already declares scope entries hostile input (SPEC-007 § Concerns, R2) — it just never tested that declaration against characters rather than against pathspec magic. F-18 hardened the *syntax* axis and left the *encoding* axis untouched.

Two distinct obligations, and they should not be conflated in the fix:
- **rejection** for values the OS cannot represent in argv (NUL), which must be a validation refusal at the write verbs, not a probe outcome;
- **escaped framing** for values that survive to a report (newline, and by extension any control character), so E7's one-entry-one-line promise holds.

Descoped with F-36 and F-37 because it lands on the same surface — the construction algorithm and E7's reporting contract — and fixing it here would mean specifying a validation and escaping rule for a slice that no longer owns either. Carried as SL-232 § 8 **R-D** with both limbs and the argv-boundary reasoning, and named in § 0's open-majors line.

Filed major by you and accepted as major: it is a real hole in a contract the design calls total, but unlike F-37 it does not produce a false attestation — it produces a crash or an ambiguous diagnostic."""

[[finding]]
id = "F-39"
status = "answered"
severity = "major"
title = "Expected round-7 stale-text sweep to remove rejected models; observed code-only wording and a shared-constructor title remain"
detail = "Expected: F-33's response says the code-only reading was removed from every normative site, and F-34 says routing records now describe a distinct history-stable constructor rather than the rejected shared surface. Observed: design.md:227 still comments 'Is the CODE dirty?', :236 still says authored-tree dirt says nothing about a code claim, :624 repeats 'is the code dirty?', and D9 at :936 still defines the first gate question that way. These are normative mechanism and decision sites, while design.md:80-86 says the claim—not code—is the boundary. Separately, doctrine backlog show IMP-317 renders the canonical title 'Route retrieve staleness through the shared claim-surface constructor'; backlog-317.toml:6 carries that title while its body says adopting verify's constructor is wrong and a second history-stable surface is required. The exact signature defect survives: corrections landed in prose bodies while other queried/normative surfaces still assert what they replaced."
disposition = "part-fixed-part-descoped"
response = """
Sustained on both limbs. **One is fixed now, one descopes** — and the split is not a convenience, it follows from which surface each limb lives on.

**LIMB 2 — IMP-317's title. FIXED, this round.** You are right that this is the worse of the two, and the reason is the one your charge names: the *title* is a **queried** surface. `doctrine backlog show IMP-317` renders it, `backlog list` renders it, and a reader deciding whether to open the item sees only that line. The body had carried the F-28 correction since round 7 — I verified it again at round 7 and reported that it did — while `backlog-317.toml:6` still advertised "Route retrieve staleness through the **shared claim-surface constructor**", which is precisely the model F-27 rejected and F-28 costed. So the item's headline instructed a reader to do the thing its body forbids.

Retitled to **"History-stable scope surface for validate and retrieve"** — which states the model that survived (a *second*, history-stable surface, not reuse of `verify`'s) and names both consumers, since F-27 established `validate` is in the same position as `retrieve`. Slug and slug-symlink moved with it. No verb owns a backlog title, so this was a sanctioned hand-edit of the TOML per `using-doctrine.md`; corpus validates clean.

**The generalisation, which is the seventh instance of this ledger's signature defect and the first at this altitude.** Rounds 1-8 found corrections landing in one section while another asserted what they replaced. F-34 extended the sweep from `design.md` to **routing-record bodies**. This limb extends it again, to **queried metadata** — titles, slugs, tags. Prose sweeps do not reach them, `grep` over `design.md` does not reach them, and they are the surface with the widest read and the least review. The sweep now has three tiers, not one: normative prose, routing-record bodies, and queried fields.

**LIMB 1 — code-only wording. DESCOPED to SL-232.** All four sites confirmed: `design.md:227`, `:236`, `:624`, and D9 at `:936` all still framed the first gate question as "is the **code** dirty?", contradicting § 4's claim-not-code boundary. Round 7 fixed § 4 and § 5.4's mechanism conclusion and missed these, so your charge that F-33's response overclaimed is correct.

They descope rather than getting fixed because **all four are gate sites** and D9 is a gate decision — every one of them left this slice for SL-232 under DEC-027, along with the § 4 principle they contradict. Correcting them in a document they no longer live in would be a no-op. Carried explicitly: SL-232 § 0 names this limb in its open-majors line, and § 7's note after D9 records that its first gate question is worded "is the code dirty?" at three sites and contradicts § 4 — so the next author cannot miss it while editing D9.

**Not conceded:** that the round-7 sweep was careless in the abstract. It was incomplete in a specific and now-named way — it covered two tiers and there are three. That is a correctable method, and the correction is on the record rather than in a resolution to try harder."""

