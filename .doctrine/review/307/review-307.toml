id    = 307
slug  = "inquisition-sl-230-memory-body-write-seam-corpus-aware-verify-gate-external-codex-pass"
title = "Inquisition — SL-230 memory body-write seam + corpus-aware verify gate (external codex pass)"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "inquisitor"
responder = "architect"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-230"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected verified_sha to contain the attested body; observed T7/T8 stamp a HEAD that omits it"
detail = 'Design evidence: .doctrine/slice/230/design.md:241-245 makes corpus-only dirt yield a Commit frame and :380-381 requires T7/T8 to stamp HEAD even when the target item is dirty or wholly untracked; :299-302 defers the only body-content anchor it names. Current stamp logic at src/memory.rs:3357-3361 writes frame.commit unless allow_dirty is explicitly paired with CheckoutState. Empirical probe: in /tmp/sl230-attest-*, after creating an untracked .doctrine/memory/items/mem_probe/memory.md, `git cat-file -e "$verified_sha:.doctrine/memory/items/mem_probe/memory.md"` returned exit 128, while `git rev-list --count "$verified_sha..HEAD" -- .doctrine/memory/items/mem_probe` printed 0 both at stamp time and after an unrelated commit; `git ls-files --others` still printed the body. Therefore D5 sees no commit and reports no drift while verified_sha names a commit that never contained the claim. This is a false attestation and must not ship; OQ-3 or an equivalent content-bearing anchor is load-bearing.'
disposition = "fix-now"
response = """
Charge sustained; proven, not argued. The relaxation excluded .doctrine/** wholesale, and memory items live inside it — so record → verify stamped a HEAD that provably lacked the body, and D5's rev-list drift count returned 0 forever because it counts commits and there was none to count. The design's own OQ-3 was the only named remedy and it was deferred; the charge is right that this made the deferral load-bearing.

Remedy is not OQ-3 (schema change, own slice) but a claim-aware gate, which needs no new field. § 5.2 is restructured around a single leaf primitive: dirty_under(root, pathspecs) -> Result<bool>, the three probes with an arbitrary pathspec set. capture_with(root, excludes) delegates its dirty decision to it; capture(root) = capture_with(root, &[]) as before. verify then composes TWO calls to the one primitive:

  source = capture_with(root, corpus_excludes)   // Frame — the anchor
  claim  = dirty_under(root, claim_pathspecs)?   // bool — is the evidence committed?

where claim_pathspecs = the memory's own item directory (+ its declared scopes, see F-6). Refuse unless the source frame is Commit-anchored AND the claim surface is clean. verified_sha is then a commit that provably contains the attested body.

Consequence accepted deliberately: T8's record → verify case now REFUSES until the memory is committed. That is the honest answer — an attestation naming a commit that does not contain the claim is worthless, and 'commit the memory, then verify' is one command. The friction this slice actually set out to kill — unrelated corpus dirt, another agent's uncommitted backlog file, your own unrelated spec edit — is still killed. T8 rewritten accordingly; the refusal names the fix."""

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected one integrated exclusion design; observed dead is_excluded and stale source_clean mechanisms"
detail = 'The corrected D3 at .doctrine/slice/230/design.md:148-186 performs exclusion natively through pathspecs inside capture_with. Yet the system model at :98-99 still specifies corpus_guard::is_excluded plus source_clean, :192-196 describes a pure exclusion predicate without any consumer, and :200-201 says source_clean returns a value. Command `rg -n "is_excluded|source_clean|capture_with" .doctrine/slice/230/design.md src/corpus_guard.rs src/git.rs src/memory.rs` found is_excluded/source_clean only in the design and no live seam to receive the predicate. A1 was not completely integrated: the design currently specifies two exclusion mechanisms, one dead, and retains the rejected function in normative sections.'
disposition = "fix-now"
response = """
Sustained — A1 was integrated in the decision (D3) but not in the normative sections, leaving the retired source_clean standing in the § 5.1 tier diagram and § 5.3 prose, and a corpus_guard::is_excluded predicate with no consumer anywhere. Two specified mechanisms for one job, one dead, is the very duplication A1 was raised to destroy; the charge is right that partial integration of a settled finding is itself a defect.

§ 5.1 and § 5.3 rewritten. source_clean is gone from every section, not just from D3. is_excluded is deleted outright rather than rehomed: exclusion is performed entirely by git pathspecs inside dirty_under, so a path predicate has no work to do. corpus_guard keeps DOCTRINE_PATHSPEC (src/corpus_guard.rs:43) as the named constant STD-001 requires; the pathspec vectors are composed at command tier, which is where the memory-layout knowledge legitimately lives."""

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Expected rejected edit arguments to leave both tiers untouched; observed body-first ordering mutates before validation"
detail = "Design steps at .doctrine/slice/230/design.md:218-229 call write_body before apply_edit. Actual apply_edit performs fallible validation after entry: src/memory.rs:3817-3827 rejects key/title, :3844-3860 rejects status/lifespan, :3893-3921 rejects trust/severity, and :3935-3939 can reject key normalization. The current shell at :4005-4014 safely mutates only an in-memory DocumentMut until apply_edit succeeds. Under the proposed order, `memory edit --body ... --trust bogus` returns an error after memory.md has already been atomically replaced, while memory.toml, updated, and verification remain untouched. This is mutation on an argument-validation failure, distinct from the acknowledged crash window. Validate against a cloned document before the first disk write or otherwise restore failure atomicity."
disposition = "fix-now"
response = """
Sustained. apply_edit is fallible at four sites after entry (src/memory.rs:3817-3827 key/title, :3844-3860 status/lifespan, :3893-3921 trust/severity, :3935-3939 key normalisation), and the current shell mutates only an in-memory DocumentMut until it succeeds. Body-first would have made 'memory edit --body - --trust bogus' rewrite memory.md and then error — mutation on an argument-validation failure, which is a strictly new failure mode, not the acknowledged crash window.

The fix costs nothing, because apply_edit's mutation is already in-memory only. Validation moves first without giving up the body-dependent TOML content:

  1. toml_changed = apply_edit(&mut doc, fields, today)?   // validates + mutates IN MEMORY only
  2. body_changed = write_body(dir, 'memory.md', text, mode)?   // first and only disk write so far
  3. if body_changed { clear_verification(&mut doc); doc['updated'] = today }   // see F-12
  4. if body_changed || toml_changed { write_atomic(toml_path) }

Every fallible step now precedes every disk write. R1's crash asymmetry survives intact — body still lands before TOML — so a crash still leaves a changed body with a stale updated, never the reverse. A2's insight that TOML content depends on body_changed also survives: step 3 applies it to the same in-memory document. The draft simply confused 'the TOML WRITE must follow the body write' with 'the TOML COMPUTATION must follow it'; only the former is true."""

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Expected ADR-013 dependency to name an active Revision; observed SL-230 has no REV anchor"
detail = 'ADR-013 states that work waiting on governance or spec change declares `needs REV-NNN`. The design promises a Revision at .doctrine/slice/230/design.md:68-69 and requires it applied at :392-393, but names no REV and the synthesized `doctrine slice show SL-230` output contains governed_by POL-002/STD-001 and implements SPEC-007 with no needs relation. `doctrine revision list --format json` printed an empty rows array; `doctrine revision list --all --format json` showed only REV-001 through REV-033, all status done; `rg -n "SPEC-007" .doctrine/revision` printed nothing. The governance dependency is therefore uninstantiated and cannot order or gate this work as ADR-013 requires.'
disposition = "fix-now"
response = "Sustained without defence — the design promised a Revision twice (:68-69, :392-393) and named none, and no revision in the corpus touched SPEC-007. Discharged during this disposition: REV-034 minted ('Verify attests against a claim-relevant clean tree, not a globally clean one'), and 'doctrine needs SL-230 REV-034' authored, so slice show now reports the needs edge. ADR-013's ordering constraint is instantiated rather than promised. Rationale, both change rows and their before/after excerpts are in .doctrine/revision/034/revision-034.md; application is deferred to SL-230 close so spec and code turn over at the same moment."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Expected the SPEC-007 revision inventory to cover every binding contract; observed REQ-147 is omitted"
detail = 'The design and scope assert that only spec-007.toml:22 and spec-007.md:132 carry the clean-tree contract (.doctrine/slice/230/design.md:68; slice-230.md:88-92). Repository search `rg -n -i "clean working tree|refus.*dirty|no false attestation" .doctrine/spec/tech/007 .doctrine/requirement` also found .doctrine/requirement/147/requirement-147.toml:5-6 and requirement-147.md:1. `doctrine inspect REQ-147` printed inbound membership in SPEC-007. The active REQ-147 title is itself the exact old contract: clean working tree, refuse dirty tree, no false attestation. A Revision changing only the two cited spec sites would leave SPEC-007 internally incoherent and the requirement false. Also, the prose citation is currently line 133, not 132.'
disposition = "fix-now"
response = """
Sustained, and verified independently before disposition: 'doctrine inspect REQ-147' reports inbound members: SPEC-007, and requirement-147.toml:6 carries the retired contract as its literal title — 'against a clean working tree, refusing a dirty tree so no false attestation is recorded'. A two-site amendment would have shipped an active SPEC-007 member asserting the opposite of the code. This was the most dangerous of the governance charges precisely because it was invisible from the spec files themselves.

REV-034 carries REQ-147 as its --primary change row, with the before/after title text written out. A further fact the charge did not reach: requirement-147.md is still an unfilled template — Statement and Rationale are both empty comment stubs — so the title has been carrying the entire contract alone. REV-034 fills both bodies rather than only retitling.

The line-number correction is accepted too: the prose site is spec-007.md:133, not :132 (the sentence spans :131-133); design § 3 and § 9 now cite :132-133 as a range."""

[[finding]]
id = "F-6"
status = "answered"
severity = "blocker"
title = "Expected exclusions to ignore irrelevant corpus dirt; observed blanket roots hide legitimately scoped evidence"
detail = '''Design principle .doctrine/slice/230/design.md:80-82 assumes every memory attests its body only against code, then :195-196 and :241-245 exclude all .doctrine plus repo-root memory. SPEC-007, as rendered by `doctrine spec show SPEC-007`, owns arbitrary path/glob/command scopes and does not restrict claims to source code. Live corpus evidence from `rg -n '"?\\.doctrine/' .doctrine/memory/items/*/memory.toml` printed many legitimate scopes including .doctrine/spec, .doctrine/adr, .doctrine/slice, and .doctrine/review. Thus an uncommitted change to a governance file explicitly named by the memory scope is ignored and verify stamps the old HEAD. Doctrine ownership makes the path constant legal under POL-002; it does not make the changed evidence irrelevant. Exclusion must be claim-aware or the anchor must include the excluded state.'''
disposition = "fix-now"
response = """
Contest sustained; both sub-defects reproduce and both are SILENT under-coverage, which is the same failure class as the original F-6 rather than a lesser one.

(1) Absolute scope paths. Four items carry them, e.g. mem.fact.claude.jail-ro-git-is-bwrap-wrap-passthrough-commits paths = ['/workspace/doctrine/src/worktree/pretooluse.rs', '/workspace/doctrine/src/worktree/jail.rs']. Git resolves a leading-slash pathspec against the repo root, so these match nothing and the claim leg would quietly cover none of what the memory names.

(2) Gitignored scopes. '.doctrine/state/' appears in several items' paths; .gitignore:39 ignores .doctrine/state/ (git check-ignore -v confirms). diff HEAD cannot see an untracked-and-ignored path and ls-files --others --exclude-standard excludes it, so those entries can never register dirt.

Neither errors. Git does not fail a pathspec that matches nothing absent --error-unmatch, so both defects present as a claim surface that is narrower than the claim — a false attestation reached by a quieter road than the one F-1 found.

§ 5.2 gains a total construction rule for claim_pathspecs, stated as a table rather than left to implementation:
  - repo-relative path/glob -> contributed as-is (globs via :(glob)).
  - absolute path INSIDE the repo -> normalised to repo-relative, then contributed.
  - absolute path OUTSIDE the repo -> dropped; git cannot observe it.
  - gitignored path -> dropped; it carries no tracked evidence.
  - scope.commands -> dropped (E5, unchanged; not path-shaped).
  - empty result -> the item directory alone remains (E6, unchanged).

And the drops are made LOUD, which is the actual remedy: verify reports on stderr which scope entries did not contribute and why, so a memory whose claim surface is narrower than its declared scope says so at the moment of attestation instead of silently over-attesting. Added as E7 and pinned by T26 (absolute-inside, absolute-outside, ignored, unmatched) and T27 (the stderr advisory)."""

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "Expected own-directory staleness to catch masters as claimed; observed masters are unanchored and never scanned"
detail = 'The design says own-directory drift catches masters at .doctrine/slice/230/design.md:252-257, but later concedes at :299-302 that masters have no verified_sha. Actual code corroborates the latter: src/memory.rs:1705-1707 records globals with unanchored_frame; :1750-1757 writes them under MEMORY_MASTERS_DIR; collect_all at :2826-2834 scans only items and shipped; run_validate consumes collect_all at :3480-3488; and writable resolution at :2468-2505 is items-only. `rg -n "MEMORY_MASTERS_DIR" src/memory.rs` found production use only in record placement, not validate. E2 is correct that the minted master anchor is None, but D5 cannot catch master edits and the design should stop claiming that it does.'
disposition = "fix-now"
response = """
Sustained; the design asserted at :252-257 that own-directory drift is 'edit-path agnostic: catches the verb, hand-edits, masters, and other agents', then conceded at :299-302 that masters have no verified_sha. Corroborated independently: rg -n MEMORY_MASTERS_DIR src/memory.rs returns production use only at :1753 (record placement) and :5931 (a test) — it appears nowhere in collect_all or run_validate, so masters are not scanned at all, quite apart from being unanchored.

The claim is struck rather than the behaviour changed. D6 already puts masters out of scope, and making validate scan them is a separate slice. § 5.4 now states the truth plainly: own-directory staleness catches the verb path, hand-edits to items, and other agents; it does NOT catch masters, which are unanchored (anchor_kind = None, no verified_sha to diff from) and are not scanned by collect_all. The only mitigation for masters remains the mem.system.memory.global-master-authoring guard memory, glob-scoped memory/** at severity high — stated as a known gap in § 8 (R5) rather than left as a false capability claim. E2 stands unaltered; the charge agreed it was correct."""

[[finding]]
id = "F-8"
status = "answered"
severity = "major"
title = "Expected claim changes to invalidate verification; observed title and summary edits remain verified by design"
detail = "The design problem says it closes the defect that nothing invalidates an attestation when the claim changes (.doctrine/slice/230/design.md:23-24), and its principle says a change to the body says everything (:80-82). Yet OQ-1 at :291-295 explicitly defers title and summary invalidation even while admitting both are claim-bearing. Actual apply_edit changes title/summary at src/memory.rs:3822-3842 and has no verification mutation. After SL-230, a user can still replace the summary or title of a verified memory and retain verification. This is a known residual false-stamp path concealed beneath a broader closure claim; either narrow the stated invariant and problem honestly or clear verification for all claim-bearing fields in this slice."
disposition = "fix-now"
response = """
Contest sustained without argument. Verified: design.md:272 still reads 'if body_changed { clear_verification(...) }' while the § 5.4 table names body, title, summary and scope.* as claim fields. D8 was written as a decision and a table and never wired into the operation — the exact incomplete-integration pattern the same commit added a closing paragraph about. The pattern held up better as a diagnosis than as a discipline.

Mechanism specified rather than asserted. apply_edit returns one bool that cannot distinguish claim fields from record fields, and widening its return type would break its existing suite, which R3 forbids. So the signal is computed at the caller by a pure snapshot comparison, additive and shared-machinery-safe:

  fn claim_snapshot(doc: &DocumentMut) -> ClaimSnapshot   // title, summary, scope.paths/globs/commands

  let before = claim_snapshot(&doc);                          // 0. pure read, pre-edit
  let toml_changed = apply_edit(&mut doc, fields, today)?;    // 1. validates; in-memory only
  let body_changed = write_body(dir, 'memory.md', text, mode)?;  // 2. first disk write
  let claim_changed = body_changed || claim_snapshot(&doc) != before;  // 3.
  if claim_changed { clear_verification(&mut doc) }           // 4. D8
  if body_changed { doc['updated'] = today }                  // 5. F-12 re-stamp
  if body_changed || toml_changed { write_atomic(toml_path) } // 6.

Snapshot comparison rather than inspecting which flags were supplied, because supplied is not changed: setting --title to its existing value must not clear a valid attestation, consistent with T12b. Step 5 stays gated on body_changed alone since apply_edit already stamps updated for any metadata change. T20/T21 now have a mechanism to exercise; T20 gains an idempotent-title case pinning that a no-op claim-field write does not clear."""

[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Expected hostile-body protection to gate closure; observed T16 is excluded from the closure commandment"
detail = "Internal finding A3 added T16 specifically to pin read-time nonce and data framing (.doctrine/slice/230/design.md:420-426), and the test table lists T16 at :390. But the normative closure sentence at :392 requires only T1-T15 green. This is an incomplete integration of settled A3: the newly required hostile-body regression may fail while the authored closure condition still passes. Change the closure range to T1-T16 or name every required test explicitly."
disposition = "fix-now"
response = "Sustained — a settled finding (A3) added T16 to the table but the normative closure sentence at :392 still read 'T1-T15 green', so the hostile-body regression could fail while the authored closure condition passed. Range corrected to T1-T21 (the matrix grows under F-8, F-10 and F-11). The lesson generalises and is applied: the closure sentence now reads 'every test in § 9 green' rather than a hand-maintained numeric range, so a test added by a later review cannot fall outside the gate by omission."

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "Expected body_mode to have a total cross-surface contract; observed mode-without-body is undefined and untested"
detail = 'The interface says CLI body/body-mode maps one-to-one to MCP body/body_mode (.doctrine/slice/230/design.md:128-145), and EditFields gains both while has_any counts body at :215-216. It specifies rejection only for body_mode on record (:141-142). It never defines `memory edit --body-mode append` without --body, MCP `{body_mode:"append"}` without body, or body_mode combined with metadata-only edits; T1-T6 and T12/T12b contain no such case. The two adapters can therefore reject, ignore, or count the same request differently while each still satisfies the written tests. Specify rejection or a meaningful default and pin both surfaces.'
disposition = "fix-now"
response = """
Sustained. The design specified rejection only for --body-mode on record, and left --body-mode append without --body undefined on the CLI, {body_mode: 'append'} without body undefined over MCP, and body_mode alongside a metadata-only edit undefined on both. As charged, the two adapters could each satisfy every written test while behaving differently — which is precisely the divergence the 1:1 CLI/MCP mapping in § 5.2 exists to prevent.

Contract made total: body_mode without body is REJECTED on both surfaces, with the same message. Rejection over a default because a silent default would let a caller believe an append happened when nothing was written, and because it is symmetric with the existing --body-mode-on-record rejection — one rule ('body_mode is meaningless without body'), two instances, rather than two unrelated special cases. has_any() is unaffected: body_mode alone never constitutes an edit. T22 pins both surfaces."""

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "Expected every stated capture invariant to be pinned; observed I2 and the three exclusion probes lack explicit tests"
detail = 'I2 at .doctrine/slice/230/design.md:273-275 preserves a concurrency property: clean-after-exclusion must never call write-tree. The test table has no lock/write-tree observation; T11 at :384 checks only frame equality and cannot detect an unnecessary write-tree call. T7 says only `.doctrine/** dirty` without identifying staged versus unstaged, while the design changes three independent probes at :178-186; T8 pins only the untracked leg. `rg -n "index\\.lock|capture.*lock|write-tree" src/git.rs` found implementation comments/retry code but no capture lock-avoidance test. Add explicit staged, unstaged/binary, and untracked exclusion cases plus a seam or lock-contention canary for I2.'
disposition = "fix-now"
response = """
Sustained in full. T11 compares frames and cannot observe an unnecessary write-tree call; T7 said only '.doctrine/** dirty' without partitioning staged from unstaged; only the untracked leg (T8) was individually pinned, though the design modifies three independent probes.

I2's substance is confirmed sound — capture takes the lock only in the dirty branch, and src/git.rs:1996-2000 documents exactly that ('write-tree acquires .git/index.lock, so we defer it to the rare dirty case'). The restructure under F-1 strengthens it: the claim probe is dirty_under, which returns a bool and never computes checkout_state_id, so it never reaches write_tree_with_retry (src/git.rs:1924) even when the claim surface IS dirty. I2 is restated to that stronger, testable form.

Tests added: T17 staged-only corpus change excluded; T18 unstaged/binary corpus change excluded; T19 untracked corpus change excluded (T8 keeps the record → verify case, now as a refusal). T23 is the I2 canary — hold .git/index.lock and assert verify still completes on the clean-after-exclusion path, which fails if write-tree creeps back in. Frame equality (T11) stays as the I1 pin."""

[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "Expected stamp_updated to be a composable step; observed apply_edit stamps `updated` internally, so a body-only edit never stamps it"
detail = 'Raised by the responder during disposition of F-3; missed by both the internal pass (A2) and the external pass. Design .doctrine/slice/230/design.md:223-229 models step 4 as `if body_changed || toml_changed { stamp_updated(&mut doc) }`, treating `stamp_updated` as a discrete helper the caller composes. No such helper exists. `apply_edit` (src/memory.rs:3810) ends with its own terminal block — "Stamp `updated` ONCE at root if any field changed" — writing `doc["updated"] = toml_edit::value(today)` gated solely on its internal `changed` flag, which counts metadata fields only and cannot see the body. Consequence: under the design as written, `memory edit --body -` with no metadata flags yields toml_changed=false, so `updated` is never stamped, directly falsifying T5 (":378 — body-only edit | has_any() true; updated stamped"). The composed-flag correction A2 introduced is therefore incomplete: it composed a flag over a step that does not exist as a separate step. Fix requires either an explicit re-stamp after write_body (idempotent — same date value) or splitting the stamp out of apply_edit; the former avoids touching shared machinery under R3.'
disposition = "fix-now"
response = "Self-raised during F-3's disposition; sustained. Step 3 above re-stamps updated explicitly after a body change. The re-stamp is idempotent when apply_edit already stamped (identical date value), so no double-write and no ordering hazard, and it leaves apply_edit's signature untouched — which matters under R3, since apply_edit is shared machinery whose existing suite must stay green unchanged. T5 is now satisfiable; T12b (identical-content body replace) is unaffected because body_changed is false there and step 3 never runs."

[[finding]]
id = "F-13"
status = "answered"
severity = "blocker"
title = "Expected allow-dirty to stamp the complete dirty checkout; observed the only Frame excludes claim-relevant corpus dirt"
detail = "Design §5.4 lines 309-318 computes only `source = capture_with(root, corpus_excludes)` plus a boolean `claim_dirty`; I4 and T10 nevertheless require `--allow-dirty` to override either failed question and stamp `checkout_state_id`. If the sole dirt is an edited or untracked memory body, `source` is Commit-anchored because that directory was excluded, while `claim_dirty` is true. The boolean carries no content and dirty_under explicitly never computes checkout_state_id. Current stamp_verification at src/memory.rs:3357-3361 can stamp a checkout id only from a CheckoutState Frame. The proposed flow therefore has no content-bearing value to stamp on this required path: it must recapture the unexcluded frame or specify an equivalent full-state anchor, and T10 must exercise claim-only dirt."
disposition = "fix-now"
response = """
Sustained, and confirmed in the source before disposition: src/git.rs:2036 and :2048 both construct Commit-anchored frames with checkout_state_id: String::new(). Only the dirty branch computes one. So under the two-question gate, a claim-only-dirty tree yields a source Frame that is Commit-anchored and carries no checkout_state_id — and I4 promises --allow-dirty stamps exactly that. The escape hatch would have stamped an empty string or silently fallen back to the commit, which is worse than either honest outcome: it would record a clean-looking attestation for a tree the operator explicitly acknowledged was dirty.

Root cause is the same shape as F-1: I reasoned about the default path and let the escape hatch inherit machinery built for a different question. The claim leg is deliberately a bool (I2 — it must not compute checkout_state_id, because that takes the index lock), so it structurally cannot supply the anchor the escape hatch needs.

Fix: --allow-dirty takes its anchor from a full UNEXCLUDED capture(root), not from the exclusion-aware frame.

  if allow_dirty {
      let full = capture(root)?;   // unexcluded — the real state of the tree
      stamp(full);                 // Commit if genuinely clean, CheckoutState otherwise
  } else {
      // two-question gate as specified
  }

This restores I4 to literal truth — --allow-dirty semantics are unchanged, because it now uses the same unmodified capture() it uses today. Cost is one extra capture confined to the escape-hatch path, where the index lock is already acceptable (today's --allow-dirty on a dirty tree takes it anyway), so I2 is untouched. I4 is restated to say which frame it stamps rather than leaving it inferred, and T10 is extended with the claim-only-dirty case that exposed this."""

[[finding]]
id = "F-14"
status = "answered"
severity = "minor"
title = "Expected T24 to prove the committed blob equals the attested body; observed it proves only that some blob exists at the path"
detail = 'Design I6 lines 395-397 says successful verified_sha contains the attested body, but T24 lines 559 tests only `git cat-file -e "$verified_sha:<dir>/memory.md"`. A previously committed stale body satisfies that command. T8 covers an entirely untracked directory and T25 covers a scoped ADR; no test modifies an already-tracked memory.md directly and requires verify to refuse, nor compares the committed blob bytes with the current body. Thus an implementation that omits the own-directory pathspec for scoped memories can pass the claimed I6 pin. Require byte equality or a tracked-body-dirty refusal case.'
disposition = "fix-now"
response = """
Sustained. 'git cat-file -e "$verified_sha:<dir>/memory.md"' proves a blob exists at that path in that commit — it would pass against any stale ancestor body and therefore does not pin I6, which asserts the stamped commit contains the body being attested.

T24 rewritten to byte equality: 'git show "$verified_sha:<dir>/memory.md"' must equal the on-disk memory.md byte-for-byte. That is the actual invariant.

T24b added for the case the weak assertion was hiding: a memory whose body is TRACKED but MODIFIED (not untracked, so the F-1 probe's untracked leg does not fire, and cat-file -e would have passed on the stale committed blob). It must refuse. That path is the one where an existence check and an equality check give different answers, so it is the test that earns its place."""

[[finding]]
id = "F-15"
status = "answered"
severity = "blocker"
title = "claim probe is blind when verify is given a key: symlink pathspec matches only the symlink"
detail = """
Expected: the claim probe (§ 5.2/§ 5.4, the F-1/F-6 remedy) measures the memory's own item directory, so an uncommitted body always refuses (I6, T24).

Observed: run_verify resolves the item dir via resolve_show(items_root, mref) -> fsutil::safe_join(items_root, name) (src/memory.rs:3380, src/fsutil.rs:20-33). safe_join is a plain tree_root.join(rel) with NO canonicalisation, so when the reference is a KEY the returned dir is .doctrine/memory/items/<key> — which is a SYMLINK to the uid dir (verified: 388 entries in items/ are key symlinks, e.g. mem.concept.backlog.work-intake-membership -> mem_019ea25af18d77e2b0f981473c50753e).

Git does not traverse symlinks in pathspecs. Proven in a scratch repo (git 2.54.0): with a tracked memory whose memory.md is modified, ALL THREE probe legs report clean via the key pathspec and dirty via the uid pathspec —
  git diff HEAD --name-only -- items/<key>        => (empty)
  git diff HEAD --name-only -- items/<uid>        => items/<uid>/memory.md
  git diff-index --quiet --cached HEAD -- <key>   => exit 0 (clean)
  git diff-index --quiet --cached HEAD -- <uid>   => exit 1 (dirty)
  git ls-files -- items/<key>                     => 1 entry (the symlink itself)
  git ls-files -- items/<uid>                     => memory.md, memory.toml

So verify <key> on a tracked memory with an edited-but-uncommitted body stamps verified_sha = HEAD while HEAD does not contain the attested prose. This is F-1 exactly, resurrected through the reference form the design never enumerated.

Blast radius is the MAINSTREAM path, not an edge: D4/D8 clear the axis on every claim edit, so edit -> re-verify is the flow this slice creates, and agents address memories by key (the boot snapshot and /retrieve-memory both emit keys). The fresh-record case (T8) survives by luck — the untracked SYMLINK itself trips the untracked leg (verified) — so T8 passing proves nothing about this hole.

Remedy: claim_pathspecs must be built from the canonicalised uid directory, repo-relative, never from resolve_show's returned path. D5's own-directory drift count (git rev-list ... -- <dir>) has the identical exposure and must take the uid dir too. Pin with a test that verifies BY KEY against a modified tracked body and asserts refusal."""
disposition = "fix-now"
response = """
Sustained. Confirmed against the code and proven in a scratch repo before writing a line of remedy: safe_join is a bare join (src/fsutil.rs:20-33), items/ keys are symlinks (388 of them), and git does not traverse a symlink in a pathspec — diff-index --quiet via the key returns 0 (clean) against a body that diff via the uid reports as modified.

design.md § 5.2 now opens the claim-surface rule by rooting it at the CANONICALISED UID DIRECTORY, with the three-leg key-vs-uid comparison table as evidence rather than assertion, and states plainly that this is F-1 restored through the reference form on the mainstream edit -> re-verify flow. D5's own-directory drift count takes the uid dir for the same reason (§ 5.4). New invariant I7 — the claim surface names real tracked files, never a symlink standing in for them. New test T28 verifies BY KEY against a modified tracked body and requires refusal, with the note that the uid form passes either way, so the test must use the key form to have meaning.

Also recorded: T8's fresh-record case survives only because the untracked symlink itself trips the untracked leg. T8 passing is not evidence about this hole, and the design now says so."""

[[finding]]
id = "F-16"
status = "answered"
severity = "major"
title = "claim_pathspecs construction table states two git mechanics backwards and drops evidence it should keep"
detail = """
The F-6 round-2 remedy (§ 5.2 'claim_pathspecs construction is total') rests on three claims about git. Two are inverted and one is unsafe. Probed on git 2.54.0, this repo + a scratch repo.

ROW 'absolute path inside the repo'. Design says: 'git resolves a leading slash against the repo root, so unnormalised they match NOTHING'. Observed: git resolves absolute pathspecs against the FILESYSTEM and converts them to repo-relative — they match correctly.
  git ls-files -- /workspace/doctrine/src/git.rs      => src/git.rs
  git diff HEAD --name-only -- $S/items/<uid>/memory.md => items/<uid>/memory.md   (modified file, reported)
So the four items carrying absolute scopes (mem.fact.claude.jail-ro-git-is-bwrap-wrap-passthrough-commits, mem.fact.claude.subagentstart-fires-from-child-session, mem_019f36401beb76338b9eda2112f592b1, mem_019f363b08cc7221a624308e3fc24844) are NOT silently narrowed in the primary tree. Normalisation is hygiene, not a correctness fix, and the stated failure mode does not exist.

ROW 'absolute path outside the repo'. Design says: 'dropped — git cannot observe it', which reads as a benign no-match. Observed: git ABORTS.
  git diff HEAD --stat -- /etc/passwd  => fatal: '/etc/passwd' is outside repository
  git ls-files --others -- /etc/passwd => fatal: same
So the drop is MANDATORY, not tidy: pass one through and the whole probe dies and verify fails hard. Right rule, wrong reason — and the reason is what an implementer follows.

These two combine into an interaction the design does not enumerate: THE SAME SCOPE STRING IS INSIDE-REPO IN ONE CHECKOUT AND OUTSIDE IT IN ANOTHER. '/workspace/doctrine/src/worktree/jail.rs' is inside the primary tree and outside a dispatch worktree at any other path. So classification is a property of the checkout location, not the string, and a memory's claim surface silently narrows depending on WHERE it is verified from — in a repo whose whole dispatch model is linked worktrees. E7 makes it audible but the design never says the surface is location-dependent.

ROW 'gitignored path -> dropped'. Unsafe and unnecessary. Ignore rules do not apply to TRACKED files, so a force-added tracked file under an ignored root is real, claim-relevant evidence that the drop discards. Keeping the pathspec costs nothing — it matches nothing in all three legs when genuinely untracked (worktree diff and diff-index see only tracked paths; ls-files --others --exclude-standard skips ignored) — and detecting 'gitignored' at all needs an extra git check-ignore call. Dropping is strictly weaker than keeping, buys nothing, and costs machinery. Verified .doctrine/state/ is ignored (.gitignore:39) with 0 tracked files TODAY, which is a fact about today, not an invariant.

The premise the whole table is built on IS sound and is confirmed: git does not fail an unmatched repo-relative pathspec absent --error-unmatch (git diff HEAD -- src/nope.rs => exit 0, no output). Silent narrowing is real; the table just mislocates where it comes from."""
disposition = "fix-now"
response = """
Sustained on all three rows. The conclusions of the F-6 round-2 table were mostly right and its reasons were mostly wrong, which is the worse failure — a reason is what an implementer follows.

design.md § 5.2 table corrected: absolute-inside is now 'hygiene, not a correctness fix' with the ls-files evidence, since git resolves absolute pathspecs itself; absolute-outside is 'dropped — MANDATORY' with the fatal quoted, since an unfiltered entry kills the probe rather than matching nothing; gitignored flips from dropped to KEPT, because ignore rules do not bind tracked files and keeping is inert otherwise. E7 reworded (it no longer claims gitignored entries are dropped), E8 added for the keep rule.

The interaction the table never enumerated is now E9: the inside/outside split is a property of the CHECKOUT, not the string. The four items scoped /workspace/doctrine/... are inside the primary tree and outside a linked worktree, so a memory's claim surface narrows when verified from a dispatch worktree — in a repo whose dispatch model is linked worktrees. T26 gains the requirement that the absolute-outside case assert verify does not abort.

The premise underneath the table survives and is now cited with its probe: git does not fail an unmatched repo-relative pathspec absent --error-unmatch. Silent narrowing is real; F-6 round 2 just mislocated where it comes from."""

[[finding]]
id = "F-17"
status = "answered"
severity = "minor"
title = "T20b cannot fail: it pins claim_snapshot on the one field apply_edit already guards"
detail = """
Expected (F-8 remedy): T20b — 'set --title to its existing value => does not clear' — demonstrates that claim_snapshot COMPARES rather than counting supplied flags.

Observed: apply_edit already guards title. src/memory.rs:3826-3831 reads the existing value and only assigns when 'existing != trimmed'; summary (:3837-3843), lifespan and review_by do the same. So an idempotent --title yields toml_changed = false regardless of claim_snapshot, and T20b passes even if claim_snapshot were absent, buggy, or wired to flag-presence. A test that cannot fail for the reason it names verifies nothing.

The discriminating case is scope. All three scope arrays are replaced UNCONDITIONALLY with no comparison — src/memory.rs:3944-3978, each arm building a fresh toml_edit::Array and setting 'changed = true' outright. So apply_edit's bool is a CHANGED flag for the scalars and a SUPPLIED flag for the scope arrays, and claim_snapshot's comparison is genuinely load-bearing only there. Retarget T20b at --path-scope set to its existing value.

Consequent behaviour the design should state rather than let an implementer discover: an idempotent --path-scope still stamps 'updated' (apply_edit sets changed, so the terminal block at :3980-3983 fires) while claim_snapshot correctly declines to clear the attestation. Defensible, but it is the only place where 'updated' moves and the verification axis does not, and nothing currently asserts it."""
disposition = "fix-now"
response = """
Sustained. apply_edit guards title/summary/lifespan/review_by by comparison (src/memory.rs:3826-3843) and sets changed unconditionally for all three scope arrays (:3944-3978) — so its bool is a changed flag for the scalars and a supplied flag for the scope arrays, and T20b as written passed with claim_snapshot absent.

T20b retargeted to --path-scope, with the reason stated in the test row so it is not silently reverted to the more readable title case. § 5.4 gains a paragraph naming the asymmetry and the code sites, so the implementer knows WHY the comparison exists rather than inferring that apply_edit is careless.

The divergence that falls out is now stated instead of discovered: an idempotent --path-scope stamps updated while the attestation survives. Defensible — updated tracks the write, the axis tracks the claim — but it is the only place the two move apart, so T29 asserts it."""

