Contest accepted: a composite field breaks both anchored forms. Each id now has its own field: canonical = review id (`RV-012`), slug = finding id (`F-3`), title = finding title, so `-r '^RV-012$'` and `-r '^F-3$'` both match. Cost: the review slug leaves the census search domains (`--target` and the review id cover it); substring domain becomes finding id + title. No change to listing.rs (FilterFields has 25 construction sites). Test `census_regex_matches_each_id_anchored` covers both anchored forms. sec-5, sec-8.
"""

[[finding.turn]]
