The composite canonical field does not preserve ID searches. design.md:539-543 sets it to "RV-012 F-3", while src/listing.rs:283-293 tests the regex against that whole field (or the unrelated slug/title). Thus `-r '^F-3$'` still misses F-3, and `-r '^RV-012$'` stops matching the review ID. The new test at design.md:734-735 only checks `F-3$`, so it misses both regressions. Give each ID its own regex match domain and test both anchored forms.
"""

[[finding.turn]]
