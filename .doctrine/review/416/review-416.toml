[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Census regex cannot find a finding by its id"
detail = """
Expected: a regex filter over a one-row-per-finding census should have an explicit way to match the row's `F-n` identity, or the design should state that it searches only review identity and finding title.
Observed: SL-278 proposes `FilterFields { canonical: review id, slug: review slug, title: finding title }` (`.doctrine/slice/278/design.md:497-505`). `listing::regex_admits` checks only `canonical`, `slug`, and `title` (`src/listing.rs:283-293`). Thus `review findings -r '^F-3$'` cannot match an `F-3` row unless its unrelated review slug or finding title happens to contain that token. The census verification says `-r` behaves as on `review list` (`design.md:667-670`), which masks the missing finding-id domain rather than defining it.
Suggested fix: define the census regex domain to include both review and finding ids while preserving the existing review-id search, and add one fixture where `F-3` appears only in the id field. State the exact domain in help so users can tell which identifiers are searchable.
"""
disposition = "fix-now"
response = """
Contest accepted: a composite field breaks both anchored forms. Each id now has its own field: canonical = review id (`RV-012`), slug = finding id (`F-3`), title = finding title, so `-r '^RV-012$'` and `-r '^F-3$'` both match. Cost: the review slug leaves the census search domains (`--target` and the review id cover it); substring domain becomes finding id + title. No change to listing.rs (FilterFields has 25 construction sites). Test `census_regex_matches_each_id_anchored` covers both anchored forms. sec-5, sec-8.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Accepted. Census FilterFields.canonical is now `RV-012 F-3`, so the regex domain is review-and-finding id, review slug, finding title; `-r 'F-3$'` matches. Domain stated in help (sec-5); fixture where F-3 appears only in the id (sec-8).
"""

[[finding.turn]]
