title = "UnreadableReview needs Serialize for the new output fields"
detail = """
Expected: the new unreadable diagnostics compile in both `ReviewOutput::Listed` and `FindingsListed` and serialize on the promised JSON/MCP channels.
Observed: design.md:550-555 defines `UnreadableReview` without a `Serialize` implementation, then design.md:582-596 places `Vec<UnreadableReview>` in serializable output variants. The existing `ReviewOutput` derives `Serialize` at src/review/mod.rs:318-322. Implementing the specified type literally makes that derive fail. Add `Serialize` to the new diagnostic type and pin its `{rv, reason}` wire shape.
"""
