[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected a test pinning regenerate's fatal-leg rule; observed none"
detail = """
DEC-401 (legs are fatal) and Reconcile carry ("A Refused leg outcome halts regeneration like Failed") are implemented by `leg_failure` (src/install.rs:1206), called at :1191 and :1197. No test references `leg_failure` or drives a Refused/Failed leg through `regenerate`; tests_regenerate (install.rs:8014+) covers skip, downgrade, stale wiring, progress and the drift guard only. A regression that let a refused leg degrade would ship green.
"""
disposition = "fix-now"
response = """
Added tests_regenerate::leg_failure_halts_on_refused_and_failed_only (sl-285 c2b132cc1). Negative control: making the Refused arm return None reds it.
"""

