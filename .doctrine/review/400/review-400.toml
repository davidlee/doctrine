[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "Build floor skills check names a nonexistent verb and misses where route prose is served"
detail = """
Observation. DEC-334 item 2's third floor check is "installed skills are fresh (doctrine install check or equivalent)". There is no install check verb: ./target/debug/doctrine install --help lists only --path, --agent, --skill, --domain, --only-memory, --global, --dry-run, --yes, --color. "or equivalent" leaves the check to be invented at run time.

It is also aimed at the wrong surface for the route prose. install/design-prompts/reviewing.md is embedded in the binary and served by the design run (src/design_run/prompt.rs:4-14, "The shell resolves the key against the embedded corpus"), so its freshness is the binary's, not the installed skills'. Meanwhile the installed skills in this very repo are already stale on routing: .agents/skills/plan/SKILL.md:45 still describes a disposition that begins route:demonstrate, while plugins/doctrine/skills/plan/SKILL.md:45 describes the route field.

What would settle it. Name each floor check as a concrete command with its pass condition, e.g. the design reviewing fragment digest emitted by design resume matches the SL-270 build; install --dry-run reports no pending skill changes; the MCP review_dispose schema's route enum equals the six. Say which binary each check runs against (CLI on PATH, DOCTRINE_BIN, the MCP server).
"""
disposition = "fix-now"
route = "control"
response = "Accepted. The floor now reads: CLI help and the MCP review_dispose schema each list six routes (they carry the embedded reviewing.md, so they cover the route prose); doctrine install is run at window open and the projections recorded current. The fault the floor must reject: an MCP server launched from a stale PATH binary that offers the five-route enum. Criterion to assert: the recorded floor check fails for that server and passes after it is rebuilt. Host: the CHR-082 window-open step, not an SL-270 phase."

