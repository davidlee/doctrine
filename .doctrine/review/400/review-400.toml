title = "Kappa baseline 0.44-0.56 mixes in the audit/code-review population"
detail = """
Observation. DEC-334 item 5 and design sec-4 and sec-6 compare the window's kappa "against 0.44-0.56". In RFC-026 E14 (.doctrine/rfc/026/route-rerate/report.md:27-28), 0.56 is population T (audit and code-review, 47 findings) and 0.44 is population D (design review, 155). The trial is design-review only, so its baseline is 0.44; the range mixes in a population the trial excludes. Also the E14 raters worked without the tie-break (DEC-333 context), and the window's second rater gets it plus the new probe/control sentence and the five-to-six split, so a kappa change cannot be attributed to any one of these.

What would settle it. State the baseline as E14 design facet kappa 0.44 (probe/control 26 of 70 disagreements), and note that the rater prompt differs from E14's in three ways, so the comparison is descriptive.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. DEC-334 item 5: kappa compared with 0.44, the design-review value; the three prompt differences from E14 are named and a kappa change is not attributed to any one of them."

