[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "F-7 repair makes an unknown-status major fail open at the lock, against DEC-326 rationale"
detail = """
Observation. The F-7 repair changed DEC-326 and design sec-3 so that an out-of-vocabulary status is excluded from the route check. For a blocker this is harmless: undisposed_blockers still holds the edge on an unknown status. For a major (or unknown severity) with an unknown status and no route, nothing refuses: the lock passes with an unrouted severe finding. That is fail-open, and it contradicts DEC-326's own rationale, which is unchanged: "Failing closed on degraded values keeps a missing route a datum rather than a silence". The stated grounds are:
- "no review verb can act on it". True (src/review/verbs.rs:664-672), but the same holds for an unknown-status blocker, which the lock already refuses, with a hand edit as the repair.
- "vocabulary_defects already discloses it". On the design-run path the defect warning is printed only when apply is given a disposition (src/commands/design.rs:3174-3176, "on the admission path only"). An evaluation of the lock against a stored disposition prints nothing there. So disclosure at the lock is not guaranteed.
DEC-334 item 6's gated population ("disposed on the final review pass") also silently omits this class: it is neither in the gate nor among the reported-apart classes (open at lock, superseded passes, post-lock).

What would settle it. Either count an unknown-status severe finding as unrouted (fail closed, repair by hand edit, named in the refusal, as the blocker check already does), and keep the double-listing exclusion for blockers; or keep the exclusion but amend DEC-326's rationale to state the fail-open exception and add the class to DEC-334 item 6's reported-apart list. VT-3 then asserts whichever is chosen for a major with unknown status.
"""
disposition = "fix-now"
route = "review"
response = "Accepted: fail closed. DEC-326 and design sec-3 now count an out-of-vocabulary status as disposed, so a route-less major with one refuses the lock; the remedy is to repair the status by hand, as the blocker check already requires. VT-3 asserts it. This restores agreement with DEC-326 rationale and puts the class inside DEC-334 gated population, so item 6 needs no separate line."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Accepted: fail closed. DEC-326 and design sec-3 now count an out-of-vocabulary status as disposed, so a route-less major with one refuses the lock; the remedy is to repair the status by hand, as the blocker check already requires. VT-3 asserts it. This restores agreement with DEC-326 rationale and puts the class inside DEC-334 gated population, so item 6 needs no separate line."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "DEC-326 choice and sec-3 now count an out-of-vocabulary status as disposed (fail closed) with a hand-edit remedy; VT-3 asserts it; consistent with the unchanged rationale."

[[finding]]
id = "F-12"
status = "verified"
severity = "minor"
title = "REV-065 approved SPEC-032 text predates the F-11 fail-closed change"
detail = """
Observation. REV-065 was approved before the round-2 fix to RV-400 F-11. Its SPEC-032 amendment (show REV-065, line 33, "closed on write, open on read" paragraph, After column) describes the lock as refusing on a severe finding "that is answered, contested or verified, and not already an undisposed blocker". DEC-326 and design sec-3 now also count an out-of-vocabulary status as disposed (fail closed). Applied as written at reconciliation, SPEC-032 would describe a narrower gate than the code, and the approved text would drift from DEC-326. (DEC-326's trailing note also still cites only F-7 though F-11 amended it.)

What would settle it. Amend REV-065's After text to read "that is not open or withdrawn (an out-of-vocabulary status counts)", matching DEC-326, and re-confirm its approval if the approval process requires it for a changed payload.
"""
disposition = "fix-now"
response = "Accepted. REV-065 Amendment 2 now says the lock refuses on a severe finding whose status is not open or withdrawn (an out-of-vocabulary status counts), matching DEC-326 and sec-3. DEC-326's amendment note cites F-7 and F-11. The wording change narrows nothing the owner approved; the owner is told of it at the lock gate."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. REV-065 Amendment 2 now says the lock refuses on a severe finding whose status is not open or withdrawn (an out-of-vocabulary status counts), matching DEC-326 and sec-3. DEC-326's amendment note cites F-7 and F-11. The wording change narrows nothing the owner approved; the owner is told of it at the lock gate."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "REV-065 Amendment 2 now reads not open or withdrawn with out-of-vocabulary status counting, matching DEC-326; DEC-326 note cites F-7 and F-11."

