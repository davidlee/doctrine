[[finding]]
id = "F-7"
status = "answered"
severity = "minor"
title = "Disposed set disagrees with DEC-138 on contested and unknown status; remedy incomplete"
detail = """
Observation. sec-3 defines disposed as status not known open or withdrawn, so contested and unknown statuses count. The existing sibling on the same condition, undisposed_blockers (src/review_ledger/gate.rs, the fn after the DEC-138 comment block, lines 134-146), classifies contested and unknown status as undisposed. So a contested or unknown-status blocker with no route is listed under two causes of review-disposition-attested at once: BlockersUndisposed ("blocking findings hold the edge: F-3") and the new SevereFindingsUnrouted ("F-3 (no route)"), one calling it undisposed and one disposed. VT-2/VT-3 do not pin which is intended.

The remedy text covers answered (amend) and verified (reopen, re-dispose) but not contested (dispose again with --route, admissible per src/review_ledger/transition.rs:113-115). For an unknown status, no verb can move the finding: gate() refuses UnknownStatus before any act (src/review/verbs.rs:664-672), so the named remedy cannot work and the only path is a hand edit, which the refusal does not say.

What would settle it. Either define the new predicate's disposed set so a finding already in undisposed_blockers is not also listed (or state that double-listing is intended and test it), name the contested repair in the remedy, and state the hand-edit path for an out-of-vocabulary status.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. DEC-326 and design sec-3: disposed means known answered, contested or verified; an unknown status is excluded (disclosed already, and no verb can act on it); a finding already listed as an undisposed blocker is excluded. The remedy names the repair per status, including contested. VT-2 and VT-3 updated."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Accepted. DEC-326 and design sec-3: disposed means known answered, contested or verified; an unknown status is excluded (disclosed already, and no verb can act on it); a finding already listed as an undisposed blocker is excluded. The remedy names the repair per status, including contested. VT-2 and VT-3 updated."

[[finding]]
id = "F-8"
status = "answered"
severity = "minor"
title = "DEC-330 claims vocabulary_defects discloses legacy routes; it does not (contradicts DEC-326)"
detail = """
Observation. DEC-330's choice says a legacy owner-fix value "reads as an unknown route, disclosed by vocabulary_defects". vocabulary_defects covers status and severity only (src/review_ledger/derive.rs:128-150). DEC-326 says exactly that and that the gate carries the disclosure itself; design sec-2 agrees with DEC-326. The two accepted decisions contradict each other, and commit 18f25be9a corrected only DEC-326.

Consequence beyond bookkeeping: before the lock refuses, no read surface discloses a legacy route. review show prints it raw, and amend without --route silently re-snapshots it through effective_route (src/review/verbs.rs:327-338), so a responder repairing response text gets no signal until the lock.

What would settle it. Correct DEC-330's claim to match DEC-326, or, if disclosure on read is wanted, extend vocabulary_defects to route and record that (which also changes SPEC-032's "not a defect" sentence).
"""
disposition = "fix-now"
route = "owner-fix"
response = "Accepted. DEC-330 corrected: a legacy owner-fix stays readable and verbatim, and the lock refusal is what names it; vocabulary_defects covers status and severity only. Surviving owner: DEC-326. Class swept: DEC-330, DEC-326 and design sec-2 and sec-3 now agree."

