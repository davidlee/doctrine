### NF-003 (REQ-304) — Isolation integrity: tier exclusion is guaranteed by construction rather than a trusted check, and the sole-writer guard fails closed on ambiguity (a marker-absent linked worktree is refused, not trusted).

isolation-integrity-tier-exclusion-is-guaranteed-by-construction-rather-than-a-trusted-check-and · quality · active makes the isolation rule a product requirement: REQ-296 says coordination-tier state is absent by construction from isolated units, REQ-302 says recovery is from committed coordination state alone, and REQ-304 requires tier exclusion by construction. design.md:284-307 introduces a primary-worktree runtime registry shared by isolated workers and treats REV-043 as sufficient. That directly changes the accepted meaning of at least REQ-296/REQ-304 and arguably REQ-302, yet neither the design nor revision dispositions those requirements. Implementation must not start until the product-governance conflict is either reconciled through REV-043 (including explicit requirement treatment) or the design is changed to preserve the absence invariant."""
disposition = "accepted-leg-withdrawn-req-296-restated"
response = "Contest upheld and the evidence verified independently: .agents/skills/dispatch-subprocess/SKILL.md:15 and :31 spawn 'env -C $D DOCTRINE_WORKER=1 ...' with no bwrap; their 'Confined (bwrap)' / 'Same confinement as codex arm' annotations are not implemented by the commands they annotate; nothing under .agents/skills/ or install/ references scripts/pi-spawn-confined.sh, which does carry real confinement (:100-115, --ro-bind / /, rw-bind only $D). So REV-043 cited a script off the normative path, and citing a doctrine-repo script as PLATFORM evidence is a POL-002 problem besides. Corroborated by mem.fact.dispatch.worker-confinement-is-actor-based: confinement here is a cooperative accident-fence, not a security boundary. That falsifies the second leg of round 4's rescope, which claimed both legs construction-backed. REQ-296 now states 'no copy of the tier provisioned into it, and no unit permitted to write that tier' — construction for the first leg, a prohibition stated as one for the second — and DROPS the consequent rather than repairing it a third time. The OS-floor argument is removed from the REV entirely, not re-argued: the platform gap is IMP-354 and REQ-304's 'by construction' claim is QUE-199. On your REQ-304 limb specifically: the describe_mode truth table you read is correct (marker-absent linked worktree yields refused=false), but under the actor-based model that is by design, not a defect — the tension is between spec-012.md:273-274's 'loses privilege' framing and the predicate, and it predates SL-237. Captured in QUE-199 rather than adjudicated here."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "I-3 traces the impossible arm and misses the real confinement path"
detail = "The read-only-primary analysis does not match either dispatch arm. scripts/pi-spawn-confined.sh:103-110 mounts the root read-only but also unconditionally sets DOCTRINE_WORKER=1; src/commands/guard.rs:473-517 therefore rejects a phase-state write at the worker guard before any attempted primary write can reach EROFS. Conversely REV-043:146-152 says the Claude arm has no OS confinement floor, but the current arm documents and installs one: .agents/skills/dispatch-agent/SKILL.md:176-184 invokes a PreToolUse Bash bwrap and denies Edit/Write outside the worker, plugins/doctrine/hooks/hooks.json:47-64 wires those hooks, and src/worktree/pretooluse.rs:1-13 describes the two confinement walls. design.md:191-202 names a dedicated read-only-primary error as required behavior, while V-8 at design.md:351-353 does not identify which arm, how worker stamping is absent despite the subprocess contract, or which confinement layer is expected to emit it. The premise and verification are therefore not executable as written; specify the actual reachable states for both arms and the layer/error contract for each."
disposition = "already-fixed-before-your-read"
response = "No disagreement — a race. The stale claude-arm text was corrected in REV-043 rows 1a and 2 at commit 7e92f41e (2026-07-29 15:04 +1000), which landed after this review round was dispatched and before it returned. Verify against the working tree, not your cached read: grep 'claude arm has no OS floor' revision-043.md now returns only two HISTORICAL narrations (the rationale describing what the earlier draft asserted, and the F-2 provenance note). The live proposed row text states the CLI guard refusing the whole WriteClass::Write set under worker_mode on both arms — env leg on codex/pi, marker leg on claude — each under its own OS floor, with worker_commit named as the one deliberate opening. Your F-11 is the same finding; disposed identically."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "PrimaryRoot erases the git cwd needed for solo boundary capture"
detail = "The proposed threading conflates storage ownership with revision identity. design.md:130-138 changes init_phases to take only &PrimaryRoot and design.md:157-174 threads that capability through phase mutation APIs. But src/state.rs:590-670 explicitly uses project_root for two independent purposes: locating the primary-owned boundary registry and resolving HEAD in the invoked worktree (). src/state.rs:399-517 passes that root into capture_phase_boundary. In solo linked-worktree execution, HEAD must come from the linked worktree while the registry must live in primary. Replacing the sole root with PrimaryRoot either records the primary branch's HEAD (wrong source-delta identity) or leaves the signature incapable of expressing the required two roots. The design must preserve a distinct invoked/git cwd alongside PrimaryRoot and verify boundary capture from a linked solo worktree."
disposition = "accepted-reopens-dec-095"
response = '''
Accepted; the strongest finding in the review. Verified at src/state.rs:617 (`live_worktree_for_ref(project_root, ...)`) and :629 (`resolve_ref(project_root, \"HEAD\")`), reached from set_phase_status via capture_phase_boundary.

The diagnosis is exactly right and is the slice's own defect reproduced in its design: `project_root` was one identifier serving TWO meanings — where the state file lives, and which worktree's git is being asked. My section 5.2 collapsed it to the first and silently kept the second, which would record the PRIMARY's HEAD as a solo linked worktree's source-delta boundary — wrong revision identity, silently.

DEC-095 is amended, not replaced: the newtype survives; the parameter splits. Phase-mutation APIs carry both roots explicitly. Verification gains a solo-linked-worktree boundary-capture case.'''

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Non-duplication does not preserve D4 against shared RMW races"
detail = "REV-043 characterizes the change as a restatement, but its proposed exception weakens ADR-006 D4's mechanism-level prohibition. REV-043:68-105 replaces 'any future central index reintroduces conflict' with permission for a sole primary-owned runtime registry whenever linked worktrees do not duplicate it. Non-duplication is not conflict freedom: src/state.rs:367-389 implements phase-sheet edits as an unlocked read-modify-write, and the source-delta registry at src/state.rs:758-857 is likewise shared mutable state with no locking shown. src/slice.rs:944-956 drives phases without the live-drive guard used by reconcile at src/slice.rs:1235-1256, so primary and solo-linked invocations can target the same primary-owned files concurrently. design.md:279-307 asserts D4 is preserved solely because there is one copy, but D4's quoted warning is about shared coordination conflict, not only duplicate copies. Either provide a serialization/atomic-update mechanism and evidence, or state this as an explicit relaxation with its concurrency risk governed rather than calling it a restatement."
disposition = "accepted-reframed-as-relaxation"
response = """
Accepted. The design never addressed concurrency at all, and you are right that non-duplication is not conflict freedom. Verified: edit_phase_sheet is an unlocked read-modify-write, the registry is likewise unlocked, and run_phases carries no live-drive guard where run_reconcile_phases does (src/slice.rs:1236-1244).

Taking the second of your two remedies. Calling it a pure restatement was overreach: single-homing PRESERVES merge safety (no copy, nothing to diverge — that part stands) while INTRODUCING a new concurrent-RMW exposure. Both are now stated. The exposure is governed, not waved away: ADR-006 D2/D9 make the orchestrator the sole phase-state writer during a drive, and the pre-existing single-operator precondition already documented on run_reconcile_phases is promoted to a design-level assumption covering the shared file. What is NOT claimed is a locking mechanism — none is designed, and pretending otherwise would be worse than naming the bound."""

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Ripple census misses direct runtime-state consumers"
detail = "The section 5.2 table is not a complete touch-set. src/integrity.rs:320-329 directly calls state::phases_dir(root) for reseat validation and will continue checking the invoked linked tree unless it is converted to PrimaryRoot. Additional direct registry/truth callers omitted from design.md:149-189 include state::forget_source_delta at src/state.rs:857, dispatch status at src/dispatch.rs:4814-4854, plan-next rows at src/dispatch.rs:5069-5079, and MCP receipt handling at src/mcp.rs:1066-1086. These are not all covered by the listed run_phases/run_status/gather_truth/lazyspec fan-out, and several must either receive the capability or be explicitly proven to remain command-tier resolution boundaries. Add a compiler-backed/direct-caller census and disposition each site; otherwise linked-tree behavior can remain split after the nominal migration."
disposition = "accepted-my-census-was-under-read"
response = "Contest upheld and my correction to you was itself incomplete. I established that integrity.rs:322 hand-builds via kind.state_dir and called it the only production site — true — but did not read far enough to notice the site is GENERIC over kinds and that two kinds declare a state_dir: SLICE (kinds/mod.rs:358) and REVIEW (:410). A generic migration would have primary-scoped review runtime state, shipping the change §6 OQ-2 defers to CHR-050 while claiming not to. §5.2 now kind-scopes the guard to SLICE; V-11 asserts the slice kind moves and new V-17 asserts the review kind does NOT."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Warning-only fallback recreates the mis-homing invariant"
detail = "The proposed total constructor cannot satisfy its own error-handling invariant. design.md:74-80 says a plausible-but-wrong runtime path is the bug class and failures must degrade loudly; design.md:122-128 then makes PrimaryRoot::resolve return Self and, on a genuine git failure, falls back to the supplied path with only a warning. The current primitive is explicitly fallible: src/git.rs:564-571 returns Result<PathBuf> from git worktree list --porcelain. Once resolve has erased that Result, every downstream writer proceeds against the fallback path, including exactly the linked-worktree path this slice is meant to prevent. design.md:325-326 repeats that a warning is the mitigation, but observability does not prevent corrupt placement. The API must preserve a failure/degraded state that prevents primary-owned writes, or explicitly justify and verify a safe non-writing degradation."
disposition = "accepted"
response = """
Accepted. 'Observability does not prevent corrupt placement' is the right objection and my mitigation was exactly the confusion the slice exists to remove — I treated a warning as a safeguard.

Fix: PrimaryRoot::resolve stops being unconditionally total. It is total ONLY for the designed invariant (no repo at all — the given root is its own primary, which the ~20 tempdir tests rest on) and FALLIBLE for a genuine resolution fault. The discriminator is the one already in the design (a `.git` in cwd.ancestors()), promoted from 'emit a warning' to 'return Err'. A caller that cannot resolve a primary does not get to write primary-owned state."""

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "REV-043 is referenced, not a gating dependency"
detail = "Implementation is not actually ordered behind the governance change it says it needs. ./target/debug/doctrine slice show 237 reports concerns REV-043 but no needs REV-043; ./target/debug/doctrine revision show REV-043 reports status proposed and no approval. ADR-013 requires work that must wait for a revision to declare needs REV-NNN. Yet design.md:284-307 acknowledges accepted ADR-006/SPEC-012 wording conflicts with the proposed primary-owned registry, and design.md:329-330 treats merely opening REV-043 as mitigation. Without a gating relationship or entry criterion, implementation can begin while accepted governance still forbids its mechanism. Add the explicit dependency and make revision acceptance an implementation entry gate, or redesign to conform without REV-043."
disposition = "accepted-fixed"
response = """
Accepted without reservation; trivially correct and I should have used the gating verb at the outset. ADR-017 gates actionability on inbound `needs` against unsettled records, and REV-043 is `proposed` with no approval. A `references --role concerns` edge carries no gate.

Fixed: `doctrine needs SL-237 REV-043`. The design's risk R4 is restated — opening the REV is not the mitigation, the GATE is; REV-043 reaching approved is an entry criterion for the implementation phases, recorded in section 8 rather than left to prose."""

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "I-4 does not retire pre-existing linked-worktree symlinks"
detail = "The migration claim is stronger than the mechanism. Current src/state.rs:342-350 refreshes the invoked-root phases link, so existing linked worktrees can already contain the symlink. design.md:130-138 changes init_phases to accept only PrimaryRoot and states refresh occurs only there; design.md:225-227 nevertheless claims a linked-worktree invocation gets no symlink, and V-7 at design.md:348-350 only verifies creation in primary plus direct primary paths. Nothing removes a stale symlink already present in the linked tree, and the narrowed API no longer has that invoked path available to clean it. This makes the claimed postcondition false for upgrades and existing worktrees and can leave a misleading runtime projection crossing the isolation boundary. Specify cleanup or migration semantics and verify the pre-existing-link case."
disposition = "accepted-bounded-remedy-residual-named"
response = "Contest upheld. refresh_symlink runs where invoked, so it retires only that tree's link; sibling worktrees keep theirs indefinitely. A sweep was considered and REJECTED with reasons: enumerating git worktree list and writing into other trees breaks ADR-006's sole-writer posture, races a live drive, and can touch a worktree whose owner never ran this code. So the residual is accepted and made visible rather than carried silently — doctor reports a phases link in any non-primary worktree as a stale-projection finding (new V-19). Note the exposure is finite and shrinking: fresh forks never receive a link at all (WITHHELD carries Tier::PhaseLink, allowlist.rs:74), so only worktrees predating this slice are affected."

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "The proposed test helper cannot be the claimed mechanical adaptation"
detail = "The behaviour-preservation gate is underspecified where roughly 50 tests change construction. design.md:111-118 defines pub(crate) struct PrimaryRoot(PathBuf), whose tuple field remains private to src/git.rs; state and slice test modules therefore cannot implement the design.md:321-324 helper fn primary(p: PathBuf) -> PrimaryRoot as a one-line wrapper. Their available constructor is the impure PrimaryRoot::resolve, which shells out to git and applies warning/fallback policy, while many existing unit tests use arbitrary temp roots. Satisfying V-1b at design.md:333-336, only construction adapted and assertions unchanged, consequently requires either exposing an unchecked or test-only constructor, converting unit tests into git-dependent tests, or broader fixture changes. Each choice changes what the existing suites prove. Choose and constrain the test construction seam, including how it prevents production bypass of the capability, before claiming unchanged suites preserve behaviour."
disposition = "accepted"
response = """
Accepted. The tuple field is private to src/git.rs, so no state.rs or slice.rs test module can write the one-line wrapper I proposed, and routing ~50 unit tests through the impure resolve would convert pure path-join tests into git-dependent ones — silently changing what the existing suites prove, which is the very thing V-1b is supposed to protect.

Fix: an explicit second constructor, `PrimaryRoot::assume(path)`, documented as 'the caller asserts this path is already the primary'. This is NOT a test-only escape hatch — it has a real production consumer: src/dispatch.rs:3449-3471 already resolves primary_worktree itself and passes `&primary`, and without `assume` it would have to redundantly re-resolve. Naming the seam serves both, and DEC-098's stated win (deleting that double resolution) depends on it.

On your bypass concern: `assume` is pub(crate) and its misuse is a reviewable call-site question, not a silent one — which is the honest limit of what a newtype buys, per the R-3 correction already integrated in section 10."""

[[finding]]
id = "F-10"
status = "verified"
severity = "blocker"
title = "resolve_for_read forges the writer capability"
detail = "Design §5.2 defines PrimaryRoot as the repo primary and makes write APIs accept that type, but resolve_for_read returns the same PrimaryRoot type wrapping cwd after a genuine resolution fault even when the visible .git proves cwd belongs to a repository. The value therefore violates its own type invariant and remains accepted by every primary-owned writer. The read/write split is only a caller convention: a mixed or later call site can choose resolve_for_read and then pass the indistinguishable value to init_phases, set_phase_status, or a registry writer, recreating F-6's mis-homed write with no compiler signal. Even on current read-only sites the fallback returns plausible local phase truth while the design claims repo-scoped state has one home. Preserve read availability with a distinct degraded-read type/result that cannot satisfy writer signatures (or keep fallback inside read operations without minting PrimaryRoot), and verify that degraded data is not consumed as authoritative write/planning input."
disposition = "accepted-swept-mechanically"
response = "Contest upheld — the correction was again written where it was argued. Method changed rather than repeating the pass: the claim was turned into a corpus-wide grep with a positive control, then patched against the resulting list. Found 5 live sites; you named 3. Fixed: design.md §5.1's flow diagram (it showed phases_dir/boundaries_path taking &PrimaryRoot while §5.2's contract table 130 lines below said &ReadRoot — the design contradicted itself); DEC-095 amendment 1's 'pure path constructors take only &PrimaryRoot' struck in place with a pointer to amendment 6, the same treatment amendment 4 got; DEC-098's title, opening prose AND its record-098.toml title + relation descriptor — the two you did not name were the toml tier, which is the storage rule's exact warning about judging a record from one file. DEC-098's title no longer restates DEC-095's type choice at all ('onto the root newtype'), removing the duplication that let the two drift. Re-swept with control: the only surviving hits are Before-blocks and §10's historical record of this defect."

[[finding]]
id = "F-11"
status = "verified"
severity = "blocker"
title = "REV-043 still proposes the stale Claude no-floor claim"
detail = """REV-043's rationale says RV-322 F-2 corrected the Claude-arm OS-floor mistake, but Row 2's actual proposed SPEC-012 replacement still says: "The claude arm has no OS floor". Row 1a's proposed ADR-006 D2 text likewise names the read-only mount only for codex/pi. This directly contradicts the same REV's What does NOT change section and design §5.5 I-3, and means approving/applying the implementation gate can write the exact stale governance F-2 was supposed to stop. Correct every proposed after-text and responsibility replacement, not only the rationale, and verify the rendered revision is internally consistent before approval."""
disposition = "already-fixed-see-F-2"
response = "Duplicate of F-2; disposed identically. Fixed at commit 7e92f41e before this round returned — you read the pre-fix artefact. Re-read revision-043.md rows 1a and 2 in the working tree."

[[finding]]
id = "F-12"
status = "answered"
severity = "blocker"
title = "REV-043 revises only one of PRD-015's contradicted surfaces"
detail = 'The narrow F-1 correction treats only PRD-015 Invariant 2 as falsified, but `spec show PRD-015` carries the same non-leakage/absence contract in at least four additional authoritative surfaces: the responsibility says the runtime tier "never leaks across the isolation boundary"; Scope names "non-leakage"; Principle 1 says the tier is "absent from an isolated unit" and explicitly "not present-but-trusted-not-to-be-touched"; §7 requires it to be "demonstrably absent from a provisioned unit". SL-237 deliberately makes the tier readable from the worker execution context. REV-043 Row 3 edits only Invariant 2 and leaves all four claims asserting the old mechanism. Its REQ-296/REQ-304 adjudication also substitutes "not copied"/"write protected" for the authored words "absent"/"tier exclusion" without reconciling those surrounding definitions. The revision must disposition and, where necessary, revise the whole PRD claim class before it can gate implementation.'
disposition = "accepted-toml-tier-and-duplication-both"
response = "Contest upheld on both limbs. (1) spec-015.toml:13's structured responsibility ('never leaks across the isolation boundary') was unswept — the queried tier, which is exactly the two-tier defect this REV raised against DEC-098 one round earlier and then repeated. Added to row 3d as the first surface, ahead of the prose ones. (2) Rows 3a and 3d were not verbatim ('the boundary guarantees' vs 'the construction guarantees'), and the verbatim-matching remedy was wrong in principle anyway: duplicating a sentence into two independently editable surfaces causes drift rather than preventing it — the opposite of the DEC-098 fix, which worked by removing a restatement. Corrected by differentiating rather than aligning: 3a is an invariant (what is and is not true of the boundary), 3d a principle (why the design is built that way), neither restating the other. Also removed from 3d's principle the 'enforced beneath the boundary rather than by the unit's cooperation' clause, which rested on the withdrawn OS-floor argument."

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "Generic reseat migration silently primary-scopes review state"
detail = "The F-5 remedy says the generic guard at integrity.rs:322-323 should resolve its hand-built `root.join(kind.state_dir)` path through PrimaryRoot. But `KindSpec::state_dir` is not slice-only: src/kinds/mod.rs:358 assigns `.doctrine/state/slice` to Slice and :410 assigns `.doctrine/state/review` to Review. Applying the proposed generic migration therefore changes review reseat's runtime-state home too, while design §6 OQ-2 explicitly defers `.doctrine/state/review/` to CHR-050. V-11 exercises only slice state and cannot catch the review regression. Narrow the primary resolution to the slice runtime class (or encode scope in kind metadata) and leave review semantics unchanged until CHR-050 adjudicates them."
disposition = "accepted-see-F-5"
response = "Duplicate of F-5's substance; disposed identically. Guard is kind-scoped to SLICE; V-17 asserts the REVIEW kind's state_dir still resolves against the invoked root, so the OQ-2/CHR-050 boundary is tested rather than trusted."

[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "Symlink retirement cannot clean existing sibling worktrees"
detail = """The F-8 remedy gives refresh_symlink only `(primary, git_cwd)`. That can remove a stale `phases` link from the one linked worktree invoking `slice phases`, but a normal invocation from the primary cannot see or retire links already minted in other existing linked worktrees, and invoking one fork leaves every sibling untouched. Thus I-4's upgrade claim and the original "a linked worktree gets no convenience link" postcondition remain false repository-wide. DEC-097 still contains only the green-field minting decision and no migration amendment. Specify either a real worktree-list sweep with safe per-tree cleanup, or an explicitly lazy/local migration with the residual stale-link behaviour and verification stated honestly."""
disposition = "accepted-see-F-8"
response = "Duplicate of F-8's substance; disposed identically. On-encounter retirement, sweep rejected on sole-writer/race grounds, residual surfaced through doctor (V-19)."

[[finding]]
id = "F-15"
status = "verified"
severity = "major"
title = "V-8b omits the mechanisms I-3 says it verifies"
detail = """Design §5.5 I-3 says V-8b checks the unconfined worker_commit exception "not just the two arms" and correctly distinguishes the Claude CLI refusal's marker leg from its PreToolUse OS floor. But the §9 V-8b row names only the pi env leg and Claude PreToolUse hooks; it neither verifies the Claude marker refusal nor checks that worker_commit writes no phase sheet or registry row. The verification can therefore pass with the marker leg broken or the unconfined exception widened—the two exact regressions F-G added the detail to prevent. Split/pin all four claims: pi CLI leg, pi OS floor, Claude marker leg, Claude OS wall, plus a source/call-surface check that the granted worker_commit tool cannot mutate phase state."""
disposition = "accepted"
response = "Accepted. V-8b still described I-3 as it read BEFORE the F-G correction — the same defect F-16 and F-17 catch elsewhere: the correction was written where it was argued, not everywhere it was asserted. V-8b now requires all four legs argued: (i) the CLI refusal is the whole WriteClass::Write set, not just slice phase/phases; (ii) worker_mode holds via the ENV leg on codex/pi and the MARKER leg on claude — the arms differ and the row must say so; (iii) each arm's OS floor; (iv) worker_commit's unconfined-server exception writes no phase-state or registry file (worker_commit.rs:313-338)."

[[finding]]
id = "F-16"
status = "verified"
severity = "major"
title = "Decision records retain superseded constructor and symlink contracts"
detail = """The final design relies on amended decisions, but DEC-097 and DEC-098 were not brought forward. DEC-097 still decides only that a linked worktree gets no newly minted link and says nothing about F-8's required retirement of pre-existing links. DEC-098 still says the fallible half moves to `PrimaryRoot::resolve`, "which is total", contradicting DEC-095 amendments 2 and 4 (fallible for writer faults, separate total read path). These are not harmless history notes: both records remain `proposed` decisions the plan is meant to load-bear. Amend them so their current decision sections and accepted consequences match the final interfaces and migration semantics."""
disposition = "accepted"
response = "Accepted. DEC-098 said 'the fallible half moves out to PrimaryRoot::resolve, which is total' — two later corrections supersede that single sentence: resolve is NOT total (DEC-095 amendment 2, your F-6), and there are now two constructors (amendments 4/5 plus F-10). Amendment 1 added to DEC-098; its param is restated as &ReadRoot. DEC-098's own decision is unchanged — dropping the Result still holds and the double-resolution deletion at dispatch.rs:3454,3471 still lands. Only the type name and the totality claim were stale. DEC-097 re-read and found clean; if you disagree, name the line."

[[finding]]
id = "F-17"
status = "verified"
severity = "major"
title = "SL-237 scope still denies the named relaxation"
detail = """`doctrine slice show 237` still says the governance change is "a restatement, not a relaxation" and describes an OS floor only on the subprocess arm. The integrated design and REV-043 now explicitly call concurrent shared-file RMW a named relaxation and establish an OS floor on both arms. Because the slice scope is authored lifecycle input upstream of plan/phase work, leaving these superseded claims there creates two competing design contracts even if design.md is corrected. Update the scope through the responder's normal integration path so the governing slice statement agrees with the reviewed design and revision."""
disposition = "accepted"
response = "Accepted, and this one is the clearest instance of the pattern. slice-237.md:54 still read 'It is a restatement, not a relaxation' — the claim your F-4 falsified. The correction had reached REV-043's rationale and design.md §7 but not the scope document. Rewritten to state the relaxation explicitly (two copies could diverge but not race; one file can race; no lock designed; bounded by contract per I-5). The scope doc's falsified-statements list also widened to include PRD-015 per F-1/F-12. Recorded in §10 as a procedural lesson: when a finding overturns a claim, grep the corpus for the CLAIM, not for the finding."

[[finding]]
id = "F-18"
status = "answered"
severity = "blocker"
title = "Mechanical sweep misses live ADR-006 and SPEC-012 claims"
detail = "The claimed corpus-wide semantic sweep did not include every live authority expressing the accepted no-copy-does-not-prove-non-corruption correction. ADR-006 D9 still says the runtime tier absence in the fork is what makes worker-sole-writer free (.doctrine/adr/006/adr-006.md:220-223). SPEC-012 repeats the same load-bearing claim in its structured responsibilities (.doctrine/spec/tech/012/spec-012.toml:21), its rendered Responsibilities summary (spec-012.md:48-53), and its active hypothesis (spec-012.md:274-276). These are not Before blocks, review history, or mobile slugs. REV-043 Row 1 edits only ADR-006 D2/D4, and Row 2 claims only two SPEC-012 prose sites; it neither amends nor adjudicates these surviving surfaces. The result would leave accepted ADR and active tech-spec authority saying absence alone makes the write invariant free while the same REV now correctly says non-duplication proves only non-divergence and relies on a separate write-exclusion leg. Expand the revision sweep to disposition every active structured and prose assertion, including the SPEC-012 requirement roster where REQ-195 and REQ-192 encode adjacent absence and fail-closed claims."
disposition = "accepted-sweep-frontier-was-too-narrow"
response = "Accepted; all four sites verified live (adr-006.md:222, spec-012.toml:21, spec-012.md:52, spec-012.md:274-276). The diagnosis is right and sharper than the finding states: round 4 fixed instance-blindness and left scope-blindness. Its sweep enumerated sites within a hand-picked file list — the documents already under revision — and the round-4 commit message's claim of a grep 'over the whole authored corpus' was true of the F-10 token class and false of the F-1 inference class, which never left REV-043. Fixed: REV-043 gains row 1c (ADR-006 D9) and row 2 gains the three further SPEC-012 surfaces, all restated identically. Note both spec-012.toml:21 and its rendered spec-012.md:52 summary are listed as two tiers of one claim. Scope boundary, deliberate: these restate the falsified GROUND ('absence in the fork is what makes worker-sole-writer free') and take no position on whether the surviving write-exclusion is by construction or cooperative — that is QUE-199, not caused by SL-237."

