[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "design §Layering table mis-attributes new-verb routing to cli.rs (undelivered); real touches are guard.rs + reconcile.rs"
detail = """Expected (design §"Layering & code impact"): `src/commands/cli.rs | route new subcommands` is a design-target. Observed: `slice conformance 190` reports cli.rs **undelivered** (no edit matched) and guard.rs + reconcile.rs **undeclared**. Root cause: the new verbs are variants of existing enums (`SliceCommand::ReconcilePhases`, `SelectorCommand::Doctor`, `WorktreeCommand::List` in slice.rs / worktree/mod.rs), so clap routing needs no cli.rs edit — the design's file attribution was wrong. The actual undeclared touches are legitimate: guard.rs adds worker-mode read/write classification for the three new verbs; reconcile.rs is a pure call-site ripple (`run_status` gained two bool params for --across-trees/--assert, reconcile.rs passes `false,false`). No misplaced logic — the status-only writer + `resolve_phase_truth`/`PhaseTruth` core are in state.rs as designed. Net: design attribution error, not an implementation defect."""
disposition = "verified"
response = 'Observation confirmed. This is a design-artifact truth correction, delegated to /reconcile as a per-slice direct edit (not a code fix). Reconciliation brief: design.md §"Layering & code impact" table — drop the `src/commands/cli.rs | route new subcommands` row (cli.rs was never needed; new verbs are variants of existing SliceCommand/WorktreeCommand enums), and add the real touches: `src/commands/guard.rs | worker-mode read/write classification for the three new verbs` and `src/reconcile.rs | run_status signature ripple (--across-trees/--assert bool params)`. No code change — implementation is correct; the design table is stale.'

