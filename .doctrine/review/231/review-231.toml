[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "design §3 places run_jail_prefix in mod.rs; implementation extracted a dedicated src/worktree/jail_prefix.rs module"
detail = """Conformance reports src/worktree/jail_prefix.rs as UNDECLARED (new file, not in any design-target selector). design.md §3 "### src/worktree/mod.rs — new command-tier consumer" describes run_jail_prefix() living in mod.rs alongside the WorktreeCommand::JailPrefix variant. The shipped code puts the WorktreeCommand variant + dispatch in mod.rs but factored run_jail_prefix and its helpers into a NEW module src/worktree/jail_prefix.rs (the RISK-1 memory's scope.paths already reference it). This is a clean structural improvement (single-responsibility module for the command tier), not a defect — but design.md §3 and its design-target selector list no longer tell the truth about where the code lives. Expected(design §3: mod.rs) vs observed(jail_prefix.rs new module + mod.rs variant only). VT unit tests (2925 green) + e2e (10 green) all pass against the real layout."""
disposition = "verified"
response = """Observation confirmed: run_jail_prefix + its helpers live in a new src/worktree/jail_prefix.rs module, not in mod.rs as design.md §3 describes. This is a clean single-responsibility improvement, not a defect — all VT (2925 unit + 10 e2e) green against the real layout, and it matches the RISK-1 memory's recorded scope.paths. Remediation is a per-slice DIRECT EDIT to design.md §3 (reconcile write surface, NOT governance): update the "### src/worktree/mod.rs — new command-tier consumer" subsection to note run_jail_prefix lives in src/worktree/jail_prefix.rs (mod.rs holds only the WorktreeCommand::JailPrefix variant + dispatch), and add jail_prefix.rs to the §3 design-target selector list so future conformance runs are clean. Routed to /reconcile via the reconciliation brief (per-slice direct edit)."""

[[finding]]
id = "F-2"
status = "verified"
severity = "nit"
title = "src/commands/guard.rs modified for jail-prefix CLI wiring, not in design-target selectors"
detail = "Conformance reports src/commands/guard.rs as UNDECLARED (M). This is the clap arg-parse surface for the new `doctrine worktree jail-prefix` subcommand (--dir/--main-root/--out/--network/--extra-rw). design.md §3 named jail.rs/mod.rs/pretooluse.rs/pi-spawn-confined.sh as the affected surface and did not enumerate the CLI arg-parse touch. Expected(design lists 4 selectors) vs observed(guard.rs also touched for arg wiring). Necessary and idiomatic wiring for a new subcommand; --help output verified to match the design's flag contract exactly (--main-root required on macOS, --out NUL sink, --extra-rw repeatable raw-shell-input realpath'd). No behavioural divergence."
disposition = "aligned"
response = "Aligned — src/commands/guard.rs is the necessary clap arg-parse wiring for the new `doctrine worktree jail-prefix` subcommand. The design named the substantive affected surface (jail.rs/mod.rs/pretooluse.rs/pi-spawn-confined.sh) and legitimately did not enumerate every CLI plumbing touch; adding a subcommand requires an arg-parse entry by construction. --help output verified to match the design's flag contract exactly. No behavioural divergence, no design correction needed. (Optionally sweep guard.rs into the §3 selector list alongside the F-1 edit for future conformance cleanliness, but not required.)"

