[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "design prescribes `mapfile -d ''` (bash-4) but macOS ships bash 3.2; shipped code correctly uses a portable `read -d ''` loop — design is now wrong"
detail = """design.md §1 (line 38: `mapfile -d '' PREFIX < "$D/.tmp/jail.argv"`), §3 (line 179), and the PHASE-03 plan objective all prescribe `mapfile -d ''` for the NUL-delimited reader. But the DARWIN arm runs on stock macOS, which ships bash 3.2.57 — `mapfile`/`readarray` are bash-4+ builtins, ABSENT on the target platform. The design's prescribed reader would fail on the very OS this slice exists to support. Shipped scripts/pi-spawn-confined.sh:87 instead uses the portable idiom `while IFS= read -r -d '' tok || [ -n "$tok" ]; do PREFIX+=("$tok"); done` (bash 3.2 AND 5 compatible), with an inline comment documenting the bash-3.2 constraint. This deviation is CORRECTNESS-PRESERVING and in fact STRICTER than the design: `--out` carries no trailing NUL (AR-1), so `mapfile -d ''` would also silently DROP the final non-NUL-terminated `env TMPDIR=<tmp>` token — the `|| [ -n "$tok" ]` clause captures it (verified live: reader yields 16 tokens including the trailing env/TMPDIR launcher; a bare mapfile would yield 15 and lose TMPDIR). User-approved deviation. Expected(design: mapfile -d '') vs observed(portable read -d '' loop). Design must be corrected to match — otherwise a future edit "restoring" mapfile would break macOS confinement."""
disposition = "verified"
response = """Observation confirmed and MATERIAL: design.md §1/§3 + PHASE-03 plan objective prescribe `mapfile -d ''`, a bash-4 builtin ABSENT on the macOS target (stock bash 3.2.57, verified on this host). The design's prescribed reader would fail on the very platform SL-185 targets. Shipped pi-spawn-confined.sh:87 correctly uses the portable `while IFS= read -r -d '' tok || [ -n "$tok" ]` loop — and it is strictly MORE correct than mapfile (captures the final non-NUL-terminated env/TMPDIR token AR-1 leaves; verified live at 16 tokens vs mapfile's would-be 15). User-approved deviation. Remediation is a per-slice DIRECT EDIT to design.md (reconcile write surface, NOT governance — the seatbelt/jail machinery is not spec-registered): correct §1 line 38 and §3 line 179 to the portable read-loop idiom with a note that macOS ships bash 3.2 (no mapfile) and that --out's missing trailing NUL requires the `|| [ -n "$tok" ]` final-token capture. This prevents a future "restore mapfile" edit from silently breaking macOS confinement. Routed to /reconcile via the reconciliation brief (per-slice direct edit)."""

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "P01–03 source-delta boundaries were unrecorded (conformance read `incomplete`); re-recorded during audit"
detail = "At audit start, `slice conformance SL-185` reported `incomplete — partial coverage`: completed phases PHASE-01/02/03 carried NO source-delta row (only PHASE-04's c413b7ec..1fdbf4fa was recorded). Cause (mem.pattern.doctrine.phase-complete-clobbers-boundary): the slice was dispatch-delivered on a Linux worktree (sleipnir); the runtime boundaries registry is gitignored .doctrine/state/ scratch that does not travel with the branch, and flipping status from the main tree does not reconstruct the true ranges. NOTE: PHASE-04's recorded range was CORRECT and non-degenerate (a real single-commit diff, reachable from main) — the user's worry that it too was clobbered did NOT hold. Recovery (evidence-prep, gitignored runtime state — within audit remit): re-recorded via `slice record-delta` mapping each phase to its dispatch-lineage commit — PHASE-01 62d094b7..8863d836, PHASE-02 e067a817..85212b2a, PHASE-03 85212b2a..27b5566a (starts = phase-commit parents on branch dispatch/185, all reachable from main). Conformance then resolved to 4 conformant / 0 undelivered / 6 undeclared. Expected(all completed phases carry rows) vs observed(P01–03 rows absent until re-recorded)."
disposition = "aligned"
response = "Aligned — resolved during audit evidence-prep. The missing P01–03 rows were an artefact of dispatch-on-sleipnir delivery + gitignored runtime boundaries registry (not a code or design defect). Re-recorded the true dispatch-lineage ranges via the sanctioned `slice record-delta` escape hatch (all commits reachable from main; PHASE-04's pre-existing row was already correct). Conformance now clean (4 conformant / 0 undelivered / 6 undeclared, all 6 dispositioned here). This is runtime-state repair within audit remit, no authored-artefact change. Captured as durable knowledge in mem.pattern.doctrine.phase-complete-clobbers-boundary (already exists)."

