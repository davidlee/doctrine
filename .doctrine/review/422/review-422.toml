status = "verified"
severity = "minor"
title = "Commit hint should use the managed ignore contract; implementation queries user gitignore"
detail = """
Expected: SL-282 locked design sec-flow Commit hint says derive paths from Touched minus the install-managed ignore contract, with no git ignore query; a path the user ignores under their own rules may remain listed and git add refuses visibly (DEC-382).
Observed: after filtering by the install contract, print_commit_hint invokes git::ignored_among and removes every untracked path ignored by the project's own rules (src/install.rs:1253-1263; src/git.rs:1040-1065). For a fresh CLAUDE.md excluded by a user .gitignore line, the hint omits a path doctrine just created, contrary to the canonical path rule. If check-ignore errors after both stamps have been written, the successful install returns an error before printing any handoff hint. Tests/e2e_install_flow.rs:454-473 explicitly lock in the divergent filtering. Either restore the specified no-query handoff or reconcile DEC-382/design with the new behavior and its failure policy.
"""
