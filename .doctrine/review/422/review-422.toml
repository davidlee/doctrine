responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-282 (a2df6d6fe..e50b1a131) against the locked design, DEC-378..385, plan.toml EX/VT, RV-421 controls, ADR-001, STD-001, STD-003. Evidence: check gate exit 0 (pre- and post-fix), verify-vt all PASS, slice conformance algebra, adversarial codex-cli pass (gpt-6-sol high). 10 findings: 7 fixed in e50b1a131, 3 design-wrong routed via the Reconciliation Brief (F-4, F-6, F-8; F-5 also carries a DEC-382 REV).
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
