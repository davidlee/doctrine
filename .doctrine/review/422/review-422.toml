Expected: SL-282 design sec-flow and PHASE-03/EX-3 require stamps only after every required leg succeeded; RV-421 F-14 specifically forbids a caught boot-wiring failure from authorizing Current.
Observed: malformed or foreign Claude hook settings produce RefreshOutcome::PrintedFallback, which leaves hooks unwritten and prints manual repair instructions (src/boot.rs:1655-1664, 3269-3275). apply_wire still pushes Ok(touched) for that harness (src/boot.rs:3434-3437); WireReport::touched only checks Err (src/boot.rs:3198-3213), so install records BootWiring Done (src/install.rs:974-989) and writes both stamps. Reproduced with a scratch git repo containing malformed .claude/settings.json and `doctrine install -y -a claude`: four "settings.json is malformed — add this hook manually" lines print, settings remains unchanged, but both installed-version and the local marker are written and no "install incomplete" line appears. The next currency read is Current even though session hooks are absent. Carry PrintedFallback/other refused wiring outcomes into a non-Done install leg while preserving boot install's soft-failure behavior; add this fixture to the RV-421 F-14 control suite.
"""
