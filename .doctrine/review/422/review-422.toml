[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "Commit hint should be shell-neutral; one-line && chain fails in nushell"
detail = """
Expected: the printed commit hint runs as-is in the user's shell, whatever it is.
Observed: the hint is one `[cd <root> &&] git add -- <paths> && git commit -m <msg> -- <paths>` line. `&&` chaining is bash/zsh syntax; nushell (the user's default shell) rejects it, so the hint cannot be pasted. It is also hard to read when the path list is long.
Fix: print one command per line (`cd <root>` when needed, then `git add -- …`, then `git commit -m … -- …`), with no shell-specific operators. Quoting must stay valid for both POSIX shells and nu (single-quoted paths only when needed).
Source: user, in session 2026-10-17.
"""
disposition = "fix-now"
response = "User-requested: one command per line, no && chaining."

