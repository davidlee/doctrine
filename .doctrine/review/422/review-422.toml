[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Edited legacy starter must be preserved; install deletes a copy edited after planning"
detail = """
Expected: SL-282 design sec-hymns says legacy removal touches only byte-identical, unedited copies and edited files are never touched.
Observed: InstallPlan::build scans and stores StarterCopy before the interactive Proceed prompt (src/install.rs:207-229, 373-378). remove_legacy_starters later deletes each stored path without comparing its current bytes (src/install.rs:1065-1085). I reproduced a pre-stamp repo with the framework role/worker starter and default sidecar: wait for Proceed?, append USER EDIT to the .md, answer y. The binary exits 0, prints "removed unedited starter", and the edited .md is gone. A concurrent agent editing between planning and removal has the same loss. Recheck identity immediately before each removal, or make the removal conditional on unchanged file identity, and add an interactive/concurrent-edit regression.
"""
disposition = "fix-now"
response = "Confirmed: remove_legacy_starters deletes stored paths without rechecking (src/install.rs:1065). Fix in this audit: re-verify byte-identity (and default/absent sidecar) immediately before each removal; skip-and-report a changed file; regression test editing between plan and removal."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Confirmed: remove_legacy_starters deletes stored paths without rechecking (src/install.rs:1065). Fix in this audit: re-verify byte-identity (and default/absent sidecar) immediately before each removal; skip-and-report a changed file; regression test editing between plan and removal."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Fixed e50b1a131: remove_legacy_starters re-runs unedited_starter per file before deletion; test legacy_removal_keeps_a_starter_edited_after_planning (red observed)."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Incomplete stamp write must preserve both versions; tracked version advances before marker failure"
detail = """
Expected: SL-282 design sec-flow and PHASE-03/EX-3 require an incomplete install to leave both stamps as they were; the local marker and tracked version must record the same successful install.
Observed: write_stamps writes doctrine.toml first (src/install.rs:1410-1417), then creates/writes the local marker (src/install.rs:1418-1423). record_version catches a later marker error and reports "version not recorded" (src/install.rs:1366-1379), with no rollback. Reproduced in a scratch git repo by making .doctrine/state/install.toml a directory: doctrine install -y exits 0 and reports "install incomplete: version stamp; version not recorded", yet doctrine.toml contains installed-version. A marker write permission or rename failure has the same effect, and the tracked team pin falsely advances. Ensure failure of either write leaves the previous tracked stamp intact, or stage/recover the two writes, and test a forced marker-write failure.
"""
disposition = "fix-now"
response = "Confirmed: write_stamps writes doctrine.toml before the marker (src/install.rs:1410-1423). Fix: write the runtime marker first, then the tracked stamp; on tracked failure restore/remove the marker so neither advances; test a forced marker failure leaves doctrine.toml untouched."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Confirmed: write_stamps writes doctrine.toml before the marker (src/install.rs:1410-1423). Fix: write the runtime marker first, then the tracked stamp; on tracked failure restore/remove the marker so neither advances; test a forced marker failure leaves doctrine.toml untouched."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Fixed e50b1a131: marker written first, restored on tracked failure; tests a_failed_marker_write_leaves_the_tracked_stamp_alone (red observed), a_failed_tracked_write_restores_the_marker."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Failed linked-worktree lookup must be disclosed; reader reports checkout not installed"
detail = """
Expected: STD-003 and SL-282 design sec-currency require a degraded linked-worktree marker lookup to be disclosed, with Unlocated when the main root cannot be found.
Observed: linked_main_root maps git query, path canonicalisation and missing output failures to None (src/install.rs:3491-3495), while a later prefix query failure silently substitutes an empty prefix (src/install.rs:3503-3508). read_install_marker maps None to StampRead::Absent and MarkerSource::Checkout (src/install.rs:3521-3533), which advisory renders as "doctrine isn't installed in this checkout" (src/install_state.rs:153-160). In a linked checkout with no local marker but a current main marker, a failed rev-parse query or common-dir canonicalisation therefore reports a false fresh-checkout condition rather than the lookup failure; for a nested project, a failed prefix query can read the wrong main-root marker. Distinguish a confirmed ordinary/non-git checkout from failed linked-worktree discovery, and disclose the latter.
"""
disposition = "fix-now"
response = "Confirmed (STD-003). Fix: distinguish confirmed non-linked checkout from failed linked-worktree discovery; failed discovery yields the Unlocated / main-not-located advisory, not Absent; prefix-query failure disclosed, not defaulted to empty."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Confirmed (STD-003). Fix: distinguish confirmed non-linked checkout from failed linked-worktree discovery; failed discovery yields the Unlocated / main-not-located advisory, not Absent; prefix-query failure disclosed, not defaulted to empty."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Fixed e50b1a131: locate_main yields Unlocated on failed discovery; test a_failed_linked_worktree_lookup_is_unlocated. Note: git unavailable now also reads Unlocated (STD-003 disclosure)."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Boot wire plan should cover per-file wiring edits; plan_wire covers imports only"
detail = """
Expected: SL-282 locked design sec-flow and PHASE-03/EX-2 split boot::wire into plan_wire (the per-file edits it would make) plus apply_wire; InstallPlan's boot-wiring plan should account for the hook/registration files as well as imports.
Observed: plan_wire only maps plan_boot_import over @-import target content (src/boot.rs:1021-1039). apply_wire separately runs install_refresh for every harness and writes hook/registration files (src/boot.rs:3217-3258), while planned_imports exposes only the import subset (src/boot.rs:3451-3463). For an existing CLAUDE.md whose import is current but stale .claude/settings.json hook, plan_wire says no edit although apply_wire rewrites the settings file. This is the narrower implementer ruling, not the locked split; either extend the plan to cover those edits or reconcile the design and PHASE-03 criterion explicitly.
"""
