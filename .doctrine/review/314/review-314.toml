[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Expected claim measurement to preserve every claim delta; observed index-positive expansion drops untracked additions and HEAD-only deletions"
detail = "Evidence: .doctrine/slice/232/design.md:211-218 constructs the claim surface only from non-empty git ls-files matches in the current index; :367-370 then gives dirty_under only that expansion, while :513-519 calls the outcome total. Probe /tmp/claude-1000/-workspace-doctrine/d1a8ae94-a2bd-4fa5-aabc-c29d486a1090/scratchpad/rv314-index-domain.Sx6PV8 produced INDEX_EXPANSION_GLOB=<src/a.rs>, UNTRACKED_ORIGINAL_GLOB=src/new.rs, UNTRACKED_EXPANDED_LITERAL=<empty>, HEAD_HAS_DELETED=.doctrine/adr/001/evidence.md, INDEX_EXPANSION_DELETED=<empty>, ORIGINAL_DELETED_DIFF_RC=1, EXPANDED_ONLY_DIFF_RC=0, with status D .doctrine/adr/001/evidence.md and ?? src/new.rs. Thus an untracked addition under a declared glob vanishes from the concrete set; worse, a tracked claim path staged for deletion vanishes from the index while the anchor leg excludes .doctrine, so both questions can pass and stamp HEAD although claim evidence is dirty. This resurrects RV-307 F-1/F-6 and violates I6 and the claimed I9 totality. T17-T19 cover only excluded corpus dirt and T25 only a modified ADR; no test covers either delta-only side."
disposition = "fix-now"
response = """
Accepted; the remedy landed in round 1 and THIS DISPOSITION IS OVERDUE — recording that first, because the lapse is the more useful half.

F-1's repair (DEC-069's measurement/reporting split, extended by DEC-080 to derived pathspecs) was written into design.md in round 1 and the prose has stood since. `review dispose` was never run. The finding therefore sat `open` with no disposition while design.md § 10, the slice's Harvest notes and a handover packet all recorded it as "answered" — three artefacts agreeing because each copied the last, and `review show` does not print the finding roll, so the divergence was invisible through the sanctioned read path. Round 4 caught it. § 10 now carries a standing instruction that the ledger is the only authority on finding state, with the grep that reads it.

On the substance, unchanged and re-affirmed: the finding was correct. An index-positive construction drops untracked additions and HEAD-only deletions, and the anchor leg excludes `.doctrine`, so both questions could pass while claim evidence was dirty. The repair is the split — measurement is built from the uid directory, the declared selectors emitted magic-prefixed, and the symlink-target closure; reporting keeps the index-first expansion (DEC-053). I9 was struck and replaced by I9-prime, which is polarised for completeness rather than soundness. T56/T57/T65/T66 cover it, with T57 asserting WHICH leg catches each of F-1a, F-1b and F-10 so a later refactor cannot silently move the coverage.

One correction since: the uid-directory base is no longer constructed from `memory_uid` (DEC-091, via F-26) — it is the directory `resolve_show` already returned. F-1's repair is unaffected; the base is simply arrived at more safely."""

[[finding]]
id = "F-2"
status = "answered"
severity = "blocker"
title = "Expected objective 3 to define a writable backward-compatible schema path; observed scope.unobservable has no producer, API, or migration contract"
detail = "Evidence: .doctrine/slice/232/design.md:284-320 defines Vec<String>, validation, and edit semantics, and T52 at :828 requires an unobservable edit via memory edit, but names no CLI/MCP field, record behavior, replacement semantics, serialization default, or corpus backfill. The current read and write surfaces are distributed: RawScope at src/memory.rs:1147-1164, Scope at :1242-1253, Draft at :1500-1526, EditFields at :3914-3952, MCP EditParams at src/mcp_server/tools.rs:1029-1068, and install/templates/memory.toml:10-18; none carries unobservable. Existing corpus documents omit it. A competent implementer must still decide whether old documents default, whether record can author it, whether edit replaces or appends, how CLI and MCP expose it, and which existing non-contributing declarations are backfilled. Those choices determine V1-V5, T49, and the persisted format, so this is not a mechanical omission: objective 3 is not executable without another design decision."
disposition = "fix-now"
response = """
Accepted and performed, not prescribed. Settled as DEC-081 and written into design.md § 5.3.

The finding was right that this was not a mechanical omission: the read path needed nothing (RawScope/Scope are tolerant serde defaults, scope_array returns empty for an absent key, and the only toml::to_string round-trips in src/memory.rs are in tests — production writes are all toml_edit), so no migration existed to design, but every write-side choice was genuinely open.

Settled: memory edit is the SOLE producer, riding the existing scope-array arm exactly — a repeatable --unobservable flag, EditFields.unobservable: Option<Vec<String>>, a has_any() arm (without it the flag alone is 'no fields given'), a fourth replace-whole-array block in apply_edit, and a mirrored field on the MCP EditParams. record does NOT author it and the embedded memory.toml template is untouched, so the key materialises only when declared and the corpus stays uniform.

Replace, not append — forced by coupling as well as uniformity: unobservable shadows paths-union-globs by exact string match, so an appending array would drift from replacing ones and V1 would fire on the residue.

The finding did not ask this and it is the sharpest thing the round turned up: the inherited arms COLLAPSE an empty Vec to None at src/memory.rs:717-727, so no scope array can be cleared from the CLI. For unobservable that is load-bearing rather than cosmetic — V2 (an entry git DOES match is a stale declaration) has deleting the entry as its only remedy, and § 5.3 measures the typical memory as declaring ONE unobservable, so the unclearable case is the mainstream case. Resolved with num_args = 0..=1, probed on clap 4: absent=None, bare=Some([]) (the clear), --unobservable a=Some([a]), repeated appends, and --unobservable a mem_x correctly yields ref=mem_x because the value count caps at 1. require_equals and a separate --clear-unobservable flag were both probed and rejected — the first gives one of four sibling flags a different call syntax, the second admits a contradictory --unobservable a --clear-unobservable input needing its own refusal rule. Residual hazard documented: a bare flag immediately before the positional eats the reference, but <REFERENCE> is the sole positional so the outcome is always a hard clap error with nothing written — never silent.

Hard constraint honoured by construction rather than by rule: ClaimSnapshot stays five fields, the new apply_edit block writes the array, and claim_snapshot never reads it, so no code path could clear the verification axis. T52 extends to the write path with a discriminating half (a --glob edit on the same fixture DOES clear).

Backfill declined, with reasons rather than as a punt. F-4's disposition already re-based T49 onto a constructed GitScratch fixture, so the test matrix no longer needs it; and § 5.3's own argument is that check-ignore is a local-state instrument, which is precisely why the boundary must be DECLARED rather than derived — a mechanical bulk backfill of the ~33 candidates is the derived judgement the field exists to refuse. Routed to the backlog, HEAD-stamped.

Also recorded and routed out of scope: the CLI-cannot-clear / MCP-can-clear asymmetry on --path-scope, --glob and --command is pre-existing and not this slice's."""

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Expected REQ-146 and REQ-155 governance routing settled before implementation; observed design defers the Revision decision to reconcile"
detail = "Evidence: the authoritative SL-232 scope says the REQ-146/REQ-155 Revision choice is settled during design and is not deferrable to close at .doctrine/slice/232/slice-232.md:232-239. The design instead leaves whether these are REV-034 rows or a second revision as a governance call for /reconcile at .doctrine/slice/232/design.md:607-618. REV-034 currently revises only REQ-147 and SPEC-007 (.doctrine/revision/034/revision-034.toml:28-36); REV-041 contains only a SPEC-007 row (.doctrine/revision/041/revision-041.toml:28-31). ADR-013 requires governance-to-work dependencies to route through a concrete Revision at .doctrine/adr/013/adr-013.md:44-49. Therefore SL-232 needs REV-034 does not authorize the two newly identified requirement changes, and implementation would begin while its normative dependency is deliberately unresolved. This violates the slice scope and ADR-013, and must be reconciled before execution rather than deferred to the reconciliation phase."
disposition = "fix-now"
response = """
Accepted and reconciled in this design round — the finding was correct on both limbs, and the remedy is performed, not prescribed.

The contradiction was real and verbatim: slice-232.md says the routing call "is settled during design, but it is not deferrable to close", while design.md § 5.6 called it "a governance call for `/reconcile`". And the governance consequence was as stated — `SL-232 needs REV-034` is authored, but REV-034's four-row payload covered only two of the changes SL-232 makes, so ADR-013's dependency did not authorise the rest.

Settled as **DEC-076**: both requirements land as **added REV-034 change rows**, on atomicity rather than tidiness. All four sites go false at the same instant — when this slice's code lands — and ADR-013 makes `revision apply` the forcing-function tying approval to the truth-write, so two revisions would mean two applies for one landing and a window where SPEC-007 asserts a mix of retired and current contracts. That is the queried-surface trap of RV-307 F-39, which is the very failure REQ-147's row exists to close. ADR-013's model favours accumulation independently: a Revision is "born as content-light pending intent", "accumulates staged deltas as it is worked", and exists to give dependents "a crisp single anchor".

Authored this round:
- **REV-034 now carries four `modify` rows** — REQ-147 (primary), SPEC-007, REQ-146, REQ-155 — added via `revision change add`, not by hand.
- Both new rows have their before/after title excerpts written into `revision-034.md`, with the measurement behind each (REQ-146: 13 of 43 scoped-and-attested memories are glob-only; REQ-155: REV-041's surface-independent discharge clause).
- REV-034's title widened from `verify`'s contract to the turnover it is; a § Scope section records why it widened and why a second revision was rejected.
- The stale `SL-230 needs REV-034` prose corrected — DEC-027 moved the edge and SL-230's `needs` is empty.
- design.md § 5.6 and slice-232.md § 5 both record the routing as settled, so scope and design agree again.

Verified: REV-034 was `proposed` / `approval=none` before amendment, so nothing frozen was rewritten; `doctrine spec validate SPEC-007` reports clean. Left deliberately: the slug still reads `verify-attests-against-a-claim-relevant-clean-tree…`, unrenamed because the id is identity and the slug is never authoritative (STD-002)."""

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Expected T49 to preserve only unaffected behavior; observed nine of its 25 rows are intentionally changed by the same design"
detail = "Evidence: .doctrine/slice/232/design.md:423-432 adds a contribution finding to every non-contributing path/glob entry, T35 at :800 pins those findings, yet T49 at :825 requires all 25 ancestor-resolvable rows to emit byte-identical findings to today. A read-only corpus join using the same merge-base --is-ancestor and ls-files probes printed ANCESTOR_RESOLVABLE_WITH_NEW_CONTRIBUTION_FINDINGS=9, including mem_019eacd4b2af7a7099792cc3e1671cc5 (.doctrine/skills/**), mem_019f367068b477d2a78d8c1d8c3dedb4 (src/**/jail/**), and seven others. Unless all nine receive an authored unobservable migration, which the design never specifies, T35 and T49 cannot both pass. This makes the stated behaviour-preservation gate impossible rather than discriminating and invalidates R-G as a regression argument."
disposition = "design-wrong"
response = """
Accepted. T49 as written cannot pass alongside T35, and the design is the defect — no code exists to be wrong.

T49 conflates two output classes. Objective 7 changes `validate` along two independent axes: (a) the *drift* findings from Checks 2/4, where the tri-state converts silent `None` into an explicit undeterminable state, and (b) the *contribution* findings, which are entirely new output that every non-contributing entry now earns (F-36's remedy, T35). Byte-identity can only be claimed over (a), and only for rows the tri-state does not touch. The nine rows codex enumerated are ancestor-resolvable — so unchanged on axis (a) — but gain new axis-(b) output, which is exactly what T35 demands.

Required amendment: restate T49 to assert byte-identity over the **Check 2 / Check 4 drift findings alone** for the ancestor-resolvable population, explicitly excluding contribution findings from its comparison set. R-G's regression argument at :750-755 leans on T49 and must be reworded with it — it currently reads as though the whole `validate` output is preserved for those rows, which is false by this design's own intent.

Second defect, not raised separately but repaired by the same edit: T49 encodes a **live-corpus absolute** ("the 25 ancestor-resolvable rows"). § 0:32-38 states that corpus figures are HEAD-stamped precisely because RV-313 F-1 caught a design-time absolute that failed to reproduce at execution through corpus growth. A test asserting "25 rows" reproduces that error inside the matrix that was rebuilt to avoid it. The model fixture is `GitScratch` (§ 9:770); express T49 against a constructed fixture population, not a count of the live corpus.

Latitude on the exact fixture shape is the author's; the direction is forced — T49 cannot assert what it currently asserts."""

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Expected R-G to describe recurring unknowns; observed unchanged allow-dirty keeps creating the state called one-time"
detail = "Evidence: the gate deliberately preserves allow_dirty as an unexcluded capture that stamps CheckoutState when dirty at .doctrine/slice/232/design.md:342-345 and :372-378. The tri-state explicitly counts 24 checkout_state_id values among the undeterminable causes at :409-415, and T48 at :824 requires those values to remain undeterminable. Nevertheless R-G at :750-755 says the 34 newly visible rows drain and are a one-time backlog. Every future verify --allow-dirty invocation on a dirty checkout creates another non-commit verified_sha that merge-base cannot resolve; it remains noisy until a later clean verification. Objective 1 makes remediation possible but neither removes nor bounds the escape hatch. The blast radius is therefore a standing operational degradation, not a one-time migration, and the risk assessment materially understates it."
disposition = "design-wrong"
response = """
Accepted. R-G's "one-time backlog that drains" is not true of the mechanism this design ships.

The reasoning is sound for the *existing* 24 `checkout_state_id` rows: objective 1 relaxes the gate, so those become cleanly re-verifiable and drain. But the design deliberately preserves `--allow-dirty` (§ 5.4:342-345, I4 at :503-504) as an unexcluded capture that stamps `CheckoutState` on a dirty tree. Every future invocation mints another non-commit `verified_sha` that `merge-base --is-ancestor` cannot resolve, and T48 at :824 requires exactly those to render undeterminable. The inflow is therefore not bounded by this slice; only the existing stock is drained.

This matters beyond wording because R-G is the argument that carries the behaviour-preservation risk for a corpus-wide seam. Calling a standing inflow a migration understates the blast radius — the precise error § 4's last principle names ("state a fix's value by what it makes impossible, not by what it fixes today") and that RV-307 F-25/F-33 punished.

Required amendment: restate R-G as a **stock-and-flow** risk. The stock (24 rows, drainable once objective 1 lands) is one-time; the flow (every subsequent `--allow-dirty` verify) is standing and unbounded by this slice. Say plainly that the design accepts a permanent undeterminable-finding inflow proportional to escape-hatch use, and either bound it (out of scope here) or route the bounding as follow-up. IMP-325 already owns discriminating the causes; it does not own bounding the inflow."""

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Expected I11 lockstep to have two-way enforcement; observed duplicated predicates and T47 catches only one divergence direction"
detail = "Evidence: current retrieve::staleness gates commit mode on paths at src/retrieve.rs:371-378, while retrieve::git_facts independently gates subprocess facts on paths at :551-570. The design admits both must widen together at .doctrine/slice/232/design.md:479-484 and I11 at :526-528, but proposes no shared predicate. T47 at :823 says only that it fails if git_facts is widened without staleness. The inverse regression is untested: if staleness widens to paths-or-globs while git_facts remains paths-only, a glob-only attested memory enters commit mode with default commits_since=None and renders Unknown. T47 still satisfies its stated commit-mode assertion, while ranking is silently wrong and I11 is violated. A bilateral Fresh/Stale discriminator or a single shared predicate is required; a comment plus this one-directional test does not enforce the invariant."
disposition = "design-wrong"
response = """
Accepted, and the remedy is forced by the design's own reasoning rather than open.

Confirmed in the tree: `retrieve::staleness` branch 1 gates on `!m.scope.paths.is_empty() && !m.anchor.verified_sha.is_empty()` (src/retrieve.rs:371-378) and `git_facts` returns `GitFacts::default()` unless the same predicate holds (src/retrieve.rs:551-570). Two literal copies of one rule. I11 at :526-528 correctly identifies that they must widen together, but a duplicated predicate plus a comment is not an invariant — it is a convention awaiting the next editor.

T47 is genuinely one-directional. It asserts a glob-only attested memory resolves in commit mode, which fails if `git_facts` alone widens. The inverse — `staleness` widened, `git_facts` not — leaves `commits_since` at its `None` default, so branch 1 returns `Staleness::Unknown` and T47's stated commit-mode assertion is still satisfied while ranking is silently wrong.

Required amendment: **extract the predicate once** and have both sites call it, exactly as D3 extracts one dirtiness primitive rather than duplicating it and D13 refuses to implement the same epistemic honesty twice. A shared `fn commit_mode_eligible(m: &Memory) -> bool` makes I11 true by construction and retires the invariant into the type system, where it costs nothing to maintain. Then restate I11 as a structural fact rather than a coordination duty, and give T47 a discriminating half that pins Fresh/Stale (not merely "commit mode"), so a `None`-defaulted Unknown cannot masquerade as a pass.

This is the same move § 5.7 makes four times over: do not ask two readers to re-derive a property; record it once at the source."""

[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "Expected symlink re-expansion to preserve the lexical guard and have a total bound; observed target-derived paths bypass step 1 and exhaustion policy is unspecified"
detail = "Evidence: .doctrine/slice/232/design.md:201-205 guards only the declared entry; step 4 at :214-216 joins index-blob target text and re-expands it while merely saying bounded and cycle-checked. Probe /tmp/claude-1000/-workspace-doctrine/d1a8ae94-a2bd-4fa5-aabc-c29d486a1090/scratchpad/rv314-symlink-target.0IbmQs created tracked symlinks with blobs /etc/hostname and ../../outside; re-expansion returned exit 128 and fatal pathspec is outside repository for both. Thus step 4 manufactures exactly the absolute-outside/root-escaping input I10 calls unreachable. The candidate silently chooses a different policy: candidate.sh:71 hard-codes depth 10 and :82-87 skips absolute, escaping, and seen targets, but the design does not adopt that policy, define cycle identity, name the bound, or say whether depth exhaustion is non-contribution, malformed, or probe error. T41 at design.md:817 tests termination but pins no bound or exhaustion outcome. This also contradicts D10 at :681-686, which says probe-aborting entries are gone and only the two gate questions refuse, while the outcome table at :451-456 still permits probe-error refusal. The constructor is not total or executable at this joint."
disposition = "design-wrong"
response = """
Accepted. Step 4 is the constructor's weakest joint and the finding is proven, not argued — a tracked symlink whose index blob reads `/etc/hostname` or `../../outside`, re-expanded per :214-216, returns `fatal: pathspec is outside repository` at exit 128.

Two distinct defects, one unambiguous and one requiring a call.

**Unambiguous, and non-negotiable:** step 1's lexical guard is written as a check on the *declared entry* (:201-205), but step 4 manufactures new pathspec inputs from index blob content — untrusted data by § 4's own principle ("scope entries are untrusted data, never syntax"; the same is true of link targets, which are arbitrary bytes an attacker or an ordinary `ln -s` can set). I10 at :520-525 claims nothing lexically ineligible is ever emitted, "total by construction rather than by enumeration". That totality is false as written: the guard runs before the only step that creates fresh candidates. **Amendment: step 1's guard is a filter applied to every path entering the emission set, declared or derived, and I10 must be restated to say so.** This also repairs I10's claim that `exit 128` is *unreachable* rather than *handled* — currently it is neither.

**Requires a call, and must be settled in the amendment:** the design says "bounded and cycle-checked" without naming the bound, the cycle identity, or the exhaustion outcome. `candidate.sh` already chose a policy (depth 10 at :71; skip absolute/escaping/seen at :82-87) which the design does not adopt or acknowledge — a probe silently legislating design is its own small heresy. Exhaustion has three lawful classifications with materially different behaviour: non-contributing (report, attest), malformed (report, attest, but never suppressible by `unobservable` per V5), or probe error (**verify refuses**, per the § 5.4 table at :451-456). Pick one and write it into the table.

Note the internal contradiction the finding surfaces: D10 at :681-686 states `verify`'s only refusals are the two gate questions, while the § 5.4 outcome table still carries a "probe errored ⇒ refuse" row. Both cannot stand. Resolving the exhaustion classification is the natural moment to reconcile them."""

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "Expected -z to make index expansion byte-safe; observed the design handles quoting but not non-UTF-8 tracked pathnames"
detail = "Evidence: .doctrine/slice/232/design.md:211-213 claims -z prevents parsed-output corruption and T55 at :831 covers only valid UTF-8. Git permits arbitrary non-NUL filename bytes. Probe /tmp/claude-1000/-workspace-doctrine/d1a8ae94-a2bd-4fa5-aabc-c29d486a1090/scratchpad/rv314-nonutf8.ghT4dJ added src/bad-FF.rs with byte FF; git ls-files -s -z returned CONTAINS_FF=True and UTF8_DECODE=error at byte 58. The proposed signature at design.md:438 is (root, entry, magic), but no byte/OsString result contract is named. Existing git plumbing accepts only &[&str] at src/git.rs:494-515 and git_bytes at :521-529 returns raw bytes only for output; therefore a concrete matched pathname cannot be fed back into the required literal pathspec through the current chokepoint without a lossy or failing conversion. I9 calls the result total at design.md:513-519, yet this legal index domain is omitted. Specify byte-preserving ownership and argv plumbing and add a discriminating invalid-UTF-8 test; core.quotePath and -z alone do not solve encoding."
disposition = "design-wrong"
response = '''
Accepted. `-z` and `core.quotePath` are two different hazards and the design closes only the first.

§ 5.2 step 3 (:211-213) correctly establishes that `-z` is required, not stylistic, because `core.quotePath=true` renders `ünï.txt` as `"\303\274n\303\257.txt"` and corrupts parsed output. That reasoning is sound and `residue.sh` (d) supports it. But `-z` solves *delimiting*, not *encoding*. Git permits any byte sequence except NUL and `/` in a pathname; the index legally contains non-UTF-8 names, as codex's probe demonstrated (a tracked `src/bad-\xFF.rs` survives `ls-files -s -z` and fails UTF-8 decode at byte 58).

The consequence is concrete and structural, not theoretical: step 4 must feed matched pathnames *back* into git as `:(literal)` pathspecs, and the existing chokepoint at src/git.rs:494-515 accepts only `&[&str]`. `git_bytes` at :521-529 returns raw bytes but takes str args. So a non-UTF-8 match cannot round-trip through the current plumbing without a lossy conversion (which would emit a *different* pathspec than the one matched — a silent claim-surface corruption) or a failure (which lands in the unclassified probe-error state F-7 also hits). I9's totality claim at :513-519 does not survive either outcome.

Required amendment: name the byte-domain contract explicitly. Either (a) declare `expand_scope_entry`'s result `Vec<OsString>`/`Vec<Vec<u8>>` and widen the argv plumbing to carry it, stating the platform assumption; or (b) declare non-UTF-8 index paths **out of the supported domain**, classify them under the malformed/probe-error taxonomy once F-7 settles it, and narrow I9's totality claim to the UTF-8 index — an honest narrowing is acceptable, a silent one is not. T55 currently pins only valid UTF-8 under `quotePath`; whichever branch is taken needs a discriminating invalid-UTF-8 test beside it.

This is the same class of defect as F-1 and F-7: a totality claim asserted over a domain narrower than git's actual one.'''

[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Expected the rebuilt test matrix to cover every normative edge and validation rule; observed E8, E9, V3, and V4 have neither tests nor exemptions"
detail = "Evidence: E8 requires a force-added ignored path to remain evidence and E9 requires checkout-dependent absolute-inside narrowing to be reported at .doctrine/slice/232/design.md:544-549. V3 requires empty/whitespace unobservable entries to be dropped and reported and V4 requires silent deduplication at :301-314. The complete retained/new matrix at :778-831 has no force-added-ignored case, no primary-vs-linked-worktree absolute case, and T51 covers V1, V2, and V5 only; T42 covers malformed claim entries, not unobservable validation, and no test covers duplicate unobservable values. No explicit reason exempts these properties. Each can regress independently: consulting ignore rules would break E8, using repository root rather than checkout root would break E9, and naive schema plumbing would break V3/V4 while all listed tests stayed green. The rewrite therefore does not provide the matrix completeness it claims."
disposition = "design-wrong"
response = """
Accepted. § 9 opens by declaring the matrix "rebuilt, not edited" (:773-776), which is a completeness claim; four normative properties fall outside it with neither a test nor a stated exemption.

Each can regress independently and silently, which is the test that matters:

- **E8** (:544-546) — a gitignored-but-tracked entry is kept, because ignore rules do not bind tracked files. Under index-first this holds by construction (`ls-files -s` lists tracked paths regardless of ignore state), which is a *reason* it is cheap to test, not a reason to skip it. An implementer who reaches for `check-ignore` — and § 5.3:322-329 shows `check-ignore` is already in this slice's vocabulary for sizing — breaks E8 with every listed test still green.
- **E9** (:547-549) — the inside/outside split is a property of the **checkout**, not the string, so a memory's claim surface narrows when verified from a linked worktree. This project runs dispatch worktrees as a normal mode, so E9 is mainstream, not exotic. Using the repository root rather than the checkout root breaks it invisibly.
- **V3 / V4** (:308-311) — T51 covers V1, V2 and V5 only. T42 covers malformed entries in `paths`/`globs`, which is a different field and a different code path. Naive schema plumbing satisfies every existing test while dropping V3's report or V4's dedup.

Required amendment: add the four cases to § 9, or record an explicit exemption with its reason in the same place the other exemptions live (E2's "by construction" and E5's "exempt by kind" are the precedent — both are stated, which is why they are acceptable).

Raised at `minor` correctly: none of these produces a false attestation, and all are cheap. They are recorded because the matrix's own framing claims a completeness it does not have, and an unstated gap in a *rebuilt* matrix is indistinguishable from an oversight in the next reader's hands."""

[[finding]]
id = "F-10"
status = "answered"
severity = "blocker"
title = "Expected fresh record-to-verify to refuse; observed dirty_under cannot see the untracked mandatory uid directory"
detail = "Evidence: the design defines dirty_under as the sole diff-index dirtiness measurement at .doctrine/slice/232/design.md:156-172, adds the uid directory directly to claim_pathspecs at :367-370, and explicitly promises a fresh untracked record refuses at :379-384 and T8 at :783. Probe /tmp/claude-1000/-workspace-doctrine/d1a8ae94-a2bd-4fa5-aabc-c29d486a1090/scratchpad/rv314-untracked-uid.DXOYDO created .doctrine/memory/items/mem_new/memory.md untracked; git diff-index --quiet HEAD -- :(literal).doctrine/memory/items/mem_new returned DIRECT_LITERAL_DIFF_INDEX_RC=0 while git ls-files --others and status both reported the file. diff-index does not enumerate untracked paths. Because the anchor leg excludes .doctrine, neither question sees this directory, so verify would attest HEAD that does not contain the prose: the exact RV-307 F-1 false stamp the rewrite claims to close. Fixing this requires an untracked-aware claim probe or a second measurement, contradicting the stated one-primitive model and I2, so implementation must not proceed on this design."
disposition = "fix-now"
response = """
Accepted; same overdue-disposition lapse as F-1 — see that response for the record-keeping half.

Substance re-affirmed: `diff-index` does not enumerate untracked paths, so a freshly recorded memory's untracked uid directory was invisible to the claim leg while the anchor leg excluded `.doctrine`. The repair is the same one F-1 forced: the measurement surface carries the uid directory and the declared selectors as raw pathspecs, and `Dirt`'s untracked leg (`ls-files --others --exclude-standard`) answers for exactly this case. DEC-070 bounds it to tracked-or-non-ignored commit-eligible evidence so the fix does not import 15,319 ignored files.

The finding's closing claim — that fixing this "contradicts the stated one-primitive model and I2" — was the one part not accepted, and it was answered rather than waved away. `observe_dirt` returns an observation, not a bool (F-11's repair), so the untracked leg is part of the ONE primitive rather than a second measurement; and I2 survives because `is_dirty()` never fingerprints the untracked set and never reaches `write_tree_with_retry`. Probed, not asserted: each leg completes with `.git/index.lock` held.

Improved since by DEC-091: the base is the directory `resolve_show` returned rather than a string built from `memory_uid`, which serves this finding better than the original repair did — `resolve_show` reads the directory from disk, so it does not require the key symlink to be tracked, which is precisely the fresh-record case F-10 is about."""

[[finding]]
id = "F-11"
status = "verified"
severity = "major"
title = "Expected D3's one-primitive decomposition to be implementable; observed `dirty_under -> bool` cannot serve `capture_with`'s CheckoutState branch, which needs three fingerprints"
detail = """
Evidence: design.md:160-165 and D3 at :667-675 specify `dirty_under(root, pathspecs) -> bool` as the single dirtiness primitive, with `capture_with(root, excludes) -> Frame` "delegating to it" and `capture(root) = capture_with(root, &[])`. I2 at :498-501 reinforces the bool return ("never computes checkout_state_id").

The real `capture()` at src/git.rs:2185-2284 does not compute one boolean. It computes THREE distinct artefacts and needs all of them downstream: (a) `diff_bytes` from `git diff HEAD --binary --no-textconv --no-ext-diff` at :2230-2233, hashed into `worktree_fp = sha256(&diff_bytes)` at :2247; (b) `untracked_fp` from `untracked_fingerprint(root)` at :2234, defaulted at :2248; (c) `index_tree` from `write_tree_with_retry` at :2244. All three feed `checkout_state_id(&index_tree, &worktree_fp, &untracked)` at :2255, and `index_tree != tree` at :2245 drives the write-tree-vs-diff-index disagreement branch at :2258-2271.

A primitive returning `bool` discards every one of them. So `capture_with` cannot delegate to `dirty_under` on the dirty path without recomputing the same three git invocations — which is either parallel implementation (the exact objection D3 itself raises against a separate `source_clean` probe, and that D13 at :694-698 raises one level up) or a silent widening of the primitive's contract that the design never states.

This is distinct from F-10: F-10 concerns *what* `dirty_under` must observe; this concerns whether the stated *decomposition* can hold at all. Note I1's guarantee survives either way (`capture` delegates to `capture_with`), so the invariant is not at risk — the defect is that § 5.1's system model and D3's rationale describe a factoring that cannot be built, and an implementer must therefore re-derive the seam. Remedy: either name a richer return type (e.g. a `Dirt { tracked: Vec<u8>, untracked: Option<String>, index_dirty: bool }` the bool is projected from) or drop the "capture_with delegates to dirty_under" claim and state the two as siblings over a shared argv builder."""
disposition = "design-wrong"
response = """
Accepted. § 5.1's system model and D3's rationale describe a factoring that cannot be built.

`capture()` (src/git.rs:2185-2284) does not compute a boolean. It computes three artefacts and consumes all of them: `diff_bytes` (:2230-2233) hashed to `worktree_fp` (:2247), `untracked_fp` (:2234, defaulted :2248), and `index_tree` from `write_tree_with_retry` (:2244) — all three feeding `checkout_state_id(...)` at :2255, with `index_tree != tree` (:2245) additionally driving the write-tree-vs-diff-index disagreement branch at :2258-2271. A `-> bool` primitive discards every one, so `capture_with` cannot delegate to `dirty_under` on the dirty path without recomputing the same invocations — the parallel implementation D3 itself rejects when dismissing the `source_clean` probe.

I1 is not at risk: `capture(root) = capture_with(root, &[])` holds by construction regardless of how the layer below is cut. The defect is that the stated decomposition is not implementable, so an implementer must silently re-derive the seam — and the seam is where F-1 and F-10 also land.

Required amendment, and it should be taken **as one edit with F-1/F-10** rather than separately: name a return type rich enough to serve both callers. The natural shape falls straight out of `capture`'s own three probes — a `Dirt { tracked: Vec<u8>, untracked: Option<String>, index_dirty: bool }` (or equivalent) that `capture_with` consumes whole and that `verify`'s claim question projects to a bool. That single change simultaneously (a) makes D3's delegation real, (b) gives F-10 its untracked leg by construction rather than as a bolt-on, and (c) preserves I2 — the projection to bool still never reaches `write_tree_with_retry`, since the index-tree computation stays in `capture_with`'s dirty branch where it already is.

If instead the two are kept as siblings over a shared argv builder, say so and drop the "delegates to it" claim from § 5.1 and D3. Either is lawful; the current text is neither."""

[[finding]]
id = "F-12"
status = "verified"
severity = "minor"
title = """Expected § 2's re-taken inventory to name every surface objective 7 touches; observed `memory_health_findings_native` is absent, and its `"{uid}: "` prefix parse is an unstated contract on the new finding strings"""
detail = """
Evidence: design.md:93-94 inventories `memory validate` Check 2 and Check 4 as the objective 7 sites, and § 5.4 at :400-415 specifies the tri-state remedy as emitting findings. The § 0 evidence base at :32-38 and § 5.6 at :598-600 both stress that the inventory was deliberately *re-taken* for this slice rather than inherited.

The inventory is incomplete. `memory_health_findings` at src/memory.rs:3508 returns `Vec<String>`, but it is consumed through `memory_health_findings_native` at src/memory.rs:3590-3600, which re-derives each finding's owning entity by string matching: `memories.iter().find(|m| msg.starts_with(&format!("{}: ", m.uid)))`, then tags it `Category::MemoryHealth`. That prefix is a load-bearing, undocumented parse contract between the two functions.

Consequence: every new finding objective 7 emits — the flat undeterminable state (DEC-055, T48), the per-entry contribution finding (F-36's remedy, T35), and the V1/V2 `unobservable` findings (T51) — must be formatted `"{uid}: …"` or it silently loses entity attribution in the doctor surface. The design specifies none of these strings' shapes, and no test in § 9 asserts the attribution survives. T48 and T35 assert the findings exist; neither asserts they resolve to an entity.

Low severity because the failure is degraded reporting, not a false attestation, and the fix is a formatting rule. Raised because § 5.6's re-taken inventory is explicitly presented as complete for `validate`, and this is the one consumer of `validate`'s findings that imposes a format obligation on them."""
disposition = "design-wrong"
response = """
Accepted. § 5.6 presents the `validate` inventory as deliberately re-taken and complete; it omits the one consumer that imposes a format obligation on the findings objective 7 adds.

`memory_health_findings` returns `Vec<String>` (src/memory.rs:3508), but it is consumed through `memory_health_findings_native` (:3590-3600), which recovers each finding's owning entity by string matching — `memories.iter().find(|m| msg.starts_with(&format!("{}: ", m.uid)))` — before tagging it `Category::MemoryHealth`. That prefix is an undocumented parse contract between the two functions, and every string Check 2 and Check 4 emit today honours it by coincidence of authorship rather than by any stated rule.

Objective 7 adds at least four new finding shapes: the flat undeterminable state (DEC-055, T48), the per-entry contribution finding (F-36's remedy, T35), and V1/V2 `unobservable` findings (T51). Any that does not lead with `"{uid}: "` silently loses entity attribution in the doctor surface — the finding still prints, but it stops resolving to a memory. T48 and T35 assert the findings *exist*; neither asserts they *attribute*.

Required amendment: add `memory_health_findings_native` to § 2's Current State table and state the `"{uid}: "` prefix as a contract the new strings inherit. Give one of T35/T48 a discriminating half asserting the emitted finding resolves to its memory — cheap, and it converts an implicit convention into something a refactor cannot quietly break.

`minor` is the right severity: degraded reporting, not a false attestation, and the fix is a formatting rule plus one assertion. Recorded because the inventory's claim to be re-taken is what makes the omission worth naming — this design is held to the standard it set for itself."""

[[finding]]
id = "F-13"
status = "verified"
severity = "minor"
title = "Expected known false-attestation boundaries to be pinned symmetrically; observed R-H earns a boundary test (T45) while the structurally identical R-E earns none"
detail = """
Evidence: design.md:736-745 records R-E — a tracked file marked `skip-worktree` or `assume-unchanged` reads `diff-index` exit 0 while modified on disk (`candidate.sh` FAL-5, recorded as a *failure*). The design states it "affects the **anchor** leg as well as the claim surface", names a detector (`git ls-files -v`), states live population 0 rows, and justifies naming it: "a slice whose purpose is closing false-attestation routes cannot leave a known one unstated."

R-H at :756-760 is the same shape: a known gap, live population 0, recovery mechanism measured (`residue.sh` (b)) and deliberately not built. R-H receives T45 at :821, whose stated purpose is to pin the boundary "as a *known boundary* so it can be neither silently closed nor silently widened."

R-E receives no test at all. The § 9 matrix at :778-831 contains no `skip-worktree` / `assume-unchanged` case on either leg. So the two risks are argued identically and treated differently, and R-E — which the design itself says is the *wider* of the two, reaching the anchor leg — is the one left unpinned. A later change that silently widens or narrows R-E's exposure has nothing to fail against, which is precisely the property T45 exists to provide.

This is not a demand to *close* R-E; tolerating it with population 0 is defensible. The finding is the asymmetry: either R-E gets a T45-equivalent boundary test, or the design states why a bit-suppressed measurement cannot be pinned the way an unresolved symlinked directory can. Note this is distinct from F-9, which concerns edge cases and validation rules (E8/E9/V3/V4) with no test *or* exemption; here the exemption reasoning exists for the twin risk and simply was not applied."""
disposition = "design-wrong"
response = """
Accepted, narrowly. The finding does not ask for R-E to be closed — tolerating it at population 0 is defensible and the design's decision to name it is correct conduct. The defect is that two risks argued identically are treated differently.

R-H (:756-760) and R-E (:736-745) have the same shape: a measured gap, live population 0, a recovery/detection mechanism identified and deliberately not built. R-H earns T45, whose stated purpose is to pin the boundary "so it can be neither silently closed nor silently widened". R-E earns nothing — § 9 contains no `skip-worktree` / `assume-unchanged` case on either leg. By the design's own account R-E is the *wider* of the two, since it "affects the **anchor** leg as well as the claim surface", so the untested one is the one with more reach.

Required amendment — either is acceptable, and the choice is the author's:

- add a T45-equivalent that sets `skip-worktree` (or `assume-unchanged`) on a claimed tracked file, modifies it on disk, and pins the current outcome as a known boundary; **or**
- state in R-E why a bit-suppressed measurement cannot be pinned the way an unresolved symlinked directory can, and let the asymmetry stand on the record with its reason.

What is not acceptable is the present state, where the reasoning that earned R-H a boundary test exists and simply was not applied to its twin. Note this is not F-9's defect: there the properties have no test *and* no exemption anywhere; here the exemption reasoning is already written for the parallel case.

Related and worth carrying into the amendment: R-E's detection mechanism (`git ls-files -v`) is named but unbuilt, and F-1/F-10's repair reopens exactly the observation-domain question R-E sits inside. If the domain repair introduces an index-bit-aware leg, R-E may narrow for free — re-examine it after that edit rather than before."""

[[finding]]
id = "F-14"
status = "verified"
severity = "minor"
title = """Expected the "81 items declare .doctrine scopes" figure to reproduce; observed 29 at HEAD 743e7fe61, an unreproducible 2.8x overstatement in the design's load-bearing justification"""
detail = """
Evidence: design.md:74-76 and the scope at slice-232.md assert "**81 items** declare `.doctrine/**` scopes", cited as the proof — alongside RV-307 F-1/F-6 — that a blanket exclusion of doctrine's own authored trees is wrong. § 1 leans on it directly: "so an ADR a memory explicitly names is claim evidence exactly as `src/` is."

Re-measured independently at HEAD `743e7fe61` over `.doctrine/memory/items/*/memory.toml`, excluding key symlinks so each memory counts once: **390 memories carrying a `[scope]` table, 440 total `scope.paths` + `scope.globs` entries, of which 35 begin with `.doctrine`, declared by 29 distinct memories.**

The 440 figure is a positive control: it matches design.md:50-52's "440 scope entries" exactly, and 390 vs its "389 tracked memories" differs by one (corpus growth). So the measurement instrument agrees with the design's own on every figure except this one. An independent count by the codex reviewer in the same session returned 30 declaring memories / 29 currently matching tracked entries — concordant with 29, not with 81.

The conclusion is unaffected: at 29 memories and 35 entries, a blanket `.doctrine` exclusion still removes real claim evidence, and RV-307 F-1's separate proof (memory items live under `.doctrine/memory/items/`) is untouched. This is a wrong number, not a wrong argument.

It is raised because of *where* it sits. § 0:32-38 commits every corpus figure to a stamped HEAD specifically because "RV-313 F-1 caught a design-time absolute that failed to reproduce at execution purely through corpus growth". This figure carries no stamp, is off by 2.8x in the direction that flatters the argument, and sits in the Design Problem — the section a reader trusts most and re-derives least. Growth cannot explain it: the corpus grew, and the figure should have risen.

Required amendment: re-measure, restate with its HEAD stamp, and add the count to a probe under `probes/` so it re-runs like every other measured claim in this document. Check whether the original 81 counted key symlinks or `.doctrine` substring matches anywhere in the record rather than scope entries — naming the miscount protects the next reader who tries to reproduce it."""
disposition = "design-wrong"
response = """
Accepted. Wrong number, sound argument — the amendment is arithmetic plus a probe, not a redesign.

Amendment: replace "81 items" with the re-measured figure at its HEAD stamp (29 memories / 35 entries at `743e7fe61`), in both design.md:74-76 and the scope. Add the count to `probes/census.py` — or a sibling — so it re-runs with every other measured claim rather than sitting as unverifiable prose. The corrected figure still carries § 1's argument: 29 memories naming `.doctrine` evidence is ample to refute a blanket exclusion, and RV-307 F-1's independent proof (memory items live at `.doctrine/memory/items/<key>/`, so the exclusion removes the memory being verified) does not depend on the count at all.

Worth recording in the amendment *why* it was wrong, since the next reader will try to reproduce it: the plausible miscounts are (a) counting key symlinks alongside canonical uid directories, which roughly doubles the population, or (b) matching the `.doctrine` substring anywhere in the record — relations, wikilinks, body text — rather than in `scope.paths`/`scope.globs`. Naming the suspected instrument error is the same discipline § 5.7 applies to the four refuted discriminators.

Note the corpus figures that DID reproduce, so the amendment does not over-correct: 440 scope entries exact, 389→390 memories (growth of one), and the 25 symlink-matching entries reconfirmed as all self-covering with zero added target coverage. The evidence base is sound; this is a single unstamped outlier in it."""

[[finding]]
id = "F-15"
status = "answered"
severity = "blocker"
title = "Expected the measurement surface to include every eligible symlink target; observed the closure is still index-conditioned, relocating F-1 one hop behind a symlink"
detail = "Evidence: design.md § 5.2's measurement surface includes 'resolved symlink targets not already covered by their originating selector' (:250), but the only specified resolver is § 5.2a step 4 (:362-364), which re-expands the joined target via `git ls-files -s`. A target absent from the index therefore never enters the surface. DEC-069 widened the pathspec domain for DECLARED entries and left the DERIVED ones index-conditioned — the same reuse-of-the-reporting-instrument error the split was authored to fix, one hop deeper. Reproduced independently on git 2.54.0 (scratch repo, HEAD carries tracked 'link -> target.txt' and tracked 'target.txt'; then 'git rm --cached target.txt' with a modified copy left on disk): index re-expansion of the blob target is EMPTY, so the surface is [:(literal)link] alone and reports tracked_bytes=0, untracked=0, index_rc=0 — all three legs clean. The control, had the target been emitted literally, reports tracked_bytes=145, index_rc=1. Same miss when the target was never tracked but is present and non-ignored. Both cases sit inside DEC-070's tracked-or-non-ignored domain and on a DEC-071-stable checkout, so neither bound excuses them. This is a false attestation, and it violates I7 (:659) and I9' (:678). Live population is 0 on this corpus (0 symlink-rooted entries, census.py), but § 5.2a's own standard is 'totality by construction, not live defect count'. Raised from the round-2 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f, reproduced by the responder before raising."
disposition = "fix-now"
response = """
Accepted in full, reproduced before disposing, and repaired in design.md § 5.2 as DEC-080.

The charge is exactly right and the framing — 'F-1 relocated one hop behind a symlink' — is the useful part. DEC-069 moved the measurement surface off the index for DECLARED entries and left DERIVED ones behind. Worse, DEC-069's own recorded consequences already said 'a matched symlink is measured itself, and its eligible target closure is measured ADDITIONALLY'; design.md simply never specified emission independent of the index. So this is a specification gap against the decision's own intent, which makes it more embarrassing rather than less.

Reproduced independently on git 2.54.0 before accepting: with HEAD carrying tracked 'link -> target.txt' and tracked 'target.txt', then 'git rm --cached target.txt' and a modified copy on disk, the index re-expansion of the blob target is EMPTY and the surface [:(literal)link] reports tracked=0 / untracked=0 / index_rc=0, while the control emitting the target literally reports tracked=145 bytes / index_rc=1.

Repair: step 4 was doing two jobs and they are separated. EMISSION — every lexically-eligible joined target is emitted immediately as :(literal)<target>, whether or not the index carries it. DISCOVERY — the index re-expansion is retained solely to find deeper mode-120000 entries and continue the walk. Contribution reporting is untouched and stays index-first per DEC-053.

The obvious objection to unconditional emission was checked rather than waved away: a :(literal) pathspec matching nothing anywhere returns rc=0 from diff HEAD, ls-files --others and diff-index alike, and does not mask a real signal emitted beside it (tracked=143 bytes, rc=1 still comes through). The over-approximation I9' licenses is inert, not merely tolerable.

The alternative the inquisitor left open for F-1 — narrow the claim, pin the boundary beside E15/R-H — was evaluated seriously and rejected on two grounds. Polarity: it concedes a DECLARED under-approximation in the invariant this round exists to establish, and lands asymmetrically, since reporting would still call such an entry contributing while measurement never probes it. Population: census.py measures 0 symlink-rooted entries, but that is 0 by accident rather than by construction — doctrine mints a slug symlink for every entity and requires it committed, and for memories the key symlink is the only ergonomic handle agents hold, so a memory scoping another memory or a slice reaches it through a link BY DEFAULT. The boundary would have been pinned directly across the idiomatic path.

Second defect found while repairing, not raised separately: § 5.2a claimed the symlink step was 'live and load-bearing for the uid directory base, reached through one of 347 key symlinks'. It is not. items/<key> is a symlink whose target IS the memory_uid field verbatim, and run_verify has already read that field, so the base is MEMORY_ITEMS_DIR/<memory_uid> by string construction. That is both simpler and survives the fresh-record case where the key symlink is itself untracked — which is F-10's own scenario. The claim is corrected in place rather than quietly dropped.

Verification: T65 (detached target) and T66 (never-tracked, present, non-ignored target), each with a discriminating half that fails if unconditional emission is dropped; T68 pins the unmatched-pathspec inertness."""

[[finding]]
id = "F-16"
status = "answered"
severity = "blocker"
title = "Expected I8 to hold for derived pathspecs as it does for declared ones; observed a committed symlink whose blob text is pathspec magic subtracts the mandatory uid directory"
detail = "Evidence: § 5.2a's constant-prefixing rule is normatively scoped 'per entry of scope.paths and scope.globs' (:347), and I8 (:666) speaks only of what a memory 'declares'. Step 4's derived targets are read from index blob content (:362-364) and the design never says they are emitted magic-prefixed. I10's lexical guard (:684) rejects empty/control-char/absolute-outside/'..'-escape shapes and ACCEPTS a relative target beginning with ':(exclude)', so RV-314 F-7's repair does not close this — the constant prefix is the mitigation, not the guard. Reproduced independently on git 2.54.0: HEAD carries a tracked symlink 'evil' whose blob content is the literal string ':(exclude)uid/**', and uid/memory.md is modified on disk. With the derived target emitted RAW alongside the mandatory ':(literal)uid' selector: tracked_bytes=0, index_rc=0 (CLEAN — false attestation). With it emitted as ':(literal):(exclude)uid/**': tracked_bytes=152, index_rc=1 (dirty, correct). This is § 5.2a's own 'Scope entries are data, not pathspec syntax' demonstration reached by the derived route. The finding and F-15 are one repair with two readings of the ambiguous text, and NEITHER reading is safe: index-conditioned emission under-measures (F-15), raw emission permits subtraction (this). T62 tests declared injection only (:1074) and does not discriminate the derived route. Raised from the round-2 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f, reproduced by the responder before raising."
disposition = "fix-now"
response = """
Accepted, reproduced, and repaired as part of DEC-080. The pairing observation is the important one: F-15 and F-16 are two readings of one ambiguous rule and NEITHER is safe, so the design had no correct interpretation available — that is a stronger charge than either finding alone and it is granted.

Reproduced independently on git 2.54.0: a tracked symlink 'evil' whose blob content is the literal string ':(exclude)uid/**', with uid/memory.md modified on disk. Emitted raw alongside the mandatory ':(literal)uid' selector: tracked=0, index_rc=0 — clean, a false attestation. Emitted as ':(literal):(exclude)uid/**': tracked=152, index_rc=1 — dirty, correct.

Granted specifically: I10's lexical guard does NOT close this, so RV-314 F-7's repair is not the mitigation. ':(exclude)uid/**' is relative, escapes nothing and carries no control character, so the guard accepts it. The constant :(literal) prefix is the sole mitigation, and the finding is right that § 5.2a scoped that rule 'per entry of scope.paths and scope.globs' while I8 spoke only of what a memory 'declares'. That scope was the defect.

Repair: I8 is restated to bind DERIVED pathspecs as well as declared ones — every string that becomes a pathspec is prefixed, whatever its source. A symlink target is author-controlled index blob content and is therefore exactly as untrusted as a scope.paths entry; it simply reaches the pathspec set by a different door. § 5.2a's 'Scope entries are data, not pathspec syntax' subsection gains the derived case explicitly, so the two routes are documented together rather than the second being left to inference.

Also granted: T62 covers the declared injection route only and does not discriminate this one. T67 is added with the raw-emission failure as its discriminating half.

Standing note for the next pass, since it is the general form of both findings: the prefix argument now has to hold over a second source of strings, and it will have to be re-made for any third. If a future round introduces another route by which an untrusted string becomes a pathspec, I8's restated form is what must be checked, not § 5.2a's rule."""

[[finding]]
id = "F-17"
status = "answered"
severity = "major"
title = "Expected the 18-state enumeration to prove total dirt detection; observed it is a content/existence projection blind to index-flag suppression, while § 5.2 and DEC-069 cite it as affirmative proof"
detail = "Evidence: § 5.2 (:236-244) asserts the HEAD x index x worktree cube has 18 states, 16 dirty, and that the three legs of Dirt detect ALL SIXTEEN, concluding 'measurement was never deficient' (:242). DEC-069's record cites the enumeration as affirmative evidence (record-069.toml:17). Eighteen is correct ONLY for the abstraction HEAD in {absent,A} x index in {absent,A,B} x worktree in {absent,A,B} = 2x3x3, two clean — a content/existence projection, not git's state space. Reproduced independently on git 2.54.0: a tracked path modified on disk under 'git update-index --assume-unchanged' reports tracked_bytes=0, untracked=0, index_rc=0; identically under '--skip-worktree'. The checkout is stable (DEC-071 cannot excuse it) and the path is tracked (DEC-070 cannot exclude it), so this is an UNDER-approximation inside I9''s stated bounds — i.e. I9' as written is false, not merely unbounded. The hazard itself is honestly recorded as R-E (:963), so nothing is newly hidden; the defect is the proof structure. Required amendment: state the enumeration as a content/existence projection rather than a totality proof; soften ':242 measurement was never deficient' to 'not deficient along the dimension F-1/F-10 failed on'; and elevate R-E to a THIRD named bound on I9' alongside DEC-070 and DEC-071, since § 5.2 says the bounds 'are not optional'. Note this blindness is inherited, not introduced — capture() has it today — which is DEC-071's own framing and should be stated the same way. F-13 already asks R-E for a boundary test; T56 must additionally be named as a projection and paired with expected-blind tests. Raised from the round-2 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f, reproduced by the responder before raising."
disposition = "fix-now"
response = """
Accepted. The finding is precise about what is wrong: nothing is newly hidden, because the hazard is already carried honestly as R-E — the defect is the PROOF STRUCTURE, and that is the right charge.

Reproduced independently on git 2.54.0: a tracked path modified on disk under 'git update-index --assume-unchanged' reports tracked_bytes=0, untracked=0, index_rc=0; identically under '--skip-worktree'. The checkout is stable so DEC-071 cannot excuse it, and the path is tracked so DEC-070 cannot exclude it. The conclusion follows and is granted without hedging: I9' as written was FALSE, not merely unbounded.

Also granted: 18 is correct only for the abstraction HEAD in {absent,A} x index in {absent,A,B} x worktree in {absent,A,B} = 2x3x3 with two clean states. That is a content/existence projection, not git's state space.

Settled as DEC-082, three changes, no mechanism change. (1) The enumeration is stated as a projection and reframed as evidence that the three legs are jointly NECESSARY rather than jointly sufficient; the decisive HEAD=A/index=B/worktree=A case still earns its keep by showing the index leg is not redundant. (2) § 5.2's 'measurement was never deficient' is narrowed to 'not deficient along the dimension F-1/F-10 failed on'. (3) R-E is PROMOTED from a § 8 risk to the THIRD named bound on I9', alongside DEC-070's evidence domain and DEC-071's temporal boundary — § 5.2 asserts the bounds are not optional, so a counterexample inside them has to become a bound rather than a footnote.

The dimensions the finding listed that the legs DO catch are recorded in § 5.2 rather than dropped, since they are the reason the projection is nearly sufficient: mode-only and file-to-symlink changes produce tracked diff bytes; empty and non-empty intent-to-add produce diff bytes and index_rc=1; unmerged stages likewise; submodules are rejected before hashing by git.rs::reject_submodules. Index-flag suppression is the sole exception, which is what makes it a clean bound rather than a ragged one.

Two remedies considered and rejected on the record. Widening the legs via 'ls-files -v' — out of scope and arguably wrong, since the flags exist precisely to tell git to stop looking and honouring them is consistent behaviour. Redefining DEC-070's domain to exclude these paths — rejected as dishonest framing: they are tracked, and DEC-070's domain is 'tracked or non-ignored', so excluding them by redefinition hides the boundary instead of declaring it.

Stated the same way DEC-071 states its window: this blindness is INHERITED, not introduced. capture() sequences the same three probes today and is equally blind, so every existing attestation already carries it.

Verification: T64 asserts both flags expected-blind on all three legs, pinning the boundary so it can be neither silently closed nor silently widened. That discharges F-13's symmetry complaint (R-E unpinned while R-H gets T45) in the same test."""

[[finding]]
id = "F-18"
status = "answered"
severity = "blocker"
title = "Expected the constructed uid base to identify the resolved memory; observed memory_uid is never bound to storage identity, so the claim surface can measure a directory the verifier never read"
detail = "Self-inflicted by the round-3 amendment (commit ab6057dc), which asserted the claim base is MEMORY_ITEMS_DIR/<memory_uid> and defended it on the LEXICAL axis only — is_uid accepts mem_ + exactly 32 lowercase hex, so the string cannot express a separator, '..', magic or empty. That defence is sound and irrelevant: the hazard is IDENTITY, not alphabet. Confirmed by inspection of src/memory.rs::resolve_show (:2351-2364): it safe_joins items_root with the reference, reads dir/memory.toml, parses it, and returns (memory, body, dir) with NO check that memory.uid == basename(dir). Memory::try_from (:1366-1396) validates the uid's SHAPE and nothing else. So a memory stored in directory A whose TOML declares an independently-valid uid B yields a claim base of items/B — a directory that need not exist — while A's body, the prose actually read and about to be attested, is measured by nothing. The external reviewer reproduced it end to end: constructed_uid spec reports tracked=0/untracked=0/index_rc=0 while the actual resolved directory reports tracked=420/index_rc=1. This is RV-314 F-16's shape through a third door, and the round-3 amendment claimed to have closed that door. Remedy: do not reconstruct identity that resolution already established — bind the parsed uid to the trusted storage identity (read_link on the key symlink yields the bare uid dir name directly, no realpath and no canonicalisation, so DEC-053 is untouched), refuse on mismatch, and treat a mismatch as a corpus-integrity finding in its own right. Verification: a test where both uids are individually valid but unequal. Raised from the round-3 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; the identity gap in resolve_show confirmed independently by the responder before raising."
disposition = "fix-now"
response = """
Accepted without qualification. This is mine — introduced by commit ab6057dc, in the round-3 amendment, in prose that claimed to have closed exactly this class. Confirmed independently before disposing: resolve_show (src/memory.rs:2351-2364) safe_joins items_root with the reference, reads dir/memory.toml, parses it, and returns (memory, body, dir) with no check that memory.uid == basename(dir); Memory::try_from (:1366-1396) validates the uid's SHAPE only.

The finding's sharpest sentence is the one to keep: 'the failure is identity binding, not lexical validation'. My defence — is_uid accepts mem_ + exactly 32 lowercase hex, so the string cannot express a separator, '..', magic or empty — is TRUE, and it defends the wrong axis. It closes F-16's door. It says nothing about whether the uid names the directory the verifier actually read.

Repair written into § 5.2: do not reconstruct identity that resolution already established — carry it. read_link on the key symlink yields the bare uid directory name directly, so no realpath and no canonicalisation is involved and DEC-053 is untouched (this resolves the memory's OWN STORAGE LOCATION, a different question from classifying a declared pathspec's shape — worth stating explicitly, since a reader will otherwise see DEC-053 creeping back). The parsed memory_uid must equal it; a mismatch is a refusal AND a corpus-integrity finding in its own right, because a memory whose TOML disagrees with its own directory is broken regardless of what verify wanted it for.

Verification: T71, with the discriminating half the finding asked for — both uids individually valid but unequal, and the base constructed from the parsed uid alone measures items/B and reads clean while A's body is modified.

Recorded in § 10 rather than just fixed, because it is the third instance of one mistake across three rounds: I9 asserted soundness where the hazard was completeness (F-1/F-10); the prefix rule was proved for declared strings where the hazard was derived ones (F-16); the uid was validated for its alphabet where the hazard was its identity (F-18). Verifying a true property that is not the load-bearing one is this design's most reliable way of stopping looking."""

[[finding]]
id = "F-19"
status = "answered"
severity = "blocker"
title = "Expected git-semantic cleanliness to imply byte equality with the attested blob; observed .gitattributes content conversion defeats all three legs inside every I9-prime bound, and a clean filter hides ARBITRARY content"
detail = "The design's three legs answer 'is git satisfied?', while I6/T24 claim 'the attested commit contains these bytes'. Those are different questions and content conversion separates them. NORMATIVE_FLAGS (src/git.rs:451-458) pin core.autocrlf, core.eol and core.fileMode so machine-local config cannot perturb the frame, but they do NOT disable repository .gitattributes, which is committed content. Reproduced independently on git 2.54.0 with the exact normative flags. (a) EOL conversion: '<path> text eol=crlf', HEAD blob 617474657374656420626f64790a (LF), worktree 617474657374656420626f64790d0a (CRLF), cmp reports NOT identical, yet tracked_bytes=0, untracked=0, index_rc=0 and 'git status' is empty. The path is tracked, non-ignored, on a stable checkout, and still watched by the index — it is outside DEC-070, DEC-071 and DEC-082 alike, so I9-prime's three bounds do not reach it and I6's byte-equality guarantee is false. (b) MATERIALLY WORSE, and a correction to the external reviewer's own acquittal: a clean filter is NOT caught. With filter.flatten.clean mapping every line to CANONICAL, HEAD blob 'CANONICAL' and worktree 'TOTALLY DIFFERENT ATTACKER CONTENT' give tracked_bytes=0, untracked=0, and diff-index --quiet --cached HEAD = 0. All three legs blind to arbitrary content. The reviewer probed 'git diff-index --quiet HEAD' (worktree form), got 1, and concluded the filter case did not reproduce the total miss — but § 5.1 specifies the third leg as 'diff-index --quiet --cached HEAD' (index-vs-HEAD), and against THAT leg the miss is total. So the divergence is not bounded to line endings and this is not a wording defect. Note for the remedy round, needing its own probe rather than adoption on sight: the non---cached form returned 1 here and still catches § 5.2's decisive HEAD=A/index=B/worktree=A case, so switching the leg may strictly dominate — but capture()'s byte-identity (I1, T59) sits downstream of that choice and must be re-measured, not assumed. The lawful alternatives are to add a raw-byte comparison between the eventual verified_sha:<uid>/memory.md blob and the body read from disk, or to abandon I6's byte-equality claim explicitly and say what verify does guarantee instead. Raised from the round-3 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; limb (a) reproduced and limb (b) discovered by the responder while checking the reviewer's acquittal."
disposition = "fix-now"
response = """
Accepted on limb (a), and limb (b) is accepted in a STRONGER form than raised — the reviewer's own acquittal of the clean-filter case was wrong, and that correction is the most consequential thing in the round.

Limb (a) reproduced independently on git 2.54.0 with the design's exact normative flags: 'text eol=crlf' gives HEAD blob 617474657374656420626f64790a and worktree 617474657374656420626f64790d0a, cmp reports NOT identical, and tracked=0 / untracked=0 / index_rc=0 with git status empty. Tracked, non-ignored, stable, index-watched — outside DEC-070, DEC-071 and DEC-082 alike. I6 was false as delivered. Granted.

Limb (b): the reviewer probed a clean filter, got diff-index --quiet HEAD = 1, and concluded the filter case 'did not produce the same total miss'. § 5.1 specifies the third leg as diff-index --quiet --cached HEAD. Re-probed against the specified leg: with filter.flatten.clean mapping every line to CANONICAL, HEAD blob 'CANONICAL' and worktree 'TOTALLY DIFFERENT ATTACKER CONTENT' give tracked=0, untracked=0, --cached=0. All three legs blind to ARBITRARY content. So the divergence is not bounded to line endings and the severity is not a wording repair.

Remedy — DEC-087, and it is smaller than the finding proposed while covering more. The reviewer's raw-byte check was scoped to verified_sha:<uid>/memory.md; that covers the memory's prose but not the declared scope entries, which are arbitrary project files carrying the identical hazard. Widening it to the whole claim surface needs the concrete-path enumeration D18 already rejected (7,670 matches for .doctrine/**) plus a hash per file. Instead: --attr-source=<empty tree> joins NORMATIVE_FLAGS, so every invocation reads attributes from an empty tree and compares raw bytes. Measured: tracked rises 0 -> 172 (filter) and 0 -> 156 (eol). This closes attribute conversion AS A CLASS rather than the two routes we happened to find. The empty-tree oid is derived per repository via git hash-object -t tree /dev/null — it is hash-algorithm dependent (4b825dc6... sha1, 6ef19b41... sha256, both measured), so a literal would be a magic string (STD-001) and wrong under sha256.

The rationale for preferring it over the leg swap, since the leg swap also works on the probed case: diff-index without --cached returns 1 here and still catches § 5.2's decisive HEAD=A/index=B/worktree=A case, but it repairs one instance rather than the class, and capture()'s byte-identity sits downstream of the leg choice. The --cached leg is therefore LEFT AS SPECIFIED — it was not wrong, only insufficient alone, and once attributes are neutralised the tracked leg catches this route.

Costs stated rather than buried. It changes what clean MEANS in a repo legitimately using attributes: under '* text eol=crlf' every file differs from its blob, so the anchor leg reads dirty near-universally and verify refuses. That is I9-prime's recoverable direction but it is the usability failure DEC-070 rejected for ignored files, and POL-002 makes a CRLF client project a real case rather than a hypothetical. Live population here is 0 — this repo has no .gitattributes at all. Mitigation is diagnostic, not behavioural: on the REFUSAL PATH ONLY the un-neutralised probe runs too, and when the two disagree the refusal names attribute conversion instead of blaming the operator's edits. Happy path pays nothing, and this lands inside objective 6's existing refusal-legibility work.

Two consequences deliberately left as obligations rather than claims: it touches capture(), so I1/T59 byte-identity is RE-RUN, not reasoned about (T74 is that demonstration, in a fixture with no .gitattributes); and checkout_state_id's inputs change in attribute-using repos so previously persisted values are not reproducible there.

New obligation this creates: a doctrine-wide git version floor that never previously existed — CON-002, git 2.40 for --attr-source. Unmet behaviour is specified rather than left open: refuse legibly, naming the requirement, NEVER degrade silently to un-neutralised probes, because an attestation that cannot guarantee byte equality is what I6 exists to prevent — the same principle as § 5.4's 'a worthless stamp is worse than an extra git commit'. Detection is a capability probe (git --attr-source=<oid> rev-parse --git-dir, non-zero means unsupported), not a parsed version string: backports and vendored builds make version arithmetic unreliable and capability is the question that matters. Measured: rc=0 supported, rc=129 with 'unknown option' on an unrecognised main-command flag.

Verification: T72 (eol), T73 (filter, arbitrary content), T74 (capture byte-identity gate), T75 (oid derived, not hardcoded, across sha1/sha256), T76 (floor unmet refuses and does not fall back), T77 (refusal names the cause). I6 is KEPT, not narrowed — it holds because the probes now read raw bytes, and only above CON-002's floor."""

[[finding]]
id = "F-20"
status = "answered"
severity = "major"
title = "Expected DEC-080's emission rule to be unconditional; observed the surface definition still restricts it by an undefined 'not already covered by their originating selector' predicate"
detail = "design.md § 5.2's surface table (:261-264) defines measurement as including symlink targets 'not already covered by their originating selector', while the DEC-080 subsection (:313-319) and DEC-080's own facet say every lexically-eligible target is emitted immediately and unconditionally. Two incompatible constructions are handed to the implementer, and no algorithm, signature or test defines 'covered'. This matters beyond tidiness: 'covered' is a classifier standing between a derived target and the measurement surface, so a false-positive answer at that seam reintroduces exactly the suppression DEC-080 was authored to remove — index-conditioned under-measurement under a new predicate. T65-T68 exercise unconditional emission and unmatched-pathspec inertness; none of them discriminates the coverage rule, so the matrix would not catch a wrong one. No executable probe is possible, which IS the finding: the predicate is unspecified. Remedy, and the design has already paid for it: T68 established that an unmatched :(literal) pathspec is inert on all three legs and does not mask a real signal, so the optimisation buys nothing measurable and should be DELETED — always emit. If it is kept instead, 'covered' must be defined as an exact shared git-semantic predicate with a discriminating test. The vestigial wording is inherited from the pre-DEC-080 draft, where emission was index-conditioned and the restriction did real work. Raised from the round-3 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f."
disposition = "fix-now"
response = """
Accepted; struck rather than defined. The finding is right that two incompatible constructions were handed to the implementer, and right about why it matters beyond tidiness: 'covered' is a classifier standing between a derived target and the measurement surface, so a false positive there reintroduces index-conditioned under-measurement under a new predicate — the precise defect DEC-080 was authored to remove.

Diagnosis accepted too: the wording is vestigial from the pre-DEC-080 draft, where emission WAS index-conditioned and the restriction did real work. It survived the rewrite in the surface table while the subsection above it was replaced.

Remedy taken is the one the finding recommends, and the design had already paid for it: T68 establishes that an unmatched :(literal) pathspec is inert on all three legs and does not mask a real signal emitted beside it, so the optimisation buys nothing measurable. The duplicate pathspec is cheaper than the classifier that would avoid it. Emission is now unconditional and 'without any further test' is stated in the rule so the restriction cannot be reintroduced by a later editor reading the old table.

No new test: the correct assertion here is the ABSENCE of a suppression path, which T65-T68 already cover between them — T65/T66 fail if emission is conditioned on anything, T68 pins the inertness that makes the unconditional form affordable. Adding a test for a deleted predicate would be testing that we did not write something."""

[[finding]]
id = "F-21"
status = "answered"
severity = "blocker"
title = "Expected --attr-source=<empty tree> to close attribute conversion as a class; observed .git/info/attributes and core.attributesFile still convert and hide arbitrary bytes"
detail = """Evidence: design.md § 5.1 and DEC-087 claim `--attr-source=<empty tree>` closes attribute conversion "as a class" rather than the two routes found. It does not. `--attr-source` replaces only the TREE attribute source; git additionally consults `.git/info/attributes` and `core.attributesFile`, and neither is affected. Reproduced independently by the responder on git 2.54.0 under the design's own NORMATIVE_FLAGS plus `--attr-source=<empty tree>`, in two fixtures whose filter was never committed: (a) `f filter=canon` in `.git/info/attributes`; (b) the same line in a file named by `core.attributesFile`. Both give `check-attr filter` = `f: filter: canon` WITH the flag applied, tracked=0, untracked=0, cached_rc=0, while HEAD blob oid 76cdaa848a00ff6df61f228dca7e21ae76707a4d differs from the raw worktree oid 17e9b17077d28907fc3b8f39146256977426a239. All three legs read clean on a tracked, non-ignored, index-watched path on a stable checkout, so DEC-070, DEC-071 and DEC-082 do not reach it and I6's byte-equality guarantee is false exactly as it was before DEC-087. The refusal-path diagnostic also fails silently here: the neutralised and un-neutralised probes AGREE, so it cannot name attribute conversion as the cause. Sharper than the general form: § 5.1's own argument for DEC-087 is that NORMATIVE_FLAGS exists so "machine-local config cannot perturb the frame" — and `core.attributesFile` is machine-local config. DEC-087 therefore leaves open precisely the category the mechanism it extends was built to close. This is the fifth instance of the standing lesson: the property verified ("committed attributes are neutralised") is true and is not the load-bearing one ("attributes are neutralised"). Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; reproduced by the responder before raising."""
disposition = "fix-now"
response = """
Accepted in full, reproduced independently, and the repair is performed rather than prescribed. Settled as DEC-089, which SUPERSEDES DEC-087; design.md § 5.1 rewritten.

The charge is exactly right, including its sharpest form: `core.attributesFile` is machine-local config, and § 5.1's own argument for DEC-087 is that `NORMATIVE_FLAGS` exists so machine-local config cannot perturb the frame. DEC-087 left open the category the mechanism it extends was built to close. Re-measured here on three fixtures, each committing a `clean` filter under a different attribute source, probed under five flag combinations (`probes/attr-sources.sh`): tree closes under `--attr-source` (0 -> 155); `core.attributesFile` is UNMOVED by `--attr-source` and closes under `-c core.attributesFile=/dev/null` (0 -> 155); `.git/info/attributes` stays 0 under every combination tested, including `--attr-source` + `attributesFile=/dev/null` + `GIT_ATTR_NOSYSTEM=1`.

The repair is stated as a PARTITION by where the mechanism lives, not as a list of routes, because a list is what F-22 refuted DEC-082 for: committed content -> `--attr-source`; machine-local config -> `-c` (including `core.fsmonitor`); system -> `GIT_ATTR_NOSYSTEM`; git-dir state -> DETECT AND REFUSE; index state -> unmeasurable (DEC-090); ignore/exclude -> deliberately out of scope, since DEC-070 already rules ignored files out of the evidence domain.

`info/attributes` cannot be neutralised, so it is refused: one read of one file at the path git reports, refusing when any line declares a conversion attribute. Patterns are NOT matched against the claim surface — that is D18's rejected enumeration — so the rule is coarse and over-refuses in I9-prime's recoverable direction. Measured and load-bearing: it is the COMMON dir, so a linked worktree inherits the main repository's file and E9's dispatch case does not escape it.

Two things the finding did not ask, found by attacking the repair before disposing it. (a) The `$XDG_CONFIG_HOME/git/attributes` default — read when `core.attributesFile` is UNSET — is a live machine-local route that `--attr-source` does not touch and `-c core.attributesFile=/dev/null` does close; a fixture that sets the key explicitly would not exercise it, so T91 is written against the unset form. (b) An ambient `GIT_ATTR_SOURCE` is NOT a residual route: measured, the explicit flag wins.

Declared unverified rather than smoothed: `GIT_ATTR_NOSYSTEM` is the one member of the set not probed. `/etc/gitattributes` does not exist in this jail and constructing it means writing to a shared `/etc`. It rests on git's documentation alone and is flagged in § 5.1 so a later round attacks it rather than inheriting it as measured."""

[[finding]]
id = "F-22"
status = "answered"
severity = "blocker"
title = "Expected DEC-082's index-flag bound to enumerate every freshness suppression; observed core.fsmonitor blinds all three legs on an unflagged tracked path"
detail = """Evidence: DEC-082 bounds I9-prime on "paths the index is still watching", enumerated as `assume-unchanged` and `skip-worktree`. That is an enumeration, not a principle: git's freshness layer has other mechanisms that make all three legs trust cached index state. Reproduced independently by the responder on git 2.54.0: with `core.fsmonitor` pointed at a hook that returns a stable token and no changed paths, priming the index with one `git status`, then replacing an 11-byte tracked file with 45 bytes of unrelated content, the three legs report tracked=0, untracked=0, cached_rc=0 and `git status --porcelain` does not list the path at all (it lists only the untracked hook directory). `git ls-files -v` shows NO non-`H` rows, so neither DEC-082 flag is set; the path is tracked, non-ignored, the checkout is stable, and the index still records the 11-byte blob d0ad87f8847db2dfbc2ce78e21056443c5b4a841 against a 45-byte worktree. `--attr-source` cannot help: git is not converting content, it is declining to read it. This is an under-approximation inside all three of I9-prime's stated bounds, i.e. I9-prime is false again, by the same shape F-17 established and DEC-082 was minted to close. `core.fsmonitor` is a mainstream performance feature, not an exotic setting, and POL-002 makes a client project using it a real case. PARTIAL NON-REPRODUCTION, recorded rather than suppressed: the reviewer also charged an index stat-cache route (equal-length content with mtime restored, under `core.trustctime=false` + `core.checkStat=minimal`). In the responder's hands that route did NOT reproduce — the tracked leg reported 101 bytes under both default and the weakened config — so that limb is fixture-sensitive and is not part of this charge. The fsmonitor limb alone carries it. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; the fsmonitor limb reproduced and the stat-cache limb refuted by the responder before raising."""
disposition = "fix-now"
response = '''
Accepted on the fsmonitor limb, which reproduced; the stat-cache limb did NOT reproduce and is excluded from the charge rather than quietly carried. Repaired across DEC-089 and DEC-090, which between them partition the freshness class.

Reproduced (`probes/freshness.sh`): fsmonitor hook returning a stable token, index primed by one `git status`, an 11-byte tracked file replaced with 47 bytes of unrelated content — tracked=0, untracked leg unaffected, `diff-index --cached` rc=0, and `git status --porcelain` does not list the path. `ls-files -v` reports `H`, so no DEC-082 flag is involved and the finding's central claim holds: DEC-082's bound was an ENUMERATION, and I9-prime was false again by the shape DEC-082 was minted to close.

The repair splits on the finding's own observation that "git is not converting content, it is declining to read it". Where the suppression is CONFIG it is neutralised like config — `-c core.fsmonitor=false`, DEC-089. Measured, and this is the load-bearing fact rather than an assumption: the neutralisation restores the tracked leg (0 -> 138) EVEN ON AN INDEX ALREADY PRIMED by an fsmonitor-enabled `git status`, and again after re-priming, so the `FSMONITOR_VALID` bits do not survive the config being off at read time. Where the suppression is INDEX STATE and no config reaches it, DEC-090 makes it a refusal: any claim-surface row whose `ls-files -v` tag is not `H` is `unmeasurable` and `verify` refuses.

That converts I9-prime from "holds within these bounds" to "holds, or the verb refuses" — a closure rather than a bound, which is what this finding charged DEC-082 with failing to be. And it costs no new git invocation: § 5.2a step 4 already runs `ls-files -s -z`, and `-s -v -z` carries the tag and the stage in one output (measured layout `<tag> <mode> <oid> <stage>\t<path>`).

PARTIAL NON-REPRODUCTION, recorded inside the finding and repeated here: the index stat-cache route (equal-length content, mtime restored, `core.trustctime=false` + `core.checkStat=minimal`) did not reproduce in the responder's hands — the tracked leg reported 101 bytes under both default and the weakened config. That limb is fixture-sensitive and forms no part of the charge or the repair.

Consequence stated rather than buried: T64 INVERTS. It asserted the two index flags are expected-blind; it now asserts the same fixtures refuse. The old assertion was pinning a defect in place, and R-E leaves the known-open list as discharged rather than carried.'''

[[finding]]
id = "F-23"
status = "answered"
severity = "blocker"
title = "Expected a global raw-byte flag to preserve existing guards; observed it turns SL-212's fail-closed custom-merge-driver refusal into fail-open"
detail = """Evidence: DEC-087 places `--attr-source=<empty tree>` in NORMATIVE_FLAGS, which `src/git.rs::run_git_env` and `src/git.rs::git_stdin` apply to EVERY git invocation (both confirmed in source: each builds `Command::new("git")` with `.args(NORMATIVE_FLAGS)`). One existing consumer is a safety guard belonging to another slice. `src/git.rs::custom_merge_driver_paths` refuses trees carrying a non-built-in `merge` gitattributes driver, because `git merge-tree`'s projection cannot reproduce one (SL-212 create/ingest guards, OQ-2, fail-closed); its doc comment states the classification is a SUPERSET so "an unknown value refuses rather than slips through". It obtains the values through `src/git.rs::check_attr_merge_z`, which routes through `git_stdin` and therefore through NORMATIVE_FLAGS. Its `BUILT_IN` allow-list at `src/git.rs` includes `unspecified`. Reproduced independently by the responder on git 2.54.0 with a committed `.gitattributes` containing `f merge=ours`: under today's NORMATIVE_FLAGS, `check-attr merge -- f` returns `f: merge: ours` (custom, refuse); with `--attr-source=<empty tree>` added it returns `f: merge: unspecified` (built-in, allow). So the proposed flag silently converts a documented fail-CLOSED guard into fail-OPEN, in a subsystem SL-232 does not otherwise touch and whose behaviour-preservation nobody is watching. This is not a wording defect: the repair cannot live indiscriminately in a global flag list. DEC-087 must either scope the flag to a command class (which reopens the split-brain objection it rejected — capture() and verify observing different trees) or choose a different raw-byte mechanism. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; reproduced by the responder before raising."""
disposition = "fix-now"
response = """
Accepted in full and reproduced. This was the finding that decided the shape of the repair, so it gets the credit: DEC-089's placement exists because of it.

Reproduced on git 2.54.0 with a committed `.gitattributes` carrying `f merge=ours` (`probes/attr-sources.sh`): under today's flags `check-attr merge -- f` returns `f: merge: ours` — custom, so `custom_merge_driver_paths` refuses; with `--attr-source=<empty tree>` it returns `f: merge: unspecified`, which is in that guard's `BUILT_IN` allow-list, so it allows. A global flag silently inverted a documented fail-CLOSED guard belonging to SL-212, in a subsystem SL-232 does not otherwise touch and whose behaviour-preservation nobody was watching.

The finding's structural point — "the repair cannot live indiscriminately in a global flag list" — is accepted, and so is its framing of the two escapes. It offered "scope to a command class (which reopens the split-brain objection)" or "choose a different mechanism". The answer taken is a third: scope to the OBSERVATION PRIMITIVE. `observe_dirt` is the single dirt measurement; `capture_with` consumes it and `capture()` delegates to `capture_with`, so capture and verify still read the same tree — the split-brain objection is correct against a command-class scope and does not reach a scope whose unit IS the one measurement. `check_attr_merge_z` routes through `git_stdin` and never through `observe_dirt`, so the guard is preserved BY CONSTRUCTION rather than by an exemption.

EX-1 survives verbatim: `run_git_env` remains the sole chokepoint applying `NORMATIVE_FLAGS`, and the neutralising flags arrive as ordinary `args` from one caller. The alternative of exempting `check_attr_merge_z` from the chokepoint was rejected — a conditional chokepoint is exactly the property EX-1 exists to deny.

New obligation created by this finding and written into § 9: T80 asserts `custom_merge_driver_paths` still refuses a `merge=ours` tree, with the discriminating half being that a globally-applied neutralisation makes it allow. That is a behaviour-preservation test for ANOTHER slice's invariant, and it belongs to this slice's gate because this slice is what could break it.

Noted in passing, and it sharpens the argument for placement rather than weakening it: DEC-087's global reach would have incidentally FIXED a sibling defect (ISS-261, `dispatch.rs` comparing a filtered worktree oid against an unfiltered tree oid) while breaking this guard. Same reach, both effects, neither intended."""

[[finding]]
id = "F-24"
status = "answered"
severity = "blocker"
title = "Expected a per-repository empty-tree oid to join a compile-time constant flag list; observed a bootstrap cycle with no specified unflagged route"
detail = """Evidence: DEC-087 says the empty-tree oid is "derived per repository" via `git hash-object -t tree /dev/null` and that the flag "joins NORMATIVE_FLAGS". Those two statements cannot both hold as written. `src/git.rs::NORMATIVE_FLAGS` is a compile-time `const &[&str]`, and `src/git.rs::run_git_env` is documented as the SINGLE chokepoint applying it (EX-1, "no second runner"); `src/git.rs::git_stdin` applies it too. A per-repository runtime value cannot be a member of a compile-time constant, and deriving it requires a git invocation that by EX-1 must itself pass through the chokepoint that needs the value. The design supplies no bootstrap exemption, no dynamic flag builder, no second runner, and no cache lifecycle. CON-002's capability probe has the identical dependency — it needs an oid before it can test `git --attr-source=<oid>`. Measured by the responder on git 2.54.0, establishing that the derivation genuinely cannot be hoisted or hardcoded: (a) run OUTSIDE any repository, `git hash-object -t tree /dev/null` returns the sha1 oid 4b825dc642cb6eb9a060e54bf8d69288fbee4904 unconditionally, so the derivation must run inside the target repo to be algorithm-correct; (b) inside a sha256 repo it returns 6ef19b41225c5369f1c104d45d8d85efa9b057b53b14b4b9b939dd74decc5321; (c) passing the sha1 oid to a sha256 repo is `fatal: bad --attr-source or GIT_ATTR_SOURCE`, exit 128 — every attribute-reading invocation dies rather than degrades, which lands in the same unclassified probe-error state RV-314 F-7 still has open; (d) a well-formed but nonexistent oid is accepted silently (exit 0), so a mis-derived value inside the right algorithm fails open rather than loudly. The choice of bootstrap route and its interaction with the one-runner rule is a design decision, not an implementation detail, and it is unmade. Independently derived by the responder and by the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f."""
disposition = "fix-now"
response = """
Accepted. The two statements genuinely cannot both hold as written, and the finding's measured (a)-(d) sequence is confirmed.

The contradiction dissolves at the placement rather than needing a bootstrap exemption. Under DEC-089 the neutralising flags are NOT members of `NORMATIVE_FLAGS`; they are extra argv contributed by one caller, `observe_dirt`'s builder. So a per-repository runtime value is an ARGUMENT, not a member of a compile-time `const`, and the category error the finding identifies stops existing. No dynamic flag builder, no second runner, no exemption to EX-1.

Nor is there a cycle. `git hash-object -t tree /dev/null` reads no attributes, so the derivation goes through the plain chokepoint with today's `NORMATIVE_FLAGS` and needs nothing it is deriving. Measured additions the finding did not have: the derivation writes NO object (loose-object count unchanged before and after), so I2's read-only property is preserved — worth stating because a naive `-w` spelling would have taken a write on the clean path.

The finding's (a)-(d) are re-derived and all four stand: outside a repository `hash-object -t tree /dev/null` returns the sha1 oid unconditionally, so the derivation must run INSIDE the target repo to be algorithm-correct; a sha256 repo yields `6ef19b41…`; passing a sha1 oid to a sha256 repo is exit 128 on every attribute-reading invocation; and a well-formed but nonexistent oid is accepted SILENTLY at exit 0, so a mis-derivation fails open. That last one is why the derivation is per-observation with no cache — there is no cache lifecycle to get wrong, and no invalidation question in the long-lived MCP server process, which was the finding's related complaint under F-25.

CON-002's capability probe shares the dependency and is answered the same way: it needs an oid first, and deriving one is unflagged, so the ordering is derive-then-probe with no circularity.

Found while checking this finding and routed out rather than absorbed: `src/git.rs::EMPTY_TREE_OID` is an EXISTING hardcoded sha1 constant used by the reservation subsystem, so the exact hazard this finding names is already live in the tree, independent of SL-232. Filed as ISS-262. It fails loudly (exit 128) rather than silently, which is why it is an issue and not a blocker."""

[[finding]]
id = "F-25"
status = "answered"
severity = "major"
title = "Expected CON-002's doctrine-wide floor to bind every caller; observed only verify refuses while retrieve::freeze silently degrades"
detail = 'Evidence: CON-002 states the git 2.40 floor is doctrine-wide "because NORMATIVE_FLAGS applies to every invocation, including capture() at record time", and that unmet behaviour is "refuse, legibly ... never degrade silently". design.md § 5.1 specifies that refusal for `verify` only, and T76 tests `verify`. The other callers of the same flag list do not share the contract, and one of them does exactly what CON-002 forbids. Confirmed in source by the responder: `src/retrieve.rs` line 532 is `let frame = crate::git::capture(root).ok();`, and its own doc comment two lines above says `capture(root).ok()` SWALLOWS the error — so below the floor `retrieve` silently produces a degraded snapshot rather than refusing. By contrast `src/memory.rs::run_verify` and `src/memory.rs` line 1817 (`run_record`) both use `capture(&root)?` and propagate, yielding a generic `CaptureError::Git` rather than the legible, requirement-naming refusal CON-002 promises. So a single constraint produces three different behaviours across three call sites: legible refusal (verify, as specified), opaque error (record), and silent degradation (retrieve). Additionally unspecified: where the capability probe runs, how often, and how it is cached and invalidated in the long-lived MCP server process. CON-002 declares a doctrine-wide obligation and design.md discharges it verb-locally; either the constraint narrows to verify or the contract has to be written for every caller. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; confirmed in source by the responder before raising.'
disposition = "fix-now"
response = """
Accepted on the facts, and the remedy is NOT the one the finding implies — stated plainly rather than silently substituted.

Confirmed in source, exactly as charged: `retrieve.rs::freeze` is `crate::git::capture(root).ok()` with its own doc comment saying it swallows the error; `memory.rs::run_verify` and `run_record` both use `capture(&root)?` and propagate a generic `CaptureError::Git`. One constraint, three behaviours.

The finding's premise partly dissolves under DEC-089: CON-002 said the floor was doctrine-wide "because NORMATIVE_FLAGS applies to every invocation", and the flags no longer join `NORMATIVE_FLAGS`. But the finding SURVIVES that move, because `capture()` still routes through `observe_dirt` and therefore still needs `--attr-source`. So it is answered on its merits, not dismissed on a technicality.

The remedy partitions callers by WHAT THEY PERSIST, not by verb: `memory verify` and `memory record` persist a claim (`verified_sha` / the born frame) and must refuse legibly, naming CON-002; `retrieve::freeze` persists nothing and DEGRADES, exactly as B18/B19 already specify. That is the half the finding got wrong. It reads retrieve's degradation as the violation ("does exactly what CON-002 forbids"), but degradation there is a SETTLED decision from another slice and it is correct: `retrieve` makes no attestation, so a thinner visibly-`Unknown` result set is not a false claim about anything, and forcing it to refuse would break B18/B19 to satisfy a constraint written about attestations. Making `retrieve` refuse would be capitulating to the letter of CON-002 against its purpose.

What WAS wrong is the part the finding buried in a subordinate clause: `record` propagating an opaque `CaptureError::Git` under a constraint that promises legibility. That is a real gap and it is now specified — T86 asserts `record` refuses legibly below the floor, with the discriminating half being that `retrieve::freeze` on the same repository degrades to `None` and does NOT refuse.

CON-002 is amended to say this rather than "doctrine-wide", which it never accurately was.

The finding's second limb — where the capability probe runs, how often, how it is cached and invalidated in the long-lived MCP server — is answered by DEC-089's derivation policy: derived once per observation, no cache, therefore no invalidation question. Accepted as a real omission and closed."""

[[finding]]
id = "F-26"
status = "answered"
severity = "major"
title = "Expected F-18's identity binding to cover every accepted reference; observed it is Key-route-only and Uid/UidPrefix have no symlink to read"
detail = """Evidence: § 5.2's F-18 repair says "read_link on the key symlink yields the bare uid directory name directly" and requires the parsed `memory_uid` to equal it. That mechanism has no object on two of the three reference routes `verify` accepts. `src/memory.rs::MemoryRef::parse` classifies a reference by shape into `Uid`, `UidPrefix` or `Key`; `src/memory.rs::resolve_show` handles all three, taking the literal name for `Uid`/`Key` and calling `resolve_uid_prefix` for `UidPrefix`, then `crate::fsutil::safe_join(items_root, name)`. `src/fsutil::safe_join` is a plain join with two rejections and performs NO canonicalisation (confirmed in source). So on the `Key` route the joined dir IS the key symlink and `read_link` works; on the `Uid` and `UidPrefix` routes the joined dir is the real uid directory and there is no symlink to read. § 5.2 never mentions the three variants and specifies no identity source for the latter two, so F-18's defect survives on both: `memory verify mem_AAAA...` where `items/mem_AAAA/memory.toml` declares an independently-valid `memory_uid = mem_BBBB...` yields a claim base of `items/mem_BBBB`, which need not exist. Under DEC-080/T68 an unmatched `:(literal)` pathspec is inert on all three legs, so the surface reads clean while `items/mem_AAAA/memory.md` — the body actually read, and the file `run_verify` then stamps via `dir.join("memory.toml")` — is measured by nothing. That is F-18's exact false attestation on the routes its repair does not reach. Note `run_verify` already binds `dir` from `resolve_show` and already load-bears on it three lines later; the identity is in hand on every route, and the design reached past it for a Key-only mechanism. This is the fourth instance of the round-2 lesson: the repair was written where the finding pointed rather than where the class lived. Corpus shape is not the defect — the responder measured 349 key symlinks, all single-component bare-uid targets, none absolute, nested or dangling; totality across accepted resolution routes is. Independently derived by the responder and by the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f."""
disposition = "fix-now"
response = """
Accepted in full, confirmed in source, and the repair DELETES the mechanism rather than extending it. Settled as DEC-091.

Confirmed independently before disposal: `MemoryRef` has exactly the three variants; `resolve_show` takes the literal name for `Uid | Key`, calls `resolve_uid_prefix` for `UidPrefix`, then `fsutil::safe_join`s — a plain join with two rejections and no canonicalisation — and returns `(Memory, String, PathBuf)`; `run_verify` destructures that `dir` and stamps `dir.join("memory.toml")`. So on `Key` the joined dir IS the symlink and `read_link` works, and on `Uid`/`UidPrefix` there is no symlink to read. F-18's repair was Key-route-only and § 5.2 never mentioned the variants.

The finding's own closing observation is the repair, and it is the right one: "run_verify already binds `dir` from resolve_show and already load-bears on it three lines later; the identity is in hand on every route, and the design reached past it." So the base is that `dir`, with one `read_link` hop when it is itself a symlink and none when it is not. The parsed `memory_uid` is NOT consulted at all — which means there is no identity to bind and no equality check to write. The directory measured and the file stamped are the same FILE by construction rather than by agreement between two derivations.

Precision the first draft of this response got wrong and is corrected here: they are the same file reached by two paths, not literally the same path value — measurement needs the git-visible uid directory because git does not traverse symlinks in pathspecs, while the stamp writes through the symlink and lands in the same file. Saying "the same value" would have been the true-but-imprecise claim this slice keeps punishing.

The alternative of extending F-18's equality check to all three routes was rejected on the record: it keeps TWO derivations of one fact plus a rule that they agree, which is the enumeration answer to a totality problem — the move § 5.2a exists to refuse.

Corpus shape RE-DERIVED rather than accepted from the finding: 349 key symlinks under `.doctrine/memory/items/`, 0 non-bare targets, 0 dangling — matching the reviewer's figure. Alongside them, 391 real uid directories, so 42 memories are reachable ONLY by the uid route. That figure is not in the finding and it strengthens it: the unreached routes are not exotic.

Consequences written: T71 is rewritten from an F-18 uid-mismatch test into a three-route test, since under DEC-091 a uid mismatch is no longer a verify-time concern at all; the mismatch remains a real corpus defect and is routed to `validate`; and § 5.2's "constructed, not resolved" subsection inverts, with its fresh-record argument surviving intact and better served."""

[[finding]]
id = "F-27"
status = "answered"
severity = "major"
title = "Expected DEC-081's MCP joint to be the published tool contract; observed it names only EditParams, leaving the advertised schema without the field"
detail = """Evidence: § 5.3's producer table names the MCP joint as "`unobservable: Option<Vec<String>>` on `EditParams` (`src/mcp_server/tools.rs`), mapped straight through like the rest". `EditParams` is not the public contract. Confirmed in source by the responder: `src/mcp_server/tools.rs::tools` publishes the JSON input schema (the `memory_edit` entry is declared there), while `EditParams` is a separate local struct defined inside `src/mcp_server/tools.rs::call_tool` and used only to deserialise the incoming arguments. They are two independent joints; `unobservable` appears in neither today (grep over the file returns nothing). Adding the field only to `EditParams` makes handler-level tests pass while MCP clients never discover the field, because it is absent from the advertised schema — the field would be writable only by a client that guessed it. T70 compares persisted TOML and therefore cannot discriminate this: it exercises the deserialiser, not the advertised contract, so its claimed CLI/MCP equivalence is non-discriminating at the actual boundary. This matters more than a missed line because § 5.3's whole argument is that `memory edit` is the SOLE producer of a declared boundary; a producer half of whose surface is undiscoverable is not a producer. Amendment: name `src/mcp_server/tools.rs::tools`'s schema entry as a distinct joint in the producer table, and give T70 a discriminating half asserting the field is present in the advertised schema. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; confirmed in source by the responder before raising."""
disposition = "fix-now"
response = """
Accepted, confirmed in source, and the amendment is written exactly as the finding asked.

Confirmed independently: `src/mcp_server/tools.rs::tools` publishes the JSON input schema (the `memory_edit` entry is declared there), while `EditParams` is a separate local struct inside `::call_tool` used only to deserialise incoming arguments. Two independent joints, and `unobservable` appears in neither today.

The finding's strongest point is not the missed line but the consequence: § 5.3's whole argument is that `memory edit` is the SOLE producer of a declared boundary, and a producer half of whose surface is undiscoverable is not a producer — a field present only in the deserialiser is writable solely by a client that guessed it. Accepted verbatim.

§ 5.3's producer table now names the two MCP joints separately — "MCP — deserialiser" (`EditParams`) and "MCP — advertised schema" (`tools()`) — rather than one row that quietly meant the smaller of the two.

T70 is accepted as non-discriminating at the actual boundary, for the reason given: it compares persisted TOML, so it exercises the deserialiser and its claimed CLI/MCP equivalence cannot see a missing schema entry. Rather than rewrite T70, a new T87 asserts the field is present in the ADVERTISED schema, with the discriminating half stated explicitly — a build wiring only `EditParams` passes T70 and fails T87. Keeping both is deliberate: T70's equivalence property is still worth holding, it just was never the property this finding is about."""

[[finding]]
id = "F-28"
status = "answered"
severity = "major"
title = "Expected a changed checkout_state_id algorithm to move its normalizer tag; observed forget.checkout.v1 would label two different computations"
detail = """Evidence: DEC-087 and § 5.1 both state as a consequence that "checkout_state_id's inputs change in attribute-using repos, so previously persisted values are not reproducible there" — and stop there. `src/git.rs::CHECKOUT_NORMALIZER` is `"forget.checkout.v1"`, and `src/git.rs::checkout_state_id`'s doc comment says the value is "Canonicalized + sha256'd under CHECKOUT_NORMALIZER so the id is config-independent and reproducible"; the tag is serialised into the hashed JSON as `"normalizer"`. The tag exists precisely to version the algorithm. DEC-087 changes an input to that algorithm without bumping it, so the same label would identify two different computations, and a persisted `checkout_state_id` carrying `forget.checkout.v1` becomes ambiguous between pre- and post-DEC-087 semantics. The design states the non-reproducibility as an accepted consequence but never reaches the mechanism that exists to make such a change legible. Amendment: bump the normalizer tag (and say what happens to values carrying the old one), or state why the tag deliberately does not move — but not silence. Note this interacts with DEC-055/IMP-325, which already own discriminating `verified_sha`'s two value kinds; a stale-normalizer value is a third distinguishable state. Live population here is 0 (this repo has no `.gitattributes`), which is why it is `major` and not a blocker. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; confirmed in source by the responder before raising."""
disposition = "fix-now"
response = """
Accepted without reservation. The design stated the consequence and stopped one step short of the mechanism that exists to make it legible, which is a fair characterisation of what happened.

`CHECKOUT_NORMALIZER` is `"forget.checkout.v1"` and is serialised into the hashed JSON as `"normalizer"`; `checkout_state_id`'s doc comment says the value is canonicalised under it "so the id is config-independent and reproducible". The tag exists precisely to version the algorithm. Changing an input to that algorithm without moving the tag would let one label identify two computations, which is the ambiguity the tag was introduced to prevent.

The tag moves to `forget.checkout.v2`, and § 5.1 now says what happens to values carrying the old one: a persisted `v1` is legible as PRE-NEUTRALISATION rather than ambiguous. The finding's own observation that this interacts with DEC-055/IMP-325 is adopted as the routing — a stale-normalizer value is a third distinguishable state alongside the two `verified_sha` value kinds IMP-325 already owns, and it goes there rather than opening new work here.

Severity accepted as `major` rather than blocker on the finding's own reasoning: live population is 0 because this repository has no `.gitattributes`.

One thing the finding did not reach, and it raises the stakes on this row rather than lowering them: the self-attack on DEC-089 found that `untracked_fingerprint` hashes untracked paths through a filter-sensitive `git hash-object`, so `checkout_state_id`'s inputs change in attribute-using repos by a SECOND route as well as the tracked leg. That strengthens the case for the version bump — there are now two independent input changes hiding behind one label — and it is repaired separately (`hash-object --no-filters`, T90)."""

[[finding]]
id = "F-29"
status = "answered"
severity = "major"
title = "Expected F-20's coverage-filter strike to be complete; observed the predicate survives in 5.4's operational claim_pathspecs definition"
detail = """Evidence: F-20's disposition says the "not already covered by their originating selector" wording was "struck rather than defined" and that "emission is now unconditional and 'without any further test' is stated in the rule so the restriction cannot be reintroduced by a later editor reading the old table". The strike was applied in one of the two places the predicate appears. design.md § 5.2's "No coverage filter" subsection records the strike; but § 5.4's operational definition still reads `claim_pathspecs` = the uid directory, plus declared entries magic-prefixed, "plus only those resolved symlink targets not already covered by their originating selector". Confirmed textually by the responder: `command grep -n 'not already covered' design.md` returns three hits — the § 5.2 subsection recording the strike, the § 10 row recording F-20 as answered, and the surviving § 5.4 row itself. The surviving copy is the worse one: § 5.4 is the row an implementer reads to BUILD the surface, so of the two mutually exclusive constructors the operational one is the unstruck one, and it reinstates exactly the undefined classifier standing between a derived target and the measurement surface that F-20 was raised to remove. Two consequences. First, the design hands an implementer two incompatible definitions, which is the state F-20 charged verbatim. Second, and worse for the record: F-20's disposition asserts a completed strike that did not happen, so the ledger's account of its own repair is false. Diagnosis is the same as F-20's own: vestigial wording surviving a rewrite in a table while the subsection above it was replaced — now for the second time, in the same document, on the same sentence. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; confirmed textually by the responder before raising."""
disposition = "fix-now"
response = """
Accepted in full, including — and especially — its second consequence, that F-20's disposition asserted a completed strike that had not happened. That is the ledger being wrong about its own repair, and it is the more serious half.

Confirmed textually before disposing, and then again after: `command grep -n 'not already covered' design.md` returned three hits — § 5.2's subsection RECORDING the strike, § 10's F-20 row, and the surviving § 5.4 operational row. The finding's diagnosis of which copy is worse is correct: § 5.4 is the row an implementer reads to BUILD the surface, so of two mutually exclusive constructors the operational one was the unstruck one.

§ 5.4's `claim_pathspecs` row now reads "plus EVERY resolved symlink target, emitted unconditionally and without any further test (DEC-080)", which restates the rule positively rather than merely deleting the clause — a bare deletion would have left the row silent on a point the other constructor is explicit about.

SWEPT FOR A THIRD COPY BEFORE DISPOSING, because the finding's own diagnosis is that this wording survives rewrites: `not already covered`, `already covered`, `covered by their originating`, and `coverage filter` all now return only the two legitimate hits — the strike record and the § 10 ledger row. No fourth constructor exists.

The general lesson is taken rather than the instance patched. A disposition that claims a completed edit is a CLAIM NEEDING A CHECK, and the check is grepping for the string you say you removed. That is now standing practice for this ledger, and it is the same discipline that caught the F-1/F-10 disposition lapse this round.

T89 records the residual honestly as a VA obligation rather than pretending a unit test can see it: the failure mode was prose divergence between two constructors in one document, and no VT reads prose. What a test CAN assert — that emission carries no coverage predicate — is stated alongside."""

[[finding]]
id = "F-30"
status = "answered"
severity = "major"
title = "Expected step 4's exhaustion classification to cover ordinary index states; observed an unmerged symlink hits an unclassified cat-file exit 128"
detail = """Evidence: RV-314 F-7 is verified with its exhaustion classification (non-contributing / malformed / probe error) still unchosen, and design.md's own § 5.2 "Sequencing" subsection calls it a prerequisite. The round-4 pass reproduced the open joint from an ordinary index state rather than from an outside-the-repo target, which is the form the design has so far reasoned about. Fixture: a tracked symlink `link` present at index stages 1, 2 and 3, each with mode 120000 (an unmerged entry — the state any conflicted merge produces). Reviewer transcript on git 2.54.0: `git ls-files -s -z -- ':(literal)link'` exits 0 and returns 165 bytes across stages 1,2,3, so § 5.2a step 4 sees a matched mode-120000 entry and proceeds; `git cat-file blob :link` then exits 128 with `fatal: path 'link' is in the index, but not at stage 0` / `hint: Did you mean ':1:link'?`. The constructor fails while deriving the target. Note the dirt gate would ultimately refuse anyway because the index leg fires (`diff-index --quiet --cached HEAD` exits 1, tracked leg 0 bytes), but that is an accident of this fixture, not the specified behaviour: the design still does not say whether such an entry is malformed, non-contributing, or a probe error, and those outcomes differ between `verify` (refusal) and `validate` (finding). It also intersects the D10-versus-§ 5.4-table contradiction the design still carries — D10 says the two gate questions are verify's only refusals while the § 5.4 outcome table retains a "probe errored ⇒ refuse" row. NOT REPRODUCED BY THE RESPONDER — accepted on the reviewer's transcript as a sharpening of an already-verified open finding rather than as a new independent charge; it should be re-run when F-7's classification is settled. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f."""
disposition = "fix-now"
response = """
Accepted as a sharpening of F-7, on the reviewer's transcript, and it closes F-7's four-round-old classification question rather than merely restating it. NOT REPRODUCED BY THE RESPONDER as an independent charge — but the mechanism WAS reproduced here in the course of building the repair, which is worth recording: an unmerged symlink shows `120000 <oid> 2` and `120000 <oid> 3` under `ls-files -s`, two `M link` rows under `ls-files -v`, and `git cat-file blob :link` exits 128 with "is in the index, but not at stage 0".

Settled as DEC-090: `unmeasurable` is a THIRD gate outcome beside clean and dirty. `verify` refuses naming the cause; `validate` emits a finding and continues per B18. Its members are the whole of F-7's classification — index tag not `H`, stage not 0, non-UTF-8, probe error.

The finding is right that the fixture's refusal is "an accident of this fixture, not the specified behaviour", and the repair does not rely on it. The unmerged entry is classified FROM THE STAGE FIELD `ls-files -s` already returns, so `cat-file`'s exit 128 is UNREACHABLE rather than handled after the fact. Ordering, not classification, and it costs nothing: `-s -v -z` combine into one invocation carrying tag, mode, oid and stage together (measured).

Classifying it as malformed was considered and rejected on a principle the design already holds: malformedness is LEXICAL, decided without reading repository state (I10/D16), and stage number is repository state. Putting it in the malformed bucket would be the derived-instrument classification DEC-020 forbids — so the third outcome is not a convenience, it is the only lawful place for this.

The finding's last limb — the D10-versus-§ 5.4-table contradiction — is resolved IN THE TABLE'S FAVOUR. D10 said "verify's only refusals are the two gate questions"; the § 5.4 outcome table never stopped carrying a "probe errored ⇒ refuse" row. D10 was under-stated and is corrected: `verify` has three refusals. § 7's D10 now says so, and states why this does not reopen DEC-020.

Re-run obligation honoured rather than deferred: the finding asked that it be re-run once F-7's classification is settled. It is settled here, and T83 pins it — classified unmeasurable from the stage field, WITHOUT `cat-file` being reached, with the discriminating half being that reaching it yields the unclassified 128."""

[[finding]]
id = "F-31"
status = "answered"
severity = "major"
title = "Expected DEC-080's unconditional emission to be reachable for every index pathname; observed non-UTF-8 targets cannot enter the string surface"
detail = '''Evidence: RV-314 F-8 is verified with its byte-domain call still open — name the domain (`OsString` plus widened argv) or narrow I9-prime to the UTF-8 index, honestly. DEC-080 raised the stakes and the design did not revisit it. Under the pre-DEC-080 reading a non-UTF-8 symlink target only had to be REPORTED; under DEC-080 every lexically-eligible joined target must be EMITTED as a `:(literal)` pathspec into the measurement surface, so a target that cannot be represented cannot be measured — which converts F-8 from a reporting-fidelity question into an I9-prime under-approximation, the polarity I9-prime exists to forbid. Reviewer fixture on git 2.54.0: a tracked filename `bad-\xff` and a tracked symlink `link` whose blob is that same byte string; `git ls-files -s -z` returns the raw bytes (`...096261642dff00...096c696e6b00`), `git cat-file blob :link` returns `6261642dff`, and `git ls-files` renders the name quoted as `"bad-\377"`. The proposed `Dirt.untracked: Vec<String>` (§ 5.1), `expand_scope_entry`'s result, and `src/git.rs::run_git_env`'s `&[&str]` argument shape cannot carry those bytes without a lossy conversion — which would emit a DIFFERENT pathspec than the one matched — or a failure, which lands in F-7's unclassified probe-error state. Both branches are exactly what F-8 named; what is new is that DEC-080 makes the emission path mandatory. NOT REPRODUCED BY THE RESPONDER — accepted on the reviewer's transcript as a sharpening of an already-verified open finding. Amendment: settle F-8's byte domain in the same edit that settles F-7's classification, and state which of the two DEC-080 assumes. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f.'''
disposition = "fix-now"
response = """
Accepted as a sharpening of F-8, on the reviewer's transcript. NOT REPRODUCED BY THE RESPONDER — recorded as such rather than dressed up.

The finding's central move is accepted and it is the reason F-8 could no longer be deferred: under DEC-080 emission is MANDATORY, so a target that cannot be represented cannot be measured, which converts F-8 from a reporting-fidelity question into an I9-prime under-approximation — the polarity I9-prime exists to forbid. That is a genuine escalation and the design had not revisited F-8 after DEC-080 raised the stakes.

Settled as DEC-090, and the answer is the horn the finding did not name. It offered two: widen the byte domain (`OsString` plus widened argv) or narrow I9-prime honestly. The third is to REFUSE: a pathname or derived target that is not valid UTF-8 is `unmeasurable`, `verify` refuses, `validate` reports. So the domain stays UTF-8 AND I9-prime is not narrowed — the case simply never reaches an attestation.

Widening argv was rejected on cost against population, on the record: it widens `run_git_env`'s signature — the single chokepoint — across every caller in the codebase, in order to MEASURE a path that `scrub_line` can then only report in escaped form anyway, for a live population of 0. Refusing is total, costs nothing, and is in I9-prime's recoverable direction. The finding's "which of the two DEC-080 assumes" is answered: neither; it assumes the emission set is representable, and the unrepresentable case is refused before emission.

This also removes the second branch the finding named — the lossy conversion that "would emit a DIFFERENT pathspec than the one matched". Under T68 such a pathspec matches nothing and is inert, so the lossy branch is a SILENT under-approximation, which is the worst of the available outcomes. T84 pins exactly that as the discriminating half.

Re-run obligation: like F-30 this was accepted on transcript, so T84 is the falsifiable artefact rather than this disposition. Flagged for round 5 as a place where the responder is relying on the reviewer's fixture."""

[[finding]]
id = "F-32"
status = "answered"
severity = "minor"
title = "Expected T69's clearing test to discriminate; observed its control is a parse error and the copied apply_edit block stamps a no-op clear"
detail = """Evidence: two defects in DEC-081's clearing story, both cheap, neither a false attestation. (1) T69's discriminating half is stated against a control that does not exist. The reviewer ran `./target/debug/doctrine memory edit <uid> --path-scope` and got rc=2, `error: a value is required for '--path-scope <PATH_SCOPE>'` — a bare sibling flag is a hard clap parse error, not the no-op T69 contrasts against. The discriminating half must be rewritten against something the CLI can actually produce. (2) Copying the sibling `apply_edit` block, as § 5.3's producer table specifies ("a fourth replace-whole-array block beside paths/globs/commands"), imports a no-op write. Confirmed in source by the responder: `src/memory.rs::apply_edit`'s `--path-scope`, `--glob` and `--command` arms each build the array and set `changed = true` unconditionally whenever the field is `Some`, with no comparison against the existing value, while the function's own doc comment promises "`updated` stamped ONCE at root if any field changed. Returns `true` iff any field changed." For the siblings the no-op is unreachable, because the CLI collapses an empty Vec to `None` before it arrives. DEC-081 deliberately REMOVES that collapse for `unobservable` (`num_args = 0..=1`, a direct pass-through, "not the `is_empty() → None` collapse the other three arms use") in order to make clearing possible — which makes a no-op clear reachable for the first time, so `--unobservable` on an already-empty array rewrites the TOML and stamps `updated` against the function's stated contract. The fix DEC-081 chose for one problem opens a behaviour the sibling arms never exposed, and T69 tests neither idempotence nor the `updated` stamp. Raised from the round-4 external codex pass on thread 019fa1a1-4834-7a60-981d-f85e9a7f572f; limb (2) confirmed in source by the responder before raising."""
disposition = "fix-now"
response = """
Accepted on both limbs; limb (2) confirmed in source by the responder, limb (1) reproduced against the dev binary.

Limb (1), reproduced: `./target/debug/doctrine memory edit <uid> --path-scope` returns `error: a value is required for '--path-scope <PATH_SCOPE>' but none was supplied`. So T69's discriminating half was written against a control that does not exist — a bare sibling flag is a hard clap parse error, not the no-op T69 contrasts against. T69's control is replaced with something the CLI can actually produce.

Limb (2), confirmed in source: `apply_edit`'s `--path-scope`, `--glob` and `--command` arms each build the array and set `changed = true` unconditionally whenever the field is `Some`, with no comparison against the existing value — while the function's own doc comment promises "`updated` stamped ONCE at root if any field changed. Returns `true` iff any field changed." The finding's reasoning about why this has never mattered is exactly right: for the siblings the no-op is UNREACHABLE, because the CLI collapses an empty `Vec` to `None` at `src/memory.rs` before it arrives.

And its sharpest observation is accepted: DEC-081 deliberately REMOVES that collapse for `unobservable` (`num_args = 0..=1`, a direct pass-through) in order to make clearing possible — which makes a no-op clear reachable for the first time. So the fix chosen for one problem opens a behaviour the sibling arms never exposed. § 5.3's producer table no longer says "a fourth replace-whole-array block beside paths/globs/commands" without qualification; it says the block compares before it writes, with the reasoning stated so an implementer copying the sibling does not undo it.

T88 covers it: `--unobservable` bare against an already-empty array is a no-op — TOML byte-identical, `updated` NOT stamped — with the discriminating half being the sibling arms' unconditional `changed = true` copied verbatim.

Severity accepted as `minor`: neither limb produces a false attestation, and both are cheap. Recorded at length anyway because the general shape — a fix for one problem making a latent defect reachable — is the kind of thing that is only visible at the moment the fix is designed."""

