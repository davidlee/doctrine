slug  = "design-review-of-sl-272"
title = "design review of SL-272"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = false

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Reviewed SL-272 design sections sec-1 through sec-6 against SL-272 scope, research, REQ-478, DEC-335, DEC-336, DEC-237, DEC-239, DEC-249, DEC-301, ISS-482, IMP-499, ISS-454 and ISS-488. Traced direct and delegated declaration routes, within-apply act ordering, change-log derivation, event rendering and bounds, replay/change-log retention, payload contract publication and the named unit/e2e verification. Raised F-1 through F-4 with file:line evidence; no source or design file was edited.
"""

