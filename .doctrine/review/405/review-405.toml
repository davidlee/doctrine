[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Finding null is still accepted through delegated proposals"
detail = """
Expected: ISS-482's refusal rejects a finding declaration with `blocking: null` on every accepted wire route, before any proposal containing it is stored.

Observed: SL-272 sec-2 changes only `declare_finding` (`run.rs:1747-1761`). A `delegation.propose` stores `declare` entries after `rehearse_proposal` (`run.rs:1194-1205`); that rehearsal calls `declare_node` only for inquiry subjects (`run.rs:1270-1289`). Its remaining `nulled_keys` check excludes `blocking` at findings (`submission.rs:831-850`). `Sparse::Null` serializes as none (`submission.rs:79-86`), so the proposal can land and persist with the finding's null silently turned into omission before `accept` returns its declarations (`run.rs:1217-1243`). The current e2e test explicitly requires this success (`tests/e2e_design_delegation.rs:728-749`).

The design must cover proposal-time refusal and replace that test. Its six design-target selectors omit `tests/e2e_design_delegation.rs`; VT-1 exercises only direct creation and cannot catch this route.
"""
disposition = "fix-now"
response = """
Verified: rehearse_proposal rehearses only inquiry subjects (run.rs:1270-1289); nulled_keys deliberately excludes blocking on the premise that a finding null reads as absent (submission.rs:835-838, RV-389 F-18) — the premise ISS-482 overturns; tests/e2e_design_delegation.rs:728-749 pins the acceptance. Repair: sec-2 covers the proposal route — refuse a finding's blocking:null at propose (extend the rehearsal or nulled_keys, whichever keeps one rule), flip the pinned delegation test, add tests/e2e_design_delegation.rs to the design-target selectors, and widen VT-1 to both routes.
 Repaired (design rev 22, sec-2/4/5): the rule moved to Batch::validate, the seam both the direct apply and rehearse_proposal cross, as Declaration::finding_blocking_null after inert_at_state; the delegation test is inverted; tests/e2e_design_delegation.rs joins the selectors; VT-1 covers both routes."""
