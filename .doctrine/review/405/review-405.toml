[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "DEC-336 invariant overclaims: a revived act can die twice with no act_recorded between"
detail = '''
Expected: the invariant SL-272 sec-3 and DEC-336 state -- 'between two deaths of a slot there is an act_recorded' -- is true, or is scoped to where it holds.

Observed: sec-6 names the revival residual (an act dead at prior whose coverage is restored becomes live again with no row) but does not reconcile it with the invariant, which it breaks. live_acts (run.rs:2120-2156) is a pure function of current fingerprints, so: r1 act A live; r2 edit a covered section -> A leaves live_acts, invalidation_rows reports act_invalidated; r3 edit it back -> A re-enters live_acts silently; r4 edit again -> A in live_acts(prior) \ live_acts(next), a second act_invalidated for the same (kind, id) with no act_recorded between. The reportable set also seeds from live_acts_before, so a displacement at r4 would report it the same way. Behaviour is pre-existing and out of scope; the defect is the claim.

Repair: qualify the invariant in sec-3 and DEC-336 ('absent revival, sec-6'), or name revival as the invariant's known exception. No code change.'''
disposition = "fix-now"
response = """
Verified: revival makes an act live with no row, so its next coverage death follows the last with no act_recorded between. Repaired (design rev 27): sec-3 states the invariant with revival as its one pre-existing exception, sec-6 connects the revival residual to that claim, and DEC-336 carries the same limit.
"""

