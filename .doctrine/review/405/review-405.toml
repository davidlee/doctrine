[[finding]]
id = "F-6"
status = "answered"
severity = "minor"
title = "node_question_changed sited in an 'update arm' declare_node no longer has"
detail = """
Expected: sec-3's emission site matches declare_node's shape.

Observed: sec-3 puts emission 'in the node-update arm of declare_node'. There is no update arm: DEC-248 made declare_node one row-producing diff over two priors (run.rs:1440-1464), and for a new node the prior is created_prior, which seeds the question from the declaration (run.rs:1414-1417). Comparing the resolved question with existing.question() on that one path already emits nothing at creation, which is how needs_added was fixed (ISS-450). An implementer who follows the text and gates on held.is_some() brings back the create/update split DEC-248 removed. Also, 'a null question clears the text, which is a change and emits the row' holds only when the held text is non-empty; the text-difference rule handles that case, but the sentence says otherwise.

Repair: site the emission on the one diff path, compared with the prior, and say no row at creation follows from created_prior's seeding. Reword the null sentence to 'clearing a non-empty question is a change'."""
disposition = "fix-now"
response = """
Verified: declare_node has one create-or-update path (run.rs:1450-1475, DEC-248); a new node's existing is seeded from its declaration, so the differs rule already emits nothing at creation. Repaired (design rev 27): sec-3 places emission on that one path with no creation branch, and the null sentence now says a null emits only when it clears a non-empty question.
"""

