[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "PHASE-06 VA-1's absolute figure does not reproduce: criterion says ~11 of 30 anchored, shipped check reports 3 of 48"
detail = "Design § 5.4 measured the memory.md pathspec at 11 of 30 anchored memories and VA-1 carries that figure. Audit re-measured on the primary tree (HEAD 46c4eac83): 3 of 48 reachable-anchored — 6.3%, not 37%. The gap is denominator drift, not a defect: the anchored corpus grew 30 -> 115 between the design measurement and execution, so the mix is not comparable, and the deviation is in the SAFE direction (fewer rows flagged). The property VA-1 was standing in for — that the check discriminates rather than saturating — is independently intact: audit reproduced the shipped memory.md form at 3 flagged vs the rejected item-directory form at 25, an 8.3x discrimination over the same 48-row denominator (slice reported 7.7x over 44). Falsifier decisively absent. But a criterion whose stated number no longer reproduces must be RE-STATED, not silently re-interpreted at read time. Note the surface: VT/VA criteria in plan.toml are immutable-append, so this is not a plan edit — the stale figure to correct is the design § 5.4 prose that VA-1 derives from."
disposition = "verified"
response = "Observation confirmed and independently reproduced by audit (3 of 48 vs the criterion's ~11 of 30; 8.3x discrimination vs the rejected form). Remediation is delegated to /reconcile and is recorded in the Reconciliation Brief as a Per-slice (direct edit) item against design.md § 5.4 — restate the measurement with its denominator and date, and record that the discrimination RATIO, not the absolute count, is the property VA-1 stands for. Explicitly NOT a plan.toml edit: VT/VA criteria are immutable-append (boot rule), so the brief names the design prose VA-1 derives from, never the criterion id."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Both staleness checks silently render 'cannot determine' as 'no drift': 67 of 115 anchored memories are exempt, capping corpus reach at ~42%"
detail = "git::commits_touching (src/git.rs:2493) guards with 'merge-base --is-ancestor since target' and returns None when the stamp is NOT an ancestor of HEAD — deliberate (comment F2: a non-ancestor 'since' would over-count a set difference, 'no over-trust'). The guard is correct. The DEFECT is at the two call sites: Check 2 (:3521) and Check 4 (:3568) both bind with 'let Some(commits_behind) = ...' followed by '&& commits_behind > 0', so None falls out of the if-chain and emits NO finding. An UNKNOWN is thus indistinguishable from a verified-clean row. Audit measured on the primary tree independently: 115 anchored, 48 reachable, 67 NON-ancestor — exactly the 67 the slice disclosed. So ~58% of the anchored corpus is silently exempt from BOTH staleness checks, capping reach at 41.7%. This is a PRE-EXISTING property of the incumbent seam (Check 2 has always had it), NOT a PHASE-06 regression — Check 4 inherits it. It is raised because no criterion in this slice states the reach limit, while § 1's closure promise reads corpus-wide. The honest fix is a tri-state at the call sites (drift / no-drift / undeterminable) rather than removing the ancestry guard, which exists for a good reason."
disposition = "follow-up"
response = "Observation confirmed and independently re-measured by audit (115 anchored / 48 reachable / 67 non-ancestor on primary HEAD 46c4eac83 — reach capped at 41.7%). Routed to owned future work as ISS-257 'Memory staleness checks render an undeterminable stamp as clean', linked to this review and originating from SL-230. follow-up is the correct route here and not an escape: the defect is PRE-EXISTING in Check 2 (SL-230 PHASE-06's Check 4 merely inherits it), so it is outside this slice's delta, and the remedy — lifting both call sites to a tri-state so 'cannot determine' stops masquerading as 'clean' — changes an incumbent seam that no SL-230 criterion governs. Not tolerated, because nothing in the corpus recorded the reach limit until now and design § 1's closure promise reads corpus-wide; the gap is real and is now owned rather than accepted. ISS-257 also records the alternative route: if SL-232's body digest (OQ-3) lands first, the issue narrows to Check 2 alone."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "MCP record silently accepts-and-ignores body_mode where the CLI refuses it with a worded error, inverting the flag's stated reason for existing"
detail = "src/memory.rs:193-197 declares --body-mode on 'record' with the comment: 'Not valid on record ... Present (not omitted) so the refusal is explicit, worded, and clap-visible', and run_record:1769 bails with a worded message whose comment reads 'refuse explicitly rather than silently ignore it'. The MCP arm does exactly what that comment forbids: RecordParams (src/mcp_server/tools.rs:941-957) has no body_mode field, and serde ignores unknown fields by default — 'deny_unknown_fields' appears 0 times in the whole file — so a client sending body_mode:'append' to memory_record gets a silent no-op and a memory whose body was written in replace mode. The asymmetry is internal, not merely CLI-vs-MCP: EditParams (:1029-1030) DOES carry body_mode, and reject_stdin_sentinel guards BOTH verbs (:960, :1034), so record is the single odd surface. Within PHASE-05 EX-1's letter, which is explicit that record gains 'body' only — so this is a parity gap, not a missed criterion. Cheap and fully specified: add body_mode to RecordParams WITHOUT adding it to input_schema, map it to RecordArgs.body_mode, and run_record's existing bail fires unchanged. Note the root cause is adapter-wide (no MCP tool rejects unknown fields), so a point-fix here does not close the class."
disposition = "fix-now"
response = "Fixed within audit scope at candidate/230/review-001 commit 18fc9961. RecordParams now accepts body_mode SOLELY to forward it to RecordArgs; input_schema still does not advertise it, so EX-1 stands unchanged (a fresh memory has no prose to append to) and run_record's existing worded bail — the single authored copy of the rule, per D-P5-3 — now fires on the MCP surface too. The code comment that caused this ('not offering the param is a stronger refusal') is corrected in place, since the reasoning error is the durable hazard: input_schema is advisory, a JSON-RPC client may send any key, and serde drops unknown fields silently. New e2e test e2e_body_mode_on_record_is_rejected. Mutation-checked against the FAITHFUL pre-fix state (field absent entirely) rather than a body_mode:None edit — the latter is rejected by -D dead-code and so would not have been a check at all, per the rule PHASE-06 sharpened; the test goes red alone with the sibling body_mode test green. check gate on the repaired tree: 4928 passed, 0 failed, zero clippy diagnostics. The adapter-wide root cause (no deny_unknown_fields anywhere in the module, so EVERY MCP tool silently swallows unknown fields) is NOT closed by this point-fix and is left unfiled pending an operator decision — see the Synthesis."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "clear_verification is infallible and tolerant where stamp_verification refuses: a hand-broken [review]/[git] table silently retains a stale attestation"
detail = "clear_verification (src/memory.rs:4025-4036) navigates with 'if let Some(table) = doc.get_mut(..).and_then(as_table_mut)' per table and returns (). A memory.toml whose [review] or [git] table is missing or is not a table is therefore SKIPPED silently: the edit succeeds, the body is written, and the stale verification_state/verified_sha survive a genuine claim change — precisely the false-stamp path § 1 promises to close. Its sibling stamp_verification refuses the same malformed file with the worded 'malformed memory at {}: missing [git].verified_sha' (:3445). The divergence is FORCED, not an oversight: run_edit step 4 sits AFTER write_body's disk write (:4288), so making the clear fallible would reintroduce exactly the mutation-on-failure that I10 forbids and that T40 pins — audit mutation-checked T40 by hoisting the body write ahead of apply_edit and confirmed it goes red ('clobbered' lands on disk). So the tolerance buys I10. Consequence worth stating rather than burying: the guarantee 'the attestation dies iff a claim field changed' holds only for well-formed TOML, and the code carries no comment saying so at the clear site. The principled fix is to validate both tables' shape BEFORE the body write (a fallible pre-flight, keeping the clear itself infallible), which preserves I10."
disposition = "tolerated"
response = "Accepted drift, with a real and forced rationale rather than a normalised one. run_edit step 4 executes AFTER write_body's disk write, so a fallible clear_verification would reintroduce mutation-on-failure — the exact defect I10 forbids and T40 pins. Audit mutation-verified T40 (hoisting the body write ahead of apply_edit turns it red with 'clobbered' on disk), so the tolerance demonstrably buys the stronger invariant. The residual is narrow: it requires a hand-corrupted [review]/[git] table, which is already outside the sanctioned path and which stamp_verification refuses on the next verify. Carried as a documented limit, not a silent one — the brief adds the missing comment at the clear site so the next reader does not re-derive the tradeoff. The principled fix (validate both tables' shape BEFORE the body write, keeping the clear infallible) is recorded for whoever revisits the write ordering."

[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "D-P5-1's rejected alternative (pre-resolved body plumbed through RecordArgs/EditFields) is the principled shape and remains available"
detail = "PHASE-05 recorded and rejected plumbing an already-resolved body through RecordArgs/EditFields so the core never touches stdin, on the grounds that it is a core-signature change made inside an adapter phase. Audit weighed it rather than inheriting it. The rejection holds for this slice: R3 requires apply_edit's existing suite stay green unchanged, and the chosen shape (a transport-level reject_stdin_sentinel at both MCP entry points, :960/:1034) keeps stdin semantics in exactly one place with no core churn. Recorded so the alternative is not re-litigated from scratch nor silently lost: the current design leaves the '-' sentinel a CLI-transport concept that the MCP arm must remember to reject at every new body-bearing verb, which is a standing (small) parity tax — the same tax F-3 just came due on. If a third body-bearing surface appears, prefer the pre-resolved-body shape over a third sentinel guard."
disposition = "aligned"
response = "Alternative weighed on its merits and the original rejection upheld. R3 forbids widening apply_edit's signature (its existing suite must stay green unchanged), and the shipped shape confines stdin semantics to one transport-level guard applied uniformly at both MCP entry points. No change needed in this slice. Recorded so the option is neither re-litigated nor lost; the standing parity tax it predicted is precisely what F-3 came due on, which is the trigger to prefer it if a third body-bearing surface appears."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "SPEC-007's explicit-state guarantee names 'non-ancestor anchor' by name, and memory validate's staleness checks do not honour it"
detail = "Found by audit reading the governing spec, not from any slice disclosure. SPEC-007 § 'Git-anchored staleness' (.doctrine/spec/tech/007/spec-007.md:106-116) states: 'Every undecidable reachability case (shallow/partial clone, detached HEAD, rebase, NON-ANCESTOR ANCHOR, non-git project) resolves to an *explicit* state — fresh / stale / unknown / unanchored / reference — never a silent hide or a silent over-trust.' The non-ancestor anchor is named explicitly. memory_health_findings Check 2 and Check 4 do exactly the forbidden thing: a non-ancestor verified_sha yields commits_touching == None, which falls out of the let-chain and produces NO output — a silent hide, on 67 of 115 anchored memories (F-2). The product ALREADY honours the guarantee on the sibling path: src/coverage.rs:150-166 defines IsStale{Fresh,Stale,Unknown} with the documented seam contract 'None => Unknown', consuming the SAME commits_touching seam, and coverage_scan degrades cells to Unknown rather than dropping them. So the correct shape exists one module away and validate simply does not use it. Two honest readings, and reconcile must pick one rather than leave the tension: (a) the guarantee is scoped to the find/retrieve staleness axis and validate's health checks are a different surface — then SPEC-007 should SAY so, because it currently reads unqualified; or (b) it binds any git-anchored staleness computation — then validate is non-conformant and ISS-257 is the conformance fix, not merely an improvement. Audit's reading is (b): the sentence is unqualified, names the exact failing case, and states a safety posture ('never a silent over-trust') that is surface-independent by nature. Pre-existing in Check 2; SL-230 PHASE-06 inherited it into Check 4. Routes to a REV against SPEC-007, which is reconcile's surface, not audit's."
disposition = "verified"
response = "Observation confirmed against the spec text and the sibling implementation; both citations re-read at audit. Remediation is a GOVERNANCE write and therefore reconcile's, not audit's — recorded in the Reconciliation Brief under Governance/spec (REV) as a REV against SPEC-007 § 'Git-anchored staleness'. Audit does NOT settle which of the two readings wins: that is exactly the adjudication a REV exists to carry, and settling it here would let an audit disposition stand in for a governance decision. The brief states audit's reading (b — the guarantee binds any git-anchored staleness computation, so validate is non-conformant and ISS-257 is its conformance fix) as a recommendation with its reasoning, and names reading (a — scope the sentence to find/retrieve) as the alternative the REV may take instead, in which case the spec sentence gains the qualifier and ISS-257 drops from conformance fix to improvement. Deliberately NOT dispositioned design-wrong or follow-up: audit must not route a spec item through either (the audit lens forbids it), and the finding is not tolerated because a silent-over-trust posture violation is precisely what the spec sentence exists to prevent. Not a blocker: pre-existing in Check 2, inherited rather than introduced by SL-230, and no SL-230 criterion is falsified by it."

