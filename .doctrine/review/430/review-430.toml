id    = 430
slug  = "code-review-review-of-imp-526"
title = "code-review review of IMP-526"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "code-review"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "opus-reviewer"
responder = "agent"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Examined commit aea84237e (IMP-526) against DEC-421, DEC-302, SL-264/RV-386 and SL-266/DEC-310: every hunk in src/design_run/{attestation,gate,inquiry,mod,run,config}.rs, render/tree.rs, src/commands/design.rs relay call sites (apply_lines, start, adopt's adoption_lines), install/design-prompts/inquiry.md and conditions/initial-concerns-recorded.md, install/design-run-stages.md, unit tests in src/design_run/tests.rs and e2e tests in tests/e2e_design_tree.rs / e2e_design_forward.rs. Grepped the tree (code, install/, .agents/skills, .doctrine/spec, .doctrine/knowledge, memories) for ReviewedGraph / reviewed-graph / blocking_marks / judged_blocking residue. Ran cargo test --bin doctrine design_run and the two e2e test binaries: all pass. Gate/change-log agreement holds: both readers call CoveredSet::moved under the rule's Coverage; no code path still references the removed comparison. Six findings, none blocker.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "IMP-526"

[[finding]]
id = "F-1"
status = "answered"
severity = "minor"
title = "Sidecar relay line should ask the agent to name the new ids to the user; it only says 'tell the user to look at the tree'"
detail = """
Expected (DEC-421 choice): "sidecar: tell the user to look and note the new ids". With the gate conjunct removed, this line is the only mechanism that carries a new question to a sidecar-mode user, who does not see the tree pasted.

Observed: src/design_run/render/tree.rs:430-443 builds the sidecar ask as "tell the user to look at `{tree}`". The id list ("new: inq-8, inq-9 — consult the user ...;") is framed as agent-facing preamble, not as something to pass on. The inquiry prompt fragment (install/design-prompts/inquiry.md:51-52) does say "in sidecar mode, tell the user to look and name the new ids", but that fragment is served only during exploring/inquiring, while `declare` is admissible at every stage (drafting, reviewing, locked). Outside those stages the machine line is the whole contract.

Suggestion: when `added` is non-empty in Sidecar mode, make the ask name them, e.g. "tell the user to look at `{tree}` and name the new ids: inq-8, inq-9". Tests: tests/e2e_design_tree.rs `sidecar_tail`/`line_adding` and src/design_run/tests.rs `relay_names_added_inquiries_and_the_consultation_rule` would pin it.
"""
disposition = "fix-now"
response = 'Partly valid: the sidecar line already carried the new ids, but the instruction did not ask the agent to pass them on. Sidecar ask now ends "and note the new ids" when the write added nodes (render/tree.rs relay_line). Test: relay_names_added_inquiries_and_the_consultation_rule; e2e sidecar_mode_sends_the_user_to_the_tree.'

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = 'Partly valid: the sidecar line already carried the new ids, but the instruction did not ask the agent to pass them on. Sidecar ask now ends "and note the new ids" when the write added nodes (render/tree.rs relay_line). Test: relay_names_added_inquiries_and_the_consultation_rule; e2e sidecar_mode_sends_the_user_to_the_tree.'

[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "DEC-421 says the /design skill states the contract; it was placed in a stage-scoped prompt fragment instead, and DEC-421 was not amended"
detail = """
Expected: implementation matches the accepted decision's letter, or the decision is amended (boot snapshot: two binding sources that disagree are drift to surface, not silently resolve).

Observed: DEC-421 choice: "The design skill states the same contract"; consequences: "install/design-run-stages.md and the design skill regenerate". .agents/skills/design/SKILL.md is untouched (no mention of relay, sidecar or the consultation rule). IMP-526 Notes record the choice to put it in install/design-prompts/inquiry.md:50-57 instead. That placement is arguably better (the run serves it), but (a) DEC-421 still says otherwise, and (b) the fragment is delivered only in exploring/inquiring (inquiry.md:5-6), so an agent adding a node during drafting/reviewing receives the rule only through the relay line.

Suggestion: amend DEC-421's choice/consequences to name the fragment, and either accept the stage scoping explicitly or also carry the rule where later-stage declarations get their guidance.
"""
disposition = "fix-now"
response = "Fixed: DEC-421 choice amended to name install/design-prompts/inquiry.md as where the contract is stated, not the design skill."

