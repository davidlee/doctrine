disposition = "fix-now"
response = "Fixed: DEC-121 and DEC-300 bodies now carry a partially-replaced-by-DEC-421 note, as DEC-302 does."

[[finding]]
id = "F-4"
status = "answered"
severity = "minor"
title = "e2e growing_run fixture comments still claim growth stales the graph review via ReviewedGraph; the reblock act is now redundant"
detail = """
Expected: test commentary states why each step exists under the current rule.

Observed: tests/e2e_design_forward.rs:700-706: "The map's growth stales the graph review (`ReviewedGraph`, the ids whose effective judgement is blocking over the full set), which `reblock` below re-records". After DEC-421 an addition stales nothing, so the `reblock` apply at :720-727 (a fresh GraphReviewed checkpoint act) re-records a review that is still current. Same stale claim in the `large_run_still_renders` doc at :806-809 ("The blocking additions do move the graph review, which `reblock` re-records").

The tests pass (cargo test --test e2e_design_forward: ok), so this is misleading rationale rather than a red: a reader is told the fixture exercises a staleness path that no longer exists. Either drop `reblock` and the claim, or keep it with a comment saying it is retained for history.
"""
disposition = "fix-now"
response = "Fixed: growing_run and large_run_still_renders comments corrected; the redundant reblock graph-reviewed act removed. e2e_design_forward green."

