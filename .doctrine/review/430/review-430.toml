role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fixed: DEC-421 choice amended to name install/design-prompts/inquiry.md as where the contract is stated, not the design skill."

[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "Accepted decisions DEC-121 and DEC-300 still describe the removed ReviewedGraph / full-map blocking comparison"
detail = """
Expected: after DEC-421 partially replaces DEC-302's coverage clause, other accepted (tier-2) records that restate that clause are amended or marked, as DEC-302 itself was (record-302.md:5).

Observed:
- .doctrine/knowledge/decision/121/record-121.toml:15 (choice, AMENDED clause): "the user's graph-reviewed binds it through ReviewedGraph coverage"; record-121.md:92 says the same.
- .doctrine/knowledge/decision/300/record-300.md:1: "initial-concerns-recorded's coverage compares the blocking marks over the full map, so a new blocking question reaches the user without a new condition".
Both now contradict src/design_run/gate.rs:606-619 (InitialConcernsRecorded binds Coverage::InquiryMap). DEC-421's relations (record-421.toml) name only DEC-302.

Evidence: `git grep -n ReviewedGraph -- .doctrine/knowledge`. Specs under .doctrine/spec carry no residue (grep: 0 hits); .doctrine/rfc/034/research.md:420 does, but that is tier-5 research and not a finding.
"""
disposition = "fix-now"
response = "Fixed: DEC-121 and DEC-300 bodies now carry a partially-replaced-by-DEC-421 note, as DEC-302 does."

