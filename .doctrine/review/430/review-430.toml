disposition = "fix-now"
response = "Fixed: growing_run and large_run_still_renders comments corrected; the redundant reblock graph-reviewed act removed. e2e_design_forward green."

[[finding]]
id = "F-5"
status = "answered"
severity = "nit"
title = "Consultation clause is emitted for every added node regardless of provenance, so it misstates imported and user-directed nodes as 'an inquiry you added'"
detail = """
Expected: the line's claim is true of the ids it names. DEC-421: "An agent must not disposition an inquiry it added without consulting the user."

Observed: src/design_run/mod.rs:139-148 collects every id in `next` absent from `prior`; src/design_run/render/tree.rs:434-442 attaches "consult the user before dispositioning an inquiry you added" to all of them. On `design start --from-design` every imported OQ (Provenance::Imported) is named; a node the user directed (Provenance::UserDirected) is likewise labelled agent-added. IMP-526 Notes accept the start case as "noted rather than special-cased".

Provenance is already on the node (src/design_run/inquiry.rs:25-35), so the precise rule costs a filter: name all added ids (visibility), attach the consultation clause only when an AgentProposed node is among them. Low cost, removes the documented special case. Conservative as is, hence nit.
"""
disposition = "fix-now"
response = 'Fixed: relay_line takes the added nodes; all are named, and the consultation clause names only AgentProposed ones ("consult the user before dispositioning X, which you raised"). Imported and user-directed nodes no longer carry it. Unit test covers a mixed agent/user-directed write.'

