disposition = "fix-now"
response = 'Fixed: relay_line takes the added nodes; all are named, and the consultation clause names only AgentProposed ones ("consult the user before dispositioning X, which you raised"). Imported and user-directed nodes no longer carry it. Unit test covers a mixed agent/user-directed write.'

