[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Fidelity: the pi settings round-trip silently changes foreign numbers beyond u64/f64 exactness"
detail = """
Expected: design sec-5's "Other entries are preserved in order" holds for the
values, not just the keys.

Observed: `plan_pi_settings` parses the whole document into `serde_json::Value`
and re-serialises it. `serde_json` is declared with no features (Cargo.toml:168,
`serde_json = "1"`), so `arbitrary_precision` is off and `Number` is
PosInt(u64) / NegInt(i64) / Float(f64). A foreign integer that fits neither
integer arm — e.g. 18446744073709551617 (u64::MAX + 2) — is parsed as f64 and
re-emitted as 1.8446744073709552e19, a different value, on any write that adds the
extension entry.

PHASE-04's phase sheet accepted "JSON serialization may reformat other keys" —
reformatting is not value change, so this is outside that accepted risk.

Scope of exposure: a pi settings file carrying an integer above 2^64. The
alternative mechanism (a textual splice of the `extensions` array) is materially
more complex and brittle than the accepted whole-document round-trip.

Dispositioned `tolerated`; design sec-5 should record the caveat.
"""
disposition = "tolerated"
response = """
Confirmed as a real mechanism property: `serde_json::Value` without
`arbitrary_precision` cannot round-trip an integer outside i64/u64, and the
planner re-serialises the whole document.

Tolerated, with the rationale stated: the exposure needs a foreign integer above
2^64 in a pi settings file, and the alternative — a textual splice of the
`extensions` array — is materially more complex and brittle than the accepted
whole-document round-trip. This is a conscious acceptance, not an unnoticed one.

The caveat is carried to the reconciliation brief so design sec-5's "Other
entries are preserved in order" is read as ordering-and-structure, not
bit-exact value fidelity.
"""

