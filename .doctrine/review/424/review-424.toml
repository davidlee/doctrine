[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Hardening: write_atomic writes the temp before applying the preserved mode, and copies setuid/setgid/sticky bits"
detail = """
Expected: a mode-preservation fix closes the disclosure window it was written for,
and preserves permission bits rather than special bits.

Observed (src/fsutil.rs:74-98), in this order:

  1. `fs::write(&tmp, bytes)` — the temp is created at the umask default
     (typically 0644) holding the full settings content;
  2. `preserve_mode(path, &tmp)` — `fs::metadata(existing).mode() & 0o7777`
     applied via `set_permissions`;
  3. `fs::rename(&tmp, path)`.

So the steady state is fixed but the content is briefly world-readable in the
target's directory, and if `set_permissions` fails the function returns `Err`
leaving that temp on disk. The inverse order fixes it: derive the mode from the
target, create the temp with it, then write. Separately, `& 0o7777` replicates
setuid/setgid/sticky across a content rewrite, which is not what the disclosure
argument needs (0o777 is the permission set that matters for a file).

Only the 0600 case is tested.

Captured as IMP-520.
"""
disposition = "follow-up"
response = """
Confirmed by inspection of src/fsutil.rs:74-98: `fs::write` precedes
`preserve_mode`, and `mode & 0o7777` carries setuid/setgid/sticky.

Routing: IMP-520, captured at 8557a881f. It is genuinely separate work — the fix
belongs in a leaf-module change with the behaviour-preservation gate on every
`write_atomic` caller, not in an audit-side patch to a shared primitive. The
finding is real and stays on the record; the remediation is owned by IMP-520.
"""

