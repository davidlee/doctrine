[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Reporting: a pi settings-write failure drops the three extension outcomes already written"
detail = """
Expected: when part of a harness arm has landed, the failure discloses what landed
(STD-003 — no silent skip).

Observed (pre-fix): `install_refresh`'s Pi arm (src/boot.rs:1839-1855) built one
`RefreshReport` literal whose fields each used `?`, with
`pi_settings: install_pi_settings(...)?` last. `install_pi_settings` can return
`Err` from `fs::create_dir_all` or `fsutil::write_atomic`, so an I/O failure there
propagated out of `install_refresh` and destroyed the three already-computed
extension outcomes. `apply_wire` then recorded `result: Err(..)` and printed only
"refresh failed" — three files on disk under `.doctrine/state/pi/extensions`,
unregistered, and absent from the commit hint.

The settings leg necessarily runs last (the registration names the directory the
extensions live in), so the failure mode is structural, not incidental.

Fixed in 3b7090881; see this finding's disposition.
"""
disposition = "fix-now"
response = """
Confirmed and fixed in 3b7090881.

The Pi arm now binds the three extension outcomes to locals and attaches context
to the settings write:

  let pi_settings = install_pi_settings(root, dry_run).with_context(|| {
      format!("pi settings registration failed; the extensions in {PI_EXT_DIR_REL}
               were written but are unregistered ({extension:?}, {mcp_extension:?},
               {surface_extension:?})")
  })?;

so the propagated error names the directory and each extension outcome instead of
discarding them. Pinned by `settings_write_failure_names_the_landed_extensions`,
which induces the failure with a dangling `.pi` symlink (permissions cannot be
used — tests may run as root) and asserts both the disclosure and that
`index.ts` really did land.

`doctrine check gate` green after the change.
"""

