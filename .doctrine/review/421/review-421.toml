[[finding]]
id = "F-10"
status = "answered"
severity = "major"
title = "Commit hint can commit unrelated staged work"
detail = """
Expected: the hand-over command commits only the tracked paths this install changed (DEC-382; SL-282 design.md:125-138).
Observed: the proposed hint ends with a pathless `git commit -m ...` (`.doctrine/slice/282/design.md:129-132`). `git add <touched paths>` does not unstage entries already in Git's shared index, so copying the hint in a worktree where another change is staged commits that unrelated change too. This directly defeats the design's “exactly the tracked paths” promise and the repository's path-limit-commit rule in AGENTS.md.
Fix: path-limit the commit itself with an explicit `-- <same touched paths>` pathspec, and use `--` for `git add` as well. Render both commands against the resolved project root (`git -C <root>` or an explicit `cd`) so a nested-directory invocation works. Shell-quote the root and every path; add a fixture with an unrelated staged file and run install from a nested directory.
"""
disposition = "design-wrong"
response = """
Verified and agreed. Hint is now `git add -- <paths> && git commit -m "…" -- <paths>`, root-relative, shell-quoted, prefixed `cd <root> &&` when cwd differs. E2e rows: unrelated staged file excluded; nested-directory run.
"""

