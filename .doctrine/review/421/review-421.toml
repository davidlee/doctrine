[[finding]]
id = "F-16"
status = "answered"
severity = "major"
title = "Legacy cleanup deletes a newly customised starter on reinstall"
detail = """
Expected: `prompt customise <slot>` materializes a user-owned starter on explicit request, and subsequent installs preserve that choice (DEC-384; SPEC-009 REQ-355 and REQ-170).
Observed: the new verb is specified to call `project_starters` unchanged for one slot (`.doctrine/slice/282/design.md:262-276`). On a new slot that helper writes the current embedded `.md` body plus `replaces = "<slot>"` (`src/install.rs:1149-1202`). The same design says every install removes a disk `.md` whose bytes equal the embedded body when its sidecar is absent or exactly that default sidecar (`.doctrine/slice/282/design.md:278-292`). Therefore: install, `prompt customise role/worker`, then install again deletes the new user-requested `.md` and `.toml` before it has been edited. Byte identity cannot distinguish an old automatic starter from the new explicit starter; the verb's promised materialization is not stable even across a no-op reinstall.
Fix: give explicit customisations a distinguishable durable identity (for example a sidecar marker ignored by the hymn selector), or bound cleanup to a one-time legacy migration that cannot run on post-migration customisations. Add the install → customise → install regression, including an unedited starter, and assert both files remain.
"""
disposition = "design-wrong"
response = """
Verified: project_starters output is exactly what the removal rule matches. User ruling 2026-10-17 ("only delete unversioned"): DEC-384 amended so legacy removal runs only while the tracked installed-version is absent — a one-time migration for pre-stamp installs. Customise output can never be a candidate. sec-hymns, risks and e2e rows (install → customise → install keeps both files; no removal once stamped) updated.
"""

