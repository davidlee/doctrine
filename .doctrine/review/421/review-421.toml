Observed: codex and pi route skills through `skills_via = "universal"` (`install/manifest.toml:48-57`). That leg invokes `npx skills add` (`src/install.rs:1801-1825,1865-1885`) through `Runner::run`, whose only result is a success boolean (`src/install.rs:1831-1835`); no per-path `Touched` result can be composed into `InstallPlan`. The existing installer explicitly says npx copies under `.agents/skills/<id>` are not listed because Doctrine cannot distinguish them from operator files (`src/install.rs:1333-1334`), and the manifest's ignore entries do not cover `.agents/skills/` (`install/manifest.toml:63-96`). In a repo that tracks those copies, the promised command omits files the same install just added or updated.
Fix: either narrow the hint's stated contract to Doctrine-owned writes and report delegated paths as an explicit manual review step, or obtain a bounded, reliable change report for the delegated leg before claiming exact tracked coverage. Add a codex/pi fixture where delegated output is trackable.
