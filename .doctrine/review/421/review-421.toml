[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "Install accepts roots that every currency advisory site rejects"
detail = """
Expected: a project that `doctrine install` can provision can also reach the currency advice through the session hook, `boot`, and `status` (SL-282 design.md:206-215; DEC-380).
Observed: install resolves with the embedded manifest markers (`src/install.rs:208-210,1261-1264`), including `pyproject.toml` and `justfile` (`install/manifest.toml:105-113`). `prompt resolve` (`src/commands/prompt.rs:118`), `doctrine boot` / `boot --check` (`src/boot.rs:435-453`), and `status` (`src/status.rs:286-288`) instead use `root::default_markers()`, which has neither marker (`src/root.rs:8-16`). In a VCS-agnostic Python project with only `pyproject.toml`, install succeeds, but all three promised advisory sites fail root resolution; the session hook cannot emit its cascade or currency line. `prompt customise` would inherit the same failure if it follows the existing prompt command root seam.
Fix: use one manifest-backed root marker policy across install and these readers, or explicitly make all call sites accept the same marker set; pin a pyproject-only and a justfile-only e2e case from install through each advisory site.
"""
