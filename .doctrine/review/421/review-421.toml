response = """
Verified: install uses manifest [root_markers] (incl. pyproject.toml, justfile); prompt resolve / boot / status use root::default_markers(). Pre-existing divergence, and it already breaks the session hook in such projects regardless of SL-282. User ruling 2026-10-17: follow-up. Filed ISS-522; recorded as a residual in sec-risks.
"""

