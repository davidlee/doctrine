[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Fresh worktrees and dispatch forks report CheckoutNotInstalled on every session"
detail = """
The local marker lives in .doctrine/state/install.toml (gitignored). A linked worktree (`doctrine worktree fork`, `git worktree add`) never has it, and the fork allowlist withholds the state tier (src/worktree/allowlist.rs:328). The session hook in this repo runs `prompt resolve --role orchestrator` (.claude/settings.json:27), which the design makes the advisory site, so every fork session — including confined dispatch workers — is told "run `doctrine install`", an action a worker must not take and which would write coord-owned files. The design must say how a worktree is recognised (e.g. classify against the primary worktree's marker via git common dir, or suppress CheckoutNotInstalled in linked worktrees / under DOCTRINE_WORKER) and add an e2e row for it.
"""
disposition = "design-wrong"
response = """
User ruling 2026-10-17 ("1a"). DEC-379 amended: a linked worktree with no marker of its own reads the main worktree's marker via git's common dir; outside git only the checkout's own marker applies (POL-002). New command-tier helper read_install_marker -> (StampRead, MarkerSource); advisory takes the source and names the main root when it came from there. E2e rows for linked worktrees added.
"""

