[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Round trip drops terminal body whitespace instead of preserving the section map"
detail = "Expected: marker-grammar.md:40-50 and :296-310 claim materialise-then-parse is identity on every body, including adversarial whitespace. Observed: src/commands/design.rs:1150-1157 emits section.body raw, but authored_sections calls trim_end at :258 and :266. Concrete counterexample: a section body whose bytes are alpha followed by two spaces and two newlines is materialised with those bytes, then parsed as alpha. No named refusal fires. This is a tenth incumbent defect and directly falsifies EN-2(c) governing identity."
disposition = "fixed"
response = "ROUND 3. Contest upheld, and running it made the concession sharper than the contest. RUN: od -c over a materialised three-section document shows render_document building each block as marker + newline + body + newline and then blocks.join(newline), so an INTERIOR block carries TWO framing newlines — its own and the join's — and the LAST carries ONE. Rev 3's 'exactly one newline as the block separator' therefore described neither the incumbent nor a total rule, and remove-exactly-one would have left a spurious blank line on every interior body while being correct only on the last. That is a wider miss than 'undefined at EOF': the rule was wrong in the interior too. REPAIR — MAKE THE AFFIX UNIFORM, because position-independence is what makes the EOF case disappear rather than be special-cased. blocks.join is DELETED (it was the join, not the trim, carrying the position dependence). Every block including the last is marker + newline + escaped body verbatim + newline, concatenated with no separator. Parse takes the region from just after a marker line's newline to the next marker line's first byte or end of document, and removes EXACTLY ONE trailing newline. THE TWO REGION STATES WITH NO TRAILING NEWLINE ARE NOW CLASSIFIED RATHER THAN UNDEFINED: an EMPTY region is StructuralDeletion; a non-empty region without a trailing newline is UnterminatedDocument and is reachable ONLY at end of document. That last is a PROOF, not a claim — a marker line begins at column 0, so either it is at offset 0 or the byte before it is a newline, and that byte is the last byte of the preceding region; hence every non-final region either is empty or ends in one. MEASURED CONSEQUENCE, which reverses the obvious objection: dropping the join removes the blank line before each marker, so one expects a permanent fight with the formatter. Against prettier@3.9.6 — prettier is idempotent on its own output, and materialise(adopt(prettier(D))) is BYTE-IDENTICAL to prettier(D). A formatted document is a foreign edit exactly once; after one adopt-and-rematerialise cycle the document sits at prettier's fixed point and stays there. ORACLE STRENGTHENED: the byte-exact property test must run at SECTION COUNTS 1, 2 AND 3, because the defect rev 3 shipped was invisible at n=1 and lived entirely in the interior/last distinction. Verified over the adversarial body set (empty, trailing spaces, trailing newline, trailing blank lines, leading newlines, whitespace-only). plan.toml EX-13(a) rewritten; sketch section 'Row 10's resolution — the framing, measured rather than described'."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Incumbent defect row 8 is false: spaced and greater-than IDs are read back at head"
detail = "Expected: marker-grammar.md:540-553 says every incumbent-table row is a current reachable behaviour; row 8 says sec ids containing a space or greater-than produce a marker that cannot be read back. Observed: src/commands/design.rs:1150-1155 concatenates the raw id between the delimiters; authored_sections extracts the entire substring between those same delimiters at :253-260; src/design_run/ids.rs:75-92 validates only byte length, known prefix, and nonempty body. Counterexample sec-a b is accepted by DesignId::parse, emitted as one marker, extracted unchanged, and accepted again; sec-a> follows the same path. The incumbent does not split an id token on spaces. Formatter or HTML concerns do not make the factual cannot-be-read-back claim true."
disposition = "fixed"
response = "Verified and conceded. The counterexample holds: authored_sections extracts the whole inter-delimiter substring and trims it, so sec-a b and sec-a> are emitted and read back unchanged at head — the incumbent does not tokenise on spaces. Rev 1 conflated two different things, and the correction is the useful part: excluding a NEWLINE repairs an incumbent defect (a newline is admitted by DesignId::parse today and splits the marker across two lines), while excluding a space or > is a forward-looking contract change required by (a)'s single-space tokenisation. Row 8 now names only the newline; the space and > exclusions are justified in (a) as part of the new grammar and are no longer claimed as incumbent breakage."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Retitle answer relies on a nonexistent heading-to-title projection"
detail = "Expected: marker-grammar.md:217-243 settles EN-2(b) by asserting title is body heading content, Section.title is extracted from the first ATX heading, and re-adopt makes the document authoritative. Observed: src/design_run/submission.rs:127-132 defines body and title as separate wire fields; src/design_run/run.rs:488-499 stores them separately; src/commands/design.rs:1148-1157 materialises body but never title; authored_sections at :249-268 extracts only id and body; adopt_authored in src/design_run/run.rs:281-295 updates only fingerprint, leaving both title and body unchanged. Counterexample declaration {subject: sec-1, title: Visible, body: plain body} materialises no heading at all. The claimed extraction path does not exist, so title/body desynchronisation is silent and the load-bearing mechanics of answer (b) are unsettled."
disposition = "fixed"
response = "ROUND 6. Contest upheld, verified independently before answering, and building the oracle instead of patching the case found a SECOND defect the contest did not reach. VERIFICATION FIRST: the rule as written at marker-grammar.md drops the whitespace run following the opening hashes BEFORE testing for a closing run, so on `## ###` the region is `###`, the run is preceded by nothing, the closing-sequence step cannot fire, and the title derives as `###`. Measured with a positive and a negative control in the same prettier@3.9.6 run: `## Title ##` becomes `## Title` (the probe fires on a real heading), `#hashtag ##` is untouched (not a heading), and the disputed `## ###` becomes `##` — which the same procedure then refuses SectionTitleEmpty. Accepted at declare, unadoptable after a format run. Your finding holds exactly as stated. THE SECOND DEFECT, WHICH IS LARGER. Replacing VA-7's enumerated table with a generated differential (39,019 bodies from a product of indents, hash runs, delimiters, contents and trailers) showed the strip runs ONCE where a formatter strips REPEATEDLY, so `## # # #` derives `# #`, a format run makes it `#`, and another makes it nothing — a cascade, invisible in any single-case check. And the fix that looked obviously right for your case — refuse a bare-hash-run title — closed ZERO divergences of 4,224. That is the argument for the instrument over the row, and reading would not have produced it. THE REPAIR, in two parts. (1) The content region keeps its leading whitespace until AFTER the closing-sequence test. (2) The strip runs to EXHAUSTION. Divergences fall 4,680 to 1,664. THE JUSTIFICATION IS ALSO REPAIRED, AND THIS IS THE PART THAT MATTERS MORE THAN THE RULE. Rev 4 justified dropping the closing sequence by prettier's behaviour. THAT JUSTIFICATION IS WITHDRAWN. The rule is kept on CommonMark's authority instead — a trailing hash run preceded by whitespace is the heading's optional CLOSING SEQUENCE, framing rather than content, true whether or not any formatter exists. Your finding was correct against the standard, not merely against a tool. AND THE PROPERTY BEHIND IT IS WITHDRAWN TOO, rather than repaired a fourth time. The differential shows the families fall one at a time — closing sequences, cascades, whitespace runs, then inline emphasis (`# *em*` to `# _em_`) — and a per-character probe over every printable ASCII character plus unicode in four positions found ZERO unstable characters, because the instability needs a matched PAIR. It is a token property, not a character property, so the cheap defence an admissible-title charset would give (the shape (a) uses for ids) is MEASURABLY unavailable. A title derived from a heading's source bytes cannot be stable under a tool that rewrites source bytes while preserving meaning; only a title derived from RENDERED INLINE CONTENT could be, and that is a Markdown inline parser, which this CLI does not have and PHASE-06 is not scoped for. So the stability claim is withdrawn exactly as (a)'s maximality claim was under F-4, and for the same reason. CONSEQUENCE, STATED BECAUSE IT LOOKS LIKE A REGRESSION: the internal-whitespace collapse is NOT ADOPTED even though it closes a real family (`# a  b` to `# a b`, 832 divergences) and costs one line. Its only justification was the withdrawn one. Keeping a rule whose derivation has been retracted because it is already written and looks useful is precisely the habit F-4 named, so `# a  b` derives `a  b` with the double space intact, and VA-7 (b3) PINS that so a later reader cannot reintroduce it as a tidy-up. AND THE THREAT MODEL ITSELF WAS MEASURED FOR THE FIRST TIME, which is what licenses the withdrawal rather than making it a retreat. Markers survive a realistic formatted document BYTE-IDENTICALLY (three markers, a table, a list, a long line, a closing-sequence heading, a double-spaced heading, inline emphasis — every marker line unchanged), so the structure the grammar rests on is not at risk. Prettier CANNOT PARSE TOML AT ALL — getSupportInfo lists no TOML language and a .toml path infers a null parser — so the entire authored entity tier was never exposed; the hazard was only ever Markdown prose. And prettier is NOT INSTALLED IN THIS REPOSITORY: not on PATH, no .prettierrc, no .prettierignore, and the single package.json (web/map) does not depend on it. Three grammar rules had been derived from an untested hypothesis about a hypothetical CLIENT project. The posture is now scoped in the sketch section (f): `.doctrine/**` is documented as not formatter-safe Markdown, with the caveat that Doctrine must NOT write a .prettierignore itself, because seeding a host-tool config from the installer is what POL-002 forbids. plan.toml EX-13(b) EXTRACTION rewritten; sketch section 'The oracle this rule owes its shape to' and section (f) 'What the formatter can actually reach'; probe committed at .doctrine/slice/233/sketches/probe/title-differential.py so the numbers are reproducible and the instrument is attackable."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The claimed maximal marker-safe charset is not derived by the stated constraints"
detail = "Expected: marker-grammar.md:114-128 invokes the provenance rule and claims [A-Za-z0-9_-] is the maximal ASCII subset satisfying no whitespace, no greater-than, and no non-ASCII. Observed: printable ASCII bytes such as dot, colon, slash, plus, equals, at-sign, and square brackets satisfy all three stated constraints, do not split on a space, and cannot form the comment terminator because they are not greater-than. Thus the proposed grammar is clear but its claimed maximality and widest-safe-set provenance are false. The restriction needs an additional derived constraint or the maximality claim must be withdrawn."
disposition = "fixed"
response = "Verified and the claim is WITHDRAWN rather than repaired. Dot, colon, slash, plus, equals, at-sign and square brackets all satisfy the three stated constraints, so [A-Za-z0-9_-] is not the maximal satisfying subset and the sketch had no derivation for saying it was. The three constraints establish a safety FLOOR, not an optimum. The charset is now stated as the choice it is, with its actual justification: it is the identifier charset the corpus already uses for entity ids and slugs, and above the safety floor the conservative direction is the cheap one — widening admission later is free, narrowing it after ids exist in committed documents is a migration. This is what the provenance rule demands of a set that nothing derives, and the sketch records that nothing was proved against the wider bytes."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Over-bound IDs raise IdTooLong, not the claimed MalformedId refusal"
detail = "Expected: marker-grammar.md:148-159 makes a factual enforcement claim that exceeding DESIGN_ID_BYTES produces Refusal::MalformedId. Observed: src/design_run/ids.rs:75-80 returns Refusal::IdTooLong immediately when raw.len exceeds DESIGN_ID_BYTES; MalformedId is only returned by the later prefix-or-empty-body arm at :82-91. Refusal rather than truncation is correctly present, but the sketch names the wrong existing code behaviour. The EN-2(a)/EX-10 enforcement account must be factually exact."
disposition = "fixed"
response = "Verified, trivially correct, and my error. ids.rs:75-80 returns Refusal::IdTooLong from the length guard before the prefix is examined; MalformedId is the later prefix-or-empty-body arm — which is, usefully, the arm the new charset rule joins, since a bad byte is a malformed id rather than an over-long one. Both refusals are now named precisely in the enforcement paragraph, and the sketch notes that EX-10(b) is satisfied by the existing length guard rather than by any new mechanism."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "VA-7 detects spellings but does not prove wire removal or derived-title semantics"
detail = "Expected: PHASE-06 EX-13(b) requires the independent title wire input to be removed and Section.title to be derived totally from the body's first non-blank ATX heading; VA-7 claims to falsify a parsed-but-ignored old field. Observed: submission.rs:106 derives Deserialize for Declaration without #[serde(deny_unknown_fields)], so after deleting Declaration.title Serde still accepts an old JSON title key and ignores it — exactly the silent acceptance VA-7 says it excludes. Its first broad rg also necessarily finds unrelated title spellings such as CreateRecord.title at submission.rs:224. The second rg only detects a function named title: fn title could return a retained stored field, an empty string, or parse headings incorrectly and still satisfy the grep. No behavioral negative submits the old title key and expects rejection, and no semantic check exercises setext/fenced/#hashtag/ATX extraction. Thus VA-7 proves neither half of EX-13(b)."
disposition = "fixed"
response = "ROUND 6. Contest upheld. Your diagnosis is exactly right — VT-6 could pass while EX-13(b) was false — and the repair is the INSTRUMENT, not the missing row. WHY NOT THE ROW. Adding `## ###` to the table would have been the third patch to a hand-written enumeration: rev 3 shipped a non-partition table twice, rev 4 replaced the RULE with a decision procedure and a totality proof but left the ORACLE as a table of forms someone thought of, and that is precisely where the case escaped. You found the leak; the leak's cause is the instrument. THE PROOF THAT THIS IS NOT A PREFERENCE. The differential that replaced the table found a second defect (the cascade — see F-3) and then showed that the fix which looked obviously right for your family — refuse a bare-hash-run title — closed ZERO divergences of 4,224. A row-addition would have shipped that guard believing it worked. No amount of re-reading produces that result; only an instrument with a positive control does. THE OBLIGATIONS, and one hard constraint that shapes them. CONSTRAINT: prettier is a node package and is NOT INSTALLED IN THIS REPOSITORY (no binary, no config, not a dependency of the one package.json), so a Rust test MUST NOT shell out to a formatter. The differential therefore stays a DESIGN-TIME probe — committed at .doctrine/slice/233/sketches/probe/title-differential.py, reproducible, with rev 4's defective rule retained in it expressly as the positive control — and the PHASE-06 test obligations are formatter-free. VA-7 (b) becomes three. (b1) DERIVATION IDEMPOTENCE as a generated property over the same PRODUCT corpus the probe uses: re-emitting a derived title as a heading and re-deriving yields the same title. This needs no formatter, it is exactly what strip-to-exhaustion buys, and it is the property whose absence produced the cascade — so it is a real generative property test, not a table wearing one's name. (b2) A case table whose ROWS ARE THE PROBE'S OUTPUT rather than someone's recollection — that provenance is the entire difference from rev 4 and the test must state it — including at minimum the two the differential found: `## ###` gives SectionTitleEmpty (not title `###`) and `## # # #` gives SectionTitleEmpty (not title `# #`). Rev 4's forms remain correct and are retained. (b3) THE RESIDUAL ASSERTED AS PRESENT, NOT ABSENT: `# a  b` derives `a  b` with the double space INTACT, pinning the declined whitespace collapse so it cannot be reintroduced as an obvious tidy-up without confronting the criterion. VA-NC3 EXTENDED, and this is the part that answers your finding's deeper point. (b1) must be DEMONSTRATED TO FAIL against the rev 4 extraction rule before the rev 5 rule replaces it, with the failing output recorded in the phase sheet. A generated property that has never been seen to fire is the same defect you found in a grep, one altitude up — and rev 4's table was itself an instrument that could not fire on the case it omitted. The rev 4 rule is kept in the committed probe for exactly this purpose. (b3) is noted as an ABSENCE PIN: if it passes on first write that is expected and is not a missing red. VA-7's residual agent judgement gains a third clause: confirm no test, comment or doc asserts formatter stability of the derived title. The claim is WITHDRAWN (see F-3), and a well-meaning test re-asserting it would reinstate a property this revision measured to be unreachable — which is the failure mode this criterion exists to prevent, aimed at the next reader rather than at the reviewer. AND ONE DISCLOSURE THAT IS NOT ABOUT THIS FINDING, made here because it bears on a finding you have already VERIFIED and it is not the responder's call to bury. Rev 4 claims prettier is idempotent on its own output; F-1 was verified partly on the fixed-point argument that rests on it. IT IS FALSE: 2,560 of 39,019 bodies move on a second pass and convergence takes four (2,560, 1,084, 320, 0). The non-idempotence is confined to headings whose content is hash runs and spaces, so no ordinary document moves twice and F-1's substance — one foreign-edit cycle, then a fixed point — survives, as do the other two legs of the claim. But rev 4 asserted a universal from a single-pass measurement, which is this document's recurring defect rather than a one-off, and whether F-1's verification stands on the corrected claim is yours to decide, not mine. Recorded in the sketch at 'Row 10's resolution' as a disclosed correction rather than a quiet amendment. plan.toml VA-7, VT-6 and VA-NC3 rewritten; sketch section 'The oracle this rule owes its shape to'."
