slug  = "reconciliation-review-of-sl-256"
title = "reconciliation review of SL-256"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-256"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "REQ-478 is still `pending` although its coverage cell verifies and all three acceptance criteria are discharged"
detail = "Expected: a requirement whose criteria the slice discharges, and whose coverage cell `doctrine coverage verify 256` moves `verified→verified` against a runnable positive control, is `active`. Observed: `doctrine spec req show REQ-478` reports `functional · pending` — the status it was authored with at design time, when the notes recorded 'authored pending; coverage cell deferred until the e2e checks exist'. The checks now exist and pass. Criterion 1 (an apply that records an act emits a row naming subject and kind) is discharged by the four emission checks at tests/e2e_design_state.rs:1243, :1265, :1293, :1328; criterion 2 (every emittable member driven, an undriven member fails the roster test) by every_material_event_kind_persists_a_change_row at :1090 now iterating EMITTABLE; criterion 3 (retired vocabulary is readable-only and carries no emission obligation) by the_retired_event_is_readable_but_not_emittable at :1119. The cell is .doctrine/slice/256/coverage.toml, anchored at c0c69f634, matching 'an_agent_declaration_alone_renders_a_change_row ... ok' on stdout of `cargo test --test e2e_design_state`. REQ-478 is a member of SPEC-029 as FR-009, so the status move is a governance write and belongs to /reconcile via a REV, not to this audit."
disposition = "verified"
response = "Observation confirmed and NOT repairable here. REQ-478 is a member of SPEC-029, so its status is a governance write, and /reconcile is the sole writer of reconciled truth through a REV — an audit-time edit would bypass the surface the lifecycle reserves for exactly this. Delegated to the reconciliation brief, § Governance/spec (REV): REQ-478 status `pending → active`, on the evidence that all three acceptance criteria are discharged by named e2e checks and that the coverage cell verifies against a runnable positive control. No code change is owed — the discharge already exists; what is stale is the requirement's own lifecycle field."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "design.md spells the DesignAccepted act's subject and term with an underscore at three sites; act tokens are kebab-case"
detail = """Expected: `cpa-design-accepted` and `act=design-accepted`, because act tokens come from `ActKind::as_str` (src/design_run/attestation.rs:116, `ActKind::DesignAccepted => "design-accepted"`) and `act_id` mints the subject as prefix plus that token (run.rs:770). Observed: design.md spells both with an underscore at :593 (sec-3 prose), :626 (sec-3's sequence diagram, `Pending(ActRecorded, cpa-design_accepted, act=design_accepted)`) and :708 (sec-4 check 4). The landed code and tests are kebab throughout — run.rs:399's comment says 'subject `cpa-design-accepted`', and tests/e2e_design_state.rs:1328 builds the subject through `act_subject(IdKind::CheckpointAct, ActKind::DesignAccepted)` rather than typing a literal. The plan's half of this was already corrected in place at PHASE-02 planning (7c8095664, plan.toml PHASE-02 VT-1's annotation); the design half was not, because the design run is `locked` and this is not an implementor's edit to make. Spelling, not substance: no behaviour, decision or criterion turns on it."""
disposition = "verified"
response = "Observation confirmed at all three sites (design.md:593, :626, :708). Not fixable inside the audit: design.md is a per-slice artefact and /reconcile's direct-edit surface, and the design run is `locked`, so an implementor rewriting locked prose mid-audit is the wrong actor. Delegated to the reconciliation brief, § Per-slice (direct edit). Cheap and mechanical — three occurrences of `design_accepted` become `design-accepted` — and it makes canon agree with `ActKind::as_str`, which is the only source of the token. The plan's half of the same erratum was corrected in place at PHASE-02 (7c8095664), so this closes the pair."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "design.md sec-4's coverage-cell recipe does not parse — clap refuses `--command --test`"
detail = """Expected: a recipe in the design that an implementor can run. Observed: design.md:951 reads `--command cargo --command test --command --test --command e2e_design_state`; clap refuses the third occurrence with `unexpected argument '--test' found`, because any `--command` value beginning with `-` needs the `=` form (`--command=--test`). PHASE-03 recorded the cell with the `=` form, so .doctrine/slice/256/coverage.toml stores the argv the design intended — `command = ["cargo", "test", "--test", "e2e_design_state"]` — and `coverage verify 256` passes. The corrected recipe was also folded into `mem.fact.coverage.vt-needs-a-check-field` at PHASE-03, on the reasoning that a memory is what the next agent copy-pastes. What is left is the design artefact still carrying the unparseable spelling. Spelling, not substance."""
disposition = "verified"
response = "Observation confirmed by clap's own refusal. Same surface and same reason as F-2: locked per-slice prose, /reconcile's direct edit. Delegated to the reconciliation brief, § Per-slice (direct edit): design.md:951, `--command --test` → `--command=--test`. The recorded cell already stores the argv the design intended, so nothing downstream is wrong — only the recipe a future reader would copy, and that reader is why it is worth the edit rather than tolerating it."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Two design-target selectors are undelivered: the render path was fenced but never needed touching"
detail = "`doctrine slice conformance 256` reports `undelivered (2)`: `src/design_run/render/mod.rs` and `src/design_run/render/change_row.rs`. Neither PHASE-02 nor PHASE-03 edited either, and that is correct rather than dropped work — research Thread 2 found the render path data-driven off `as_str` plus generic term rendering, and design.md's own affected-surface table already says both are 'expected untouched', fenced 'so a change to either reads as a conformance signal rather than a silent edit'. Verified: `change_row.rs` names no `ChangeEvent` at all, and `render/mod.rs` names exactly one — `WIDEST_PAYLOAD_EVENT` at :198, still `ChangeEvent::StageMoved`, an exemplar this slice does not move (ActRecorded carries one term). So the design was right and the fence did its job; what is now stale is the registry, which claims a delivery obligation the slice discharged by not needing it. The load-bearing fix is the selector registry `slice-256.toml` reads — `doctrine slice selector rm` — since that is what `slice conformance` computes from; design.md's table is the human mirror and a prose-only edit would leave the cell red. The notes already reached this conclusion conditionally at PHASE-02 ('if PHASE-03 leaves them untouched, prune the selectors at reconcile rather than manufacture an edit to satisfy the fence') and discharged the condition at PHASE-03."
disposition = "verified"
response = "Observation confirmed, and the design's prediction is what the evidence vindicates rather than contradicts — so the repair is to prune the obligation, not to manufacture an edit satisfying it. Delegated to the reconciliation brief, § Per-slice (direct edit), with the load-bearing surface named explicitly: `doctrine slice selector rm` against the two render selectors in `slice-256.toml`, because that registry is what `slice conformance` computes from; design.md's affected-surface table is the mirror and a prose-only edit would leave the cell red. Not `tolerated`: leaving a permanently-undelivered selector in the registry teaches every future reader of this slice's conformance output to discount the cell, which is the one cell that has to stay trustworthy."

[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "The single-sourcing degraded an existing diagnostic on a live failure path: the refusal no longer names the accepted vocabulary"
detail = "Expected: replacing `#[serde(rename_all)]` with `#[serde(try_from/into)]` preserves strictness AND the diagnostic, since the enum is closed and `READABLE` is right there. Observed: strictness is preserved exactly (an unknown token is still a hard parse failure, tested at tests/e2e_design_state.rs:1174) but `Refusal::UnknownChangeEvent`'s Display at src/design_run/refusal.rs:594 prints only `unknown change event: `{raw}``, where serde's derive printed `unknown variant `x`, expected one of `node_created`, …, `step_discharged``. Reproduced against the real corpus with a positive control, per mem_019fa18161f47651af7687d8dccbbc67: `doctrine design show 244` fails at snapshot line 4927 with the bare message, while `doctrine design show 251` succeeds — so this is the message on a live, reproducible path, not a hypothetical. The reader who ever sees it is someone hitting ISS-315, whose snapshot carries a token retired out from under it, and the accepted list is precisely how they tell *retired* from *misspelt* and find the member that replaced it. Owned by IMP-445, minted at PHASE-03 with `originates_from SL-256` and `related ISS-315`, which already states this case including the ISS-315 reader. STD-003 is satisfied — the degradation is disclosed, not silent — so this is a diagnostic-quality regression, not a correctness one."
disposition = "follow-up"
response = "Observation confirmed by reproduction against the live corpus with a positive control. Routed to follow-up on the merits, not on size — the fix is small. Improving a refusal's diagnostic payload is a different concern from single-sourcing a wire token: it wants a decision about whether Refusal variants generally name their accepted vocabulary (there are several peers in refusal.rs with the same shape), and answering that inside this slice would be scope the design did not take. IMP-445 already owns it, minted at PHASE-03 with `originates_from SL-256` and `related ISS-315`, and already states this exact case including the ISS-315 reader — so the work is captured and owned, which is the bar follow-up has to clear. Not `tolerated`, because nobody has accepted this as permanent; not `fix-now`, because the honest fix is broader than the regression. Recorded here so the ledger shows the slice knowingly traded a diagnostic for a single source rather than not noticing."

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "The slice spends a fixed envelope budget the risk register does not name: ENVELOPE_CHANGE_ROWS, not just the payload-width const"
detail = "Expected: a design whose whole subject is *adding rows* enumerates the fixed budgets a row consumes. Observed: the register names exactly one — `R5`, `WIDEST_PAYLOAD_EVENT` (render/mod.rs:198), which bounds a row's *width* — and `R2`, `DESIGN_EVENT_NAME_BYTES`, which bounds an event *name*. Neither is the row-*count* budget. `ENVELOPE_CHANGE_ROWS = 10` (render/mod.rs:78, 'material-change delta rows, retained from the newest end … sized to what is absorbable in one turn') caps how many rows the envelope renders for `log.since(known_revision)`. This slice adds one row to every apply that records an act and a second to a disposing act, so an agent resuming from an older `known_revision` reaches that cap after fewer applies than before and sees `omitted > 0` where it previously saw the whole delta. Handled correctly by construction and NOT a defect: `changes()` at render/envelope.rs:1073-1092 computes `omitted = total.saturating_sub(cap)`, retains from the newest end, and returns both `omitted` and `total` — so the envelope says 'there are more' rather than implying ten is all, which is STD-003's disclosure obligation met. Storage is unaffected: `CHANGE_LOG_REVISIONS = 32` bounds revisions, not rows. What is wrong is the design's account of its own blast radius, which reads as if the payload-width exemplar were the only budget in play."
disposition = "verified"
response = "Observation confirmed; the mechanism is correct and the design's account of it is incomplete. No code change is owed — `changes()` already discloses `omitted` and `total`, which is the whole of what STD-003 asks of a bounded projection, and no assertion or budget is breached. What is owed is one clause in the design's own risk register so the next reader of this vocabulary knows there are two budgets a new event spends, not one. Delegated to the reconciliation brief, § Per-slice (direct edit): design.md, beside R5, naming `ENVELOPE_CHANGE_ROWS` as consumed-but-not-breached and pointing at the `omitted`/`total` disclosure as why. Deliberately not `aligned`: the code is aligned, the design is not, and recording it as `aligned` would lose the only durable trace that this budget was looked at."

[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "design.md's census of the retired token undercounts the population its compat argument rests on"
detail = """design.md sec-4 ('New — the retired token still parses') says '7 rows across 6 live runs are the population at stake'. Censused against the live corpus: 9 rows across 7 runs carry `event = "acceptance_attested"` (slices 243:2, 244:1, 248:1, 249:1, 251:1, 254:1, 256:2), and 8 rows on SL-244's run alone carry `evidence_invalidated`. The landed code doc is the one that is right — change_log.rs:180 says 'nine rows across seven of this repo's own live design runs' and :146 attributes all eight legacy rows to SL-244 alone, which is PHASE-03 EX-5's doc correction landing correctly. The design's figure was accurate when written on 2026-08-16 and the census has since grown by this slice's own run and SL-254's; design runs are gitignored runtime state, so any census in an authored artefact dates. The argument does not turn on the number — the compat pin is at the whole-file tier precisely because one unrecognised token costs the whole snapshot regardless of how many rows carry it — so this is a stale factual claim in canon, nothing more."""
disposition = "verified"
response = "Observation confirmed by census against the live corpus. Delegated to the reconciliation brief, § Per-slice (direct edit), as the third and last of the design.md corrections (with F-2 and F-3): design.md sec-4, '7 rows across 6 live runs' → '9 rows across 7 live runs', matching change_log.rs:180. A nit, and included only because /reconcile is already opening this file for F-2, F-3 and F-6 — the marginal cost is one line. The generalisable point is worth more than the fix and goes to the harvest: a census of gitignored runtime state, written into an authored artefact, is stale the moment the next run applies."

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "The notes' ruling on memory-corpus drift used too narrow a test, and the drift has grown since PHASE-03"
detail = "The notes deferred this to /audit: '`memory validate` exits 1 with six findings … none is scoped to `src/design_run/**` — the scopes are `flake.nix`, `src/dispatch.rs`, `src/worktree/**`. Pre-existing corpus drift, flagged for /audit to rule on.' Two corrections. (a) The count is now 15 rows, not six — 14 stale plus one dangling `[[relation]]` target (`mem.pattern.design.skill-amendment-designs-read-current-files`, from mem_019faca1f05277729cb407f8d4487206); exit is still 1, confirmed by running it clear of a pipe. (b) The stated test is the wrong one. The question is not whether a stale memory is scoped to `src/design_run/**` but whether it is scoped to any path THIS SLICE EDITED, and one is: mem_019e98921f31772295edbe66537ebe34 (`mem.pattern.testing.no-root-find-walk`) is scoped `[src/root.rs, tests]`, and the slice edited `tests/e2e_design_state.rs`. Enumerated all 15 scopes to establish this rather than generalising, per RV-360 F-7's lesson. The ruling nevertheless stands and is stated here rather than left implicit: that memory is 50 commits behind, so it was already stale before this slice existed; its content (do not walk from the repo root in tests) is untouched by adding three assertions to an existing e2e file; and none of the 15 was authored or edited by SL-256 — the three memories this slice did touch (mem_019fbf791c9d71d0815d6e1fc2c9fb9f, mem_019f89125fb275a2895bf58b5e29ed95, `mem.fact.coverage.vt-needs-a-check-field`) are all absent from the validate output, i.e. re-attested. Pre-existing corpus drift, not this slice's to carry."
disposition = "aligned"
response = "The correction to the notes' test is accepted, and the conclusion it was reaching for survives it: no change is owed by this slice. Established by enumeration rather than by generalisation — all 15 scopes read, one found to cover a path this slice edited (`tests`), and that one shown harmless on its own terms: 50 commits behind before this slice existed, and its content is about not walking from the repo root in tests, which adding three assertions to an existing e2e file does not bear on. The three memories SL-256 actually touched are absent from the validate output, i.e. re-attested at the phase that touched them. `memory validate` exiting 1 is standing corpus drift with its own owner — /reviewing-memory or a dreaming pass — and pulling 14 unrelated re-attestations into this slice's audit would be scope this slice never took. Ruled on, not absorbed; the drift is real and stays visible to whoever runs that pass next. Recorded here so the next auditor inherits the right test: does any stale memory's scope cover a path THIS slice edited."

[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "Ruling on the undeclared cell: all 13 rows account for, none is scope creep"
detail = "Conformance's highest-signal cell, ruled on row by row rather than waved past. Eleven of thirteen are the slice's own process artefacts under `.doctrine/`: ISS-448's and ISS-449's backlog pairs plus their symlinks (6), three friction observation records, `slice/256/coverage.toml` and `slice/256/slice-256.toml`. No `design-target` selector can ever declare these — conformance computes against design-targets, which are code paths — so this is structural noise every slice produces, and IMP-282 ('Conformance: exclude slice-own process artifacts from undeclared leads') already owns it; nothing new to mint. The remaining two are `src/estimate/display.rs` and `src/map_server/state.rs`, the ISS-448 toolchain-bump lint clearance: declared in `slice-256.toml` as `scope-relevant` with a note naming IMP-273 as root cause, taken at PHASE-01 on explicit human instruction after /consult, and landed under their own `fix(ISS-448)` commit d6385ae8f rather than smuggled into a feat commit. They read `undeclared` because conformance reads only `design-target`, which is the documented fork a widening creates and is recorded in mem_019fbf791c9d71d0815d6e1fc2c9fb9f. Separately: the boundary registry is COMPLETE — all three phases carry a row, so no `incomplete` F-2 backstop applies — and every commit inside every recorded range was enumerated (three, one, two respectively): all are SL-256's own or the declared ISS-448 clearance, so no foreign slice's work rode a phase range in. Nothing in this cell is scope creep, a missed design update, or an undocumented touch."
disposition = "aligned"
response = "The cell is fully accounted for and nothing in it is a defect. Eleven rows are structural noise with an existing owner (IMP-282) — no mint, since minting a duplicate would be the escape here. Two rows are a declared, noted, separately-committed, human-authorised clearance whose `scope-relevant` intent is exactly why they read `undeclared`; re-intenting them to `design-target` to silence the cell is the move the memory on this fork explicitly names as the wrong one, and it is not taken. The registry-completeness and foreign-commit checks both came back clean, so the algebra can be trusted rather than merely reported. Aligned: the conformance signal is behaving as designed and the slice's answer to it is the correct one."

[[finding]]
id = "F-10"
status = "verified"
severity = "nit"
title = "The landed payload_terms merges the two act arms where sec-2 shows a standalone arm — a declared form deviation whose only record was a disposable phase sheet"
detail = "design.md sec-2 shows `ActRecorded` taking its own `payload_terms` arm. The landed code merges it with its mirror: `ChangeEvent::ActRecorded | ChangeEvent::ActInvalidated => &[(PayloadKey::Act, ValueKind::Token)]` (change_log.rs:348-350). Same semantics — the two term shapes are byte-identical — and the merged form is the module's own idiom, which already merges identical shapes twice (`NeedsAdded | NeedsRemoved`, `ReviewAttested | ReviewInvalidated`); it also makes the design's 'exact mirror of ActInvalidated' literal in the code rather than merely asserted in prose. The implementor declared it at PHASE-01 (sheet F-3) precisely so a reviewer diffing against the design would see it declared rather than discover it. Raised here because that declaration lived only in `.doctrine/state/slice/256/phases/phase-01.md`, which is gitignored runtime state and `rm -rf`-able — the audit tail's job is to lift durable residue out of a phase sheet before it is erased, and a deliberate design-vs-code form deviation is exactly that. Verified as form-only: `payload_terms` is the single source for both the canonical term order (`ordered`) and the containment check's saturation, and `rendered_payload_fits_its_cap_for_every_event_kind` quantifies over READABLE, so a merged arm and a standalone arm are indistinguishable to every consumer."
disposition = "tolerated"
response = "Accepted as landed; no edit to either surface. The deviation is form-only and the merged form is better on two counts the design could not have weighed without the code in front of it — it is the module's established idiom for identical shapes, and it makes the mirror relation structural instead of a prose claim. Editing design.md sec-2 to match would be churn that improves nothing for a reader who has the code; editing the code to match the design would break the idiom to satisfy an illustration. `tolerated` rather than `aligned` because there IS a real divergence between canon and code, consciously accepted, and the rationale is what makes it acceptable — which is the whole reason the disposition requires one. The durable record now lives in the ledger rather than in a phase sheet about to be discarded, which is what this finding was raised to accomplish."

