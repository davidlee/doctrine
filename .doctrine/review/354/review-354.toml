[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Expected kernel-owned adjudication; observed a payload closure returning the final verdict"
detail = "SL-253's design states at .doctrine/slice/253/design.md:558-561 that the kernel owns 'the adjudicative normal form' and 'the algebra of the claims it emits', but its proposed entry point accepts run_row: &dyn Fn(&RowId) -> RowVerdict at .doctrine/slice/253/design.md:895-904. The lifecycle makes the delegation explicit at .doctrine/slice/253/design.md:1142-1145: payload code projects the arms and then calls the kernel's row_verdict before returning to the kernel. Thus qualify_over receives an already-adjudicated answer and cannot enforce that row_verdict was called at all; a second mechanism can return Proven for any RowId, ignore the id, or encode mechanism state through variant choice. This is the fourth seam-crossing location class: executable closure value/contract (including its type-erased captured environment), distinct from parameter types, function bodies, and fields of parameter types. The current seam demonstrates the hidden environment at crates/doctrine-control/src/conformance.rs:5229-5248, where all three closures capture the backend, host, and one shared fixture OnceCell, and the kernel fixes the mechanism-sensitive invocation order at crates/doctrine-control/src/conformance.rs:5319-5325. D10 in SL-253's design calls closures structural protection at .doctrine/slice/253/design.md:1675-1682, but the compile probe cannot see a closure's captures or prove its behavioural contract. Change the callback to return neutral pre-adjudication evidence, e.g. a pair/record of ArmJudgement values, and have qualify_over call row_verdict itself; also state and test callback invocation/side-effect semantics. Otherwise the kernel is a scheduler/collector around payload adjudication, not the claimed neutral adjudicator."
disposition = "fix-now"
response = """
Accepted, and the fourth location class is confirmed. Verified every cite: design.md:558-561 does claim the kernel owns "the algebra of the claims it emits"; :895-904 does take run_row: &dyn Fn(&RowId) -> RowVerdict; :1142-1145 does make the delegation explicit ("then calls the kernel's row_verdict(probe, control)"). The code evidence holds too — conformance.rs:5229-5237 shows the run closure capturing host and a shared fixture OnceCell and returning a fully-formed RowVerdict::Indeterminate on fixture fault, and verify_over at :5322 calls run_row(backend, row) and takes the verdict as given.

The specific claim this defeats is D10's, at design.md:1675-1682, that "the kernel's entry point takes values and closures, and nothing else" is structural protection against F7's class. It is protection against a mechanism type arriving on a parameter. It is no protection at all against a closure's RETURN type carrying the adjudication itself, nor against its captured environment. D10's claim is narrowed accordingly rather than withdrawn: the values half stands, the closures half is now stated as a narrower guarantee.

Repair, and it is cheaper than the finding proposed. run_row becomes &dyn Fn(&RowId) -> (ArmJudgement, ArmJudgement) — the probe and control arms — and qualify_over calls row_verdict itself. § 5.2.5 already mints ArmJudgement as the kernel-side projection with Indeterminate(Indeterminacy) carrying the fault, so no diagnostic is lost: the fixture-fault case that today returns RowVerdict::Indeterminate{arm: Which::Probe, ...} becomes a pair of Indeterminate judgements, and the nine-cell truth table derives Which from which arm is indeterminate. No new type, no information loss, and the payload keeps ArmResult::into_judgement exactly as § 5.2.5 already specifies it.

Two consequences worth recording. The kernel now enforces the algebra it claims to own — a mechanism cannot return Proven for an id it ignored, because it cannot construct a RowVerdict at all. And § 9.6's row_verdict_is_a_truth_table_over_nine_arm_pairs stops testing a function the payload may or may not call and starts testing the only path to a verdict, which is a real strengthening of that test rather than a rewrite of it.

The captured-environment half of the finding is not closed by this and is not claimed to be: a closure returning ArmJudgement can still capture whatever it likes. What changes is that captures can no longer reach the verdict except through the kernel's algebra, which is the property I7 needed and did not have. § 5.1 records the residual explicitly rather than leaving D10 to imply it away."""

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Expected a falsifiable neutrality gate; observed an unspecified negative control with no expected-failure runner"
detail = "The design calls compilation 'the assertion' for a harness=false target at .doctrine/slice/253/design.md:684-689 and makes that probe the machine check for I7 at .doctrine/slice/253/design.md:1240-1247. It then concedes at .doctrine/slice/253/design.md:1438-1440 that 'the compile probe's negative control is not specified', and repeats at .doctrine/slice/253/design.md:2142-2146 that the control's shape is left to implementation. That is not a neutral implementation detail: an intentionally uncompilable Cargo target cannot remain in the normal cargo test graph, while the proposed harness=false target has no stated meta-runner that expects compilation to fail. The current package has only tempfile as test infrastructure (crates/doctrine-control/Cargo.toml:64-74), and just capsule-check runs ordinary clippy and cargo test (justfile:111-113); neither supplies expected-failure semantics. Therefore an implementer can land a positive probe that has never demonstrated a red path, while still satisfying the prose-shaped exit criterion. Specify the negative-control mechanism and its gate wiring before design lock: for example, a normal test/meta-command that builds a temporary synthetic crate containing the real kernel plus a deliberately forbidden in-crate import, asserts the compiler rejects it for the absent module, and is itself run by capsule-check. Add a positive sentinel proving the real kernel body is actually included. Without those details, I7's sole mechanical evidence is not falsifiable."
disposition = "fix-now"
response = """
Accepted, including on the scope question it raises. The review brief told this reviewer to honour § 10.3's deferral list, which carries "the compile probe's negative control is not specified" as deliberate. The raise is admitted anyway, because its argument is not "you left out a detail" — it is "the mechanism you chose cannot hold the detail you deferred". A deferral cannot immunise itself against an attack on its own premise. Cites verified: design.md:684-689 makes compilation the assertion, :1240-1247 makes the probe I7's machine check, :1438-1440 and :2142-2146 defer the control, Cargo.toml:64-74 shows tempfile as the only test infrastructure, and justfile:111-113 shows capsule-check running plain clippy plus cargo test. None of those supplies expected-failure semantics.

The failure this actually guards against is worth stating precisely, because it is not the obvious one. A forbidden import added to a kernel that the probe genuinely compiles does fail correctly. The risk is that the probe is misconfigured into vacuity — wrong #[path], target outside the default selection, gated behind required-features — and then compiles green forever while building nothing, while the exit criterion reads "compile probe present" and is satisfied in prose. That is the same family DEC-197 refused the fake-module alternative to avoid, on the stated ground that a hand-maintained allowlist "is exactly how a guard gets weakened to fit the code".

Repair, owner-directed and cheaper than the finding proposed. No temp-crate builder shelled from a Rust test. A second harness = false target that include!s the positive probe verbatim plus one deliberately forbidden in-crate import, held out of the default graph by required-features, and a capsule-check recipe that inverts the exit status.

One hardening is essential and the finding was right to insist on the reason clause. A bare exit inversion passes on ANY compile failure — a typo, a bad feature name, a syntax error — so the negative control would be vacuous in precisely the way the positive probe was. The recipe therefore pins the diagnostic, not the exit code: it asserts E0433 naming the forbidden module. Cargo.toml:58-60 already sets the precedent, recording that "omitting either is E0433 for both crates".

That diagnostic check subsumes the finding's second ask for free. A positive sentinel proving the real kernel body is in the compiled unit is not needed separately: if the #[path] include is broken the negative target still fails, but with E0583 file-not-found rather than E0433, and the grep rejects it. One diagnostic-pinned target proves both that the include resolves and that a forbidden import is rejected.

§ 5.1 gains what the control must DEMONSTRATE — red on a forbidden in-crate import, failing for that reason and not another — and names the exit-inverting recipe as a sufficient shape. How it is spelled stays implementation. § 10.3's entry is struck, since the item is no longer deferred. Severity held at major: nothing in § 5's types or seam moves, an exit criterion is tightened."""

[[finding]]
id = "F-3"
status = "answered"
severity = "blocker"
title = "Expected the preservation test to verify the total map; observed a post-state golden that can bless an incomplete migration"
detail = "SL-253's design makes the preservation promise explicit at .doctrine/slice/253/design.md:1944-1950: every pre-split line has exactly one successor and every post-split line exactly one predecessor. It then claims at .doctrine/slice/253/design.md:1971-1983 that 'the noticing is done by a test' and that a whole-output golden of the post-split artefact makes both totality clauses machine-checked. A post-state golden proves only actual_post == authored_expected_post. It does not prove that expected_post was derived bijectively from EVD-022's pre-split transcript; the migration author can omit a pre-split line (or add a new one), author the same omission/addition into the golden, and the test passes. The proposed translation table is not that missing machine relation: .doctrine/slice/253/design.md:2002-2031 gives it row classification plus assurance key/front columns, but no executable mapping for the header, outcome, floor, axes, claims, observations, ordering, or uniqueness of predecessors/successors. Layer 3 is expressly reviewer inspection at .doctrine/slice/253/design.md:1993-1998, confirming that the claimed mechanical closure still depends on the reader noticing the migration error. Commit the pre-split transcript as a test fixture and implement an executable transformer/validator for all seven rules plus ordering, asserting one consumption of every input line and one production of every output line, then compare that mechanically transformed output with the live post-split artefact. Otherwise DEC-199 is a licence to freeze a changed artefact, not proof that the change stayed inside its closed contract."
disposition = "fix-now"
response = """
Accepted. The logic is unarguable and I verified the cites: design.md:1944-1950 states both totality clauses, and :1971-1983 claims the whole-output golden makes them "machine-checked rather than reviewer discipline". A golden asserts actual_post == authored_expected_post and nothing more. It cannot witness that expected_post was derived from EVD-022's pre-split transcript, so an author who drops a line and encodes the same omission into the golden goes green. Layer 3 being expressly reviewer inspection at :1993-1998 confirms the gap rather than covering it. The claim at :1971-1983 is overstated and is corrected, not defended.

The repair is narrowed from what the finding proposed, on owner direction. An executable transformer inside the Rust test suite is gold-plating for an instrument that fires once. The defect is a one-time derivation failure at the moment of migration, not an ongoing drift risk — drift is what the golden is legitimately for. So: a one-shot stdlib-only Python script reads the committed pre-split transcript, applies rules 1-7 plus the ordering clause, and emits the expected post-split artefact. Its output is committed AS the golden. The house pattern is established — scripts/migrate_value_facets.py is an SL-220 one-shot whose docstring opens "Throwaway, stdlib-only", beside migrate_estimate_facets.py and value_baseline.py — and python3 is in the jail.

One correction to the finding's direction of travel, and it matters. The finding proposed comparing the mechanically transformed output against the live post-split artefact. That is the weak direction: it invites tuning the transform until it matches whatever the code emits. Instead the script runs FIRST, its output is committed as the golden before the phase that changes RowId, and the split phase goes green against it. That preserves what § 9.1 already says about writing the golden before that phase, gives the phase a red-to-green shape, and fixes the derivation direction as pre-split -> expectation -> code rather than code -> expectation.

What this does not buy, stated rather than glossed: the script proves the golden was derived, not that the seven rules are themselves correct. Rule correctness remains a reading of DEC-199 against the design, and § 9.1's layer-3 reviewer question survives for that. The difference is that an omitted or invented line is now caught by machine, which is the specific defect raised."""

[[finding]]
id = "F-4"
status = "answered"
severity = "minor"
title = "Expected EVD-022 to support DEC-199's recut contract; observed the withdrawn three-difference allowance"
detail = "EVD-022 still says, verbatim, 'Permitted to differ by design: the outcome line (DEC-191), the exit constants (DEC-194) and the row key spellings (DEC-198), since rendering is {:?} over RowId.' DEC-199 and SL-253's design have superseded that exact exception-list framing: .doctrine/slice/253/design.md:1952-1969 additionally derive a floor-row successor, front-labelled assurance lines, and front ordering, while .doctrine/slice/253/design.md:1971-1976 says the exception list was replaced because it could not express those changes. The raw EVD-022 transcript remains valid evidence for layer 1, but its interpretation now contradicts the accepted preservation contract it supports and could make audit apply the withdrawn allowance. Reconcile EVD-022 so it records only the immutable pre-split observations and points permitted transformation to DEC-199's current total map, or append an explicit supersession note; do not leave two banked records defining different legal deltas."
disposition = "fix-now"
response = """
Accepted. Verified against the record itself, not against the design's account of it: EVD-022's datum carries verbatim "Permitted to differ by design: the outcome line (DEC-191), the exit constants (DEC-194) and the row key spellings (DEC-198), since rendering is {:?} over RowId." And design.md:1971-1976 does say the exception list was replaced precisely because it could not express the floor-row successor and the front ordering. So two banked records define different legal deltas, and the older one is the one an auditor reaching for evidence would hit first.

Repair: EVD-022's datum is edited to record only the immutable pre-split observations — the nineteen row-to-verdict mappings, the four claims, the two readings, and the run's provenance — with the permitted-transformation clause replaced by a pointer to DEC-199's total map as the sole authority on what may legally differ. The raw transcript in the body is untouched; it is the evidence and it stays exactly as captured. Only the interpretation clause moves, which is the part that was superseded.

Editing rather than appending a supersession note, on the grounds the finding itself offered as the alternative: a record whose datum states a withdrawn allowance and then retracts it below is still a record an auditor can quote the first half of. The datum is the queried surface. Provenance is not lost — DEC-199 carries the supersession and this finding carries the reason."""

