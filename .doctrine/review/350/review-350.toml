id    = 350
slug  = "sl-250-implementation-audit-plugin-channel-retirement"
title = "SL-250 implementation audit — plugin channel retirement"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-250"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "SPEC-011 REQ-186 is false on four axes against shipped code"
detail = 'Expected: the governing requirement describes what boot install does. Observed: REQ-186 (member of SPEC-011 as FR-006, status active) still reads "boot install merges a <exec> boot SessionStart hook into Claude settings.local.json, refreshing a stale owned copy and preserving every foreign hook and key". Verified verbatim 2026-08-08 via spec req show. Four axes falsified: (1) not one hook — seven specs emitting eleven entries across five events (claude_hook_specs, src/boot.rs:1255); (2) not settings.local.json — a scope-selected default of .claude/settings.json (settings_rel, :558; ClaudeSettingsScope default Project); (3) not <exec> — the committed scope writes the portable PORTABLE_EXEC literal (command_form, :574); (4) a new obligation the requirement says nothing about — the abandoned-scope sweep (evict_hook_from_file, :2210). This is the REV target design.md sec-7 Governance names, with QUE-209 (widen REQ-186 vs add new requirements for the hook set and the scope key) deferred to reconciliation. Raised so the ledger carries it rather than only notes.md. Note the conformance report reads .doctrine/spec/tech/011/** as undelivered for exactly this reason.'
disposition = "verified"
response = "Upheld, re-derived: REQ-186 text read verbatim from spec req show, and each of the four axes checked against landed code (claude_hook_specs at src/boot.rs:1255, settings_rel :558, command_form :574, evict_hook_from_file :2210). Routed to the reconciliation brief, NOT fixed here: SPEC-011 is governance and the audit stage does not write it — /reconcile authors the REV. QUE-209 (widen REQ-186 vs mint new requirements for the seven-spec hook set and the scope key) stays open for the REV author, per design.md sec-7 Governance which deferred it deliberately. Brief entry under Governance/spec (REV), with SPEC-010 explicitly NOT joining the REV — DEC-171 made it a conformance claim and PHASE-05 VA-1 discharged it with four citations, which this audit re-derived by reading src/install.rs:1994/2013/2064/2379-2402 and install/manifest.toml:46."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "A high-trust memory now asserts the opposite of what PHASE-05/06 shipped"
detail = 'Expected: the durable corpus does not contradict landed code in the module it is scoped to. Observed: mem.pattern.distribution.skill-refresh-command (mem_019eae55811f7412b11559068fe8a279) carries an SL-227 paragraph reading "There is no .doctrine/skills/ and nothing relinks .claude/skills/<id>", and that the harness-visible copy moves only on a plugin update. Both halves are false after PHASE-05: skills_canonical_dir (src/install.rs:1994) materialises .doctrine/skills/<id> and install_skills_direct (:2064) relinks .claude/skills/<id> through reconcile_link on every install. VH-1 observed 35 such symlinks live on a cold install. The memory is high-trust and scoped to src/install.rs, so it is retrieved by the next agent to touch the installer — it will be read as current and it will mislead. notes.md flags this under "Owed at close"; raising it so it is not carried past close as prose.'
disposition = "fix-now"
response = 'Upheld and FIXED IN THIS AUDIT, and the sweep found a second instance the finding did not name. (1) mem.pattern.distribution.skill-refresh-command (mem_019eae55811f7412b11559068fe8a279): the SL-227 paragraph now records that the route flipped TWICE and states the post-SL-250 claude mechanism (canonical .doctrine/skills/<id> tree + reconciled .claude/skills/<id> symlink), so install -s <id> -y is live again for claude with no plugin update. (2) Found by following the link the first memory carries: mem.pattern.distribution.skills-source-vs-installed (mem_019eacd4b2af7a7099792cc3e1671cc5) held the stronger claim — a 2026-07-25 SL-229/RV-306 correction declaring the .doctrine/skills/ mechanism "dead" and asserting the directory "does not exist in this repo". Re-corrected in place with the SL-250 restoration, and its How to apply section split by channel: claude verifies the derived copy at .doctrine/skills/<id>, npx and the published plugin still verify the release cache. Fixing only the memory named would have left the sibling asserting the opposite more forcefully (mem_019fa3c8737f7812b59f86db053d456b — fix the defect class, not the instance). Both edits are in-place corrections, not supersessions: the headline claim of each is unchanged across all three states and only the route moved.'

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "The sweep rider contradicts itself when removed > 0 and skipped is true"
detail = 'Expected: no two rider lines in one report block contradict each other — sec-3 argues at length that the fold must not be absorbing precisely so every true fact prints. Observed: write_scope_report (src/boot.rs:2162) hedges the unreadable line ("could not sweep PART OF <abandoned>") but not the skipped line, which reads "did not sweep <abandoned> — <target> could not be written, so there is nothing to replace it with" at file granularity while skipped is a per-spec fact. Reachable state: a target .claude/settings.json that is valid JSON with hooks.PreToolUse hand-edited to a string. The two PreToolUse specs get RefreshOutcome::PrintedFallback -> EvictOutcome::NotAttempted -> skipped = true; the other five land and sweep the sibling -> removed > 0. The operator then reads "evicted N stale hook entries from .claude/settings.local.json" immediately followed by "did not sweep .claude/settings.local.json — .claude/settings.json could not be written", when nine of eleven entries were in fact written. This is RV-348 round 2 probe 1 ("probe for a state where two lines print and contradict each other"), and it is the same defect class the raiser named across both rounds: the mechanism is right and the sentence attached overclaims by one degree. Untested: the_skipped_line_names_what_it_did_not_replace (:5794) drives SweepReport::from(NotAttempted) alone, and a_partly_successful_sweep_reports_both_facts (:5723) asserts !swept.skipped.'
disposition = "fix-now"
response = 'Upheld and FIXED. The state is reachable exactly as raised and is now driven by a test. Root cause named precisely: removed and skipped are BOTH per-spec facts folded across seven specs, and sec-3 designed the fold to be non-absorbing for that reason — but only the unreadable LINE was worded partially ("could not sweep part of"). The skipped line kept file-scoped wording, so the two contradict whenever one events array in the target is wrongly typed while the rest merge. Fix is wording, not mechanism: "left some doctrine hooks in <abandoned> — they could not be written to <target>, so there is nothing to replace them with". EX-7 intent is preserved verbatim — the line still reads as "the activation is still in the other file and it is the only copy", not as "cleanup skipped" — so no authored criterion is contradicted. New test a_skipped_sweep_does_not_contradict_a_successful_eviction seeds a valid target with hooks.WorktreeCreate hand-edited to a string plus an owned SessionStart entry in the sibling, drives sync + create_fork, and asserts removed == 1 AND skipped AND that no file-scoped denial is printed. the_skipped_line_names_what_it_did_not_replace updated for the new phrase. This closes RV-348 round 2 probe 1, which the design left open for implementation and implementation did not reach.'

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "slice conformance undeclared cell is 20/27 foreign — the signal cannot be read as scope creep"
detail = "Expected: the undeclared cell names paths this slice touched but did not declare. Observed: 20 of the 27 entries were committed by other agents on the shared edge branch during SL-250 execution — src/plan.rs (SPEC-031 / IMP-382 / ISS-321, verified by git log), .doctrine/rfc/027 and /029, .doctrine/slice/248/*, .doctrine/backlog/improvement/411, .doctrine/knowledge/decision/181, two observation records and a memory item. Cause: phase deltas are recorded as code_start_oid ranges (.doctrine/state/slice/250/phases/phase-0N.toml), so on a shared branch every concurrent commit between two phase starts lands in this slice delta. The same mechanism also silently absorbed a foreign .claude-plugin/marketplace.json edit (the chore: v0.37.0 release bump, 88d6ecfc9) into a range PHASE-06 EX-5 requires to be untouched — EX-5 holds, but the report cannot say so. Consequence for this audit: the undeclared cell had to be attributed commit-by-commit before any entry could be treated as a lead, which is the opposite of what the cell exists for. Not a defect of SL-250, but it degrades the evidence the audit stage load-bears on, in a repo whose documented mode is multiple agents on one branch (AGENTS.md)."
disposition = "fix-now"
response = "Upheld and FIXED in the same edit as F-3. Both previously-untagged lines now interpolate {tag}, so a --dry-run block reads consistently across all four lines. No behavioural change; the lines were true under dry-run before and are true now."

[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Two genuine SL-250 surfaces sit undeclared: publication/manifest.toml and tests/e2e_skills_symlink.rs"
detail = 'Expected: every path a phase criterion names is covered by a design-target selector, so conformance can check the slice against itself. Observed: publication/manifest.toml is edited by PHASE-06 EX-7 ("the new reference doc is registered in publication/manifest.toml") and tests/e2e_skills_symlink.rs by PHASE-05 D1 and PHASE-06 EX-8 ("its three no-manual-skills-symlink assertions and its plugin-summary assertion invert"), and neither is a selector — both land in the undeclared cell. This is the second instance of the gap PHASE-03 already found and half-closed: the design-time review.selectors pass reached src/ only, was extended in PHASE-03 to tests/e2e_memory_sync.rs and tests/e2e_claude_install.rs, and stopped there. The load-bearing fix is the registry (doctrine slice selector add), which is what slice conformance reads; design.md has no corresponding enumeration to mirror.'
disposition = "follow-up"
response = "Upheld, and the remediation is already owned — no new item minted. ISS-307 (Phase completion flip captures HEAD as code_end_oid, so a shared tree records a foreign commit) is the same root cause seen from the end boundary; SL-250 evidence appended to it as a second sighting, including the point the first sighting did not make: at 20/27 foreign the undeclared cell INVERTS rather than merely widens, because the audit skill designates it the highest-signal lead and an auditor who does not clear it by hand will raise findings against other slices work. Also recorded there: the same code_start_oid mechanism produces the defect at the START boundary too, and the capture absorbed a foreign .claude-plugin/marketplace.json release-bump edit into a range PHASE-06 EX-5 requires untouched — so a criterions own evidence is inverted by the capture. Siblings named for co-settlement: IMP-175 (stale code_start_oid when edge advances before land) and IMP-282 (exclude slice-own process artifacts from undeclared leads) — three faces of one problem. Follow-up rather than fix-now because the fix is a change to the delta-capture mechanism in the binary, which is neither this slice scope nor an audit-time code fix."

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "install_skills_direct prints a Claude-specific header from a body EX-3 argues is not Claude-specific"
detail = 'Expected: PHASE-05 EX-3 — "once link_dirs is a parameter nothing in the body is Claude-specific, and a Claude-named function would mislead IMP-406 author". Observed: install_skills_direct (src/install.rs:2064) opens with writeln!(out, "agent claude (direct):") before the link_dirs loop. Design-conformant — design.md sec-5 code block carries the identical line — so this is a defect the design and the code share rather than a departure. It is latent today (run() Claude branch passes exactly one link dir) and becomes wrong the moment IMP-406 passes .agents/skills as a second target: one header naming claude will front links into a non-Claude directory. Cheapest fix is IMP-406 call-site scope (pass the label, or emit the header per link dir), so it belongs on IMP-406 rather than here — but only if it is written down.'
disposition = "fix-now"
response = "Upheld and FIXED. doctrine slice selector add 250 --intent design-target publication/manifest.toml tests/e2e_skills_symlink.rs, with a note citing the criteria that name each. Named the registry verb rather than a design.md edit, per the audit brief-surface guardrail: slice conformance reads slice-250.toml, and design.md carries no selector enumeration to mirror here. Re-run confirms both moved undeclared -> conformant (undeclared 27 -> 25, conformant 12 -> 14). The residual 25 are the foreign entries of F-5. Worth carrying to the design amendment as the general lesson rather than the instance: the design-time review.selectors pass reached src/ only, PHASE-03 extended it to two tests/ files after the gap bit, and it still missed the two surfaces named by criteria in the LAST phase — a selector review that runs once at design time cannot see the surfaces later phases acquire."

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "The doctrine repo itself has not cut over — settings.json still carries enabledPlugins and no hooks"
detail = 'Expected: sec-6 "This repo own cutover" makes the first post-slice install the place SL-195 INV-1 is exercised on hooks in git for the first time — "eleven ${DOCTRINE_BIN:-doctrine} commands and no /home/... anywhere" checked by git diff. Observed: .claude/settings.json (tracked, per .gitignore:4-5) holds only {"enabledPlugins": {"doctrine@doctrine": true}, "worktree": {"bgIsolation": "none"}} — no hooks key at all — and .claude/settings.local.json still carries enabledPlugins and worktree.baseRef. So this repo is still activating through the plugin channel the slice retires, and the one benefit-realisation check the design nominates has not been run anywhere it can be committed. VH-1 evidenced the behaviour in a scratch project, which is the criterion and is discharged; this is the separate, un-criterioned claim sec-6 makes about the host repo. It is a two-act operator cutover under DEC-167 (install, THEN disable the plugin) and the order matters: the reverse leaves no activation, and WorktreeCreate teardown is conditional on the hook firing.'
disposition = "follow-up"
response = "Upheld, and routed to IMP-406 rather than fixed here. The observation is exact and the finding correctly identifies it as a defect design.md sec-5 and the code SHARE — the design code block carries the identical line — so it is not a departure to reconcile. Latent today (one link dir) and wrong the moment IMP-406 passes a second, which makes IMP-406 both the owner and the point at which the fix is a call-site change rather than speculative. Appended to IMP-406 with the EX-3 quote that contradicts it and the two candidate fixes (pass the label, or move the header inside the link_dirs loop and name each target). Not fix-now: changing the header now would either invent a label parameter with one caller or produce output churn for no present benefit, and IMP-406 is already open and sequenced after this slice."

[[finding]]
id = "F-8"
status = "verified"
severity = "nit"
title = "The dry-run tag is applied to two of write_scope_report four lines"
detail = 'Expected: one report block reads consistently under --dry-run. Observed: write_scope_report (src/boot.rs:2162) interpolates {tag} (which callers set to "[dry-run] ") into the announcement and the evicted line, but the unreadable and skipped lines are emitted with a bare "  claude: " prefix. Under --dry-run the operator sees two tagged lines and two untagged ones in the same block. Neither untagged line is false under dry-run — nothing was written, so both predictions hold — so this is presentation only, but it is the block whose whole purpose is making a destructive write legible.'
disposition = "follow-up"
response = "Upheld on the facts and routed to IMP-400, which stays open on exactly this. Confirmed: .claude/settings.json holds enabledPlugins doctrine@doctrine with no hooks key, and .claude/settings.local.json still carries enabledPlugins and worktree.baseRef. Two things separated, because conflating them is how a discharged criterion gets re-litigated: VH-1 is fully discharged — it demands a SCRATCH project by its own preconditions, and the evidence file plus the raw capture satisfy it at 11 entries across 5 events with one observed effect per event class. What is NOT discharged is sec-6 separate, un-criterioned claim about the HOST repo, where the first post-slice install is nominated as the first place SL-195 INV-1 is exercised on hooks in git. That is a two-act operator cutover under DEC-167 (install, THEN disable the plugin), and the order is load-bearing — the reverse leaves no activation, and isolation: worktree teardown is conditional on WorktreeCreate firing. IMP-400 OQ-4 (migrating existing enabledPlugins / marketplace registrations) already owns this class of act and this repo is an instance of it. Carried to the brief as a close-time operator action, not a code change."

[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "sec-6 backlog-disposition-at-close list is unresolved"
detail = 'Expected: design.md sec-6 "Backlog disposition at close" names five items to settle at close. Observed: IMP-400 (started, fulfilled by SL-250, stays open on OQ-4 migration plus the IMP-407 doctor leg), IMP-406 and IMP-407 (both open, both after SL-250) are correct as they stand. Two are not settled: CHR-045 ("bump plugin.json version when the skill set changes") is marked no-longer-moot by sec-6 because the manifest survives as R9 escape hatch, and its own body records that just sync-plugin-versions inside just release already derives all five manifests from the Cargo version — so the standing instruction is "resolve or explicitly retain" and neither has happened; and IMP-234 / CHR-037 are marked "assessed for overlap" with no recorded assessment. Low stakes individually, but they are close obligations the design wrote down and nothing else carries them.'
disposition = "follow-up"
response = 'Upheld, partially. Three of the five are already correct as they stand and need no act: IMP-400 started and fulfilled-by SL-250, staying open on OQ-4 plus the IMP-407 doctor leg (two counts, as sec-6 requires); IMP-406 and IMP-407 both open and both after SL-250. Two are genuinely unsettled and carried to close: CHR-045, where the design ruling is "no longer moot — resolve or explicitly retain" and neither has happened, though its own body records that just sync-plugin-versions inside just release already derives all five manifests from the Cargo version, so retain-as-fixed is the likely call; and IMP-234 / CHR-037, marked "assessed for overlap" with no assessment recorded anywhere. Left to close rather than dispositioned here because a backlog transition is a close act and both need a judgement the audit has no evidence to make.'

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "design.md carries eight statements implementation falsified, all recorded in notes.md and none yet in the design"
detail = 'Expected: after implementation the design tells the truth about what shipped, or the divergence is dispositioned. Observed: eight, each already written up under notes.md "At reconcile" and each verified here against the landed code. (1) sec-2 sites ClaudeSettingsScope::command_form() in install_config; it ships as boot::command_form(scope) (src/boot.rs:574) because ADR-001 classifies install_config leaf at out=0 and boot as command tier, so the method would be a tier inversion and a cycle — PHASE-02 VA-2 made the layering gate a criterion. (2) sec-3 stranded-baseRef message asserts "local settings override project settings, so it still governs", true only in the Project direction; stranded_baseref_line (:1860) renders both directions. (3) sec-3 Reporting shape shows no stranded field and does not name the BaseRefWrite type install_baseref (:1805) now returns. (4) PHASE-03 EX-1 shared parse_settings between plan_hook and plan_evict; it was taken one consumer further to plan_baseref, collapsing five PrintedFallback literals into baseref_fallback. (5) boot::claude_scope was renamed configured_scope (:549) to stop colliding with RefreshReport.claude_scope. (6) fallback_for (:1548) now renders a JSON array for N=1 as well as N>1 — user-visible on both install paths, asserted nowhere (the sole assertion is !snippet.is_empty()). (7) VT-2 two-spec fold is asserted through WorktreeCreate rather than the SubagentStart the criterion names, because HookSpec::nominate does not exist until PHASE-04. (8) three phases (01->02/04, 02->03) partition EX-8 constant list across phases because Cargo.toml sets warnings = "deny" and a constant with no consumer is a hard error. Raised as one finding because the remediation is a single design-amendment pass at reconcile, not eight.'
disposition = "verified"
response = 'Upheld. All eight re-derived against landed code during this audit rather than taken from notes.md — the two that most change a readers model are (1) command_form living at src/boot.rs:574 with a doc-comment that names ADR-001, cites PHASE-02 VA-2 as the gate and says "do not tidy this back onto the enum", which is the correct outcome and leaves only design.md sec-2 sentence wrong; and (6) fallback_for now rendering a JSON ARRAY for N=1 as well as N>1, which is user-visible on both install paths and asserted nowhere (the sole assertion is !snippet.is_empty()). All eight are per-slice artefact edits — design.md only — so they are a DIRECT EDIT at reconciliation and none joins the SPEC-011 REV. Explicitly out of scope for the brief: none of them requires editing plan.toml. PHASE-NN and EN-/EX-/VT- ids are immutable-append, so where a criterion mis-cites (VT-2 SubagentStart example, the stale src/boot.rs line numbers), the amendment states the general rule in design.md and notes.md rather than rewriting the criterion.'

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "Three phases each found an enumerated inventory incomplete — the pattern is not yet written down as a rule"
detail = "Expected: a design that enumerates precisely can be trusted as exhaustive. Observed: three phases in a row falsified one of their own inventories, each time in the same way — precision read as exhaustiveness. PHASE-04 F1: EX-5 golden had an unenumerated sibling (wire_adds_import_and_hook_then_is_idempotent carries the assertion twice). PHASE-05 F1: the design sec-5 golden inventory named tests/e2e_skills_symlink.rs while tests/e2e_claude_install.rs carried the same now-false assertion and is named in neither sec-5 nor PHASE-06 EX-8. PHASE-06 F1: EX-4 enumerated four falsified claims and was wrong in both directions at once — three were already corrected in passing by earlier phases, and a fifth (install_config.rs repo FIELD doc, distinct from the module doc EX-4 names) was missed. Separately, PHASE-03 recorded every src/boot.rs line citation in EN-2/EN-3/EX-7 as stale after PHASE-01 renames, with every cited FACT re-verified and holding. The remediation each phase reached for was the same (run the full suite, grep the CLASS of assertion rather than the cited paths) and it is currently recorded three times as an incident and zero times as a rule. The amendment should say once, generally, that a criterion line numbers are advisory and its named symbols binding, and that an enumerated inventory is a starting set."
disposition = "verified"
response = "Upheld, and it is the most transferable thing the slice learned. Verified as three independent instances plus a fourth of the same shape (PHASE-03 line citations stale after PHASE-01 renames, every cited FACT re-verified and holding). The mechanism is worth stating precisely in the amendment because it is counter-intuitive: precision is what MAKES an inventory read as exhaustive. A vague list invites a grep; a list with file/line citations invites trust, and the design earned that trust everywhere else, which is why three consecutive implementers spent it. This audit is a fifth data point in the same direction — F-6 two undeclared selectors are named by criteria in the LAST phase and were still missed by a selector review that ran at design time. Carried to the brief as a design-amendment item with two concrete rules: a criterion line numbers are advisory and its named symbols binding; and an enumerated inventory is a starting set to be closed by running the full suite and grepping the CLASS of assertion, never the cited paths. Per-slice direct edit at reconciliation; no governance surface."

