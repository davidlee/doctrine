[[finding]]
id = "F-7"
status = "answered"
severity = "major"
title = "Whole-snapshot point arm is not a recall ceiling"
detail = """
Sections sec-1/sec-6 call C-point a recall ceiling and treat a C win as evidence for a retriever. C-point is still a fallible best-section Noul ranking at k=10/25, so it can place an available label below k; a loss to B does not prove the BM25 pool was sufficient. The actual pool ceiling is the fraction of snapshot labels present in each candidate pool, independent of ranking. Evidence: .doctrine/slice/277/design.md:23-27,110-118,242-250,268-274; .doctrine/slice/277/research/raw/jev-cookbooks-rerank_typesafe.md:378-382. Report pool coverage/oracle recall separately and qualify the adoption inference.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. Recall-ceiling wording dropped for C-point. The report adds BM25 pool coverage (labels present in the top 50) as the ceiling for A and B arms, and the verdict reads a C win as a retriever signal only where pool coverage shows the pool missing labels C ranks in."

