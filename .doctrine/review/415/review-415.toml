[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "Partial Jev answers can be scored as a complete arm"
detail = """
Section sec-3 sorts unanswered candidates last and sec-6 computes recall, but no rule prevents an arm/slice with missing or malformed answers from entering the paired headline and EVD verdict. A 200 with missing questions would silently depress Jev recall even though the report counts unscored items; in a small B pool they may still enter top-k. Evidence: .doctrine/slice/277/design.md:89-102,208-211,242-254,312-315,332-333; .doctrine/slice/277/research/raw/jev-api.md:180-195. Define retry or invalidation for incomplete arm results, an explicit completeness denominator, and a VT showing partial success cannot masquerade as a valid paired observation.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. In eval the missing questions are retried once; an arm-slice is complete only if every candidate is then answered; incomplete arm-slices are excluded from paired deltas and counted. New VT completeness covers retry-success and retry-failure."

