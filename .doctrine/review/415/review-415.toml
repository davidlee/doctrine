[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "Fix and bound the BM25 pool size"
detail = """
Sections sec-1/sec-2 leave top-N as an unbound parameter, while the headline includes recall@25 and DEC-359 assumes roughly 20 B-list options. At N=20, A and both B arms can return at most 20 entities, making their recall@25 mechanically capped while C can return 25. At N>255, B-list violates Jev's Choice maximum. Evidence: .doctrine/slice/277/design.md:21-27,69-71,119-127,242-250; .doctrine/knowledge/decision/359/record-359.md:1; .doctrine/slice/277/research/raw/jev-api.md:124-125; src/search.rs:220-224. Choose a fixed N of at least 25 and at most 255, record it with every run, and test both bounds.
"""
