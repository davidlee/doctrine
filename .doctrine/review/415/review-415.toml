route = "review"
response = "Accepted as DEC-360: BM25 pool fixed at N = 50 (POOL_SIZE), recorded per run; 25 <= N <= 255 by construction. Packer VT covers 1, 50 and 100 options. design.md What changes, Pipeline step 5, Rankers."

