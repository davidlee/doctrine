[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Estimator cannot prove Jev context limits"
detail = """
Section sec-3 calls bytes/3 deliberately conservative and sec-8 tests only that estimates fit 64k and 32k. Jev applies those limits to actual model tokens, and no documented tokenizer or upper-bound proof supports bytes/3 for every input and JSON overhead. A 100-option Choice or a packed Noul request can therefore produce a 422 even though the VT passes. Evidence: .doctrine/slice/277/design.md:110-130,318-320,357-358; .doctrine/slice/277/research/raw/jev-models.md:15-20; .doctrine/slice/277/research/raw/jev-api.md:329-334. Specify an actual-token safety policy, handling for a context-limit 422, and a boundary test using pathological input.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. Requests pack to 80 percent of each limit (PACK_HEADROOM), list option caps likewise; a 422 naming the context limit is a distinct TooLong outcome that splits a point request or halves list caps, counted; the probe records the 422 body and calibrates bytes/3 against reported usage including dense ASCII (hashes, base64). The claim that bytes/3 is conservative is withdrawn. design.md Client, Rankers, client and packer VTs, Risks."

