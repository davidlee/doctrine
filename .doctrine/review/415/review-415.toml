[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "Point versus list changes the evidence shown"
detail = """
The primary B-list minus B-point comparison is presented as a ranker comparison, but B-point sees all heading sections up to 4k tokens and takes their maximum, whereas B-list sees one body truncated to an equal per-option cap. C-point to C-point-list similarly replaces a full-section score with about 270 tokens per option at 100 options. A difference can be caused by missing text or the max-over-sections rule rather than Choice versus Noul; counting truncations does not separate these causes. Evidence: .doctrine/slice/277/design.md:110-127,144-150,247-253; .doctrine/knowledge/decision/359/record-359.md:1. Add a matched-text comparison or a truncation-stratified analysis before naming a point-versus-list winner.
"""
