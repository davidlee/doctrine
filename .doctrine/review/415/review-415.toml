[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Estimated tokens cannot enforce the spend cap"
detail = """
Section sec-5 promises that a live run aborts before exceeding --cap-usd, but it reserves only bytes/3 estimated tokens before each attempt and replaces that estimate with reported usage after the response. An attempt whose actual usage exceeds the estimate can pass the pre-send check and overspend the cap; retries with no usage also have no verified billable-token bound. Evidence: .doctrine/slice/277/design.md:129-131,192-197,330-331; .doctrine/slice/277/research/raw/jev-models.md:13-20. Define the cap as explicitly estimated exposure or reserve a defensible worst-case bound and test actual-usage overshoot across retries.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. Each attempt, retries included, now reserves the documented per-request worst case (64k input tokens, about 0.0027 USD) before sending; an attempt whose worst case exceeds the remaining cap is not sent; reported usage replaces the reservation, an attempt with no usage stays charged at the worst case. Spend cannot exceed the cap. design.md Budget, Budget VT; slice scope Budget."

