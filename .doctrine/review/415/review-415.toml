route = "review"
response = "Accepted as DEC-360: new arm B-point-matched scores each pool entity with one Noul over exactly its B-list option text. B-list minus B-point-matched isolates the ranker primitive; B-point minus B-point-matched isolates text and best-section effects. C-point-to-list minus C-point is reported as a pipeline comparison only."

