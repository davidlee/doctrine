Section sec-4 prefixes every pointwise section with its canonical ID, and sec-3 uses canonical IDs as Choice option keys. The first-committed scope can already cite those same IDs (for example SL-239's first scope commit cites SL-127 and SPEC-022); BM25 indexes title, body and descriptors but not the entity key. Jev can therefore recover already-named labels by exact ID matching unavailable to A, inflating the apparent reranker gain. Evidence: .doctrine/slice/277/design.md:29-31,119-125,144-146,157-176; .doctrine/slice/239/slice-239.md:12,98-100 (also present in first-add commit 8bb8b2e); src/search.rs:126-147. Report a subset excluding IDs already cited in the query, or equalize ID visibility across arms.
"""
