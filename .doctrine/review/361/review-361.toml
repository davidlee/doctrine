id    = 361
slug  = "reconciliation-review-of-sl-251"
title = "reconciliation review of SL-251"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-251"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "PHASE-06 VT-1 reports FAIL, but EX-5's substance holds — the oracle rode a shared helper instead of inlining the env var"
detail = "Expected: `doctrine slice verify-vt 251` green across all seven phases. Observed: PHASE-06 VT-1 FAILs — 'keyword CARGO_MANIFEST_DIR absent from src/commands/design.rs'. Run down: VT-1's keyword set is [PAYLOAD_CONTRACT_PATH, CARGO_MANIFEST_DIR, ignore] over test_file src/commands/design.rs (plan.toml:321-326). The golden IS there and IS correct — design.rs:2660 reads the committed file from disk with crate::test_support::repo_root().join(PAYLOAD_CONTRACT_PATH), and repo_root() resolves the RUNTIME CARGO_MANIFEST_DIR at test_support.rs:31 with an explicit ancestor-walk fallback. EX-5's requirement ('read FROM DISK at runtime via CARGO_MANIFEST_DIR, never from the embed, because install/ is embedded with no rerun-if-changed and an embed comparison would false-green') is met. verify-vt is a literal keyword grep scoped to one named file; it cannot see through a helper call. Inlining std::env::var to satisfy the grep would duplicate test_support::repo_root and violate STD-001 — the criterion is what is imprecise, not the code. Note this is the SAME defect class IMP-438 carries out of the slice, from the other direction: there, test_file named the wrong tier; here, keywords name an implementation detail rather than the property."
disposition = "aligned"
response = "Confirmed and no change owed. The code is correct and the criterion's keyword set is what is imprecise. design.rs:2660 satisfies EX-5 in substance — the committed install/design-payload-contract.md is read from DISK at runtime, never from the embed — and it does so through crate::test_support::repo_root(), which resolves the runtime CARGO_MANIFEST_DIR at test_support.rs:31. Inlining std::env::var to make the grep green would fork a second copy of repo_root's resolution logic, which STD-001 forbids and which test_support.rs exists to prevent. VT ids are immutable-append and plan.toml is not a reconcile write surface, so the criterion is not edited either; the adjudication lives here instead. No brief entry. The general defect — VT keyword and test_file sets that name an implementation detail or the wrong tier rather than the property — is already carried out of the slice as IMP-438, and this is a second instance of it from the opposite direction."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "design.md §7 attributes ~40 lines of closure-struct fixtures to attestation.rs, which defines no closure struct"
detail = "Expected: every design-target selector matched by real work, per design.md §7's touch-set table. Observed: `doctrine slice conformance 251` reports src/design_run/attestation.rs UNDELIVERED — the one selector nothing touched. The design row (design.md:1643) reads '| src/design_run/attestation.rs | the same, for the closure structs defined here | ~40 test-only |', and §7's following prose (1647-1654) argues at length that an earlier draft was WRONG to omit submission.rs and attestation.rs, because sec-8 pin 1's fixtures sit 'beside each type's definition'. The premise is false for attestation.rs. PHASE-02 already proved it: VT-2 was WAIVED at execution with the reason 'Void on contact: attestation.rs holds no closure struct, and this criterion's own keyword CheckpointActDeclaration names a submission.rs type (825)'. So a correction that was made once, in a waiver on a runtime phase sheet, never reached the design — and design.md is canonical. Two artefacts are wrong and one selector is stale: the §7 row, the §7 prose that reasons from it, and the design-target selector on slice-251.toml that makes conformance report red forever."
disposition = "verified"
response = "Confirmed; the design is the defect and the repair is delegated to /reconcile — see this ledger's Reconciliation Brief, 'Per-slice (direct edit)'. Three artefacts are wrong from one false premise: design.md:1643's touch-set row, the §7 prose at 1647-1654 that reasons from it, and the design-target selector src/design_run/attestation.rs on slice-251.toml. The selector is the load-bearing one — `slice conformance` reads the design-target set, so while it stands this slice reports undelivered forever, and the brief names `doctrine slice selector rm` as the change with the §7 edits as its mirror rather than the other way round. Not fix-now: an audit does not edit design.md, and not tolerated, because leaving canon asserting that closure structs live in attestation.rs is precisely the trap PHASE-02 fell into once already."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "src/commands/cli.rs was touched under a phase-plan bound; sec-6 and sec-8 still describe clap's renderer instead of doctrine's, a correction PHASE-07 explicitly deferred to reconcile"
detail = "Expected: design.md's touch-set and its help-pointer reasoning to match what shipped. Observed: conformance reports src/commands/cli.rs UNDECLARED (10 lines changed). This is not scope creep — PHASE-07's EX-10, appended at planning on 2026-08-16, bound it deliberately: 'EX-4's named mechanism is inert as the tree stands: render_subcommand_help reads cmd.get_about() only (cli.rs:1427), main.rs:285-292 routes every --help through it so clap's own renderer never runs, and long_about occurs zero times in the tree.' The fix was get_long_about().or_else(get_about()), and EX-10 measured the blast radius across 281 help renderings. EX-10 closes: 'sec-6:1518-1522 and sec-8 pin 7's help bullet both reason from clap's renderer rather than doctrine's and owe a correction at reconcile.' That obligation currently exists ONLY in plan.toml prose. plan.toml is not a reconcile write surface — EN/EX/VT ids are immutable-append — so unless it reaches this ledger's brief it dies with the phase sheet, leaving design.md asserting a renderer behaviour the project does not have."
disposition = "verified"
response = "Confirmed; delegated to /reconcile — see the Reconciliation Brief. The cli.rs touch itself is sound and was bound before it was taken: PHASE-07/EX-10 established that doctrine's own render_subcommand_help (cli.rs:1427) reads get_about() only and that main.rs:285-292 routes every --help through it, so clap never renders and EX-4's long_about mechanism was inert. The or_else shape it adopted already existed at cli.rs:1319-1322, and EX-10 measured the blast radius over 281 help renderings rather than asserting it. What is owed is the design catching up: sec-6:1518-1522 and sec-8 pin 7's help bullet still reason from clap's renderer, §7's table still omits cli.rs, and the design-target selector set still omits it. EX-10 named this obligation itself, in plan prose — which is exactly where it would have died, since plan.toml is immutable-append and off-surface for reconcile. Carrying it here is the point of the finding."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "src/design_run/artifact.rs was refactored to share the repo-private-id detector; the design names neither the file nor the hoist"
detail = "Expected: design.md §7 to list every file the slice writes. Observed: conformance reports src/design_run/artifact.rs UNDECLARED (69 lines changed), and it appears nowhere in §7's table (design.md:1633-1645) — though §7's neighbours cite artifact.rs repeatedly as the PRECEDENT the new document follows (design.md:1089-1093, 1281-1284, 1328-1349). What landed: REPO_PRIVATE_PREFIXES (14 entity-id prefixes) and cites_a_repo_private_id() were hoisted out of artifact.rs's private `mod tests` up to module level as #[cfg(test)] pub(crate) items, so payload_contract's own banner test shares one list. The hoist's doc comment names the reason and the rule: 'a copied fourteen-element list is a second description free to drift, which is what STD-001 forbids.' Every added item is #[cfg(test)]; no production path and no wire type moves, so §7's behaviour-preservation claim survives. The work is right and the reasoning is right — the design simply does not record that sharing artifact.rs's detector was part of the plan, so a reader reconstructing the touch-set from canon comes up one file short."
disposition = "verified"
response = "Confirmed; delegated to /reconcile — see the Reconciliation Brief. The refactor is correct and is the one STD-001 asks for: one fourteen-element prefix list shared by both generated assets rather than a copy per asset, hoisted only as far as it had to go (module level, still #[cfg(test)], pub(crate)). Its doc comment records both the rule and the constraint that fixed the placement — a sibling module cannot see a private mod tests. Nothing production moves, so §7's behaviour-preservation claim is untouched. What is owed is narrow: a §7 row for src/design_run/artifact.rs naming the hoist, and a design-target selector so conformance stops reporting it undeclared. Grouped with F-3 in the brief because both are the same repair applied to a different file."

[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "notes.md's Harvest is frozen at PHASE-03 and its Open section asserts PHASE-04..07 unstarted, which is false"
detail = "Expected: the slice's authored notes to describe the slice as it stands at audit. Observed: notes.md:116 reads 'fresh-as-of: 2026-08-15 · PHASE-03 · 00295be85', four phases and a day behind. Its Open section (notes.md:370+) opens with '**PHASE-04..07 unstarted**, and their criteria are authoritative only as far as the design is', while `doctrine slice status SL-251` reports 'phases: 7/7' and the tree carries cc64a24c2, 01f757571, cba1f257f and d7001375c delivering exactly those four. The harvest commit that DID run on the sl-251 branch (b90577f75) recorded ISS-366/two memories/one supersede without moving the fresh-as-of line or retiring the stale Open bullets. Consequence is not cosmetic: the Open section is where the next reader looks for what is still owed, and it currently advertises unstarted work as the headline while the genuinely open items — the sec-8 pin 1 premise, RecordKind::ALL, ISS-362's load on sec-3 — sit below a false lede."
disposition = "fix-now"
response = "Confirmed and fixed in the audit's harvest tail, which owns notes.md. The Harvest fresh-as-of line now reads 2026-08-16 · audit/RV-361 · all 7 phases complete, merged to edge at eddb971c1; Produced gains the PHASE-04..07 execution and plan-amendment commits (cc64a24c2, 01f757571, cba1f257f, d7001375c and 34935b318, be5605b2d, 015099119), the b90577f75/eca2c9a11 harvest and observation commits, the id-collision renumber, the gate and verify-vt results, and the seventh appended criterion PHASE-07/EX-10. The Open section's false lede — 'PHASE-04..07 unstarted' — is retired and replaced by two bullets that are true at audit: where the /reconcile obligations now live (this ledger's brief, because plan.toml is off-surface), and that the attestation.rs trap the old bullet gestured at did in fact reach the audit as F-2. The genuinely open items below it were already accurate and are unchanged."

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Recorded source-deltas cite .doctrine/backlog/improvement/434/, which after the id-collision merge resolves to a different backlog item"
detail = "Expected: the slice's recorded source-deltas to name the artefacts the slice actually produced. Observed: `doctrine slice conformance 251` lists three undeclared adds under .doctrine/backlog/improvement/434/ — the item this slice raised out of PHASE-04..07. Post-merge, id 434 belongs to edge's 'Capsule-execution agent defs and a /capsule-driver skill' (created 2026-08-15, cited by IMP-435 and IMP-436); the item SL-251 raised is now IMP-438. Both branches allocated 434 from the same counter after the merge base de32c856b, and the merge at eddb971c1 kept edge's and re-minted this slice's. So conformance now reads as though SL-251 authored the capsule item. The registry stores commit oid ranges, not path lists, and computes paths at read time from a history that contains the pre-rename paths — there is nothing to edit short of rewriting the branch. Raised so the misreading is on the record rather than waiting to mislead someone reading conformance cold."
disposition = "tolerated"
response = "Confirmed, and accepted as unfixable at acceptable cost. `slice record-delta` stores commit oid ranges, not path lists; conformance computes paths at read time from a history whose commits genuinely contain .doctrine/backlog/improvement/434/. Re-recording the delta over the same range reproduces the same output, so the only true fix is rewriting the sl-251 commits — disproportionate to a provenance smudge on three paths in an advisory report. The cost is bounded and one-directional: conformance's undeclared list over-attributes three backlog paths to this slice. It cannot mislead in the other direction (nothing this slice did is hidden), the code cells are unaffected, and IMP-438 and ISS-439 both carry their own provenance to SL-251 in their relation rows. The mapping is recorded in the ledger Brief, in notes.md's Harvest, and in the eddb971c1 merge message, so a cold reader has three places to hit it."

[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "The capsule driver committed as author 'capsule' with the message 'doctrine', writing three duplicate agent definitions to the repo root"
detail = "Expected: conventional commits scoped by slice id (AGENTS.md), and no parallel copies of tracked content. Observed: be679d544 — author 'capsule', full commit message 'doctrine' — added capsule-orchestrator.md, capsule-phase-planner.md and capsule-worker.md at the REPO ROOT. All three are byte-identical to install/agents/claude/, which is their tracked, embedded home and landed on edge at 479551c00 feat(IMP-434). The likely mechanism: .claude/agents/ is gitignored (.gitignore:4 '/.claude/*'), so an agent trying to persist the definitions it was running under found the live copies untracked and committed them where it stood. Fixed in the merge at eddb971c1 (the three root files removed, nothing lost). Raised anyway because the message and author are the audit trail's only record of which seat wrote that commit, and this slice is the capsule driver's first outing — the harness dropping unroutable artefacts into the tree root is the finding, not the three files."
disposition = "fix-now"
response = "Confirmed; the tree damage is already repaired and the process lesson is recorded. The merge at eddb971c1 removed all three root-level files after verifying each is byte-identical to install/agents/claude/ — the tracked, RustEmbed-published home that landed on edge at 479551c00 — so nothing was lost and no content decision was smuggled into a merge resolution. The commit itself (author 'capsule', message 'doctrine') stands in history; rewriting it is not worth it and the merge message names it. The durable point is not the three files: the capsule driver had no route for state it wanted to persist, found .claude/agents/ gitignored, and wrote to the repo root — a harness with somewhere to put artefacts and no rule about where puts them wherever it stands. Recorded here as this slice's audit trail on the driver's first outing rather than opened as work, since IMP-434 already owns the capsule agent definitions and is the natural home for it."

[[finding]]
id = "F-8"
status = "verified"
severity = "nit"
title = "4663ce278 committed a skills-lock.json hash refresh for a skill neither branch touched — environment drift inside PHASE-02's recorded boundary"
detail = "Expected: a slice's recorded phase boundary to contain only that phase's work. Observed: 4663ce278 'chore: refresh the feedback skill's computed hash in skills-lock.json' changes computedHash for plugins/doctrine/skills/feedback/SKILL.md from 97d0bffd... to 91fa1832..., while `git log de32c856b..edge -- plugins/doctrine/skills/feedback/SKILL.md` and the same range on sl-251 are both EMPTY — neither branch touched the skill source. The file's actual sha256 (6d3b1055...) matches neither lock value, so computedHash is not a plain file digest and the refresh cannot be adjudicated from the tree. notes.md:121-123 already flags it: '4663ce278 is an incidental skills-lock.json hash refresh that falls inside PHASE-02's recorded boundary.' The merge kept the newer value. Low stakes, but it is unreconciled machine state riding a slice's provenance, and the next agent to diff skills-lock will re-derive this from scratch."
disposition = "tolerated"
response = "Confirmed and accepted; the alternative is worse. computedHash is not a plain sha256 of the skill file — the file's actual digest (6d3b1055...) matches neither the old nor the new lock value — so the refresh cannot be adjudicated from the tree, and neither branch touched plugins/doctrine/skills/feedback/SKILL.md at all. Reverting to the pre-refresh value would assert a hash this session cannot compute and would likely be re-refreshed by the plugin manager on next run, trading a stale record for a churning one. The merge kept the newer value. Blast radius is nil for this slice: the lock file is not in the design's touch-set, no test reads it, and the gate is green over it. notes.md:123-125 already records that 4663ce278 falls inside PHASE-02's recorded boundary without being PHASE-02's work, so the provenance smudge is disclosed rather than silent (STD-003's spirit)."

[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "slice selector doctor flags six design-target selectors redundant against a scope-relevant glob, conflating two intents"
detail = "Expected: selector doctor's advisory findings to be actionable. Observed: `doctrine slice selector doctor 251` reports 6 findings, all of the form 'redundant  src/design_run/payload_contract.rs  (subsumed by src/design_run/**)'. The subsuming selector src/design_run/** carries intent scope-relevant; all six subsumed ones carry design-target. Those intents are not interchangeable — `slice conformance` computes its undeclared/undelivered algebra from the design-target set ALONE, so acting on the doctor's advice here would empty the conformance oracle for the whole of src/design_run/ and turn every future touch into a silent pass. The finding is a defect in doctor's subsumption test (it compares path shape without consulting intent), not in this slice's selectors. Raised on this ledger because it fired on this slice's audit and would otherwise be re-derived by whoever audits the next design-run slice; the repair belongs to the selector tooling, not to SL-251."
disposition = "follow-up"
response = "Confirmed, and it is the tooling's defect rather than this slice's — captured as ISS-440, tagged area:conformance / area:slice / cluster:design-run and linked `references(concerns) SL-251`. follow-up is the honest route and not an escape hatch: the two guardrails forbid it for spec/governance findings (this is neither) and as a dodge for a large in-scope code fix (the fix is in selector doctor's subsumption test, a different subsystem from anything SL-251 touches). SL-251's own selectors are NOT changed on this advice — acting on it would delete the design-target set for src/design_run/ and empty the conformance oracle for the very subsystem the slice exists to change, turning every future touch there into a silent pass. That inversion, not the noise, is what ISS-440 records."

