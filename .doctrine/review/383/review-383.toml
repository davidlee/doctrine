[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "gate_facts doc should be its own; observed: runbook_facts' doc comment stranded above gate_facts"
detail = "src/commands/design.rs:2839-2865 — PHASE-01 (25c23a2d0) inserted fn gate_facts between runbook_facts' 17-line doc comment and its fn. The EX-18 hash/embed/IMP-372 prose now prefixes gate_facts' own doc, and runbook_facts (:3000) is undocumented. Rustdoc renders both paragraphs as gate_facts'."
disposition = "fix-now"
response = "Fixed in e8b15c18e: the 16-line doc block moved back above fn runbook_facts; gate_facts keeps only its DEC-292 doc. check quick green."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "conformance should be clean; observed: 2 undeclared source paths, 2 spurious undelivered selectors"
detail = "slice conformance SL-262: undeclared src/design_run/fixture.rs (every_cause/widest_causes test fixtures, PHASE-01/02) and src/design_run/prompt.rs (doc comment retargeted off Runbook::section, PHASE-02) — both legitimate touches missing a design-target selector. undelivered tests/e2e_design_projection.rs and tests/e2e_design_show_golden.rs — both WERE edited (dd1de364a) but credited to the tests/e2e_design_*.rs glob, so the redundant exact selectors read as undelivered. .doctrine/slice/262/{notes.md,plan.toml} undeclared are slice-own authored files (plan EX-9 appended mid-PHASE-02, append-only) — expected."
disposition = "verified"
response = "Delegated to /reconcile (Reconciliation Brief, per-slice): doctrine slice selector add SL-262 src/design_run/fixture.rs src/design_run/prompt.rs --intent design-target; doctrine slice selector rm SL-262 tests/e2e_design_show_golden.rs tests/e2e_design_projection.rs (redundant under the tests/e2e_design_*.rs glob; the edits are real). notes.md/plan.toml are the slice's own authored files — no selector. Conformance tool quirk recorded as a friction observation."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "design.md should describe what shipped; observed: three recorded PHASE-02 departures plus stale sec-1 names"
detail = "notes.md Harvest records PHASE-02 departures from design text: Divergence carries the rendered refusal sentence beside expected/observed; ready built as ApplyRequest{stage, ..ApplyRequest::bare(..)} (bare is the exhaustive literal); VT-5 old-snapshot test covers absent-key + string (TOML has no null) not null + string. design sec-1's mermaid and prose still name observe(...)/Observed, which sec-3 renamed GateFacts/gate_facts. design sec-7 code-impact table omits fixture.rs and prompt.rs."
disposition = "verified"
response = "Delegated to /reconcile (Reconciliation Brief, per-slice design.md direct edit): sec-1 names GateFacts/gate_facts; sec-2 Type gives Divergence its refusal field and Derivation step 6 describes the bare() builder; sec-4 fixture wording (absent key + string); sec-7 table gains fixture.rs and prompt.rs. Code is correct; the design prose lags it."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "governance should carry the derived forward edge; observed: spec REVs owed per design sec-6"
detail = "design sec-6 names the reconcile-time REVs: PRD-019 REQ-414 (pending obligation no longer held — derived); SPEC-029 REQ-437 (forward edge among the named limits, maximal-forward case in the bounding run); SPEC-029 responsibilities (forward look is a projection of the gate-contract table). DEC-293 supersedes the envelope half of SL-233 EX-15; no spec text carries EX-15 (notes)."
disposition = "verified"
response = "Delegated to /reconcile (Reconciliation Brief, governance REV): PRD-019 REQ-414, SPEC-029 REQ-437, SPEC-029 responsibilities, per design sec-6."

[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "design sec-9 read-cost risk should be measured; observed: unmeasured at PHASE-03 close"
detail = "notes Open: every design show/resume now reads design.md and the slice relation record through gate_facts. Measured at audit on built binary: design show --format prompt on SL-243 (drafting, 5 unmet), SL-247 (inquiring), SL-252 (exploring, ready), SL-262 (locked) each 0.00 s wall (time -f %e). Facts are also built at locked, where forward is None — cost is the same two small reads."
disposition = "aligned"
response = "Measured: every read path is 0.00 s wall on real runs across four stages; the risk does not materialise. Building facts at locked costs the same two reads and keeps project() branch-free — not worth special-casing."

