[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = """design sec-5.4's "exact disclosure predicate" omits the Claude MCP wrote-line that sec-5.2 and the code both require"""
detail = """
EXPECTED. Design sec-5.4 heads its disclosure rules "**Exact disclosure predicate.** Three separate conditions, because they answer three different questions", and the first reads: "the MCP **wrote-line** prints iff `h == Codex && matches!(report.mcp, Wired | Refreshed) && !dry_run`".

OBSERVED. Taken literally, no Claude MCP line ever prints. But design sec-5.2's own message contract lists one ("registered MCP server in .mcp.json: <invocation> (Claude)"), and the implementation prints it: verified live on built `21620b316`, `claude: registered MCP server in .mcp.json: ${DOCTRINE_BIN:-doctrine} serve --mcp` on a fresh install and `claude: refreshed MCP server in .mcp.json: ...` over a legacy abspath entry. So the design contradicts itself across two adjacent sections, and the code follows sec-5.2.

The predicate is the artefact an auditor is told to hold the implementation to, so a self-contradiction here is not cosmetic — it is the reason this audit had to choose between two design sentences. Phase ids/criteria are immutable-append, so this is a prose correction, not a criterion change.

Remediation (/reconcile, per-slice direct edit): restate the condition harness-scoped — the Claude arm prints its registered/refreshed line, the Codex arm its single wrote/would-write form — which is also where RV-402 F-4's deferred "should Codex distinguish a refresh from a fresh wire?" question belongs."""
disposition = "design-wrong"
response = """
Delegated to /reconcile. The code follows sec-5.2 and is verified live on both harnesses, so the correction is to the sec-5.4 predicate prose, not to behaviour.

Reconciliation-brief entry: "Per-slice (direct edit)" — restate the first disclosure condition harness-scoped (Claude prints its registered/refreshed line; Codex its single wrote/would-write form), and decide there the coupled RV-402 F-4 question of whether Codex should distinguish a refresh from a fresh wire. Recorded in the brief so the coupling is not lost between ledgers."""

