[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "The hooks probe answers for the user codex layer, not the project file the notice names (carried from RV-402 F-1)"
detail = '''
Carried from RV-402 F-1 (`doctrine show RV-402`), whose evidence this audit re-checked rather than re-derived.

EXPECTED. Design sec-5.2: the probe's `cwd` is "the install root, so the probe answers for the project being installed — `--path`, or install run from a subdirectory, must not probe another tree". PHASE-03/EX-4 implements that literally. The instruction it gates (step 1 of the activation notice) is about the PROJECT file: "Ensure [features] hooks = true in .codex/config.toml".

OBSERVED. `codex features list` (codex-cli 0.155.1) applies a project's `.codex/config.toml` layer only when that project is TRUSTED. Install always runs pre-trust — the notice's own step 2 is "Start codex in this project and accept the project trust prompt", and the trust caveat this slice adds (`src/boot.rs:3309`) states the project layer "is skipped silently" until then. So the probe's answer is the USER layer (`$CODEX_HOME/config.toml`), not the file the notice names.

2x2, cwd = a project whose `.codex/config.toml` is exactly `[features]\nhooks = false`, same binary:
  control   (CODEX_HOME config with no [projects] entry)                             -> `hooks  stable  true`
  treatment (CODEX_HOME config + [projects."<dir>"] trust_level = "trusted")          -> `hooks  stable  false`

Live consequence on a fresh root: the notice printed steps 2 and 3 with step 1 ABSENT, so a project that disables hooks gets no instruction and its hooks stay off silently — the failure POL-003 facet 3 / `DEC-329` exist to prevent. The `Disabled` arm is wrong in the other direction: it names the project file while reporting the user layer's value.

No VT can see this: PHASE-03/VT-2 injects the probe's answer through a fake runner, and VT-3 pins only the PATH-empty failure.

Consequence for this audit: `PHASE-03` EX-4 is satisfied as written, so the defect is the design premise, not the code. Remediation is the design pass's (three options are recorded in RV-402 F-1's response — my recommendation is to read the project file's `[features] hooks` key directly, which also removes the `codex` subprocess and F-5's undeclared dependency). If the chosen option changes the mechanism, a code change follows, which reconcile does not write: that is a further deliverable (a phase or a follow-up item), and the brief says so.

Acceptance condition for the repair, from RV-402 F-1: a test that plants a project `.codex/config.toml` with `[features] hooks = false` and asserts the step-1 instruction is still delivered.'''
disposition = "design-wrong"
response = """
Delegated to /reconcile. The observation stands on the 2x2 and the live run, and PHASE-03/EX-4 is met as written, so the defect is the design premise, not the code — there is no audit-scope code fix to make.

Reconciliation-brief entry: "Per-slice (direct edit)" — design.md sec-5.2 (the probe paragraph) and sec-5.4 (the probe's disclosure bullet), plus the DEC-329 record they descend from: correct the claim that the probe "answers for the project being installed"; a pre-trust codex features list answers for the user layer. Name the chosen remedy (three options and the recommendation are in RV-402 F-1's response).

Explicitly flagged for reconcile, not absorbed: if the chosen remedy changes the probe's mechanism, a code change follows and reconcile does not write code — the brief carries it under "Further deliverables" as a phase or a follow-up item. Acceptance condition: a test that plants a project .codex/config.toml with [features] hooks = false and asserts step 1 is still delivered."""

