[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "SPEC-011 governs no MCP registration requirement, and design sec-5.4 cites REQ-186 — the Claude hook set — for a leg it does not govern"
detail = """
EXPECTED. A slice that adds behaviour to `boot install` writes against the requirement that governs that surface, and design sec-5.4 correctly reaches for a requirement when it fixes the leg's failure mode ("the leg's failure mode is disclosure, not error (SPEC-011 REQ-186)").

OBSERVED. `SPEC-011` — the boot-install harness-wiring contract — contains no requirement covering MCP server registration, for either harness. Its `boot install` requirement set is REQ-185 (import prepend), REQ-186 (Claude hook-set merge), REQ-476 (Claude settings scope/form), REQ-477 (abandoned-scope eviction), REQ-479 (codex hook registry), REQ-480 (pi extensions). A corpus-wide requirement search (`doctrine search -k REQ "MCP server registration .mcp.json mcp_servers boot install harness"`) returns no requirement for `.mcp.json` or `[mcp_servers]`; SPEC-011's own scope enumeration (`doctrine show SPEC-011`, opening clause) lists the import, both hook registries and the pi extensions, and omits the MCP leg entirely.

So the surface is ungoverned twice over: the pre-existing Claude `.mcp.json` leg (added by CHR-013, a closed chore — a backlog item, never a REQ) and the codex `[mcp_servers]` leg this slice adds. And design sec-5.4's citation is to the wrong requirement: REQ-186 governs the Claude *hook set* merge into the settings file, a different leg in a different file; it cannot carry the MCP leg's failure-mode contract. `doctrine coverage` therefore cannot see this behaviour at all.

Consequence: `boot install`'s MCP behaviour — ownership predicate, edit-preservation, the one-wording fallback, the disclosure — has no acceptance criterion outside this slice's own artefacts.

Remediation is a governance write (/reconcile): a REV against SPEC-011 with the two members the plan already owes — a Claude `.mcp.json` registration requirement retro-covering shipped behaviour, and a codex `[mcp_servers]` registration requirement (plan.toml documents the two-member Revision; no phase cites its ids). Extend the spec's scope enumeration to include the leg while there."""
disposition = "design-wrong"
response = """
Delegated to /reconcile. A requirement gap is a governance write, which the audit must never turn into a `follow-up` (it would land the obligation in the backlog instead of canon).

Reconciliation-brief entries: "Governance/spec (REV)" — one SPEC-011 Revision, two members (a Claude .mcp.json registration requirement retro-covering the shipped CHR-013 behaviour; a codex [mcp_servers] registration requirement for this leg), plus the spec's scope enumeration extended to include the leg. "Per-slice (direct edit)" — design.md sec-5.4's citation of REQ-186 re-pointed at the requirement the REV creates.

No plan criterion is disturbed: no phase cites the REV's member ids, and the plan's EX/VT rows are immutable-append in any case."""

