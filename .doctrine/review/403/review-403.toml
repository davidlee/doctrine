[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "`install/**` is a declared design-target that delivered nothing, while the design names install/ docs as a home for the sh declaration"
detail = """
`doctrine slice conformance 271` (run in the fork; the source-delta registry resolves to the primary tree) reports **undelivered (1): `install/**`** — a declared `design-target` selector that matched no actual edit — while design.md:647 names "`README.md`, `install/` docs" as the home for the POL-002 facet 3 `sh` declaration, and `install/claude-activation.md` is a SHIPPED doc about exactly this activation surface (it discusses `.mcp.json`, `boot install` and the `sh`/`DOCTRINE_BIN` override at lines 17, 59, 73-79, 89, 106).

What landed is the README sentence (EX-9 pinned README; VA-1 verified it; confirmed by reading it). So the design permits either home and the implementation chose one — but that leaves two loose ends the audit should not leave implicit:
1. the `install/**` selector in `slice-271.toml` is now a stale declaration that dilutes the review-prime path-set;
2. the shipped corpus — the surface a CLIENT reads, since `install/` is what `doctrine install` projects — carries nothing about the `sh` dependency the client's own `.codex/config.toml` will need, so a client who never reads doctrine's upstream README has the dependency undeclared.

Neither is a correctness defect; both are decisions that must be made rather than drifted. Remediation (/reconcile): either drop `install/**` from the selectors and record that README is the declaration's home, or keep the selector and owe the shipped-corpus sentence as a further deliverable — a docs change reconcile does not write, so it would be a phase or a follow-up item, not a direct edit. Name which in the reconciliation outcome."""
disposition = "design-wrong"
response = """
Delegated to /reconcile — but the disposition is a decision, not a repair, so the response has to keep both branches live rather than pick one unilaterally.

Reconciliation-brief entry: "Per-slice (direct edit)" — either drop the install/** design-target from slice-271.toml and record README as the declaration's home, or keep the selector and owe the shipped-corpus sentence. If the second, the brief's "Further deliverables" carries the docs change, because reconcile's two write surfaces (per-slice artefacts, governance REV) do not include the shipped corpus.

What the audit settles: EX-9 and VA-1 pinned README, README has the sentence, and nothing was dropped that any plan criterion required. What is left open is whether a client who never reads doctrine's upstream README should learn the sh requirement from the corpus projected into their repo."""

