Each of the three phases carries a `VA-1` agent check whose text ends "the agent records the diff check / the sentence and its location / the review **in the slice notes**". None is recorded there:

- PHASE-01/VA-1 (no `plan_mcp_*` / `is_doctrine_mcp_entry_*` assertion edited) — the only record is in the DISPOSABLE runtime sheet, `.doctrine/state/slice/271/phases/phase-01.md:31`, which `rm -rf .doctrine/state` erases; `notes.md` mentions behaviour preservation (`:117`) but not the check.
- PHASE-02/VA-1 (the `sh` sentence and its location recorded) — the notes name "the `sh` declaration" in the harvest lines (`:191`, `:261`) without the sentence or the location.
- PHASE-03/VA-1 (the three disclosure conditions reviewed against design sec-5.4) — recorded nowhere.

SUBSTANCE, discharged by this audit rather than assumed. PHASE-01: `git diff 0da371b37..HEAD -- src/boot.rs` shows the `plan_mcp_*` / `is_doctrine_mcp_entry_*` block to be additions only; the single modified assertion in that region is `assert!(matches!(out.mcp, RefreshOutcome::None))` -> `Wired(_)` at the codex-arm test (src/boot.rs:5608), which PHASE-02/EX-8 sanctions. PHASE-02: `README.md:160-176` names the POSIX-shell requirement and does not claim its absence is silent. PHASE-03: the three conditions (MCP wrote-line, probe trigger, trust caveat) are exercised by PHASE-03/VT-3 and VT-4.

So the substance holds; the plan's recording instruction does not. No change needed — this ledger is now the durable record, and the sheets are disposable by design — but a slice's VA records belong in `notes.md`, and the next one should say so."""
