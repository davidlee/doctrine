[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Degraded mapped to Refused withholds the version stamp"
detail = "install.rs stamp_decision records stamps only when every leg is Done; any Refused prints 'install incomplete: <legs>; version not recorded' and skips the commit hint. Mapping Degraded (e.g. codex not on PATH, normal in the jail) to Refused makes every such install permanently incomplete and unstamped, contradicting DEC-408 'degraded, never failed'. The design's sample line also misquotes the real string. Raised by pi adversarial reviewer (quotient review profile)."
disposition = "fix-now"
response = "Verified install.rs stamp_decision / incomplete_line. Degraded now maps to LegOutcome::Done with a disclosure line, so the version stamp records; only project-entry problems and codex add failures are Refused. Sample corrected to the real 'install incomplete: <legs>; version not recorded' format. sec-leg, sec-report, DEC-408 amended."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified install.rs stamp_decision / incomplete_line. Degraded now maps to LegOutcome::Done with a disclosure line, so the version stamp records; only project-entry problems and codex add failures are Refused. Sample corrected to the real 'install incomplete: <legs>; version not recorded' format. sec-leg, sec-report, DEC-408 amended."

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Near-miss doctrine wrappers are never retired and keep shadowing"
detail = 'The existing ownership predicate (boot.rs keys_ok / env_absent_or_exact) requires keys within {command,args,env_vars} and env_vars exactly ["DOCTRINE_BIN"]. A doctrine wrapper with one added key is Foreign; command = "sh" has no path separator, so it lands in PathShadow: left in place, install incomplete, and the project layer keeps winning, so EVD-032 persists in exactly the repos this slice targets.'
disposition = "fix-now"
response = "Verified boot.rs keys_ok / env_absent_or_exact. OwnedWrapper is now shape-first: command sh, args [-c, line in CODEX_MCP_WRAPPER_FORMS], any other keys; extra keys are listed as removed. sec-leg table, DEC-406 amended."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified boot.rs keys_ok / env_absent_or_exact. OwnedWrapper is now shape-first: command sh, args [-c, line in CODEX_MCP_WRAPPER_FORMS], any other keys; extra keys are listed as removed. sec-leg table, DEC-406 amended."

[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "Existing e2e suites would rewrite the developer's real codex config"
detail = "tests/e2e_install_flow.rs runs install --agent codex ... --yes; tests/common doctrine_cmd sets no HOME/CODEX_HOME. After this slice -y grants consent and the temp repo is outside the exec's root, so the leg would run codex mcp add against ~/.codex/config.toml with target/debug/doctrine. Code impact lists only the two rewritten suites."
disposition = "fix-now"
response = "Verified tests/common doctrine_cmd sets no HOME/CODEX_HOME. doctrine_cmd now points CODEX_HOME at a non-existent path, so every default test degrades before any codex call; codex suites override. Added to code impact, risks, verification (a fake codex on PATH must record no call)."

