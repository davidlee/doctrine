[[finding]]
id = "F-36"
status = "verified"
severity = "blocker"
title = "Expected row 10 to detect inherited descriptors; observed its own enumeration descriptor violates the holding condition"
detail = """Expected: Table A row 10's Single observation must have a realizable no-inheritance holding condition, with the positive control distinguishing the inherited-descriptor case. Observed: the payload is specified to enumerate /proc/self/fd and hold only when no descriptor above 2 appears. Executing the minimal observation `sh -c "ls -1 /proc/self/fd"` produced 0, 1, 2, 3: opening the directory for enumeration creates the observer's own fd above 2. Therefore an otherwise clean process fails the literal condition before any nominated decoy is inherited, and the positive control cannot repair that false baseline. Specify how the observer fd is excluded without hiding inherited fds, or make the property about nominated decoy identities/targets rather than every number above 2."""
disposition = "fixed"
response = """
Upheld, and reproduced before remediating: `sh -c "ls -1 /proc/self/fd"` in a clean process reports 0, 1, 2, 3. Opening the directory to enumerate it creates the observer's own descriptor, so row 10's holding condition was unsatisfiable by the observation that tested it. The probe arm could never reach Proven and the positive control had nothing left to distinguish.

The remediation deliberately does NOT take the second option you offered. Narrowing the row to "none of the nominated decoys appears" is row 11's denylist defect one level down: it passes a backend leaking a descriptor the fixture never thought to nominate, which is the whole of what a closed-descriptor-set property exists to catch. The strength had to survive the fix.

So the payload now resolves every entry rather than counting them, and the row holds when every descriptor above 2 resolves to the payload's own handle on /proc/self/fd. That excludes exactly one descriptor, by identity rather than by number, and it excludes it because the observation created it — a leaked descriptor cannot masquerade as the observer's, since the observer's target is the enumeration directory itself. The claim stays "nothing above 2 that the observation did not itself open".

Recorded as its own subsection in sec-7 because the generalisation is worth more than the row: F-31 was a probe observing a consequence of its property; this was a probe whose own machinery falsified the property it observed. Both are failures to ask what the observation does to the thing observed."""

[[finding]]
id = "F-37"
status = "verified"
severity = "minor"
title = "Expected precise evidence citations; observed jail.rs:806 points at unrelated implementation"
detail = "Expected: SL-248 R1 requires current source claims to carry precise citations that land on their evidence. Observed: a 16-citation source-line sample had 15 supporting landings (93.75%), but both uses of `jail.rs:806` do not. At current subject watermark ec973c1e, `src/worktree/jail.rs:806` is `Vec::with_capacity(policy.extra_rw.len())` in the macOS resolver; it supports neither sec-2's open-by-default network claim nor sec-2's claimed harvest warning. The sampled EVD-013/EVD-014 entity citations did land on the stated measurements. Repair or remove the two misattributed line citations."
disposition = "fixed"
