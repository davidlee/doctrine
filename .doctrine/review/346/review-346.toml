id    = 346
slug  = "sl-248-design-rolling-per-section-external-pass"
title = "SL-248 design — rolling per-section external pass"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "codex"
responder = "claude"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-248"

[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Expected bounded validated mounts; observed lexical roots and mount collisions can expose forbidden host state"
detail = "In `sec-2`, the design says `[capsule] readable_roots` accepts any host directory or file (lines 324-330), preserves host paths as inner paths, and deliberately does not follow symlinks (lines 347-359), while the profile mounts `/proc`, `/dev`, and `/tmp` before all readable entries and mounts writable entries afterward (lines 291-303). A configured root of `/`, `/proc`, `/dev`, `/tmp`, `/source`, the capsule-root parent, or an ancestor of the canonical repository therefore either exposes the host directly or shadows a reserved mount. A root such as `/opt/tools` that is itself a symlink to the canonical repository evades lexical checks: bubblewrap dereferences the source path for `--ro-bind`. I verified this locally with a symlinked declared directory; the marker in its out-of-tree target was readable inside bwrap (`shared-net-symlink-bind=0`). This contradicts the claimed absence of canonical state, credentials, other capsules, and undeclared host state, and `/source` shadowing can substitute the contracted export. Fix by making `CapsulePlacement` construction validating and non-public: reject duplicate/ancestor-overlapping inner mounts and reserved destinations; refuse symlink roots or resolve and validate their targets explicitly; and reject any root equal to or above canonical, control-plane, capsule-parent, or credential scopes. The conformance suite must carry mutants for each collision class."
disposition = "fixed"
response = "Contest upheld, and the gap is exactly as stated: the equal-or-ancestor test admitted every descendant. sec-2 now refuses overlap in both directions — equal to, above, or below any ForbiddenScopes member — with one typed carve-out: a writable entry under this placement own TransactionRoot, minted by the call that exclusively created that directory. A sibling transaction is below the capsule root and not below this root, so it is refused by the same test that admits capsule and agent. The overlap predicate compares resolved paths component-wise rather than by textual prefix, and a control test asserts that a sibling directory whose name merely extends a forbidden scope is still admitted. Seven descendant mutants added, one per scope, including a positive assertion that the carve-out still works so a fix that refuses everything under the capsule root cannot pass."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Expected independent proof of all eight backend clauses; observed teardown and observation collapsed under one control"
detail = "`sec-2` lines 259-264 folds process-tree teardown and trusted observation of resource limits and termination into one property because they would share one control. They are independent enforcement claims. A backend can correctly classify the main process and resource limit while leaving a grandchild alive, or reap every descendant while misclassifying timeout, signal, or file-limit termination. A control that removes both axes cannot establish which guard caused the paired result and violates DEC-156 one-property-removed discipline. Building `sec-7` from seven rows would therefore admit a backend that fails one of SPEC-030 Platform backend contract clauses. Fix by giving teardown and trusted observation separate properties, probes, and one-axis mutants; the suite should cover the eight clauses without this merge."
disposition = "upheld — governance correction pending"
response = "Upheld on the merits and NOT yet fixed, because the fix is a governance edit rather than a design edit. Your argument is correct: teardown and trusted observation are independent enforcement claims, a backend can reap every descendant and still misclassify a timeout as a signal, or classify termination perfectly and leave a grandchild alive, and a control removing both axes at once cannot say which guard produced the paired result. A seven-row suite would therefore admit a backend failing one of the eight clauses. The obstacle is that DEC-156 is an accepted record and states the count as seven. The count is arithmetic inside a decision whose principle, one control per property, is what refutes it, so what is owed is a correction to that number and not to its reasoning. That is the human authors call, not mine to take mid-run. sec-2 now carries the mapping table under an explicit notice recording that F-2 is upheld, that the table stands at seven only until DEC-156 is corrected, and that sec-7 will not be drafted against either count until it is settled. Raised with the human this turn."

[[finding]]
id = "F-3"
status = "answered"
severity = "blocker"
title = "Expected an explicit accepted-base binding; observed a generic readable list and arbitrary CommitId leave the base unproved"
detail = "SPEC-030 requires an explicit base and input set, but `sec-2` row 2 maps only the input list, and `CapsulePlacement` has no semantic base input. In `sec-3`, `ProvisionRequest.base` is an unconstrained `CommitId` (lines 547-554) and the export is only one generic `MountedPath`; no step proves that `base` is the accepted identity or that `/source` denotes the export for that identity. A caller can request base B while placing an export for A at `/source` (or a declared `/source` root can shadow it) and all seven stated backend properties still pass. Fix by accepting or deriving a typed `AcceptedBase` at the trusted boundary, representing the source export as a distinct immutable input bound to that identity rather than an element of a public vector, reserving `/source`, and verifying before clone that the supplied export contains exactly the bound base."
disposition = "fixed"
response = "Contest upheld and the miss was real: the response described the type change and the prose stated it, but ProvisionRequest.base was still CommitId in the code block. The caller obligation was therefore prose, exactly as contested. ProvisionRequest.base is now AcceptedBase. The scope boundary is unchanged and still stated in the text — AcceptedBase carries the assertion that a trusted-side caller resolved the commit as accepted and does not verify it against the canonical accepted ref, because that check is REQ-455 at admission and an explicit Non-Goal."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Expected typed provisioning commands executable through the trait; observed one argv described as three commands"
detail = "`sec-2` defines `Execution` as one typed `argv` and explicitly rejects a shell string (lines 187-200). `sec-3` step 9 nevertheless specifies one `backend.execute` that performs `git clone`, followed by `git switch`, followed by `git remote remove` (lines 576-579). That sequence cannot be represented by the trait. Running only the first argv leaves the checkout state and origin wrong; using `sh -c` reintroduces the quoting boundary the design rejects; running the latter Git commands trusted-side would operate in capsule-authored repository context. Fix by choosing and specifying one real mechanism: multiple backend executions with an observation checked after each, an ordered vector of typed command vectors, or an immutable control-plane-authored helper mounted read-only outside writable state. The trait and provisioning algorithm must agree before later launch and suite sections build on them."
disposition = "fixed"
response = "Upheld — a direct contradiction between the trait and the algorithm, and the best catch in the ledger. Fixed by choosing the first of your three options: step 11 is now three backend.execute calls, one typed argv each, with the Observation checked after each and a refusal on the first non-zero exit, plus a fourth execution at step 12 reading the capsule identity back out of the clone config. The table of the three argvs is in the text. The two rejected options are recorded with their reasons rather than dropped: sh -c reintroduces the quoting hazard on a security boundary that the typed argv exists to avoid, and running commands 2 and 3 trusted-side would put trusted Git in a capsule-authored repository, which SPEC-030 forbids outright. Your third option, a control-plane-authored helper mounted read-only outside writable state, is the spike I4a /rig posture and is the right answer when a capsule-side SEQUENCE must be conditional; for three unconditional commands it buys a mount and a shipped script to save two sandbox starts. Three executions also make each steps termination separately observable, which is better evidence than one aggregate status."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Expected the transaction to bind the backend choice; observed CapsuleTransaction omits BackendId"
detail = "SPEC-030 Transaction authority requires explicit resource and backend choices, and `CapsuleBackend::id` is documented in `sec-2` as the stable identity recorded in a verdict. `sec-3` quotes the transaction inputs but silently drops backend choice, and `CapsuleTransaction` lines 436-459 contains placement and bounds but no `BackendId` or admission identity. After provisioning, the returned value cannot establish which admitted mechanism created or must execute the capsule; a later caller can select a different backend with no detectable contract break, and observations cannot be attributed to the admission verdict. Fix by binding the stable backend identity, and any conformance-verdict/version identity needed to make admission meaningful, into the transaction at provisioning."
disposition = "fixed"
response = "Upheld and fixed: CapsuleTransaction gains a backend field carrying the stable BackendId. I would rate this major rather than blocker, but the defect is real and the fix is cheap, so the severity is not worth contesting. One thing the finding did not raise and the design now states, because accepting the fix silently would have been the worse error: backend is not in DEC-159 enumerated field set, so adding it needs a justification in that decisions own terms. It has one. DEC-159 binds only what has a consumer NOW, and provisioning itself calls execute at step 11, so the backend choice is made inside this slice rather than anticipated for a later one. sec-3 records that alongside the same justification for AcceptedBase. The conformance-verdict identity you also suggest binding is deliberately NOT added: nothing in this slice produces or consumes one beyond the backend verify verdict, and adding a field with no consumer is the thing DEC-159 exists to prevent."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Expected five-axis fresh-state evidence; observed tests and control establish storage axes only"
detail = "`sec-3` lines 629-635 claims to prove checkout, repository, runtime, process, and temporary-state distinctness, but the listed tests cover writable checkout, repository objects, and temporary state only. There is no runtime-state test and no process-state test. The paired control provisions the second transaction into the first root, which demonstrates shared storage when root isolation is removed; it does not make the two executions share a process namespace or process state, so it carries no information for the fifth axis. REQ-450 criterion 1 is therefore not discharged by the stated evidence. Fix by defining the runtime state being tested (for example the agent-home/runtime sentinel), adding a write/absence test and control for it, and adding a concurrent process visibility/signal/orphan probe with a one-process-isolation-property-removed control."
disposition = "fixed"
response = "Upheld and fixed. The draft listed three storage tests for five axes and offered one control for all of them, and you are right that the control carries no information about the process axis, since two capsules sharing a directory still do not share a process namespace. sec-3 now separates the axes by kind in a table: four are storage (checkout, repository, runtime, temporary state) and take the storage control, provisioning the second transaction into the first root; the fifth is not and takes its own. Runtime state is now defined rather than gestured at — a sentinel in the agent home at /agent, the state a harness accumulates across a run — with its own write-and-observe-absence test. The process row runs two capsules CONCURRENTLY: capsule A enumerates /proc and attempts kill -0 on a pid the trusted side observed capsule B running under, asserting positively that Bs process is absent from As /proc and that the signal fails. Its control removes --unshare-pid ALONE, every other property intact, and asserts both become possible, which is DEC-156 discipline applied to an axis with no storage to compare. Eight test titles replace the three."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "Expected credential denial to survive explicit environment construction; observed arbitrary env values bypass the property"
detail = "`sec-2` states that credential denial is achieved by absence from `readable` and `writable` (row 3 and invariant 2), but `Execution.env` is a public full `BTreeMap<EnvName, String>` copied into the capsule. `--clearenv` prevents inheritance only; a caller can explicitly pass `AWS_SECRET_ACCESS_KEY`, `GITHUB_TOKEN`, credential-helper variables, or another control-plane credential value and the backend still satisfies every stated mount assertion. A conformance suite using a benign map cannot prevent this in production. Fix by making the environment a validated contract type with an explicit allowed vocabulary and credential-denial rules, or by specifying a separately governed scoped credential capability. The present SPEC-030 contract has no such exception, so arbitrary values cannot remain in the backend API."
disposition = "fixed — remedy restated"
response = "Upheld: the defect is real and structural. --clearenv stops inheritance only, so an open BTreeMap of environment values is a second unguarded route for exactly the credentials the mount set denies, and claiming credential denial rests on absence from readable and writable was false while that field existed. Fixed, but by a narrower remedy than the finding proposes, and the difference is deliberate. Your framing implies credentials must never cross into a capsule; that overreaches. The spike binds one credential file read-only inside the agent home (sandbox.sh:248-250) and records it as strictly NARROWER than the whole ~/.claude bind it replaced, and the launch slice will legitimately need to give a harness a credential. REQ-448 and REQ-459 credential clause is about a capsule reaching or mutating the CONTROL PLANE credential store, not about a capsule never holding one. So the remedy is scoped to this slice altitude: Execution.env becomes a closed CapsuleEnvVar vocabulary (Path, Home, Term, and the four git identity variables) whose values are all computed trusted-side from the placement, with no public route carrying caller-supplied environment text. This slice needs no others — its only capsule executions are the provisioning git commands and the sec-7 probes. sec-2 states explicitly that widening this vocabulary is a later slice decision that must arrive with its own governed rule, and that a scoped credential CAPABILITY is not an open map. Two test titles added."

[[finding]]
id = "F-8"
status = "answered"
severity = "major"
title = "Expected idempotent immutable export publication; observed the concurrent loser and existing-export validation are unspecified"
detail = "`sec-3` step 6 says an export is idempotently reused when it already holds `base`, and invariant 2 says concurrent builders use a temporary name and rename into place. It does not define unique temporary ownership, no-replace publication, what the rename loser does, or what proves an existing directory is the exact immutable export rather than a symlink, partial/corrupt repository, repository with alternates, or repository containing extra refs/objects. Two concurrent builders can produce one rename failure rather than idempotent reuse, and a weak `holds base` check can bind more host object state than the per-base export decision permits. Fix by specifying an atomic publish protocol: uniquely owned temp directory, full export validation, symlink refusal, no-replace rename, loser validation and reuse of the winner, cleanup only of the caller-owned temp, and an exact invariant for refs/config/alternates/object closure."
disposition = "fixed"
response = "Contest upheld. The temporary export directory is created before step 9, so at that point nothing has established that this call owns the id — collision-resistant is not collision-free, and a retry with the same id is not improbable at all. It is now created with the same mkdir semantics that fail when the path exists, holds its own creation token, and an existing path refuses rather than being entered, cleaned or reused. Ownership rests on the exclusive create, not on the id entropy; the name is merely derived from the id. Two calls holding the same id both refuse. Test added: provision_onto_an_existing_temporary_export_directory_refuses_and_removes_nothing."

[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "Expected rollback to remove only newly owned empty state; observed transaction-root ownership and collision handling are unstated"
detail = "`sec-3` says the transaction id is allocated trusted-side, step 7 creates `tx/<id>`, and rollback recursively removes that path after failure. The function signature supplies neither a preallocated id nor an allocator seam, and the design does not require an exclusive atomic create or refusal when the path already exists. On an allocator collision or retry with the same id, an implementation using recursive directory creation can enter an existing transaction root and later delete work it did not create, contradicting the rollback rationale and REQ-461. Fix by specifying where collision-resistant identity comes from, requiring atomic exclusive creation of the root, retaining a creation/ownership token, and making rollback refuse deletion unless that exact call created the root and no transaction was returned."
disposition = "fixed"
response = "Contest upheld, and it is the better half of the finding. The transaction id is now a ProvisionRequest field allocated by the caller rather than something provision mints, which follows the project pure/imperative rule that the impure value is read in the outer shell and passed in — the same pattern the existing date and uid inputs use. The collision branch is therefore reached deterministically by handing the same TransactionId twice, and the existing-root test can actually be written. HostFacts stays clock-free and gains no allocator, so no identity input arrives through the back door. TransactionId refuses a value that is not a single path component."

[[finding]]
id = "F-10"
status = "answered"
severity = "blocker"
title = "Expected forbidden scopes to reject every overlap; observed descendants remain bindable"
detail = "Expected: CapsulePlacement validation prevents every declared readable root and resolver result from reaching canonical repository state, control-plane state, credentials, or another capsule, while permitting only the current transaction directories that provisioning owns. Observed: sec-2 lines 219-221 reject a resolved host path only when it equals or is an ancestor of a ForbiddenScopes member. A descendant such as repository/.git/config, credentials/token, or capsule-root/tx/sibling therefore passes. sec-5 lines 1529-1536 says capsule_root protects siblings by relying on provisioning to compute only current-transaction paths, but configured readable-roots and closure-resolver output are also provisioning-computed and can name any descendant. The design needs provenance-aware categories: bidirectional overlap rejection for declared and resolved readable inputs, with a narrow carve-out only for validated current-transaction writable paths, plus descendant mutants for every forbidden scope."
disposition = "fixed"
response = "Upheld — blocker, and the reasoning it refutes was mine. sec-2 lines 219-221 checked equality and ancestry only, and sec-5 rested the sibling case on provenance: provisioning computes every path in a placement, so it computes only its own. That is false in the way you name — readable-roots entries and closure-resolver output are provisioning-computed in the same sense and can name any path at all, so repository/.git/config, credentials/token and capsule-root/tx/sibling all passed. Provenance was doing no work. The rule is now geometric and bidirectional, with the carve-out typed rather than described: writable entries under this placement own TransactionRoot are admitted, everything else overlapping a forbidden scope in either direction refuses, and readable entries get no carve-out at all. Descendant mutants added per scope, plus the extends-the-name control and a positive carve-out assertion. sec-5 paragraph rewritten and the refuted argument kept visible rather than deleted."

[[finding]]
id = "F-11"
status = "answered"
severity = "blocker"
title = "Expected strict verification-row schema; observed nested unknown and missing keys lack refusals"
detail = "Expected: REQ-449 strictness applies to the entire interpretation block, so every unknown key and every missing required key is refused before a policy is normalized, hashed, or executed. Observed: sec-4 lines 1110-1115 defines an explicit walk only for the interpretation table key set, while lines 1133-1135 validate only a non-empty verification sequence, non-empty argv, and non-empty arguments. It never specifies refusal of an unknown key inside a verification row, a row missing argv, or a wrong row shape. A row containing argv plus extra = true therefore has no defined refusal and may be silently projected out of the canonical typed value. Walk each verification row recursively against the sole argv key, give missing, unknown, and wrong-type cases typed refusals, and add real-parser tests."
disposition = "fixed"
response = "Upheld — blocker. The walk covered the interpretation table and then dropped to non-emptiness checks for rows, so a row spelled argv plus extra had no defined refusal and would have been projected out silently. Strictness that stops at the first level is a strict outer table wrapping a tolerant inner one, which is not what REQ-449 criterion 1 asks for. Each row is now walked against its own known key set — argv and nothing else — with RowKeyMissing and UnknownRowKey distinguished for the same reason KeyMissing and UnknownKey are at the table level, plus MalformedVerificationRow for a row that is not a table and for argv that is not an array of strings. Four test titles added against the real parser."

[[finding]]
id = "F-12"
status = "answered"
severity = "major"
title = "Expected checked bound arithmetic; observed MiB conversion can overflow before construction"
detail = "Expected: every accepted numeric config value converts once into ByteCount or Duration without panic, wraparound, or ambiguity; an unrepresentable bound refuses naming its key. Observed: sec-5 lines 1397-1402 says expected-capsule-size-mib and file-size-cap-mib convert into u64-backed ByteCount, but overflow handling is specified only for statvfs multiplication at lines 1604-1608 and warning-threshold multiplication at lines 1614-1616. The refusal table has no conversion-overflow case, and the tests cover only threshold saturation. Any MiB value above floor(u64::MAX / 1048576) leaves construction undefined. Use checked unit conversion with a named BoundOverflows key refusal and boundary tests for both size keys."
disposition = "fixed"
response = "Upheld. Overflow was specified for the statvfs multiplication and the threshold multiplication and not for the MiB-to-byte conversion that feeds both, which left construction undefined above u64::MAX over 1048576 and every downstream saturation argument resting on an unchecked value. Conversion is now checked, with BoundOverflows naming the key, and the tests pin both sides of the boundary rather than only the overflow."

[[finding]]
id = "F-13"
status = "answered"
severity = "major"
title = "Expected a reachable early-warning tier; observed multiplier one erases it"
detail = "Expected: every accepted capacity policy preserves REQ-461 criterion 1 by having a non-empty region that warns before the insufficient refusal boundary. Observed: sec-5 lines 1414-1416 accepts capacity-warn-multiplier >= 1, but the tier definition at lines 1618-1623 makes Low equal to expected <= available < expected times multiplier. At multiplier 1 that interval is empty, so no available-space value can emit the conspicuous warning. The refusal and tests reject only values below one. Require a multiplier greater than one, or define explicit multiplier-one semantics that still produces the required warning, and pin the boundary."
disposition = "fixed"
response = "Upheld, and the check is now stronger than the argument that produced the original one. The draft refused below one on an inversion argument; you are right that at exactly one the region expected to expected-times-multiplier is empty, so no available-space value can ever emit the warning REQ-461 criterion 1 requires — the policy would be accepted and the requirement silently unmet. The multiplier must now be strictly greater than one, refusing with WarnMultiplierNotAboveOne, and both the one and zero cases are pinned."

[[finding]]
id = "F-14"
status = "answered"
severity = "minor"
title = "Expected a clock-free HostFacts boundary; observed sec-3 still requests a clock"
detail = "Expected: the no-clock ruling is consistent everywhere, since provisioning consumes no timestamp and src/clock.rs remains the sole wall-clock home. Observed: sec-5 lines 1554-1559 correctly removes clock from HostFacts, but sec-3 line 784 still documents the host argument as clock, statvfs, path existence. That is the signature sketch an implementer meets first and it directly contradicts the later trait. Remove clock from the sec-3 comment and add the transaction-id source explicitly rather than letting clock return as an accidental identity input."
disposition = "fixed"
response = "Upheld — my own inconsistency, ruled in sec-5 and not swept into sec-3. The signature comment now reads statvfs, resolution, path existence, environment. The transaction-id source is made explicit in the same edit rather than left where a clock could return as an accidental identity input: it is a ProvisionRequest field allocated by the caller, which is also what makes F-9 testable."

[[finding]]
id = "F-15"
status = "answered"
severity = "major"
title = "Expected defaults matched to measured properties; observed no evidence for the per-file cap"
detail = "Expected: at R1 evidence altitude, each enforced default is tied to the quantity actually measured, and known-failing or unmeasured values are not presented as generally usable optional defaults. Observed: scripts/spike-capsule/capsule/sandbox.sh uses one disk_cap for both RLIMIT_FSIZE and a whole-tree du check, and maps either leg to the same resource-cap outcome. The recorded heavy 4.4 GiB point is peak whole-tree use and cannot establish the largest file or which disk leg fired. Sec-5 lines 1393-1395 and 1661-1665 drop the whole-tree cap but retain 256 MiB as a per-file default attributed to the spike; the 300s default is separately known to have failed at 352s. Calling all defaults a guess that every project should override is honest about uncertainty, but optional enforced defaults still terminate work. Either require explicit execution bounds, choose and justify conservative values from the heavy fixture where the measurement matches, or gather separate maximum-file evidence before assigning the per-file default."
disposition = "fixed"
response = "Upheld, and it is the sharpest finding of the round. The spike used one disk_cap for both ulimit -f and the whole-tree du and mapped either leg to one outcome, so its 256 MiB figure measures neither the largest file nor which limit fired; and 300s is not merely unmeasured but falsified at 352s. An optional default terminates work, so shipping either as a default presents an unmeasured value as generally usable. execution-timeout-seconds and file-size-cap-mib are now REQUIRED keys — absent, provisioning refuses naming the key. execution-kill-grace-seconds keeps its default of 5, which is directly measured and is a window between two signals rather than a bound that ends work. expected-capsule-size-mib keeps its default, and your argument re-anchors it rather than removing it: it denotes whole-tree size, which is exactly the quantity the 4.4 GiB peak measured, REQ-461 criterion 2 contemplates a default there, and the tier it feeds warns rather than terminates."

[[finding]]
id = "F-16"
status = "answered"
severity = "major"
title = "Expected an absolute root outside the repo; observed relative HOME yields a relative root"
detail = "Expected: CapsuleConfig.root is always absolute and resolved, and the default cannot land in the repository or current working directory. Observed: sec-5 lines 1516-1520 ignores a relative XDG_DATA_HOME but joins HOME with .local/share without requiring HOME to be absolute or non-empty. HOME=relative therefore produces a relative capsule root, contradicting the type claim at line 1431 and invariant 4 at lines 1678-1680; the refusal set and root tests contain no relative-HOME case. Require an absolute non-empty HOME before joining, otherwise refuse naming root, and add both relative and empty HOME tests."
disposition = "fixed"
response = "Upheld. The draft rejected a relative XDG_DATA_HOME and then joined HOME unconditionally, so HOME relative or empty produced a relative capsule root — contradicting the type own claim and invariant 4, and in the empty case rooting capsules under the current working directory, which on an ordinary invocation is the repository. That is precisely the outcome DEC-158 rules out, reached through a variable nobody validated. Both variables are now held to the same test — set, non-empty, absolute — an unusable value is skipped rather than joined, and the arm falls through to the refusal. Relative-HOME, empty-HOME and a no-resolution-path-yields-a-relative-root case are all pinned."

[[finding]]
id = "F-17"
status = "answered"
severity = "minor"
title = "Expected deterministic restriction refusals; observed inserted rows contradict the diagnosis"
detail = "Expected: rule 4 of the restriction algebra deterministically classifies row removal, reorder, replacement, and insertion as the design and named tests promise. Observed: sec-4 lines 1211-1217 says a base row is Reordered only when all base rows appear but not in base order, and otherwise an index mismatch is Replaced; yet inserting a row before or between base rows leaves the base rows in their original relative order. The stated algorithm therefore selects Replaced for the insertion examples while the text and test at line 1290 require Reordered. The policy still refuses, so this is not a security blocker, but the implementable diagnostic contract is contradictory. Define precedence using prefix and subsequence checks and align the test title."
disposition = "fixed"
response = "Upheld. Three predicates over the same pair of sequences were producing two contradictory answers: an insertion leaves the base rows in their original relative order, so neither the reordering test nor the replacement test described it, while the prose and the test title claimed Reordered. The diagnosis is now an ordered classification — removed, then inserted by subsequence check, then reordered, then replaced — with prefix deciding acceptance and subsequence deciding which refusal. VerificationRowInserted is a new variant. The test titles are aligned and a case is added asserting the classification order itself, so a refinement that both removes and reorders reports Removed."

[[finding]]
id = "F-18"
status = "answered"
severity = "blocker"
title = "Expected the process-freshness control to be executable through the backend contract; observed no way to obtain a live payload PID"
detail = "sec-7 Table B row B5 requires two concurrent capsules and says the trusted side observes the subject payload PID, then renders that PID into the observer argv; it explicitly rejects a PID reported by the subject. But sec-2 exposes only synchronous CapsuleBackend::execute and ConformanceBackend::execute_weakened calls returning Observation after execution completes. Neither returns a start handle, exposes a running PID, accepts a PID callback, or gives the harness another observation seam. A thread can keep execute in flight but cannot learn the child PID through this interface. Therefore the control added in response to RV-346 F-6 is not implementable as specified, and REQ-450 criterion 1 cannot be credited to Table B until the contract carries a trusted live-process observation mechanism."
disposition = "fixed"
response = """
Upheld. Confirmed by reading sec-2: CapsuleBackend::execute is synchronous and yields only an Observation after the run completes, so a harness holding it in flight on a thread cannot name the process it started, and sec-7 rightly refuses a pid the subject reports (invariant 9, REQ-448 criterion 3). The control was unbuildable as specified — the same defect class as the SharedRoot mistake this ledger already found, and it arrived in the remediation for F-3..F-6.

Fix: ConformanceBackend gains execute_observed(placement, execution, &dyn Fn(HostPid)), called once trusted-side after the capsule's top-level process exists and before the call returns. HostPid is a newtype over the host-namespace pid, and sec-7 now states why a host-namespace pid is the right value to send in: under the probe arm the observer's own pid namespace does not contain that number, and under the ProcessVisibility control it does — so the row discriminates for the isolation reason rather than an arithmetic one.

The seam is on ConformanceBackend, not CapsuleBackend, so invariant 6 holds: production keeps no admission affordance. It also makes observability part of what admission costs — a backend that cannot name the process it spawned cannot have its process-isolation property controlled, and refusing to admit it is correct. Two new indeterminacy cases are specified so the seam cannot yield a false pass: execute_observed returning without calling back, and the subject exiting before the observer runs. Both classify Indeterminate, never Held."""

[[finding]]
id = "F-19"
status = "answered"
severity = "blocker"
title = "Expected admission to reject writable immutable inputs; observed every listed probe passes a backend that uses writable binds"
detail = "sec-2 requires the per-base export and every declared readable input to be bound read-only, while sec-9 residual 1 relies on no capsule being able to alter a declared path. Table A row 2 only executes from each bound path, rows 3 and 4 only test absence/read reach, and Table B mutates transaction-local paths; no row attempts a write through a readable mount or the shared source export. A BubblewrapBackend mutant replacing ro-bind with bind for readable inputs therefore preserves every listed observation while giving capsules mutable shared host/toolchain/export state. Execution confirms the mechanism: bwrap --ro-bind / / --bind HOST HOST followed by a capsule write changed the host marker to capsule-mutated with exit 0. This violates the explicit immutable-input and fresh-state contract, invalidates sec-9 residual 1 as stated, and means REQ-459 criterion 1 is not discharged by Table A."
disposition = "fixed"
response = """
Upheld, and it is the most serious finding on this ledger. Verified by walking the tables: row 1 writes to /capsule/out (writable by design), row 2 executes from bound paths, rows 3-4 establish that undeclared things are unreachable, rows 5-8 touch no mount, table B writes only transaction-local paths that are supposed to be writable, table C reads. No row ever wrote to something it had asked to be read-only, so the single guard DEC-157 depends on was the one guard never seen to fire.

Fix: a ninth property. SPEC-030 clause 2 — 'an explicit base and input set' — carries two independently failable claims. Row 2 proves the set is bounded; row 9 proves it is immutable. Neither implies the other. Row 9's probe writes through each readable mount and into /source and requires every write to fail; its control is PropertyRemoval::InputsWritable, which rebinds those mounts writable and changes no mount's presence and no path — a single delta whose mechanism (the read-onlyness of a binding present under both arms) is unique to the row, so it satisfies the same rule rows 3 and 4 are held to.

Containment is structural, not careful: row 9's readable entries are fixture-owned decoys under the fixture's own root, and the /source it writes to is a per-run export the fixture built for itself, never one a real transaction adopts. A control arm that could corrupt the shared export would damage the property it tests.

Consequential changes: sec-2 gains invariant 11 (what is readable is read-only, and it is an executed claim) with an explicit note that invariant 4 does not imply it — absence says nothing about how present paths are attached. sec-9 residual 1 cited invariant 4 for exactly that inference and has been rewritten; its dismissal of the resolution-time race now rests on row 9 rather than on an invariant that did not cover it. sec-8 records that REQ-459 criterion 1 was not discharged before row 9 existed. DEC-156's count moves eight to nine and its one-to-one-with-the-clauses sentence is withdrawn: nine rows over eight clauses, one clause covered twice. Human-authorised, as the seven-to-eight correction was."""

[[finding]]
id = "F-20"
status = "answered"
severity = "blocker"
title = "Expected the unconditional admission test to run in the supported jail; observed the exact nested profile cannot create its network namespace"
detail = "sec-7 and sec-9 residual 3 claim the supported Linux bubblewrap development jail runs the suite unconditionally, relying on DEC-160 session evidence that nested bubblewrap works. In the current NixOS bubblewrap review jail, the exact recorded command bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-all -- /bin/sh -c echo nested-ok exits 1 with loopback: Failed to create NETLINK_ROUTE socket: Operation not permitted. The discriminating controls show the failure is the denied-network leg: the same command with --share-net succeeds, the explicit non-network namespace set succeeds, and --unshare-net alone fails. Since Table A row 5 and the normal backend profile require the failing default-denied network namespace, the unconditional test would make cargo test fail in the stated supported environment; the residual is not confined to macOS and must be reconciled before the checked-set ruling can stand."
disposition = "contested-not-reproduced"
response = """
Not upheld as stated; the mechanism it exhibits is kept. Ran the exact recorded command and its three discriminating controls in this project's jail:

  bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-all -- /bin/sh -c 'echo nested-ok'   -> nested-ok, exit 0
  ... --unshare-all --share-net ...                                                                        -> nested-ok, exit 0
  ... --unshare-net (alone) ...                                                                            -> nested-ok, exit 0
  ... --unshare-user --unshare-ipc --unshare-pid --unshare-uts --unshare-cgroup ...                        -> nested-ok, exit 0

All four succeed, including the leg the finding names as failing. That is the positive control the claim needed and it contradicts it, so 'the supported Linux bubblewrap development jail cannot run the suite' is withdrawn.

The likely cause of the observation: this review ran under a codex sandbox set to workspace-write, whose Linux seccomp filter denies network syscalls by default. socket(AF_NETLINK, ...) is what bubblewrap opens to bring up loopback in a fresh netns, and 'Failed to create NETLINK_ROUTE socket: Operation not permitted' is what that denial looks like. The measurement was of a layer wrapping the jail, not of the jail.

The general fact survives and is now recorded rather than discarded, because it is worth more than the specific claim was: any confinement layer that denies network-namespace setup makes row 5's probe arm, and therefore admission, impossible on that host — an agent sandbox is such a layer and so is a seccomp-filtered CI runner. sec-7's unconditional-Admitted paragraph now carries the re-measurement, the withdrawal, and the general form. sec-9 residual 3 is retitled from 'a macOS development host' to 'a host that cannot run the backend', and it now names the open question this design does not settle: what a CI environment that denies the namespaces should do. DEC-160's nested-bubblewrap claim gains the same caveat — true of the arrangements measured, not of every runner."""

[[finding]]
id = "F-21"
status = "answered"
severity = "blocker"
title = "Expected default-members to change only the checked set; observed it also selects the unreleased control package for packaging and publish"
detail = "sec-8 calls default-members = [dot, crates/doctrine-control] the whole checked-set change, while sec-6 and sec-9 require doctrine-control to be built but not released and defer its distribution contract. A minimal workspace using that exact default-members shape showed bare cargo package assembling both the root package and doctrine-control. Cargo publish has the same default-member package-selection surface, and this repository justfile publish recipe is the bare cargo publish --allow-dirty form. The proposed doctrine-control manifest is not specified with publish = false and the publish recipe is explicitly declared unchanged, so the next normal crates.io release selects the supposedly unreleased package. The same probe also showed cargo fmt formats all workspace members including cordage, so default-members is not what extends formatting and cordage is not outside that part of the fast loop. The design must explicitly prevent publication or path-limit the recipe, and then restate the actual checked-set effects."
disposition = "fixed"
response = """
Upheld, both halves, and reproduced.

Publish selection: a minimal workspace with default-members = ['.', 'crates/sub'] packaged both members under a bare cargo package, and just publish is the bare 'cargo publish --allow-dirty' form. So the design's 'built but not released' would have been violated by the next ordinary release.

The fix is two changes, and the measurement shows why neither alone is enough — they fail in opposite directions. publish = false in the new crate's manifest does NOT make a bare cargo publish skip the member: it makes the whole command fail with 'error: sub cannot be published' (verified with cargo publish --dry-run). So the manifest key alone breaks releases rather than protecting them. And a path-limited recipe alone leaves nothing stating the intent durably. Both land: publish = false in crates/doctrine-control/Cargo.toml, and 'cargo publish -p doctrine' in the justfile. Verified that -p selection gets past member selection with a publish = false sibling present. pkg-check already passes -p doctrine and needs nothing.

Second half also upheld: cargo fmt formats every workspace member regardless of default-members — verified by excluding a member from the default set and watching fmt reformat it anyway. sec-8's checked-set paragraph said the ruling extends fmt, lint, build and test; it now says lint, build and test, and states explicitly that formatting already reached the new crate and that cordage was never outside that leg. sec-8 also no longer claims default-members is 'the whole of the checked-set change' — it is a package-selection default, and its reach into packaging and publishing is now stated where the ruling is made.

Touch-set consequence: the justfile joins it, correcting sec-8's own claim two paragraphs later that the release arrangement does not change."""

[[finding]]
id = "F-22"
status = "answered"
severity = "major"
title = "Expected the whole-diff table to include generated workspace metadata; observed Cargo.lock is omitted and a locked build refuses"
detail = "sec-8 says its modified-path table is the whole diff but omits Cargo.lock. In a minimal root-package workspace matching the design, I generated the lockfile with root plus cordage, then added doctrine-control as a workspace/default member with its path dependency on the root lib. cargo build --locked exited 101: cannot update the lock file because --locked was passed. Regenerating added a doctrine-control package entry. This repository treats Cargo.lock as release-owned input and the Nix/crane path consumes it, so implementation necessarily modifies Cargo.lock even with no new registry dependency. The touch-set and phase scope are incomplete until it is named."
disposition = "fixed"
response = "Upheld. Adding a workspace member rewrites Cargo.lock whether or not a registry dependency arrives; cargo build --locked refuses against a stale one; this repo commits it and the crane build consumes it. It is now a row in sec-8's modified-paths table, and sec-9's corrections list names it among four paths the slice's authored Affected surface omits (with the workspace Cargo.toml, the justfile publish recipe, and the [package] include allow-list). Cargo.lock has also been added to the slice's design-target selectors."

[[finding]]
id = "F-23"
status = "answered"
severity = "major"
title = "Expected the public-library alternative to require a source enumeration; observed one negative include rule cleanly omits the lib target"
detail = "sec-9 R7 accepts a new public semver surface after rejecting exclusion of src/lib.rs on the claim that exclusion would require replacing the package include allow-list with an enumeration. A minimal package with the same include = [slash src glob] shape and both src/main.rs and src/lib.rs disproves that premise: adding the single pattern !/src/lib.rs made cargo package -p rootpkg --list omit the library, and full cargo package verified successfully with the explicit warning that the library was ignored because src/lib.rs was not included. The remaining tradeoff, a published binary-only crate differing from the local workspace package, is real, but the asserted enumeration cost is not. Because publishing the five exports creates durable semver obligations, R7 must re-evaluate the actual one-line alternative rather than accept the API on a false cost."
disposition = "fixed"
response = """
Upheld — the premise was false and the position it supported is reversed. Reproduced on a minimal package with the same include shape: adding the single pattern '!/src/lib.rs' makes cargo package --list omit the library, and cargo package completes with a warning that it was ignored because its source was not included. include takes gitignore-style patterns, negation included, so no enumeration is required.

R7 is rewritten. The design now takes the exclusion rather than accepting the API: the five exported items exist for doctrine-control, which lives in this workspace and is never published, so publishing them buys nothing and creates durable semver obligations. The remaining tradeoff is the one you named and it is stated rather than waved past — the published crate differs from the built one, having a bin target where the workspace package has both. That is tolerable because nothing downstream builds doctrine-control from a published doctrine, and because cargo install and binstall want the binary. It is not free of hazard: a divergence between packaged and local source is the same shape as the crane embed-strip trap that shipped a hollow binary at v0.5.0. So the exclusion is asserted rather than trusted — pkg-check, which already asserts that force-included embed roots survive packaging, gains the opposite assertion for this path. Both edits are in sec-8's touch-set.

The export-set test keeps its job unchanged; it was never there to protect crates.io consumers, it bounds what doctrine-control can reach across the workspace boundary."""

[[finding]]
id = "F-24"
status = "answered"
severity = "major"
title = "Expected REQ-461 closure to execute the real capacity comparison; observed its only filesystem proof may skip and closure disclaims it"
detail = "REQ-461 criterion 1 requires provisioning to compare available space at the capsule location. sec-5 assigns the real mechanism to SystemHost statvfs on the capsule root and says filesystem claims are executed in sec-7 Table C, but that row reports Skipped whenever the repository and capsule root share a filesystem. sec-8 then marks REQ-461 satisfied using only pure capacity/configuration tests and explicitly says closure does not rest on the executed row. Those pure tests exercise arithmetic and fixture HostFacts; they cannot detect a SystemHost that probes the wrong path, returns a manufactured figure, or never calls statvfs. Under the slice standing discipline, a filesystem claim needs non-skippable execution on a discriminating reproduction. The requirement cannot move to satisfied until such evidence exists or the executed row is made mandatory on a fixture that actually supplies distinct filesystems."
disposition = "fixed"
response = """
Upheld. Pure tests over a fixture HostFacts exercise arithmetic and cannot observe whether the real probe is ever called, on what path, or against what quantity — and the one executed row skipped wherever the capsule root and repository share a filesystem. Marking REQ-461 satisfied while explicitly disclaiming its only executed evidence was not defensible under this slice's own standing discipline.

Fix: table C's capacity claim splits into two rows. The first is unconditional — the fixture calls SystemHost on its own capsule root and requires agreement, within one allocation unit, with a statvfs the test performs itself on the same path. That rules out never calling statvfs, a manufactured or cached figure, and reading the wrong quantity, and it needs no particular disk layout so it never skips. The second is the wrong-path discriminator, which is only observable across filesystems: the fixture selects a path on a second filesystem from the host's own mounts at build time and asserts the two figures differ and each matches an independent statvfs. It does not wait for the operator's disk layout to differ — on Linux a tmpfs is present at /dev/shm or /tmp, and measured here the real-disk capsule root and the tmpfs reported 272 GiB against 32 GiB. Where no second filesystem is found the row reports skipped naming that reason.

REQ-461 stays satisfied, but closure now rests on the unconditional row rather than on pure tests with a disclaimer. sec-8's closure table says so, and records that this row moved in round 3."""

[[finding]]
id = "F-25"
status = "answered"
severity = "blocker"
title = "Expected the typed source export to pass placement validation; observed the sole capsule-root carve-out excludes it"
detail = "Expected: sec-2 CapsulePlacement::try_new admits the design own typed per-base SourceExport while still refusing generic readable paths beneath ForbiddenScopes.capsule_root. Observed: sec-2 says every resolved host path equal to, above, or below capsule_root refuses, with one typed carve-out only for writable entries beneath this placement TransactionRoot; it then states that readable entries get no carve-out. The layout places the source at <capsule_root>/export/<base-oid>, and sec-7 row 9 also requires its fixture own export as /source. The source is therefore a descendant of the forbidden capsule root, is not writable transaction state, and every lawful production or fixture placement is refused before any conformance row runs. This is the over-denial side of the F-10 remediation. Add a distinct typed SourceExport admission rule tied to the accepted base and the export subtree, keep the generic readable vector carve-out-free, and pin both a positive lawful-source case and a negative sibling-export substitution mutant."
disposition = "fixed"
response = """
Upheld in full, and the class behind it is now the design's rule rather than this row's patch.

Confirmed by reading: the layout puts the export at `<capsule_root>/export/<base-oid>`; `capsule_root` is a `ForbiddenScopes` member; overlap is bidirectional; the sole carve-out was writable-descendant-of-this-transaction-root. So the validator refused the design's only lawful source placement, and sec-7 row 9's fixture — which builds its own per-run export — could not have been constructed either. Every conformance row would have failed before running.

Both readings were defects, which is why this is not a wording fix. If `source` was validated, nothing lawful passed. If it was exempt, there was an unvalidated authority channel, which is exactly what sec-2 invariant 2 claims to have closed.

Fixed: `try_new` gains a typed `SourceExport` admission rule — the field descends from `<capsule_root>/export/` and its carried base identity equals the placement's accepted base; everything else refuses. It is a second typed carve-out beside `TransactionRoot`, and neither is a carve-out in the readable/writable vectors, which stay carve-out-free. Your negative control is taken as `a_source_export_of_a_different_base_refuses`, plus two more: a source outside the export directory, and a readable entry naming the export directory (so the two carve-outs cannot be composed into a third).

The class: you found the over-denial mirror of F-10's under-denial, in the same rule. F-10 was found because nothing proved the rule denied enough; F-25 was possible because nothing proved it admitted enough. Only one direction had a test. sec-2 now states the discipline once — every refusal rule is paired with a positive case the refusal must not capture — and the placement tests are ordered to make the pairing visible. The one pre-existing positive control had the right instinct; F-25 is what it cost to have that instinct once rather than as a rule."""

[[finding]]
id = "F-26"
status = "answered"
severity = "blocker"
title = "Expected admission to reject undeclared inherited descriptors; observed all nine rows pass a backend that leaks one"
detail = "Expected: sec-2 explicit-input, bounded-visibility, credential-denial, and network-posture claims cover every authority channel crossing execute, so a future backend preserving an undeclared file descriptor cannot be admitted. Observed: sec-7 row 2 and row 4 exercise only mounted paths, and row 5 attempts a new connection; no row gives the parent an inheritable decoy descriptor and asks the capsule to consume it. A backend identical on every listed observation but preserving one inherited descriptor therefore passes all nine rows while exposing an already-open credential file or preconnected socket. Execution isolates the mechanism and the cage: a direct child given an inheritable descriptor read FD-SECRET and exited 0; the bubblewrap-shaped profile with --unshare-all --share-net ran and exposed no bytes, showing BubblewrapBackend happens to close it. The exact network-denied profile failed only at the reviewing sandbox NETLINK seccomp layer, so that failure is not attributed to the subject. This is a suite defect, not a BubblewrapBackend defect. Add the tenth independent claim under the explicit-input clause: close every descriptor except the deliberately owned standard or observation channels, with a probe carrying one inheritable decoy and a one-axis control that preserves it."
disposition = "fixed"
response = """
Upheld, and it is the finding of the round. The count moves nine → eleven, not nine → ten, and the second row is what fixing the class rather than the instance produced.

Your mutant is real and your attribution is right: rows 2, 3, 4 and 9 all reason about paths, and an already-open descriptor is not a path. Your isolation of mechanism from cage — direct child reads FD-SECRET and exits 0, bubblewrap-shaped profile exposes no bytes, network-denied profile fails at your own NETLINK filter and is NOT attributed to the subject — is exactly the discipline round 3's F-20 lacked, and it is why this landed as a suite defect rather than a backend one.

The tenth row was authorised by the human author, on DEC-156's standing terms. So was the instruction to fix the class.

The class fix is a channel ledger in sec-2: the closed enumeration of ways authority crosses `execute`, each channel naming the row that proves it. The suite had been deriving one row per SPEC-030 clause. A clause is written in the vocabulary of what a capsule must not HAVE; a row has to be written in the vocabulary of the mechanism by which it GETS it. Those are not in correspondence, and clause 2 names an outcome reachable by four mechanisms while naming none of them.

Filling that table in found a second empty cell: the ENVIRONMENT channel had no executed row either. Its proof was `CapsuleEnvVar` being a closed enum — which binds callers and says nothing about what a backend inherits — plus an argv assertion that `--clearenv` is present. sec-2's own note that `--clearenv` stops inheritance only was the concession that inheritance is a separate channel; nothing executed ever checked it. A backend omitting it hands the capsule whatever the trusted-side process holds, which on a dev machine or CI runner is routinely a credential. That is row 11, `Removed(EnvCleared)`, asserted as set-equality against `CapsuleEnv` rather than as a denylist of known credential names.

Also fixed: sec-2 invariant 5 was FALSE as written — it enumerated two channels and asserted completeness over them. It now points at the ledger. Invariants 12 and 13 join 11 as executed-only claims, and sec-2 states that the three are one shape repeated and a fourth is more likely than not.

What this does not buy, stated in sec-9 residual 5: the ledger cannot establish its own completeness — an enumeration asserting that is the invariant you just refuted, one level up. It changes the failure from 'nobody thought of this channel' to 'this channel has a blank cell'. It also names the three channels it lists but does not row: argv (closed by construction, not by probe), process reachability (split across row 7 and B5), and process credentials (uid/gid/capabilities/no-new-privs), which SPEC-030 states no clause for. Start there."""

[[finding]]
id = "F-27"
status = "answered"
severity = "blocker"
title = "Expected teardown to reject process-group-only reaping; observed row 7 does not require an escaped descendant"
detail = "Expected: sec-2 property 7 and sec-7 row 7 reject a backend that kills only the original process group while a double-forked or setsid descendant survives. Observed: Table A specifies only orphan a descendant, without requiring that descendant to leave the original session or process group, while sec-7 hazard containment explicitly relies on a process-group kill. A process-group-only backend passes an ordinary orphan probe and still violates the contract that no descendant outlives execute. The mechanism reproduces without namespaces: killing the original process group removed a same-group control process, but a descendant that created a new session remained alive until explicitly cleaned up. Pin the row 7 payload to fork and escape the original process group or session before its parent exits, require trusted-side proof that this descendant is gone when execute returns, and give the harness cleanup authority that does not itself stop at the escaped process group. Otherwise the next mutant is admitted by a probe weaker than the property title."
disposition = "fixed"
response = """
Upheld. The row's title claimed 'no descendant outlives the execute call' and its payload proved 'no descendant in the original process group does' — and both readings use the same words, which is why the gap was invisible.

Fixed at the rule, not the row. sec-7 now states: a row's payload is the HARDEST instance of the property's negation the property admits, not a representative one, and where a property has several distinguishable negation mechanisms the payload exercises each. Row 7's payload forks a descendant that leaves the original session (`setsid`) before its parent exits.

Applying that rule to the whole table moved two more rows, which is the return on stating it as a rule:
— Row 1 wrote a sentinel to /capsule/out only. A backend giving each transaction a fresh output area while sharing the agent home or the temporary area passed. It now writes to every writable location the placement declares.
— Row 5 attempted TCP loopback only. A backend denying by packet filter rather than by network namespace blocks TCP and leaves an abstract unix socket reachable. It now attempts both.

Your containment point is taken and generalised — it was the sharpest part of the finding. sec-7's hazard containment reaped by process-group kill, which is precisely the mechanism row 7 now exists to defeat, so the harness would have leaked the very process its own control creates. Containment is now the outer `timeout -k` plus a session kill, with the capsule's session id recorded trusted-side before the arm runs. The rule is stated: when a payload is strengthened, its containment is part of the payload, and the failure is silent — a leaked process per run, found by a developer whose machine is filling up rather than by a red test.

Three new titles defend the strengthening: the payload precondition asserted directly (so a payload that silently stops escaping fails rather than weakens), the trusted-side establishment against the escaped descendant, and `a_process_group_only_reaper_fails_row_seven` — your mutant as a stub backend, which must report `Violated`. Without that last one the strengthened payload is a claim no test defends.

One thing I did NOT do, and flag rather than bury: EVD-013's 2×2 was measured against the OLD payload. `setsid` changes a descendant's session, not its pid namespace, so the namespace should still reap it — but 'should' is reasoning about a new payload from a measurement made against an old one, which R1 forbids. Re-running the 2×2 against the escaping payload is recorded as a phase obligation, and if `--die-with-parent` turns out not to be required for it, row 7's control is wrong and that subsection's argument has to be redone."""

[[finding]]
id = "F-28"
status = "answered"
severity = "major"
title = "Expected the authorised nine-row correction everywhere; observed sec-2 and sec-6 still instruct eight"
detail = "Expected: the F-19 remediation and the human-authorised DEC-156 correction leave one count and one correspondence rule throughout the design. Observed: sec-7 says nine rows over eight clauses and records DEC-156 moving eight to nine; sec-8 and the reconciled SL-248 scope also say nine. But sec-2 still says the contract meaning is eight properties, claims one-to-one correspondence with the eight SPEC-030 clauses, says DEC-156 was corrected to eight, and says sec-7 builds eight rows. Sec-6 twice calls conformance an eight-property table. These statements are not historical framing; they are current implementation instructions and directly contradict invariant 11 and row 9. Replace the stale count and correspondence prose in sec-2 and sec-6, preserving the actual rule: nine independent claims cover eight clauses, with the explicit-input clause covered for boundedness and immutability."
disposition = "fixed"
response = """
Upheld. You are right that these were current implementation instructions and not historical framing — sec-2 told a reader the contract's meaning is eight properties, asserted one-to-one correspondence with the eight clauses, and reported DEC-156 as 'corrected to eight', three rounds after the first correction and one after the second.

One correction to the finding, which does not change its substance: sec-6 states the stale count ONCE, in the `src/conformance.rs` comment. Its other 'eight' references are to the new crate's eight units in the layering map, which is a different eight and is correct.

Fixed at the class. The count now lives in exactly one place — sec-7's Table A — and no other section restates it as a numeral. sec-2 names the properties without counting them; sec-6's comment reads 'the property table (count: sec-7 Table A)'; sec-8's evidence table refers to 'tables A, B (five) and C (four)'. A numeral repeated across five sections is a constant with five definitions, so STD-001 applies to prose here as much as to code.

That is not sufficient on its own — a rule nobody enforces decays the same way the first correction did — so the enforcement is a test: `every_row_id_is_covered_by_exactly_one_table` already existed, and sec-7 now asserts the executed title list is exactly the row set. A row added without a title, or a title outliving its row, is red rather than quiet. That assertion is what makes the count safe to state in one place at all.

The one-to-one correspondence claim is not restored in a corrected form — it is gone. The rows now cover eight clauses from eleven rows across three multiply-covered clauses, and the structure that IS one-to-one is the channel ledger F-26 forced: one row per channel, because one control can only remove one mechanism.

Both of the sections you named have been amended and both are unreviewed as amended, along with sec-7, sec-8 and sec-9."""

[[finding]]
id = "F-29"
status = "answered"
severity = "blocker"
title = "The new crate inherits neither serde nor toml, so the mandated config reader cannot compile"
detail = "Expected: sec-6 applies its own warning that a second workspace member must declare the dependencies its code uses. Observed: sec-5 mandates a Serde projection and `#[serde(deny_unknown_fields)]` at design.md:1915-1925, while sec-6 and the authoritative touch-set at :2287-2304 and :3669 give `crates/doctrine-control/Cargo.toml` only the doctrine path edge, rustix, and `publish = false`; neither serde nor toml is declared. Executed reproduction: `/tmp/claude-1000/-workspace-doctrine/158409ed-e3f2-482e-92ad-79dd8ba34048/scratchpad/manifest-transfer` has a root package depending on serde/toml and a control member depending only on the root. `cargo check -p control` fails E0433 for both crates; `cargo check -p control --features direct-parser-edges` succeeds after the control member declares them directly. Fix: specify `serde.workspace = true` and `toml.workspace = true` on the new member and include those edges in sec-6/sec-8 manifest instructions; then execute the actual second-member build."
disposition = "fixed"
response = "Upheld, and it is this section's own class defeating this section. sec-6 stated the principle — a claim about the root package's edge does not transfer to a second workspace member — and then applied it to rustix alone, leaving sec-5's mandated Serde projection to inherit an edge that does not exist. sec-6 now enumerates every edge the crate's own code uses (doctrine by path, rustix with fs+std, serde with derive, toml) in a table, and states the rule that matters more than the table: derive the list from the crate's own use statements and treat disagreement with the table as the table being stale. sec-8's touch-set row carries the same instruction. Recorded in prose that stating a class and applying it to one member is how the class survives — the F-27 shape, one level up."

[[finding]]
id = "F-30"
status = "answered"
severity = "blocker"
title = "Arbitrary parent stdin crosses execute outside the descriptor property"
detail = "Expected: every authority channel into a capsule is explicit and rowed, and descriptor closure leaves only standard streams the contract deliberately owns. Observed: `Execution` at design.md:292-305 has no stdin policy, invariant 12 marks only descriptors above 2, and table A row 10 at :2986 likewise ignores fd 0. An inherited stdin may be a credential file, pipe, terminal, or bidirectional socket, yet all eleven rows can pass. Executed reproduction: `/tmp/claude-1000/-workspace-doctrine/158409ed-e3f2-482e-92ad-79dd8ba34048/scratchpad/stdin-channel` runs the bubblewrap-shaped profile twice. With parent stdin piped, the capsule read all 22 decoy bytes; with stdin replaced by null, it read 0. Both executions succeeded, so this is the subject boundary rather than the reviewer cage. Fix: make stdio part of `Execution` and the channel ledger; default stdin to a trusted null/closed source or a typed owned input, create fresh one-way parent-owned capture for stdout/stderr, and add a control whose only delta inherits decoy stdin. Row 10 over fd >2 cannot discharge this exception."
disposition = "fixed"
response = "Upheld. Execution now carries a stdio field over a closed CapsuleStdio vocabulary with one variant — EmptyInputCapturedOutput — on exactly CapsuleEnvVar's argument: a RawFd field or an Inherit variant would make handing a capsule a live trusted-side descriptor the ordinary case rather than an unrepresentable one. Output endpoints are one-way rather than merely parent-created, because a socket pair satisfies 'the parent made it' while carrying bytes back. New sec-2 invariant 14; new sec-7 table A row 12 with StdioOwned, disjoint from row 10 by descriptor number so a failure names one row. Invariant 12 is re-titled to say 'above 2' explicitly and now states that the bound used to be the hole. The descriptor-sweep paragraph gains the rule underneath: a sweep is described by its bound as much as by its action, and an unstated bound reads as everything. The ledger gains the standard streams as a channel it never listed."

[[finding]]
id = "F-31"
status = "answered"
severity = "blocker"
title = "Row 10 reads descriptors but admits a backend that leaks write authority"
detail = "Expected: row 10 proves the closed-descriptor-set property against the strongest negation, so no inherited descriptor can carry authority across execute. Observed: table A at design.md:2986 only enumerates and reads descriptors; the tests at :3610-3618 require unreadability and absence of decoy bytes. The claim at :3612-3614 that absent bytes distinguish an open-but-unreadable descriptor from a closed one is false. Executed reproduction: `/tmp/claude-1000/-workspace-doctrine/158409ed-e3f2-482e-92ad-79dd8ba34048/scratchpad/write-fd-mutant` passes an unlinked host file as an inheritable write-only fd through the bubblewrap-shaped profile. The row-shaped read observation produced 0 bytes, but a write payload mutated 17 host bytes; setting CLOEXEC made the control exit 1 and left the decoy unchanged. A backend that closes readable inherited fds but preserves write-only ones therefore earns Proven from the readable decoy while retaining mutation authority. Fix: exercise every descriptor authority mode under the same closure mechanism, at minimum readable and write-only decoys and a bidirectional/socket case; if one control cannot change every observation, split the property into independently controlled rows."
disposition = "fixed"
response = "Upheld. The design's claim that absent bytes distinguish an open-but-unreadable descriptor from a closed one is false for a write-only descriptor, and your reproduction settles it: zero bytes read, seventeen host bytes mutated. Row 10 now holds on the enumeration alone — presence, not readability — and its control marks three decoys inheritable: readable, write-only, and one end of a socket pair. Two new test titles cover the mode coverage and the trusted-side check that the write-only decoy is unmodified, plus a second mutant stub that would have passed the round-4 row. Generalised beyond the instance as its own rule: a row must observe the property, not a consequence of the property that is convenient to observe — bytes not arriving has three innocent explanations and one guilty one, and no strengthening of the payload repairs that."

[[finding]]
id = "F-32"
status = "answered"
severity = "blocker"
title = "Backend admission leaves process credentials wholly ungoverned"
detail = "Expected: ADR-020 requires independently equivalent filesystem, process, credential, network, and canonical-repository authority properties, and REQ-459 criterion 1 claims the shared suite proves credential denial. Observed: the only process-credential text in the design is residual 5 at design.md:4129-4135, which concedes that uid/gid mapping, supplementary groups, capabilities, and setuid regain have no contract clause and no row. A positive-controlled search for `uid|gid|supplementary groups|capabilities|no-new-privs|setuid` finds the residual and no enforcement or verification elsewhere. Thus a backend retaining host process credentials can pass every row, while sec-8 still claims REQ-459 criterion 1 in full and credits REQ-448 denial. `--unshare-all` is only a bubblewrap mechanism, not the cross-backend property ADR-020 requires; the current outer jail already strips capabilities, so a local zero-capability probe cannot establish the general claim. Fix before lock: obtain the governance ruling SPEC-030 currently lacks, define the observable process-authority posture including uid/gid, supplementary groups, capability sets, and no-new-privs/setuid behavior, then add independently falsifiable controls and rows or withdraw the in-full closure claim until governed evidence exists."
disposition = "fixed — SPEC-030 clause deferred to a Revision"
response = "Upheld, and rowed — but on different reasoning than you gave, which is worth stating because the difference matters. Your ADR-020 reading is over-broad: ADR-020 requires the five authority classes of a *macOS* mechanism before it can claim parity, which with one backend is a future bill rather than a present breach. The decisive argument is internal. sec-8 defines the phrase — 'in full above means every channel in the ledger has a row, a claim that can be checked against something' — and sec-9 residual 5 then states that three ledger channels have no table A row, process credentials among them. The design refutes its own claim in its own words, two hundred lines after writing the paragraph explaining the phrase had already been false twice. F-30 makes it false a further way by adding an unlisted channel. Fixed as table A row 13 (CredentialsConfined) and sec-2 invariant 15, which states the part neither of us had written down: invariant 4 achieves denial by absence, absence denies only what the capsule cannot reach by other means, and a payload holding host credentials with a capability set retained can mount what was never bound — so the filesystem denial the whole design rests on was standing on a property the contract did not require. Two honest weakenings recorded rather than hidden: setuid regain is governed via no_new_privs rather than probed, because a suite that must not be privileged cannot build a setuid-root decoy; and the row is only weakly falsifiable in this project's jail, which already strips capabilities, so the phase owes a run outside it. The governance blank stays open — SPEC-030 states no clause, row 13 exists on ADR-020's credential-authority class instead, which is lawful because DEC-156 derives rows from channels rather than clauses. sec-9 Follow-Up carries the Revision, deliberately not taken here: routing a governance cycle in front of a design otherwise ready to lock, to record a property the design already implements and tests, is the wrong order."

[[finding]]
id = "F-33"
status = "answered"
severity = "nit"
title = "Table C is four tests in its table and sec-8 but three in sec-7s verification tail"
detail = "Table C lists four named tests at design.md:3295-3300 and sec-8 confirms `C (four)` at :3805, but sec-7 says `Executed, table C: the three titles above` at :3629. This is a stale numeral in implementation instructions, the same drift class the document elsewhere warns against. Fix `three` to `four` or remove the repeated numeral."
disposition = "fixed"
response = "Upheld. sec-7's verification tail now reads 'the four titles above', matching table C's four rows and sec-8's 'C (four)'. Same F-28 class. sec-8's evidence table also gains table A's own count explicitly — 'tables A (thirteen), B (five) and C (four)' — so the numeral has one source rather than three places to drift between."

