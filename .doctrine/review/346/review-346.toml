[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Expected bounded validated mounts; observed lexical roots and mount collisions can expose forbidden host state"
detail = "In `sec-2`, the design says `[capsule] readable_roots` accepts any host directory or file (lines 324-330), preserves host paths as inner paths, and deliberately does not follow symlinks (lines 347-359), while the profile mounts `/proc`, `/dev`, and `/tmp` before all readable entries and mounts writable entries afterward (lines 291-303). A configured root of `/`, `/proc`, `/dev`, `/tmp`, `/source`, the capsule-root parent, or an ancestor of the canonical repository therefore either exposes the host directly or shadows a reserved mount. A root such as `/opt/tools` that is itself a symlink to the canonical repository evades lexical checks: bubblewrap dereferences the source path for `--ro-bind`. I verified this locally with a symlinked declared directory; the marker in its out-of-tree target was readable inside bwrap (`shared-net-symlink-bind=0`). This contradicts the claimed absence of canonical state, credentials, other capsules, and undeclared host state, and `/source` shadowing can substitute the contracted export. Fix by making `CapsulePlacement` construction validating and non-public: reject duplicate/ancestor-overlapping inner mounts and reserved destinations; refuse symlink roots or resolve and validate their targets explicitly; and reject any root equal to or above canonical, control-plane, capsule-parent, or credential scopes. The conformance suite must carry mutants for each collision class."
disposition = "fixed"
response = "Contest upheld, and the gap is exactly as stated: the equal-or-ancestor test admitted every descendant. sec-2 now refuses overlap in both directions — equal to, above, or below any ForbiddenScopes member — with one typed carve-out: a writable entry under this placement own TransactionRoot, minted by the call that exclusively created that directory. A sibling transaction is below the capsule root and not below this root, so it is refused by the same test that admits capsule and agent. The overlap predicate compares resolved paths component-wise rather than by textual prefix, and a control test asserts that a sibling directory whose name merely extends a forbidden scope is still admitted. Seven descendant mutants added, one per scope, including a positive assertion that the carve-out still works so a fix that refuses everything under the capsule root cannot pass."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Expected independent proof of all eight backend clauses; observed teardown and observation collapsed under one control"
detail = "`sec-2` lines 259-264 folds process-tree teardown and trusted observation of resource limits and termination into one property because they would share one control. They are independent enforcement claims. A backend can correctly classify the main process and resource limit while leaving a grandchild alive, or reap every descendant while misclassifying timeout, signal, or file-limit termination. A control that removes both axes cannot establish which guard caused the paired result and violates DEC-156 one-property-removed discipline. Building `sec-7` from seven rows would therefore admit a backend that fails one of SPEC-030 Platform backend contract clauses. Fix by giving teardown and trusted observation separate properties, probes, and one-axis mutants; the suite should cover the eight clauses without this merge."
disposition = "upheld — governance correction pending"
response = "Upheld on the merits and NOT yet fixed, because the fix is a governance edit rather than a design edit. Your argument is correct: teardown and trusted observation are independent enforcement claims, a backend can reap every descendant and still misclassify a timeout as a signal, or classify termination perfectly and leave a grandchild alive, and a control removing both axes at once cannot say which guard produced the paired result. A seven-row suite would therefore admit a backend failing one of the eight clauses. The obstacle is that DEC-156 is an accepted record and states the count as seven. The count is arithmetic inside a decision whose principle, one control per property, is what refutes it, so what is owed is a correction to that number and not to its reasoning. That is the human authors call, not mine to take mid-run. sec-2 now carries the mapping table under an explicit notice recording that F-2 is upheld, that the table stands at seven only until DEC-156 is corrected, and that sec-7 will not be drafted against either count until it is settled. Raised with the human this turn."

[[finding]]
id = "F-3"
status = "answered"
severity = "blocker"
title = "Expected an explicit accepted-base binding; observed a generic readable list and arbitrary CommitId leave the base unproved"
detail = "SPEC-030 requires an explicit base and input set, but `sec-2` row 2 maps only the input list, and `CapsulePlacement` has no semantic base input. In `sec-3`, `ProvisionRequest.base` is an unconstrained `CommitId` (lines 547-554) and the export is only one generic `MountedPath`; no step proves that `base` is the accepted identity or that `/source` denotes the export for that identity. A caller can request base B while placing an export for A at `/source` (or a declared `/source` root can shadow it) and all seven stated backend properties still pass. Fix by accepting or deriving a typed `AcceptedBase` at the trusted boundary, representing the source export as a distinct immutable input bound to that identity rather than an element of a public vector, reserving `/source`, and verifying before clone that the supplied export contains exactly the bound base."
disposition = "fixed"
response = "Contest upheld and the miss was real: the response described the type change and the prose stated it, but ProvisionRequest.base was still CommitId in the code block. The caller obligation was therefore prose, exactly as contested. ProvisionRequest.base is now AcceptedBase. The scope boundary is unchanged and still stated in the text — AcceptedBase carries the assertion that a trusted-side caller resolved the commit as accepted and does not verify it against the canonical accepted ref, because that check is REQ-455 at admission and an explicit Non-Goal."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Expected typed provisioning commands executable through the trait; observed one argv described as three commands"
detail = "`sec-2` defines `Execution` as one typed `argv` and explicitly rejects a shell string (lines 187-200). `sec-3` step 9 nevertheless specifies one `backend.execute` that performs `git clone`, followed by `git switch`, followed by `git remote remove` (lines 576-579). That sequence cannot be represented by the trait. Running only the first argv leaves the checkout state and origin wrong; using `sh -c` reintroduces the quoting boundary the design rejects; running the latter Git commands trusted-side would operate in capsule-authored repository context. Fix by choosing and specifying one real mechanism: multiple backend executions with an observation checked after each, an ordered vector of typed command vectors, or an immutable control-plane-authored helper mounted read-only outside writable state. The trait and provisioning algorithm must agree before later launch and suite sections build on them."
disposition = "fixed"
response = "Upheld — a direct contradiction between the trait and the algorithm, and the best catch in the ledger. Fixed by choosing the first of your three options: step 11 is now three backend.execute calls, one typed argv each, with the Observation checked after each and a refusal on the first non-zero exit, plus a fourth execution at step 12 reading the capsule identity back out of the clone config. The table of the three argvs is in the text. The two rejected options are recorded with their reasons rather than dropped: sh -c reintroduces the quoting hazard on a security boundary that the typed argv exists to avoid, and running commands 2 and 3 trusted-side would put trusted Git in a capsule-authored repository, which SPEC-030 forbids outright. Your third option, a control-plane-authored helper mounted read-only outside writable state, is the spike I4a /rig posture and is the right answer when a capsule-side SEQUENCE must be conditional; for three unconditional commands it buys a mount and a shipped script to save two sandbox starts. Three executions also make each steps termination separately observable, which is better evidence than one aggregate status."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Expected the transaction to bind the backend choice; observed CapsuleTransaction omits BackendId"
detail = "SPEC-030 Transaction authority requires explicit resource and backend choices, and `CapsuleBackend::id` is documented in `sec-2` as the stable identity recorded in a verdict. `sec-3` quotes the transaction inputs but silently drops backend choice, and `CapsuleTransaction` lines 436-459 contains placement and bounds but no `BackendId` or admission identity. After provisioning, the returned value cannot establish which admitted mechanism created or must execute the capsule; a later caller can select a different backend with no detectable contract break, and observations cannot be attributed to the admission verdict. Fix by binding the stable backend identity, and any conformance-verdict/version identity needed to make admission meaningful, into the transaction at provisioning."
disposition = "fixed"
response = "Upheld and fixed: CapsuleTransaction gains a backend field carrying the stable BackendId. I would rate this major rather than blocker, but the defect is real and the fix is cheap, so the severity is not worth contesting. One thing the finding did not raise and the design now states, because accepting the fix silently would have been the worse error: backend is not in DEC-159 enumerated field set, so adding it needs a justification in that decisions own terms. It has one. DEC-159 binds only what has a consumer NOW, and provisioning itself calls execute at step 11, so the backend choice is made inside this slice rather than anticipated for a later one. sec-3 records that alongside the same justification for AcceptedBase. The conformance-verdict identity you also suggest binding is deliberately NOT added: nothing in this slice produces or consumes one beyond the backend verify verdict, and adding a field with no consumer is the thing DEC-159 exists to prevent."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Expected five-axis fresh-state evidence; observed tests and control establish storage axes only"
detail = "`sec-3` lines 629-635 claims to prove checkout, repository, runtime, process, and temporary-state distinctness, but the listed tests cover writable checkout, repository objects, and temporary state only. There is no runtime-state test and no process-state test. The paired control provisions the second transaction into the first root, which demonstrates shared storage when root isolation is removed; it does not make the two executions share a process namespace or process state, so it carries no information for the fifth axis. REQ-450 criterion 1 is therefore not discharged by the stated evidence. Fix by defining the runtime state being tested (for example the agent-home/runtime sentinel), adding a write/absence test and control for it, and adding a concurrent process visibility/signal/orphan probe with a one-process-isolation-property-removed control."
disposition = "fixed"
response = "Upheld and fixed. The draft listed three storage tests for five axes and offered one control for all of them, and you are right that the control carries no information about the process axis, since two capsules sharing a directory still do not share a process namespace. sec-3 now separates the axes by kind in a table: four are storage (checkout, repository, runtime, temporary state) and take the storage control, provisioning the second transaction into the first root; the fifth is not and takes its own. Runtime state is now defined rather than gestured at — a sentinel in the agent home at /agent, the state a harness accumulates across a run — with its own write-and-observe-absence test. The process row runs two capsules CONCURRENTLY: capsule A enumerates /proc and attempts kill -0 on a pid the trusted side observed capsule B running under, asserting positively that Bs process is absent from As /proc and that the signal fails. Its control removes --unshare-pid ALONE, every other property intact, and asserts both become possible, which is DEC-156 discipline applied to an axis with no storage to compare. Eight test titles replace the three."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "Expected credential denial to survive explicit environment construction; observed arbitrary env values bypass the property"
detail = "`sec-2` states that credential denial is achieved by absence from `readable` and `writable` (row 3 and invariant 2), but `Execution.env` is a public full `BTreeMap<EnvName, String>` copied into the capsule. `--clearenv` prevents inheritance only; a caller can explicitly pass `AWS_SECRET_ACCESS_KEY`, `GITHUB_TOKEN`, credential-helper variables, or another control-plane credential value and the backend still satisfies every stated mount assertion. A conformance suite using a benign map cannot prevent this in production. Fix by making the environment a validated contract type with an explicit allowed vocabulary and credential-denial rules, or by specifying a separately governed scoped credential capability. The present SPEC-030 contract has no such exception, so arbitrary values cannot remain in the backend API."
disposition = "fixed — remedy restated"
response = "Upheld: the defect is real and structural. --clearenv stops inheritance only, so an open BTreeMap of environment values is a second unguarded route for exactly the credentials the mount set denies, and claiming credential denial rests on absence from readable and writable was false while that field existed. Fixed, but by a narrower remedy than the finding proposes, and the difference is deliberate. Your framing implies credentials must never cross into a capsule; that overreaches. The spike binds one credential file read-only inside the agent home (sandbox.sh:248-250) and records it as strictly NARROWER than the whole ~/.claude bind it replaced, and the launch slice will legitimately need to give a harness a credential. REQ-448 and REQ-459 credential clause is about a capsule reaching or mutating the CONTROL PLANE credential store, not about a capsule never holding one. So the remedy is scoped to this slice altitude: Execution.env becomes a closed CapsuleEnvVar vocabulary (Path, Home, Term, and the four git identity variables) whose values are all computed trusted-side from the placement, with no public route carrying caller-supplied environment text. This slice needs no others — its only capsule executions are the provisioning git commands and the sec-7 probes. sec-2 states explicitly that widening this vocabulary is a later slice decision that must arrive with its own governed rule, and that a scoped credential CAPABILITY is not an open map. Two test titles added."

[[finding]]
id = "F-8"
status = "answered"
severity = "major"
title = "Expected idempotent immutable export publication; observed the concurrent loser and existing-export validation are unspecified"
detail = "`sec-3` step 6 says an export is idempotently reused when it already holds `base`, and invariant 2 says concurrent builders use a temporary name and rename into place. It does not define unique temporary ownership, no-replace publication, what the rename loser does, or what proves an existing directory is the exact immutable export rather than a symlink, partial/corrupt repository, repository with alternates, or repository containing extra refs/objects. Two concurrent builders can produce one rename failure rather than idempotent reuse, and a weak `holds base` check can bind more host object state than the per-base export decision permits. Fix by specifying an atomic publish protocol: uniquely owned temp directory, full export validation, symlink refusal, no-replace rename, loser validation and reuse of the winner, cleanup only of the caller-owned temp, and an exact invariant for refs/config/alternates/object closure."
disposition = "fixed"
response = "Contest upheld. The temporary export directory is created before step 9, so at that point nothing has established that this call owns the id — collision-resistant is not collision-free, and a retry with the same id is not improbable at all. It is now created with the same mkdir semantics that fail when the path exists, holds its own creation token, and an existing path refuses rather than being entered, cleaned or reused. Ownership rests on the exclusive create, not on the id entropy; the name is merely derived from the id. Two calls holding the same id both refuse. Test added: provision_onto_an_existing_temporary_export_directory_refuses_and_removes_nothing."

[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "Expected rollback to remove only newly owned empty state; observed transaction-root ownership and collision handling are unstated"
detail = "`sec-3` says the transaction id is allocated trusted-side, step 7 creates `tx/<id>`, and rollback recursively removes that path after failure. The function signature supplies neither a preallocated id nor an allocator seam, and the design does not require an exclusive atomic create or refusal when the path already exists. On an allocator collision or retry with the same id, an implementation using recursive directory creation can enter an existing transaction root and later delete work it did not create, contradicting the rollback rationale and REQ-461. Fix by specifying where collision-resistant identity comes from, requiring atomic exclusive creation of the root, retaining a creation/ownership token, and making rollback refuse deletion unless that exact call created the root and no transaction was returned."
disposition = "fixed"
response = "Contest upheld, and it is the better half of the finding. The transaction id is now a ProvisionRequest field allocated by the caller rather than something provision mints, which follows the project pure/imperative rule that the impure value is read in the outer shell and passed in — the same pattern the existing date and uid inputs use. The collision branch is therefore reached deterministically by handing the same TransactionId twice, and the existing-root test can actually be written. HostFacts stays clock-free and gains no allocator, so no identity input arrives through the back door. TransactionId refuses a value that is not a single path component."

[[finding]]
id = "F-10"
status = "answered"
severity = "blocker"
title = "Expected forbidden scopes to reject every overlap; observed descendants remain bindable"
detail = "Expected: CapsulePlacement validation prevents every declared readable root and resolver result from reaching canonical repository state, control-plane state, credentials, or another capsule, while permitting only the current transaction directories that provisioning owns. Observed: sec-2 lines 219-221 reject a resolved host path only when it equals or is an ancestor of a ForbiddenScopes member. A descendant such as repository/.git/config, credentials/token, or capsule-root/tx/sibling therefore passes. sec-5 lines 1529-1536 says capsule_root protects siblings by relying on provisioning to compute only current-transaction paths, but configured readable-roots and closure-resolver output are also provisioning-computed and can name any descendant. The design needs provenance-aware categories: bidirectional overlap rejection for declared and resolved readable inputs, with a narrow carve-out only for validated current-transaction writable paths, plus descendant mutants for every forbidden scope."
disposition = "fixed"
response = "Upheld — blocker, and the reasoning it refutes was mine. sec-2 lines 219-221 checked equality and ancestry only, and sec-5 rested the sibling case on provenance: provisioning computes every path in a placement, so it computes only its own. That is false in the way you name — readable-roots entries and closure-resolver output are provisioning-computed in the same sense and can name any path at all, so repository/.git/config, credentials/token and capsule-root/tx/sibling all passed. Provenance was doing no work. The rule is now geometric and bidirectional, with the carve-out typed rather than described: writable entries under this placement own TransactionRoot are admitted, everything else overlapping a forbidden scope in either direction refuses, and readable entries get no carve-out at all. Descendant mutants added per scope, plus the extends-the-name control and a positive carve-out assertion. sec-5 paragraph rewritten and the refuted argument kept visible rather than deleted."

[[finding]]
id = "F-11"
status = "answered"
severity = "blocker"
title = "Expected strict verification-row schema; observed nested unknown and missing keys lack refusals"
detail = "Expected: REQ-449 strictness applies to the entire interpretation block, so every unknown key and every missing required key is refused before a policy is normalized, hashed, or executed. Observed: sec-4 lines 1110-1115 defines an explicit walk only for the interpretation table key set, while lines 1133-1135 validate only a non-empty verification sequence, non-empty argv, and non-empty arguments. It never specifies refusal of an unknown key inside a verification row, a row missing argv, or a wrong row shape. A row containing argv plus extra = true therefore has no defined refusal and may be silently projected out of the canonical typed value. Walk each verification row recursively against the sole argv key, give missing, unknown, and wrong-type cases typed refusals, and add real-parser tests."
disposition = "fixed"
response = "Upheld — blocker. The walk covered the interpretation table and then dropped to non-emptiness checks for rows, so a row spelled argv plus extra had no defined refusal and would have been projected out silently. Strictness that stops at the first level is a strict outer table wrapping a tolerant inner one, which is not what REQ-449 criterion 1 asks for. Each row is now walked against its own known key set — argv and nothing else — with RowKeyMissing and UnknownRowKey distinguished for the same reason KeyMissing and UnknownKey are at the table level, plus MalformedVerificationRow for a row that is not a table and for argv that is not an array of strings. Four test titles added against the real parser."

[[finding]]
id = "F-12"
status = "answered"
severity = "major"
title = "Expected checked bound arithmetic; observed MiB conversion can overflow before construction"
detail = "Expected: every accepted numeric config value converts once into ByteCount or Duration without panic, wraparound, or ambiguity; an unrepresentable bound refuses naming its key. Observed: sec-5 lines 1397-1402 says expected-capsule-size-mib and file-size-cap-mib convert into u64-backed ByteCount, but overflow handling is specified only for statvfs multiplication at lines 1604-1608 and warning-threshold multiplication at lines 1614-1616. The refusal table has no conversion-overflow case, and the tests cover only threshold saturation. Any MiB value above floor(u64::MAX / 1048576) leaves construction undefined. Use checked unit conversion with a named BoundOverflows key refusal and boundary tests for both size keys."
disposition = "fixed"
response = "Upheld. Overflow was specified for the statvfs multiplication and the threshold multiplication and not for the MiB-to-byte conversion that feeds both, which left construction undefined above u64::MAX over 1048576 and every downstream saturation argument resting on an unchecked value. Conversion is now checked, with BoundOverflows naming the key, and the tests pin both sides of the boundary rather than only the overflow."

[[finding]]
id = "F-13"
status = "answered"
severity = "major"
title = "Expected a reachable early-warning tier; observed multiplier one erases it"
detail = "Expected: every accepted capacity policy preserves REQ-461 criterion 1 by having a non-empty region that warns before the insufficient refusal boundary. Observed: sec-5 lines 1414-1416 accepts capacity-warn-multiplier >= 1, but the tier definition at lines 1618-1623 makes Low equal to expected <= available < expected times multiplier. At multiplier 1 that interval is empty, so no available-space value can emit the conspicuous warning. The refusal and tests reject only values below one. Require a multiplier greater than one, or define explicit multiplier-one semantics that still produces the required warning, and pin the boundary."
disposition = "fixed"
response = "Upheld, and the check is now stronger than the argument that produced the original one. The draft refused below one on an inversion argument; you are right that at exactly one the region expected to expected-times-multiplier is empty, so no available-space value can ever emit the warning REQ-461 criterion 1 requires — the policy would be accepted and the requirement silently unmet. The multiplier must now be strictly greater than one, refusing with WarnMultiplierNotAboveOne, and both the one and zero cases are pinned."

[[finding]]
id = "F-14"
status = "answered"
severity = "minor"
title = "Expected a clock-free HostFacts boundary; observed sec-3 still requests a clock"
detail = "Expected: the no-clock ruling is consistent everywhere, since provisioning consumes no timestamp and src/clock.rs remains the sole wall-clock home. Observed: sec-5 lines 1554-1559 correctly removes clock from HostFacts, but sec-3 line 784 still documents the host argument as clock, statvfs, path existence. That is the signature sketch an implementer meets first and it directly contradicts the later trait. Remove clock from the sec-3 comment and add the transaction-id source explicitly rather than letting clock return as an accidental identity input."
disposition = "fixed"
response = "Upheld — my own inconsistency, ruled in sec-5 and not swept into sec-3. The signature comment now reads statvfs, resolution, path existence, environment. The transaction-id source is made explicit in the same edit rather than left where a clock could return as an accidental identity input: it is a ProvisionRequest field allocated by the caller, which is also what makes F-9 testable."

[[finding]]
id = "F-15"
status = "answered"
severity = "major"
title = "Expected defaults matched to measured properties; observed no evidence for the per-file cap"
detail = "Expected: at R1 evidence altitude, each enforced default is tied to the quantity actually measured, and known-failing or unmeasured values are not presented as generally usable optional defaults. Observed: scripts/spike-capsule/capsule/sandbox.sh uses one disk_cap for both RLIMIT_FSIZE and a whole-tree du check, and maps either leg to the same resource-cap outcome. The recorded heavy 4.4 GiB point is peak whole-tree use and cannot establish the largest file or which disk leg fired. Sec-5 lines 1393-1395 and 1661-1665 drop the whole-tree cap but retain 256 MiB as a per-file default attributed to the spike; the 300s default is separately known to have failed at 352s. Calling all defaults a guess that every project should override is honest about uncertainty, but optional enforced defaults still terminate work. Either require explicit execution bounds, choose and justify conservative values from the heavy fixture where the measurement matches, or gather separate maximum-file evidence before assigning the per-file default."
disposition = "fixed"
response = "Upheld, and it is the sharpest finding of the round. The spike used one disk_cap for both ulimit -f and the whole-tree du and mapped either leg to one outcome, so its 256 MiB figure measures neither the largest file nor which limit fired; and 300s is not merely unmeasured but falsified at 352s. An optional default terminates work, so shipping either as a default presents an unmeasured value as generally usable. execution-timeout-seconds and file-size-cap-mib are now REQUIRED keys — absent, provisioning refuses naming the key. execution-kill-grace-seconds keeps its default of 5, which is directly measured and is a window between two signals rather than a bound that ends work. expected-capsule-size-mib keeps its default, and your argument re-anchors it rather than removing it: it denotes whole-tree size, which is exactly the quantity the 4.4 GiB peak measured, REQ-461 criterion 2 contemplates a default there, and the tier it feeds warns rather than terminates."

[[finding]]
id = "F-16"
status = "answered"
severity = "major"
title = "Expected an absolute root outside the repo; observed relative HOME yields a relative root"
detail = "Expected: CapsuleConfig.root is always absolute and resolved, and the default cannot land in the repository or current working directory. Observed: sec-5 lines 1516-1520 ignores a relative XDG_DATA_HOME but joins HOME with .local/share without requiring HOME to be absolute or non-empty. HOME=relative therefore produces a relative capsule root, contradicting the type claim at line 1431 and invariant 4 at lines 1678-1680; the refusal set and root tests contain no relative-HOME case. Require an absolute non-empty HOME before joining, otherwise refuse naming root, and add both relative and empty HOME tests."
disposition = "fixed"
response = "Upheld. The draft rejected a relative XDG_DATA_HOME and then joined HOME unconditionally, so HOME relative or empty produced a relative capsule root — contradicting the type own claim and invariant 4, and in the empty case rooting capsules under the current working directory, which on an ordinary invocation is the repository. That is precisely the outcome DEC-158 rules out, reached through a variable nobody validated. Both variables are now held to the same test — set, non-empty, absolute — an unusable value is skipped rather than joined, and the arm falls through to the refusal. Relative-HOME, empty-HOME and a no-resolution-path-yields-a-relative-root case are all pinned."

[[finding]]
id = "F-17"
status = "answered"
severity = "minor"
title = "Expected deterministic restriction refusals; observed inserted rows contradict the diagnosis"
detail = "Expected: rule 4 of the restriction algebra deterministically classifies row removal, reorder, replacement, and insertion as the design and named tests promise. Observed: sec-4 lines 1211-1217 says a base row is Reordered only when all base rows appear but not in base order, and otherwise an index mismatch is Replaced; yet inserting a row before or between base rows leaves the base rows in their original relative order. The stated algorithm therefore selects Replaced for the insertion examples while the text and test at line 1290 require Reordered. The policy still refuses, so this is not a security blocker, but the implementable diagnostic contract is contradictory. Define precedence using prefix and subsequence checks and align the test title."
disposition = "fixed"
response = "Upheld. Three predicates over the same pair of sequences were producing two contradictory answers: an insertion leaves the base rows in their original relative order, so neither the reordering test nor the replacement test described it, while the prose and the test title claimed Reordered. The diagnosis is now an ordered classification — removed, then inserted by subsequence check, then reordered, then replaced — with prefix deciding acceptance and subsequence deciding which refusal. VerificationRowInserted is a new variant. The test titles are aligned and a case is added asserting the classification order itself, so a refinement that both removes and reorders reports Removed."

