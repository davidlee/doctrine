id    = 371
slug  = "design-review-of-sl-260"
title = "design review of SL-260"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-260"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "STD-002 is falsely excluded by the shared tripwire"
detail = "§3.2 says, ‘The first four share one tripwire: they all scope to src/ or to shipped mechanism,’ after listing STD-001 through POL-002. STD-002 does neither: its Scope applies to all authored doctrine entities and every entity reference in prose, so it binds this design.md even with no src/ change. The preceding STD-002 bullet gives a subject-matter argument, but the shared sentence then replaces it with a false scope claim and the slice scope likewise says the text-only delta lands outside every otherwise-binding standard. A reviewer or planner relying on that conclusion can skip the durable-id/reference-form check entirely. Keep STD-002 in the binding set and apply it to the design and proposed prose; reserve the src/-change tripwire for the standards whose actual scopes support it."
disposition = "fix-now"
response = "Confirmed and swept. STD-002's Scope reads 'all authored doctrine entities ... [and] every reference to an entity (prose, commit scopes, comments, code)' with no src/ precondition, so it binds this design.md, the slice scope and the convention prose. Repair: STD-002 moves into design section 3.1 (governance that binds) with the two obligations it imposes named, and the section 3.2 tripwire sentence is narrowed to the three standards whose scope supports it - STD-001, STD-003, POL-002 - with an explicit line saying the tripwire is about those three and says nothing about standards that bind regardless. Your observation that the false claim had also ridden into the slice scope was correct: slice-260.md's All tooling bullet is corrected the same way and now names STD-002 as binding. The subject-matter argument you noted is kept, but reframed as a statement about which clause applies rather than about whether the standard is in scope."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "The claimed transcription tooth does not exist"
detail = "§5.5 says, ‘A routed finding cannot reach verified without a criterion, and an unverified blocker refuses audit → reconcile,’ and therefore calls transcription an audit-grade mechanical edge. But review verify accepts only the review reference, finding id, and an optional note; it does not read plan.toml or require a criterion. Concrete failure: after a route:probe disposition, the raiser runs review verify before slice phases or after the planner omits the criterion. The finding becomes terminal verified, doc_unresolved_blockers clears, and slice close passes with the obligation evaporated. That directly contradicts §5.1’s two-teeth model, §5.4’s sequence, and §5.5’s admission that the convention is otherwise honour-system. Before lock, either add a real transcription check at verify/close or state accurately that transcription has no mechanical tooth and that the close gate cannot detect this drop; do not spend the existing blocker gate as proof of a predicate it never evaluates."
disposition = "design-wrong"
response = "Re-disposed after the raiser contested. The substance of the first disposition stands and is unchanged: doctrine review verify takes only the review reference, --finding, an ephemeral --note and --as; its gate checks status and role and never content (src/review.rs:2834 for the gate, src/review.rs:2673-2679 for the signature); it does not read plan.toml. Section 5.5's claim that a routed finding cannot reach verified without a criterion is withdrawn, not softened. What replaces it: the close gate is a forcing moment, not a check - doc_unresolved_blockers will not let a blocker be closed over unverified, so someone must perform the verify act, but a raiser who verifies with no criterion transcribed produces a clean, terminal, immutable record of a transcription that never happened and no gate in the corpus can tell. What was wrong was the completeness claim. The first disposition said the overclaim appeared in four places and all four are fixed. It appeared in five. The fifth is DEC-271's own consequences field, which still read that two clauses have teeth rather than one, naming transcription transitively at the slice close, three bullets before the bullet that corrects it - and DEC-271's title still asserted close-gate teeth are audit-grade, which is the same withdrawn claim in the one field an append-style amendment cannot reach. Both are now repaired: the title reads promotion leg stays in the convention and is hung at the plan moment, and the consequence is marked superseded with what replaces it. This is the second instance in this ledger of R5, the twin-arm failure mode, and it fired on a sweep clause - which is precisely the clause the owner-fix route exists to make explicit, and which this design already says is the clause people drop. Recorded here rather than left to the prose body, because a verified response asserting a completed sweep that was short by one site is exactly the misleading durable record the ledger is supposed to prevent."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "The shipped rule calls measurement enforcement"
detail = "§5.2 proposes on both shipped surfaces, ‘This convention is enforced only by the trial’s counting pass’ / ‘Enforced only by the trial’s counting pass.’ The pass in §5.2 merely reads ledger JSON after dispositions and emits rows; it cannot reject, block, or repair a nonconforming disposition. Concrete failure: an author omits route:, proceeds through planning and execution, and assumes the stated enforcement will catch the error, but nothing acts until trial analysis—if then. This also violates §4 principle 2 (‘never imply enforcement’) and §9.1 item 4 (‘Nothing in the convention implies an enforcement it does not have’). Replace enforcement with accurate detection/measurement language and state which clauses are honour-system; describe any real preventive or gate checks separately."
disposition = "fix-now"
response = "Confirmed, and on a second ground you did not name: after F-2 the sentence also contradicted section 5.5's own account of what has force. A counting pass cannot reject, block or repair a nonconforming disposition, so 'enforced' was false, and it breached principle 2 (never imply enforcement) and acceptance item 4. Repair: both shipped pointers now say that nothing validates the convention, that the slice close forces the verify act without reading it, and that the counting pass measures after the fact. CON-006's PLACEMENT paragraph is corrected to match, so the record and the shipped text no longer disagree about what the pointer says."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Ledger-carried obligations violate the existing stand-alone design rule"
detail = "§5.1 makes the structural choice that ‘the obligation travels with the finding’ and the planner reads the criterion sketch and placement constraint only from the RV response. But the current install/design-prompts/reviewing.md lines 63–64, which §5.2 leaves untouched, says: ‘The current design must stand alone. A history ledger may explain how it changed, but it may not carry context required to understand or implement it.’ Concrete failure: a route:probe finding is deliberately not repaired into design prose; after lock, a planner reading the supposedly stand-alone design cannot know the adversary, criterion sketch, or host constraint without mining review history. The proposed append therefore instructs the author to create exactly the state the surrounding machine-rejection rule forbids. Resolve the ownership conflict before lock: either amend the stand-alone rule with an explicit, governed routed-obligation exception and delivery path, or place the implementation-required obligation in an active non-history owner that planning is required to read."
disposition = "design-wrong"
response = "Confirmed at install/design-prompts/reviewing.md lines 63-64, verbatim, in the same file the convention appends to. The design relied on the planner reading the criterion sketch and placement constraint off the ledger, which is precisely the context that rule forbids a history ledger to carry - and section 2.6 now records the second half of the problem you gestured at: nothing shipped told a planner to open a review ledger at all, so the obligation was addressed to nobody. Put to the owner as a fork between carve-out only and carve-out plus closing Q3. Owner ruled for the latter. Repair, both halves: the stand-alone rule is amended where it lives with an explicit provisional routed-obligation exception, and plugins/doctrine/skills/plan/SKILL.md gains a transcription pointer that fires at the plan moment. The pointer owns no normative content, so the rule still has one owner and the F-7 fix is not undone by the F-4 fix. DEC-271 is amended on that ruling and design Q3 is closed rather than deferred; Q1, the weaker-delivery question, is untouched. Verified that skills are replaced on every install (copy_skill writes unconditionally, src/install.rs:2036-2038), so the new surface has delivery strength comparable to the fixed fragment rather than to the customizable reference."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "The ledger insertion still orders immediate terminal close"
detail = "§5.2 places the new Route axis immediately before the current review-ledger.md instruction ‘Then close each finding terminal,’ followed by verify/contest/withdraw. The operative proposal separately says routed verify happens after slice phases and the design pass concludes with those findings answered. Concrete failure: a responder or raiser consulting the canonical §4 sequence reads the new route paragraph and then obeys the untouched next instruction, verifies immediately before any phase or criterion exists, and terminally clears the blocker. A cross-reference to reviewing.md does not resolve two opposite temporal commands on the same disposition path. Amend §4 so its terminal-close instruction explicitly carves out routed findings and states when/against what they are verified, or keep the existing immediate-close rule and choose a different representation."
disposition = "fix-now"
response = "Confirmed at install/review-ledger.md lines 121 and 140. The conflict is worse than the quoted sentence alone: the section opens with 'Every finding gets an explicit disposition, then a terminal close' and then repeats it, so a reader meets the general rule twice. Repair: the route axis moves to AFTER the terminal-close block and its caveats, so the general rule is met first and its exception second, and the insert now carries an explicit deferral sentence - such a finding's terminal close is deferred, it is verified after slice phases against the criterion its obligation became, and the immediate close above is the rule for every other finding. You were right that a cross-reference could not resolve two opposite temporal commands; the carve-out is stated in the doc that gives the command."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "The closed routes are not mutually exclusive"
detail = "§5.1 requires exactly one of five routes but defines them by questions that can coexist. E11 itself says its axes mix: a symlink attack can be both a mechanism prediction and a threat to a costly boundary. Concrete finding: ‘the persisted integrity boundary accepts a symlink escape, and the design has not justified accepting that exposure.’ It asks both probe (‘withstand the adversary’) and review (‘accept this commitment and its consequences’). Likewise, two conflicting normative accounts can require review to choose the owner before owner-fix can remove the duplicate. The no-default /consult rule only escalates the ambiguity; it gives the owner no deterministic basis for the required single token, and the immutable finding cannot be split in place. Define a precedence/tie-break or a split/re-raise rule for compound findings, or reshape the route definitions so exactly one is true for every in-scope finding."
disposition = "fix-now"
response = "Re-disposed after the raiser contested the first repair. The finding stands confirmed; the first repair was itself defective and the raiser was right to hand it back. The four-step procedure as first drafted turned steps 2 and 3 on the term instrument route, which this design defines as exactly demonstrate, probe and control. Step 2 therefore resolved only instrument-versus-review, step 3 fired only when two instrument routes fit, and step 3 nonetheless enumerated four routes led by owner-fix. The pair review plus owner-fix - the second worked example in this very finding, where two conflicting normative accounts require review to choose the owner before owner-fix can remove the duplicate - fell through all three steps unresolved. So the first repair closed the probe-plus-review arm the finding opened with and left the owner-fix arm it also named: R5, the twin-arm failure mode, firing on the repair that introduced the twin-arm mitigation. Repair as it now stands, on the owner ruling: step 2 reads prefer any route other than review, with owner-fix named as counting even though it is not an instrument route, because it too is settled by doing rather than by arguing; step 3 reads if two non-review routes still fit, take the first of owner-fix, control, probe, demonstrate. Steps 2 and 3 are together total over the five, and design section 5.1 now states that guarantee and names the pair the earlier form dropped. Adjacent defect found while repairing this and fixed in the same pass: the shipped fragment used the term instrument route three times without ever defining it - the definition lived only in design.md, which no agent receives - and contradicted itself on the count, step 3 listing four where the per-route obligations said all three. The fragment tie-break no longer uses the term at all, and the term is defined immediately before its one remaining use. DEC-275 carries the amendment and its reason."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "The convention retypes the normative core that P2 requires once"
detail = "§3.1 says DEC-103 requires writing the convention on both surfaces, and §9.1 excuses this on the claim that they carry different text. But §5.2 retypes the same normative assertions: both inserts require a severe finding’s route as the first disposition token, both define route versus vocab, and both state the same counting-pass enforcement claim. RFC-026 P2’s sharpened rule—also named as part of this combined trial—is one normative record included by reference, never retyped; E11 identifies the cite-plus-assert posture as P2’s observed kill clause. Concrete failure: a later change adds a sixth route or changes the token shape on the fixed fragment but misses the customizable ledger copy, leaving two authoritative shipped answers. Before lock, adjudicate DEC-103’s repeated delivery against P2’s single-owner rule instead of declaring the duplicate ‘different text’: establish one semantic owner with non-asserting delivery projections, or explicitly exempt this convention and disclose that the trial is not applying P2 to its own rule and inherits that confound."
disposition = "fix-now"
response = "Confirmed, and the cause is narrower than the finding states, which makes the repair cleaner. DEC-268 already assigns the ledger doc 'the route axis, the recording shape, and an explicit scope line, with the rule itself held in the reviewing fragment' - a pointer role. The drafted section 5.2 text had drifted past that and added the closed-set enumeration and the route-versus-vocab semantics. So this is conformance to a settled decision, not a reopening of it, and neither of your two proposed exits is needed. Repair: the ledger insert is cut back to axis, recording shape, scope line, deferral sentence and pointer, asserting nothing normative. Your concrete failure - a sixth route added to the fragment and missed in the copy - is now structurally impossible, because there is no copy. Adjacent hole your finding did not name, found while repairing it: the fixed fragment never enumerated the five routes at all, so a client who customised review-ledger.md would have lost the route names entirely, contradicting section 5.5's own edge case. The closed set now lives in the fragment, which is where DEC-268 says the rule belongs. Acceptance item 3's 'different text' exception is replaced by a stronger check with no exception: hung three times, owned once, and each pointer must be checkable as non-asserting."

[[finding]]
id = "F-8"
status = "verified"
severity = "blocker"
title = "The counting deliverable cannot produce the trial measures"
detail = "§5.2’s documented command emits only RV id, finding id, severity, the first disposition token, and whether it starts route:. §9.4 then calls that command ‘the deliverable.’ RFC-026 P10 requires, per severe finding, whether the instrument produced its promised evidence and whether the repair was later contested or drew a related finding; per ledger it requires artefact-prose and repair-text counts, repeat contests, rounds, design line growth, later audit findings, completion, and a second-rater reclassification. None of those facts is emitted or operationally derived by the command. Concrete failure: the trial-report chore can run the deliverable successfully and still cannot answer two of P10’s three trial questions or reproduce the declared counts without inventing a fresh method after seeing outcomes. Before lock, document the complete repeatable collection/classification procedure, its source joins and second-rater step (still prose-only if desired), and stop presenting the route-prefix extractor as the whole counting method."
disposition = "fix-now"
response = "Confirmed against P10's text. The extractor emits five columns, all about the route, and P10 requires per severe finding whether the instrument produced its promised evidence and whether the repair was later contested or drew a related finding, and per ledger artefact-prose findings, findings against repair text, repeat contests, rounds, design line growth, later audit findings and completion, plus a second-rater reclassification. Your validity point is the load-bearing one and it is accepted: P10 fixes eligibility beforehand, and the same reasoning binds the method, so a procedure chosen once outcomes are visible is not a measurement. Repair: section 9.4 is rewritten as the full collection and classification procedure - every required fact with its source and how its join is made, the manual joins named as manual, and a second-rater step that works from the same ledger JSON and design history without sight of the first rater's labels, reporting disagreements as disagreements. Section 5.2 renames the command the route extractor, one input and not the method. DEC-276 records that the method belongs to this slice. Writing the procedure surfaced a fact nobody had: rounds and contests live in the review's runtime baton, which is gitignored and documented in code as non-derivable observability lost on baton loss (src/review.rs:2185-2208). Two of P10's required per-ledger measures are therefore not recoverable from authored state at all. The procedure now carries an at-conclusion capture rule - the trial owner records review status verbatim as each eligible design pass concludes - with git history of the ledger toml as an explicit fallback rather than the measure, and a missed capture reported as unavailable, never estimated. That is a trial rule that has to execute during the trial, which is exactly why it had to be written before it starts."

[[finding]]
id = "F-9"
status = "withdrawn"
severity = "major"
title = "The plain-prose rule leaves dollar expansion live"
detail = "§5.4 identifies shell corruption but narrows it to backticks and claims ‘plain prose with no code spans’ removes the failure at source; §5.2 ships only that content rule. Code-span formatting is not the shell boundary. Concrete control/probe responses often need literals such as /home/david or ; inside the double-quoted CLI style shown by the convention, the shell expands those even when the sentence contains no Markdown code span, storing changed text or executing a substitution. The scope’s own form discussion says ‘no backticks, no $’, but that stronger rule never reaches the proposed text. Also, read-back occurs after immutable disposal, so it detects rather than directly repairs. Carry the actual forbidden shell metacharacters into the operative rule or provide a shell-independent argument transport, and state the contest/re-disposition recovery path when read-back differs."

[[finding]]
id = "F-10"
status = "verified"
severity = "major"
title = "The plain-prose rule leaves dollar expansion live"
detail = "§5.4 identifies shell corruption but narrows it to backticks and claims “plain prose with no code spans” removes the failure at source; §5.2 ships only that content rule. Code-span formatting is not the shell boundary. Concrete control/probe responses often need literals such as $HOME or $(command); inside the double-quoted CLI style shown by the convention, the shell expands those even when the sentence contains no Markdown code span, storing changed text or executing a substitution. The scope’s own form discussion says “no backticks, no $”, but that stronger rule never reaches the proposed text. Also, read-back occurs after immutable disposal, so it detects rather than directly repairs. Carry the actual forbidden shell metacharacters into the operative rule or provide a shell-independent argument transport, and state the contest/re-disposition recovery path when read-back differs."
disposition = "fix-now"
response = "Confirmed, and this is drift from an accepted decision rather than a gap in one: DEC-269's choice already reads 'no backticks and no dollar signs'. The drafted convention text and section 5.4 had both narrowed it to code spans, which is a Markdown category and not the shell boundary, exactly as you say. Repair: the operative rule and section 5.4 now say plain prose, no backticks and no dollar signs, and explain why - the response is one shell argument, so both a backtick span and a dollar expansion are evaluated before doctrine sees them and the receipt still reads clean. On your prescription: a shell-independent transport is not available. Checked the CLI - dispose takes --response as a single plain argument with no file form and no stdin form - so within the no-src/ tripwire the content rule is the only remedy, and section 2.4 and section 3.3 now record that as a verified constraint rather than a preference. Recovery path added, as you asked: there is no amend verb, so the responder asks the raiser to contest, which returns the finding to answered for re-disposition, and the read-back step sits where the damage is still cheap. F-9 is now cited in section 5.4 and in R8 as the worked example - this risk fired on this design's own review, which is the best evidence the rule needed strengthening."

