id    = 357
slug  = "design-review-of-sl-251"
title = "design review of SL-251"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-251"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected selector unknown-key semantics to match design apply; observed StoredThenFlagged contradicts the write seam"
detail = "sec-2 and sec-3 claim that an unrecognised CreateRecord.facet key is accepted, persisted, and only later reported by doctor, making SelectorTable the sole inhabitant of UnknownKeys::StoredThenFlagged (.doctrine/slice/251/design.md:365-382, 771-785). The actual apply shell resolves the record kind then calls knowledge::plan_facet_edits before mint execution (src/commands/design.rs:967-993); that function returns FacetEditRefusal::UnknownField when facet_fields(kind) has no matching row (src/knowledge.rs:1234-1255). The existing regression test explicitly proves the unknown field is refused before snapshot movement or ID reservation (src/commands/design.rs:2868-2916). doctor's inert-facet check is intentionally for already-authored corpus keys and says the design-run equivalent is a refusal (src/doctor_checks.rs:141-148). Expected the contract model and pointer prose to describe the real apply boundary; observed a false third UnknownKeys state that would tell callers their invalid facet key was stored. This false doctrine must not proceed to /plan unreconciled."
disposition = "design-wrong"
response = "Confirmed against source; the design was factually wrong and is corrected at rev 66. plan_facet_edits returns FacetEditRefusal::UnknownField for a facet key with no facet_fields(kind) row (knowledge.rs:1233-1247), and the apply path calls it inside plan_checkpoints — before execute_mint, before an id is reserved (commands/design.rs:985). doctor_checks.rs:141-148 states the boundary itself: its inert-facet-key check is a corpus warning 'because the design-run seam's equivalent is a refusal'. UnknownKeys::StoredThenFlagged is deleted, the enum is back to two variants, SelectorTable::unknown_keys is Refused, and sec-3's 'One thing the contract must say carefully' is rewritten as 'One thing the contract may say plainly'. The contract is strengthened by the correction: facet is a closed vocabulary checked before any write, not an open bag with a late warning. sec-2, sec-3, sec-5 and sec-7 all moved."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Expected STD-001 token vocabularies to reuse existing named authorities; observed payload_variants retypes their literals"
detail = "STD-001 requires a meaningful literal to be named once and an existing name to be reused. sec-4 instead specifies payload_variants! invocations containing fresh token literals and says the macro emits a token array for the contract, with serde round trips merely detecting divergence (.doctrine/slice/251/design.md:844-917; the Dispose example at 871-893 retypes create/adopt/unresolved/non-durable). Real source already owns several of these vocabularies behind named authorities: DispositionForm::as_str (src/design_run/inquiry.rs:151-179), ActKind::as_str (src/design_run/attestation.rs:80-118), ReviewPolicy::as_str (src/design_run/attestation.rs:218-237), Stage::as_str (src/design_run/mod.rs:134-155), InquiryLifecycle::as_str (src/design_run/inquiry.rs:76-85), Provenance::label (src/design_run/inquiry.rs:51-62), and ReviewDisposition::arm (src/design_run/attestation.rs:589-602). Expected the contract table/macro to consume those existing names wherever they exist and introduce one authority where they do not; observed a second literal vocabulary justified by a drift test, which is precisely the duplication STD-001 forbids. The repeated tokens must be put to the fire before /plan."
disposition = "design-wrong"
response = "Confirmed; every citation resolved. Six of the fourteen closure enums already own their token vocabulary behind a const fn whose doc comment cites STD-001 as its reason for existing: Stage::as_str (mod.rs:147), ActKind::as_str (attestation.rs:107), ReviewPolicy::as_str (attestation.rs:221), ReviewDisposition::arm (attestation.rs:597), Provenance::label (inquiry.rs:55), InquiryLifecycle::as_str (inquiry.rs:78). sec-4 now specifies payload_variants! consuming those authorities via a 'via' arm rather than retyping them, and names the vocabulary only for the six enums that have none (DischargeClaim, DelegationAct, AgentAct, Reviewer, Posture, Authority). Two carve-outs recorded: WireFacetValue is Untagged and contributes no tokens; Dispose's four tokens coincide with DispositionForm::as_str but on a different type, so consuming them would assert an unenforced equivalence — Dispose names its own and pin 4 holds them."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Expected the contract pointer to have one named spelling under STD-001; observed help deliberately hand-types a second copy"
detail = "sec-6 defines PAYLOAD_CONTRACT_POINTER as the named invocation, then explicitly chooses to hand-type the same invocation in Apply's doc comment and relies on a help snapshot to catch drift (.doctrine/slice/251/design.md:1329-1366, 1368-1375). The incumbent Apply help is indeed sourced from its doc comment (src/commands/design.rs:112-130), and the design itself establishes that clap accepts long_about = <expression> (design.md:1340-1349); the objection is only the cost of moving long help behind a function. STD-001 is required and says a meaningful literal is named once, existing constants are used rather than pasted, and tests do not create an exception. Expected the help surface to consume the named pointer through the supported expression seam; observed an intentional second source plus drift detector. The duplicated invocation deserves the wheel before /plan."
disposition = "design-wrong"
response = "Contest upheld — the leftover was real and is fixed at rev 67. sec-7's touch-set row for commands/design.rs still read 'the Apply doc-comment pointer' after sec-6 moved to the attribute form; it now reads 'APPLY_ABOUT and Apply's about / long_about attributes carrying the pointer (sec-6)'. The single-sourcing itself and pin 7's reduction were correct as verified."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Expected shipped contract output to be independent of repository-private IDs; observed prompt emits ISS-333"
detail = "POL-002 requires shipped CLI behaviour to rest on Doctrine-owned portable contracts rather than a host project's conventions/state. sec-5 fixes the prompt line as  (.doctrine/slice/251/design.md:1069-1100, especially 1084). In an installed client,  is not Doctrine's development issue: it is either absent or, worse, the client's unrelated sequential issue. The existing generated-artifact precedent explicitly enumerates ISS among forbidden repo-private prefixes and explains that such IDs can silently resolve to unrelated client records (src/design_run/artifact.rs:325-365). Expected the shipped explanation to stand alone without a per-repo citation and its verification to preserve that property; observed a host-namespace-coupled literal in the committed output shape. Burn the private citation out before /plan."
disposition = "design-wrong"
response = "Confirmed. artifact.rs:325-347 lists ISS among fourteen REPO_PRIVATE_PREFIXES with the rationale that a per-repo id resolves to an unrelated client record silently, and the_artefact_cites_no_repo_private_id (artifact.rs:360-370) enforces it on the sibling generated asset with a positive control. The published document lands in install/ and ships. sec-5's root line is re-rendered without the citation, a paragraph records the constraint and where the ISS-333 reference legitimately stays (this design, the source comment, the issue), and sec-8 gains pin 10 lifting the existing detector — positive control first — over all three renderings. sec-7's POL-002 touchpoint now names it. Noted that the raise lost two inline literals to shell interpolation; the substance was unambiguous and no clarification was needed."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "Expected pin 2 to prove each declared WireType; observed its JSON-kind oracle permits semantically wrong rows"
detail = "sec-4 promises type correctness by round trip, while sec-8 pin 2 compares only the serialized JSON kind against WireType and admits that Text, Id, and Token are all strings (.doctrine/slice/251/design.md:927-932, 1640-1656). Parsing the fixture as DesignId proves the fixture value, not that the contract row chose Id rather than Text, nor that its advertised IdKind slice is correct; the actual source distinguishes the five declarable kinds through IdKind::declarable (src/design_run/ids.rs:70-90), and AdoptAuthored.sections is a BTreeMap keyed by DesignId (src/design_run/submission.rs:696-704), yet pin 2 only asks that such keys parse. Likewise every Named target serializes as an object: swapping ApplyRequest.traversal and stage between TraversalDeclaration and StageDeclaration (src/design_run/submission.rs:926-932) preserves JSON kinds, and pin 9 only proves names resolve and remain reachable, not that either edge names its real Rust type (design.md:1777-1794). Expected a source-backed oracle for semantic string categories, IdKind domains, and nominal Named targets; observed a coarse kind check under which a materially false machine contract stays green. This central anti-drift rung must be reforged before /plan."
disposition = "design-wrong"
response = "Contest upheld — the repair proved structural shape and the prose claimed nominal type. Corrected at rev 67 on both counts. sec-8 pin 2 now says 'checked against the target's key set' and adds the residue explicitly: two closure types with identical key sets would remain exchangeable. Checked whether that is live — the eleven contract-bearing structs have eleven distinct key-name sets (ApplyRequest 11, SubmissionEnvelope 3, AdoptAuthored 2, TraversalDeclaration 4, StageDeclaration 2, AcceptanceDeclaration 2, CreateRecord 6, DischargeDeclaration 3, ReviewPolicyDeclaration 2, CheckpointActDeclaration 3, AgentActDeclaration 3; no collisions) — so the pin is total over the current closure by a property of the closure rather than by construction, and the design now says exactly that. The nominal escalation, a payload_struct! mirroring sec-4's enum instrument, is recorded in sec-8 and in sec-4's 'Where the pins do not reach', which is now three regions rather than two. Not taken: real machinery for a currently theoretical hazard."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Expected presence pinning in both directions; observed required fields may be mislabeled optional without failure"
detail = "sec-4 says presence correctness is verified, but sec-8 pin 3 asserts only that keys present in a minimal value are a superset of rows declared Required (.doctrine/slice/251/design.md:927-932, 1658-1670). This catches an optional source field falsely declared Required, but not the converse: if run_uid, known_revision, or submission_id is changed in the contract from Required to Optional, the real minimal ApplyRequest still serializes all three because SubmissionEnvelope makes them mandatory (src/design_run/submission.rs:680-691), while the declared-Required set merely shrinks and the superset assertion remains true. Pin 1 checks only key inventory, so it does not close the gap. Expected equality against a source-derived required-key oracle or an equivalent two-way check; observed a one-way assertion that allows the contract to understate requiredness while every proposed pin passes. The false green must be broken before /plan."
disposition = "design-wrong"
response = "Contest upheld a fourth time, and it is a real fourth face of the same class. Verified: WireFacetValue is #[serde(untagged)] over List(Vec<String>) and Text(String) (submission.rs:252-256); its contract rows are VariantPayload::Shape(&WireType), not KeyContract, because an untagged variant is a shape rather than a set of keys (sec-2); and pin 4 hands both shapes to pin 2. My rev-69 obligation was scoped to Seq and Map KEYS, so it reached neither of them, and WireFacetValue::List(vec![]) would satisfy Shape(Seq(Integer)) exactly as well as Shape(Seq(Text)). Fixed at rev 70 by restating the obligation over the ROW rather than the key, which is the general form: every Seq and Map binds wherever it is DECLARED — a KeyContract's ty, an untagged variant's Shape, or a container nested inside either. That closes the case by construction instead of by an inventory of today's rows, which is what the key-scoped wording did and why it lasted one round. Pin 2's recursion paragraph gains the matching sentence: the walk recurses into a Shape the same way it recurses into a Seq element or a Map value. This is the fourth defect in the same pin and the third consecutive one where the assertion was sound and its input was not. The pattern is now stated in the oracle discipline rather than left in review history, and the correction this round is specifically the one that generalises: a rule written over an inventory of the places a property currently appears will be wrong as soon as the model has a second kind of place, and this design's model has three."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "Expected UnknownKeys to exist only where wire keys exist; observed every enum TypeContract requires a false or meaningless value"
detail = "sec-2 makes unknown_keys mandatory on TypeContract before TypeForm distinguishes Struct from Enum (.doctrine/slice/251/design.md:147-169), even though the same section rejects type-level tagging because a field meaningless on some inhabitants is a slot for a wrong answer (design.md:171-175). The closure represents fourteen enums as TypeContracts. Several have no key surface at all: Stage is a fieldless externally tagged enum serialized as a bare token (src/design_run/mod.rs:118-132), and WireFacetValue is untagged text-or-list (src/design_run/submission.rs:238-257). AgentAct is mixed: BlockingSetDeclared has keyed payload while DraftingReady is a bare string (src/design_run/attestation.rs:664-683), so one type-level UnknownKeys value cannot truthfully describe both arms. The design discusses UnknownKeys values only for the twelve structs and SelectorTable (design.md:365-382) and supplies no not-applicable state or per-payload placement. Expected unknown-key semantics to live on Struct and keyed VariantPayload shapes where the question is meaningful; observed an obligatory field that cannot be instantiated truthfully across the promised closure. The model must confess and change before /plan."
disposition = "design-wrong"
response = "Confirmed, and it is sec-2's own argument turned on the neighbouring field. The section deletes Tagging::NotTagged because a field meaningless on half its inhabitants is a slot for a wrong answer, then two paragraphs later obliges all fourteen enums — Stage among them, fieldless and externally tagged — to carry an unknown_keys value. unknown_keys now lives inside TypeForm::Struct { unknown_keys, keys }. Verified the model fact behind the placement: deny_unknown_fields is a serde container attribute and exactly three closure types carry it (submission.rs:123, 824, 854), all structs; no closure enum denies. Recorded that if one ever does the field goes on TypeForm::Enum rather than VariantContract, since serde makes it a container property, not an arm's."

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "Expected the whole touch-set to include files that gain fixtures; observed sec-7 calls submission.rs and attestation.rs read-only"
detail = "sec-8 says each of the eleven directly pinned struct types gains a cfg(test) fully_populated function beside its definition (.doctrine/slice/251/design.md:1601-1610). The cited precedent is literally an impl method in src/design_run/submission.rs:645-674. Yet sec-7 labels submission.rs and attestation.rs read, not written, says every wire definition stays untouched, and omits both from the change table while assigning the pin ladder to tests.rs plus in-module tests (design.md:1427-1446). Most closure structs are defined in submission.rs, and enum sample construction also spans attestation.rs. Expected the claimed whole touch-set and rough sizes to include every module that receives these cfg(test) helpers, or the verification section to place them somewhere privacy permits; observed contradictory implementation instructions that will produce an incomplete plan. Reconcile the file ownership before sequencing."
disposition = "design-wrong"
response = "Confirmed. Declaration::fully_populated is a #[cfg(test)] pub(super) fn inside submission.rs:653 — an impl method in the production file, exactly as sec-8 pin 1 cites it — while sec-7 called that file read-not-written and omitted it from the touch-set. sec-7 now carries rows for submission.rs, attestation.rs and the three files holding payload_variants! invocations, with test-only sizes, and replaces the collapsed claim with the distinction it was reaching for: file written versus behaviour changed. No wire type's definition moves, so the behaviour-preservation gate stays vacuous; the files are still edited."

[[finding]]
id = "F-9"
status = "verified"
severity = "blocker"
title = "Expected shipped Rust type names to derive from the types under STD-001; observed unpinned static strings"
detail = "sec-2 makes TypeContract.name a static string containing the Rust type name and makes agreement with serde refusals and source navigation load-bearing (.doctrine/slice/251/design.md:155-160, 432-451). The real names are owned by declarations such as ApplyRequest (src/design_run/submission.rs:921-967), AgentAct (src/design_run/attestation.rs:664-683), and Stage (src/design_run/mod.rs:118-132). No proposed pin compares name with the source type, and pin 9 checks only that JSON names are internally self-consistent and reachable (design.md:1777-1794). Thus a Rust rename can leave the old literal in TypeContract, every Named edge and JSON key can agree with that stale literal, and all listed pins pass while the refusal and contract use different vocabularies. STD-001 requires a meaningful repeated value to be named once, not merely cross-consistent. Expected construction from the type identity, for example stringify at an identifier-bearing seam, or an explicit source-name oracle; observed a hand-authored static field with no anti-drift link. Reconcile before /plan."
disposition = "design-wrong"
response = "Confirmed. sec-2 makes TypeContract::name load-bearing for refusal-vocabulary agreement and source navigation, and no pin tied it to the type: a Rust rename leaves a literal that every Named edge and every JSON key stays consistent with, so pin 9's internal self-consistency is green while the refusal and the contract speak different vocabularies. Two seams now carry it, each where the identity is already in hand — payload_variants! emits enum names by stringify! at the invocation (a compile barrier), and assert_keys_described compares name against T for the structs, since that call site already holds both. sec-2, sec-4 and sec-8 pin 1 all record it, and the ladder table gains both rows. Repaired with F-5."

[[finding]]
id = "F-10"
status = "verified"
severity = "blocker"
title = "Expected R5 to compare the contract with the turn-envelope budget; observed it compares against the worked-example cap"
detail = "sec-5 and sec-9 say the 8,826-byte render is about 8.6 times the turn envelope's 1,024-byte cap and conclude that pushing only an address is forced rather than preferred (.doctrine/slice/251/design.md:1130-1143, 1884-1895). Source assigns 1,024 bytes only to ENVELOPE_DECLARATION_EXAMPLE_BYTES, the compile-time cap for the worked mutation example (src/design_run/render/mod.rs:117-124; src/design_run/render/envelope.rs:62-81). The entire normal envelope is governed by ENVELOPE_NORMAL_BUDGET_BYTES = 24,576 (src/design_run/render/mod.rs:126-134), which the design itself correctly cites when pricing the 46-byte pointer (design.md:1323-1327). Expected R5 and the body-versus-address decision to use the actual 24 KiB envelope ceiling and account for combined saturated size and context cost; observed a category error that makes the central forced-choice rationale factually false. Re-weigh the decision before /plan."
disposition = "design-wrong"
response = "Confirmed as a category error. ENVELOPE_DECLARATION_EXAMPLE_BYTES = 1024 caps the worked-example constant (render/mod.rs:117-124); the envelope runs ENVELOPE_NORMAL_BUDGET_BYTES = 24576 (126-134), which sec-6 already cites correctly when pricing the 46-byte pointer. Against the real ceiling 8826 B is 36% of budget and would fit beside the 15576 B saturated table, so the address-not-body choice is preferred, not forced. The decision stands on grounds that survive the correction — 46 B every turn against 8826 B every turn, for content fetched once a session — and sec-5 and sec-9 now say preferred and give those grounds. Flagged in sec-9 as load-bearing for OQ-B: an escalation nobody can reopen is not an open question."

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "Expected sec-3's closed facet-vocabulary count to match facet_fields; observed four authorities, not three"
detail = "sec-3 states that the three closed facet value enums are Confidence, Basis, and a constraint source (.doctrine/slice/251/design.md:597-619). The real facet rows use four distinct closed-vocabulary authorities: Confidence::KNOWN and Basis::KNOWN on assumption (src/knowledge.rs:877-889), ConstraintSource::KNOWN on constraint (src/knowledge.rs:966-974), and Provenance::KNOWN on evidence (src/knowledge.rs:993-1007). Confidence is reused on evidence, but Provenance is a separate fourth enum. Expected the finished design's factual enumeration to match the source it claims was traced; observed an omitted closed vocabulary. The generic FieldShape mapping may still carry it, so this is minor, but the prose must cease bearing false witness."
disposition = "design-wrong"
response = "Confirmed. Four closed facet vocabularies, not three: Confidence::KNOWN (assumption and evidence rows), Basis::KNOWN (assumption), ConstraintSource::KNOWN (constraint) and Provenance::KNOWN (evidence, knowledge.rs:993-1007). sec-3 corrected, with the omission named. Agreed on severity — the FieldShape mapping is generic and never enumerated them, so nothing downstream was built on the miscount; the defect was a design claiming a source trace it had not completed."

[[finding]]
id = "F-12"
status = "verified"
severity = "blocker"
title = "Expected every RecordKind to flow into the selector table by construction; observed ALL is an independently maintained list"
detail = "The sec-3 drift-proof claim says an eighth kind flows through with no second list to update because the builder uses RecordKind::ALL and facet_fields, at design.md:753-769. In source, however, the enum is declared at src/knowledge.rs:58-68 while RecordKind::ALL separately enumerates exactly seven variants at src/knowledge.rs:159-169. Adding an eighth enum arm to the exhaustive facet_fields match does not add it to ALL, so the generated contract can silently omit the new kind. The only apparent ALL check iterates ALL and asserts seven distinct prefixes at src/knowledge.rs:3334-3341; it also remains green when an eighth enum variant is omitted. Expected an enum-derived exhaustive source or an explicit equality pin against all declared variants; observed the claimed compile barrier does not cover the iteration authority."
disposition = "design-wrong"
response = "Contest upheld — sec-3 and pin 5 were honest and sec-7 was not, which is the contradiction you named. sec-7's 'Two properties of those 25 lines' paragraph still claimed a new kind arrives without an edit and counted iteration over ALL as a compile barrier. At rev 67 it claims only what it holds — a new facet field arrives automatically, and the FieldShape map's missing wildcard is a compile error — followed by an explicit paragraph that iterating ALL is not a barrier, why (ALL is hand-maintained, facet_fields forces the arm and ALL does not), where the residue is carried (pin 5's kind-set equality, oracle an exhaustive match over RecordKind), and whose repair it is (the knowledge tier's, not this slice's)."

[[finding]]
id = "F-13"
status = "verified"
severity = "minor"
title = "Expected the fourteen-enum classification to reconcile; observed the outside-the-split count and membership contradict each other"
detail = "In sec-4, design.md:947-985 divides fourteen closure enums into six consuming existing authorities, six using the naming arm, WireFacetValue with no tokens, and Dispose as the separate type-identity judgement. That arithmetic leaves two enums outside the six-plus-six split. But design.md:978 says three enums sit outside it, then immediately lists Reviewer, Posture and Authority as taking the naming arm and therefore being inside the second six. Expected the count and classification to agree; observed a fresh revision-66 contradiction that makes the macro inventory ambiguous even though the STD-001 repair itself is sound."
disposition = "design-wrong"
response = "Confirmed — my own prose, muddled. The paragraph said 'three enums sit outside that split' and then listed WireFacetValue, Reviewer/Posture/Authority (which are inside it, on the naming arm) and Dispose. At rev 67 sec-4 states the partition once and correctly: fourteen divide six / six / two. Six consume an authority (the table above); six have none and take the naming arm — DischargeClaim, DelegationAct, AgentAct, Reviewer, Posture, Authority; two sit outside both — WireFacetValue, which is Untagged and contributes no tokens, and Dispose, whose tokens coincide with DispositionForm::as_str on a different type and so are named rather than consumed."

[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "Expected one declared home for payload_variants invocations; observed sec-7 assigns them to both the new module and five type modules"
detail = "The sec-7 touch-set says src/design_run/payload_contract.rs owns payload_variants and its per-enum invocations at design.md:1615-1618. The next rows instead assign those invocations to submission.rs, attestation.rs, inquiry.rs, traversal.rs and mod.rs at design.md:1624-1627, and design.md:1639-1643 relies on the latter placement when describing what changes in those files. These are mutually exclusive implementation instructions and materially change the touch-set, macro visibility and phase sequencing. Expected one unambiguous invocation location; observed the F-8 integration introduced two competing owners."
disposition = "design-wrong"
response = "Confirmed — introduced by my F-8 repair, which over-reached. Fixing the touch-set omission I added rows putting payload_variants! invocations in the five type-owning modules while the payload_contract.rs row already claimed them, splitting macro ownership across six files. Resolved toward one home at rev 67: every invocation lives in payload_contract.rs beside the PAYLOAD table that reads its output, and the submission.rs / attestation.rs rows carry #[cfg(test)] fully_populated fixtures only. Nothing forced the scatter — the invocation needs the type in scope, which an intra-module use supplies, and the six as_str authorities are pub(crate). sec-7 now records the resolution and its reason, and the out-degree paragraph reads as payload_contract.rs's imports rather than five modules'. The inquiry/traversal/mod row is gone."

