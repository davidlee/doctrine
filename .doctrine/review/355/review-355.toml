ref   = "SL-254"

[[finding]]
id = "F-1"
status = "open"
severity = "blocker"
title = "Expected retained funnel to receive Spawn; observed the chosen unbound path has no Spawn writer"
detail = "SL-254 design.md:577-579 mandates `fork --worker --slice N --phase PHASE-NN`, but its settled OQ-1 at design.md:739-762 requires the collapsed forks to stay unbound and explicitly declines those flags. D2 at design.md:842-849 then deletes `run_create_fork_and_record` and says `dispatch_import` will heal Spawn. The code does not support that combination: src/dispatch.rs:6645-6650 prescribes Spawn whenever a ready phase has no row; src/dispatch.rs:6932-6935 is the create-fork Spawn recorder being deleted; and src/mcp_server/dispatch.rs:286-315 refuses `dispatch_import` without the durable binding that OQ-1 forbids. The selected `worktree import --from-worktree` path records no funnel transition, so `dispatch next` has no route beyond Spawn and cannot drive verify, conclude, or reap."

[[finding]]
id = "F-2"
status = "open"
severity = "major"
title = "Expected every confined worker to carry env identity; observed the macOS prefix never sets DOCTRINE_WORKER"
detail = "SL-254 design.md:545-548 makes `DOCTRINE_WORKER=1` the sole post-collapse identity and says the confinement argv sets it; INV-1 at design.md:609-614 then reduces refusal to that environment fact. The surviving Darwin path in scripts/pi-spawn-confined.sh:95-115 only reads the `jail-prefix` argv, and src/worktree/jail.rs:628-655 constructs that Seatbelt prefix as `sandbox-exec ... -- env TMPDIR=...` with no `DOCTRINE_WORKER` assignment. Only the Linux array sets it, at scripts/pi-spawn-confined.sh:120-127. Once the disk marker is deleted, a macOS worker therefore runs confined but is not recognized by the CLI worker-mode guard, contradicting the process-identity invariant and platform-parity claim."

[[finding]]
id = "F-3"
status = "open"
severity = "major"
title = "Expected worker_commit belts to remain enforced; observed check-commit is replaced by a different prove gate"
detail = "SL-254 design.md:535-541 and design.md:616-618 say the funnel contract and INV-2 posture are unchanged because `classify_import` survives. The deleted path has an additional non-topological belt: src/mcp_server/worker_commit.rs:473-477 runs the mutating `CheckKind::Commit` gate before creating the worker commit, and src/mcp_server/worker_commit.rs:563-581 reruns it before adopting a pre-existing commit. The retained live-worktree path instead calls only `classify_import` at src/worktree/import.rs:464-472, applies the patch, and then resolves non-mutating `CheckKind::Prove` at src/worktree/import.rs:258-286 and runs it at src/worktree/import.rs:480-491. Scope still survives, but check-commit does not stay where it was and prove is not the same cadence or mutation contract. The claimed unchanged belt posture, and the resulting decision to omit this change from governance revision, are unsupported."

[[finding]]
id = "F-4"
status = "open"
severity = "blocker"
title = "Expected SPEC-012 revision to cover every falsified contract; observed the design changes only the fork stamp wording"
detail = "SL-254 design.md:268-270 and design.md:723-730 limit the SPEC-012 landing to responsibility 18 losing the stamp. `./target/debug/doctrine spec show SPEC-012` exposes several additional active contracts the design deletes or rewrites: REQ-192 requires the disk-marker-primary, marker-absent-linked-tree fail-closed guard; REQ-248 requires `fork --worker` to stamp the marker and emit the per-worktree env contract; REQ-250 requires `land` to refuse a marker-bearing dispatch fork; and REQ-252 says env delivery is subprocess-only for codex/pi. SPEC-012 also normatively describes per-harness spawn paths and marker identity. The proposed env-only identity, branch-shape land classifier, and Claude subprocess make those active requirements false, so a stamp-only REV would leave accepted specification contradicting the shipped mechanism."

[[finding]]
id = "F-5"
status = "open"
severity = "blocker"
title = "Expected accepted integration topology to match the one-arm design; observed ADR-012 is excluded despite deleting its Claude synthesis case"
detail = "SL-254 design.md:280-283 declares ADR-012 untouched and design.md:723-730 excludes it from the governance landing. `./target/debug/doctrine adr show ADR-012` makes the deleted arm normative: Decision 3 says, `on arms that do not return a per-worker fork branch — the Claude Agent arm ... the per-phase deliverable branch is cut from dispatch/<slice> at sync time`; its Verification section repeats, `on the Claude arm (no fork branch), phase/<slice>-NN is cut from dispatch/<slice> at sync`. The collapsed Claude subprocess does return an orchestrator-created worker fork, so both the topology rule and its verification fixture become stale. Transport of the delta may remain live-worktree import, but the branch-producing arm topology explicitly changes; ADR-012 cannot remain untouched."

[[finding]]
id = "F-6"
status = "open"
severity = "minor"
title = "Expected incumbent Linux spawn to name bwrap-unavailable; observed it performs no capability check"
detail = "SL-254 design.md:374-377 says named Linux refusal through `REASON_NO_BWRAP` is already surviving-arm behavior, and design.md:580-583 relies on that exact outcome. In scripts/pi-spawn-confined.sh:116-140 the Linux branch puts literal `bwrap` in PREFIX and executes it through `timeout`; it never calls `have_bwrap` or `worktree jail-prefix`. The named check exists only in src/worktree/jail_prefix.rs:114-140, a path the script uses on macOS but not Linux. Missing bwrap still fails closed at exec, but not with the promised stable reason, so the design must add a new check or stop claiming behavior-preserved named refusal."

[[finding]]
id = "F-7"
status = "open"
severity = "minor"
title = "Expected reap design to name pi terminal event; observed it specifies the stale agent_end signal"
detail = "SL-254 design.md:485-490 and R4 at design.md:927-933 say the pi profile polls for `agent_end`, and design.md:478 uses that event as the typed-parity basis. scripts/lib/pi-reap.sh:68-82 says the opposite from measured production behavior: `The terminal event is agent_settled, NOT agent_end`; `agent_end` can sit far behind EOF, while the poll matches both only for compatibility. Preserving `pi_await_and_reap` avoids an immediate regression, but the design records the wrong completion contract and could reintroduce the documented full-backstop burn if the generalized profile is implemented from that contract."

