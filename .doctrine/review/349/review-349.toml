id    = 349
slug  = "design-review-of-sl-249"
title = "design review of SL-249"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-249"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Recovery can apply an old acceptance to a changed retry payload"
detail = "SL-249 design §5.3 (sec-5, lines 525-536) says body and facet payload need not be journalled because a retry with the same submission carries them, and also says the journal carries id/title/slug. The source contradicts both premises: RecoveryIntent in src/design_run/attestation.rs:983 stores only submission, subject, reserved_record, state, and acceptance; execute_mint in src/commands/design.rs:973 rebuilds the mint plan from the new retry but later consumes the held intent acceptance at line 1061. The receipt digest comparison in src/design_run/run.rs:218 exists only after snapshot persistence. A crash before that persistence therefore permits the same submission id to be retried with changed body/facets, then marks the changed record accepted using the old acceptance. That violates the claimed idempotency and acceptance binding and can produce an incorrectly accepted record. Cheapest fix: bind a payload digest or the payload itself into RecoveryIntent at step 1 and refuse a changed retry before any resumed write."
disposition = "fixed"
response = "Contest upheld on both counts, and the second is the more embarrassing. (a) Digest domain: you are right that an undefined domain makes I12 circular. Defined now, and reusing rather than inventing — the material is sha256(serde_json::to_string(declaration)), the exact payload term plan_checkpoints already computes for acceptance_digest, journalled unconditionally instead of only when an acceptance rides. That is total over kind/title/slug/body/facet by construction (skip_serializing_if is total over Declaration; facet is a BTreeMap), it makes 'the payload changed' and 'the acceptance no longer describes this content' one comparison rather than two that can disagree, and a new Declaration key joins it automatically. A second digest domain beside the acceptance's would have been the defect you were pointing at, one level over. Recorded in sec-7, D8, I12, and the sec-13 test row now pins that a semantically identical payload rebuilt from scratch still resumes. (b) The false journal claim: confirmed at src/commands/design.rs, the state() < Materialised arm — only the reserved id comes from the journal, title and slug come from the MintKind in the plan rebuilt from the retry, and RecoveryIntent stores neither. I inherited that sentence from the draft and repeated it in the very text correcting the finding, which is worse than the original error. Corrected in sec-3 and sec-7. The consequence is larger than the sentence: DEC-168's recorded rationale claims step 5 is *forced* because step 4 can only reach the journal, and that argument is void — step 4 could reach the retry payload exactly as step 5 does. The conclusion survives on real grounds (apply_record_effects already exists, is already idempotent, already carries status and the shapes edge, so a record's effects resume as one unit), and D8a records the correction. The ruling itself is corrected at reconcile via the objective 4 REV, since this slice has no verb for amending a knowledge record."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Settle splits one TOML transition into two writes"
detail = "SL-249 design §5.4 (sec-5, lines 610-625) justifies apply_facet_edits followed by set_record_status as non-atomic across two files. In the source both operations target the same record-NNN.toml: apply_facet_edits receives that record path, while set_record_status resolves and rewrites the same path in src/knowledge.rs:1722-1748. The second call can refuse after the facet write because a managed status key is absent or the transition is invalid, leaving a partially settled record. This directly falsifies I7 at §6 (every validation precedes every write; refused command is byte-identical) and weakens PRD-010 REQ-062 atomic/edit-preserving transition semantics. Cheapest fix: prevalidate the current status and transition, then apply facets and status to one held DocumentMut and commit one atomic write."
disposition = "fixed"
response = "Upheld, and the premise error is worse than you state — it was factual, not merely arguable. set_record_status resolves record_toml_path(root, kind, id), which is the same record-NNN.toml that carries [facet]; there is no second file. The draft ordered two writes to buy a crash-safety property that a single write gives outright. Better still, one write costs nothing: facet_write::set_facet_mixed and dep_seq::apply_status both already take a held &mut toml_edit::DocumentMut, and set_authored_status is only their path wrapper — so composition, not a third writer. Design amended: sec-6 (§5.2) gains 'settle writes once' with the apply_settlement signature and the core/wrapper table; sec-8 (§5.4) path B rewritten as validate-all, apply-both, write-once, and says plainly what was wrong; D6 in sec-11 is superseded with its old reasoning left visible; I7 now covers the whole verb rather than its facet half. One consequence worth naming that the finding did not: the status *vocabulary* check lives inside set_record_status above the call, so settle reaching apply_status directly would have duplicated it — sec-7 lifts it into a shared predicate. That extraction is the only refactor the fix forces."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "P1 and P2 do not pin facet ownership multiplicity"
detail = "SL-249 design §5.1 D1 (sec-5, lines 273-285) claims P1 plus P2 proves the facet table is exhaustive and has no extra mappings. P1 compares only a union set of field names, so it discards multiplicity and owning kind; P2 only proves that each listed pair is accepted by validate_facet. A duplicated pair or an extra legal pair therefore passes both. This is not hypothetical structure: confidence is legitimately shared by ASM and EVD in src/knowledge.rs RawFacet/validate_facet, so ownership multiplicity is semantic data the union cannot recover. The pins can stay green while the table exposes a valid field on an unintended record kind, falsifying I2/I3. Cheapest fix: compare the exact per-kind typed serde key sets, or an exact multiset of (RecordKind, FacetField), against an oracle derived independently of the authored table."
disposition = "fixed"
response = "Contest upheld. The equality closes cross-kind misplacement and does nothing about a name repeated *within* one row: both P1 and P2 compare sets, two identical (kind, field) entries collapse to one on each, and every consumer that iterates the row — the subverb's flag set, the step-5 write, settle's coverage — sees it twice. You are also right that the per-kind serde oracle you originally proposed shares the limit, which is the useful part of the contest: the gap was in the comparison, not in the choice of oracle, so declining the serde route on cost was independent of it. Added P3 / I3b: each row's length equals its deduplicated length. One comparison, and it is the cheapest of the three. Multiplicity *across* rows stays legitimate and P3 is silent about it — confidence on assumption and evidence is the case that must keep passing, and sec-5 now says so explicitly so a later reader does not 'fix' P3 into forbidding it. Amended: sec-5 P3 and the closing paragraph, I3b in sec-9, D1 in sec-11, the sec-13 test row."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "I9 cannot detect a wrong wire-key subject mapping"
detail = "SL-249 design §6 I9 and §9 (sec-6 line 729; sec-9 line 994) compare the serialized key set of a fully populated Declaration with the union of keys in the wire-consumer table. That proves key inventory only; it does not prove the subject-kind mapping in §5.3. The table can wrongly map body to cp or dispose to sec and the asserted sets remain identical. The single body-on-cp closure test catches one observed instance but does not establish the stated across-the-whole-field-set invariant. Cheapest fix: add an independent per-key by per-subject-kind behavioral matrix that admits only effectful combinations and refuses every inert combination, rather than deriving the oracle from the table under test."
disposition = "fixed"
response = "Upheld. I9 compares a fully-populated Declaration's serde key set against the table's; the two sets are identical whether the table maps body to sec- or to cp-, so it proves inventory and says nothing about the mapping. The single body-on-cp- replay is one cell standing in for a criterion written 'across the whole field set'. Fixed as you propose, with the oracle deliberately behavioural: I10 (sec-9) asserts that for every (Declaration key x design-run subject kind) pair, a submission carrying that key on that subject is either observably effectful or refused — never silently accepted. I9 keeps its narrower inventory job and now says so. sec-13 carries the test row and sizes it (~16 keys x 5 subject kinds, table-driven, generated by iterating both vocabularies), and sec-7's table row records that the mapping needs I10 as well as I9. Two things the finding did not reach, now recorded: R10 — a matrix of that shape is the kind later trimmed to 'the interesting ones', which would restore exactly the state you found, so it is generated rather than enumerated; and sec-14 flags that 'observably effectful' needs a per-key definition before the test is written, since some keys are effectful only in combination."

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "The governance canary can pass a still-four-kind spec"
detail = "SL-249 design §9 (sec-9, lines 1020-1022) treats DEC-176 as the executable proof for R1, but that ruling only requires all seven kind names and three phrase pairs to occur in SPEC-019 prose. It does not inspect the structured responsibilities surfaced by doctrine spec show, reject residual four-kind framing, or prove the new EVD/HYP/CPT contracts and lifecycle verbs. SPEC-019 and PRD-010 currently carry structured and prose claims, so adding one sentence with the required substrings can make the canary green while the authoritative governance remains internally incoherent. This is weaker than the design objective and the claimed governance correction. Cheapest fix: make the canary inspect both authored tiers for SPEC-019 and PRD-010, assert the exact structured kind set and absence of stale four-kind framing, and retain explicit agent criteria for the semantic contracts and verbs."
disposition = "fixed"
response = "Contest upheld via F-14, which is the single defect all three were pointing at from different angles: the allowlist's declared phrase matched zero times because the source wraps it mid-phrase. F-5 asked whether the classification was right (it is: 31/1), F-9 whether the exemption was justified (it is: spec-019.md:330 counts integration sites), F-11 whether it was bounded (now: by a count identity) — and F-14 found that none of that mattered while the phrase could not be found at all. D9 now specifies whitespace-collapsed matching, and sec-12 and sec-13 state it too. All three of these dispositions stand or fall with F-14; verify or contest them together."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "I1 oracle never exercises the new writer"
detail = "SL-249 design §6 I1 and §9 (sec-6 lines 707-709; sec-9 line 986) rely on the existing full RecordFacet round-trip suite as the no-regression proof. That suite exercises render_record_toml, which is cfg(test)-only and explicitly has no production caller in src/knowledge.rs:810-823; it also omits relation and relationships content. It cannot catch apply_facet_edits dropping comments, unknown sibling keys, or inert tables, nor a wrong path/table selection. Therefore the test named for I1 does not verify the new edit-preserving seam required by SPEC-004. Cheapest fix: run a success-path fixture through apply_facet_edits or the CLI with comments, unknown sibling keys, and relation tables, assert only the intended facet values changed, and assert a second application is Noop."
disposition = "fixed"
response = "Upheld. render_record_toml is #[cfg(test)] and its own comment says it has no production caller — writes go through render_record_toml_seed plus dep_seq::set_authored_status — and it omits [[relation]]/[relationships] by construction. So naming that suite as I1's oracle proved the read model survives and nothing about whether apply_facet_edits preserves comments, unknown sibling keys or relation tables, which is what SPEC-004 actually requires. Fixed: I1 (sec-9) is narrowed to the model round-trip and states its own limit; I11 is the new edit-preservation invariant; D10 (sec-11) records it; sec-13 carries the fixture test — a record with comments, unknown sibling keys, [[relation]] and [relationships], asserted byte-identical outside the intended [facet] values and a no-op on second application — and adds it as a closure criterion in its own right. sec-13's gate section now states once what the behaviour-preservation gate does not buy, since the first draft assumed it bought this."

[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "D9 can miss capitalised four-kind framing"
detail = 'Revision 54 sec-11 D9 and sec-13 define the negative canary as the backticked word `four` not occurring, but never require a case-insensitive comparison. The current authoritative `doctrine spec show SPEC-019` output contains the stale heading `Four kinds, one engine`. An implementation using the natural Rust spelling `text.contains("four")` satisfies the test as written while leaving that explicit four-kind framing in place, reproducing F-5 through capitalization. Cheapest fix: specify a case-folded substring ban over both authored tiers, and include the current capitalised heading as the negative test fixture; a word-boundary-only check is insufficient because authored slugs also contain `four`.'
disposition = "fixed"
response = """Upheld, and verified: .doctrine/spec/tech/019/spec-019.md:34 is '### Four kinds, one engine' — a capitalised section heading, and on any reading the single most prominent stale kind-set claim in the document. A contains("four") check passes straight over it, so the fix I wrote for F-5 would have reported green on the site a human reader hits first. That is the third order of the same error: a fix to a fix, missing for a reason narrower than the one before it. D9 now specifies case-insensitive matching on a word boundary — the boundary being what keeps a blanket ban from firing on an unrelated substring — and sec-13's criterion states it too, since a criterion that omits the matching rule is a criterion the test can satisfy trivially. One residual stated rather than closed: a numeral ('the 4 kinds') evades the assertion, and banning '4' in documents full of ids and counts is not a trade worth making. sec-12's R4 now records that D9 took three rounds to converge on one assertion, because that is the risk's own argument demonstrated rather than asserted."""

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "SL-249 scope card carries the understated site count"
detail = "Raised by the responder against its own artefact, for the record rather than for someone else to fix. The RV-349 F-5 amendment written into .doctrine/slice/249/slice-249.md's Verification / closure intent says 'all ~24 occurrences across them are kind-derived'. The design has since been recounted at 32 (case-insensitive, word boundary: spec-019.md 25, spec-019.toml 3, spec-010.md 4, spec-010.toml 0), so the card and the design disagree about the evidence for the same criterion. Fixed in the same commit as F-5's and F-7's integration; recorded here because a scope card that disagrees with its design is the failure the review.scope runbook step exists to catch, and it was introduced by this review rather than found by it."
disposition = "fixed"
response = "Card corrected to 32 with the per-file breakdown, matching sec-11. Self-raised and self-disposed in one round; left on the ledger rather than silently fixed so the slice's own record shows the scope card drifted from the design during review and was caught."

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "D9 misclassifies an independent use of four"
detail = "Revision 57 sec-11 D9 says all 32 case-insensitive word-boundary occurrences of 'four' are kind-derived and none is independent, and uses that corpus claim to justify the blanket ban. The source contradicts it: .doctrine/spec/tech/019/spec-019.md:330-332 says admitting the record kinds touches 'four coupled sites' and enumerates integrity::KINDS, RELATION_RULES, outbound_for, and the exact-coverage test. Expanding the record-kind set from four to seven does not change that integration-site count. The canary therefore rejects a correct governance statement (or forces it to be reworded) on a premise the corpus disproves; sec-12 R4's 'thirty-two such statements' and sec-13's 'all 32 ... kind-derived' repeat the error. Cheapest fix: state the true split (31 stale kind-count occurrences, one independent occurrence) and either pin an exact exception for the independent sentence or deliberately reword that sentence while acknowledging the blanket test has this known false positive."
disposition = "fixed"
response = "Contest upheld via F-14, which is the single defect all three were pointing at from different angles: the allowlist's declared phrase matched zero times because the source wraps it mid-phrase. F-5 asked whether the classification was right (it is: 31/1), F-9 whether the exemption was justified (it is: spec-019.md:330 counts integration sites), F-11 whether it was bounded (now: by a count identity) — and F-14 found that none of that mattered while the phrase could not be found at all. D9 now specifies whitespace-collapsed matching, and sec-12 and sec-13 state it too. All three of these dispositions stand or fall with F-14; verify or contest them together."

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "Review notes omit the ledger's eighth finding"
detail = "Revision 57 sec-14 says RV-349 has seven findings and its table ends at F-7, but the current ledger already contains F-8, raised and disposed before this verification round. That finding is not invalid merely because the responder raised it: the project's review-ledger protocol explicitly permits self-review to drive both roles via cooperative --as assertions, with the review lock and per-finding transition gate preserving the workflow. Since F-8 records a real scope/design drift and is now verified, omitting it makes sec-14's pass provenance and finding count false. Cheapest fix: count eight pre-round-four findings and add an F-8 row that identifies it as responder-self-raised and fixed in the revision-57 integration."
disposition = "fixed"
response = "Upheld — sec-14 said seven findings and had no row for F-8, because I wrote it before raising F-8 and did not revisit it. Corrected: the table is now ten findings with F-8, F-9 and F-10, and the round structure is four rounds rather than three. Two things changed beyond the count, because a bare arithmetic fix would have left the section saying less than the pass earned. The table is now one column of outcome per finding rather than a column per round — at four rounds the per-round grid was becoming a schedule rather than a record. And the analysis under it now names what the pass actually found: two defects in the design as drafted were false premises about the source, in opposite directions, and everything after round one was a defect in a fix. Six of the ten were a claim of totality asserted rather than enumerated — the pins are total together, every occurrence is kind-derived, the retry carries the same payload — each cheap to check and none checked, because the surrounding argument was sound and the claim felt like part of it. That is a more useful thing for the next reader to carry than a finding count."

[[finding]]
id = "F-11"
status = "verified"
severity = "major"
title = "Allowlist presence does not make exemptions expire"
detail = "Revision 59 sec-11 D9 and sec-13 say each allowed phrase must still occur, and claim this makes a stale allowlist entry expire loudly. Presence is not a one-to-one check. If 'four coupled sites' is duplicated, or the original sentence is removed and the phrase appears elsewhere, the entry still occurs and a phrase-based exemption permits every copy; the rationale stored beside the entry is review prose, not an executable bound on which occurrence it excuses. That leaves exactly the classic allowlist widening hole the amendment says it closes. Cheapest fix: key each exception by file plus exact containing phrase (or equivalent stable context), give it expected cardinality one, and assert the observed exempt-occurrence multiset equals the declared exception set before asserting no residual case-folded word-boundary matches."
disposition = "fixed"
response = "Contest upheld via F-14, which is the single defect all three were pointing at from different angles: the allowlist's declared phrase matched zero times because the source wraps it mid-phrase. F-5 asked whether the classification was right (it is: 31/1), F-9 whether the exemption was justified (it is: spec-019.md:330 counts integration sites), F-11 whether it was bounded (now: by a count identity) — and F-14 found that none of that mattered while the phrase could not be found at all. D9 now specifies whitespace-collapsed matching, and sec-12 and sec-13 state it too. All three of these dispositions stand or fall with F-14; verify or contest them together."

[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "F-9 fix recreates the scope/design drift"
detail = "Revision 59 sec-11 D9 and sec-13 now specify a 31/1 classification and a declared exception for 'four coupled sites', but the current `doctrine slice show SL-249` Verification / closure intent still says there is a blanket ban and that all 32 occurrences are kind-derived and none independent. Those are mutually exclusive closure contracts, and the scope statement is the exact false claim F-9 corrected in the design. This recreates the scope/design drift recorded by F-8 one amendment later. Cheapest fix: amend SL-249's closure intent to the same 31/1 classification and exact allowlist rule ultimately settled in D9."
disposition = "fixed"
response = "Upheld, and it is F-8 recurring in the same artefact one round later, which makes the recurrence more interesting than the instance. Card corrected: it now carries the 31/1 classification, names spec-019.md:330's 'four coupled sites' as the exemption, and states the count identity rather than the superseded blanket ban. The pattern is recorded in sec-14 rather than only fixed: the scope card is amended by hand at the end of each round, it went stale twice, and both times a reviewer caught it rather than the process. The review.scope runbook step is precisely the comparison that should have caught it, and it fires once at the end of the stage — which is the wrong cadence for a review that ran five rounds and rewrote the criterion four times. I have no mechanised fix to offer inside this slice; sec-14 carries it as a note for whoever next designs at this length, which is the honest disposition rather than a claim that I will remember next time."

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "Sec-13 requires lifecycle work the slice defers"
detail = "Revision 59 sec-13's closure criteria require 'the per-kind contracts and lifecycle vocabularies for EVD, HYP and CPT' to be present and coherent in SPEC-019. SL-249's settled scope says the opposite twice: 'Facets only, not lifecycle vocabularies' leaves those three kinds' lifecycle vocabularies and supersession rules ungoverned on ISS-316, and the Non-Goals repeat that they stay out of scope. The design therefore makes lock/closure depend on governance authorship it explicitly deferred. Cheapest fix: narrow the sec-13 agent criterion to the EVD/HYP/CPT facet contracts (including CPT's deliberate empty facet) and leave lifecycle vocabularies/supersession on ISS-316 as the surrounding design already does."
disposition = "fixed"
response = "Upheld, and this is the one finding in the pass that widened the slice rather than weakening a claim about it. The scope card's Non-Goals are explicit — 'Facets only, not lifecycle vocabularies (was OQ-5) ... Their per-kind lifecycle vocabularies and supersession rules stay ungoverned and stay on ISS-316, which therefore does not fully close on this slice' — and the criterion I wrote in round one, answering F-5's point about semantic contracts, required SPEC-019 to carry those vocabularies. Nothing compared it back to the card. Narrowed in sec-13 to the per-kind facet contracts and the verb set, with the exclusion stated so it cannot be re-acquired by the next person who reads the criterion in isolation; sec-11's D9 had the same ambiguity ('lifecycle verbs', meaning the verb set, one word away from the vocabularies) and is disambiguated. The card gains a matching note. sec-14 records F-13 alongside F-8 and F-12 as the same class: the artefact nobody re-reads, and a criterion that drifts because nothing compares it back."

[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "The declared allowlist phrase has count zero"
detail = '''Revision 61 sec-11 D9 declares the phrase "four coupled sites" with expected count one and defines each entry's check as occurrences of that phrase. In the authored corpus, .doctrine/spec/tech/019/spec-019.md:330-331 contains `four` at the end of line 330 and `coupled sites` on line 331. A literal case-insensitive phrase count is therefore 0; only a whitespace-normalized matcher such as /four\s+coupled\s+sites/i returns 1. The post-amendment identity cannot pass as written without reflowing the accurate sentence, recreating the formatting-driven rewrite D9 says it avoids. Cheapest fix: define allowlist entries as case-insensitive regex/token patterns with whitespace normalization (and the existing expected cardinality), or use the exact authored cross-line form explicitly.'''
disposition = "fixed"
response = '''Upheld, and verified before accepting: grep -c 'four coupled sites' spec-019.md returns 0, and the same match over whitespace-collapsed text returns 1. spec-019.md wraps the exempt sentence mid-phrase — line 330 ends '…touches four' and line 331 begins 'coupled sites — integrity::KINDS…'. So the identity as written would have been red the day it was authored (32 occurrences against an allowlist summing to 0) and the only green path would have been rewording the very sentence the exemption exists to protect. The mechanism would have defeated its own purpose while making the exception look like the problem. Fixed: every phrase match runs over the tier with runs of whitespace collapsed to a single space, stated in D9 rather than left as an implementation detail — the /\bfour\b/i count is unaffected (32 either way) and saying so is the point, since an undefined normalisation is precisely the shape this pass keeps finding. sec-12 and sec-13 carry the same statement, because a criterion that omits the matching rule is one the test can satisfy trivially. This is the eighth of fifteen findings that was a totality asserted rather than enumerated, and the sharpest: the claim was about the mechanism itself, and it was one grep away.'''

[[finding]]
id = "F-15"
status = "verified"
severity = "minor"
title = "Sec-14 omits the stale F-5 ledger instance"
detail = "Revision 61 sec-14's second recurring shape, 'the artefact nobody re-reads', names F-8, F-12 and F-13 but not the stale F-5 disposition. The current F-5 response says it remained contested for four rounds after being answered in substance and explicitly claims sec-14 records that ledger instance; the F-5 table row instead only summarizes the substantive canary contests and says it settled at D9. The section therefore omits the ledger example the disposition says it incorporated. Cheapest fix: add the stale F-5 status to that recurrence paragraph or its F-5 row, distinguishing the ledger drift from the substantive D9 history."
disposition = "fixed"
response = "Upheld. sec-14 named F-8, F-12 and F-13 under 'the artefact nobody re-reads' and omitted F-5's four-round stale contest — which is the instance that matters most, because it happened on this review's own ledger rather than on a document beside it. Corrected: four instances now, with F-5 named and the observation that the pass found the shape in the instrument it was being conducted with. Recording that I omitted it while writing the paragraph about omissions is not irony worth dwelling on; it is the recurrence rate, and sec-14 now states the mitigation honestly — mechanising the comparison is a note for whoever next designs at this length, and claiming to remember next time would be the same failure again."

[[finding]]
id = "F-16"
status = "verified"
severity = "minor"
title = "Sec-14 undercounts F-5's contests"
detail = "Revision 63 sec-14 says F-5 was 'contested three times'. Its own chronology says round four was the third F-5 contest, then says round six contested three findings; those were F-5, F-9 and F-11 over F-14, making F-5's whitespace-matching contest the fourth. The F-5 row lists only the phrase-pin, count/citation, and 31/1-classification rounds and omits the final zero-match contest even though F-14 now settles it. That leaves the pass record internally inconsistent immediately beside the corrected stale-ledger account. Cheapest fix: say four contests and add the whitespace-collapsed match as the fourth; align the later 'F-5 twice more' synopsis if it is intended as an exhaustive count."
disposition = "fixed"
response = "Upheld. F-5 was contested four times, not three: round two (the phrase pin left the hole open), round three (case-sensitivity, plus the miscitation and understated count), round four (the count was right, the classification was not), round six (the allowlist could not match the phrase it named). Corrected, and the row now names the whitespace-matching contest rather than stopping at the classification one. Worth stating what this is: sec-14 has now miscounted its own record of the pass twice — F-15 omitted an instance from the paragraph enumerating instances, F-16 undercounted the contests of the finding that is itself about undercounting. The section is the artefact I rewrite last, every round, after the substantive work is done, which is precisely the position the scope card was in for F-8 and F-12. Recorded in sec-14 as the fifth instance of that shape rather than as two tidy-ups. Also recorded there: your ruling that D9 is not over-engineered — the final test is compact, each clause closes a demonstrated failure, and a simpler one would knowingly surrender coverage. I asked because six rewrites of one assertion is the kind of thing a later reader should find a ruling on rather than re-litigate, and your answer is more useful in the design than in this response."

[[finding]]
id = "F-17"
status = "verified"
severity = "minor"
title = "Sec-14's meta-counts use inconsistent units"
detail = "Revision 66 sec-14 says 'the artefact nobody re-reads' has five instances. It counts F-8 and F-12 separately although both are repeat drift in the same scope card, but groups F-15 and F-16 as one although they are repeat drift in sec-14 across successive rounds. The same rewrite leaves the asserted-totality count at eight of sixteen even though F-16 is itself an undercounted totality claim ('F-5 was contested three times' without enumerating the fourth), so on the section's own definition it is the ninth. This is not another isolated arithmetic typo: the hand-maintained chronology, finding table, and meta-taxonomy duplicate the authoritative RV ledger inside the reviewed artefact, and every review round makes that copy stale while changing the section's fingerprint. Cheapest durable fix is to shorten sec-14: retain the RV-349 pointer, design-impact outcomes, cleared lines, and the D9 proportionality ruling, but remove exact round/finding counts and the duplicated per-finding ledger table (or derive them mechanically). State the two observed patterns without maintaining a numeric taxonomy by hand."
disposition = "fixed"
response = "Resolved through F-19, which is where this thread now lives. F-17 established that a hand-maintained copy of ledger history inside the reviewed artefact goes stale by construction; F-18 established that removing the tables while keeping the arithmetic in prose was the same defect in a quieter register; F-19 established that the rule I wrote to close them was itself wrong in both directions. sec-14 now carries the invariant that actually holds — monotone or nothing: no statement in it may become false as the review continues — which admits the design-stable numbers the section needs and excludes the review-derived ones regardless of whether they are spelled as figures. Four of F-19's eight flags are fixed; three are declined with reasons on that finding rather than dropped silently. These two stand or fall with F-19."

[[finding]]
id = "F-18"
status = "answered"
severity = "minor"
title = "Sec-14 still mirrors mutable review history"
detail = "Revision 68 sec-14 does not yet satisfy F-17's structural fix. At lines 1570-1572 it says the section was 'twice' the subject of findings for miscounting itself, but RV-349 already has four sec-14 counting/taxonomy findings: F-10, F-15, F-16 and F-17. The same section still hand-maintains other review-owned facts: the scope card drifted 'twice' and F-5 sat contested for 'four rounds' (lines 1623-1626), D9 was rewritten 'more times than anything else' (1603-1605), three claims were 'checked by nobody in any round' (1655-1658), and review added Phase A work 'twice' (1667). Those can change when the review proceeds even if the binding design does not, exactly the coupling F-17 meant to remove. The design-consequence bullets themselves are sound pointers rather than competing contracts. Cheapest fix: make the history qualitative ('repeatedly', 'while its substance was fixed', 'required repeated repair', 'lack a cited pin/evidence', 'Phase A grew during review') or remove it; retain the design-relative lessons and pointer list."
disposition = "fixed"
response = "Resolved through F-20, which corrected the rule both of these were disposed against. Recorded on F-19: you withdrew the objection to the three declined phrases as genuinely monotone, so that disagreement is closed on the merits rather than by attrition. Note for the record that this is the last round of this pass — the human owner has called it, and the remaining lock-gate acts (the section attestation for sec-14, the pass disposition, and design acceptance) are theirs. Thank you for the pass; F-1, F-2 and F-14 in particular found things no amount of internal re-reading would have surfaced."

[[finding]]
id = "F-19"
status = "answered"
severity = "minor"
title = "Sec-14 still quantifies the review"
detail = "Revision 70 sec-14 states that an ongoing-review record 'may not hold quantities' and says nothing below counts anything (§10, lines 1576-1581), but its audit missed several unquoted, review-derived quantities: F-18 is 'one turn further in' and refers to 'the first rewrite' (1576-1578); D9 was rewritten 'again and again' (1611-1613); 'Two shapes recur' and 'Both' are asserted across the pass (1619-1620); 'none was checked' totals the listed claims' pre-review verification (1622-1626); 'In every instance' totals the artefact-drift examples (1634); and 'many rounds' / 'found repeatedly' quantify the review's duration and recurrence (1637, 1641-1642). These are not design-stable quantities or quotations, and several can change merely as review continues. The genuinely design-stable survivors pass: identifiers and section/list ordinals; the table's three pins; seven templates; the runbook firing once per stage; and design-mechanism counts in the press list. Cheapest fix is either to apply the stated rule to the remaining history ('F-18 extends the lesson'; 'the rewrite'; 'D9's history raised the proportionality question'; introduce the two lesson headings without counting them; describe the shared mechanisms without none/every/many/repeatedly), or narrow the rule explicitly to mutable cardinalities and chronology and justify why qualitative frequencies cannot stale."
disposition = "fixed"
response = "Resolved through F-20, which corrected the rule both of these were disposed against. Recorded on F-19: you withdrew the objection to the three declined phrases as genuinely monotone, so that disagreement is closed on the merits rather than by attrition. Note for the record that this is the last round of this pass — the human owner has called it, and the remaining lock-gate acts (the section attestation for sec-14, the pass disposition, and design acceptance) are theirs. Thank you for the pass; F-1, F-2 and F-14 in particular found things no amount of internal re-reading would have surfaced."

[[finding]]
id = "F-20"
status = "answered"
severity = "minor"
title = "Monotone-or-nothing is false of sec-14"
detail = "Revision 72 sec-14 declares that no statement there may become false as review continues (§10, 'The pass'), but retained content intentionally violates that global invariant. 'On the reviewer's record, without a finding' is mutable ledger state: a later finding on any cleared claim makes it false without changing the binding design. 'Every substantive change is recorded where it binds' and 'the architecture ... is unchanged' can be falsified by a later design amendment; D9's 'final test' ceases to be final on another rewrite. The press list is necessarily non-monotone: 'largest thing still undefined', D8a 'has no home yet', claims are 'remaining unverified' and 'carry no evidence', and inquiries are 'left open' precisely name states a further pass or reconcile should end. The earlier sentence 'nothing below counts anything' is also literally inconsistent with the newly admitted design-stable counts below it. The three declined F-19 phrases are not defects: 'again and again', 'a review that keeps going', and 'found repeatedly' are monotone qualitative history. Cheapest fix is to narrow the rule to the actual boundary: claims whose truth depends only on mutable review-ledger/history state must be monotone; design-relative current-state claims are instead bound by sec-14's fingerprint. Rephrase 'nothing below counts anything' as 'nothing below tallies the review', and make the clearance wording a fixed historical observation rather than current 'without a finding' status."
disposition = "fixed"
response = "Upheld, and your boundary is adopted verbatim because it is better than mine. 'Monotone or nothing' is false of sec-14: the press list is deliberately a list of current states (largest thing still undefined, no home yet, remaining unverified) and the cleared paragraph says 'without a finding', which a later round could falsify. A rule banning those deletes the section's purpose. It was also a totality asserted about content nobody had checked it against — this pass's first pattern committed inside the rule written to stop it, which is the third time that has happened in this section and the reason the correction is a distinction rather than another prohibition. sec-14 now draws the line you drew: claims about the REVIEW'S OWN HISTORY — what the ledger owns and revises — must be monotone, and every violation so far was of that kind; claims about the DESIGN'S CURRENT STATE need no rule, because the section fingerprint binds them and a design that moves under them stales the attestation covering this section, which is machinery doing what a rule cannot. That last clause is the part worth keeping: three rules in three rounds failed because each tried to make prose self-policing, and the mechanism was already there."

[[finding]]
id = "F-21"
status = "answered"
severity = "major"
title = "Sec-14's fingerprint guarantee does not cover the claims it licenses"
detail = "Revision 77 sec-14 (§10 'The pass') states the second arm of its adopted boundary as: 'Claims about the design's current state need no such guard. They are bound by this section's fingerprint: if the design moves under them, the attestation that covers this section goes stale and someone has to look. That is the machinery doing the work a rule cannot.' The machinery does not do that work. A section attestation is live while the stored fingerprint equals THAT SECTION's own current fingerprint: DesignSnapshot::missing_lanes (src/design_run/snapshot.rs:499-517) matches on held.subject() == subject && held.fingerprint() == fingerprint, and the same per-subject rule is stated at src/design_run/attestation.rs:240-244 ('an attestation names the exact bytes it attests to') and 393-398 ('A section attestation is live while a stored Fingerprint still equals its subject's current one'). Sec-14's design-state claims are almost all about OTHER sections: 'Every substantive change is recorded where it binds' with pointers into §5.3 / §5.2 / §5.4 B / §5.1 / D6 / D8 / D8a / D9 / D10 / I3 / I3b / I10 / I11 / I12 (lines 1607-1615), 'The architecture that came out of drafting is unchanged' (1617), '§9's criterion narrowed back inside the slice's non-goals' (1615), and press items on I10, D8a, R8 and §6 (1669-1698). If §5.3 is later amended, sec-8's fingerprint moves and sec-8 owes a fresh attestation; sec-14's bytes are untouched, its attestation stays live, and nothing makes anyone look here. The whole-run ContentCoverage (attestation.rs:390-418) does diff every section, but it invalidates the INTEGRATED REVIEW and the LOCK ACCEPTANCE, not 'the attestation that covers this section', and it is spent at the lock — after which design movement routes through a revision that rechecks sec-14 not at all. Consequence: the stated reason a whole class of claims needs no rule is a guarantee doctrine does not offer, so the class is unguarded, and a later reader citing this sentence elsewhere inherits the error. Raised major rather than minor because the sentence is the section's load-bearing conclusion and it is wrong about the machinery this very run executes. Cheapest fix: restate the arm to what the mechanism actually binds — sec-14's own bytes, so only a rewrite of sec-14 re-opens its attestation — and either make the cross-section claims pointers (name the section/decision, not its content, so a moved design leaves the pointer true) or state the exposure instead of asserting a binding."
disposition = "fixed"
response = "Upheld, and the finding is right about the mechanism. missing_lanes (src/design_run/snapshot.rs:499-517) matches a held attestation on subject AND that subject's fingerprint; attestation.rs:393-398 says the same in prose. So an amendment to §5.3 stales sec-8's attestation and leaves sec-14's live, and every cross-section claim here — the 'what it changed' pointers, 'the architecture is unchanged', §9's narrowing, the press items — was unguarded while the section claimed the machinery guarded them. The whole-run ContentCoverage does diff every section, but it invalidates the integrated review and the lock acceptance, not the attestation covering this section, and it is spent at the lock. Revision 80 restates the bullet as what is true: an attestation binds its own section's bytes, so what stands in for the guarantee is discipline — point, don't restate, so a design that moves under a pointer leaves the pointer true — and where the press list states a current judgement it is unguarded, but it is an instruction to go and look, so a stale one costs a wasted look rather than a false belief. Two consequences recorded beyond the bullet: 'The fingerprint binds it' joins the enumerated totality list in 'What it taught', because it is that pattern's fourth instance and the cheapest yet to check; and the section now says F-21 was raised in-session rather than by the external reviewer, since the run's policy is adversarial-only and a reader must not read these three findings as that lane's."

[[finding]]
id = "F-22"
status = "answered"
severity = "minor"
title = "'Nothing below counts anything' is still false of sec-14"
detail = """Revision 77 sec-14 line 1576 still reads 'F-18 is the same lesson again, and it is why nothing below counts anything.' F-20 already named this sentence — 'The earlier sentence "nothing below counts anything" is also literally inconsistent with the newly admitted design-stable counts below it' — and supplied the fix: rephrase it as 'nothing below tallies the review'. F-20 was disposed 'Upheld, and your boundary is adopted verbatim', but only the boundary landed; the sentence is unchanged. Below it the section counts three times: 'the facet table's three pins' (1611), 'the seven scaffold templates' (1626), and 'gains tables and three verbs' (1693), plus the quoted 'seven' and 'four' at 1634. Each is legitimate — F-19 explicitly listed 'the table's three pins' and 'seven templates' among the design-stable survivors that pass — so the counts are right and the sentence banning them is the defect. It is also the same shape the section names as this pass's signature failure: a totality asserted about content nobody checked it against. Cheapest fix is the rephrase F-20 already wrote."""
disposition = "fixed"
response = "Upheld. F-20 named the sentence and supplied the rephrase; the disposition adopted the boundary and left the sentence standing, which is the same 'artefact updated last, by hand' failure this section names. Revision 80 applies F-20's own wording: 'nothing below tallies the review'. The three counts below it — three pins, seven scaffold templates, three verbs — are design-stable and stay, as F-19 already ruled they should."

[[finding]]
id = "F-23"
status = "answered"
severity = "minor"
title = "Sec-14 keeps the review-history claims its own boundary forbids"
detail = """Revision 77 sec-14 adopts: 'Claims about the review's own history — what the ledger owns and revises as it moves — must be monotone' (lines 1597-1599). Two retained claims are review-history and non-monotone. (1) 'On the reviewer's record, without a finding:' (1623) — a later finding on any item in that list falsifies it without the design moving. F-20 named exactly this ('mutable ledger state: a later finding on any cleared claim makes it false') and prescribed making the wording a fixed historical observation; that half of the fix was not applied. (2) 'the final test is compact' (1635) — F-20 named this too ('D9's "final test" ceases to be final on another rewrite'); unchanged. Worse than the omissions, the F-20 paragraph MISCLASSIFIES the first of them: 'the paragraph above says what the reviewer cleared without a finding, which a later round could falsify. A rule banning those would delete the section's purpose' (1588-1591). Under the boundary the section then adopts, that claim sits on the review-history side, where monotonicity IS required — so the new boundary bans it too. Only the press list, which is design-current-state, is saved by the arm the sentence invokes. As written the section's central argument reads as licensing a claim its own rule forbids, which is the third rule in a row failing against content it was not checked against. Cheapest fix: date the clearance to the round it was true of ('through round N the reviewer had raised no finding on …' — monotone, and it stays true), say 'the test as it stands' rather than 'the final test', and let the press list carry the design-current-state illustration on its own."""
disposition = "fixed"
response = "Upheld on both halves. The clearance paragraph now reads 'Through the external reviewer's last round, raised against revision 72, no finding had been raised on:' — monotone, and dated to the round that gave it rather than asserted as current ledger state. (First draft of the fix dated it to revision 77, which was wrong: 77 is the revision THIS round read; F-20 was raised against 72.) 'The final test' is now 'the test as it stands'. The misclassification is the part worth recording: the F-20 paragraph cited the clearance as an example of what a whole-section monotone rule would wrongly ban, when it is a review-history claim and the adopted boundary bans it correctly. Only the press list was ever saved by the arm that sentence invoked. The monotone bullet now carries that correction explicitly, so the example cannot be re-read as a licence."

[[finding]]
id = "F-24"
status = "answered"
severity = "minor"
title = "Declaration's skip_serializing_if totality is asserted, and is false"
detail = "Revision 81 §3 (Mechanical), design.md:163: 'Serde's skip_serializing_if is total over Declaration, so a fully-populated value serialises to exactly the wire key set — the pin DEC-169 uses instead of a proc macro. The same totality is what makes D8's digest cover the payload without an enumeration to maintain.' The enumeration: Declaration (src/design_run/submission.rs:124) has 16 fields; 14 carry skip_serializing_if; 'subject' (:125) carries none — correctly, it is mandatory — and 'resolved_record' carries #[serde(skip)], so it is never on the wire at all. The sentence is false of two of sixteen. The conclusion it supports survives, but not for the reason given: a fully-populated value emits exactly the 15 wire keys because serde emits a populated field, not because skip_serializing_if is total. An implementer writing DEC-169's pin from this sentence looks for the attribute on every field, finds two without it, and has to re-derive whether the pin holds; the one worth thinking about is resolved_record, which the pin cannot see because it is not a wire key. Note that this is one of the four code claims §10 lists as 'checked against the source' and holding, so a cleared claim does not hold as worded. The same inventory is stated approximately twice more: '~16 wire keys' (§5.2 design.md:580, §9 design.md:1491) sizing I10's matrix at '~80 cells' (§9 design.md:1492, R10 §8 design.md:1432). The wire count is 15, so the matrix is 75 cells over 5 subject kinds. The tilde makes those approximations rather than errors, but §9 calls I10 'the one worth sizing before the plan', and this design's own rule is to state the enumeration beside the totality. Cheapest fix: replace the §3 totality with its enumeration; exact the ~16/~80 only if those sections are being touched anyway, since §3 alone costs one section attestation and all four cost four. Found by a repo-researcher sweep for consistency and hygiene, then verified against the source; raised in-session, not by the external lane."
disposition = "fixed"
response = "Upheld and fixed in §3 at design run revision 82; the section's attestation (att-3) was invalidated by the edit, as expected. The bullet now leads with the property that is actually true — Declaration's wire key set is exactly its populated field set — and carries the enumeration beside it: of sixteen fields, fourteen carry skip_serializing_if; subject carries none, being mandatory; resolved_record carries #[serde(skip)] and is not a wire key at all. The causal correction matters as much as the count: a fully-populated value emits the fifteen wire keys because serde emits a populated field, not because the attribute is total. The residual is now stated rather than glossed — the pin cannot see a #[serde(skip)] field, which is free while such a field is never a wire key and a hole the moment one is. The ~16 wire keys / ~80 cells approximations in §5.2, §8 R10 and §9 are deliberately left: the tilde makes them approximations rather than errors, §9 already says I10 is the one worth sizing before the plan, and exacting them would move three more section fingerprints in a run one act from its gate. The real number is 15 keys and 75 cells over five subject kinds, recorded here so the plan does not have to re-derive it."

