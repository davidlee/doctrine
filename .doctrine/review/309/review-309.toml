[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Design §6 example 'memory uses reservation' is factually inaccurate"
detail = "Design §6 cites 'memory engine uses reservation for id allocation' as an example of a weighty interactions edge. This is incorrect: the memory engine explicitly sidesteps the reservation/id-lifecycle system, taking UUID-identity (a client-minted named entity with no reserved number) instead. SPEC-007 (Memory engine) §Responsibilities states: 'memory avoids the distributed-id-collision risk entirely (no reservation namespace).' The example should be replaced with an accurate one (e.g. install↔skills or id-lifecycle→memory)."
disposition = "verified"
response = "Confirmed: the example is inaccurate. SPEC-007 explicitly sidesteps reservation via UUID identity. Fix belongs on the reconciliation brief — design.md para 6 edit to replace the example with an accurate one (e.g. install-skills or id-lifecycle-memory)."

