[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "AtBase resolver rejects worker_commit crash replay"
detail = "Preconditions: PHASE-NN is Spawned, its durable binding exists, and worker_commit is invoked on a fork at base B. Event sequence: (1) worker_commit resolves the binding with the caller-declared AtBase expectation, creates C with C^=B, and either lands the WorkerCommitted funnel row before its response is lost, or crashes after advancing the fork but before that row lands; (2) the caller re-drives the same worker_commit, as §2 Idempotent replay and §3's 'Re-running the original recorder is a no-op replay' promise; (3) §3 fixes worker_commit's resolver expectation at AtBase, so the now-advanced fork is rejected by resolve_agent/classify_resolve before funnel_machine::attempt can compare the matching fork_tip or record the missing transition. Actual code confirms the seam: src/worktree/dispatch_record.rs classify_resolve currently folds every HEAD != base to stale-record, while src/mcp_server/worker_commit.rs resolves before all later gates. Thus a lost-response retry cannot be a no-op and a kill between fork commit and position record cannot be repaired by re-driving the acting verb; only a later import may heal it. This violates REQ-384's crash-safe idempotent recovery and the every-arm replay contract. Design cites: §2 Idempotent replay; §3 Class-2 resolver paragraph and CAS/concurrency contract; §4 worker_commit row; §11 REQ-384 Class-2 re-drive VT."
disposition = "fixed"
response = "Upheld and repaired. worker_commit gains a retry-signature leg riding the existing expected-fork-state seam (no new machinery): clean tree ∧ exactly one commit C ∧ C^==base resolves Advanced (not the AtBase refusal), then forks two truthful legs — stored worker_commit.fork_tip==C ⇒ recorded no-op replay naming the landed tip; row absent/position spawned ⇒ the verb lands its own lagging Class-2 RecordWorkerCommit row (it IS the original recorder, D8; import heal-forward stays the backstop when no retry comes). Dirty advanced fork refuses (late re-commit); imported+ refuses already-<position> naming the imported tip — the lost-response ambiguity always ends in a truthful terminal answer, never stale-record. Edits: §2 idempotent replay (reachability sentence), §3 resolver expectation + worker_commit paragraph (retry-signature legs), §4 worker_commit row (first-commit-leg scoping of the base guard), §11 REQ-384 (retry-signature VT)."

[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "Fresh verify is simultaneously valid and stale"
detail = "Preconditions: dispatch verify runs green at coord tip T and atomically lands its funnel-record-only evidence commit E with verified_oid=T and position Verified. Event sequence: conclude immediately gathers facts at current tip E. The normative §2 table and D3 say this is legal because changed paths in T..E are only funnel.toml, explicitly ensuring a fresh pass never self-stales. But §2's refusal-token definition says conclude-verify-stale means verified_oid != tip; T != E is necessarily true for every successful verify because E is the child that records the evidence. An implementation following that definition refuses every fresh conclude, contradicting the table and §11's fresh-pass VT. The intended modulo-funnel-record rule is otherwise clear, so this is an implementation-misleading inconsistency rather than missing machinery. Design cites: D3; §2 transition table and reason-token paragraph; §11 REQ-384 fresh-verify VT."
disposition = "fixed"
response = "Upheld and repaired. The §2 reason-token gloss for conclude-verify-stale now states the D3 rule — non-funnel-record paths changed in verified_oid‥tip (tree-identity modulo the funnel record) — and explicitly disclaims bare verified_oid != tip, which would stale every fresh pass on its own evidence commit. §11's fresh-pass VT pins the modulo-record definition so an implementation cannot follow the old gloss and still go green."

