[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Pi settings registration has no report or stamp outcome"
detail = """
Expected: SL-284 design sec-4:127-133 and sec-5:151-160 make .pi/settings.json registration a first-class, disclosed Pi boot leg whose write and refusal affect install completeness. Observed: the claim that RefreshReport already carries every field is false for this new setting: src/boot.rs:1892-1922 has no Pi settings outcome; refused_wiring at :3199-3222 only examines hooks, MCP and extension files; refresh_touched at :3525-3568 cannot include .pi/settings.json. src/install.rs:1015-1027 converts that touched/refused result into the boot leg, and :1321-1336 builds the commit hint from touched paths. Following the design as written would omit a successful settings edit from the commit hint and could stamp an install complete when registration was refused, leaving generated extensions unloaded. Repair: specify a separate settings outcome in RefreshReport, include success in touched and fallback in refused_wiring, report the manual repair, and verify stamp and commit-hint behavior for both cases.
"""
disposition = "fix-now"
response = "Fixed in design rev 35 (see prior response); verified by codex raiser. Route added for the lock gate."
