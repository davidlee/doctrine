[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Pi trust and reload step is absent from boot disclosure"
detail = """
Expected: POL-003 requires an opt-in harness supplement to disclose the manual activation step and not imply that a written extension is active. Pi 0.99.1 docs/configuration.md:3 says project .pi settings load only after project trust, and :5 says a running session needs /reload after manually changing settings or resources. SL-284 design sec-4:122-133 and sec-5:151-160 specify writing and reporting extension files plus settings registration but no trust/reload disclosure. Current src/boot.rs:3149-3168 reports only generated/regenerated/skipped file status; Codex already has an explicit activation notice at :3312-3324. A Pi install into an untrusted or already-running project can therefore report the wiring while Pi has not loaded it. Repair: include Pi's project-trust and session reload step in the Pi arm's operator report, with a test that distinguishes written from active.
"""
disposition = "fix-now"
response = "Fixed in design rev 35 (see prior response); verified by codex raiser. Route added for the lock gate."
