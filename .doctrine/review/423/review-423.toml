[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "Customising hint cannot unignore a skill below an ignored parent"
detail = """
Expected: the fixed hint in SL-284 design sec-2:51-64 gives working advice for making a real customized skill visible to Git. The first half is sound: src/install_ownership.rs:330-340 lists only Doctrine symlinks, so replacing a link with a real directory removes its managed-block entry on reinstall. The proposed line !/.agents/skills/<id> is insufficient when an ancestor is ignored. This checkout has /.agents in .gitignore:6, and git check-ignore -v confirms .agents/skills/code-review is ignored by that rule; Git cannot re-include a child while its parent remains excluded. Repair: make the hint conditional/accurate for parent ignore rules, or describe the necessary parent-directory unignore lines instead of promising that one leaf negation works.
"""
disposition = "fix-now"
response = "Accepted. Hint now names the parent-ignore limit; sec-2 notes the host rule (e.g. this repo's /.agents) is the host's to change."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. Hint now names the parent-ignore limit; sec-2 notes the host rule (e.g. this repo's /.agents) is the host's to change."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Sec-2 now explicitly warns that the leaf negation fails beneath an ignored parent, citing this repo's /.agents rule; the hint is conditional and the parent rule is left to the host."

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Settings planner treats a malformed empty file as absent"
detail = """
Expected: SL-284 design sec-5:155-160 says a malformed .pi/settings.json is left untouched and a manual line is printed. It also says to reuse parse_settings. Observed: src/boot.rs:1648-1652 maps Some("") and whitespace-only content to an empty JSON object, and its test at :6569-6579 pins that behavior. An existing empty .pi/settings.json is malformed JSON, yet a planner that reuses this parser as specified will treat it as absent and overwrite it, contrary to the stated fail-soft rule. Repair: define the empty-file case explicitly and, if it is meant to be malformed, distinguish absent from present-empty before calling parse_settings; pin the fallback case in the Pi settings planner tests.
"""
disposition = "fix-now"
response = "Accepted as clarification: empty/whitespace-only .pi/settings.json is treated as an empty object and written, consistent with parse_settings for Claude/codex (nothing to lose); malformed JSON stays untouched. Stated in sec-5, tested in sec-7."

