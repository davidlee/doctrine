[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Only-memory still selects every embedded skill"
detail = """
Expected: SL-284 design sec-3:97-101 and sec-7:191-194 preserve subset selection on the new direct routes, including the CLI's --only-memory subset. Observed: src/commands/cli.rs:105-108 promises only record-memory and retrieve-memory; src/commands/cli.rs:1532-1543 passes only_memory, but src/install.rs:952 and :1048 call select_for_install with only args.skills/domains, and src/install.rs:2895-2901 selects all when those filters are empty. The only production read of args.only_memory in src/install.rs is :407 (stamp selection). Thus --only-memory --agent pi/codex/universal will link the entire embedded catalog, and the existing Claude route already does so. Repair: derive the two memory IDs through the existing selection seam for both preview and live convergence, then test the actual links for --only-memory alongside --skill and --domain.
"""
disposition = "fix-now"
response = "Fixed in design rev 35 (see prior response); verified by codex raiser. Route added for the lock gate."
route = "review"

