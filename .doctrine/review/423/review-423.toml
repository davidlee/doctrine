Expected: SL-284 design sec-4:114-133 names every Harness match that must change when adding Harness::Pi, with Pi carrying no Codex/Claude MCP registration. Observed: src/boot.rs:3380 calls mcp_rel(h) before inspecting the MCP outcome; :3386-3391 matches only Claude/Codex to choose its report verb, and :3514-3518 matches only Claude/Codex to select the MCP file. These sites are outside the design's vocabulary/refresh-arm list, so merely adding Pi and NotApplicable to the report does not compile; assigning Pi a Codex or Claude path would also misreport the file. Repair: make MCP path and report verb conditional on an applicable MCP outcome, covering Pi explicitly, and add a Pi-only boot install report test.
"""
