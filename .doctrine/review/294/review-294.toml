[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "PHASE-01 design drift: EX-5/design name CLAUDE.md as a second edit target, but the DOCTRINE_BIN rule is single-source in .doctrine/governance.md"
detail = """Expected (design.md §"What this dissolves" F-3 bullet L134-137; §"Code impact" table CLAUDE.md row L236; plan EX-5): the reframed DOCTRINE_BIN→coord-build rule is edited in BOTH `.doctrine/governance.md` AND `CLAUDE.md`. Observed: `grep DOCTRINE_BIN CLAUDE.md` → zero hits; the rule lives single-source in `.doctrine/governance.md` (updated by commit 575757955). It reaches the agent-facing CLAUDE.md surface via `@.doctrine/state/boot.md` inlining (boot snapshot inlines governance.md), refreshed by `doctrine boot` (regenerated clean, PHASE-01 T7). No SL-225 commit touched CLAUDE.md — correctly, per STD-001 single-source. EX-5's intent (the CLAUDE.md-facing surface carries the reframed rule) is MET; only the design's premise that CLAUDE.md is a distinct authored edit target is factually wrong. Verified: the "## DOCTRINE_BIN → the coord build" section visible in agent context is boot.md, not CLAUDE.md. Documentary only; no code/behaviour impact."""
disposition = "verified"
response = "Observation confirmed: CLAUDE.md carries zero DOCTRINE_BIN text; the rule is single-source in .doctrine/governance.md and reaches the agent-facing CLAUDE.md surface via the @.doctrine/state/boot.md inline (regenerated by `doctrine boot`). EX-5's intent is met; only design's premise that CLAUDE.md is a distinct authored edit target is wrong — and editing CLAUDE.md directly would have VIOLATED STD-001 single-source. Remediation is a per-slice design-prose correction, delegated to /reconcile (see Reconciliation Brief §Per-slice). No code/behaviour impact; not a blocker."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = 'PHASE-02 design drift: §"Which goldens" names three illustrative goldens (e2e_worker_guard, e2e_dispatch_sync, e2e_doctor_golden) that are not the empirical fix-#2 target set'
detail = """Expected (design.md §"Which goldens" L224; §"Code impact" table row L239 — all three named as design-target selectors): those files are the authored-write goldens fix #2 guards. Observed (empirical DOCTRINE_WORKER=1 enumeration, PHASE-02 T0): none of the three is a target. `e2e_worker_guard.rs` correctly EXERCISES the guard (sets the signal per-child, asserts refusal) and MUST NOT be guarded — verified unguarded (0 hits). `e2e_dispatch_sync.rs` and `e2e_doctor_golden.rs` both exist but do not false-red under the worker signal — verified unguarded, correctly untouched. The real target set is the 27 marker-poisoned goldens the sweep surfaced (design's "~30", plan's "enumerated at implementation" — which the plan made authoritative). The three named selectors therefore show `undelivered` in conformance. Illustrative-list staleness; the delivered guard set is correct and complete per the empirical sweep."""
disposition = "verified"
response = """Observation confirmed: the three illustrative goldens are not the empirical target set — e2e_worker_guard must stay unguarded (verified 0 hits, it exercises the guard), e2e_dispatch_sync + e2e_doctor_golden exist but don't false-red (correctly untouched). The plan's "enumerated at implementation" made the empirical 27-file sweep authoritative, so the delivered guard set is correct and complete; the design prose + the three design-target selectors are stale. Two-surface remediation delegated to /reconcile: (a) per-slice design.md prose (§"Which goldens" L224 / §"Code impact" L239) → point at the empirical CHR-044 set; (b) selector registry `doctrine slice selector rm` the three undelivered goldens (the load-bearing change that clears the conformance `undelivered` cells; §239 is its human mirror). No behaviour impact; not a blocker."""

[[finding]]
id = "F-3"
status = "verified"
severity = "nit"
title = "Boundary registry polluted: PHASE-01 solo auto-binding swallowed 8 interleaved IMP-306/chore commits on shared edge"
detail = "Expected: `slice conformance SL-225` reports SL-225's own touch-set. Observed: 55 undeclared paths, most foreign (IMP-306/307, harvest skill, plugins, install.rs, marketplace.json). Root cause: `boundaries.toml` PHASE-01 row is `[886153a5f..30f2b82a8]` (solo provenance), a HEAD-before→HEAD-after range that swallows every sibling commit that landed on shared `edge` while PHASE-01 was open — SL-225's PHASE-01 landed as TWO non-contiguous commits (ad1fff949, 575757955) with 8 IMP-306/chore commits interleaved between them. PHASE-02's range is clean (single commit). Verified manually via per-commit `--against`: 886153a5f..ad1fff949 ∪ 9cf3e2bea..575757955 ∪ 30f2b82a8..613af9c51 ⇒ 4 design-target selectors conformant (justfile, worker_commit.rs, test_support.rs, common/mod.rs), 3 undelivered (the F-2 illustrative goldens), ~27 real undeclared (the PHASE-02 marker goldens + new VT test + governance prose + case-notes + slice-toml — all legitimate). boundaries.toml is gitignored/disposable runtime state, so no authored-surface remediation; but the solo auto-binding HEAD-range mechanism is a real hazard on a shared branch (the safe per-commit `--commit` mode exists but solo binding doesn't use it) — worth a tooling backlog item."
disposition = "tolerated"
response = "Conformance signal verified manually via per-commit `--against` (4 selectors conformant, 3 undelivered=F-2, ~27 real undeclared=legitimate PHASE-02 deliverable + meta/prose). The 55-path pollution is entirely PHASE-01's solo auto-binding swallowing interleaved IMP-306 commits on shared edge. boundaries.toml is gitignored/disposable runtime state — no authored surface to reconcile, and the non-contiguous two-commit landing means no single contiguous range can re-record PHASE-01 cleanly, so re-recording would only substitute one polluted range for another. Tolerated for this slice (manual verification stands in). The underlying tooling hazard — solo auto-binding records a HEAD-before→HEAD-after range rather than per-commit, so any sibling commit on a shared branch pollutes it — is durable and worth a backlog item (harvested at audit tail), not a fix in this slice's scope."

[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "Charter-edge inclusion: e2e_check_regression::changed_filter_state_misses_the_baseline guarded though it is a PHASE-01 fingerprint interaction, not a write-refusal"
detail = """Observed: the sole guarded golden that is neither a write-refusal nor a refusal-cascade. It false-reds because PHASE-01's `validate` skip changes the regression fingerprint under the worker signal (the guarded gate produces a different result-set), so a worker's own run reads it as own-delta damage. Question the handoff posed: in-charter or split out? Assessment: squarely IN-charter. The slice charters "funnel false-red elimination" — a green worker delta reported as a failure the worker cannot distinguish from its own damage. This is exactly that class: the false-red arises from the slice's own PHASE-01 mechanism, dissolved with the same `under_worker_marker()` predicate as the other goldens. Strictly marker-gated (the unmarked/main arm still exercises the real regression assertion), so no coverage lost. Correct inclusion; no change."""
disposition = "aligned"
response = """In-charter, no change. The slice charters "funnel false-red elimination" — a green worker delta reported as a failure indistinguishable from own damage. e2e_check_regression::changed_filter_state_misses_the_baseline false-reds because PHASE-01's own validate-skip shifts the regression fingerprint under the worker signal — precisely that class, arising from the slice's own mechanism, dissolved with the same under_worker_marker() predicate. Strictly marker-gated: the unmarked/main arm still exercises the real regression assertion, so no coverage is lost. Correct inclusion."""

[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "Guard verbosity: ~95 rustfmt-expanded 3-line early-returns across 27 files vs a terser macro"
detail = "Observed: each guarded golden carries `if common::under_worker_marker() { return; }` which rustfmt expands to 3 lines; ~95 such guards across 27 files (some files carry 11, e.g. coverage_record_golden). Fmt-clean and correct. The handoff asked the audit to weigh a macro (e.g. `skip_in_worker_fork!()`) against the explicit form. Assessment: keep the explicit early-return. It is trivially greppable (`grep -rn under_worker_marker tests/` enumerates the exact guarded set — the property VA-1's set-membership audit relies on), self-documenting at each call site, and carries zero indirection. A macro would save only cosmetic LOC while hiding the control-flow (`return`) inside an opaque expansion and degrading the grep signal. The verbosity is a deliberate, defensible tradeoff, not tech debt."
disposition = "tolerated"
response = "Keep the explicit early-return; the verbosity is a deliberate tradeoff, not debt. `grep -rn under_worker_marker tests/` enumerates the exact guarded set in one command — the greppability VA-1's set-membership audit relies on — and each call site is self-documenting with zero indirection. A `skip_in_worker_fork!()` macro would save only cosmetic LOC while hiding the `return` control-flow inside an opaque expansion and degrading the grep signal that makes the guard set auditable. No change; recorded so the choice is a conscious one, not an oversight."

