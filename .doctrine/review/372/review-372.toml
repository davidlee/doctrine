id    = 372
slug  = "sl-246-reconciliation-composed-knowledge-read-vs-design-plan-and-governance"
title = "SL-246 reconciliation: composed knowledge read vs design, plan and governance"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-246"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected: a backlog id names one item. Observed: ISS-462 was minted concurrently on edge and on the capsule branch for two different items"
detail = "edge (248249f02) carries ISS-462 = 'ReviewPolicy labels exceed 16 B bound'; capsule/SL-246/c17 (22c4e32c7) carries ISS-462 = 'check plan cannot express verification by unchanged pre-existing test'. Both created 2026-09-19, both minted by allocating max+1 against their own branch's corpus. git surfaces it as an add/add conflict on .doctrine/backlog/issue/462/{backlog-462.md,.toml}; had the two been merged without conflict (different files under one id, or a fast-forward) the collision would have landed silently. Evidence: git ls-tree edge .doctrine/backlog/issue/462* vs the same on capsule/SL-246/c17. The capsule run also minted 463/464/465 and CHR-074/075 and DEC-274, all of which happened to be free; nothing made them so."
disposition = "fix-now"
response = "Fixed in this audit's merge commit: the capsule's item is renumbered ISS-466 (same slug and body; id, title line and the one PHASE-06 sheet citation moved), edge's ISS-462 stands because it is already on the trunk. The SYSTEMIC half is not new work: ISS-279 ('Entity id reservation has local reach; two trees allocate the same id unwarned') already owns it, and this instance is appended there as evidence. It widens ISS-279 twice — the kind is a backlog item rather than a review (so ISS-277's reseat-can't-renumber-a-review cure does not bound the problem), and the topology is a capsule branch driven from the MAIN worktree rather than a coordination tree (so any long-lived branch suffices; dispatch was incidental). Not routed to the reconciliation brief: no spec or governance text is wrong, the reservation reach is."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected: one backlog item per concern. Observed: CHR-075 re-mints CHR-073, naming the same five memory uids"
detail = "CHR-073 ('Re-attest five memories that document design show as the envelope read') was minted at RV-370 F-16, exists at the merge base, and tabulates five uids. The PHASE-05/06 capsule orchestrator independently filed CHR-075 ('Five memories misdescribe design show after SL-246 PHASE-05 reclaimed it') over the same five. The capsule tier could not see CHR-073 as already-filed because nothing in the phase sheets carried it forward; boot.md's own instruction to 'check backlog list at the start of substantive work' was not discharged at the orchestrator or worker altitude."
disposition = "fix-now"
response = "Fixed in this audit: CHR-075 closed with resolution=duplicate and linked related to CHR-073, with a leading note in its body pointing at CHR-073 so the id is not reused and a reader is not left choosing between two live items. Its three distinct contributions are folded into CHR-073's body — the per-row repair (--format prompt where run state is meant, leave alone where the document is meant), the ISS-465 compounding (memory search ranking too poor to compete with grep, so a wrong row is less likely to be caught in passing), and the wrong-vs-stale severity argument. CHR-073's landing constraint ('must land with or before the code') is now live and carries to the reconciliation brief."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Expected: C7's facet-only read path at Facets. Observed: the prose body is read from disk at every level, and KnowledgeLevel::Facets' doc comment asserts the opposite"
detail = "design.md 5.2/5.6 make C7 (a facet-only read at Facets) a design mandate; grep -n C7 plan.toml returns nothing, so no EX/VT row binds it. render_record (src/knowledge.rs:2583) calls read_selected -> read_record, and read_record (:1970) unconditionally does std::fs::read_to_string on the record's .md (:1980) before returning; at Facets the body is read and then discarded at :2604. The PHASE-03 planner recorded this as F-b and it was filed as CHR-074 rather than built. SHARPER than an undischarged mandate: src/knowledge.rs:955 documents KnowledgeLevel::Facets as 'Never reads the .md prose body', which is false as an I/O claim and true only as a rendering claim. An agent reading the type would conclude C7 is discharged. Note also the tension the design never resolves: DEC-149's unfilled marker carries a prose-size hint ('3.1 KB of prose'), which needs the body's SIZE — obtainable from fs::metadata without a read, so C7 is achievable, but it is why the cheap path was not taken."
disposition = "verified"
response = "Observation confirmed on both halves and split by write surface. (a) The DOC COMMENT is a straightforward defect and is per-slice: src/knowledge.rs:955 claims Facets 'Never reads the .md prose body' while read_record:1980 always does. Reconciliation brief, per-slice direct edit. (b) C7 ITSELF is a design mandate the plan never bound and the implementation does not meet. NOT tolerated silently and NOT dropped: design.md 5.2/5.6 must record that C7 is deferred and to where, which is a locked-design divergence and therefore reconcile's to write, not audit's. CHR-074 already carries the work and was filed by the PHASE-03 planner at the moment it was noticed (F-b), which is the right instinct — the finding is that filing it left design.md asserting a property the tree does not have. Note for whoever takes CHR-074: DEC-149's unfilled marker needs the prose SIZE, not the prose, so fs::metadata satisfies both the marker and C7; the current read is not forced by the design."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Expected (R3): the facets level costs ~30% of full. Observed on the real corpus: 11.5%, because a third of the records surfaced have no facet at all"
detail = "VA-2 re-derived against SL-244 with the built binary. doctrine design show SL-244 --knowledge {skip,facets,full} = 202243 / 215116 / 313761 bytes, so the knowledge BLOCK is 12873 B at facets and 111518 B at full = 11.5%. research.md's measure (31.8 KB vs 107 KB across fifteen records) matches at full (107 -> 111.5 KB, corpus grew) and is 2.5x off at facets. Cause: 5 of the 16 records surfaced carry NO facet and render the unfilled marker instead of fields (DEC-140, DEC-141, DEC-142, DEC-144, and one more), i.e. IMP-403's unfilled-corpus problem is doing much of the saving. The design's R3 states the saving 'has to be right about what it keeps'; the delivered saving is substantially larger than designed and is larger for a reason R3 did not model."
disposition = "verified"
response = "Measurement confirmed and re-derivable: full block 111518 B, facets block 12873 B, 11.5%, against research.md's 31.8 KB / 107 KB and ~30%. The full arm agrees with research (107 -> 111.5 KB is corpus growth); only the facets arm diverges, and the cause is identified — 5 of 16 records surfaced carry no facet at all, so a third of the block is an unfilled marker rather than fields. This is a claim in a LOCKED design (R3) that the delivered artefact contradicts, so it is reconcile's to write, not audit's to edit. Two things the brief must keep distinct: the measurement is BETTER than designed (a larger saving), and it is better for a reason the design did not model (IMP-403's unfilled corpus), which means the number will REGRESS toward 30% as the corpus is filled in. A reader who takes 11.5% as the feature's steady-state cost will be wrong."

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Expected (VH-1): a reader reaches for the facets read again. Observed: the human attestation is a qualified no — 'disappointing as a feature, but not obviously incorrect'"
detail = "VH-1 (PHASE-06) is human-only and binds the feature's reason to exist. Attested 2026-09-20 by david against doctrine design show SL-244 --knowledge facets on the c17 build. Verbatim: 'it seems like a scrappy prototype of what I actually want to see. Styling is incongruent with the document; the omitted facets defy understanding .. would I reach for it again? the CLI flags are cumbersome and TBH I expected knowledge would be visible by default, and it needs a decent amount of iteration to feel properly useful. The verdict is: disappointing as a feature, but not obviously incorrect.' This DISCHARGES VH-1 (the attestation was made) with a negative product verdict and no correctness claim against it. F-6, F-7 and F-8 carry the three specific complaints; this finding records the verdict itself so it is not lost behind them."
disposition = "verified"
response = "VH-1 is DISCHARGED — the attestation was made by the named human against the built binary on the real corpus, which is what a VH row requires — and its verdict is negative on the product with no correctness claim attached. That combination is not a failure state and must not be recorded as one: the slice's EX rows hold, its gate is green, and its invariants are re-derived in this ledger. What it does mean is that the slice's own objective 1 ('an entity read can carry its inbound knowledge records' content') is met at the mechanism and not at the outcome. Routed to the reconciliation brief so the verdict lands in slice-246.md rather than only in a ledger, and carried forward as IMP-465 with the three specific complaints split out to F-6 (-> ISS-467), F-7 and F-8."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Expected (STD-003, no silent skip): a degraded read is disclosed. Observed: the Facets level withholds the Argument-tier fields with no disclosure, so a withheld field is indistinguishable from an absent one"
detail = "DEC-150 splits each record's facet into Deciding and Argument tiers; Facets renders Deciding only. The rendering says nothing about the tier or about what it dropped. Concretely, at facets a DEC shows context/choice/rationale and a reader has no way to learn that alternatives and consequences exist, were populated, and were withheld — versus being empty. The slice DID build an explicit-marker vocabulary for the empty cases (by-design / unfilled / unreadable, DEC-149, X5, I6) and got it onto both arms at both levels; the WITHHELD case has no marker and was never modelled. This is the mechanism behind the human's 'the omitted facets defy understanding' (F-5). STD-003 governs a degraded read generally, not only an erroring one; a deliberate projection that does not announce itself is the same failure mode the standard names. Evidence: /home/scratch/sl246/block-facets.txt vs block-full.txt."
disposition = "verified"
response = "Confirmed as a real conformance gap against STD-003, not merely taste. The three states a facets reading cannot distinguish — withheld / empty / kind-has-no-Argument-fields — are demonstrable from /home/scratch/sl246/block-facets.txt against block-full.txt. Filed as ISS-467 with the cheap fix identified: the tier is already a column on the authored FacetFieldRow table, so the withheld key set is derivable at the render site without a second per-kind match, preserving C4. NOT dispositioned fix-now: the repair adds a rendering the design never specified, on both arms, under D1's one-meaning binding and without re-opening C2 — that is design work, not an audit-scope code fix. Routed to the reconciliation brief because design.md's marker vocabulary (DEC-149, X5, I6) is incomplete as written: it models three EMPTY states and no WITHHELD state, and that omission should be recorded where the next implementer reads it."

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "Expected (C1/DEC-145): default Skip is the safe default. Observed: the human expected knowledge visible by default and finds the flags cumbersome"
detail = "C1 makes Skip the default so that adding the level changes no existing output, and it is expressed in the type (KnowledgeLevel derives Default with #[default] Skip, src/knowledge.rs:946-950) precisely so no call site can drift. That is correct as built and is why I1/EX-3 hold. The human's VH-1 attestation disputes the PRODUCT choice, not the implementation: 'I expected knowledge would be visible by default, and ... the CLI flags are cumbersome'. Raised so the dispute is on the record against DEC-145 rather than only inside a verdict sentence. Note this is a live tension with IMP-398's deferred pointer line, which design.md 7.2 D4 pushed out of scope on the argument that discoverability is 'the separate, cheap answer' — the attestation is evidence that the composed read without it does not land."
disposition = "verified"
response = "The implementation is correct and is NOT what is being disputed: Default = Skip is expressed in the type (src/knowledge.rs:946-950), I1/EX-3 hold, and skip omits the JSON key rather than emitting an empty one (verified live: inspect SL-244 --json has no knowledge key). The dispute is with DEC-145's product choice and it is evidence-bearing, so it goes to the brief rather than being closed as taste. The specific evidential weight: design.md 7.2 D4 and DEC-145 both pushed the discoverability pointer out of scope as 'the separate, cheap answer'; the human attestation is the first real-use evidence on that split, and it says the composed read without the pointer does not get found. IMP-398 already owns the pointer line — this finding is the argument for promoting it from a nicety to the feature's other half, recorded in IMP-465."

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Expected: the knowledge block reads as part of the document it is appended to. Observed: it renders knowledge show's TOML-ish idiom under a Markdown design document"
detail = "design show SL-244 --knowledge facets emits ~3459 lines of Markdown, then a block whose entries are 'DEC-120 (shaped_by)' followed by a literal '[facet]' header and two-space-indented 'key: value' lines — the shape knowledge show uses for a standalone record read, carried over unchanged because the producers are shared (correctly, per C4/STD-001). The human's words: 'Styling is incongruent with the document'. No design invariant is violated: D1 binds the two ARMS to one meaning, and says nothing about the text arm cohering with its host document. Recorded because the shared-producer decision that makes the code right is the same decision that makes the output read as bolted on, and a later fix has to keep C4 while breaking the spelling apart."
disposition = "verified"
response = "Confirmed and deliberately left alone as code. No invariant is violated — D1 binds the two ARMS to one meaning and says nothing about the text arm cohering with its host document — so there is nothing here to fix-now against. It is routed to the brief and to IMP-465 rather than closed as aligned because the tension is structural and a future implementer must see it stated: the shared per-record producer is exactly what makes C4 and STD-001 hold, and it is exactly what makes the block read as knowledge show's output bolted onto a Markdown document. A fix must change the spelling without forking the enumeration, which is the non-obvious constraint."

[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Expected (PHASE-01 VA-1): exactly one per-kind facet field enumeration survives in src/. Observed: two — the claim holds for the production render path only"
detail = "VA-1's literal wording is a claim about src/. Re-derived with the mandated positive control on the 'why_matters' probe. Branch point fded37c0b: 5 hits (:949 the authored table, :1428/:1464 render_facet, :1892 format_facet's per-kind match, :2017 facet_json's per-kind match, :3136 the edit flags). After (22c4e32c7): 4 hits (:1129 the authored FacetFieldRow table, :1797 render_facet, :3793 the edit flags, :5472 a test expectation). format_facet's and facet_json's matches are GONE, which is what EX-2 and C4 actually require. But render_facet (src/knowledge.rs:1761) is still a full per-kind facet field enumeration. It is #[cfg(test)] (:1760) — a TOML round-trip helper, not on the show/render path — and it was already cfg(test) at the branch point, so the slice neither created nor worsened it. VA-1 is therefore DISCHARGED on its intent and overstated in its letter. Raised so a future reader running the same grep does not read the second hit as a regression."
disposition = "aligned"
response = "VA-1 is discharged on its intent and no change is warranted. C4's substance — 'the ONLY per-kind facet field enumeration left' on the render path — holds: format_facet's and facet_json's matches are both gone and both now render through the authored FacetFieldRow table, confirmed by the mandated positive control (5 why_matters hits at fded37c0b, 4 now, with :1892 and :2017 the two that went). The surviving render_facet is #[cfg(test)], a TOML round-trip helper, and was already cfg(test) at the branch point, so the slice neither created it nor left it behind. Recorded aligned rather than withdrawn because the finding is not raised in error: VA-1's literal wording ('in src/') will mislead the next reader who runs the grep, and the qualification belongs on the record where that reader will find it. No brief item — the criterion id is immutable and plan.toml is off-surface for reconcile."

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "Expected: slice-246.md's record census matches the corpus. Observed: it says fifteen records, twelve via shapes and three via concerns; the corpus has sixteen, eleven via shapes and five via concerns"
detail = "slice-246.md's Context section (the motivating specimen) states: 'Fifteen knowledge records point at the slice — twelve via shapes (ten DEC, plus EVD-012 and QUE-206) and three DEC via references(concerns).' Measured now with doctrine relation list --target SL-244: sixteen record-kind sources — eleven via shapes (DEC-120..127, DEC-138, DEC-139, QUE-206) and five via references(concerns) (DEC-140, DEC-141, DEC-142, DEC-144, EVD-012). Two divergences: the count moved (the corpus grew between scoping and now), and EVD-012 is attributed to shapes in the scope doc but actually arrives via concerns. The composed read is correct — it renders exactly the sixteen and correctly excludes the non-record sources (SL-251, IDE-047, IMP-391..399, ISS-309..317, RFC-031, RV-344/345) per DEC-148. It is the scope prose that is stale."
disposition = "verified"
response = "Confirmed; the composed read is right and the prose is stale. Measured: sixteen record-kind sources, eleven via shapes and five via references(concerns), with EVD-012 arriving via concerns rather than shapes as slice-246.md claims. The exclusions are correct per DEC-148 (filter on SOURCE kind): SL-251, IDE-047, IMP-391/392/393/394/395/399, ISS-309/310/314/315/317, RFC-031, RV-344/345 are all non-record kinds and none appears in the block. Routed to the brief as a per-slice direct edit of slice-246.md's Context section. Worth stating the general point there rather than just patching the numbers: a census counted at scoping time is a measurement with a date on it, and this one drifted in six weeks — the durable form is the query (doctrine relation list --target SL-244), not the tally."

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "Expected: a slice whose phases are all complete is past 'ready'. Observed: 6/6 phases completed, lifecycle still 'ready', and the binary reports itself divergent"
detail = "doctrine slice status SL-246 reports: 'SL-246 ready [warn] phases: 6/6' with 'divergent: phases complete but lifecycle not terminal'. Every phase sheet under .doctrine/state/slice/246/phases/ records status transitions through in_progress to completed (PHASE-02 also passed through blocked), so the phase tier tracked correctly and only the SLICE tier did not move. The capsule tier flips phase status but never flips slice lifecycle — /capsule-driver's charter ends at phase completion. Harmless in isolation; it matters because the audit->reconcile transition and the close-gate both key off the slice's lifecycle state, so the divergence would surface as a refusal at the wrong moment rather than here."
disposition = "fix-now"
response = "Fixed in this audit by moving the slice to its correct lifecycle state as part of the audit->reconcile handoff; the phase tier needed nothing, having tracked every transition correctly. Recorded rather than silently corrected because the cause is a seam, not an oversight: /capsule-driver's charter ends at phase completion and no capsule-tier agent owns the slice's lifecycle, so this divergence is structural and will recur on every capsule-driven slice. It matters because the close-gate and the audit->reconcile transition both key off the slice state, so the divergence surfaces as a refusal at whatever later moment someone tries to advance — far from its cause. Not routed to the brief: no artefact is wrong, a state field was unset."

[[finding]]
id = "F-12"
status = "verified"
severity = "minor"
title = "Expected: notes.md carries what must outlive the disposable phase sheets. Observed: it stops at the design run, six phases before the hand-back"
detail = "notes.md's Harvest section reads 'fresh-as-of: 2026-09-18 - design run at reviewing (revision 59, materialised) - c93b0f69f'. Execution ran 2026-09-19. 4457 lines of phase sheet under .doctrine/state/slice/246/phases/ carry durable material that exists nowhere else: PHASE-01 F-1 (the blankness predicate, which became PHASE-03 EX-2's amendment), F-2 (an STD-003 judgement call on an unreachable branch), PHASE-03 F-a..F-f (six escalations, two of which became criterion amendments), PHASE-06's traced deletion chain (scaffold_design_doc -> design_scaffold -> render_design plus DESIGN_KIND and DESIGN_DEPRECATION_NOTICE, none named in EX-1/EX-2 or VA-1's grep list) and its model note on why a sonnet planner needed a call graph rather than a grep. .doctrine/state/ is rm -rf-able by contract; none of this survives it."
disposition = "fix-now"
response = "Fixed in this audit's harvest tail, which is exactly the step /audit owns: the durable material is lifted from the disposable phase sheets into notes.md before .doctrine/state/ can be discarded. Kept: PHASE-01 F-1 (the blankness predicate that became PHASE-03 EX-2's amendment) and F-2 (the STD-003 judgement on an unreachable branch); PHASE-03 F-a through F-f (six escalations, of which F-a became EX-4's arity amendment and F-b became CHR-074 and this ledger's F-3); PHASE-06's traced deletion chain and its four symbols named in no upstream criterion or grep list; and PHASE-06's model note on why a sonnet planner had to trace a call graph where the plan implied a grep would do. Recorded rather than done silently because the seam is the same as F-11's: the capsule tier fills phase sheets and nothing in it owns notes.md, so the harvest gap is structural for capsule-driven slices, not a lapse by any one worker."

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "Expected: the handed-back capsule worktree can be gated where it lands. Observed: plain git and cargo both fail inside it in the jail, so PHASE-06 EX-5 was not independently checkable without repair"
detail = "Two independent defects in the hand-back at .worktrees/SL-246-c17. (1) Its .git file reads 'gitdir: /home/david/dev/doctrine/.git/worktrees/SL-246-c17' — the HOST path, absent inside the bwrap jail — so every plain git invocation inside it fails 'not a git repository: (null)', git worktree list marks it prunable, doctrine slice conformance errors out, and tests/e2e_knowledge_install_commit.rs::this_repos_knowledge_tree_is_tracked fails on 'git ls-files failed'. (2) web/map/dist is absent, so the RustEmbed derive on map_server::assets::Assets produces no ::get and cargo build fails with 3 x E0599 before any test runs. Both are provisioning, not slice defects: doctrine worktree fork provisions dist correctly ('provisioned: 4 copied') and an in-jail fork gates green. PHASE-06 EX-5 ('check gate is green with NO suite red') IS discharged — just gate exits 0 with 7801 tests passing and 0 FAILED on the merged audit tree at 1843904be — but it took repairing someone else's tree to find that out. mem_019f4c64e65574238b7026f7301c8a2c already records the dist half for dispatch evidence refs; the git-linkage half is new and specific to a hand-back produced outside the jail."
disposition = "verified"
response = "Confirmed on both halves, and PHASE-06's EX-5 is nonetheless DISCHARGED: just gate exits 0 on the merged audit tree with 7801 tests passing and zero FAILED, including tests/architecture_layering.rs (so DEC-274's claim that the command tangle stays at 76 holds by the gate, not by assertion). The finding is about where the claim can be CHECKED, not whether it is true. Filed as ISS-469. Not fix-now: repairing the hand-back tree's .git file would break the host's view of the same worktree, and the tree is someone else's artefact — the correct repair is at the hand-back contract, which is what the item names. The audit instead forked a jail-local worktree with doctrine worktree fork, which provisioned web/map/dist ('4 copied') and gated green first try, demonstrating that neither half is intrinsic. mem_019f4c64e65574238b7026f7301c8a2c should gain the git-linkage half; queued in the harvest."

[[finding]]
id = "F-14"
status = "verified"
severity = "blocker"
title = "Expected: working around the broken hand-back is safe. Observed: exporting GIT_DIR/GIT_WORK_TREE into cargo test rewrote the SHARED repository config, silently repointing every git invocation in the repo at one worktree"
detail = "Raised against this audit's own conduct, because the trap is structural and the next agent will hit it. Working around F-13's broken linkage, this audit exported GIT_DIR and GIT_WORK_TREE and re-ran cargo test -p doctrine --test e2e_knowledge_install_commit. That suite's fixture (tests/e2e_knowledge_install_commit.rs:28-35) does git init -q then git config user.email/user.name with .current_dir(tmpdir) but NO env scrubbing, so under an inherited GIT_DIR all three ran against the REAL repository: git init with GIT_WORK_TREE set wrote core.worktree = /workspace/doctrine/.worktrees/SL-246-c17 into /workspace/doctrine/.git/config, and the two config calls wrote [user] email=t@t name=t. Proof of attribution, not inference: those are the fixture's literal values, the repo had no [user] block's worth of reason to hold them, and core.worktree was provably absent at session start (a primary-tree git status returned a coherent 4-file edge diff, which is impossible with core.worktree pointing elsewhere). Blast radius while set: EVERY git invocation in the repo, from any worktree including the primary tree on edge, used c17 as its working tree — a git merge run from the audit worktree wrote its results into c17 instead. Remediation applied: core.worktree unset, c17 restored to a clean checkout of capsule/SL-246/c17, merge redone correctly. Residue NOT touched: [user] t@t/t is still in .git/config and is left for the owner to decide (in-jail GIT_AUTHOR_*/GIT_COMMITTER_* override it; a host-side commit would be misattributed)."
disposition = "fix-now"
response = "Remediated in full within this audit, and the residue is named rather than quietly left. Done: core.worktree unset from /workspace/doctrine/.git/config; the primary tree re-verified sane (toplevel /workspace/doctrine, branch edge, clean status); .worktrees/SL-246-c17 restored to a clean checkout of capsule/SL-246/c17 (git restore over the tracked paths the stray merge wrote, plus removal of the untracked files it introduced — SL-260's design.md, RV-371's two files and symlink, two observation records, one backlog symlink); the botched merge reset and redone correctly on dispatch/246, with the ISS-462 resolution rebuilt from scratch rather than salvaged. Verified: both trees report clean, and the merged tree's gate is green. NOT touched, deliberately: [user] email=t@t name=t remains in .git/config. It is inert inside the jail (GIT_AUTHOR_*/GIT_COMMITTER_* override it) but would misattribute a host-side commit, and a git identity is the repository owner's to set — flagged to them rather than changed. The class is filed as ISS-468, with ISS-256 cited as the resolved sibling that makes this a fixture-hygiene class rather than two unlucky tests."

[[finding]]
id = "F-15"
status = "verified"
severity = "major"
title = "Expected: EX-7's migration covered the population that now misdescribes the verb. Observed: three other slices' authored notes still instruct a bare design show for run state"
detail = "EX-7 priced the migration as four emitted strings, one prose line in install/routing-process.md, and the test call sites; CHR-073 adds five memories. A corpus sweep at audit (grep -rn 'design show' over .doctrine/, excluding SL-246's own files, this ledger, runtime state, and any hit already carrying --format) finds a population neither covers — other slices' AUTHORED notes, which are committed, agent-read on resume, and now wrong: .doctrine/slice/247/notes.md:93 ('Live in the design run's inquiry map (doctrine design show 247)' — that verb now renders the document); .doctrine/slice/253/notes.md:58 ('design show will not display them, so read [[review.finding]] in the runtime design.toml') and :345 ('doctrine design show SL-253 carries each finding, the section it concerns, and its resolution'); .doctrine/slice/256/notes.md:142 and :369 ('design show over all seven runs', 'doctrine design show 244 prints the terse message today'). SL-233's plan.toml/plan.md/notes cite the verb as a SYMBOL in a historical record and are NOT affected. The shipped prose sweep is clean — the one hit in plugins/doctrine/skills/handover/SKILL.md:36 already spells --format status. Sharpest detail: mem_01a0b2a8431371539e7911821e9c8da4, recorded from RV-370 F-16, is a memory whose whole thesis is that a priced change must NAME ITS POPULATION or the reviewer cannot check it — and this is that same count missing a third population."
disposition = "fix-now"
response = "Fixed by widening the carrier rather than by editing three slices' notes from inside this audit. CHR-073 is the right owner — it already holds the memory population, the /reviewing-memory route, and the 'must land with or before the code' constraint — and its body now names the slice-notes population explicitly with the five file:line sites, so the item can be discharged against a list rather than a re-derived grep. Not edited here directly: SL-247, SL-253 and SL-256 are other slices' authored artefacts, two of them active, and rewriting another slice's notes.md mid-audit is exactly the kind of drive-by SL-246's own selector discipline exists to prevent. The reconciliation brief carries the landing constraint: CHR-073 must be discharged with or before this slice lands, and it is now a larger item than when it was written."

