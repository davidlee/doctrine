detail = """
Expected: `review dispose --help` accepts --disposition only from the closed set "aligned | fix-now | design-wrong | follow-up | tolerated". `verified` is a finding STATUS, reached by the raiser's `verify` act. It is not a disposition, and `--disposition verified` is refused.
Observed: plugins/doctrine/skills/audit/SKILL.md.
- "Audit lens", paragraph "Disposition convention (audit-specific)": "Audit's permitted dispositions are: `aligned` ..., `fix-now` ..., `tolerated` ..., and `verified` with a reconciliation-brief link for spec/governance changes delegated to `/reconcile`." The same paragraph goes on: "Audit must never use `design-wrong` or `follow-up` for spec/governance items".
- "Process" step 3: "do not pick follow-up for spec/governance findings — those go to the reconciliation brief with `verified`".
An auditor who follows this issues `review dispose ... --disposition verified` and is refused. Worse, the skill forbids the two vocab members that could carry a spec/governance finding (`design-wrong`, `follow-up`), and it names no legal disposition for such a finding.
Correct form: name a legal disposition for a spec/governance finding that is delegated to /reconcile. That could be `design-wrong` (its vocab meaning is "reconcile the design artifact so canon tells the truth"), or `aligned` or `tolerated` with the brief link in --response. Then say that the raiser verifies the finding (status `verified`) once the brief entry exists. Keep status and disposition apart. The "Every finding stays `verified`" sentence is about status, and it can stay.
"""
