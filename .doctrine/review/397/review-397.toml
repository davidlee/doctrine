[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Feedback skill should give the responder a responder act; on a doctrine RV it tells them to contest"
detail = """
Expected: On an RV, `contest` is the raiser's act ("Contest an answered finding (the raiser's verb)"; can(): contest is raiser, answered → contested). The responder's way to disagree with a finding is `dispose --disposition aligned` (observed behaviour already correct), with the counter-evidence in --response. A `contest --as responder` is refused.
Observed: plugins/doctrine/skills/feedback/SKILL.md. /feedback is the skill the boot routing sends a RECEIVER of review findings to, which on a ledger is the responder.
- Step list: "*wrong* → contest, with the verified evidence that shows it". Further on: "If it defeats none and you hold verified evidence, contest."
- "With structured review ledgers": "If the feedback arrives on a structured ledger (a doctrine RV ...), the ledger owns the mechanics — disposition vocabulary, contest moves ... adjudicate before disposing, evidence before contesting".
On a doctrine RV this steers the responder toward the raiser's verb.
Correct form: in "With structured review ledgers", map the conduct onto the responder's acts. A finding you judge wrong is disposed `aligned`, with the evidence in --response. `contest` belongs to the raiser, when an answer does not satisfy them. Keep "contest" as generic conversational language elsewhere if that is wanted, but make the ledger mapping explicit.
"""
disposition = "fix-now"
response = """
Fixed in plugins/doctrine/skills/feedback/SKILL.md, "With structured review ledgers". A new paragraph maps the conduct onto the responder's acts on a doctrine RV. A finding judged wrong is disposed `aligned` with the verified counter-evidence in --response, not contested. `contest` is the raiser's verb, for when the answer does not satisfy them. A later change goes through `review amend`. The generic "contest" wording elsewhere in the skill is left as conversational language, as the finding allows.
"""

