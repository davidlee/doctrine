[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Fork caveat should name the verbs the guard covers; guidance says all review verbs refuse on a fork, but new, show and list do not"
detail = """
Expected: The fork guard is `resolve_review_root` (turn.rs), and only raise, dispose, amend, verify, contest, reopen, withdraw, conclude, status, prime and unlock call it. `run_new` (verbs.rs), `run_show` and `run_list` (read.rs) resolve the root with `root::find` and no fork check. So `review new` on a plain linked worktree (a branch that is not `dispatch/<digits>`) succeeds and mints an RV in the fork. The next turn verb then refuses. That trap is the one local memory mem.pattern.review.rv-verbs-refuse-on-worktree-fork describes, and it still holds. The phase sheet's ground truth ("refuses every review verb") is wrong on this point too.
Observed:
- install/review-ledger.md §6, "Parent-tree caveat": "The `doctrine review` verbs refuse a root inside a worktree fork".
- plugins/doctrine/skills/inquisition/SKILL.md, the closing paragraph of "Entering the verdict into the record": "the `doctrine review` verbs refuse a root inside a worktree fork".
- The MCP review_new description (tools.rs): "Review verbs refuse worktree/fork-resolved roots — drive from the main tree." This is the verb that does NOT refuse, and "main tree" leaves out the coordination tree, which the refusal text itself allows ("parent or coordination tree").
An agent that trusts "verbs refuse" reads a successful `review new` in a fork as proof that it is not in a fork.
Correct form: say that the turn verbs, status, prime and unlock refuse in a fork, and that `review new` does not. A `new` run in a fork leaves a stray ledger there, so open the RV from the primary or coordination tree. Alternatively, route the gap to a code follow-up that makes `new` refuse too. The MCP description should say "primary or coordination tree".
"""
disposition = "fix-now"
response = """
Fixed in three places. The guard coverage was re-checked in code: `resolve_review_root` is called by the eight turn verbs plus status, prime and unlock, and not by run_new/run_show/run_list.
- install/review-ledger.md §6 "Parent-tree caveat": names the guarded verbs and says that `review new`, `show` and `list` do not refuse. It says a `new` in a fork leaves a stray ledger there, so a successful `new` is no proof you are outside a fork. It says to open and drive reviews from the primary or a coordination tree.
- plugins/doctrine/skills/inquisition/SKILL.md, "Entering the verdict into the record": "Open and drive the ledger from the primary tree (or a coordination worktree)". It says the turn verbs refuse in a fork, and that `review new` does not and strands the ledger.
- src/mcp_server/tools.rs, review_new description: says this verb does NOT refuse a fork (the turn verbs, review_status, review_prime and review_unlock do), and to open it from the primary or coordination tree.
No fork guard was added to new/show/list; that would be a behaviour change outside the plan.
"""

