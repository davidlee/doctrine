[[finding]]
id = "F-12"
status = "verified"
severity = "minor"
title = "A title read through - or @path should be single-line; the trailing newline is kept and splits the list row"
detail = '''
Expected: A title is one line. install/review-ledger.md "Passing prose" recommends `--title @/tmp/title.txt` and heredoc `-` input, and both nearly always end in a newline.
Observed: `input.rs` `resolve_prose` returns stdin or file content verbatim, and nothing trims a title. This ledger shows the effect. RV-397 was opened with `review new ... --title -` fed by a one-line heredoc. review-397.toml stores `title = """\nSL-268 PHASE-09 bounded guidance review\n"""`. `review list --target SL-268` renders RV-397 as two table rows, the second one empty, and `review show` prints a blank line under the heading. A finding title raised with `--title @file` would be stored the same way. That is the exact form the ledger doc's example teaches.
Correct form: a code fix belongs in the binary: trim a single trailing newline, or refuse an embedded newline, for --title on new and raise. If that is out of this phase, record a follow-up, and have review-ledger.md warn that a title file or heredoc keeps its trailing newline (for example, `printf %s` into the file). Or drop the `--title @/tmp/title.txt` example in favour of a quoted literal title.
'''
disposition = "fix-now"
response = '''
Fixed in code.
- src/input.rs: new `resolve_prose_title` (plus a `TITLE_FLAG` const). It resolves through `resolve_prose` and, only when the raw value was `-` or `@path`, trims trailing line terminators (`\n`/`\r`). A literal title stays verbatim, and only the tail is trimmed.
- src/review/cli.rs: `ReviewCommand::resolve_prose` routes `--title` on `new` and `raise` through it. Detail, response, note and basis still go through plain `resolve_prose`, verbatim.
- Unit tests (src/input.rs): `title_from_dash_or_at_path_drops_trailing_line_terminators` and `literal_title_stays_verbatim`.
- Golden (tests/e2e_review_golden.rs, G-P6 `title_read_through_dash_or_at_path_is_stored_single_line`): `new --title -` with a heredoc-style "\n" stores a one-line title, and `list` renders one row with no blank continuation. `raise --title @title.txt` ("\r\n") stores a one-line title, while `--detail @detail.md` keeps its trailing newline. A mutation beat (trim disabled) failed this golden on its ledger assert, not on a compile error.
MCP titles are JSON literals and never pass through the resolver, so they are unchanged.
RV-397's own stored title (with a trailing newline, from before the fix) is left as it is.
'''

