Fixed in plugins/doctrine/skills/audit/SKILL.md. The "Disposition convention (audit-specific)" paragraph now names the closed vocab. A spec/governance change delegated to /reconcile is disposed `design-wrong`, with the reconciliation-brief link in --response. `follow-up` stays forbidden for those items, and `design-wrong` is no longer forbidden. The paragraph also keeps status and disposition apart: `verified` is a status reached by the raiser's `review verify`, never a --disposition value. Process step 3's anti-escape line was changed to match: dispose `design-wrong` with the brief link, and the raiser verifies once the brief entry exists.
