[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Constant-size envelope expected; variable scalars have no encoded-size bounds"
detail = "In .doctrine/slice/233/sketches/projection-bounds.md sections (a) and (e), the governing claim says every worst-case term is a named constant times a named constant, but only question text and the worked example receive scalar size caps. The table assigns unexplained fixed byte figures to next obligation, blocker rows, durable-record rows, section/review rows, derived slice facts, fragment metadata, identifiers, titles, fingerprints, counts, revisions, and truncation notices. Several of those carry variable strings, and ENVELOPE_QUESTION_CHARS is a character cap rather than an encoded-byte cap: 160 Unicode characters or JSON-escaped controls need not fit the asserted 230-byte frontier row. Exact decimal counts and the monotonic revision also grow in rendered width unless their wire types and maxima are part of the proof. Cardinality caps therefore do not establish the claimed 12 KiB encoded ceiling, so PHASE-02 would define an envelope whose alleged bound can be exceeded by legal values. Settle this by specifying the wire schema for every row and a named encoded-size bound for every variable scalar in the budgeted rendering, defining character/byte and escaping semantics, and adding hostile maximal Unicode/escaping/value tests that prove the whole rendered envelope stays under the ceiling."
disposition = "fixed"
response = "Accepted in full — the governing claim did not follow from the constants as written. Rev 2 replaces ENVELOPE_QUESTION_CHARS with encoded-BYTE caps (ENVELOPE_QUESTION_BYTES 160, ENVELOPE_LABEL_BYTES 120, ENVELOPE_REASON_BYTES 240, ENVELOPE_PAYLOAD_BYTES 128), and adds a § 'The budgeted rendering' fixing the one rendering bounds are stated against (design show --format prompt; json/status explicitly not budgeted), that caps are measured on the emitted form AFTER escaping, that truncation cuts on a UTF-8 boundary including its elision marker, and that numeric fields are bounded by their wire type's max rendered width. Beyond the caps, rev 2 stops relying on arithmetic alone: § (b)'s eviction ladder measures the rendered envelope and evicts until it fits, so ENVELOPE_NORMAL_BUDGET_BYTES is ENFORCED rather than predicted. The hostile maximal-Unicode/escaping case is named as fixture content in (e)."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Drop policy required for every bounded field; four lists and the global ceiling have none"
detail = "PHASE-02 EN-2(b) requires what is dropped first whenever a limit binds. In projection-bounds.md (a), active path, blockers, durable records, and section/review state are all bounded, but (b) defines a drop end only for frontier and change delta; (c) and (d) order only those same two lists. Section (g) discusses the loss from blockers, records, and sections but still supplies no ranking, and it omits active-path loss entirely. The whole-envelope ENVELOPE_NORMAL_BUDGET_BYTES is also a hard ceiling, yet the sketch defines no cross-field eviction or refusal rule when individually legal fields collectively exceed it; the refusal at lines 113-116 covers only the no-drop set alone. Implementers can therefore produce different envelopes while each claims conformance, and the sketch only nominally answers EN-2(b) and (g). Settle it with a deterministic total order and retained end for every bounded list, an explicit active-path loss rationale, and a global overflow algorithm that says which field yields in which order or exactly when projection refuses, with omitted counts for every eviction."
disposition = "fixed"
response = "Conceded in full. The contest is right that rev 2's fix left the overflow rule partial: the active path was in neither the eviction ladder nor the no-drop set, so a state where the ladder is exhausted and no-drop plus active path still exceeds ENVELOPE_NORMAL_BUDGET_BYTES had no defined outcome — the stated refusal covered only the no-drop set alone. Rev 2's exclusion reasoning ('it is the shortest bounded list and losing it costs orientation disproportionately') was a sound judgement expressed as the wrong mechanism: 'costs the most to lose' argues for evicting it LAST, not for removing it from the ladder. Rev 3 makes the active path ladder rung 6, after section rows, durable records, change delta, blockers, frontier. It drops from its already-stated drop end (the root end; it retains the cursor end). With every bounded list on the ladder exactly one irreducible overflow state remains — the no-drop set alone exceeding the ceiling — and the existing named refusal covers it. Ladder-exhausted-and-still-over is now that same state by construction, not a separate unhandled one, so the rule is total. Committed 5fe46ec7."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Total pure frontier order expected; admitted candidates are unranked and pinning contradicts blocking"
detail = "In projection-bounds.md (c), candidates include every open node within primary-tree distance two plus direct needs neighbours at any distance, but ranking clauses classify only cursor children, cursor siblings, and one nearest ancestor-sibling before falling through to in-degree and insertion order. They do not assign relationship priority to parents, grandparents, grandchildren, more distant ancestor-siblings within distance two, or needs neighbours, nor say how nodes outside a posture category compare with nodes inside it. Stable map insertion order is asserted without being defined as persisted model state; if it means container iteration, PHASE-02 EX-5 determinism is lost. The rules also say a user-pinned node is always first and never dropped while derived-blocked nodes never appear, without settling a pinned node that becomes blocked, resolved, deferred, or pruned, or whether multiple pins are legal. Thus the order is not specified as a total pure function for reachable states, and EN-2(c) is not settled. Define an explicit lexicographic sort key for every admitted relationship class using persisted values only, define cursorless/empty/fully-resolved fallbacks, enforce the pin cardinality invariant, and state lifecycle and derived-blocking eligibility and pin conflict behaviour; table-test all of those states."
disposition = "fixed"
response = "Conceded on both counts; the second is the more serious and I had not seen it. (1) ELIGIBILITY vs RANK. The contest is right that a parent's sibling is primary-tree distance 3 from the cursor and so was excluded by rev 2's distance-2 candidate rule, while rank 4 ranks nearest ancestor-siblings and the degenerate-state table makes them the leaf fallback. Checking further, the same mismatch hits rev 2's own rank 6 parenthetical: under any consistent edge-count metric where a sibling is distance 2 (via the parent) and a grandchild is distance 2, a nibling is cursor->parent->sibling->nibling = distance 3 too. So rev 2 stated eligibility twice and the two statements disagreed in both directions. Rev 3 DELETES the distance metric rather than repairing it — it was only ever a lossy paraphrase of the enumeration it contradicted — and the rank table becomes the sole eligibility rule: a node is a candidate iff it matches a class in the table. Two definitions that must be kept in agreement is one more than the design needs. (2) OVERLAP PRECEDENCE. Right, and this is the original F-3 partiality surviving in a new place: a cursor's child may also be a direct needs neighbour, matching both rank 0 and rank 2, with no rule selecting between them. Rev 3 states it: classes are tested in ascending rank order and a candidate takes the FIRST it matches, so kinship is a total function on the candidate set. Committed 5fe46ec7."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Worst-case token answer required; 3.5 bytes per token is only an average"
detail = "PHASE-02 EN-2(e) asks for the worst-case envelope size in tokens. Projection-bounds.md (e) divides an asserted byte estimate by approximately 3.5 bytes/token and calls the result a 3.0k-token worst case. That ratio is workload- and tokenizer-dependent, not a worst-case conversion; punctuation-heavy JSON, short identifiers, escaping, and hostile text can tokenize far more densely. A test that measures one large-run fixture can validate only that fixture population and rendering, not the stated every-text-field-at-cap worst case unless the fixture and tokenizer cover the extremal encoding. The arithmetic is also misstated: the listed rows sum to 10,374 B = 10.13 KiB, not approximately 10.4 KiB, and 12 KiB is 18.45 percent headroom over that sum, not approximately 15 percent. Consequently the sketch has a plausible average estimate but no EN-2(e) worst-case token bound, so its R1 conclusion is not evidence. Settle it by naming the budgeted rendering and target tokenizer or tokenizer family, constructing maximal legal values including escaping and Unicode, measuring tokens with that tokenizer in the gate test, and enforcing an explicit token ceiling; otherwise report the conservative byte-to-token worst case rather than 3.0k."
disposition = "fixed"
response = "Accepted in full, including the arithmetic, which I re-checked before answering: the rows summed to 10,374 B = 10.13 KiB and I labelled it ~10.4 KiB (a KB/KiB conflation), and 12 KiB over that sum is 18.45% headroom, not ~15%. Both were wrong as stated. The deeper error is the one that mattered: 3.5 bytes/token is an average and EN-2(e) asks for a worst case; the same bytes at a punctuation-dense ~1.5 B/token are ~6.9k tokens, so the 3.0k figure R1 rested on was not a bound. Rev 2 (e) splits the answer three ways: a defensible upper bound of <= 16,384 tokens (a byte-level BPE token covers at least one byte, so the byte ceiling bounds tokens by construction and needs no measurement); a labelled expected-case estimate (~4.3k saturated at ~3.5 B/token); and what the gate actually verifies — the PHASE-04 test projects the large-run fixture including a hostile multi-byte/escape-heavy case, measures with the target tokenizer, and asserts the byte ceiling. The table is now stated as a prediction the test falsifies. Rev 2 also relocates R1's weight onto the property that survives this correction: constancy in run size, against an unbounded projection that passes 100 KiB and grows every turn."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "R2 distinguishability expected; local omission counts can report zero on a globally huge run"
detail = "Projection-bounds.md (g) makes its load-bearing R2 claim that exact omitted counts distinguish a small run from one truncated to look small. The sketch never names which global counts the envelope carries. Frontier omission is computed only after (c) first excludes all nodes outside distance two and non-neighbour needs nodes, so a several-hundred-node map can have at most seven local candidates, frontier_omitted = 0, truncated = false, and hundreds of unresolved nodes outside the window. The same problem applies to any selection stage that narrows a universe before the bounded prefix: an exact post-limit omitted count says nothing about items excluded by relevance. Therefore the claimed distinction is false as specified even if every cap reports perfectly. Settle it by naming and budgeting exact global totals that expose run complexity, at minimum node lifecycle/provenance totals and the count outside the nearby-frontier candidate set, and by testing two envelopes with identical visible rows but radically different distant maps to prove they cannot render as equally small."
disposition = "fixed"
response = "Accepted in full — this falsified the sketch's own load-bearing claim and was the finding I would least have wanted to be true. The mechanism is exactly as stated: (c) narrows candidates by relevance BEFORE any cap applies, so a 500-node map with a leaf cursor yields a handful of candidates, frontier_omitted = 0 and truncated = false, and the envelope reports 'nothing omitted' on a huge run. An omitted count measures what a CAP discarded and says nothing about what SELECTION discarded. Rev 2 (g) states the claim was false rather than quietly editing it, and repairs it with a global-totals block in the no-drop set: total nodes and counts by lifecycle (open/resolved/deferred/pruned), derived-blocked count, total sections and sections with outstanding review state, total material changes since the baseline distinct from rows rendered, and — the number the original claim needed and never had — open nodes OUTSIDE the frontier candidate set. Budgeted at 288 B. The corresponding test is the one the finding prescribes: two envelopes with identical visible rows and radically different distant maps must not render as equally small."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Normal/full prefix property expected; active-path and delta retention require suffixes"
detail = "Projection-bounds.md (f) requires every normal list to be a prefix of the full list under the same ordering. That conflicts with other commitments. Section (a) defines active path as root to cursor and says context above the six-level window is dispensable, which requires dropping the root-side head and retaining a suffix nearest the cursor; retaining the literal prefix instead discards the decision-local cursor end. Section (b) says the change delta drops oldest first so newest changes survive, which is also a suffix if full history is rendered in conventional chronological order; (d) never specifies the opposite newest-first rendering needed to make it a prefix. This is not cosmetic: PHASE-04 is told to test the subset relation and would have to choose between the decision-local loss policy and prefix equality. Settle it by defining the full ordering for each list and either orienting active path and delta so the retained values really are prefixes, or weakening the invariant to an order-preserving subsequence/suffix relation and testing the intended end explicitly. The active-path choice must also be reflected in EN-2(g) loss rationale."
disposition = "fixed"
response = "Accepted in full. The incoherence was real: (f) claimed normal is a PREFIX of full while (b) retained the cursor end of the active path and the newest end of the change delta, both suffixes under those lists' natural orderings, and (d) never specified a newest-first full rendering that would have made the delta a prefix. Prefix equality and decision-local retention cannot both hold, and decision-local retention is the one worth keeping — retaining a literal prefix of the active path would discard the cursor end, which is where the decision is. Rev 2 weakens the invariant precisely rather than papering over it: for every bounded list the normal envelope's entries are an ORDER-PRESERVING SUBSEQUENCE of --full's entries for that list, with cardinality <= and the retained end named per list in (b)'s table. Naming the retained end per list is what keeps the weakened invariant testable rather than vacuous, which was the risk in weakening it. The active-path choice is now reflected in (g)'s loss rationale as the finding required."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "Material delta contract expected; proposed change rows cannot encode or deterministically retain it"
detail = "Projection-bounds.md (d) adds a snapshot change log of only (revision, kind, subject_id) rows, but the promised material events include needs-edge addition/removal, stage transitions and regression reasons, fingerprint changes, evidence invalidation, review invalidation, and checkpoint creation/adoption. A kind plus one subject ID does not identify both ends of an edge, old/new state or fingerprint, a regression reason, affected evidence, or create versus adopt, so it cannot in general render the claimed delta without consulting historical state that the sketch says is unavailable. Oldest-first orders revisions but not multiple rows created by one unordered apply, so a ten-row cut through one revision is nondeterministic or can split one atomic material change set. Retention also needs an explicit oldest-covered revision even when intervening revisions contain no material rows, or unavailable and empty cannot be distinguished reliably. Finally, this is a new persisted snapshot group absent from design.md section 5.3 and PHASE-03 EX-10, so no later phase criterion currently requires or verifies it despite the sketch assigning it to PHASE-03. Atomic sibling replacement and DEC-059 can accommodate an event log, and some retained history is necessary for the current arbitrary --known-revision interface, but this schema and ownership are not settled enough to build. Specify a self-contained event vocabulary and payloads, deterministic within-revision order and truncation semantics, retention-floor metadata, atomic candidate-update rules, and amend the governing PHASE-03 snapshot/test contract; alternatively narrow --known-revision delta semantics and revise the interface explicitly."
disposition = "fixed"
response = """
Conceded on all three counts; each verified against the text before answering. Rev 6 set an explicit falsifier — a sixth instance the layer rule does not catch means widen the rule, never patch the instance — and this round found one INSIDE rev 6's own fix. Rev 7 honours the falsifier rather than evading it.

(1) UNIVERSAL ADMISSION ENFORCEMENT. Conceded, and rev 6 created this hole. Making ids non-truncating moved the load-bearing guarantee from the renderer — which always held, badly — to admission, which held only where someone remembered. VA-8 leg 1 used two LEGAL ids near the boundary and never forced a refusal; PHASE-05 EX-10 covered section ids only. The escape described is exact: one path accepting a 33-byte id breaks the 32-byte row premise and the envelope arithmetic while every rev 6 test passes. Fixed structurally per the contest's own better suggestion — EX-16(d): every run-local id (node, section, gate, inquiry, attestation) is built through ONE VALIDATING CONSTRUCTOR with no other route, so enforcement is a property of construction rather than of each call site. VA-9 leg 2 enumerates the id kinds programmatically and feeds each one byte over the bound; leg 3 requires the bypass-constructor demonstration.

(2) THE GREP WAS THE CONTAINMENT CHECK'S ERROR ONE LEVEL UP. Conceded, and the framing is right: detecting one spelling is not proving a property, which is the distinction this review already established between containment and identity. A copied literal or renamed constant recreates the defect with the grep green; re-exports, aliases and wrappers evade it entirely. Replaced in EX-16(c) by a MODULE DEPENDENCY RULE riding ADR-001 and the existing tests/architecture_layering.rs — ENVELOPE_* lives in a rendering tier that storage and admission may not depend on. A dependency-graph property is closed under aliasing and indirection in a way no text search is, and it rides an existing checker rather than inventing a bespoke one. VA-9 additionally requires the layering map to be demonstrated RED when the rendering-tier entry is removed, because a boundary that is not declared is not enforced regardless of what any test file asserts.

(3) 2048 WAS UNDERIVABLE — the sixth instance, in the repair itself, after the round-4 brief named this as the defect class's favourite hiding place. Conceded without reservation. The important part is WHY the layer rule missed it: that rule governs where a bound acts, never whether a bound is justified, so it is blind to this by construction. Hence THE PROVENANCE RULE (EX-16(a)): every bound states what derives it, and a bound that cannot be derived is REMOVED rather than guessed, because an underivable number is a decision in disguise that will later be used to settle questions it has no standing to settle. This slice has already lived that — an underivable 16 KiB ceiling was twice used to reject design alternatives.

Applying provenance to 2048 deletes it. Taking the contest's second option: the stored reason now carries NO bound. That needs no number to defend — the snapshot already stores unbounded prose in section bodies, so bounding this one field was special-casing without a rationale. If storage volume ever needs bounding it is a storage-model decision applying uniformly, not a constant beside a rendering cap. The projection is safe regardless: the rendered reason elides to ENVELOPE_CHANGE_REASON_BYTES = 96 however long the store is. VA-9 leg 1 requires a stored reason far past any constant in the design, asserting persisted bytes byte-identical to input AND the rendered row still within ENVELOPE_PAYLOAD_BYTES with the marker present.

THE MECHANISM IS NOW A PAIR: layer (where a bound acts) and provenance (whether it is derived). Together they retro-catch every instance in this review's history, including the three asserted-number defects the layer rule alone could not see — rev 3's ~320 B payload, rev 3's 220 B row, and F-4's 3.5 bytes/token. EX-16(e) carries the retro-catch obligation forward to the pair.

NO BYTE ARITHMETIC MOVED, again: 145 / 264 / 15,576 / 9000 recomputed independently and unchanged; deleting CHANGE_REASON_INPUT_BYTES touches no rendered term.

THE FALSIFIER NOW STANDS FOR THE PAIR: a seventh instance neither rule catches means widen again, not patch. And the honest reading of the trend, recorded in the sketch: every round has now found the defect in the REPAIR rather than the original, so what is under test is no longer the design but the author's method."""
