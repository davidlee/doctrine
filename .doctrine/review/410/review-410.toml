response = "Verified (src/listing.rs:944). design.md sec-2 (Page size) now specifies next = offset + shown; an aligned offset hints --page, an unaligned one hints --offset. Aligned output is byte-identical, so the priority caller (src/priority/render.rs:291) is unaffected. sec-7 adds the helper's first unit table."

