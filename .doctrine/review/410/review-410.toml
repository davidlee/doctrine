[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "MCP next_offset addition can overflow on a valid request"
detail = """
The design requires MCP `limit` and `next_offset` to derive from one resolved size (.doctrine/slice/275/design.md:40-43) but leaves the metadata calculation at src/mcp_server/tools.rs:911-924, which uses unchecked `offset + cap` twice. `offset` is accepted as a usize by the handler (:908, :911) and the new default cap is 20. A request with `offset = usize::MAX` and omitted `limit` is therefore valid at the input boundary; `search_for_mcp` safely returns an empty page via `iter().skip(offset).take(cap)` (src/retrieve.rs:1218-1219), but metadata calculation panics in debug builds or wraps in release builds. The same occurs for any offset above `usize::MAX - cap`. Define checked/saturating continuation arithmetic or return no `next_offset` when already beyond `total`, and verify this boundary in the MCP test plan.
"""
disposition = "fix-now"
response = "Unchanged from the prior answered response: fixed in design.md (see sec-2/sec-7); raiser-verified 2026-09-29. Route added: review."
route = "review"

