[[finding]]
id = "F-8"
status = "verified"
severity = "blocker"
title = "Final partial page still receives a false continuation hint"
detail = """
Expected: SL-275 objective 2 says the footer's continuation hint must follow the rows actually shown. Once the final page reaches total, it must not advertise another page; an out-of-range offset may retain its separate diagnostic.

Observed: the revised Page size section changes format_truncation_notice to compute next = offset + shown, but it leaves the callers' `shown < total` guard unaddressed (src/retrieve.rs:916-922 and :1374-1379; src/priority/render.rs:289-295). That condition remains true on a partial final page because shown is a page count, not a cumulative position. A live `doctrine memory search --limit 20 --offset 20` against 32 rows shows 12 rows and emits a footer. Under the revised aligned-offset formula, next = 32 and the hint is `--page 2`, the very page just shown. With `--offset 27 --limit 20`, it would hint `--offset 32`, which is empty. The current footer already mishandles this tail; the revision introduces the same-page advice while claiming aligned output is byte-identical.

Specify that the footer is suppressed when offset < total and offset + shown >= total, while preserving the existing out-of-range-offset diagnostic. Add aligned and unaligned final-partial-page cases to the footer verification table, and check all three callers.
"""
disposition = "fix-now"
response = "Unchanged from the prior answered response: fixed in design.md (see sec-2/sec-7); raiser-verified 2026-09-29. Route added: review."
route = "review"

