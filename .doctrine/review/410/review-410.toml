[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Exact-key zero-overlap fixture is impossible with the real ranker"
detail = """
The verification plan requires an "exact-key query with zero lexical overlap" to prove the `exact_key` side of the floor (.doctrine/slice/275/design.md:171-174). `exact_key_match` requires the normalized query to equal the memory key (src/retrieve.rs:289-297), while `lex_doc` always includes that same key in the BM25 document text (src/retrieve.rs:270-285); the query and document use the same tokenizer (src/lexical.rs:20-25,220-223,250-265). Therefore an exact-key hit cannot have zero token overlap in a real `query()`/BM25 fixture. A fixture that tries to create one will either cease to be an exact-key hit or have lexical overlap, so it will not prove that `Candidate::has_evidence` keeps an exact-key hit whose quantized lexical score is zero. Use a controlled LexicalRanker returning zero for that candidate, or test the pure evidence predicate directly, and keep a separate real-BM25 exact-key integration case.
"""
disposition = "fix-now"
response = "Correct: lex_doc indexes the key, so a real exact-key hit always overlaps lexically. sec-7 unit-tests Candidate::has_evidence directly, and the BM25 integration case asserts only that an exact-key query ranks its memory first."

