[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "No-match notice needs an all-held-back verification case"
detail = """
The design conditions the new retrieve-table notice on a post-floor zero count (.doctrine/slice/275/design.md:96-103) but its VT checks only a query with no matches (:171-179). In `run_retrieve`, the local `total` is computed AFTER the trust holdback (src/retrieve.rs:1321-1331), whereas the pre-holdback `ranked` set holds the actual lexical evidence. A query matching only a low-trust high-severity memory is a concrete distinct state: the memory has evidence, but `held_back` removes it (src/retrieve.rs:951-965), leaving `total == 0`. If the new notice tests that existing `total`, it falsely says `no match` instead of respecting the holdback distinction; the MCP retrieve path also calls this table renderer (src/mcp_server/tools.rs:967-990). Specify and verify the no-notice outcome for all-held-back evidence using `ranked.is_empty()` or an equivalent pre-holdback count, while preserving REQ-152's holdback.
"""
disposition = "fix-now"
response = "sec-4: the notice keys on the floor leaving no candidates (ranked.is_empty() from query(), before holdback). Evidence that is all held back keeps today's output with no notice. sec-7 adds that case."

