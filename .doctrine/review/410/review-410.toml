[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Footer repeats results after a nonaligned --offset"
detail = """
Expected: SL-275 objective 2 requires the footer's continuation hint to advance from the rows actually shown. The design only changes the argument passed to `format_truncation_notice` to the resolved limit (.doctrine/slice/275/design.md:36-39), leaving its `next_page = (offset / page_size) + 2` calculation and unconditional `--page` advice intact (src/listing.rs:926-945). `--offset` accepts any usize (src/memory.rs:94-100). Concrete case: `memory search --offset 5 --limit 20` shows ranked rows 6-25 and says `use --page 2`; page 2 starts at row 21, repeating five rows. I verified five overlapping UIDs between those two live CLI requests. Resolving the page size once does not repair this continuation; for an unaligned offset the hint must advance to `offset + shown` (or otherwise identify the actual next position), with a verification case for it.
"""
disposition = "fix-now"
response = "Unchanged from the prior answered response: fixed in design.md (see sec-2/sec-7); raiser-verified 2026-09-29. Route added: review."
route = "review"

[[finding.turn]]
