[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Shared page helper leaves a gap when retrieve caps --limit"
detail = """
The design extracts the Search/Retrieve page calculation into `page_offset(page, offset, page_size)` (.doctrine/slice/275/design.md:47-50) while preserving retrieve's 20-row cap (:52-53), but never requires the retrieve call to use its capped `retrieve_limit` as `page_size`. Today the Retrieve arm calculates `retrieve_limit = min(requested, 20)` (src/memory.rs:652-655), yet computes `--page` offset from the uncapped request (src/memory.rs:656-663); `run_retrieve` uses only 20 rows (src/retrieve.rs:1310,1331). Concrete case: `memory retrieve --limit 30 --page 1` returns 20 rows, then page 2 starts at offset 30, permanently skipping ranked rows 21-30. A live comparison of `--limit 30 --page 2` with `--limit 20 --page 2` confirmed the former starts ten rows later. Merely extracting the existing arithmetic preserves the defect and makes the footer's page-size contract false. Specify that the helper receives the capped retrieve limit and pin page 2 with an explicit limit above RETRIEVE_LIMIT_MAX.
"""
disposition = "fix-now"
response = "Unchanged from the prior answered response: fixed in design.md (see sec-2/sec-7); raiser-verified 2026-09-29. Route added: review."
route = "review"

