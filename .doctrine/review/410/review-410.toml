[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Valid, and introduced by the F-1 revision: the aligned branch computed next/page_size+1 even when next >= total. sec-2 now emits '{shown} of {total}; end of results' with no hint when offset+shown >= total; the continuation branches apply only when rows remain. sec-7 pins the 32-row, offset-20, limit-20 case."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Accepted: the formatter handles offset >= total first, then offset + shown >= total as end of results. The callers invoke it on partial final pages; aligned and unaligned tails therefore have no continuation hint. Empty sets suppress the footer."

