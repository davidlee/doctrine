status = "verified"
severity = "minor"
title = "Open reconciliation obligations from design sec 7 / D12 (documentary, non-blocking)"
detail = "Per design: RFC-020 Phase 0/1 rows move to delivered-by-SL-220 at reconciliation (RFC stays open for Phases 2-3); additive/documentary spec work remains owed - full claim-schema retention REQs (SPEC-020) and PRD-011/SPEC-001 descent prose - none of it may contradict the amended normative text. Routed to the reconciliation brief (governance/spec surface)."
