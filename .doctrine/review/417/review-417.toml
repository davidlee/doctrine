[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected client-resolvable MCP descriptions; observed private SL-278 and DEC citations"
detail = '''
Expected: Newly shipped review tool descriptions use client-resolvable wording and no Doctrine-repo-specific entity or decision ids, as required by the audit brief's ADR-024 binary-text line of attack.
Observed: src/mcp_server/tools.rs:92 embeds `design SL-278 sec-2` in review_show_description; :116 embeds `SL-278 DEC-370` in review_findings_description; :183 and :221 embed `DEC-365` in the review_list/review_findings facet schema descriptions. These strings are returned to clients by MCP tools/list. A client repo can resolve SL-278 or DEC-370 to unrelated local records, so the guidance silently points to the wrong authority. The new tests/e2e_subcommand_help.rs:94-118 checks only CLI help for `DEC-` and cannot catch these MCP strings. Reproduce by inspecting tools/list from the built server or `rg -n 'design SL-278|SL-278 DEC-370|facet \(DEC-365\)' src/mcp_server/tools.rs`. Remove the private citations from emitted descriptions and cover the MCP tool list.
'''
disposition = "fix-now"
response = """
Fixed in the audit. Removed `design SL-278 sec-2`, `SL-278 DEC-370` and both `(DEC-365)` from the emitted review_show / review_findings / review_list facet text. The same ADR-024 class pre-existed in tool text (SL-024 examples on review_new/review_list/review_findings; SL-231 on observation_record; SL-199/SL-206/SL-228 provenance tags on nine dispatch tools) — removed too, so the new guard starts clean. New guard: `mcp_server::tools::tests::tool_text_cites_no_repo_private_id` scans every tool's description + input schema for authority/provenance kinds (SL, DEC, RFC, ADR, REQ, PRD, SPEC, POL, STD, IMP, ISS, CHR, RSK, IDE, ASM, REV) and was red on the residue before the edits. Input-format illustrations (`RV-007 or the bare id 7`, `PHASE-03`, `^RV-012$`) cite nothing and stay legal. mcp_server unit tests 104/104, e2e_mcp_server 43/43.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Fixed in the audit. Removed `design SL-278 sec-2`, `SL-278 DEC-370` and both `(DEC-365)` from the emitted review_show / review_findings / review_list facet text. The same ADR-024 class pre-existed in tool text (SL-024 examples on review_new/review_list/review_findings; SL-231 on observation_record; SL-199/SL-206/SL-228 provenance tags on nine dispatch tools) — removed too, so the new guard starts clean. New guard: `mcp_server::tools::tests::tool_text_cites_no_repo_private_id` scans every tool's description + input schema for authority/provenance kinds (SL, DEC, RFC, ADR, REQ, PRD, SPEC, POL, STD, IMP, ISS, CHR, RSK, IDE, ASM, REV) and was red on the residue before the edits. Input-format illustrations (`RV-007 or the bare id 7`, `PHASE-03`, `^RV-012$`) cite nothing and stay legal. mcp_server unit tests 104/104, e2e_mcp_server 43/43.
