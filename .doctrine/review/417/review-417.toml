[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Expected regenerated skill mirrors; observed installed plan skill still teaches removed JSON paths"
detail = """
Expected: SL-278 PHASE-05/EX-2 requires the installed `.agents/skills/plan/SKILL.md` mirror to teach the new read surface and says mirrors are regenerated by `doctrine install` after master edits. PHASE-05/EX-4 requires no shipped guidance to cite `review.finding` or `show --json` as the way to read detail.
Observed: plugins/doctrine/skills/plan/SKILL.md:45-47 was corrected to route through `lib:reference/review-ledger.md`, but .agents/skills/plan/SKILL.md:45-48 still tells the active planning agent to read `.review.finding[].route` and MCP `findings[].route`. The former key was removed; `./target/debug/doctrine review show RV-416 -f F-1 --json` has `review.findings[]`, while bare MCP `review_show` defaults to index depth. `.agents/skills/reconcile/SKILL.md:84-88` also remains the old mirror, though its status instructions still work. `git ls-files .agents/skills/...` returns no tracked paths, confirming these are ignored installed mirrors; `git diff 837fb4c89..HEAD` contains only the edited plugin masters. `doctrine install` was not run because it would rewrite an unrelated uncommitted skills-lock.json. Regenerate the mirrors without overwriting that foreign work, then verify the installed plan text and the EX-4 grep with a positive control.
"""
disposition = "tolerated"
response = """
The authored change is complete: the plugin masters (plugins/doctrine/skills/{plan,reconcile}) carry the new wording (plan corrected again under F-3). The stale text is only in the gitignored `.agents/skills` mirrors. Ran `doctrine install -y -s plan -s reconcile`: it delegates to `npx skills` with source `davidlee/doctrine` on GitHub, so the mirrors regenerate from the PUBLISHED repo and came back unchanged; skills-lock.json byte-identical. The mirrors can only be current after SL-278 lands and is pushed — a publication step, not a code defect. Tolerated until then; close-time action recorded in notes.md: after push, re-run `doctrine install -s plan -s reconcile` and grep `.agents/skills/plan/SKILL.md` for `review.finding`. EX-2's mechanism wording is immutable plan text; the design's source/mirror account goes to reconcile under F-4. Friction recorded (install sources remote, silently).
"""

