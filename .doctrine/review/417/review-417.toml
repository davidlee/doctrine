[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Expected unreadable disclosure tested on CLI and MCP; observed only direct projection checks"
detail = """
Expected: SL-278 design.md:746-748 and PHASE-04/VT-1 in plan.toml require the malformed-review census case to prove disclosure through CLI stderr, CLI JSON and MCP, with readable rows retained.
Observed: src/review/tests.rs:4953-4993 (`census_survives_an_unreadable_review`) calls `run_findings` directly and checks its struct and formatted JSON, but never executes `review::dispatch`/`write_listing`, which is the only code writing `warning: RV-NNN unreadable: <reason>` to stderr (src/review/mod.rs:467-490). tests/e2e_mcp_server.rs:2715-2790 (`review_findings_caps_and_narrows`) exercises MCP caps and filters with only readable ledgers; there is no `review_findings` malformed-sibling assertion. Thus PHASE-04/VT-1 can pass if the CLI silently drops its stderr disclosure or MCP drops the `unreadable` array, despite STD-003's caller-visible requirement. Add a process-level malformed-sibling assertion on these two transport channels; the existing unit test already covers the engine and CLI JSON projection.
"""
disposition = "fix-now"
response = """
Fixed. tests/e2e_review_golden.rs `list_and_findings_disclose_an_unreadable_review_on_stderr_and_json` runs the real binary for `review list` and `review findings` with a malformed RV-002 beside a readable RV-001: asserts the readable row survives, stderr carries `warning: RV-002 unreadable: `, and `--json` carries exactly one row plus `unreadable[0].rv == "RV-002"`. tests/e2e_mcp_server.rs `review_findings_carries_unreadable` does the same over MCP (`FindingsListed.rows` 1, `unreadable[0].rv` RV-002). Both green.
"""

