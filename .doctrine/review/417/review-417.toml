Verified the emitted descriptions and schemas removed the private citations, and the tools unit suite passes (52/52, including tool_text_cites_no_repo_private_id). The guard targets authority/provenance IDs; RV-007, bare 7, PHASE-03 and ^RV-012$ are format illustrations, so leaving them legal is appropriate.
