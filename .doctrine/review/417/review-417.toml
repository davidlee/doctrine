[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected selectors to name authored changes; observed plugin, memory and help edits undeclared"
detail = """
Expected: The SL-278 design-target selector registry names the authored files actually changed, and `slice conformance` reports only delivered targets or an explained exception.
Observed: `./target/debug/doctrine slice conformance SL-278` reports 15 undeclared paths and three undelivered targets. Excluding the seven observation records and the slice metadata row, material undeclared edits are the plugin skill masters, tests/e2e_subcommand_help.rs, and two memory items named by design.md sec-6. The registry at .doctrine/slice/278/slice-278.toml:97-107 instead targets `.agents/skills/{plan,reconcile,audit}/SKILL.md`, which are gitignored installed mirrors (`git ls-files` returns only the plugin masters) and cannot be delivered as committed source deltas. The authored design.md sec-6 and sec-7 also describe `.agents` as the edit surface and `plugins` as regenerated copies, the reverse of the observed master/mirror relationship. The audit wording was checked: .agents/skills/audit/SKILL.md has no `review show` read instruction to revise, so that selector can be removed or documented as an explicit no-op. Align the registry with the plugin masters, memory items and help test; update the design's source/mirror account. This finding is about the declared change boundary, separate from F-2's stale installed plan mirror.
"""
disposition = "design-wrong"
response = """
Agreed: the design and the selector registry name the gitignored `.agents/skills` mirrors as the edit surface, the reverse of reality (masters live under plugins/doctrine/skills; mirrors are installed from the published repo). Reconcile: `slice selector rm` the three `.agents/skills/*` targets; `slice selector add` plugins/doctrine/skills/{plan,reconcile}/SKILL.md, tests/e2e_subcommand_help.rs, and the two memory items as design-target; design.md sec-6/sec-7 updated as the human mirror. Audit skill: checked, no read instruction to revise — dropped, not added. See Reconciliation Brief.
"""

