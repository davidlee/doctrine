id    = 386
slug  = "design-review-of-sl-264"
title = "design review of SL-264"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-264"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Late-node moves and rewrites escape the claimed human invalidation"
detail = "SL-264 design.md:18,43-50,59-62 and 158-159 say a move or reword must re-face the human, but compare only keys carried by the old act. ContentCoverage in src/design_run/attestation.rs:432-440 can implement that filter only by excluding an added key forever; NodeMaterial stores parent and question on that node, not incoming children, at src/design_run/inquiry.rs:304-311. Concrete path: accept map containing inq-1, add inq-2, re-declare the unchanged blocking set, then re-parent or reword inq-2. The old GraphReviewed and SufficiencyAccepted records never carried inq-2; the new full-union guard clears on the re-declaration; no human act goes stale. VT-4 tests only a covered node, so it passes while this path violates the stated move/reword invariant and DEC-301."
disposition = "correct observation — escalated (needs a DEC-301 ruling)"
response = "Verified at attestation.rs:432-440 and inquiry.rs:304-311: the carried-keys filter cannot see a move or re-word of a node the act did not cover, and NodeMaterial carries no incoming children. This is not fixed by mechanism: a late node's parent change is indistinguishable from its addition without history, so the only coherent reading is that a move re-faces only when the act covered that node. That scopes DEC-301's unqualified consequence that re-parenting a node remains a deliberate re-attestation event. Surfaced to the user rather than narrowed unilaterally."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Unchanged re-declaration lets a late blocking question pass unseen"
detail = "SL-264 design.md:75-91 and 148-151 claims the new condition closes R4 and an unchanged blocking set is free. src/design_run/admission.rs:164-181 validates only that declared IDs exist, not that the set includes each question that should block; src/design_run/gate.rs:1543-1564 checks only IDs in that declared set. src/design_run/tests.rs:2457-2464 already demonstrates re-declaring the same set over a larger map while keeping the confirmation digest. Concrete path: add an open question whose answer could invalidate the design, re-declare the old set unchanged over the larger map, then advance. blocking-set-current becomes current, ConfirmationStale stays absent, blocking-inquiries-dispositioned ignores the new question, and the user is never asked to see it. VT-1 checks only an open DECLARED blocker and therefore cannot detect this R4 failure; the design must either narrow the guarantee or add a guard/visibility mechanism that can enforce it."
disposition = "correct observation — escalated (guarantee scope)"
response = "Verified at admission.rs:164-181 (existence only) and gate.rs:1543-1564 (declared set only): a question added late and judged blocking by the agent can be left out of an otherwise unchanged re-declaration. The new condition restores the re-declaration obligation over the current map; completeness of the set remains the agent's attested judgement and no mechanical check can supply it. Widening the mechanism means re-facing the human on every addition, which DEC-300 rejects. Needs the user's ruling on the guarantee the design claims."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "No-op needs clearing still advances the revision"
detail = "SL-264 design.md:120-124 and 152-154 requires edge-free needs:null to emit no rows and invent no revision. In src/design_run/run.rs:347-349 apply unconditionally increments revision before declarations; src/design_run/run.rs:1440-1463 emits no NeedsRemoved when the existing set is empty; src/design_run/run.rs:544-565 nevertheless records a receipt and returns the incremented snapshot. src/commands/design.rs:2146-2173 persists that snapshot on the ordinary apply path. Thus wiring Null to the existing clearing arm yields a successful zero-row apply with revision N+1; VT-2 as written requires an additional no-effect rule outside the stated needs wiring."
disposition = "accepted — fixed in sec-4"
response = "sec-4 amended: a clearing is a recorded mutation and advances the revision (REQ-429/REQ-430); a no-op claims no change rows, not a frozen revision. run.rs:347-349 increments unconditionally before any declaration is read, which is the compare-and-swap invariant, so no additional rule is needed and the design no longer claims one."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Attested growth guard contradicts the accepted derived decision"
detail = "DEC-300 via doctrine knowledge show chooses a derived cumulative growth condition, while SL-264 design.md:79-100 explicitly specifies blocking-set-current as Attested([BlockingSetDeclared(Agent)]) and calls the kind change a wording refinement. This is a formal distinction: src/design_run/gate.rs:301-317 maps Engine to derived and Attested to attested, and install/design-run-stages.md:42-47 publishes different discharge semantics. The draft is lower authority than accepted DEC-300; either the decision needs an explicit amendment or the design must implement a derived condition. Calling both derived over state under DEC-120 does not erase the published kind axis."
disposition = "correct — escalated (contradicts accepted DEC-300)"
response = "Verified: DEC-300 chooses a derived growth condition; the design specifies Attested([BlockingSetDeclared(Agent)]) and calls the kind change a wording refinement. gate.rs:301-317 maps Engine to derived and Attested to attested, and install/design-run-stages.md publishes different discharge semantics, so the kind axis is formal, not verbal. The design is lower authority than the accepted decision. Either DEC-300 is amended explicitly or the design implements the derived form; surfaced to the user."

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "New condition has no specified contract prose or delta display"
detail = "SL-264 design.md:90-93 says a changed blocking set re-shows exactly what changed, yet its code-impact list at :129-143 adds only the generated stage-table mirror, not the mandatory condition narrative asset. SPEC-029 requires one narrative per condition; src/design_run/prompt.rs:264-280 derives a design-prompts/conditions/<token>.md key per condition and src/commands/design.rs:4793-4820 tests that every key has an asset. The current initial-concerns guidance at install/design-prompts/conditions/initial-concerns-recorded.md:18-22 is where the map/tree and blocking marks are shown; splitting the agent obligation into blocking-set-current needs its own instructions. In code, ConfirmationStale at src/design_run/gate.rs:1164-1169 carries only act/declaration kinds, and NodeCreated at src/design_run/run.rs:1358-1382 omits question text, so neither existing cause nor row delivers the claimed exact delta. A changed set can require assent without showing the changed question unless the design specifies that projection."
disposition = "accepted — fixed in sec-5"
response = "sec-5 now adds install/design-prompts/conditions/blocking-set-current.md to the code impact and the design-target selectors, and states that prompt.rs per-condition key derivation plus the every-key-has-an-asset test make the narrative compelled. The delta-display obligation lands in that narrative: re-declaring a changed set shows the added or changed blocking questions with their text, as initial-concerns-recorded shows the map."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Full blocking-membership comparison contradicts sufficiency survival"
detail = "SL-264 design.md:47-54 applies the full-set blocking-membership comparison to both InquiryMap-bound attested rows; gate.rs:585-605 and :620-634 show both initial-concerns-recorded and user-accepts-sufficiency use InquiryMap with cumulative reach. Adding inq-2 with blocking:true after both acts changes the full true-id set, so both acts stale. Yet design.md:181-185 VT-1 requires an added node after sufficiency to leave user-accepts-sufficiency current. The specified shared comparison cannot satisfy VT-1 for that concrete addition; the human sufficiency gate re-faces on the growth the slice is meant to exempt."
disposition = "accepted — fixed in sec-2, sec-6"
response = "Verified: gate.rs:602 and :629 bind both rows to Coverage::InquiryMap, so one comparison cannot both stale concerns and spare sufficiency on a blocking addition. sec-2 splits coverage by rule: user-accepts-sufficiency keeps InquiryMap (material over carried keys); initial-concerns-recorded takes a new Coverage::ReviewedGraph (that plus full-set effective blocking membership). Stored shape is unchanged (CoveredSet::Nodes for both). Rationale: the cumulative concerns row already re-faces the user at every edge sufficiency guards, and blocking-inquiries-dispositioned holds the edge until the question is answered. A flip on a covered node still stales both, stated. VT-1 now asserts sufficiency survives both a blocking and a non-blocking addition."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "Retiring the stored blocking-set variant makes existing runs unreadable"
detail = "SL-264 design.md:113-120 retires AgentAct::BlockingSetDeclared and says a legacy snapshot reads that stored act. src/design_run/attestation.rs:671-683 derives Deserialize on AgentAct and defines BlockingSetDeclared as its variant; src/commands/design.rs:485-488 parses the whole snapshot through snapshot::parse. Inspection of .doctrine/state/slice/*/design.toml finds the blocking-set-declared variant in 20 of 22 live snapshots, including .doctrine/state/slice/264/design.toml. Removing the variant from the serde enum means parse fails before blocking_inquiries_open can execute the promised fallback. Cause::ConfirmationStale is error-only per gate.rs:1125-1126 and is not this risk."
disposition = "accepted — fixed in sec-3, sec-6"
response = "Verified: attestation.rs:671-683 derives Deserialize on AgentAct; 21 of 22 stored snapshots carry the act. sec-3 now retires the act from writing only: the key leaves the parser and payload contract, while AgentAct::BlockingSetDeclared and ActKind::BlockingSetDeclared stay as legacy read-only variants. Self-attack found a sibling: reading only ReviewedGraph would turn a stored graph-reviewed that was already ConfirmationStale current, so the confirms digest remains a carried-driven, frozen read and Cause::ConfirmationStale stays to report it. VT-6 pins the parse with a negative control (variant deleted => parse fails)."

[[finding]]
id = "F-8"
status = "verified"
severity = "blocker"
title = "First new judgement drops unresolved legacy blockers"
detail = "SL-264 design.md:118-121 says fallback reads the stored BlockingSetDeclared act only when no node carries a blocking judgement, and exits that regime on the first judged node. .doctrine/state/slice/252/design.toml has no node-level blocking fields and its stored set names open inq-5 and inq-11. Declare a new node blocking:false (or re-declare any existing node blocking:false): the fallback turns off, while those two legacy nodes remain without a judgement. The proposed gate.rs blocking_inquiries_open filter in design.md:93-96 now omits them and can report satisfied despite two unresolved blockers. VT-5 at design.md:194-196 tests only the all-legacy fallback and cannot catch the mixed regime."
disposition = "accepted — fixed in sec-3, sec-6"
response = "Verified against SL-252's snapshot shape. The fallback is now per node: effective judgement = the node's own Some(bool), else membership in the stored legacy set. A legacy node leaves the fallback only by being judged itself, so a partly-judged run keeps every unjudged legacy blocker. blocking_inquiries_open and ReviewedGraph read the same effective set. VT-6 tests the mixed regime explicitly (judge another node false; legacy blockers still open)."

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "Node blocking key has two incompatible declaration homes"
detail = "SL-264 design.md:84-90 requires Sparse<bool> blocking on inquiry creation and update. src/design_run/submission.rs:168-171,521-524 already uses the same Declaration.blocking key as Option<bool> for findings, defaulting absent to false; submission.rs:720-724 assigns KEY_BLOCKING only to IdKind::Finding at SubjectState::Absent, and :766-778 rejects the key at any other kind. src/design_run/payload_contract.rs:1398-1402 and doctrine design contract render it optional. The design code-impact row at design.md:165 only says submission changes because an act retires and does not specify the dual-home/state contract. As written, an inquiry with blocking:true is refused, while making the single row Inquiry would reject or stop guarding finding declarations; the sparse-on-update and finding-create semantics need an explicit shared-key rule."
disposition = "contest accepted — fixed in sec-3, sec-5, sec-6"
response = "Both points verified: payload_contract.rs:1398-1402 has one unqualified KeyContract row, and submission.rs:168-171 parses blocking as Option<bool>, which folds null into omission. sec-3 now makes the wire field Sparse<bool> so absence and null survive parsing (finding home reads Null as absence, unchanged, ISS-482), and KeyContract gains the home it applies at so blocking renders once per home. VT-5 now runs through the JSON payload path and checks the contract render."

[[finding]]
id = "F-10"
status = "verified"
severity = "major"
title = "Imported question seeding bypasses required blocking judgement"
detail = "SL-264 design.md:84-85 requires blocking on node creation and refuses omission, but design.md:161-176 limits creation handling to declare_node and does not assign a judgement to import. src/design_run/run.rs:1058-1101 creates shaping-question and imported-prose nodes with InquiryNode::open and seed_node, and :1133-1137 inserts them directly, bypassing declare_node at :1395-1405. A design start --from-design with an open question therefore creates a node without the required field, or a blanket constructor requirement breaks import. The design neither specifies the import judgement nor a separate compatibility rule, and VT-5 at :194-196 exercises only declaration creation."
disposition = "accepted — fixed in sec-3, sec-6"
response = "Verified: run.rs:1058-1101 seeds shaping and imported-prose questions via InquiryNode::open/seed_node, bypassing declare_node. sec-3: import seeds blocking true (omission defaults to visible; import precedes every user act so it costs nothing), and InquiryNode's constructors take the judgement as a parameter so no creation path can omit it by construction. VT-7 pins it."

[[finding]]
id = "F-11"
status = "verified"
severity = "major"
title = "Slice scope and verification still describe the retired set-act design"
detail = "SL-264 slice-264.md:72-86 still says seventeen live snapshots keep their receipts and lists only the older affected surfaces, omitting attestation.rs, admission.rs, change_log.rs, payload_contract.rs and the condition narrative that design.md:161-176 now changes. slice-264.md:183-187 VT-1 still quantifies over DECLARED blocking nodes, while design.md:93-105 removes the declaration and design.md:181-196 adds VT-4/VT-5 absent from slice closure intent. Following the slice-level acceptance text can pass a declared-set test without checking node attributes, legacy fallback, or the new key, so it does not verify the expanded objective."
disposition = "contest accepted — fixed in slice-264.md"
response = "Verified at slice-264.md:156-158 and :184-190. The first-pass bullet is corrected in place (the act can no longer be written; its variants and ConfirmationStale stay as a legacy read-only class) and the R4 entry is labelled historical, closed by the derived node judgements. Swept for siblings: OQ-1's condition count corrected under F-18; a third-pass note records F-15..F-18."

[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "Decision amendment remains internally unsettled"
detail = "doctrine knowledge show DEC-302 reports status proposed although its facet says decided_by user and SL-264 design.md:123-126 cites it as the decision amending accepted DEC-300. DEC-300 record-300.toml:15 appends an amendment dropping the ninth condition, but its still-active consequences at :18 require a ninth condition and regenerated table. doctrine knowledge show DEC-301 remains accepted and unqualified that re-parenting a node is a deliberate re-attestation event, while design.md:14-19 exempts a moved uncovered node. These accepted/proposed records give conflicting instructions for the same implementation; the design-only scope cannot settle the conflict."
disposition = "contest accepted — decision prose aligned"
response = "Verified: record-300.md and record-301.md summary prose still stated the pre-amendment positions. Both bodies rewritten to match the accepted, user-assented amendments; DEC-300's amended choice and consequences no longer say ninth condition; DEC-302's choice updated for F-15..F-18. Swept DEC-300/301/302 for 'ninth': none remain."

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "Change log still invalidates acts that the gate keeps current"
detail = "SL-264 design.md:47-54 and :103-105 says a non-blocking added node leaves graph-reviewed current. src/design_run/run.rs:1988-2008 computes live_acts for change rows through CoveredSet::moved; src/design_run/attestation.rs:555-563 implements that by ContentCoverage::diff, whose union-key walk at :432-440 reports every added node. run.rs:2059-2071 then emits ActInvalidated for graph-reviewed and sufficiency-accepted on the non-blocking addition, even if gate.rs coverage_moved is narrowed as design.md:164 specifies. The run reports that a human act died while its cumulative gate still accepts it; design.md:162 and :166 do not assign the live_acts read to the new predicate."
disposition = "accepted — fixed in sec-2, sec-5, sec-6"
response = "Verified: run.rs:1988-2008 live_acts reads CoveredSet::moved, whose Nodes arm is the union-key diff (attestation.rs:432-440). sec-2 moves the narrowing into the shared predicate: CoveredSet::moved takes the Coverage the act's rule names, so live_acts and coverage_moved cannot disagree; the union-key diff stays for the whole-map is_current users. VT-1 asserts ActInvalidated rows match the gate's verdict, including none for a non-blocking addition."

[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "Single-act concerns rule contradicts accepted DEC-121"
detail = "doctrine knowledge show DEC-121 is accepted and its record-121.md:44-47 explicitly says initial concerns are two acts, the user reviewing the graph and the agent declaring which questions are settleable without asking. SL-264 design.md:98-101 changes initial-concerns-recorded to Attested([GraphReviewed(User)]) and retires the agent act; design.md:123-126 amends DEC-300 but leaves DEC-121 untouched. The proposed condition therefore implements one act where an accepted decision requires two. Node attributes may carry the same judgement, but the decision's two-actor act requirement is not amended or reconciled."
disposition = "accepted — design reconciled; DEC-121 amendment awaits the user's assent"
response = "Verified: DEC-121 says initial concerns are two acts. sec-3 now states the departure: both actors' judgements remain (the agent's per node at creation/redeclaration, the user's graph-reviewed binding it via ReviewedGraph), but the agent's half is node state, so the rule is one act. DEC-121's two-act rationale (a refusal can name the missing half) is met by refusing an unjudged node at declaration. DEC-121 and DEC-126's table row are to be amended explicitly, pending the user's assent."

[[finding]]
id = "F-15"
status = "verified"
severity = "blocker"
title = "Resolved blockers make ReviewedGraph stale and can revive an unseen addition"
detail = "SL-264 design.md:142-148 says ReviewedGraph compares the same effective set as blocking_inquiries_open: blocking nodes whose lifecycle is not Resolved. src/design_run/gate.rs:1536-1559 removes a node from that set on resolution, while src/design_run/inquiry.rs:302-311,347-352 deliberately excludes lifecycle from NodeMaterial. Concrete path: a covered blocking inquiry is resolved without changing its question or judgement; the open-only set loses its id, so ReviewedGraph stales initial-concerns-recorded on ordinary progress. Conversely, add a new blocking node after graph-reviewed, then resolve it before the next advance: the open-only set returns to its old value, the old act revives and the new question passes without the promised human review. VT-1 checks the immediate post-add state, not this reversal. Coverage must distinguish all-node blocking marks from open blocking dispositions."
disposition = "accepted — fixed in sec-2, sec-3, sec-6"
response = "Verified: gate.rs:1536-1559 drops a node from the open set on resolution while NodeMaterial excludes lifecycle, so an open-only comparison stales on progress and revives on add-then-resolve. sec-3 now defines two reads over one effective judgement: the marks (any lifecycle), which ReviewedGraph compares, and the open blockers (marks not Resolved), which blocking_inquiries_open returns. VT-1 adds both sequences: resolving a covered blocker leaves the act current; add-then-resolve leaves it stale."

[[finding]]
id = "F-16"
status = "verified"
severity = "blocker"
title = "Legacy blocking-set act remains writable after its rule retires"
detail = "SL-264 design.md:176-182,246-251 and accepted DEC-302 require stored AgentAct::BlockingSetDeclared to parse but refuse new submissions. src/design_run/attestation.rs:671-683 derives Deserialize for that retained variant; src/design_run/contract_check.rs:133-158 passes an enum token absent from the contract to serde; src/design_run/run.rs:584-607 builds any parsed agent declaration, and :785-807 skips admission when gate::requirement_for returns None, then stores it. Removing BlockingSetDeclared from gate.rs:585-605 makes that None path reachable. Concrete path: on an upgraded legacy run submit agent_declaration with blocking-set-declared; serde accepts it, no rule checks it, and record.insert replaces the stored legacy set, changing effective judgements of unjudged nodes despite the claimed read-only boundary. The payload-contract variant pins at payload_contract.rs:2898-2912 and tests.rs:2273-2291 also need an explicit legacy exception rather than silently advertising a writable act."
disposition = "accepted — fixed in sec-3, sec-5, sec-6"
response = "Verified: run.rs:785-807 admit_and_record skips admission when requirement_for returns None and stores the record; the retained variant still deserialises. Class root: the design assumed every ActKind has a rule. sec-3 names legacy act kinds (ActKind::is_legacy), restates every_act_kind_is_named_by_exactly_one_contract_row with that exception, and turns the None arm into Refusal::RetiredAct. VT-6 asserts a submitted blocking-set-declared is refused and the stored set unchanged."

[[finding]]
id = "F-17"
status = "verified"
severity = "major"
title = "Rule-based live_acts lookup has no coverage for stored legacy declarations"
detail = "SL-264 design.md:72-76,176-182,244 says live_acts passes each act's rule Coverage to CoveredSet::moved while the legacy BlockingSetDeclared variant stays stored but has no rule. src/design_run/run.rs:1988-2008 walks every AgentDeclaration, and src/design_run/gate.rs:758-772 returns None for an ActKind absent from the new contract table. The live SL-252 snapshot holds a BlockingSetDeclared alongside DraftingReady. Concrete path: load that snapshot and apply a map edit; live_acts must process the legacy record but the prescribed lookup supplies no Coverage. An unwrap fails; skipping the record loses the change log's recorded-act invalidation. Define the legacy read policy for this reader and pin it."
disposition = "accepted — fixed in sec-3, sec-5, sec-6"
response = "Verified: requirement_for (gate.rs:758-772) returns None for a ruleless kind and live_acts walks every declaration. Same class as F-16. sec-3 states the policy: live_acts excludes legacy kinds explicitly in both before and after sets; nothing reads a legacy act's currency, since the fallback reads its content regardless, so it can neither die nor be reported dead — a stated rule, not a silent skip (STD-003). VT-6 asserts a map edit emits no row for the legacy act."

[[finding]]
id = "F-18"
status = "verified"
severity = "minor"
title = "The claimed condition-row loss conflicts with the generated table"
detail = "SL-264 design.md:319-320 says the condition table loses a row and calls blocking-set-current a ninth condition; slice-264.md:99-101 calls the current table eight. src/design_run/gate.rs:585-634 shows changing InitialConcernsRecorded from two acts to one changes that rule's act list, not the Condition vocabulary. The generated install/design-run-stages.md:49-59 already has nine condition rows, and DEC-126 explicitly classifies nine. Concrete result: regenerating the stage table under this design still yields nine conditions; a row-loss or eight-row verification would fail against the actual contract. Correct the count and distinguish condition rows from act requirements."
disposition = "accepted — fixed in sec-7, slice-264.md"
response = "Verified: the vocabulary at gate.rs:585-634 keeps initial-concerns-recorded as one condition; only its act list shrinks, and the generated table holds nine rows. sec-7 now says the table keeps nine rows and blocking-set-current would have been the tenth; the slice's OQ-1 count is corrected; DEC-300's ninth-condition wording is gone."

# Findings are append-only `[[finding]]` tables, added by `review raise` (PHASE-03).
