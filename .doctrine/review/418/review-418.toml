Accepted; confirmed in src/install.rs write_link (fs::remove_file(&tmp).ok() on the deterministic .tmp-<name> sibling). sec-convergence "Safety boundaries": link staging now creates a unique name (.tmp-<name>.<pid>.<n>) via the exclusive symlink() call, retrying on EEXIST, and never deletes an entry it did not just create. Canon staging keeps clearing its own .tmp-<id> leftover, since canon roots are wholly framework-owned and that clear is gated like any removal. Test: write_link_never_removes_preexisting_staging_named_entry. The held part stands: writes and relinks touch only member paths and re-proven doctrine links.
