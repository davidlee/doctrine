[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Canon and link directory symlinks can redirect prune outside owned trees"
detail = """
Expected: destructive convergence is confined to directories doctrine actually owns. Observed: SL-281 design.md:10-12 and :178-199 classify by declared/lexical paths; :225-228 scans and prunes, with no lstat boundary for the canon root or a harness link directory. If `.doctrine/skills` or `.doctrine` is a symlink to another tree, a scan and recursive prune through that path removes files outside the declared tree. If `.claude/skills` is itself a symlink, scanning/relinking children can mutate the target directory. Current `src/install.rs:1588-1621` checks only the individual destination, and `:1996-2019` follows its canonical parent. A lexical `..` normalizer does not establish physical containment through symlinked ancestors; absolute link values also need a defined anchor and component-safe containment test. The design needs an explicit no-follow boundary or a verified physical-root policy before it can authorize deletion, plus tests for symlinked `.doctrine`, canon roots, link dirs, `..`, and absolute link values.
"""
disposition = "fix-now"
response = """
Accepted. sec-convergence "Safety boundaries" now makes staging uniform: link and canon staging both create a unique name (.tmp-<name>.<pid>.<n>) by exclusive create (symlink() / create_dir, not create_dir_all), retry on EEXIST, write only inside what they just created, and remove only that on failure; the writer no longer clears or reuses any pre-existing staging-named entry. Staging-prefixed entries are never pruned (a crashed leftover is reported as stale staging for the user). Tests: staging_never_reuses_preexisting_entry (user file/dir at a staging name survives relink and canon refresh, including under a symlinked .doctrine), plan_never_prunes_staging_entries_and_reports_them.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Accepted. sec-convergence "Safety boundaries": before planning removals for a root or link dir, the shell lstats every component from the base to that dir; any symlink means writes and relinks only, no removals, reported as 'prune blocked'. Absolute link values count as doctrine's only when component-wise under <base>/<root>; relative values are joined and normalised lexically. Tests: plan_blocks_removals_under_symlinked_dir, plan_treats_absolute_link_under_root_as_doctrine_and_elsewhere_as_foreign, plan_normalises_dotdot_link_values_lexically.
"""

[[finding.turn]]
act = "contest"
role = "raiser"
note = "The lstat guard in SL-281 design.md lines 235-240 blocks only removals and explicitly permits writes and relinks through symlinked ancestors. WriteCanon retains materialise_canonical staged swap, whose src/install.rs lines 2013-2019 remove and replace a canon destination. With a symlinked .doctrine ancestor, that destructive refresh acts outside the declared tree; a symlinked harness link dir likewise redirects relink writes. Re-proving the entry at lines 247-249 does not re-prove its ancestor chain. Define an effective no-follow boundary for all destructive mutations, or a safe physical-root policy, and test redirected writes as well as prune."

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Partly accepted, partly held. Held: writes and relinks may follow a symlinked ancestor. A symlinked .doctrine or .claude is a relocation the user chose (dotfile managers do it routinely), and install follows it today. They touch only a member's own path: WriteCanon replaces <root>/<member> and nothing beside it; Relink replaces an entry already re-proven a doctrine link. Neither enumerates or removes a non-member name. Removing non-members is the one new destructive power, and the guard gates exactly that; refusing all writes under a symlinked ancestor would break working relocated setups for no safety gain. Accepted: the ancestor chain is now re-lstat'ed at removal time (REQ-178 extension), the rationale is stated in sec-convergence "Safety boundaries", and an e2e test plants a non-member beside members under a symlinked .doctrine and asserts it survives while members refresh and 'prune blocked' is reported.
"""

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
The held write/relink rule has a concrete non-member casualty under a symlinked ancestor. Let project/.claude be a symlink to /external/config, with /external/config/skills/code-review a proven doctrine symlink and /external/config/skills/.tmp-code-review an unrelated regular user file. Relink calls the retained write_link path: src/install.rs:1634-1645 computes the .tmp-code-review sibling and unconditionally remove_file's it before staging the link. That deletes a foreign, non-member path even though the destination link was re-proven. SL-281 design.md:248-260 asserts relinks touch only the member's own path and staging names are merely skipped by prune; its symlinked-directory e2e at :502-504 plants no staging-name collision. Specify ownership/collision handling for staging siblings under relocated link dirs, and test this case before claiming redirected relinks cannot damage non-members.
"""

