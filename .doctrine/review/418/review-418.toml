Expected: install preserves all user-authored `.gitignore` lines and either safely repairs or refuses malformed managed markers. Observed: SL-281 design.md:272-275 specifies a `String`-returning splice that replaces between markers or appends only when no markers exist; it does not define one missing end marker, duplicate/nested markers, CRLF, or an existing file without a trailing newline. Selecting the wrong end can delete user rules; appending to an unterminated line can merge the start marker into a pattern, leaving the generated rules ineffective. Current `src/install.rs:1140-1145` reads linewise and `:1152-1164` appends directly with no newline guard; :280-281 leaves that seam unchanged. A fallible, marker-counted splice and newline/CRLF contract are needed before lock. Named tests at :339-340 only cover well-formed replacement, absent markers, and negation preservation; add malformed and unterminated-file cases.
"""
disposition = "fix-now"
response = """
Accepted. sec-gitignore "Splice": splice_block returns Result; exactly one start then one end marker means replace; none means append, adding a final newline to an unterminated file first; anything else is refused and .gitignore is left untouched with marker counts reported. The block follows the file's line endings (CRLF if the first line has one). ensure_gitignored gains the same final-newline guard. Tests: splice_block_refuses_lone_or_duplicate_markers, splice_block_adds_newline_to_unterminated_file, splice_block_keeps_crlf, ensure_gitignored_adds_newline_before_append.
