[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "E8 write-class regression test for estimate pin never authored — expected estimate mirror of value_pin_is_orchestrator, observed none"
detail = 'Design E8 / §4: "main.rs write-class tests extend (estimate pin verbs join the refused class; estimate_is_write stays true)"; PHASE-06 EX-2 requires "§8.7 verb suite green incl. write-class regression". The guard.rs classification landed (Estimate Pin → Orchestrator("estimate pin") / Pin(retire) → Orchestrator("estimate pin --retire"), src/commands/guard.rs:382-389) but no test anywhere asserts it: src/main.rs is unmodified on the candidate (value_pin_is_orchestrator exists at main.rs:786; no estimate mirror), tests/e2e_worker_guard.rs has zero estimate coverage. This is also the sole cause of the undelivered `src/main.rs` conformance cell. A regression re-classifying estimate pin as plain Write("estimate") would silently re-admit worker pins (D13 gate) with no failing test.'
disposition = "fix-now"
response = """Repaired during audit on the candidate branch: estimate_pin_is_orchestrator added to src/main.rs write_class_tests mirroring value_pin_is_orchestrator — asserts Orchestrator("estimate pin") and Orchestrator("estimate pin --retire"). Commit 3c456029e on candidate/222/review-001 (branch ref advanced from bafaa3a88); test green, all 56 write-class tests green. Registry note: the repair commit sits on the candidate lineage, outside any phase's recorded delta, so the `src/main.rs` undelivered cell persists in conformance until integration lands the edit — recorded honestly here rather than force-fitted into a phase range."""

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "PHASE-05 recorded delta misses the REV-026 approve/apply commits — .doctrine/adr/015/** reports undelivered though the edit shipped"
detail = 'Conformance reports design-target `.doctrine/adr/015/**` undelivered, but adr-015.md changed on the impl bundle (93 insertions, applied at 9ab197428 "governance(SL-222): apply REV-026"). The PHASE-05 registry row covers the authoring commit (revision/026 files appear in the recorded set) but not the approve (d4c7177b1) and apply (9ab197428) commits, so the registry understates delivery. F-2-backstop class: never read a partial registry as clean. Remedy is the registry verb: `doctrine slice record-delta 222 PHASE-05 --start 4c55eb580^ --end 9ab197428` (governance commits are consecutive on dispatch/222), which flips the cell to conformant.'
disposition = "fix-now"
response = "Re-recorded during audit: `doctrine slice record-delta 222 PHASE-05 --start 4c55eb580^ --end 9ab197428` UPSERTed the PHASE-05 row to span author → approve → apply (the three consecutive governance commits on dispatch/222). Conformance re-run confirms `.doctrine/adr/015/adr-015.md ⟵ .doctrine/adr/015/**` now conformant (undelivered dropped from 3 to 2, both remaining cells owned by F-1/F-3)."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Spurious undelivered: src/priority/config.rs design-target — the planned docs-only edit was already satisfied by SL-220-era text"
detail = """Design §3 code impact listed "src/priority/config.rs (docs only — no new knobs)". No edit landed (conformance: undelivered). Inspection of the candidate shows the demote_agent_evidence doc comment already reads domain-generically ("agent- and migrated-tier resolved claim values leave an item probe-eligible — a number, not an answer; anchored-tier conflict items enter the reprobe queue knob-independently (D14)", config.rs:194-197) — it covers estimate claims without amendment. The selector is a plan-time over-declaration. Load-bearing fix per the brief-surface guardrail: `doctrine slice selector rm SL-222 src/priority/config.rs` (design §3's code-impact line is the prose mirror)."""
disposition = "verified"
response = """Observation confirmed; remediation delegated to /reconcile (per-slice direct edit surface). The authoritative selector registry rides the impl bundle's slice-222.toml (the primary tree's copy lacks the 20 mid-flight selectors), so running `slice selector rm` pre-integration would fork the file and conflict at landing. Brief item: post-integration, `doctrine slice selector rm SL-222 src/priority/config.rs`; design §3 code-impact line ("config.rs docs only") gets the prose-mirror note that the SL-220-era doc text already covered estimate claims."""

[[finding]]
