status = "verified"
severity = "minor"
title = "Orchestrator fixture-conversion files undeclared: tests/e2e_compare_elicit.rs and tests/e2e_priority_golden.rs missing from the design-target registry"
detail = "The a2775657a intervention converted facet-era e2e fixtures to hand-authored anchor rows (e2e_priority_golden: composition + capped tensions; e2e_compare_elicit: stall corpus + frontier pairs; new capture_value_anchor/capture_cost_anchor helpers). The drive declared 20 ripple selectors mid-flight (incl. e2e_compare_estimate.rs, e2e_estimate_non_blocking.rs) but these two files were missed — they remain undeclared under the bundle registry. Remedy: `doctrine slice selector add` for both, matching the PHASE-06/09 declaration pattern."
disposition = "verified"
response = "Observation confirmed; remediation delegated to /reconcile for the same integration-conflict reason as F-3. Brief item: post-integration, `doctrine slice selector add SL-222 tests/e2e_compare_elicit.rs` and `... tests/e2e_priority_golden.rs` with a note matching the a2775657a fixture-conversion intervention; design.md gains no new obligation (the §3 class-b churn clause already covers golden fixtures)."

[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Corpus-wide migration strip and REV-026 artifacts undeclared — selector path-algebra cannot express the strip set"
detail = """~190 undeclared .doctrine/** paths are the PHASE-08 live migration's [estimate] strips (backlog/*, slice/118, slice/151, knowledge/assumption/001) plus its comparison-session output (.doctrine/comparisons/2026-07-18-c5c72cf4-*.toml), plus the PHASE-05 REV-026 artifacts (.doctrine/revision/026*), plus the slice's own evidence/registry files (.doctrine/slice/222/*). All are declared work — design §5 ("scan every [estimate] table under the authored entity dirs; strip removes the table"), §7 (the REV), and the plan's evidence cadence — but no design-target selector can express "every entity TOML carrying an [estimate] key" without making conformance vacuous (a .doctrine/** selector would swallow the signal). Census bounds the set: 185 facets = 185 imported + 0 + 0, verified per-file."""
disposition = "tolerated"
response = 'Accepted drift with rationale: the conformance selector algebra is path-shaped and cannot express "every entity TOML carrying an [estimate] key" — the strip set is data-dependent, corpus-wide, and bounded instead by the migration census (185 facets = 185 imported + 0 already + 0 re-imported, per-file strip verification, idempotent re-scan finds 0). Declaring `.doctrine/**` as a design-target to silence the cells would make the undeclared signal vacuous for every future slice — worse than the drift. The REV-026 artifacts and slice-222 evidence files are likewise inherent side-outputs of the governed process, not scope creep. SL-220 set the precedent (same strip pattern, value domain).'

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "PHASE-09 laundered-stub seams and flip invariants — cold re-verification of the orchestrator interventions"
detail = "The drive record flags three worker-laundered stubs repaired at a2775657a and asks audit to re-check the seams cold. Verified on the candidate: (1) has_nonterminal_interval re-sourced over estimate_claims anchored interval rows (surface.rs:1469, consumed :1515); (2) bare anchor one-site — CostCtx.absent fed from Pipeline.bare_anchor (graph.rs:609-616, pinned by est_cost_ladder_r6_bare_anchor and est_cost_ladder_projected_may_exceed_bare_anchor); (3) item_costing.bare_estimate re-keyed to the Pin/Human anchored map (elicit.rs:645,1104-1126). Also verified: E6 ladder order literal in graph.rs::est_cost (r1 anchored → r2 feed → r3/r4 priors → r5 deleted → r6 ctx.absent) with per-rung tests; E5 anti-laundering property test anchor_map_never_launders_agent_or_migrated_claims (claims.rs:853, exhaustive 16^3 tier mask); scan-seam key-presence tripwire parse-free with remedy text (scan.rs:272-309, malformed-residue test). Full suite + doctrine check gate green on the candidate (exit 0 both)."
disposition = "aligned"
response = "Observed behaviour matches the design at every probed seam: E6 ladder order literal with per-rung tests, E5 anti-laundering exhaustively property-tested, E7/F-4 one-site bare anchor pinned, all three laundered-stub repairs (a2775657a) verified against the design's stated re-sources, tripwire parse-free with remedy text. Suite + gate green on the candidate incl. the audit repair commit. No change needed; the orchestrator's intervention record was accurate."

