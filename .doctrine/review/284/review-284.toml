[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Spec/governance reconciliation obligations left open by design §7/§8.11 — RFC-020 row, E1/E5 recording, spec-014 prose, design §5 inventory mirror"
detail = """Confirmed open after inspection: (1) RFC-020's Phase 2 row must move to delivered-by-SL-222 with the E1 payload deviation ({lower,upper} only — no skew/unit/confidence columns) and the E5 records-anchor delta recorded (design §8.11 VA, deferred to reconciliation by design); the observed null re-rank (F-9) belongs in that record. (2) spec-014 PRD prose still mentions authored [estimate] tables (notes residue — prose, not parse; contradicts the post-deletion corpus). (3) PRD-014/SPEC-020 claim-schema retention REQs and PRD-011/SPEC-001 descent prose were named "reconciliation obligations, non-contradicting" in design §7. (4) design.md §5's F-5 deletion inventory and §2-§3 code-impact lists undercount the shipped blast radius — the 20 mid-flight ripple selectors (doctor/knowledge/map/reconcile/relation/estimate-display/comparison-initializer/verb surfaces) need the prose mirror updated so canon matches the registry. SPEC-020's REQ-269..277+310 disposition map itself is already applied (spec-020.md carries the claims-era payload wording — verified on candidate)."""
disposition = "verified"
response = "Observation confirmed; all four items are reconcile write-surface work, mapped in this review's ## Reconciliation Brief: (1) RFC-020 Phase-2 row → delivered-by-SL-222 + E1 deviation + E5 delta + F-9 null-re-rank recording; (2) spec-014 PRD [estimate] prose amendment; (3) PRD-014/SPEC-020 retention REQs + PRD-011/SPEC-001 descent prose check; (4) design.md §2/§3/§5 code-impact/inventory prose mirrors of the 20 ripple selectors. Audit makes no spec/governance edits (anti-escape: none of these route to follow-up)."

[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "R1 evidence shows a null re-rank — all four snapshots byte-identical, vs design §3's expectation of a flip-wide deliberate re-rank"
detail = """phase1-preflip, phase6-postflip, phase8-postmigration and phase9-final are the same blob (4c9f2f80, 246 rows). Design §3 class (b) predicted "corpora with facets re-rank deliberately … wider than Phase 1's by the divisor position". Credibility verified two ways: the journal captured each snapshot at its phase boundary with a rank-neutral diff claim, and a fresh snapshot run on the audited candidate reproduces the evidence exactly modulo post-capture corpus drift (new REQ-337..352/SPEC-024/025/PRD-016/IMP-295/296 entities; identical scores on the overlap). The null is genuine and explainable: est_cost is source-stable across the flip (rung 1 facet, rung 5 facet, and rung 4 migrated claim all collapse the same bounds through the same operative formula), and the live corpus carried zero est-domain pairwise judgements, so no projection anchoring existed to lose (the E5 anchored-classes-dissolve consequence had an empty extension). Expected-evidence framing in the design was a prediction, not a contract; the RFC-020 recording (F-8) should state the null result explicitly."""
disposition = "aligned"
response = """The null re-rank is correct behaviour, verified two ways (journal-boundary capture + fresh reproduction on the audited candidate). Design §3's "wider re-rank" was a prediction about corpora with facet-anchored projections; this corpus had none (zero est-domain pairwise judgements), and the ladder's operative-cost collapse is source-stable by construction — the null is the flip working as designed on a projection-free corpus, and the byte-identical snapshots are stronger class-(a)/(c) evidence than a re-rank would have been. No change needed; the RFC-020 recording of the result rides F-8's brief item."""

