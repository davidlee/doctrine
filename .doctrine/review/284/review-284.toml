detail = 'Notes.md "Deferred / known residue", confirmed present on the candidate: (a) render.rs CostUnmigratedFacet => (0.0, 0.0) and ValueUnmigratedFacet => (0.0, MARKER) arms are unreachable-by-construction — the parse-free tripwire mints no magnitude; (b) NF-001 facet-substring allowlist entries were refreshed but no minimality pass was run; (c) estimate.rs/value.rs retain deserialize_lenient solely for serde round-trip on doc structs. None affects behaviour (suite + gate green); all are cleanup owed to the claims-era shape. Durable follow-up work, not audit-scope fixes.'
disposition = "follow-up"
