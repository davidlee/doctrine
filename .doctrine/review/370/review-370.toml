[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "`slice design show` violates the governed two-level CLI grammar"
detail = "Observation: SL-246 §3.1 lines 291-305 acknowledges that SPEC-013 defines a two-level subcommand tree, then declares the proposed three-level `doctrine slice design show` surface non-deviating solely because `slice selector` is an existing precedent. SPEC-013 Uniform command grammar and active REQ-197 explicitly require `doctrine <kind> <verb>` for numbered entity kinds. An existing deeper command does not amend or waive that normative contract. The same conflict is carried into §5.2 lines 630-640 and normative DEC-260. This leaves the primary reader surface in direct conflict with active governance, so the design is not implementable as approved. Suggested repair: either site the capability on a conforming two-level verb, or revise SPEC-013 and REQ-197 through the governance path before implementation, explicitly defining the allowed nested-group exception and its conformance tests."
disposition = "dissolved-by-dec-261"
response = """
Observation ACCEPTED; prescription rejected in part; the finding is dissolved rather than carried.

The observation is correct and verified. SPEC-013 § Uniform command grammar states "The surface is a two-level clap subcommand tree", carried by active REQ-197. The design's §3.1 claim that three levels is "not a deviation" was a governance claim the design was not entitled to make: a precedent does not amend a normative clause. That sentence was the defect, not the verb.

Two corrections to the finding's reasoning, neither of which changes its verdict.

First, `slice selector` is not a lone precedent the design leaned on illegitimately. The population of three-level groups under NUMBERED ENTITY KINDS is: `slice selector`, `spec req`, `spec interactions`, `revision change`, `memory sync`, and `knowledge edit <kind>`. SPEC-013's clause is therefore already descriptively false of its own governed surface. That makes the design's §3.1 sentence wrong about entitlement while approximately right about practice, and it means any REV in this area should reconcile the clause against the whole population rather than carve out one verb.

Second, the prescription says to revise SPEC-013 "before implementation". That inverts this project's governance mechanism, which the user has ruled explicitly: a governance move is minted as a Revision AFTER design and applied to the spec during reconcile. It does not gate a design lock.

Both are moot for SL-246. DEC-261 supersedes DEC-260 and re-sites the read at `doctrine design show <SLICE>` — two levels, conformant, no deviation and no REV required. See the disposition on F-6, which is where the substance of this change lives."""

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The claimed dispatch-arm deletion has no acyclic route to the new handler"
detail = "Observation: SL-246 §5.6 lines 753-773 places the new handler in `src/commands/slice_design.rs`, deletes the residual `src/commands/cli.rs` arm, and says the nested command will route through `slice::dispatch`. The current arm at `src/commands/cli.rs:1524-1533` and `run_deprecated_slice_design` at `src/commands/design.rs:2043-2047` both document why `crate::slice` cannot call into `crate::commands`: that reverse edge closes an ADR-001 command-tier cycle. Retiring the materialisation forwarder removes its payload, but it does not create a route from `slice::dispatch` to a handler that the design still places under `commands`. As written, the new handler is either unreachable from the claimed generic arm or requires the same forbidden reverse dependency, so the §5.6 payoff and code-impact plan cannot both be true. Suggested repair: specify an acyclic dispatch seam explicitly, such as top-level routing or injected operations, and retain whatever `cli.rs` wiring that seam needs; alternatively relocate the handler to a layer `slice::dispatch` can legally call and demonstrate the ADR-001 dependency direction."
disposition = "dissolved-by-dec-261"
response = """
Observation ACCEPTED as sound reasoning about the superseded design; the defect is dissolved by re-siting rather than repaired.

Verified against the tree. `src/commands/cli.rs:1531` carries the residual `SliceCommand::Design` arm and `src/slice.rs:459` holds the matching guard whose own comment states the arm is handled by the residual cli.rs dispatch. The finding is right that retiring the deprecated leaf removes the arm's PAYLOAD without creating a route from `slice::dispatch` to a handler the design still placed in `src/commands/slice_design.rs`. §5.6 claimed the deletion as a payoff and did not specify the replacement seam. That was a real gap.

DEC-261 removes the premise. `slice design` is no longer promoted to a group, so there is no nested slice verb needing a route. The handler joins the existing `design` group handlers in `src/commands/design.rs`, which clap already dispatches directly and which is already the home of every other `design` verb. No new dependency edge, no ADR-001 cycle, and nothing to invent.

One part of the finding survives the re-siting and has been kept: `src/commands/cli.rs:1531` and `src/slice.rs:459` still exist, and retiring the deprecated `slice design` leaf still deletes them. §5.6 will now say that plainly as a consequence of the retirement alone, with no claim that a generic arm picks up routing it does not."""

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The unreadable-record guarantee is unreachable for scan-pruned records"
detail = "Observation: SL-246 §3.1 lines 319-328, §5.5 I5/X7, and §9.2 promise that an absent or malformed record is retained by name as an in-place unreadable marker while the block continues. Selection, however, is defined over `InspectView` produced from `scan_entities`. At `src/catalog/scan.rs:179-202`, either a metadata-read failure or an `outbound_for` failure emits a diagnostic and `continue`s, removing that entity from the scanned corpus. For knowledge records, `outbound_for` reaches `knowledge::relation_edges`, whose `read_record` at `src/knowledge.rs:1637-1648` parses and validates the TOML and unconditionally reads the Markdown body. Thus the absent-TOML, malformed-facet, and missing-body cases are pruned before `select_knowledge`; `render_block` cannot name a record it never receives. The §9 fixture and named I5 test therefore cannot exercise the claimed path without a race or fabricated input, and the design does not specify surfacing scan diagnostics on both new table and JSON surfaces. Suggested repair: separate pre-selection scan failures from post-selection record-read failures, specify how each command and format discloses scan diagnostics, and test both paths. If records with valid TOML but missing prose must remain selectable, give relation scanning a TOML-only accessor rather than routing through full `read_record`."
disposition = "accepted-design-changed"
response = """
Observation ACCEPTED — this is the sharpest finding in the set and it survives the re-siting untouched. One factual correction to its framing, which changes the repair.

Verified. `scan_entities` (`src/catalog/scan.rs`) emits a diagnostic and `continue`s on either a `status_and_title_for` failure or an `outbound_for` failure, dropping the entity from the scanned corpus. For a record prefix `outbound_for` routes to `knowledge::relation_edges` → `read_record`, which parses and validates the TOML AND reads the sibling `.md` unconditionally, erroring when it is absent. So three cases — absent `.toml`, malformed `.toml`, absent `.md` — are all pruned before `inspect_from`, never reach `select_knowledge`, and cannot reach `render_block`. `I5`, `X7`, the §9.2 "record whose `.toml` is absent or malformed" fixture and the named case `an_unreadable_record_is_named_and_the_block_continues` are unreachable as specified. Correct.

THE CORRECTION. The finding says the design "does not specify surfacing scan diagnostics on both new table and JSON surfaces", which implies nothing surfaces them. In fact `run_inspect` already writes every scan diagnostic to STDERR before normal output, under a comment naming it D3. So a pruned record is not silently lost at the system level today; it is disclosed on a different stream, in a different format, untied to the knowledge block and absent from the JSON structure.

That matters because it changes what the repair is. The design does not need a disclosure mechanism built — one exists. It needs to stop specifying a SECOND, in-block one that cannot fire. Note also that the finding's own suggested repair — give relation scanning a TOML-only accessor instead of routing through full `read_record` — only rescues the absent-`.md` case; absent and malformed `.toml` still prune, because `outbound_for` still fails. So that repair cannot restore `I5` as written either.

Integration: `I5`, `X7` and the §9.2 fixture row are being rewritten against the reachable population, and the design will state which stream discloses a pruned record and require the new read surface to carry the same stderr diagnostic pass that `run_inspect` performs. The TOML-only accessor stays where the design already put it, on IMP-459, as an efficiency seam and not as this finding's repair."""

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The `full` JSON shape is neither a complete record nor single-source"
detail = "Observation: SL-246 §5.2 lines 642-648 and D1 define every JSON entry as `{ reference, caption, facet | null, marker?, body? }`, while §6 OQ-3 lines 814-825 says `Full` renders a complete record and should delegate to the same render as `knowledge show`. The current complete record projections include identity, kind, slug, title, status, dates, tags, evidence, relationships, facet, and body: see `format_metadata` at `src/knowledge.rs:1793-1831`, `format_show` at 1834-1838, and `show_json` at 1943-1988. The proposed JSON object omits most of those fields. It also cannot satisfy C4 and D1 as described: the only shared field-order mechanism specified is the text-returning `format_facet`, while current `facet_json` at 1991 onward is a separate handwritten per-kind projection. The planned test checks only that JSON and table carry the same record identities, not the same tiered content. Suggested repair: make the full JSON contract explicitly contain the complete knowledge-show payload, and define one ordered structured facet projection from which both text and JSON are rendered. Add parity cases for common metadata and every record kind at both levels, not only record membership."
disposition = "accepted-d1-repaired"
response = "Contest upheld — the finding was right and the earlier disposition overpromised. It undertook to rewrite section 5.2 and `D1`; only 5.2 moved, so `D1` kept specifying the superseded five-key entry while `D5` two paragraphs below specified the twelve-key payload. `D1` is now reduced to the decision it actually is — that the two arms agree, mechanised by a shared `facet_fields` under a shared `EmptyPolicy` — and no longer states an entry shape at all; section 5.2 and `D5` own that. See `F-12`, which is the same defect raised directly, and `F-13`, which is it one layer along on the JSON arm. Revision 42, sec-7."

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "`inspect --transitive --knowledge` has no defined behavior"
detail = "Observation: SL-246 adds `--knowledge` to the existing `inspect` command in §5.2 and `src/commands/inspect.rs`, but never defines its interaction with the already-public `--transitive` mode. The current command scans, then returns from the transitive branch at `src/commands/inspect.rs:98-117` before the one-hop relation and actionability composition. A straightforward implementation of the design therefore accepts `--knowledge facets|full` and silently ignores it whenever `--transitive` is also present. That violates the explicit level dial and the existing CLI policy of rejecting unsupported combinations; §7.3 lines 908-911 only says not to implement transitive knowledge yet, which does not define a refusal. Suggested repair: declare non-`skip` knowledge levels incompatible with `--transitive` for SL-246, enforce the conflict in clap or command validation, and add a black-box test whose error points to IMP-398 S5. Implementing transitive selection instead would exceed the stated scope."
disposition = "accepted-design-changed"
response = """
Observation ACCEPTED in full. Verified and cheap.

`run_inspect` (`src/commands/inspect.rs`) takes the transitive branch and returns before the one-hop relation and actionability composition. A `--knowledge` flag added to `InspectArgs` would parse under `--transitive` and be silently ignored, which is both a violation of the level dial's explicit contract and out of step with this CLI's habit of rejecting unsupported combinations rather than ignoring them. §7.3's "do not build transitive knowledge yet" states a non-goal, not a refusal, so the finding is right that the behaviour is undefined rather than deliberately declined.

Integration: §5.2 gains an explicit refusal — a non-`skip` `--knowledge` level combined with `--transitive` errors, and the error names IMP-398 S5 as the work that would make the combination meaningful. A named black-box case is being added to §9.2 for it. Adopted as prescribed; the alternative the finding names (implementing transitive selection) is correctly identified as out of scope and is not taken."""

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "DEC-260 omits the prior carrier and R6 relies on a duplicate"
detail = "Observation: IMP-393 predates IMP-457 by six weeks and already states the same governed defect: `design show` is occupied by a writer turn envelope rather than the reader document. It also carries the composed reader-facing render and presents a smaller alternative that DEC-260 never evaluates: make bare `design show` the reader render while retaining the already-named `--format prompt` writer projection. IMP-457 duplicates the complaint and intended rehome, and even describes SL-246 as taking a selector on `slice show` although the design proposes `slice design show`. Nevertheless SL-246 §3 F5 and §8 R6 lines 975-983 treat IMP-457 as the sole carrier and mitigation, while the actual slice relationship already records partial fulfillment of IMP-393. This leaves DEC-260 decided against an incomplete alternative set and makes R6 point to a redundant, factually stale carrier, contrary to the no-parallel-implementation rule. Suggested repair: reconcile IMP-457 into IMP-393 or state a non-overlapping boundary, update F5/R6 and the slice fulfillment boundary to the surviving carrier, and re-adjudicate DEC-260 against the `design show` reader default plus explicit `--format prompt` alternative before retaining the temporary nested verb."
disposition = "accepted-design-changed"
response = """
Observation ACCEPTED in full, and this finding is the one that reshaped the design. Prescription adopted.

Both halves verified independently. IMP-393 (opened 2026-08-03) predates IMP-457 (2026-09-18) by six weeks and states the same governed defect in the same terms. And the smaller alternative it names is real: `doctrine design show --help` carries `--format <FORMAT> [default: prompt] [possible values: prompt, json, status]`, so the writer's turn-envelope rendering is ALREADY named `prompt`. DEC-260's `alternatives` list considered a new `design read` verb in the group but never considered reclaiming `show` itself, so the finding is exactly right that DEC-260 was decided against an incomplete alternative set.

The migration DEC-260 implicitly feared was then priced rather than assumed: 14 references in tree. `.agents/skills/handover/SKILL.md` already passes `--format status` explicitly and is unaffected; `install/routing-process.md` carries one prose line; roughly four emitted strings name `design show --full`; and `design show`'s own default-output goldens move. Small — and materially smaller than the multi-seam cost DEC-145 chose `inspect` to avoid.

Integration. DEC-261 has been minted, accepted, and supersedes DEC-260, which is now `superseded`. The read re-sites at `doctrine design show <SLICE> --knowledge <level>`; the turn envelope keeps its three existing renderings under `--format prompt|json|status` and only the default moves. `slice design` is not promoted to a group; the deprecated leaf still retires. The user ruled this fork directly, having been shown the alternative, its cost, and the two options it was chosen over.

Consequences, recorded rather than glossed: F-1, F-2 and F-8 dissolve with the premise. R6 dissolves — the verb is no longer temporary, it is the destination. SL-246 absorbs the rehome that IMP-393 and IMP-457 were carrying separately, which is a real scope growth and `slice-246.md` will say so. IMP-457 is redundant against IMP-393 and is being reconciled into it. `SL-246 fulfils IMP-393 --degree partial` was recorded before this pass opened."""

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "The new ordering test does not pin the past-999 invariant"
detail = "Observation: SL-246 §5.5 I4 explicitly promises numeric source ordering past id 999, but the §9.2 fixture table does not require any four-digit ids and the named `output_is_permutation_invariant_across_scan_order` case proves only independence from input order. Existing relation-graph coverage may protect the upstream `InspectView`, but `select_knowledge` is new flattening and dedup logic that can regress to canonical-string ordering while remaining permutation-invariant. The proposed test therefore does not prove the strongest clause of I4 on the new output surface. Suggested repair: seed the knowledge-selection golden with otherwise comparable ids around 998, 999, 1000, and 1001, and assert numeric order after selection and dedup."
disposition = "accepted-design-changed"
response = """
Observation ACCEPTED in full. Prescription adopted.

Verified: §5.5 `I4` explicitly claims the source sort is "prefix lexicographic, id numeric — correct past id 999", while the only named case, `output_is_permutation_invariant_across_scan_order`, proves independence from input order and nothing about numeric ordering. The finding is also right about why that gap matters here specifically rather than generally: `select_knowledge` is new flattening-and-dedup logic over the view, so it can regress to canonical-string ordering (where `DEC-1000` sorts before `DEC-999`) while remaining perfectly permutation-invariant. Existing relation-graph coverage protects the upstream `InspectView`, not the new output surface.

Integration: §9.2 gains a fixture seeding otherwise-comparable record ids around 998, 999, 1000 and 1001, and a named case asserting numeric order after selection and dedup. Taken as prescribed."""

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "The read-only design surface inherits a worker-mode write refusal"
detail = 'Observation: SL-246 C3 at §3.2 lines 343-346, §5.3 lines 652-655, and I7 at §5.5 line 720 require the promoted `slice design show` path to be read-only and not inherit the retired leaf write. The exact §5.6 code-impact table at lines 755-767 omits `src/commands/guard.rs`, and none of its rows covers the whole-command classification owned there. Today `write_class` maps every `SliceCommand::Design { .. }` to `Write("slice design")` (`src/commands/guard.rs:63-66`), while the cited `slice selector` precedent nests its group and classifies `Doctor` as `Read` separately from the mutating subverbs (`:82-88`). This classification has one production consequence: `main` calls `worker_guard` before dispatch (`src/main.rs:259-266`), and under `DOCTRINE_WORKER=1` a `Write` classification exits nonzero with an authored-write refusal before the new handler can run (`src/commands/guard.rs:442-471`). It does not acquire a lock, regenerate boot state, or make the handler write; outside worker mode it passes through. Therefore implementing the declared touch-set leaves the new read-only surface unusable in confined workers. This is distinct from F-2: F-2 concerns the later dispatch edge and ADR-001 cycle, whereas this refusal happens before dispatch and survives any repair to that route. Suggested repair: add `src/commands/guard.rs` and worker-guard coverage to §5.6, and specify nested classification for the promoted group so `Show` is `Read`.'
disposition = "dissolved-by-dec-261"
response = """
Observation ACCEPTED as correct about the superseded design; dissolved by the re-siting, with its general lesson kept.

Verified as you recorded it. `write_class` (`src/commands/guard.rs`) classifies `SliceCommand::Design` as `Write("slice design")`, `slice selector` shows the nested pattern a promoted group must adopt (`Doctor => Read`, the rest `Write`), and `src/commands/guard.rs` appears nowhere in §5.6's code-impact table. Your bounding of the consequence is accepted and is narrower than the candidate put to you claimed: the classification feeds only the pre-dispatch worker guard, so the cost is a nonzero refusal under `DOCTRINE_WORKER=1`, not a lock, a regeneration, or any filesystem write. Your ruling that it is distinct from F-2 — rejecting before dispatch, and surviving any F-2 repair — is also accepted.

DEC-261 removes the premise: `SliceCommand::Design` is not promoted to a group, so nothing inherits its write classification and the `guard.rs` row is untouched by the new read surface. The retirement of the deprecated leaf removes that row along with the variant, which is a deletion rather than a reclassification.

The general lesson is kept rather than discarded with the finding. §5.6's code-impact table was incomplete in a way that `C3` and `I7` made easy to miss — the design asserted a read-only property while omitting the file where this codebase actually classifies read versus write. The re-sited design adds `src/commands/guard.rs` to §5.6 for the leaf retirement, and the sweep for that defect class found no other omitted enforcement site.

Recorded for the ledger: this candidate was found by the design's author, who declined to rule on it and put it to you instead, because authoring the review bar disqualifies an author from ruling on their own compliance with it. Your independent bounding of the runtime consequence is what made it usable."""

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "The reclaimed `design show` flag set is undefined at four points"
detail = """
Observation. §5.2's command-grammar block specifies `doctrine design show <SLICE> [--knowledge <skip|facets|full>] [--format <fmt>] [--json]` and says only that "the `--format` values `prompt`, `json` and `status` keep their current renderings and names; only the default moves". Four interactions on the verb this slice reclaims are left undefined, and §5.6's `src/commands/design.rs` row repeats the same sentence without resolving any of them.

(1) `--format`'s new default is unstated. `DEC-261`'s own consequences record this as an open fork — "The `--format` enum gains a value for the document or the default is re-keyed" — and the design picks neither. A default that "moves" to a rendering absent from the possible-values list is not expressible in clap: an implementer must either add a fourth value (moving the `--help` golden and needing an `STD-001` constant the design never names) or make `--format` an option with no default, which is a removal rather than a move.

(2) `--json` is introduced alongside `--format json` on the same verb, on a different axis, with no stated precedence. §5.2 gives `design show --json` the shape `{ kind, slice, document, knowledge }` while `--format json` renders the turn envelope. The `inspect` precedent does not transfer: there the two are the same axis and collapse at `src/commands/inspect.rs:59` (`let resolved = if args.json { Format::Json } else { args.format };`).

(3) `--full` survives on the verb and becomes an envelope flag on a document render. §5.6 mentions it only as ~4 emitted strings to re-point, so `doctrine design show SL-244 --full` under the new default is accepted and silently ignored — the exact failure §5.2 refuses two paragraphs earlier for `--knowledge` with `--transitive`. It is also then a second flag named "full" on a verb that now carries `--knowledge full` meaning something else (`STD-002`).

(4) `--knowledge` combined with `--format prompt|json|status` is undefined: whether the block appends to the turn envelope, is refused, or is ignored.

Suggested repair (a separate claim): resolve `DEC-261`'s fork explicitly in §5.2 and §5.6, state the precedence or drop `--json` in favour of a `--format` value, and give `--full` and `--knowledge`-with-`--format` the same explicit refusal or composition rule the design already gives `--knowledge`-with-`--transitive`."""
disposition = "accepted-design-changed"
response = "Accepted in all four parts, and all four were live forks rather than documentation gaps — your note under 'could not check' asked exactly the right question, and nothing had been ruled verbally. The user ruled each; section 5.2 now records them. (1) `--format` gains `document` and `document` becomes the default, closing the fork `DEC-261` left open. The no-default alternative is rejected in the prose as a removal dressed as a move: it takes `--format` from total to partial and leaves the new default invisible in `--help`. The four value names are one `STD-001` constant set. (2) `--json` keeps the document read's JSON and is refused alongside an explicit `--format`, rather than inventing a precedence between two axes; your point that `inspect`'s collapse at `inspect.rs:59` does not transfer is quoted as the reason. The principled content/encoding split is named in the design and declined on cost, and `IDE-054` now carries the general question of whether the CLI couples the two axes elsewhere and whether that is worth a standard. (3) `--full` is legal only with `--format prompt|json|status` and refused on the document rendering — widened from your `prompt|status` because `--format json` is an envelope rendering too, so the honest rule is 'every envelope rendering'. (4) `--knowledge` with an envelope `--format` is refused. That was the part your finding named which the first integration pass missed; catching it while writing this disposition is why it is here rather than in a round 3. The four rules are now stated as one partition — `--knowledge` and `--json` belong to the document, `--full` to the envelope, each refused outside its own — which is one rule to remember instead of four interactions to look up. Revision 42, sec-5 and sec-9."

[[finding]]
id = "F-10"
status = "verified"
severity = "major"
title = "`C1` and `I1` are false of `design show`, and the `skip` golden is unsatisfiable"
detail = """
Observation. §3.2 `C1` requires that "`skip` must reproduce today's bytes exactly, on every verb this design touches, in both table and JSON", and §5.5 `I1` states "at `Skip`, output is byte-identical to the pre-SL-246 surface, in both formats, on every affected verb". `design show` is a verb this design touches and affects, and under `DEC-261` its default — which is `--knowledge skip` — changes from the turn envelope to the design document. §8 `R6` states that plainly as the migration risk. So `C1` and `I1` are literally false as scoped.

The contradiction reaches `VT`. §9.2 names `skip_is_byte_identical_to_the_prior_surface` and qualifies it "table and JSON, both verbs". On the second verb that case cannot pass: `design show`'s prior surface was the envelope. Two cases later §9.2 names `design_show_defaults_to_the_document_and_format_prompt_keeps_the_envelope`, which asserts the contrary. One of the two is wrong and the design does not say which.

A charitable reading is available — that `C1` binds the *flag's* neutrality rather than the verb's output, so adding `--knowledge` changes nothing by itself. That reading is coherent and is probably what was meant, but it is not what either clause says, and §9.2's named case picks the stronger one.

Suggested repair (a separate claim): scope `C1`/`I1` to the surfaces this design adds to — `inspect` in both formats, and `design show --format prompt|json|status` — state `design show`'s bare default as deliberately not byte-identical with `R6` as its carrier, and split the §9.2 case accordingly."""
disposition = "accepted-design-changed"
response = "Accepted, including the charitable reading — it was what was meant, and you were right that it is not what either clause said. `C1` (section 3.2) and `I1` (section 5.5) are rescoped to the surfaces this design *adds the level to*: `inspect` in both formats, and `design show`'s envelope renderings. Both now state explicitly that `design show`'s bare default is NOT covered, that `DEC-261` moves it deliberately, and that the constraint binds the flag's neutrality rather than the verb's stability — with `R6` named as the carrier and section 5.6 as the whitelist. The section 9.2 contradiction is resolved by splitting the case rather than choosing between the two: `skip_is_byte_identical_to_the_prior_surface` is now `inspect`-only, and `design_show_envelope_renderings_are_byte_identical_to_the_prior_default` carries `C1`'s other half on the reclaimed verb. Revision 42, sec-3, sec-5, sec-9."

[[finding]]
id = "F-11"
status = "verified"
severity = "major"
title = "§5.6's impact table omits every existing test bound to the two retired surfaces"
detail = """
Observation. §5.6 lists three test files — `tests/e2e_inspect_golden.rs`, a new `tests/e2e_design_show_golden.rs`, and `tests/e2e_knowledge_cli_golden.rs` "unchanged — the `C2` proof" — and §9.1 makes "existing suites stay green unchanged" the behaviour-preservation alarm. Five existing test files bind the two surfaces this design retires, and none of them appears in either place.

- `tests/e2e_design_materialise.rs:599,605,606,668,702` — five invocations of the deprecated `slice design` leaf, testing its warning and its forwarding to `design materialise`. The leaf retires; these retire with it.
- `tests/e2e_subcommand_help.rs:103` — `design_show_is_the_narrow_surface_and_names_its_own_widening`, carrying `SL-233` PHASE-04 `EX-5`. It asserts that `design show --help` names `--full` and says "widen", on the stated premise that `show`'s default is the narrow end of the envelope projection. `DEC-261` makes the default a document, so the test's *premise* is invalidated, not merely its bytes — a prior slice's exit criterion silently loses its guard, and this is the same flag whose fate `F-9` says is unspecified.
- `tests/design_fixture/mod.rs:74` and `tests/e2e_design_state.rs:226` — two bare `design show` helpers, with roughly eleven call sites across `tests/e2e_design_state.rs` and `tests/e2e_design_projection.rs` asserting envelope content (`review=current` at `e2e_design_state.rs:2283`, `--known-revision` projections, `--full` at `e2e_design_projection.rs:406`, a JSON parse at `e2e_design_projection.rs:94`). Every one needs `--format prompt` after the reclaim.
- `tests/e2e_design_state.rs:530,1809` — two direct invocations, one of them an expected-failure assertion.

This is more than bookkeeping. §9.1 tells the implementer that a red existing suite is the `C1` alarm; after this change several existing suites go red for a reason that is intended, so the alarm cannot be distinguished from the migration unless the table says which is which.

Suggested repair: name the five files in §5.6 with their disposition — retire, migrate, or re-premise — and qualify §9.1's unchanged-green claim to the suites that are genuinely invariant under `DEC-261`."""
disposition = "accepted-design-changed"
response = "Accepted, and the framing — 'this is more than bookkeeping' — is the part that changed the repair. All five files are now in section 5.6 with an explicit disposition each: `e2e_design_materialise.rs` retires with the leaf; `e2e_subcommand_help.rs` is re-premised, not dropped, with `SL-233` PHASE-04 `EX-5` re-expressed against `--format prompt --full` and the premise inversion spelled out in section 5.2; the three fixture/state/projection files migrate with an explicit `--format prompt`. A fourth table note now separates the intended red from the alarm: those three rows are the whitelist, and a red suite not named there is the `C1` alarm and must not be updated as a golden. Section 9.1 carries the same qualification, so the distinction lives in the table rather than in the implementer's judgement at the moment the build breaks. Revision 42, sec-5, sec-9."

[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "§7.2 `D1` still specifies the superseded five-key JSON entry"
detail = """
Observation. §5.2 and `D5` now specify `Full`'s JSON entry as the complete `knowledge show` payload — `id, record_kind, slug, title, status, created, updated, tags, facet, evidence, relationships, body` — plus `caption`. Verified against `show_json` at `src/knowledge.rs:1949`, which projects exactly those twelve keys.

§7.2 `D1` did not move with them. It still reads: "Each record is an object — `{ reference, caption, facet | null, marker?, body? }` — tier-filtered at `Facets` exactly as the table is, rather than a blob of rendered text." That is the five-key shape `F-4` attacked, and §7.2 introduces its decisions as "settled here rather than deferred". The document therefore specifies the JSON contract twice, incompatibly — and `D5`'s own rationale describes exactly this contradiction as the thing it was minted to remove ("the draft answered it two ways at once"). An implementer reading §7 in order gets the superseded shape from a section that claims to be settled.

`F-4`'s disposition undertook to rewrite "§5.2 and D1". Only §5.2 moved.

Suggested repair: reduce `D1` to the decision it actually is — that the JSON arm carries the level structurally rather than as rendered text — and let `D5` own the entry shape; or delete `D1`'s shape clause and cross-reference `D5`."""
disposition = "accepted-design-changed"
response = "Accepted — the document did specify the JSON contract twice, incompatibly, in a section that introduces its decisions as settled. `D1` now states only what it decides (the two arms agree, and what mechanises that) and defers the entry shape to `D5` and section 5.2 explicitly. Your observation that `D5`'s own rationale describes this very contradiction as the thing it was minted to remove is what made the repair obvious. Revision 42, sec-7."

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "The `Full` JSON entry has no marker slot, so `I6` and `X5` hold on the text arm only"
detail = """
Observation. §5.2's new signatures give the empty-state policy to one arm: `format_facet(facet: &RecordFacet, tier: TierFilter, empty: EmptyPolicy) -> String` takes it; `facet_json(facet: &RecordFacet, tier: TierFilter) -> serde_json::Value` does not.

At `Facets` the JSON entry can still carry a marker, because the entry is hand-built and §5.2's table says "`marker` in place of `facet` when there are none". At `Full` it cannot: the entry is "the complete `knowledge show` payload ... plus `caption`", in which `facet` is always present and `facet_json(RecordFacet::Concept(_))` is `{}` (`src/knowledge.rs:2040`). So on the JSON arm at `Full`:

- `I6` — "the three empty states render three distinct messages" — is unmet; the JSON arm renders `{}` for two of them and has no representation for the third.
- `X5` — "a `CPT` ... renders the by-design marker, never the unfilled one, at every level" — is unmet at `Full`.
- §9.2's `json_and_table_carry_the_same_fields_at_the_same_level_for_every_kind`, which §9.2 explicitly widens to "content parity per record kind", fails for `CPT`: text renders a marker, JSON renders `{}`.

The `facet_fields` refactor does carry the *tier* to both arms, which is what `F-4` asked for and is verified as sufficient — every facet field in `src/knowledge.rs:1994-2041` is a string or a list, so `FacetValue::{Text,List,Absent}` covers them, and `format_facet`'s template order matches `facet_json`'s literal order for all seven kinds. But the *empty policy* reaches one arm, which is the same asserted-without-mechanism defect `F-4` named, one layer along.

Secondary, in the same signature block: `TierFilter` appears in both signatures and is never defined; only `enum Tier { Deciding, Argument }` is. The relation between a two-variant `Tier` and a filter that must also express "all tiers" is left to the implementer.

Suggested repair: give `facet_json` the same `EmptyPolicy` parameter, or state where the `Full` JSON entry's `marker` key sits and what `facet` holds beneath it."""
disposition = "accepted-design-changed"
response = """Accepted on both the primary and the secondary. `facet_json` now takes `EmptyPolicy` alongside `TierFilter`, with a comment stating why: a marker the text arm emits and the JSON arm omits is `I6` unmet on half the surface, which is the defect `facet_fields` exists to prevent. The marker now rides INSIDE `facet` as `{"marker": ...}` in place of the field object, at both levels — chosen over a sibling key at the entry level because it keeps `Full`'s entry exactly `show_json`'s twelve keys plus `caption` with nothing bolted on, and it makes the two levels one entry shape rather than two. `X5` therefore holds at every level on both arms as written, and the section 5.2 entry table is updated on both rows. Secondary accepted: `TierFilter` is now defined as `All | Only(Tier)`, with a note that `All` is not the two variants spelled twice but the existing whole-facet render that `knowledge show` must pass to stay byte-identical under `C2`. All call sites in the design now name the variant. Your verification that `FacetValue` is sufficient for all seven kinds is why the repair needed no widening of the value type. Revision 42, sec-5."""

[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "The in-block unreadable marker's one reachable case is unreachable in the declared test family"
detail = """
Observation. §5.2 narrows the in-block unreadable marker to a single population — "a record that scanned cleanly and then failed between the scan and the render ... a genuine race rather than a corpus defect" — and this is the right correction. But §9.2 then keeps both a fixture ("a record present at scan and unreadable at render") and a named case (`a_record_unreadable_after_selection_is_named_in_the_block`, "reached by removing the file between scan and render"), inside a set whose preamble binds it to "Synthetic-corpus goldens, seeded in a temp dir the way `tests/e2e_inspect_golden.rs` already does — fixed bytes in, byte-exact bytes out (`DEC-151`)".

A black-box golden spawns one process, and both the scan and the render happen inside it. No seeded byte sequence can make the second read fail after the first succeeded, and the harness has no seam to intervene between them. Nor is there an in-process divergence to exploit: the scan's `outbound_for` reaches `knowledge::relation_edges` then `read_record` (`src/catalog/scan.rs:65`, `src/knowledge.rs:1637`), which parses and validates the TOML and reads the `.md` unconditionally, so any input that would fail the render's facet-only read has already failed the scan and been pruned. That is the design's own §5.2 argument, applied to its own test.

So `I5`'s in-block half is claimed, narrowed, specified — and unverifiable as `VT` in the family §9.2 declares. The fixture row and the named case both assert a capability the test type does not have.

Suggested repair (a separate claim): either give that one case an in-process test with an injected read failure and say so in §9.2 — which is a deliberate departure from `DEC-151`'s black-box choice and should be recorded as one — or state that `I5`'s in-block half is verified by construction through `render_block`'s totality rather than by test, and drop the fixture row."""
disposition = "contest-upheld-shape-now-carries-i5"
response = """
Contest upheld. The observation defeats a specific claim: §9.5 said the `String` return meant no path exists on which a record 'aborts the block OR VANISHES FROM IT'. The second half does not follow, and your counter-example is the proof — `filter_map(|r| read_record(..).ok())` is total, compiles, and drops exactly the record STD-003 exists to disclose. `I5` has three clauses (line 968, and §3.1's STD-003 paragraph states them independently); totality foreclosed one.

Repaired by your second option, taken with `F-18` because they wanted the same thing. §5.2 now names `render_record` / `record_value` — per record, total, contracted NEVER EMPTY — and defines `render_block` / `knowledge_value` as MAPS over them, never filters. §9.5 replaces the one-sentence argument with a table grounding each clause separately: the map shape forbids the drop, the never-empty contract forbids the empty render, the return type forbids the abort. §5.5 `I5` and §5.1's flowchart carry the same split, and §5.4's sequence now shows the three outcomes rather than two.

Your first option — an in-process injected-failure test — stays declined, now for a better reason than before: the shape fixes what the seam would have proved. Revision 47, sec-3/5/7/8/9."""

[[finding]]
id = "F-15"
status = "verified"
severity = "minor"
title = "§9.2's `prefix subset` case contradicts `I2`, §9.5 and `DEC-150`'s tiers"
detail = """
Observation. §9.2 names the case `facets_fields_are_a_prefix_subset_of_full_in_the_same_order` and cites `I2`. `I2` claims only a subset in the same order, and §9.5 states the relation correctly as "`facets` is a subsequence of `full`". A *prefix* it is not, under `DEC-150`'s own tiers:

- `DEC` — deciding fields are context, choice, rationale, while `format_facet`'s template order is context, choice, **alternatives**, rationale, consequences, decided_by, decided_on (`src/knowledge.rs:1879`). `Facets` yields template positions 1, 2, 4.
- `ASM` — deciding fields are claim, confidence, basis, **invalidated_by**, against a template of claim, confidence, basis, validation_plan, validated_by, validated_on, invalidated_by, invalidated_on (`src/knowledge.rs:1869`). Positions 1, 2, 3, 7.

Taken at its word the case fails against §9.2's own first fixture, "a filled `DEC`", whose stated purpose is that `alternatives` appears only at `Full`.

Suggested repair: rename the case to the subsequence property that `I2` and §9.5 both state."""
disposition = "accepted-design-changed"
response = "Accepted; the case name asserted a stronger property than `I2` and section 9.5 both state, and it was false against section 9.2's own first fixture. Renamed to `facets_fields_are_a_subsequence_of_full_in_template_order`, and the case now carries your counter-example inline so it cannot silently strengthen again: a `DEC`'s deciding fields are template positions 1, 2 and 4 because `alternatives` sits between `choice` and `rationale`, and an `ASM`'s are 1, 2, 3 and 7. Verified against `format_facet` at `knowledge.rs:1869` and `:1879`. Revision 42, sec-9."

[[finding]]
id = "F-16"
status = "verified"
severity = "minor"
title = "The counted migration population omits the committed memory corpus"
detail = """
Observation. §3.3 `F5` and §8 `R6` price the reclaim at "14 references, counted rather than estimated", broken down as one prose line in `install/routing-process.md`, roughly four emitted strings naming `design show --full`, and `design show`'s own goldens. `R6` reasons explicitly about prose the goldens cannot reach, and names only `install/routing-process.md` — "so `install/routing-process.md` is in §5.6's table explicitly rather than left to a sweep".

Five committed memories under `.doctrine/memory/items/` document `design show` as the turn-envelope read. None is in the count or in §5.6:

- `mem_019fc255625877e09ba55d5e11d7c5cb` — titled "Design run state: read via show, not the raw TOML". Its body instructs "Read design-run state with `doctrine design show <slice>`" and tabulates `doctrine design show 243`. Its thesis inverts under `DEC-261`.
- `mem_019facc21a1b7c50a6d5b2eb7ec7f3c9:54,58` and `mem_019fdf95d07979d0a7172f75381ef58c:31` — both instruct an agent to compare a fingerprint against "what `design show` displays".
- `mem_019ff439bede7fb29c7c09b7fd76d893:2` — "`design show`'s `declaration_example` shows ...".
- `mem_019fcd1727fa7061b771179b113f5726:17,21`.

These are authored, committed, and surfaced into agent context by `memory retrieve` and the `memory surface` hook, so they are the same class as the `routing-process.md` row `R6` singles out — and a larger instance of it, since a stale memory is injected rather than merely read.

The decision is not threatened: five memory edits is still small against the multi-seam cost `DEC-145` chose `inspect` to avoid, so `F5`'s conclusion survives. What is threatened is the count `F5` calls measured, and §5.6's completeness on exactly the axis `R6` identifies as its residual.

Suggested repair: add a memory-corpus row to §5.6, or route it to a named `/reviewing-memory` follow-up in `R6` and restate the count as bounding code and docs only."""
disposition = "accepted-design-changed"
response = "Accepted, and your reading of which half is worse is now in the design: a stale doc waits to be read, a stale memory is injected into an agent's context by `memory retrieve` and the surface hook. Section 3.3 `F5` no longer carries a bare number — it states the population as a table so the count can be checked rather than trusted: 1 shipped-prose line, 4 emitted strings (with the three `--full` sites and the one bare site named at file:line), 5 test files enumerated in section 5.6, 5 committed memories. `R6` is updated to match and to say that goldens reach neither skill prose nor the memory corpus, which is why both are in the table rather than left to a sweep. Section 5.6 gains a memory-corpus row routing the five edits to a `/reviewing-memory` pass rather than this slice's phases, because re-attesting a memory is its own verb and the corpus is not code. Your separate note — that 'verify the count' was unbounded as posed because the figure named no denominator — is recorded as a friction observation on your behalf, since a fork cannot capture its own. Revision 42, sec-3, sec-5, sec-8."

[[finding]]
id = "F-17"
status = "verified"
severity = "minor"
title = "`DEC-150`'s stated encoding is superseded by §5.2 with nothing recording it"
detail = """
Observation. `DEC-150` is `accepted` and normative. Its `choice` rules the tiers "Encoded as a tier annotation on each field line inside `format_facet`'s existing per-kind match, not as a separate field-list constant", and its `consequences` record "`show_opt_line` / `show_list_line` grow a tier argument; the `DEC-149` policy filters on it".

§5.2's `facet_fields` repair moves the single source "one level down": the per-kind match is rewritten to yield `Vec<FacetField>` instead of emitting lines, and the empty policy sits as a parameter on `format_facet` rather than on the line helpers. The *ruling* survives intact — one table, one place, one field order, and not the separate constant `DEC-150` rejected — but the encoding clause in `choice` and that `consequences` bullet are both falsified, and neither the record nor §7.1 says so. §7.1 still maps `DEC-150` as "tiers annotate the existing per-kind field match", presented as "a map, not a restatement" of a record that is normative where the two differ.

This slice shows what a changed premise costs here: `DEC-260` was superseded by `DEC-261` rather than quietly rewritten. The same move is available and cheap.

Suggested repair: amend or supersede `DEC-150` with the `facet_fields` encoding, or state in §5.2 and §7.1 that the ruling's encoding clause is now carried one level down and why the ruling is unaffected."""
disposition = "accepted-design-changed"
response = "Accepted as a documentation defect, and the user ruled against superseding. `DEC-150` stands unsuperseded: what it actually ruled — one table, one field order, one place, and NOT the separate constant it rejected on drift grounds — is untouched, because `facet_fields` IS that per-kind match rewritten rather than a constant beside it. Your own finding says this, and it is the distinction from `DEC-260`, whose *conclusion* changed. What moved is the encoding clause, so the design now records the move in both places you named: section 5.2 quotes the clause and the `show_opt_line`/`show_list_line` consequence, states that neither helper grows anything under `facet_fields`, and says the annotation sits on the field rather than on its rendered line; section 7.1's row says the ruling is intact, the record stands, and the encoding clause is what shifted. Revision 42, sec-5, sec-7."

[[finding]]
id = "F-18"
status = "verified"
severity = "major"
title = "The JSON arm is specified as a shape with no producer"
detail = """
Observation. § 5.2 specifies exactly one block-level function — `render_block(root: &Path, selected: &[SelectedRecord], level: KnowledgeLevel) -> String` — and § 5.3's ownership table and § 5.6's `src/knowledge.rs` row name no other. The JSON arm is nonetheless specified as structure, not text: § 5.2 says "`inspect --json` gains an additive `"knowledge"` key" and "`design show --json` carries one under the document", and § 7.2 `D1` makes it decisive that the level "is expressed in the shape of each record entry ... rather than as a blob of rendered text". A `String` cannot be that key's value without violating `D1`. So the function that turns `&[SelectedRecord]` into the `"knowledge"` value is named nowhere: no signature, no totality contract, no ownership row, no `VT` naming it.

Three claims elsewhere in the design rest on that absence, and each is weaker than it reads.

(1) § 8 `R7`'s mitigation is "`render_block` is the only public path to a rendered record set, and `SelectedRecord` is the only way in". The first half is false on the JSON arm, where a second path must exist; only the second half survives.

(2) § 9.5 verifies `I5`'s in-block half by construction, reasoning entirely from `render_block` returning `String` rather than `Result`. `I5` says a selected record that cannot be read is "named in the output" and does not qualify a format, and § 5.2 gives the JSON entry shape at both levels. The JSON producer's return type is unstated, so it may perfectly well be a `Result` — which reinstates on that arm precisely the abort § 9.5 says has no path. The by-construction argument covers one of the two arms it is offered for.

(3) § 5.2 specifies `Full`'s entry as "the complete `knowledge show` payload — id, record_kind, slug, title, status, created, updated, tags, facet, evidence, relationships, body — plus `caption`". `show_json` (`src/knowledge.rs:1949-1989`) cannot be called for that value: it returns `anyhow::Result<String>` of a serialised `{"kind":"knowledge","knowledge":{…}}` envelope, and its `body` key is conditional on a `with_body` parameter. § 5.6 lists no change to it. So the twelve keys are a second, hand-written projection of the same payload, mechanised by nothing — the record-level instance of exactly the defect `facet_fields` was introduced to remove one level down, and the drift `DEC-150` rejected a separate field-list constant to avoid. A thirteenth key added to `show_json` renders in `knowledge show --json` and vanishes from the composed `Full` entry, which is `DEC-150`'s own words about its rejected alternative.

Suggested repair (a separate claim): name the JSON producer in § 5.2 with its signature and its totality contract, give it a row in § 5.3 and § 5.6 beside `render_block`, and state how it obtains the record payload — most cheaply by splitting `show_json`'s map construction into a `fn show_value(record: &KnowledgeRecord, with_body: bool) -> serde_json::Value` that both `show_json` and the composed entry render from, which is the same move `facet_fields` makes one level down."""
disposition = "accepted-design-changed"
response = """
Accepted in all three parts, and it is the finding that reorganised the repair. Verified against the tree, not the design's description: `show_json` (`knowledge.rs:1949`) returns `anyhow::Result<String>` of a `{kind, knowledge}` envelope, builds the twelve-key map inline, and gates `body` on `with_body` — so neither the envelope nor the string is usable as an entry, and the composed `Full` would have been a second hand-written projection. You named it correctly as `DEC-150`'s own argument one level up.

(1) and (2) are repaired with `F-14`: `record_value` is the named JSON producer, total, owned in §5.3 and listed in §5.6, and `knowledge_value` is its set-level map. `R7`'s mitigation now reads 'exactly two public paths — the same map over the same per-record producers, and `SelectedRecord` is the only way into either', which is the half you said survives plus the half that had to be built. §9.5's by-construction argument now covers both arms because both are the same shape.

(3) takes your suggested repair as offered: `show_value(record, with_body) -> serde_json::Value` splits out of `show_json`'s inline map, `show_json` serialises it inside its unchanged envelope (so `C2` holds — only the map acquires a name), and §5.2's `Full` row now names the call instead of listing twelve keys. §9.2's `full_json_carries_the_complete_knowledge_show_payload` gained the consequence: a thirteenth key appears without anyone editing this design. Recorded as `D6`. Revision 47, sec-5/7/8/9."""

[[finding]]
id = "F-19"
status = "withdrawn"
severity = "major"
title = " sits on facet-scoped functions that cannot see the marker's inputs"
detail = """
Observation. § 5.2 places the empty-state policy on two facet-scoped functions — `format_facet(facet: &RecordFacet, tier: TierFilter, empty: EmptyPolicy) -> String` and `facet_json(facet: &RecordFacet, tier: TierFilter, empty: EmptyPolicy) -> serde_json::Value` — and defines `EmptyPolicy` as `{ Silent, Marked }`, a payload-free enum. The same section then fixes what `Marked` must render, in the three-empty-states table:

    author left the facet unfilled | `(no facet recorded — 6.7 KB of prose: doctrine knowledge show QUE-206)`

That string needs two record-scoped values: the record's canonical reference (`QUE-206`) and the byte size of its sibling `.md`. `&RecordFacet` is the parsed `[facet]` table alone and carries neither; `EmptyPolicy` carries neither. So the unfilled marker cannot be produced by either function as signed, on either arm.

The section contradicts itself on this within two paragraphs: "the marker rides inside `facet`, as `{"marker": "<constant>"}`" describes a constant, while the table's text is a per-record template. § 3.1 states the same thing under `STD-001` — "both empty-state markers are named constants with one definition each" — which is true of the by-design marker and false of the unfilled one as written.

The other two markers are unaffected and the contrast locates the defect. The by-design marker (`(no facet by design — a concept rides its prose body)`) is genuinely constant. The unreadable marker is `render_block`'s, which holds the `SelectedRecord` and therefore the reference. It is the unfilled marker — the one `DEC-149` exists for, and the one § 8 `R1` says carries the feature's credibility on a corpus where four of the specimen's fifteen records render it — whose inputs are unreachable from the function the design assigns it to.

Note this is not the round-1 question about whether the size hint is obtainable without reading the `.md`; `metadata()` answers that. It is that the function holding the policy cannot see the file at all.

Suggested repair (a separate claim): either give `EmptyPolicy::Marked` the record-scoped data — the reference and the prose size, which `render_block` and its JSON sibling already have in hand before they call the facet renderer — or keep both facet renderers constant-only and site the unfilled marker's composition one level up in the block renderers, where the reference and the path are already known."""

[[finding]]
id = "F-20"
status = "verified"
severity = "major"
title = "The empty-state policy sits on facet-scoped functions that cannot see the marker inputs"
detail = """
Observation. § 5.2 places the empty-state policy on two facet-scoped functions — `format_facet(facet: &RecordFacet, tier: TierFilter, empty: EmptyPolicy) -> String` and `facet_json(facet: &RecordFacet, tier: TierFilter, empty: EmptyPolicy) -> serde_json::Value` — and defines `EmptyPolicy` as `{ Silent, Marked }`, a payload-free enum. The same section then fixes what `Marked` must render, in the three-empty-states table:

