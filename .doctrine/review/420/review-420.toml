[[finding]]
id = "F-1"
status = "answered"
severity = "minor"
title = "Expected: canon writes follow a symlinked ancestor and refresh; observed: a symlinked canon container makes every member write 'skipped (changed since scan)' forever"
detail = """
Repro (temp project, copied binary): `.doctrine/agents/claude -> ../../../reloc`, edit a canon def under reloc/; `install -y --agent claude` reports `skipped … (changed since scan)` for all 4 defs; edit survives (user file reloc/my-notes.md also survives — safe direction).
Cause: `Scan::canon_dir` descends only on lstat Dir (src/install.rs:2204-2208), so member canon paths under a symlinked container are never recorded; `scan.scanned()` = Absent, the apply re-proof (src/install.rs:2432-2434) sees File and skips.
Governing: design §Safety boundaries ("Writes and relinks may follow a symlinked ancestor"); SPEC-010 REQ-178 (skip only on a real change). Undercuts PHASE-04 EX-3 for this case.
"""
disposition = "fix-now"
response = """
Fix before close: record each member canon path's state regardless of container descent, keep the symlinked container prune-blocked. Regression test from the temp-project repro.
"""

