id    = 310
slug  = "sl-231-external-adversarial-design-review"
title = "SL-231 external adversarial design review"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "opus"
responder = "orchestrator"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-231"

[[finding]]
id = "F-1"
status = "open"
severity = "blocker"
title = "Expected global UUID identity; observed identity derived from mutable kind/date partitions"
detail = "The proposed path <kind>/<year>/<month>/<uuid>.toml allows the same UUID to be recreated under another kind or month, so path-scoped create_new cannot enforce REQ-406 global replay and collision semantics or resolve show from identity alone."

[[finding]]
id = "F-2"
status = "open"
severity = "blocker"
title = "Expected invalid corrections to be inert; observed component-wide invalidity resurrects validly retracted records"
detail = "Weakly connected component inertness disables earlier valid controls when a later dangling, conflicting, or duplicate control joins the component. Garbage or retry can therefore undo a valid retraction, contrary to PRD-018 fail-open semantics."

[[finding]]
id = "F-3"
status = "open"
severity = "blocker"
title = "Expected dogfood capture coverage; observed blanket activation sends workers into a forbidden doctrine path"
detail = "The activation wording directs all agents to capture under .doctrine although worker deltas touching that tree are hard-refused. Claude requires the MCP broker and subprocess parity is deferred, so role-blind guidance can brick or drop worker capture."

[[finding]]
id = "F-4"
status = "open"
severity = "major"
title = "Expected atomic create guarantees backed by shared primitives; observed no primitive provides create-new plus complete-content publication"
detail = "fsutil create_new is no-clobber but can expose a partial file, while write_atomic publishes complete content but clobbers. Squat-rejecting parent creation is private to entity machinery. The design must name and budget the required shared primitive."

[[finding]]
id = "F-5"
status = "open"
severity = "major"
title = "Expected trustworthy measurements only; observed generic agent-writable measurement capture"
detail = "MCP admits measurement while QUE-176 has not identified a trustworthy producer. Declared metadata cannot turn an agent estimate into measured telemetry, contradicting PRD-018 and REQ-400."

[[finding]]
id = "F-6"
status = "open"
severity = "major"
title = "Expected declared SPEC-013 interaction to be implementable; observed an undefined relationship to the entity list spine"
detail = "The design introduces bespoke filters and pagination without stating whether observations flatten CommonListArgs, use listing.rs, join list-conformance tests, or declare UUID identity as an exception."

[[finding]]
id = "F-7"
status = "open"
severity = "major"
title = "Expected a named enrichment allowlist; observed only destination fields and prohibitions"
detail = "REQ-410 requires named bounded sources, but the design lists target execution fields without enumerating which v1 sources populate them. The privacy boundary and reliable-auto versus caller-supplied split are untestable."

[[finding]]
id = "F-8"
status = "open"
severity = "minor"
title = "Expected the storage tier to be explicit; observed untracked records with no declared Git disposition"
detail = "The design calls the store authored but does not state whether records are committed or ignored, who commits them, or how the path satisfies the three-tier storage rule."

[[finding]]
id = "F-9"
status = "open"
severity = "minor"
title = "Expected stable pagination under concurrent capture; observed undefined offset-or-cursor semantics"
detail = "Newest-first ordering is total, but inserts at the head duplicate rows under offset pagination. Stable pagination needs a keyset cursor or an explicitly fixed-corpus scope."

[[finding]]
id = "F-10"
status = "open"
severity = "minor"
title = "Expected lexical search semantics and reuse to be named; observed an undefined matcher beside an existing lexical leaf"
detail = "The design does not enumerate searched fields, case/token semantics, or whether src/lexical.rs is reused; this risks a parallel tokenizer or inconsistent search verbs."

[[finding]]
id = "F-11"
status = "open"
severity = "minor"
title = "Expected hostile write-boundary limits; observed rendering-only controls on a confinement-crossing capability"
detail = "No field or record size limits, NUL/control policy, or agent-context trust framing are defined. Structured serialization alone does not prevent terminal injection, unbounded writes, or stored text acting as trusted instruction."

[[finding]]
id = "F-12"
status = "open"
severity = "minor"
title = "Expected wire vocabulary aligned with its authority; observed boundary instead of scope, missing units, and undefined public"
detail = "The usage facet diverges from REQ-400 by omitting units and renaming scope, while correction rules rely on the undefined term public observation."

[[finding]]
id = "F-13"
status = "open"
severity = "minor"
title = "Expected ADR-001 tier vocabulary; observed unfalsifiable bespoke layer labels"
detail = "The architecture table uses leaf-within-umbrella and pure/imperative engine labels rather than the authoritative leaf, engine, command tiers, and does not state the layering.toml classification the gate must enforce."

# Findings are append-only `[[finding]]` tables, added by `review raise` (PHASE-03).
# Empty here at creation — a fresh review is Active, awaiting the raiser (D-C8).
