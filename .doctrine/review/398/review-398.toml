[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "An adopted capsule worktree should be auditable; review verbs refuse it as a fork"
detail = """
Expected: capsule-adopt's instruction "Audit here, not on edge" is followable. Observed: `resolve_review_root` (src/review/turn.rs:169) classifies any linked worktree whose branch is not `dispatch/<NNN>` as a fork, so `review status/raise/...` on `capsule/SL-268/c20` bail with the IMP-024 message. The audit had to merge the capsule into edge first (39212685a). Separately, the adopted worktree lacks the gitignored `web/map/dist/`, so `check gate` fails to compile there until it is copied in. Pre-existing tooling, not introduced by SL-268; observation 01a0e021 records it.
"""
disposition = "follow-up"
response = "Pre-existing tooling outside SL-268's scope; filed ISS-494 (capsule-adopt vs the review fork guard, plus missing web/map/dist)."

