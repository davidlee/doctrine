Expected at closure (design sec-6, sec-8 Closure): REV applied at reconcile; the new tech spec live. Observed: REV-064 is `proposed`, approval none, carrying the ADR-007 D-C5/D-C8/D-C10 rewrites, knock-on wording, and the SPEC-003 container-inventory addition of SPEC-029 and SPEC-032. SPEC-032 is `draft` with two `[[source]]` anchors (src/review_ledger/mod.rs, src/review/mod.rs), both present in the tree.
"""
disposition = "design-wrong"
response = "Reconcile brief (governance): approve and apply REV-064; move SPEC-032 draft -> active."

