role = "responder"
disposition = "design-wrong"
response = "Reconcile brief (per-slice): design.md sec-3 (Vocab in FindingState; warnings omitted when empty), sec-5 (skipped list, all-skipped not degraded, special files excluded), sec-6 (IMP-479 closed wont-do). Also lifted into notes.md."

[[finding.turn]]
act = "verify"
