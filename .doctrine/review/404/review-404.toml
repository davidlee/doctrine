[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "PHASE-04 retirement leaves the PHASE-03 VT mandates unverifiable; design sec-9 does not record the supersession"
detail = "doctrine slice verify-vt 271 now reports PHASE-03 VT-1..VT-4 FAIL: their mandated keywords (parse_codex_features, codex_hooks_state, Unknown, HooksState) are the symbols PHASE-04 retired under RV-403 F-1 option A. The plan criteria are immutable-append, so the mandate cannot be re-pointed. The retirement is correct and PHASE-04 VT-1..VT-4 pass; what is missing is the record: design sec-9 names the :5170 flip but not that the PHASE-03 probe VTs are historically satisfied and superseded by PHASE-04. Reconcile: design sec-9 records the supersession so the current-tree FAIL reads as expected rather than as un-dispositioned red."
disposition = "design-wrong"
response = "Agreed and routed to reconcile. verify-vt confirms PHASE-03 VT-1..VT-4 fail on the current tree because the mandate names retired symbols; PHASE-04 VT-1..VT-4 pass. The plan criteria are immutable-append, so the disposition lands in design sec-9, not the criterion. Reconcile brief item: design sec-9 records PHASE-03 VT-1..VT-4 as satisfied at execution and superseded by PHASE-04 VT-1/VT-2."

