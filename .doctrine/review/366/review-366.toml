id    = 366
slug  = "sl-259-implementation-audit-does-truthful-apply-tell-the-truth-about-itself"
title = "SL-259 implementation audit: does truthful apply tell the truth about itself"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-259"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "design.md sec-3 states DEC-246's state axis as four cells; three landed"
detail = "Expected: design.md, the canonical artefact, describes the axis the code implements. Observed: sec-3 'The state axis' says 'Four cells — provenance (honoured on create), lifecycle (honoured on update), concerns and blocking (honoured when a finding is raised). DEC-246 refuses all four.' Only three refuse. PHASE-01 collapsed declare_node onto one row-producing path over two priors (run.rs:1307-1400), which made a lifecycle declared at CREATION land and emit its row — pinned green at run.rs:2613. Leg 2 closed a leg 3 cell three phases early; re-refusing lifecycle would regress PHASE-01. plan.toml was amended for this at f3558f3dd (PHASE-04 EN-2 and EX-1 both carry the correction); design.md was not, because the design was locked and is not editable mid-phase. Evidence: PHASE-04 F-1 in notes.md; doctrine slice verify-vt 259 PHASE-04 VT-1/VT-2/VT-3 all PASS against the three-cell implementation."
disposition = "verified"
response = "Confirmed against the tree: three cells, not four. run.rs holds one row-producing path over two priors and a lifecycle declared at creation lands and emits — the green pin at run.rs:2613 is the positive control. The code is right and the design text is stale; re-refusing lifecycle to match sec-3 would regress PHASE-01, so the design moves, not the code. Delegated to /reconcile as a per-slice direct edit on design.md sec-3 ('The state axis'): four cells to three, naming PHASE-01 as what closed the fourth. This is not a licence to rewrite DEC-246 — the ruling (refuse what is inert at the subject's state) is unchanged and correct; only its cell count moved, because leg 2 closed one of its instances before leg 3 reached it. Brief entry written."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "design.md sec-6 says the hoist has no witness; PHASE-06 reproduced one on an axis sec-6 never examined"
detail = "Expected: a slice about an exit signal telling the truth does not leave its own design asserting a negative the implementation refuted. Observed: sec-6 states 'hoisting on principle, not on a witness' and 'That assertion has no witness, and the code is built to deny it', and sec-8 leg 1 repeats it ('sec-6 records that no such instance is reachable'). Both are true of the ONE axis RV-365 F-2 examined — pass 1 vs pass 2 differing in the Resolution handed in. PHASE-06 F-1 found and REPRODUCED a witness on a second axis the design never considered: execute_mint runs once per plan to completion and its step 1 carried SL-249 D8's retry guard, so a two-checkpoint payload whose SECOND plan trips the guard materialises the FIRST plan's record and then refuses. Not a SPEC-029 breach (the spec promises the run does not advance, not that nothing was written) — but it is exactly the thing DEC-250 exists to prevent, and it was real rather than principled. Repaired by refuse_unresumable_mints (design.rs:1315-1334), asked of the whole batch ahead of the loop. The design text needs qualifying BY AXIS, not striking: the pass-1/pass-2 claim survives; the generalisation to 'no witness' does not. PHASE-06 F-2 records that the multi-checkpoint payload was itself an unknown — no fixture in the tree declared two cp- subjects in one declare array — which is why the design could not see it."
disposition = "verified"
response = "Confirmed. The witness is real and was reproduced before it was claimed (PHASE-06 F-1), and the repair is in the tree: refuse_unresumable_mints (design.rs:1315-1334) asks SL-249 D8's retry guard of the whole batch ahead of the mint loop, and execute_mint's step 1 now reads the intent only to route steps 2-5, documented as such. So DEC-250's ruling is unchanged and was DISCHARGED MORE than the design asked — what is wrong is sec-6's supporting claim about the evidence, not the decision it supports. Delegated to /reconcile as a per-slice direct edit: qualify sec-6 and sec-8 leg 1 BY AXIS rather than striking them. The pass-1/pass-2 differential remains unwitnessed (RV-365 F-2 stands, and PHASE-06 F-3 went further by closing it structurally — resolution_of makes both passes' key sets one expression, widest_canonical_id proves the id bound over the whole KINDS table); the mint loop had a witness. Both sentences are true once the axis is named. PHASE-06 EX-5's refusal to manufacture a pass-2 predicate is undisturbed and stays."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "design.md sec-7's code-impact table is short by six source files, a new module and the published contract, and understates commands/design.rs"
detail = "Expected: sec-7 'Code impact' names the design targets the four legs commit to, and sec-9 R0 says every claim in this design is to be re-verified at implementation. Observed: the table names seven source paths; thirteen changed (git diff 138c31e88..503c5a2a3). Unlisted: src/design_run/contract_check.rs (NEW, 445 lines — leg 3's key axis landed as a leaf sibling rather than inside payload_contract as sec-7 assumed), src/design_run/refusal.rs (+137, Refusal::UnknownPayloadKey / InertAtState / UndeclaredTerm), src/design_run/mod.rs (the module declaration), src/design_run/ids.rs (+27, SubjectState landing beside IdKind), src/design_run/gate.rs (join widened to pub(super) so the new refusal renders through the one join rather than a twelfth spelling), src/design_run/render/change_row.rs (+41 — where the STD-003 disclosure ACTUALLY landed; sec-7 attributes it to render/envelope.rs), src/design_run/fixture.rs (+10), install/design-payload-contract.md (the published contract, which EX-3 makes a deliverable: unknown-keys flips from silently-dropped to refused for every installed client). Understated: the commands/design.rs row reads 'apply's check ordering' for a +552-line delta that adds refuse_unresumable_mints, resolution_of and widest_canonical_id and rewrites the module doc. The selector registry was kept current for four of these (contract_check, refusal, mod, install/) at PHASE-03; design.md was not."
disposition = "verified"
response = "Confirmed by diff. Every listed path is a real, deliberate change and none is scope creep — contract_check.rs is where ADR-001's leaf rule forced leg 3's walk to land (EX-5/EX-8 anticipated the question and the sheet answered it), refusal.rs and mod.rs follow it, ids.rs carries SubjectState beside IdKind for PHASE-04, gate.rs's join widened rather than being respelt a twelfth time (STD-001), and change_row.rs is where the STD-003 disclosure actually sits. The defect is that sec-7 is the design's own statement of what it commits to touching and it now under-describes the slice by six files. Delegated to /reconcile as a per-slice direct edit on design.md sec-7: add the eight unlisted rows and widen the commands/design.rs row past 'apply's check ordering'. Pair it with F-4 — sec-7 is the human mirror and the selector registry is what conformance reads, so a prose-only fix leaves the mechanical signal red."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Seven changed source/test paths sit outside every design-target selector, so conformance reads undeclared where the work was deliberate"
detail = "Expected: slice conformance's undeclared cell is a lead to disposition, and a path the slice deliberately changed is declared so the cell stays a signal. Observed: doctrine slice conformance 259 reports 25 undeclared. Seven are real code: src/design_run/fixture.rs, gate.rs, ids.rs, render/change_row.rs, tests.rs, tests/e2e_design_review.rs, tests/e2e_design_state.rs. All seven are covered by scope-relevant selectors (src/design_run/**, tests/e2e_design_*.rs) but conformance reads design-target only, so scope-relevant coverage does not clear them. Each is a real authored-truth delta already named in notes.md Open (ids.rs, gate.rs) or not named at all (fixture.rs, change_row.rs, tests.rs, the two e2e files). The load-bearing fix is the selector registry — doctrine slice selector add, which is what conformance reads (slice-259.toml) — with design.md sec-7 as the human mirror; a prose-only edit leaves conformance red. Separately, doctrine slice selector doctor 259 reports nine redundant design-target selectors, every src/design_run/* path subsumed by the src/design_run/** scope-relevant glob — so the registry is noisy in both directions at once."
disposition = "verified"
response = "Confirmed. All seven paths are deliberate work, so the fix is the registry, not the code. Delegated to /reconcile, and the load-bearing verb is named: doctrine slice selector add for the seven design-target rows (src/design_run/fixture.rs, gate.rs, ids.rs, render/change_row.rs, tests.rs, tests/e2e_design_review.rs, tests/e2e_design_state.rs), with design.md sec-7 (F-3) as the human mirror. Scope-relevant coverage does not clear them: conformance reads design-target only, which is the intended asymmetry — scope-relevant says 'read this', design-target says 'the design commits to changing this'. The nine redundant rows selector doctor reports are a DIFFERENT and lesser thing: every design-target path under src/design_run/ is subsumed by the src/design_run/** scope-relevant glob, which is redundancy across intents rather than within one, and removing the specific rows to silence doctor would delete exactly the design-target signal conformance needs. Leave them; the doctor finding is advisory and is the right tradeoff to accept here. Stated so the next audit does not 'fix' it."

[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Eighteen of conformance's 25 undeclared paths are the slice's own lifecycle artefacts — systemic noise, not this slice's drift"
detail = "Expected: the undeclared cell is 'highest signal'. Observed: 18 of 25 rows are .doctrine/ artefacts every slice necessarily writes — .doctrine/slice/259/notes.md and slice-259.toml, four memory items (8 files), IMP-448's three files, and an observation record. No selector should ever declare these: a design-target selector names code the design commits to, and declaring a slice's own notes.md would make the registry self-referential. Cross-checked against a second slice: doctrine slice conformance 256 shows the identical class (its own slice-256.toml and coverage.toml, ISS-448/ISS-449's six files, three observation records). So this is a platform-level signal-to-noise defect in slice conformance, not SL-259 drift — the cell the skill calls highest-signal is 72% noise here and 77% on SL-256. Every future audit pays the same re-triage. Belongs in the backlog against conformance, not in this slice's reconciliation."
disposition = "follow-up"
response = "Confirmed and systemic — reproduced on SL-256 before being called that, which is why it is not SL-259's to reconcile. Captured as IMP-449 (linked references/originates_from SL-259), carrying the measurement, the reason no selector can legitimately clear these rows, and a stated boundary for the fix: shipped assets (install/, memory/) stay in the signal, the lifecycle's own bookkeeping (.doctrine/slice, backlog, knowledge, observations, review) comes out. Follow-up is the right route on its merits and not because the fix is large: the defect is in the conformance computation, a surface this slice does not touch and whose repair needs its own design conversation about where that boundary sits."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "DEC-252 is proposed, facet-empty and unrelated to anything — the sole in-band account of SL-251's now-red VT-3 is unreachable from either slice"
detail = "Expected: a decision record this slice minted is settled and reachable from the artefacts it governs. Observed: .doctrine/knowledge/decision/252/record-252.toml carries status = 'proposed', a wholly empty [facet] block (context/choice/alternatives/rationale/consequences/decided_by/decided_on all blank) and NO [[relation]] rows at all. Its nine siblings from this slice (DEC-243..DEC-251) are every one 'accepted' with a populated facet and relation edges — DEC-252 is the outlier because it was minted by hand rather than through the design run, which is what writes the shapes edge via apply_record_effects. The content matters: DEC-252's body is the only place recording that SL-251 PHASE-07 VT-3 and its VA-1 companion now read RED by design (the contract walk runs before deserialisation and supersedes serde's message for Declaration, CheckpointActDeclaration and AgentActDeclaration), and its own closing line hands the REV-vs-reconciliation-line question to THIS audit. An auditor re-running SL-251's gate has, today, exactly the no-in-band-route problem the record names as the argument FOR a REV — and it is caused by the missing link, not by the missing revision."
disposition = "verified"
response = "Confirmed, and this audit owes DEC-252 the ruling it asks for. THE RULING: a line in SL-259's reconciliation, NOT a REV. Three reasons, in order of force. (1) A REV is the governance-dependency vehicle (ADR-013) and routes changes to governance and spec entities; SL-251's PHASE-07 VT-3 is a plan criterion, and PHASE-NN / EN- / EX- / VT- ids are immutable-append by the boot rule — there is nothing a REV could legally rewrite, so choosing it would mint a revision that resolves to no write. (2) No governance artefact changed: DEC-225's 'remedy rides the point of failure' rule is intact and DEC-252's own table shows the walk carries strictly MORE than serde did (dotted path, admitting type named, 12 wire types instead of 3), with sec-8 pin 1 holding the printed expectations equal to serde's. (3) The real defect the REV argument points at — 'an auditor re-running SL-251's gate has no in-band way to learn why' — is a LINKING failure, not a revision failure, and it is fixed at a hundredth of the cost. Delegated to /reconcile as a per-slice direct edit, with verbs named: doctrine knowledge settle DEC-252 (status proposed to accepted, facet context/choice/alternatives/rationale/consequences populated from the body it already carries), then doctrine link DEC-252 references --role concerns SL-251 --descriptor '...' and the same to SL-259. Reconcile should also strike DEC-252's closing 'Carried forward' paragraph and replace it with this ruling, so the record stops asking a question that has been answered."

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "Leg 2's rule has a further unemitted material change inside this very file: opening a review pass writes no row"
detail = "Expected, from DEC-248 as sec-4 states it: 'a material change is emitted by the code that performs it'. Observed: run.rs:494-501 assigns next.review.pass on entry to Reviewing — a state change — and emits no change row. ChangeEvent has no opening counterpart; it has ReviewDisposed, whose own doc says 'The row exists so the CHOICE is legible in the log rather than only inside the snapshot'. The same argument applies to the opening and is not made. Two mitigations, neither complete: the StageMoved row records the transition that causes it (the same coverage argument that was available for ISS-450's NodeCreated and was rejected), and the assignment is guarded by 'let Some(review) = resolved.review_pass' — an if-let that silently no-ops when the resolution carries no review ref, which is a second instance of the shape. Not a regression: SL-259 did not touch this site, and design sec-9's closing paragraph predicted exactly this ('the classes here are the ones visible from inside a single run's worth of use. Others may not be'). Raised so the prediction is recorded as having landed, with a concrete site, rather than staying a caution."
disposition = "follow-up"
response = "Confirmed at the site. Captured as ISS-452 (linked references/originates_from SL-259), carrying the code, both partial mitigations and why neither settles it on DEC-248's own terms. Follow-up on merit, not on size: SL-259 did not touch run.rs:494-501, the site is outside all four legs, and the slice's own sec-9 closes by predicting that the classes it fixed are the ones visible from one run's worth of use. Pulling an unrelated emission site into an audit's fix-now would be the instance-by-instance hunt DEC-248 exists to replace, run by the audit instead of by the design. What the issue adds over the prediction is a concrete site, so the next slice in RFC-031 starts from one rather than from a caution."

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "design.md sec-5's 'ChangeEvent is not touched ... every existing pin holds unchanged' is false as written after PHASE-05"
detail = "Expected: the behaviour-preservation claim sec-5 makes is the evidence DEC-251 sited the opacity correctly, so it has to be literally true. Observed: the substance holds and I verified it — ChangeEvent's variant set is unchanged, it is still Copy, const fn as_str(self) -> &'static str survives, both const _: () proofs are present and intact (widest(&READABLE) <= DESIGN_EVENT_NAME_BYTES and is_subset(&EMITTABLE, &READABLE)), and no Opaque variant was added. But the sentence as written is not: PHASE-05 renamed ChangeEvent::ordered to ChangeEvent::shaped and made it FALLIBLE (Result<Vec<PayloadTerm>, Refusal>), absorbing the declared-kind check into the ordering call; and PHASE-02's type change forced pattern edits on two pre-existing snapshot.rs pins ([row] to [StoredRow::Read(row)]). Those two edits are accessor-only and strictly TIGHTEN the pins — they now additionally assert the row reads — so VA-1 holds in intent, which is what notes.md flags for adjudication. The design's claim needs the same by-axis qualification as sec-6 (F-2): the TYPE was not touched; its impl and two pins were."
disposition = "verified"
response = "Confirmed on both halves: the substance holds (variant set closed and unchanged, Copy, const fn as_str, and I read both const _: () proofs in change_log.rs — widest(&READABLE) <= DESIGN_EVENT_NAME_BYTES and is_subset(&EMITTABLE, &READABLE) — intact, no Opaque variant), and the sentence does not. The two forced snapshot.rs pin edits ([row] to [StoredRow::Read(row)]) TIGHTEN rather than weaken: they now additionally assert the row reads, which is strictly more than they asserted before, so PHASE-02 VA-1's behaviour-preservation gate is discharged in substance and notes.md was right to flag the literal wording for adjudication rather than to claim it. That adjudication is: VA-1 HOLDS. Delegated to /reconcile as a per-slice direct edit on design.md sec-5, same by-axis treatment as F-2 — the TYPE is untouched (which is what DEC-251's siting argument needs), its impl gained a fallible shaped() at PHASE-05, and two pins were re-patterned. Say all three."

[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "DEC-250's consequences array carries one sentence split across two elements at an embedded comma"
detail = "Expected: a durable governance record reproduces what its author wrote. Observed: .doctrine/knowledge/decision/250/record-250.toml consequences[2] ends '... it does NOT manufacture a pass-1-clears/pass-2-fails case' and consequences[3] is ' since a pin over a manufactured predicate proves only that the manufacture worked.' — one sentence, split at its internal comma, the second fragment retaining its leading space. Cosmetic in effect; notable in kind, because DEC-250 is this slice's own leg-1 ruling and the mangling looks like input splitting on an embedded comma, which is the silent-input-absorption class SL-259 exists to close, in the path that recorded its rulings. I did not establish the mechanism (the record was written through the design run's facet payload, where a JSON array should not split), so this is an observation with an unverified cause, not a diagnosis."
disposition = "verified"
response = "Confirmed by reading the file. Effect is cosmetic — the record is fully legible and the sentence recoverable by concatenation — so this is a repair, not a defect to investigate. Delegated to /reconcile as a per-slice direct edit: join DEC-250's consequences[2] and [3] into one element. Deliberately NOT chasing the mechanism: I did not establish that anything split the input (the facet arrived through the design run's JSON payload, where an array element should not split on a comma), and filing a tooling issue on an unreproduced cause would be the plausible-story move this slice spent six phases refusing. If reconcile finds the same shape in a second record while editing, that is the point to escalate it."

