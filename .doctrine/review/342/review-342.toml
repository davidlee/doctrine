[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Nothing verifies that payload term declarations agree with their construction sites; the test that appears to is tautological"
detail = """
ChangeEvent::payload_terms() declares a (PayloadKey, ValueKind) pair per term, and PayloadTerm constructors at the call sites in run.rs build the actual terms. Nothing checks the two agree. The bound each term is admitted against, and the worst case the byte budget is proven for, both follow from the declared ValueKind.

The one test that looks like it closes this does not. tests/e2e_design_state.rs:1057 rendered_payload_fits_its_cap_for_every_event_kind iterates ChangeEvent::ALL and, for each declared (key, kind), constructs a saturated term OF THAT DECLARED KIND. It derives construction from the declaration, so a call site that builds a different kind is invisible to it. The test is tautological with respect to the property it appears to guard.

This is not theoretical. At the PHASE-16 commit 63b348de6 the runbook step id was declared (PayloadKey::Step, ValueKind::Token) in change_log.rs while run.rs:1441 built it with PayloadTerm::label, whose bound DESIGN_STAGE_LABEL_BYTES is 16 rather than the Token bound of 32. RUNBOOK_STEP_ID_BYTES was 64 at the same commit, so a step id of 17 to 64 bytes passed validate_step_id and was then refused at admission -- refused at execution rather than at validation, which is what EX-3 exists to forbid. Three numbers disagreed (64, 32, 16) and the phase shipped green.

Nothing in the suite caught it. It was found and repaired two phases later by a human review pass, at 3516a8b33 fix(SL-233): PHASE-08 F-P08.2 -- a step id is an identity, not a label, which is outside the PHASE-16 range. So the gap has a demonstrated escape, not merely a hypothetical one.

The instance that remains at head is benign only by luck of an inequality nobody chose deliberately. StepDischarged still declares (PayloadKey::Outcome, ValueKind::Token) at change_log.rs:217 while run.rs:1442 builds it with PayloadTerm::label. The budget proof therefore saturates Outcome at 32 bytes where reality maxes at 16, so it OVERSTATES the worst case and the bound still holds. Had the mismatch pointed the other way, as the Step one did, the proof would be unsound and silent.

Adjacent to ISS-290, which is this exact live instance held unrepaired pending an owner ruling, and to RV-341 F-2, which names the constructor seam that permits the class. Neither is this finding: ISS-290 is the instance, RV-341 F-2 is the seam, and this is the absence of any verification that would detect either.

Repro, the tautology:
  cd /workspace/doctrine/.dispatch/SL-233
  sed -n 1057,1070p tests/e2e_design_state.rs

Repro, the historical escape and its repair:
  git show 63b348de6:src/design_run/runbook.rs | grep -n RUNBOOK_STEP_ID_BYTES
  git show 63b348de6:src/design_run/run.rs | grep -n PayloadKey::Step
  git log --oneline -1 -S"RUNBOOK_STEP_ID_BYTES: usize = 64" -- src/design_run/runbook.rs

Positive control, that the two bounds genuinely differ and the search finds them:
  rg -n "DESIGN_ID_BYTES|DESIGN_STAGE_LABEL_BYTES" src/design_run/bounds.rs
  -> 32 and 16 respectively

Surfaced by the S2 cheap tier across two independent passes: pass B on PHASE-16 found the historical instance and correctly noted it was already repaired; the structural claim and the tautology were established by hand during adjudication."""
disposition = "deferred"
response = "UPHELD, deferred to ISS-290 rather than to a new item, because one repair closes this, ISS-290 and RV-341 F-2 together and three parallel items would be three parallel implementations of one fix. ISS-290 already records the tautology in the same terms: the only reader other than key order saturates from the DECLARED kinds rather than comparing them to anything real. What this finding adds, and what is now appended to ISS-290, is that the gap has a DEMONSTRATED ESCAPE and not a hypothetical one: at 63b348de6 three numbers disagreed, 64 and 32 and 16, a step id of 17 to 64 bytes passed validate_step_id and was then refused at admission, which is refusal at execution rather than at validation and is what EX-3 exists to forbid, and the phase shipped green. A human pass caught it two phases later, outside the PHASE-16 range. The remaining Outcome instance is benign only by an inequality nobody chose, so the budget proof OVERSTATES its worst case and holds by luck rather than by construction. The fix direction is agreed and recorded: take the kind FROM the declaration so the mismatch is unrepresentable, rather than adding a check that has to be remembered."

[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "EX-16 runbook clause is the machines first non-cumulative condition and nothing pins its non-blocking half"
detail = """
gate::advance evaluates the runbook clearance clause on THIS edge only, deliberately outside cumulative_conditions. The code says so at src/design_run/gate.rs:304-312: it deliberately does NOT join cumulative_conditions, because a prose edit to an explore step must not block a boundary two stages later, and it names itself the first non-cumulative condition in the machine (EX-16).

That is a real departure from how every other condition in the machine works, and it is load-bearing: it is the difference between a stale step warning and a stale step blocking an unrelated later transition.

The rendering half is covered -- the envelope surfaces stale, and tests/e2e_design_runbook.rs exercises stale in ten places. The EVALUATION half is pinned by nothing. No test advances a run past Exploring, edits an explore step definition to make its prior discharge stale, and then asserts that the Drafting to Reviewing boundary is NOT blocked. The guarantee survives only as the structure of the if boundary_runbook(from, to).is_some() block plus a comment.

The failure mode this leaves open is a refactor that folds the runbook clause into cumulative_conditions for uniformity. Nothing would go red, and the machine would silently start blocking later boundaries on stale earlier rituals. The comment explains why that is wrong; no test enforces it.

Repro, the structural guarantee and its comment:
  cd /workspace/doctrine/.dispatch/SL-233
  sed -n 300,332p src/design_run/gate.rs

Repro, the absence of any test on the evaluation half:
  rg -n cumulative_conditions tests/
  -> no hits

Positive control, that the search reaches the right places and stale IS otherwise exercised:
  rg -n cumulative_conditions src/design_run/gate.rs   -> hits at 214, 305, 325
  rg -c stale tests/e2e_design_runbook.rs              -> 10

Raised from an S2 cheap-tier candidate (pass A on PHASE-16, C-5) and verified against source during adjudication."""
disposition = "deferred"
response = "UPHELD, deferred to IMP-379. The asymmetry is real and load-bearing: gate::advance evaluates the runbook clearance clause on this edge only, deliberately outside cumulative_conditions, and that is the difference between a stale step warning and a stale step blocking an unrelated later transition. The rendering half is exercised ten ways; the evaluation half survives only as the shape of an if block plus a comment, so the refactor that folds it back in for uniformity would go green while silently changing the machine. Not repaired in-slice because all 16 phases are completed and this is new test surface against an EX-16 guarantee, not a defect in landed code. IMP-379 carries the measurement, the positive control and the shape of the missing test."

[[finding]]
id = "F-3"
status = "answered"
severity = "nit"
title = "Discharge::verified records a hardcoded exit 0 rather than the observed exit code"
detail = """
src/design_run/run.rs:1419 calls Discharge::verified(facts.key, &declared.step, digest, revision, 0, checked.output.clone()) -- a literal 0 for the exit code. The constructor at src/design_run/runbook.rs:737 takes exit: i32 explicitly and stores Some(exit) on the record.

The guard immediately above, at run.rs:1411, returns Refusal::VerifierFailed unless checked.exit == Some(0), so the literal is correct today and no behaviour is wrong. The objection is that the record then carries a CONCLUSION rather than the OBSERVATION: the discharge record is the auditable trace of what the verifier actually did, and it is being written from what the code decided rather than from what was measured. The explicit exit parameter is wasted, and a future relaxation of the guard -- for instance accepting a set of success codes -- would silently record 0 for a non-zero exit that was deemed acceptable.

checked.exit is already in hand at the call site, so the honest form costs nothing.

Repro:
  cd /workspace/doctrine/.dispatch/SL-233
  sed -n 1411,1427p src/design_run/run.rs

Positive control, that the constructor really does take an exit code rather than deriving one:
  rg -n "fn verified" -A 10 src/design_run/runbook.rs
  -> exit: i32 parameter, stored as exit: Some(exit)

Raised from an S2 cheap-tier candidate (pass A on PHASE-16, C-3) and verified against source during adjudication."""
disposition = "fixed"
response = "FIXED at 4f2816efa. The guard above the call now BINDS the code it checked, via let Some(exit) = checked.exit.filter(code == 0), and Discharge::verified records that binding rather than a literal 0. Upheld as stated: the record is the auditable trace of what the verifier did, so it must carry the OBSERVATION and not the guard conclusion. The future relaxation the finding names, accepting a set of success codes, now changes only the predicate and cannot leave the record asserting 0 for a non-zero exit."

[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "PHASE-05 checkpoint has a deterministically unrecoverable crash window, and the EX-8 fault seam cannot reach it"
detail = '''
execute_checkpoint step 4 has a window in which an interruption leaves the run permanently stuck, and the EX-8 fault seam cannot express that window, so no test can reach it.

THE WINDOW. In the first-attempt Create branch (src/commands/design.rs:898-921), crate::knowledge::create_record claims the id, journals Reserved from inside the on_reserved callback, and then materialises the record to disk. Only after create_record RETURNS does line 921 journal the Materialised transition. An interruption between those two events leaves the record fully written on disk while the journal still says Reserved.

WHY RETRY CANNOT RECOVER. On retry the intent state is Reserved, so control takes the resume branch at line 923 (state below Materialised). That branch calls knowledge::materialise_record_at, which calls entity::materialise with MaterialiseRequest::InExisting, which reaches refuse_clobber at src/entity.rs:576. refuse_clobber bails with Refusing to overwrite existing whenever any artifact target already exists (src/entity.rs:635-644). Every subsequent retry takes the same branch and fails the same way. Recovery requires hand-repair of the journal or the tree.

REACHABILITY. This is not only a power-loss window. The two writes are separated by ordinary user-interruptible work, so a SIGINT lands there; the binary installs no handler, so Ctrl-C at that instant bricks the checkpoint.

WHY NO TEST CAN CATCH IT. EX-8 supplies six named fault points and every one fires BEFORE the effect it names. Both RecordMaterialise sites do: line 913 fires inside the on_reserved callback, which runs before create_record writes anything, and line 931 fires before materialise_record_at in the resume branch. There is no fault point between record-on-disk and journal-says-Materialised, so the unrecoverable window is unreachable through the fault seam by construction.

THE TEST THAT APPEARS TO COVER IT COVERS ONLY THE EASY HALF. post_journal_recovery_resumes_the_exact_reserved_id crashes at record-materialise, which is before the write, so it exercises retry with nothing on disk, where materialise succeeds. The hard half, interruption AFTER the write, is exactly the half that cannot be reached and is not asserted.

SCOPE. This does not violate EX-2 or EX-3 as literally worded: the id IS journalled before the record exists, and recovery DOES resume against the reserved id rather than claiming a fresh one. It defeats the stated objective, DEC-083 and DEC-086 recoverable checkpoint, in the one window where recovery is impossible.

REPRO:
  cd /workspace/doctrine/.dispatch/SL-233
  sed -n 898,935p src/commands/design.rs
  sed -n 633,644p src/entity.rs
  rg -n "fault\(CheckpointStep::" src/commands/design.rs

POSITIVE CONTROL, that the fault seam is genuinely fireable and the search finds every site: rg -n "fault\(CheckpointStep::" src/commands/design.rs returns eight sites (881, 893, 901, 904, 913, 931, 946, 1318), and reading each shows all eight precede their effect. In range: git diff cb45bc958..ba2d9ba9a -- src/commands/design.rs returns 529 changed lines including both the create_record call and the Materialised journal write.

PROVENANCE. S3 pass B on PHASE-05 raised the window (its C-1, rated minor). Pass A independently confirmed EX-2, EX-3 and EX-8 CLEAN and in doing so stated the very fact that makes the finding true, that each fault fires immediately before that step effect, reading it as confirmation rather than as a gap. The untestable-by-construction half and the observation that the recovery test exercises only the recoverable direction came from reading the two passes against each other, then verifying refuse_clobber and all eight fault sites by hand. Adjacent to RV-342 F-2 in shape, a guarantee that survives as structure with no test able to pin it.'''
disposition = "deferred"
response = "UPHELD, and the owner ruling is REPAIR rather than tolerate, deferred to ISS-295. Verified by hand: CheckpointStep carries exactly six variants and all eight call sites fire BEFORE their effect, so the window is unreachable through the fault seam by construction, and refuse_clobber bails whenever any artifact target exists, so every retry fails identically. Two facts make this worse than the DEC-100 window that was lawfully tolerated for v0.0.1: it is DETERMINISTICALLY unrecoverable without hand-repair of the journal or the tree, and it is reachable by an ordinary Ctrl-C because the two writes are separated by user-interruptible work and no handler is installed. Not repaired in-slice for three reasons, only one of which is size. It needs a SEVENTH fault point, which amends EX-8 on a completed phase. It spans commands/design.rs, knowledge.rs and entity.rs, and entity.rs is shared machinery under the behaviour-preservation gate. And it contains an unsettled design fork: on resume with the record already on disk, adopt or refuse or overwrite, where overwrite is precisely what D7 no-silent-clobber exists to prevent since a retry days later would eat hand edits, and the partial-write case bricks identically but must not be adopted. ISS-295 carries the window, the reachability, the fork and a sketch of adopt-if-complete and refuse-if-partial."

[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "A PHASE-07 receipt assertion is satisfied by a substring of an unrelated line, so it pins nothing; proven by mutation"
detail = """
The current-receipt leg of known_fragment_receipt_omits_body_stale_receipt_reemits (tests/e2e_claude_install.rs:487) asserts held.contains(format!("fragment {current}")) where current is inquiry@DIGEST. It is meant to pin the identity-is-never-elided behaviour of fragment_section, namely that the header stays when the body is withheld.

It cannot fail. run_resume calls fragment_lines and fragment_section back to back on the same slice (src/commands/design.rs:1619-1620), both receiving the raw args.known_fragment strings. fragment_lines formats known_fragment {name} ... where name is the whole receipt string inquiry@DIGEST (src/commands/design.rs:1848-1865). The rendered line therefore contains the needle fragment inquiry@DIGEST as a substring of the token known_fragment, at offset 6. Both of its branches do:
  known_fragment inquiry@DIGEST NOT held by this run  -> contains the needle
  known_fragment inquiry@DIGEST held digest deadbeef  -> contains the needle
So the assertion is satisfied by fragment_lines output alone, unconditionally, whatever fragment_section does.

PROVEN BY MUTATION, not by argument. Mutating fragment_section to elide the header exactly when the body is withheld, that is deleting the behaviour the test names:
  if holds_current { return Ok(Vec::new()); }
  Ok(vec![format!("fragment {}", fragment.receipt(&digest)), body])
then running cargo test --test e2e_claude_install known_fragment_receipt_omits_body_stale_receipt_reemits gives: test result: ok. 1 passed.

POSITIVE CONTROL on that mutation result, because a pass proves nothing unless the harness can fail. Replacing the body of fragment_section with Ok(Vec::new()) unconditionally makes the same command report: test result: FAILED. 1 failed. So the test binary genuinely rebuilds and observes edits to that function, and the earlier pass is real rather than a stale artefact. Source was restored from backup afterwards and the full file is green, nine of nine.

WHAT REMAINS COVERED. The cold leg independently exercises fragment_section through emitted_fragment_digest, which panics on absence, so the function is not untested; and the body-omission and stale-re-emission assertions are sound. It is specifically the header-presence claim on the current-receipt leg that measures the wrong producer. A one-word fix, asserting on a line-anchored match rather than a bare substring, restores it.

IN RANGE: git diff 4435904cd..35ef61cac -- tests/e2e_claude_install.rs shows the test added by PHASE-07, and the assertion is present unchanged at head.

PROVENANCE. S3 pass A on PHASE-07 raised this as its sole candidate, citing only the NOT-held branch. Pass B examined the same test in its class (g) sweep, enumerated four ways it would fail, and returned CLEAN. The mutation, the positive control, and the observation that BOTH fragment_lines branches satisfy the needle were established during adjudication. This is the class IMP-024 section 4a calls catchable by a second pass: pass B held the evidence and misread it."""
disposition = "fixed"
response = "FIXED at 4f2816efa, and the repair carries its own positive control. The assertion is now line-anchored: held.lines().any(line starts_with fragment CURRENT) rather than a bare contains, which was satisfied unconditionally by the known_fragment CURRENT line that fragment_lines emits on both of its branches. VERIFIED BY THE FINDING OWN MUTATION: eliding the header in fragment_section when the body is withheld, which deletes exactly the behaviour the test names, now yields FAILED where the finding measured ok. Source restored, file green 9 of 9. A comment records why it must stay anchored."

[[finding]]
id = "F-6"
status = "answered"
severity = "nit"
title = "The acceptance attestation digest is computed over an empty string when the declaration fails to serialise"
detail = """
At src/commands/design.rs:834-838 the acceptance attestation payload is built as:
  crate::git::sha256(serde_json::to_string(declaration).unwrap_or_default().as_bytes())

A serialisation error is discarded and becomes the empty string, so the payload digest silently becomes sha256 of nothing, the constant e3b0c442..., for ANY declaration that fails to serialise. That payload then feeds acceptance_digest and is bound into an AcceptanceAttestation, which is an auditable integrity artefact: two different declarations that both failed to serialise would produce identical attestations, and nothing would say so.

Reachability is low. declaration serialises through a derived Serialize over owned string and enum fields, so serde_json only errors in exotic cases. The objection is not the probability, it is that a discarded Result on the input to an attestation digest is the one place a silent default costs nothing to avoid: the enclosing function already returns Result, so the fix is the question mark operator.

Class (a), a swallowed Result. NOT the corpus entry: prior-findings records unwrap_or_default swallowing PARSE refusals in PHASE-13 (PHASE-13 F-3 and F-6, and that instance is repaired at head, now map_err into refusal). This is a different site, a different value, and live at head. Adjacent to IMP-367, which records that AcceptanceAttestation::basis, the auditable half of DEC-088, has no reader at all.

IN RANGE, and this is the interesting part:
  git diff cb45bc958..ba2d9ba9a -- src/commands/design.rs | grep -n "to_string(declaration)"
  -> 338:+                serde_json::to_string(declaration)
POSITIVE CONTROL that the range diff is non-empty and the search works: the same diff returns 529 changed lines.

PROVENANCE, and a correction to the campaign record. Both S3 PHASE-05 passes raised this independently (pass A C-1, pass B C-2). It is the SAME line both S2 PHASE-04 passes converged on, which S2 adjudication correctly ruled out of the PHASE-04 range and therefore discarded. It was never out of scope for the campaign, only mis-attributed: the line is added by PHASE-05. IMP-024 section 4b cites that convergence as its example of worthless agreement on an out-of-scope finding. That reading holds for PHASE-04 and should be read alongside this: the finding was real, and phase-scoped ranges plus a mandatory scope gate are what located it."""
disposition = "fixed"
response = "FIXED at 4f2816efa. The closure now returns Result and propagates through transpose, so a serialisation failure refuses instead of digesting the empty string. Upheld on the stated ground rather than on probability: the objection was never reachability, it was that a discarded Result on the INPUT TO AN ATTESTATION DIGEST makes two different failed declarations attest identically with nothing saying so. The enclosing plan_checkpoints already returned Result, so the fix cost one question mark."

[[finding]]
id = "F-7"
status = "answered"
severity = "minor"
title = "PHASE-15 ships a comment citing a decision the same phase superseded, and the DEC reseat renumbered the reference without retargeting it"
detail = """
src/commands/design.rs:1496 carries the comment: DEC-105 as revised (D7-R): re-baseline only to bytes demonstrably on disk. DEC-105 reads status = superseded, superseded_by = DEC-100. The live record describing what PHASE-15 actually shipped is DEC-100, Materialise tolerates the check-to-rename lost-update window.

ALREADY STALE WHEN WRITTEN, NOT MERELY OVERTAKEN. The comment was added by this phase, as DEC-099. At the phase tip 540aed959 the record it cited ALREADY read status = superseded, superseded_by = DEC-100. The same phase that wrote the comment superseded the record the comment points at.

STILL LIVE AT HEAD, AND THE THING THAT LOOKS LIKE A REPAIR IS NOT ONE. The DEC reseat at b8cfbf3d8 renumbered DEC-099 to DEC-105 across the authored source, so the comment now reads DEC-105. The sweep reached this file and worked exactly as intended. It renumbered the reference without retargeting it, so a correct-looking sweep preserved the staleness. A reader following the citation lands on a superseded record whose mechanism, a writer lock plus a compare-and-swap, is precisely what did NOT land, while the tolerance that did land is recorded only in DEC-100.

The code is correct. This is a citation defect sitting on the one comment that explains a deliberately tolerated data-loss window, which is where a wrong pointer is worth the most and costs the most.

REPRO:
  cd /workspace/doctrine/.dispatch/SL-233
  sed -n 1496p src/commands/design.rs
  rg -N status .doctrine/knowledge/decision/105/record-105.toml
  git show 540aed959:.doctrine/knowledge/decision/099/record-099.toml

POSITIVE CONTROL that the search works rather than merely missing: rg -c DEC-099 src/commands/design.rs returns 0, while rg -c DEC-105 src/commands/design.rs returns 1.

IN RANGE: git diff 7a8a7fe52..540aed959 -- src/commands/design.rs | grep -n DEC-099 returns 225:+ the comment line. Control: the same diff reports 1 file changed, 152 insertions, 35 deletions.

NOT THE DEDUP ENTRY. prior-findings section 0 records that the gitignored runtime phase sheets were missed by the reseat while authored files are clean. Both halves are true and neither is this: the sweep DID reach this file. The defect is that a renumber is not a retarget.

PROVENANCE. S4 pass B on PHASE-15 raised this as its C-2 and then dismissed it in its own current: line as REPAIRED AT HEAD, reading the reseat commit as having deleted the line. The reseat deleted the string DEC-099, not the stale reference. Pass A did not find it at all. This is the exact mirror of the S3 case in which a pass rated an already-repaired defect major: here a pass rated a live defect history. The template instruction that a later-repaired defect is history and not a severity helps in one direction and can mislead in the other, and the settling move in both directions is the same, which is to read current state rather than to reason about it."""
disposition = "fixed"
response = "FIXED at 4f2816efa. The comment now cites DEC-100, the record describing what actually landed, and names DEC-105 explicitly as the superseded one whose writer-lock-plus-CAS mechanism did NOT land, so the next reader does not re-follow it. Upheld in full, including the sharp part: the DEC reseat renumbered DEC-099 to DEC-105 across authored source and reached this file, so a CORRECT sweep preserved the staleness. A renumber is not a retarget. The generalisation is recorded as mem.pattern.doctrine.reseat-renumbers-does-not-retarget, whose check is not whether the old id is gone, which is a claim about the search, but whether the cited record is accepted."

[[finding]]
id = "F-8"
status = "answered"
severity = "nit"
title = "A PHASE-15 doc comment names entry_text, a function the same phase renamed out of existence"
detail = """
src/design_run/legacy.rs:311 carries a doc comment on continues_id reading: The single source of that boundary for both readers here. [entry_text] gets the property for free. No function named entry_text exists anywhere in the crate. PHASE-15 renamed it to entry_label_and_text in this same diff, and the doc line naming the old name is itself one of the phase additions.

REPRO:
  cd /workspace/doctrine/.dispatch/SL-233
  rg -n entry_text src/design_run/legacy.rs
  rg -n fn.entry_text src/

The first returns exactly one hit, line 311, which is the doc comment itself. The second returns nothing.

POSITIVE CONTROL that the search works and the renamed function is present: rg -n fn.entry_label_and_text src/ returns src/design_run/legacy.rs:255, and rg -c entry_label_and_text src/design_run/legacy.rs returns 2, being the definition and its call site.

IN RANGE: git diff 7a8a7fe52..540aed959 -- src/design_run/legacy.rs shows the doc line as an addition at diff line 67.

CURRENT: live at head. git diff --shortstat 540aed959..HEAD -- src/design_run/legacy.rs is empty, so no later phase touched the file. Control: the same command against src/commands/design.rs reports 1 file changed, 191 insertions, 2 deletions.

THE CLAIM IS DELIBERATELY NARROW. It is stated as a reference to a function that does not exist, which is directly measurable. Whether rustdoc emits an unresolved-link warning for an intra-doc link on a private item was NOT measured, so that is not part of the warrant. One of the two passes offered it as the warrant; it is dropped here rather than inherited.

PROVENANCE. Both S4 PHASE-15 passes raised this independently, A as its C-1 and B as its C-1. Per IMP-024 section 4a that convergence is weak evidence rather than confirmation, so it was settled by measurement and not by agreement, which was the right call: the two passes also flatly disagreed about whether it survives at head, B asserting in one line that a head-level search returns zero hits and in the next line that it is still present at head. The measurement above resolves that contradiction in favour of still present."""
disposition = "fixed"
response = "FIXED at 4f2816efa. The doc comment now names entry_label_and_text. Confirmed live at head before repair by measurement rather than by either pass assertion, the two having contradicted each other on survival: 1 hit for entry_text at legacy.rs:311, control 2 hits for entry_label_and_text being the definition and its call site."

# Findings are append-only `[[finding]]` tables, added by `review raise` (PHASE-03).
# Empty here at creation — a fresh review is Active, awaiting the raiser (D-C8).
