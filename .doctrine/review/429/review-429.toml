[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Routed review findings do not fit the source and quote contract"
detail = """
Raiser: codex; the existing RV-429 declares the generic raiser role, used for the write assertion.

Expected: instrument-routed design findings must survive extraction without copying their criterion sketches into design.md or inventing design-section provenance.

Verified evidence: .doctrine/slice/287/design.md:55 and :80-82 define source as a design-run section id plus heading; :110-114 also requires routed design-review findings to become quoted commitment rows whose source names the finding. The universal fidelity check at :209-212 requires every quote to occur verbatim in design.md. In contrast, install/design-prompts/reviewing.md, 'What the machine will reject', explicitly keeps instrument-routed criterion sketches and placement constraints on the RV rather than repairing them into design.md; plugins/doctrine/skills/plan/SKILL.md:43-53 tells planning to read those finding responses and transcribe the obligations.

Failure scenario (inference): a slice has a probe/control/demonstrate response whose criterion sketch exists only on its design RV. Extracting that obligation exactly requires a quote from the RV response, which cannot pass the specified design.md-only quote check and has no design-section source of the prescribed form. Quoting a related design passage instead does not preserve the routed sketch/placement constraint; copying the sketch into design.md conflicts with the existing review procedure. This occurs even on initial extraction, before any design revision or supersession, and is distinct from the historical-row refresh defect.

Specify the RV-origin source variant and exactly which response text the row quotes, retain the review/finding identity and placement constraint, and define source-appropriate fidelity and change checks for it. Include a concrete RV-origin example beside the design-origin example. Do not solve the mismatch by requiring routed obligations to be duplicated into the design.

Suggested route: review. This is a source-contract conflict in the proposed guidance, not a claim about an implemented parser."""
