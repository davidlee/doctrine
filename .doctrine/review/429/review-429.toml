[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Refresh cannot distinguish current commitments from extraction history"
detail = """
Raiser: codex; the existing RV-429 declares the generic raiser role, used for the write assertion.

Expected: the F-1 refresh repair must reach a current ledger after an authorised revision, while preserving history and discovering new commitments.

Verified design-contract evidence: .doctrine/slice/287/design.md:80-85 makes quotes immutable and records extracted-section fingerprints; :209-214 checks every stored quote against current design.md and compares every recorded extracted fingerprint; :215-219 retains the predecessor, appends an intent variance naming its replacement, and adds a new-id row. Neither this section nor the cross-check at :127-140 defines a governing subset that excludes superseded commitments. The phase-sheet pointer at :198 likewise copies the phase's rows without distinguishing history.

Counterexample (inference from those rules, also walked through in memory with a read-only Python expression): C-01 quotes 'The retry limit is three.' The revised design says 'The retry limit is five.' Refresh retains C-01, appends 'superseded by C-02', and adds C-02. The next every-quote check still fails on C-01; re-stamping fingerprints cannot repair it. A removed commitment with no successor has no stated disposition either. Conversely, if the revision adds sec-10 while all previously recorded sections are unchanged, comparing only recorded extracted fingerprints and checking surviving quotes detects nothing, so the new section's commitments escape extraction.

This is a defect in the remedy added for F-1, not a repeat of the original missing-refresh finding. Define how append-only history yields the governing commitment set (including withdrawal without replacement), use that set for fidelity/coverage/runtime-sheet selection, and reconcile the complete current section-id set against the recorded set so additions/removals are handled. Preserve historical quotes without demanding that superseded text occur in the current design. Walk through replacement, deletion and new-section cases against the revised procedure.

Suggested route: review. These are contradictory/incomplete procedure rules, established at design level; no implementation or runtime behaviour is asserted."""
disposition = "fix-now"
route = "review"
response = "Fixed at run revision 36. sec-2: new governing-set rule — an intent variance with retires=true ends its commitment (superseded with a successor id, withdrawn without); retired rows keep their quote as history and are exempt from satisfaction, coverage, quote checks and phase-sheet copying. Variance example gains retires/successor. sec-3: coverage runs over the governing set. sec-5 Detect: stale if the current section-id set differs from [[extracted]] (added/removed section), a fingerprint differs, a governing row's quote is gone from its source, or a routed finding has no governing row; fallback uses design.md section markers. Refresh: extract added/changed sections; retire rows whose quote is gone or whose section was removed (successor or none); add new rows; re-stamp [[extracted]] to the current set. Walked: replacement (C-01 retired, C-02 checked), withdrawal (retires, no successor), new sec-10 (set mismatch, extract), removed section (rows retired). /phase-plan copies governing rows only."

