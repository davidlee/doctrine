[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "Note the ledger's orchestration seam, proportionate and host-directed"
detail = """
Raised by the user (human reviewer), 2026-11-08: the procedure has a natural orchestration seam. The planner could write the ledger itself, appoint one delegate, or one delegate per design section; it might have a second agent check the transcription (quotes, satisfaction sites) for errors, or another check sequencing implications. Doctrine should not prescribe which: these are exactly where host directives (project or harness conventions, e.g. which delegate mechanism to use) should influence how doctrine is applied. The design should note the opportunity for orchestration proportionate to the slice's scope, without naming any harness or delegate mechanism (POL-003).
"""
disposition = "fix-now"
response = """
Fixed at run revision 31. sec-3 (authoring procedure) gains an "Orchestration seam" paragraph: the steps divide cleanly, so delegation proportionate to slice scope is an opportunity - planner alone, one delegate, one per section, a separate transcription or sequencing check - with the split and mechanism left to host directives; the plan review is the same seam. sec-6 adds POL-003: neutral terms only, no harness or delegate mechanism named.
"""

