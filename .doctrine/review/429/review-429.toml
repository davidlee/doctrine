route = "review"
response = "Contest accepted: containment misses an appended amendment. Fixed at run revision 39 (spacing normalised at 41). sec-2: a review row's quote is the whole current response, and its check is equality with the response in doctrine review show RV -f F-n, not containment, so an appended amendment is a change; example quote reworded to the whole response. sec-5 Detect splits the quote predicate: design rows by verbatim containment in design.md, review rows by equality with the response. Refresh extracts each amended response, and the retiring intent variance's basis may be the amended review response, no design revision needed. Walked your counterexample: append to C-07's response, equality fails, C-07 retired with successor C-NN quoting the new whole response, mappings re-cross-checked."

