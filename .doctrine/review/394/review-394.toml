id    = 394
slug  = "sl-266-conformance-audit"
title = "SL-266 conformance audit"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
concluded = true

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-266"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected design sec-3 rule 2 to state the as-built drop; observed it still states the rail-less form DEC-307 amended away"
detail = "The tree rendering, rule 2: dropped text is described without rails. At PHASE-02 VH-1 the user amended DEC-307 so dropped text keeps its rails (commit 4362c2516, d4c6f8ba9); render/tree.rs implements the amended rule. Design prose is stale."
disposition = "verified"
response = "Observation confirmed. Remediation delegated to /reconcile — Reconciliation Brief, per-slice: design.md sec-3 rule 2."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected design sec-4 to state the run-scan skip rules; observed two PHASE-03 rules absent"
detail = "Command surface and run resolution: the no-slice scan also skips a run whose slice record is unreadable and a snapshot naming another slice (RV-392 F-1/F-3 fixes, 6d9bf2db0; state.rs + commands/design.rs select_run). Neither rule is in sec-4."
disposition = "verified"
response = "Observation confirmed. Remediation delegated to /reconcile — Reconciliation Brief, per-slice: design.md sec-4."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected design sec-5 to name the as-built config read; observed it spells load_doctrine_toml(root)?"
detail = "Delivery, config: sec-5 says the design writes resolve [design] via load_doctrine_toml(root)?. RV-393 F-4 (user's choice) replaced that with dtoml::load_design_entry (a bare-table read of only the [design] entry), so an unrelated table's shape error no longer refuses design start/apply. DoctrineToml no longer has a design field."
disposition = "verified"
response = "Observation confirmed. Remediation delegated to /reconcile — Reconciliation Brief, per-slice: design.md sec-5."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected every SL-266 source touch to sit under a design-target selector; observed eight undeclared"
detail = "slice conformance 266 undeclared includes SL-266's own edits: src/commands/guard.rs (Tree read-only guard arm), src/knowledge.rs (title lookup via read_record), src/slice.rs (status reader for the scan), src/design_run/tests.rs (map_changed table), tests/e2e_design_tree.rs, tests/e2e_design_show_golden.rs, tests/e2e_subcommand_help.rs, tests/design_fixture/mod.rs. All are small supporting seams / tests for decided behaviour; the selector registry and sec-6's list omit them."
disposition = "verified"
response = "Observation confirmed; the touches are in scope (supporting seams + tests for decided behaviour). Remediation delegated to /reconcile — Brief: slice selector add (load-bearing) + sec-6 mirror."

[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "Expected every design-target selector to be delivered; observed src/design_run/run.rs undelivered"
detail = "Code impact row places map_changed in 'src/design_run/mod.rs (or run.rs)'; PHASE-04 put it in mod.rs, so run.rs was never touched. The selector (and its sec-6 mirror) over-declares."
disposition = "verified"
response = "Observation confirmed; design allowed mod.rs. Remediation delegated to /reconcile — Brief: slice selector rm src/design_run/run.rs + sec-6 mirror."

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Expected phase delta ranges to contain only SL-266 commits; observed PHASE-02/03 ranges span foreign commits"
detail = "PHASE-02 range d16e3e916..c47451f1a includes 187f05f91, e4fa00d7a, b4fc216df (SL-267) and dc837a3ff (SL-264); PHASE-03 range 599dfb5c8..6d9bf2db0 includes bd4c4600c, 1f2a9000f (SL-267). These account for every undeclared path outside SL-266's own (ADR-024, DEC-311..316, SL-267 plan/notes, publication/manifest.toml, install/shipped-corpus-authoring.md, install/design-run-obligations.md, the two memories, slice-264.toml) plus SL-266's own doc commits (DEC-307 md, notes.md). Solo phases landed on a shared edge interleaved with another slice; a [start,end] range cannot exclude interleaved commits."
disposition = "tolerated"
response = "The boundary registry is one [start,end] range per phase; solo phases landed on a shared edge interleaved with SL-267/SL-264, so no range can exclude those commits. Every foreign path is attributed by commit in F-6's detail; SL-266's own undeclared touches are F-4. Re-recording would not change the cells. Friction captured as an observation."

# Findings are append-only `[[finding]]` tables, added by `review raise` (PHASE-03).
# Empty here at creation — a fresh review is Active, awaiting the raiser (D-C8).
