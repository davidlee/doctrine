# SPDX-License-Identifier: MIT
target = ".doctrine"

[base]
# The MINIMAL projection base (SL-227 FR-007/FR-008, D8). `doctrine install`
# eagerly projects ONLY these backings; every other embedded asset is PUBLISHED
# (reachable on demand via the publication manifest), never eagerly copied. Keys
# MUST match publication.rs's BASE_BACKINGS. `.gitignore` is served by the
# [gitignore] leg below; the two content backings map to `install/<key>` embed
# sources and land write-if-absent into `.doctrine/<key>`.
backings = [".gitignore", "doctrine.toml", "project-orientation.md"]

[dirs]
# Entity roots are NO LONGER eagerly scaffolded here (FR-008): each appears
# lazily on first `<kind> new` via entity.rs `materialise*`. Infrastructure dirs
# (agents, hymns, workflows) are created by their own forward-step install legs.
create = []

[memory]
# The eager orientation-memory seed is retired (D8, ACCEPTED). Its orientation
# content now ships as the projected `project-orientation.md` base backing, so a
# base install seeds NO memory entity. `seed_authoring_memories` early-returns on
# this empty list; `seed_by_key` remains a live caller for explicit re-seeding.
seed_items = []

[gitignore]
# Runtime state is disposable and must never be committed; the convenience
# `phases` symlink and ad-hoc `handover.md` are gitignored so they never enter
# the tracked authored tree (slice-004 D6/D8). Additive — re-install is a no-op.
#
# Memory: `items/` holds committed authored entities (created above, NOT ignored).
# The derived subtrees (index/embeddings/state) are regenerable — ignore the
# contents narrowly; never blanket `.doctrine/memory/*`, which would swallow
# the committed `items/` tree (slice-005 PHASE-06). `shipped/` is the
# binary-materialized global-memory corpus (SL-018) — derived, gitignored.
entries = [
  ".doctrine/state/",
  ".doctrine/slice/*/phases",
  ".doctrine/**/handover.md",
  ".doctrine/slice/*/inquisition.md",
  ".doctrine/memory/index/*",
  ".doctrine/memory/embeddings/*",
  ".doctrine/memory/state/*",
  ".doctrine/memory/shipped/",
  ".doctrine/dispatch/",
  ".doctrine/skills/*",
]

[hymns]
seal = ["preamble/core"]
expose = ["harness/claude","harness/cursor","model/anthropic/claude-sonnet-4","model/deepseek/_default","role/orchestrator","role/worker"]

[root_markers]
markers = [
  ".git",
  # ".jj",
  ".project",
  "Cargo.toml",
  "pyproject.toml",
  "justfile"
]
