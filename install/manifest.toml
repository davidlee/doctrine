# SPDX-License-Identifier: MIT
target = ".doctrine"

[base]
# The MINIMAL projection base. `doctrine install`
# eagerly projects ONLY these backings; every other embedded asset is PUBLISHED
# (reachable on demand via the publication manifest), never eagerly copied. Keys
# MUST match the engine's `BASE_BACKINGS`. `.gitignore` is served by the
# [gitignore] leg below; the two content backings map to `install/<key>` embed
# sources and land write-if-absent into `.doctrine/<key>`.
backings = [".gitignore", "doctrine.toml", "project-orientation.md"]

[dirs]
# Entity roots are NO LONGER eagerly scaffolded here: each appears
# lazily on first `<kind> new` via the entity engine's `materialise*`. Infrastructure dirs
# (agents, hymns, workflows) are created by their own forward-step install legs.
create = []

[memory]
# The eager orientation-memory seed is retired. Its orientation
# content now ships as the projected `project-orientation.md` base backing, so a
# base install seeds NO memory entity. `seed_authoring_memories` early-returns on
# this empty list; `seed_by_key` remains a live caller for explicit re-seeding.
seed_items = []

[framework]
# Ownership (SL-281, ADR-019 "owned"). Canon roots are wholly framework-owned:
# a project install converges each to exactly the shipped set (anything else
# inside is removed and reported); a global install writes and relinks but only
# reports orphans. Everything not under a root and not a doctrine link is
# user-owned — write-if-absent, never overwritten, pruned or ignored.
roots = [".doctrine/agents", ".doctrine/skills", ".doctrine/workflows"]

# The harness registry — install's harness vocabulary. `detect` selects a
# harness by directory, `boot` names its adapter, and `agents`, `skills`, and
# `workflows` are doctrine-owned link directories. Unknown agents are refused.
[harness.claude]
detect = ".claude"
boot = "claude"
agents = ".claude/agents"
skills = ".claude/skills"
workflows = ".claude/workflows"

[harness.codex]
detect = ".codex"
boot = "codex"
skills = ".agents/skills"

[harness.pi]
detect = ".pi"
boot = "pi"
agents = ".pi/agents"
skills = ".agents/skills"

[harness.universal]
detect = ".agents"
skills = ".agents/skills"

[gitignore]
# Runtime state is disposable and must never be committed; the convenience
# `phases` symlink and ad-hoc `handover.md` are gitignored so they never enter
# the tracked authored tree. Rewritten into a managed block on each project
# install, not appended; each framework root's `<root>/*` is added to the block
# from `[framework] roots`, so it is not listed here.
#
# Memory: `items/` holds committed authored entities (created above, NOT ignored).
# The derived subtrees (index/embeddings/state) are regenerable — ignore the
# contents narrowly; never blanket `.doctrine/memory/*`, which would swallow
# the committed `items/` tree. `shipped/` is the
# binary-materialized global-memory corpus — derived, gitignored.
entries = [
  ".doctrine/state/",
  ".doctrine/slice/*/phases",
  ".doctrine/**/handover.md",
  ".doctrine/slice/*/inquisition.md",
  # Slice research (`doctrine slice research`) is runtime-tier evidence; an
  # RFC's `research/` is authored and stays tracked, so this is slice-scoped.
  ".doctrine/slice/*/research/",
  # Install bakes an absolute exec path into codex's hooks — machine-specific.
  # `.codex/config.toml` is the project's own codex config and stays tracked.
  ".codex/hooks.json",
  ".doctrine/memory/index/*",
  ".doctrine/memory/embeddings/*",
  ".doctrine/memory/state/*",
  ".doctrine/memory/shipped/",
  ".doctrine/dispatch/",
  # Observations: authoritative records under
  # `.doctrine/observations/records/` are AUTHORED collection data — committed,
  # diffable, visible in review by default. Only the reserved publication
  # temporaries are ignored: the writer publishes by writing a complete sibling
  # temp then hard-linking it into place, so an interrupted capture can leave a
  # `.tmp.`-prefixed name behind. The prefix is `fsutil::PUBLICATION_TEMP_PREFIX`,
  # crossed against this entry by `observation_publication_temps_are_ignored`.
  # Do NOT broaden this to the tree: that silently makes a client's corpus
  # local-only and forfeits correlation and audit history. A project that wants
  # that tradeoff opts in explicitly — see the `lib:reference/using-doctrine.md` reference.
  ".doctrine/observations/**/.tmp.*",
]

[hymns]
# `stage/design` seals the invariant stage fragment of the managed design
# workflow: the framework body is authoritative and
# any user-provenance twin at that slot is dropped before matching.
seal = ["preamble/core","stage/design"]

[root_markers]
markers = [
  ".git",
  # ".jj",
  ".project",
  "Cargo.toml",
  "pyproject.toml",
  "justfile"
]
