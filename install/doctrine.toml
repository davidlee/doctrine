# doctrine.toml — project conduct config (installed starter).
#
# This is the single canonical home for project-local config (ISS-055). It is
# written once by `doctrine install` and then yours to edit; a re-install never
# clobbers it. Every table below is OPTIONAL — with a key (or the whole file)
# absent, the baked defaults are in force. Uncomment only what you want to steer.
#
# For the exhaustive, annotated catalogue of every knob, see the shipped
# reference `doctrine.toml.example` (published, not projected).

# --- Conduct axis (ADR-009 §2) -------------------------------------------
# Per-lifecycle-state posture; ADVISORY in v1 (printed by `slice status`, never
# enforced). `autonomy` is EXIT semantics — it governs advancing OUT of a state.
#   actor    = self | agent | peer | team   (`self` = the human author)
#   autonomy = auto | draft | gate
# Baked default: actor = self, autonomy = auto for every state, EXCEPT plan and
# reconcile which default to gate (the approved-plan and closure gates).
# [conduct]
# default-actor    = "self"
# default-autonomy = "auto"

# --- Install / marketplace ------------------------------------------------
# Git repo slug for npx-skills / the plugin marketplace.
# [install]
# repo = "davidlee/doctrine"

# --- Dispatch -------------------------------------------------------------
# The trunk delivery ref dispatch advances to / the close gate checks against.
# [dispatch]
# deliver-to = "refs/heads/main"
