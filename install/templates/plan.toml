# Implementation plan for {{ref}} — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
#
# The contract this file encodes is governed by SPEC-031 (Phase plan surface).
schema  = "doctrine.plan.overview"
version = 1
slice   = "{{ref}}"

# Canonical governance links — cite ids, never restate what they say
# (SPEC-031 REQ-473). Authors populate these and the corpus carries them, but
# the plan reader does not model them yet, so nothing consumes them downstream
# (ISS-321; SPEC-031 REQ-467 is the requirement that closes it).
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order (SPEC-031 D2); never sort by id. Ids are PHASE-NN (zero-padded),
# immutable and never reused once authored — edits append, they never renumber,
# so the id sequence goes non-monotonic after a split and that is expected.
# Criterion ids are local to their phase, bare, and equally immutable
# (SPEC-031 REQ-464): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance. The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.
[[phase]]
id        = "PHASE-01"
name      = ""
objective = ""
entrance_criteria = []           # [{ id = "EN-1", text = "…" }]
exit_criteria     = []           # [{ id = "EX-1", text = "…" }]
verification      = []           # VT/VA/VH by mode. Every VT row MUST carry a structured mandate:
                                 #   { id = "VT-1", expects = "…",
                                 #     test_file = "src/foo.rs", keywords = ["fn_name", "struct_name"],
                                 #     patterns = ["^\\s*pub fn"], waived = false }
                                 # test_file = path that must exist, keywords = raw substrings that must
                                 # appear in it. Without a mandate verify-vt reports UNCHECKABLE (inert).
specs             = []           # per-phase narrowing of the plan's specs
requirements      = []
