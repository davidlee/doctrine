# SPDX-License-Identifier: MIT
#
# Publication declaration (SL-223, ADR-019 / PRD-017 / SPEC-026). The single
# authority for what framework-owned material is public, how it is addressed,
# and under what licence. Lives in its OWN embed root (`publication/`) that
# install's projection never walks — publication is not projection (REQ-380).
#
# SL-227 (Option A, DEC-010): grown from the templates-only stub to the FULL
# projection complement — EVERY embedded `install/` asset the minimal-projection
# flip stops landing gets a library address here, so reachability is a *derived*
# invariant (`{embedded_filenames()} - {base backings}` is a subset of the
# published backings), not a hand-curated list. All of `install/` is MIT
# (`install/LICENSE`); every entry is MIT / declared.
#
# `address` is the stable logical contract; `backing` is the physical
# InstallAssets embed key (they may diverge — storage independence, D-F).
# Address category prefixes: templates/ (template), hymns/ (guidance),
# design-prompts/ (guidance), integration/ (integration: agents, workflows,
# mod.just), reference/ (reference).
#
# SL-233 added the first `fixed` entries: the sealed `hymns/stage/design.md` and
# the four `design-prompts/*` process fragments are code-owned with no user
# override, so they are published but not customizable.
#
# PHASE-16 added the store's first `.toml` — an obligation runbook, the
# structured sibling of those fragments. It is `fixed` for a different reason:
# not that a project may not disagree with it, but that the override seam does
# not exist yet (DEC-102 ruling (b); IMP-372 carries the resolution). Declaring
# it customizable would promise an override no code delivers.
#
# SL-244 PHASE-06 added the store's third family — one narrative contract per
# gate condition, under `design-prompts/conditions/`. Each is the prose half of
# a condition whose structural half is a const table in the binary, delivered by
# the stage-entry receipt. They are `fixed` for the runbooks' reason, in the
# runbooks' words: not that a project may not disagree with them, but that the
# override seam does not exist yet (DEC-102 ruling (b); IMP-372 carries the
# resolution). The set is bounded by the generated condition vocabulary and is
# asserted set-equal to it, so a row here naming a retired condition fails.
#
# SL-244 PHASE-08 added the first GENERATED asset in the corpus — the design-run
# stage machine, rendered from the gate tables and pinned to them by a golden.
# Its `fixed` is a THIRD reason, not either of the two above: overriding a
# derived description does not change what is derived, it only makes the
# description wrong. So IMP-372's sweep has two kinds of entry it must not move,
# not one — the sealed rows and this structural one.

